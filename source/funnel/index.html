<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify product funnel\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build:demo\n","group":"配置与启动"},{"path":".gitignore","text":"/data/\n/dist/\n/node_modules/\n*.sqlite\n*.sqlite-wal\n*.sqlite-shm\n.env\n","group":"配置与启动"},{"path":"README.md","text":"# 产品转化分析台\n\n回答「活动有人看，报名却少，到底在哪一步离开」的问题。数据来自校园场务的活动详情和真实报名事务。组织者可比较手机和桌面，并打开事件明细核对图表。\n\n[在线体验](https://fate788.github.io/personal-blog/demos/funnel/) · [博客作品页](https://fate788.github.io/personal-blog/#project/funnel)\n\n![产品转化分析台](docs/preview.webp)\n\n## 快速体验\n\n打开首页会看到「创意设计开放日」的合成数据。30 分钟窗口下，160 位访客查看、99 位开始报名、67 位报名成功。点「查看流失访客」，可以核对尚未开始报名的 61 位访客。再点匿名访客，打开该活动的原始事件，查看相邻步骤有没有上报。\n\n图表可以切换「相对首步」和「相对上一步」两种口径。前者看每一步占所有查看访客的比例，后者看上一阶段有多少人继续。顶部总转化率始终以所有查看访客为分母。点手机端或桌面端，重新计算当前分组的漏斗和访客列表。\n\n到「体验报名」可亲手模拟一次报名。这次操作的三条事件标为本次操作，与样例可分开查询。刷新后可继续，公开体验数据保存在当前浏览器。\n\n## 本地运行\n\n需要 Node.js 22.13 或以上，无需安装额外依赖。\n\n```sh\nnode server.mjs\nnpm test\nnpm run build:demo\n```\n\n打开 [本机工作台](http://127.0.0.1:8805/)。未配置校园数据源时，服务提供独立的样例工作区。构建命令会生成单文件演练，可直接打开 `dist/index.html`。\n\n## 接入校园场务\n\n1. 使用 [校园场务最新源码](https://github.com/fate788/campus-events)，执行 `mvn package` 构建。启动时设置 `CAMPUS_ANALYTICS_KEY`，让详情、报名表和报名成功事件可被分析台读取。使用单独生成且足够长的随机密钥。\n2. 在分析台启动进程中设置相同的 `FUNNEL_CAMPUS_KEY`，把 `FUNNEL_CAMPUS_URL` 设为校园场务的根地址，例如 `http://127.0.0.1:8768/`。校园场务与分析台各自监听本机。\n3. 在校园场务完成一次查看、开始和报名，然后在分析台点「同步校园场务」。读取分页游标和事件 ID 都会保存在 SQLite，相同事件重新同步时不会重复计数。\n\n校园场务端的启动示例（PowerShell）\n\n```powershell\n$env:CAMPUS_ANALYTICS_KEY = Read-Host \"校园同步密钥\" -MaskInput\n$env:CAMPUS_SEED_SAMPLE = \"true\"\njava -jar target/campus-events-0.12.0.jar\n```\n\n分析台端的启动示例（PowerShell）\n\n```powershell\n$env:FUNNEL_CAMPUS_URL = \"http://127.0.0.1:8768/\"\n$env:FUNNEL_CAMPUS_KEY = Read-Host \"输入相同密钥\" -MaskInput\nnode server.mjs --db data/campus-funnel.sqlite\n```\n\nSQLite 按数据源绑定。连接另一校园实例时使用单独的 SQLite 文件。真实分析台监听回环接口，建议在同一主机使用，公开博客仅提供虚构演练。分析事件保留活动、步骤、时间、设备类型和随机匿名访客号，不传账号资料。\n\n## 指标口径\n\n- 每个活动按匿名浏览器访客去重。设备分组归于该访客第一次查看该活动时的设备。事件表按每条事件原始设备检索。\n- 只计符合「查看活动 → 开始报名 → 报名成功」顺序的路径。窗口从该次路径的查看到完成计时，到达窗口上限仍计入。有多条可能路径时，保留该访客达到的最远步骤。\n- 单步转化率的分母是上一步人数，总体转化率的分母是查看访客数。没有访客时显示「—」。\n- 原始事件以事件 ID 去重。出现在窗口外的成功或乱序事件仍能在明细里查看。相同毫秒的校园事件可以用采集序号核对先后。\n\n顺序、访客去重和转化窗口参考了成熟分析产品的做法。[PostHog 漏斗文档](https://posthog.com/docs/product-analytics/funnels) · [Amplitude 漏斗计算](https://amplitude.com/docs/analytics/charts/funnel-analysis/funnel-analysis-how-amplitude-computes)\n\n## 排查与复核\n\n- 报名路径用实色显示走到该步的访客，用斜线显示上一步已到达、当前还未到达的访客。两种口径和图例放在同一张图里，便于核对比例。[Amplitude 图表解读](https://amplitude.com/docs/analytics/charts/funnel-analysis/funnel-analysis-interpret)\n- 「已到达」和「未到达」使用与图表相同的计算结果，点匿名访客可查原始事件。尚在转化窗口内的人后续仍可能完成。[PostHog 漏斗下钻](https://posthog.com/docs/product-analytics/funnels#identify-unsuccessful-users)\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 产品转化分析台 v1.1 源码包\n\n原始发布归档为 `产品转化分析台-v1.1.zip`。压缩包保留其中 17 份文本文件的原始路径与字节，本文件为导出说明。\n\n安装 Node.js 22.13 或以上版本，运行 node server.mjs。校园场务的实际接入步骤见项目 README。\n","group":"项目说明"},{"path":"analytics.mjs","text":"export const steps = [\"view\", \"start\", \"success\"];\nconst devices = [\"mobile\", \"desktop\"];\nconst sources = [\"sample\", \"session\", \"campus\"];\nconst MAX_TIME = 8_640_000_000_000_000;\n\nexport function normalizeEvent(value, source) {\n  if (!value || typeof value !== \"object\" || Array.isArray(value) || !sources.includes(source))\n    throw new TypeError(\"事件格式不正确。\");\n  const { id, visitorId, activityId, activityTitle, step, at, device, sequence } = value;\n  const idPattern = /^[a-z0-9][a-z0-9._:-]{0,95}$/iu;\n  const validId = key => typeof key === \"string\" && idPattern.test(key);\n  if (![id, visitorId, activityId].every(validId) ||\n      typeof activityTitle !== \"string\" || !activityTitle.trim() || activityTitle.trim().length > 140 ||\n      !steps.includes(step) || !devices.includes(device) || !Number.isSafeInteger(at) || at \u003c 0 || at > MAX_TIME ||\n      (sequence!==undefined && (!Number.isSafeInteger(sequence) || sequence\u003c1)))\n    throw new TypeError(\"请检查事件编号、匿名访客、活动、步骤、时间和设备。\");\n  return { id, visitorId, activityId, activityTitle:activityTitle.trim(), step, at, device, source,\n    ...(sequence===undefined ? {} : {sequence}) };\n}\n\nexport function analysisFilters(params) {\n  const activityId = params.get(\"activity\");\n  const window = Number(params.get(\"window\") || 30);\n  const device = params.get(\"device\") || \"all\";\n  if (!Number.isInteger(window) || window \u003c 1 || window > 1440)\n    throw new RangeError(\"转化窗口需为 1 到 1440 分钟。\");\n  if (![\"all\", ...devices].includes(device)) throw new TypeError(\"未知的设备类型。\");\n  return {activityId, window, device};\n}\n\nfunction sameEvent(event) {\n  return event.source + \"\\u0000\" + event.id;\n}\n\nexport function eventsForActivity(events, activityId) {\n  const unique = new Map();\n  for (const event of events) {\n    if (event.activityId === activityId && !unique.has(sameEvent(event))) unique.set(sameEvent(event), event);\n  }\n  return [...unique.values()];\n}\n\nconst ratio = (numerator, denominator) => denominator ? numerator / denominator : null;\n\nfunction visitorProgress(events, minutes) {\n  const duration = minutes * 60_000;\n  // Only a supplied sequence can resolve equal timestamps.\n  const hasSequence=events.every(event=>event.sequence);\n  const compare=(left,right)=>left.at-right.at || (hasSequence ? left.sequence-right.sequence : 0);\n  events.sort((left,right)=>compare(left,right) || steps.indexOf(right.step)-steps.indexOf(left.step) ||\n    left.id.localeCompare(right.id));\n  const entry = events.find(event=>event.step===\"view\");\n  const {visitorId,source} = events[0];\n  const visitor = {visitorId, source, device:entry?.device, enteredAt:entry?.at, lastAt:events.at(-1).at};\n  if (!entry) return {...visitor,max:0};\n  let viewed = null, startEntry = null, started = null, max = 0;\n  for (const event of events) {\n    if (event.step === \"view\") {\n      viewed = event;\n      max = Math.max(1,max);\n    } else if (event.step === \"start\" && viewed && compare(viewed,event)\u003c0 && event.at-viewed.at\u003c=duration) {\n      startEntry = viewed;\n      started = event;\n      max = 2;\n    } else if (event.step === \"success\" && startEntry && compare(started,event)\u003c0 && event.at-startEntry.at\u003c=duration) {\n      return {...visitor,max:3};\n    }\n  }\n  return {...visitor,max};\n}\n\nfunction progressByVisitor(activity, window) {\n  const perVisitor = new Map();\n  for (const event of activity) {\n    const key = event.source+\"\\u0000\"+event.visitorId;\n    if (!perVisitor.has(key)) perVisitor.set(key,[]);\n    perVisitor.get(key).push(event);\n  }\n  return [...perVisitor.values()].map(items=>visitorProgress(items,window));\n}\n\nexport function computeFunnel(events, {activityId, window, device}) {\n  const activity = eventsForActivity(events, activityId);\n  const progress = progressByVisitor(activity,window);\n  const selected = device===\"all\" ? progress : progress.filter(item=>item.device===device);\n  const counts = steps.map((_,index)=>selected.filter(item=>item.max>index).length);\n  const groups = devices.map(name=>{\n    const bucket = progress.filter(item=>item.device===name && item.max>0);\n    const converted = bucket.filter(item=>item.max===steps.length).length;\n    return {device:name,entered:bucket.length,converted,rate:ratio(converted,bucket.length)};\n  });\n  const listed = device===\"all\" ? activity : activity.filter(event=>event.device===device);\n  return {\n    activityId, window, device, groups, entered:counts[0], converted:counts.at(-1),\n    rate:ratio(counts.at(-1),counts[0]), eventCount:listed.length,\n    sampleEvents:listed.filter(event=>event.source===\"sample\").length,\n    sessionEvents:listed.filter(event=>event.source===\"session\").length,\n    steps:steps.map((step,index)=>({\n      step,count:counts[index],loss:index ? counts[index-1]-counts[index] : 0,\n      relativeRate:ratio(counts[index],counts[index-1] ?? counts[0]),\n      overallRate:ratio(counts[index],counts[0]),\n    })),\n  };\n}\n\nexport function listCohort(all, params) {\n  const {activityId,window,device}=analysisFilters(params);\n  const step=params.get(\"step\");\n  const outcome=params.get(\"outcome\");\n  const limit=Number(params.get(\"limit\") ?? 100);\n  const target=steps.indexOf(step)+1;\n  if (!target || ![\"lost\",\"reached\"].includes(outcome) ||\n      !Number.isInteger(limit) || limit\u003c1 || limit>500) throw new TypeError(\"未知的访客筛选条件。\");\n  const progress=progressByVisitor(eventsForActivity(all,activityId),window);\n  const matching=progress.filter(visitor=>\n    visitor.max>0 && (device===\"all\" || visitor.device===device) &&\n    (outcome===\"reached\" ? visitor.max>=target : visitor.max===target-1)\n  );\n  matching.sort((left,right)=>right.lastAt-left.lastAt ||\n    left.visitorId.localeCompare(right.visitorId) || left.source.localeCompare(right.source));\n  return {\n    activityId,window,device,step,outcome,total:matching.length,\n    visitors:matching.slice(0,limit).map(({max,...visitor})=>({...visitor,reached:steps[max-1]})),\n  };\n}\n\nexport function listEvents(all, params) {\n  const {activityId,device}=analysisFilters(params);\n  const step=params.get(\"step\") || \"all\", source=params.get(\"source\") || \"all\";\n  const limit=Number(params.get(\"limit\") || 60);\n  const visitorId=params.get(\"visitor\");\n  if (![\"all\",...steps].includes(step) || ![\"all\",...sources].includes(source) ||\n      !Number.isInteger(limit) || limit\u003c1 || limit>500) throw new TypeError(\"未知的事件筛选条件。\");\n  const matched=eventsForActivity(all,activityId).filter(event=>\n    (device===\"all\" || event.device===device) && (step===\"all\" || event.step===step) &&\n    (source===\"all\" || event.source===source) && (!visitorId || event.visitorId===visitorId));\n  matched.sort((left,right)=>right.at-left.at || left.id.localeCompare(right.id));\n  return {events:matched.slice(0,limit),total:matched.length};\n}\n","group":"后端"},{"path":"fixtures.mjs","text":"import {normalizeEvent} from \"./analytics.mjs\";\n\nexport const demoActivities = [\n  {id:\"design-open-day\",title:\"创意设计开放日\",description:\"参观设计工作室，参加一次快题工作坊，与校园创作小组交流。\",date:\"12 月 12 日 · 周六\"},\n  {id:\"community-lab\",title:\"社团创作工作坊\",description:\"带一份未完成的点子，在两小时内和其他同学一起做出原型。\",date:\"12 月 16 日 · 周三\"},\n];\n\nconst layouts = [\n  {mobile:[96,54,31], desktop:[64,45,36]},\n  {mobile:[52,41,30], desktop:[36,28,19]},\n];\n\nexport function demoEvents(now) {\n  const baseline = Math.floor(now / 86_400_000) * 86_400_000 - 2 * 86_400_000;\n  return demoActivities.flatMap((activity, index)=>Object.entries(layouts[index]).flatMap(([device,counts])=>{\n    const [viewers,starts,completed] = counts;\n    return Array.from({length:viewers},(_,i)=>{\n      const visitorId = `sample-${activity.id}-${device}-${i+1}`;\n      const viewed = baseline + i * 210_000 + (i % 3) * 80_000;\n      const flow = [[\"view\",viewed]];\n      if (i \u003c starts) flow.push([\"start\",viewed + (2+i%8) * 60_000]);\n      if (i \u003c completed) flow.push([\"success\",viewed + (3 + i%8 + i%15) * 60_000]);\n      if (i % 8 === 0) flow.push([\"view\", viewed + 10_000]);\n      return flow.map(([step,at],ordinal)=>normalizeEvent({\n        id:visitorId+\"-\"+ordinal,visitorId,activityId:activity.id,activityTitle:activity.title,device,step,at,\n      },\"sample\"));\n    }).flat();\n  }));\n}\n","group":"配置与启动"},{"path":"package.json","text":"{\n  \"name\":\"product-funnel\",\n  \"version\":\"1.1.0\",\n  \"private\":true,\n  \"type\":\"module\",\n  \"engines\":{\"node\":\">=22.13\"},\n  \"scripts\":{\n    \"start\":\"node server.mjs\",\n    \"test\":\"node --test tests/*.test.mjs\",\n    \"build:demo\":\"node portable/build.mjs\"\n  }\n}\n","group":"配置与启动"},{"path":"portable/build.mjs","text":"import {mkdir,readFile,writeFile} from \"node:fs/promises\";\nimport {dirname,resolve} from \"node:path\";\n\nconst output=resolve(process.argv[2] || \"dist/index.html\");\nconst read=path=>readFile(new URL(path,import.meta.url),\"utf8\");\nconst asModule=code=>\"data:text/javascript;base64,\"+Buffer.from(code,\"utf8\").toString(\"base64\");\nfunction replaceModule(code,path,module){\n  const pattern=code.includes(`\"${path}\"`) ? `\"${path}\"` : `'${path}'`;\n  if(!code.includes(pattern))throw new Error(\"Missing module \"+path);\n  return code.replaceAll(pattern,JSON.stringify(module));\n}\nconst [analytics,fixtures,api,transport,app,css,html]=await Promise.all([\n  read(\"../analytics.mjs\"),read(\"../fixtures.mjs\"),read(\"../public-api.mjs\"),read(\"transport.mjs\"),\n  read(\"../static/app.mjs\"),read(\"../static/styles.css\"),read(\"../static/index.html\"),\n]);\nconst analyticsModule=asModule(analytics);\nconst fixturesModule=asModule(replaceModule(fixtures,\"./analytics.mjs\",analyticsModule));\nconst apiModule=asModule(replaceModule(replaceModule(api,\"./analytics.mjs\",analyticsModule),\"./fixtures.mjs\",fixturesModule));\nconst offline=asModule(replaceModule(transport,\"../public-api.mjs\",apiModule));\nconst module=asModule(replaceModule(app,\"./transport.mjs\",offline));\nconst cssTag=/\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css(?:\\?[^\"']*)?[\"'][^>]*>/iu;\nconst appTag=/\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs(?:\\?[^\"']*)?[\"'][^>]*>\\s*\u003c\\/script>/iu;\nif(!cssTag.test(html)||!appTag.test(html))throw new Error(\"Missing frontend tags.\");\nconst policy=\"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\nconst portable=html.replace(\"\u003chead>\",`\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(cssTag,()=>`\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(appTag,()=>`\u003cscript type=\"module\" src=\"${module}\">\u003c/script>`);\nawait mkdir(dirname(output),{recursive:true});\nawait writeFile(output,portable.replace(/\\r\\n/gu,\"\\n\"),\"utf8\");\nconsole.log(\"Browser demo written to \"+output);\n","group":"配置与启动"},{"path":"portable/transport.mjs","text":"import {createDemo,handleDemo} from \"../public-api.mjs\";\n\nconst database=new Promise(resolve=>{\n  try{\n    const opening=indexedDB.open(\"product-funnel-demo\",1);\n    opening.onupgradeneeded=()=>opening.result.createObjectStore(\"data\");\n    opening.onsuccess=()=>resolve(opening.result);\n    opening.onerror=()=>resolve(null);\n    opening.onblocked=()=>resolve(null);\n  }catch{resolve(null);}\n});\nconst key=\"visit\";\nlet memory;\n\nfunction newDemo() {\n  const bytes=crypto.getRandomValues(new Uint8Array(12));\n  const visitorId=\"visitor-\"+[...bytes].map(byte=>byte.toString(16).padStart(2,\"0\")).join(\"\");\n  return createDemo(visitorId,Date.now());\n}\nasync function transact(operation){\n  const db=await database;\n  if(!db){\n    memory ||= newDemo();\n    return operation(memory);\n  }\n  return new Promise((resolve,reject)=>{\n    const tx=db.transaction(\"data\",\"readwrite\");\n    const store=tx.objectStore(\"data\");\n    const reading=store.get(key);\n    let result,failure;\n    reading.onsuccess=()=>{\n      const state=reading.result || newDemo();\n      try{result=operation(state);store.put(state,key);}\n      catch(error){failure=error;tx.abort();}\n    };\n    tx.oncomplete=()=>resolve(result);\n    tx.onabort=()=>reject(failure || tx.error || new Error(\"演练记录保存失败。\"));\n  });\n}\n\nexport default async function request(path,{method=\"GET\",body={}}={}){\n  const url=new URL(path,\"https://demo.local\");\n  let result;\n  try{result=await transact(state=>handleDemo(state,{url,method,body,now:Date.now()}));}\n  catch(error){\n    if(error instanceof TypeError || error instanceof RangeError)\n      throw Object.assign(new Error(error.message),{status:400});\n    throw error;\n  }\n  if(result.status>=400)throw Object.assign(new Error(result.body.error),{status:result.status});\n  return result.body;\n}\n","group":"配置与启动"},{"path":"public-api.mjs","text":"import {analysisFilters,computeFunnel,listCohort,listEvents,normalizeEvent,steps} from \"./analytics.mjs\";\nimport {demoActivities,demoEvents} from \"./fixtures.mjs\";\n\nconst respond=(body,status=200)=>({status,body});\nconst error=(status,message)=>respond({error:message},status);\nexport const createDemo = (visitorId,now)=>({visitorId,anchor:now,events:[]});\n\nexport function handleDemo(state, {url,method,body,now}) {\n  const {pathname:path,searchParams:params}=url;\n  const isView = method===\"GET\";\n  const id = isView ? params.get(\"activity\") || demoActivities[0].id : body.activityId;\n  const activity = demoActivities.find(item=>item.id===id);\n  if (isView && path===\"/api/meta\")return respond({mode:\"demo\",activities:demoActivities,now});\n  if (!activity)return error(404,\"没有找到该活动。\");\n  const visit=state.events.filter(event=>event.activityId===id);\n  const current=visit.at(-1);\n  const session={visitorId:state.visitorId,step:current?.step || null};\n  if (isView && path===\"/api/demo/session\")return respond(session);\n  if (method===\"POST\" && path===\"/api/demo/events\") {\n    const next=steps.indexOf(body.step);\n    if (next\u003c0 || ![\"desktop\",\"mobile\"].includes(body.device))return error(422,\"请检查步骤和设备类型。\");\n    if (next\u003cvisit.length)return respond(session);\n    if (next!==visit.length)return error(409,\"请先完成上一步。\");\n    const event=normalizeEvent({\n      id:`${state.visitorId}:${id}:${body.step}`,visitorId:state.visitorId,activityId:id,\n      activityTitle:activity.title,step:body.step,at:Math.max(now,(current?.at ?? -1)+1),\n      device:visit[0]?.device || body.device,\n    },\"session\");\n    state.events.push(event);\n    return respond({visitorId:state.visitorId,step:event.step},201);\n  }\n  if (isView && [\"/api/funnel\",\"/api/events\",\"/api/cohort\"].includes(path)){\n    const all=[...demoEvents(state.anchor),...state.events];\n    params.set(\"activity\",id);\n    if (path===\"/api/funnel\") return respond(computeFunnel(all,analysisFilters(params)));\n    if (path===\"/api/cohort\") return respond(listCohort(all,params));\n    return respond(listEvents(all,params));\n  }\n  return error(404,\"没有找到该操作。\");\n}\n","group":"配置与启动"},{"path":"server.mjs","text":"import {createServer} from \"node:http\";\nimport {randomUUID} from \"node:crypto\";\nimport {DatabaseSync} from \"node:sqlite\";\nimport {mkdir,readFile} from \"node:fs/promises\";\nimport {dirname,resolve} from \"node:path\";\nimport {fileURLToPath} from \"node:url\";\nimport {parseArgs} from \"node:util\";\nimport {analysisFilters,computeFunnel,listCohort,listEvents,normalizeEvent} from \"./analytics.mjs\";\nimport {createDemo,handleDemo} from \"./public-api.mjs\";\n\nconst {values:options}=parseArgs({options:{\n  port:{type:\"string\",default:\"8805\"}, db:{type:\"string\",default:\"data/funnel.sqlite\"},\n}});\nconst port=Number(options.port);\nif (!/^\\d+$/u.test(options.port) || port > 65535) throw new RangeError(\"端口无效。\");\nconst campusKey=process.env.FUNNEL_CAMPUS_KEY || \"\";\nconst configuredUrl=process.env.FUNNEL_CAMPUS_URL || \"\";\nconst campus=configuredUrl ? new URL(configuredUrl) : null;\nif (Boolean(campus)!==Boolean(campusKey) || campus && (\n    ![\"http:\",\"https:\"].includes(campus.protocol) || campus.username || campus.password ||\n    campus.pathname!==\"/\" || campus.search || campus.hash ||\n    (campus.protocol===\"http:\" && ![\"localhost\",\"127.0.0.1\",\"[::1]\"].includes(campus.hostname)))) {\n  throw new TypeError(\"请同时设置 FUNNEL_CAMPUS_URL 和 FUNNEL_CAMPUS_KEY。地址使用 HTTPS，或本机的 HTTP 源地址。\");\n}\nconst root=fileURLToPath(new URL(\"./static/\",import.meta.url));\nconst dbPath=options.db===\":memory:\" ? \":memory:\" : resolve(options.db);\nif (dbPath!==\":memory:\")await mkdir(dirname(dbPath),{recursive:true});\nconst db=new DatabaseSync(dbPath);\ndb.exec(`\n  PRAGMA journal_mode=WAL;\n  PRAGMA busy_timeout=4000;\n  CREATE TABLE IF NOT EXISTS campus_events (\n    id TEXT PRIMARY KEY, visitor_id TEXT NOT NULL, activity_id TEXT NOT NULL,\n    activity_title TEXT NOT NULL, step TEXT NOT NULL, at INTEGER NOT NULL,\n    device TEXT NOT NULL, sequence INTEGER\n  );\n  CREATE INDEX IF NOT EXISTS campus_events_activity ON campus_events(activity_id, at DESC);\n  CREATE TABLE IF NOT EXISTS campus_feed (\n    origin TEXT PRIMARY KEY, cursor INTEGER NOT NULL, synced_at INTEGER\n  );\n  CREATE TABLE IF NOT EXISTS demo_sessions (\n    id TEXT PRIMARY KEY, state TEXT NOT NULL, touched_at INTEGER NOT NULL\n  );\n`);\nconst statements={\n  list:db.prepare(`SELECT id, visitor_id AS visitorId, activity_id AS activityId, activity_title AS activityTitle,\n    step, at, device, sequence, 'campus' AS source FROM campus_events WHERE activity_id=? ORDER BY at,id`),\n  activity:db.prepare(\"SELECT activity_id AS id,activity_title AS title FROM campus_events GROUP BY activity_id ORDER BY MAX(at) DESC\"),\n  insert:db.prepare(\"INSERT INTO campus_events(id,visitor_id,activity_id,activity_title,step,at,device,sequence) VALUES(?,?,?,?,?,?,?,?) ON CONFLICT(id) DO NOTHING\"),\n  feed:db.prepare(\"SELECT * FROM campus_feed WHERE origin=?\"),\n  bound:db.prepare(\"SELECT origin FROM campus_feed LIMIT 1\"),\n  saveFeed:db.prepare(`INSERT INTO campus_feed(origin,cursor,synced_at) VALUES(?,?,?)\n    ON CONFLICT(origin) DO UPDATE SET cursor=excluded.cursor,synced_at=excluded.synced_at`),\n  getDemo:db.prepare(\"SELECT state FROM demo_sessions WHERE id=?\"),\n  saveDemo:db.prepare(`INSERT INTO demo_sessions(id,state,touched_at) VALUES(?,?,?)\n    ON CONFLICT(id) DO UPDATE SET state=excluded.state,touched_at=excluded.touched_at`),\n  cleanDemo:db.prepare(\"DELETE FROM demo_sessions WHERE touched_at\u003c?\"),\n};\nconst existingOrigin=statements.bound.get()?.origin;\nif (campus && existingOrigin && campus.origin!==existingOrigin)\n  throw new Error(\"该数据库已绑定另一校园实例，请为新数据源指定不同的数据库文件。\");\n\nconst campusOrigin=campus?.origin || existingOrigin;\nconst liveMode=Boolean(campusOrigin);\nconst demoHeader=\"funnel_preview\";\nconst staticFiles=new Map([\n  [\"/\",[\"index.html\",\"text/html; charset=utf-8\"]],\n  [\"/index.html\",[\"index.html\",\"text/html; charset=utf-8\"]],\n  [\"/styles.css\",[\"styles.css\",\"text/css; charset=utf-8\"]],\n  [\"/app.mjs\",[\"app.mjs\",\"text/javascript; charset=utf-8\"]],\n  [\"/transport.mjs\",[\"transport.mjs\",\"text/javascript; charset=utf-8\"]],\n]);\nfunction activities(){\n  const latest=new Map();\n  for(const {id,title} of statements.activity.iterate())if(!latest.has(id))latest.set(id,{id,title});\n  return [...latest.values()];\n}\n\nfunction transaction(run) {\n  db.exec(\"BEGIN IMMEDIATE\");\n  try{\n    const result=run();\n    db.exec(\"COMMIT\");\n    return result;\n  }catch(error){\n    db.exec(\"ROLLBACK\");\n    throw error;\n  }\n}\n\nasync function syncCampus(){\n  let imported=0,received=0;\n  let cursor=statements.feed.get(campus.origin)?.cursor || 0;\n  for(let pageNumber=0;pageNumber\u003c40;pageNumber++){\n    const endpoint=new URL(\"/api/analytics/events\",campus);\n    endpoint.search=new URLSearchParams({after:cursor,limit:200});\n    const response=await fetch(endpoint,{headers:{Authorization:\"Bearer \"+campusKey,Accept:\"application/json\"},\n      redirect:\"error\",signal:AbortSignal.timeout(6000)});\n    if(!response.ok)throw new Error(\"校园端返回 HTTP \"+response.status+\"。请检查连接和同步密钥。\");\n    const data=await response.json();\n    if(!Array.isArray(data.events) || data.events.length>200 || typeof data.hasMore!==\"boolean\" ||\n      !Number.isSafeInteger(data.nextCursor) || data.nextCursor\u003ccursor ||\n      (Boolean(data.events.length)!==(data.nextCursor>cursor)) || data.hasMore&&!data.events.length)\n      throw new Error(\"校园端事件页或游标无效。\");\n    const events=data.events.map(event=>normalizeEvent(event,\"campus\"));\n    received+=events.length;\n    const syncedAt=Date.now();\n    imported+=transaction(()=>{\n      const liveCursor=statements.feed.get(campus.origin)?.cursor ?? 0;\n      if(liveCursor!==cursor)throw new Error(\"同步进度已被更新，请重试。\");\n      let written=0;\n      for(const e of events)\n        written+=statements.insert.run(e.id,e.visitorId,e.activityId,e.activityTitle,e.step,e.at,e.device,e.sequence ?? null).changes;\n      statements.saveFeed.run(campus.origin,data.nextCursor,syncedAt);\n      return written;\n    });\n    cursor=data.nextCursor;\n    if(!data.hasMore)return {imported,received,lastSyncAt:syncedAt,hasMore:false};\n  }\n  return {imported,received,lastSyncAt:statements.feed.get(campus.origin).synced_at,hasMore:true};\n}\n\nlet syncPromise=null;\nfunction runSync(){\n  if(!syncPromise)syncPromise=syncCampus().finally(()=>{syncPromise=null;});\n  return syncPromise;\n}\n\nfunction write(res,status,type,payload,headers={}){\n  res.writeHead(status,{\"Content-Type\":type,\"Cache-Control\":\"no-store\",\"X-Content-Type-Options\":\"nosniff\",...headers});\n  res.end(payload);\n}\nfunction json(res,status,payload,headers={}){\n  write(res,status,\"application/json; charset=utf-8\",JSON.stringify(payload),headers);\n}\nfunction originAllowed(req) {\n  const host=req.headers.host || \"\";\n  if (!/^(?:localhost|127\\.0\\.0\\.1)(?::\\d{1,5})?$/iu.test(host)) return false;\n  if(req.headers[\"sec-fetch-site\"]===\"cross-site\")return false;\n  return !req.headers.origin || req.headers.origin===\"http://\"+host;\n}\n\nasync function readBody(req){\n  if(req.headers[\"x-workspace-request\"]!==\"1\" ||\n     req.headers[\"content-type\"]?.split(\";\")[0]!==\"application/json\")throw new TypeError(\"请求格式不支持。\");\n  const chunks=[];\n  let size=0;\n  for await(const chunk of req){\n    size+=chunk.length;\n    if(size>4096)throw new RangeError(\"请求内容过大。\");\n    chunks.push(chunk);\n  }\n  const content=JSON.parse(Buffer.concat(chunks).toString(\"utf8\"));\n  if(!content || typeof content!==\"object\" || Array.isArray(content))throw new TypeError(\"请求格式不支持。\");\n  return content;\n}\n\nfunction demo(req,res,url,method,body){\n  const now=Date.now();\n  const cookieId=(req.headers.cookie || \"\").match(/(?:^|;\\s*)funnel_preview=([a-f0-9-]{36})(?:;|$)/u)?.[1];\n  const cached=cookieId && statements.getDemo.get(cookieId);\n  const visitorId=cached ? cookieId : randomUUID();\n  const state=cached ? JSON.parse(cached.state) : createDemo(visitorId,now);\n  const result=handleDemo(state,{url,method,body,now});\n  statements.saveDemo.run(visitorId,JSON.stringify(state),now);\n  if(!cached)statements.cleanDemo.run(now-30*86_400_000);\n  json(res,result.status,result.body,cached?{}:{\n    \"Set-Cookie\":`${demoHeader}=${visitorId}; Path=/; HttpOnly; SameSite=Strict; Max-Age=2592000`,\n  });\n}\n\nasync function live(res,url,method){\n  const now=Date.now();\n  const items=activities();\n  const lastSyncAt=statements.feed.get(campusOrigin)?.synced_at || null;\n  if(method===\"GET\" && url.pathname===\"/api/meta\"){\n    json(res,200,{mode:\"live\",activities:items,now,campusUrl:campusOrigin+\"/\",syncConfigured:Boolean(campus),lastSyncAt});\n    return;\n  }\n  if(method===\"POST\" && url.pathname===\"/api/sync\" && campus){\n    try { json(res,200,await runSync()); }\n    catch(error) {\n      const hint=error?.message?.startsWith(\"校园端\")?error.message:\"未能同步校园事件，请检查校园服务状态。\";\n      json(res,502,{error:hint});\n    }\n    return;\n  }\n  if(method===\"GET\" && [\"/api/funnel\",\"/api/events\",\"/api/cohort\"].includes(url.pathname)){\n    const activityId=url.searchParams.get(\"activity\") || items[0]?.id || \"\";\n    if(activityId && !items.some(item=>item.id===activityId)){json(res,404,{error:\"没有找到该活动。\"});return;}\n    url.searchParams.set(\"activity\",activityId);\n    const events=activityId ? statements.list.all(activityId) : [];\n    const params=url.searchParams;\n    if(url.pathname===\"/api/funnel\"){json(res,200,computeFunnel(events,analysisFilters(params)));return;}\n    if(url.pathname===\"/api/cohort\"){json(res,200,listCohort(events,params));return;}\n    json(res,200,listEvents(events,params));return;\n  }\n  json(res,404,{error:\"没有找到该操作。\"});\n}\n\nconst server=createServer({headersTimeout:8000,requestTimeout:12000},async (req,res)=>{\n  if(!originAllowed(req)){json(res,403,{error:\"只接受当前工作台发出的同源请求。\"});return;}\n  try{\n    const url=new URL(req.url,\"http://localhost\");\n    const method=req.method;\n    if(url.pathname.startsWith(\"/api/\")){\n      if(method!==\"GET\" && method!==\"POST\"){json(res,405,{error:\"不支持的请求方法。\"});return;}\n      const body=method===\"POST\"?await readBody(req):{};\n      if(liveMode)await live(res,url,method);\n      else demo(req,res,url,method,body);\n      return;\n    }\n    const item=staticFiles.get(url.pathname);\n    if(method!==\"GET\" || !item){json(res,404,{error:\"页面不存在。\"});return;}\n    write(res,200,item[1],await readFile(resolve(root,item[0])),{\n      \"Content-Security-Policy\":\"default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'\",\n    });\n  }catch(error){\n    if(error instanceof TypeError || error instanceof RangeError || error instanceof SyntaxError)\n      json(res,400,{error:error instanceof SyntaxError?\"JSON 格式无效。\":error.message});\n    else {\n      console.error(error);\n      json(res,500,{error:\"工作台暂时不可用。\"});\n    }\n  }\n});\nserver.listen(port,\"127.0.0.1\",()=>console.log(`http://127.0.0.1:${server.address().port}/`));\n","group":"后端"},{"path":"start-funnel.cmd","text":"@echo off\nsetlocal\ncd /d \"%~dp0\"\nwhere node.exe >nul 2>&1\nif errorlevel 1 (\n  echo Node.js 22.13 or newer is required.\n  pause\n  exit /b 1\n)\nnode server.mjs\nif errorlevel 1 pause\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import request from \"./transport.mjs\";\n\nconst main = document.querySelector(\"#main\");\nconst nav = document.querySelector(\"#navigation\");\nconst sampleActivity = \"design-open-day\";\nconst pages = {\n  funnel: [\"转化分析\", \"chart\"],\n  events: [\"事件明细\", \"list\"],\n  try: [\"体验报名\", \"ticket\"],\n};\nconst stages = {\n  view: \"查看活动\",\n  start: \"开始报名\",\n  success: \"报名成功\",\n};\nconst explanations = {\n  view:[\"已查看活动的访客\",\"打开过当前活动详情\"],\n  start:[\"已开始报名的访客\",\"从活动详情进入报名流程\"],\n  success:[\"已完成报名的访客\",\"在当前窗口内完成报名\"],\n};\nconst preceding = {start:\"查看活动\",success:\"开始报名\"};\nconst deviceNames = {all:\"全部设备\",mobile:\"手机端\",desktop:\"桌面端\"};\nconst sourceNames = {all:\"全部来源\",sample:\"合成样例\",session:\"本次操作\",campus:\"校园场务\"};\nconst windowOptions = [[\"10\",\"10 分钟\"],[\"30\",\"30 分钟\"],[\"60\",\"1 小时\"],[\"1440\",\"24 小时\"]];\nconst icons = {\n  chart:\"M3 20h18M5 17V9m5 8V5m5 12v-5m5 5V3\",\n  list:\"M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01\",\n  ticket:\"M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4zM14 6v12\",\n  arrow:\"M4 12h15m-6-6l6 6-6 6\",\n  out:\"M13 4h7v7m0-7l-9 9m7-1v7H5V6h7\",\n  mobile:\"M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 15h2\",\n  desktop:\"M4 4h16v12H4zm4 17h8m-4-5v5\",\n  clock:\"M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zm-9-5v5l3 2\",\n  check:\"M4 12l5 5L20 6\",\n  pulse:\"M3 12h4l3-6 4 12 3-6h4\",\n  sync:\"M20 10a8 8 0 0 0-14-5l-2 2m0-4v4h4m-4 7a8 8 0 0 0 14 5l2-2m0 4v-4h-4\",\n  close:\"M6 6l12 12M18 6L6 18\",\n};\nlet version = 0;\nlet meta = null;\nlet refreshing = false;\nlet filterFocus = \"\";\nlet focusMain = false;\nlet cohortSequence = 0;\nconst drawer = document.querySelector(\"#cohort-dialog\");\nconst number = new Intl.NumberFormat(\"zh-CN\");\nconst percentage = new Intl.NumberFormat(\"zh-CN\",{style:\"percent\", maximumFractionDigits:1});\nconst time = new Intl.DateTimeFormat(\"zh-CN\",{\n  month:\"2-digit\",day:\"2-digit\",hour:\"2-digit\",minute:\"2-digit\",second:\"2-digit\",hourCycle:\"h23\",\n});\n\nfunction esc(value) {\n  return String(value??\"\").replace(/[&\u003c>'\"]/g,char=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",\"'\":\"&#39;\",'\"':\"&quot;\"})[char]);\n}\nfunction icon(name) {\n  return '\u003cspan class=\"icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"'+icons[name]+'\"/>\u003c/svg>\u003c/span>';\n}\nfunction count(value) {\n  return Number.isFinite(value)?number.format(value):\"—\";\n}\nfunction rate(value) {\n  return Number.isFinite(value)?percentage.format(value):\"—\";\n}\nfunction width(value) {\n  return `${Math.min(100,Math.max(0,(value||0)*100)).toFixed(2)}%`;\n}\nfunction displayTime(value) {\n  const stamp = new Date(value);\n  return value&&Number.isFinite(stamp.getTime())?time.format(stamp):\"—\";\n}\nfunction link(label,href,kind=\"text\",symbol=\"arrow\") {\n  return `\u003ca class=\"btn ${kind}\" href=\"${esc(href)}\">${esc(label)}${symbol?icon(symbol):\"\"}\u003c/a>`;\n}\nfunction href(page,filters,changes={}) {\n  const current = {activity:filters.activity,window:filters.window,device:filters.device,\n    ...(filters.chart===\"relative\"?{chart:\"relative\"}:{}),\n    ...(page===\"events\"?{step:\"all\",source:\"all\"}:{}),...changes};\n  if(page===\"events\" && filters.returnDevice && current.returnDevice===undefined)current.returnDevice=filters.returnDevice;\n  const params = new URLSearchParams(Object.entries(current).filter(([,value])=>value));\n  return `#${page}${params.size?\"?\"+params:\"\"}`;\n}\nfunction getRoute() {\n  const [page,query] = location.hash.slice(1).split(\"?\",2);\n  const params = new URLSearchParams(query);\n  const choose = (name,options,backup)=>options.includes(params.get(name))?params.get(name):backup;\n  const data = meta?.activities||[];\n  return {\n    page: Object.hasOwn(pages,page)?page:\"funnel\",\n    activity: choose(\"activity\",data.map(item=>item.id),data.some(item=>item.id===sampleActivity)?sampleActivity:data[0]?.id),\n    window:choose(\"window\",windowOptions.map(([value])=>value),\"30\"),\n    device:choose(\"device\",Object.keys(deviceNames),\"all\"),\n    step:choose(\"step\",[\"all\",...Object.keys(stages)],\"all\"),\n    source:choose(\"source\",Object.keys(sourceNames),\"all\"),\n    chart:choose(\"chart\",[\"overall\",\"relative\"],\"overall\"),\n    returnDevice:choose(\"returnDevice\",Object.keys(deviceNames),\"\"),\n    visitor:(params.get(\"visitor\")||\"\").slice(0,128),\n  };\n}\nfunction navigate(target) {\n  if(location.hash===target)void render();\n  else location.hash=target;\n}\nfunction apiQuery(route, extras={}) {\n  return new URLSearchParams({activity:route.activity,device:route.device,...extras}).toString();\n}\nfunction header(title, subtitle, actions=\"\",top=\"\") {\n  return `\u003cheader class=\"page-heading\">\u003cdiv>${top?`\u003cp class=\"eyebrow\">${esc(top)}\u003c/p>`:\"\"}\u003ch1>${esc(title)}\u003c/h1>\u003cp>${esc(subtitle)}\u003c/p>\u003c/div>\n    \u003cdiv class=\"actions\">${actions}\u003c/div>\u003c/header>`;\n}\nfunction setFrame(route) {\n  nav.innerHTML = Object.entries(pages).filter(([id])=>id!==\"try\"||meta.mode===\"demo\")\n    .map(([id,[label,symbol]])=>`\u003ca class=\"nav-link\" href=\"${esc(href(id,route))}\" ${id===route.page?'aria-current=\"page\"':\"\"}>${icon(symbol)}${label}\u003c/a>`).join(\"\");\n  document.querySelector(\"#breadcrumb\").textContent=pages[route.page][0];\n  document.querySelector(\"#side-mode\").textContent=meta.mode===\"demo\"?\"浏览器演示\":\"校园场务数据\";\n  document.querySelector(\"#top-status\").textContent=meta.mode===\"demo\"?\"演示工作区\":\"校园场务连接\";\n}\nfunction actionLinks(route) {\n  if(meta.mode===\"demo\")return link(\"亲自试一次报名\",href(\"try\",route),\"primary\",\"ticket\");\n  const campus = safeExternal(meta.campusUrl);\n  return `${meta.syncConfigured?`\u003cbutton class=\"btn\" type=\"button\" data-sync>${icon(\"sync\")}同步校园场务\u003c/button>`:\"\"}\n    ${campus?`\u003ca class=\"btn primary\" href=\"${esc(campus)}\" target=\"_blank\" rel=\"noopener\">打开校园场务${icon(\"out\")}\u003c/a>`:\"\"}`;\n}\nfunction safeExternal(value) {\n  try {\n    const url = new URL(value);\n    return /^(https?:)$/u.test(url.protocol) && !url.username && !url.password ? url.href : \"\";\n  } catch {\n    return \"\";\n  }\n}\nfunction picker(name,label,current,choices,wide=false) {\n  const chosen = choices.find(([value])=>value===current)?.[1] || \"—\";\n  const items = choices.map(([value,title])=>\n    `\u003cbutton type=\"button\" data-choice=\"${esc(value)}\" aria-current=\"${value===current}\">${esc(title)}\u003cspan class=\"pick-mark\" aria-hidden=\"true\">✓\u003c/span>\u003c/button>`).join(\"\");\n  return `\u003cdiv class=\"filter-field ${wide?\"filter-wide\":\"\"}\">\u003cspan>${esc(label)}\u003c/span>\n    \u003cdetails class=\"picker\" data-filter=\"${name}\">\u003csummary aria-label=\"${esc(label+\" \"+chosen)}\">\u003cspan>${esc(chosen)}\u003c/span>\u003c/summary>\n      \u003cdiv class=\"picker-list\" role=\"group\" aria-label=\"${esc(label)}选项\">${items}\u003c/div>\u003c/details>\u003c/div>`;\n}\nfunction filters(route) {\n  const common = picker(\"activity\",\"活动\",route.activity,meta.activities.map(item=>[item.id,item.title]),true);\n  const device = picker(\"device\",\"设备\",route.device,Object.entries(deviceNames));\n  const fresh = meta.mode===\"live\"&&meta.lastSyncAt?`最近同步 ${displayTime(meta.lastSyncAt)}`:\"\";\n  const controls = route.page===\"events\"?\n    `${picker(\"step\",\"事件\",route.step,[[\"all\",\"全部事件\"],...Object.entries(stages)])}\n     ${device}${picker(\"source\",\"来源\",route.source,Object.entries(sourceNames).filter(([s])=>s===\"all\"||(meta.mode===\"demo\"?s!==\"campus\":s===\"campus\")))}\n     ${route.visitor?`\u003cspan class=\"filter-meta\">访客 ${esc(route.visitor)}　${link(\"清除\",href(\"events\",route,{step:route.step,source:route.source}),\"text\",\"\")}\u003c/span>`:\"\"}`:\n    `${picker(\"window\",\"转化窗口\",route.window,windowOptions)}${device}${fresh?`\u003cspan class=\"filter-meta\">${esc(fresh)}\u003c/span>`:\"\"}`;\n  return `\u003csection class=\"panel filters\" aria-label=\"数据筛选\">${common}${controls}\u003c/section>`;\n}\nfunction statusLine(message, action=\"\") {\n  return `\u003cdiv class=\"inspection-row\">\u003cspan>${icon(\"pulse\")}${esc(message)}\u003c/span>${action}\u003c/div>`;\n}\nfunction kpis(data) {\n  return `\u003csection class=\"metric-strip\" aria-label=\"报名关键指标\">\n    \u003cdiv class=\"metric-tile is-primary\">\u003cspan class=\"metric-label\">总转化率\u003c/span>\u003cstrong class=\"metric-value\" data-overall-rate>${rate(data.rate)}\u003c/strong>\u003csmall class=\"metric-detail\">完成报名 ÷ 查看活动\u003c/small>\u003c/div>\n    \u003cdiv class=\"metric-tile\">\u003cspan class=\"metric-label\">查看访客\u003c/span>\u003cstrong class=\"metric-value\">${count(data.entered)}\u003c/strong>\u003csmall class=\"metric-detail\">按匿名访客去重\u003c/small>\u003c/div>\n    \u003cdiv class=\"metric-tile\">\u003cspan class=\"metric-label\">完成报名\u003c/span>\u003cstrong class=\"metric-value\">${count(data.converted)}\u003c/strong>\u003csmall class=\"metric-detail\">${esc(windowOptions.find(([value])=>Number(value)===data.window)?.[1]||data.window+\" 分钟\")}内完成\u003c/small>\u003c/div>\n  \u003c/section>`;\n}\nfunction cohortButton(step,outcome,caption,cls=\"cohort-trigger\") {\n  const label=cls===\"cohort-trigger\"?` aria-label=\"${esc(stages[step]+\" \"+caption)}\"`:\"\";\n  return `\u003cbutton type=\"button\" class=\"${cls}\" data-cohort-step=\"${step}\" data-cohort-outcome=\"${outcome}\"${label}>${esc(caption)}\u003c/button>`;\n}\nfunction funnelCard(data,route) {\n  const dropped = data.steps.slice(1).reduce((most,step)=>step.loss>(most?.loss||0)?step:most,null);\n  const isRelative=route.chart===\"relative\";\n  const toggle=[[\"overall\",\"相对首步\"],[\"relative\",\"相对上一步\"]].map(([value,label])=>\n    `\u003cbutton type=\"button\" aria-pressed=\"${route.chart===value}\" data-chart-mode=\"${value}\">${label}\u003c/button>`).join(\"\");\n  const steps = data.steps.map((entry,index)=>{\n    const label = stages[entry.step] || entry.step;\n    const base=isRelative?entry.relativeRate:entry.overallRate;\n    const previous=index===0?base:isRelative?(data.steps[index-1].count?1:0):data.steps[index-1].overallRate;\n    const details=index===0?\"进入漏斗\":`${rate(base)} \u003cspan>· ${count(entry.loss)} 人未达\u003c/span>`;\n    return `\u003cdiv class=\"chart-step\">\n      \u003ca class=\"bar-step\" data-step=\"${esc(entry.step)}\" aria-label=\"${esc(label+\" \"+count(entry.count)+\" 人，查看原始事件\")}\" aria-describedby=\"step-rate-${entry.step}\" href=\"${esc(href(\"events\",route,{step:entry.step}))}\">\n        \u003cspan class=\"bar-index\">0${index+1} \u003cspan>${esc(label)}\u003c/span>\u003c/span>\n        \u003cspan class=\"bar-well\" aria-hidden=\"true\">\u003ci class=\"bar-fill\" data-pct=\"${width(base)}\">\u003c/i>\n          \u003ci class=\"bar-loss\" data-pct=\"${width((previous||0)-(base||0))}\" data-base=\"${width(base)}\">\u003c/i>\u003c/span>\n        \u003cspan class=\"step-title\">\u003cstrong>${count(entry.count)}\u003cspan>人\u003c/span>\u003c/strong>\u003c/span>\n        \u003cspan class=\"step-foot\" id=\"step-rate-${entry.step}\">${details}\u003c/span>\n      \u003c/a>\n      \u003cdiv class=\"step-actions\">${cohortButton(entry.step,\"reached\",\"已到达\")}${index?cohortButton(entry.step,\"lost\",\"未到达\"):\"\"}\u003c/div>\u003c/div>`;\n  }).join(\"\");\n  const insight=dropped?`\u003cdiv class=\"analysis-note\">\u003cp>\u003cstrong>${count(dropped.loss)} 人\u003c/strong>在「${preceding[dropped.step]}」后尚未「${stages[dropped.step]}」，是当前人数差最大的环节。\u003c/p>${cohortButton(dropped.step,\"lost\",\"查看流失访客\",\"btn text insight-action\")}\u003c/div>`:\"\";\n  return `\u003csection class=\"panel funnel-card\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch2>报名路径\u003c/h2>\n    \u003cp>从查看到报名成功，按访客去重。\u003c/p>\u003c/div>\n    \u003cdiv class=\"chart-controls\">\u003cdiv class=\"axis-toggle\" role=\"group\" aria-label=\"转化率基准\">${toggle}\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"chart-body\">\u003cdiv class=\"chart-wrap\">\u003cdiv class=\"chart-axis\" aria-hidden=\"true\">${[100,75,50,25,0].map(n=>`\u003cspan>${n}%\u003c/span>`).join(\"\")}\u003c/div>\n    \u003cdiv class=\"funnel-grid\" aria-label=\"报名转化步骤\">${steps}\u003c/div>\u003c/div>\n    \u003cdiv class=\"chart-legend\">\u003cspan>\u003ci class=\"legend-swatch\">\u003c/i>到达当前步骤\u003c/span>\u003cspan>\u003ci class=\"legend-swatch lost\">\u003c/i>上一步到达、当前未到达\u003c/span>\u003c/div>\u003c/div>${insight}\u003c/section>`;\n}\nfunction deviceCard(data,route) {\n  const [mobile,desktop] = [\"mobile\",\"desktop\"].map(device=>data.groups.find(item=>item.device===device));\n  const groups = [mobile,desktop].filter(Boolean).map(group=>{\n    const {device} = group;\n    const active = route.device===device;\n    return `\u003ca class=\"device-tile${active?\" is-selected\":\"\"}\" ${active?'aria-current=\"true\"':\"\"} href=\"${esc(href(\"funnel\",route,{device:active?\"all\":device}))}\">\u003cdiv class=\"device-line\">\u003cspan>${icon(device)}${deviceNames[device]}\u003c/span>\u003cstrong>${rate(group?.rate)}\u003c/strong>\u003c/div>\n      \u003cspan class=\"meter\" aria-hidden=\"true\">\u003ci data-pct=\"${width(group?.rate)}\">\u003c/i>\u003c/span>\n      \u003cp>${count(group?.converted)} 人报名成功 / ${count(group?.entered)} 人进入\u003c/p>\u003c/a>`;\n  }).join(\"\");\n  let finding = \"两种设备都有访客进入后，才可比较转化率。\";\n  if (Number.isFinite(mobile?.rate) && Number.isFinite(desktop?.rate)) {\n    const difference = (desktop.rate-mobile.rate)*100;\n    const display = new Intl.NumberFormat(\"zh-CN\",{maximumFractionDigits:1}).format(Math.abs(difference));\n    finding = display===\"0\" ? \"两种设备的当前报名转化率接近。\" :\n      `${difference>0?\"桌面端\":\"手机端\"}转化率较高，相差 ${display} 个百分点。`;\n  }\n  return `\u003csection class=\"panel device-panel\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch2>设备对比\u003c/h2>\u003cp>按首次查看活动的设备分组。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"device-body\">${groups}\u003cp class=\"finding\">${finding}\u003c/p>\u003c/div>\u003c/section>`;\n}\nfunction eventTable(events,route,{withId=false}={}) {\n  if (!events.length)return '\u003cp class=\"state-text\">没有匹配的事件。可切换活动、步骤或设备后再看。\u003c/p>';\n  return `\u003cdiv class=\"table-scroll\" tabindex=\"0\" aria-label=\"事件记录表格\">\u003ctable>\n    \u003cthead>\u003ctr>\u003cth scope=\"col\">发生时间\u003c/th>\u003cth scope=\"col\">事件\u003c/th>\u003cth scope=\"col\">设备\u003c/th>\u003cth scope=\"col\">匿名访客\u003c/th>\u003cth scope=\"col\">来源\u003c/th>${withId?'\u003cth scope=\"col\">事件编号\u003c/th>':\"\"}\u003c/tr>\u003c/thead>\n    \u003ctbody>${events.map(event=>`\u003ctr data-event-source=\"${esc(event.source)}\">\u003ctd>\u003ctime>${displayTime(event.at)}\u003c/time>\u003c/td>\u003ctd>${esc(stages[event.step]||event.step)}\u003c/td>\n       \u003ctd>${esc(deviceNames[event.device]||\"未知设备\")}\u003c/td>\u003ctd class=\"mono\">${route.visitor?esc(event.visitorId):`\u003ca class=\"visitor-link\" href=\"${esc(href(\"events\",route,{source:event.source,device:\"all\",visitor:event.visitorId,returnDevice:route.returnDevice||route.device}))}\">${esc(event.visitorId)}\u003c/a>`}\u003c/td>\n       \u003ctd>\u003cspan class=\"chip ${event.source===\"session\"?\"live\":\"\"}\">${esc(sourceNames[event.source]||event.source)}\u003c/span>\u003c/td>\n       ${withId?`\u003ctd class=\"mono\">${esc(event.id)}\u003c/td>`:\"\"}\u003c/tr>`).join(\"\")}\u003c/tbody>\n  \u003c/table>\u003c/div>`;\n}\nfunction visitorTrace(events,route) {\n  if(!route.visitor || route.device!==\"all\" || route.step!==\"all\" || !events.length)return \"\";\n  const ordered = [...events].reverse();\n  return `\u003csection class=\"panel visitor-trace\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch2>这位访客的已记录步骤\u003c/h2>\u003cp>同一步出现多次时，这里显示最早一条。\u003c/p>\u003c/div>\u003c/div>\n    \u003col>${Object.entries(stages).map(([step,title])=>{\n      const event = ordered.find(item=>item.step===step);\n      return `\u003cli class=\"${event?\"observed\":\"\"}\">\u003cspan>${event?icon(\"check\"):icon(\"clock\")}\u003c/span>\u003cdiv>\u003cstrong>${title}\u003c/strong>\u003csmall>${event?displayTime(event.at):\"未记录\"}\u003c/small>\u003c/div>\u003c/li>`;\n    }).join(\"\")}\u003c/ol>\u003c/section>`;\n}\nasync function funnelView(route,id) {\n  const summary = request(\"/api/funnel?\"+apiQuery(route,{window:route.window}));\n  const recent = request(\"/api/events?\"+apiQuery(route,{step:\"all\",source:\"all\",limit:\"4\"}));\n  const [data,{events}] = await Promise.all([summary,recent]);\n  if (version!==id)return;\n  const line = meta.mode===\"demo\"?statusLine(\n    data.sessionEvents>0?`已记录 ${count(data.sessionEvents)} 条本次操作，与 ${count(data.sampleEvents)} 条合成样例一起计算。`:\n      \"当前展示合成样例。走完一次报名流程，再回来查看你的三条事件。\",\n    data.sessionEvents>0?link(\"只看本次操作\",href(\"events\",route,{source:\"session\"})):\"\"):\n    statusLine(`当前活动共采集 ${count(data.eventCount)} 条相关事件。`);\n  const activity=meta.activities.find(item=>item.id===route.activity)?.title || \"\";\n  const contextLabel=meta.mode===\"demo\"?activity+\" · 合成样例\":activity;\n  main.innerHTML = header(\"报名转化总览\",contextLabel,actionLinks(route))+\n    filters(route)+kpis(data)+`\u003cdiv class=\"study-grid\">${funnelCard(data,route)}${deviceCard(data,route)}\u003c/div>`+line+`\n    \u003csection class=\"panel recent\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch2>最近的事件\u003c/h2>\u003cp>可以按步骤、设备和来源核对原始记录。\u003c/p>\u003c/div>\n    ${link(\"查看全部事件\",href(\"events\",route))}\u003c/div>${eventTable(events,route)}\u003c/section>`;\n}\nasync function eventsView(route,id) {\n  const options = {step:route.step,source:route.source,limit:\"60\"};\n  if(route.visitor)options.visitor=route.visitor;\n  const data = await request(\"/api/events?\"+apiQuery(route,options));\n  if(version!==id)return;\n  const back=link(\"返回转化看板\",href(\"funnel\",route,{device:route.returnDevice || route.device}),\"secondary\");\n  const action = meta.mode===\"demo\"&&route.source!==\"session\"&&!route.visitor\n    ?back+link(\"只看本次操作\",href(\"events\",route,{source:\"session\",step:route.step}),\"primary\"):back;\n  const note = data.total>data.events.length?`匹配 ${count(data.total)} 条，显示最近 ${count(data.events.length)} 条。`:`匹配 ${count(data.total)} 条事件。`;\n  main.innerHTML=header(\"事件明细\",\"查看每一次操作、发生的设备与来源。\",action)+filters(route)+\n    visitorTrace(data.total===data.events.length?data.events:[],route)+\n    `\u003csection class=\"panel event-rows\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch2>原始事件\u003c/h2>\u003cp>${note}${route.visitor?\"\":\" 同一访客的重复操作也会列出。\"}\u003c/p>\u003c/div>\u003c/div>${eventTable(data.events,route,{withId:true})}\u003c/section>`;\n}\nfunction timeline(session) {\n  const done = Object.keys(stages).indexOf(session.step);\n  const descriptions = [\"打开演示活动\", \"进入报名确认\", \"保存这次报名\"];\n  return `\u003col class=\"timeline\">${Object.entries(stages).map(([stage,title],i)=>\n    `\u003cli class=\"${done>=i?\"done\":\"\"}\" data-try-step=\"${stage}\" ${done>=i?'data-complete=\"true\"':\"\"}>\n      \u003cspan class=\"dot\">${done>=i?icon(\"check\"):i+1}\u003c/span>\n      \u003cdiv>\u003cstrong>${title}\u003c/strong>\u003csmall>${descriptions[i]}\u003c/small>\u003c/div>\n    \u003c/li>`).join(\"\")}\u003c/ol>`;\n}\nfunction renderTry(session,route) {\n  const item = meta.activities.find(candidate=>candidate.id===route.activity);\n  const byVisitor = href(\"events\",route,{source:\"session\",device:\"all\",visitor:session.visitorId});\n  const action = session.step===\"success\"?link(\"查看我的三条事件\",byVisitor,\"primary\"):\n    session.step===\"start\"?'\u003cbutton type=\"button\" class=\"btn primary\" data-confirm>确认报名'+icon(\"arrow\")+'\u003c/button>':\n      '\u003cbutton type=\"button\" class=\"btn primary\" data-submit-step=\"start\">开始报名'+icon(\"arrow\")+'\u003c/button>';\n  const body = session.step===\"success\"?\"本次演示报名已完成。可以打开事件明细，核对自己刚刚走过的三步。\":\n    session.step===\"start\"?\"确认后会记录「报名成功」，再把当前匿名访客纳入漏斗的最后一步。\":\n      \"你已触发「查看活动」。点击开始报名，然后确认，就能看到三条真实操作记录。\";\n  main.innerHTML=header(\"体验活动报名\",\"这是一场虚构活动。你的点击会写入当前浏览器的分析记录。\",link(\"返回转化看板\",href(\"funnel\",route,{device:\"all\"}),\"secondary\"),\"校园场务演示\")+\n    `\u003cdiv class=\"try-grid\">\u003csection class=\"panel\">\n      \u003cdiv class=\"event-canvas\">\u003cdiv>\u003cp class=\"eyebrow\">演示活动\u003c/p>\u003ch2>${esc(item?.title)}\u003c/h2>\n      \u003cp>${esc(item?.description||\"校园活动报名演练\")}\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"card-body\">\u003ch2>${session.step===\"success\"?\"报名已确认\":\"活动报名\"}\u003c/h2>\u003cp>${body}\u003c/p>\n      \u003cdiv class=\"confirm-group\">${action}${session.step===\"success\"?link(\"查看更新后的看板\",href(\"funnel\",route,{device:\"all\"}),\"secondary\"):\"\"}\u003c/div>\n      \u003cp class=\"live-notice\" role=\"status\" data-notice>\u003c/p>\u003c/div>\n    \u003c/section>\u003csection class=\"panel card-body try-side\">\u003ch2>我的操作记录\u003c/h2>\n      \u003cp>匿名访客 \u003cspan class=\"mono\">${esc(session.visitorId)}\u003c/span>\u003c/p>${timeline(session)}\u003c/section>\u003c/div>\n    \u003cdialog class=\"dialog\" id=\"confirm-dialog\" aria-labelledby=\"confirm-title\">\u003ch2 id=\"confirm-title\">确认演示报名？\u003c/h2>\u003cp>确认后，可回到看板查看这次操作带来的漏斗变化。\u003c/p>\n      \u003cdiv class=\"confirm-group\">\u003cbutton class=\"btn\" type=\"button\" data-dismiss>返回\u003c/button>\u003cbutton class=\"btn primary\" type=\"button\" data-submit-step=\"success\">确认并报名\u003c/button>\u003c/div>\n      \u003cp class=\"live-notice\" role=\"status\" data-notice>\u003c/p>\u003c/dialog>`;\n}\nfunction report(step,route) {\n  const device = matchMedia(\"(max-width: 680px)\").matches?\"mobile\":\"desktop\";\n  return request(\"/api/demo/events\",{method:\"POST\",body:{activityId:route.activity,step,device}});\n}\nasync function tryView(route,id) {\n  let session = await request(\"/api/demo/session?\"+new URLSearchParams({activity:route.activity}));\n  if(version!==id)return;\n  if(!session.step)session=await report(\"view\",route);\n  if(version===id)renderTry(session,route);\n}\nfunction emptyWorkspace(route) {\n  const help=meta.syncConfigured?\"同步后会列出已捕获的活动及真实事件。请先从校园场务打开一项活动并开始报名。\":\n    \"当前没有可分析的活动。本机服务连到校园场务后可读取报名事件。\";\n  main.innerHTML = header(\"报名转化总览\",\"活动数据同步后就能查看真实报名漏斗。\",actionLinks(route))+\n    `\u003csection class=\"panel card-body\">\u003ch2>还没有活动数据\u003c/h2>\u003cp>${help}\u003c/p>\u003c/section>`;\n}\nfunction styleBars() {\n  main.querySelectorAll(\"[data-pct]\").forEach(bar=>bar.style.setProperty(\"--pct\",bar.dataset.pct));\n  main.querySelectorAll(\"[data-base]\").forEach(bar=>bar.style.setProperty(\"--base\",bar.dataset.base));\n}\nasync function render({refresh=false}={}) {\n  const id=++version;\n  main.setAttribute(\"aria-busy\",\"true\");\n  try {\n    if(!meta||refresh) {\n      const nextMeta = await request(\"/api/meta\");\n      if(version!==id)return;\n      meta = nextMeta;\n    }\n    const route = getRoute();\n    setFrame(route);\n    if(!route.activity)emptyWorkspace(route);\n    else if(route.page===\"events\")await eventsView(route,id);\n    else if(route.page===\"try\"&&meta.mode===\"demo\")await tryView(route,id);\n    else await funnelView(route,id);\n    if(version!==id)return;\n    styleBars();\n    if(filterFocus) {\n      const filter=filterFocus.startsWith(\"chart:\")\n        ?main.querySelector(`[data-chart-mode=\"${filterFocus.slice(6)}\"]`)\n        :main.querySelector(`[data-filter=\"${filterFocus}\"] summary`);\n      if(filter)filter.focus({preventScroll:true});\n    } else if(focusMain) {\n      window.scrollTo(0,0);\n      main.focus({preventScroll:true});\n    }\n  } catch(error) {\n    if(version===id)main.innerHTML=`\u003csection class=\"panel card-body\">\u003ch1>无法加载数据\u003c/h1>\u003cp class=\"error\" role=\"alert\">${esc(error.message)}\u003c/p>\n      \u003cbutton type=\"button\" class=\"btn\" data-retry>重试\u003c/button>\u003c/section>`;\n  } finally {\n    if(version===id) {\n      main.setAttribute(\"aria-busy\",\"false\");\n      filterFocus=\"\";\n      focusMain=false;\n    }\n  }\n}\nasync function submitStep(step,button) {\n  if(refreshing)return;\n  const route=getRoute();\n  const id=version;\n  refreshing=true;\n  button.disabled=true;\n  try {\n    const session=await report(step,route);\n    if(version===id) {\n      renderTry(session,route);\n      main.querySelector(step===\"success\"?'[data-try-step=\"success\"]':\"[data-confirm]\")?.scrollIntoView({block:\"nearest\"});\n      main.querySelector(step===\"success\"?'.confirm-group a':\"[data-confirm]\")?.focus({preventScroll:true});\n    }\n  } catch(error) {\n    if(version===id){\n      const note = button.closest(\"dialog,section\")?.querySelector(\"[data-notice]\");\n      if(note)note.textContent=error.message;\n    }\n  } finally {\n    refreshing=false;\n    button.disabled=false;\n  }\n}\nasync function sync(button) {\n  if(refreshing)return;\n  refreshing=true;\n  button.disabled=true;\n  button.textContent=\"正在同步…\";\n  try {\n    const result=await request(\"/api/sync\",{method:\"POST\",body:{}});\n    await render({refresh:true});\n    main.querySelector(\".page-heading\")?.insertAdjacentHTML(\"afterend\",statusLine(`本次同步新增 ${count(result.imported)} 条事件。`));\n  } catch(error) {\n    button.textContent=\"重试同步\";\n    main.querySelector(\".page-heading\")?.insertAdjacentHTML(\"afterend\",`\u003cp class=\"error\" role=\"alert\">${esc(error.message)}\u003c/p>`);\n  } finally {\n    refreshing=false;\n    button.disabled=false;\n  }\n}\nfunction closePickers(target) {\n  main.querySelectorAll(\".picker[open]\").forEach(picker=>{if(!picker.contains(target))picker.open=false;});\n}\nasync function showCohort(step,outcome){\n  const route=getRoute();\n  if(route.page!==\"funnel\" || !Object.hasOwn(explanations,step) || ![\"lost\",\"reached\"].includes(outcome))return;\n  const current=++cohortSequence;\n  const [reachedTitle,reachedDescription]=explanations[step];\n  const title=outcome===\"reached\"?reachedTitle:step===\"start\"?\"未开始报名的访客\":\"未完成报名的访客\";\n  const activity=meta.activities.find(item=>item.id===route.activity)?.title || \"\";\n  const windowLabel=windowOptions.find(([value])=>value===route.window)?.[1];\n  drawer.innerHTML=`\u003cheader class=\"drawer-head\">\u003cdiv>\u003cp>${esc(activity)} · ${esc(windowLabel)} · ${esc(deviceNames[route.device])}\u003c/p>\u003ch2 id=\"cohort-title\">${title}\u003c/h2>\u003c/div>\n    \u003cbutton type=\"button\" class=\"drawer-close\" data-close-cohort aria-label=\"关闭访客名单\" autofocus>${icon(\"close\")}\u003c/button>\u003c/header>\n    \u003cdiv class=\"drawer-body\">\u003cp class=\"state-text\" role=\"status\">正在查询访客名单…\u003c/p>\u003c/div>`;\n  if(!drawer.open)drawer.showModal();\n  drawer.querySelector(\"[data-close-cohort]\").focus();\n  const body=drawer.querySelector(\".drawer-body\");\n  try{\n    const data=await request(\"/api/cohort?\"+apiQuery(route,{window:route.window,step,outcome,limit:\"100\"}));\n    if(current!==cohortSequence || !drawer.open)return;\n    const description=outcome===\"reached\"?reachedDescription:`已「${preceding[step]}」，当前记录尚未到达「${stages[step]}」。仍在窗口内的人之后可能完成。`;\n    const caption=data.total>data.visitors.length?` · 显示最近 ${count(data.visitors.length)} 位`:\"\";\n    const rows=data.visitors.map(item=>{\n      const target=href(\"events\",route,{device:\"all\",source:item.source,visitor:item.visitorId,returnDevice:route.device});\n      return `\u003ctr>\u003ctd>\u003ca class=\"visitor-link\" href=\"${esc(target)}\" title=\"${esc(item.visitorId)}\">${esc(item.visitorId)}\u003c/a>\u003c/td>\n        \u003ctd>${esc(deviceNames[item.device])}\u003c/td>\u003ctd>\u003ctime>${displayTime(item.enteredAt)}\u003c/time>\u003c/td>\u003c/tr>`;\n    }).join(\"\");\n    body.innerHTML=`\u003cdiv class=\"drawer-summary\">\u003cstrong data-cohort-total>${count(data.total)} 位访客\u003c/strong>\u003cp>${description}${caption}\u003c/p>\u003c/div>\n      ${rows?`\u003ctable class=\"drawer-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">匿名访客\u003c/th>\u003cth scope=\"col\">进入设备\u003c/th>\u003cth scope=\"col\">首次查看\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows}\u003c/tbody>\u003c/table>`:\n      '\u003cp class=\"state-text\">这个筛选条件下没有匹配的访客。\u003c/p>'}`;\n  }catch(error){\n    if(current===cohortSequence&&drawer.open)body.innerHTML=`\u003cp class=\"error\" role=\"alert\">${esc(error.message)}\u003c/p>${cohortButton(step,outcome,\"重试\",\"btn\")}`;\n  }\n}\ndrawer.addEventListener(\"close\",()=>{cohortSequence++;});\ndrawer.addEventListener(\"click\",event=>{\n  if(event.target===drawer || event.target.closest(\"[data-close-cohort],a[href]\"))drawer.close();\n});\ndocument.addEventListener(\"click\",event=>{\n  closePickers(event.target);\n  if(event.target.closest(\".skip-link\")) {\n    event.preventDefault();\n    main.focus();\n    return;\n  }\n  const button=event.target.closest(\"button\");\n  if(!button)return;\n  if(button.hasAttribute(\"data-cohort-step\"))void showCohort(button.dataset.cohortStep,button.dataset.cohortOutcome);\n  if(button.hasAttribute(\"data-chart-mode\")){\n    const route=getRoute();\n    if(route.chart!==button.dataset.chartMode){\n      filterFocus=`chart:${button.dataset.chartMode}`;\n      navigate(href(\"funnel\",route,{chart:button.dataset.chartMode}));\n    }\n  }\n  if(button.hasAttribute(\"data-choice\")){\n    const route=getRoute();\n    filterFocus=button.closest(\".picker\").dataset.filter;\n    const changes=route.page===\"events\"?{step:route.step,source:route.source,visitor:filterFocus===\"activity\"?\"\":route.visitor}:{};\n    navigate(href(route.page,route,{...changes,[filterFocus]:button.dataset.choice}));\n  }\n  if(button.hasAttribute(\"data-confirm\"))document.querySelector(\"#confirm-dialog\").showModal();\n  if(button.hasAttribute(\"data-dismiss\"))button.closest(\"dialog\").close();\n  if(button.hasAttribute(\"data-submit-step\"))void submitStep(button.dataset.submitStep,button);\n  if(button.hasAttribute(\"data-sync\"))void sync(button);\n  if(button.hasAttribute(\"data-retry\"))void render({refresh:true});\n});\ndocument.addEventListener(\"keydown\",event=>{\n  const picker=event.target.closest(\".picker\");\n  if(!picker)return;\n  if(event.key===\"Escape\") {\n    picker.open=false;\n    picker.querySelector(\"summary\").focus();\n  }\n  if(![\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\"].includes(event.key))return;\n  event.preventDefault();\n  picker.open=true;\n  const entries=[...picker.querySelectorAll(\"button\")];\n  const index=entries.indexOf(document.activeElement);\n  const next=event.key===\"Home\"?0:event.key===\"End\"?entries.length-1:event.key===\"ArrowUp\"?Math.max(0,index-1):Math.min(entries.length-1,index+1);\n  entries[next]?.focus();\n});\nwindow.addEventListener(\"hashchange\",()=>{\n  if(drawer.open)drawer.close();\n  focusMain=true;\n  void render();\n});\nvoid render();\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#141a27\">\n  \u003ctitle>产品转化分析台\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#main\">跳到正文\u003c/a>\n  \u003cdiv class=\"shell\">\n    \u003caside class=\"sidebar\">\n      \u003ca class=\"brand\" href=\"#funnel\" aria-label=\"产品转化分析台首页\">\n        \u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\n        \u003cspan>转化分析台\u003cspan class=\"brand-sub\">校园活动报名\u003c/span>\u003c/span>\n      \u003c/a>\n      \u003cnav id=\"navigation\" aria-label=\"工作区页面\">\u003c/nav>\n      \u003cdiv class=\"side-bottom\">\n        \u003cdiv class=\"side-state\">\u003cspan class=\"side-dot\">\u003c/span>\u003cdiv id=\"side-mode\">正在连接工作区\u003c/div>\u003c/div>\n        \u003ca class=\"side-link\" href=\"https://github.com/fate788/product-funnel\" target=\"_blank\" rel=\"noopener\">项目源码 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/aside>\n    \u003cdiv class=\"workspace\">\n      \u003cheader class=\"topbar\">\u003cspan class=\"breadcrumb\">校园场务 \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cb id=\"breadcrumb\">转化分析\u003c/b>\u003c/span>\u003cspan id=\"top-status\" class=\"top-status\">\u003c/span>\u003c/header>\n      \u003cmain id=\"main\" tabindex=\"-1\" aria-busy=\"true\">\u003cp class=\"state-text\" role=\"status\">正在加载活动数据…\u003c/p>\u003c/main>\n    \u003c/div>\n  \u003c/div>\n  \u003cdialog id=\"cohort-dialog\" class=\"audit-drawer\" aria-labelledby=\"cohort-title\">\u003c/dialog>\n  \u003cnoscript>\u003cp class=\"state-text\">请启用 JavaScript 后打开分析台。\u003c/p>\u003c/noscript>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --nav: #1c2332;\n  --nav-strong: #141a27;\n  --nav-text: #bcc4d2;\n  --canvas: #f5f5f7;\n  --paper: #fff;\n  --ink: #222737;\n  --body: #364052;\n  --soft: #596477;\n  --line: #e0e2e9;\n  --faint-line: #ebedf2;\n  --blue: #414a83;\n  --light-blue: #f0f1fa;\n  --teal: #437b7b;\n  --gold: #736451;\n  --sand: #f7f4ee;\n  --rail: 210px;\n  --round: 10px;\n  --chart-height: 176px;\n  --font: \"Inter\",\"PingFang SC\",\"Microsoft YaHei UI\",\"Noto Sans CJK SC\",system-ui,sans-serif;\n  --mono: \"Cascadia Mono\",\"IBM Plex Mono\",Consolas,ui-monospace,monospace;\n  font: 14px/1.6 var(--font);\n  color: var(--ink);\n  background: var(--canvas);\n}\n* { box-sizing: border-box; }\nbody { margin: 0; min-width: 280px; }\n[hidden] { display: none !important; }\n::selection { background: #e0e2f6; color: #282f5b; }\n:where(h1,h2,h3,p,ul,ol,dl,dd,summary) { margin: 0; padding: 0; }\na { text-decoration: none; color: inherit; }\nbutton,input,summary,select { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\nbutton:disabled, button[aria-disabled=\"true\"] { cursor: not-allowed; opacity: .55; }\nbutton,summary,a,input { -webkit-tap-highlight-color: transparent; }\nbutton,summary { appearance: none; }\n:focus-visible { outline: 2px solid #716db5; outline-offset: 3px; }\n.skip-link { position: absolute; transform: translateY(-130%); z-index: 6; padding: 8px 12px; background: white; }\n.skip-link:focus { transform: translateY(0); }\n#main:focus { outline: none; }\n.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n.shell { min-height: 100vh; }\n.sidebar { position: fixed; z-index: 3; width: var(--rail); inset: 0 auto 0 0; display: flex; flex-direction: column; background: var(--nav-strong); color: var(--nav-text); border-right: 1px solid #2b3140; }\n.brand { display: flex; gap: 11px; padding: 28px 19px 25px; align-items: center; font-size: 17px; line-height: 1.25; font-weight: 650; color: #f5f6fb; white-space: nowrap; }\n.brand-sub { display: block; margin-top: 4px; font-size: 10px; font-weight: 450; letter-spacing: .045em; color: #a6afc1; }\n.brand-mark { display: inline-flex; width: 34px; height: 34px; padding: 8px 6px; align-items: flex-end; justify-content: center; gap: 3px; border: 1px solid #555a79; border-radius: 7px; background: #292e46; }\n.brand-mark i { width: 4px; background: #c5c9f0; border-radius: 1px; height: 15px; }\n.brand-mark i:nth-child(2) {height: 11px; opacity: .86;}\n.brand-mark i:nth-child(3) {height: 7px; opacity: .72;}\n.sidebar nav { display: grid; gap: 5px; padding: 17px 0; border-top: 1px solid #ffffff16; margin-inline: 14px; }\n.nav-link,.side-link { display: inline-flex; align-items: center; gap: 10px; min-height: 41px; border: 1px solid transparent; border-radius: 6px; padding: 8px 11px; font-weight: 550; font-size: 13px; }\n.nav-link:hover,.side-link:hover { color: white; background: #ffffff0b; }\n.nav-link[aria-current=\"page\"] { background: #282e43; border-color: #394159; color: #f4f5fc; box-shadow: inset 2px 0 #a6aaf2; }\n.icon { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 1.2em; height: 1.2em; vertical-align: middle; }\n.icon svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.55; fill: none; stroke-linecap: round; stroke-linejoin: round; }\n.nav-link[aria-current=\"page\"] .icon { color: #c5c9ff; }\n.nav-link .icon,.side-link .icon { font-size: 15px; }\n.side-bottom { display: grid; padding: 16px 14px; gap: 5px; margin-top: auto; }\n.side-state { display: flex; align-items: center; gap: 8px; padding: 13px 10px 6px; font-size: 12px; border-top: 1px solid #ffffff18; }\n.side-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #9c9dc4; }\n.side-link { font-size: 11px; min-height: 34px; justify-content: space-between; }\n.workspace { margin-left: var(--rail); min-width: 0; }\n.topbar { min-height: 56px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 6px 15px; padding: 0 clamp(22px,3.25vw,49px); background: #fafafc; }\n.breadcrumb { display: flex; gap: 9px; color: var(--soft); align-items: center; font-size: 12px; }\n.breadcrumb b { color: var(--body); }\n.top-status { display: inline-flex; align-items: center; gap: 7px; color: #494f68; font-size: 11px; font-weight: 620; text-align: right; border: 1px solid #e1e3ec; background: #f1f2f8; border-radius: 999px; padding: 3px 9px; }\n.top-status:empty { border: 0; background: transparent; }\n.top-status:empty::before { display: none; }\n.top-status::before { content: \"\"; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #787da6; flex-shrink: 0; }\n#main { max-width: 1440px; margin-inline: auto; padding: 30px clamp(22px,3.25vw,49px) 52px; }\n.page-heading { display: flex; gap: 12px 20px; justify-content: space-between; align-items: flex-end; margin-bottom: 19px; flex-wrap: wrap; }\n.eyebrow { font-size: 11px; font-weight: 630; letter-spacing: .08em; color: var(--blue); margin-bottom: 5px; }\n.page-heading h1 { font-size: clamp(29px,3.15vw,43px); font-weight: 690; line-height: 1.16; letter-spacing: -.047em; }\n.page-heading p:not(.eyebrow) { margin-top: 7px; color: var(--soft); font-size: 13px; line-height: 1.65; }\n.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 7px 13px; background: var(--paper); border: 1px solid #d3d6e2; border-radius: 6px; color: #454f79; font-weight: 620; font-size: 13px; line-height: 1.35; text-align: center; white-space: nowrap; }\n.btn:hover { background: #f4f4fa; border-color: #b4b9d2; }\n.btn.primary { background: #343e6c; color: white; border-color: #343e6c; box-shadow: 0 2px 4px #292e4b1c; }\n.btn.primary:hover { background: #262e53; }\n.btn.text { border-color: transparent; background: transparent; padding-inline: 0; min-height: 30px; white-space: normal; }\n.btn.text:hover { color: #2d346b; text-decoration: underline; text-underline-offset: 4px; }\n.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--round); min-width: 0; box-shadow: 0 1px 2px #242c4310; }\n.filters { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; padding: 12px 15px; position: relative; z-index: 2; }\n.filter-field { display: grid; gap: 4px; min-width: 0; }\n.filter-wide { min-width: min(215px,100%); }\n.filter-field>span { font-size: 11px; font-weight: 650; color: var(--soft); }\n.picker {position:relative; min-width: 124px;}\n.picker summary { display: flex; align-items: center; gap: 8px; justify-content: space-between; min-height: 34px; padding: 5px 10px; border: 1px solid #d7d9e3; border-radius: 6px; background: #fafafc; font-size: 12px; font-weight: 580; cursor: pointer; list-style: none; }\n.picker summary > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.picker:first-child summary span { overflow-wrap: anywhere; }\n.picker summary::-webkit-details-marker { display: none; }\n.picker summary::after { content: \"\"; width: 6px; height: 6px; border: solid #656e82; border-width: 0 1.5px 1.5px 0; flex-shrink: 0; transform: rotate(45deg); margin: -3px 3px 0 0; }\n.picker[open] summary { border-color: #9b9dc1; }\n.picker[open] summary::after { transform: rotate(225deg); margin-top: 3px; }\n.picker-list { position: absolute; z-index: 4; left: 0; top: calc(100% + 4px); min-width: 100%; width: max-content; max-width: min(245px,74vw); max-height: 240px; overflow: auto; display: grid; gap: 2px; padding: 4px; background: white; border: 1px solid #d5d7e5; box-shadow: 0 11px 25px #23294224; border-radius: 7px; }\n.picker-list button { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: transparent; text-align: left; font-size: 12px; border-radius: 4px; padding: 7px 10px; overflow-wrap: anywhere; }\n.picker-list button:hover,.picker-list button:focus-visible { background: #f3f4fa; outline-offset: -2px; }\n.picker-list button[aria-current=\"true\"] { color: #424a81; font-weight: 630; background: #eef0fa; }\n.picker-list button:not([aria-current=\"true\"]) .pick-mark { visibility: hidden; }\n.filter-meta { padding: 8px 0 4px; margin-left: auto; font-size: 11px; color: var(--soft); }\n.metric-strip { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); margin-top: 15px; border: 1px solid var(--line); border-radius: var(--round); background: var(--paper); box-shadow: 0 1px 2px #242c4310; }\n.metric-tile { position: relative; padding: 14px 18px; min-width: 0; }\n.metric-tile + .metric-tile { border-left: 1px solid var(--line); }\n.metric-tile.is-primary { background: #f4f4fb; border-radius: var(--round) 0 0 var(--round); }\n.metric-label { display: block; color: var(--body); font-size: 12px; font-weight: 620; }\n.metric-value { display: block; margin-top: 7px; font: 650 clamp(25px,2.8vw,37px)/1.1 var(--mono); letter-spacing: -.06em; font-variant-numeric: tabular-nums; }\n.metric-tile.is-primary .metric-value { color: #454f87; }\n.metric-detail { display: block; margin-top: 5px; color: var(--soft); font-size: 11px; overflow-wrap: anywhere; }\n.metric-icon { position: absolute; top: 15px; right: 15px; display: grid; place-items: center; width: 25px; height: 25px; border-radius: 5px; background: #e9ebf6; color: #626b9f; }\n.inspection-row { display: flex; justify-content: space-between; align-items: center; gap: 6px 14px; flex-wrap: wrap; border: 1px solid #e2e4f1; border-radius: 7px; margin-top: 12px; padding: 7px 12px; background: #f1f2f9; color: #4b5574; font-size: 12px; }\n.inspection-row .icon { color: #696d9a; margin-right: 5px; }\n.study-grid { display: grid; grid-template-columns: minmax(0,2.12fr) minmax(246px,1fr); gap: 16px; margin-top: 15px; align-items: stretch; }\n.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 9px 15px; padding: 16px 18px 12px; }\n.card-head h2,.card-body h2 { font-size: 17px; font-weight: 680; }\n.card-head p { font-size: 12px; color: var(--soft); margin-top: 3px; }\n.overall { text-align: right; flex-shrink: 0; }\n.overall strong { font: 650 26px/1.1 var(--mono); display: block; color: var(--blue); font-variant-numeric: tabular-nums; letter-spacing: -.055em; }\n.overall span { display: block; font-size: 11px; color: var(--soft); margin-top: 4px; }\n.chart-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\n.axis-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; background: #f7f7fa; padding: 2px; flex-wrap: nowrap; }\n.axis-toggle butt
