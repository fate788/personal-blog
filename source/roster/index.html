'bad-json'));\n    assert.equal(run.stdout, '');\n  }\n  for (const args of [[], ['--absence'], ['--demo', '--bogus'], ['--demo', '--out'],\n    ['--demo', '--demo'], ['--demo', '--input', input], ['--absence', '--input', input]]) {\n    const run = invoke(...args);\n    assert.equal(run.status, 1);\n    assert.notEqual(run.stderr, '');\n  }\n  await assert.rejects(stat(output), { code: 'ENOENT' });\n});\n","group":"验收测试"},{"path":"tests/engine.test.mjs","text":"import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { MAX_INPUT_BYTES, parseRoster, rosterCsv, solveRoster } from '../engine.mjs';\nimport { DEMO_ABSENCE, DEMO_BASE } from '../fixtures.mjs';\n\nfunction validateAssignments(problem, result) {\n  const occupied = new Set();\n  const people = new Map(problem.staff.map(person => [person.id, person]));\n  const shifts = new Map(problem.shifts.map(shift => [shift.id, shift]));\n  const counts = new Map();\n  const loads = new Map();\n  for (const assignment of result.assignments) {\n    const person = people.get(assignment.staffId);\n    const shift = shifts.get(assignment.shiftId);\n    assert(person.skills.includes(shift.skill));\n    assert(!person.unavailable.includes(shift.date));\n    const key = `${person.id}:${shift.date}`;\n    assert(!occupied.has(key));\n    occupied.add(key);\n    loads.set(person.id, (loads.get(person.id) ?? 0) + 1);\n    counts.set(shift.id, (counts.get(shift.id) ?? 0) + 1);\n    assert(loads.get(person.id) \u003c= person.maxShifts);\n    assert(counts.get(shift.id) \u003c= shift.count);\n  }\n  const keyForLock = ({ staffId, shiftId }) => `${staffId}:${shiftId}`;\n  assert.deepEqual(result.assignments.filter(entry => entry.locked).map(keyForLock).sort(), problem.locks.map(keyForLock).sort());\n  assert.equal(result.totals.assigned, result.assignments.length);\n  assert.equal(result.totals.requested - result.totals.assigned, result.gaps.reduce((sum, gap) => sum + gap.missing, 0));\n  assert.equal(result.totals.workloadCost, [...loads.values()].reduce((sum, value) => sum + value ** 2, 0));\n}\n\ntest('reference week covers all 21 seats without violating a lock or staff restriction', () => {\n  const original = structuredClone(DEMO_BASE);\n  const solved = solveRoster(DEMO_BASE);\n  assert.deepEqual(solved.totals, { requested: 21, assigned: 21, missing: 0, locked: 1, workloadCost: 57 });\n  assert.deepEqual(solved.workloads.map(person => person.shifts).toSorted(), [2, 2, 2, 3, 3, 3, 3, 3]);\n  assert.deepEqual(solved.gaps, []);\n  validateAssignments(DEMO_BASE, solved);\n  assert.deepEqual(DEMO_BASE, original);\n  assert.deepEqual(solveRoster(DEMO_BASE), solved);\n});\n\ntest('selecting the absence scenario leaves a visible Sunday slot with current-roster reasons', () => {\n  const solved = solveRoster(DEMO_ABSENCE);\n  assert.deepEqual(solved.totals, { requested: 21, assigned: 20, missing: 1, locked: 1, workloadCost: 52 });\n  assert.equal(solved.gaps.length, 1);\n  assert.equal(solved.gaps[0].shiftId, 'd7-late');\n  assert.equal(solved.gaps[0].missing, 1);\n  assert.equal(solved.gaps[0].reasons.filter(reason => reason.kind === 'skill').length, 5);\n  assert.equal(solved.gaps[0].reasons.filter(reason => reason.kind === 'unavailable').length, 3);\n  const updated = structuredClone(DEMO_ABSENCE);\n  updated.staff.at(-1).unavailable.pop();\n  assert.equal(solveRoster(updated).totals.missing, 0);\n  validateAssignments(DEMO_ABSENCE, solved);\n});\n\nfunction tiny(staff, shifts, locks = []) {\n  return {\n    name: '小排班', weekStart: '2026-11-30',\n    skills: [{ id: 'a', name: '在线' }, { id: 'b', name: '升级' }],\n    staff: staff.map((person, index) => ({ id: `s${index}`, name: `客服${index}`, maxShifts: 2, unavailable: [], ...person })),\n    shifts: shifts.map((shift, index) => ({ id: `d${index}`, label: `班次${index}`, date: '2026-11-30', start: '09:00', end: '17:00', count: 1, ...shift })),\n    locks,\n  };\n}\n\n// Independent exhaustive enumeration for small schedules. Each demand seat is either left\n// open or assigned to a staff member. It never uses the flow network or the engine's scoring code.\nfunction enumerate(problem) {\n  const occupied = new Map(problem.staff.map(person => [person.id, new Set()]));\n  const seats = problem.shifts.flatMap(shift => {\n    const locks = problem.locks.filter(lock => lock.shiftId === shift.id);\n    for (const lock of locks) occupied.get(lock.staffId).add(shift.date);\n    return Array(shift.count - locks.length).fill(shift);\n  });\n  let best = { coverage: -1, cost: Infinity };\n  function place(index, coverage) {\n    if (index === seats.length) {\n      const cost = [...occupied.values()].reduce((sum, dates) => sum + dates.size * dates.size, 0);\n      if (coverage > best.coverage || (coverage === best.coverage && cost \u003c best.cost)) best = { coverage, cost };\n      return;\n    }\n    const shift = seats[index];\n    place(index + 1, coverage);\n    for (const person of problem.staff) {\n      const dates = occupied.get(person.id);\n      if (dates.has(shift.date) || dates.size >= person.maxShifts || !person.skills.includes(shift.skill)\n          || person.unavailable.includes(shift.date)) continue;\n      dates.add(shift.date);\n      place(index + 1, coverage + 1);\n      dates.delete(shift.date);\n    }\n  }\n  place(0, problem.locks.length);\n  return best;\n}\n\ntest('finds the augmenting reassignment needed when a generalist is the only specialist', () => {\n  const problem = tiny([{ skills: ['a', 'b'] }, { skills: ['a'] }], [{ skill: 'a' }, { skill: 'b' }]);\n  const result = solveRoster(problem);\n  assert.deepEqual(result.assignments, [\n    { staffId: 's1', shiftId: 'd0', locked: false }, { staffId: 's0', shiftId: 'd1', locked: false },\n  ]);\n  validateAssignments(problem, result);\n});\n\ntest('coverage and squared workload match an exhaustive search over varied skills and capacities', () => {\n  const skillsByMask = [[], ['a'], ['b'], ['a', 'b']];\n  for (let skillMask = 0; skillMask \u003c 16; skillMask += 1) {\n    for (let limit = 0; limit \u003c= 2; limit += 1) {\n      for (const unavailable of [[], ['2026-12-01']]) {\n        const problem = tiny([\n          { skills: skillsByMask[skillMask >> 2], maxShifts: limit },\n          { skills: skillsByMask[skillMask & 3], unavailable },\n          { skills: ['a'], maxShifts: 1 },\n        ], [{ skill: 'a', count: 2 }, { skill: 'b' }, { skill: 'a', date: '2026-12-01' }, { skill: 'b', date: '2026-12-01' }]);\n        const result = solveRoster(problem);\n        assert.deepEqual({ coverage: result.totals.assigned, cost: result.totals.workloadCost }, enumerate(problem));\n        validateAssignments(problem, result);\n      }\n    }\n  }\n});\n\ntest('locked assignments enter the marginal cost before free assignments are optimized', () => {\n  const problem = tiny([\n    { skills: ['a'] }, { skills: ['a'] },\n  ], [\n    { skill: 'a' }, { skill: 'a', date: '2026-12-01' },\n  ], [{ staffId: 's0', shiftId: 'd0' }]);\n  const result = solveRoster(problem);\n  assert.deepEqual({ coverage: result.totals.assigned, cost: result.totals.workloadCost }, enumerate(problem));\n  assert.deepEqual(result.workloads.map(person => person.shifts), [1, 1]);\n  validateAssignments(problem, result);\n});\n\ntest('rejects lock conflicts and leaves the supplied plan intact', () => {\n  const problem = structuredClone(DEMO_BASE);\n  problem.locks.push({ shiftId: 'd1-late', staffId: 's01' });\n  assert.throws(() => solveRoster(problem), /缺少所需技能/);\n  problem.locks[1] = { shiftId: 'd1-day', staffId: 's01' };\n  assert.throws(() => parseRoster(JSON.stringify(problem)), /当天已有锁定安排/);\n  problem.locks[1] = { shiftId: 'd1-day', staffId: 's04' };\n  assert.throws(() => solveRoster(problem), /当天不可排/);\n  problem.locks[1] = { shiftId: 'absent', staffId: 's01' };\n  assert.throws(() => solveRoster(problem), /不存在/);\n  problem.locks[1] = { shiftId: 'd2-day', staffId: 's01' };\n  problem.staff[0].maxShifts = 1;\n  assert.throws(() => solveRoster(problem), /超出每周班次上限/);\n  problem.locks[1] = { shiftId: 'd1-day', staffId: 's02' };\n  problem.shifts[0].count = 1;\n  assert.throws(() => solveRoster(problem), /超出.*班次人数/);\n  assert.equal(problem.locks.length, 2);\n});\n\ntest('validates date boundaries, integer limits, input size and referenced IDs', () => {\n  assert.deepEqual(parseRoster(`\\uFEFF${JSON.stringify(DEMO_BASE)}`), DEMO_BASE);\n  assert.throws(() => parseRoster('plain text'), /无法读取 JSON/);\n  assert.throws(() => parseRoster('x'.repeat(MAX_INPUT_BYTES + 1)), /256 KiB/);\n  assert.throws(() => parseRoster('排'.repeat(100_000)), /256 KiB/);\n  assert.throws(() => solveRoster({ ...DEMO_BASE, weekStart: '2026-11-31' }), /日期无效/);\n  assert.throws(() => solveRoster({ ...DEMO_BASE, weekStart: '2026-12-01' }), /周一/);\n  assert.throws(() => solveRoster({ ...DEMO_BASE, staff: [...DEMO_BASE.staff, DEMO_BASE.staff[0]] }), /员工编号有重复/);\n  for (const [changes, error] of [\n    [{ skill: 'other' }, /已有技能/], [{ count: 40.1 }, /整数/], [{ count: 41 }, /整数/],\n    [{ end: '01:00' }, /同一天/], [{ start: '9:00' }, /HH:MM/], [{ date: '2026-12-07' }, /超出当前周/],\n  ]) {\n    const problem = structuredClone(DEMO_BASE);\n    Object.assign(problem.shifts[0], changes);\n    assert.throws(() => solveRoster(problem), error);\n  }\n});\n\ntest('reports reasons from the actual roster when a candidate is already assigned or capped', () => {\n  const problem = tiny([\n    { skills: ['a'], maxShifts: 1 },\n    { skills: ['a'], maxShifts: 0 },\n  ], [{ skill: 'a' }, { skill: 'a' }], [{ staffId: 's0', shiftId: 'd0' }]);\n  assert.deepEqual(solveRoster(problem).gaps, [{\n    shiftId: 'd1', missing: 1,\n    reasons: [{ staffId: 's0', kind: 'same-day' }, { staffId: 's1', kind: 'weekly-limit' }],\n  }]);\n});\n\ntest('CSV includes empty seats and protects text from spreadsheet formula evaluation', () => {\n  const problem = structuredClone(DEMO_ABSENCE);\n  problem.staff[0].name = '=1+1';\n  problem.shifts[0].label = '＠班, \"一\"';\n  const csv = rosterCsv(problem, solveRoster(problem));\n  const rows = csv.trimEnd().split('\\r\\n');\n  assert.equal(rows[0], '\\uFEFF日期,班次,开始,结束,技能,员工,状态');\n  assert.equal(rows.length, 22);\n  assert(rows[1].includes('\"\\'＠班, \"\"一\"\"\"'));\n  assert(rows[1].endsWith(\",'=1+1,锁定\"));\n  assert(rows.at(-1).endsWith('售后升级,,缺员'));\n});\n","group":"验收测试"}],"defaultFile":"engine.mjs"}</script>
