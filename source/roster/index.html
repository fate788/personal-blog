<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify support roster\non: [push, pull_request]\njobs:\n  schedule:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build\n      - run: npm run roster\n","group":"配置与启动"},{"path":".gitignore","text":"dist/\nnode_modules/\n*.csv\n","group":"配置与启动"},{"path":"README.md","text":"# 客服排班工作台\n\n供客服班组长编排一周班表。根据各班次对技能和人数的需求，合并员工请假日期、每周班次上限和已确认的安排。保留无法覆盖的席位，方便补人后重算。\n\n[打开工作台](https://fate788.github.io/personal-blog/demos/roster/index.html?v=1.0) · [查看请假情景](https://fate788.github.io/personal-blog/demos/roster/index.html?v=1.0&case=absence)\n\n![一周排班与晚间班复核](docs/preview.webp)\n\n## 体验路径\n\n1. 打开「常规」样例，查看一周班表和每个人的班次数，选中一个班次确认人员及技能要求。\n2. 切到请假情景，查看周日晚间缺口。点开专席员工的可用状态，恢复可用并重算，检查其他已锁定的安排。\n3. 下载排班 CSV。可导出当前工作区的 JSON 作为模板，替换人员、技能、日期和需求后重新导入。在线版本在浏览器内处理，导出 JSON 可保存当前工作区。\n\n## 本机使用\n\n需要 Node.js 22 或更新版本，无额外依赖。\n\n```sh\nnpm test\nnpm run build\nnode cli.mjs --demo\nnode cli.mjs --demo --absence\nnode cli.mjs --input ./week.json --out ./roster.csv\n```\n\n离线界面在 `dist/index.html`，可直接双击打开。CLI 输出包含覆盖情况、分配、缺口和每人的班次数。退出码 `0` 为完整覆盖，`2` 为存在缺口，`1` 为输入或文件错误。CLI 在完整覆盖时写入新 CSV，保留现有文件。\n\n## 导入一周计划\n\n在界面选择「保存计划」可获得示例 JSON。文件上限为 256 KiB，支持 80 位员工和 56 个班次条目。日期使用 `YYYY-MM-DD`，一周从周一开始。班次起止时间使用当天的 `HH:MM`。\n\n| 字段 | 内容 |\n| --- | --- |\n| `name` / `weekStart` | 计划名称、周一日期 |\n| `skills` | 技能的 `id` 与 `name` |\n| `staff` | 员工的 `id`、`name`、技能编号 `skills`、周上限 `maxShifts`、不可排日期 `unavailable` |\n| `shifts` | 班次的 `id`、`date`、`label`、`start`、`end`、技能编号 `skill`、所需人数 `count` |\n| `locks` | 分配的 `shiftId` 与 `staffId`，无锁定时用 `[]` |\n\n## 求解口径\n\n硬约束包括技能、请假日期、同日最多一班、每周上限与已锁定安排。先最大化填补的席位数，再最小化每人班次数平方之和，以避免在相同覆盖下过度集中班次。以最小费用流连接员工、员工日期与班次席位。缺口旁的人员原因基于当前排班。所有样例人物和班次均为虚构。\n\n问题建模参考 [OR-Tools 人员排班说明](https://developers.google.com/optimization/service/scheduling/workforce_scheduling) 和 [最小费用流分配](https://developers.google.com/optimization/flow/assignment_min_cost_flow)。项目使用同一套 JavaScript 求解器驱动浏览器和命令行。\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 客服排班工作台 v1.0 源码包\n\n原始发布归档为 `客服排班工作台-v1.0.zip`。压缩包保留其中 13 份文本文件的原始路径与字节，本文件为导出说明。\n\n需要 Node.js 22 或更新版本。npm test 验证最优性和边界，npm run build 生成离线排班台。\n","group":"项目说明"},{"path":"build.mjs","text":"import { mkdir, readFile, writeFile } from 'node:fs/promises';\nimport { dirname, resolve } from 'node:path';\n\nconst destination = resolve(process.argv[2] || 'dist/index.html');\nconst read = async path => (await readFile(new URL(path, import.meta.url), 'utf8')).replaceAll('\\r\\n', '\\n');\nconst asModule = source => `data:text/javascript;base64,${Buffer.from(source).toString('base64')}`;\nconst [html, css, app, engine, sample] = await Promise.all([\n  read('./static/index.html'), read('./static/styles.css'), read('./static/app.mjs'),\n  read('./engine.mjs'), read('./fixtures.mjs'),\n]);\n\nfunction replaceModule(source, path, url) {\n  return source.replaceAll(`'${path}'`, `'${url}'`).replaceAll(`\"${path}\"`, `\"${url}\"`);\n}\n\nconst engineModule = asModule(engine);\nconst dataModule = asModule(replaceModule(sample, './engine.mjs', engineModule));\nconst appSource = replaceModule(replaceModule(app, '../engine.mjs', engineModule), '../fixtures.mjs', dataModule);\nconst cssEntry = /\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css[\"'][^>]*>/iu;\nconst jsEntry = /\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs[\"'][^>]*>\\s*\u003c\\/script>/iu;\nif (!cssEntry.test(html) || !jsEntry.test(html)) throw new Error('找不到排班台的样式或脚本入口。');\n\nconst policy = \"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\nconst portable = html.replace('\u003chead>', `\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(cssEntry, () => `\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(jsEntry, () => `\u003cscript type=\"module\" src=\"${asModule(appSource)}\">\u003c/script>`);\n\nawait mkdir(dirname(destination), { recursive: true });\nawait writeFile(destination, portable, 'utf8');\nconsole.log(`已生成客服排班工作台 ${destination}`);\n","group":"配置与启动"},{"path":"cli.mjs","text":"import { open, stat, unlink } from 'node:fs/promises';\nimport { MAX_INPUT_BYTES, parseRoster, rosterCsv, solveRoster } from './engine.mjs';\nimport { DEMO_ABSENCE, DEMO_BASE } from './fixtures.mjs';\n\nconst HELP = `客服排班工作台 · 本机命令行\n\nnode cli.mjs --demo [--absence] [--out \u003c新文件.csv>]\nnode cli.mjs --input \u003c排班数据.json> [--out \u003c新文件.csv>]\n\n  --demo             使用内置排班样例\n  --absence          使用样例中的人员请假情景\n  --input \u003c文件>     使用本机 UTF-8 JSON 文件，最大 ${MAX_INPUT_BYTES / 1024} KiB\n  --out \u003c新文件>     全部需求有覆盖时，导出 UTF-8 CSV\n  --help, -h         查看帮助\n\n标准输出为 JSON 结果，含排班、缺口、人员班量和总计。\n退出码 0 表示全部需求已覆盖，2 表示存在缺口，1 表示参数、数据或文件错误。`;\n\nclass CliError extends Error {}\n\nconst flags = new Set(['--demo', '--absence']);\nconst paths = new Set(['--input', '--out']);\n\nfunction parseArguments(args) {\n  const values = new Map();\n  for (let index = 0; index \u003c args.length; index += 1) {\n    const key = args[index];\n    if (values.has(key) || (!flags.has(key) && !paths.has(key))) {\n      throw new CliError('存在未知或重复的参数。运行 node cli.mjs --help 查看用法。');\n    }\n    if (flags.has(key)) {\n      values.set(key, true);\n      continue;\n    }\n    const value = args[index + 1];\n    if (!value || value.startsWith('--')) throw new CliError(`${key} 需要文件路径。`);\n    values.set(key, value);\n    index += 1;\n  }\n  if (values.has('--demo') === values.has('--input')) {\n    throw new CliError('请选择 --demo 或 --input。');\n  }\n  if (values.has('--absence') && !values.has('--demo')) throw new CliError('--absence 需要与 --demo 一起使用。');\n  return values;\n}\n\nfunction checkInputFile(info) {\n  if (!info.isFile() || info.size > MAX_INPUT_BYTES) {\n    throw new CliError(`请提供不超过 ${MAX_INPUT_BYTES / 1024} KiB 的排班 JSON 文件。`);\n  }\n}\n\nasync function readInput(path) {\n  try {\n    checkInputFile(await stat(path));\n    const file = await open(path, 'r');\n    try {\n      checkInputFile(await file.stat());\n      const buffer = Buffer.allocUnsafe(MAX_INPUT_BYTES + 1);\n      let size = 0;\n      while (size \u003c buffer.length) {\n        const { bytesRead } = await file.read(buffer, size, buffer.length - size, null);\n        if (!bytesRead) break;\n        size += bytesRead;\n      }\n      if (size > MAX_INPUT_BYTES) throw new CliError(`排班 JSON 文件超过 ${MAX_INPUT_BYTES / 1024} KiB。`);\n      try {\n        return new TextDecoder('utf-8', { fatal: true }).decode(buffer.subarray(0, size));\n      } catch {\n        throw new CliError('排班 JSON 文件需要使用 UTF-8 编码。');\n      }\n    } finally {\n      await file.close();\n    }\n  } catch (error) {\n    if (error instanceof CliError) throw error;\n    throw new CliError('无法读取指定的排班文件。');\n  }\n}\n\nasync function writeCsv(path, contents) {\n  let file;\n  try {\n    file = await open(path, 'wx', 0o600);\n  } catch (error) {\n    if (error.code === 'EEXIST') throw new CliError('输出已存在，请指定一个新文件。');\n    throw new CliError('无法创建指定的 CSV 文件。');\n  }\n  try {\n    try {\n      await file.writeFile(contents, 'utf8');\n    } finally {\n      await file.close();\n    }\n  } catch {\n    await unlink(path).catch(() => {});\n    throw new CliError('写入排班 CSV 失败。');\n  }\n}\n\nfunction validateAndSolve(input) {\n  try {\n    const problem = typeof input === 'string' ? parseRoster(input) : input;\n    return { problem, result: solveRoster(problem) };\n  } catch (error) {\n    if (error instanceof SyntaxError) throw new CliError('排班文件不是有效的 JSON。');\n    throw new CliError(error.message || '无法生成排班。');\n  }\n}\n\nasync function main(args) {\n  if (args.length === 1 && ['-h', '--help'].includes(args[0])) {\n    console.log(HELP);\n    return 0;\n  }\n  const options = parseArguments(args);\n  const demo = options.has('--absence') ? DEMO_ABSENCE : DEMO_BASE;\n  const input = options.has('--demo') ? demo : await readInput(options.get('--input'));\n  const { problem, result } = validateAndSolve(input);\n  const missing = result.totals.missing;\n  const output = options.get('--out');\n  if (!missing && output) await writeCsv(output, rosterCsv(problem, result));\n\n  console.log(JSON.stringify(result, null, 2));\n  if (missing && output) console.error(`排班还缺 ${missing} 个岗位名额，暂未导出 CSV。`);\n  return missing ? 2 : 0;\n}\n\ntry {\n  process.exitCode = await main(process.argv.slice(2));\n} catch (error) {\n  console.error(error instanceof CliError ? error.message : '无法完成排班。请检查输入与输出设置。');\n  process.exitCode = 1;\n}\n","group":"配置与启动"},{"path":"engine.mjs","text":"export const MAX_INPUT_BYTES = 262_144;\nconst DAY_MS = 86_400_000;\nconst MAX_STAFF = 80;\nconst MAX_SHIFTS = 56;\nconst MAX_SKILLS = 24;\n\nfunction invalid(message) {\n  throw new TypeError(message);\n}\n\nfunction object(value, label) {\n  if (!value || typeof value !== 'object' || Array.isArray(value)) invalid(`${label}应为对象。`);\n  return value;\n}\n\nfunction list(value, minimum, maximum, label) {\n  if (!Array.isArray(value) || value.length \u003c minimum || value.length > maximum) {\n    invalid(`${label}应有 ${minimum} 到 ${maximum} 项。`);\n  }\n  return value;\n}\n\nfunction natural(value, limit, label) {\n  if (!Number.isInteger(value) || value \u003c 0 || value > limit) invalid(`${label}应是 0 到 ${limit} 的整数。`);\n  return value;\n}\n\nfunction name(value, label) {\n  if (typeof value !== 'string' || /[\\0-\\x1f\\x7f]/u.test(value) || !value.trim() || value.trim().length > 100) {\n    invalid(`${label}应是 1 到 100 字的单行文字。`);\n  }\n  return value.trim();\n}\n\nfunction id(value, label) {\n  if (typeof value !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$/u.test(value)) {\n    invalid(`${label}须为 1 到 40 个字母、数字、下划线或连字符，开头使用字母或数字。`);\n  }\n  return value;\n}\n\nfunction unique(value, label) {\n  if (new Set(value).size !== value.length) invalid(`${label}有重复项。`);\n  return value;\n}\n\nfunction dateStart(date, label) {\n  if (typeof date !== 'string' || !/^[1-9]\\d{3}-\\d{2}-\\d{2}$/u.test(date)) {\n    invalid(`${label}应采用 YYYY-MM-DD 格式。`);\n  }\n  const start = Date.parse(`${date}T00:00:00.000Z`);\n  if (Number.isNaN(start) || new Date(start).toISOString().slice(0, 10) !== date) invalid(`${label}无效。`);\n  return start;\n}\n\nfunction clock(value, label) {\n  if (typeof value !== 'string' || !/^(?:[01]\\d|2[0-3]):[0-5]\\d$/u.test(value)) invalid(`${label}应采用 HH:MM 格式。`);\n  return value;\n}\n\nfunction normalize(problem) {\n  object(problem, '排班方案');\n  const start = dateStart(problem.weekStart, '周起始日期');\n  if (new Date(start).getUTCDay() !== 1 || new Date(start + 6 * DAY_MS).getUTCFullYear() > 9999) {\n    invalid('周起始日期应为可以覆盖完整一周的周一。');\n  }\n  const dates = new Set(Array.from({ length: 7 }, (_, offset) => new Date(start + offset * DAY_MS).toISOString().slice(0, 10)));\n  const skills = list(problem.skills, 1, MAX_SKILLS, '技能列表').map((entry, index) => {\n    const label = `第 ${index + 1} 项技能`;\n    const item = object(entry, label);\n    return { id: id(item.id, `${label}编号`), name: name(item.name, `${label}名称`) };\n  });\n  const skillsById = new Set(unique(skills.map(skill => skill.id), '技能编号'));\n  const checkSkill = (value, label) => {\n    if (!skillsById.has(value)) invalid(`${label}应引用已有技能。`);\n    return value;\n  };\n  const staff = list(problem.staff, 1, MAX_STAFF, '员工列表').map((entry, index) => {\n    const label = `第 ${index + 1} 位员工`;\n    const item = object(entry, label);\n    const employeeSkills = list(item.skills, 0, MAX_SKILLS, `${label}技能列表`);\n    const unavailable = unique(list(item.unavailable, 0, 7, `${label}不可排日期`), `${label}不可排日期`);\n    if (unavailable.some(date => !dates.has(date))) invalid(`${label}的不可排日期超出当前周。`);\n    return {\n      id: id(item.id, `${label}编号`),\n      name: name(item.name, `${label}姓名`),\n      skills: unique(employeeSkills.map(skill => checkSkill(skill, `${label}技能`)), `${label}技能`),\n      maxShifts: natural(item.maxShifts, 7, `${label}周上限`),\n      unavailable: [...unavailable],\n    };\n  });\n  unique(staff.map(person => person.id), '员工编号');\n  const shifts = list(problem.shifts, 1, MAX_SHIFTS, '班次列表').map((entry, index) => {\n    const label = `第 ${index + 1} 个班次`;\n    const item = object(entry, label);\n    if (!dates.has(item.date)) invalid(`${label}日期超出当前周。`);\n    const first = clock(item.start, `${label}开始时间`);\n    const last = clock(item.end, `${label}结束时间`);\n    if (last \u003c= first) invalid(`${label}结束时间应晚于同一天的开始时间。`);\n    return {\n      id: id(item.id, `${label}编号`),\n      date: item.date,\n      label: name(item.label, `${label}名称`),\n      start: first,\n      end: last,\n      skill: checkSkill(item.skill, `${label}技能`),\n      count: natural(item.count, 40, `${label}人数`),\n    };\n  });\n  unique(shifts.map(shift => shift.id), '班次编号');\n  const locks = list(problem.locks, 0, MAX_STAFF * 7, '锁定安排').map((entry, index) => {\n    const label = `第 ${index + 1} 条锁定安排`;\n    const item = object(entry, label);\n    return { shiftId: id(item.shiftId, `${label}班次编号`), staffId: id(item.staffId, `${label}员工编号`) };\n  });\n  return { name: name(problem.name, '方案名称'), weekStart: problem.weekStart, skills, staff, shifts, locks };\n}\n\nfunction availability(person, shift, workedDates, workload) {\n  if (!person.skills.includes(shift.skill)) return 'skill';\n  if (person.unavailable.includes(shift.date)) return 'unavailable';\n  if (workedDates.has(shift.date)) return 'same-day';\n  if (workload >= person.maxShifts) return 'weekly-limit';\n  return 'eligible';\n}\n\nfunction buildRoster(problem) {\n  const staffById = new Map(problem.staff.map(person => [person.id, person]));\n  const shiftsById = new Map(problem.shifts.map(shift => [shift.id, shift]));\n  const workedDates = new Map(problem.staff.map(person => [person.id, new Set()]));\n  const assignedByShift = new Map(problem.shifts.map(shift => [shift.id, []]));\n  const lockErrors = { skill: '缺少所需技能', unavailable: '当天不可排', 'same-day': '当天已有锁定安排', 'weekly-limit': '超出每周班次上限' };\n\n  function assign(person, shift, locked) {\n    workedDates.get(person.id).add(shift.date);\n    assignedByShift.get(shift.id).push({ staffId: person.id, shiftId: shift.id, locked });\n  }\n\n  for (const lock of problem.locks) {\n    const person = staffById.get(lock.staffId);\n    const shift = shiftsById.get(lock.shiftId);\n    if (!person || !shift) invalid(`锁定安排 ${lock.staffId} / ${lock.shiftId} 的员工或班次不存在。`);\n    const dates = workedDates.get(person.id);\n    const reason = availability(person, shift, dates, dates.size);\n    if (reason !== 'eligible') invalid(`锁定安排 ${person.name} / ${shift.date} ${shift.label}：${lockErrors[reason]}。`);\n    if (assignedByShift.get(shift.id).length >= shift.count) invalid(`锁定安排超出 ${shift.date} ${shift.label} 的班次人数。`);\n    assign(person, shift, true);\n  }\n  return { workedDates, assignedByShift, assign };\n}\n\nexport function parseRoster(text) {\n  if (typeof text !== 'string') invalid('请提供 JSON 文本。');\n  if (text.length > MAX_INPUT_BYTES || new TextEncoder().encode(text).length > MAX_INPUT_BYTES) invalid('排班文件应在 256 KiB 以内。');\n  let document;\n  try {\n    document = JSON.parse(text.replace(/^\\uFEFF/u, ''));\n  } catch {\n    invalid('无法读取 JSON，请检查文件格式。');\n  }\n  const problem = normalize(document);\n  buildRoster(problem);\n  return problem;\n}\n\nfunction createGraph() {\n  const graph = [];\n  return {\n    graph,\n    node() {\n      graph.push([]);\n      return graph.length - 1;\n    },\n    edge(from, to, capacity, cost = 0) {\n      const forward = { to, capacity, cost, reverse: graph[to].length };\n      graph[to].push({ to: from, capacity: 0, cost: -cost, reverse: graph[from].length });\n      graph[from].push(forward);\n      return forward;\n    },\n  };\n}\n\nclass DistanceQueue {\n  items = [];\n\n  push(entry) {\n    const queue = this.items;\n    let at = queue.length;\n    queue.push(entry);\n    while (at > 0) {\n      const parent = Math.floor((at - 1) / 2);\n      if (queue[parent].distance \u003c= entry.distance) break;\n      queue[at] = queue[parent];\n      at = parent;\n    }\n    queue[at] = entry;\n  }\n\n  pop() {\n    const queue = this.items;\n    const first = queue[0];\n    const last = queue.pop();\n    if (queue.length === 0) return first;\n    let at = 0;\n    while (at * 2 + 1 \u003c queue.length) {\n      const left = at * 2 + 1;\n      const right = left + 1;\n      const child = right \u003c queue.length && queue[right].distance \u003c queue[left].distance ? right : left;\n      if (last.distance \u003c= queue[child].distance) break;\n      queue[at] = queue[child];\n      at = child;\n    }\n    queue[at] = last;\n    return first;\n  }\n}\n\nfunction fillMinimumCost(graph, source, sink) {\n  const potentials = new Array(graph.length).fill(0);\n  while (true) {\n    const distance = new Array(graph.length).fill(Infinity);\n    const prev = new Array(graph.length);\n    const queue = new DistanceQueue();\n    distance[source] = 0;\n    queue.push({ node: source, distance: 0 });\n\n    while (queue.items.length) {\n      const visit = queue.pop();\n      if (visit.distance !== distance[visit.node]) continue;\n      for (const edge of graph[visit.node]) {\n        if (edge.capacity === 0) continue;\n        const next = visit.distance + edge.cost + potentials[visit.node] - potentials[edge.to];\n        if (next >= distance[edge.to]) continue;\n        distance[edge.to] = next;\n        prev[edge.to] = { from: visit.node, edge };\n        queue.push({ node: edge.to, distance: next });\n      }\n    }\n\n    if (!prev[sink]) return;\n    for (let index = 0; index \u003c graph.length; index += 1) {\n      if (Number.isFinite(distance[index])) potentials[index] += distance[index];\n    }\n    // The employee/day edge admits one seat, so each augmenting path sends one unit.\n    for (let node = sink; node !== source;) {\n      const { from, edge } = prev[node];\n      edge.capacity -= 1;\n      graph[node][edge.reverse].capacity += 1;\n      node = from;\n    }\n  }\n}\n\n/** Maximize covered seats, then minimize the sum of squared employee shift counts. */\nexport function solveRoster(input) {\n  const problem = normalize(input);\n  const { workedDates, assignedByShift, assign } = buildRoster(problem);\n  const { graph, node, edge } = createGraph();\n  const source = node();\n  const sink = node();\n  const openShifts = problem.shifts.filter(shift => shift.count > assignedByShift.get(shift.id).length);\n  const shiftNodes = new Map(openShifts.map(shift => [shift.id, node()]));\n  for (const shift of openShifts) edge(shiftNodes.get(shift.id), sink, shift.count - assignedByShift.get(shift.id).length);\n\n  const choices = [];\n  for (const person of problem.staff) {\n    const dates = workedDates.get(person.id);\n    if (dates.size >= person.maxShifts) continue;\n    const staffNode = node();\n    // Marginal cost 2k+1 for going from k to k+1 assignments, including locks already counted.\n    for (let count = dates.size; count \u003c person.maxShifts; count += 1) edge(source, staffNode, 1, 2 * count + 1);\n    const dayNodes = new Map();\n    for (const shift of openShifts) {\n      if (availability(person, shift, dates, dates.size) !== 'eligible') continue;\n      if (!dayNodes.has(shift.date)) {\n        dayNodes.set(shift.date, node());\n        edge(staffNode, dayNodes.get(shift.date), 1);\n      }\n      const option = edge(dayNodes.get(shift.date), shiftNodes.get(shift.id), 1);\n      choices.push({ person, shift, option });\n    }\n  }\n  fillMinimumCost(graph, source, sink);\n  for (const { person, shift, option } of choices) {\n    if (option.capacity === 0) assign(person, shift, false);\n  }\n\n  const assignments = [...assignedByShift.values()].flat();\n  const gaps = problem.shifts.filter(shift => shift.count > assignedByShift.get(shift.id).length).map(shift => ({\n    shiftId: shift.id,\n    missing: shift.count - assignedByShift.get(shift.id).length,\n    reasons: problem.staff.map(person => {\n      const dates = workedDates.get(person.id);\n      return { staffId: person.id, kind: availability(person, shift, dates, dates.size) };\n    }),\n  }));\n  const workloads = problem.staff.map(person => ({ staffId: person.id, shifts: workedDates.get(person.id).size, cap: person.maxShifts }));\n  const requested = problem.shifts.reduce((count, shift) => count + shift.count, 0);\n  return {\n    assignments,\n    gaps,\n    workloads,\n    totals: {\n      requested,\n      assigned: assignments.length,\n      missing: requested - assignments.length,\n      locked: problem.locks.length,\n      workloadCost: workloads.reduce((cost, load) => cost + load.shifts ** 2, 0),\n    },\n  };\n}\n\nfunction csvCell(value) {\n  const text = String(value ?? '');\n  const safe = /^\\s*[=+@＝＋－＠-]|^[\\t\\r\\n]/u.test(text) ? `'${text}` : text;\n  return /[\",\\r\\n]/u.test(safe) ? `\"${safe.replaceAll('\"', '\"\"')}\"` : safe;\n}\n\nexport function rosterCsv(problem, result) {\n  const roster = new Map(problem.shifts.map(shift => [shift.id, []]));\n  const skills = new Map(problem.skills.map(skill => [skill.id, skill.name]));\n  const names = new Map(problem.staff.map(person => [person.id, person.name]));\n  for (const entry of result.assignments) roster.get(entry.shiftId).push(entry);\n  const rows = [['日期', '班次', '开始', '结束', '技能', '员工', '状态']];\n  for (const shift of problem.shifts) {\n    const assigned = roster.get(shift.id);\n    const details = [shift.date, shift.label, shift.start, shift.end, skills.get(shift.skill)];\n    for (const entry of assigned) rows.push([...details, names.get(entry.staffId), entry.locked ? '锁定' : '已安排']);\n    for (let index = assigned.length; index \u003c shift.count; index += 1) rows.push([...details, '', '缺员']);\n  }\n  return `\\uFEFF${rows.map(row => row.map(csvCell).join(',')).join('\\r\\n')}\\r\\n`;\n}\n","group":"后端"},{"path":"fixtures.mjs","text":"const dates = [\n  '2026-11-30', '2026-12-01', '2026-12-02', '2026-12-03', '2026-12-04', '2026-12-05', '2026-12-06',\n];\n\nconst teams = [\n  { id: 'general', name: '在线客服' },\n  { id: 'escalation', name: '售后升级' },\n];\n\nconst staff = [\n  { id: 's01', name: '许嘉宁', skills: ['general'], maxShifts: 4, unavailable: [dates[3]] },\n  { id: 's02', name: '林以晴', skills: ['general'], maxShifts: 4, unavailable: [dates[1], dates[6]] },\n  { id: 's03', name: '孟予安', skills: ['general'], maxShifts: 4, unavailable: [dates[2]] },\n  { id: 's04', name: '周启航', skills: ['general'], maxShifts: 4, unavailable: [dates[0], dates[5]] },\n  { id: 's05', name: '陈知夏', skills: ['general'], maxShifts: 4, unavailable: [dates[4]] },\n  { id: 's06', name: '赵书言', skills: ['general', 'escalation'], maxShifts: 4, unavailable: [dates[5], dates[6]] },\n  { id: 's07', name: '唐亦可', skills: ['general', 'escalation'], maxShifts: 4, unavailable: [dates[0], dates[6]] },\n  { id: 's08', name: '沈映之', skills: ['escalation'], maxShifts: 4, unavailable: [dates[1]] },\n];\n\nconst shifts = dates.flatMap((date, index) => [\n  { id: `d${index + 1}-day`, date, label: '日间班', start: '09:00', end: '17:00', skill: 'general', count: 2 },\n  { id: `d${index + 1}-late`, date, label: '晚间班', start: '14:00', end: '22:00', skill: 'escalation', count: 1 },\n]);\n\nexport const DEMO_BASE = {\n  name: '双十二售前支持', weekStart: dates[0], skills: teams, staff, shifts,\n  locks: [{ shiftId: 'd1-day', staffId: 's01' }],\n};\n\nexport const DEMO_ABSENCE = {\n  ...structuredClone(DEMO_BASE),\n  name: '周日专席临时请假',\n  staff: staff.map(person => person.id === 's08'\n    ? { ...structuredClone(person), unavailable: [...person.unavailable, dates[6]] }\n    : structuredClone(person)),\n};\n","group":"数据与样例"},{"path":"package.json","text":"{\n  \"name\": \"support-roster\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": { \"node\": \">=22\" },\n  \"scripts\": {\n    \"test\": \"node --test tests/*.test.mjs\",\n    \"build\": \"node build.mjs\",\n    \"roster\": \"node cli.mjs --demo\"\n  }\n}\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import { MAX_INPUT_BYTES, parseRoster, rosterCsv, solveRoster } from '../engine.mjs';\nimport { DEMO_ABSENCE, DEMO_BASE } from '../fixtures.mjs';\n\nconst $ = id => document.getElementById(id);\nconst absenceCase = new URLSearchParams(location.search).get('case') === 'absence';\nconst state = { problem: null, result: null, source: '', activeShift: '', activeDay: '', readVersion: 0, editor: null };\nconst weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];\nconst reasons = {\n  skill: '技能不匹配', unavailable: '当天请假', 'same-day': '当天已有班次', 'weekly-limit': '达到周上限', eligible: '当前安排下可用',\n};\n\nfunction node(tag, className, content) {\n  const element = document.createElement(tag);\n  if (className) element.className = className;\n  if (content !== undefined) element.textContent = content;\n  return element;\n}\n\nfunction button(className, content) {\n  const control = node('button', className, content);\n  control.type = 'button';\n  return control;\n}\n\nfunction weekDays(start) {\n  const monday = new Date(`${start}T00:00:00Z`);\n  return weekdays.map((weekday, index) => {\n    const date = new Date(monday);\n    date.setUTCDate(date.getUTCDate() + index);\n    return { date: date.toISOString().slice(0, 10), day: date.getUTCDate(), month: date.getUTCMonth() + 1, weekday, weekend: index > 4 };\n  });\n}\n\nfunction shortDate(day) {\n  return `${day.month}月${day.day}日`;\n}\n\nfunction notice(message = '', tone = 'success') {\n  const region = $('notice');\n  region.hidden = !message;\n  region.dataset.tone = tone;\n  region.textContent = message;\n}\n\nfunction indexPlan() {\n  const { problem, result } = state;\n  const people = new Map(problem.staff.map(person => [person.id, person]));\n  const skills = new Map(problem.skills.map(skill => [skill.id, skill.name]));\n  const shifts = new Map(problem.shifts.map(shift => [shift.id, shift]));\n  const workloads = new Map(result.workloads.map(load => [load.staffId, load]));\n  const gaps = new Map(result.gaps.map(gap => [gap.shiftId, gap]));\n  const assignments = new Map(problem.shifts.map(shift => [shift.id, []]));\n  const scheduleByPerson = new Map(problem.staff.map(staff => [staff.id, new Set()]));\n  for (const assignment of result.assignments) {\n    assignments.get(assignment.shiftId).push(assignment);\n    scheduleByPerson.get(assignment.staffId).add(shifts.get(assignment.shiftId).date);\n  }\n  return { people, skills, shifts, workloads, gaps, assignments, scheduleByPerson, days: weekDays(problem.weekStart) };\n}\n\nfunction commit(problem, source, { preferGap = false, resetSelection = false } = {}) {\n  const result = solveRoster(problem);\n  const previous = problem.shifts.find(shift => shift.id === state.activeShift);\n  const firstGap = result.gaps[0]?.shiftId;\n  const choice = preferGap && firstGap ? firstGap : resetSelection ? problem.shifts[0].id : previous?.id || '';\n  const activeShift = problem.shifts.find(shift => shift.id === choice);\n  const days = weekDays(problem.weekStart);\n  const knownDay = days.some(day => day.date === state.activeDay);\n  state.activeDay = activeShift?.date ?? (knownDay && !resetSelection ? state.activeDay : days[0].date);\n  state.activeShift = activeShift?.id ?? '';\n  state.problem = problem;\n  state.result = result;\n  state.source = source;\n  render();\n}\n\nfunction renderCoverage(index) {\n  const { result, problem, source } = state;\n  const { assigned, requested, missing, locked } = result.totals;\n  const percent = requested === 0 ? 100 : Math.round(assigned / requested * 100);\n  const first = index.days[0];\n  const last = index.days.at(-1);\n  const year = first.date.slice(0, 4);\n  const lastYear = last.date.slice(0, 4);\n  const lastLabel = year === lastYear ? shortDate(last) : `${lastYear}年 ${shortDate(last)}`;\n  $('week-range').textContent = `${year}年 ${shortDate(first)} – ${lastLabel}`;\n  $('assigned-total').textContent = assigned;\n  $('needed-total').textContent = requested;\n  $('missing-total').textContent = missing;\n  $('locked-total').textContent = locked;\n  $('coverage').dataset.status = missing ? 'gap' : 'ready';\n  $('coverage-status').textContent = missing ? '待补齐' : '已排满';\n  $('coverage-progress').setAttribute('aria-valuenow', percent);\n  $('coverage-progress').style.setProperty('--fill', `${percent}%`);\n  $('coverage-note').textContent = missing ? '仍有空缺席位。可以查看候选限制，并导出含缺口的草案。' : '当前计划已覆盖所有需求。请核对人员安排后导出。';\n  $('scenario-name').textContent = problem.name;\n  $('scenario-source').textContent = source === 'import' ? '导入计划' : source === 'edited' ? '已编辑' : '样例计划';\n  $('scenario-normal').setAttribute('aria-pressed', String(source === 'normal'));\n  $('scenario-absence').setAttribute('aria-pressed', String(source === 'absence'));\n  const csv = $('export-csv');\n  csv.textContent = missing ? '导出缺口草案 CSV ↓' : '导出排班 CSV ↓';\n  csv.dataset.draft = String(missing > 0);\n  for (const id of ['export-csv', 'solve-roster', 'export-workspace', 'edit-absence']) $(id).disabled = false;\n  $('jump-gap').hidden = missing === 0;\n}\n\nfunction renderShift(shift, index) {\n  const assigned = index.assignments.get(shift.id);\n  const gap = index.gaps.get(shift.id);\n  const named = assigned.map(item => index.people.get(item.staffId).name);\n  const locked = assigned.some(item => item.locked);\n  const control = button('shift');\n  control.dataset.shiftId = shift.id;\n  control.dataset.gap = String(Boolean(gap));\n  control.setAttribute('aria-pressed', String(state.activeShift === shift.id));\n  control.setAttribute('aria-controls', 'spotlight');\n  const label = `${shift.date} ${shift.label} ${shift.start} 至 ${shift.end}，已排 ${assigned.length} 人，需求 ${shift.count} 人`;\n  control.setAttribute('aria-label', label + (gap ? `，缺 ${gap.missing} 人` : '') + (locked ? '，含锁定人员' : ''));\n  const ratio = node('span', 'shift-fill', `${assigned.length} / ${shift.count}${gap ? ` · 缺${gap.missing}` : ''}`);\n  if (locked) {\n    const icon = node('i', 'mini-lock');\n    icon.setAttribute('aria-hidden', 'true');\n    ratio.append(icon);\n  }\n  control.append(node('span', 'shift-name', shift.label), node('span', 'shift-time', `${shift.start}–${shift.end}`),\n    node('span', 'shift-people', named.join('、') || '暂无人员'), ratio);\n  return control;\n}\n\nfunction renderCalendar(index) {\n  const byDay = new Map(index.days.map(day => [day.date, []]));\n  for (const shift of index.shifts.values()) byDay.get(shift.date).push(shift);\n  const currentFocus = document.activeElement?.dataset;\n  const controls = [];\n  const columns = index.days.map(day => {\n    const shifts = byDay.get(day.date).toSorted((first, second) => first.start.localeCompare(second.start) || first.end.localeCompare(second.end));\n    const hasGap = shifts.some(shift => index.gaps.has(shift.id));\n    const active = state.activeDay === day.date;\n    const pick = button('day-select');\n    pick.dataset.day = day.date;\n    pick.dataset.gap = String(hasGap);\n    pick.setAttribute('aria-pressed', String(active));\n    pick.setAttribute('aria-label', `${day.weekday} ${shortDate(day)}${hasGap ? ' 有缺口' : ''}`);\n    const date = node('time', '', day.day);\n    date.dateTime = day.date;\n    pick.append(node('span', '', day.weekday), date);\n    controls.push(pick);\n\n    const column = node('section', ['day', day.weekend && 'weekend', active && 'selected-day', hasGap && 'has-gap'].filter(Boolean).join(' '));\n    const heading = node('h3', 'day-head');\n    const time = node('time', 'day-number', `${day.month}/${day.day}`);\n    time.dateTime = day.date;\n    heading.append(node('span', 'day-weekday', day.weekday), time);\n    const groups = node('div', 'day-shifts');\n    if (shifts.length) groups.append(...shifts.map(shift => renderShift(shift, index)));\n    else groups.append(node('p', 'no-shifts', '无班次'));\n    column.append(heading, groups);\n    return column;\n  });\n  $('day-strip').replaceChildren(...controls);\n  $('calendar').replaceChildren(...columns);\n  if (currentFocus?.day) controls.find(control => control.dataset.day === currentFocus.day)?.focus();\n  if (currentFocus?.shiftId) [...$('calendar').querySelectorAll('[data-shift-id]')].find(control => control.dataset.shiftId === currentFocus.shiftId)?.focus();\n}\n\nfunction summarizeCandidates(index, shift, assigned) {\n  const gapReasons = index.gaps.get(shift.id)?.reasons;\n  const assignedIds = new Set(assigned.map(item => item.staffId));\n  if (gapReasons) return gapReasons.filter(entry => !assignedIds.has(entry.staffId));\n  return [...index.people.values()].filter(person => !assignedIds.has(person.id)).map(person => {\n    let kind = 'eligible';\n    if (!person.skills.includes(shift.skill)) kind = 'skill';\n    else if (person.unavailable.includes(shift.date)) kind = 'unavailable';\n    else if (index.scheduleByPerson.get(person.id).has(shift.date)) kind = 'same-day';\n    else if (index.workloads.get(person.id).shifts >= person.maxShifts) kind = 'weekly-limit';\n    return { staffId: person.id, kind };\n  });\n}\n\nfunction renderAssigned(shift, index, assigned) {\n  $('assigned-section').hidden = false;\n  $('assigned-count').textContent = `${assigned.length} / ${shift.count}`;\n  const activeLock = document.activeElement?.dataset.lockStaff;\n  const rows = assigned.map(item => {\n    const staff = index.people.get(item.staffId);\n    const row = node('div', 'assigned-row');\n    const avatar = node('span', 'avatar', [...staff.name][0]);\n    avatar.setAttribute('aria-hidden', 'true');\n    const lock = button('lock-button', item.locked ? '已锁定 · 解锁' : '锁定');\n    lock.dataset.lockStaff = staff.id;\n    lock.setAttribute('aria-pressed', String(item.locked));\n    lock.setAttribute('aria-label', `${item.locked ? '解除锁定' : '锁定'} ${staff.name}`);\n    row.append(avatar, node('strong', 'assigned-name', staff.name), lock);\n    return row;\n  });\n  $('assigned-list').replaceChildren(...(rows.length ? rows : [node('p', 'assigned-empty', '此班次还没有安排人员。')]));\n  if (activeLock) [...$('assigned-list').querySelectorAll('[data-lock-staff]')].find(control => control.dataset.lockStaff === activeLock)?.focus();\n}\n\nfunction renderSpotlight(index, openCandidates = false) {\n  const shift = index.shifts.get(state.activeShift);\n  const hasShift = Boolean(shift);\n  $('shift-skill').hidden = !hasShift;\n  $('shift-status').hidden = !hasShift;\n  $('assigned-section').hidden = !hasShift;\n  $('candidate-details').hidden = !hasShift;\n  if (!shift) {\n    $('shift-title').textContent = '选择班次';\n    $('shift-meta').textContent = '从周历中选择有需求的时段。';\n    return;\n  }\n\n  const gap = index.gaps.get(shift.id);\n  const assigned = index.assignments.get(shift.id);\n  const day = index.days.find(entry => entry.date === shift.date);\n  $('shift-title').textContent = shift.label;\n  $('shift-meta').textContent = `${day.weekday} ${shortDate(day)} · ${shift.start}–${shift.end}`;\n  $('shift-skill').textContent = `所需技能 · ${index.skills.get(shift.skill)}`;\n  const shiftStatus = $('shift-status');\n  shiftStatus.textContent = gap ? `还需补 ${gap.missing} 人` : '当前需求已覆盖';\n  shiftStatus.dataset.gap = String(Boolean(gap));\n  renderAssigned(shift, index, assigned);\n\n  const available = summarizeCandidates(index, shift, assigned);\n  const order = ['eligible', 'unavailable', 'same-day', 'weekly-limit', 'skill'];\n  const sorted = available.toSorted((left, right) => order.indexOf(left.kind) - order.indexOf(right.kind));\n  $('candidate-count').textContent = `${available.length} 人`;\n  $('candidate-note').textContent = '以下为当前排班下的情况，调整约束后可重算。';\n  const rows = sorted.map(entry => {\n    const row = node('li', 'candidate-row');\n    const label = node('span', 'reason-chip', reasons[entry.kind]);\n    label.dataset.reason = entry.kind;\n    row.dataset.staffId = entry.staffId;\n    row.append(node('span', '', index.people.get(entry.staffId).name), label);\n    return row;\n  });\n  $('candidate-list').replaceChildren(...(rows.length ? rows : [node('li', 'candidate-row', '没有其他候选人。')]));\n  if (openCandidates) $('candidate-details').open = Boolean(gap);\n}\n\nfunction renderPeople(index) {\n  const prev = document.activeElement?.dataset.staffId;\n  const controls = [...index.people.values()].map(person => {\n    const { shifts, cap } = index.workloads.get(person.id);\n    const control = button('staff');\n    control.dataset.staffId = person.id;\n    control.setAttribute('aria-label', `${person.name} 已排 ${shifts} 次，周上限 ${cap} 次，调整请假`);\n    const avatar = node('span', 'avatar', [...person.name][0]);\n    avatar.setAttribute('aria-hidden', 'true');\n    const count = node('span', 'staff-count', `${shifts}/${cap} 班`);\n    const bar = node('span', 'load-bar');\n    bar.setAttribute('aria-hidden', 'true');\n    bar.style.setProperty('--fill', `${cap ? shifts / cap * 100 : 0}%`);\n    bar.append(node('span'));\n    count.append(bar);\n    const skillNames = person.skills.map(id => index.skills.get(id)).join('、') || '未配置技能';\n    const note = person.unavailable.length ? `${skillNames} · 请假${person.unavailable.length}天` : skillNames;\n    control.append(avatar, node('span', 'staff-name', person.name), count, node('span', 'staff-note', note));\n    return control;\n  });\n  $('team-summary').textContent = `${controls.length} 位员工 · 点击卡片调整可排日期`;\n  $('people').replaceChildren(...controls);\n  if (prev) controls.find(control => control.dataset.staffId === prev)?.focus();\n}\n\nfunction render() {\n  const index = indexPlan();\n  renderCoverage(index);\n  renderCalendar(index);\n  renderSpotlight(index, true);\n  renderPeople(index);\n}\n\nfunction selectShift(id, focus = false) {\n  const index = indexPlan();\n  const shift = index.shifts.get(id);\n  if (!shift) return;\n  state.activeShift = id;\n  state.activeDay = shift.date;\n  renderCalendar(index);\n  renderSpotlight(index, true);\n  if (focus || matchMedia('(max-width: 920px)').matches) $('shift-title').focus();\n}\n\nfunction selectDay(date) {\n  const index = indexPlan();\n  if (!index.days.some(day => day.date === date)) return;\n  const shifts = [...index.shifts.values()].filter(shift => shift.date === date);\n  state.activeDay = date;\n  state.activeShift = (shifts.find(shift => index.gaps.has(shift.id)) ?? shifts[0])?.id || '';\n  renderCalendar(index);\n  renderSpotlight(index, true);\n}\n\nfunction loadSample(key, showNotice = true) {\n  state.readVersion += 1;\n  commit(structuredClone(key === 'absence' ? DEMO_ABSENCE : DEMO_BASE), key, { preferGap: key === 'absence', resetSelection: true });\n  if (showNotice) notice();\n}\n\nfunction toggleLock(staffId) {\n  const shiftId = state.activeShift;\n  const current = state.result.assignments.find(item => item.shiftId === shiftId && item.staffId === staffId);\n  if (!current) return;\n  const revised = structuredClone(state.problem);\n  revised.locks = current.locked ? revised.locks.filter(lock => lock.shiftId !== shiftId || lock.staffId !== staffId)\n    : [...revised.locks, { shiftId, staffId }];\n  try {\n    commit(revised, 'edited');\n    notice(current.locked ? '已解除锁定并重新求解。' : '已锁定此安排。后续重新求解会保留这个席位。');\n  } catch (error) {\n    notice(error.message, 'error');\n  }\n}\n\nfunction createOptions(container, values, selected, toId, create) {\n  const previouslyFocused = document.activeElement;\n  const controls = values.map(value => {\n    const control = create(value);\n    control.setAttribute('aria-pressed', String(selected === toId(value)));\n    return control;\n  });\n  const focusedIndex = [...container.children].indexOf(previouslyFocused);\n  const scrollTop = container.scrollTop;\n  container.replaceChildren(...controls);\n  container.scrollTop = scrollTop;\n  if (focusedIndex >= 0) controls[focusedIndex]?.focus();\n}\n\nfunction renderAbsenceEditor() {\n  const editor = state.editor;\n  const staff = state.problem.staff.find(person => person.id === editor.staffId);\n  createOptions($('absence-staff'), state.problem.staff, editor.staffId, person => person.id, person => {\n    const control = button('', person.name);\n    control.dataset.absenceStaff = person.id;\n    return control;\n  });\n  createOptions($('absence-date'), weekDays(state.problem.weekStart), editor.date, day => day.date, day => {\n    const control = button('');\n    control.dataset.absenceDate = day.date;\n    control.setAttribute('aria-label', `${day.weekday} ${shortDate(day)}`);\n    const date = node('time', '', `${day.month}/${day.day}`);\n    date.dateTime = day.date;\n    control.append(node('span', '', day.weekday), date);\n    return control;\n  });\n  $('absence-unavailable').checked = staff.unavailable.includes(editor.date);\n  $('absence-error').hidden = true;\n}\n\nfunction openAbsence(staffId = state.problem.staff[0].id) {\n  state.editor = { staffId, date: state.activeDay || state.problem.weekStart };\n  renderAbsenceEditor();\n  $('absence-dialog').showModal();\n}\n\nfunction applyAbsence(event) {\n  event.preventDefault();\n  const { staffId, date } = state.editor;\n  const updated = structuredClone(state.problem);\n  const staff = updated.staff.find(person => person.id === staffId);\n  const wasAbsent = staff.unavailable.includes(date);\n  const isAbsent = $('absence-unavailable').checked;\n  if (wasAbsent === isAbsent) {\n    $('absence-dialog').close();\n    return;\n  }\n  staff.unavailable = isAbsent ? [...staff.unavailable, date].sort() : staff.unavailable.filter(day => day !== date);\n  try {\n    const pinned = updated.locks.some(lock => lock.staffId === staffId && updated.shifts.find(shift => shift.id === lock.shiftId).date === date);\n    if (isAbsent && pinned) throw new Error(`${staff.name}当天有已锁定班次。请先解除该席位的锁定，再调整请假。`);\n    commit(updated, 'edited');\n    $('absence-dialog').close();\n    notice(isAbsent ? `已登记${staff.name}的请假并重新求解。` : `已恢复${staff.name}的可排日期并重新求解。`);\n  } catch (error) {\n    $('absence-error').textContent = error.message;\n    $('absence-error').hidden = false;\n  }\n}\n\nasync function importPlan() {\n  const input = $('import-workspace');\n  const file = input.files[0];\n  input.value = '';\n  if (!file) return;\n  const version = ++state.readVersion;\n  try {\n    if (file.size > MAX_INPUT_BYTES) throw new Error('文件超过 256 KiB，请导入更小的计划。');\n    const bytes = await file.arrayBuffer();\n    if (version !== state.readVersion) return;\n    let text;\n    try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }\n    catch { throw new Error('请上传使用 UTF-8 编码的 JSON 计划。'); }\n    const problem = parseRoster(text);\n    commit(problem, 'import', { preferGap: true, resetSelection: true });\n    notice(`已导入 ${file.name} 并生成排班。`);\n  } catch (error) {\n    if (version === state.readVersion) notice(error.message || '读取计划失败。', 'error');\n  }\n}\n\nfunction download(contents, mime, filename) {\n  const url = URL.createObjectURL(new Blob([contents], { type: mime }));\n  const link = node('a');\n  link.href = url;\n  link.download = filename;\n  document.body.append(link);\n  link.click();\n  link.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1000);\n}\n\n$('scenario-normal').addEventListener('click', () => loadSample('normal'));\n$('scenario-absence').addEventListener('click', () => loadSample('absence'));\n$('solve-roster').addEventListener('click', () => {\n  try {\n    commit(state.problem, state.source);\n    notice('已按当前技能、请假和锁定席位重新求解。');\n  } catch (error) {\n    notice(error.message, 'error');\n  }\n});\n$('pick-workspace').addEventListener('click', () => $('import-workspace').click());\n$('import-workspace').addEventListener('change', importPlan);\n$('export-workspace').addEventListener('click', () => {\n  download(`${JSON.stringify(state.problem, null, 2)}\\n`, 'application/json;charset=utf-8', `排班计划-${state.problem.weekStart}.json`);\n  notice('已保存计划 JSON，可重新导入或作为编辑模板。');\n});\n$('export-csv').addEventListener('click', () => {\n  try {\n    const draft = state.result.totals.missing > 0;\n    const name = draft ? '缺口草案' : '排班结果';\n    download(rosterCsv(state.problem, state.result), 'text/csv;charset=utf-8', `${name}-${state.problem.weekStart}.csv`);\n    notice(draft ? '已导出含空缺席位的草案。' : '已导出完整排班 CSV。');\n  } catch (error) {\n    notice(error.message, 'error');\n  }\n});\n$('jump-gap').addEventListener('click', () => {\n  const gaps = state.result.gaps;\n  const current = gaps.findIndex(gap => gap.shiftId === state.activeShift);\n  selectShift(gaps[(current + 1) % gaps.length].shiftId, true);\n});\n$('calendar').addEventListener('click', event => {\n  const control = event.target.closest('[data-shift-id]');\n  if (control) selectShift(control.dataset.shiftId);\n});\n$('day-strip').addEventListener('click', event => {\n  const control = event.target.closest('[data-day]');\n  if (control) selectDay(control.dataset.day);\n});\n$('assigned-list').addEventListener('click', event => {\n  const control = event.target.closest('[data-lock-staff]');\n  if (control) toggleLock(control.dataset.lockStaff);\n});\n$('edit-absence').addEventListener('click', () => openAbsence());\n$('people').addEventListener('click', event => {\n  const control = event.target.closest('[data-staff-id]');\n  if (control) openAbsence(control.dataset.staffId);\n});\nfor (const id of ['close-absence', 'cancel-absence']) $(id).addEventListener('click', () => $('absence-dialog').close());\n$('absence-form').addEventListener('submit', applyAbsence);\n$('absence-staff').addEventListener('click', event => {\n  const control = event.target.closest('[data-absence-staff]');\n  if (control) {\n    state.editor.staffId = control.dataset.absenceStaff;\n    renderAbsenceEditor();\n  }\n});\n$('absence-date').addEventListener('click', event => {\n  const control = event.target.closest('[data-absence-date]');\n  if (control) {\n    state.editor.date = control.dataset.absenceDate;\n    renderAbsenceEditor();\n  }\n});\n\ntry {\n  loadSample(absenceCase ? 'absence' : 'normal', false);\n} catch (error) {\n  notice(error.message, 'error');\n}\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#201a30\">\n  \u003cmeta name=\"description\" content=\"按客服技能、请假和每周上限生成一周安排。锁定已确认的班次，复核缺口并导出。\">\n  \u003ctitle>客服排班工作台\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip\" href=\"#calendar-title\">跳到排班表\u003c/a>\n  \u003cheader class=\"mast\">\n    \u003cdiv class=\"shell mast-inner\">\n      \u003ca class=\"identity\" href=\"./index.html\">\u003cspan class=\"brand-icon\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cstrong>客服排班工作台\u003c/strong>\u003c/a>\n      \u003cspan class=\"mast-section\">排班计划\u003c/span>\n      \u003cdiv class=\"file-actions\">\n        \u003cbutton class=\"text-button\" type=\"button\" id=\"pick-workspace\">导入计划\u003c/button>\n        \u003cbutton class=\"text-button\" type=\"button\" id=\"export-workspace\" disabled>保存计划\u003c/button>\n        \u003cinput type=\"file\" id=\"import-workspace\" accept=\".json,application/json\" hidden>\n      \u003c/div>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cmain class=\"shell main\" id=\"main\">\n    \u003csection class=\"hero\" aria-labelledby=\"work-title\">\n      \u003cdiv class=\"hero-copy\">\n        \u003cp class=\"week-label\" id=\"week-range\">\u003c/p>\n        \u003ch1 id=\"work-title\">周排班计划\u003c/h1>\n        \u003cp class=\"hero-description\">按技能和可用日期安排坐席，在确认排班前核对缺口。\u003c/p>\n        \u003cdiv class=\"hero-actions\">\n          \u003cbutton class=\"button primary\" id=\"solve-roster\" type=\"button\" disabled>重新求解\u003c/button>\n          \u003cbutton class=\"button on-dark\" id=\"export-csv\" type=\"button\" disabled>导出排班 CSV \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"hero-status\" id=\"coverage\" data-status=\"ready\">\n        \u003cdiv class=\"coverage-label\">\u003cspan class=\"coverage-dot\" aria-hidden=\"true\">\u003c/span> 班次覆盖 \u003cspan id=\"coverage-status\">\u003c/span>\u003c/div>\n        \u003cdl class=\"coverage-numbers\">\n          \u003cdiv class=\"coverage-total\">\u003cdt>已排 / 需求人次\u003c/dt>\u003cdd>\u003cspan id=\"assigned-total\">–\u003c/span>\u003cspan class=\"coverage-divider\"> / \u003c/span>\u003cspan id=\"needed-total\">–\u003c/span>\u003c/dd>\u003c/div>\n          \u003cdiv>\u003cdt>待补人次\u003c/dt>\u003cdd id=\"missing-total\">–\u003c/dd>\u003c/div>\n          \u003cdiv>\u003cdt>已锁定\u003c/dt>\u003cdd id=\"locked-total\">–\u003c/dd>\u003c/div>\n        \u003c/dl>\n        \u003cdiv class=\"progress\" id=\"coverage-progress\" role=\"progressbar\" aria-label=\"班次覆盖进度\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\">\u003cspan>\u003c/span>\u003c/div>\n        \u003cp class=\"coverage-note\" id=\"coverage-note\">\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"scenario-bar\" aria-label=\"切换排班场景\">\n      \u003cdiv class=\"scenario-group\" role=\"group\" aria-label=\"样例场景\">\n        \u003cbutton type=\"button\" id=\"scenario-normal\" aria-pressed=\"true\">常规排班\u003c/button>\n        \u003cbutton type=\"button\" id=\"scenario-absence\" aria-pressed=\"false\">临时请假\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"scenario-current\">\u003cspan id=\"scenario-name\">\u003c/span>\u003cspan class=\"scenario-local\" id=\"scenario-source\">样例计划\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"notice\" id=\"notice\" role=\"status\" hidden>\u003c/p>\n\n    \u003cdiv class=\"workspace\">\n      \u003csection class=\"panel schedule\" aria-labelledby=\"calendar-title\">\n        \u003cdiv class=\"panel-heading\">\n          \u003cdiv>\u003ch2 id=\"calendar-title\" tabindex=\"-1\">一周班表\u003c/h2>\u003cp>点击班次查看人员和覆盖情况\u003c/p>\u003c/div>\n          \u003cbutton type=\"button\" class=\"button outline gap-toggle\" id=\"jump-gap\" hidden>查看缺口 \u003cspan aria-hidden=\"true\">↘\u003c/span>\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"day-strip\" id=\"day-strip\" role=\"group\" aria-label=\"选择一天\">\u003c/div>\n        \u003cdiv id=\"calendar\" class=\"calendar\">\u003c/div>\n        \u003cdiv class=\"calendar-key\" aria-label=\"班次图例\">\u003cspan>\u003ci aria-hidden=\"true\" class=\"key-covered\">\u003c/i>已排满\u003c/span>\u003cspan>\u003ci aria-hidden=\"true\" class=\"key-gap\">\u003c/i>有缺口\u003c/span>\u003cspan>\u003ci aria-hidden=\"true\" class=\"key-locked\">\u003c/i>锁定席位\u003c/span>\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"panel spotlight\" aria-labelledby=\"shift-title\" id=\"spotlight\">\n        \u003cdiv class=\"spotlight-heading\">\u003cp class=\"overline\">班次详情\u003c/p>\u003ch2 id=\"shift-title\" tabindex=\"-1\">选择班次\u003c/h2>\u003cp class=\"shift-meta\" id=\"shift-meta\">\u003c/p>\u003cp class=\"skill-pill\" id=\"shift-skill\" hidden>\u003c/p>\u003c/div>\n        \u003cp class=\"shift-status\" id=\"shift-status\" hidden>\u003c/p>\n        \u003cdiv class=\"spotlight-section\" id=\"assigned-section\" hidden>\n          \u003ch3>已安排人员 \u003cspan id=\"assigned-count\">\u003c/span>\u003c/h3>\n          \u003cdiv id=\"assigned-list\">\u003c/div>\n        \u003c/div>\n        \u003cdetails class=\"candidates\" id=\"candidate-details\" hidden>\n          \u003csummary>\u003cspan>查看其他候选人\u003c/span>\u003cspan id=\"candidate-count\">\u003c/span>\u003c/summary>\n          \u003cp id=\"candidate-note\">\u003c/p>\n          \u003cul id=\"candidate-list\">\u003c/ul>\n        \u003c/details>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"panel team\" aria-labelledby=\"people-title\">\n      \u003cdiv class=\"panel-heading\">\u003cdiv>\u003ch2 id=\"people-title\">人员负荷\u003c/h2>\u003cp id=\"team-summary\">\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"button outline\" id=\"edit-absence\" disabled>调整请假\u003c/button>\u003c/div>\n      \u003cdiv id=\"people\" class=\"people\">\u003c/div>\n    \u003c/section>\n    \u003cfooter class=\"foot\">\u003cp>计划在当前浏览器内处理。关闭页面前可保存计划文件。\u003c/p>\u003c/footer>\n  \u003c/main>\n\n  \u003cdialog id=\"absence-dialog\" aria-labelledby=\"absence-title\">\n    \u003cform id=\"absence-form\" class=\"absence-form\">\n      \u003cdiv class=\"dialog-head\">\u003ch2 id=\"absence-title\">调整请假\u003c/h2>\u003cbutton type=\"button\" class=\"button icon-button\" id=\"close-absence\" aria-label=\"关闭请假窗口\">×\u003c/button>\u003c/div>\n      \u003cp>应用后重新求解，已锁定的安排会保留。\u003c/p>\n      \u003cfieldset>\u003clegend>员工\u003c/legend>\u003cdiv class=\"option-grid\" id=\"absence-staff\">\u003c/div>\u003c/fieldset>\n      \u003cfieldset>\u003clegend>日期\u003c/legend>\u003cdiv class=\"option-grid dates\" id=\"absence-date\">\u003c/div>\u003c/fieldset>\n      \u003clabel class=\"absence-check\">\u003cinput type=\"checkbox\" id=\"absence-unavailable\"> 当天不可排班\u003c/label>\n      \u003cp id=\"absence-error\" class=\"dialog-error\" role=\"alert\" hidden>\u003c/p>\n      \u003cdiv class=\"dialog-actions\">\u003cbutton type=\"button\" class=\"button outline\" id=\"cancel-absence\">取消\u003c/button>\u003cbutton type=\"submit\" class=\"button dark\" id=\"save-absence\">应用并重算\u003c/button>\u003c/div>\n    \u003c/form>\n  \u003c/dialog>\n  \u003cnoscript>\u003cp class=\"shell\">请启用 JavaScript，在当前浏览器生成排班计划。\u003c/p>\u003c/noscript>\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --paper: #f5f2ee;\n  --white: #fffdfa;\n  --text: #242033;\n  --muted: #625b6e;\n  --line: #e4dce6;\n  --plum: #4b3a70;\n  --lilac: #dbc9ff;\n  --pale-plum: #f2edf9;\n  --orchid: #8066a8;\n  --night: #211a32;\n  --gap: #8c461c;\n  --pale-gap: #fff0e3;\n  --clear: #2e614e;\n  --pale-clear: #e7f2ea;\n  --heading: 'Noto Serif CJK SC', 'Source Han Serif SC', 'Songti SC', STSong, SimSun, serif;\n  --body: 'PingFang SC', 'Microsoft YaHei UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;\n  --numbers: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;\n  font-family: var(--body);\n  font-size: 14px;\n}\n\n*, *::after, *::before { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody { margin: 0; color: var(--text); background: var(--paper); }\nh1, h2, h3, p, dl, dd { margin: 0; }\nbutton, select, input { font: inherit; }\nbutton { cursor: pointer; }\nbutton:disabled { cursor: default; opacity: .58; }\nbutton:focus-visible, a:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #7956b5; outline-offset: 3px; }\n.hero button:focus-visible, .mast a:focus-visible, .mast button:focus-visible { outline-color: #efdbff; }\na { color: inherit; }\n.shell { width: min(1392px, 100% - 64px); margin-inline: auto; }\n.skip { position: absolute; inset: 8px auto auto 8px; background: var(--white); color: var(--text); padding: 10px; z-index: 4; transform: translateY(-180%); }\n.skip:focus { transform: none; }\n\n.mast { background: var(--night); color: #fffcff; border-bottom: 1px solid #51425f; }\n.mast-inner { display: flex; align-items: center; min-height: 58px; gap: 21px; }\n.identity { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; letter-spacing: .04em; white-space: nowrap; }\n.identity strong { font-weight: 690; }\n.brand-icon { display: grid; width: 29px; height: 29px; grid-template-columns: repeat(2, 5px); place-content: center; gap: 3px; background: #433456; border: 1px solid #66567b; border-radius: 8px; }\n.brand-icon i { width: 5px; height: 5px; border-radius: 1px; background: #f2e4ff; }\n.brand-icon i:last-child { background: #e6a880; }\n.mast-section { font-size: 12px; color: #d0c2e0; border-left: 1px solid #544666; padding-left: 17px; }\n.file-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }\n.text-button { padding: 8px 10px; border: 1px solid transparent; border-radius: 5px; color: #f4ebfc; background: transparent; white-space: nowrap; font-size: 12px; }\n.text-button:hover { background: #40324e; border-color: #665476; }\n.main { padding-top: 30px; }\n\n.hero { color: #faf4ff; border-radius: 15px; padding: 28px 34px 30px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 96% 10%, #473452 0, transparent 55%), linear-gradient(120deg, #241a37, #29213e 75%); border: 1px solid #4e3f64; display: grid; grid-template-columns: 1.15fr minmax(290px, .85fr); align-items: center; gap: 28px; }\n.hero::before { content: ''; pointer-events: none; position: absolute; width: 360px; height: 360px; right: -214px; top: -192px; border-radius: 50%; border: 1px solid #aa91cb3b; box-shadow: 0 0 0 14px #c1a7df0c, 0 0 0 31px #c1a7df0a, 0 0 0 49px #c1a7df08; }\n.hero-copy, .hero-status { position: relative; min-width: 0; }\n.week-label { color: #ded0f2; font: 650 13px/1.4 var(--numbers); letter-spacing: .09em; }\n.hero h1 { margin-top: 8px; font: 700 clamp(34px, 3.25vw, 53px)/1.17 var(--heading); letter-spacing: .065em; text-wrap: balance; overflow-wrap: anywhere; }\n.hero-description { margin-top: 11px; color: #e0d5ec; font-size: 13px; line-height: 1.65; }\n.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 19px; }\n.button { min-height: 34px; padding: 7px 12px; border: 1px solid transparent; border-radius: 6px; font-weight: 620; white-space: nowrap; }\n.button:not(:disabled):hover { filter: brightness(.94); }\n.button.primary { color: #292039; border-color: #e5d4ff; background: #e6d5ff; }\n.button.on-dark { border-color: #7c668e; background: #362843; color: #faf3ff; }\n.button.on-dark[data-draft='true'] { color: #ffcca0; border-color: #906955; }\n.button.outline { background: var(--white); border-color: #cfc2da; color: #4c3567; }\n.button.dark { background: #493567; color: #fff9ff; }\n.hero-status { background: #1b1529b5; border: 1px solid #786189; border-radius: 10px; padding: 17px 19px 14px; }\n.coverage-label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 650; color: #eaddfa; }\n.coverage-dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: #8bdbb2; box-shadow: 0 0 0 3px #75dca626; }\n.hero-status[data-status='gap'] .coverage-dot { background: #f4b887; box-shadow: 0 0 0 3px #ffc29725; }\n#coverage-status { margin-left: auto; color: #aee6bf; font-size: 11px; }\n.hero-status[data-status='gap'] #coverage-status, .hero-status[data-status='gap'] #missing-total { color: #ffc69d; }\n.coverage-numbers { margin-top: 10px; display: grid; grid-template-columns: 1.3fr .84fr .74fr; gap: 10px; }\n.coverage-numbers div { display: flex; flex-direction: column-reverse; gap: 3px; }\n.coverage-numbers div + div { border-left: 1px solid #675574; padding-left: 12px; }\n.coverage-numbers dt { color: #d9cbe6; font-size: 10px; white-space: nowrap; }\n.coverage-numbers dd { font: 650 clamp(22px, 3.05vw, 43px)/1.05 var(--numbers); letter-spacing: -.045em; white-space: nowrap; font-variant-numeric: tabular-nums; }\n.coverage-divider, #needed-total { color: #c6addd; font-size: .64em; }\n.progress { margin-top: 13px; height: 4px; border-radius: 4px; background: #6f4f4b; overflow: hidden; }\n.progress span { height: 100%; width: var(--fill, 0%); display: block; border-radius: 4px; background: linear-gradient(90deg, #a086d3, #e1c3fc); }\n.coverage-note { margin-top: 8px; color: #e4dbef; font-size: 11px; line-height: 1.55; }\n\n.scenario-bar { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-block: 20px 15px; }\n.scenario-group { display: flex; width: max-content; border: 1px solid #ded4e1; background: #ede7ed; padding: 3px; border-radius: 8px; }\n.scenario-group button { padding: 7px 13px; border: 1px solid transparent; border-radius: 5px; background: transparent; font-size: 12px; color: #5c4e68; white-space: nowrap; }\n.scenario-group button[aria-pressed='true'] { border-color: #e0d7e6; background: #fffdfb; color: #49365c; font-weight: 720; box-shadow: 0 1px 2px #30223f12; }\n.scenario-group button:hover { color: #352044; }\n.scenario-current { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 12px; font-weight: 670; text-align: right; min-width: 0; }\n#scenario-name { overflow-wrap: anywhere; }\n.scenario-local { display: inline-block; padding: 4px 8px; border-radius: 5px; background: #eee7ef; border: 1px solid #e0d6e5; color: #59466a; white-space: nowrap; font-size: 10px; font-weight: 600; }\n.notice { padding: 8px 11px; margin: 0 0 13px; color: #3c5260; background: #e9f0ee; border: 1px solid #d4e0d5; border-radius: 6px; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }\n.notice[data-tone='error'] { background: #fff0e9; color: var(--gap); border-color: #edc7b0; }\n\n.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(266px, 307px); align-items: start; gap: 16px; }\n.panel { min-width: 0; background: var(--white); border: 1px solid #e3dce5; box-shadow: 0 1px 2px #32203c07; border-radius: 12px; }\n.schedule { padding: 19px 18px 15px; }\n.panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; }\n.panel-heading h2, .spotlight h2 { font: 700 24px/1.2 var(--heading); letter-spacing: .03em; overflow-wrap: anywhere; }\n.panel-heading p { margin-top: 5px; font-size: 11px; line-height: 1.45; color: var(--muted); }\n.gap-toggle { color: var(--gap) !important; background: var(--pale-gap) !important; border-color: #eacbb4 !important; }\n.calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 14px; border: 1px solid #e4dae8; border-radius: 8px; overflow: hidden; min-width: 0; }\n.day { min-width: 0; min-height: 180px; background: #fffdfb; }\n.day + .day { border-left: 1px solid #ece4ed; }\n.day.weekend { background: #faf7fa; }\n.day-head { min-height: 51px; display: flex; align-items: center; justify-content: space-between; padding: 7px 8px; gap: 3px; border-bottom: 1px solid #e7ddea; background: #f3eef7; }\n.day-weekday { color: #685878; font-size: 11px; white-space: nowrap; letter-spacing: .015em; }\n.day-number { font: 650 19px/1 var(--numbers); white-space: nowrap; font-variant-numeric: tabular-nums; }\n.day.has-gap .day-head { background: #fae8da; border-color: #ead6c7; color: #733d20; }\n.day.has-gap .day-weekday { color: #743e21; }\n.day-shifts { display: grid; gap: 6px; align-content: start; padding: 7px 5px; }\n.shift { display: grid; align-content: space-between; text-align: left; min-width: 0; min-height: 83px; gap: 3px; border: 1px solid #e4dbea; border-left: 2px solid #ae9ac4; border-radius: 6px; background: #f8f4fa; padding: 6px 5px; color: var(--text); }\n.shift:hover { background: #eee5f4; border-color: #b7a0cc; }\n.shift[aria-pressed='true'] { box-shadow: inset 0 0 0 1px #8d72b1; border-color: #8d72b1; background: #eee5f6; }\n.shift[data-gap='true'] { border-color: #eac0a3; border-left-color: #c37c4b; background: var(--pale-gap); }\n.shift[data-gap='true'][aria-pressed='true'] { border-color: #b46b3e; box-shadow: inset 0 0 0 1px #b46b3e; }\n.shift-name { font-size: 12px; line-height: 1.3; font-weight: 750; overflow-wrap: anywhere; }\n.shift-time, .shift-people { line-height: 1.3; color: #5d506e; font-size: 10px; overflow-wrap: anywhere; }\n.shift-time { font-family: var(--numbers); }\n.shift-people { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }\n.shift-fill { color: #58436f; font: 650 10px/1.2 var(--numbers); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }\n.shift[data-gap='true'] .shift-fill { color: #893e19; }\n.mini-lock { display: inline-block; width: 7px; height: 5px; border-radius: 1px; border: 1px solid currentColor; position: relative; margin-left: auto; margin-right: 2px; }\n.mini-lock::before { content: ''; display: block; width: 5px; height: 4px; position: absolute; top: -4px; left: 0; border: 1px solid currentColor; border-bottom: 0; border-radius: 4px 4px 0 0; }\n.no-shifts { padding: 7px; color: var(--muted); font-size: 11px; }\n.calendar-key { color: #65576e; font-size: 11px; display: flex; flex-wrap: wrap; gap: 11px; margin-top: 11px; }\n.calendar-key span { display: inline-flex; align-items: center; gap: 4px; }\n.calendar-key i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; background: #dfd2ed; border: 1px solid #b09ac8; }\n.calendar-key .key-gap { background: #f9d9c2; border-color: #cb9672; }\n.calendar-key .key-locked { height: 7px; background: #6b527c; border-color: #6b527c; }\n.day-strip { display: none; }\n\n.spotlight { padding: 16px; }\n.spotlight-heading { position: relative; border-bottom: 1px solid #ece3ec; padding-bottom: 10px; }\n.overline { font-size: 11px; color: #645070; font-weight: 700; letter-spacing: .06em; margin-bottom: 6px; }\n.spotlight h2 { font-size: 22px; }\n.shift-meta { margin-top: 5px; color: #695e74; font: 500 12px/1.5 var(--numbers); overflow-wrap: anywhere; }\n.skill-pill { margin-top: 6px; color: #634578; font-size: 11px; overflow-wrap: anywhere; }\n.shift-status { margin-top: 9px; border-radius: 6px; color: #3d5b4d; background: #eaf2eb; padding: 6px 8px; font-size: 11px; line-height: 1.45; }\n.shift-status[data-gap='true'] { color: #7a3c19; background: #fbe9db; border: 1px solid #f1d8c6; }\n.spotlight-section { padding-top: 10px; }\n.spotlight-section h3 { display: flex; justify-content: space-between; align-items: center; font-size: 12px; gap: 8px; }\n.spotlight-section h3 span, #candidate-count { color: #66586d; font: 600 11px/1.3 var(--numbers); }\n.assigned-row { display: flex; align-items: center; gap: 7px; padding: 7px 0 0; }\n.avatar { flex: 0 0 auto; display: inline-grid; place-items: center; min-width: 25px; height: 25px; padding: 0 4px; border-radius: 6px; color: #583e75; background: #eee3f3; font-size: 12px; font-weight: 700; }\n.assigned-name { font-size: 12px; font-weight: 680; overflow-wrap: anywhere; }\n.lock-button { margin-left: auto; background: #fffdfb; border: 1px solid #d6c6df; border-radius: 5px; color: #634677; padding: 4px 6px; min-height: 28px; white-space: nowrap; font-size: 11px; }\n.lock-button[aria-pressed='true'] { background: #eee4f4; border-color: #c7aed6; }\n.lock-button:hover { background: #eee4f4; }\n.assigned-empty { color: #67576e; font-size: 11px; margin: 6px 0 0; line-height: 1.4; }\n.candidates { margin-top: 11px; border-top: 1px solid #ece3ec; padding-top: 8px; }\n.candidates summary { display: flex; justify-content: space-between; gap: 6px; cursor: pointer; list-style: none; color: #4e395f; font-size: 12px; font-weight: 680; }\n.candidates summary::-webkit-details-marker { display: none; }\n.candidates summary span:first-child::after { content: '⌄'; display: inline-block; margin-left: 4px; }\n.candidates[open] summary span:first-child::after { transform: rotate(180deg); }\n.candidates p { margin-block: 7px 4px; line-height: 1.5; color: #695c72; font-size: 11px; }\n.candidates ul { max-height: 191px; overflow: auto; scrollbar-color: #c1acd3 transparent; margin: 0; padding: 0 4px 0 0; list-style: none; }\n.candidate-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 5px 0; border-top: 1px solid #ede6ee; font-size: 11px; }\n.candidate-row span { overflow-wrap: anywhere; }\n.reason-chip { flex: 0 0 auto; border-radius: 4px; color: #5e526a; background: #f0edf2; padding: 3px 5px; font-size: 10px; white-space: nowrap; }\n.reason-chip[data-reason='unavailable'] { color: #82461f; background: #fae6d7; }\n.reason-chip[data-reason='eligible'] { color: #365e4a; background: #e9f1e8; }\n\n.team { margin-top: 15px; padding: 16px 18px 18px; }\n.people { margin-top: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }\n.staff { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto auto; align-items: center; gap: 4px 6px; min-width: 0; min-height: 52px; padding: 7px; border: 1px solid #ebe3ec; border-radius: 7px; color: var(--text); text-align: left; background: #fbf7fb; }\n.staff:hover { border-color: #bba4cf; }\n.staff .avatar { grid-row: 1 / 3; }\n.staff-name { font-weight: 700; font-size: 12px; overflow-wrap: anywhere; }\n.staff-count { font: 650 12px/1 var(--numbers); color: #5e477d; white-space: nowrap; }\n.staff-note { grid-column: 2 / 4; color: #675c71; font-size: 10px; overflow-wrap: anywhere; }\n.load-bar { margin-left: auto; width: 26px; height: 3px; margin-top: 3px; border-radius: 5px; background: #ddd2e6; display: block; overflow: hidden; }\n.load-bar span { width: var(--fill, 0%); display: block; height: 100%; background: #9276b9; border-radius: 5px; }\n.foot { color: #685f71; font-size: 11px; padding: 18px 0 24px; }\n\n#absence-dialog { width: min(430px, 100% - 26px); padding: 0; border: 1px solid #ded2e5; border-radius: 13px; color: var(--text); background: var(--white); box-shadow: 0 20px 70px #27203342; }\n#absence-dialog::backdrop { background: #1a132b9c; }\n.absence-form { padding: 19px; display: grid; gap: 11px; }\n.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }\n.dialog-head h2 { font: 700 24px/1.3 var(--heading); }\n.dialog-head .icon-button { font-size: 20px; line-height: 1; padding: 2px; width: 34px; border-color: #e5dceb; background: #f4edf6; color: #54386f; }\n.absence-form p { color: #63526c; font-size: 12px; line-height: 1.5; }\n.absence-form label { display: grid; gap: 5px; color: #524060; font-size: 12px; font-weight: 680; }\n.absence-form fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }\n.absence-form legend { margin-bottom: 5px; color: #524060; font-size: 12px; font-weight: 680; }\n.option-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; max-height: 145px; overflow: auto; padding: 2px; }\n.option-grid.dates { grid-template-columns: repeat(7, minmax(0, 1fr)); }\n.option-grid button { display: grid; justify-items: center; gap: 2px; background: #faf6fc; color: #59436a; border: 1px solid #e0d6e8; border-radius: 5px; min-height: 34px; padding: 5px 2px; font-size: 11px; overflow-wrap: anywhere; min-width: 0; }\n.option-grid button[aria-pressed='true'] { color: #4a3159; border-color: #aa8abb; background: #eee1f5; font-weight: 700; }\n.option-grid button:hover { border-color: #ac8bbd; }\n.option-grid button:focus-visible { outline-offset: -1px; }\n.option-grid time { font: 650 11px/1.1 var(--numbers); }\n.absence-form .absence-check { display: inline-flex; align-items: center; width: max-content; max-width: 100%; }\n.absence-check input { accent-color: #704d91; }\n.absence-form .dialog-error { color: #91471c; padding: 7px; background: #ffeddc; border: 1px solid #f5d5b9; border-radius: 5px; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: 7px; }\n\n@media (max-width: 1120px) {\n  .shell { width: calc(100% - 38px); }\n  .schedule { padding-inline: 12px; }\n  .workspace { grid-template-columns: minmax(0, 1fr) minmax(240px, 270px); gap: 12px; }\n  .day-head { padding-inline: 4px; }\n  .day-shifts { padding-inline: 3px; }\n  .day-number { font-size: 17px; }\n}\n\n@media (max-width: 920px) {\n  .workspace { grid-template-columns: minmax(0, 1fr); }\n  .spotlight { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; align-items: start; }\n  .spotlight-heading { grid-column: 1 / -1; }\n  .shift-status { grid-column: 1 / -1; }\n  .candidates { border-top: 0; margin-top: 2px; }\n  .hero { padding-inline: 25px; }\n  .day-head { padding-inline: 8px; }\n  .day-shifts { padding-inline: 5px; }\n}\n\n@media (max-width: 640px) {\n  .shell { width: calc(100% - 26px); }\n  .mast-inner { gap: 6px; min-height: 52px; }\n  .mast-section { display: none; }\n  .identity { font-size: 12px; letter-spacing: 0; gap: 5px; }\n  .brand-icon { width: 25px; height: 25px; }\n  .file-actions { gap: 0; }\n  .text-button { font-size: 11px; padding-inline: 5px; }\n  .main { padding-top: 15px; }\n  .hero { grid-template-columns: minmax(0, 1fr); padding: 17px 14px; gap: 12px; border-radius: 10px; }\n  .hero h1 { font-size: clamp(29px, 8vw, 39px); margin-top: 5px; }\n  .hero-description { margin-top: 6px; font-size: 11px; }\n  .hero-actions { margin-top: 11px; }\n  .hero-status { padding: 10px 11px; }\n  .coverage-numbers { margin-top: 7px; }\n  .coverage-numbers dd { font-size: 27px; }\n  .progress { margin-top: 9px; }\n  .scenario-bar { margin-block: 11px; align-items: flex-start; }\n  .scenario-current { font-size: 11px; padding-top: 5px; }\n  .scenario-local { display: none; }\n  .scenario-group button { padding-inline: 7px; }\n  .workspace { gap: 10px; }\n  .schedule, .spotlight, .team { padding: 13px 11px; border-radius: 9px; }\n  .panel-heading h2, .spotlight h2 { font-size: 21px; }\n  .day-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-top: 10px; }\n  .day-select { display: grid; justify-items: center; gap: 2px; padding: 4px 0 5px; min-height: 40px; border: 1px solid #e9deeb; border-radius: 5px; color: #5b4968; background: #f7f2f8; font-size: 10px; }\n  .day-select time { font: 650 14px/1 var(--numbers); }\n  .day-select[data-gap='true'] { border-color: #e2af90; background: var(--pale-gap); color: var(--gap); }\n  .day-select[aria-pressed='true'] { border-color: #966cae; background: #ecdff3; color: #49305a; }\n  .day-select[data-gap='true'][aria-pressed='true'] { border-color: #bd8054; background: #f8dfcb; color: #6f3a1d; }\n  .calendar { display: block; margin-top: 6px; }\n  .day:not(.selected-day) { display: none; }\n  .day { min-height: 0; }\n  .day + .day { border-left: 0; }\n  .day-head { min-height: 0; padding: 5px 8px; justify-content: flex-start; gap: 5px; }\n  .day-number { font-size: 13px; }\n  .day-shifts { grid-template-columns: 1fr 1fr; }\n  .shift { min-height: 70px; padding: 6px; }\n  .people { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n\n@media (max-width: 370px) {\n  .spotlight { display: block; }\n  .candidates { margin-top: 11px; border-top: 1px solid #ece3ec; }\n  .scenario-bar { gap: 6px; }\n  .scenario-group button { padding-inline: 5px; }\n  .button { padding-inline: 9px; font-size: 12px; }\n}\n\n@media (prefers-reduced-motion: no-preference) {\n  .button, .shift, .day-select, .text-button, .staff { transition: background-color .14s, border-color .14s, filter .14s; }\n}\n","group":"前端"},{"path":"tests/cli.test.mjs","text":"import assert from 'node:assert/strict';\nimport { spawnSync } from 'node:child_process';\nimport { mkdtemp, readFile, rm, stat, writeFile } from 'node:fs/promises';\nimport { tmpdir } from 'node:os';\nimport { dirname, join, resolve } from 'node:path';\nimport test from 'node:test';\nimport { fileURLToPath } from 'node:url';\nimport { MAX_INPUT_BYTES } from '../engine.mjs';\nimport { DEMO_BASE } from '../fixtures.mjs';\n\nconst cli = fileURLToPath(new URL('../cli.mjs', import.meta.url));\n\nfunction invoke(...parameters) {\n  const run = spawnSync(process.execPath, [cli, ...parameters], { encoding: 'utf8', timeout: 5_000 });\n  assert.ifError(run.error);\n  assert.equal(run.signal, null);\n  return run;\n}\n\nasync function temporary(t) {\n  const path = await mkdtemp(join(tmpdir(), 'support-roster-cli-'));\n  assert.equal(dirname(path), resolve(tmpdir()));\n  t.after(() => rm(path, { recursive: true, force: true }));\n  return path;\n}\n\ntest('demo produces stable JSON and help documents the exit contract', () => {\n  const first = invoke('--demo');\n  const second = invoke('--demo');\n  assert.equal(first.status, 0, first.stderr);\n  assert.equal(second.status, 0, second.stderr);\n  const report = JSON.parse(first.stdout);\n  assert.equal(report.totals.requested, 21);\n  assert.equal(report.totals.assigned, 21);\n  assert.equal(report.totals.missing, 0);\n  assert.deepEqual(report.gaps, []);\n  assert.equal(report.assignments.length, 21);\n  assert.equal(new Set(report.assignments.map(item => `${item.shiftId},${item.staffId}`)).size, 21);\n  assert.equal(first.stdout, second.stdout);\n  const help = invoke('--help');\n  assert.equal(help.status, 0, help.stderr);\n  assert.match(help.stdout, /2 表示存在缺口/);\n  assert.match(help.stdout, /256 KiB/);\n});\n\ntest('a missing specialist produces a diagnostic report without creating an output file', async t => {\n  const root = await temporary(t);\n  const output = join(root, 'plan.csv');\n  const unattended = invoke('--demo', '--absence');\n  const withOutput = invoke('--demo', '--absence', '--out', output);\n  assert.equal(unattended.status, 2, unattended.stderr);\n  assert.equal(withOutput.status, 2, withOutput.stderr);\n  assert.equal(unattended.stdout, withOutput.stdout);\n  assert.match(withOutput.stderr, /缺 1 个/);\n  const report = JSON.parse(withOutput.stdout);\n  assert.equal(report.totals.requested, 21);\n  assert.equal(report.totals.assigned, 20);\n  assert.equal(report.totals.missing, 1);\n  assert.equal(report.gaps.length, 1);\n  assert.equal(report.gaps[0].missing, 1);\n  assert(report.gaps[0].reasons.some(reason => reason.kind === 'unavailable'));\n  await assert.rejects(stat(output), { code: 'ENOENT' });\n});\n\ntest('real JSON with a UTF-8 BOM yields formula-safe CSV and preserves the source', async t => {\n  const root = await temporary(t);\n  const input = join(root, '请输入排班.json');\n  const output = join(root, '班表.csv');\n  const problem = structuredClone(DEMO_BASE);\n  problem.staff[0].name = '=1+1';\n  const text = '\\ufeff' + JSON.stringify(problem);\n  await writeFile(input, text, 'utf8');\n  const run = invoke('--input', input, '--out', output);\n  assert.equal(run.status, 0, run.stderr);\n  const report = JSON.parse(run.stdout);\n  assert.equal(report.totals.assigned, 21);\n  assert(report.assignments.some(item => item.staffId === problem.staff[0].id));\n  assert(!run.stdout.includes('=1+1'));\n  const csv = await readFile(output, 'utf8');\n  assert(csv.startsWith('\\ufeff'));\n  assert.match(csv, /'=1\\+1/);\n  assert.doesNotMatch(csv, /(?:^|,)\"?=1\\+1/);\n  assert.equal((csv.match(/\\r?\\n/g) || []).length, 22);\n  assert.equal(await readFile(input, 'utf8'), text);\n});\n\ntest('preexisting output and same-file input are never overwritten', async t => {\n  const root = await temporary(t);\n  const existing = join(root, '已有文件.csv');\n  const original = join(root, '排班数据.json');\n  const json = JSON.stringify(DEMO_BASE);\n  await writeFile(existing, 'do not replace', 'utf8');\n  await writeFile(original, json, 'utf8');\n  for (const [path, expected] of [[existing, 'do not replace'], [original, json]]) {\n    const run = invoke('--input', original, '--out', path);\n    assert.equal(run.status, 1);\n    assert.match(run.stderr, /输出已存在/);\n    assert.equal(await readFile(path, 'utf8'), expected);\n  }\n});\n\ntest('invalid input and arguments do not create a spreadsheet', async t => {\n  const root = await temporary(t);\n  const input = join(root, 'invalid.json');\n  const output = join(root, 'should-not-write.csv');\n  const oversized = join(root, 'large.json');\n  const incorrectEncoding = join(root, 'broken-utf8.json');\n  await writeFile(input, '{\"name\":bad-json}', 'utf8');\n  await writeFile(oversized, Buffer.alloc(MAX_INPUT_BYTES + 1, 0x20));\n  await writeFile(incorrectEncoding, Buffer.from([0x22, 0xff, 0x22]));\n  for (const [path, expected] of [[input, /JSON/], [oversized, /256 KiB/], [incorrectEncoding, /UTF-8/]]) {\n    const run = invoke('--input', path, '--out', output);\n    assert.equal(run.status, 1);\n    assert.match(run.stderr, expected);\n    assert(!run.stderr.includes(
