<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify temporary access\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build:demo\n","group":"配置与启动"},{"path":".gitignore","text":"/data/\n/dist/\n/node_modules/\n*.sqlite\n*.sqlite-wal\n*.sqlite-shm\n*.sqlite3\n*.sqlite3-wal\n*.sqlite3-shm\n.env\nteam.local.json\n","group":"配置与启动"},{"path":"README.md","text":"# 企业临时权限工作台\n\n审批人按报表批准临时访问。申请人可在到期前查看报表或提前归还访问权，负责人也可主动撤销。到期后即使保存了原地址，服务也会按本次请求的身份、资源和时间重新鉴权。审计人员可查看申请、决定、权限结束及报表访问记录。\n\n[在线演练](https://fate788.github.io/personal-blog/demos/access/) · [博客作品页](https://fate788.github.io/personal-blog/#project/access)\n\n![申请人工作台](docs/preview.webp)\n\n## 运行\n\n安装 Node.js 22.13 或以上，不需要安装项目依赖。\n\n```sh\nnode server.mjs --port 8801\nnpm test\n```\n\n打开 [本机工作台](http://127.0.0.1:8801/)。Windows 也可以双击 `start-access.cmd`。\n\n| 运行方式 | 身份和数据 | 时间 |\n| --- | --- | --- |\n| 公开演练与离线 HTML | 虚构人员及报表，保存到访客浏览器的 IndexedDB | 可推进演练时间 |\n| Node.js 演练服务 | 服务端 SQLite，每个访客会话得到独立的虚构工作区 | 可推进工作区的演练时间 |\n| Node.js 团队服务 | 登录后的团队账号，读取配置内的私有报表，操作记录保存在 SQLite | 服务器实际时间 |\n\n## 演练\n\n1. 以申请人身份打开区域经营周报，确认还没有访问权。\n2. 填写复盘用途和 15 分钟访问时长。切换为资源负责人，打开待审批申请并批准。\n3. 切回申请人，访问同一份报表，核对可见的数据和结束时间。\n4. 推进演练时间至少 15 分钟，再次打开同一份报表。切换到审计角色，核对申请、审批、成功读取、到期和再次读取被拒绝的记录。\n\n## 团队试用\n\n复制 `samples/team.example.json` 为项目目录下的 `team.local.json`，将人员、允许申请的账号、负责审批的账号和报表替换为团队自己的数据。为各示例账号设置对应名称的密码环境变量，之后启动服务。不要把团队配置加入版本控制。\n\n```powershell\nCopy-Item samples/team.example.json team.local.json\n$env:ACCESS_OPERATOR_PASSWORD = Read-Host \"运营同事密码\" -MaskInput\n$env:ACCESS_OWNER_PASSWORD = Read-Host \"资源负责人密码\" -MaskInput\n$env:ACCESS_AUDIT_PASSWORD = Read-Host \"审计员密码\" -MaskInput\nnode server.mjs --port 8801 --db data/team.sqlite --team-file team.local.json\n```\n\n`passwordEnv` 的值是环境变量名称。每个账号用各自至少 12 字符的密码。团队服务默认监听本机。在 HTTPS 反向代理后运行时，指定 `--origin https://权限台域名 --secure-cookie` 并保留外部 Host。团队配置将授权限定到报表读取，已经读取或另行复制的内容无法收回。\n\n## 设计与验收\n\n- 审批参考 Microsoft Entra 的发起、审批和到期状态。每项资源单独指定负责人，限时授权期间可以归还或撤销。[访问申请流程](https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-process)\n- 限时访问参考 Google Cloud Privileged Access Manager 对用途、时长、审批人与审计的拆分。工作台记录应用内报表访问，并在每次读取时重新校验授权。[Google Cloud 权限管理](https://docs.cloud.google.com/iam/docs/pam-overview/)\n- `domain.mjs` 处理申请、批准、拒绝、撤回、归还、撤销与到期。到期判定精确到服务器的当前毫秒。首次触及到期状态时，审计记录同时保留实际到期时间和记录时间。\n- `server.mjs` 管理会话和 SQLite 事务。团队版的静态页面不包含报表正文，访问成功后才由 API 返回。\n- `npm run build:demo` 生成 `dist/index.html`。可下载并离线打开，内含公开虚构样例及与服务共用的规则。\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 企业临时权限工作台 v1.0 源码包\n\n原始发布归档为 `企业临时权限工作台-v1.0.zip`。压缩包保留其中 17 份文本文件的原始路径与字节，本文件为导出说明。\n\n安装 Node.js 22.13 或以上版本，在项目目录运行 node server.mjs。亦可运行 npm test 验证权限生命周期。\n","group":"项目说明"},{"path":"domain.mjs","text":"const MINUTE = 60_000;\nconst APPROVAL_WINDOW = 24 * 60 * MINUTE;\n\nexport function createWorkspace({ users, resources }) {\n  return {\n    users: users.map(({ id, name, role, department }) => ({ id, name, role, department })),\n    resources: structuredClone(resources),\n    requests: [],\n    grants: [],\n    events: [],\n    sequences: { request: 0, grant: 0, event: 0 },\n  };\n}\n\nfunction response(body, status = 200) {\n  return { status, body };\n}\n\nfunction reject(status, code, error) {\n  return response({ code, error }, status);\n}\n\nfunction nextId(state, kind, prefix) {\n  const number = ++state.sequences[kind];\n  return prefix + \"-\" + String(number).padStart(4, \"0\");\n}\n\nfunction appendEvent(state, { at, actorId, action, resourceId, requestId, details }) {\n  state.events.push({\n    id: nextId(state, \"event\", \"evt\"),\n    at, actorId, action, resourceId, requestId, details,\n  });\n}\n\nfunction reconcile(state, now) {\n  for (const request of state.requests) {\n    if (request.status !== \"pending\" || request.deadlineAt > now) continue;\n    request.status = \"expired\";\n    request.decidedAt = request.deadlineAt;\n    appendEvent(state, {\n      at: request.deadlineAt, actorId: \"system\", action: \"request_expired\",\n      resourceId: request.resourceId, requestId: request.id, details: { recordedAt: now },\n    });\n  }\n  for (const grant of state.grants) {\n    if (grant.status !== \"active\") continue;\n    const expired = grant.expiresAt \u003c= now;\n    if (!expired) {\n      const user = state.users.find(item => item.id === grant.userId);\n      const resource = state.resources.find(item => item.id === grant.resourceId);\n      if (canRequest(resource, user)) continue;\n    }\n    grant.status = expired ? \"expired\" : \"revoked\";\n    grant.endedAt = expired ? grant.expiresAt : now;\n    grant.endedBy = \"system\";\n    appendEvent(state, {\n      at: grant.endedAt, actorId: \"system\", action: \"grant_\" + grant.status,\n      resourceId: grant.resourceId, requestId: grant.requestId,\n      details: { grantId: grant.id, recordedAt: now, ...(expired ? {} : { reason: \"policy_changed\" }) },\n    });\n  }\n}\n\nfunction canRequest(resource, actor) {\n  if (!resource || !actor) return false;\n  return resource.requesterIds === undefined\n    ? actor.role === \"employee\"\n    : resource.requesterIds.includes(actor.id);\n}\n\nfunction canApprove(resource, actor) {\n  return actor.role === \"approver\" && resource?.approverIds.includes(actor.id);\n}\n\nfunction canBrowse(resource, actor) {\n  return actor.role === \"auditor\" || canApprove(resource, actor) || canRequest(resource, actor);\n}\n\nfunction canSeeRecord(resource, actor, userId) {\n  return actor.id === userId || actor.role === \"auditor\" || canApprove(resource, actor);\n}\n\nfunction workspace(state, actor, now) {\n  const owned = new Set(state.resources.filter(resource => canApprove(resource, actor)).map(resource => resource.id));\n  const visible = (resourceId, userId) => actor.role === \"auditor\" || owned.has(resourceId) || userId === actor.id;\n  const requests = state.requests.filter(request => visible(request.resourceId, request.requesterId));\n  const grants = state.grants.filter(grant => visible(grant.resourceId, grant.userId));\n  const requestIds = new Set(requests.map(request => request.id));\n  const events = state.events.filter(event =>\n    visible(event.resourceId, event.actorId) || requestIds.has(event.requestId)\n  );\n  // Report data can only be returned by the protected report endpoint.\n  const resources = state.resources.filter(resource => canBrowse(resource, actor)).map(resource => ({\n    id: resource.id,\n    name: resource.name,\n    category: resource.category,\n    department: resource.department,\n    summary: resource.summary,\n    maxMinutes: resource.maxMinutes,\n    approverIds: resource.approverIds,\n    canRequest: canRequest(resource, actor),\n    canApprove: canApprove(resource, actor),\n  }));\n  const peopleIds = new Set([\n    actor.id,\n    ...resources.flatMap(resource => resource.approverIds),\n    ...requests.flatMap(request => [request.requesterId, request.decisionBy]),\n    ...events.map(event => event.actorId),\n  ]);\n  const people = state.users.filter(user => actor.role === \"auditor\" || peopleIds.has(user.id));\n  events.reverse().sort((left, right) => right.at - left.at);\n  return response({ now, actor, people, resources, requests, grants, events });\n}\n\nfunction submit(state, actor, body, now) {\n  const resource = state.resources.find(item => item.id === body.resourceId);\n  if (!resource) return reject(404, \"RESOURCE_NOT_FOUND\", \"没有找到这项资源。\");\n  if (!canRequest(resource, actor)) return reject(403, \"REQUEST_FORBIDDEN\", \"当前账号无法申请这项资源。\");\n  const reason = typeof body.reason === \"string\" ? body.reason.trim() : \"\";\n  if (reason.length \u003c 4 || reason.length > 300) {\n    return reject(422, \"INVALID_REASON\", \"请填写 4 到 300 个字的申请用途。\");\n  }\n  const { minutes } = body;\n  if (!Number.isSafeInteger(minutes) || minutes \u003c 1 || minutes > resource.maxMinutes) {\n    return reject(422, \"INVALID_DURATION\", \"请输入 1 至 \" + resource.maxMinutes + \" 分钟的整数时长。\");\n  }\n  const current = state.requests.find(request =>\n    request.resourceId === resource.id && request.requesterId === actor.id && request.status === \"pending\"\n  );\n  if (current) {\n    if (current.reason === reason && current.minutes === minutes) return response({ request: current, created: false });\n    return reject(409, \"REQUEST_PENDING\", \"这项资源已有一条待审批申请。\");\n  }\n  if (activeGrant(state, actor.id, resource.id, now)) {\n    return reject(409, \"GRANT_ACTIVE\", \"这项资源已有生效的授权。可结束授权后重新申请。\");\n  }\n  const request = {\n    id: nextId(state, \"request\", \"req\"),\n    resourceId: resource.id,\n    requesterId: actor.id,\n    reason,\n    minutes,\n    status: \"pending\",\n    createdAt: now,\n    deadlineAt: now + APPROVAL_WINDOW,\n  };\n  state.requests.push(request);\n  appendEvent(state, {\n    at: now, actorId: actor.id, action: \"request_submitted\", resourceId: resource.id,\n    requestId: request.id, details: { minutes, deadlineAt: request.deadlineAt },\n  });\n  return response({ request, created: true }, 201);\n}\n\nfunction readNote(value) {\n  if (value === undefined) return \"\";\n  return typeof value === \"string\" && value.length \u003c= 300 ? value.trim() : null;\n}\n\nfunction decide(state, actor, id, action, body, now) {\n  const request = state.requests.find(item => item.id === id);\n  const resource = state.resources.find(item => item.id === request?.resourceId);\n  if (!request || !canSeeRecord(resource, actor, request.requesterId)) {\n    return reject(404, \"REQUEST_NOT_FOUND\", \"没有找到这条申请。\");\n  }\n  const own = request.requesterId === actor.id;\n  if (action === \"withdraw\") {\n    if (!own) return reject(403, \"OWNER_REQUIRED\", \"申请人可以撤回自己的申请。\");\n  } else if (own || !canApprove(resource, actor)) {\n    return reject(403, own ? \"SELF_APPROVAL\" : \"APPROVER_REQUIRED\",\n      own ? \"申请人需由其他资源审批人处理。\" : \"只有这项资源指定的审批人可以处理申请。\");\n  }\n  const note = readNote(body.note);\n  if (note === null) return reject(422, \"INVALID_NOTE\", \"处理备注需在 300 个字以内。\");\n  const status = { approve: \"approved\", deny: \"denied\", withdraw: \"withdrawn\" }[action];\n  const grant = state.grants.find(item => item.requestId === request.id);\n  if (request.status === status && request.decisionBy === actor.id && request.note === note) {\n    return response(grant ? { request, grant } : { request });\n  }\n  if (request.status !== \"pending\" || now \u003c request.createdAt) {\n    return reject(409, \"REQUEST_CLOSED\", \"这条申请已结束或已处理，请刷新查看详情。\");\n  }\n  if (action === \"approve\") {\n    const requester = state.users.find(user => user.id === request.requesterId);\n    if (!canRequest(resource, requester)) {\n      return reject(409, \"REQUESTER_INELIGIBLE\", \"申请人已不符合这项资源的申请策略。\");\n    }\n    if (request.minutes > resource.maxMinutes) {\n      return reject(409, \"DURATION_POLICY_CHANGED\", \"申请时长已超过当前策略上限，请让申请人调整后重新提交。\");\n    }\n    if (activeGrant(state, request.requesterId, request.resourceId, now)) {\n      return reject(409, \"GRANT_ACTIVE\", \"该申请人已有这项资源的有效授权。\");\n    }\n  }\n  Object.assign(request, { status, decidedAt: now, decisionBy: actor.id, note });\n  const result = { request };\n  if (action === \"approve\") {\n    result.grant = {\n      id: nextId(state, \"grant\", \"grant\"),\n      requestId: request.id,\n      resourceId: request.resourceId,\n      userId: request.requesterId,\n      status: \"active\",\n      startsAt: now,\n      expiresAt: now + request.minutes * MINUTE,\n    };\n    state.grants.push(result.grant);\n  }\n  appendEvent(state, {\n    at: now, actorId: actor.id, action: \"request_\" + status, resourceId: request.resourceId, requestId: id,\n    details: result.grant ? { note, grantId: result.grant.id, expiresAt: result.grant.expiresAt } : { note },\n  });\n  return response(result);\n}\n\nfunction closeGrant(state, actor, id, action, body, now) {\n  const grant = state.grants.find(item => item.id === id);\n  const resource = state.resources.find(item => item.id === grant?.resourceId);\n  if (!grant || !canSeeRecord(resource, actor, grant.userId)) {\n    return reject(404, \"GRANT_NOT_FOUND\", \"没有找到这条授权。\");\n  }\n  if (action === \"return\" && actor.id !== grant.userId) {\n    return reject(403, \"OWNER_REQUIRED\", \"获授权人可以提前归还自己的访问权限。\");\n  }\n  if (action === \"revoke\" && !canApprove(resource, actor)) {\n    return reject(403, \"APPROVER_REQUIRED\", \"只有这项资源指定的审批人可以撤销授权。\");\n  }\n  const note = readNote(body.note);\n  if (note === null) return reject(422, \"INVALID_NOTE\", \"处理备注需在 300 个字以内。\");\n  const status = action === \"revoke\" ? \"revoked\" : \"returned\";\n  if (grant.status === status && grant.endedBy === actor.id && grant.note === note) return response({ grant });\n  if (grant.status !== \"active\" || now \u003c grant.startsAt) {\n    return reject(409, \"GRANT_CLOSED\", \"这条授权已结束，请刷新查看详情。\");\n  }\n  Object.assign(grant, { status, endedAt: now, endedBy: actor.id, note });\n  appendEvent(state, {\n    at: now, actorId: actor.id, action: \"grant_\" + status, resourceId: grant.resourceId,\n    requestId: grant.requestId, details: { grantId: id, note },\n  });\n  return response({ grant });\n}\n\nfunction activeGrant(state, userId, resourceId, now) {\n  return state.grants.find(grant =>\n    grant.resourceId === resourceId && grant.userId === userId && grant.status === \"active\" &&\n    grant.startsAt \u003c= now && now \u003c grant.expiresAt\n  );\n}\n\nfunction readReport(state, actor, resourceId, now) {\n  const resource = state.resources.find(item => item.id === resourceId);\n  if (!resource) return reject(404, \"RESOURCE_NOT_FOUND\", \"没有找到这项资源。\");\n  const grant = activeGrant(state, actor.id, resourceId, now);\n  const request = state.requests.findLast(item => item.resourceId === resourceId && item.requesterId === actor.id);\n  const previousGrant = state.grants.findLast(item => item.resourceId === resourceId && item.userId === actor.id);\n  const denial = !canRequest(resource, actor) ? \"policy_restricted\" : request?.status === \"pending\" ? \"pending\" :\n    previousGrant && previousGrant.status !== \"active\" ? previousGrant.status : \"not_granted\";\n  appendEvent(state, {\n    at: now, actorId: actor.id, action: grant ? \"report_read\" : \"report_denied\", resourceId,\n    requestId: grant?.requestId ?? request?.id,\n    details: grant ? { status: 200, grantId: grant.id } : { status: 403, reason: denial },\n  });\n  if (!grant) return reject(403, \"ACCESS_REQUIRED\", \"这份报表需要当前有效的临时访问授权。\");\n  return response({ resource: { id: resource.id, name: resource.name }, report: resource.report, grant });\n}\n\nexport function handle(state, { method, path, actorId, now, body = {} }) {\n  const actor = state.users.find(user => user.id === actorId);\n  if (!actor) return reject(401, \"SIGN_IN_REQUIRED\", \"请先进入工作区。\");\n  if (!Number.isSafeInteger(now) || now \u003c 0) throw new TypeError(\"Invalid workspace time\");\n  if (method === \"POST\" && (!body || typeof body !== \"object\" || Array.isArray(body))) {\n    return reject(400, \"INVALID_BODY\", \"请求格式无效。\");\n  }\n  reconcile(state, now);\n  if (method === \"GET\" && path === \"/api/workspace\") return workspace(state, actor, now);\n  if (method === \"POST\" && path === \"/api/requests\") return submit(state, actor, body, now);\n  if (method === \"POST\") {\n    const request = /^\\/api\\/requests\\/([\\w-]+)\\/(approve|deny|withdraw)$/.exec(path);\n    if (request) return decide(state, actor, request[1], request[2], body, now);\n    const grant = /^\\/api\\/grants\\/([\\w-]+)\\/(revoke|return)$/.exec(path);\n    if (grant) return closeGrant(state, actor, grant[1], grant[2], body, now);\n  }\n  if (method === \"GET\") {\n    const report = /^\\/api\\/resources\\/([\\w-]+)\\/report$/.exec(path);\n    if (report) return readReport(state, actor, report[1], now);\n  }\n  return reject(404, \"ROUTE_NOT_FOUND\", \"没有找到这项操作。\");\n}\n","group":"后端"},{"path":"fixtures.mjs","text":"export const demoWorkspace = {\n  users: [\n    {id:\"employee\", name:\"林予安\", role:\"employee\", department:\"商业运营\"},\n    {id:\"approver\", name:\"沈知遥\", role:\"approver\", department:\"数据平台\"},\n    {id:\"auditor\", name:\"陆言\", role:\"auditor\", department:\"内控审计\"},\n  ],\n  resources: [\n    {\n      id:\"regional-report\", name:\"区域经营周报\", category:\"经营数据\", department:\"数据平台\",\n      summary:\"汇总各区域的净成交额、有效订单与环比变化，用于大促复盘及区域对账。\",\n      maxMinutes:30, approverIds:[\"approver\"], requesterIds:[\"employee\"],\n      report:{\n        period:\"第 47 周 · 11 月 16 日至 22 日\",\n        summary:\"演示数据。净成交额按支付减退款汇总，环比以第 46 周为基准。\",\n        columns:[\"区域\",\"净成交额（万元）\",\"有效订单\",\"净成交额环比\"],\n        rows:[[\"华东\",192.6,4820,\"+8.1%\"],[\"华南\",143.2,3624,\"+4.6%\"],[\"华北\",117.5,2840,\"−1.3%\"],[\"西南\",86.4,2126,\"+5.2%\"]],\n      },\n    },\n    {\n      id:\"fulfillment-report\", name:\"履约质量看板\", category:\"供应链\", department:\"数据平台\",\n      summary:\"按区域汇总准时发货率、积压单量和异常订单数，供供应链对齐处理进度。\",\n      maxMinutes:60, approverIds:[\"approver\"], requesterIds:[\"employee\"],\n      report:{\n        period:\"第 47 周 · 11 月 16 日至 22 日\",\n        summary:\"演示数据。以商家确认揽收的时间计算准时发货率。\",\n        columns:[\"区域\",\"准时发货率\",\"积压单量\",\"异常订单\"],\n        rows:[[\"华东\",\"97.4%\",48,32],[\"华南\",\"96.8%\",42,26],[\"华北\",\"95.1%\",64,38]],\n      },\n    },\n    {\n      id:\"refund-review\", name:\"售后复核简报\", category:\"售后管理\", department:\"数据平台\",\n      summary:\"按渠道列出退款申请和已复核的数量，用于抽查售后处理记录。\",\n      maxMinutes:15, approverIds:[\"approver\"], requesterIds:[\"employee\"],\n      report:{\n        period:\"第 47 周 · 11 月 16 日至 22 日\",\n        summary:\"演示数据。每条已处理订单只计入一次。\",\n        columns:[\"渠道\",\"退款申请\",\"已复核\"],\n        rows:[[\"商场\",126,101],[\"小程序\",97,84],[\"企业团购\",31,28]],\n      },\n    },\n  ],\n};\n","group":"配置与启动"},{"path":"package.json","text":"{\n  \"name\": \"temporary-access-workbench\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": {\"node\": \">=22.13\"},\n  \"scripts\": {\n    \"start\": \"node server.mjs\",\n    \"test\": \"node --test tests/*.test.mjs\",\n    \"build:demo\": \"node portable/build.mjs\"\n  }\n}\n","group":"配置与启动"},{"path":"portable/build.mjs","text":"import {readFile,writeFile,mkdir} from \"node:fs/promises\";\nimport {dirname,resolve} from \"node:path\";\n\nconst {argv}=process;\nconst output=resolve(argv[2] || \"dist/index.html\");\nconst read=path=>readFile(new URL(path,import.meta.url),\"utf8\");\nconst asModule=code=>\"data:text/javascript;base64,\"+Buffer.from(code,\"utf8\").toString(\"base64\");\n\nconst [domain,fixtures,transport,app,css,template]=await Promise.all([\n  read(\"../domain.mjs\"),read(\"../fixtures.mjs\"),read(\"transport.mjs\"),read(\"../static/app.mjs\"),\n  read(\"../static/styles.css\"),read(\"../static/index.html\"),\n]);\nfunction substitute(code,path,replacement){\n  const specifiers=[JSON.stringify(path),\"'\"+path+\"'\"];\n  const from=specifiers.find(specifier=>code.includes(specifier));\n  if(!from)throw new Error(\"Cannot resolve bundle dependency \"+path);\n  return code.replaceAll(from,JSON.stringify(replacement));\n}\nconst offlineTransport=substitute(\n  substitute(transport,\"../domain.mjs\",asModule(domain)),\"../fixtures.mjs\",asModule(fixtures));\nconst application=asModule(substitute(app,\"./transport.mjs\",asModule(offlineTransport)));\nconst policy=\"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\n\nconst stylesheet=/\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css[\"'][^>]*>/iu;\nconst script=/\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs[\"'][^>]*>\\s*\u003c\\/script>/iu;\nif(!stylesheet.test(template)||!script.test(template))throw new Error(\"Expected stylesheet and application module in index.html\");\nconst markup=template.replace(\"\u003chead>\",`\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(\"\u003chtml \",'\u003chtml data-edition=\"browser\" ')\n  .replace(stylesheet,()=>`\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(script,()=>`\u003cscript type=\"module\" src=\"${application}\">\u003c/script>`);\nawait mkdir(dirname(output),{recursive:true});\nawait writeFile(output,markup.replace(/\\r\\n/gu,\"\\n\"),\"utf8\");\nconsole.log(\"Browser demo written to \"+output);\n","group":"配置与启动"},{"path":"portable/transport.mjs","text":"import {createWorkspace,handle} from \"../domain.mjs\";\nimport {demoWorkspace} from \"../fixtures.mjs\";\n\nconst storeName=\"workspace\";\nconst entry=\"current\";\nlet memory;\nconst database=new Promise(resolve=>{\n  try{\n    const opening=indexedDB.open(\"temporary-access-demo\",1);\n    opening.onupgradeneeded=()=>opening.result.createObjectStore(storeName);\n    opening.onsuccess=()=>resolve(opening.result);\n    opening.onerror=()=>resolve(null);\n    opening.onblocked=()=>resolve(null);\n  }catch{\n    resolve(null);\n  }\n});\n\nfunction newState(){\n  return {actorId:\"employee\",offset:0,workspace:createWorkspace(demoWorkspace)};\n}\n\nasync function transact(run){\n  const db=await database;\n  if(!db){\n    memory ||= newState();\n    return run(memory);\n  }\n  return new Promise((resolve,reject)=>{\n    const tx=db.transaction(storeName,\"readwrite\");\n    const store=tx.objectStore(storeName);\n    const reading=store.get(entry);\n    let result,failure;\n    reading.onsuccess=()=>{\n      const state=reading.result || newState();\n      try{\n        result=run(state);\n        store.put(state,entry);\n      }catch(error){\n        failure=error;\n        tx.abort();\n      }\n    };\n    tx.oncomplete=()=>resolve(result);\n    tx.onabort=()=>reject(failure || tx.error || new Error(\"未能保存演练进度。\"));\n  });\n}\n\nfunction session(state){\n  return {mode:\"demo\",user:demoWorkspace.users.find(user=>user.id===state.actorId),\n    roles:demoWorkspace.users,now:Date.now()+state.offset};\n}\n\nfunction action(state, path, method, body){\n  if(method===\"GET\" && path===\"/api/session\")return {status:200,body:session(state)};\n  if(method===\"POST\" && path===\"/api/session/role\"){\n    if(!demoWorkspace.users.some(user=>user.id===body.id))return {status:400,body:{error:\"请选择一个演练角色。\"}};\n    state.actorId=body.id;\n    return {status:200,body:session(state)};\n  }\n  if(method===\"POST\" && path===\"/api/demo/clock\"){\n    if(!Number.isInteger(body.minutes) || body.minutes\u003c1 || body.minutes>1440)\n      return {status:400,body:{error:\"请输入 1 到 1440 之间的整数分钟。\"}};\n    state.offset+=body.minutes*60000;\n    return {status:200,body:session(state)};\n  }\n  return handle(state.workspace,{method,path,actorId:state.actorId,now:Date.now()+state.offset,body});\n}\n\nexport default async function request(path,options={}){\n  const {method=\"GET\",body={}}=options;\n  const result=await transact(state=>action(state,path,method,body));\n  if(result.status>=400){\n    const error=new Error(result.body.error);\n    error.status=result.status;\n    error.code=result.body.code;\n    throw error;\n  }\n  return result.body;\n}\n","group":"配置与启动"},{"path":"samples/team.example.json","text":"{\n  \"users\": [\n    {\"id\":\"operator\",\"name\":\"运营同事\",\"role\":\"employee\",\"department\":\"运营组\",\"passwordEnv\":\"ACCESS_OPERATOR_PASSWORD\"},\n    {\"id\":\"owner\",\"name\":\"资源负责人\",\"role\":\"approver\",\"department\":\"数据平台\",\"passwordEnv\":\"ACCESS_OWNER_PASSWORD\"},\n    {\"id\":\"audit\",\"name\":\"审计员\",\"role\":\"auditor\",\"department\":\"内控组\",\"passwordEnv\":\"ACCESS_AUDIT_PASSWORD\"}\n  ],\n  \"resources\": [\n    {\n      \"id\":\"capacity-report\",\n      \"name\":\"供应计划周报\",\n      \"category\":\"供应链\",\n      \"department\":\"数据平台\",\n      \"summary\":\"区域供货计划汇总，用于短期复核。\",\n      \"maxMinutes\":60,\n      \"approverIds\":[\"owner\"],\n      \"requesterIds\":[\"operator\"],\n      \"report\":{\n        \"period\":\"示例周报\",\n        \"columns\":[\"区域\",\"计划供货量\",\"已确认量\"],\n        \"rows\":[[\"华北\",1200,1137],[\"华东\",800,760]]\n      }\n    }\n  ]\n}\n","group":"数据与样例"},{"path":"server.mjs","text":"import { createHash, randomBytes, scrypt, scryptSync, timingSafeEqual } from \"node:crypto\";\nimport { closeSync, mkdirSync, openSync, readFileSync, statSync } from \"node:fs\";\nimport { createServer } from \"node:http\";\nimport { dirname, resolve } from \"node:path\";\nimport { DatabaseSync } from \"node:sqlite\";\nimport { fileURLToPath } from \"node:url\";\nimport { parseArgs, promisify } from \"node:util\";\nimport { createWorkspace, handle } from \"./domain.mjs\";\nimport { demoWorkspace } from \"./fixtures.mjs\";\n\nconst deriveKey = promisify(scrypt);\nconst sessionAge = 12 * 60 * 60;\nconst maxBodySize = 32 * 1024;\nconst authWindow = 60_000;\nconst localNames = new Set([\"127.0.0.1\", \"localhost\", \"::1\", \"[::1]\"]);\nconst teamRoles = new Set([\"employee\", \"approver\", \"auditor\"]);\nconst staticFiles = new Map([\n  [\"/\", [\"index.html\", \"text/html; charset=utf-8\"]],\n  [\"/index.html\", [\"index.html\", \"text/html; charset=utf-8\"]],\n  [\"/styles.css\", [\"styles.css\", \"text/css; charset=utf-8\"]],\n  [\"/app.mjs\", [\"app.mjs\", \"text/javascript; charset=utf-8\"]],\n  [\"/transport.mjs\", [\"transport.mjs\", \"text/javascript; charset=utf-8\"]],\n]);\n\nclass HTTPError extends Error {\n  constructor(status, message) {\n    super(message);\n    this.status = status;\n  }\n}\n\nfunction required(condition, status, message) {\n  if (!condition) throw new HTTPError(status, message);\n}\n\nfunction publicUser(user) {\n  const { id, name, role, department } = user;\n  return { id, name, role, department };\n}\n\nfunction validLabel(value, maximum = 120) {\n  return typeof value === \"string\" && value.trim().length > 0 && value.length \u003c= maximum;\n}\n\nfunction validId(value) {\n  return typeof value === \"string\" && /^[a-z0-9][a-z0-9_-]{0,47}$/.test(value);\n}\n\nfunction credentials(user) {\n  const stored = user.passwordHash;\n  const envName = user.passwordEnv;\n  if (stored !== undefined && envName !== undefined) {\n    throw new Error(`用户 ${user.id} 请配置一种密码来源。`);\n  }\n  if (stored !== undefined) {\n    const fields = typeof stored === \"string\" && /^scrypt:([a-f0-9]{32}):([a-f0-9]{128})$/i.exec(stored);\n    if (!fields) throw new Error(`用户 ${user.id} 的密码散列格式错误。`);\n    return { salt: Buffer.from(fields[1], \"hex\"), key: Buffer.from(fields[2], \"hex\") };\n  }\n  const password = typeof envName === \"string\" && /^[A-Za-z_][A-Za-z0-9_]*$/.test(envName) && process.env[envName];\n  if (typeof password !== \"string\" || password.length \u003c 12 || password.length > 256) {\n    throw new Error(`用户 ${user.id} 对应的密码环境变量需要含 12 至 256 个字符。`);\n  }\n  const salt = randomBytes(16);\n  return { salt, key: scryptSync(password, salt, 64) };\n}\n\nfunction validReport(report) {\n  return report && validLabel(report.period)\n    && (report.summary === undefined || validLabel(report.summary, 1200))\n    && Array.isArray(report.columns) && report.columns.length > 0 && report.columns.length \u003c= 20\n    && report.columns.every(column => validLabel(column))\n    && Array.isArray(report.rows) && report.rows.length \u003c= 500\n    && report.rows.every(row => Array.isArray(row) && row.length === report.columns.length\n      && row.every(cell => (typeof cell === \"string\" && cell.length \u003c= 2000) || Number.isFinite(cell)));\n}\n\nfunction loadTeam(filename) {\n  if (statSync(filename).size > 4 * 1024 * 1024) throw new Error(\"团队配置超过 4 MiB。\");\n  const config = JSON.parse(readFileSync(filename, \"utf8\").replace(/^\\uFEFF/, \"\"));\n  if (!Array.isArray(config?.users) || !config.users.length || !Array.isArray(config.resources)) {\n    throw new Error(\"团队配置需要 users 和 resources 列表。\");\n  }\n  const accounts = new Map();\n  for (const entry of config.users) {\n    if (!entry || !validId(entry.id) || !teamRoles.has(entry.role) || !validLabel(entry.name)\n        || !validLabel(entry.department) || accounts.has(entry.id)) {\n      throw new Error(\"团队配置包含无效或重复的用户。\");\n    }\n    accounts.set(entry.id, { user: publicUser(entry), ...credentials(entry) });\n  }\n  const resourceIds = new Set();\n  for (const resource of config.resources) {\n    if (!resource || !validId(resource.id) || resourceIds.has(resource.id) || !validLabel(resource.name)\n        || !validLabel(resource.category) || !validLabel(resource.department) || !validLabel(resource.summary, 1200)\n        || !Number.isInteger(resource.maxMinutes) || resource.maxMinutes \u003c 1 || resource.maxMinutes > 10080\n        || !Array.isArray(resource.approverIds) || !resource.approverIds.length\n        || !resource.approverIds.every(id => accounts.get(id)?.user.role === \"approver\")\n        || (resource.requesterIds !== undefined\n          && (!Array.isArray(resource.requesterIds) || !resource.requesterIds.every(id => accounts.has(id))))\n        || !validReport(resource.report)) {\n      throw new Error(\"团队配置包含无效或重复的资源。\");\n    }\n    resourceIds.add(resource.id);\n  }\n  return { template: { users: [...accounts.values()].map(account => account.user), resources: config.resources }, accounts };\n}\n\nfunction parseOrigin(value) {\n  if (!value) return \"\";\n  const url = new URL(value);\n  if (![\"http:\", \"https:\"].includes(url.protocol) || value !== url.origin) {\n    throw new Error(\"--origin 应为完整 HTTP(S) 源，例如 https://access.example.com。\");\n  }\n  return url.origin;\n}\n\nfunction checkHost(request, expectedOrigin, secure) {\n  let host;\n  try {\n    host = new URL(`${secure ? \"https\" : \"http\"}://${request.headers.host || \"\"}`);\n  } catch {\n    throw new HTTPError(400, \"请求主机地址无效。\");\n  }\n  required(!host.username && !host.password && host.pathname === \"/\" && !host.search && !host.hash,\n    400, \"请求主机地址无效。\");\n  required(expectedOrigin ? new URL(expectedOrigin).host === host.host : localNames.has(host.hostname),\n    400, \"请求主机与工作台配置不匹配。\");\n  return expectedOrigin || host.origin;\n}\n\nfunction verifyMutation(request, origin) {\n  required(request.headers[\"x-workspace-request\"] === \"1\", 403, \"请求校验失败，请刷新页面。\");\n  required(!request.headers.origin || request.headers.origin === origin, 403, \"该操作仅允许从工作台发起。\");\n  required(/^application\\/json(?:[ \\t]*;|$)/i.test(request.headers[\"content-type\"] || \"\"), 415, \"请求需要 JSON 格式。\");\n}\n\nasync function readBody(request) {\n  required(Number(request.headers[\"content-length\"] || 0) \u003c= maxBodySize, 413, \"请求内容过长。\");\n  const chunks = [];\n  let length = 0;\n  for await (const chunk of request.iterator({ destroyOnReturn: false })) {\n    length += chunk.length;\n    if (length > maxBodySize) {\n      request.resume();\n      throw new HTTPError(413, \"请求内容过长。\");\n    }\n    chunks.push(chunk);\n  }\n  try {\n    const value = JSON.parse(Buffer.concat(chunks).toString(\"utf8\"));\n    required(value && typeof value === \"object\" && !Array.isArray(value), 400, \"请提交 JSON 对象。\");\n    return value;\n  } catch (error) {\n    if (error instanceof HTTPError) throw error;\n    throw new HTTPError(400, \"请求中的 JSON 无法读取。\");\n  }\n}\n\nfunction tokenDigest(token) {\n  return createHash(\"sha256\").update(token).digest(\"hex\");\n}\n\nfunction readToken(cookieHeader, cookieName) {\n  const prefix = cookieName + \"=\";\n  for (const raw of (cookieHeader || \"\").split(\";\")) {\n    const part = raw.trim();\n    if (part.startsWith(prefix)) {\n      const token = part.slice(prefix.length);\n      if (/^[a-f0-9]{64}$/.test(token)) return tokenDigest(token);\n    }\n  }\n  return \"\";\n}\n\nfunction createStore(path, mode, template) {\n  if (path !== \":memory:\") {\n    mkdirSync(dirname(resolve(path)), { recursive: true, mode: 0o700 });\n    closeSync(openSync(path, \"a\", 0o600));\n  }\n  const db = new DatabaseSync(path);\n  db.exec(`\n    PRAGMA busy_timeout = 5000;\n    PRAGMA journal_mode = WAL;\n    PRAGMA foreign_keys = ON;\n    CREATE TABLE IF NOT EXISTS workspaces (\n      id TEXT PRIMARY KEY, mode TEXT NOT NULL, state TEXT NOT NULL,\n      offset_ms INTEGER NOT NULL DEFAULT 0, updated_at INTEGER NOT NULL\n    ) STRICT;\n    CREATE TABLE IF NOT EXISTS sessions (\n      token TEXT PRIMARY KEY, workspace_id TEXT NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,\n      actor_id TEXT NOT NULL, expires_at INTEGER NOT NULL\n    ) STRICT;\n    CREATE INDEX IF NOT EXISTS session_expiration ON sessions(expires_at);\n    CREATE INDEX IF NOT EXISTS workspace_retention ON workspaces(mode, updated_at);\n  `);\n  const insertDesk = db.prepare(\"INSERT OR IGNORE INTO workspaces (id,mode,state,updated_at) VALUES (?,?,?,?)\");\n  const insertSession = db.prepare(\"INSERT INTO sessions (token,workspace_id,actor_id,expires_at) VALUES (?,?,?,?)\");\n  const findSession = db.prepare(`SELECT w.id,w.state,w.offset_ms,s.actor_id,s.token\n    FROM sessions s JOIN workspaces w ON w.id=s.workspace_id\n    WHERE s.token=? AND w.mode=? AND s.expires_at>?`);\n  const revokeSession = db.prepare(\"DELETE FROM sessions WHERE token=?\");\n  const saveDesk = db.prepare(\"UPDATE workspaces SET state=?,updated_at=? WHERE id=?\");\n  const setActor = db.prepare(\"UPDATE sessions SET actor_id=? WHERE token=?\");\n  const moveClock = db.prepare(\"UPDATE workspaces SET offset_ms=offset_ms+?, updated_at=? WHERE id=?\");\n  const pruneSessions = db.prepare(\"DELETE FROM sessions WHERE expires_at\u003c=?\");\n  const pruneDesks = db.prepare(\"DELETE FROM workspaces WHERE mode='demo' AND updated_at\u003c?\");\n  const catalog = createWorkspace(template);\n  const withoutTeamCatalog = state => mode === \"team\" ? { ...state, users: [], resources: [] } : state;\n  const emptyState = JSON.stringify(withoutTeamCatalog(catalog));\n  let lastPrune = 0;\n\n  function transaction(action) {\n    db.exec(\"BEGIN IMMEDIATE\");\n    try {\n      const result = action();\n      db.exec(\"COMMIT\");\n      return result;\n    } catch (error) {\n      db.exec(\"ROLLBACK\");\n      throw error;\n    }\n  }\n\n  if (mode === \"team\") {\n    transaction(() => {\n      insertDesk.run(\"team\", mode, emptyState, Date.now());\n      db.prepare(\"DELETE FROM sessions WHERE workspace_id='team'\").run();\n    });\n  }\n  return {\n    db,\n    transaction,\n    prune(now) {\n      if (now - lastPrune \u003c 60_000) return;\n      pruneSessions.run(now);\n      pruneDesks.run(now - 3 * 24 * 3600 * 1000);\n      lastPrune = now;\n    },\n    open(token, now) {\n      return token ? findSession.get(token, mode, now) : null;\n    },\n    issue(actorId, now, previousToken) {\n      const workspaceId = mode === \"team\" ? \"team\" : randomBytes(24).toString(\"hex\");\n      if (mode === \"demo\") insertDesk.run(workspaceId, mode, emptyState, now);\n      const token = randomBytes(32).toString(\"hex\");\n      if (previousToken) revokeSession.run(previousToken);\n      insertSession.run(tokenDigest(token), workspaceId, actorId, now + sessionAge * 1000);\n      return token;\n    },\n    revoke(token) { revokeSession.run(token); },\n    load(workspace) {\n      const state = JSON.parse(workspace.state);\n      if (mode === \"team\") {\n        state.users = catalog.users;\n        state.resources = catalog.resources;\n      }\n      return state;\n    },\n    save(workspace, state, now) { saveDesk.run(JSON.stringify(withoutTeamCatalog(state)), now, workspace.id); },\n    setActor(workspace, actorId) { setActor.run(actorId, workspace.token); },\n    moveClock(workspace, minutes, now) { moveClock.run(minutes * 60_000, now, workspace.id); },\n  };\n}\n\nexport function startServer({\n  host = \"127.0.0.1\", port = 8801, dbPath, teamFile, origin, secureCookie = false,\n} = {}) {\n  const expectedOrigin = parseOrigin(origin);\n  const secure = secureCookie || expectedOrigin.startsWith(\"https:\");\n  const mode = teamFile ? \"team\" : \"demo\";\n  if (!localNames.has(host) && !expectedOrigin) throw new Error(\"监听外部地址时需要配置 --origin。\");\n  const external = !localNames.has(host) || expectedOrigin && !localNames.has(new URL(expectedOrigin).hostname);\n  if (mode === \"team\" && external && !secure) throw new Error(\"团队模式对外服务需要 HTTPS。\");\n  if (secure && !expectedOrigin.startsWith(\"https:\")) throw new Error(\"安全 Cookie 需要 HTTPS --origin。\");\n  const team = teamFile ? loadTeam(teamFile) : null;\n  const template = team ? team.template : demoWorkspace;\n  const publicUsers = new Map(template.users.map(user => [user.id, publicUser(user)]));\n  const store = createStore(dbPath || fileURLToPath(new URL(`./data/${mode}.sqlite3`, import.meta.url)), mode, template);\n  const cookieName = (secure ? \"__Host-\" : \"\") + (mode === \"team\" ? \"accessDeskTeam\" : \"accessDeskDemo\");\n  const cookie = (token, age) => `${cookieName}=${token}; Path=/; HttpOnly; SameSite=Lax; Max-Age=${age}${secure ? \"; Secure\" : \"\"}`;\n  const loginAttempts = new Map();\n  const fallbackCredentials = { salt: randomBytes(16), key: randomBytes(64) };\n\n  function json(response, status, body, options = {}) {\n    response.writeHead(status, { \"Content-Type\": \"application/json; charset=utf-8\", \"Cache-Control\": \"no-store\", ...options });\n    response.end(JSON.stringify(body));\n  }\n\n  function sessionData(actor, now) {\n    return { mode, user: actor || null, roles: mode === \"demo\" ? [...publicUsers.values()] : [], now };\n  }\n\n  async function login(request, response, input, previousToken) {\n    required(mode === \"team\", 404, \"当前工作区使用预设演示身份。\");\n    const now = Date.now();\n    const address = request.socket.remoteAddress;\n    for (const [key, entry] of loginAttempts) {\n      if (entry.reset \u003c= now) loginAttempts.delete(key);\n    }\n    const attempt = loginAttempts.get(address) || { count: 0, reset: now + authWindow };\n    required(attempt.count \u003c 24, 429, \"尝试次数过多，请稍后重试。\");\n    attempt.count += 1;\n    loginAttempts.set(address, attempt);\n    const account = typeof input.id === \"string\" && team.accounts.get(input.id);\n    const password = input.password;\n    required(typeof password === \"string\" && password.length > 0 && password.length \u003c= 256, 400, \"请输入登录账号和密码。\");\n    const expected = account || fallbackCredentials;\n    const hash = await deriveKey(password, expected.salt, expected.key.length);\n    required(timingSafeEqual(hash, expected.key) && account, 401, \"账号或密码错误。\");\n    const signedInAt = Date.now();\n    const token = store.transaction(() => store.issue(account.user.id, signedInAt, previousToken));\n    json(response, 200, sessionData(account.user, signedInAt), { \"Set-Cookie\": cookie(token, sessionAge) });\n  }\n\n  function routeAPI(response, method, path, input, token) {\n    const wall = Date.now();\n    const result = store.transaction(() => {\n      store.prune(wall);\n      const workspace = store.open(token, wall);\n      const actor = workspace && publicUsers.get(workspace.actor_id);\n      const now = wall + (workspace?.offset_ms || 0);\n      if (method === \"GET\" && path === \"/api/session\") {\n        if (!actor && mode === \"demo\") {\n          const initial = publicUsers.get(\"employee\");\n          const fresh = store.issue(initial.id, wall);\n          return { status: 200, body: sessionData(initial, wall), signed: cookie(fresh, sessionAge) };\n        }\n        return { status: 200, body: sessionData(actor, now) };\n      }\n      if (method === \"POST\" && path === \"/api/logout\") {\n        if (workspace) store.revoke(token);\n        return { status: 200, body: sessionData(null, wall), signed: cookie(\"\", 0) };\n      }\n      required(actor, 401, \"请登录或刷新工作区。\");\n      if (method === \"POST\" && path === \"/api/session/role\") {\n        required(mode === \"demo\", 403, \"团队工作区的角色由登录账号确定。\");\n        const next = publicUsers.get(input.id);\n        required(next, 400, \"未找到指定的演示身份。\");\n        store.setActor(workspace, next.id);\n        return { status: 200, body: sessionData(next, now) };\n      }\n      if (method === \"POST\" && path === \"/api/demo/clock\") {\n        required(mode === \"demo\", 403, \"团队工作区使用服务器时间。\");\n        const { minutes } = input;\n        required(Number.isInteger(minutes) && minutes >= 1 && minutes \u003c= 1440, 400, \"请选择 1 至 1440 分钟。\");\n        store.moveClock(workspace, minutes, wall);\n        return { status: 200, body: sessionData(actor, now + minutes * 60_000) };\n      }\n      const state = store.load(workspace);\n      const outcome = handle(state, { method, path, actorId: actor.id, now, body: input });\n      store.save(workspace, state, wall);\n      return outcome;\n    });\n    json(response, result.status, result.body, result.signed ? { \"Set-Cookie\": result.signed } : {});\n  }\n\n  const server = createServer({ maxHeaderSize: 16 * 1024, requestTimeout: 10_000, headersTimeout: 8_000 },\n    async (request, response) => {\n      response.setHeader(\"X-Content-Type-Options\", \"nosniff\");\n      response.setHeader(\"Referrer-Policy\", \"no-referrer\");\n      response.setHeader(\"X-Frame-Options\", \"DENY\");\n      response.setHeader(\"Cross-Origin-Resource-Policy\", \"same-origin\");\n      response.setHeader(\"Content-Security-Policy\",\n        \"default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\");\n      try {\n        const trustedOrigin = checkHost(request, expectedOrigin, secure);\n        required(request.url?.startsWith(\"/\") && !request.url.startsWith(\"//\"), 400, \"请求路径无效。\");\n        const path = new URL(request.url, trustedOrigin).pathname;\n        const method = request.method;\n        if (path.startsWith(\"/api/\")) {\n          required([\"GET\", \"POST\"].includes(method), 405, \"此方法不可用于工作台接口。\");\n          const site = request.headers[\"sec-fetch-site\"];\n          required(!site || site === \"same-origin\" || site === \"none\", 403, \"该操作仅允许从工作台发起。\");\n          const token = readToken(request.headers.cookie, cookieName);\n          let input = {};\n          if (method === \"POST\") {\n            verifyMutation(request, trustedOrigin);\n            input = await readBody(request);\n          }\n          if (method === \"POST\" && path === \"/api/login\") await login(request, response, input, token);\n          else routeAPI(response, method, path, input, token);\n          return;\n        }\n        const file = staticFiles.get(path);\n        required(file && [\"GET\", \"HEAD\"].includes(method), 404, \"未找到此页面。\");\n        const [name, type] = file;\n        const contents = readFileSync(new URL(\"./static/\" + name, import.meta.url));\n        response.writeHead(200, { \"Content-Type\": type, \"Content-Length\": contents.length, \"Cache-Control\": \"no-cache\" });\n        response.end(method === \"HEAD\" ? undefined : contents);\n      } catch (error) {\n        if (response.destroyed) return;\n        if (error instanceof HTTPError) json(response, error.status, { error: error.message });\n        else {\n          console.error(error.code || error.name || \"RequestError\");\n          json(response, 500, { error: \"工作台暂时无法完成操作，请稍后重试。\" });\n        }\n      }\n    });\n  server.on(\"close\", () => store.db.close());\n  return server.listen(port, host);\n}\n\nif (process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {\n  const { values } = parseArgs({ options: {\n    host: { type: \"string\", default: \"127.0.0.1\" },\n    port: { type: \"string\", default: \"8801\" },\n    db: { type: \"string\" },\n    origin: { type: \"string\" },\n    \"team-file\": { type: \"string\" },\n    \"secure-cookie\": { type: \"boolean\" },\n  } });\n  if (!/^\\d{1,5}$/.test(values.port) || Number(values.port) > 65535) throw new Error(\"端口应为 0 至 65535。\");\n  const server = startServer({\n    host: values.host, port: Number(values.port), dbPath: values.db,\n    teamFile: values[\"team-file\"], origin: values.origin, secureCookie: values[\"secure-cookie\"],\n  });\n  server.on(\"listening\", () => {\n    const address = server.address();\n    const host = address.family === \"IPv6\" ? `[${address.address}]` : address.address;\n    console.log(`http://${host}:${address.port}/`);\n  });\n}\n","group":"后端"},{"path":"start-access.cmd","text":"@echo off\nsetlocal\ncd /d \"%~dp0\"\nwhere node.exe >nul 2>&1\nif errorlevel 1 (\n  echo Node.js 22.13 or newer is required.\n  pause\n  exit /b 1\n)\nnode server.mjs --port 8801\nif errorlevel 1 pause\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import request from \"./transport.mjs\";\n\nconst $ = id => document.getElementById(id);\nconst escaped = value => String(value ?? \"\").replace(/[&\u003c>\"']/g, ch => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"})[ch]);\nconst component = value => encodeURIComponent(value);\nconst symbols = {\n  shield: '\u003cpath d=\"M12 3 20 6v5c0 4.5-3.1 7.8-8 10-4.9-2.2-8-5.5-8-10V6z\"/>\u003cpath d=\"m9 12 2 2 4-4\"/>',\n  home: '\u003cpath d=\"m3 10 9-7 9 7M5 9v11h14V9M10 20v-5h4v5\"/>',\n  grid: '\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>',\n  file: '\u003cpath d=\"M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h6\"/>',\n  report: '\u003crect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"/>\u003cpath d=\"M8 16v-3m4 3V9m4 7V7\"/>',\n  check: '\u003crect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"2\"/>\u003cpath d=\"m8 12 3 3 5-6\"/>',\n  key: '\u003ccircle cx=\"8.5\" cy=\"10\" r=\"4.5\"/>\u003cpath d=\"m12 13 7 7m-3-3 2-2m0 4 2-2\"/>',\n  clock: '\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/>\u003cpath d=\"M12 7.5V12l3 2\"/>',\n  history: '\u003cpath d=\"M4 9a8 8 0 1 1 1.5 8.8M4 5v4h4m4-2v5l3 2\"/>',\n  lock: '\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 10V7a4 4 0 0 1 8 0v3m-4 4v2\"/>',\n  arrow: '\u003cpath d=\"M4 12h15m-5-5 5 5-5 5\"/>',\n  back: '\u003cpath d=\"M20 12H5m5-5-5 5 5 5\"/>',\n  user: '\u003ccircle cx=\"12\" cy=\"8\" r=\"3\"/>\u003cpath d=\"M5 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2\"/>',\n  switch: '\u003cpath d=\"M4 8h15m-4-4 4 4-4 4m5 4H5m4-4-4 4 4 4\"/>',\n  plus: '\u003cpath d=\"M6 12h12m-6-6v12\"/>',\n  info: '\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/>\u003cpath d=\"M12 11v5m0-8v.2\"/>'\n};\nconst icon = name => `\u003ci class=\"ico\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\">${symbols[name] || symbols.file}\u003c/svg>\u003c/i>`;\nconst navs = {\n  home:[\"工作台\",\"home\"], resources:[\"资源目录\",\"grid\"], requests:[\"我的申请\",\"file\"],\n  approvals:[\"审批队列\",\"check\"], grants:[\"临时授权\",\"key\"], audit:[\"审计记录\",\"history\"]\n};\nconst roles = {employee:\"申请人\",requester:\"申请人\",approver:\"审批人\",auditor:\"审计员\",admin:\"管理员\"};\nconst labels = {\n  pending:\"待审批\",approved:\"已批准\",denied:\"已拒绝\",withdrawn:\"已撤回\",active:\"有效\",\n  expired:\"已到期\",revoked:\"已撤销\",returned:\"已归还\",allowed:\"验证通过\"\n};\nconst events = {\n  request_submitted:\"提交申请\",request_approved:\"批准申请\",request_denied:\"拒绝申请\",\n  request_withdrawn:\"撤回申请\",request_expired:\"申请等待超时\",grant_expired:\"授权到期\",\n  grant_revoked:\"撤销授权\",grant_returned:\"归还权限\",report_read:\"读取报表\",report_denied:\"拒绝读取报表\"\n};\nconst state = { session:null, workspace:null, report:null, auditFilter:\"all\", filters:{approvals:\"pending\",grants:\"all\"} };\nconst mainResource = \"regional-report\";\nlet renderVersion = 0;\nlet noticeTimer;\nlet expiryTimer;\nlet modalHref = \"\";\nlet mutationPending = false;\nconst devRoutes = {\n  report:id=>\"#resources/\"+component(id),\n  detail:(view,id)=>\"#\"+view+\"/\"+component(id)\n};\n\nfunction formatTime(value, short = false) {\n  if (!value) return \"—\";\n  const date = new Date(value);\n  if (Number.isNaN(+date)) return \"—\";\n  return new Intl.DateTimeFormat(\"zh-CN\", {\n    year:short?undefined:\"numeric\",month:\"2-digit\",day:\"2-digit\",hour:\"2-digit\",minute:\"2-digit\",\n    second:short?undefined:\"2-digit\",hourCycle:\"h23\"\n  }).format(date);\n}\nfunction route() {\n  try {\n    const [view,id] = location.hash.slice(1).split(\"/\").map(decodeURIComponent);\n    return {view:Object.hasOwn(navs,view)?view:\"home\",id:id||\"\"};\n  } catch { return {view:\"home\",id:\"\"}; }\n}\nconst actor = () => state.workspace?.actor || state.session?.user;\nconst demo = () => state.session?.mode === \"demo\";\nconst now = () => state.workspace?.now ?? state.session?.now;\nconst resource = id => state.workspace.resources.find(item => item.id === id);\nconst person = id => state.workspace?.people?.find(item => item.id === id) || state.session?.roles?.find(item => item.id === id);\nconst personName = id => id === \"system\" ? \"系统\" : id ? person(id)?.name || id : \"—\";\nconst resourceName = id => resource(id)?.name || id;\nconst isApprover = user => user?.role===\"approver\" || user?.role===\"admin\";\nconst isAuditor = user => user?.role===\"auditor\" || user?.role===\"admin\";\nconst ownRequest = req => req.requesterId === actor().id;\nconst ownGrant = grant => grant.userId === actor().id;\nconst viewGrant = (grants,id) => grants.find(grant=>grant.resourceId===id&&grant.status===\"active\"&&ownGrant(grant));\nconst canApprove = item => Boolean(item && (item.canApprove ?? item.approverIds?.includes(actor().id)));\nconst canRequest = item => Boolean(item && (item.canRequest ?? !isAuditor(actor())));\nconst demoApprover = item => state.session.roles?.find(user=>item?.approverIds?.includes(user.id)) || state.session.roles?.find(isApprover);\nfunction anchor(href, label, kind=\"secondary\", symbol=\"\") {\n  return `\u003ca class=\"btn ${ eq)).reverse();\n  const requested = eligible.find(req=>req.id===id);\n  const filter = adminView?state.filters.approvals:\"all\";\n  const filtered = eligible.filter(req=>filter===\"all\" || req.status===filter);\n  const selected = requested || filtered[0];\n  const caption = adminView?\"核对申请原因和访问时长，处理你负责的资源。\":\"查看自己的申请进度，访问已授权的资源。\";\n  $(\"main\").innerHTML = heading(navs[view][0],caption,adminView?\"\":anchor(\"#resources\",\"申请所需资源\",\"primary\",\"plus\"))+\n    `${adminView?`\u003cdiv class=\"page-filters\">${filterGroup(\"approvals\",[[\"pending\",\"待审批\"],[\"all\",\"全部\"]],filter)}\u003c/div>`:\"\"}\n    \u003cdiv class=\"detail-grid\">\u003csection class=\"list-stack\" aria-label=\"申请列表\">${filtered.map(req=>`\u003ca class=\"list-choice\"\n        href=\"${escaped(devRoutes.detail(view,req.id))}\" ${selected?.id===req.id?'aria-current=\"true\"':\"\"}>\n      \u003cspan>\u003cstrong>${escaped(resourceName(req.resourceId))}\u003c/strong>\u003csmall>${escaped(adminView?personName(req.requesterId):formatTime(req.createdAt,true))} · ${escaped(req.minutes)} 分钟\u003c/small>\u003c/span>${status(req.status)}\u003c/a>`).join(\"\")||\n      `\u003cdiv class=\"panel\">${empty(adminView?\"暂无相关申请\":\"暂无申请记录\",adminView?\"待审批的申请将出现在这里。\":\"可在资源目录中申请需要的报表。\",\"\",\"file\")}\u003c/div>`}\u003c/section>\n    ${selected?renderRequestRecord(selected,adminView):\"\"}\u003c/div>`;\n}\nfunction renderGrants() {\n  const filter = state.filters.grants;\n  const grants = state.workspace.grants.filter(grant=>filter===\"all\"||grant.status===filter).reverse();\n  const cards = grants.map(grant => {\n    const isMine = ownGrant(grant);\n    const active = grant.status===\"active\";\n    const options = [];\n    if (isMine) options.push(anchor(devRoutes.report(grant.resourceId),active?\"打开报表\":\"重新验证报表访问\",active?\"primary\":\"secondary\",\"arrow\"));\n    if (isMine && active) options.push(button(\"归还权限\",`data-decision=\"return\" data-grant-id=\"${escaped(grant.id)}\"`));\n    if (!isMine && active && canApprove(resource(grant.resourceId))) options.push(button(\"撤销授权\",`data-decision=\"revoke\" data-grant-id=\"${escaped(grant.id)}\"`));\n    return `\u003carticle class=\"panel resource-card\">\u003cdiv class=\"split-head\">\u003cdiv class=\"resource-ident\">\u003cspan class=\"category-icon\">${icon(\"key\")}\u003c/span>\n      \u003cdiv>\u003ch2>${escaped(resourceName(grant.resourceId))}\u003c/h2>\u003cp>${escaped(personName(grant.userId))} · ${escaped(grant.id)}\u003c/p>\u003c/div>\u003c/div>${status(grant.status)}\u003c/div>\n      \u003cdl>\u003cdiv>\u003cdt>起始时间\u003c/dt>\u003cdd>${escaped(formatTime(grant.startsAt))}\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>${grant.endedAt?\"实际结束\":\"授权到期\"}\u003c/dt>\n      \u003cdd>${escaped(formatTime(grant.endedAt||grant.expiresAt))}\u003c/dd>\u003c/div>\u003c/dl>\n      ${options.length?`\u003cdiv class=\"button-row\">${options.join(\"\")}\u003c/div>`:\"\"}\u003c/article>`;\n  });\n  $(\"main\").innerHTML = heading(\"临时授权\",\"查看授权期限和历史，也可以主动结束仍有效的授权。\")+`\u003cdiv class=\"page-filters\">\n    ${filterGroup(\"grants\",[[\"all\",\"全部\"],[\"active\",\"有效\"],[\"expired\",\"已到期\"],[\"revoked\",\"已撤销\"],[\"returned\",\"已归还\"]],filter)}\u003c/div>\n    \u003cdiv class=\"resource-grid\">${cards.join(\"\")||`\u003csection class=\"panel\">${empty(\"暂无相关授权\",\"审批通过后，授权会出现在这里。\",\"\",\"key\")}\u003c/section>`}\u003c/div>`;\n}\nfunction eventGroup(action) {\n  if (action.startsWith(\"report_\")) return \"report\";\n  if (action.startsWith(\"grant_\")) return \"grant\";\n  return \"request\";\n}\nfunction renderAudit() {\n  const user = actor();\n  if (!isAuditor(user) && !isApprover(user)) {\n    $(\"main\").innerHTML = heading(\"审计记录\")+`\u003csection class=\"panel\">${empty(\"当前身份无权查阅审计\",\"请使用具有审计权限的团队身份。\",\"\",\"lock\")}\u003c/section>`;\n    return;\n  }\n  const filter = state.auditFilter;\n  const rows = state.workspace.events.filter(event=>filter===\"all\" || eventGroup(event.action)===filter).map(event=>{\n    const eventLabel = events[event.action] || event.action;\n    const actorLabel = personName(event.actorId);\n    const resourceLabel = event.resourceId?resourceName(event.resourceId):\"\";\n    const reason = typeof event.details===\"string\"?event.details:event.details?.note;\n    const sameChain = event.requestId?` · ${escaped(event.requestId)}`:\"\";\n    return `\u003cli class=\"audit-row\">\u003ctime>${escaped(formatTime(event.at))}\u003c/time>\u003cdiv class=\"event-text\">\u003cb>${escaped(eventLabel)}\u003c/b>\n      \u003csmall>${escaped(actorLabel)}${resourceLabel?` · ${escaped(resourceLabel)}`:\"\"}${sameChain}\u003c/small>\n      ${reason?`\u003csmall>${escaped(reason)}\u003c/small>`:\"\"}\u003c/div>\n      ${status(event.action===\"report_read\"?\"allowed\":event.action===\"report_denied\"?\"denied\":\"active\",\n        eventGroup(event.action)===\"report\"?(event.action===\"report_read\"?\"通过\":\"拒绝\"):eventGroup(event.action)===\"grant\"?\"授权\":\"申请\")}\u003c/li>`;\n  });\n  $(\"main\").innerHTML = heading(\"审计记录\",isAuditor(user)?\"查看申请、审批、授权和实际报表访问的时间线。\":\"查看自己负责资源上的申请和访问事件。\")+\n    `\u003csection class=\"panel\">${panelHead(\"操作时间线\",\"\",filterGroup(\"audit\",[[\"all\",\"全部\"],[\"request\",\"申请与审批\"],[\"grant\",\"授权变更\"],[\"report\",\"报表访问\"]],filter))}\n    ${rows.length?`\u003col class=\"audit-list\">${rows.join(\"\")}\u003c/ol>`:empty(\"暂无相关操作记录\",\"发生申请、授权或访问时，系统会写入对应记录。\",\"\",\"history\")}\u003c/section>`;\n}\nfunction clockPanel(grant) {\n  if (!demo()) return \"\";\n  return `\u003csection class=\"panel clock-panel\" aria-label=\"演示时钟\">\u003cdiv>\u003cb>${icon(\"clock\")}演示时钟\u003c/b>\n    \u003csmall>当前时间 ${escaped(formatTime(now()))}。仅推进当前演示工作区。\u003c/small>\u003c/div>\n    ${button(grant?\"快进至授权到期\":\"推进 30 分钟\",`data-advance-clock=\"${grant?escaped(grant.expiresAt):\"\"}\"`,\"secondary\",\"clock\")}\u003c/section>`;\n}\nfunction renderReport(id) {\n  const item = resource(id);\n  const outcome = state.report;\n  const back = anchor(\"#resources\",\"回到资源目录\",\"secondary\",\"back\");\n  const headingText = item?.summary||\"报表接口会根据当前身份和授权期限重新校验。\";\n  if (!outcome || outcome.id!==id) {\n    $(\"main\").innerHTML = heading(item?.name||\"受保护报表\",headingText,back)+`\u003csection class=\"panel\">${empty(\"正在校验访问权限\",\"请稍等。\",\"\",\"lock\")}\u003c/section>`;\n    return;\n  }\n  if (outcome.error) {\n    const denied = outcome.error.status===403;\n    const pending = state.workspace.requests.find(req=>req.resourceId===id&&ownRequest(req)&&req.status===\"pending\");\n    const related = state.workspace.grants.findLast(grant=>grant.resourceId===id&&ownGrant(grant));\n    const reason = pending?\"该资源的申请正在等待审批。获得授权后才可以读取内容。\":\n      related&&related.status!==\"active\"?\"这项临时授权\"+labels[related.status]+\"。当前接口拒绝发送报表内容。\":\n      \"当前身份没有这份报表的有效授权。\";\n    const action = pending?anchor(devRoutes.detail(\"requests\",pending.id),\"查看申请进度\",\"primary\",\"arrow\"):\n      canRequest(item)?button(related?\"重新申请访问\":\"申请访问\",`data-request-resource=\"${escaped(id)}\"`,\"primary\",\"plus\"):\"\";\n    const audit = roleButton(state.session.roles?.find(isAuditor),\"#audit\",\"切换审计员查看记录\");\n    $(\"main\").innerHTML = heading(item?.name||\"受保护报表\",headingText,back)+`\u003csection class=\"panel panel-body access-result\" data-report-status=\"${denied?403:escaped(outcome.error.status||500)}\">\n      \u003cdiv class=\"report-hero\">${status(denied?\"denied\":\"locked\",denied?\"访问被拒绝\":\"校验未完成\")}\n        \u003ch2>${denied?\"报表暂不可读\":\"无法打开报表\"}\u003c/h2>\n        \u003cp class=\"report-description\">${escaped(denied?reason:outcome.error.message)}\u003c/p>\u003c/div>\n      \u003cdiv class=\"button-row\">${denied?action:\"\"}${button(\"重新校验访问\",\"data-check-report\")}${denied&&related?audit:\"\"}\u003c/div>\n    \u003c/section>${denied&&item?clockPanel(): \"\"}`;\n    return;\n  }\n  const {report,grant} = outcome.result;\n  const columns = Array.isArray(report.columns)?report.columns:[];\n  const column = entry => typeof entry===\"string\"?{key:entry,label:entry}:entry;\n  const cells = row => columns.map((entry,index)=>Array.isArray(row)?row[index]:row[column(entry).key]);\n  const table = `\u003cdiv class=\"report-scroll\" tabindex=\"0\" aria-label=\"报表数据\">\u003ctable class=\"report-table\">\n    \u003cthead>\u003ctr>${columns.map(entry=>`\u003cth scope=\"col\">${escaped(column(entry).label)}\u003c/th>`).join(\"\")}\u003c/tr>\u003c/thead>\n    \u003ctbody>${report.rows.map(row=>`\u003ctr>${cells(row).map(value=>`\u003ctd>${escaped(value)}\u003c/td>`).join(\"\")}\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`;\n  $(\"main\").innerHTML = heading(outcome.result.resource.name,headingText,back)+\n    `\u003csection class=\"panel panel-body access-result\" data-report-status=\"200\">\u003cdiv class=\"report-hero\">${status(\"allowed\",\"访问已授权\")}\n      \u003ch2>${escaped(report.period||\"报表明细\")}\u003c/h2>\u003cp class=\"report-description\">授权截止 ${escaped(formatTime(grant.expiresAt))}\n      ${report.summary?\" · \"+escaped(report.summary):\"\"}\u003c/p>\u003c/div>${table}\u003cdiv class=\"request-footer\">\n      ${button(\"重新校验访问\",\"data-check-report\")}${button(\"归还权限\",`data-decision=\"return\" data-grant-id=\"${escaped(grant.id)}\"`)}\u003c/div>\u003c/section>\n      ${clockPanel(grant)}`;\n  if (!demo()) {\n    const ms = Number(new Date(grant.expiresAt))-Date.now();\n    expiryTimer=setTimeout(()=>{if(route().view===\"resources\"&&route().id===id)loadWorkspace();},Math.min(2147483000,Math.max(250,ms+100)));\n  }\n}\n\nfunction renderPage(current) {\n  renderFrame(current.view);\n  const {view,id} = current;\n  if (view===\"home\") renderHome();\n  else if (view===\"resources\") id?renderReport(id):renderResourceDirectory();\n  else if (view===\"requests\" || view===\"approvals\") renderRequests(id,view===\"approvals\");\n  else if (view===\"grants\") renderGrants();\n  else renderAudit();\n}\nasync function loadWorkspace() {\n  if (!state.session ).open) $(\"modal\").close();\n  $(\"modal-content\").innerHTML = `\u003cdiv class=\"dialog-inner\">${modalTitle(title,summary)}\u003cform ${formAttrs}>\n    ${contents}\u003cp class=\"form-error\" role=\"alert\" hidden>\u003c/p>\u003cdiv class=\"form-end\">${button(\"取消\",\"data-close\")}\n    \u003cbutton type=\"submit\" class=\"btn primary\">${escaped(action)}${icon(\"arrow\")}\u003c/button>\u003c/div>\u003c/form>\u003c/div>`;\n  modalHref=location.hash;\n  $(\"modal\").showModal();\n}\nfunction openRequest(id) {\n  const item = resource(id);\n  if (!canRequest(item)) return;\n  const max = item.maxMinutes;\n  const choices = [...new Set([5,15,30,60].filter(minutes=>minutes\u003cmax).concat(max))].sort((a,b)=>a-b)\n    .map(minutes=>({value:String(minutes),label:`${minutes} 分钟`}));\n  const selected=choices.find(choice=>Number(choice.value)>=Math.min(15,max));\n  if (max>1) choices.push({value:\"custom\",label:\"自定义时长\"});\n  const prefilled = demo() && id===mainResource?\"本周临时支援区域运营复盘，需要核对区域经营周报。\":\"\";\n  modalForm(\"申请访问\",item.name,`\u003clabel class=\"form-field\">使用原因\u003ctextarea name=\"reason\" minlength=\"4\" maxlength=\"300\" required placeholder=\"说明工作内容和为什么需要这份报表\">${escaped(prefilled)}\u003c/textarea>\u003c/label>\n    \u003cdiv class=\"form-field\">\u003cspan>授权时长\u003c/span>${picker(\"minutes\",choices,selected.value,\"授权时长\")}\n    \u003clabel class=\"custom-duration\" hidden>分钟数\u003cinput name=\"customMinutes\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"${escaped(max)}\" step=\"1\" disabled>\u003c/label>\n    \u003csmall>从审批通过起计时。最长 ${escaped(max)} 分钟。\u003c/small>\u003c/div>`, \"提交申请\",`id=\"request-form\" data-resource=\"${escaped(id)}\"`);\n  $(\"request-form\").elements.reason.focus();\n}\nconst decisions = {\n  approve:{title:\"批准申请\",help:\"授权从本次批准起生效，按申请时长到期。\"},\n  deny:{title:\"拒绝申请\",help:\"申请人可以在进度中查看拒绝原因。\",required:true},\n  withdraw:{title:\"撤回申请\",help:\"撤回后，审批人将无法再处理这条申请。\"},\n  revoke:{title:\"撤销授权\",help:\"确认后立即结束这项授权，下一次读取将被拒绝。\",required:true},\n  return:{title:\"归还权限\",help:\"任务结束后，可立即结束自己的授权。\"}\n};\nfunction openDecision(kind,id,type) {\n  const decision = decisions[kind];\n  if (!decision||!id) return;\n  modalForm(decision.title,decision.help,`\u003clabel class=\"form-field\">${decision.required?\"处理原因\":\"处理说明（选填）\"}\n    \u003ctextarea name=\"note\" maxlength=\"300\" ${decision.required?\"required\":\"\"} placeholder=\"记录本次处理的依据\">\u003c/textarea>\u003c/label>`,\n    decision.title,`id=\"decision-form\" data-action=\"${escaped(kind)}\" data-id=\"${escaped(id)}\" data-type=\"${escaped(type)}\"`);\n  $(\"decision-form\").elements.note.focus();\n}\nfunction formError(form,message) {\n  const error = form.querySelector(\".form-error\");\n  error.textContent = message;\n  error.hidden = false;\n}\nasync function submitForm(form) {\n  if (mutationPending) return;\n  mutationPending = true;\n  const submit = form.querySelector('[type=\"submit\"]');\n  submit.disabled = true;\n  form.querySelector(\".form-error\").hidden = true;\n  try {\n    if (form.id===\"login-form\") {\n      const data = new FormData(form);\n      state.session=await post(\"/api/login\",{id:data.get(\"id\").trim(),password:data.get(\"password\")});\n      state.workspace=null;\n      await loadWorkspace();\n    } else if (form.id===\"request-form\") {\n      const reason=form.elements.reason.value.trim();\n      if (reason.length\u003c4) throw new Error(\"请填写至少 4 个字的使用原因。\");\n      const value=form.querySelector('[data-picker=\"minutes\"]').dataset.value;\n      const minutes=Number(value===\"custom\"?form.elements.customMinutes.value:value);\n      const result = await post(\"/api/requests\",{resourceId:form.dataset.resource,reason,minutes});\n      $(\"modal\").close();\n      setNotice(result.created===false?\"已打开同一份申请。\":\"申请已提交，等待资源负责人审批。\");\n      go(devRoutes.detail(\"requests\",result.request.id));\n    } else {\n      const {action,id,type} = form.dataset;\n      const note = form.elements.note.value.trim();\n      if (decisions[action].required&&!note) throw new Error(\"请填写处理原因。\");\n      await post(\"/api/\"+type+\"/\"+component(id)+\"/\"+action,{note});\n      $(\"modal\").close();\n      setNotice(decisions[action].title+\"成功。\");\n      if (type===\"requests\"&&route().view===\"approvals\"&&[\"approve\",\"deny\"].includes(action)) {\n        state.filters.approvals=\"all\";\n        go(devRoutes.detail(\"approvals\",id));\n      } else await loadWorkspace();\n    }\n  } catch (error) { if (form.isConnected) formError(form,error.message); }\n  finally { mutationPending=false; submit.disabled=false; }\n}\nfunction suggestedRoleRoute(nextRole) {\n  const current = route();\n  if (nextRole.role===\"auditor\") return \"#audit\";\n  if (current.view===\"resources\") return location.hash;\n  return nextRole.role===\"approver\"?\"#approvals\":\"#home\";\n}\nasync function changeRole(id,target) {\n  if (id===actor().id || mutationPending) return;\n  mutationPending=true;\n  try {\n    state.session=await post(\"/api/session/role\",{id});\n    renderVersion++;\n    clearTimeout(expiryTimer);\n    state.workspace=null;\n    state.report=null;\n    // Clear the previous identity’s view before awaiting any new workspace data.\n    $(\"main\").replaceChildren();\n    $(\"main\").setAttribute(\"aria-busy\",\"true\");\n    go(target || suggestedRoleRoute(state.session.user));\n  } catch (error) { setNotice(error.message); }\n  finally { mutationPending=false; }\n}\nasync function advanceClock(expiresAt) {\n  if (mutationPending || !demo()) return;\n  mutationPending=true;\n  try {\n    const delta=expiresAt?Math.ceil((Number(new Date(Number(expiresAt))) - Number(new Date(now())))/60000):30;\n    const minutes=Number.isFinite(delta)?Math.min(1440,Math.max(1,delta)):30;\n    state.session=await post(\"/api/demo/clock\",{minutes});\n    setNotice(`演示时钟已推进 ${minutes} 分钟，正在重新检查报表。`);\n    await loadWorkspace();\n  } catch (error) { setNotice(error.message); }\n  finally { mutationPending=false; }\n}\nasync function signOut() {\n  if (mutationPending) return;\n  mutationPending = true;\n  try {\n    state.session=await post(\"/api/logout\");\n    state.workspace=null;\n    state.report=null;\n    clearTimeout(expiryTimer);\n    renderVersion++;\n    $(\"main\").replaceChildren();\n    showEntry();\n  } catch (error) { setNotice(error.message); }\n  finally { mutationPending=false; }\n}\nfunction closePickers(target) {\n  document.querySelectorAll(\".picker[open]\").forEach(menu=>{if (!menu.contains(target)) menu.open=false;});\n}\nfunction chooseOption(target) {\n  const menu=target.closest(\".picker\"), value=target.dataset.pick;\n  const summary=menu.querySelector(\"summary\");\n  menu.open=false;\n  summary.focus();\n  if (menu.dataset.picker===\"role\") {changeRole(value);return;}\n  menu.dataset.value=value;\n  summary.querySelector(\".picker-label\").textContent=target.textContent;\n  summary.setAttribute(\"aria-label\",\"授权时长，\"+target.textContent);\n  menu.querySelectorAll(\"[data-pick]\").forEach(option=>{\n    option.setAttribute(\"aria-pressed\",String(option===target));\n  });\n  const input=menu.closest(\"form\").elements.customMinutes;\n  input.closest(\"label\").hidden=value!==\"custom\";\n  input.disabled=value!==\"custom\";\n  input.required=value===\"custom\";\n  if (value===\"custom\") input.focus();\n}\nfunction changeFilter(group,value,focusSelector) {\n  if (group===\"audit\") {\n    state.auditFilter=value;\n    renderAudit();\n  } else {\n    state.filters[group]=value;\n    if(group===\"approvals\") {\n      if(route().id) {go(\"#approvals\");return;}\n      renderRequests(\"\",true);\n    } else renderGrants();\n  }\n  document.querySelector(focusSelector)?.focus({preventScroll:true});\n}\ndocument.querySelectorAll(\"[data-icon]\").forEach(element=>{\n  element.innerHTML=icon(element.dataset.icon);\n  element.setAttribute(\"aria-hidden\",\"true\");\n});\ndocument.addEventListener(\"submit\",event=>{\n  if ([\"login-form\",\"request-form\",\"decision-form\"].includes(event.target.id)) {\n    event.preventDefault();\n    submitForm(event.target);\n  }\n});\ndocument.addEventListener(\"click\",event=>{\n  closePickers(event.target);\n  const control=event.target.closest(\"button,a\");\n  if (!control) return;\n  const data=control.dataset;\n  if (control.matches(\".skip-link\")) {event.preventDefault();($(\"shell\").hidden?$(\"entry\"):$(\"main\")).focus();return;}\n  if (control.id===\"logout\" || \"logout\" in data) signOut();\n  else if (\"retry\" in data) start();\n  else if (\"pick\" in data) chooseOption(control);\n  else if (\"switchRole\" in data) changeRole(data.switchRole,data.switchTarget);\n  else if (\"close\" in data) $(\"modal\").close();\n  else if (\"requestResource\" in data) openRequest(data.requestResource);\n  else if (\"decision\" in data) openDecision(data.decision,data.requestId||data.grantId,data.requestId?\"requests\":\"grants\");\n  else if (\"advanceClock\" in data) advanceClock(data.advanceClock);\n  else if (\"checkReport\" in data) loadWorkspace();\n  else if (\"filter\" in data) {\n    const selector=`[data-filter-group=\"${data.filterGroup}\"][data-filter=\"${data.filter}\"]`;\n    changeFilter(data.filterGroup,data.filter,selector);\n  }\n});\ndocument.addEventListener(\"focusin\",event=>closePickers(event.target));\ndocument.addEventListener(\"keydown\",event=>{\n  const menu=event.target.closest(\".picker\");\n  if (!menu) return;\n  if (event.key===\"Escape\" && menu.open) {\n    event.preventDefault();\n    event.stopPropagation();\n    menu.open=false;\n    menu.querySelector(\"summary\").focus();\n  } else if ([\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\"].includes(event.key)) {\n    event.preventDefault();\n    menu.open=true;\n    const choices=[...menu.querySelectorAll(\"[data-pick]\")];\n    const current=choices.indexOf(document.activeElement);\n    const next=event.key===\"Home\"?0:event.key===\"End\"?choices.length-1:\n      event.key===\"ArrowDown\"?Math.min(choices.length-1,current+1):current\u003c0?choices.length-1:Math.max(0,current-1);\n    choices[next]?.focus();\n  }\n});\nwindow.addEventListener(\"hashchange\",()=>{\n  if ($(\"modal\").open && modalHref!==location.hash) $(\"modal\").close();\n  window.scrollTo(0,0);\n  loadWorkspace();\n});\nstart();\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#1a2032\">\n  \u003ctitle>临时权限工作台\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#main\">跳至内容\u003c/a>\n  \u003cdiv class=\"shell\" id=\"shell\" hidden>\n    \u003caside class=\"sidebar\" aria-label=\"工作区\">\n      \u003ca class=\"wordmark\" href=\"#home\">\n        \u003cspan class=\"brand-icon\" data-icon=\"shield\">\u003c/span>\u003cspan>临时权限工作台\u003csmall>访问管理\u003c/small>\u003c/span>\n      \u003c/a>\n      \u003cnav id=\"navigation\" aria-label=\"工作区导航\">\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">\n        \u003cdiv class=\"session-card\" id=\"actor\">\u003c/div>\n        \u003cbutton class=\"sidebar-action\" id=\"logout\" type=\"button\" hidden>退出登录\u003c/button>\n        \u003ca class=\"source-link\" href=\"https://github.com/fate788/temporary-access\" target=\"_blank\" rel=\"noopener\">项目源码 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/aside>\n    \u003cdiv class=\"workspace\">\n      \u003cheader class=\"topbar\">\n        \u003cdiv class=\"breadcrumbs\">\u003cspan>访问管理\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cb id=\"breadcrumb\">工作台\u003c/b>\u003c/div>\n        \u003cdiv class=\"top-actions\" id=\"top-actions\">\u003c/div>\n      \u003c/header>\n      \u003cmain class=\"page\" id=\"main\" tabindex=\"-1\" aria-busy=\"true\">\u003c/main>\n    \u003c/div>\n  \u003c/div>\n  \u003cmain class=\"entry\" id=\"entry\" tabindex=\"-1\" aria-live=\"polite\">\u003cp>正在打开临时权限工作台…\u003c/p>\u003c/main>\n  \u003cdialog id=\"modal\" aria-labelledby=\"modal-title\">\n    \u003cdiv id=\"modal-content\">\u003c/div>\n  \u003c/dialog>\n  \u003cdiv id=\"message\" class=\"notice\" role=\"status\" hidden>\u003c/div>\n  \u003cnoscript>\u003cdiv class=\"entry\">请启用 JavaScript 后打开工作台。\u003c/div>\u003c/noscript>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --canvas: #f4f5fa;\n  --paper: #fff;\n  --tint: #f8f8fc;\n  --ink: #20253d;\n  --muted: #59617a;\n  --faint: #737b94;\n  --line: #e0e3ed;\n  --hairline: #ebedf4;\n  --accent: #5749a1;\n  --accent-deep: #3f347b;\n  --accent-light: #f0edfb;\n  --nav: #1b2033;\n  --nav-light: #292e47;\n  --lift: 0 8px 28px #242a4c0d;\n  --radius: 14px;\n  --sidebar: 232px;\n  font: 15px/1.6 Inter, \"Microsoft YaHei UI\", \"PingFang SC\", system-ui, sans-serif;\n  color: var(--ink);\n  background: var(--canvas);\n}\n\n* { box-sizing: border-box; }\nbody { margin: 0; min-height: 100vh; }\nbutton, input, textarea { font: inherit; color: inherit; }\nh1, h2, h3, p, ul, dl, dd { margin: 0; }\nul, ol { padding: 0; }\nbutton, a { -webkit-tap-highlight-color: transparent; }\na { color: inherit; text-decoration: none; }\nbutton { cursor: pointer; }\nbutton:disabled { opacity: .64; cursor: wait; }\n[hidden] { display: none !important; }\n:where(button, a, summary, input, textarea, [tabindex=\"0\"]):focus-visible { outline: 3px solid #826bd2; outline-offset: 3px; }\nsvg { fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; width: 1em; height: 1em; }\n:where(h1, h2, h3, p, dd, .wrap, .event-text) { overflow-wrap: anywhere; }\n.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n.skip-link { position: fixed; z-index: 20; left: 10px; top: -70px; background: var(--paper); padding: 8px 13px; border-radius: 8px; }\n.skip-link:focus { top: 10px; }\n.ico { display: inline-flex; flex: none; align-items: center; justify-content: center; font-style: normal; }\n.meta { color: var(--muted); font-size: 13px; }\n.muted { color: var(--muted); }\n.mono { font-variant-numeric: tabular-nums; }\n\n.shell { display: grid; grid-template-columns: var(--sidebar) minmax(0,1fr); min-height: 100dvh; }\n.sidebar { position: sticky; top: 0; height: 100dvh; min-width: 0; display: flex; flex-direction: column; padding: 23px 16px 17px; color: #ebebf7; background: radial-gradient(ellipse at 0% 0%, #2b2c4b, transparent 56%), var(--nav); }\n.wordmark { display: flex; align-items: center; gap: 11px; padding: 5px 4px 25px; margin: 0 0 18px; border-bottom: 1px solid #ffffff17; font-size: 17px; font-weight: 720; white-space: nowrap; letter-spacing: -.025em; }\n.wordmark small { display: block; color: #a5a9c4; font-size: 11px; font-weight: 450; letter-spacing: .09em; }\n.brand-icon { display: grid; place-items: center; flex: none; height: 37px; width: 37px; border: 1px solid #9890d578; border-radius: 10px; color: #d7ccff; font-size: 23px; background: #55498052; }\n.sidebar nav { display: grid; gap: 5px; }\n.nav-link { display: flex; align-items: center; gap: 11px; padding: 9px 12px; min-height: 44px; border: 1px solid transparent; border-radius: 9px; color: #bcc2da; font-size: 14px; font-weight: 540; }\n.nav-link .ico { width: 18px; font-size: 17px; color: #afb3d4; }\n.nav-link:hover, .sidebar-action:hover { color: #fff; background: #ffffff0a; }\n.nav-link[aria-current] { color: #fff; background: #403861; border-color: #8476b855; font-weight: 650; }\n.nav-link[aria-current] .ico { color: #dbd0ff; }\n.nav-badge { margin-left: auto; min-width: 22px; padding: 0 5px; border-radius: 5px; text-align: center; color: #e0d8ff; background: #8473b744; font-size: 11px; }\n.sidebar-footer { margin-top: auto; padding-top: 14px; display: grid; gap: 5px; }\n.session-card { display: flex; align-items: center; gap: 9px; min-width: 0; border-top: 1px solid #ffffff1f; padding: 13px 4px 4px; }\n.avatar { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 8px; color: #e5ddff; background: #595080; font-size: 14px; }\n.session-card b, .session-card small { display: block; overflow-wrap: anywhere; }\n.session-card b { font-size: 13px; font-weight: 650; }\n.session-card small { color: #abb1cc; font-size: 11px; }\n.source-link,.sidebar-action { padding: 6px 7px; border: 0; border-radius: 5px; color: #b7bdd7; background: none; text-align: left; font-size: 12px; align-self: start; }\n.source-link:hover { color: #fff; }\n.source-link span { margin-left: 3px; }\n.sidebar-action { display: block; }\n.workspace { min-width: 0; }\n.topbar { min-height: 67px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; border-bottom: 1px solid var(--line); background: #fdfdff; padding: 12px clamp(21px,3.1vw,48px); }\n.breadcrumbs, .top-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; min-width: 0; font-size: 13px; color: var(--muted); }\n.breadcrumbs [aria-hidden] { color: #8e94aa; }\n.breadcrumbs b { color: var(--ink); font-weight: 625; }\n.demo-flag { display: flex; align-items: center; gap: 5px; color: var(--accent-deep); background: var(--accent-light); border: 1px solid #e6e0f6; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; }\n.demo-flag:before { content: \"\"; width: 6px; height: 6px; border-radius: 50%; background: #7664bb; }\n.page { max-width: 1400px; margin-inline: auto; padding: 27px clamp(21px,3.1vw,48px) 53px; outline: none; }\n.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 22px; margin: 0 0 19px; }\n.page-head h1 { font-size: clamp(27px,3vw,39px); font-weight: 700; line-height: 1.23; letter-spacing: -.037em; }\n.page-head p { margin-top: 7px; color: var(--muted); font-size: 14px; }\n.button-row,.heading-actions { display:flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 39px; max-width: 100%; padding: 6px 13px; border: 1px solid transparent; border-radius: 8px; font-size: 13px; font-weight: 620; line-height: 1.3; text-align: center; }\n.btn .ico { font-size: 16px; }\n.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 7px #4d418228; }\n.btn.primary:hover { background: var(--accent-deep); }\n.btn.secondary { background: var(--paper); border-color: #d5daea; color: #383e5e; }\n.btn.secondary:hover { border-color: #aca3d0; background: #f9f7ff; }\n.btn.light { background: #f0edff; color: #332963; border-color: #f0edff; }\n.btn.light:hover { background: #fff; }\n.btn.dark-outline { background: #ffffff08; border-color: #ffffff50; color: #f3f1ff; }\n.btn.dark-outline:hover { background: #ffffff1b; }\n.btn.subtle { background: transparent; color: var(--accent-deep); }\n.btn.subtle:hover { background: var(--accent-light); }\n.action-link { color: var(--accent-deep); background: transparent; border: 0; padding: 0; font-size: 13px; font-weight: 620; }\n.action-link:hover { text-decoration: underline; text-underline-offset: 4px; }\n.mobile-logout { display: none; }\n\n.hero { position: relative; display: grid; grid-template-columns: minmax(0,1.2fr) minmax(220px,.8fr); min-height: 256px; isolation: isolate; overflow: hidden; border: 1px solid #3c4262; border-radius: 17px; color: #fafaff; background: linear-gradient(113deg,#21263f 14%,#2c3055 68%,#36345e); box-shadow: 0 12px 28px #28275419; }\n.hero-copy { position: relative; z-index: 1; align-self: center; padding: 28px 0 30px clamp(20px,3.1vw,45px); }\n.h
