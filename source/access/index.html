or .14s ease; }\n}\n","group":"前端"},{"path":"static/transport.mjs","text":"export default async function request(path, options={}) {\n  const method=options.method || \"GET\";\n  const headers={Accept:\"application/json\"};\n  const init={method,credentials:\"same-origin\",cache:\"no-store\",headers};\n  if(method===\"POST\"){\n    headers[\"Content-Type\"]=\"application/json\";\n    headers[\"X-Workspace-Request\"]=\"1\";\n    init.body=JSON.stringify(options.body || {});\n  }\n  const response=await fetch(path,init);\n  const body=await response.json();\n  if(!response.ok){\n    const error=new Error(body.error || \"工作台请求失败，请重试。\");\n    error.status=response.status;\n    error.code=body.code;\n    throw error;\n  }\n  return body;\n}\n","group":"前端"},{"path":"tests/domain.test.mjs","text":"import assert from \"node:assert/strict\";\nimport { test } from \"node:test\";\nimport { createWorkspace, handle } from \"../domain.mjs\";\n\nconst MINUTE = 60_000;\nconst START = Date.UTC(2026, 10, 27, 8);\nconst USERS = [\n  { id: \"lin\", name: \"林晓\", role: \"employee\", department: \"运营\" },\n  { id: \"xu\", name: \"许一\", role: \"employee\", department: \"运营\" },\n  { id: \"cheng\", name: \"程宁\", role: \"approver\", department: \"运营\" },\n  { id: \"qiao\", name: \"乔念\", role: \"approver\", department: \"支持\" },\n  { id: \"gu\", name: \"顾文\", role: \"auditor\", department: \"审计\" },\n];\nconst OPERATIONS = {\n  id: \"operations\",\n  name: \"渠道复盘报表\",\n  category: \"报表\",\n  department: \"运营\",\n  summary: \"核对渠道投放转化。\",\n  maxMinutes: 30,\n  approverIds: [\"cheng\"],\n  report: { period: \"2026-W48\", columns: [\"渠道\", \"访问量\"], rows: [[\"直营\", 4167]] },\n};\nconst SUPPORT = {\n  id: \"support\",\n  name: \"支持回访报表\",\n  category: \"报表\",\n  department: \"支持\",\n  summary: \"查看各组的回访完成情况。\",\n  maxMinutes: 15,\n  approverIds: [\"qiao\"],\n  requesterIds: [\"lin\", \"qiao\"],\n  report: { period: \"2026-W48\", columns: [\"团队\", \"回访量\"], rows: [[\"一组\", 729]] },\n};\n\nfunction setup() {\n  const state = createWorkspace({ users: USERS, resources: [OPERATIONS, SUPPORT] });\n  function get(actorId, path, now = START) {\n    return handle(state, { method: \"GET\", path, actorId, now });\n  }\n  function post(actorId, path, body, now = START) {\n    return handle(state, { method: \"POST\", path, actorId, now, body });\n  }\n  function request(resourceId, actorId = \"lin\", now = START, minutes = 5) {\n    const result = post(actorId, \"/api/requests\", { resourceId, minutes, reason: \"支援项目核对本周数据\" }, now);\n    assert.equal(result.status, 201);\n    return result.body.request;\n  }\n  return { state, get, post, request };\n}\n\ntest(\"报表同一路径从拒绝到允许，在授权到期毫秒立即拒绝\", () => {\n  const { get, post, request } = setup();\n  const path = \"/api/resources/operations/report\";\n  assert.equal(get(\"lin\", path).status, 403);\n  const pending = request(\"operations\");\n  assert.equal(get(\"lin\", path).status, 403);\n\n  const approvalAt = START + 3 * MINUTE;\n  const response = post(\"cheng\", \"/api/requests/\" + pending.id + \"/approve\", { note: \"限本次核对\" }, approvalAt);\n  assert.equal(response.status, 200);\n  assert.equal(response.body.grant.startsAt, approvalAt);\n  assert.equal(response.body.grant.expiresAt, approvalAt + 5 * MINUTE);\n\n  const expires = response.body.grant.expiresAt;\n  const allowed = get(\"lin\", path, expires - 1);\n  assert.equal(allowed.status, 200);\n  assert.deepEqual(allowed.body.report, OPERATIONS.report);\n  const expired = get(\"lin\", path, expires);\n  assert.equal(expired.status, 403);\n  assert.equal(expired.body.report, undefined);\n  assert.equal(get(\"lin\", path, expires + 1).status, 403);\n\n  const { grants, events } = get(\"gu\", \"/api/workspace\", expires + 1).body;\n  assert.equal(grants[0].status, \"expired\");\n  assert.equal(grants[0].endedAt, expires);\n  assert.equal(events.filter(event => event.action === \"grant_expired\").length, 1);\n  assert.deepEqual(events.filter(event => event.action.startsWith(\"report_\")).map(event => event.details.status),\n    [403, 403, 200, 403, 403]);\n});\n\ntest(\"授权只能用于对应的本人和资源，工作区只展示角色可见记录\", () => {\n  const { get, post, request } = setup();\n  const pending = request(\"operations\");\n  assert.equal(post(\"cheng\", \"/api/requests/\" + pending.id + \"/approve\", {}).status, 200);\n\n  assert.equal(get(\"lin\", \"/api/resources/support/report\").status, 403);\n  assert.equal(get(\"xu\", \"/api/resources/operations/report\").status, 403);\n  assert.equal(get(\"cheng\", \"/api/resources/operations/report\").status, 403);\n  assert.equal(get(\"gu\", \"/api/resources/operations/report\").status, 403);\n  assert.equal(get(\"anonymous\", \"/api/resources/operations/report\").status, 401);\n\n  const anotherEmployee = get(\"xu\", \"/api/workspace\").body;\n  assert.deepEqual(anotherEmployee.requests, []);\n  assert.deepEqual(anotherEmployee.grants, []);\n  assert.deepEqual(anotherEmployee.resources.map(resource => resource.id), [\"operations\"]);\n  assert.equal(get(\"qiao\", \"/api/workspace\").body.requests.length, 0);\n  assert.equal(get(\"cheng\", \"/api/workspace\").body.requests[0].requesterId, \"lin\");\n\n  const audit = get(\"gu\", \"/api/workspace\").body;\n  assert.equal(audit.grants.length, 1);\n  assert.equal(audit.resources.length, 2);\n  assert.ok(audit.resources.every(resource => !Object.hasOwn(resource, \"report\")));\n  assert.ok(!JSON.stringify(audit).includes(\"4167\"));\n});\n\ntest(\"重复提交和批准只创建一次，审批人只能审批所负责资源的他人申请\", () => {\n  const { get, post, request } = setup();\n  const pending = request(\"operations\");\n  const repeated = post(\"lin\", \"/api/requests\", {\n    resourceId: \"operations\", minutes: 5, reason: \"支援项目核对本周数据\",\n  });\n  assert.equal(repeated.status, 200);\n  assert.equal(repeated.body.created, false);\n  assert.equal(repeated.body.request.id, pending.id);\n  assert.equal(post(\"lin\", \"/api/requests\", {\n    resourceId: \"operations\", minutes: 4, reason: \"同一项正在等待审批\",\n  }).status, 409);\n\n  const approval = \"/api/requests/\" + pending.id + \"/approve\";\n  assert.equal(post(\"qiao\", approval, {}).status, 404);\n  assert.deepEqual(post(\"xu\", approval, {}), post(\"xu\", \"/api/requests/req-does-not-exist/approve\", {}));\n  assert.equal(post(\"gu\", approval, {}).status, 403);\n  const first = post(\"cheng\", approval, { note: \"限本次\" });\n  const repeat = post(\"cheng\", approval, { note: \"限本次\" });\n  assert.equal(first.status, 200);\n  assert.equal(repeat.status, 200);\n  assert.equal(first.body.grant.id, repeat.body.grant.id);\n\n  const own = request(\"support\", \"qiao\");\n  assert.equal(post(\"qiao\", \"/api/requests/\" + own.id + \"/approve\", {}).body.code, \"SELF_APPROVAL\");\n  const audit = get(\"gu\", \"/api/workspace\").body;\n  assert.equal(audit.grants.length, 1);\n  assert.equal(audit.events.filter(event => event.action === \"request_approved\").length, 1);\n});\n\ntest(\"资源策略变化阻止超额审批并撤销已失去资格的存量授权\", () => {\n  const { state, get, post, request } = setup();\n  const earlier = request(\"operations\", \"lin\", START, 20);\n  state.resources[0].maxMinutes = 10;\n  const approval = post(\"cheng\", \"/api/requests/\" + earlier.id + \"/approve\", {});\n  assert.equal(approval.status, 409);\n  assert.equal(approval.body.code, \"DURATION_POLICY_CHANGED\");\n  assert.equal(post(\"lin\", \"/api/requests/\" + earlier.id + \"/withdraw\", {}).status, 200);\n\n  const adjusted = request(\"operations\");\n  assert.equal(post(\"cheng\", \"/api/requests/\" + adjusted.id + \"/approve\", {}).status, 200);\n  const path = \"/api/resources/operations/report\";\n  assert.equal(get(\"lin\", path, START + 1).status, 200);\n  state.resources[0].requesterIds = [\"xu\"];\n  assert.equal(get(\"lin\", path, START + 2).status, 403);\n  state.resources[0].requesterIds.push(\"lin\");\n  assert.equal(get(\"lin\", path, START + 3).status, 403);\n\n  const { grants, events } = get(\"gu\", \"/api/workspace\", START + 3).body;\n  assert.equal(grants[0].status, \"revoked\");\n  const revoked = events.find(event => event.action === \"grant_revoked\");\n  assert.equal(revoked.actorId, \"system\");\n  assert.equal(revoked.details.reason, \"policy_changed\");\n});\n\ntest(\"撤回和拒绝不发放授权，超过审批期限无法批准\", () => {\n  const { get, post, request } = setup();\n  const withdrawn = request(\"operations\");\n  const withdrawal = \"/api/requests/\" + withdrawn.id + \"/withdraw\";\n  assert.equal(post(\"cheng\", withdrawal, {}).status, 403);\n  assert.equal(post(\"lin\", withdrawal, {}).body.request.status, \"withdrawn\");\n  assert.equal(post(\"cheng\", \"/api/requests/\" + withdrawn.id + \"/approve\", {}).status, 409);\n\n  const denied = request(\"operations\");\n  const denial = post(\"cheng\", \"/api/requests/\" + denied.id + \"/deny\", { note: \"需先与项目负责人核对\" });\n  assert.equal(denial.body.request.status, \"denied\");\n  assert.equal(denial.body.request.note, \"需先与项目负责人核对\");\n\n  const forgotten = request(\"operations\");\n  assert.equal(post(\"cheng\", \"/api/requests/\" + forgotten.id + \"/approve\", {}, forgotten.deadlineAt).status, 409);\n  const snapshot = get(\"gu\", \"/api/workspace\", forgotten.deadlineAt + 1).body;\n  assert.deepEqual(snapshot.requests.map(record => record.status), [\"withdrawn\", \"denied\", \"expired\"]);\n  assert.equal(snapshot.grants.length, 0);\n  assert.equal(snapshot.events.filter(event => event.action === \"request_expired\").length, 1);\n  assert.equal(get(\"lin\", \"/api/resources/operations/report\", forgotten.deadlineAt + 1).status, 403);\n});\n\ntest(\"审批人撤销和申请人归还会立即阻止后续读取\", () => {\n  const { get, post, request } = setup();\n  const path = \"/api/resources/operations/report\";\n  const first = request(\"operations\");\n  const approved = post(\"cheng\", \"/api/requests/\" + first.id + \"/approve\", {}).body.grant;\n  const revoke = \"/api/grants/\" + approved.id + \"/revoke\";\n  assert.equal(post(\"qiao\", revoke, {}, START + 1).status, 404);\n  assert.deepEqual(post(\"xu\", revoke, {}, START + 1), post(\"xu\", \"/api/grants/grant-does-not-exist/revoke\", {}, START + 1));\n  assert.equal(get(\"lin\", path, START + 1).status, 200);\n  assert.equal(post(\"cheng\", revoke, { note: \"任务已提前结束\" }, START + 2).body.grant.status, \"revoked\");\n  assert.equal(get(\"lin\", path, START + 2).status, 403);\n\n  const second = request(\"operations\", \"lin\", START + 3);\n  const added = post(\"cheng\", \"/api/requests/\" + second.id + \"/approve\", {}, START + 3).body.grant;\n  const returnAccess = \"/api/grants/\" + added.id + \"/return\";\n  assert.equal(post(\"cheng\", returnAccess, {}, START + 4).status, 403);\n  assert.equal(get(\"lin\", path, START + 4).status, 200);\n  assert.equal(post(\"lin\", returnAccess, { note: \"数据核对完成\" }, START + 5).body.grant.status, \"returned\");\n  assert.equal(get(\"lin\", path, START + 5).status, 403);\n});\n","group":"验收测试"},{"path":"tests/http.test.mjs","text":"import assert from \"node:assert/strict\";\nimport {once} from \"node:events\";\nimport {spawn} from \"node:child_process\";\nimport {mkdtemp,rm} from \"node:fs/promises\";\nimport {tmpdir} from \"node:os\";\nimport {join} from \"node:path\";\nimport {fileURLToPath} from \"node:url\";\nimport {test} from \"node:test\";\n\nconst root=fileURLToPath(new URL(\"../\",import.meta.url));\nconst postHeaders={\"Content-Type\":\"application/json\",\"X-Workspace-Request\":\"1\"};\nconst demoReport=\"/api/resources/regional-report/report\";\nconst loginSecret=\"test-fixture-only-password\";\n\nasync function serve(t,arguments_=[],env={}){\n  const temp=await mkdtemp(join(tmpdir(),\"temporary-access-test-\"));\n  const child=spawn(process.execPath,[\"server.mjs\",\"--port\",\"0\",\"--db\",join(temp,\"test.sqlite\"),...arguments_],\n    {cwd:root,env:{...process.env,...env},stdio:[\"ignore\",\"pipe\",\"pipe\"]});\n  const exited=once(child,\"exit\");\n  t.after(async()=>{\n    child.kill();\n    await exited.catch(()=>{});\n    await rm(temp,{recursive:true,force:true});\n  });\n  const url=await new Promise((resolve,reject)=>{\n    let output=\"\",errors=\"\";\n    child.stderr.on(\"data\",chunk=>{errors+=chunk;});\n    child.stdout.on(\"data\",chunk=>{\n      output+=chunk;\n      const match=output.match(/http:\\/\\/127\\.0\\.0\\.1:\\d+/u);\n      if(match)resolve(match[0]);\n    });\n    child.on(\"error\",reject);\n    child.on(\"exit\",code=>reject(new Error(`Server stopped (${code}) ${errors}`)));\n  });\n  return url;\n}\n\nfunction client(base){\n  let cookie=\"\";\n  return {\n    cookie:()=>cookie,\n    async request(path,body,headers={}){\n      const response=await fetch(base+path,{\n        method:body===undefined?\"GET\":\"POST\",\n        headers:{...(body===undefined?{}:postHeaders),...(cookie?{Cookie:cookie}:{}),...headers},\n        body:body===undefined?undefined:JSON.stringify(body),\n      });\n      const set=response.headers.get(\"set-cookie\");\n      if(set)cookie=set.split(\";\")[0];\n      const type=response.headers.get(\"content-type\");\n      const data=type?.includes(\"application/json\")?await response.json():await response.text();\n      return {status:response.status,data,headers:response.headers};\n    },\n  };\n}\n\ntest(\"same report returns 403, 200, then 403 and records the actual decisions\", {timeout:15000},async t=>{\n  const base=await serve(t);\n  const person=client(base);\n  const initial=await person.request(\"/api/session\");\n  assert.equal(initial.data.user.id,\"employee\");\n  assert.match(initial.headers.get(\"set-cookie\"),/HttpOnly/i);\n  assert.match(initial.headers.get(\"set-cookie\"),/SameSite=/i);\n  assert.equal((await person.request(demoReport)).status,403);\n  const catalogue=await person.request(\"/api/workspace\");\n  assert.ok(!JSON.stringify(catalogue.data).includes(\"192.6\"));\n\n  const input={resourceId:\"regional-report\",reason:\"参加区域经营复盘\",minutes:15};\n  const pending=await person.request(\"/api/requests\",input);\n  assert.equal(pending.status,201);\n  const duplicate=await person.request(\"/api/requests\",input);\n  assert.equal(duplicate.data.request.id,pending.data.request.id);\n  const requestPath=\"/api/requests/\"+pending.data.request.id;\n  assert.equal((await person.request(requestPath+\"/approve\",{})).status,403);\n  assert.equal((await person.request(\"/api/session/role\",{id:\"approver\"})).status,200);\n  const approved=await person.request(requestPath+\"/approve\",{note:\"用于本次复盘\"});\n  assert.equal(approved.data.grant.status,\"active\");\n  assert.equal((await person.request(demoReport)).status,403);\n  await person.request(\"/api/session/role\",{id:\"employee\"});\n  const report=await person.request(demoReport);\n  assert.equal(report.status,200);\n  assert.equal(report.data.report.rows[0][1],192.6);\n  assert.match(report.headers.get(\"cache-control\"),/no-store/i);\n  assert.equal((await person.request(\"/api/resources/fulfillment-report/report\")).status,403);\n\n  assert.equal((await person.request(\"/api/demo/clock\",{minutes:15})).status,200);\n  const expired=await person.request(demoReport);\n  assert.equal(expired.status,403);\n  assert.equal(expired.data.report,undefined);\n  await person.request(\"/api/session/role\",{id:\"auditor\"});\n  const audit=(await person.request(\"/api/workspace\")).data;\n  assert.ok(audit.events.some(event=>event.action===\"request_approved\"&&event.actorId===\"approver\"));\n  assert.ok(audit.events.some(event=>event.action===\"report_read\"&&event.actorId===\"employee\"));\n  assert.ok(audit.events.some(event=>event.action===\"grant_expired\"&&event.requestId===pending.data.request.id));\n  assert.equal(audit.events.filter(event=>event.action===\"report_denied\"&&event.actorId===\"employee\"&&event.resourceId===\"regional-report\").length,2);\n\n  const visitor=client(base);\n  await visitor.request(\"/api/session\");\n  assert.equal((await visitor.request(\"/api/workspace\")).data.requests.length,0);\n  assert.equal((await person.request(\"/domain.mjs\")).status,404);\n  assert.equal((await person.request(\"/fixtures.mjs\")).status,404);\n});\n\ntest(\"team login binds separate real actors and private report content\", {timeout:15000},async t=>{\n  const config=\"samples/team.example.json\";\n  const base=await serve(t,[\"--team-file\",config],{\n    ACCESS_OPERATOR_PASSWORD:loginSecret,ACCESS_OWNER_PASSWORD:loginSecret,ACCESS_AUDIT_PASSWORD:loginSecret,\n  });\n  const operator=client(base),owner=client(base),auditor=client(base);\n  assert.equal((await operator.request(\"/api/session\")).data.user,null);\n  assert.equal((await operator.request(\"/api/workspace\")).status,401);\n  const staticText=await operator.request(\"/\");\n  assert.equal(staticText.status,200);\n  assert.ok(!JSON.stringify(staticText.data).includes(\"1137\"));\n  assert.equal((await operator.request(\"/samples/team.example.json\")).status,404);\n  assert.equal((await operator.request(\"/api/login\",{id:\"operator\",password:\"incorrect\"})).status,401);\n  for(const [actor,id] of [[operator,\"operator\"],[owner,\"owner\"],[auditor,\"audit\"]]){\n    const result=await actor.request(\"/api/login\",{id,password:loginSecret});\n    assert.equal(result.data.user.id,id);\n    assert.equal(result.data.mode,\"team\");\n    assert.deepEqual(result.data.roles,[]);\n  }\n  assert.equal((await operator.request(\"/api/session/role\",{id:\"owner\"})).status,403);\n  assert.equal((await operator.request(\"/api/demo/clock\",{minutes:15})).status,403);\n  const path=\"/api/resources/capacity-report/report\";\n  const request=(await operator.request(\"/api/requests\",{resourceId:\"capacity-report\",reason:\"复核本周供应计划\",minutes:10})).data.request;\n  const approvalPath=\"/api/requests/\"+request.id+\"/approve\";\n  assert.equal((await auditor.request(approvalPath,{})).status,403);\n  const grant=(await owner.request(approvalPath,{})).data.grant;\n  assert.equal((await operator.request(path)).data.report.rows[0][2],1137);\n  assert.equal((await auditor.request(path)).status,403);\n  assert.equal((await owner.request(\"/api/grants/\"+grant.id+\"/revoke\",{note:\"复核已经提前完成\"})).status,200);\n  assert.equal((await operator.request(path)).status,403);\n  const before=operator.cookie();\n  assert.equal((await operator.request(\"/api/logout\",{})).status,200);\n  assert.equal((await client(base).request(\"/api/workspace\",undefined,{Cookie:before})).status,401);\n});\n","group":"验收测试"}],"defaultFile":"domain.mjs"}</script>
