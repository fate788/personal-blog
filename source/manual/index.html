<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify manual search\non: [push, pull_request]\njobs:\n  check:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - run: python -B -m unittest discover -s tests -v\n      - run: python -B evaluation/run.py --check\n      - run: node --check static/app.js\n","group":"配置与启动"},{"path":".gitignore","text":"__pycache__/\n*.pyc\n.venv/\n*.gguf\n.model-cache/\n","group":"配置与启动"},{"path":"README.md","text":"# 手册检索室\n\n用自己的话查询门诊预约和双账核对两份产品手册，沿回答里的引用查看支持它的原文。手册保留了对应版本的 Git 提交和行号。界面提供手册问答、章节阅读和检索评测三个入口。\n\n![手册问答首页](docs/preview.webp)\n\n## 运行\n\n需要 Python 3.10 或更新版本。在项目根目录执行以下命令；Windows 也可双击 `start-manual.cmd`。\n\n```shell\npython server.py\n```\n\n打开[本机手册检索室](http://127.0.0.1:8799/)。标准库服务直接提供前端、自由检索、原文摘录和评测报告。资料随包保存，外部网络仅在打开 GitHub 原文时使用。服务默认监听本机，支持 `--port` 选择其他端口。\n\n**启用本地模型。** Windows x64 可在同一目录运行下面的命令，作为上述启动命令的替代。首次会从项目官方地址下载约 1.16 GB 文件，校验 SHA-256 后保存在项目下的 `.model-cache`。后续运行复用缓存。\n\n```shell\npython run_with_model.py\n```\n\n启动器采用 Qwen2.5-1.5B-Instruct 的 Q4_K_M 权重和 llama.cpp b12810。已在 Windows x64 的 Vulkan 环境运行。其他平台如已运行兼容的本机模型服务，可使用 `python server.py --model-url http://127.0.0.1:8819/v1 --model-name 模型名称`。模型使用聊天补全和 JSON 对象输出接口。[Qwen 官方权重](https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF) · [llama.cpp 官方发行包](https://github.com/ggml-org/llama.cpp/releases/tag/b12810)\n\n## 五分钟体验\n\n1. **试一句自己的问法。** 例如「轮到我候补，多久之内得确认？」。限定门诊手册，展开引用，核对演练中 P003 的十分钟留位和 P004 的递补。\n2. **沿引用定位。** 在原文中查看高亮句子，进入手册阅读页，复制段落链接，再返回刚才的问题。换到双账手册，试问「再用同一份样例，原来的复核记录还找得到吗？」。\n3. **试问资料以外的问题。** 例如「预约窗口周末几点下班？」。报告记录了资料不足时的正确拒答以及误答。点击评测页的需复查项可查看实际输出。\n\n## 实现\n\n- `corpus/` 固定了两个项目的 README 快照。按小节、列表项和连贯的代码段建立 32 个可引用片段。每段使用 Git 提交、文档和行号定位。\n- `engine.py` 提供中文关键词基线以及术语归一、项目范围、覆盖度和证据检查。输入时实时检索。术语扩展使用本地规则，两份手册都可离线查询。\n- `model_answer.py` 把候选段落拆成原句，让模型按问题挑选和组织句子。后端校验返回的编号，再从对应段落提取原句。前端区分模型整理与原文摘录；遇到模型繁忙、服务不可用或无效输出时仍可查阅依据。\n- `static/` 可从 URL 回到问题、指定手册段落或待复查的评测案例。`GET /api/documents` 提供文档和段落，`POST /api/ask` 接受 `question` 和可选的 `project`（`all`、`clinic`、`ledger`），`GET /api/evaluation` 返回已发布的离线评测。\n\n## 已测得的效果\n\n先冻结 30 道题及所需原文位置，再分别运行两个检索方法。若问题需要多个段落，前三个结果须共同覆盖全部必要位置才算命中。\n\n| 项目 | 本版本结果 |\n| --- | --- |\n| 22 道可答题，前三个结果找全所需依据 | 基线 20/22，改进检索 21/22 |\n| 22 道可答题，离线答复覆盖全部要点 | 16/22，另有 3 道误判为资料不足 |\n| 8 道资料缺失题，正确提示依据不足 | 6/8 |\n| 8 题本机模型抽查 | 6 道可答中 3 道答全，2 道资料缺失中 1 道正确拒答 |\n\n引用原句可以核验，但仍会有与问题无关或缺少条件的答复。详细记录按题列出问题、排名、答复和独立 AI 复核意见。还没有真人试用耗时数据。[评测方法](evaluation/README.md) · [逐题数据](evaluation/report.json) · [模型实际输出](evaluation/model-check.md)\n\n```shell\npython -B -m unittest discover -s tests -v\npython -B evaluation/run.py --check\n```\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 手册检索室 v1.0 源码包\n\n原始发布归档为 `手册检索室-v1.0.zip`。压缩包保留其中 24 份文本文件的原始路径与字节，本文件为导出说明。\n\n使用 Python 3.10 及以上，在解压后的项目目录运行 python server.py 打开手册检索室。检索和原文阅读可离线使用。模型整理通过本机模型服务启用，配置方法见 README。\n","group":"项目说明"},{"path":"corpus/.gitattributes","text":"clinic.md -text\nledger.md -text\n","group":"配置与启动"},{"path":"corpus/SOURCES.md","text":"# 检索资料\n\n两份 Markdown 快照来自作者已发布的产品仓库。复制 Git 对象中的 README.md 保留了原始行号。检索索引直接从这两份文件生成，GitHub 引用锁定提交。\n\n| 快照 | 版本 | 源文件 |\n| --- | --- | --- |\n| clinic.md | v0.6 | [门诊候补与改约工作台](https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md) |\n| ledger.md | v0.2 | [双账核对工作台](https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md) |\n","group":"项目说明"},{"path":"corpus/clinic.md","text":"# 门诊候补与改约工作台\n\n预约窗口可以在同一个工作台查号、登记预约、办理候补和停诊改约。日程显示所选日期的号源分布、各班次的余号和名单。“窗口待办”汇总各日期的待办记录，点击一项即可查看对应状态的预约。接到咨询时，也可以按就诊编号或预约单号追查办理经过。项目使用合成排班与虚构编号，每个浏览器会话有独立的数据。\n\n![门诊调度工作台](docs/preview.webp)\n\n预约日程展示导诊大厅，查询页展示窗口递单，停诊改约页展示诊区走廊导引。三张图片由 AI 为本项目生成，人物与机构均为虚构。图片随页面提供，可离线显示。\n\n## 本地运行\n\n需要 Python 3.10 或更新版本，只使用 Python 标准库。在项目根目录执行以下命令。\n\n```sh\npython server.py\n```\n\n打开[本机工作台](http://127.0.0.1:8796/)。Windows 也可双击 `start-clinic.cmd`。服务默认只监听本机回环地址。可通过 `--port` 和 `--db` 指定端口和 SQLite 文件。\n\n## 体验预约窗口的三种操作\n\n1. **跨日登记。** 从 12 月 8 日的日程打开快速登记，选择 12 月 9 日 09:00 综合门诊 S03。用虚构就诊编号 P105 登记后，在预约查询中输入 P105，即可核对班次、预约状态和办理记录。\n2. **退号与递补。** 在周日历选 12 月 8 日，打开 09:00 综合门诊 S01，取消预约 R001。队首 P003 获得 10 分钟留位。把演示时钟推进 10 分钟，留位转给 P004。使用 P004 确认，查询预约单 R004 可核对递补经过。\n3. **停诊改约。** 重置演示，将 S01 停诊。在改约页勾选 R001、R002，核对原班次和目标班次，选择同科 10:00 的 S02 并确认。两笔预约一起转入该班次，事件记录保留每笔改约的起点和去向。\n\n下拉菜单支持键盘操作。用 Tab 聚焦后按 Enter 展开，用上下方向键浏览，按 Enter 选定或 Esc 收起。\n\n初始演示时钟固定为北京时间 2026 年 12 月 7 日 08:40，时钟由操作者推进。刷新页面可以继续刚才的演练。事件和留位提醒显示在工作台内。系统没有连接医院挂号系统或短信服务。\n\n## 实现与验证\n\n- `engine.py` 管理号源、候补队列、场次停开和事件记录。SQLite 写事务把余量判断和状态变化一起提交，已确认和已留位都会占用容量。\n- `server.py` 提供静态界面、`GET /api/state` 与 `POST /api/action`。操作可携带版本号与请求标识，对过期页面返回冲突，重复请求可取回当前状态。\n- `static/` 提供周日历、当日号源分布、快速登记、预约查询、停诊改约与事件记录。中文字体内嵌于 `static/style.css`，许可见 `static/fonts/OFL.txt`。\n- 执行 `python -m unittest discover -v` 复跑测试。GitHub Actions 在提交和拉取请求时运行测试并检查前端脚本语法。\n\n15 项测试覆盖候补先后、截止时刻、跨日、停诊、事务回滚、重试和工作区隔离。在单席并发测试中，12 个请求同时登记，结果是 1 条已预约、11 条候补。在批次测试中，后一条预约遇到时段冲突时，先处理的预约和对应事件也一起回滚。\n\n作者是[李子衡（@fate788）](https://github.com/fate788)。[个人博客源码与其他作品](https://github.com/fate788/personal-blog)\n","group":"数据与样例"},{"path":"corpus/ledger.md","text":"# 合账 · 双账核对工作台 v0.2\n\n给运营或财务核对系统订单与渠道账单。把两侧数据转换为相同的三列 CSV，导入后可按差异类别和业务单号筛选，核对原始行、记录复核结论并导出报告。内置样例为合成数据。\n\n![双账核对的样例批次及逐笔差异](docs/preview.webp)\n\n**作品分类**　产品研发 / 业务后端、Web 前端，数据工程 / 数据质量。行业为电商与支付。\n\n## 在本机运行\n\n克隆仓库后进入项目根目录，使用 Python 3.10 或更新版本。Windows 可双击 `start-review.cmd`，也可在本目录运行 `python server.py`，然后访问 [本机双账核对](http://127.0.0.1:8792/)。只需 Python 标准库。端口已被占用时可运行 `python server.py --port 8802`。使用另一个实例时需指定独立数据库，例如 `--db data/review-2.sqlite3`。\n\n## 一分钟体验\n\n1. 点击「核对样例账单」。实际输入文件位于 `samples/left.csv` 和 `samples/right.csv`。\n2. 点击「金额不符」，搜索 `000127`。两边 CSV 的第 4 行分别为 128.00 元和 118.00 元。切到「重复键」，可以查到需要核对的原始行号。\n3. 打开这笔差异的「复核差异」，核对原始行，填入复核人、差异原因和处理结论。演示时可记录“金额相差 10 元，原因待核实”“交运营核查渠道明细”。复核人是本机手填署名。\n4. 保存后切换至「已复核」，重新打开记录，查看当前结论或追加一版更正。两个页面同时修改时，较晚保存的一方可对照最新结论再决定是否提交。\n5. 导出完整报告可查看最近的复核结论。返回工作台并再次运行相同样例，会直接打开同一批次，已有复核历史仍可查。\n\n## 数据约定\n\n表头为 `业务单号,类型,金额`。类型为「收款」或「退款」，金额为非负十进制元数，精确到分。上传限制为每侧 2 MiB、20,000 条数据。支持 UTF-8、带 BOM 的 UTF-8、GB18030。通过表格软件打开 CSV 时，将「业务单号」列指定为文本，可保留显示的前导零。\n\n核对键为业务单号与类型。同一单号的收款和退款分别比较。同一键出现多次时保留双方行号，交给人工复核，适用于发现部分退款等需要更细粒度标识的情形。文件结构损坏会产生失败任务和原因。金额、单号等单行错误单列明细。「待复核」计数包括待核查的业务键和无效记录，不能直接当作损失金额或订单数。\n\n渠道原始账单需先转换为上述三列。当前只处理同一币种的两份本地文件。工作台使用同一台电脑上的本地数据库，复核署名没有账号认证。真实渠道接入及团队分派另行规划。\n\n## 实现和复现\n\n- `engine.py` 解析及验证记录，按复合键分组，给出两侧行号，导出 UTF-8 BOM 的完整 CSV。导出会转义可能触发表格公式的文本。\n- 新版可在差异处回看相关源行的字段值。打开旧批次时保留旧版已保存的金额和来源行号。再次上传内容相同的两份 CSV，可以补齐差异原始字段，并保留原批次和复核历史。更正复核会追加版本，保留之前填写的人、原因和结论。\n- `GET /api/health` 返回服务状态、排队数、运行数与最早未完成任务的等待秒数。故障响应工作台从此端点只读探测。\n- `server.py` 只监听本机，使用 SQLite 存储异步批次。相同的两份文件按内容复用批次。重启时重新处理运行中断的任务。文件处理结束后数据库保留结果与文件名，清除任务中的源文件内容。历史供本机同一工作台使用。\n- 运行 `python -m unittest discover -v` 复现核对与服务端测试。内置样例为 8 行系统订单、6 行渠道数据，结果为 3 组一致，金额不符、仅系统、仅渠道、重复键、无效记录各 1 项。\n\n业务背景见 [微信支付账单开发指引](https://pay.wechatpay.cn/doc/v3/merchant/4013071218) 与 [美团配送对账体系实践](https://tech.meituan.com/2018/03/21/balance-accounts.html)。本版原型的核对规则及样例为独立实现。\n","group":"数据与样例"},{"path":"engine.py","text":"\"\"\"Offline Chinese passage retrieval over two version-pinned project manuals.\"\"\"\n\nfrom collections import Counter\nfrom dataclasses import dataclass\nfrom functools import lru_cache\nfrom math import log\nfrom pathlib import Path\nimport re\nimport unicodedata\n\n\nCORPUS = Path(__file__).resolve().parent / \"corpus\"\nSOURCES = {\n    \"clinic\": (\"门诊候补与改约工作台\", \"clinic-scheduling\", \"v0.6\",\n               \"bf00adf19b6588e4800e48f25bd487980f0a0119\"),\n    \"ledger\": (\"双账核对工作台\", \"ledger-reconciliation\", \"v0.2\",\n               \"97649044221e9a7bde0100948efba7b617b995b3\"),\n}\n\n# Domain vocabulary expands terms in both documents and queries. No entry\n# points to an answer, line number or particular document.\nVOCABULARY = \"\"\"\n候补 排候补 排队等号 轮到 排在队首 下一位 下一人 队列中的下一人 队首 递补 替补 顺延 转给 候位\n递补 转给 谁接手 给谁 下一个人 下一位 轮到谁\n留位 保留位 保留多久 暂留 留号 预留 保号 锁号 过号 到期 逾期 超时 有效期 截止时刻 错过时限 没及时确认 来不及确认\n时长 多久 多长时间 几分钟 分钟 时间限制 留位时间 有效时长\n跨日 隔天 另一天 换一天 第二天 明天 跨天\n停诊 停开 停班 取消出诊\n改约 改签 改期 换班次 转诊次 换个班次 换个时间\n余号 号源 空位 名额 剩余号 有号 放号\n查号 预约查询 查预约 查预订单 查单 查记录\n就诊编号 就诊号 患者编号 病人编号\n预约单号 预约编号 预约单 挂号单\n已取消 取消预约 退号 取消挂号\n日程 排班 周日历 班表 出诊表\n键盘 按键 快捷键 键盘操作\n演示时钟 模拟时间 演示时间 初始时间 时钟 初始日期\n浏览器会话 工作区隔离 会话隔离 各自独立 数据隔离 不同浏览器 另一个浏览器 独立的数据\n短信 手机通知 文字短信 发短信\n并发 同时登记 同时抢号 抢最后 一个席位 单席 最后一席\n回滚 整批撤销 撤回事务 整批失败 原子性\n事务 事务性 原子写入\n输入文件 样例文件 样本文件 输入路径 文件目录 文件位置\n重复 再次 相同 重复导入 重新导入 重传 重跑 重导 重新上传 再传 同一份 一模一样 同样 同一批次 复用\n批次 新建批次 开新批次 多一批 另开一批 原批次\n复核 人工核查 审核 复审 对账记录 审查 核查\n更正 修改结论 修订 追加版本 改错 修改意见 改备注 改结论\n历史 之前的记录 上次记录 保留下来 之前填写 过去的 旧记录 留痕\n原始行 源行 来源行 原始字段 CSV行 第几行 行号\n金额不符 金额差异 差额 差了多少钱 相差 金额不一致\n格式 表头 列名 字段名称 有哪些列 哪些字段 三列 模板\n上传限制 上限 限额 最大 最大多少 最多 限制 多少行 文件大小 容量上限 多大 几兆\n编码 字符集 乱码 BOM GB18030 UTF-8\n前导零 开头的零 开头的0 前面的零 保留零 前置零 几个零 变成数字\n类型 收退款 收款 退款\n复合键 核对键 匹配键 关联键 配对 配对依据 按什么匹配 对账主键\n重复键 同一键 多次出现 一单多笔 重复单号 单号重复\n无效记录 坏行 错误行 非法数据 单行错误\n币种 多币种 外币 货币 币别 跨币种\n认证 登录 登陆 账号 身份校验 身份验证\n署名 签名 签字 复核人 经办人\n团队分派 分配给同事 分派 协作 分工 协同\n导出 输出报告 下载报告 报告下载\n公式 电子表格 转义 excel Excel\n健康接口 健康检查 探针 探测 健康状态 服务状态 排队数 health\n重启 重新启动 掉电 中断 故障恢复 重新处理 服务重启\n清除 删除源文件 清理 清空 留存 移除\n端口 port 监听地址 本机回环 回环地址 localhost\n数据库 sqlite 持久化 落盘 存储\n启动 本地运行 本机运行 本机打开 运行起来 安装 运行命令 开起来\n依赖 标准库 库依赖 第三方库 Python环境 解释器\n测试 自动化测试 用例 回归 验证 unittest\n图片 配图 摄影 照片 插图 人物\n字体 字型 字库 许可 字体许可\n源码 代码 仓库 作者 开发者\n\"\"\".strip()\n\n\ndef normalize(text):\n    return unicodedata.normalize(\"NFKC\", text).casefold()\n\n\nGROUPS = [tuple(dict.fromkeys(normalize(line).split())) for line in VOCABULARY.splitlines()]\nGROUP_PATTERNS = [(f\"@{index}\", re.compile(\"|\".join(re.escape(alias) for alias in\n                                             sorted(group, key=len, reverse=True))))\n                  for index, group in enumerate(GROUPS)]\nLEXEMES = re.compile(r\"[a-z0-9]+(?:[._/-][a-z0-9]+)*|[\\u3400-\\u9fff]+\")\nFILLER = re.compile(\"请问一下|我想知道|能不能告诉我|可不可以告诉我|麻烦帮我|能不能|可不可以|\"\n                    \"是什么|该怎么|需要怎么|怎么办|怎么样|如何|为什么|为什么会|请问|能否|是否|可以|\"\n                    \"这个|那个|应该|我的|我们|我想|时候|的话|一下|里面|具体|怎么|什么|哪些|哪个|\"\n                    \"我要|我能|有没有|帮我|怎样|当前|支持不支持|支持|能用|允许|会把|到底|手册|工作台|系统\")\nNOISE = set(\"一个 这个 如果 可在 结果 使用 当前 是否 可以 对应 通过 项目 还是 进行 时候 之后 因为 为了 \"\n            \"看看 上面 关于 知道 中的 除了 支持 原来 系统 哪种 是不\".split())\nDOMAIN_CUES = {\n    \"clinic\": re.compile(r\"门诊|预约|挂号|候补|停诊|改约|就诊|班次|号源|clinic|\\b[psr]\\d{2,5}\\b\"),\n    \"ledger\": re.compile(r\"合账|对账|双账|账单|复核|渠道账|业务单号|差异|ledger|csv\"),\n}\nPRODUCT_NAMES = re.compile(\"门诊候补与改约工作台|双账核对工作台|门诊软件|门诊系统|对账系统|门诊|合账|双账|对账\")\nCLEAR_GAPS = [\n    # Require actual support in the candidate passage when these distinct\n    # policies are requested. A shared subject like 预约 alone is insufficient.\n    (r\"营业|下班|上班|营业到|周末.{0,5}(开门|开诊)|开门时间|关门时间|窗口.{0,5}几点\", r\"营业时间|服务时间|下班|上班|开门时间\"),\n    (r\"收费|手续费|挂号费|押金|价格|定价|退款.{0,4}(到账|工作日)|报销|医保|保险\", r\"收费|手续费|挂号费|押金|定价|报销|医保|到账时间\"),\n    (r\"电话号码|热线|打.{0,3}电话|邮箱地址|联系电话|邮编|医院地址|门诊地址|导航到|哪家医院\", r\"联系电话|热线|邮编|医院地址|邮箱地址\"),\n    (r\"医生姓名|哪位医生|哪个医生|专家号|药方|处方|诊断|用药|症状|身份证|身份证号\", r\"医生姓名|专家号|处方|诊断|身份证\"),\n    (r\"营业执照|发票|折扣|会员价|停车|楼层|地铁|食堂|支付方式|微信支付吗|支付宝\", r\"营业执照|发票|折扣|停车|楼层|地铁|食堂|支付方式|支付宝\"),\n    (r\"密码|验证码|单点登录|人脸识别|刷脸|二维码\", r\"密码|验证码|单点登录|人脸识别|刷脸|二维码\"),\n    (r\"(?:保存|保留|留存).{0,3}(?:几年|几天|多少年|多少天)|(?:历史|数据|记录).{0,7}(?:保存|保留|留存)多久\",\n     r\"(?:保存|保留|留存).{0,5}\\d+\\s*(?:年|天|个月)\"),\n    (r\"翻译|帮我写|写一首|写一篇|忽略.*指令|忽略.*资料|忽略.*手册\", r\"(?!)\"),\n]\nPOLICY_EVIDENCE = [(re.compile(q), re.compile(s)) for q, s in CLEAR_GAPS]\nDURATION_QUESTION = re.compile(r\"多久|多长时间|几(?:分钟|小时)|(?:超过|错过|过了).{0,6}(?:时间|期限|时限)|留位时间\")\nDURATION_EVIDENCE = re.compile(r\"\\d+\\s*(?:秒|分钟|小时|天|周|个月|年)\")\n\n\ndef lexical_tokens(text):\n    tokens = []\n    for word in LEXEMES.findall(normalize(text)):\n        if word[0].isascii():\n            tokens.append(word)\n            if re.search(r\"[._/-]\", word):\n                tokens.extend(w for w in re.split(r\"[._/-]\", word) if w != word)\n            continue\n        for width in (2, 3):\n            tokens.extend(word[i:i+width] for i in range(len(word) - width + 1))\n    return [term for term in tokens if term not in NOISE]\n\n\n@lru_cache(maxsize=512)\ndef concept_counts(text):\n    normal = normalize(text)\n    return {term: min(len(hits), 3) for term, pattern in GROUP_PATTERNS\n            if (hits := pattern.findall(normal))}\n\n\ndef concepts(text):\n    return concept_counts(text).keys()\n\n\ndef plain(line):\n    line = re.sub(r\"^\\s*(?:[-*]|\\d+[.)])\\s+\", \"\", line.strip())\n    # Preserve localhost examples as text because the exact ports are evidence.\n    line = re.sub(r\"\\[([^\\]]+)\\]\\((https?://127\\.0\\.0\\.1[^)]*)\\)\", r\"\\1（\\2）\", line)\n    line = re.sub(r\"\\[([^\\]]+)\\]\\([^)]+\\)\", r\"\\1\", line)\n    return line.replace(\"**\", \"\").replace(\"`\", \"\").strip()\n\n\ndef document_url(project):\n    _, repo, _, commit = SOURCES[project]\n    return f\"https://github.com/fate788/{repo}/blob/{commit}/README.md\"\n\n\n@dataclass(frozen=True)\nclass Passage:\n    project: str\n    chapter: str\n    start: int\n    end: int\n    text: str\n\n    def public(self, snippet=None, score=None):\n        document, _, version, commit = SOURCES[self.project]\n        lines = f\"L{self.start}\" if self.start == self.end else f\"L{self.start}-L{self.end}\"\n        result = dict(id=f\"{self.project}-L{self.start}\", project=self.project, document=document,\n                      title=self.chapter, text=self.text, start=self.start, end=self.end,\n                      url=f\"{document_url(self.project)}?plain=1#{lines}\", version=version, commit=commit,\n                      snippet=snippet or self.text)\n        if score is not None:\n            result[\"score\"] = round(score, 3)\n        return result\n\n\ndef read_passages(project):\n    lines = (CORPUS / f\"{project}.md\").read_text(encoding=\"utf-8\").splitlines()\n    chapter = \"项目介绍\"\n    covered = 0\n    for number, line in enumerate(lines, 1):\n        if number \u003c= covered:\n            continue\n        if line.startswith(\"## \"):\n            chapter = line[3:].strip()\n        elif line.startswith(\"# \") or not line.strip() or line.startswith((\"![\", \"```\")):\n            continue\n        else:\n            body = plain(line)\n            covered = number\n            # Keep a paragraph introducing a command together with its fenced\n            # example so an instruction can never cite an empty lead-in.\n            if number + 1 \u003c len(lines) and not lines[number].strip() and lines[number + 1].startswith(\"```\"):\n                stop = next((i for i in range(number + 2, len(lines)) if lines[i].startswith(\"```\")), None)\n                if stop is not None:\n                    body += \"\\n\" + \"\\n\".join(lines[number + 2:stop])\n                    covered = stop + 1\n            yield Passage(project, chapter, number, covered, body)\n\n\ndef terms_for(text, enhanced):\n    counts = Counter(lexical_tokens(text))\n    if enhanced:\n        counts.update(concept_counts(text))\n    return counts\n\n\n@lru_cache(maxsize=2)\ndef index(enhanced):\n    passages = [p for project in SOURCES for p in read_passages(project)]\n    vectors = []\n    for p in passages:\n        vector = terms_for(p.text, enhanced)\n        if enhanced:\n            for term in terms_for(p.chapter, True):\n                vector[term] += 0.22\n        vectors.append(vector)\n    frequency = Counter(term for vector in vectors for term in vector)\n    idf = {term: log(1 + (len(vectors) - n + 0.5) / (n + 0.5)) for term, n in frequency.items()}\n    lengths = [sum(vector.values()) for vector in vectors]\n    mean = sum(lengths) / len(lengths)\n    return passages, vectors, idf, [0.65 + 0.35 * n / mean for n in lengths]\n\n\ndef get_sections():\n    return [p.public() for p in index(True)[0]]\n\n\ndef get_documents():\n    counts = Counter(p.project for p in index(True)[0])\n    return [dict(id=key, project=key, document=name, name=name, title=name, version=version,\n                 commit=commit, url=document_url(key), sections=counts[key])\n            for key, (name, _, version, commit) in SOURCES.items()]\n\n\ndef term_weight(term):\n    if term.startswith(\"@\"):\n        return 4.3\n    return 1.2 if term.isascii() else 0.7 if len(term) > 2 else 1.\n\n\ndef excerpt(passage, weights):\n    sentences = [s for s in re.split(r\"(?\u003c=[。！？；])\", passage.text) if s.strip()]\n    # Short paragraphs often put the appointment ID in one sentence and its\n    # time or amount in the next one. Cite the compact, complete procedure.\n    if len(sentences) \u003c= 3 and len(passage.text) \u003c= 120:\n        return passage.text\n    scores = [sum(weights[t] * (1 + 0.2 * min(n - 1, 2)) for t, n in terms_for(s, True).items()\n                  if t in weights) for s in sentences]\n    hot = max(range(len(scores)), key=scores.__getitem__)\n    # A procedure's next sentence often states what happens after the action.\n    # Keep the immediate consequence and, when useful, its preceding condition.\n    left = hot - 1 if hot and scores[hot - 1] >= 0.38 * scores[hot] else hot\n    right = hot + 1\n    if right \u003c len(scores) and (scores[right] >= scores[hot] * 0.2 or\n                                \"以下命令\" in sentences[hot] or len(sentences[hot]) \u003c= 12 or\n                                sentences[right].startswith((\"把演示时钟\", \"到期\", \"系统没有\"))):\n        right += 1\n    return \"\".join(sentences[left:right]).strip()\n\n\ndef scope_for(question, project):\n    if project != \"all\":\n        return {project}\n    cues = {p for p, pattern in DOMAIN_CUES.items() if pattern.search(normalize(question))}\n    return cues or set(SOURCES)\n\n\ndef missing_evidence(question, passage):\n    text = normalize(passage.text)\n    if any(request.search(question) and not needed.search(text) for request, needed in POLICY_EVIDENCE):\n        return True\n    # Unknown exact record identifiers or software/format names should not be\n    # replaced silently with a nearby example or an unrelated technology.\n    identifiers = re.findall(r\"(?\u003c![a-z0-9])(?:[psr]\\d{2,6}|[a-z]{2,}[a-z0-9]*(?:[-_.][a-z0-9]+)*)\\b\", question, re.ASCII)\n    common = {\"readme\", \"clinic\", \"ledger\", \"app\", \"web\", \"id\", \"ai\"}\n    if any(token not in common and token not in text and not (concepts(token) & concepts(text)) for token in identifiers):\n        return True\n    versions = re.findall(r\"\\bv\\d+(?:\\.\\d+)+\", question, re.ASCII)\n    if any(v != SOURCES[passage.project][2] for v in versions):\n        return True\n    if re.search(r\"(?:今天|明天|后天|本周|下周|\\d{1,2}月\\d{1,2}[日号]).{0,15}(?:还有号|有无号|能挂号|剩几个号|有空位|还能挂)\", question):\n        return True\n    return False\n\n\ndef rank(query, scope, enhanced):\n    passages, vectors, idf, norms = index(enhanced)\n    content_query = FILLER.sub(\" \", PRODUCT_NAMES.sub(\" \", query)) if enhanced else query\n    tokens = terms_for(content_query, enhanced)\n    weights = {t: term_weight(t) * idf[t] for t in tokens if t in idf}\n    query_concepts = {t for t in weights if t.startswith(\"@\")}\n    # Unknown terms reduce evidence coverage rather than contributing scores.\n    total = sum(weights.values()) + sum(0.7 for t in tokens if t not in idf)\n    ranking = []\n    for passage, vector, norm in zip(passages, vectors, norms):\n        if passage.project not in scope:\n            continue\n        overlap = vector.keys() & weights.keys()\n        if not overlap:\n            continue\n        raw = sum(weights[t] * (2.2 * vector[t]) / (vector[t] + 1.2 * norm) for t in overlap)\n        coverage = sum(weights[t] for t in overlap) / max(total, 1)\n        score = raw * (0.65 + 0.35 * coverage) if enhanced else raw\n        if query_concepts:\n            score *= 0.4 + 0.6 * len(query_concepts & overlap) / len(query_concepts)\n        if enhanced and DURATION_QUESTION.search(query):\n            # Numeric deadlines take precedence over implementation passages\n            # that merely mention the same entity (e.g. a reserved slot).\n            score *= 1.35 if DURATION_EVIDENCE.search(passage.text) else 0.75\n        ranking.append((score, coverage, passage, overlap))\n    ranking.sort(key=lambda hit: -hit[0])\n    return [(p.public(excerpt(p, weights), score), coverage, p, overlap)\n            for score, coverage, p, overlap in ranking[:3]]\n\n\ndef supported(query, hit):\n    row, coverage, passage, overlap = hit\n    if missing_evidence(query, passage) or row[\"score\"] \u003c 2.15 or coverage \u003c 0.22:\n        return False\n    return (any(t.startswith(\"@\") or t.isascii() or len(t) >= 3 for t in overlap)\n            or len(overlap) > 1 or coverage >= 0.68)\n\n\ndef search(question, project=\"all\", method=\"hybrid\"):\n    \"\"\"Return up to three ranked references and an independently gated answer.\"\"\"\n    if not isinstance(question, str):\n        raise ValueError(\"问题必须是文本\")\n    if project not in {*SOURCES, \"all\"}:\n        raise ValueError(\"未知手册\")\n    if method == \"keyword\":\n        method = \"baseline\"\n    if method not in {\"baseline\", \"hybrid\"}:\n        raise ValueError(\"未知检索方式\")\n    enhanced = method == \"hybrid\"\n    query = normalize(question.strip())\n    scope = scope_for(query, project) if enhanced else (set(SOURCES) if project == \"all\" else {project})\n    top = rank(query, scope, enhanced)\n    result = dict(method=method, status=\"insufficient\", answer=\"所查手册没有提供足以回答这个问题的原文。\",\n                  citations=[], results=[row for row, _, _, _ in top])\n    if not top:\n        return result\n    if not supported(query, top[0]):\n        return result\n    citations = [top[0][0]]\n    if enhanced:\n        # Separate questions can have separate supporting paragraphs. Keep the\n        # full-query result for short qualifiers and dependent follow-ups.\n        clauses = [c.strip() for c in re.split(r\"[?？；;，,]|另外|以及\", query)\n                   if re.search(\"谁|几|多|怎么|如何|吗|会|能|是否|哪些|什么|超时|能否\", c)]\n        if 2 \u003c= len(clauses) \u003c= 3:\n            distinct = {}\n            for clause in clauses:\n                hits = rank(clause, scope, enhanced)\n                if not hits or not supported(clause, hits[0]) or hits[0][1] \u003c 0.28:\n                    break\n                row = hits[0][0]\n                distinct[row[\"id\"]] = row\n            else:\n                covered = concepts(citations[0][\"text\"])\n                novel = any((concepts(clause) - covered) & concepts(row[\"text\"])\n                            for clause in clauses for row in distinct.values())\n                if len(distinct) > 1 and novel:\n                    citations = list(distinct.values())\n                    items = {r[\"id\"]: r for r in [*citations, *result[\"results\"]]}\n                    result[\"results\"] = list(items.values())[:3]\n    result.update(status=\"answered\", answer=\"\\n\".join(row[\"snippet\"] for row in citations), citations=citations)\n    return result\n","group":"后端"},{"path":"evaluation/README.md","text":"# 离线检索评测\n\n本目录用于复现作品中「评测」页的数字。运行 `python evaluation/run.py` 会读取随仓库分发的两份手册，并产生 `evaluation/report.json`。使用 `--check` 可以核对当前结果是否与已发布报告一致，使用 `--output` 可以将报告写到另一个位置。\n\n## 题集\n\n30 道题依据两份固定提交的 README 编写，在检索引擎输出接受评阅之前冻结。22 道在给定范围内有答案，8 道缺少资料，其中 2 道限定了一份不含该答案的手册。题集见 [cases.json](cases.json)，包含每题的范围、预期事实和原文行号。锁定的 SHA-256 按 UTF-8、LF 换行计算。\n\n## 怎样读结果\n\n- **前三项命中。** 在可答的 22 题中，检查返回的前三个片段是否共同覆盖全部必要原文位置。需要多段依据时，只找到其中一段记为未命中。判定同时核对项目、固定提交和行号。\n- **资料不足。** 在无答案的 8 题中，统计系统正确提示资料不足的题数。另外统计 22 道可答题中有多少被误拒。\n- **引用支持。** 独立的 AI 评阅者对照实际回答和所引原句，逐条检查事实。只要一项事实缺少引用支持，整条回答就不能计入通过数。无内容可核对的资料不足提示会单独核验。答复或证据有变化时，旧复核会自动失效。\n- **回答完整度。** 引用准确还可能答非所问。「完整」要求覆盖固定金标准里用户所问的要点。原文有据但遗漏一个条件，只能计为部分回答。报告保留各题原问、回复和复核理由。\n\n30 题报告覆盖本地检索和摘录。启用本地模型后的独立接口抽查收录了八条实际回答与原文。[本地模型验证记录](model-check.md)\n\n当前没有真人完成率或节省用时的数据。有真实试用者后，可让其分别用原手册和检索室完成难度相近的查证任务，交替两种方式的顺序，记录正确完成率和完成用时。\n","group":"项目说明"},{"path":"evaluation/cases.json","text":"{\n  \"scope\": \"两份固定提交的 README。答案只按给定的资料范围判断。仅按题意所需的事实标注，避免把缺少依据的现实规则当作知识。\",\n  \"versions\": {\n    \"clinic\": \"bf00adf19b6588e4800e48f25bd487980f0a0119\",\n    \"ledger\": \"97649044221e9a7bde0100948efba7b617b995b3\"\n  },\n  \"cases\": [\n    {\"id\":\"Q01\",\"type\":\"直接查询\",\"project\":\"clinic\",\"question\":\"用 P105 登记了第二天的班次，随后在哪里核对预约状态和办理记录？\",\"expected\":\"在预约查询中输入 P105。\",\"groups\":[[\"clinic:21\"]]},\n    {\"id\":\"Q02\",\"type\":\"换一种问法\",\"project\":\"all\",\"question\":\"我跟着门诊示例走，R001 退掉之后，如果第一位一直没确认，接下来轮到哪个编号？\",\"expected\":\"首位是 P003，10 分钟到期后轮到 P004。\",\"groups\":[[\"clinic:22\"]]},\n    {\"id\":\"Q03\",\"type\":\"直接查询\",\"project\":\"all\",\"question\":\"停诊演练里，R001、R002 应该一起转到哪个班次，怎么追查原去向？\",\"expected\":\"转入同科 10:00 的 S02，事件记录有每笔改约的起点与去向。\",\"groups\":[[\"clinic:23\"]]},\n    {\"id\":\"Q04\",\"type\":\"换一种问法\",\"project\":\"clinic\",\"question\":\"不碰鼠标，如何展开一个选择框、上下挑选，再把它收起来？\",\"expected\":\"Tab 聚焦、Enter 展开、上下方向键浏览、Esc 收起。\",\"groups\":[[\"clinic:25\"]]},\n    {\"id\":\"Q05\",\"type\":\"换一种问法\",\"project\":\"clinic\",\"question\":\"队列排到了会往手机发通知吗，还是要在演示页面里看？\",\"expected\":\"事件和留位提醒显示在工作台内，没有接入短信。\",\"groups\":[[\"clinic:27\"]]},\n    {\"id\":\"Q06\",\"type\":\"直接查询\",\"project\":\"all\",\"question\":\"门诊演练里的初始时钟是什么日期、哪个时区？刷新后还能接着演吗？\",\"expected\":\"北京时间 2026 年 12 月 7 日 08:40，刷新可以继续演练。\",\"groups\":[[\"clinic:27\"]]},\n    {\"id\":\"Q07\",\"type\":\"换一种问法\",\"project\":\"clinic\",\"question\":\"留号但尚未确认的预约，会先占用一个名额吗？\",\"expected\":\"已确认和已留位都会占用容量。\",\"groups\":[[\"clinic:31\"]]},\n    {\"id\":\"Q08\",\"type\":\"多条件\",\"project\":\"all\",\"question\":\"门诊程序需要哪个 Python 版本？能通过什么参数把数据库放到自选位置？\",\"expected\":\"Python 3.10 或更新版本，用 --db 指定 SQLite 文件。\",\"groups\":[[\"clinic:11\"],[\"clinic:17\"]]},\n    {\"id\":\"Q09\",\"type\":\"直接查询\",\"project\":\"clinic\",\"question\":\"12 个登记请求同时抢最后一个名额，测试结果各有多少已约、多少候补？\",\"expected\":\"1 条已预约、11 条候补。\",\"groups\":[[\"clinic:36\"]]},\n    {\"id\":\"Q10\",\"type\":\"换一种问法\",\"project\":\"clinic\",\"question\":\"一次搬两条预约，第二条撞了时间，已经搬好的第一条和它的事件会留下吗？\",\"expected\":\"前一条预约及对应事件一起回滚。\",\"groups\":[[\"clinic:36\"]]},\n    {\"id\":\"Q11\",\"type\":\"直接查询\",\"project\":\"all\",\"question\":\"预约窗口演示的医院场景配图断网还能显示吗，图片来源是什么？\",\"expected\":\"为项目生成的 AI 配图，随页面提供，可离线显示。\",\"groups\":[[\"clinic:7\"]]},\n    {\"id\":\"Q12\",\"type\":\"直接查询\",\"project\":\"ledger\",\"question\":\"样例账单左右两份输入文件，在仓库哪个目录、分别叫什么？\",\"expected\":\"samples/left.csv 与 samples/right.csv。\",\"groups\":[[\"ledger:15\"]]},\n    {\"id\":\"Q13\",\"type\":\"直接查询\",\"project\":\"all\",\"question\":\"000127 这笔示例在 CSV 第几行，两边的金额各是多少？\",\"expected\":\"两边均在第 4 行，分别为 128.00 元和 118.00 元。\",\"groups\":[[\"ledger:16\"]]},\n    {\"id\":\"Q14\",\"type\":\"多条件\",\"project\":\"ledger\",\"question\":\"从表格软件打开订单号会丢开头的零，用哪种列类型才能保住？允许的收支类型有哪些？\",\"expected\":\"将业务单号列指定为文本。允许收款、退款。\",\"groups\":[[\"ledger:23\"]]},\n    {\"id\":\"Q15\",\"type\":\"换一种问法\",\"project\":\"ledger\",\"question\":\"同一笔业务既收过款又退过款，核账时会把这两笔合成一个数吗？\",\"expected\":\"按业务单号与类型核对，收款、退款分开比较。\",\"groups\":[[\"ledger:25\"]]},\n    {\"id\":\"Q16\",\"type\":\"换一种问法\",\"project\":\"ledger\",\"question\":\"待复核列表的数量可以直接作为亏损金额或者订单数量报给主管吗？\",\"expected\":\"不可以。它包括待核查业务键和无效记录。\",\"groups\":[[\"ledger:25\"]]},\n    {\"id\":\"Q17\",\"type\":\"多条件\",\"project\":\"all\",\"question\":\"如果两个人在两个页面改同一份复核，晚提交的一方怎么办？此前的署名和原因还查得到吗？\",\"expected\":\"较晚保存的一方可对照最新结论再决定是否提交。更正会追加版本，保留先前的人、原因和结论。\",\"groups\":[[\"ledger:18\"],[\"ledger:32\"]]},\n    {\"id\":\"Q18\",\"type\":\"直接查询\",\"project\":\"ledger\",\"question\":\"对账的健康接口会给故障响应工作台哪些指标？\",\"expected\":\"服务状态、排队数、运行数与最早未完成任务的等待秒数。\",\"groups\":[[\"ledger:33\"]]},\n    {\"id\":\"Q19\",\"type\":\"多条件\",\"project\":\"ledger\",\"question\":\"处理账单中途重启会怎样？处理完，原始文件内容还保存在任务里吗？\",\"expected\":\"重启后重新处理中断任务。完成后保留结果与文件名，清除任务里的源文件内容。\",\"groups\":[[\"ledger:34\"]]},\n    {\"id\":\"Q20\",\"type\":\"直接查询\",\"project\":\"all\",\"question\":\"合账导出的报告是哪种编码？对可能触发电子表格公式的文本如何处理？\",\"expected\":\"UTF-8 BOM 的完整 CSV，可能触发表格公式的文本会转义。\",\"groups\":[[\"ledger:31\"]]},\n    {\"id\":\"Q21\",\"type\":\"换一种问法\",\"project\":\"ledger\",\"question\":\"同样的两份 CSV 再上传一次，旧批次的复核记录会丢吗？\",\"expected\":\"保留原批次和复核历史。\",\"groups\":[[\"ledger:32\",\"ledger:19\"]]},\n    {\"id\":\"Q22\",\"type\":\"多条件\",\"project\":\"ledger\",\"question\":\"想在第二个端口同时开一份合账，除了改端口，还要给它指定什么？\",\"expected\":\"另一个实例需指定独立数据库，例如 --db data/review-2.sqlite3。\",\"groups\":[[\"ledger:11\"]]},\n    {\"id\":\"Q23\",\"type\":\"无依据\",\"project\":\"clinic\",\"question\":\"门诊每次挂号的收费金额是多少？\",\"expected\":\"手册不含现实挂号收费标准。\",\"groups\":[]},\n    {\"id\":\"Q24\",\"type\":\"无依据\",\"project\":\"clinic\",\"question\":\"手册规定了每个病人每天最多能挂几次号吗？\",\"expected\":\"此版本没有给出每人每天的挂号上限。\",\"groups\":[]},\n    {\"id\":\"Q25\",\"type\":\"无依据\",\"project\":\"all\",\"question\":\"门诊窗口客服电话是多少？\",\"expected\":\"两份 README 均未提供窗口客服电话。\",\"groups\":[]},\n    {\"id\":\"Q26\",\"type\":\"无依据\",\"project\":\"ledger\",\"question\":\"渠道账单自动归档几天后会删除？\",\"expected\":\"手册没有给出按天计算的自动归档或保留期限。\",\"groups\":[]},\n    {\"id\":\"Q27\",\"type\":\"无依据\",\"project\":\"ledger\",\"question\":\"第一次启动对账，默认管理员密码是什么？\",\"expected\":\"手册没有默认管理员账号密码。\",\"groups\":[]},\n    {\"id\":\"Q28\",\"type\":\"范围不符\",\"project\":\"clinic\",\"question\":\"只用门诊手册，确认对账样例里系统订单 CSV 一共有几行。\",\"expected\":\"所选门诊资料不包含对账样例行数。\",\"groups\":[]},\n    {\"id\":\"Q29\",\"type\":\"范围不符\",\"project\":\"ledger\",\"question\":\"只查双账手册，门诊 S01 停诊后要改到哪个班次？\",\"expected\":\"所选双账资料不包含门诊改约例子。\",\"groups\":[]},\n    {\"id\":\"Q30\",\"type\":\"无依据\",\"project\":\"all\",\"question\":\"双账复核历史在云端每天几点做异地备份？\",\"expected\":\"手册未给出云端异地备份安排。\",\"groups\":[]}\n  ]\n}\n","group":"验收测试"},{"path":"evaluation/model-check.md","text":"# 本地模型抽查 · 8 个实测问答\n\n2026 年 11 月 27 日，在启动模型的本机服务上顺序请求 `POST /api/ask`。服务使用 Qwen2.5-1.5B-Instruct（官方 GGUF，Q4_K_M，权重仓库提交 `91cad51170dc346986eccefdc2dd33a9da36ead9`），通过 llama.cpp b12810 的 Vulkan 后端运行。模型从检索到的手册段落中选择原句，答复按这些句子组成。\n\n从冻结的 30 题中预先指定这 8 题，覆盖两份手册、直接问法、复合问题，以及离线盲测中成功和失败的情形。共 6 道有答案、2 道缺少资料。独立 AI 评阅者逐条核对原始接口答复、问题与固定版本的整段引用。以下数据仅描述这组特意选取的案例。\n\n- 6 次返回 `model=Qwen2.5-1.5B-Instruct`、`mode=model`，所选原句都能在各自引用里找到。2 次返回 `mode=extractive`、`status=insufficient`，这两次在检索环节提示资料不足，响应未带模型名称。\n- 6 道可答题中答全 3 道、部分回答 1 道、答非所问 1 道、误拒 1 道。2 道无依据题中正确拒答 1 道，另 1 道返回了与问题无关的段落。\n- 离线检索的 30 题统计和全部逐题复核单独保存。[离线报告](report.json)\n\n## 原始答复与复核\n\n### Q01　用 P105 登记了第二天的班次，随后在哪里核对预约状态和办理记录？\n\n模型选句，查询范围为门诊手册。\n\n> 从 12 月 8 日的日程打开快速登记，选择 12 月 9 日 09:00 综合门诊 S03。\n> 用虚构就诊编号 P105 登记后，在预约查询中输入 P105，即可核对班次、预约状态和办理记录。\n\n答全。给出了查询入口、就诊编号与可核对的信息。第一句额外介绍了示例班次，也有原文支持。 [门诊 README 第 21 行](https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L21)\n\n### Q04　不碰鼠标，如何展开一个选择框、上下挑选，再把它收起来？\n\n模型选句，查询范围为门诊手册。\n\n> 下拉菜单支持键盘操作。\n> 用 Tab 聚焦后按 Enter 展开，用上下方向键浏览，按 Enter 选定或 Esc 收起。\n\n答全。Tab、Enter、上下方向键与 Esc 的作用都能在同一行核对。 [门诊 README 第 25 行](https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L25)\n\n### Q08　门诊程序需要哪个 Python 版本？能通过什么参数把数据库放到自选位置？\n\n检索拒答，查询范围为全部手册。\n\n> 所查手册没有提供足以回答这个问题的原文。\n\n误拒。两份必要依据在门诊手册第 11、17 行，分别记录 Python 3.10 或更新版本与 --db 参数。这一题在调用模型前就被判为资料不足。\n\n### Q14　从表格软件打开订单号会丢开头的零，用哪种列类型才能保住？允许的收支类型有哪些？\n\n模型选句，查询范围为双账手册。\n\n> 表头为 业务单号,类型,金额。\n> 通过表格软件打开 CSV 时，将「业务单号」列指定为文本，可保留显示的前导零。\n\n部分回答。业务单号列设为文本确有依据，另一个条件需要回答收款和退款。相同来源段落包含这两种类型，模型没有选到那句。 [双账 README 第 23 行](https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L23)\n\n### Q17　如果两个人在两个页面改同一份复核，晚提交的一方怎么办？此前的署名和原因还查得到吗？\n\n模型选句，查询范围为全部手册。\n\n> 打开这笔差异的「复核差异」，核对原始行，填入复核人、差异原因和处理结论。\n> 演示时可记录“金额相差 10 元，原因待核实”“交运营核查渠道明细”。\n> 复核人是本机手填署名。\n\n答非所问。所选句子介绍手填署名和差异原因。晚提交的处理与历史更正分别在双账手册第 18、32 行。 [双账 README 第 17 行](https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L17)\n\n### Q19　处理账单中途重启会怎样？处理完，原始文件内容还保存在任务里吗？\n\n模型选句，查询范围为双账手册。\n\n> 相同的两份文件按内容复用批次。\n> 重启时重新处理运行中断的任务。\n> 文件处理结束后数据库保留结果与文件名，清除任务中的源文件内容。\n> 历史供本机同一工作台使用。\n\n答全。重启后继续处理中断任务，处理完清除源文件内容并保留结果和文件名，这些事实在第 34 行同时出现。 [双账 README 第 34 行](https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L34)\n\n### Q24　手册规定了每个病人每天最多能挂几次号吗？\n\n检索拒答，查询范围为门诊手册。\n\n> 所查手册没有提供足以回答这个问题的原文。\n\n正确提示资料不足。门诊手册没有提供个人每天的挂号限额。\n\n### Q30　双账复核历史在云端每天几点做异地备份？\n\n模型选句，查询范围为全部手册。\n\n> 打开旧批次时保留旧版已保存的金额和来源行号。\n> 再次上传内容相同的两份 CSV，可以补齐差异原始字段，并保留原批次和复核历史。\n> 更正复核会追加版本，保留之前填写的人、原因和结论。\n\n应提示资料不足。原句支持保留原批次和复核历史，未涉及异地备份或备份时间。模型返回的句子没有给出符合问题的依据。 [双账 README 第 32 行](https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L32)\n","group":"项目说明"},{"path":"evaluation/report.json","text":"{\n  \"dataset\": \"手册检索室 · 固定 30 题\",\n  \"datasetSHA256\": \"73352c796fc118c47f8fc509d056d032622a26a3ab835e72d276e4ed9934d8c2\",\n  \"versions\": {\n    \"clinic\": \"bf00adf19b6588e4800e48f25bd487980f0a0119\",\n    \"ledger\": \"97649044221e9a7bde0100948efba7b617b995b3\"\n  },\n  \"protocol\": \"前三项必须合在一起覆盖该题的所有必要原文位置。一个位置有等价段落时，命中任一处即可。引用支持为按回答计数的独立 AI 复核：有引用的回答中，每项事实均可由引用推出才记通过。回答完整度另计。未做真人用时测试。本报告评测离线检索与摘录。\",\n  \"summary\": {\n    \"baseline\": {\n      \"hits\": 20,\n      \"answerable\": 22\n    },\n    \"hybrid\": {\n      \"hits\": 21,\n      \"answerable\": 22\n    },\n    \"unanswerable\": 8,\n    \"abstentions\": 6,\n    \"falseAbstentions\": 3,\n    \"citationEvaluated\": 21,\n    \"citationSupported\": 21,\n    \"reviewed\": 30,\n    \"fullyAnswered\": 16,\n    \"improvements\": [\n      \"Q08\"\n    ],\n    \"regressions\": []\n  },\n  \"cases\": [\n    {\n      \"id\": \"Q01\",\n      \"question\": \"用 P105 登记了第二天的班次，随后在哪里核对预约状态和办理记录？\",\n      \"type\": \"直接查询\",\n      \"project\": \"clinic\",\n      \"answerable\": true,\n      \"expected\": \"在预约查询中输入 P105。\",\n      \"expectedGroups\": [\n        [\n          \"clinic:21\"\n        ]\n      ],\n      \"baselineHit\": true,\n      \"hybridHit\": true,\n      \"baselineRanked\": \"门诊 L21、门诊 L3、门诊 L23\",\n      \"hybridRanked\": \"门诊 L21、门诊 L36、门诊 L3\",\n      \"status\": \"answered\",\n      \"answer\": \"跨日登记。 从 12 月 8 日的日程打开快速登记，选择 12 月 9 日 09:00 综合门诊 S03。用虚构就诊编号 P105 登记后，在预约查询中输入 P105，即可核对班次、预约状态和办理记录。\",\n      \"cited\": \"门诊 L21\",\n      \"citations\": [\n        {\n          \"id\": \"clinic-L21\",\n          \"project\": \"clinic\",\n          \"document\": \"门诊候补与改约工作台\",\n          \"title\": \"体验预约窗口的三种操作\",\n          \"start\": 21,\n          \"end\": 21,\n          \"url\": \"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L21\",\n          \"text\": \"跨日登记。 从 12 月 8 日的日程打开快速登记，选择 12 月 9 日 09:00 综合门诊 S03。用虚构就诊编号 P105 登记后，在预约查询中输入 P105，即可核对班次、预约状态和办理记录。\"\n        }\n      ],\n      \"evidenceHit\": true,\n      \"reviewDigest\": \"d40ad76053a50879f53b559fe0246b899545d8664eef2e5a0509b5f65b629b72\",\n      \"citationSupport\": true,\n      \"answerQuality\": \"complete\",\n      \"review\": \"摘录点明在预约查询输入 P105，并列出可核对的信息。\"\n    },\n    {\n      \"id\": \"Q02\",\n      \"question\": \"我跟着门诊示例走，R001 退掉之后，如果第一位一直没确认，接下来轮到哪个编号？\",\n      \"type\": \"换一种问法\",\n      \"project\": \"all\",\n      \"answerable\": true,\n      \"expected\": \"首位是 P003，10 分钟到期后轮到 P004。\",\n      \"expectedGroups\": [\n        [\n          \"clinic:22\"\n        ]\n      ],\n      \"baselineHit\": true,\n      \"hybridHit\": true,\n      \"baselineRanked\": \"门诊 L22、门诊 L23、门诊 L21\",\n      \"hybridRanked\": \"门诊 L22、门诊 L31、门诊 L36\",\n      \"status\": \"answered\",\n      \"answer\": \"把演示时钟推进 10 分钟，留位转给 P004。使用 P004 确认，查询预约单 R004 可核对递补经过。\",\n      \"cited\": \"门诊 L22\",\n      \"citations\": [\n        {\n          \"id\": \"clinic-L22\",\n          \"project\": \"clinic\",\n          \"document\": \"门诊候补与改约工作台\",\n          \"title\": \"体验预约窗口的三种操作\",\n          \"start\": 22,\n          \"end\": 22,\n          \"url\": \"https://github.com/fate788/clinic-scheduling/blob/bf
