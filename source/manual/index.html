n  .hero-caption{font-size:13px;margin-top:7px;max-width:26em}\n  .quick-grid{grid-template-columns:minmax(0,1fr);gap:8px;margin-top:12px}\n  .quick-card{padding:11px 10px;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}\n  .quick-icon{width:30px;height:32px;font-size:16px}\n  .quick-copy h2{font-size:17px}.quick-copy p{font-size:11px;line-height:1.45}\n  .quick-card .btn{grid-column:3;justify-self:end;padding:6px 9px;min-height:36px;font-size:12px}.quick-card .btn .icon{display:none}\n  .reader-practice{margin-bottom:12px;padding:12px}\n}\n\n.empty-action{margin-top:10px}\n.resolution-hint{margin:-3px 0 10px}\n.pick-mark{display:none;margin-left:8px}.picker-list button[aria-pressed=true] .pick-mark{display:inline}\n","group":"前端"},{"path":"static/support-actions.js","text":"\"use strict\";\n\n(() => {\n  function citationLabel(section) {\n    const name = section.document || section.title || section.project;\n    const lines = section.start === section.end ? String(section.start) : section.start + \"–\" + section.end;\n    return [name, section.version, section.start && \"第 \" + lines + \" 行\"].filter(Boolean).join(\" · \");\n  }\n\n  function sourceLink(section) {\n    // Imported content lives in its own workspace; an external reader still gets the cited words.\n    const address = section.sourceUrl || section.url;\n    try {\n      const parsed = new URL(address);\n      return [\"https:\", \"http:\"].includes(parsed.protocol) ? parsed.href : \"\";\n    } catch {\n      return \"\";\n    }\n  }\n\n  function answerText(question, result) {\n    const sources = result.citations.map((section, index) => {\n      const quote = section.snippet || section.text;\n      return [\"[\" + (index + 1) + \"] \" + citationLabel(section), quote, sourceLink(section)]\n        .filter(Boolean).join(\"\\n\");\n    });\n    return [question, result.answer, ...sources].filter(Boolean).join(\"\\n\\n\");\n  }\n\n  async function copyAnswer({ question, result }) {\n    const text = answerText(question, result);\n    try {\n      await navigator.clipboard.writeText(text);\n      return { text, copied: true };\n    } catch {\n      return { text, copied: false };\n    }\n  }\n\n  function csvCell(value) {\n    let text = String(value ?? \"\");\n    if (/^\\s*[=+@-]/.test(text) || /^[\\t\\r\\n]/.test(text)) text = \"'\" + text;\n    return '\"' + text.replace(/\"/g, '\"\"') + '\"';\n  }\n\n  function gapCsv(gaps) {\n    const rows = [[\"编号\", \"问题\", \"查询范围\", \"登记原因\", \"状态\", \"登记时间\", \"结案时间\", \"引用依据\", \"证据原文\", \"处理说明\"]];\n    const ranges = { all: \"全部手册\", clinic: \"门诊候补与改约工作台\", ledger: \"双账核对工作台\" };\n    for (const gap of gaps) {\n      const evidence = gap.evidence;\n      rows.push([gap.id, gap.question, gap.projectTitle || ranges[gap.project] || gap.project,\n        gap.reason === \"feedback\" ? \"答复待复核\" : \"资料不足\", gap.status === \"resolved\" ? \"已解决\" : \"待处理\",\n        gap.createdAt, gap.resolvedAt, evidence && citationLabel(evidence),\n        evidence && (evidence.snippet || evidence.text), gap.note]);\n    }\n    return \"\\uFEFF\" + rows.map(row => row.map(csvCell).join(\",\")).join(\"\\r\\n\") + \"\\r\\n\";\n  }\n\n  function exportGaps(gaps, filename = \"知识待补清单.csv\") {\n    if (!gaps.length) return;\n    const blob = new Blob([gapCsv(gaps)], { type: \"text/csv;charset=utf-8\" });\n    const url = URL.createObjectURL(blob);\n    const link = document.createElement(\"a\");\n    link.href = url;\n    link.download = filename;\n    document.body.append(link);\n    link.click();\n    link.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  }\n\n  window.supportActions = Object.freeze({ copyAnswer, exportGaps, answerText, gapCsv });\n})();\n","group":"前端"},{"path":"static/workflow-example.js","text":"\"use strict\";\n\n// Illustrative workplace policy, editable before an operator publishes it.\n(() => {\n  const title = \"IT 服务台 · 备用设备借用手册\";\n  const initial = `# 备用设备借用\n\n本手册用于体验内部 IT 服务台的设备借还流程，条款为虚构示例。\n\n## 申请备用电脑\n工作电脑送修期间，员工可以向 IT 服务台提交备用电脑借用申请。申请需填写设备资产编号、维修工单号和预计归还日期。\n\n## 领取与归还\n领取时由服务台登记设备序列号、充电器和接收人。归还时双方核对配件，由服务台关闭借用记录。\n\n## 查询申请进度\n提交后，员工可凭维修工单号向 IT 服务台查询借用申请进度。服务台确认备用设备后，会通知申请人到现场领取。\n\n## 借用期间的设备故障\n备用电脑出现故障时，员工应向 IT 服务台提供设备序列号和故障现象。服务台登记处理结果并确认是否需要更换设备。\n`;\n  const updated = initial + `\n## 续借期限\n备用电脑每次续借最多可延长三个工作日。请在约定归还时间前提交原借用记录编号，由 IT 服务台确认新的归还日期。\n`;\n  window.manualWorkflowExample = Object.freeze({\n    title,\n    initial,\n    updated,\n    question: \"备用电脑每次续借最多能延长几个工作日？\",\n    starterQuestions: Object.freeze([\n      {label: \"申请材料\", question: \"申请备用电脑需要填写哪些信息？\"},\n      {label: \"归还流程\", question: \"归还备用电脑后谁负责关闭借用记录？\"}\n    ])\n  });\n})();\n","group":"前端"},{"path":"tests/__init__.py","text":"\n","group":"验收测试"},{"path":"tests/support-actions.test.cjs","text":"const assert = require(\"node:assert/strict\");\nconst test = require(\"node:test\");\nglobal.window = {};\nrequire(\"../static/support-actions.js\");\nconst {answerText, gapCsv} = global.window.supportActions;\n\ntest(\"copied replies retain the published version and text of local evidence\", () => {\n  const text = answerText(\"期限多长？\", {answer:\"三个工作日\", citations:[{\n    document:\"借用手册\", version:\"v2\", start:9, end:10, snippet:\"续借可延长三个工作日。\",\n    url:\"#read/device/revision2-L9\"\n  }]});\n  assert.ok(text.includes(\"借用手册 · v2 · 第 9–10 行\"));\n  assert.ok(text.includes(\"续借可延长三个工作日。\"));\n  assert.ok(!text.includes(\"#read/\"));\n});\n\ntest(\"CSV preserves text and prevents cells from becoming formulas\", () => {\n  const csv = gapCsv([{id:\"g-1\",question:'=SUM(1,2)\\n带\"引号\"',project:\"all\",reason:\"feedback\",status:\"open\"}]);\n  assert.ok(csv.startsWith(\"\\uFEFF\"));\n  assert.ok(csv.includes(`\"'=SUM(1,2)\\n带\"\"引号\"\"\"`));\n  assert.ok(csv.includes(\"答复待复核\"));\n});\n","group":"验收测试"},{"path":"tests/test_api.py","text":"import json\nimport threading\nfrom pathlib import Path\nfrom tempfile import TemporaryDirectory\nimport unittest\nfrom http.server import ThreadingHTTPServer\nfrom unittest.mock import patch\nfrom urllib.error import HTTPError, URLError\nfrom urllib.request import Request, urlopen\n\nfrom model_answer import LocalModel\nfrom knowledge_store import KnowledgeStore\nfrom server import ManualHandler\n\n\nclass ApiTest(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.workspace = TemporaryDirectory()\n        cls.service = ThreadingHTTPServer((\"127.0.0.1\", 0), ManualHandler)\n        cls.service.store = KnowledgeStore(Path(cls.workspace.name)/\"knowledge.sqlite3\")\n        cls.service.model = None\n        cls.url = f\"http://127.0.0.1:{cls.service.server_port}\"\n        cls.thread = threading.Thread(target=cls.service.serve_forever, daemon=True)\n        cls.thread.start()\n\n    @classmethod\n    def tearDownClass(cls):\n        cls.service.shutdown()\n        cls.service.server_close()\n        cls.thread.join()\n        cls.workspace.cleanup()\n\n    def ask(self, data):\n        request = Request(self.url+\"/api/ask\", json.dumps(data).encode(),\n                          headers={\"Content-Type\":\"application/json\"})\n        with urlopen(request) as response:\n            return json.load(response)\n\n    def test_query_and_source_location(self):\n        result = self.ask({\"question\":\"再次运行相同样例能找回复核历史吗？\", \"project\":\"ledger\"})\n        self.assertEqual(result[\"mode\"], \"extractive\")\n        self.assertEqual(result[\"status\"], \"answered\")\n        citation = result[\"citations\"][0]\n        with urlopen(self.url+\"/api/documents\") as response:\n            library = json.load(response)\n        section = next(item for item in library[\"sections\"] if item[\"id\"] == citation[\"id\"])\n        self.assertEqual(section[\"text\"], citation[\"text\"])\n        self.assertIn(section[\"commit\"], section[\"url\"])\n        self.assertIn(citation[\"snippet\"], section[\"text\"])\n\n    def test_invalid_questions(self):\n        for data in ([], {}, {\"question\":\"   \"}, {\"question\":\"查手册\",\"project\":[]},\n                     {\"question\":\"问\"*501}):\n            with self.subTest(data=data), self.assertRaises(HTTPError) as failure:\n                self.ask(data)\n            self.assertEqual(failure.exception.code, 400)\n\n\nclass ModelTest(unittest.TestCase):\n    def setUp(self):\n        self.model = LocalModel(\"http://127.0.0.1:1/v1\", \"test\")\n        passage = {\"id\":\"doc-L2\",\"text\":\"打开批次。可查复核记录。\"}\n        self.result = {\"status\":\"answered\",\"answer\":\"可查复核记录。\",\"citations\":[passage],\"mode\":\"extractive\"}\n\n    def test_selected_sentence_is_in_the_cited_source(self):\n        with patch.object(self.model, \"select\", return_value=[1]):\n            result = self.model.compose(\"能查历史吗？\", self.result)\n        self.assertEqual(result[\"mode\"], \"model\")\n        self.assertEqual(result[\"answer\"], \"可查复核记录。\")\n        self.assertEqual(result[\"citations\"][0][\"snippet\"], result[\"answer\"])\n\n    def test_downgrades_on_unavailable_or_empty_model(self):\n        for options in ({\"side_effect\": URLError(\"unavailable\")}, {\"return_value\": []}):\n            with patch.object(self.model, \"select\", **options):\n                self.assertEqual(self.model.compose(\"查历史\", self.result), self.result)\n\n    def test_unknown_never_calls_model(self):\n        result = {**self.result, \"status\":\"insufficient\"}\n        with patch.object(self.model, \"select\", side_effect=AssertionError):\n            self.assertEqual(self.model.compose(\"查历史\", result), result)\n","group":"验收测试"},{"path":"tests/test_engine.py","text":"import hashlib\nimport unittest\n\nfrom engine import CORPUS, TeamPassage, get_documents, get_sections, search\n\n\nclass PassageTests(unittest.TestCase):\n    def test_snapshots_match_pinned_git_objects(self):\n        expected = {\"clinic\": \"c285353d9366821ae132c28645f81d4c655c321d064cbd548f24387326217a5d\",\n                    \"ledger\": \"f0214f3803bb4b1c79ee6e3b89b68c43dc0737dadb1f55091fbd246af4898d77\"}\n        for key, digest in expected.items():\n            content = (CORPUS / f\"{key}.md\").read_bytes()\n            self.assertEqual(hashlib.sha256(content).hexdigest(), digest)\n\n    def test_pinned_range_is_valid_for_every_passage(self):\n        sections = get_sections()\n        self.assertEqual(len(sections), len({s[\"id\"] for s in sections}))\n        for doc in get_documents():\n            rows = [s for s in sections if s[\"project\"] == doc[\"id\"]]\n            self.assertEqual(len(rows), doc[\"sections\"])\n            lines = (CORPUS / (doc[\"id\"] + \".md\")).read_text(encoding=\"utf-8\").splitlines()\n            for row in rows:\n                self.assertLessEqual(1, row[\"start\"])\n                self.assertLessEqual(row[\"start\"], row[\"end\"])\n                self.assertLessEqual(row[\"end\"], len(lines))\n                self.assertTrue(lines[row[\"start\"] - 1].strip())\n                self.assertIn(doc[\"commit\"], row[\"url\"])\n                self.assertIn(\"#L\" + str(row[\"start\"]), row[\"url\"])\n\n    def test_question_about_encoding_finds_the_input_encodings(self):\n        response = search(\"账单模板用什么编码？\", \"ledger\")\n        self.assertEqual(response[\"status\"], \"answered\")\n        self.assertIn(\"GB18030\", response[\"answer\"])\n        self.assertEqual(response[\"citations\"][0][\"start\"], 23)\n\n    def test_repeated_upload_does_not_lose_batch_history(self):\n        response = search(\"同一份样例账单再次核对，会生成新批次吗？\")\n        self.assertIn(\"同一批次\", response[\"answer\"])\n        self.assertIn(\"复核历史\", response[\"answer\"])\n\n    def test_questions_with_distinct_evidence_keep_both_references(self):\n        response = search(\"候补到期是给谁，短信会通知吗？\")\n        self.assertEqual([r[\"start\"] for r in response[\"citations\"]], [22, 27])\n        for citation in response[\"citations\"]:\n            self.assertIn(citation[\"snippet\"], citation[\"text\"])\n            self.assertIn(citation[\"snippet\"], response[\"answer\"])\n\n    def test_expiry_question_prefers_a_deadline_to_database_internals(self):\n        for question in (\"号源轮到我，超过留位时间会怎样？\", \"预约的号源会保留多久？\"):\n            with self.subTest(question=question):\n                response = search(question)\n                self.assertIn(\"10 分钟\", response[\"answer\"])\n                self.assertEqual(response[\"citations\"][0][\"start\"], 22)\n\n    def test_available_clinic_source_does_not_imply_business_hours(self):\n        for q in (\"预约窗口周末几点下班？\", \"医保可以支付挂号费吗？\", \"R972 的预约要去几楼？\",\n                  \"账单的历史记录保存多久？\", \"天气怎么样\"):\n            with self.subTest(q=q):\n                response = search(q)\n                self.assertEqual(response[\"status\"], \"insufficient\")\n                self.assertFalse(response[\"citations\"])\n\n    def test_imported_record_policy_accepts_time_written_in_chinese(self):\n        for duration in (\"三十天\", \"30 天\", \"两个月\", \"\"):\n            with self.subTest(duration=duration):\n                statement = (f\"访客登记记录自来访之日起保留{duration}。\" if duration else\n                             \"访客登记记录由服务台统一保留，负责人可查阅。\")\n                section = TeamPassage(\"team-visitors\", \"记录留存\", 2, 2, statement, \"来访管理\", 1, \"\")\n                for scope in (\"all\", section.project):\n                    with self.subTest(scope=scope):\n                        response = search(\"访客登记记录保留多久？\", scope, additions=(section,))\n                        self.assertEqual(response[\"status\"], \"answered\" if duration else \"insufficient\")\n                        if duration:\n                            self.assertIn(statement, response[\"answer\"])\n                            self.assertEqual(response[\"citations\"][0][\"start\"], 2)\n                        else:\n                            self.assertEqual(response[\"citations\"], [])\n\n    def test_source_filters_apply_to_lexical_and_enhanced_results(self):\n        for method in (\"baseline\", \"hybrid\"):\n            response = search(\"门诊和账单服务怎么启动\", \"ledger\", method)\n            self.assertEqual(response[\"method\"], method)\n            self.assertTrue(all(x[\"project\"] == \"ledger\" for x in response[\"results\"]))\n            self.assertLessEqual(len(response[\"results\"]), 3)\n\n    def test_start_command_shares_a_source_range_with_its_intro(self):\n        response = search(\"Python 启动命令是什么？\", \"clinic\")\n        cited = response[\"citations\"][0]\n        self.assertEqual((cited[\"start\"], cited[\"end\"]), (11, 15))\n        self.assertIn(\"python server.py\", response[\"answer\"])\n\n    def test_unknown_scope_or_method_fails_before_retrieval(self):\n        for args in ((\"问题\", \"missing\"), (\"问题\", \"all\", \"missing\"), (None,)):\n            with self.subTest(args=args), self.assertRaises(ValueError):\n                search(*args)\n        self.assertEqual(search(\"  \")[\"status\"], \"insufficient\")\n\n    def test_result_mutation_does_not_change_future_queries(self):\n        first = search(\"提前退出菜单要按哪个键盘按键？\")\n        first[\"citations\"][0][\"text\"] = \"modified\"\n        other = search(\"提前退出菜单要按哪个键盘按键？\")\n        self.assertIn(\"Esc\", other[\"citations\"][0][\"text\"])\n","group":"验收测试"},{"path":"tests/test_portable.py","text":"\"\"\"Tests for the buildable single-file public edition. Browser tests are optional.\"\"\"\nimport importlib.util\nfrom pathlib import Path\nimport subprocess\nimport sys\nfrom tempfile import TemporaryDirectory\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef build(folder):\n    destination = Path(folder)/\"index.html\"\n    subprocess.run([sys.executable, \"-B\", str(ROOT/\"portable/build.py\"), \"--output\", str(destination)],\n                   check=True, capture_output=True)\n    return destination\n\n\nclass PortableBuildTest(unittest.TestCase):\n    def test_includes_runtime_without_remote_dependencies(self):\n        with TemporaryDirectory() as temp:\n            markup = build(temp).read_text(encoding=\"utf-8\")\n            self.assertIn(\"manualOffline=Object.freeze\", markup)\n            self.assertIn(\"connect-src 'none'\", markup)\n            head = markup.partition(\"\u003c/head>\")[0]\n            self.assertNotRegex(head, r'\u003cscript\\b[^>]*\\bsrc=')\n            self.assertNotRegex(head, r'\u003clink\\b[^>]*rel=\"stylesheet\"')\n            self.assertNotRegex(head, r'url\\((?:[\"\\x27])?(?!data:)[\\w./-]+\\.webp')\n\n\n@unittest.skipUnless(importlib.util.find_spec(\"playwright\"), \"Install Python Playwright and Chromium for browser tests\")\nclass PortableBrowserTest(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        from playwright.sync_api import sync_playwright\n        cls.playwright = sync_playwright().start()\n        try:\n            if sys.platform == \"win32\":\n                cls.browser = cls.playwright.chromium.launch(channel=\"msedge\", headless=True)\n            else:\n                cls.browser = cls.playwright.chromium.launch(headless=True)\n        except Exception as error:\n            cls.playwright.stop()\n            raise unittest.SkipTest(\"Chromium is unavailable: \"+str(error)) from error\n        cls.folder = TemporaryDirectory()\n        cls.url = build(cls.folder.name).as_uri()\n\n    @classmethod\n    def tearDownClass(cls):\n        cls.browser.close()\n        cls.playwright.stop()\n        cls.folder.cleanup()\n\n    def setUp(self):\n        self.ctx = self.browser.new_context()\n        self.addCleanup(self.ctx.close)\n        self.page = self.ctx.new_page()\n        self.page.goto(self.url)\n\n    def request(self, path, data=None, expected=None, page=None):\n        status, body = (page or self.page).evaluate(\"\"\"async ([path, data]) => {\n            const reply=await window.manualOffline.request(path,data === null ? {} :\n                {method:\"POST\",body:JSON.stringify(data)});\n            return [reply.status,await reply.json()];\n        }\"\"\", [path, data])\n        if expected:\n            self.assertEqual(status, expected, body)\n        else:\n            self.assertIn(status, [200,201], body)\n        return body\n\n    def test_free_question_version_history_and_resolution(self):\n        cases = [(\"候补排到我之后，能留多久？错过了怎么办？\",\"clinic-L22\"),\n                 (\"再次运行同一份样例账单，还能看到原来的复核记录吗？\",\"ledger-L19\")]\n        for question, source in cases:\n            answer = self.request(\"/api/ask\", {\"question\":question})\n            self.assertEqual(answer[\"status\"], \"answered\", answer)\n            self.assertIn(source, [s[\"id\"] for s in answer[\"citations\"]])\n            self.assertEqual(answer[\"mode\"],\"extractive\")\n        answer = self.request(\"/api/ask\", {\"question\":\"预约窗口周末几点下班？\"})\n        self.assertEqual(answer[\"status\"], \"insufficient\")\n        fields = {\"title\":\"差旅手册\", \"content\":\"# 出差报销\\n\\n## 票据\\n员工须保存纸质车票。\"}\n        doc = self.request(\"/api/documents\", fields)[\"document\"]\n        old = self.request(\"/api/documents/\"+doc[\"id\"])[\"sections\"][0]\n        question = \"高铁车票报销最多允许多少元？\"\n        ask = {\"question\":question, \"project\":doc[\"id\"]}\n        self.assertEqual(self.request(\"/api/ask\",ask)[\"status\"],\"insufficient\")\n        gap = self.request(\"/api/gaps\",ask)[\"gap\"]\n        self.assertFalse(self.request(\"/api/gaps\",ask)[\"created\"])\n        update={**fields, \"project\":doc[\"id\"],\"expectedRevision\":1,\n                \"content\":fields[\"content\"]+\"\\n\\n## 高铁上限\\n高铁车票每次报销最多允许 860 元。\"}\n        self.assertEqual(self.request(\"/api/documents\", update)[\"document\"][\"revision\"],2)\n        self.assertFalse(self.request(\"/api/documents\", update)[\"created\"])\n        self.request(\"/api/documents\", {**update,\"content\":\"# 过时的草稿\\n新的正文。\"}, 409)\n        answer=self.request(\"/api/ask\",ask)\n        self.assertEqual(answer[\"status\"],\"answered\",answer)\n        self.assertIn(\"860\",answer[\"answer\"])\n        current=answer[\"citations\"][0]\n        self.assertEqual(current[\"revision\"],2)\n        self.assertEqual(self.request(\"/api/sections/\"+old[\"id\"])[\"section\"][\"revision\"],1)\n        self.assertEqual(self.request(\"/api/documents/\"+doc[\"id\"]+\"?revision=1\")[\"content\"], fields[\"content\"])\n        resolve=\"/api/gaps/\"+gap[\"id\"]+\"/resolve\"\n        self.request(resolve,{\"sectionId\":\"ledger-L19\"},422)\n        self.request(resolve,{\"sectionId\":old[\"id\"]},422)\n        done=self.request(resolve,{\"sectionId\":current[\"id\"],\"note\":\"已核对票据限额。\"})[\"gap\"]\n        self.assertEqual(done[\"evidence\"][\"id\"],current[\"id\"])\n        verified = self.request(\"/api/ask\", {**ask, \"question\":question.rstrip(\"？\")})\n        self.assertEqual(verified[\"resolutionId\"],gap[\"id\"])\n        self.assertEqual(verified[\"citations\"][0][\"id\"],current[\"id\"])\n        self.page.reload()\n        self.assertEqual(self.request(\"/api/gaps?status=resolved\")[\"gaps\"][0][\"id\"], gap[\"id\"])\n        self.request(\"/api/documents\",{**update, \"expectedRevision\":2,\"content\":update[\"content\"].replace(\"860\",\"750\")})\n        changed=self.request(\"/api/ask\",ask)\n        self.assertNotIn(\"resolutionId\",changed)\n        self.assertIn(\"750\",changed[\"answer\"])\n        self.assertIn(\"860\",self.request(\"/api/gaps?status=resolved\")[\"gaps\"][0][\"evidence\"][\"text\"])\n        other=self.browser.new_context()\n        try:\n            fresh=other.new_page(); fresh.goto(self.url)\n            self.assertEqual(self.request(\"/api/gaps\",page=fresh)[\"gaps\"],[])\n            self.assertEqual(len(self.request(\"/api/documents\",page=fresh)[\"documents\"]),2)\n        finally:\n            other.close()\n\n    def test_optimistic_updates_across_two_tabs(self):\n        page2=self.ctx.new_page()\n        page2.goto(self.url)\n        fields={\"title\":\"新员工指南\",\"content\":\"## 账号\\n开通账号前提交姓名。\"}\n        doc=self.request(\"/api/documents\",fields)[\"document\"]\n        results=self.page.evaluate(\"\"\"async ([uri,payload]) => Promise.all([\"甲\",\"乙\"].map(async label=>{\n            const reply=await window.manualOffline.request(uri,{method:\"POST\",body:JSON.stringify({\n                ...payload,content:payload.content+label\n            })});\n            return reply.status;\n        }))\"\"\", [\"/api/documents\",{**fields,\"project\":doc[\"id\"],\"expectedRevision\":1}])\n        self.assertEqual(sorted(results),[201,409])\n        self.assertEqual(self.request(\"/api/documents/\"+doc[\"id\"],page=page2)[\"document\"][\"revision\"],2)\n\n    def test_builtin_gap_can_be_closed_by_related_team_supplement(self):\n        q={\"question\":\"预约窗口周末几点下班？\",\"project\":\"clinic\"}\n        gap=self.request(\"/api/gaps\",q)[\"gap\"]\n        doc=self.request(\"/api/documents\", {\"title\":\"虚构窗口服务时间\", \"content\":\"## 周末营业时间\\n预约窗口周末 16:30 下班。\"})\n        ref=doc[\"sections\"][0]\n        self.request(\"/api/gaps/\"+gap[\"id\"]+\"/resolve\",{\"sectionId\":ref[\"id\"]})\n        answered=self.request(\"/api/ask\",q)\n        self.assertEqual(answered[\"status\"],\"answered\")\n        self.assertEqual(answered[\"resolutionId\"],gap[\"id\"])\n        self.assertIn(\"16:30\",answered[\"answer\"])\n\n    def test_operate_support_desk_without_network(self):\n        from playwright.sync_api import expect\n        page=self.page\n        external=[]\n        self.ctx.on(\"request\",lambda request: external.append(request.url) if request.url.startswith((\"http://\",\"https://\")) else None)\n        page.goto(self.url+\"#publish\")\n        page.locator(\"[data-fill-example]\").click()\n        page.locator(\"#publish-form button[type=submit]\").click()\n        expect(page.locator(\".reader-paper\")).to_be_visible()\n        project=page.url.split(\"#read/\")[1].split(\"/\")[0]\n        page.goto(self.url+\"#ask\")\n        question=page.evaluate(\"window.manualWorkflowExample.question\")\n        page.locator(\"#question\").fill(question)\n        scope=page.locator('[data-picker=\"scope\"]')\n        scope.locator(\"summary\").click()\n        scope.get_by_role(\"button\",name=\"IT 服务台 · 备用设备借用手册\",exact=True).click()\n        page.locator(\"#ask-form button[type=submit]\").click()\n        page.locator(\"[data-register=insufficient]\").click()\n        page.locator(\"#gap-form button[type=submit]\").click()\n        expect(page.locator(\"#resolve-form\")).to_be_visible()\n        page.locator('#resolve-form a[href^=\"#publish/\"]').click()\n        page.locator(\"[data-fill-example]\").click()\n        page.locator(\"#publish-form button[type=submit]\").click()\n        expect(page.locator(\"#resolve-form\")).to_be_visible()\n        page.locator(\"#evidence-search\").fill(\"续借期限\")\n        page.locator('input[name=evidence]').first.check()\n        page.locator(\"#resolve-form button[type=submit]\").click()\n        expect(page.get_by_text(\"结案依据\",exact=True)).to_be_visible()\n        page.reload()\n        expect(page.locator(\".source-box\").first).to_contain_text(\"三个工作日\")\n        self.assertEqual(self.request(\"/api/documents/\"+project)[\"document\"][\"revision\"],2)\n        self.assertEqual(external,[])\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n","group":"验收测试"},{"path":"tests/test_workspace.py","text":"from concurrent.futures import ThreadPoolExecutor\nimport json\nfrom pathlib import Path\nfrom tempfile import TemporaryDirectory\nimport threading\nimport unittest\nfrom urllib.request import Request, urlopen\n\nfrom engine import search\nfrom knowledge_store import KnowledgeStore, WorkspaceError\nfrom server import ManualHandler, ThreadingHTTPServer\n\n\nINITIAL = \"# 展厅预约\\n\\n## 领取钥匙\\n到服务台登记展厅名称后领取钥匙。\\n\"\nRULE = \"\\n## 临时延期\\n展厅每次预约最多可以延长两个工作日。\\n\"\nQUESTION = \"展厅预约最多可延长几个工作日？\"\n\n\nclass WorkspaceTest(unittest.TestCase):\n    def setUp(self):\n        directory = TemporaryDirectory()\n        self.addCleanup(directory.cleanup)\n        self.path = Path(directory.name)/\"workspace.sqlite3\"\n        self.store = KnowledgeStore(self.path)\n\n    def publish(self, content=INITIAL, **extra):\n        return self.store.publish({\"title\":\"展厅接待手册\", \"content\":content, **extra})\n\n    def test_current_only_search_and_immutable_editions(self):\n        first = self.publish()\n        project = first[\"document\"][\"id\"]\n        self.assertFalse(self.publish()[\"created\"])\n        saved = first[\"sections\"][0][\"id\"]\n        for scope in (project, \"all\"):\n            self.assertEqual(search(QUESTION, scope, additions=self.store.searchable())[\"status\"], \"insufficient\")\n        second = self.publish(INITIAL+RULE, project=project, expectedRevision=1)\n        self.assertEqual(second[\"document\"][\"revision\"], 2)\n        self.assertFalse(self.publish(INITIAL+RULE, project=project, expectedRevision=1)[\"created\"])\n        self.store = KnowledgeStore(self.path)\n        for scope in (project, \"all\"):\n            answer = search(QUESTION, scope, additions=self.store.searchable())\n            self.assertIn(\"两个工作日\", answer[\"answer\"])\n            self.assertEqual(answer[\"citations\"][0][\"id\"], second[\"sections\"][-1][\"id\"])\n        self.assertEqual(self.store.edition(project, 1)[\"content\"], INITIAL)\n        self.assertEqual(self.store.section(saved)[\"revision\"], 1)\n        self.assertNotIn(saved, {s[\"id\"] for s in self.store.library()[\"sections\"]})\n        self.assertEqual([v[\"revision\"] for v in second[\"document\"][\"versions\"]], [2,1])\n\n    def test_conflicting_concurrent_edits_do_not_lose_an_update(self):\n        first = self.publish()\n        project = first[\"document\"][\"id\"]\n        def update(n):\n            try:\n                return self.publish(INITIAL+str(n), project=project, expectedRevision=1)[\"document\"][\"revision\"]\n            except WorkspaceError as exc:\n                return exc.status\n        with ThreadPoolExecutor(max_workers=4) as pool:\n            results = list(pool.map(update, range(4)))\n        self.assertCountEqual(results, [2,409,409,409])\n        self.assertEqual(len(self.store.edition(project)[\"document\"][\"versions\"]), 2)\n\n    def test_publishing_rejects_incomplete_input_and_name_collisions(self):\n        self.publish()\n        for content,extra,status in (\n            (\"# 只有标题\",{},400), (\"文本\",{\"sourceUrl\":\"javascript:alert(1)\"},400),\n            (\"文本\",{\"sourceUrl\":\"https://user@example.org/doc\"},400),\n            (\"不同的正文\",{},409), (\"文本\",{\"project\":\"clinic\",\"expectedRevision\":1},409)):\n            with self.subTest(extra=extra), self.assertRaises(WorkspaceError) as error:\n                self.publish(content, **extra)\n            self.assertEqual(error.exception.status, status)\n\n    def test_duplicate_triage_reused_decision_and_stale_sources(self):\n        p = self.publish(INITIAL+RULE)\n        project = p[\"document\"][\"id\"]\n        with ThreadPoolExecutor(max_workers=4) as pool:\n            tickets = list(pool.map(lambda _: self.store.add_gap({\"question\":QUESTION, \"project\":project}),range(4)))\n        self.assertEqual(sum(g[\"created\"] for g in tickets), 1)\n        gap = tickets[0][\"gap\"][\"id\"]\n        with self.assertRaises(WorkspaceError) as unrelated:\n            self.store.resolve(gap, {\"sectionId\":p[\"sections\"][0][\"id\"]})\n        self.assertEqual(unrelated.exception.status,422)\n        args = {\"sectionId\":p[\"sections\"][-1][\"id\"],\"note\":\"已由管理员核对延期条款。\"}\n        closed = self.store.resolve(gap, args)\n        self.assertEqual(closed, self.store.resolve(gap, args))\n        self.assertEqual(self.store.reviewed_answer(QUESTION.rstrip(\"？\"), project)[\"resolutionId\"], gap)\n        self.assertEqual(len(self.store.gaps(\"open\")), 0)\n        newer = self.publish(INITIAL+RULE.replace(\"两个工作日\",\"三个工作日\"), project=project, expectedRevision=1)\n        self.assertIsNone(self.store.reviewed_answer(QUESTION, project))\n        self.assertIn(\"两个工作日\", self.store.gaps(\"resolved\")[0][\"evidence\"][\"text\"])\n        reopened = self.store.add_gap({\"question\":QUESTION, \"project\":project})[\"gap\"]\n        self.assertNotEqual(reopened[\"id\"], gap)\n        with self.assertRaises(WorkspaceError) as stale:\n            self.store.resolve(reopened[\"id\"], args)\n        self.assertEqual(stale.exception.status,422)\n        self.assertEqual(self.store.resolve(reopened[\"id\"], {\"sectionId\":newer[\"sections\"][-1][\"id\"]})[\"status\"],\"resolved\")\n\n    def test_http_flow_with_a_team_supplement_for_a_readonly_manual(self):\n        with ThreadingHTTPServer((\"127.0.0.1\",0), ManualHandler) as service:\n            service.store = self.store\n            service.model = None\n            thread = threading.Thread(target=service.serve_forever,daemon=True)\n            thread.start()\n            def call(route, payload=None):\n                base = \"http://127.0.0.1:\"+str(service.server_port)\n                data = None if payload is None else json.dumps(payload).encode()\n                with urlopen(Request(base+route,data,headers={\"Content-Type\":\"application/json\"})) as response:\n                    return json.load(response)\n            try:\n                question = {\"question\":\"演示窗口周末几点下班？\", \"project\":\"clinic\"}\n                self.assertEqual(call(\"/api/ask\", question)[\"status\"],\"insufficient\")\n                self.assertEqual(call(\"/api/gaps\")[\"gaps\"], [])\n                gap = call(\"/api/gaps\", {**question, \"reason\":\"feedback\"})[\"gap\"]\n                manual = call(\"/api/documents\", {\"title\":\"窗口轮班补充规定\",\"content\":\"## 周末下班时间\\n演示窗口周末下午四点下班。\"})\n                section = manual[\"sections\"][0]\n                call(\"/api/gaps/\"+gap[\"id\"]+\"/resolve\", {\"sectionId\":section[\"id\"]})\n                reviewed = call(\"/api/ask\", question)\n                self.assertEqual(reviewed[\"resolutionId\"],gap[\"id\"])\n                self.assertIn(\"下午四点\",reviewed[\"answer\"])\n                self.assertEqual(call(\"/api/sections/\"+section[\"id\"])[\"section\"][\"text\"], reviewed[\"answer\"])\n                self.assertEqual(call(\"/api/documents/\"+section[\"project\"]+\"?revision=1\")[\"sections\"][0][\"id\"],section[\"id\"])\n                self.assertEqual(len(call(\"/api/gaps?status=resolved\")[\"gaps\"]),1)\n                call(\"/api/gaps\",question)\n                self.assertNotIn(\"resolutionId\",call(\"/api/ask\",question))\n            finally:\n                service.shutdown()\n                thread.join()\n","group":"验收测试"}],"defaultFile":"engine.py"}</script>
