n result;\n    let cited=[publicRow(ranked[0])];\n    const clauses=query.split(/[?？；;，,]|另外|以及/u).map(s=>s.trim()).filter(s=>/谁|几|多|怎么|如何|吗|会|能|是否|哪些|什么|超时|能否/u.test(s));\n    if (clauses.length>=2 && clauses.length\u003c=3) {\n      const hits=clauses.map(s=>rank(s,scoped,index)[0]);\n      if (hits.every((hit,i)=>hasEvidence(clauses[i],hit) && hit.coverage>=0.28)) {\n        const unique=[...new Map(hits.map(hit=>[hit.section.id,publicRow(hit)])).values()];\n        const covered=terms(cited[0].text), asked=new Set(clauses.flatMap(c=>[...terms(c).keys()]));\n        if (unique.length>1 && unique.some(row=>[...terms(row.text).keys()].some(t=>\n          t.startsWith(\"@\") && !covered.has(t) && asked.has(t)))) cited=unique;\n      }\n    }\n    result.status=\"answered\";\n    result.citations=cited;\n    result.answer=cited.map(s=>s.snippet).join(\"\\n\");\n    result.results=[...new Map([...cited,...result.results].map(s=>[s.id,s])).values()].slice(0,3);\n    return result;\n  }\n\n  function relevant(question, section) {\n    const target=section.title+\" \"+section.text;\n    if (lacksQuantity(question,target)) return false;\n    const questionTerms=terms(question.replace(names,\" \").replace(filler,\" \")), evidence=terms(target);\n    const overlap=[...questionTerms.keys()].filter(t=>evidence.has(t));\n    return overlap.some(t=>t.startsWith(\"@\") || t.length>=3 || /^[a-z0-9]{2,}$/u.test(t)) || overlap.length>=2;\n  }\n  return {ask,relevant};\n}\n","group":"前端"},{"path":"portable/workspace.js","text":"/* The public edition is a local workspace. IndexedDB read-write transactions\n   serialize editors in different tabs without sending visitor documents anywhere. */\n(() => {\n  \"use strict\";\n  const seed=window.manualPortableSeed;\n  delete window.manualPortableSeed;\n  const search=createManualSearch(seed.retrieval);\n  const dbName=\"manual-room-enterprise-v2\";\n  const fresh=()=>({manuals:[],gaps:[]});\n  let connection;\n\n  class ApiError extends Error {\n    constructor(status,message) { super(message); this.status=status; }\n  }\n  function reject(status,message) { throw new ApiError(status,message); }\n  function database() {\n    if (!connection) connection=new Promise((resolve,rejectOpen)=>{\n      const pending=indexedDB.open(dbName,1);\n      pending.onupgradeneeded=()=>pending.result.createObjectStore(\"workspace\");\n      pending.onsuccess=()=>{\n        const db=pending.result;\n        db.onversionchange=()=>{ db.close(); connection=null; };\n        resolve(db);\n      };\n      pending.onerror=()=>rejectOpen(pending.error);\n    }).catch(error=>{connection=null;throw error;});\n    return connection;\n  }\n  async function workspace(mode, operation) {\n    let db;\n    try { db=await database(); }\n    catch {\n      if (mode===\"readonly\") return operation(fresh());\n      reject(503,\"此浏览器暂时无法保存工作区。请允许本地存储后重试。\");\n    }\n    return new Promise((resolve,rejectChange)=>{\n      const transaction=db.transaction(\"workspace\", mode), store=transaction.objectStore(\"workspace\");\n      const read=store.get(\"current\");\n      let result, ownError;\n      read.onsuccess=()=>{\n        try {\n          const data=read.result || fresh();\n          result=operation(data);\n          if (mode===\"readwrite\") store.put(data,\"current\");\n        } catch (error) { ownError=error; transaction.abort(); }\n      };\n      transaction.oncomplete=()=>resolve(result);\n      transaction.onabort=()=>rejectChange(ownError || new ApiError(503,\"保存失败。请检查浏览器存储空间后重试。\"));\n    });\n  }\n  const now=()=>new Date().toISOString();\n  function identifier(prefix) {\n    const bytes=crypto.getRandomValues(new Uint8Array(8));\n    return prefix+\"-\"+Array.from(bytes,n=>n.toString(16).padStart(2,\"0\")).join(\"\");\n  }\n  function getString(input,key,min,max,required=true) {\n    if (input[key]===undefined && !required) return \"\";\n    if (typeof input[key]!==\"string\") reject(400,\"字段 \"+key+\" 需要使用文字。\");\n    const value=input[key].trim();\n    if (Array.from(value).length\u003cmin || Array.from(value).length>max || /[\\u0000-\\u0008\\u000b-\\u001f]/u.test(value))\n      reject(400,\"字段 \"+key+\" 的长度或格式不正确。\");\n    return value;\n  }\n  function sourceURL(input) {\n    const raw=getString(input,\"sourceUrl\",0,2048,false);\n    if (!raw) return \"\";\n    let parsed;\n    try { parsed=new URL(raw); } catch { reject(400,\"原文地址需要是完整的 HTTP 或 HTTPS 链接。\"); }\n    if (!/^https?:\\/\\//iu.test(raw) || /[\\s\\\\]/u.test(raw) || ![\"https:\",\"http:\"].includes(parsed.protocol) || parsed.username || parsed.password)\n      reject(400,\"原文地址不支持这种格式。\");\n    return raw;\n  }\n  function parts(content,project,revision,title,url) {\n    const lines=content.split(\"\\n\"), sections=[];\n    let heading=title, start=0, buffer=[], code=false, size=0;\n    function flush() {\n      if (!buffer.length) return;\n      const text=buffer.join(\"\\n\");\n      if (text.trim()) sections.push({\n        id:project+\"-v\"+revision+\"-L\"+start, project, kind:\"team\", title:heading, document:title,\n        revision,version:\"v\"+revision,start,end:start+buffer.length-1,text,snippet:text,sourceUrl:url,url,commit:\"\"\n      });\n      buffer=[];size=0;\n    }\n    lines.forEach((line,index)=>{\n      const stripped=line.trim(), fence=/^(?:\\x60{3}|~{3})/u.test(stripped);\n      const sectionTitle=!code && stripped.match(/^#{1,6}\\s+(.+)/u);\n      if (!code && (sectionTitle || !stripped || fence || /^(?:[-*+]|\\d+[.)])\\s/u.test(stripped) || size>=1000)) flush();\n      if (sectionTitle) {heading=sectionTitle[1].trim().replace(/#+$/u,\"\").trim()||title;return;}\n      if (fence) code=!code;\n      if (stripped || code) {\n        if (!buffer.length) start=index+1;\n        buffer.push(line);size+=line.length;\n      }\n    });\n    flush();\n    if (!sections.length) reject(400,\"手册需要至少一段可引用的正文。\");\n    return sections;\n  }\n  function published(workspace,project) { return workspace.manuals.find(manual=>manual.id===project); }\n  function baseDoc(id) { return seed.documents.find(doc=>doc.id===id); }\n  function versions(manual) {\n    return [...manual.versions].reverse().map(v=>({revision:v.revision,version:v.version,publishedAt:v.publishedAt,sections:v.sections.length}));\n  }\n  function documentInfo(manual, v=manual.versions.at(-1)) {\n    return {id:manual.id,project:manual.id,kind:\"team\",title:v.title,name:v.title,document:v.title,\n      url:v.sourceUrl,sourceUrl:v.sourceUrl,revision:v.revision,version:v.version,sections:v.sections.length,\n      publishedAt:v.publishedAt,versions:versions(manual),commit:\"\"};\n  }\n  function builtinInfo(doc) {\n    return {...doc,kind:\"builtin\",revision:1,sourceUrl:doc.url,\n      versions:[{revision:1,version:doc.version,publishedAt:null,sections:doc.sections}]};\n  }\n  const bundled=seed.sections.map(section=>({...section,kind:\"builtin\",revision:1,sourceUrl:section.url}));\n  function library(ws) {\n    const latest=ws.manuals.map(m=>documentInfo(m)).sort((a,b)=>b.publishedAt.localeCompare(a.publishedAt));\n    return {documents:[...seed.documents.map(builtinInfo),...latest],\n      sections:[...bundled,...ws.manuals.flatMap(m=>m.versions.at(-1).sections)]};\n  }\n  function knownScope(ws,project) { return project===\"all\" || baseDoc(project) || published(ws,project); }\n  function edition(ws,id,revision) {\n    const builtin=baseDoc(id);\n    if (builtin && (revision===null || revision===1)) return {document:builtinInfo(builtin),\n      sections:bundled.filter(s=>s.project===id),content:seed.originals[id]};\n    const doc=published(ws,id);\n    if (!doc) reject(404,\"没有找到这份手册或版本。\");\n    const v=revision===null ? doc.versions.at(-1) : doc.versions.find(v=>v.revision===revision);\n    if (!v) reject(404,\"没有找到这个版本。\");\n    return {document:documentInfo(doc,v),sections:v.sections,content:v.content};\n  }\n  function publish(ws,input) {\n    const title=getString(input,\"title\",1,96),url=sourceURL(input);\n    if (typeof input.content!==\"string\" || !input.content.trim()) reject(400,\"请填写或导入手册正文。\");\n    const content=input.content.replace(/^\\ufeff/u,\"\").replace(/\\r\\n?/gu,\"\\n\");\n    if (content.includes(\"\\0\") || new TextEncoder().encode(content).length>256*1024) reject(400,\"正文须为有效文本，最大 256 KiB。\");\n    const titleKey=title.normalize(\"NFKC\").toLowerCase().replace(/\\s+/gu,\" \");\n    const sameTitle=value=>value.normalize(\"NFKC\").toLowerCase().replace(/\\s+/gu,\" \")===titleKey;\n    const updating=\"project\" in input && input.project!==\"\" && input.project!=null;\n    let doc=updating ? published(ws,input.project) : ws.manuals.find(m=>sameTitle(m.versions.at(-1).title));\n    if (updating && !doc) reject(baseDoc(input.project)?409:404,\"只能更新已发布的团队手册。\");\n    if (seed.documents.some(d=>sameTitle(d.title)) || ws.manuals.some(m=>m!==doc && sameTitle(m.versions.at(-1).title)))\n      reject(409,\"已有同名手册，请打开该手册发布修订版。\");\n    if (doc) {\n      const previous=doc.versions.at(-1);\n      if (previous.content===content && previous.title===title && previous.sourceUrl===url)\n        return {...edition(ws,doc.id,null),created:false};\n      if (!updating) reject(409,\"已有同名手册，请打开该手册发布修订版。\");\n      if (!Number.isInteger(input.expectedRevision) || input.expectedRevision!==previous.revision)\n        reject(409,\"此手册已有更新，请重新载入当前版本。\");\n    } else { doc={id:identifier(\"team\"),versions:[]};ws.manuals.push(doc); }\n    const revision=doc.versions.length+1;\n    const sections=parts(content,doc.id,revision,title,url);\n    const version={title,content,revision,version:\"v\"+revision,publishedAt:now(),sourceUrl:url,sections};\n    doc.versions.push(version);\n    return {...edition(ws,doc.id,null),created:true};\n  }\n  function sectionById(ws,id) {\n    const builtin=bundled.find(s=>s.id===id);\n    if (builtin) return builtin;\n    for (const manual of ws.manuals) for (const version of manual.versions) {\n      const section=version.sections.find(s=>s.id===id);\n      if (section) return section;\n    }\n    reject(404,\"引用段落不存在。\");\n  }\n  function gapResult(ws,gap) {\n    return {...gap,evidence:gap.sectionId?sectionById(ws,gap.sectionId):null};\n  }\n  const normalizeQuestion=value=>{\n    const normal=value.normalize(\"NFKC\").replace(/\\s+/gu,\" \").trim().toLowerCase();\n    return normal.replace(/[!?。？！ ]+$/u,\"\") || normal;\n  };\n  function openGap(ws,input) {\n    const question=getString(input,\"question\",1,500), project=input.project||\"all\";\n    const reason=input.reason||\"insufficient\";\n    if (!knownScope(ws,project) || ![\"insufficient\",\"feedback\"].includes(reason)) reject(400,\"请检查手册范围和登记原因。\");\n    const saved=ws.gaps.find(g=>g.status===\"open\" && g.project===project && normalizeQuestion(g.question)===normalizeQuestion(question));\n    if (saved) return {gap:gapResult(ws,saved),created:false};\n    const gap={id:identifier(\"gap\"),question,project,reason,status:\"open\",sectionId:null,note:\"\",\n      createdAt:now(),resolvedAt:null};\n    ws.gaps.unshift(gap);\n    return {gap:gapResult(ws,gap),created:true};\n  }\n  function resolveGap(ws,id,input) {\n    const gap=ws.gaps.find(g=>g.id===id);\n    if (!gap) reject(404,\"找不到该问题。\");\n    const sectionId=getString(input,\"sectionId\",1,180), note=getString(input,\"note\",0,1000,false);\n    if (gap.status===\"resolved\") {\n      if (gap.sectionId===sectionId && gap.note===note) return {gap:gapResult(ws,gap)};\n      reject(409,\"这个问题已经复核结案。\");\n    }\n    const section=sectionById(ws,sectionId);\n    const active=section.kind===\"builtin\" || published(ws,section.project).versions.at(-1).revision===section.revision;\n    const scopeMatch=gap.project===\"all\" || section.project===gap.project || (baseDoc(gap.project) && section.kind===\"team\");\n    if (!active || !scopeMatch) reject(422,\"请选择当前范围内仍生效的原文段落。\");\n    if (!search.relevant(normalizeQuestion(gap.question),section)) reject(422,\"这段原文与登记的问题缺少相关依据。\");\n    Object.assign(gap,{status:\"resolved\",sectionId,note,resolvedAt:now()});\n    return {gap:gapResult(ws,gap)};\n  }\n  async function route(url,method,input) {\n    const path=url.pathname;\n    if (method===\"GET\" && path===\"/api/evaluation\") return seed.report;\n    if (method===\"GET\" && path===\"/api/health\") return {status:\"ok\",modelConfigured:false};\n    if (method===\"GET\" && path===\"/api/documents\") return workspace(\"readonly\",library);\n    const doc=path.match(/^\\/api\\/documents\\/([^/]+)$/u);\n    if (method===\"GET\" && doc) return workspace(\"readonly\",ws=>edition(ws,decodeURIComponent(doc[1]),\n      url.searchParams.has(\"revision\") ? Number(url.searchParams.get(\"revision\")) : null));\n    const ref=path.match(/^\\/api\\/sections\\/([^/]+)$/u);\n    if (method===\"GET\" && ref) return workspace(\"readonly\",ws=>({section:sectionById(ws,decodeURIComponent(ref[1]))}));\n    if (method===\"POST\" && path===\"/api/documents\") return workspace(\"readwrite\",ws=>publish(ws,input));\n    if (method===\"POST\" && path===\"/api/ask\") return workspace(\"readonly\",ws=>{\n      const q=getString(input,\"question\",1,500),project=input.project||\"all\";\n      if (!knownScope(ws,project)) reject(400,\"请选择有效的手册范围。\");\n      const prior=ws.gaps.find(g=>g.project===project && normalizeQuestion(g.question)===normalizeQuestion(q));\n      if (prior?.status===\"resolved\") {\n        const evidence=sectionById(ws,prior.sectionId);\n        if (evidence.kind===\"builtin\" || published(ws,evidence.project).versions.at(-1).revision===evidence.revision)\n          return {mode:\"extractive\",status:\"answered\",method:\"reviewed\",answer:evidence.text,citations:[evidence],results:[evidence],\n            resolutionId:prior.id,modeNote:\"已由待补问题的复核记录确认。\"};\n      }\n      return search.ask(q,project,library(ws).sections);\n    });\n    if (method===\"GET\" && path===\"/api/gaps\") return workspace(\"readonly\",ws=>{\n      const status=url.searchParams.get(\"status\")||\"all\";\n      if (![\"all\",\"open\",\"resolved\"].includes(status)) reject(400,\"问题状态无效。\");\n      return {gaps:ws.gaps.filter(g=>status===\"all\" || g.status===status).map(g=>gapResult(ws,g))};\n    });\n    if (method===\"POST\" && path===\"/api/gaps\") return workspace(\"readwrite\",ws=>openGap(ws,input));\n    const resolve=path.match(/^\\/api\\/gaps\\/([^/]+)\\/resolve$/u);\n    if (method===\"POST\" && resolve) return workspace(\"readwrite\",ws=>resolveGap(ws,decodeURIComponent(resolve[1]),input));\n    reject(404,\"找不到此操作。\");\n  }\n  async function request(path, options={}) {\n    let status=200, payload;\n    try {\n      const url=new URL(path,\"https://manual.local\");\n      const input=options.body ? JSON.parse(options.body) : {};\n      if (!input || typeof input!==\"object\" || Array.isArray(input)) reject(400,\"请求格式不正确。\");\n      payload=await route(url,String(options.method||\"GET\").toUpperCase(),input);\n      if (payload.created) status=201;\n    } catch(error) {\n      status=error.status || (error instanceof SyntaxError ? 400 : 500);\n      payload={error:error.status?error.message:\"无法完成此操作，请刷新后重试。\"};\n    }\n    return new Response(JSON.stringify(payload),{status,headers:{\"Content-Type\":\"application/json; charset=utf-8\"}});\n  }\n  window.manualOffline=Object.freeze({isPortable:true,request});\n})();\n","group":"前端"},{"path":"run_with_model.py","text":"\"\"\"Run the Windows x64 preview with verified, project-local Qwen and llama.cpp files.\"\"\"\nimport argparse\nfrom hashlib import sha256\nimport json\nfrom pathlib import Path\nimport platform\nimport subprocess\nimport sys\nfrom tempfile import TemporaryDirectory\nimport time\nfrom urllib.error import URLError\nfrom urllib.request import Request, urlopen\nfrom zipfile import ZipFile\n\nfrom server import serve\n\nMODEL = \"Qwen2.5-1.5B-Instruct\"\nFILE = \"qwen2.5-1.5b-instruct-q4_k_m.gguf\"\nREVISION = \"91cad51170dc346986eccefdc2dd33a9da36ead9\"\nWEIGHTS = f\"https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/{REVISION}/{FILE}?download=true\"\nRUNTIME = \"https://github.com/ggml-org/llama.cpp/releases/download/b12810/llama-b12810-bin-win-vulkan-x64.zip\"\nWEIGHT_DIGEST = \"6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e\"\nRUNTIME_DIGEST = \"134e518ee19a7c9d27b478a0d0817ce4e5f11b4f0d4f721dee8cbde2fc8017ee\"\n\n\ndef file_digest(file):\n    digest = sha256()\n    with file.open(\"rb\") as source:\n        for block in iter(lambda: source.read(1024*1024), b\"\"):\n            digest.update(block)\n    return digest.hexdigest()\n\n\ndef fetch(folder, name, url, checksum):\n    target = folder / name\n    if target.is_file() and file_digest(target) == checksum:\n        return target\n    print(\"下载并校验\", name, flush=True)\n    with TemporaryDirectory(dir=folder) as staging:\n        partial = Path(staging) / name\n        request = Request(url, headers={\"User-Agent\":\"manual-search/1.0\"})\n        with urlopen(request, timeout=90) as response, partial.open(\"wb\") as dest:\n            for block in iter(lambda: response.read(1024*1024), b\"\"):\n                dest.write(block)\n        if file_digest(partial) != checksum:\n            raise ValueError(f\"{name} 校验失败，请重新运行。\")\n        partial.replace(target)\n    return target\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"启用本机模型。首次下载约 1.16 GB，后续可离线使用。\")\n    parser.add_argument(\"--cache\", type=Path, default=Path(__file__).resolve().parent / \".model-cache\")\n    parser.add_argument(\"--port\", type=int, default=8799)\n    parser.add_argument(\"--model-port\", type=int, default=8819)\n    args = parser.parse_args()\n    if sys.platform != \"win32\" or platform.machine().lower() not in {\"amd64\",\"x86_64\"}:\n        parser.error(\"自动安装适用于 Windows x64；其他系统可向 server.py 传入已有模型服务地址。\")\n    folder = args.cache.resolve()\n    folder.mkdir(parents=True, exist_ok=True)\n    binary = fetch(folder, \"llama-b12810.zip\", RUNTIME, RUNTIME_DIGEST)\n    weights = fetch(folder, FILE, WEIGHTS, WEIGHT_DIGEST)\n    # Each process owns its extracted files, even if a second preview starts concurrently.\n    with TemporaryDirectory(dir=folder) as staging:\n        with ZipFile(binary) as archive:\n            archive.extractall(staging)\n        program = next(Path(staging).rglob(\"llama-server.exe\"))\n        base = f\"http://127.0.0.1:{args.model_port}\"\n        command = [str(program), \"-m\", str(weights), \"--host\", \"127.0.0.1\", \"--port\", str(args.model_port),\n                   \"-c\", \"4096\", \"-ngl\", \"99\", \"-np\", \"1\", \"-a\", MODEL, \"--no-ui\",\n                   \"--cors-origins\", f\"http://127.0.0.1:{args.port}\"]\n        child = subprocess.Popen(command, cwd=program.parent)\n        try:\n            for _ in range(120):\n                if child.poll() is not None:\n                    raise RuntimeError(\"本机模型启动失败，请核对上方输出及端口。\")\n                try:\n                    with urlopen(base+\"/health\", timeout=1) as response:\n                        if json.load(response).get(\"status\") == \"ok\":\n                            break\n                except (OSError, URLError):\n                    pass\n                time.sleep(.5)\n            else:\n                raise RuntimeError(\"本机模型尚未就绪，请检查运行环境。\")\n            serve(args.port, base+\"/v1\", MODEL)\n        finally:\n            if child.poll() is None:\n                child.terminate()\n                child.wait()\n\n\nif __name__ == \"__main__\":\n    main()\n","group":"后端"},{"path":"server.py","text":"\"\"\"Serve the manual collection and search app with Python's standard library.\"\"\"\nimport argparse\nimport json\nimport mimetypes\nimport os\nimport re\nimport sqlite3\nfrom http import HTTPStatus\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom pathlib import Path\nfrom urllib.parse import parse_qs, unquote, urlsplit\n\nfrom engine import search\nfrom knowledge_store import KnowledgeStore, WorkspaceError\nfrom model_answer import LocalModel\n\nROOT = Path(__file__).resolve().parent\nSTATIC = ROOT / \"static\"\n\n\nclass ManualHandler(BaseHTTPRequestHandler):\n    def reply(self, code, body, mime):\n        self.send_response(code)\n        self.send_header(\"Content-Type\", mime)\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.send_header(\"Cache-Control\", \"no-cache\")\n        self.send_header(\"X-Content-Type-Options\", \"nosniff\")\n        self.end_headers()\n        if self.command != \"HEAD\":\n            try:\n                self.wfile.write(body)\n            except (BrokenPipeError, ConnectionResetError, ConnectionAbortedError):\n                pass\n\n    def data(self, value, code=200):\n        self.reply(code, json.dumps(value, ensure_ascii=False, allow_nan=False).encode(),\n                   \"application/json; charset=utf-8\")\n\n    def do_HEAD(self):\n        self.do_GET()\n\n    def do_GET(self):\n        address = urlsplit(self.path)\n        path = unquote(address.path)\n        params = parse_qs(address.query)\n        try:\n            if path == \"/api/documents\":\n                self.data(self.server.store.library())\n                return\n            if match := re.fullmatch(r\"/api/documents/([^/]+)\", path):\n                raw = params.get(\"revision\", [None])[0]\n                if raw is not None and not re.fullmatch(r\"[0-9]{1,9}\", raw):\n                    raise WorkspaceError(\"手册版本号无效。\")\n                self.data(self.server.store.edition(match[1], int(raw) if raw is not None else None))\n                return\n            if match := re.fullmatch(r\"/api/sections/([^/]+)\", path):\n                self.data({\"section\":self.server.store.section(match[1])})\n                return\n            if path == \"/api/gaps\":\n                self.data({\"gaps\":self.server.store.gaps(params.get(\"status\", [\"all\"])[0])})\n                return\n        except WorkspaceError as exc:\n            self.data({\"error\":str(exc)}, exc.status)\n            return\n        except sqlite3.OperationalError:\n            self.data({\"error\":\"知识库暂时不可用，请稍后重试。\"}, 503)\n            return\n        if path == \"/api/evaluation\":\n            try:\n                report = (ROOT / \"evaluation\" / \"report.json\").read_bytes()\n            except FileNotFoundError:\n                self.data({\"error\": \"评测报告尚未生成。\"}, 503)\n            else:\n                self.reply(200, report, \"application/json; charset=utf-8\")\n        elif path == \"/api/health\":\n            self.data({\"status\":\"ok\", \"modelConfigured\": bool(self.server.model)})\n        else:\n            if path == \"/\":\n                path = \"/index.html\"\n            file = (STATIC / path.lstrip(\"/\")).resolve()\n            if not file.is_relative_to(STATIC) or not file.is_file():\n                self.data({\"error\": \"未找到页面。\"}, 404)\n                return\n            mime = mimetypes.guess_type(file.name)[0] or \"application/octet-stream\"\n            if file.suffix == \".js\":\n                mime = \"text/javascript\"\n            self.reply(200, file.read_bytes(), mime + (\"; charset=utf-8\" if mime.startswith(\"text/\") else \"\"))\n\n    def do_POST(self):\n        path = urlsplit(self.path).path\n        close_gap = re.fullmatch(r\"/api/gaps/([a-z0-9-]+)/resolve\", path)\n        if path not in {\"/api/documents\", \"/api/gaps\", \"/api/ask\"} and not close_gap:\n            self.data({\"error\": \"未找到接口。\"}, 404)\n            return\n        if self.headers.get_content_type() != \"application/json\":\n            self.data({\"error\": \"请求需要 JSON 格式。\"}, HTTPStatus.UNSUPPORTED_MEDIA_TYPE)\n            return\n        try:\n            size = int(self.headers.get(\"Content-Length\", \"0\"))\n            if not 0 \u003c size \u003c= (2*1024*1024 if path == \"/api/documents\" else 16384):\n                raise WorkspaceError(\"请求为空或超出大小限制。\", 413)\n            payload = json.loads(self.rfile.read(size))\n            if not isinstance(payload, dict):\n                raise ValueError\n            if path == \"/api/documents\":\n                result = self.server.store.publish(payload)\n                self.data(result, 201 if result[\"created\"] else 200)\n                return\n            if path == \"/api/gaps\":\n                result = self.server.store.add_gap(payload)\n                self.data(result, 201 if result[\"created\"] else 200)\n                return\n            if close_gap:\n                self.data({\"gap\":self.server.store.resolve(close_gap[1], payload)})\n                return\n            question = payload.get(\"question\")\n            project = payload.get(\"project\", \"all\")\n            if not isinstance(question, str) or not 1 \u003c= len(question.strip()) \u003c= 500 or not isinstance(project,str):\n                raise ValueError\n            question = question.strip()\n            question.encode(\"utf-8\")\n            reviewed = self.server.store.reviewed_answer(question, project)\n            if reviewed is not None:\n                self.data(reviewed)\n                return\n            result = dict(search(question, project=project, method=\"hybrid\", additions=self.server.store.searchable()),\n                          mode=\"extractive\")\n        except WorkspaceError as exc:\n            self.data({\"error\":str(exc)}, exc.status)\n            return\n        except (UnicodeError, ValueError, OverflowError, RecursionError):\n            self.data({\"error\": \"请检查提交的文本、手册范围和 JSON 格式。\"}, 400)\n            return\n        except sqlite3.OperationalError:\n            self.data({\"error\":\"知识库暂时不可用，请稍后重试。\"}, 503)\n            return\n        if self.server.model:\n            result = self.server.model.compose(question, result)\n        self.data(result)\n\n\ndef serve(port, model_url=\"\", model_name=\"manual-editor\", host=\"127.0.0.1\", db=None):\n    store = KnowledgeStore(db or os.getenv(\"MANUAL_WORKSPACE_DB\") or ROOT/\"data\"/\"knowledge.sqlite3\")\n    with ThreadingHTTPServer((host, port), ManualHandler) as server:\n        server.store = store\n        server.model = LocalModel(model_url, model_name) if model_url else None\n        print(f\"http://{host}:{server.server_port}/\", flush=True)\n        server.serve_forever()\n\n\nif __name__ == \"__main__\":\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--host\", default=\"127.0.0.1\")\n    parser.add_argument(\"--port\", default=8799, type=int)\n    parser.add_argument(\"--db\", type=Path, help=\"Workspace SQLite file\")\n    parser.add_argument(\"--model-url\", default=os.environ.get(\"MANUAL_MODEL_URL\", \"\"))\n    parser.add_argument(\"--model-name\", default=os.environ.get(\"MANUAL_MODEL_NAME\", \"manual-editor\"))\n    args = parser.parse_args()\n    serve(args.port, args.model_url, args.model_name, args.host, args.db)\n","group":"后端"},{"path":"start-manual.cmd","text":"@echo off\ncd /d \"%~dp0\"\npython -B server.py\nif errorlevel 1 pause\n","group":"配置与启动"},{"path":"static/app.js","text":"\"use strict\";\n\nconst $ = id => document.getElementById(id);\nconst esc = value => String(value ?? \"\").replace(/[&\u003c>\"']/g, c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst paths = {\n  library:'\u003cpath d=\"M3 5.5c3.5-.6 6.4.1 9 2 2.6-1.9 5.5-2.6 9-2v13c-3.5-.6-6.4.1-9 2-2.6-1.9-5.5-2.6-9-2zM12 7.5v13\"/>',\n  books:'\u003crect x=\"3\" y=\"4\" width=\"5\" height=\"16\" rx=\"1\"/>\u003cpath d=\"M5 7h1M10 5h4v15h-4zM16 6l3-1 3 14-3 1z\"/>',\n  desk:'\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M3 10h18M10 10v10\"/>',\n  inbox:'\u003cpath d=\"M3 14l3-8h12l3 8v5H3zM3 14h5l2 2h4l2-2h5\"/>',\n  chart:'\u003cpath d=\"M4 4v16h16M8 16v-4M12 16V7M16 16v-6\"/>',\n  code:'\u003cpath d=\"m9 7-5 5 5 5m6-10 5 5-5 5\"/>', plus:'\u003cpath d=\"M12 5v14M5 12h14\"/>',\n  search:'\u003ccircle cx=\"10\" cy=\"10\" r=\"6.2\"/>\u003cpath d=\"m15 15 5 5\"/>',arrow:'\u003cpath d=\"M4 12h15m-5-5 5 5-5 5\"/>',\n  file:'\u003cpath d=\"M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 3h6\"/>',\n  filter:'\u003cpath d=\"M4 7h16M6 12h12m-9 5h6\"/>', check:'\u003cpath d=\"m4 12 5 5L20 6\"/>',upload:'\u003cpath d=\"M12 15V4m-4 4 4-4 4 4M4 14v6h16v-6\"/>'\n};\nfunction icon(name) {\n  return `\u003ci class=\"icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\">${paths[name] || \"\"}\u003c/svg>\u003c/i>`;\n}\ndocument.querySelectorAll(\"[data-icon]\").forEach(el => { el.innerHTML = icon(el.dataset.icon); el.setAttribute(\"aria-hidden\",\"true\"); });\nconst portable = Boolean(window.manualOffline);\n$(\"workspace-mode\").textContent = portable ? \"此浏览器工作区\" : \"本机团队工作区\";\nconst titles = {ask:\"支持工作台\",read:\"手册库\",gaps:\"待补问题\",evaluation:\"检索评测\",publish:\"发布手册\"};\nconst demoQuestion = \"门诊候补成功后，号源会保留多久？\";\nconst demoLink = \"#ask?\"+new URLSearchParams({q:demoQuestion,project:\"clinic\",demo:\"1\"});\nconst workflowExample = window.manualWorkflowExample;\nlet documents=[], sections=[], gaps=[], lastAnswer=null, lastGap=null, report=null;\nlet revision=0, activeAsk=null, returnGap=\"\", noticeTimer=0, gapReason=\"feedback\", focusFilter=false;\nlet context={view:\"ask\", parts:[], params:new URLSearchParams()};\nconst projects = {all:\"全部手册\",clinic:\"门诊\",ledger:\"双账\"};\nconst docName = id => documents.find(d=>d.id===id)?.title || projects[id] || id;\nconst isTeam = d => d?.kind===\"team\";\nconst pathPart = value=>encodeURIComponent(String(value));\nfunction readLink(project,id=\"\",version=\"\") {\n  return \"#read/\"+pathPart(project)+(id?\"/\"+pathPart(id):\"\")+(version?\"?revision=\"+pathPart(version):\"\");\n}\nfunction askLink(q,project=\"all\"){return \"#ask?\"+new URLSearchParams({q,project});}\nfunction gapLink(filter,id=\"\"){return \"#gaps/\"+filter+(id?\"/\"+pathPart(id):\"\");}\nfunction external(url,label){\n  if(!url)return \"\";\n  try {const u=new URL(url);if(![\"http:\",\"https:\"].includes(u.protocol)||u.username||u.password)return \"\";}\n  catch{return \"\";}\n  return `\u003ca class=\"text-link\" href=\"${esc(url)}\" target=\"_blank\" rel=\"noopener\">${esc(label)} ↗\u003c/a>`;\n}\nfunction lineRange(s){return \"第 \"+s.start+(s.start!==s.end?\"–\"+s.end:\"\")+\" 行\";}\nfunction dateLabel(value){\n  if(!value)return \"\";\n  const d=new Date(value);\n  return Number.isNaN(+d)?\"\": new Intl.DateTimeFormat(\"zh-CN\",{year:\"numeric\",month:\"2-digit\",day:\"2-digit\"}).format(d);\n}\nfunction badge(d){return `\u003cspan class=\"doc-icon ${d.id===\"ledger\"?\"ledger\":isTeam(d)?\"team\":\"\"}\">${icon(\"file\")}\u003c/span>`;}\nfunction btn(href,text,kind=\"secondary\",symbol=\"\"){return `\u003ca class=\"btn ${kind}\" href=\"${esc(href)}\">${symbol?icon(symbol):\"\"}${esc(text)}\u003c/a>`;}\nfunction header(title,desc=\"\",actions=\"\"){\n  $(\"page-heading\").closest(\".page-title\").hidden=false;\n  $(\"page-heading\").textContent=title;$(\"page-caption\").textContent=desc;$(\"page-caption\").hidden=!desc;\n  $(\"page-actions\").innerHTML=actions;\n}\nfunction statusTag(done){return `\u003cspan class=\"status ${done?\"done\":\"\"}\">${done?\"已解决\":\"待处理\"}\u003c/span>`;}\nfunction notify(message){$(\"notice\").textContent=message;$(\"notice\").hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{$(\"notice\").hidden=true;},3300);}\nfunction showError(el,msg){el.textContent=msg;el.hidden=false;}\nasync function api(url, options) {\n  const response=portable?await window.manualOffline.request(url,options):await fetch(url,options);\n  const data=await response.json();\n  if(!response.ok)throw new Error(data.error || \"工作区请求失败，请重试。\");\n  return data;\n}\nconst post=(url,payload,signal)=>api(url,{method:\"POST\",headers:{\"Content-Type\":\"application/json\"},body:JSON.stringify(payload),signal});\nfunction picker(name,value,items,label){\n  const selected=items.find(([v])=>String(v)===String(value)) || items[0];\n  const list=items.map(([v,t])=>`\u003cbutton type=\"button\" data-pick=\"${esc(v)}\" aria-pressed=\"${String(v)===String(selected[0])}\">\u003cspan>${esc(t)}\u003c/span>\u003cspan class=\"pick-mark\" aria-hidden=\"true\">✓\u003c/span>\u003c/button>`).join(\"\");\n  return `\u003cdetails class=\"picker\" data-picker=\"${esc(name)}\" data-value=\"${esc(selected[0])}\">\u003csummary aria-label=\"${esc(label+\"，\"+selected[1])}\">${icon(\"filter\")}\u003cspan>${esc(selected[1])}\u003c/span>\u003c/summary>\u003cdiv class=\"picker-list\" role=\"group\" aria-label=\"${esc(label)}\">${list}\u003c/div>\u003c/details>`;\n}\nfunction scopes(){\n  return [[\"all\",\"全部手册\"],...documents.map(d=>[d.id,d.title])];\n}\nfunction getPick(id){return document.querySelector('[data-picker=\"'+id+'\"]')?.dataset.value || \"all\";}\nfunction setRail(){\n  const open=gaps.filter(g=>g.status===\"open\").length;\n  $(\"rail-count\").hidden=!open;$(\"rail-count\").textContent=open;\n}\nfunction docRow(d){\n  const type=isTeam(d)?\"团队手册\":\"内置手册\";\n  return `\u003ca class=\"doc-row\" href=\"${esc(readLink(d.id))}\">${badge(d)}\u003cdiv class=\"doc-copy\">\u003cstrong>${esc(d.title)}\u003c/strong>\u003cspan>${type} · ${esc(d.version)} · ${esc(d.sections)} 段原文\u003c/span>\u003c/div>\u003ci class=\"doc-arrow\" aria-hidden=\"true\">›\u003c/i>\u003c/a>`;\n}\nfunction searchForm(q,scope,landing){\n  const placeholder=scope===\"clinic\"||(landing&&scope===\"all\") ? \"例如：号源保留多久？\" : \"输入你想核对的问题\";\n  return `\u003csection class=\"hero ${landing?\"start-hero\":\"compact\"}\" aria-label=\"查询手册\">\u003cdiv class=\"hero-inner\">\n    ${landing?'\u003ch1>查手册，给有出处的答复\u003c/h1>\u003cp class=\"hero-caption\">输入员工或客户的问题，找到现行条款，复制答复时带上原文出处。\u003c/p>':\"\"}\n    \u003cform id=\"ask-form\">\u003cdiv class=\"searchbox\">${icon(\"search\")}\u003clabel for=\"question\" class=\"sr-only\">你的问题\u003c/label>\u003cinput id=\"question\" type=\"text\" autocomplete=\"off\" maxlength=\"500\" required value=\"${esc(q)}\" placeholder=\"${placeholder}\">\u003cbutton class=\"btn primary\" type=\"submit\">查询${icon(\"arrow\")}\u003c/button>\u003c/div>\n    \u003cdiv class=\"search-tools\">\u003cspan>查找范围\u003c/span>${picker(\"scope\",scope,scopes(),\"查询范围\")}${!landing&&scope!==\"all\"?`\u003ca class=\"text-link\" href=\"${esc(readLink(scope))}\">打开原文 →\u003c/a>`:\"\"}\u003c/div>\u003c/form>\u003c/div>\u003c/section>`;\n}\nfunction quickStart() {\n  return `\u003csection class=\"quick-grid\" aria-label=\"快速开始\">\n    \u003carticle class=\"quick-card\">\u003cspan class=\"quick-icon\" aria-hidden=\"true\">${icon(\"search\")}\u003c/span>\u003cdiv class=\"quick-copy\">\u003ch2>先看一次查询结果\u003c/h2>\u003cp>${demoQuestion}\u003c/p>\u003c/div>\u003ca class=\"btn primary\" href=\"${esc(demoLink)}\">查看演示答案${icon(\"arrow\")}\u003c/a>\u003c/article>\n    \u003carticle class=\"quick-card\">\u003cspan class=\"quick-icon\" aria-hidden=\"true\">${icon(\"upload\")}\u003c/span>\u003cdiv class=\"quick-copy\">\u003ch2>导入自己的手册\u003c/h2>\u003cp>上传 Markdown、TXT，或直接粘贴正文。\u003c/p>\u003c/div>${btn(\"#publish\",\"导入手册\",\"secondary\",\"arrow\")}\u003c/article>\n  \u003c/section>`;\n}\nfunction gapRow(g,href,selected=false){\n  return `\u003ca class=\"gap-row\" href=\"${esc(href)}\" ${selected?'aria-current=\"true\"':\"\"}>\u003cdiv class=\"doc-copy\">\u003cstrong>${esc(g.question)}\u003c/strong>\u003cspan>${esc(docName(g.project))} · ${esc(dateLabel(g.createdAt))}\u003c/span>\u003c/div>\u003ci class=\"doc-arrow\" aria-hidden=\"true\">›\u003c/i>\u003c/a>`;\n}\nfunction workflowHref(){\n  const existing=documents.find(d=>isTeam(d)&&d.title===workflowExample.title);\n  return existing?readLink(existing.id):\"#publish?example=1\";\n}\nfunction home(){\n  const open=gaps.filter(g=>g.status===\"open\");\n  const team=documents.filter(isTeam);\n  const sorted=[...team].reverse().concat(documents.filter(d=>!isTeam(d))).slice(0,4);\n  return `\u003cdiv class=\"dashboard-grid\">\u003csection class=\"panel\">\u003cheader class=\"section-head\">\u003ch2>现行手册 \u003cspan class=\"count\">${documents.length}\u003c/span>\u003c/h2>\u003ca class=\"text-link\" href=\"#read\">查看手册库 →\u003c/a>\u003c/header>${sorted.map(docRow).join(\"\") || '\u003cp class=\"feedback\">导入第一份手册后即可查证。\u003c/p>'}\u003c/section>\u003csection class=\"panel\">\u003cheader class=\"section-head\">\u003ch2>待补问题 \u003cspan class=\"count\">${open.length}\u003c/span>\u003c/h2>\u003ca class=\"text-link\" href=\"#gaps\">查看队列 →\u003c/a>\u003c/header>${open.length?open.slice(0,3).map(g=>gapRow(g,gapLink(\"open\",g.id))).join(\"\"):'\u003cdiv class=\"empty-brief\">\u003cspan class=\"empty-icon\">'+icon(\"inbox\")+'\u003c/span>\u003cdiv>\u003cstrong>暂无待处理问题\u003c/strong>\u003cp>手册缺少某条规定时，可以登记问题并跟进补写。\u003c/p>\u003cbutton type=\"button\" class=\"action-link empty-action\" data-register=\"manual\">登记待补问题 →\u003c/button>\u003c/div>\u003c/div>'}\u003c/section>\u003c/div>\n    \u003cdiv class=\"workflow-link\">\u003cspan>${icon(\"books\")} 手册里没写到的规定怎么补？\u003c/span>\u003ca class=\"text-link\" href=\"${esc(workflowHref())}\">体验补齐手册 →\u003c/a>\u003c/div>`;\n}\nfunction highlighted(section, answer=\"\"){\n  const t=section.text;\n  const matches=[section.snippet,...answer.split(/(?\u003c=[。！？])|\\n/u)].map(s=>String(s||\"\").trim()).filter(s=>s&&t.includes(s)&&s!==t);\n  const ranges=matches.map(s=>[t.indexOf(s),t.indexOf(s)+s.length]).sort((a,b)=>a[0]-b[0]||b[1]-a[1]);\n  if(!ranges.length)return \"\u003cmark>\"+esc(t)+\"\u003c/mark>\";\n  let pos=0,html=\"\";\n  for(const [start,end] of ranges){if(start\u003cpos)continue;html+=esc(t.slice(pos,start))+\"\u003cmark>\"+esc(t.slice(start,end))+\"\u003c/mark>\";pos=end;}\n  return html+esc(t.slice(pos));\n}\nfunction sourceCard(s,index,answer) {\n  return `\u003cdetails class=\"source-box\" id=\"evidence-${index}\" ${index===0?\"open\":\"\"}>\u003csummary>\u003cspan>${esc(s.title)}\u003cspan>${esc(s.document)} · ${esc(s.version)} · ${esc(lineRange(s))}\u003c/span>\u003c/span>\u003c/summary>\u003cdiv class=\"source-body\" tabindex=\"-1\">\u003cblockquote>${highlighted(s,answer)}\u003c/blockquote>\u003cdiv class=\"source-links\">\u003ca href=\"${esc(readLink(s.project,s.id,s.revision))}\">在手册中定位 →\u003c/a>${external(s.sourceUrl||s.url,\"外部原文\")}\u003c/div>\u003c/div>\u003c/details>`;\n}\nfunction drawAnswer(q,scope,r,demo){\n  const ok=r.status===\"answered\";\n  const cited=new Set(r.citations.map(s=>s.id)),other=r.results.filter(s=>!cited.has(s.id));\n  const mode=ok?(r.mode===\"model\"?\"本地模型整理\":\"原文摘录\"):\"资料不足\";\n  const evidence=ok?r.citations.map((s,i)=>sourceCard(s,i,r.answer)).join(\"\"):documents.filter(d=>scope===\"all\"||d.id===scope).map(docRow).join(\"\");\n  const related=other.length?`\u003cdetails class=\"drop more\">\u003csummary>其他匹配段落 · ${other.length}\u003c/summary>\u003cul class=\"result-list\">${other.map(s=>`\u003cli>\u003ca href=\"${esc(readLink(s.project,s.id,s.revision))}\">${esc(s.title)}\u003c/a>\u003cspan class=\"meta\">${esc(lineRange(s))}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>\u003c/details>`:\"\";\n  const afterDemo=demo?`\u003cdiv class=\"workflow-link\">\u003cspan>${icon(\"books\")} 试试从登记问题到补齐手册的流程。\u003c/span>\u003ca class=\"text-link\" href=\"${esc(workflowHref())}\">体验补齐手册 →\u003c/a>\u003c/div>`:\"\";\n  return `\u003cdiv class=\"answer-grid\">\u003carticle class=\"panel answer-main\">\u003cdiv class=\"mode\">${icon(ok?\"file\":\"inbox\")} ${demo?\"演示手册 · \":\"\"}${mode}\u003c/div>\u003ch2 id=\"answer-title\" tabindex=\"-1\">${esc(q)}\u003c/h2>\u003cp class=\"answer-text\">${esc(r.answer)}\u003c/p>${r.modeNote && r.resolutionId ? '\u003cp class=\"hint resolution-hint\">已由维护人员核对依据\u003c/p>' : ''}\u003cdiv class=\"answer-actions\">${ok?'\u003cbutton type=\"button\" class=\"btn secondary\" data-copy-answer>复制答复与出处\u003c/button>':\"\"}\u003cbutton class=\"${ok?\"action-link\":\"btn primary\"}\" type=\"button\" data-register=\"${ok?\"feedback\":\"insufficient\"}\">${ok?\"依据不全，登记待补\":\"登记待补问题\"}\u003c/button>\u003ca class=\"text-link\" href=\"#ask\">新查询\u003c/a>\u003c/div>\u003cdiv id=\"reply-copy\">\u003c/div>\u003c/article>\u003caside class=\"panel answer-side\">\u003ch2>${ok?\"引用原文\":\"已查范围\"}\u003c/h2>${evidence}${related}\u003c/aside>\u003c/div>${afterDemo}`;\n}\nasync function drawDesk(params,n){\n  const q=(params.get(\"q\")||\"\").trim();\n  const selected=params.get(\"project\"),scope=selected || documents.find(isTeam)?.id || \"all\";\n  const demo=params.get(\"demo\")===\"1\" && scope===\"clinic\" && q===demoQuestion;\n  const landing=!q && !selected;\n  const ready=!q && isTeam(documents.find(d=>d.id===scope)) && params.get(\"ready\")===\"1\";\n  header(demo?\"演示答复\":q?\"手册查证\":ready?\"手册已就绪\":\"查询手册\",\n    ready?`已将查询限定在「${docName(scope)}」。输入一条问题，试着找到刚导入的原文。`:\n    demo?\"来自门诊预约演示手册，可打开条款核对结果。\":\"\",\n    btn(\"#publish\",\"导入手册\",\"secondary\",\"plus\"));\n  $(\"page-heading\").closest(\".page-title\").hidden=landing;\n  $(\"view\").innerHTML=searchForm(q,scope,landing)+'\u003cdiv id=\"ask-output\">\u003c/div>';\n  if(!q){\n    if(landing)$(\"ask-output\").innerHTML=quickStart()+home();\n    if(ready)$(\"question\").focus();\n    return;\n  }\n  const key=scope+\"\\n\"+q;\n  if(lastAnswer?.key===key){\n    lastAnswer.hash=location.hash;\n    $(\"ask-output\").innerHTML=drawAnswer(q,scope,lastAnswer.result,demo);\n    return;\n  }\n  $(\"ask-output\").innerHTML='\u003cp class=\"feedback busy\" role=\"status\">正在查找相关段落…\u003c/p>';\n  activeAsk=new AbortController();\n  const result=await post(\"/api/ask\",{question:q,project:scope},activeAsk.signal);\n  if(n!==revision)return;\n  lastAnswer={key,question:q,project:scope,result,hash:location.hash};\n  $(\"ask-output\").innerHTML=drawAnswer(q,scope,result,demo);\n  const title=$(\"answer-title\");\n  title.focus({preventScroll:true});\n  const bounds=title.getBoundingClientRect();\n  if(bounds.top\u003c0 || bounds.bottom>innerHeight-100)title.s w\">\u003ch3>关联原文并结案\u003c/h3>\u003ca href=\"${editLink}\" class=\"text-link\">${isTeam(currentDoc)?\"发布新版\":\"补充手册\"} ↗\u003c/a>\u003c/div>\u003cdiv class=\"evidence-tools\">\u003clabel class=\"filter-input\">${icon(\"search\")}\u003cspan class=\"sr-only\">筛选证据段落\u003c/span>\u003cinput id=\"evidence-search\" type=\"search\" placeholder=\"输入条款关键词，筛选现行段落\">\u003c/label>\u003c/div>\u003cdiv id=\"evidence-options\" class=\"evidence-options\" role=\"radiogroup\" aria-label=\"选择结案依据\">\u003c/div>\u003cdiv id=\"selected-evidence\">\u003c/div>\u003clabel class=\"field\">处理说明 \u003cem>选填\u003c/em>\u003ctextarea id=\"resolution-note\" rows=\"2\" maxlength=\"1000\" placeholder=\"记录适用条件或给支持人员的说明\">\u003c/textarea>\u003c/label>\u003cp class=\"form-error\" role=\"alert\" id=\"resolve-error\" hidden>\u003c/p>\u003cdiv class=\"form-end\">\u003cbutton type=\"submit\" class=\"btn primary\" disabled>确认结案\u003c/button>\u003c/div>\u003c/form>`;\n  return `\u003carticle class=\"panel case-panel\">${statusTag(done)}\u003ch2>${esc(g.question)}\u003c/h2>\u003cp class=\"meta\">${esc(docName(g.project))} · ${esc(g.reason===\"insufficient\"?\"未找到充分依据\":\"人工反馈\")} · ${esc(dateLabel(g.createdAt))}\u003c/p>${evidence}\u003c/article>`;\n}\nfunction drawOptions(g,filter,keep=\"\"){\n  const all=eligible(g);\n  const words=filter.trim().toLocaleLowerCase().split(/\\s+/).filter(Boolean);\n  const shown=all.filter(s=>{const t=(s.document+\" \"+s.title+\" \"+s.text).toLocaleLowerCase();return words.every(w=>t.includes(w));});\n  const host=$(\"evidence-options\");\n  host.innerHTML=shown.map(s=>`\u003clabel class=\"evidence-option\">\u003cinput name=\"evidence\" type=\"radio\" value=\"${esc(s.id)}\" ${s.id===keep?\"checked\":\"\"}>\u003cspan>${esc(s.title)} · ${esc(lineRange(s))}\u003c/span>\u003csmall>${esc(s.document)} · ${esc(s.text.slice(0,68))}\u003c/small>\u003c/label>`).join(\"\")||'\u003cp class=\"feedback\">没有匹配的原文。可以更换关键词，或先发布手册。\u003c/p>';\n  const selected=shown.find(s=>s.id===keep);\n  $(\"selected-evidence\").innerHTML=selected?`\u003cblockquote>${esc(selected.text)}\u003c/blockquote>`:\"\";\n  $(\"resolve-form\").querySelector('[type=submit]').disabled=!selected;\n}\nfunction queue(filter,id){\n  if(![\"open\",\"resolved\",\"all\"].includes(filter))filter=\"open\";\n  const requested=id && gaps.find(g=>String(g.id)===String(id));\n  if(requested && filter!==\"all\" && requested.status!==filter){\n    history.replaceState(null,\"\",gapLink(requested.status,requested.id));filter=requested.status;\n  }\n  const list=gaps.filter(g=>filter===\"all\"||g.status===filter);\n  lastGap=id?requested:list[0];\n  header(\"待补问题\",\"把知识缺口交给维护人员，为每个已解决的问题保留原文依据。\",'\u003cbutton class=\"btn secondary\" type=\"button\" data-register=\"manual\">'+icon(\"plus\")+'登记问题\u003c/button>');\n  const labels=[[\"open\",\"待处理\"],[\"resolved\",\"已解决\"],[\"all\",\"全部\"]];\n  const filters=labels.map(([v,l])=>`\u003ca href=\"${gapLink(v)}\" class=\"chip\" ${filter===v?'aria-current=\"true\"':\"\"}>${l}\u003c/a>`).join(\"\");\n  $(\"view\").innerHTML=`\u003cdiv class=\"queue-layout\">\u003csection class=\"panel\">\u003cdiv class=\"queue-tools\">\u003cdiv class=\"chips\">${filters}\u003c/div>\u003cbutton type=\"button\" class=\"action-link\" data-export-gaps=\"${filter}\" ${list.length?\"\":\"disabled\"}>导出清单\u003c/button>\u003c/div>\u003cdiv class=\"queue-list\">${list.map(g=>gapRow(g,gapLink(filter,g.id),g===lastGap)).join(\"\")||'\u003cp class=\"feedback\">当前有 0 个问题。\u003c/p>'}\u003c/div>\u003c/section>${gapPanel(lastGap)}\u003c/div>`;\n  if(lastGap?.status===\"open\")drawOptions(lastGap,\"\");\n}\n\n\nfunction failed(test) {\n  if (test.answerable) return !test.hybridHit || test.citationSupport === false || test.evidenceHit === false ||\n    ![\"pending\",\"complete\"].includes(test.answerQuality) || test.status === \"insufficient\";\n  return test.status !== \"insufficient\";\n}\nfunction testStatus(test) {\n  if (!test.answerable) return test.status === \"insufficient\" ? \"恰当拒答\" : \"误答\";\n  if (!test.hybridHit) return \"漏检\";\n  if (test.status === \"insufficient\") return \"未作答\";\n  if (failed(test)) return \"待复核\";\n  return \"命中\";\n}\nfunction caseRow(test) {\n  const method = hit => hit == null ? \"不适用\" : hit ? \"前 3 命中\" : \"前 3 漏检\";\n  const row = (label, value) => value ? '\u003cp>\u003cb>'+label+'\u003c/b>'+esc(value)+'\u003c/p>' : \"\";\n  const sources = (test.citations || []).map(s => '\u003ca href=\"'+esc(readLink(s.project,s.id))+'\">'+\n    esc(projects[s.project])+' · '+esc(lineRange(s))+' →\u003c/a>').join(\"\");\n  return '\u003cdetails class=\"case\">\u003csummary>\u003cspan class=\"case-status\">'+testStatus(test)+'\u003c/span>\u003cspan>'+esc(test.question)+'\u003c/span>\u003c/summary>'+\n    '\u003cdiv class=\"case-body\">'+row(\"关键词\", method(test.baselineHit))+row(\"改进检索\", method(test.hybridHit))+\n    row(\"关键词返回\",test.baselineRanked)+row(\"改进后返回\",test.hybridRanked)+\n    row(\"参考依据\",test.expected)+row(\"返回的答案\",test.answer)+\n    (sources ? '\u003cdiv class=\"source-links\">'+sources+'\u003c/div>' : \"\")+row(\"复核说明\",test.review)+\n    '\u003ca href=\"#ask?'+esc(new URLSearchParams({q:test.question,project:Object.hasOwn(projects,test.project) ? test.project : \"all\"}).toString())+'\">在问答中重试 →\u003c/a>\u003c/div>\u003c/details>';\n}\nfunction drawReport(data, filter) {\n  const s = data.summary;\n  const metrics = [[\"关键词 · 前三命中\",s.baseline.hits,s.baseline.answerable],[\"改进检索 · 前三命中\",s.hybrid.hits,s.hybrid.answerable],\n    [\"有依据题 · 完整回答\",s.fullyAnswered,s.hybrid.answerable],[\"无依据题 · 恰当拒答\",s.abstentions,s.unanswerable]];\n  const filters = {all:\"全部\",missed:\"需复查\",missing:\"无依据题\"};\n  if (!Object.hasOwn(filters,filter)) filter = \"all\";\n  const rows = data.cases.filter(test => filter === \"missed\" ? failed(test) : filter === \"missing\" ? !test.answerable : true);\n  $(\"evaluation\").innerHTML = '\u003cdiv class=\"metrics\">'+metrics.map(([label,x,y]) => '\u003cdiv class=\"metric\">\u003csmall>'+label+'\u003c/small>\u003cstrong>'+esc(x)+' / '+esc(y)+'\u003c/strong>\u003c/div>').join(\"\")+\n    '\u003c/div>\u003cp class=\"subtle\">这组结果评测离线检索与原文摘录。有引用的回答中，'+esc(s.citationSupported)+' / '+esc(s.citationEvaluated)+\n    ' 份获原文支持。独立 AI 分别复核引用和回答完整性，有依据的题目中有 '+esc(s.falseAbstentions)+' 题被误判为资料不足。\u003c/p>'+\n    '\u003cdiv class=\"eval-tools\">\u003ch2>逐题记录 \u003cspan class=\"meta\">'+rows.length+' 题\u003c/span>\u003c/h2>\u003cdiv class=\"chips\" aria-label=\"筛选评测记录\">'+\n    Object.entries(filters).map(([value,label]) => '\u003cbutton type=\"button\" class=\"chip\" data-eval=\"'+value+'\" aria-pressed=\"'+(value === filter)+'\">'+label+'\u003c/button>').join(\"\")+'\u003c/div>\u003c/div>'+\n    (rows.length ? rows.map(caseRow).join(\"\") : '\u003cp class=\"feedback\">该筛选下没有记录。\u003c/p>');\n  if (focusFilter) {\n    focusFilter = false;\n    $(\"evaluation\").querySelector(\".chip[aria-pressed=true]\")?.focus({preventScroll:true});\n  }\n}\n\n\nfunction go(hash){if(location.hash===hash)navigate();else location.hash=hash;}\nfunction currentRoute(){\n  const raw=location.hash.slice(1),cut=raw.indexOf(\"?\");\n  const path=cut\u003c0?raw:raw.slice(0,cut),params=new URLSearchParams(cut\u003c0?\"\":raw.slice(cut+1));\n  let parts;try{parts=path.split(\"/\").map(decodeURIComponent);}catch{parts=[];}\n  const view=Object.hasOwn(titles,parts[0])?parts[0]:\"ask\";return {view,parts,params};\n}\nasync function navigate(){\n  const n=++revision;activeAsk?.abort();\n  const next=currentRoute(), was=context;context=next;\n  const {view,parts,params}=next, nav=view===\"publish\"?\"read\":view;\n  document.querySelectorAll(\"[data-nav]\").forEach(a=>{if(a.dataset.nav===nav)a.setAttribute(\"aria-current\",\"page\");else a.removeAttribute(\"aria-current\");});\n  $(\"crumb\").textContent=titles[view];document.title=titles[view]+\" · 手册检索室\";\n  if(was.view!==view || was.parts[1]!==parts[1] || (view===\"ask\"&&String(was.params)!==String(params)))window.scrollTo(0,0);\n  if($(\"gap-dialog\").open)$(\"gap-dialog\").close();\n  $(\"view\").setAttribute(\"aria-busy\",\"true\");\n  try{\n    const [lib,queueData]=await Promise.all([api(\"/api/documents\"),api(\"/api/gaps?status=all\")]);\n    if(n!==revision)return;\n    documents=lib.documents;sections=lib.sections;gaps=queueData.gaps;setRail();\n    if(view===\"ask\")await drawDesk(params,n);\n    else if(view===\"read\"){if(parts[1])await reader(parts[1],parts[2],params,n);else catalog();}\n    else if(view===\"publish\")await publisher(parts[1],params,n);\n    else if(view===\"gaps\")queue(parts[1]||\"open\",parts[2]);\n    else {\n      header(\"检索评测\",\"两份内置手册的固定版本服务端评测，逐题核验检索与回答。\");\n      if(!report)report=await api(\"/api/evaluation\");\n      if(n===revision){$(\"view\").innerHTML='\u003csection id=\"evaluation\">\u003c/section>';drawReport(report,parts[1]||\"all\");}\n    }\n  }catch(error){\n    if(n===revision&&error.name!==\"AbortError\"){\n      $(\"view\").innerHTML=`\u003cdiv class=\"panel\">\u003cp class=\"feedback\" role=\"alert\">${esc(error.message)} \u003cbutton type=\"button\" class=\"action-link\" data-retry>重试\u003c/button>\u003c/p>\u003c/div>`;\n    }\n  }finally{if(n===revision)$(\"view\").setAttribute(\"aria-busy\",\"false\");}\n}\nfunction openGap(reason){\n  gapReason=reason===\"insufficient\"?\"insufficient\":\"feedback\";\n  const fromAnswer=context.view===\"ask\" && lastAnswer?.hash===location.hash;\n  $(\"gap-question\").value=fromAnswer?lastAnswer.question:\"\";\n  $(\"gap-scope\").innerHTML=picker(\"gap-scope\",fromAnswer?lastAnswer.project:\"all\",scopes(),\"涉及手册\");\n  $(\"gap-error\").hidden=true;$(\"gap-dialog\").showModal();$(\"gap-question\").focus();\n}\nasync function saveGap(form){\n  const question=$(\"gap-question\").value.trim();\n  if(!question){$(\"gap-question\").focus();return;}\n  const save=form.querySelector(\"[type=submit]\");save.disabled=true;$(\"gap-error\").hidden=true;\n  try{\n    const data=await post(\"/api/gaps\",{question,project:getPick(\"gap-scope\"),reason:gapReason});\n    $(\"gap-dialog\").close();notify(data.created?\"问题已登记\":\"已定位到同一项待补问题\");\n    go(gapLink(data.gap.status,data.gap.id));\n  }catch(e){showError($(\"gap-error\"),e.message);}\n  finally{save.disabled=false;}\n}\nfunction revisionCheck(form){\n  const source=$(\"doc-url\");\n  if(!source.validity.valid)source.closest(\"details\").open=true;\n  if(!form.reportValidity())return false;\n  if(!$(\"doc-title\").value.trim()||!$(\"doc-content\").value.trim()){\n    showError($(\"publish-error\"),\"请填写手册名称和正文。\");return false;\n  }\n  if(new TextEncoder().encode($(\"doc-content\").value).length>256*1024){\n    showError($(\"publish-error\"),\"正文超过 256 KiB，请按主题拆分。\");return false;\n  }\n  return true;\n}\nasync function saveDocument(form){\n  const err=$(\"publish-error\");err.hidden=true;\n  if(!revisionCheck(form))return;\n  const project=form.dataset.project,save=form.querySelector(\"[type=submit]\");\n  const payload={title:$(\"doc-title\").value.trim(),content:$(\"doc-content\").value,sourceUrl:$(\"doc-url\").value.trim()};\n  if(project){payload.project=project;payload.expectedRevision=Number(form.dataset.revision);}\n  save.disabled=true;\n  try{\n    const result=await post(\"/api/documents\",payload);lastAnswer=null;\n    notify(result.created?\"手册已发布\":\"已打开相同内容的现行版本\");\n    if(returnGap){const jump=returnGap;returnGap=\"\";go(jump);}\n    else if(project || payload.title===workflowExample.title)go(readLink(result.document.id));\n    else go(\"#ask?\"+new URLSearchParams({project:result.document.id,ready:\"1\"}));\n  }catch(e){if(err.isConnected)showError(err,e.message);}\n  finally{save.disabled=false;}\n}\nasync function readFile(input){\n  const file=input.files[0],err=$(\"publish-error\");if(!file)return;\n  try{\n    if(!/\\.(md|markdown|txt)$/i.test(file.name)||file.size>256*1024)throw new Error(\"请选择 256 KiB 以内的 Markdown 或 TXT 文件。\");\n    const text=new TextDecoder(\"utf-8\",{fatal:true}).decode(await file.arrayBuffer());\n    if(!text.trim())throw new Error(\"文件中没有正文。\");\n    if(!input.isConnected)return;\n    const currentTitle=$(\"doc-title\").value.trim();\n    if(!currentTitle||(!$(\"publish-form\").dataset.project&&currentTitle===workflowExample.title&&$(\"doc-content\").value===workflowExample.initial))\n      $(\"doc-title\").value=file.name.replace(/\\.[^.]+$/,\"\").slice(0,96);\n    $(\"doc-content\").value=text;\n    $(\"file-label\").textContent=file.name;err.hidden=true;\n    updatePublishButton();\n  }catch(e){if(err.isConnected)showError(err,e instanceof TypeError?\"文件需要使用 UTF-8 编码。\":e.message);}\n  input.value=\"\";\n}\nasync function resolveGap(form){\n  const choice=form.querySelector('input[name=evidence]:checked');if(!choice)return;\n  const save=form.querySelector(\"[type=submit]\");save.disabled=true;const err=$(\"resolve-error\");err.hidden=true;\n  try{\n    const data=await post(\"/api/gaps/\"+pathPart(form.dataset.gap)+\"/resolve\",{sectionId:choice.value,note:$(\"resolution-note\").value.trim()});\n    lastAnswer=null;returnGap=\"\";notify(\"已结案并保存引用依据\");go(gapLink(\"resolved\",data.gap.id));\n  }catch(e){if(err.isConnected)showError(err,e.message);}\n  finally{save.disabled=false;}\n}\nfunction copyFallback(host,text){\n  const field=document.createElement(\"textarea\");field.className=\"copy-url\";field.readOnly=true;field.setAttribute(\"aria-label\",\"可手动复制的文本\");\n  field.value=text;host.append(field);field.focus();field.select();\n}\nasync function copyLink(el){\n  const url=new URL(el.dataset.copyLink,location.href).href;\n  try{await navigator.clipboard.writeText(url);notify(\"已复制段落链接\");}\n  catch{copyFallback(el.closest(\".section-item\"),url);}\n}\nasync function copyAnswer(){\n  if(!lastAnswer)return;\n  const result=await window.supportActions.copyAnswer({question:lastAnswer.question,result:lastAnswer.result,url:location.href});\n  if(result.copied)notify(\"已复制答复与出处\");else{const host=$(\"reply-copy\");host.replaceChildren();copyFallback(host,result.text);}\n}\nfunction chooseOption(control){\n  const menu=control.closest(\".picker\"),key=menu.dataset.picker,val=control.dataset.pick;\n  if(key===\"version\"){go(readLink(context.parts[1],\"\",val));return;}\n  menu.querySelectorAll(\"[data-pick]\").forEach(b=>b.setAttribute(\"aria-pressed\",String(control===b)));\n  const label=control.firstElementChild.textContent;\n  menu.dataset.value=val;const summary=menu.querySelector(\"summary\");summary.querySelector(\"span\").textContent=label;\n  summary.setAttribute(\"aria-label\",(key===\"scope\"?\"查询范围\":\"涉及手册\")+\"，\"+label);menu.open=false;summary.focus();\n}\nfunction closePickers(except){\n  document.querySelectorAll(\".picker[open]\").forEach(menu=>{if(!menu.contains(except))menu.open=false;});\n}\ndocument.addEventListener(\"submit\",e=>{\n  const f=e.target;\n  if(![\"ask-form\",\"gap-form\",\"publish-form\",\"resolve-form\"].includes(f.id))return;\n  e.preventDefault();\n  if(f.id===\"ask-form\"){\n    const q=$(\"question\").value.trim();if(!q){$(\"question\").focus();return;}lastAnswer=null;go(askLink(q,getPick(\"scope\")));\n  }else if(f.id===\"gap-form\")saveGap(f);\n  else if(f.id===\"publish-form\")saveDocument(f);\n  else resolveGap(f);\n});\ndocument.addEventListener(\"input\",e=>{\n  if(e.target.id===\"doc-title\")updatePublishButton();\n  if(e.target.id===\"library-filter\")$(\"catalog-rows\").innerHTML=catalogRows(e.target.value);\n  if(e.target.id===\"evidence-search\"){\n    const keep=$(\"resolve-form\").querySelector('input[name=evidence]:checked')?.value;\n    drawOptions(lastGap,e.target.value,keep);\n  }\n});\ndocument.addEventListener(\"change\",e=>{\n  const el=e.target;\n  if(el.id===\"doc-file\")readFile(el);\n  if(el.name===\"evidence\"){\n    const section=sections.find(s=>s.id===el.value);if(!section)return;\n    $(\"selected-evidence\").innerHTML=\"\u003cblockquote>\"+esc(section.text)+\"\u003c/blockquote>\";\n    $(\"resolve-form\").querySelector(\"[type=submit]\").disabled=false;\n  }\n});\ndocument.addEventListener(\"click\",e=>{\n  closePickers(e.target);\n  const el=e.target.closest(\"button,a\");if(!el)return;\n  if(el.matches(\".skip\")){e.preventDefault();$(\"main\").focus();return;}\n  if(el.hasAttribute(\"data-pick\"))chooseOption(el);\n  if(el.hasAttribute(\"data-register\"))openGap(el.dataset.register);\n  if(el.hasAttribute(\"data-dismiss\"))$(\"gap-dialog\").close();\n  if(el.hasAttribute(\"data-fill-example\"))exampleContent(context.parts[1]);\n  if(el.hasAttribute(\"data-copy-link\"))copyLink(el);\n  if(el.hasAttribute(\"data-copy-answer\"))copyAnswer().catch(()=>notify(\"复制失败，请重试。\"));\n  if(el.hasAttribute(\"data-export-gaps\")){const f=el.dataset.exportGaps;window.supportActions.exportGaps(gaps.filter(g=>f===\"all\"||g.status===f).map(g=>({...g,projectTitle:docName(g.project)})));}\n  if(el.hasAttribute(\"data-eval\")){focusFilter=true;go(el.dataset.eval===\"all\"?\"#evaluation\":\"#evaluation/\"+el.dataset.eval);}\n  if(el.hasAttribute(\"data-retry\")){lastAnswer=null;navigate();}\n  if(el.matches('a[href^=\"#publish\"]'))returnGap=context.view===\"gaps\"&&lastGap?.status===\"open\"?gapLink(\"open\",lastGap.id):\"\";\n});\ndocument.addEventListener(\"keydown\",e=>{\n  const menu=e.target.closest(\".picker\");\n  if(menu && e.key===\"Escape\" && menu.open){e.preventDefault();e.stopPropagation();menu.open=false;menu.querySelector(\"summary\").focus();return;}\n  if(menu && [\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\"].includes(e.key)){\n    e.preventDefault();menu.open=true;const buttons=[...menu.querySelectorAll(\"[data-pick]\")],i=buttons.indexOf(document.activeElement);\n    const n=e.key===\"Home\"?0:e.key===\"End\"?buttons.length-1:e.key===\"ArrowDown\"?Math.min(buttons.length-1,i+1):Math.max(0,i-1);\n    buttons[n]?.focus();return;\n  }\n});\ndocument.addEventListener(\"focusin\",e=>closePickers(e.target));\nwindow.addEventListener(\"hashchange\",navigate);\nnavigate();\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#292c31\">\n  \u003ctitle>支持工作台 · 手册检索室\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"styles.css\">\n  \u003cscript defer src=\"workflow-example.js\">\u003c/script>\n  \u003cscript defer src=\"support-actions.js\">\u003c/script>\n  \u003cscript defer src=\"app.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip\" href=\"#main\">跳至正文\u003c/a>\n  \u003caside class=\"rail\">\n    \u003ca class=\"brand\" href=\"#ask\">\u003cspan class=\"brand-icon\" data-icon=\"library\">\u003c/span>\u003cb>手册检索室\u003c/b>\u003c/a>\n    \u003cnav aria-label=\"工作区导航\">\n      \u003ca href=\"#ask\" data-nav=\"ask\">\u003ci data-icon=\"desk\">\u003c/i>\u003cspan>支持工作台\u003c/span>\u003c/a>\n      \u003ca href=\"#read\" data-nav=\"read\">\u003ci data-icon=\"books\">\u003c/i>\u003cspan>手册库\u003c/span>\u003c/a>\n      \u003ca href=\"#gaps\" data-nav=\"gaps\">\u003ci data-icon=\"inbox\">\u003c/i>\u003cspan>待补问题\u003c/span>\u003csmall id=\"rail-count\" hidden>\u003c/small>\u003c/a>\n      \u003ca class=\"eval-nav\" href=\"#evaluation\" data-nav=\"evaluation\">\u003ci data-icon=\"chart\">\u003c/i>\u003cspan>检索评测\u003c/span>\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"rail-foot\">\u003ca href=\"https://github.com/fate788/manual-search\" target=\"_blank\" rel=\"noopener\">\u003ci data-icon=\"code\">\u003c/i>项目源码\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\n  \u003c/aside>\n  \u003cdiv class=\"workspace\">\n    \u003cheader class=\"topbar\">\n      \u003cdiv class=\"trail\">\u003ci data-icon=\"library\">\u003c/i>\u003cspan>团队知识库\u003c/span>\u003ci class=\"slash\">/\u003c/i>\u003cb id=\"crumb\">支持工作台\u003c/b>\u003c/div>\n      \u003cspan id=\"workspace-mode\" class=\"workspace-mode\">\u003c/span>\n    \u003c/header>\n    \u003cmain id=\"main\" tabindex=\"-1\">\u003cdiv class=\"content\">\n      \u003cheader class=\"page-title\">\u003cdiv>\u003ch1 id=\"page-heading\">支持工作台\u003c/h1>\u003cp id=\"page-caption\">\u003c/p>\u003c/div>\u003cdiv class=\"page-actions\" id=\"page-actions\">\u003c/div>\u003c/header>\n      \u003cdiv id=\"view\" aria-busy=\"true\">\u003cp class=\"feedback\">正在打开工作区…\u003c/p>\u003c/div>\n      \u003cnoscript>请启用 JavaScript 以查阅手册与处理问题。\u003c/noscript>\n    \u003c/div>\u003c/main>\n  \u003c/div>\n  \u003cdialog id=\"gap-dialog\" aria-labelledby=\"gap-dialog-title\">\u003cform id=\"gap-form\">\n    \u003cdiv class=\"dialog-head\">\u003ch2 id=\"gap-dialog-title\">登记待补问题\u003c/h2>\u003cbutton type=\"button\" class=\"icon-button\" data-dismiss aria-label=\"关闭\">×\u003c/button>\u003c/div>\n    \u003clabel class=\"field\">需要查证的问题\u003ctextarea id=\"gap-question\" required maxlength=\"500\" rows=\"3\">\u003c/textarea>\u003c/label>\n    \u003cdiv class=\"field\">\u003cspan>涉及手册\u003c/span>\u003cdiv id=\"gap-scope\">\u003c/div>\u003c/div>\n    \u003cp id=\"gap-error\" class=\"form-error\" role=\"alert\" hidden>\u003c/p>\n    \u003cdiv class=\"form-end\">\u003cbutton type=\"button\" class=\"btn secondary\" data-dismiss>取消\u003c/button>\u003cbutton class=\"btn primary\" type=\"submit\">登记问题\u003c/button>\u003c/div>\n  \u003c/form>\u003c/dialog>\n  \u003cdiv id=\"notice\" class=\"notice\" role=\"status\" hidden>\u003c/div>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root{\n  color-scheme:light;--ground:#f5f4ef;--paper:#fffefa;--ink:#282c30;--muted:#62645f;--soft:#777970;\n  --rule:#d9d8ce;--rule-dark:#b3b4a9;--copper:#775530;--gold:#c7ad82;--accent:#393f49;\n  --serif:\"Songti SC\",\"STSong\",\"Noto Serif CJK SC\",SimSun,Georgia,serif;--ui:\"Microsoft YaHei UI\",\"PingFang SC\",system-ui,sans-serif;\n  --mono:\"Cascadia Mono\",\"SFMono-Regular\",Consolas,monospace;--rail:208px;\n  font:14px/1.6 var(--ui);color:var(--ink);background:var(--ground)\n}\n*{box-sizing:border-box}\nbody{margin:0;min-height:100vh}\nh1,h2,h3,h4,p,ul,ol,blockquote,fieldset,legend,dl,dt,dd{margin:0;padding:0}\nbutton,input,summary,textarea{font:inherit;color:inherit}\na{color:inherit;text-decoration:none}\nbutton{border:0;background:none;padding:0;cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:.55}\n:where(a,button,summary,input,textarea,[tabindex]):focus-visible{outline:2px solid #9d733c;outline-offset:3px}\nbutton:disabled:hover{transform:none}\n[hidden]{display:none!important}\ninput,textarea{min-width:0}\ntextarea{resize:vertical}\nh1,h2,h3,h4,p,blockquote,.doc-link,.item-link{overflow-wrap:anywhere}\n.icon,[data-icon]{display:inline-flex;align-items:center;justify-content:center;flex:none;font-style:normal}\n.icon svg,[data-icon] svg{width:1em;height:1em;display:block;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;fill:none}\n.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}\n.skip{position:fixed;z-index:10;top:-80px;left:12px;background:var(--paper);padding:8px 12px;border-radius:3px}\n.skip:focus{top:10px}\n.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:3;display:flex;flex-direction:column;background:linear-gradient(150deg,#30343b,#24272d 68%);color:#e5e4df;border-right:1px solid #303339}\n.brand{display:flex;align-items:center;gap:11px;padding:27px 20px 25px;color:#faf7ef;font:600 23px/1 var(--serif);white-space:nowrap}\n.brand-icon{border:1px solid #8f816b;border-radius:6px;width:34px;height:34px;color:#debf8e;background:linear-gradient(160deg,#494942,#34363a);font-size:22px}\n.rail nav{margin:2px 13px;display:grid;gap:5px;padding-top:17px;border-top:1px solid #ffffff1c}\n.rail nav a,.rail-foot a{display:flex;align-items:center;gap:11px;padding:11px 13px;min-height:42px;border:1px solid transparent;border-radius:5px;color:#c9cac7;font-size:14px;font-weight:500}\n.rail nav a [data-icon],.rail-foot [data-icon]{font-size:17px;color:#bdbcb4}\n.rail nav a:hover,.rail-foot a:hover{background:#ffffff09;color:white}\n.rail nav a[aria-current]{background:#464642;border-color:#625c4e;color:#fff4df}\n.rail nav a[aria-current] [data-icon]{color:#dfc599}\n.rail nav small{font:11px/1.2 var(--mono);background:#60605b;color:#fff7e5;padding:2px 5px;border-radius:4px;margin-left:auto}\n.rail nav .eval-nav{margin-top:16px;position:relative}\n.rail nav .eval-nav:before{content:\"\";position:absolute;inset:-10px 0 auto;height:1px;background:#ffffff19}\n.rail-foot{margin:auto 13px 18px;padding-top:12px;border-top:1px solid #ffffff1c}.rail-foot a{font-size:12px;min-height:36px;padding-block:6px}.rail-foot a span{margin-left:auto;color:#aeafa9}\n.workspace{margin-left:var(--rail);min-width:0}\n.topbar{height:55px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(24px,3.3vw,58px);background:#faf9f5}\n.trail{display:flex;align-items:center;gap:11px;font-size:12px}.trail>[data-icon]{font-size:15px;color:#716852}.trail>span,.slash{color:var(--muted)}.slash{font:12px var(--mono);color:#b4afa3}.trail b{font-weight:560}\n.workspace-mode{font-size:11px;color:var(--muted)}.workspace-mode:before{content:\"\";display:inline-block;width:6px;height:6px;background:#858371;border-radius:50%;margin-right:7px}\nmain{min-height:calc(100vh - 55px);outline:none}\n.content{width:min(1280px,100%);margin:0 auto;padding:clamp(25px,2.8vw,43px) clamp(24px,3.3vw,58px) 56px}\n.page-title,.heading-row,.section-head,.form-end,.dialog-head,.reader-meta,.queue-head,.list-heading,.import-foot,.evidence-tools{display:flex;align-items:center;justify-content:space-between;gap:14px}\n.page-title{align-items:center;margin-bottom:23px}.page-title h1{font:600 clamp(29px,3vw,42px)/1.18 var(--serif);letter-spacing:-.035em}.page-title p{color:var(--muted);font-size:13px;margin-top:8px}.page-actions{display:flex;gap:8px;flex:none;align-items:center}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;line-height:1.35;padding:8px 13px;border:1px solid transparent;border-radius:5px;font-size:13px;font-weight:570;white-space:nowrap;text-align:center}\n.btn .icon{font-size:15px}.btn.primary{color:#fbf9f3;background:#343a43;border-color:#343a43}.btn.primary:hover{background:#252a31}\n.btn.secondary{background:var(--paper);border-color:var(--rule-dark)}.btn.secondary:hover{border-color:#8e826f;background:#f2eee5}\n.text-link,.action-link,.source-links a,.source-links button,.case a{display:inline-flex;align-items:center;gap:5px;color:var(--copper);font-size:12px;font-weight:560}\n.text-link:hover,.action-link:hover,.source-links a:hover,.source-links button:hover,.case a:hover{text-decoration:underline;text-underline-offset:3px}\n.hero{position:relative;isolation:isolate;border:1px solid #cfc9b9;background:#ebe7dc;border-radius:9px;box-shadow:0 2px 5px #41352408}\n.hero:before{content:\"\";position:absolute;z-index:-1;inset:0 0 0 auto;width:38%;border-radius:0 8px 8px 0;background:linear-gradient(90deg,#ebe7dc 0%,rgba(235,231,220,.41) 15%,transparent 43%),url(\"library-cover.webp\") 60% 50%/cover no-repeat}\n.hero-inner{max-width:75%;padding:clamp(20px,2.5vw,37px);padding-right:3%}\n.start-hero{background:#e9e5d9;border-color:#d6ccb8}\n.start-hero:before{width:43%;background:linear-gradient(90deg,#e9e5d9 0%,#e9e5d973 29%,transparent 58%),url(\"library-cover.webp\") center 51%/cover no-repeat}\n.start-hero .hero-inner{max-width:74%;padding:clamp(25px,3.2vw,46px)}\n.start-hero h1{font:600 clamp(28px,3.2vw,47px)/1.25 var(--serif);letter-spacing:-.045em;color:#242930}\n.hero-caption{margin-top:9px;color:#4e504d;font-size:14px;line-height:1.65}\n.searchbox{display:flex;gap:8px;align-items:stretch;padding:5px;background:var(--paper);border:1px solid #c0bcaf;border-radius:6px;box-shadow:0 3px 11px #4942330e;margin:19px 0 9px}\n.searchbox:focus-within{border-color:#9c825b;box-shadow:0 0 0 2px #a9916e27}\n.searchbox>i{align-self:center;color:#817b6e;font-size:17px;margin-left:7px}.searchbox input{width:100%;flex:1;background:transparent;border:0;outline:0;padding:7px 0;font-size:14px}.searchbox input:focus-visible{outline:none}.searchbox input::placeholder{color:#7c7d75}\n.searchbox button{min-height:37px;padding-inline:13px}.search-tools{display:flex;align-items:center;gap:11px;flex-wrap:wrap;color:#5b594f;font-size:12px}\n.hero.compact:before{display:none}.hero.compact{background:#eae7de}.hero.compact .hero-inner{max-width:none;padding:13px 18px}.hero.compact .searchbox{margin:0 0 6px}\n.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}\n.quick-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:18px;background:var(--paper);border:1px solid var(--rule);border-radius:7px}\n.quick-icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:7px;background:#efe7d7;color:#785a35;font-size:19px}\n.quick-copy h2,.reader-practice h2{font:600 20px/1.28 var(--serif)}\n.quick-copy p,.reader-practice p{font-size:12px;color:var(--muted);margin-top:4px}\n.quick-card .btn{justify-self:end}.quick-card .btn .icon{order:1}\n.workflow-link{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;margin-top:17px;padding:13px 15px;border:1px solid var(--rule);border-radius:6px;background:#eeebe2}\n.workflow-link span{display:flex;align-items:center;gap:7px;color:#53544e;font-size:13px}.workflow-link .icon{color:var(--copper);font-size:17px}\n.picker{position:relative;display:inline-flex;max-width:100%;min-width:0}\n.picker summary,details summary{cursor:pointer;list-style:none}\nsummary::-webkit-details-marker{display:none}\n.picker summary{display:flex;align-items:center;gap:8px;min-height:32px;padding:3px 9px;border:1px solid #c5c0b0;border-radius:4px;background:#f8f6ef;color:#4b4941}\n.picker summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:clamp(100px,25vw,255px)}\n.picker summary:after,details.drop>summary:after,.case summary:after,.source-box summary:after{content:\"\";width:6px;height:6px;flex:none;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:-3px 2px 0 auto}\n.picker[open] summary:after,details.drop[open]>summary:after,.case[open] summary:after,.source-box[open] summary:after{transform:rotate(225deg);margin-top:3px}\n.picker[open]{z-index:4}.picker-list{position:absolute;left:0;top:calc(100% + 4px);z-index:5;display:grid;min-width:min(185px,76vw);max-width:min(330px,83vw);width:max-content;max-height:250px;overflow:auto;padding:4px;border:1px solid #bfb8a7;background:var(--paper);border-radius:6px;box-shadow:0 8px 23px #302d2328}\n.picker-list button{text-align:left;border-radius:3px;padding:7px 10px;line-height:1.5;overflow-wrap:anywhere;font-size:13px;color:var(--ink)}\n.picker-list button:hover,.picker-list button:focus-visible{background:#eeebe2}.picker-list button[aria-pressed=true]{color:#694e2c;background:#ebe4d5;font-weight:620}\n.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.8fr);align-items:start;gap:18px;margin-top:20px}\n.panel{background:var(--paper);border:1px solid var(--rule);border-radius:7px;min-width:0;box-shadow:0 2px 5px #3a362b06}\n.section-head{min-height:53px;padding:13px 18px;border-bottom:1px solid var(--rule)}\n.section-head h2,.block-head h2,.panel h2,.dialog-head h2,.eval-tools h2{font:600 20px/1.35 var(--serif)}\n.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;margin-left:5px;border-radius:3px;color:#6d685b;background:#eeece3;font:11px/1.6 var(--mono);vertical-align:middle}\n.doc-row,.gap-row{display:flex;gap:11px;align-items:center;text-align:left;min-width:0;border-bottom:1px solid #e6e4db;padding:13px
