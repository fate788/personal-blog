\"P004\")\n        self.assertEqual(error.exception.status,403)\n        self.assertEqual(state,self.current())\n        self.act(\"advance\",minutes=9)\n        state = self.act(\"confirm\",record_id=\"R003\",person=\"P003\")\n        self.assertEqual(item(state,\"records\",\"R003\")[\"status\"],\"booked\")\n        self.assertEqual(item(state,\"slots\",\"S01\")[\"booked\"],2)\n\n    def test_deadline_passes_exactly_to_next(self):\n        self.act(\"cancel\",record_id=\"R001\")\n        state = self.act(\"advance\",minutes=10)\n        self.assertEqual(item(state,\"records\",\"R003\")[\"status\"],\"expired\")\n        self.assertEqual(item(state,\"records\",\"R004\")[\"deadline\"],\"2026-12-07T09:00:00+08:00\")\n        with self.assertRaises(engine.Problem):\n            self.act(\"confirm\",record_id=\"R003\",person=\"P003\")\n\n    def test_long_jump_processes_intermediate_deadlines(self):\n        self.act(\"cancel\",record_id=\"R001\")\n        state = self.act(\"advance\",minutes=35)\n        self.assertEqual(item(state,\"records\",\"R003\")[\"status\"],\"expired\")\n        self.assertEqual(item(state,\"records\",\"R004\")[\"status\"],\"expired\")\n        self.assertEqual([e[\"time\"][11:16] for e in state[\"events\"] if e[\"kind\"]==\"expire\"],[\"09:00\",\"08:50\"])\n        self.assertEqual(item(state,\"slots\",\"S01\")[\"available\"],1)\n\n    def test_slot_start_caps_hold_and_closes_queue_across_date(self):\n        self.act(\"advance\",minutes=1440)\n        self.act(\"advance\",minutes=15)\n        state = self.act(\"cancel\",record_id=\"R001\")\n        self.assertEqual(item(state,\"records\",\"R003\")[\"deadline\"],\"2026-12-08T09:00:00+08:00\")\n        state = self.act(\"advance\",minutes=180)\n        self.assertEqual(item(state,\"slots\",\"S01\")[\"status\"],\"closed\")\n        self.assertTrue(all(item(state,\"records\",r)[\"status\"]==\"expired\" for r in (\"R003\",\"R004\")))\n        self.assertTrue(all(e[\"time\"][11:16]==\"09:00\" for e in state[\"events\"] if e[\"kind\"]==\"expire\"))\n        with self.assertRaises(engine.Problem):\n            self.act(\"join\",slot_id=\"S01\",person=\"P999\")\n\n    def test_cancel_held_reoffers_immediately_and_allows_reentry(self):\n        self.act(\"cancel\",record_id=\"R001\")\n        self.act(\"cancel\",record_id=\"R003\")\n        state = self.act(\"join\",slot_id=\"S01\",person=\"P003\")\n        self.assertEqual(item(state,\"records\",\"R004\")[\"status\"],\"held\")\n        self.assertEqual(item(state,\"records\",\"R005\")[\"position\"],1)\n        with self.assertRaises(engine.Problem):\n            self.act(\"join\",slot_id=\"S01\",person=\"P003\")\n\n    def test_suspension_cancels_unconfirmed_and_preserves_confirmed(self):\n        self.act(\"join\",slot_id=\"S01\",person=\"P005\")\n        self.act(\"cancel\",record_id=\"R001\")\n        state=self.act(\"suspend\",slot_id=\"S01\")\n        self.assertEqual(item(state,\"records\",\"R002\")[\"status\"],\"pending\")\n        self.assertEqual(item(state,\"records\",\"R003\")[\"status\"],\"cancelled\")\n        self.assertEqual(item(state,\"records\",\"R004\")[\"status\"],\"cancelled\")\n        self.assertEqual(item(state,\"slots\",\"S01\")[\"available\"],0)\n        with self.assertRaises(engine.Problem):\n            self.act(\"join\",person=\"P888\",slot_id=\"S01\")\n\n    def test_batch_reschedule_keeps_record_ids_and_events(self):\n        self.act(\"suspend\",slot_id=\"S01\")\n        state = self.act(\"reschedule\",record_ids=[\"R001\",\"R002\"],slot_id=\"S02\")\n        self.assertEqual(item(state,\"slots\",\"S02\")[\"booked\"],2)\n        self.assertTrue(all(item(state,\"records\",r)[\"slot_id\"]==\"S02\" for r in (\"R001\",\"R002\")))\n        self.assertEqual(sum(e[\"kind\"]==\"reschedule\" for e in state[\"events\"]),2)\n        with self.assertRaises(engine.Problem):\n            self.act(\"reschedule\",record_ids=[\"R001\"],slot_id=\"S03\")\n        self.assertEqual(state,self.current())\n\n    def test_batch_refuses_insufficient_capacity_and_wrong_department(self):\n        before = self.act(\"suspend\",slot_id=\"S01\")\n        for target, rows in [(\"S03\",[\"R001\",\"R002\"]),(\"S04\",[\"R001\"]),(\"S02\",[\"R001\",\"R001\"])]:\n            with self.subTest(target=target), self.assertRaises(engine.Problem):\n                self.act(\"reschedule\",record_ids=rows,slot_id=target)\n            self.assertEqual(before,self.current())\n        state = self.act(\"reschedule\",record_ids=[\"R001\"],slot_id=\"S03\")\n        self.assertEqual(item(state,\"records\",\"R002\")[\"status\"],\"pending\")\n\n    def test_batch_rolls_back_earlier_row_on_late_conflict(self):\n        self.act(\"suspend\",slot_id=\"S01\")\n        # A separate, simultaneous source in the same department already seats the second person.\n        with closing(engine.connect(self.database)) as db, db:\n            db.execute(\"INSERT INTO slots SELECT desk,'S05',department,'四诊室',start,1,0 FROM slots \"\n                       \"WHERE desk=? AND id='S02'\",(self.key,))\n        before = self.act(\"join\",slot_id=\"S05\",person=\"P002\")\n        with self.assertRaisesRegex(engine.Problem,\"已有预约\"):\n            self.act(\"reschedule\",record_ids=[\"R001\",\"R002\"],slot_id=\"S02\")\n        self.assertEqual(before,self.current())\n\n    def test_duplicate_request_precedes_stale_revision_check(self):\n        args = dict(minutes=10,request_id=\"advance-request-1\",expected_revision=0)\n        state = self.act(\"advance\",**args)\n        self.assertEqual(state,self.act(\"advance\",**args))\n        with self.assertRaises(engine.Problem):\n            self.act(\"advance\",minutes=11,request_id=args[\"request_id\"])\n        with self.assertRaises(engine.Problem):\n            self.act(\"advance\",minutes=10,expected_revision=0)\n        self.assertEqual(state,self.current())\n\n    def test_concurrent_join_for_one_seat(self):\n        count = 12\n        barrier = Barrier(count)\n        def submit(n):\n            barrier.wait(timeout=15)\n            return self.act(\"join\",slot_id=\"S03\",person=f\"P{100+n}\")\n        with ThreadPoolExecutor(max_workers=count) as pool:\n            list(pool.map(submit,range(count)))\n        state = self.current()\n        rows = [row for row in state[\"records\"] if row[\"slot_id\"]==\"S03\"]\n        self.assertEqual([r[\"status\"] for r in rows],[\"booked\"]+[\"waiting\"]*(count-1))\n        self.assertEqual([r[\"position\"] for r in rows[1:]],list(range(1,count)))\n        self.assertEqual(item(state,\"slots\",\"S03\")[\"available\"],0)\n\n    def test_restart_isolation_and_reset(self):\n        other, untouched = engine.open_session(self.database)\n        before = self.act(\"cancel\",record_id=\"R001\")\n        engine.initialize(self.database)\n        self.assertEqual(before,self.current())\n        self.assertEqual(untouched,engine.get_state(self.database,other))\n        state = self.act(\"reset\")\n        self.assertEqual(state[\"revision\"],2)\n        self.assertEqual(state[\"records\"],self.initial[\"records\"])\n        self.assertEqual(state[\"events\"],self.initial[\"events\"])\n\n\nclass HttpTest(unittest.TestCase):\n    def setUp(self):\n        folder = TemporaryDirectory()\n        self.addCleanup(folder.cleanup)\n        app = make_server(0,Path(folder.name)/\"test.sqlite3\")\n        self.addCleanup(app.server_close)\n        worker = Thread(target=app.serve_forever,daemon=True)\n        worker.start()\n        self.addCleanup(worker.join)\n        self.addCleanup(app.shutdown)\n        self.base = \"http://127.0.0.1:\"+str(app.server_port)\n        self.client = build_opener(HTTPCookieProcessor(CookieJar()))\n\n    def request(self, path=\"/api/state\", payload=None, client=None, **headers):\n        data = None if payload is None else json.dumps(payload).encode()\n        req = Request(self.base+path,data=data,headers={\"Content-Type\":\"application/json\",**headers})\n        with (client or self.client).open(req,timeout=5) as response:\n            return json.load(response),response.headers\n\n    def test_two_clients_have_separate_desks(self):\n        initial,headers=self.request()\n        self.assertIn(\"HttpOnly\",headers[\"Set-Cookie\"])\n        self.assertIn(\"SameSite=Strict\",headers[\"Set-Cookie\"])\n        other=build_opener(HTTPCookieProcessor(CookieJar()))\n        other_initial,_=self.request(client=other)\n        self.assertEqual(initial,other_initial)\n        state,_=self.request(\"/api/action\",{\"action\":\"cancel\",\"record_id\":\"R001\"})\n        self.assertEqual(item(state,\"records\",\"R003\")[\"status\"],\"held\")\n        self.assertEqual(self.request(client=other)[0],initial)\n\n    def test_write_requires_workspace_json_and_same_origin(self):\n        with self.assertRaises(HTTPError) as error:\n            self.request(\"/api/action\",{\"action\":\"reset\"})\n        self.assertEqual(error.exception.code,401)\n        self.request()\n        for headers, code in [({\"Origin\":\"https://example.invalid\"},403),({\"Content-Type\":\"text/plain\"},415)]:\n            with self.assertRaises(HTTPError) as error:\n                self.request(\"/api/action\",{\"action\":\"reset\"},**headers)\n            self.assertEqual(error.exception.code,code)\n        self.assertEqual(self.request()[0][\"revision\"],0)\n\n    def test_invalid_body_and_identifiers_return_visible_errors(self):\n        self.request()\n        for body in [None,{},{\"action\":[]},{\"action\":\"join\",\"slot_id\":[],\"person\":\"P005\"},\n                     {\"action\":\"advance\",\"minutes\":True},{\"action\":\"confirm\",\"record_id\":[],\"person\":7},\n                     {\"action\":\"join\",\"slot_id\":\"S01\",\"person\":\"张三\"}]:\n            with self.subTest(body=body):\n                req=Request(self.base+\"/api/action\",data=json.dumps(body).encode(),headers={\"Content-Type\":\"application/json\"})\n                with self.assertRaises(HTTPError) as error:\n                    self.client.open(req,timeout=5)\n                self.assertEqual(error.exception.code,400)\n                self.assertTrue(json.load(error.exception)[\"error\"])\n\n\nif __name__==\"__main__\":\n    unittest.main()\n","group":"验收测试"}],"defaultFile":"static/app.js"}</script>
