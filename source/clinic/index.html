<script id="source-data" type="application/json">{"files":[{"path":"README.md","text":"# 门诊候补与改约工作台\n\n预约窗口可以在同一个工作台查号、登记预约、办理候补和停诊改约。日程显示所选日期的号源分布、各班次的余号和名单。“窗口待办”汇总各日期的待办记录，点击一项即可查看对应状态的预约。接到咨询时，也可以按就诊编号或预约单号追查办理经过。项目使用合成排班与虚构编号，每个浏览器会话有独立的数据。\n\n![门诊调度工作台](docs/preview.webp)\n\n## 本地运行\n\n需要 Python 3.10 或更新版本，只使用 Python 标准库。在项目根目录执行以下命令。\n\n```sh\npython server.py\n```\n\n打开[本机工作台](http://127.0.0.1:8796/)。Windows 也可双击 `start-clinic.cmd`。服务默认只监听本机回环地址。可通过 `--port` 和 `--db` 指定端口和 SQLite 文件。\n\n## 体验预约窗口的三种操作\n\n1. **跨日登记。** 从 12 月 8 日的日程打开快速登记，选择 12 月 9 日 09:00 综合门诊 S03。用虚构就诊编号 P105 登记后，在预约查询中输入 P105，即可核对班次、预约状态和办理记录。\n2. **退号与递补。** 在周日历选 12 月 8 日，打开 09:00 综合门诊 S01，取消预约 R001。队首 P003 获得 10 分钟留位。把演示时钟推进 10 分钟，留位转给 P004。使用 P004 确认，查询预约单 R004 可核对递补经过。\n3. **停诊改约。** 重置演示，将 S01 停诊。在改约页勾选 R001、R002，核对原班次和目标班次，选择同科 10:00 的 S02 并确认。两笔预约一起转入该班次，事件记录保留每笔改约的起点和去向。\n\n初始演示时钟固定为北京时间 2026 年 12 月 7 日 08:40，时钟由操作者推进。刷新页面可以继续刚才的演练。事件和留位提醒显示在工作台内。系统没有连接医院挂号系统或短信服务。\n\n## 实现与验证\n\n- `engine.py` 管理号源、候补队列、场次停开和事件记录。SQLite 写事务把余量判断和状态变化一起提交，已确认和已留位都会占用容量。\n- `server.py` 提供静态界面、`GET /api/state` 与 `POST /api/action`。操作可携带版本号与请求标识，对过期页面返回冲突，重复请求可取回当前状态。\n- `static/` 提供周日历、当日号源分布、快速登记、预约查询、停诊改约与事件记录。中文字体内嵌于 `static/style.css`，许可见 `static/fonts/OFL.txt`。\n- 执行 `python -m unittest discover -v` 复跑测试。GitHub Actions 在提交和拉取请求时运行测试并检查前端脚本语法。\n\n15 项测试覆盖候补先后、截止时刻、跨日、停诊、事务回滚、重试和工作区隔离。在单席并发测试中，12 个请求同时登记，结果是 1 条已预约、11 条候补。在批次测试中，后一条预约遇到时段冲突时，先处理的预约和对应事件也一起回滚。\n\n作者是[李子衡（@fate788）](https://github.com/fate788)。[个人博客源码与其他作品](https://github.com/fate788/personal-blog)\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 门诊候补与改约工作台 v0.3 源码包\n\n原始发布归档为 `门诊候补与改约工作台-v0.3.zip`。压缩包保留其中 9 份文本文件的原始路径与字节，本文件为导出说明。\n\n在项目根目录运行 `python server.py` 启动本机服务，默认端口 8796。中文字体内嵌于 `static/style.css`，许可和 README 实屏图随源码分发。运行 `python -m unittest discover -v` 验证预约调度规则。\n","group":"项目说明"},{"path":"engine.py","text":"\"\"\"Transactional scheduling for isolated, synthetic outpatient desks.\"\"\"\nfrom contextlib import closing\nfrom datetime import datetime, timedelta, timezone\nfrom pathlib import Path\nimport hashlib\nimport json\nimport re\nimport secrets\nimport sqlite3\n\n\nZONE = timezone(timedelta(hours=8))\nSTART = int(datetime(2026, 12, 7, 8, 40, tzinfo=ZONE).timestamp())\nHOLD_SECONDS = 600\nACTIVE = (\"booked\", \"waiting\", \"held\", \"pending\")\nPERSON = re.compile(r\"P[0-9]{3,5}\\Z\")\nRECORD = re.compile(r\"R[0-9]{3,9}\\Z\")\nREQUEST_ID = re.compile(r\"[a-zA-Z0-9._:-]{8,100}\\Z\")\nSCHEMA = \"\"\"\nCREATE TABLE IF NOT EXISTS desks (\n    key TEXT PRIMARY KEY, now INTEGER NOT NULL, revision INTEGER NOT NULL DEFAULT 0\n);\nCREATE TABLE IF NOT EXISTS slots (\n    desk TEXT NOT NULL REFERENCES desks(key), id TEXT NOT NULL, department TEXT NOT NULL,\n    label TEXT NOT NULL, start INTEGER NOT NULL, capacity INTEGER NOT NULL CHECK(capacity>0),\n    suspended INTEGER NOT NULL DEFAULT 0, PRIMARY KEY(desk,id)\n);\nCREATE TABLE IF NOT EXISTS records (\n    desk TEXT NOT NULL, seq INTEGER NOT NULL, slot TEXT NOT NULL, person TEXT NOT NULL,\n    status TEXT NOT NULL CHECK(status IN ('booked','waiting','held','pending','cancelled','expired')),\n    deadline INTEGER, PRIMARY KEY(desk,seq), FOREIGN KEY(desk,slot) REFERENCES slots(desk,id),\n    CHECK ((status='held') = (deadline IS NOT NULL))\n);\nCREATE UNIQUE INDEX IF NOT EXISTS one_active ON records(desk,slot,person)\n  WHERE status IN ('booked','held','waiting','pending');\nCREATE INDEX IF NOT EXISTS queue_order ON records(desk,slot,status,seq);\nCREATE TABLE IF NOT EXISTS events (\n    desk TEXT NOT NULL REFERENCES desks(key), seq INTEGER NOT NULL, time INTEGER NOT NULL,\n    kind TEXT NOT NULL, text TEXT NOT NULL, record INTEGER, slot TEXT, PRIMARY KEY(desk,seq)\n);\nCREATE TABLE IF NOT EXISTS requests (\n    desk TEXT NOT NULL REFERENCES desks(key), key TEXT NOT NULL, digest TEXT NOT NULL,\n    PRIMARY KEY(desk,key)\n);\n\"\"\"\n\n\nclass Problem(Exception):\n    def __init__(self, message, status=409):\n        super().__init__(message)\n        self.status = status\n\n\ndef iso(timestamp):\n    return datetime.fromtimestamp(timestamp, ZONE).isoformat()\n\n\ndef rid(seq):\n    return f\"R{seq:03d}\"\n\n\ndef connect(database):\n    db = sqlite3.connect(database, isolation_level=None, timeout=12)\n    db.row_factory = sqlite3.Row\n    db.execute(\"PRAGMA foreign_keys=ON\")\n    return db\n\n\ndef initialize(database):\n    Path(database).parent.mkdir(parents=True, exist_ok=True)\n    with closing(connect(database)) as db:\n        db.execute(\"PRAGMA journal_mode=WAL\")\n        db.executescript(SCHEMA)\n\n\nclass Desk:\n    \"\"\"All reads and writes in a request share a transaction and a workspace key.\"\"\"\n    def __init__(self, db, key):\n        self.db = db\n        self.key = key\n        row = self.sql(\"SELECT now,revision FROM desks WHERE key=?\").fetchone()\n        if row is None:\n            raise Problem(\"演示工作区不存在，请刷新页面。\", 401)\n        self.now = row[\"now\"]\n        self.revision = row[\"revision\"]\n\n    def sql(self, query, *args):\n        return self.db.execute(query, (self.key, *args))\n\n    def slot(self, value):\n        if not isinstance(value, str):\n            raise Problem(\"请选择有效号源。\", 400)\n        slot = self.sql(\"SELECT * FROM slots WHERE desk=? AND id=?\", value).fetchone()\n        if slot is None:\n            raise Problem(\"找不到这个号源。\", 404)\n        return slot\n\n    def record(self, value):\n        if not isinstance(value, str) or not RECORD.fullmatch(value):\n            raise Problem(\"请选择有效预约编号。\", 400)\n        row = self.sql(\"SELECT * FROM records WHERE desk=? AND seq=?\", int(value[1:])).fetchone()\n        if row is None:\n            raise Problem(\"找不到这条预约。\", 404)\n        return row\n\n    def event(self, kind, text, slot=None, record=None):\n        n = self.sql(\"SELECT COALESCE(MAX(seq),0)+1 FROM events WHERE desk=?\").fetchone()[0]\n        self.sql(\"INSERT INTO events VALUES(?,?,?,?,?,?,?)\", n, self.now, kind, text, record, slot)\n\n    def free(self, slot):\n        used = self.sql(\"SELECT count(*) FROM records WHERE desk=? AND slot=? \"\n                        \"AND status IN ('booked','held')\", slot[\"id\"]).fetchone()[0]\n        return slot[\"capacity\"] - used\n\n    def change(self, seq, status, deadline=None):\n        self.sql(\"UPDATE records SET status=?2,deadline=?3 WHERE desk=?1 AND seq=?4\",\n                 status, deadline, seq)\n\n    def check_time_conflict(self, person, slot, exclude=0):\n        conflict = self.sql(\n            \"SELECT r.seq FROM records r JOIN slots s ON s.desk=r.desk AND s.id=r.slot \"\n            \"WHERE r.desk=? AND r.person=? AND s.start=? AND r.seq!=? \"\n            \"AND (r.status IN ('booked','held','waiting') OR (r.status='pending' AND r.slot=?))\",\n            person, slot[\"start\"], exclude, slot[\"id\"]).fetchone()\n        if conflict:\n            raise Problem(\"该编号在这个时段已有预约或候补记录。\")\n\n\ndef seed(d):\n    # The clock is deliberately virtual. Samples retain the same meaning whenever opened.\n    for identifier, department, label, day, hour, capacity in [\n        (\"S01\",\"综合门诊\",\"一诊室\",8,9,2), (\"S02\",\"综合门诊\",\"二诊室\",8,10,2),\n        (\"S03\",\"综合门诊\",\"一诊室\",9,9,1), (\"S04\",\"健康咨询\",\"三诊室\",8,11,2),\n    ]:\n        start = int(datetime(2026, 12, day, hour, tzinfo=ZONE).timestamp())\n        d.sql(\"INSERT INTO slots(desk,id,department,label,start,capacity) VALUES(?,?,?,?,?,?)\",\n              identifier, department, label, start, capacity)\n    for seq, status in enumerate((\"booked\",\"booked\",\"waiting\",\"waiting\"), 1):\n        person = f\"P{seq:03d}\"\n        d.sql(\"INSERT INTO records VALUES(?,?,?,?,?,NULL)\", seq, \"S01\", person, status)\n        action = \"已预约\" if status == \"booked\" else \"已进入候补队列\"\n        d.event(\"booking\" if status==\"booked\" else \"join\", f\"{person} {action}。\", \"S01\", seq)\n\n\ndef open_session(database):\n    key = secrets.token_urlsafe(32)\n    with closing(connect(database)) as db, db:\n        db.execute(\"BEGIN IMMEDIATE\")\n        db.execute(\"INSERT INTO desks(key,now) VALUES(?,?)\", (key, START))\n        desk = Desk(db, key)\n        seed(desk)\n        return key, snapshot(desk)\n\n\ndef snapshot(d):\n    slots = []\n    for slot in d.sql(\"SELECT * FROM slots WHERE desk=? ORDER BY start,id\"):\n        counts = {r[0]:r[1] for r in d.sql(\n            \"SELECT status,count(*) FROM records WHERE desk=? AND slot=? GROUP BY status\",slot[\"id\"])}\n        booked, held = counts.get(\"booked\",0), counts.get(\"held\",0)\n        status = \"suspended\" if slot[\"suspended\"] else \"closed\" if slot[\"start\"]\u003c=d.now else \"open\"\n        slots.append(dict(id=slot[\"id\"],department=slot[\"department\"],label=slot[\"label\"],\n                          start=iso(slot[\"start\"]),capacity=slot[\"capacity\"],status=status,booked=booked,\n                          held=held,available=slot[\"capacity\"]-booked-held if status==\"open\" else 0))\n    records = []\n    positions = {}\n    for row in d.sql(\"SELECT * FROM records WHERE desk=? ORDER BY seq\"):\n        position = None\n        if row[\"status\"] == \"waiting\":\n            position = positions.get(row[\"slot\"],0)+1\n            positions[row[\"slot\"]] = position\n        records.append(dict(id=rid(row[\"seq\"]),person=row[\"person\"],slot_id=row[\"slot\"],status=row[\"status\"],\n                            deadline=iso(row[\"deadline\"]) if row[\"deadline\"] is not None else None,\n                            position=position))\n    events = [dict(id=r[\"seq\"],time=iso(r[\"time\"]),kind=r[\"kind\"],text=r[\"text\"],\n                   record_id=rid(r[\"record\"]) if r[\"record\"] else None,slot_id=r[\"slot\"])\n              for r in d.sql(\"SELECT * FROM events WHERE desk=? ORDER BY seq DESC\")]\n    return dict(now=iso(d.now),revision=d.revision,hold_minutes=HOLD_SECONDS//60,\n                slots=slots,records=records,events=events)\n\n\ndef get_state(database, key):\n    with closing(connect(database)) as db, db:\n        db.execute(\"BEGIN\")\n        return snapshot(Desk(db,key))\n\n\ndef open_slot(slot, now):\n    if slot[\"suspended\"] or slot[\"start\"]\u003c=now:\n        raise Problem(\"这个号源已停诊或已开始，无法接收预约。\")\n\n\ndef offer_waiters(d, slot):\n    if slot[\"suspended\"] or slot[\"start\"]\u003c=d.now:\n        return\n    free = d.free(slot)\n    rows = d.sql(\"SELECT seq,person FROM records WHERE desk=? AND slot=? AND status='waiting' \"\n                 \"ORDER BY seq LIMIT ?\",slot[\"id\"],free).fetchall()\n    deadline = min(slot[\"start\"], d.now + HOLD_SECONDS)\n    for row in rows:\n        d.change(row[\"seq\"], \"held\", deadline)\n        d.event(\"offer\",f\"{row['person']} 按候补顺序获得留位，截止 {iso(deadline)[11:16]}。\",\n                slot[\"id\"],row[\"seq\"])\n\n\ndef person_id(value):\n    if not isinstance(value,str) or not PERSON.fullmatch(value):\n        raise Problem(\"请输入 P 加 3 至 5 位数字的虚构编号，例如 P005。\",400)\n    return value\n\n\ndef join(d, data):\n    slot = d.slot(data.get(\"slot_id\"))\n    open_slot(slot,d.now)\n    person = person_id(data.get(\"person\"))\n    d.check_time_conflict(person,slot)\n    seq = d.sql(\"SELECT COALESCE(MAX(seq),0)+1 FROM records WHERE desk=?\").fetchone()[0]\n    status = \"booked\" if d.free(slot)>0 else \"waiting\"\n    d.sql(\"INSERT INTO records VALUES(?,?,?,?,?,NULL)\",seq,slot[\"id\"],person,status)\n    action = \"已预约可用名额\" if status == \"booked\" else \"已按登记顺序候补\"\n    d.event(\"booking\" if status==\"booked\" else \"join\",f\"{person} {action}。\",slot[\"id\"],seq)\n\n\ndef cancel(d,data):\n    row = d.record(data.get(\"record_id\"))\n    slot = d.slot(row[\"slot\"])\n    if row[\"status\"] not in ACTIVE or (slot[\"start\"]\u003c=d.now and row[\"status\"]!=\"pending\"):\n        raise Problem(\"当前状态无法取消。\")\n    d.change(row[\"seq\"],\"cancelled\")\n    d.event(\"cancel\",f\"{row['person']} 的记录已取消。\",row[\"slot\"],row[\"seq\"])\n    offer_waiters(d,slot)\n\n\ndef confirm(d,data):\n    row = d.record(data.get(\"record_id\"))\n    if person_id(data.get(\"person\")) != row[\"person\"]:\n        raise Problem(\"虚构编号与该留位记录不匹配。\",403)\n    if row[\"status\"]!=\"held\" or row[\"deadline\"]\u003c=d.now:\n        raise Problem(\"只有截止前的有效留位可以确认。\")\n    d.change(row[\"seq\"],\"booked\")\n    d.event(\"confirm\",f\"{row['person']} 已确认候补名额。\",row[\"slot\"],row[\"seq\"])\n\n\ndef advance_clock(d, data):\n    minutes = data.get(\"minutes\")\n    if type(minutes) is not int or not 1\u003c=minutes\u003c=1440:\n        raise Problem(\"每次可推进 1 至 1440 个整分钟。\",400)\n    target = d.now + minutes * 60\n    # Process deadlines chronologically. A large jump can expire several successive offers.\n    while True:\n        next_time = d.sql(\n            \"SELECT MIN(at) FROM (SELECT deadline AS at FROM records WHERE desk=?1 AND status='held' \"\n            \"UNION ALL SELECT s.start FROM records r JOIN slots s ON s.desk=r.desk AND s.id=r.slot \"\n            \"WHERE r.desk=?1 AND r.status='waiting')\").fetchone()[0]\n        if next_time is None or next_time > target:\n            break\n        d.now = next_time\n        expired = d.sql(\"SELECT seq,slot,person FROM records WHERE desk=? AND deadline=? ORDER BY seq\",\n                        next_time).fetchall()\n        for row in expired:\n            d.change(row[\"seq\"],\"expired\")\n            d.event(\"expire\",f\"{row['person']} 的留位已到期。\",row[\"slot\"],row[\"seq\"])\n        closed = d.sql(\"SELECT r.seq,r.person,r.slot FROM records r JOIN slots s ON s.desk=r.desk AND s.id=r.slot \"\n                       \"WHERE r.desk=? AND r.status='waiting' AND s.start=? ORDER BY r.seq\",next_time).fetchall()\n        for row in closed:\n            d.change(row[\"seq\"],\"expired\")\n            d.event(\"expire\",f\"{row['person']} 的候补在时段开始时结束。\",row[\"slot\"],row[\"seq\"])\n        for identifier in sorted({r[\"slot\"] for r in expired}):\n            offer_waiters(d,d.slot(identifier))\n    d.now = target\n    d.sql(\"UPDATE desks SET now=?2 WHERE key=?1\",target)\n    d.event(\"advance\",f\"演示时间已推进 {minutes} 分钟。\")\n\n\ndef suspend(d,data):\n    slot = d.slot(data.get(\"slot_id\"))\n    open_slot(slot,d.now)\n    d.sql(\"UPDATE slots SET suspended=1 WHERE desk=? AND id=?\",slot[\"id\"])\n    d.event(\"suspend\",f\"{slot['id']} 已停诊。\",slot[\"id\"])\n    rows = d.sql(\"SELECT seq,person,status FROM records WHERE desk=? AND slot=? \"\n                 \"AND status IN ('booked','held','waiting') ORDER BY seq\",slot[\"id\"]).fetchall()\n    for row in rows:\n        booked = row[\"status\"]==\"booked\"\n        d.change(row[\"seq\"],\"pending\" if booked else \"cancelled\")\n        text = \"原预约已转为待改约\" if booked else \"未确认的候补已因停诊撤销\"\n        d.event(\"pending\" if booked else \"cancel\",f\"{row['person']} {text}。\",slot[\"id\"],row[\"seq\"])\n\n\ndef reschedule(d,data):\n    target = d.slot(data.get(\"slot_id\"))\n    open_slot(target,d.now)\n    ids = data.get(\"record_ids\")\n    if not isinstance(ids,list) or not 1\u003c=len(ids)\u003c=100 or not all(isinstance(i,str) for i in ids):\n        raise Problem(\"请至少选择一条待改约记录，每批不超过 100 条。\",400)\n    rows = [d.record(i) for i in ids]\n    if len({r[\"seq\"] for r in rows})!=len(rows):\n        raise Problem(\"同一条预约在批次中只能选择一次。\",400)\n    if d.free(target)\u003clen(rows):\n        raise Problem(\"目标号源余量不足，整批预约均保留原状。\")\n    for row in rows:\n        origin = d.slot(row[\"slot\"])\n        if row[\"status\"]!=\"pending\" or origin[\"department\"]!=target[\"department\"]:\n            raise Problem(\"只能将待改约记录转入同科室的开放号源。\")\n        d.check_time_conflict(row[\"person\"],target,row[\"seq\"])\n        d.sql(\"UPDATE records SET slot=?2,status='booked',deadline=NULL WHERE desk=?1 AND seq=?3\",\n              target[\"id\"],row[\"seq\"])\n        d.event(\"reschedule\",f\"{row['person']} 已从 {origin['id']} 改约至 {target['id']}。\",\n                target[\"id\"],row[\"seq\"])\n\n\ndef reset(d, data):\n    for table in (\"events\",\"records\",\"slots\"):\n        d.sql(\"DELETE FROM \"+table+\" WHERE desk=?\")\n    d.now = START\n    d.sql(\"UPDATE desks SET now=?2 WHERE key=?1\", START)\n    seed(d)\n\n\nACTIONS = {\"join\":join,\"cancel\":cancel,\"confirm\":confirm,\"advance\":advance_clock,\n           \"suspend\":suspend,\"reschedule\":reschedule,\"reset\":reset}\n\n\ndef apply(database, key, data):\n    if not isinstance(data,dict) or not isinstance(data.get(\"action\"),str) or data[\"action\"] not in ACTIONS:\n        raise Problem(\"未识别的操作。\",400)\n    request_id = data.get(\"request_id\")\n    if request_id is not None and (not isinstance(request_id,str) or not REQUEST_ID.fullmatch(request_id)):\n        raise Problem(\"请求标识格式错误。\",400)\n    digest = hashlib.sha256(json.dumps(data,sort_keys=True,separators=(\",\",\":\")).encode()).hexdigest()\n    with closing(connect(database)) as db, db:\n        db.execute(\"BEGIN IMMEDIATE\")\n        d = Desk(db,key)\n        if request_id:\n            prior = d.sql(\"SELECT digest FROM requests WHERE desk=? AND key=?\",request_id).fetchone()\n            if prior:\n                if prior[\"digest\"]!=digest:\n                    raise Problem(\"同一请求标识不能用于不同操作。\")\n                return snapshot(d)\n        if \"expected_revision\" in data:\n            version = data[\"expected_revision\"]\n            if type(version) is not int or version!=d.revision:\n                raise Problem(\"这个工作区已变更，请刷新后重试。\")\n        ACTIONS[data[\"action\"]](d,data)\n        d.revision += 1\n        d.sql(\"UPDATE desks SET revision=?2 WHERE key=?1\",d.revision)\n        if request_id:\n            d.sql(\"INSERT INTO requests VALUES(?,?,?)\",request_id,digest)\n        return snapshot(d)\n","group":"后端"},{"path":"server.py","text":"\"\"\"Run the local scheduling desk using Python's standard library.\"\"\"\nimport argparse\nfrom http.cookies import SimpleCookie, CookieError\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nimport json\nfrom pathlib import Path\nimport sqlite3\nfrom urllib.parse import urlsplit\n\nimport engine\n\n\nROOT = Path(__file__).resolve().parent\nCOOKIE = \"clinic_demo_sid\"\nSTATIC = {\"/\": (\"index.html\",\"text/html; charset=utf-8\"),\n          \"/index.html\": (\"index.html\",\"text/html; charset=utf-8\"),\n          \"/app.js\": (\"app.js\",\"text/javascript; charset=utf-8\"),\n          \"/style.css\": (\"style.css\",\"text/css; charset=utf-8\")}\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def respond(self, status, content, mime, cookie=None):\n        self.send_response(status)\n        self.send_header(\"Content-Type\", mime)\n        self.send_header(\"Content-Length\",str(len(content)))\n        self.send_header(\"X-Content-Type-Options\",\"nosniff\")\n        self.send_header(\"Cache-Control\",\"no-store\")\n        self.send_header(\"Referrer-Policy\",\"no-referrer\")\n        if cookie:\n            self.send_header(\"Set-Cookie\",f\"{COOKIE}={cookie}; Path=/api; HttpOnly; SameSite=Strict; Max-Age=2592000\")\n        self.end_headers()\n        self.wfile.write(content)\n\n    def json_response(self, status, payload, cookie=None):\n        self.respond(status,json.dumps(payload,ensure_ascii=False).encode(\"utf-8\"),\n                     \"application/json; charset=utf-8\",cookie)\n\n    def session(self):\n        cookie = SimpleCookie()\n        try:\n            cookie.load(self.headers.get(\"Cookie\",\"\"))\n        except CookieError:\n            return None\n        sid = cookie.get(COOKIE)\n        return sid.value if sid else None\n\n    def validate_origin(self):\n        port = self.server.server_port\n        allowed = {f\"127.0.0.1:{port}\", f\"localhost:{port}\"}\n        if port==80:\n            allowed.update((\"127.0.0.1\",\"localhost\"))\n        host = self.headers.get(\"Host\",\"\").lower()\n        if host not in allowed:\n            raise engine.Problem(\"请通过本机地址打开工作台。\",403)\n        if self.headers.get(\"Origin\") not in (None, \"http://\"+host):\n            raise engine.Problem(\"当前来源无法访问此工作区。\",403)\n        if self.headers.get(\"Sec-Fetch-Site\")==\"cross-site\":\n            raise engine.Problem(\"请直接打开工作台。\",403)\n\n    def state(self):\n        sid = self.session()\n        if sid:\n            try:\n                return self.json_response(200,engine.get_state(self.server.database,sid))\n            except engine.Problem as error:\n                if error.status!=401:\n                    raise\n        sid, state = engine.open_session(self.server.database)\n        self.json_response(200,state,sid)\n\n    def read_action(self):\n        sid = self.session()\n        if not sid:\n            raise engine.Problem(\"请先打开工作台以初始化工作区。\",401)\n        if self.headers.get_content_type()!=\"application/json\":\n            raise engine.Problem(\"请以 JSON 提交操作。\",415)\n        try:\n            size = int(self.headers.get(\"Content-Length\",\"-1\"))\n        except ValueError:\n            size = -1\n        if not 0\u003csize\u003c=16384:\n            raise engine.Problem(\"请求体为空或过大。\",413)\n        try:\n            data = json.loads(self.rfile.read(size).decode(\"utf-8\"))\n        except (UnicodeError, ValueError, RecursionError):\n            raise engine.Problem(\"JSON 格式错误。\",400)\n        self.json_response(200,engine.apply(self.server.database,sid,data))\n\n    def dispatch(self, method):\n        try:\n            route = urlsplit(self.path).path\n            if route.startswith(\"/api/\"):\n                self.validate_origin()\n            if method==\"GET\" and route==\"/api/state\":\n                self.state()\n            elif method==\"POST\" and route==\"/api/action\":\n                self.read_action()\n            elif method==\"GET\" and route in STATIC:\n                filename, mime = STATIC[route]\n                self.respond(200,(ROOT/\"static\"/filename).read_bytes(),mime)\n            else:\n                raise engine.Problem(\"未找到此接口或页面。\",404)\n        except engine.Problem as error:\n            self.json_response(error.status,{\"error\":str(error)})\n        except sqlite3.OperationalError:\n            self.json_response(503,{\"error\":\"数据库暂时不可用，请稍后重试。\"})\n\n    def do_GET(self):\n        self.dispatch(\"GET\")\n\n    def do_POST(self):\n        self.dispatch(\"POST\")\n\n\ndef make_server(port, database):\n    engine.initialize(database)\n    httpd = ThreadingHTTPServer((\"127.0.0.1\",port), Handler)\n    httpd.database = database\n    return httpd\n\n\nif __name__==\"__main__\":\n    parser = argparse.ArgumentParser(description=\"门诊候补与改约工作台\")\n    parser.add_argument(\"--port\",type=int,default=8796)\n    parser.add_argument(\"--db\",type=Path,default=ROOT/\"data\"/\"clinic.sqlite3\")\n    args = parser.parse_args()\n    with make_server(args.port,args.db) as server:\n        print(f\"http://127.0.0.1:{server.server_port}/\",flush=True)\n        try:\n            server.serve_forever()\n        except KeyboardInterrupt:\n            pass\n","group":"后端"},{"path":"start-clinic.cmd","text":"@echo off\nsetlocal\ncd /d \"%~dp0\"\nwhere py >nul 2>&1\nif errorlevel 1 goto usepython\npy -3 server.py\ngoto finished\n:usepython\npython server.py\n:finished\nif errorlevel 1 pause\n","group":"配置与启动"},{"path":"static/app.js","text":"\"use strict\";\n\nconst byId = id => document.getElementById(id);\nconst workspace = byId(\"workspace\");\nconst dialog = byId(\"dialog\");\nconst titles = {\n  schedule: [\"预约日程\", \"按日期查看班次、余号与候补。\"],\n  records: [\"预约查询\", \"按就诊编号、预约单或班次查找，核对当前状态和办理经过。\"],\n  reschedule: [\"停诊改约\", \"将受影响的预约转至有余号的同科班次。\"],\n  events: [\"事件记录\", \"按日期查看预约、候补及改约的办理经过。\"]\n};\nlet state;\nlet selectedSlot = \"\";\nlet selectedDay = \"\";\nlet department = \"\";\nlet pendingDept = \"\";\nlet targetId = \"\";\nlet eventQuery = \"\";\nlet recordQuery = \"\";\nlet recordStatus = \"\";\nlet selection = new Set();\nlet submitting = false;\nlet submitDialog = null;\nlet restoreFocus = null;\nlet retryAction = null;\nlet dialogRevision;\nconst cjkDate = new Intl.DateTimeFormat(\"zh-CN\", {timeZone:\"Asia/Shanghai\", month:\"2-digit\", day:\"2-digit\"});\nconst cjkTime = new Intl.DateTimeFormat(\"zh-CN\", {timeZone:\"Asia/Shanghai\", hour:\"2-digit\", minute:\"2-digit\", hour12:false});\nconst shanghaiDay = new Intl.DateTimeFormat(\"sv-SE\", {timeZone:\"Asia/Shanghai\", year:\"numeric\", month:\"2-digit\", day:\"2-digit\"});\nconst fullDay = new Intl.DateTimeFormat(\"zh-CN\", {timeZone:\"UTC\", month:\"long\", day:\"numeric\", weekday:\"long\"});\nconst monthYear = new Intl.DateTimeFormat(\"zh-CN\", {timeZone:\"UTC\", year:\"numeric\", month:\"long\"});\nconst weekDays = [\"周一\",\"周二\",\"周三\",\"周四\",\"周五\",\"周六\",\"周日\"];\n\nfunction dayKey(value) { return shanghaiDay.format(new Date(value)); }\nfunction dateValue(key) { return new Date(key+\"T00:00:00Z\"); }\nfunction shiftDay(key, days) {\n  const date = dateValue(key);\n  date.setUTCDate(date.getUTCDate()+days);\n  return date.toISOString().slice(0,10);\n}\nfunction readRequestedRoute() {\n  const route=getRoute();\n  if(route.view===\"records\") {\n    recordStatus=route.id===\"status\" && Object.hasOwn(recordLabels,route.detail)?route.detail:\"\";\n    recordQuery=route.query.get(\"q\") || \"\";\n  }\n  if(route.view===\"events\") eventQuery=route.id || route.query.get(\"q\") || \"\";\n  if(route.view===\"reschedule\" && route.id) {\n    const record=state?.records.find(r=>r.id===route.id && r.status===\"pending\");\n    if(record) {\n      pendingDept=slotFor(record).department;\n      selection=new Set([record.id]);\n      targetId=\"\";\n    }\n  }\n  if (route.view!==\"schedule\") return;\n  const slot = state?.slots.find(s=>s.id===route.id);\n  if (slot) {\n    selectedSlot=slot.id;\n    selectedDay=dayKey(slot.start);\n    if (department && department!==slot.department) department=\"\";\n  } else if(route.day) {\n    selectedDay=route.day;\n    selectedSlot=\"\";\n  }\n}\n\nfunction esc(value) {\n  return String(value ?? \"\").replace(/[&\u003c>\"']/g, c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"})[c]);\n}\nfunction moment(value) {\n  const instant = new Date(value);\n  return cjkDate.format(instant) + \" \" + cjkTime.format(instant);\n}\nfunction slotName(slot) { return slot.department + \" · \" + slot.label; }\nfunction slotText(slot) { return slotName(slot) + \" · \" + moment(slot.start) + \" · \" + slot.id; }\nfunction option(value, label, selected) {\n  return '\u003coption value=\"'+esc(value)+'\"'+(value===selected?' selected':'')+'>'+esc(label)+'\u003c/option>';\n}\nfunction button(action, label, kind=\"small-button\", attrs=\"\") {\n  return '\u003cbutton type=\"button\" class=\"'+kind+'\" data-action=\"'+action+'\" '+attrs+'>'+esc(label)+'\u003c/button>';\n}\nfunction field(name, label, attributes=\"\") {\n  return '\u003clabel class=\"dialog-field\">'+label+'\u003cinput name=\"'+name+'\" type=\"text\" '+attributes+' required>\u003c/label>';\n}\nfunction getRoute() {\n  const [path,search] = location.hash.slice(1).split(\"?\");\n  const [view,id,day] = path.split(\"/\");\n  const validDay=id===\"date\" && /^\\d{4}-\\d{2}-\\d{2}$/.test(day || \"\") && !isNaN(dateValue(day)) && dateValue(day).toISOString().slice(0,10)===day;\n  return {view:Object.hasOwn(titles,view)?view:\"schedule\", id, detail:day, day:validDay?day:\"\",query:new URLSearchParams(search)};\n}\nfunction note(text, failed=false) {\n  const item = byId(\"notice\");\n  item.textContent = text;\n  item.classList.toggle(\"failed\", failed);\n  item.hidden = !text;\n}\nfunction getSlots() { return state.slots.filter(s => !department || s.department===department); }\nfunction getPending() { return state.records.filter(r => r.status===\"pending\"); }\nfunction slotFor(record) { return state.slots.find(s => s.id===record.slot_id); }\nfunction currentSlot() { return state.slots.find(s => s.id===selectedSlot); }\nfunction nearestDay(slots, from) {\n  const dates = [...new Set(slots.map(s=>dayKey(s.start)))].sort();\n  return dates.find(date=>date>=from) || dates.at(-1) || \"\";\n}\nfunction calendar(slots) {\n  const monday = shiftDay(selectedDay,-((dateValue(selectedDay).getUTCDay()+6)%7));\n  const sunday = shiftDay(monday,6);\n  const today = dayKey(state.now);\n  const span = monthYear.format(dateValue(monday)) + (monday.slice(0,7)===sunday.slice(0,7)?\"\":\" – \"+monthYear.format(dateValue(sunday)));\n  const days = weekDays.map((weekday, i)=>{\n    const date = shiftDay(monday,i);\n    const count = slots.filter(s=>dayKey(s.start)===date).length;\n    const status = count ? count+\" 班次\" : \"无排班\";\n    return '\u003cbutton type=\"button\" class=\"calendar-day'+(count?' has-slots':'')+(date===today?' is-today':'')+'\" tabindex=\"'+(date===selectedDay?'0':'-1')+'\" data-date=\"'+date+\n      '\" aria-pressed=\"'+(date===selectedDay)+'\" aria-label=\"'+fullDay.format(dateValue(date))+'，'+status+'\"'+(date===today?' aria-current=\"date\"':'')+'>'+\n      '\u003cspan class=\"day-week\">'+weekday+'\u003c/span>\u003cstrong class=\"day-number\">'+Number(date.slice(8))+'\u003c/strong>'+\n      '\u003cspan class=\"day-status\">'+status+'\u003c/span>\u003c/button>';\n  });\n  return '\u003csection class=\"calendar-strip\" aria-label=\"周排班日历\">\u003cheader class=\"calendar-head\">\u003ch2 class=\"calendar-title\">'+span+'\u003c/h2>'+\n    '\u003cdiv class=\"calendar-tools\">\u003cbutton type=\"button\" data-calendar=\"prev\" aria-label=\"上一周\">‹\u003c/button>\u003cbutton type=\"button\" data-calendar=\"today\" aria-label=\"返回演示当天\">今天\u003c/button>\u003cbutton type=\"button\" data-calendar=\"next\" aria-label=\"下一周\">›\u003c/button>\u003c/div>'+\n    '\u003c/header>\u003cdiv class=\"calendar-days\">'+days.join(\"\")+'\u003c/div>\u003c/section>';\n}\nfunction slotRow(s) {\n  const waiting = state.records.filter(r=>r.slot_id===s.id && r.status===\"waiting\").length;\n  const usage = s.status===\"suspended\" ? \"已停诊\" : s.status===\"closed\" ? \"已开诊\" : s.available ? \"余号 \"+s.available : \"已约满\";\n  const style = s.status!==\"open\" ? \"closed\" : s.available ? \"available\" : \"full\";\n  return '\u003cli>\u003cbutton type=\"button\" class=\"slot-button\" data-slot=\"'+s.id+'\" aria-pressed=\"'+(s.id===selectedSlot)+'\">'+\n    '\u003ctime class=\"slot-time\" datetime=\"'+esc(s.start)+'\">'+cjkTime.format(new Date(s.start))+'\u003c/time>'+\n    '\u003cspan class=\"slot-info\">\u003cstrong class=\"slot-name\">'+esc(s.department)+'\u003c/strong>\u003cspan class=\"slot-meta\">'+esc(s.label)+' · '+s.id+'\u003c/span>\u003c/span>'+\n    '\u003cspan class=\"slot-capacity\">\u003cspan class=\"slot-usage '+style+'\">'+usage+'\u003c/span>'+\n    '\u003csmall class=\"slot-queue\">'+(waiting?'候补 '+waiting+' 人':'共 '+s.capacity+' 个号源')+'\u003c/small>\u003c/span>\u003cspan class=\"chevron\" aria-hidden=\"true\">›\u003c/span>\u003c/button>\u003c/li>';\n}\nfunction rosterRow(record) {\n  const id=esc(record.id), held=record.status===\"held\", waiting=record.status===\"waiting\";\n  const flag=held?'\u003cspan class=\"tag held\">待确认\u003c/span>':waiting?'\u003cspan class=\"tag\">第 '+esc(record.position)+' 位\u003c/span>':\"\";\n  const detail=held?'预约单 '+id+' · 保留至 '+moment(record.deadline):'预约单 '+id;\n  let controls=held?button(\"confirm\",\"确认保留\",\"small-button primary\",'data-record=\"'+id+'\" aria-label=\"确认保留 '+id+'\"'):\"\";\n  if(slotFor(record).status===\"open\")controls+=button(\"cancel\",\"取消\",\"text-button\",'data-record=\"'+id+'\" aria-label=\"取消 '+id+'\"');\n  return '\u003cli class=\"record\">\u003cdiv class=\"record-person\">\u003cstrong class=\"ticket-id\">'+esc(record.person)+'\u003c/strong>\u003csmall class=\"record-meta\">'+esc(detail)+'\u003c/small>\u003c/div>'+\n    '\u003cdiv class=\"record-side\">'+flag+controls+'\u003c/div>\u003c/li>';\n}\nfunction roster(s) {\n  if(!s) return '\u003csection class=\"panel roster roster-empty\">\u003cheader class=\"panel-head\">\u003ch2>班 ;\n    return '\u003ca href=\"#records/status/'+status+'\">\u003cspan>'+label+'\u003c/span>\u003cb>'+count+'\u003c/b>\u003ci aria-hidden=\"true\">›\u003c/i>\u003c/a>';\n  });\n  return '\u003csection class=\"panel queue-panel\">\u003cheader>\u003ch2>窗口待办\u003c/h2>\u003cspan>全部日期\u003c/span>\u003c/header>'+\n    '\u003cdiv class=\"queue-links\">'+links.join(\"\")+'\u003c/div>\u003c/section>';\n}\nfunction schedule() {\n  const deps=[...new Set(state.slots.map(s=>s.department))];\n  const slots=getSlots();\n  if(!selectedDay) {\n    const preferred=slots.find(s=>s.status===\"open\") || slots[0];\n    selectedDay=preferred?dayKey(preferred.start):dayKey(state.now);\n  }\n  const daySlots=slots.filter(s=>dayKey(s.start)===selectedDay).sort((a,b)=>a.start.localeCompare(b.start));\n  if(!daySlots.some(s=>s.id===selectedSlot)) selectedSlot=daySlots[0]?.id || \"\";\n  const jump=nearestDay(slots,selectedDay);\n  const listing=daySlots.length ? '\u003cul class=\"slots\">'+daySlots.map(slotRow).join(\"\")+'\u003c/ul>' :\n    '\u003cdiv class=\"general-empty\">\u003cstrong>当天没有排班\u003c/strong>\u003cp>'+esc(department || '所有科室')+'在此日期没有班次。\u003c/p>'+\n    (jump?'\u003cbutton type=\"button\" class=\"button\" data-calendar=\"available\">查看 '+Number(jump.slice(5,7))+' 月 '+Number(jump.slice(8))+' 日的排班\u003c/button>':'')+'\u003c/div>';\n  const overview=renderDayOverview(daySlots,selectedDay);\n  return '\u003cdiv class=\"schedule-top\">'+overview+calendar(slots)+'\u003c/div>\u003cdiv class=\"board schedule-board\">\u003cdiv class=\"agenda-column\">\u003csection class=\"panel agenda-panel\">\u003cheader class=\"panel-head\">\u003cdiv class=\"agenda-heading\">\u003ch2>出诊时段\u003c/h2>\u003cspan class=\"agenda-count\">'+daySlots.length+' 个班次\u003c/span>\u003c/div>'+\n    '\u003clabel class=\"panel-filter\">\u003cspan class=\"sr-only\">筛选科室\u003c/span>\u003cselect id=\"department\">'+option(\"\",\"全部科室\",department)+deps.map(d=>option(d,d,department)).join(\"\")+'\u003c/select>\u003c/label>\u003c/header>'+\n    listing+'\u003c/section>'+queueLinks()+'\u003c/div>'+roster(currentSlot())+'\u003c/div>';\n}\nfunction reschedule() {\n  const all=getPending();\n  if(!all.length) {\n    selection.clear(); targetId=\"\";\n    return '\u003csection class=\"panel transfer-empty\">\u003cheader class=\"panel-head\">\u003ch2>待改约名单\u003c/h2>\u003cspan class=\"count\">0\u003c/span>\u003c/header>\u003cdiv class=\"general-empty\">\u003cstrong>当前没有待改约预约\u003c/strong>\u003cp>停诊班次的已确认预约会出现在这里。\u003c/p>\u003ca class=\"button\" href=\"#schedule\">返回预约日程 →\u003c/a>\u003c/div>\u003c/section>';\n  }\n  const depts=[...new Set(all.map(r=>slotFor(r).department))];\n  if(!depts.includes(pendingDept)) pendingDept=depts[0];\n  const records=all.filter(r=>slotFor(r).department===pendingDept);\n  selection=new Set([...selection].filter(id=>records.some(r=>r.id===id)));\n  const targets=state.slots.filter(s=>s.department===pendingDept && s.status===\"open\" && s.available>=Math.max(selection.size,1));\n  if(!targets.some(s=>s.id===targetId)) targetId=targets[0]?.id || \"\";\n  const groupMap=new Map();\n  for(const record of records) {\n    if(!groupMap.has(record.slot_id)) groupMap.set(record.slot_id,[]);\n    groupMap.get(record.slot_id).push(record);\n  }\n  const groups=[...groupMap.values()].map(group=>{\n    const slot=slotFor(group[0]);\n    return '\u003csection class=\"transfer-group\">\u003ch3>'+esc(slotText(slot))+'\u003c/h3>\u003cul class=\"records\">'+group.map(r=>\n      '\u003cli class=\"record\">\u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" data-pending=\"'+esc(r.id)+'\" '+(selection.has(r.id)?'checked':'')+'>\u003cspan>\u003cstrong class=\"ticket-id\">'+esc(r.person)+'\u003c/strong>'+\n      '\u003csmall class=\"record-meta\">预约单 '+esc(r.id)+'\u003c/small>\u003c/span>\u003c/label>'+button(\"cancel\",\"取消\",\"text-button\",'data-record=\"'+esc(r.id)+'\" aria-label=\"取消 '+esc(r.id)+'\"')+'\u003c/li>').join(\"\")+'\u003c/ul>\u003c/section>';\n  }).join(\"\");\n  const origins=[...new Set(records.filter(r=>selection.has(r.id)).map(r=>r.slot_id))];\n  const firstOrigin=state.slots.find(s=>s.id===origins[0]);\n  const target=targets.find(s=>s.id===targetId);\n  const sourceLabel=origins.length>1?origins.length+\" 个班次\":firstOrigin?.id || \"待选择\";\n  const sourceTime=origins.length===1?'\u003csmall>'+esc(moment(firstOrigin.start))+'\u003c/small>':\"\";\n  const summary='\u003cdiv class=\"transfer-summary\">\u003cdiv class=\"transfer-from\">\u003csmall>原班次\u003c/small>\u003cstrong>'+esc(sourceLabel)+'\u003c/strong>'+sourceTime+'\u003c/div>\u003cspan class=\"transfer-arrow\" aria-hidden=\"true\">→\u003c/span>'+\n    '\u003cdiv class=\"transfer-to\">\u003csmall>接收班次\u003c/small>\u003cstrong>'+esc(target?.id || \"暂无\")+'\u003c/strong>'+(target?'\u003csmall>'+esc(moment(target.start))+'\u003c/small>':'')+'\u003c/div>\u003c/div>';\n  return '\u003cdiv class=\"board transfer-board\">\u003csection class=\"panel\">\u003cheader class=\"panel-head\">\u003ch2>待改约名单\u003c/h2>\u003clabel class=\"panel-filter\">\u003cspan class=\"sr-only\">待改约科室\u003c/span>\u003cselect id=\"pending-dept\">'+depts.map(d=>option(d,d,pendingDept)).join(\"\")+'\u003c/select>\u003c/label>\u003c/header>'+\n    '\u003cdiv class=\"reschedule-body\">\u003cdiv class=\"section-tools\">\u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"select-all\" '+(selection.size===records.length?'checked':'')+'>全选本组\u003c/label>\u003cspan>'+records.length+' 笔待处理\u003c/span>\u003c/div>'+groups+'\u003c/div>\u003c/section>'+\n    '\u003csection class=\"panel transfer-target\">\u003cheader class=\"panel-head\">\u003ch2>重新分配号源\u003c/h2>\u003cspan class=\"tag\">已选 '+selection.size+' 笔\u003c/span>\u003c/header>'+\n    '\u003cdiv class=\"target-body\">'+summary+'\u003clabel for=\"target-slot\">同科目标班次\u003cselect id=\"target-slot\" '+(targets.length?'':'disabled')+'>'+\n    (targets.length?targets.map(s=>option(s.id,slotText(s)+' · 余号 '+s.available,targetId)).join(\"\"):'\u003coption>暂无余号充足的班次\u003c/option>')+\n    '\u003c/select>\u003c/label>\u003cp class=\"detail-note\">'+(!selection.size?'请勾选需要改约的预约。':target?'提交后此班次剩余 '+(target.available-selection.size)+' 个号源。':'可减少勾选数量，分批改至其他班次。')+'\u003c/p>'+\n    button(\"reschedule\",\"办理改约\",\"button primary\",selection.size && targetId?\"\":\"disabled\")+'\u003c/div>\u003c/section>\u003c/div>';\n}\nconst eventKinds={booking:\"预约成功\",join:\"候补登记\",offer:\"候补留位\",cancel:\"取消记录\",confirm:\"确认预约\",expire:\"留位到期\",advance:\"推进时钟\",suspend:\"班次停诊\",pending:\"转待改约\",reschedule:\"改约完成\"};\nconst recordLabels={booked:\"已预约\",waiting:\"候补中\",held:\"限时留位\",pending:\"待改约\",cancelled:\"已取消\",expired:\"已过期\"};\n\nfunction matchingRecords() {\n  const query=recordQuery.trim().toLowerCase();\n  return state.records.filter(record=>{\n    if(recordStatus && record.status!==recordStatus) return false;\n    const slot=slotFor(record);\n    return [record.person,record.id,slot.id,slot.department,slot.label].some(value=>value.toLowerCase().includes(query));\n  }).reverse();\n}\nfunction recordRows(records) {\n  if(!records.length) {\n    const filtered=recordQuery || recordStatus;\n    return '\u003cdiv class=\"general-empty\">\u003cstrong>'+(filtered?'没有匹配的预约':'暂无预约记录')+'\u003c/strong>'+\n      (filtered?'\u003cp>尝试其他编号或清除筛选。\u003c/p>'+button(\"clear-records\",\"清除筛选\",\"button\"):'')+'\u003c/div>';\n  }\n  const headings='\u003cdiv class=\"lookup-columns\" aria-hidden=\"true\">\u003cspan>就诊编号 / 预约单\u003c/span>\u003cspan>科室 / 出诊时段\u003c/span>\u003cspan>预约状态\u003c/span>\u003cspan>办理记录\u003c/span>\u003c/div>';\n  return headings+'\u003cul class=\"lookup-list\">'+records.map(record=>{\n    const slot=slotFor(record);\n    const detail=record.status===\"waiting\"?'第 '+record.position+' 位':record.status===\"held\"?'保留至 '+moment(record.deadline):'';\n    return '\u003cli class=\"lookup-row\" data-record-id=\"'+esc(record.id)+'\">\u003cdiv class=\"lookup-ident\">\u003cstrong>'+esc(record.person)+'\u003c/strong>\u003csmall>预约单 '+esc(record.id)+'\u003c/small>\u003c/div>'+\n      '\u003cdiv class=\"lookup-slot\">\u003cstrong>'+esc(slot.department)+' · '+esc(slot.label)+'\u003c/strong>\u003csmall>'+esc(moment(slot.start))+' · '+esc(slot.id)+'\u003c/small>\u003c/div>'+\n      '\u003cdiv class=\"lookup-status\">\u003cspan class=\"lookup-state\" data-status=\"'+record.status+'\">'+recordLabels[record.status]+'\u003c/span>'+(detail?'\u003csmall>'+esc(detail)+'\u003c/small>':'')+'\u003c/div>'+\n      '\u003cdiv class=\"lookup-actions\">'+button(\"record-detail\",\"查看详情\",\"small-button\",'data-record=\"'+esc(record.id)+'\" aria-label=\"查看预约 '+esc(record.id)+'\"')+'\u003c/div>\u003c/li>';\n  }).join(\"\")+'\u003c/ul>';\n}\nfunction recordsView() {\n  const records=matchingRecords();\n  return '\u003csection class=\"panel lookup-panel\">\u003cheader class=\"panel-head\">\u003ch2>预约台账\u003c/h2>\u003cspan id=\"record-count\" class=\"count\" role=\"status\">'+records.length+' 笔记录\u003c/span>\u003c/header>'+\n    '\u003cdiv class=\"lookup-tools\">\u003clabel class=\"lookup-search\">\u003cspan class=\"sr-only\">搜索预约\u003c/span>\u003cinput id=\"record-search\" type=\"search\" placeholder=\"就诊编号、预约单或班次\" value=\"'+esc(recordQuery)+'\">\u003c/label>'+\n    '\u003clabel class=\"lookup-filter\">\u003cspan class=\"sr-only\">预约状态\u003c/span>\u003cselect id=\"record-status\">'+option(\"\",\"全部状态\",recordStatus)+\n    Object.entries(recordLabels).map(([key,label])=>option(key,label,recordStatus)).join(\"\")+'\u003c/select>\u003c/label>\u003c/div>'+\n    '\u003cdiv id=\"record-results\">'+recordRows(records)+'\u003c/div>\u003c/section>';\n}\nfunction updateRecordResults() {\n  const route=recordStatus?'/status/'+recordStatus:'';\n  const search=recordQuery?'?'+new URLSearchParams({q:recordQuery}):'';\n  history.replaceState(null,\"\",\"#records\"+route+search);\n  const records=matchingRecords();\n  byId(\"record-count\").textContent=records.length+' 笔记录';\n  byId(\"record-results\").innerHTML=recordRows(records);\n}\nfunction openRecordDetail(record) {\n  const slot=slotFor(record);\n  const facts=[[\"就诊编号\",record.person],[\"预约状态\",recordLabels[record.status]],[\"出诊班次\",slotName(slot)+\" · \"+slot.id],[\"预约时间\",moment(slot.start)]];\n  if(record.status===\"held\") facts.push([\"保留至\",moment(record.deadline)]);\n  if(record.status===\"waiting\") facts.push([\"候补顺序\",\"第 \"+record.position+\" 位\"]);\n  const events=state.events.filter(event=>event.record_id===record.id);\n  const historyList=events.map(event=>'\u003cli>\u003ctime datetime=\"'+esc(event.time)+'\">'+esc(moment(event.time))+'\u003c/time>\u003cdiv>\u003cstrong>'+esc(eventKinds[event.kind] || \"办理记录\")+'\u003c/strong>\u003cp>'+esc(event.text)+'\u003c/p>\u003c/div>\u003c/li>').join(\"\");\n  const destination=record.status===\"pending\"?'#reschedule/'+record.id:'#schedule/'+slot.id;\n  openDialog(\"预约 \"+record.id,\n    '\u003cdl class=\"record-facts\">'+facts.map(([key,value])=>'\u003cdiv>\u003cdt>'+key+'\u003c/dt>\u003cdd>'+esc(value)+'\u003c/dd>\u003c/div>').join(\"\")+'\u003c/dl>'+\n    '\u003ch3 class=\"history-heading\">办理经过\u003c/h3>'+(historyList?'\u003col class=\"record-history\">'+historyList+'\u003c/ol>':'\u003cp>暂无办理记录。\u003c/p>')+\n    '\u003cdiv class=\"record-links\">\u003ca class=\"button\" href=\"'+esc(destination)+'\">'+(record.status===\"pending\"?'办理改约':'查看班次')+\n    '\u003c/a>\u003ca class=\"button\" href=\"#events/'+esc(record.id)+'\">查看事件记录\u003c/a>\u003c/div>');\n}\nfunction eventItems() {\n  const q=eventQuery.trim().toLocaleLowerCase();\n  const requestedRecord=getRoute().id;\n  const days=new Map();\n  for(const e of state.events) {\n    if(requestedRecord && e.record_id!==requestedRecord)continue;\n    if(![e.text,e.slot_id,e.record_id,eventKinds[e.kind],moment(e.time)].join(\" \").toLocaleLowerCase().includes(q))continue;\n    const key=dayKey(e.time);\n    if(!days.has(key))days.set(key,[]);\n    days.get(key).push(e);\n  }\n  if(!days.size)return '\u003cp class=\"general-empty\">'+(q?'没有匹配的记录。':'当前没有操作记录。')+'\u003c/p>';\n  return [...days.entries()].map(([date,events])=>'\u003csection class=\"event-group\">\u003ch3>'+fullDay.format(dateValue(date))+'\u003c/h3>\u003col class=\"event-list\">'+events.map(e=>\n    '\u003cli data-kind=\"'+esc(e.kind)+'\">\u003ctime datetime=\"'+esc(e.time)+'\">'+cjkTime.format(new Date(e.time))+'\u003c/time>\u003cdiv class=\"event-copy\">\u003cstrong class=\"event-kind\">'+esc(eventKinds[e.kind] || '调度操作')+'\u003c/strong>'+\n    '\u003cp>'+esc(e.text)+'\u003c/p>\u003csmall class=\"event-key\">'+[e.record_id,e.slot_id].filter(Boolean).map(esc).join(\" · \")+'\u003c/small>\u003c/div>\u003c/li>').join(\"\")+'\u003c/ol>\u003c/section>').join(\"\");\n}\nfunction eventsView() {\n  return '\u003csection class=\"panel events-panel\">\u003cheader class=\"panel-head\">\u003ch2>操作时间线\u003c/h2>\u003clabel class=\"event-filter\">\u003cspan class=\"sr-only\">查找事件\u003c/span>\u003cinput id=\"event-filter\" type=\"search\" placeholder=\"搜索编号或事件\" value=\"'+esc(eventQuery)+'\">\u003c/label>\u003c/header>\u003cdiv class=\"event-body\" id=\"event-list\">'+eventItems()+'\u003c/div>\u003c/section>';\n}\n\nfunction selectCalendarDay(day, focusSelector) {\n  if(!day)return;\n  if(selectedDay!==day)selectedSlot=\"\";\n  selectedDay=day;\n  history.replaceState(null,\"\",\"#schedule/date/\"+day);\n  note(\"\");\n  render();\n  const focusTarget=workspace.querySelector(focusSelector) || workspace.querySelector('.calendar-day[aria-pressed=\"true\"]');\n  focusTarget?.focus({preventScroll:true});\n}\n\nfunction render() {\n  const route=getRoute();\n  document.querySelectorAll(\"[data-nav]\").forEach(a=>a.dataset.nav===route.view?a.setAttribute(\"aria-current\",\"page\"):a.removeAttribute(\"aria-current\"));\n  byId(\"page-title\").textContent=titles[route.view][0];\n  byId(\"page-description\").textContent=titles[route.view][1];\n  document.title=titles[route.view][0]+\" · 门诊候补与改约工作台\";\n  if(!state) return;\n  byId(\"clock\").textContent=moment(state.now);\n  document.querySelectorAll('[data-action=\"advance\"], [data-action=\"reset\"], [data-action=\"quick-book\"]').forEach(b=>b.disabled=submitting);\n  const pages={schedule, records:recordsView,events:eventsView,reschedule};\n  const content=pages[route.view]();\n  workspace.innerHTML=content;\n  workspace.setAttribute(\"aria-busy\",\"false\");\n  const all=byId(\"select-all\");\n  if(all) all.indeterminate=selection.size>0 && !all.checked;\n}\nasync function load() {\n  try {\n    const response=await fetch(\"/api/state\",{cache:\"no-store\"});\n    if(!response.ok) throw Error();\n    state=await response.json();\n    readRequestedRoute();\n    render();\n  } catch {\n    workspace.setAttribute(\"aria-busy\",\"false\");\n    if(!state) workspace.innerHTML='\u003cp class=\"initial\">无法读取当前工作区。 '+button(\"retry\",\"重新载入\")+'\u003c/p>';\n    else note(\"未能刷新工作区，请检查本机服务后重试。\",true);\n  }\n}\nfunction openDialog(title, body, actionTitle=\"\", callback=null) {\n  restoreFocus=document.activeElement;\n  dialogRevision=state?.revision;\n  byId(\"dialog-title\").textContent=title;\n  byId(\"dialog-body\").innerHTML=body;\n  byId(\"dialog-error\").hidden=true;\n  byId(\"dialog-actions\").innerHTML=button(\"close\",callback?\"返回\":\"知道了\",\"button\")+(callback?'\u003cbutton type=\"submit\" class=\"button primary\">'+esc(actionTitle)+'\u003c/button>':\"\");\n  submitDialog=callback;\n  dialog.showModal();\n  (dialog.querySelector(\"input\") || dialog.querySelector(\"select\") || dialog.querySelector('[data-action=\"close\"]')).focus();\n}\nconst personAttributes='placeholder=\"例如 P005\" pattern=\"P[0-9]{3,5}\" maxlength=\"6\" title=\"大写 P 加 3 至 5 位数字\" autocomplete=\"off\"';\nfunction quickBookingFields() {\n  const open=state.slots.filter(s=>s.status===\"open\");\n  const depts=[...new Set(open.map(s=>s.department))];\n  return '\u003cdiv class=\"booking-filters\">\u003clabel class=\"dialog-field\">科室\u003cselect id=\"quick-dept\">'+option(\"\",\"全部科室\",\"\")+depts.map(d=>option(d,d,\"\")).join(\"\")+'\u003c/select>\u003c/label>'+\n    '\u003clabel class=\"dialog-field\">出诊日期\u003cselect id=\"quick-day\">\u003c/select>\u003c/label>\u003c/div>'+\n    '\u003clabel class=\"quick-free check-label\">\u003cinput id=\"quick-free\" type=\"checkbox\">仅看有余号的班次\u003c/label>'+\n    '\u003clabel class=\"dialog-field\">选择班次\u003cselect id=\"quick-slot\" name=\"slot\" required>\u003c/select>\u003c/label>'+\n    '\u003cp id=\"quick-summary\" class=\"booking-summary\" aria-live=\"polite\">\u003c/p>'+field(\"person\",\"虚构就诊编号\",personAttributes);\n}\nfunction updateQuickBooking() {\n  const dept=byId(\"quick-dept\").value;\n  const date=byId(\"quick-day\");\n  const select=byId(\"quick-slot\");\n  const open=state.slots.filter(s=>s.status===\"open\" && (!dept || s.department===dept)).sort((a,b)=>a.start.localeCompare(b.start));\n  const days=[...new Set(open.map(s=>dayKey(s.start)))];\n  const chosenDay=days.includes(date.value)?date.value:\"\";\n  date.innerHTML=option(\"\",\"全部日期\",chosenDay)+days.map(d=>option(d,fullDay.format(dateValue(d)),chosenDay)).join(\"\");\n  const slots=open.filter(s=>(!chosenDay || dayKey(s.start)===chosenDay) && (!byId(\"quick-free\").checked || s.available>0));\n  const chosen=slots.find(s=>s.id===select.value) || slots.find(s=>s.available>0) || slots[0];\n  select.innerHTML=chosen?slots.map(s=>option(s.id,s.id+' · '+moment(s.start)+' · '+slotName(s)+(s.available?' · 余号 '+s.available:' · 可候补'),chosen.id)).join(\"\"):'\u003coption value=\"\">无可选班次\u003c/option>';\n  select.disabled=!chosen;\n  const submit=dialog.querySelector('button[type=\"submit\"]');\n  submit.disabled=!chosen;\n  submit.textContent=chosen && !chosen.available?\"登记候补\":\"确认预约\";\n  const summary=byId(\"quick-summary\");\n  summary.dataset.mode=chosen?(chosen.available?\"booking\":\"waiting\"):\"empty\";\n  if(!chosen) {\n    summary.textContent=\"当前条件下没有可登记的班次。\";\n    return;\n  }\n  const queued=state.records.filter(r=>r.slot_id===chosen.id && r.status===\"waiting\").length;\n  summary.textContent=chosen.available?'剩余 '+chosen.available+' 个号源，提交后即确认预约。':'该班次已约满，当前 '+queued+' 人候补。提交后按登记顺序排队。';\n}\nfunction openQuickBooking() {\n  if(!state.slots.some(s=>s.status===\"open\")) {\n    openDialog(\"预约登记\",'\u003cp>当前没有开放登记的班次。\u003c/p>');\n    return;\n  }\n  openDialog(\"预约登记\",quickBookingFields(),\"确认预约\",data=>{\n    const slot=state.slots.find(s=>s.id===data.get(\"slot\") && s.status===\"open\");\n    if(!slot)return;\n    const person=String(data.get(\"person\")).trim();\n    const success=updated=>{\n      const record=updated.records.filter(r=>r.person===person && r.slot_id===slot.id).at(-1);\n      return record?record.person+' · '+record.id+' '+recordLabels[record.status]+'，已定位到班次 '+slot.id+'。':\"登记成功，已打开对应班次。\";\n    };\n    mutate({action:\"join\",slot_id:slot.id,person},success,\"schedule/\"+slot.id);\n  });\n  updateQuickBooking();\n  byId(\"quick-dept\").focus();\n}\nfunction closeDialog() {\n  if(!submitting) dialog.close();\n}\ndialog.addEventListener(\"close\",()=>{\n  submitDialog=null;\n  if(restoreFocus?.isConnected) restoreFocus.focus({preventScroll:true});\n  else {\n    const action=restoreFocus?.dataset.action;\n    const record=restoreFocus?.dataset.record;\n    const selector=action?'[data-action=\"'+CSS.escape(action)+'\"]'+(record?'[data-record=\"'+CSS.escape(record)+'\"]':\"\"):\"\";\n    const target=(selector && workspace.querySelector(selector)) || byId(\"roster-top\") || byId(\"page-title\");\n    target.focus({preventScroll:true});\n  }\n});\ndialog.addEventListener(\"cancel\",event=>{if(submitting)event.preventDefault();});\nasync function mutate(payload, success, nextView) {\n  if(submitting)return;\n  const key=JSON.stringify(payload)+\":\"+dialogRevision;\n  if(!retryAction || retryAction.key!==key) {\n    retryAction={key,id:crypto.randomUUID ? crypto.randomUUID() : [...crypto.getRandomValues(new Uint32Array(4))].map(n=>n.toString(16)).join(\"-\")};\n  }\n  submitting=true;\n  const controls=[...dialog.querySelectorAll(\"button,input,select\")].filter(el=>!el.disabled);\n  controls.forEach(el=>el.disabled=true);\n  const error=byId(\"dialog-error\");\n  error.hidden=true;\n  let completed=false;\n  try {\n    const response=await fetch(\"/api/action\",{method:\"POST\",headers:{\"Content-Type\":\"application/json\"},body:JSON.stringify({...payload,request_id:retryAction.id,expected_revision:dialogRevision})});\n    const updated=await response.json();\n    if(!response.ok) {\n      retryAction=null;\n      if(response.status===409) {\n        await load();\n        if(dialogRevision!==state?.revision) {\n          submitting=false;dialog.close();\n          note((updated.error||\"记录已发生变化\")+\"。已刷新工作区，请核对后重新操作。\",true);\n          return;\n        }\n      }\n      error.textContent=updated.error || \"操作未完成，请核对输入后重试。\";\n      error.hidden=false;\n      return;\n    }\n    state=updated;\n    retryAction=null;\n    completed=true;\n    if(payload.action===\"reset\") {\n      department=\"\";pendingDept=\"\";selectedSlot=\"\";selectedDay=\"\";targetId=\"\";selection.clear();eventQuery=\"\";recordQuery=\"\";recordStatus=\"\";\n    }\n    if(payload.action===\"reschedule\")selection.clear();\n    if(nextView) {\n      const hash=\"#\"+nextView;\n      if(nextView.startsWith(\"schedule/\") && location.hash!==hash) history.pushState(null,\"\",hash);\n      else history.replaceState(null,\"\",hash);\n      readRequestedRoute();\n      window.scrollTo(0,0);\n    }\n    render();\n    note(typeof success===\"function\"?success(updated):success);\n    if(nextView?.startsWith(\"schedule/\")) restoreFocus=byId(\"roster-top\");\n  } catch {\n    error.textContent=\"没有收到服务结果。恢复连接后再次提交，可核对本次操作。\";\n    error.hidden=false;\n  } finally {\n    submitting=false;\n    controls.forEach(b=>b.disabled=false);\n    if(completed)dialog.close();\n    document.querySelectorAll('[data-action=\"advance\"], [data-action=\"reset\"], [data-action=\"quick-book\"]').forEach(b=>b.disabled=!state);\n  }\n}\nfunction actions(action, btn) {\n  if(action===\"close\") {closeDialog();return;}\n  if(action===\"retry\") {load();return;}\n  if(action===\"guide\") {\n    openDialog(\"操作指引\",'\u003col class=\"steps\">\u003cli>\u003cstrong>登记与查询\u003c/strong>点“快速登记”，按科室或日期选号并输入虚构就诊编号。到“预约查询”用编号找回预约单、查看状态和办理经过。\u003c/li>\u003cli>\u003cstrong>释放号源\u003c/strong>在初始满员的 S01 班次取消一笔已确认预约，队首候补将获得限时保留。\u003c/li>\u003cli>\u003cstrong>处理限时保留\u003c/strong>输入对应的虚构就诊编号确认，也可以推进演示时钟，查看保留到期后下一位如何递补。\u003c/li>\u003cli>\u003cstrong>办理停诊改约\u003c/strong>选择仍有已确认预约的班次停诊，勾选待改约记录，再选择有余号的同科班次。一笔或多笔均可提交。\u003c/li>\u003c/ol>');return;\n  }\n  if(!state || submitting)return;\n  const slot=currentSlot();\n  const record=state.records.find(r=>r.id===btn.dataset.record);\n  if(action===\"quick-book\") {\n    openQuickBooking();\n  } else if(action===\"record-detail\" && record) {\n    openRecordDetail(record);\n  } else if(action===\"clear-records\") {\n    recordQuery=\"\";recordStatus=\"\";\n    byId(\"record-search\").value=\"\";byId(\"record-status\").value=\"\";\n    updateRecordResults();byId(\"record-search\").focus();\n  } else if(action===\"advance\") {\n    openDialog(\"推进演示时钟\",'\u003cp>时间向前推进后，系统将处理到期保留及后续递补。当前时间为 '+esc(moment(state.now))+'。\u003c/p>\u003clabel class=\"dialog-field\">推进时长\u003cselect name=\"minutes\">\u003coption value=\"1\">1 分钟\u003c/option>\u003coption value=\"10\" selected>10 分钟\u003c/option>\u003coption value=\"30\">30 分钟\u003c/option>\u003coption value=\"1440\">24 小时\u003c/option>\u003c/select>\u003c/label>',\"推进时间\",data=>mutate({action,minutes:Number(data.get(\"minutes\"))},\"演示时钟已推进，最新号源状态已更新。\"));\n  } else if(action===\"reset\") {\n    openDialog(\"重置当前演示\",'\u003cp>本工作区将恢复为初始排班，清除本次的预约变更和操作记录。\u003c/p>',\"确认重置\",()=>mutate({action},\"已恢复初始排班。\",\"schedule\"));\n  } else if(action===\"join\" && slot) {\n    const title=slot.available?\"登记预约\":\"登记候补\";\n    openDialog(title,'\u003cp>'+esc(slotText(slot))+'\u003c/p>'+field(\"person\",\"虚构就诊编号\",personAttributes),title,data=>mutate({action,slot_id:slot.id,person:String(data.get(\"person\")).trim()},\"已完成登记，请在本班次名单中核对结果。\"));\n  } else if(action===\"confirm\" && record) {\n    openDialog(\"确认限时保留\",'\u003cp>记录 '+esc(record.id)+' 的保留截止于 '+esc(moment(record.deadline))+'。请核对名单并输入这笔记录对应的就诊编号。\u003c/p>'+field(\"person\",\"确认人的虚构就诊编号\",'placeholder=\"P 加 3 至 5 位数字\" pattern=\"P[0-9]{3,5}\" maxlength=\"6\" autocomplete=\"off\"'),\"确认预约\",data=>mutate({action,record_id:record.id,person:String(data.get(\"person\")).trim()},\"已确认保留号源。\"));\n  } else if(action===\"cancel\" && record) {\n    openDialog(\"取消这条记录\",'\u003cp>'+esc(record.person)+' 的记录 '+esc(record.id)+' 将被取消。已占用或保留的号源会释放给可递补的候补记录。\u003c/p>',\"确认取消\",()=>mutate({action,record_id:record.id},\"已取消 \"+record.id+\"，班次名单已更新。\"));\n  } else if(action===\"suspend\" && slot) {\n    openDialog(\"确认班次停诊\",'\u003cp>'+esc(slotText(slot))+' 将停止登记。'+slot.booked+' 笔已确认预约转入待改约，该班次的候补和限时保留将取消。\u003c/p>',\"确认停诊\",()=>mutate({action,slot_id:slot.id},\"班次已停诊，待改约名单已更新。\",\"reschedule\"));\n  } else if(action===\"reschedule\" && selection.size && targetId) {\n    const ids=[...selection],target=state.slots.find(s=>s.id===targetId);\n    openDialog(\"确认改约\",'\u003cp>将 '+esc(ids.join(\"、\"))+' 共 '+ids.length+' 笔预约改至 '+esc(slotText(target))+'。目标班次当前剩余 '+target.available+' 个号源。\u003c/p>',\"确认改约\",()=>mutate({action,record_ids:ids,slot_id:target.id},\"已改约 \"+ids.length+\" 笔，详情已写入事件记录。\"));\n  }\n}\nbyId(\"dialog-form\").addEventListener(\"submit\",event=>{\n  event.preventDefault();\n  if(submitDialog)submitDialog(new FormData(event.target));\n});\ndocument.addEventListener(\"click\",event=>{\n  const skip=event.target.closest(\".skip\");\n  if(skip){event.preventDefault();byId(\"main\").focus();return;}\n  const btn=event.target.closest(\"[data-action]\");\n  if(btn){actions(btn.dataset.action,btn);return;}\n  const dateButton=event.target.closest(\"[data-date]\");\n  if(dateButton && state && !submitting) {\n    selectCalendarDay(dateButton.dataset.date,'.calendar-day[aria-pressed=\"true\"]');\n    return;\n  }\n  const calendarButton=event.target.closest(\"[data-calendar]\");\n  if(calendarButton && state && !submitting) {\n    const operation=calendarButton.dataset.calendar;\n    const date=operation===\"prev\"?shiftDay(selectedDay,-7):operation===\"next\"?shiftDay(selectedDay,7):\n      operation===\"today\"?dayKey(state.now):nearestDay(getSlots(),selectedDay);\n    selectCalendarDay(date,'[data-calendar=\"'+operation+'\"]');\n    return;\n  }\n  const row=event.target.closest(\"[data-slot]\");\n  if(row && !submitting) {\n    selectedSlot=row.dataset.slot;\n    history.replaceState(null,\"\",\"#schedule/\"+encodeURIComponent(selectedSlot));\n    render();\n    if(matchMedia(\"(max-width:740px)\").matches)byId(\"roster-top\")?.focus();\n    else workspace.querySelector('[data-slot=\"'+CSS.escape(selectedSlot)+'\"]')?.focus({preventScroll:true});\n  }\n});\ndocument.addEventListener(\"change\",event=>{\n  if(!state || submitting)return;\n  const el=event.target;\n  if([\"quick-dept\",\"quick-day\",\"quick-free\",\"quick-slot\"].includes(el.id)) {updateQuickBooking();return;}\n  if(el.id===\"record-status\") {recordStatus=el.value;updateRecordResults();return;}\n  if(el.id===\"department\") {department=el.value;history.replaceState(null,\"\",\"#schedule/date/\"+selectedDay);}\n  else if(el.id===\"pending-dept\") {pendingDept=el.value;selection.clear();}\n  else if(el.id===\"target-slot\") {targetId=el.value;}\n  else if(el.id===\"select-all\") {\n    selection=el.checked?new Set(getPending().filter(r=>slotFor(r).department===pendingDept).map(r=>r.id)):new Set();\n  } else if(el.dataset.pending) {\n    if(el.checked)selection.add(el.dataset.pending);else selection.delete(el.dataset.pending);\n  } else return;\n  render();\n  const replaced=el.id?byId(el.id):workspace.querySelector('[data-pending=\"'+CSS.escape(el.dataset.pending)+'\"]');\n  replaced?.focus({preventScroll:true});\n});\ndocument.addEventListener(\"input\",event=>{\n  if(event.target.id===\"record-search\") {recordQuery=event.target.value;updateRecordResults();}\n  if(event.target.id===\"event-filter\") {\n    eventQuery=event.target.value;\n    history.replaceState(null,\"\",\"#events\"+(eventQuery?'?'+new URLSearchParams({q:eventQuery}):''));\n    byId(\"event-list\").innerHTML=eventItems();\n  }\n});\nwindow.addEventListener(\"hashchange\",()=>{\n  if(dialog.open && !submitting) dialog.close();\n  readRequestedRoute();\n  note(\"\");render();window.scrollTo(0,0);\n});\nworkspace.addEventListener(\"keydown\",event=>{\n  if(!event.target.matches(\"[data-date]\") || !state || submitting) return;\n  const index=(dateValue(selectedDay).getUTCDay()+6)%7;\n  const offsets={ArrowLeft:-1,ArrowRight:1,Home:-index,End:6-index};\n  if(!Object.hasOwn(offsets,event.key)) return;\n  event.preventDefault();\n  selectCalendarDay(shiftDay(selectedDay,offsets[event.key]),'.calendar-day[aria-pressed=\"true\"]');\n});\nrender();\nload();\n\nfunction renderDayOverview(daySlots, date) {\n  const open = daySlots.filter(slot => slot.status === \"open\");\n  const totals = {booked:0, held:0, available:0};\n  for (const slot of open) {\n    totals.booked += slot.booked;\n    totals.held += slot.held;\n    totals.available += slot.available;\n  }\n  const total = totals.booked + totals.held + totals.available;\n  const usedPercent = total ? 100 * (totals.booked + totals.held) / total : 0;\n  const bookedPercent = total ? 100 * totals.booked / total : 0;\n  const groups = [[\"booked\", \"已预约\"], [\"held\", \"候补留位\"], [\"available\", \"可约\"]];\n  const legend = groups.map(([key, label]) =>\n    '\u003cspan data-usage=\"'+key+'\" data-count=\"'+totals[key]+'\">'+label+' \u003cb>'+totals[key]+'\u003c/b>\u003c/span>'\n  ).join(\"\");\n  const available = total ? totals.available : \"—\";\n  const caption = total ? ' / '+total+' 个' : daySlots.length ? ' 暂无开放班次' : ' 当天无排班';\n  return '\u003csection class=\"day-overview'+(daySlots.length?' capacity-summary':'')+'\" aria-label=\"所选日期号源\">'+\n    '\u003cdiv class=\"overview-data\">\u003cdiv class=\"overview-date\">\u003ci aria-hidden=\"true\">\u003c/i>\u003ctime datetime=\"'+esc(date)+'\">'+\n    fullDay.format(dateValue(date))+'\u003c/time>\u003cspan>'+esc(department || \"全部科室\")+'\u003c/span>\u003c/div>'+\n    '\u003ch2>当日可约号源\u003c/h2>\u003cdiv class=\"overview-value\">\u003cstrong>'+available+'\u003c/strong>\u003cspan>'+caption+'\u003c/span>\u003c/div>'+\n    '\u003cdiv class=\"capacity-legend\">'+legend+'\u003c/div>\u003c/div>'+\n    '\u003cdiv class=\"dial-stage\">\u003cdiv class=\"occupancy-dial\" style=\"--booked:'+bookedPercent+'%;--sweep:'+usedPercent+'%\">'+\n    '\u003cdiv class=\"dial-face\">\u003cstrong>'+(total?Math.round(usedPercent)+'\u003csmall>%\u003c/small>':'—')+'\u003c/strong>\u003cspan>号源占用率\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/section>';\n}\n","group":"前端"},{"path":"static/fonts/OFL.txt","text":"Schedule Sans is a renamed subset of Noto Sans SC.\n© 2014-2021 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'.\nhttps://github.com/notofonts/noto-cjk/blob/main/Sans/LICENSE\n\nSchedule Display is a renamed subset of Noto Serif SC.\n© 2017-2023 Adobe (http://www.adobe.com/).\nhttps://github.com/notofonts/noto-cjk/blob/main/Serif/LICENSE\n\nThis Font Software is licensed under the SIL Open Font License,\nVersion 1.1.\n\nThis license is copied below, and is also available with a FAQ at:\nhttp://scripts.sil.org/OFL\n\n-----------------------------------------------------------\nSIL OPEN FONT LICENSE Version 1.1 - 26 February 2007\n-----------------------------------------------------------\n\nPREAMBLE\nThe goals of the Open Font License (OFL) are to stimulate worldwide\ndevelopment of collaborative font projects, to support the font\ncreation efforts of academic and linguistic communities, and to\nprovide a free and open framework in which fonts may itial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#202328\">\n  \u003ctitle>门诊候补与改约工作台\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"/style.css?v=3\">\n  \u003cscript defer src=\"/app.js?v=3\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip\" href=\"#main\">跳到工作区\u003c/a>\n  \u003cheader class=\"mast\">\u003cdiv class=\"mast-inner\">\n    \u003ca class=\"brand\" href=\"#schedule\" aria-label=\"门诊调度，返回排班与候补\">\n      \u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003c/span>\u003cstrong>门诊调度\u003c/strong>\n    \u003c/a>\n    \u003cnav aria-label=\"工作台导航\">\n      \u003ca data-nav=\"schedule\" href=\"#schedule\">\u003ci class=\"nav-ico i-calendar\" aria-hidden=\"true\">\u003c/i>预约日程\u003c/a>\n      \u003ca data-nav=\"records\" href=\"#records\">\u003ci class=\"nav-ico i-search\" aria-hidden=\"true\">\u003c/i>预约查询\u003c/a>\n      \u003ca data-nav=\"reschedule\" href=\"#reschedule\">\u003ci class=\"nav-ico i-transfer\" aria-hidden=\"true\">\u003c/i>停诊改约\u003c/a>\n      \u003ca data-nav=\"events\" href=\"#events\">\u003ci class=\"nav-ico i-time\" aria-hidden=\"true\">\u003c/i>事件记录\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"rail-tools\">\n      \u003cbutton type=\"button\" class=\"guide-button\" data-action=\"guide\" aria-label=\"操作指引\">\u003cspan aria-hidden=\"true\">?\u003c/span>\u003cb>操作指引\u003c/b>\u003c/button>\n    \u003c/div>\n  \u003c/div>\u003c/header>\n  \u003cmain id=\"main\" tabindex=\"-1\">\n    \u003cdiv class=\"page-head\">\n      \u003cdiv>\u003ch1 id=\"page-title\" tabindex=\"-1\">预约日程\u003c/h1>\u003cp id=\"page-description\">按日期查看门诊班次、余号与候补名单。\u003c/p>\u003c/div>\n      \u003cdiv class=\"page-actions\">\n        \u003cdiv class=\"clock-box\">\u003cdiv>\u003cspan>演示时钟 · 北京时间\u003c/span>\u003cstrong id=\"clock\">读取中\u003c/strong>\u003c/div>\n          \u003cbutton type=\"button\" class=\"clock-button\" data-action=\"advance\" disabled>推进时间\u003c/button>\n        \u003c/div>\n        \u003cbutton type=\"button\" class=\"quick-button\" data-action=\"quick-book\" disabled>\u003cspan aria-hidden=\"true\">＋\u003c/span>快速登记\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"notice\" class=\"notice\" role=\"status\" aria-live=\"polite\" hidden>\u003c/div>\n    \u003cdiv id=\"workspace\" aria-busy=\"true\">\u003cp class=\"initial\">正在读取排班…\u003c/p>\u003c/div>\n  \u003c/main>\n  \u003cfooter class=\"footer\">\u003cspan>合成号源与虚构就诊编号\u003c/span>\u003cdiv>\u003ca class=\"github-link\" href=\"https://github.com/fate788/clinic-scheduling\">GitHub · @fate788 ↗\u003c/a>\u003cbutton type=\"button\" class=\"text-button\" data-action=\"reset\" disabled>重置演示\u003c/button>\u003c/div>\u003c/footer>\n  \u003cdialog id=\"dialog\" aria-labelledby=\"dialog-title\">\n    \u003cform id=\"dialog-form\">\u003cdiv class=\"dialog-head\">\u003ch2 id=\"dialog-title\">\u003c/h2>\u003cbutton type=\"button\" class=\"close-button\" data-action=\"close\" aria-label=\"关闭对话框\">×\u003c/button>\u003c/div>\n      \u003cdiv id=\"dialog-body\">\u003c/div>\u003cp class=\"dialog-error\" role=\"alert\" id=\"dialog-error\" hidden>\u003c/p>\n      \u003cdiv id=\"dialog-actions\" class=\"dialog-actions\">\u003c/div>\n    \u003c/form>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/style.css","text":":root {\n  color-scheme:light;\n  --ui:\"Schedule Sans\",\"Microsoft YaHei UI\",\"PingFang SC\",system-ui,sans-serif;\n  --display:\"Schedule Display\",\"Songti SC\",SimSun,serif;\n  --num:Bahnschrift,\"DIN Alternate\",\"Helvetica Neue\",Arial,sans-serif;\n  --ink:#20242a;--sub:#596169;--quiet:#6a7177;--rule:#dbe0e1;--ground:#f1f3f3;--card:#fff;\n  --coal:#202429;--amber:#f3b663;--amber-ink:#784916;--pale:#fff3dd;\n  --page:min(1392px,calc(100% - clamp(36px,7.3vw,144px)));\n  font:15px/1.55 var(--ui);color:var(--ink);background:var(--ground);font-variant-numeric:tabular-nums;\n}\n*{box-sizing:border-box}\nbody{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}\na{color:inherit;text-decoration:none}\nbutton,input,select{font:inherit}\nbutton,select{cursor:pointer}\nbutton{color:inherit}\nbutton:disabled{opacity:.52;cursor:not-allowed}\na:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a86612;outline-offset:3px}\nh1,h2,h3,p,ul,ol,dl,dd{margin:0}\nul,ol{padding:0}\n[hidden]{display:none!important}\n.sr-only{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}\n.skip{position:fixed;left:14px;top:-75px;z-index:10;padding:8px 14px;background:#fff}\n.skip:focus{top:8px}\n.mast{background:#202429;color:#f5f5f4;border-bottom:1px solid #32383d}\n.mast-inner{width:var(--page);margin:auto;display:flex;gap:clamp(24px,4vw,65px);align-items:center;min-height:62px}\n.brand{display:inline-flex;align-items:center;gap:11px;white-space:nowrap}\n.brand strong{font:740 23px/1.25 var(--display);letter-spacing:.015em}\n.brand-mark{display:grid;place-content:center;position:relative;width:33px;height:33px;border-radius:10px;background:linear-gradient(138deg,#ffdc9e,#ecac58 62%,#a97231);box-shadow:inset 0 1px 0 #ffdfa5,0 2px 5px #0005}\n.brand-mark i{width:19px;height:18px;background:#272b2e;clip-path:polygon(0 50%,23% 50%,37% 15%,52% 65%,68% 0,83% 44%,100% 44%,100% 59%,75% 59%,69% 43%,52% 100%,36% 57%,31% 66%,0 66%)}\n.mast nav{display:flex;align-self:stretch;gap:clamp(10px,1.8vw,32px)}\n.mast nav a{display:flex;gap:8px;align-items:center;position:relative;padding:0 3px;color:#bec3c7;font-size:14px;font-weight:520;white-space:nowrap}\n.mast nav a:hover,.mast nav a[aria-current]{color:#fff}\n.mast nav a[aria-current]::after{position:absolute;content:\"\";height:3px;left:3px;right:3px;bottom:0;background:#f3bc72;border-radius:2px 2px 0 0}\n.nav-ico{width:16px;height:16px;position:relative;flex:none;opacity:.9}\n.nav-ico::before,.nav-ico::after{content:\"\";position:absolute}\n.i-calenda d0d1;border-radius:6px;background:var(--card);color:#30363a;font-size:13px;line-height:1.5;font-weight:530}\n.button{min-height:38px;padding:8px 15px}\n.quick-button,.primary{background:#272c31;color:#fff;border:1px solid #272c31}\n.quick-button{display:flex;align-items:center;gap:8px;border-color:#dba14d;border-radius:7px;background:linear-gradient(150deg,#ffd799,#f2b45e);box-shadow:inset 0 1px #ffedce,0 2px 3px #49300e12;min-height:41px;padding:8px 17px;color:#362812;font-size:14px;font-weight:710;white-space:nowrap}\n.quick-button span{font:530 23px/1 var(--num)}\n.quick-button:hover:not(:disabled){background:#ffd28a}\n.button:hover:not(:disabled),.small-button:hover:not(:disabled),.clock-button:hover:not(:disabled){background:#f1f2ef;border-color:#9ca2a4}\n.primary:hover:not(:disabled){background:#3c444a;color:white}\n.text-button{background:none;border:0;color:#505962;cursor:pointer;padding:6px 3px;font-size:12px}\n.text-button:hover,a.github-link:hover{text-decoration:underline;text-underline-offset:3px}\n.notice,.dialog-error{padding:9px 14px;border:1px solid #b7c4c8;border-left:3px solid #536974;border-radius:6px;background:#e7eef0;color:#30444d;font-size:13px}\n.notice{margin-bottom:14px}\n.notice.failed,.dialog-error{background:#fff2d8;border-color:#be9357;color:#694919}\n\n.schedule-top{display:grid;grid-template-columns:minmax(0,1.13fr) minmax(0,1fr);gap:18px;margin-bottom:18px}\n.day-overview{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,39%);align-items:center;min-height:212px;padding:20px clamp(18px,2vw,33px);border:1px solid #343a3e;border-radius:12px;color:#faf8f2;background:radial-gradient(ellipse at 92% 10%,#505150 0%,transparent 45%),linear-gradient(115deg,#202428 5%,#2c3135 68%,#3a3d3f);box-shadow:0 4px 14px #22292e12}\n.day-overview::before{content:\"\";pointer-events:none;position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#25292b 0%,transparent 68%),radial-gradient(circle,#b8c2c531 .8px,transparent 1px);background-size:auto,11px 11px;mask-image:linear-gradient(90deg,transparent,#000)}\n.overview-data{min-width:0;position:relative;z-index:1}\n.overview-date{display:flex;align-items:center;gap:8px;font:500 12px/1.4 var(--ui);color:#d5dadb}\n.overview-date i{width:17px;height:3px;background:#ebb575}\n.overview-date span{padding-left:9px;border-left:1px solid #73777a;color:#d0d3d4}\n.overview-data h2{margin:13px 0 0;color:#ecebe6;font:560 15px/1.4 var(--ui);letter-spacing:.03em}\n.overview-value{display:flex;align-items:baseline;gap:8px}\n.overview-value strong{font:530 clamp(48px,4.1vw,65px)/1.08 var(--num);letter-spacing:-.055em;color:#fff}\n.overview-value>span{color:#c1c7c9;font-size:14px}\n.capacity-legend{display:flex;align-items:center;flex-wrap:wrap;gap:5px 14px;margin-top:12px;color:#d1d6d8;font-size:12px}\n.capacity-legend span{white-space:nowrap}\n.capacity-legend span::before{content:\"\";display:inline-block;vertical-align:middle;margin:0 5px 2px 0;width:6px;height:6px;border-radius:2px;background:#a9b8c3}\n.capacity-legend [data-usage=booked]::before{background:#fab864}\n.capacity-legend [data-usage=held]::before{background:#f2d8b1}\n.capacity-legend [data-usage=available]::before{background:#859097}\n.capacity-legend b{font:600 14px/1.1 var(--num);color:#f5f5f2;margin-left:1px}\n.dial-stage{position:relative;display:grid;place-items:center;isolation:isolate}\n.dial-stage::before,.dial-stage::after{content:\"\";position:absolute;z-index:-1;width:126%;aspect-ratio:1;border:1px solid #bec7c513;border-radius:50%}\n.dial-stage::after{width:105%;border-color:#d7dddb1c}\n.occupancy-dial{position:relative;display:grid;place-items:center;width:clamp(134px,12vw,181px);aspect-ratio:1;border-radius:50%;border:1px solid #a7a9a3;box-shadow:inset 0 0 0 2px #202529,inset 0 0 0 3px #777d7c,0 10px 18px #0e111366;background:repeating-conic-gradient(from -1deg,#bfc4bf 0 1deg,transparent 1deg 7.5deg),linear-gradient(125deg,#666c6e,#2f3438 60%,#797b77)}\n.occupancy-dial::before{content:\"\";position:absolute;inset:8%;border-radius:50%;background:conic-gradient(#fab864 0 var(--booked),#f2d8b1 var(--booked) var(--sweep),#77838b var(--sweep) 100%);box-shadow:0 0 0 4px #303639,0 0 0 5px #888b8580}\n.dial-face{position:absolute;inset:14.5%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:radial-gradient(ellipse at 35% 20%,#41474b 0%,#282d31 71%);box-shadow:inset 0 1px 2px #9ba4a44a,0 0 2px #171b20}\n.dial-face strong{font:510 clamp(29px,2.45vw,39px)/1 var(--num);color:#ffda9e;letter-spacing:-.035em}\n.dial-face small{font-size:.48em;margin-left:1px}\n.dial-face span{font-size:11px;letter-spacing:.04em;color:#d0d5d6}\n.calendar-strip,.panel{min-width:0;border:1px solid var(--rule);border-radius:11px;background:var(--card);box-shadow:0 2px 5px #161e2205}\n.calendar-strip{display:flex;flex-direction:column;justify-content:center;padding:18px clamp(14px,1.5vw,25px)}\n.calendar-head,.panel-head,.roster-title-row,.section-tools{display:flex;align-items:center;justify-content:space-between;gap:12px}\n.calendar-head{margin-bottom:16px}\nh2,.calendar-title{font:680 clamp(17px,1.4vw,22px)/1.4 var(--ui);letter-spacing:-.035em}\n.calendar-tools{display:flex;align-items:center;gap:4px}\n.calendar-tools button{min-height:30px;min-width:28px;border:1px solid #d8dcdd;background:white;border-radius:5px;padding:3px 8px;font-size:12px}\n.calendar-tools button:hover{background:#f2f3f1}\n.calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}\n.calendar-day{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-height:89px;border:1px solid transparent;border-radius:7px;background:transparent;position:relative;padding:5px 1px;color:#5d6367}\n.calendar-day.has-slots{color:var(--ink);background:#f5f6f4}\n.calendar-day:hover{border-color:#c7c9c8}\n.calendar-day[aria-pressed=true]{background:#292e32;border-color:#292e32;color:#fff;box-shadow:0 3px 6px #1c222217}\n.day-week,.day-status{font-size:11px;line-height:1.5;white-space:nowrap}\n.day-number{font:530 clamp(23px,1.9vw,31px)/1.16 var(--num);letter-spacing:-.025em}\n.calendar-day.has-slots:not([aria-pressed=true]) .day-status{color:#775019}\n.calendar-day[aria-pressed=true] .day-status{color:#ffcc8b}\n.calendar-day.is-today .day-week::before{content:\"\";display:inline-block;vertical-align:middle;margin:0 3px 2px 0;width:4px;height:4px;background:currentColor;border-radius:50%}\n\n.board{display:grid;grid-template-columns:minmax(0,1.13fr) minmax(0,1fr);gap:18px;align-items:start}\n.agenda-column{display:grid;min-width:0;gap:13px}\n.queue-panel{padding:12px 19px}\n.queue-panel header{display:flex;align-items:baseline;gap:8px;margin:0 0 7px}\n.queue-panel header h2{font:650 14px/1.4 var(--ui)}\n.queue-panel header span{font-size:11px;color:var(--sub)}\n.queue-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}\n.queue-links a{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;min-height:32px;background:#f3f5f4;border-radius:4px;padding:4px 9px;font-size:12px}\n.queue-links a:hover{background:#f7ecd7}\n.queue-links b{font:600 17px/1.1 var(--num)}\n.queue-links i{font:400 17px/1 var(--num);color:#6e767a}\n.panel{overflow:hidden}\n.panel-head{min-height:65px;padding:15px 22px;border-bottom:1px solid var(--rule)}\n.agenda-heading{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}\n.agenda-count,.slot-meta,.slot-queue,.record-meta,.minor-empty,.detail-note{font-size:12px;color:var(--sub)}\n.panel-filter{display:block;min-width:0;max-width:48%}\nselect,input{max-width:100%;color:var(--ink);border:1px solid #cbd0d1;background:#fff;border-radius:6px;padding:7px 10px;font-size:13px}\nselect{min-height:34px}\n.slots,.records,.event-list,.lookup-list,.record-history ol{list-style:none}\n.slot-button{position:relative;width:100%;display:grid;align-items:c
