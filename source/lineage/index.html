<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify data lineage impact\non: [push, pull_request]\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build\n      - run: npm run lineage\n","group":"配置与启动"},{"path":".gitignore","text":"dist/\nnode_modules/\n","group":"配置与启动"},{"path":"README.md","text":"# 数据血缘影响台\n\n面向数据工程、指标治理和看板维护人员。把上游字段变更与登记的列级依赖放在一起核对，沿着计算、筛选、关联和分组关系定位下游消费者，并给出每个影响字段的证据路径。\n\n[打开分析台](https://fate788.github.io/personal-blog/demos/lineage/index.html?v=1.0) · [查看退役未引用字段](https://fate788.github.io/personal-blog/demos/lineage/index.html?v=1.0&case=unused)\n\n![订单金额字段的影响图](docs/preview.webp)\n\n## 三个可复跑的案例\n\n- **退役金额字段**。`orders_raw.amount_cents` 被 6 项下游资产、8 个字段间接或直接使用，其中包含交易和财务看板。当前变更阻断。证据可以跟到各字段、依赖类型和负责人。\n- **退役旧备注**。登记清单中未发现 `orders_raw.legacy_note` 的下游消费者，本次检查通过。\n- **调整金额类型**。保留同一批下游依赖，提示复核类型、聚合与展示口径。\n\n## 在本机复跑\n\n需要 Node.js 22 或更新版本，无额外依赖。\n\n```sh\nnpm test\nnpm run build\nnode cli.mjs --demo --case drop\nnode cli.mjs --demo --case unused\nnode cli.mjs --demo --case type\nnode cli.mjs --input ./workspace.json --out ./impact-report.json\n```\n\n构建后直接打开 `dist/index.html`。体验页支持导出样例 JSON、导入自己的工作区以及下载检查报告。导入数据在当前浏览器内处理。CLI 退出码 `0` 表示通过，`2` 表示阻断，`3` 表示待复核，`1` 表示输入或文件错误。报告可以用新路径保存。\n\n## 清单及判定口径\n\n工作区包含 `catalog` 与 `proposal`。资产有编号、类型、负责人和字段列表。每个字段可通过 `inputs` 声明上游字段及处理关系。方案包含一个或多个变更，支持退役、改类型和改可空性。导入时会检查字段引用及循环。分析沿字段关系保留每个变更来源到各消费者的一条最短证据链。同一消费者的严重级别按最高风险合并。\n\n可先从体验页导出 JSON 作模板。单个文件上限为 256 KiB，目录支持 80 个资产、500 个字段和 3,000 条依赖，单次可查 20 项变更。遇到证据链累计超过 16,000 步的方案，可以按变更范围拆分工作区后重查。\n\n结果覆盖已登记的血缘。清单中未发现依赖时，本次检查通过，实际发布仍应依据环境里的完整登记。数据为虚构零售场景。建模参考 [OpenLineage 字段级血缘](https://openlineage.io/docs/spec/facets/dataset-facets/column_lineage_facet/) 和 [dbt 下游看板登记](https://docs.getdbt.com/docs/build/exposures)。\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 数据血缘影响台 v1.0 源码包\n\n原始发布归档为 `数据血缘影响台-v1.0.zip`。压缩包保留其中 13 份文本文件的原始路径与字节，本文件为导出说明。\n\n在 Node.js 22 或更新版本运行 npm test 和 npm run build，生成可双击打开的离线版。\n","group":"项目说明"},{"path":"build.mjs","text":"import { mkdir, readFile, writeFile } from 'node:fs/promises';\nimport { dirname, resolve } from 'node:path';\n\nconst destination = resolve(process.argv[2] || 'dist/index.html');\nconst read = async path => (await readFile(new URL(path, import.meta.url), 'utf8')).replaceAll('\\r\\n', '\\n');\nconst moduleUrl = source => `data:text/javascript;base64,${Buffer.from(source).toString('base64')}`;\nconst [html, css, app, engine, fixtures] = await Promise.all([\n  read('./static/index.html'), read('./static/styles.css'), read('./static/app.mjs'),\n  read('./engine.mjs'), read('./fixtures.mjs'),\n]);\n\nfunction inlineModule(source, path, url) {\n  return source.replaceAll(`'${path}'`, `'${url}'`).replaceAll(`\"${path}\"`, `\"${url}\"`);\n}\n\nconst engineUrl = moduleUrl(engine);\nconst fixturesUrl = moduleUrl(inlineModule(fixtures, './engine.mjs', engineUrl));\nconst application = inlineModule(inlineModule(app, '../engine.mjs', engineUrl), '../fixtures.mjs', fixturesUrl);\nconst cssEntry = /\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css[\"'][^>]*>/iu;\nconst jsEntry = /\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs[\"'][^>]*>\\s*\u003c\\/script>/iu;\nif (!cssEntry.test(html) || !jsEntry.test(html)) throw new Error('找不到分析台的样式或脚本入口。');\n\nconst policy = \"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\nconst standalone = html.replace('\u003chead>', `\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(cssEntry, () => `\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(jsEntry, () => `\u003cscript type=\"module\" src=\"${moduleUrl(application)}\">\u003c/script>`);\n\nawait mkdir(dirname(destination), { recursive: true });\nawait writeFile(destination, standalone, 'utf8');\nconsole.log(`已生成数据血缘影响台 ${destination}`);\n","group":"配置与启动"},{"path":"cli.mjs","text":"import { open, stat, unlink } from 'node:fs/promises';\nimport { MAX_INPUT_BYTES, analyzeImpact, parseWorkspace } from './engine.mjs';\nimport { DEMO_DROP, DEMO_TYPE, DEMO_UNUSED } from './fixtures.mjs';\n\nconst CASES = new Map([['drop', DEMO_DROP], ['unused', DEMO_UNUSED], ['type', DEMO_TYPE]]);\nconst EXIT_CODES = new Map([['clear', 0], ['blocked', 2], ['review', 3]]);\nconst HELP = `数据血缘影响台 · 本机命令行\n\nnode cli.mjs --demo [--case drop|unused|type] [--out \u003c新报告.json>]\nnode cli.mjs --input \u003c工作区.json> [--out \u003c新报告.json>]\n\n  --demo           使用内置工作区\n  --case \u003c场景>    drop 退役金额字段（默认），unused 退役闲置字段，type 修改金额字段类型\n  --input \u003c文件>   使用本地 UTF-8 JSON 工作区，最大 ${MAX_INPUT_BYTES / 1024} KiB\n  --out \u003c新文件>   写入与标准输出相同的 UTF-8 JSON 报告，已有文件会保留\n  --help, -h       查看帮助\n\n报告包含结论、受影响的资产与字段、依赖路径和字段映射依据。\n退出码 0 表示未发现下游影响，2 表示阻断，3 表示待复核，1 表示参数、工作区或文件错误。`;\n\nclass CliError extends Error {}\n\nconst ARGUMENTS = new Set(['--demo', '--case', '--input', '--out']);\n\nfunction parseArguments(args) {\n  const options = new Map();\n  for (let index = 0; index \u003c args.length; index += 1) {\n    const key = args[index];\n    if (!ARGUMENTS.has(key) || options.has(key)) {\n      throw new CliError('存在未知或重复的参数。运行 node cli.mjs --help 查看用法。');\n    }\n    if (key === '--demo') {\n      options.set(key, true);\n      continue;\n    }\n    const value = args[index + 1];\n    if (!value || value.startsWith('--')) throw new CliError(`${key} 缺少参数值。`);\n    options.set(key, value);\n    index += 1;\n  }\n  if (options.has('--demo') === options.has('--input')) throw new CliError('请选择 --demo 或 --input。');\n  if (options.has('--case') && !options.has('--demo')) throw new CliError('--case 需要与 --demo 一起使用。');\n  if (options.has('--case') && !CASES.has(options.get('--case'))) {\n    throw new CliError('样例场景请选择 drop、unused 或 type。');\n  }\n  return options;\n}\n\nfunction checkFile(details) {\n  if (!details.isFile() || details.size > MAX_INPUT_BYTES) {\n    throw new CliError(`请提供不超过 ${MAX_INPUT_BYTES / 1024} KiB 的工作区 JSON 文件。`);\n  }\n}\n\nasync function readInput(path) {\n  try {\n    checkFile(await stat(path));\n    const file = await open(path, 'r');\n    try {\n      checkFile(await file.stat());\n      const buffer = Buffer.allocUnsafe(MAX_INPUT_BYTES + 1);\n      let size = 0;\n      while (size \u003c buffer.length) {\n        const { bytesRead } = await file.read(buffer, size, buffer.length - size, null);\n        if (!bytesRead) break;\n        size += bytesRead;\n      }\n      if (size > MAX_INPUT_BYTES) throw new CliError(`工作区超过 ${MAX_INPUT_BYTES / 1024} KiB。`);\n      try {\n        return new TextDecoder('utf-8', { fatal: true }).decode(buffer.subarray(0, size));\n      } catch {\n        throw new CliError('工作区 JSON 文件需要使用 UTF-8 编码。');\n      }\n    } finally {\n      await file.close();\n    }\n  } catch (error) {\n    if (error instanceof CliError) throw error;\n    throw new CliError('无法读取指定的工作区文件。');\n  }\n}\n\nasync function writeReport(path, contents) {\n  let file;\n  try {\n    file = await open(path, 'wx', 0o600);\n  } catch (error) {\n    if (error.code === 'EEXIST') throw new CliError('输出已存在，请指定一个新报告文件。');\n    throw new CliError('无法创建指定的报告文件。');\n  }\n  try {\n    try {\n      await file.writeFile(contents, 'utf8');\n    } finally {\n      await file.close();\n    }\n  } catch {\n    await unlink(path).catch(() => {});\n    throw new CliError('写入影响报告失败。');\n  }\n}\n\nfunction inspect(input) {\n  try {\n    return analyzeImpact(typeof input === 'string' ? parseWorkspace(input) : input);\n  } catch (error) {\n    if (error instanceof SyntaxError) throw new CliError('工作区文件不是有效的 JSON。');\n    throw new CliError(error.message || '无法分析影响。');\n  }\n}\n\nasync function main(args) {\n  if (args.length === 1 && ['--help', '-h'].includes(args[0])) {\n    console.log(HELP);\n    return 0;\n  }\n  const options = parseArguments(args);\n  const input = options.has('--demo')\n    ? CASES.get(options.get('--case') ?? 'drop')\n    : await readInput(options.get('--input'));\n  const result = inspect(input);\n  if (!EXIT_CODES.has(result.status)) throw new CliError('影响分析返回未知结论。');\n  const report = JSON.stringify(result, null, 2) + '\\n';\n  if (options.has('--out')) await writeReport(options.get('--out'), report);\n  process.stdout.write(report);\n  return EXIT_CODES.get(result.status);\n}\n\ntry {\n  process.exitCode = await main(process.argv.slice(2));\n} catch (error) {\n  console.error(error instanceof CliError ? error.message : '分析失败。请检查工作区和报告路径。');\n  process.exitCode = 1;\n}\n","group":"配置与启动"},{"path":"engine.mjs","text":"export const MAX_INPUT_BYTES = 262_144;\nconst MAX_ASSETS = 80;\nconst MAX_FIELDS = 500;\nconst MAX_INPUTS = 3_000;\nconst MAX_CHANGES = 20;\nconst MAX_EVIDENCE_STEPS = 16_000;\nconst ASSET_KINDS = new Set(['source', 'model', 'metric', 'dashboard']);\nconst RELATIONS = new Set(['value', 'filter', 'join', 'group']);\nconst OPERATIONS = new Set(['drop', 'type', 'nullable']);\nconst SEVERITY = { clear: 0, review: 1, blocked: 2 };\n\nfunction invalid(message) {\n  throw new TypeError(message);\n}\n\nfunction object(value, label) {\n  if (!value || typeof value !== 'object' || Array.isArray(value)) invalid(`${label}应为对象。`);\n  return value;\n}\n\nfunction list(value, min, max, label) {\n  if (!Array.isArray(value) || value.length \u003c min || value.length > max) invalid(`${label}应有 ${min} 到 ${max} 项。`);\n  return value;\n}\n\nfunction text(value, max, label, optional = false) {\n  if (typeof value !== 'string' || value.trim().length > max || (!optional && !value.trim()) || /[\\0-\\x1f\\x7f]/u.test(value)) {\n    invalid(`${label}应为${optional ? '至多' : '1 到'} ${max} 字的单行文字。`);\n  }\n  return value.trim();\n}\n\nconst identifier = /^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/u;\n\nfunction id(value, label) {\n  if (typeof value !== 'string' || !identifier.test(value)) invalid(`${label}应为 1 到 64 个字母、数字、连字符或下划线，开头使用字母或数字。`);\n  return value;\n}\n\nfunction ref(value, label) {\n  if (typeof value !== 'string') invalid(`${label}应为 资产编号.字段编号。`);\n  const parts = value.split('.');\n  if (parts.length !== 2 || !parts.every(part => identifier.test(part))) invalid(`${label}应为 资产编号.字段编号。`);\n  return value;\n}\n\nfunction flag(value, label) {\n  if (typeof value !== 'boolean') invalid(`${label}应为布尔值。`);\n  return value;\n}\n\nfunction option(value, allowed, label) {\n  if (!allowed.has(value)) invalid(`${label}应为 ${[...allowed].join(' / ')} 之一。`);\n  return value;\n}\n\nfunction reserve(map, key, value, label) {\n  if (map.has(key)) invalid(`${label}重复：${key}。`);\n  map.set(key, value);\n}\n\nconst lexical = (first, second) => Number(first > second) - Number(first \u003c second);\nconst severity = (first, second) => SEVERITY[first] >= SEVERITY[second] ? first : second;\n\nfunction prepareWorkspace(raw) {\n  const input = object(raw, '工作区');\n  const catalog = object(input.catalog, '数据目录');\n  const proposal = object(input.proposal, '变更方案');\n  const assetIndex = new Map();\n  const fields = new Map();\n  const catalogName = text(catalog.name, 96, '目录名称');\n  let dependencyCount = 0;\n\n  const assets = list(catalog.assets, 1, MAX_ASSETS, '资产列表').map((rawAsset, position) => {\n    const rawLabel = `第 ${position + 1} 项资产`;\n    const asset = object(rawAsset, rawLabel);\n    const assetId = id(asset.id, `${rawLabel}编号`);\n    const label = `资产 ${assetId}`;\n    const normalized = {\n      id: assetId,\n      name: text(asset.name, 96, `${label}名称`),\n      kind: option(asset.kind, ASSET_KINDS, `${label}类型`),\n      owner: text(asset.owner, 80, `${label}负责人`),\n      description: text(asset.description, 320, `${label}说明`, true),\n      fields: [],\n    };\n    reserve(assetIndex, assetId, normalized, '资产编号');\n\n    normalized.fields = list(asset.fields, 1, MAX_FIELDS, `${label}字段列表`).map((rawField, position) => {\n      const rawFieldLabel = `${label}的第 ${position + 1} 个字段`;\n      const field = object(rawField, rawFieldLabel);\n      const fieldId = id(field.id, `${rawFieldLabel}编号`);\n      const key = `${assetId}.${fieldId}`;\n      const inputKinds = new Map();\n      const inputs = list(field.inputs, 0, MAX_FIELDS * RELATIONS.size, `${key} 的输入`).map((rawInput, position) => {\n        const inputLabel = `${key} 的第 ${position + 1} 个输入`;\n        const input = object(rawInput, inputLabel);\n        const from = ref(input.field, `${inputLabel}字段`);\n        const kind = option(input.kind, RELATIONS, `${inputLabel}关系`);\n        if (++dependencyCount > MAX_INPUTS) invalid(`目录最多支持 ${MAX_INPUTS} 条字段依赖。`);\n        reserve(inputKinds, `${from} (${kind})`, true, `${key} 的输入关系`);\n        return { field: from, kind, description: text(input.description, 320, `${inputLabel}说明`, true) };\n      });\n      const normalized = {\n        id: fieldId,\n        name: text(field.name, 96, `${key} 名称`),\n        type: text(field.type, 80, `${key} 类型`),\n        nullable: flag(field.nullable, `${key} 可空性`),\n        inputs,\n      };\n      reserve(fields, key, { field: normalized, assetId }, '字段编号');\n      if (fields.size > MAX_FIELDS) invalid(`目录最多支持 ${MAX_FIELDS} 个字段。`);\n      return normalized;\n    });\n    return normalized;\n  });\n\n  const edges = [];\n  for (const [to, { field }] of fields) {\n    for (const input of field.inputs) {\n      if (!fields.has(input.field)) invalid(`${to} 引用了不存在的字段 ${input.field}。`);\n      edges.push({ from: input.field, to, kind: input.kind, description: input.description });\n    }\n  }\n  edges.sort((first, second) => lexical(first.from, second.from) || lexical(first.to, second.to) || lexical(first.kind, second.kind));\n  const outgoing = verifyDag(fields, edges);\n\n  const proposalName = text(proposal.name, 96, '方案名称');\n  const seenChanges = new Map();\n  const changes = list(proposal.changes, 1, MAX_CHANGES, '变更列表').map((rawChange, position) => {\n    const label = `第 ${position + 1} 项变更`;\n    const change = object(rawChange, label);\n    const key = ref(change.field, `${label}字段`);\n    const target = fields.get(key)?.field;\n    if (!target) invalid(`${label}引用了不存在的字段 ${key}。`);\n    const op = option(change.op, OPERATIONS, `${label}操作`);\n    reserve(seenChanges, key, op, '变更字段');\n\n    if (op === 'drop') {\n      if (Object.hasOwn(change, 'to')) invalid(`${label}删除字段时无需填写目标值。`);\n      return { field: key, op };\n    }\n    const to = op === 'type' ? text(change.to, 80, `${label}目标类型`) : flag(change.to, `${label}目标可空性`);\n    const unchanged = op === 'type' ? to.replace(/\\s+/gu, '').toLowerCase() === target.type.replace(/\\s+/gu, '').toLowerCase() : to === target.nullable;\n    if (unchanged) invalid(`${label}的目标值和原值相同。`);\n    return { field: key, op, to };\n  });\n  const paths = prepareDependencies(changes, outgoing);\n\n  return {\n    workspace: { catalog: { name: catalogName, assets }, proposal: { name: proposalName, changes } },\n    edges, fields, paths,\n  };\n}\n\nfunction verifyDag(fields, edges) {\n  const outgoing = new Map([...fields.keys()].map(key => [key, []]));\n  const incoming = new Map([...fields.keys()].map(key => [key, 0]));\n  for (const edge of edges) {\n    outgoing.get(edge.from).push(edge);\n    incoming.set(edge.to, incoming.get(edge.to) + 1);\n  }\n  const ready = [...incoming.keys()].filter(key => incoming.get(key) === 0);\n  for (let index = 0; index \u003c ready.length; index += 1) {\n    for (const { to } of outgoing.get(ready[index])) {\n      const remaining = incoming.get(to) - 1;\n      incoming.set(to, remaining);\n      if (remaining === 0) ready.push(to);\n    }\n  }\n  if (ready.length !== fields.size) {\n    const key = [...incoming.keys()].filter(key => incoming.get(key) > 0).sort(lexical)[0];\n    invalid(`目录存在循环依赖，${key} 所在的剩余依赖无法拓扑排序。`);\n  }\n  return outgoing;\n}\n\nexport function parseWorkspace(text) {\n  if (typeof text !== 'string' || !text.trim()) invalid('请输入 JSON 工作区。');\n  if (text.length > MAX_INPUT_BYTES || new TextEncoder().encode(text).length > MAX_INPUT_BYTES) invalid('工作区文件不能超过 256 KiB。');\n  let input;\n  try {\n    input = JSON.parse(text.replace(/^\\uFEFF/u, ''));\n  } catch {\n    invalid('工作区不是有效的 JSON，请检查文件格式。');\n  }\n  return prepareWorkspace(input).workspace;\n}\n\nfunction nearestDependencies(root, outgoing, account) {\n  const walk = [root];\n  const previous = new Map([[root, null]]);\n  const depths = new Map([[root, 0]]);\n  for (let index = 0; index \u003c walk.length; index += 1) {\n    for (const edge of outgoing.get(walk[index])) {\n      if (previous.has(edge.to)) continue;\n      const depth = depths.get(edge.from) + 1;\n      account(depth);\n      previous.set(edge.to, edge);\n      depths.set(edge.to, depth);\n      walk.push(edge.to);\n    }\n  }\n  previous.delete(root);\n  return previous;\n}\n\nfunction prepareDependencies(changes, outgoing) {\n  let steps = 0;\n  function account(depth) {\n    steps += depth;\n    if (steps > MAX_EVIDENCE_STEPS) {\n      invalid('方案的影响路径超过 16000 步，请拆分变更方案，或缩小目录到本次复核所需的资产。');\n    }\n  }\n  return new Map(changes.map(({ field }) => [field, nearestDependencies(field, outgoing, account)]));\n}\n\nfunction recoverPath(endpoint, previous) {\n  const steps = [];\n  for (let edge = previous.get(endpoint); edge; edge = previous.get(edge.from)) steps.push(edge);\n  return steps.reverse();\n}\n\nexport function analyzeImpact(raw) {\n  const { workspace, fields, edges, paths } = prepareWorkspace(raw);\n  const reached = new Map();\n  let status = 'clear';\n\n  const changes = workspace.proposal.changes.map(change => {\n    const { field: root, op, to } = change;\n    const { type, nullable } = fields.get(root).field;\n    const before = { type, nullable };\n    const after = op === 'drop' ? null : { ...before, [op]: to };\n    const previous = paths.get(root);\n    const changeStatus = previous.size === 0 ? 'clear' : op === 'drop' ?   const fields = new Map();\n  for (const asset of assets.values()) {\n    for (const field of asset.fields) fields.set(`${asset.id}.${field.id}`, { field, asset });\n  }\n  const roots = new Map(result.changes.map(change => [change.field, change]));\n  return {\n    assets, fields, roots,\n    rootAssets: new Set(result.changes.map(change => fields.get(change.field).asset.id)),\n    affected: new Map(result.assets.map(asset => [asset.id, asset])),\n    impacts: new Map(result.impacts.map(impact => [impact.field, impact])),\n  };\n}\n\nfunction announce(message = '', tone = 'success') {\n  const notice = $('notice');\n  notice.textContent = message;\n  notice.dataset.tone = tone;\n  notice.hidden = !message;\n}\n\nfunction fieldChangeText(change) {\n  if (change.op === 'drop') return `${change.before.type} · ${change.before.nullable ? '可为空' : '非空'} → 删除`;\n  if (change.op === 'type') return `${change.before.type} → ${change.after.type}`;\n  return `${change.before.nullable ? '可为空' : '非空'} → ${change.after.nullable ? '可为空' : '非空'}`;\n}\n\nfunction renderOverview() {\n  const { workspace, result } = state;\n  $('catalog-name').textContent = `${workspace.catalog.name} · ${workspace.catalog.assets.length} 项资产`;\n  $('proposal-title').textContent = workspace.proposal.name;\n  $('workspace-origin').textContent = state.example ? '合成样例' : '本地导入';\n  const operations = new Set(result.changes.map(change => OPERATION[change.op]));\n  $('change-operation').textContent = operations.size === 1 ? [...operations][0] : '多种字段变更';\n  const root = result.changes[0];\n  const labels = [element('code', '', root.field), element('span', '', fieldChangeText(root))];\n  if (result.changes.length > 1) labels.push(element('span', '', `共 ${result.changes.length} 项变更，详见影响报告`));\n  $('change-fields').replaceChildren(...labels);\n  $('review').dataset.status = result.status;\n  $('review-status').textContent = REVIEW[result.status];\n  $('impact-total').textContent = result.totals.impactedAssets;\n  $('field-total').textContent = result.totals.impactedFields;\n  $('direct-total').textContent = result.totals.directAssets;\n  $('review-note').textContent = {\n    blocked: '当前目录中仍有字段依赖待删除项，建议先迁移这些依赖。',\n    review: '当前目录中存在下游依赖，需要复核字段兼容性。',\n    clear: '当前导入的血缘目录中未找到变更字段的下游依赖。',\n  }[result.status];\n  for (const control of $('case-switch').querySelectorAll('[data-case]')) {\n    control.setAttribute('aria-pressed', String(control.dataset.case === state.example));\n  }\n  $('download-report').disabled = false;\n  $('download-workspace').disabled = false;\n}\n\nfunction groupedAssets() {\n  const { assets, rootAssets, affected } = state.index;\n  const groups = new Map();\n  for (const asset of assets.values()) {\n    const root = rootAssets.has(asset.id);\n    const impact = affected.get(asset.id);\n    if (!root && !impact && state.view === 'impact') continue;\n    const distance = root ? 0 : impact?.distance ?? Infinity;\n    const group = groups.get(distance) ?? [];\n    group.push({ asset, impact, root });\n    groups.set(distance, group);\n  }\n  return [...groups].sort(([first], [second]) => first - second);\n}\n\nfunction renderGraph() {\n  const lanes = groupedAssets().map(([distance, entries]) => {\n    const lane = element('section', 'lane');\n    const title = distance === 0 ? '变更起点' : Number.isFinite(distance) ? `${distance} 跳下游` : '其他资产';\n    lane.setAttribute('aria-label', title);\n    const content = element('div', 'lane-nodes');\n    for (const { asset, impact, root } of entries) {\n      const item = button('node');\n      item.dataset.asset = asset.id;\n      item.dataset.tone = root ? 'root' : impact?.status ?? 'clear';\n      item.setAttribute('aria-pressed', String(asset.id === state.selectedAsset));\n      item.append(element('span', 'node-kind', ASSET_KIND[asset.kind]), element('strong', 'node-name', asset.name), element('span', 'node-ref', asset.id));\n      content.append(item);\n    }\n    lane.append(element('h3', 'lane-title', title), content);\n    return lane;\n  });\n  $('graph-lanes').replaceChildren(...lanes);\n  $('graph-impact').setAttribute('aria-pressed', String(state.view === 'impact'));\n  $('graph-all').setAttribute('aria-pressed', String(state.view === 'all'));\n  $('graph-note').textContent = state.view === 'all'\n    ? '完整血缘展示当前目录的全部资产与已知依赖。资产之间的连线可对应多条字段关系。'\n    : state.result.totals.impactedAssets\n      ? '这里只显示变更字段及其下游，亮线标记当前所选字段的影响路径。'\n      : '未找到变更字段的下游依赖。切换到完整血缘可以查看其他字段的关系。';\n  queueGraph();\n}\n\nfunction getVisibleLinks() {\n  const { fields, roots, impacts } = state.index;\n  const selected = impacts.get(state.selectedField);\n  const highlighted = new Set(selected?.paths.flatMap(path => path.steps.map(step => linkKey(step.from, step.to, step.kind))));\n  const reachable = ref => roots.has(ref) || impacts.has(ref);\n  const pairs = new Map();\n  for (const edge of state.result.edges) {\n    const relevant = reachable(edge.from) && reachable(edge.to);\n    if (!relevant && state.view === 'impact') continue;\n    const fromId = fields.get(edge.from).asset.id;\n    const toId = fields.get(edge.to).asset.id;\n    if (fromId === toId) continue;\n    const type = edge.kind === 'value' ? 'value' : 'condition';\n    const key = linkKey(fromId, toId, type);\n    const link = pairs.get(key) || { fromId, toId, type, relevant: false, highlight: false };\n    link.relevant ||= relevant;\n    link.highlight ||= highlighted.has(linkKey(edge.from, edge.to, edge.kind));\n    pairs.set(key, link);\n  }\n  return [...pairs.values()].sort((first, second) => Number(first.highlight) - Number(second.highlight));\n}\n\nfunction drawConnection(context, from, to, type, relevant, highlight, vertical) {\n  const stripe = type === 'value' ? 0 : 1;\n  const direction = vertical ? Math.sign(to.top - from.top) : Math.sign(to.left - from.left);\n  const sx = vertical ? from.left + from.width * (0.47 + stripe * 0.10) : direction \u003c 0 ? from.left : from.right;\n  const sy = vertical ? direction \u003c 0 ? from.top : from.bottom : from.top + from.height * (0.43 + stripe * 0.14);\n  const tx = vertical ? to.left + to.width * (0.44 + stripe * 0.10) : direction \u003c 0 ? to.right : to.left;\n  const ty = vertical ? direction \u003c 0 ? to.bottom : to.top : to.top + to.height * (0.43 + stripe * 0.14);\n  const bendX = (sx + tx) / 2;\n  const bendY = (sy + ty) / 2;\n  context.strokeStyle = highlight ? (stripe ? '#e4d49e' : '#fac28a') : relevant ? (stripe ? '#a0b380' : '#c68b5f') : '#527482';\n  context.fillStyle = context.strokeStyle;\n  context.globalAlpha = highlight ? 1 : relevant ? 0.82 : 0.45;\n  context.lineWidth = highlight ? 2.2 : 1.35;\n  context.setLineDash(stripe ? [4, 3] : []);\n  context.beginPath();\n  context.moveTo(sx, sy);\n  if (vertical) context.bezierCurveTo(sx, bendY, tx, bendY, tx, ty);\n  else if (direction === 0) context.bezierCurveTo(sx + 19, sy, tx + 19, ty, tx, ty);\n  else context.bezierCurveTo(bendX, sy, bendX, ty, tx, ty);\n  context.stroke();\n  context.setLineDash([]);\n  context.beginPath();\n  if (vertical) {\n    const signed = direction >= 0 ? 1 : -1;\n    context.moveTo(tx, ty);\n    context.lineTo(tx - 3.2, ty - signed * 5);\n    context.lineTo(tx + 3.2, ty - signed * 5);\n  } else {\n    const signed = direction > 0 ? 1 : -1;\n    context.moveTo(tx, ty);\n    context.lineTo(tx - signed * 5, ty - 3.2);\n    context.lineTo(tx - signed * 5, ty + 3.2);\n  }\n  context.closePath();\n  context.fill();\n}\n\nfunction drawGraph() {\n  const canvas = $('graph-links');\n  const outer = $('graph').getBoundingClientRect();\n  const width = Math.round(outer.width);\n  const height = Math.round(outer.height);\n  if (!width || !height || !state.index) return;\n  const dpr = Math.min(window.devicePixelRatio || 1, 2, 3600 / Math.max(width, height));\n  canvas.width = Math.max(1, Math.round(width * dpr));\n  canvas.height = Math.max(1, Math.round(height * dpr));\n  const context = canvas.getContext('2d');\n  if (!context) return;\n  context.scale(dpr, dpr);\n  const positions = new Map([...$('graph-lanes').querySelectorAll('[data-asset]')].map(button => {\n    const box = button.getBoundingClientRect();\n    const left = box.left - outer.left;\n    const top = box.top - outer.top;\n    return [button.dataset.asset, { left, top, right: left + box.width, bottom: top + box.height, width: box.width, height: box.height }];\n  }));\n  const stack = window.matchMedia('(max-width:660px)').matches;\n  for (const link of getVisibleLinks()) {\n    const from = positions.get(link.fromId);\n    const to = positions.get(link.toId);\n    if (!from || !to) continue;\n    drawConnection(context, from, to, link.type, link.relevant, link.highlight, stack);\n  }\n}\n\nlet scheduledFrame = 0;\nfunction queueGraph() {\n  if (!scheduledFrame) scheduledFrame = requestAnimationFrame(() => {\n    scheduledFrame = 0;\n    drawGraph();\n  });\n}\n\nfunction displayFields(asset) {\n  const refs = asset.fields.map(field => `${asset.id}.${field.id}`);\n  const root = refs.filter(ref => state.index.roots.has(ref));\n  const impacted = refs.filter(ref => state.index.impacts.has(ref) && !state.index.roots.has(ref));\n  const other = refs.filter(ref => !state.index.roots.has(ref) && !state.index.impacts.has(ref));\n  return [...root, ...impacted, ...other];\n}\n\nfunction renderPaths(ref) {\n  const heading = $('path-heading');\n  const count = $('path-count');\n  const target = $('path-list');\n  const rootInfo = state.index.roots.get(ref);\n  const impact = state.index.impacts.get(ref);\n  const { field } = state.index.fields.get(ref);\n  $('field-detail').textContent = `${field.name} · ${field.type} · ${field.nullable ? '可为空' : '非空'}`;\n  if (!impact) {\n    heading.textContent = rootInfo ? '变更字段' : '影响证据';\n    count.textContent = '';\n    const message = rootInfo\n      ? `${fieldChangeText(rootInfo)}。${rootInfo.status === 'clear' ? '在当前目录中未发现下游依赖。' : '可在图中选择下游资产复核路径。'}`\n      : '当前变更的影响路径未到达此字段。';\n    const nodes = [element('p', 'evidence-empty', message)];\n    if (state.view === 'all' && field.inputs.length) {\n      heading.textContent = '字段上游';\n      count.textContent = `${field.inputs.length} 条依赖`;\n      nodes.push(renderSteps(field.inputs, 'field'));\n    }\n    target.replaceChildren(...nodes);\n    target.scrollTop = 0;\n    return;\n  }\n  heading.textContent = '影响证据';\n  count.textContent = `${impact.paths.length} 条来源路径 · 最短 ${impact.distance} 跳`;\n  const paths = impact.paths.map(path => {\n    const section = element('div', 'evidence-route');\n    section.append(element('code', 'route-root', path.root), renderSteps(path.steps, 'to'));\n    return section;\n  });\n  target.replaceChildren(...paths);\n  target.scrollTop = 0;\n}\n\nfunction renderSteps(steps, property) {\n  const list = element('ol', 'route');\n  for (const step of steps) {\n    const row = element('li');\n    row.dataset.edge = step.kind;\n    const kind = element('span', 'route-kind', RELATION[step.kind]);\n    kind.dataset.kind = step.kind;\n    row.append(element('code', '', step[property]), kind);\n    if (step.description) row.append(element('p', '', step.description));\n    list.append(row);\n  }\n  return list;\n}\n\nfunction renderInspector() {\n  const { assets, affected, rootAssets } = state.index;\n  const asset = assets.get(state.selectedAsset);\n  const status = affected.get(asset.id)?.status;\n  $('asset-kind').textContent = ASSET_KIND[asset.kind];\n  const flag = $('asset-status');\n  flag.dataset.tone = status || 'clear';\n  flag.textContent = rootAssets.has(asset.id) ? '变更起点' : status ? '受影响' : '未受此变更影响';\n  $('selected-asset').textContent = asset.name;\n  $('asset-ref').textContent = asset.id;\n  $('asset-owner').textContent = asset.owner;\n  $('asset-description').textContent = asset.description;\n  $('asset-description').hidden = !asset.description;\n  const buttons = displayFields(asset).map(ref => {\n    const item = button('', state.index.fields.get(ref).field.id);\n    item.dataset.field = ref;\n    item.title = state.index.fields.get(ref).field.name;\n    item.setAttribute('aria-pressed', String(ref === state.selectedField));\n    return item;\n  });\n  $('asset-fields').replaceChildren(...buttons);\n  renderPaths(state.selectedField);\n}\n\nfunction renderImpactList() {\n  const { result, index } = state;\n  $('affected-count').textContent = `${result.totals.directAssets} 项直接下游 · ${result.totals.indirectAssets} 项间接下游`;\n  const rows = result.assets.slice(0, state.limit).map(impact => {\n    const asset = index.assets.get(impact.id);\n    const row = button('impact-entry');\n    row.dataset.impact = asset.id;\n    row.setAttribute('aria-pressed', String(asset.id === state.selectedAsset));\n    const detail = element('span');\n    detail.append(element('strong', '', asset.name), element('small', '', `${ASSET_KIND[asset.kind]} · ${asset.owner} · ${impact.fields.length} 个受影响字段`));\n    row.append(detail, element('span', 'impact-flag', impact.distance === 1 ? '直接下游' : `${impact.distance} 跳下游`));\n    return row;\n  });\n  $('impact-list').replaceChildren(...(rows.length ? rows : [element('p', 'evidence-empty', '当前目录中没有已知的受影响资产。')]));\n  $('more-impacts').hidden = result.assets.length \u003c= state.limit;\n}\n\nfunction selectAsset(assetId, focus = false) {\n  if (!state.index.assets.has(assetId)) return;\n  state.selectedAsset = assetId;\n  state.selectedField = displayFields(state.index.assets.get(assetId))[0];\n  for (const node of $('graph-lanes').querySelectorAll('[data-asset]')) {\n    node.setAttribute('aria-pressed', String(assetId === node.dataset.asset));\n  }\n  for (const node of $('impact-list').querySelectorAll('[data-impact]')) {\n    node.setAttribute('aria-pressed', String(assetId === node.dataset.impact));\n  }\n  renderInspector();\n  queueGraph();\n  if (focus) $('selected-asset').focus();\n}\n\nfunction setScope(view) {\n  state.view = view;\n  const { rootAssets, affected } = state.index;\n  if (view === 'impact' && !rootAssets.has(state.selectedAsset) && !affected.has(state.selectedAsset)) {\n    selectAsset([...rootAssets][0]);\n  } else {\n    renderPaths(state.selectedField);\n  }\n  renderGraph();\n}\n\nfunction showWorkspace(workspace, example, preferredAsset = null) {\n  const result = analyzeImpact(workspace);\n  const index = indexWorkspace(workspace, result);\n  state.workspace = workspace;\n  state.result = result;\n  state.index = index;\n  state.example = example;\n  state.limit = PAGE_SIZE;\n  state.view = 'impact';\n  const known = index.rootAssets.has(preferredAsset) || index.affected.has(preferredAsset);\n  const dashboards = result.assets.filter(asset => index.assets.get(asset.id).kind === 'dashboard');\n  const aim = dashboards.at(-1)?.id ?? result.assets.at(-1)?.id ?? [...index.rootAssets][0];\n  state.selectedAsset = known ? preferredAsset : aim;\n  state.selectedField = displayFields(index.assets.get(state.selectedAsset))[0];\n  renderOverview();\n  renderGraph();\n  renderInspector();\n  renderImpactList();\n  $('graph-scroll').scrollTo(0, 0);\n}\n\nfunction downloadJson(value, filename) {\n  const blob = new Blob([`${JSON.stringify(value, null, 2)}\\n`], { type: 'application/json;charset=utf-8' });\n  const location = URL.createObjectURL(blob);\n  const link = element('a');\n  link.href = location;\n  link.download = filename;\n  document.body.append(link);\n  link.click();\n  link.remove();\n  setTimeout(() => URL.revokeObjectURL(location), 1_000);\n}\n\nfunction downloadReport() {\n  const { workspace, result, index } = state;\n  const assets = result.assets.map(impact => {\n    const asset = index.assets.get(impact.id);\n    return { ...impact, name: asset.name, kind: asset.kind, owner: asset.owner };\n  });\n  downloadJson({ catalog: workspace.catalog.name, proposal: workspace.proposal.name, status: result.status,\n    totals: result.totals, changes: result.changes, assets, impacts: result.impacts }, '字段变更影响报告.json');\n}\n\nasync function importWorkspace(event) {\n  const input = event.currentTarget;\n  const file = input.files[0];\n  input.value = '';\n  if (!file) return;\n  const token = ++state.importToken;\n  try {\n    if (file.size > MAX_INPUT_BYTES) throw new Error('请选择不超过 256 KiB 的 JSON 文件。');\n    const bytes = await file.arrayBuffer();\n    if (state.importToken !== token) return;\n    let text;\n    try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }\n    catch { throw new Error('文件需要使用 UTF-8 编码。'); }\n    showWorkspace(parseWorkspace(text), null);\n    announce(`已导入 ${file.name}。`);\n  } catch (error) {\n    if (state.importToken === token) announce(error.message || '读取工作区失败。', 'error');\n  }\n}\n\n$('case-switch').addEventListener('click', event => {\n  const id = event.target.closest('[data-case]')?.dataset.case;\n  if (!id || id === state.example) return;\n  state.importToken += 1;\n  showWorkspace(CASES[id], id);\n  announce();\n});\n$('graph-impact').addEventListener('click', () => setScope('impact'));\n$('graph-all').addEventListener('click', () => setScope('all'));\n$('graph-lanes').addEventListener('click', event => {\n  const id = event.target.closest('[data-asset]')?.dataset.asset;\n  if (id) selectAsset(id, window.matchMedia('(max-width:660px)').matches);\n});\n$('asset-fields').addEventListener('click', event => {\n  const ref = event.target.closest('[data-field]')?.dataset.field;\n  if (!ref || state.selectedField === ref) return;\n  state.selectedField = ref;\n  for (const control of $('asset-fields').querySelectorAll('[data-field]')) {\n    control.setAttribute('aria-pressed', String(control.dataset.field === ref));\n  }\n  renderPaths(ref);\n  queueGraph();\n});\n$('impact-list').addEventListener('click', event => {\n  const id = event.target.closest('[data-impact]')?.dataset.impact;\n  if (id) selectAsset(id, true);\n});\n$('more-impacts').addEventListener('click', () => {\n  const previous = state.limit;\n  state.limit += PAGE_SIZE;\n  renderImpactList();\n  $('impact-list').children[previous]?.focus();\n});\n$('download-report').addEventListener('click', downloadReport);\n$('download-workspace').addEventListener('click', () => downloadJson(state.workspace, '数据血缘工作区.json'));\n$('pick-workspace').addEventListener('click', () => $('import-workspace').click());\n$('import-workspace').addEventListener('change', importWorkspace);\nnew ResizeObserver(queueGraph).observe($('graph'));\n\nshowWorkspace(CASES[initialCase], initialCase, query.get('asset'));\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#0c1c29\">\n  \u003cmeta name=\"description\" content=\"从变更字段追踪下游依赖，复核受影响数据表、指标、看板和负责人。\">\n  \u003ctitle>数据血缘影响台\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip\" href=\"#graph-title\">跳到字段依赖\u003c/a>\n  \u003cheader class=\"mast\">\n    \u003cdiv class=\"shell mast-inner\">\n      \u003ca class=\"brand\" href=\"./index.html\">\u003cspan class=\"brand-icon\" aria-hidden=\"true\">\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003c/span>数据血缘影响台\u003c/a>\n      \u003cspan class=\"mast-area\">变更评审\u003c/span>\n      \u003cdiv class=\"files\">\n        \u003cbutton type=\"button\" class=\"button mast-button\" id=\"pick-workspace\">导入 JSON\u003c/button>\n        \u003cbutton type=\"button\" class=\"button mast-button\" id=\"download-workspace\" disabled>导出工作区\u003c/button>\n        \u003cinput id=\"import-workspace\" type=\"file\" accept=\".json,application/json\" hidden>\n      \u003c/div>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cmain class=\"shell\" id=\"main\">\n    \u003cdiv class=\"scenario-bar\">\n      \u003cnav class=\"case-switch\" aria-label=\"样例变更\" id=\"case-switch\">\n        \u003cbutton type=\"button\" id=\"case-drop\" data-case=\"drop\" aria-pressed=\"true\">金额字段退役\u003c/button>\n        \u003cbutton type=\"button\" id=\"case-unused\" data-case=\"unused\" aria-pressed=\"false\">清理闲置字段\u003c/button>\n        \u003cbutton type=\"button\" id=\"case-type\" data-case=\"type\" aria-pressed=\"false\">变更字段类型\u003c/button>\n      \u003c/nav>\n      \u003cspan class=\"catalog\" id=\"catalog-name\">\u003c/span>\n    \u003c/div>\n    \u003csection class=\"overview\" aria-labelledby=\"proposal-title\">\n      \u003cdiv class=\"proposal\">\n        \u003cdiv class=\"proposal-context\">\u003cspan class=\"proposal-origin\" id=\"workspace-origin\">合成样例\u003c/span>\u003cspan id=\"change-operation\" class=\"change-operation\">\u003c/span>\u003c/div>\n        \u003ch1 id=\"proposal-title\">变更影响评审\u003c/h1>\n        \u003cp id=\"change-fields\" class=\"proposal-fields\">\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"review\" id=\"review\" data-status=\"blocked\" aria-live=\"polite\">\n        \u003cdiv class=\"review-line\">\u003cspan class=\"review-label\">评审结论\u003c/span>\u003cstrong class=\"review-status\" id=\"review-status\">\u003c/strong>\u003c/div>\n        \u003cdl class=\"metrics\">\n          \u003cdiv>\u003cdt>受影响资产\u003c/dt>\u003cdd id=\"impact-total\">—\u003c/dd>\u003c/div>\n          \u003cdiv>\u003cdt>受影响字段\u003c/dt>\u003cdd id=\"field-total\">—\u003c/dd>\u003c/div>\n          \u003cdiv>\u003cdt>直接下游资产\u003c/dt>\u003cdd id=\"direct-total\">—\u003c/dd>\u003c/div>\n        \u003c/dl>\n        \u003cp id=\"review-note\" class=\"review-note\">\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"section-heading\">\n      \u003cdiv>\u003ch2 id=\"graph-title\" tabindex=\"-1\">字段依赖\u003c/h2>\u003cp>选择资产，查看字段、依赖路径和负责人。\u003c/p>\u003c/div>\n      \u003cbutton type=\"button\" class=\"button report-button\" id=\"download-report\" disabled>导出影响报告 \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/button>\n    \u003c/div>\n    \u003cp id=\"notice\" class=\"notice\" role=\"status\" hidden>\u003c/p>\n\n    \u003cdiv class=\"workspace\">\n      \u003csection class=\"diagram\" aria-label=\"字段依赖图\">\n        \u003cdiv class=\"diagram-toolbar\">\n          \u003cdiv class=\"graph-switch\" role=\"group\" aria-label=\"图谱范围\">\n            \u003cbutton type=\"button\" id=\"graph-impact\" aria-pressed=\"true\">只看影响\u003c/button>\n            \u003cbutton type=\"button\" id=\"graph-all\" aria-pressed=\"false\">完整血缘\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"graph-legend\" aria-label=\"图例\">\u003cspan>\u003ci class=\"value-line\">\u003c/i>值依赖\u003c/span>\u003cspan>\u003ci class=\"condition-line\">\u003c/i>条件依赖\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"graph-scroll\" id=\"graph-scroll\" tabindex=\"0\" aria-label=\"按影响距离浏览资产\">\n          \u003cdiv id=\"graph\" class=\"graph\" aria-label=\"血缘资产\">\u003ccanvas id=\"graph-links\" aria-hidden=\"true\">\u003c/canvas>\u003cdiv id=\"graph-lanes\" class=\"graph-lanes\">\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cp id=\"graph-note\" class=\"graph-note\">\u003c/p>\n      \u003c/section>\n\n      \u003csection id=\"inspector\" class=\"inspector\" aria-labelledby=\"selected-asset\">\n        \u003cdiv class=\"inspector-head\">\n          \u003cdiv class=\"asset-kicker\">\u003cspan id=\"asset-kind\">\u003c/span>\u003cspan id=\"asset-status\" class=\"asset-status\">\u003c/span>\u003c/div>\n          \u003ch2 id=\"selected-asset\" tabindex=\"-1\">资产详情\u003c/h2>\n          \u003cp id=\"asset-ref\" class=\"asset-ref\">\u003c/p>\n          \u003cdl class=\"asset-owner\">\u003cdt>负责人\u003c/dt>\u003cdd id=\"asset-owner\">\u003c/dd>\u003c/dl>\n          \u003cp id=\"asset-description\" class=\"asset-description\">\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"inspector-body\">\n          \u003ch3 id=\"field-heading\">关联字段\u003c/h3>\n          \u003cdiv class=\"field-switch\" id=\"asset-fields\" role=\"group\" aria-labelledby=\"field-heading\">\u003c/div>\n          \u003cp class=\"field-detail\" id=\"field-detail\">\u003c/p>\n          \u003cdiv class=\"path-heading\">\u003ch3 id=\"path-heading\">影响证据\u003c/h3>\u003cspan id=\"path-count\">\u003c/span>\u003c/div>\n          \u003cdiv id=\"path-list\" class=\"path-list\" aria-labelledby=\"path-heading\">\u003c/div>\n        \u003c/div>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"affected\" aria-labelledby=\"affected-title\">\n      \u003cdiv class=\"affected-header\">\u003ch2 id=\"affected-title\">受影响清单\u003c/h2>\u003cp id=\"affected-count\">\u003c/p>\u003c/div>\n      \u003cdiv id=\"impact-list\" class=\"impact-list\">\u003c/div>\n      \u003cbutton type=\"button\" id=\"more-impacts\" class=\"button more-impacts\" hidden>显示更多资产\u003c/button>\n    \u003c/section>\n    \u003cfooter class=\"foot\">在当前浏览器内分析导入的元数据，可导出报告供复核。\u003c/footer>\n  \u003c/main>\n  \u003cnoscript>\u003cp class=\"shell\">请启用 JavaScript，在当前页面计算字段影响范围。\u003c/p>\u003c/noscript>\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --paper: #f1f0e9;\n  --surface: #fcfaf4;\n  --ink: #192c38;\n  --muted: #5b686b;\n  --rule: #dadcd3;\n  --nav: #0c1c29;\n  --night: #102637;\n  --night-rule: #3a5364;\n  --night-text: #e6f0ec;\n  --night-muted: #adbec4;\n  --amber: #efaf70;\n  --warn: #854016;\n  --warn-bg: #fae9d6;\n  --safe: #226a61;\n  --safe-bg: #e4efea;\n  --heading: 'Noto Serif CJK SC', 'Source Han Serif SC', 'Songti SC', STSong, SimSun, serif;\n  --body: 'PingFang SC', 'Microsoft YaHei UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;\n  --mono: 'Cascadia Mono', Consolas, 'Courier New', monospace;\n  font: 14px/1.5 var(--body);\n}\n*, *::after, *::before { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody { margin: 0; background: var(--paper); color: var(--ink); }\nh1, h2, h3, p, ul, ol, dl, dd { margin: 0; }\nbutton { cursor: pointer; font: inherit; }\nbutton:disabled { cursor: default; opacity: .58; }\nbutton:focus-visible, a:focus-visible, summary:focus-visible, [tabindex='0']:focus-visible { outline: 2px solid #10736c; outline-offset: 3px; }\n.mast :focus-visible, .diagram :focus-visible { outline-color: #ffbc7b; }\nbutton:focus:not(:focus-visible), [tabindex='-1']:focus { outline: none; }\n.shell { width: min(1424px, 100% - 72px); margin-inline: auto; }\n.skip { position: absolute; inset: 8px auto auto 9px; transform: translateY(-160%); background: var(--surface); color: var(--ink); padding: 8px 12px; z-index: 15; }\n.skip:focus { transform: none; }\n.mast { color: #edf3f0; background: var(--nav); border-bottom: 1px solid #3f5860; }\n.mast-inner { display: flex; min-height: 61px; align-items: center; gap: 17px; }\n.brand { display: inline-flex; align-items: center; gap: 9px; color: inherit; text-decoration: none; white-space: nowrap; font-weight: 690; letter-spacing: .045em; }\n.brand-icon { display: grid; grid-template-columns: repeat(2, 5px); grid-template-rows: repeat(2, 5px); place-content: center; gap: 3px; width: 29px; height: 29px; background: #26404b; border: 1px solid #507080; border-radius: 5px; }\n.brand-icon b { background: #a4c7ba; border-radius: 1px; }\n.brand-icon b:first-child { grid-row: span 2; height: 5px; align-self: center; background: #ffba76; position: relative; }\n.brand-icon b:first-child::after { content: ''; position: absolute; right: -4px; top: 2px; width: 4px; height: 1px; background: #d5c3a0; }\n.mast-area { padding-left: 15px; border-left: 1px solid #4c626b; color: #b9c9c7; font-size: 12px; white-space: nowrap; }\n.files { margin-left: auto; display: flex; gap: 7px; }\n.button { min-height: 36px; padding: 7px 12px; border: 1px solid #adbbb8; border-radius: 6px; color: var(--ink); background: var(--surface); font-weight: 650; white-space: nowrap; }\n.button:not(:disabled):hover { background: #e8eeea; border-color: #819a9a; }\n.mast-button { min-height: 32px; padding: 5px 10px; font-size: 12px; color: #e6eeeb; background: #203442; border-color: #4b626e; }\n.mast-button:not(:disabled):hover { color: #fff; background: #304a54; border-color: #7c9aa3; }\n\n.scenario-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 23px; margin-bottom: 14px; }\n.case-switch { display: flex; gap: 4px; min-width: 0; align-items: center; flex-wrap: wrap; }\n.case-switch button { border: 1px solid transparent; border-radius: 5px; padding: 5px 10px; color: #526367; background: transparent; font-size: 12px; font-weight: 650; white-space: nowrap; }\n.case-switch button[aria-pressed='true'] { color: #143943; background: #e1ebe7; border-color: #b8cbc6; }\n.case-switch button:hover { color: #1a434b; background: #e7ebe3; }\n.catalog { color: #566569; font-size: 12px; text-align: right; overflow-wrap: anywhere; }\n.overview { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 24px; border-block: 1px solid #bcc6c0; padding-block: 20px 22px; align-items: center; }\n.proposal-context { display: flex; gap: 8px; align-items: center; color: #536264; font-size: 11px; font-weight: 660; flex-wrap: wrap; }\n.proposal-origin { padding: 2px 6px; color: #3a5757; background: #e5ece5; border: 1px solid #c8d2ca; border-radius: 4px; }\n.change-operation:not(:empty) { margin-left: 2px; }\n.proposal h1 { margin-block: 5px 7px; max-width: 22ch; font: 750 clamp(30px, 3.1vw, 50px)/1.22 var(--heading); letter-spacing: .035em; text-wrap: balance; overflow-wrap: anywhere; }\n.proposal-fields { display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: center; font-size: 12px; overflow-wrap: anywhere; }\n.proposal-fields code { font: 650 12px/1.7 var(--mono); color: #2b5456; background: #e7ede5; padding: 1px 5px; border-radius: 3px; }\n.review { min-width: 0; background: var(--surface); border: 1px solid #d1d8cf; border-left: 3px solid #b8713e; border-radius: 7px; padding: 10px 15px; }\n.review[data-status='review'] { border-left-color: #a7812e; }\n.review[data-status='clear'] { border-left-color: #3c8b77; }\n.review-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }\n.review-label { color: #516064; font-size: 12px; font-weight: 680; }\n.review-status { color: var(--warn); background: var(--warn-bg); border: 1px solid #eac6a5; border-radius: 4px; padding: 1px 6px; font-size: 11px; }\n.review[data-status='review'] .review-status { color: #6e521a; background: #f7edd0; border-color: #e4d4a2; }\n.review[data-status='clear'] .review-status { color: var(--safe); background: var(--safe-bg); border-color: #b4d3c6; }\n.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 7px; }\n.metrics div { display: flex; flex-direction: column-reverse; gap: 2px; }\n.metrics div + div { border-left: 1px solid #d5dcd2; padding-left: 11px; }\n.metrics dt { color: var(--muted); font-size: 11px; }\n.metrics dd { font: 630 clamp(24px, 2.8vw, 38px)/1 var(--mono); letter-spacing: -.075em; font-variant-numeric: tabular-nums; }\n.review-note { margin-top: 7px; color: var(--muted); font-size: 11px; }\n\n.section-heading { display: flex; justify-content: space-between; gap: 14px; align-items: end; margin-block: 22px 11px; }\n.section-heading h2, .affected h2 { font: 700 26px/1.22 var(--heading); }\n.section-heading p, .affected-header p { margin-top: 4px; color: var(--muted); font-size: 12px; }\n.report-button { color: #f2f5ee; background: #1e4951; border-color: #385d65; }\n.report-button:not(:disabled):hover { color: #fff; background: #28616a; }\n.notice { padding: 7px 11px; margin-bottom: 9px; border: 1px solid #c3d6cb; border-radius: 6px; background: #edf2ea; color: #2d6058; font-size: 12px; overflow-wrap: anywhere; }\n.notice[data-tone='error'] { color: var(--warn); background: var(--warn-bg); border-color: #e4c2a6; }\n\n.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(265px, 324px); gap: 12px; align-items: stretch; }\n.diagram, .inspector, .affected { min-width: 0; border-radius: 8px; }\n.diagram { background: var(--night); color: var(--night-text); border: 1px solid #415664; overflow: hidden; }\n.diagram-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 13px; gap: 8px; border-bottom: 1px solid #385463; }\n.graph-switch { display: inline-flex; padding: 3px; border-radius: 5px; background: #0a2030; border: 1px solid #3c5664; gap: 2px; }\n.graph-switch button { border: 1px solid transparent; border-radius: 3px; padding: 3px 8px; background: transparent; color: #b8c9ca; font-size: 11px; white-space: nowrap; }\n.graph-switch button[aria-pressed='true'] { border-color: #607d85; background: #244453; color: #f2f8ee; }\n.graph-switch button:hover { color: #ffffff; }\n.graph-legend { display: flex; justify-content: end; align-items: center; flex-wrap: wrap; gap: 3px 12px; color: #c5d5d3; font-size: 10px; }\n.graph-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }\n.graph-legend i { display: block; width: 14px; border-top: 2px solid #bd8453; }\n.graph-legend .condition-line { border-top-style: dashed; border-top-color: #b4bc83; }\n.graph-scroll { overflow: auto; min-height: 368px; max-height: 570px; scrollbar-color: #56717d #0f2736; }\n.graph { position: relative; min-height: 368px; min-width: 100%; width: max-content; isolation: isolate; }\n.graph canvas { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; pointer-events: none; }\n.graph-lanes { min-height: 368px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(108px, 1fr); gap: 29px; padding: 18px 14px 22px; }\n.lane { width: max(108px, min(12vw, 161px)); min-width: 0; }\n.lane-title { display: flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 0 5px; color: #b9cacd; border-bottom: 1px solid #476170; font-size: 11px; font-weight: 620; white-space: nowrap; }\n.lane-title::before { content: ''; width: 3px; height: 3px; border-radius: 50%; background: #8da9a7; }\n.lane-nodes { display: flex; flex-direction: column; gap: 23px; padding-top: 22px; }\n.node { display: block; width: 100%; min-width: 0; min-height: 66px; padding: 7px 7px 8px; border: 1px solid #657477; border-left: 2px solid #7f9699; border-radius: 5px; color: #e8f2eb; background: #1b3a4b; text-align: left; position: relative; }\n.node:hover { border-color: #a4b9b4; background: #24495a; }\n.node[data-tone='blocked'] { border-left-color: #dd9b62; }\n.node[data-tone='review'] { border-left-color: #dbb56b; }\n.node[data-tone='root'] { border-left-color: #90cdc0; background: #224755; }\n.node[data-tone='clear'] { border-left-color: #88c7bc; }\n.node[aria-pressed='true'] { border-color: #ecc28f; background: #294b5a; box-shadow: 0 0 0 1px #efd1a746; }\n.node[data-tone='clear'][aria-pressed='true'], .node[data-tone='root'][aria-pressed='true'] { border-color: #8dc7b7; }\n.node-kind { display: block; color: #c7d6ce; font-size: 9px; font-weight: 650; letter-spacing: .04em; }\n.node-name { display: block; margin-top: 2px; font-size: 12px; font-weight: 680; line-height: 1.4; overflow-wrap: anywhere; }\n.node-ref { display: block; margin-top: 2px; color: #b0c5c8; font: 10px/1.3 var(--mono); overflow-wrap: anywhere; }\n.node[aria-pressed='true'] .node-ref { color: #dde7dd; }\n.graph-note { border-top: 1px solid #385463; color: #b7c9c9; padding: 8px 13px; font-size: 11px; }\n\n.inspector { background: var(--surface); border: 1px solid #ced6cf; box-shadow: 0 10px 24px #2639430e; overflow: hidden; }\n.inspector-head, .inspector-body { padding: 14px 15px; }\n.inspector-head { border-bottom: 1px solid #d9ded4; background: #f5f4eb; }\n.asset-kicker { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 660; color: #466368; }\n.asset-status { padding: 1px 6px; border: 1px solid #d1dbd1; border-radius: 4px; color: #416661; background: #e7eee6; text-align: right; }\n.asset-status[data-tone='blocked'] { color: var(--warn); background: var(--warn-bg); border-color: #ecccac; }\n.asset-status[data-tone='review'] { color: #6b5219; background: #f7edcf; border-color: #e9d9aa; }\n#selected-asset { margin-top: 3px; font: 750 25px/1.18 var(--heading); overflow-wrap: anywhere; }\n.asset-ref { margin-top: 4px; color: #536d70; font: 11px/1.4 var(--mono); overflow-wrap: anywhere; }\n.asset-owner { display: flex; align-items: start; gap: 8px; margin-top: 8px; font-size: 11px; }\n.asset-owner dt { color: var(--muted); white-space: nowrap; }\n.asset-owner dd { margin: 0; color: #334d50; font-weight: 650; overflow-wrap: anywhere; }\n.asset-description { color: var(--muted); font-size: 11px; margin-top: 4px; overflow-wrap: anywhere; }\n.inspector h3 { font-size: 12px; font-weight: 700; }\n.field-switch { display: flex; flex-wrap: wrap; margin-top: 6px; gap: 5px; max-height: 91px; overflow: auto; }\n.field-switch button { border: 1px solid #d3dbd2; border-radius: 4px; padding: 3px 5px; color: #425f62; background: #f8faf3; font: 11px/1.35 var(--mono); overflow-wrap: anywhere; max-width: 100%; }\n.field-switch button[aria-pressed='true'] { border-color: #8fb1a6; color: #154640; background: #e2ece5; }\n.field-switch button:hover { color: #123532; background: #e6ede3; }\n.field-detail { margin-top: 5px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }\n.path-heading { display: flex; justify-content: space-between; align-items: end; gap: 7px; margin-top: 12px; margin-bottom: 4px; }\n#path-count { color: var(--muted); font-size: 10px; text-align: right; }\n.path-list { max-height: 298px; overflow: auto; scrollbar-width: thin; }\n.evidence-empty { color: var(--muted); font-size: 11px; line-height: 1.55; }\n.evidence-route + .evidence-route { border-top: 1px solid #d8e0d6; margin-top: 10px; padding-top: 7px; }\n.route-root { display: block; margin-bottom: 5px; color: #234d50; font: 650 10px/1.4 var(--mono); overflow-wrap: anywhere; }\n.route { list-style: none; padding: 0 0 0 6px; margin: 0 0 0 4px; border-left: 1px solid #bdcfc6; }\n.route li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 1px 5px; padding: 3px 0 5px 6px; font-size: 10px; }\n.route li::before { content: ''; position: absolute; left: -9px; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: #8cafa3; }\n.route code { color: #28575c; font: 650 10px/1.4 var(--mono); overflow-wrap: anywhere; }\n.route-kind { white-space: nowrap; color: #76562f; font-size: 9px; background: #f3e6d5; border-radius: 3px; padding: 0 3px; }\n.route-kind[data-kind='filter'], .route-kind[data-kind='join'], .route-kind[data-kind='group'] { color: #4f622e; background: #ebedd9; }\n.route p { grid-column: 1/-1; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }\n\n.affected { margin-top: 14px; padding: 13px 15px 11px; background: var(--surface); border: 1px solid #d1dbd0; }\n.affected-header { display: flex; justify-content: space-between; align-items: end; gap: 8px; margin-bottom: 8px; }\n.affected h2 { font-size: 22px; }\n.impact-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 10px; }\n.impact-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1px 8px; width: 100%; min-width: 0; text-align: left; padding: 5px 8px; border: 1px solid #d9e0d6; border-radius: 5px; background: #f8f8ee; color: #233c43; }\n.impact-entry:hover, .impact-entry[aria-pressed='true'] { background: #e9efe5; border-color: #b4c9bb; }\n.impact-entry strong { display: block; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }\n.impact-entry small { display: block; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }\n.impact-flag { color: #79532d; background: #f5ead8; padding: 2px 5px; font-size: 10px; white-space: nowrap; border-radius: 3px; }\n.more-impacts { margin-top: 8px; }\n.foot { padding: 13px 0 20px; color: var(--muted); font-size: 10px; }\n\n@media(max-width: 1180px) {\n  .shell { width: min(100% - 48px, 1424px); }\n  .graph-lanes { gap: 22px; }\n  .lane { width: max(106px, min(11vw, 134px)); }\n  .workspace { grid-template-columns: minmax(0, 1fr) minmax(245px, 290px); }\n}\n@media(max-width: 930px) {\n  .workspace { grid-template-columns: minmax(0, 1fr); }\n  .inspector { display: grid; grid-template-columns: minmax(170px, .55fr) minmax(0, 1fr); }\n  .inspector-head { border-bottom: none; border-right: 1px solid #d9ded4; }\n  .graph-lanes { gap: 20px; }\n  .lane { width: max(104px, min(11vw, 125px)); }\n  .graph-scroll, .graph, .graph-lanes { min-height: 305px; }\n}\n@media(max-width: 660px) {\n  .shell { width: calc(100% - 28px); }\n  .mast-inner { min-height: 48px; gap: 8px; }\n  .mast-area { display: none; }\n  .brand { font-size: 12px; gap: 6px; }\n  .brand-icon { width: 23px; height: 23px; }\n  .mast-button { min-height: 30px; padding: 4px 6px; font-size: 10px; }\n  .files { gap: 3px; }\n  .scenario-bar { flex-direction: column; align-items: start; gap: 5px; margin-block: 13px 9px; }\n  .catalog { font-size: 10px; text-align: left; padding-left: 2px; }\n  .case-switch button { padding: 4px 6px; font-size: 11px; }\n  .overview { grid-template-columns: minmax(0, 1fr); gap: 11px; padding-block: 11px 13px; }\n  .proposal h1 { font-size: clamp(25px, 7.3vw, 33px); }\n  .proposal-fields code { font-size: 11px; }\n  .review { padding: 8px 10px; }\n  .metrics dd { font-size: 25px; }\n  .section-heading { margin-block: 15px 8px; align-items: start; }\n  .section-heading h2 { font-size: 21px; }\n  .section-heading p { font-size: 10px; }\n  .report-button { min-height: 31px; padding: 4px 7px; font-size: 11px; }\n  .diagram-toolbar { padding: 7px; }\n  .graph-legend { gap: 2px 5px; font-size: 9px; }\n  .graph-legend i { width: 9px; }\n  .graph-scroll, .graph, .graph-lanes { min-height: 0; }\n  .graph-scroll { max-height: 490px; }\n  .graph { width: 100%; }\n  .graph-lanes { display: grid; grid-auto-flow: row; grid-auto-columns: 1fr; gap: 7px; padding: 9px 8px; }\n  .lane { width: 100%; display: grid; grid-template-columns: 67px minmax(0, 1fr); align-items: start; gap: 6px; }\n  .lane-title { border-bottom: 0; display: block; padding: 5px 0 0; font-size: 10px; }\n  .lane-title::before { display: inline-block; margin-right: 4px; vertical-align: middle; }\n  .lane-nodes { min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; padding-top: 0; }\n  .node { padding: 5px 5px 6px; min-height: 48px; }\n  .node-kind { font-size: 8px; }\n  .node-name { font-size: 11px; }\n  .node-ref { font-size: 9px; }\n  .node:only-child { grid-column: 1/-1; }\n  .graph-note { padding: 5px 8px; }\n  .inspector { display: block; }\n  .inspector-head { border-right: none; border-bottom: 1px solid #d9ded4; }\n  .inspector-head, .inspector-body { padding: 10px 11px; }\n  .impact-list { grid-template-columns: minmax(0, 1fr); }\n}\n@media(max-width: 355px) {\n  .brand { font-size: 11px; }\n  .brand-icon { width: 19px; height: 19px; }\n  .section-heading p { font-size: 9px; }\n  .graph-legend span { gap: 2px; }\n  .graph-switch button { padding-inline: 5px; }\n}\n","group":"前端"},{"path":"tests/cli.test.mjs","text":"import assert from 'node:assert/strict';\nimport { spawnSync } from 'node:child_process';\nimport { mkdtemp, readFile, rm, stat, writeFile } from 'node:fs/promises';\nimport { tmpdir } from 'node:os';\nimport { dirname, join, resolve } from 'node:path';\nimport test from 'node:test';\nimport { fileURLToPath } from 'node:url';\nimport { MAX_INPUT_BYTES } from '../engine.mjs';\nimport { DEMO_DROP } from '../fixtures.mjs';\n\nconst cli = fileURLToPath(new URL('../cli.mjs', import.meta.url));\n\nfunction run(...args) {\n  const processResult = spawnSync(process.execPath, [cli, ...args], {\n    encoding: 'utf8', timeout: 5_000,\n  });\n  assert.ifError(processResult.error);\n  assert.equal(processResult.signal, null);\n  return processResult;\n}\n\nasync function temporary(t) {\n  const path = await mkdtemp(join(tmpdir(), 'data-lineage-cli-'));\n  assert.equal(dirname(path), resolve(tmpdir()));\n  t.after(() => rm(path, { recursive: true, force: true }));\n  return path;\n}\n\nfunction field(workspace, assetId, fieldId) {\n  return workspace.catalog.assets.find(asset => asset.id === assetId).fields.find(item => item.id === fieldId);\n}\n\ntest('the built-in proposals return distinct exit codes and trace real downstream evidence', () => {\n  const drop = run('--demo');\n  assert.equal(drop.status, 2, drop.stderr);\n  assert.equal(drop.stderr, '');\n  assert.equal(drop.stdout, run('--demo', '--case', 'drop').stdout);\n  const report = JSON.parse(drop.stdout);\n  assert.equal(report.status, 'blocked');\n  assert.equal(report.totals.changed, 1);\n  assert.equal(report.totals.impactedAssets, 6);\n  assert.equal(report.changes[0].field, 'orders_raw.amount_cents');\n  const trip = report.impacts.find(item => item.field === 'dashboard_trade.revenue');\n  assert.equal(trip.distance, 4);\n  assert.equal(trip.paths[0].steps.length, 4);\n  assert.equal(trip.paths[0].steps[0].from, 'orders_raw.amount_cents');\n  assert.equal(trip.paths[0].steps.at(-1).to, 'dashboard_trade.revenue');\n  const filter = report.impacts.find(item => item.field === 'finance_review.large_order_id');\n  assert.equal(filter.paths[0].steps[0].kind, 'filter');\n\n  const unused = run('--demo', '--case', 'unused');\n  assert.equal(unused.status, 0, unused.stderr);\n  const clear = JSON.parse(unused.stdout);\n  assert.equal(clear.status, 'clear');\n  assert.equal(clear.totals.impactedFields, 0);\n\n  const type = run('--demo', '--case', 'type');\n  assert.equal(type.status, 3, type.stderr);\n  const needsReview = JSON.parse(type.stdout);\n  assert.equal(needsReview.status, 'review');\n  assert.equal(needsReview.totals.impactedAssets, report.totals.impactedAssets);\n  assert.equal(needsReview.changes[0].op, 'type');\n});\n\ntest('a UTF-8 JSON import with BOM can export the same report even when the change is blocked', async t => {\n  const root = await temporary(t);\n  const input = join(root, '工作区.json');\n  const output = join(root, '影响报告.json');\n  const original = '\\ufeff' + JSON.stringify(DEMO_DROP);\n  await writeFile(input, original, 'utf8');\n  const result = run('--input', input, '--out', output);\n  assert.equal(result.status, 2, result.stderr);\n  assert.equal(JSON.parse(result.stdout).status, 'blocked');\n  assert.equal(await readFile(output, 'utf8'), result.stdout);\n  assert.equal(await readFile(input, 'utf8'), original);\n});\n\ntest('an existing report or a report path equal to the input is never overwritten', async t => {\n  const root = await temporary(t);\n  const input = join(root, 'catalog.json');\n  const existing = join(root, 'existing.json');\n  const contents = JSON.stringify(DEMO_DROP);\n  await writeFile(input, contents);\n  await writeFile(existing, 'existing bytes');\n  for (const [destination, expected] of [[existing, 'existing bytes'], [input, contents]]) {\n    const result = run('--input', input, '--out', destination);\n    assert.equal(result.status, 1);\n    assert.equal(result.stdout, '');\n    assert.match(result.stderr, /输出已存在/);\n    assert.equal(await readFile(destination, 'utf8'), expected);\n  }\n});\n\ntest('invalid graphs from JSON reject missing references and cycles before writing a report', async t => {\n  const root = await temporary(t);\n  const input = join(root, 'invalid.json');\n  const output = join(root, 'report.json');\n  const dangling = structuredClone(DEMO_DROP);\n  field(dangling, 'fact_orders', 'net_amount').inputs[0].field = 'missing_asset.field';\n  const cycle = structuredClone(DEMO_DROP);\n  field(cycle, 'orders_raw', 'amount_cents').inputs.push({\n    field: 'dashboard_trade.revenue', kind: 'value', description: '测试闭环',\n  });\n  for (const [workspace, pattern] of [[dangling, /缺失|未找到|不存在|无法找到|找不到/], [cycle, /环|循环/]]) {\n    await writeFile(input, JSON.stringify(workspace));\n    const result = run('--input', input, '--out', output);\n    assert.equal(result.status, 1);\n    assert.equal(result.stdout, '');\n    assert.match(result.stderr, pattern);\n    await assert.rejects(stat(output), { code: 'ENOENT' });\n  }\n});\n\ntest('malformed JSON, invalid UTF-8 and limits fail without returning a partial report', async t => {\n  const root = await temporary(t);\n  const input = join(root, 'invalid.json');\n  const output = join(root, 'report.json');\n  const cases = [\n    ['{\"name\":not-json}', /JSON/],\n    [Buffer.from([0x22, 0xff, 0x22]), /UTF-8/],\n    [Buffer.alloc(MAX_INPUT_BYTES + 1, 0x20), /256 KiB/],\n  ];\n  for (const [payload, pattern] of cases) {\n    await writeFile(input, payload);\n    const result = run('--input', input, '--out', output);\n    assert.equal(result.status, 1);\n    assert.equal(result.stdout, '');\n    assert.match(result.stderr, pattern);\n    assert.doesNotMatch(result.stderr, /not-json/);\n  }\n  await assert.rejects(stat(output), { code: 'ENOENT' });\n});\n\ntest('help presents all statuses and unsupported flag combinations are not accepted', () => {\n  const help = run('--help');\n  assert.equal(help.status, 0);\n  assert.match(help.stdout, /2 表示阻断，3 表示待复核/);\n  assert.match(help.stdout, /drop\\|unused\\|type/);\n  for (const args of [[], ['--demo', '--bogus'], ['--demo', '--out'], ['--demo', '--demo'],\n    ['--demo', '--input', 'file.json'], ['--input', 'file.json', '--case', 'unused'],\n    ['--demo', '--case'], ['--demo', '--case', 'unknown']]) {\n    const result = run(...args);\n    assert.equal(result.status, 1, args.join(' '));\n    assert.equal(result.stdout, '');\n    assert.notEqual(result.stderr, '');\n  }\n});\n","group":"验收测试"},{"path":"tests/engine.test.mjs","text":"import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { analyzeImpact, MAX_INPUT_BYTES, parseWorkspace } from '../engine.mjs';\nimport { DEMO_DROP, DEMO_TYPE, DEMO_UNUSED } from '../fixtures.mjs';\n\nconst input = (field, kind = 'value') => ({ field, kind, description: '样例关系' });\nconst makeField = (id, inputs = []) => ({ id, name: id, type: 'bigint', nullable: false, inputs });\nconst makeAsset = (id, fields) => ({ id, name: id, kind: 'model', owner: '样例组', description: '', fields });\n\nfunction workspace(assets, changes) {\n  return { catalog: { name: '样例目录', assets }, proposal: { name: '样例变更', changes } };\n}\n\nfunction findField(data, ref) {\n  const [asset, field] = ref.split('.');\n  return data.catalog.assets.find(item => item.id === asset).fields.find(item => item.id === field);\n}\n\ntest('dropping the payment field blocks six assets and distinguishes the fields they use', () => {\n  const result = analyzeImpact(DEMO_DROP);\n  assert.equal(result.status, 'blocked');\n  assert.deepEqual(result.totals, { changed: 1, impactedFields: 8, impactedAssets: 6, directAssets: 2, indirectAssets: 4 });\n  assert.deepEqual(result.changes, [{ field: 'orders_raw.amount_cents', op: 'drop', before: { type: 'bigint', nullable: false }, after: null, status: 'blocked' }]);\n  assert.deepEqual(result.assets.find(asset => asset.id === 'dashboard_trade').fields, ['dashboard_trade.revenue']);\n  assert(!result.assets.some(asset => asset.id === 'dashboard_support'));\n  assert.deepEqual(result.impacts.find(impact => impact.field === 'dashboard_trade.revenue').paths[0].steps.map(step => step.to), [\n    'fact_orders.net_amount', 'daily_revenue.gross_revenue', 'metric_revenue.sales_total', 'dashboard_trade.revenue',\n  ]);\n});\n\ntest('non-value edges transmit impact, retaining each relation and its context', () => {\n  const result = analyzeImpact(DEMO_DROP);\n  const path = result.impacts.find(impact => impact.field === 'dashboard_finance.large_orders').paths[0];\n  assert.equal(path.root, 'orders_raw.amount_cents');\n  assert.deepEqual(path.steps.map(step => step.kind), ['filter', 'value']);\n  assert.match(path.steps[0].description, /100000 分/u);\n  assert(result.edges.some(edge => edge.from === 'rates_daily.rate_day' && edge.kind === 'join'));\n  assert(result.edges.some(edge => edge.from === 'fact_orders.order_day' && edge.kind === 'group'));\n});\n\ntest('type and nullability changes require review only where known dependencies exist', () => {\n  for (const change of [DEMO_TYPE.proposal.changes[0], { field: 'orders_raw.amount_cents', op: 'nullable', to: true }]) {\n    const data = structuredClone(DEMO_TYPE);\n    data.proposal.changes = [change];\n    const result = analyzeImpact(data);\n    assert.equal(result.status, 'review');\n    assert.equal(result.changes[0].after[change.op], change.to);\n    assert(result.impacts.every(impact => impact.status === 'review'));\n  }\n  const result = analyzeImpact(DEMO_UNUSED);\n  assert.equal(result.status, 'clear');\n  assert.equal(result.totals.impactedFields, 0);\n  assert.equal(result.totals.impactedAssets, 0);\n  assert(result.edges.length > 0);\n});\n\ntest('diamond dependencies retain one deterministic shortest path per root', () => {\n  const data = workspace([\n    makeAsset('d', [makeField('z', [input('c.q'), input('b.p')])]),\n    makeAsset('a', [makeField('x')]),\n    makeAsset('c', [makeField('q', [input('a.x')])]),\n    makeAsset('b', [makeField('p', [input('a.x')])]),\n  ], [{ field: 'a.x', op: 'drop' }]);\n  const analyze = () => analyzeImpact(data).impacts.find(impact => impact.field === 'd.z').paths;\n  assert.deepEqual(analyze().map(path => path.steps.map(step => step.to)), [['b.p', 'd.z']]);\n  data.catalog.assets.reverse();\n  assert.deepEqual(analyze().map(path => path.steps.map(step => step.to)), [['b.p', 'd.z']]);\n  findField(data, 'd.z').inputs.push(input('a.x', 'join'));\n  assert.deepEqual(analyze().map(path => path.steps.map(step => step.kind)), [['join']]);\n});\n\ntest('overlapping proposals count endpoints once while retaining root-specific evidence', () => {\n  const data = workspace([\n    makeAsset('a', [makeField('x'), makeField('y'), makeField('z')]),\n    makeAsset('b', [makeField('p', [input('a.x')])]),\n    makeAsset('c', [makeField('q', [input('a.y'), input('b.p')])]),\n  ], [\n    { field: 'a.x', op: 'drop' }, { field: 'a.y', op: 'type', to: 'string' }, { field: 'a.z', op: 'drop' },\n  ]);\n  const result = analyzeImpact(data);\n  assert.equal(result.status, 'blocked');\n  assert.deepEqual(result.changes.map(change => change.status), ['blocked', 'review', 'clear']);\n  assert.deepEqual(result.totals, { changed: 3, impactedFields: 2, impactedAssets: 2, directAssets: 2, indirectAssets: 0 });\n  const impact = result.impacts.find(impact => impact.field === 'c.q');\n  assert.equal(impact.status, 'blocked');\n  assert.equal(impact.distance, 1);\n  assert.deepEqual(impact.paths.map(({ root, steps }) => [root, steps.length]), [['a.x', 2], ['a.y', 1]]);\n});\n\ntest('accepts valid BOM JSON and avoids mutating supplied metadata', () => {\n  const data = structuredClone(DEMO_DROP);\n  const json = JSON.stringify(data);\n  assert.deepEqual(parseWorkspace(`\\uFEFF${json}`), data);\n  analyzeImpact(data);\n  assert.equal(JSON.stringify(data), json);\n  assert.throws(() => parseWorkspace('{broken'), /有效的 JSON/u);\n  assert.throws(() => parseWorkspace(' ' + '字'.repeat(MAX_INPUT_BYTES / 2)), /256 KiB/u);\n});\n\ntest('rejects dangling, duplicate, cyclic and unsupported catalog metadata', () => {\n  const valid = () => structuredClone(DEMO_DROP);\n  const cases = [\n    [data => findField(data, 'fact_orders.net_amount').inputs.push(input('missing.field')), /不存在/u],\n    [data => findField(data, 'orders_raw.amount_cents').inputs.push(input('dashboard_trade.revenue')), /循环/u],\n    [data => findField(data, 'orders_raw.amount_cents').inputs.push(input('orders_raw.amount_cents')), /循环/u],\n    [data => data.catalog.assets.push(structuredClone(data.catalog.assets[0])), /重复/u],\n    [data => data.catalog.assets[0].fields.push(structuredClone(data.catalog.assets[0].fields[0])), /重复/u],\n    [data => findField(data, 'fact_orders.net_amount').inputs.push(input('orders_raw.amount_cents')), /重复/u],\n    [data => findField(data, 'fact_orders.net_amount').inputs.push(input('orders_raw.amount_cents', 'implicit')), /关系/u],\n  ];\n  for (const [mutate, message] of cases) {\n    const data = valid();\n    mutate(data);\n    assert.throws(() => analyzeImpact(data), message);\n    assert.throws(() => parseWorkspace(JSON.stringify(data)), message);\n  }\n});\n\ntest('rejects no-op and ambiguous proposals instead of silently approving them', () => {\n  const replace = changes => analyzeImpact({ catalog: DEMO_DROP.catalog, proposal: { name: '坏方案', changes } });\n  const field = 'orders_raw.amount_cents';\n  assert.throws(() => replace([]), /变更列表/u);\n  assert.throws(() => replace([{ field, op: 'type', to: ' BIGINT ' }]), /原值相同/u);\n  assert.throws(() => replace([{ field, op: 'nullable', to: false }]), /原值相同/u);\n  assert.throws(() => replace([{ field, op: 'drop', to: null }]), /删除字段/u);\n  assert.throws(() => replace([{ field: 'orders_raw.missing', op: 'drop' }]), /不存在/u);\n  assert.throws(() => replace([{ field, op: 'drop' }, { field, op: 'nullable', to: true }]), /重复/u);\n});\n\ntest('stops path evidence expansion before building oversized exports', () => {\n  const fields = Array.from({ length: 200 }, (_, index) => makeField(`f${index}`, index ? [input(`a.f${index - 1}`)] : []));\n  const data = workspace([makeAsset('a', fields)], [{ field: 'a.f0', op: 'drop' }]);\n  assert.throws(() => analyzeImpact(data), /16000 步.+拆分/u);\n  assert.throws(() => parseWorkspace(JSON.stringify(data)), /16000 步.+拆分/u);\n  data.proposal.changes[0].field = 'a.f21';\n  assert.equal(analyzeImpact(data).totals.impactedFields, 178);\n  data.proposal.changes.push({ field: 'a.f187', op: 'drop' });\n  assert.throws(() => analyzeImpact(data), /16000 步.+拆分/u);\n});\n","group":"验收测试"}],"defaultFile":"engine.mjs"}</script>
