!option) return;\n    const field = input;\n    reset({ restore: true });\n    if (option.kind === \"query\") onQuery(option.label);\n    else onProduct(option.id, field);\n  }\n\n  root.addEventListener(\"input\", event => {\n    if (event.target.id !== \"shop-query\" || !bind(event.target) || event.isComposing || composing) return;\n    draft = input.value;\n    render();\n  });\n  root.addEventListener(\"compositionstart\", event => {\n    if (event.target.id !== \"shop-query\" || !bind(event.target)) return;\n    composing = true;\n    reset();\n  });\n  root.addEventListener(\"compositionend\", event => {\n    if (event.target.id !== \"shop-query\" || !bind(event.target)) return;\n    composing = false;\n    draft = input.value;\n    render();\n  });\n  root.addEventListener(\"keydown\", event => {\n    if (event.target.id !== \"shop-query\" || !bind(event.target) || event.isComposing || composing || event.keyCode === 229) return;\n    if (event.key === \"Escape\" && options.length) {\n      event.preventDefault();\n      event.stopPropagation();\n      reset({ restore: true });\n    } else if (event.key === \"Enter\" && active >= 0) {\n      event.preventDefault();\n      choose(active);\n    } else if (event.key === \"ArrowDown\" || event.key === \"ArrowUp\") {\n      if (!options.length) {\n        draft = input.value;\n        render();\n      }\n      if (!options.length) return;\n      event.preventDefault();\n      const direction = event.key === \"ArrowDown\" ? 1 : -1;\n      active = active \u003c 0 ? (direction === 1 ? 0 : options.length - 1) : (active + direction + options.length) % options.length;\n      const selected = list.children[active];\n      for (const row of list.children) row.setAttribute(\"aria-selected\", String(row === selected));\n      input.setAttribute(\"aria-activedescendant\", selected.id);\n      input.value = options[active].kind === \"query\" ? options[active].label : draft;\n      selected.scrollIntoView({ block: \"nearest\" });\n    }\n  });\n  root.addEventListener(\"mousedown\", event => {\n    if (event.target.closest(\"#shop-suggestions [data-suggestion]\")) event.preventDefault();\n  });\n  root.addEventListener(\"click\", event => {\n    const option = event.target.closest(\"#shop-suggestions [data-suggestion]\");\n    if (option && list?.contains(option)) choose(Number(option.dataset.suggestion));\n  });\n  root.addEventListener(\"focusout\", event => {\n    if (event.target === input && event.relatedTarget && !input.form?.contains(event.relatedTarget)) reset({ restore: true });\n  });\n  document.addEventListener(\"pointerdown\", event => {\n    if (input && !input.form?.contains(event.target)) reset({ restore: true });\n  });\n  return { close: () => reset() };\n}\n","group":"前端"},{"path":"static/shopping-bag.mjs","text":"export const shoppingBagStorageKey = \"shop-search-lab.bag.v1\";\nconst maxQuantity = 99;\nconst failures = {\n  unknownProduct: \"找不到这件商品。\",\n  invalidQuantity: \"请输入 1 到 99 件。\",\n  quantityLimit: \"同一商品最多选 99 件。\",\n  outOfStock: \"这件商品暂时无货。\"\n};\n\nfunction defaultStorage() {\n  try {\n    return globalThis.localStorage;\n  } catch {\n    return null;\n  }\n}\n\nfunction failure(code) {\n  return { ok: false, code, message: failures[code] };\n}\n\nfunction success(code, message) {\n  return { ok: true, code, message };\n}\n\nexport function createShoppingBag(products, storage = defaultStorage()) {\n  const catalog = new Map();\n  const maximumUnitCents = Math.floor(Number.MAX_SAFE_INTEGER / Math.max(products.length, 1) / maxQuantity);\n  for (const product of products) {\n    if (typeof product?.id !== \"string\" || !product.id || typeof product.name !== \"string\" ||\n      typeof product.price !== \"number\") continue;\n    const unitCents = Math.round(product.price * 100);\n    if (!Number.isSafeInteger(unitCents) || unitCents \u003c 0 || unitCents > maximumUnitCents) continue;\n    catalog.set(product.id, { product, unitCents });\n  }\n\n  let units = new Map();\n  let localOnly = !storage;\n\n  function reload() {\n    if (localOnly) return false;\n    let raw;\n    try {\n      raw = storage.getItem(shoppingBagStorageKey);\n    } catch {\n      localOnly = true;\n      return false;\n    }\n    let saved;\n    try {\n      saved = JSON.parse(raw ?? \"[]\");\n    } catch {\n      saved = [];\n    }\n    const current = new Map();\n    if (Array.isArray(saved)) {\n      for (const row of saved) {\n        if (!Array.isArray(row) || row.length !== 2) continue;\n        const [id, quantity] = row;\n        if (Number.isSafeInteger(quantity) && quantity >= 1 && quantity \u003c= maxQuantity &&\n          catalog.get(id)?.product.inStock === true) current.set(id, quantity);\n      }\n    }\n    const changed = units.size !== current.size || [...current].some(([id, amount]) => units.get(id) !== amount);\n    units = current;\n    return changed;\n  }\n  reload();\n\n  function persist() {\n    if (localOnly) return;\n    try {\n      storage.setItem(shoppingBagStorageKey, JSON.stringify([...units]));\n    } catch {\n      // Further reloads must not erase edits that could only be saved in memory.\n      localOnly = true;\n    }\n  }\n\n  function quantity(id) {\n    return units.get(id) ?? 0;\n  }\n\n  function updateQuantity(id, amount) {\n    const entry = catalog.get(id);\n    if (!entry) return failure(\"unknownProduct\");\n    if (entry.product.inStock !== true) return failure(\"outOfStock\");\n    if (!Number.isSafeInteger(amount) || amount \u003c 1) return failure(\"invalidQuantity\");\n    if (amount > maxQuantity) return failure(\"quantityLimit\");\n    const existed = units.has(id);\n    units.set(id, amount);\n    persist();\n    return existed ? success(\"updated\", `已更新为 ${amount} 件。`) : success(\"added\", `已加入购物袋，共 ${amount} 件该商品。`);\n  }\n\n  function setQuantity(id, amount) {\n    reload();\n    return updateQuantity(id, amount);\n  }\n\n  function add(id, amount = 1) {\n    if (!Number.isSafeInteger(amount) || amount \u003c 1) return failure(\"invalidQuantity\");\n    reload();\n    const result = updateQuantity(id, quantity(id) + amount);\n    return result.ok ? success(\"added\", `已加入购物袋，共 ${quantity(id)} 件该商品。`) : result;\n  }\n\n  function decrement(id) {\n    reload();\n    return updateQuantity(id, quantity(id) - 1);\n  }\n\n  function remove(id) {\n    if (!catalog.has(id)) return failure(\"unknownProduct\");\n    reload();\n    if (units.delete(id)) persist();\n    return success(\"removed\", \"已移除商品。\");\n  }\n\n  function clear() {\n    reload();\n    units.clear();\n    persist();\n    return success(\"cleared\", \"已清空购物袋。\");\n  }\n\n  function list() {\n    return [...units].map(([id, quantity]) => {\n      const { product, unitCents } = catalog.get(id);\n      return { product, quantity, unitCents, lineCents: unitCents * quantity };\n    });\n  }\n\n  function count() {\n    return [...units.values()].reduce((total, amount) => total + amount, 0);\n  }\n\n  function subtotalCents() {\n    return list().reduce((total, row) => total + row.lineCents, 0);\n  }\n\n  return { list, count, subtotalCents, quantity, add, setQuantity, decrement, remove, clear, reload };\n}\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --page:#fff8f5;\n  --paper:#fff;\n  --ink:#2a191c;\n  --muted:#6a5054;\n  --rule:#eed8d8;\n  --accent:#b71c34;\n  --accent-dark:#840f21;\n  --chart:#28576b;\n  --gutter:clamp(18px,5vw,75px);\n  --sans:Inter,\"PingFang SC\",\"Microsoft YaHei UI\",\"Helvetica Neue\",Arial,sans-serif;\n  --mono:\"Cascadia Mono\",\"IBM Plex Mono\",Consolas,monospace;\n  font:14px/1.55 var(--sans);\n  color:var(--ink);\n  background:var(--page);\n}\n* { box-sizing:border-box; }\nbody { margin:0; min-width:280px; min-height:100dvh; display:flex; flex-direction:column; background:var(--page); }\nbody[data-view=\"evaluation\"] { --page:#edf2f5; --ink:#1b303d; --muted:#4c6370; --rule:#d7e2e8; --accent:#24586e; --accent-dark:#19 splay:grid; justify-items:end; gap:1px; }\n  .query-replay { min-height:36px; font-size:11px; }\n  .shop-filters { gap:1px 5px; }\n  .category-nav { width:100%; overflow:auto; flex-wrap:nowrap; scrollbar-width:thin; }\n  .category-tab { flex:none; }\n  .option-nav { width:100%; border-top:1px solid var(--rule); }\n  .category-tab,.available-filter,.filter-menu summary { padding-inline:6px; font-size:12px; min-height:40px; }\n  .product-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }\n  .product-body { padding:8px 8px 5px; }\n  .product-body h3,.is-list .product-body h3 { font-size:14px; }\n  .product-actions { padding:5px 8px 8px; }\n  .product-price { font-size:17px; }\n  .product-grid:not(.is-list) .product-actions { align-items:stretch; flex-direction:column; }\n  .product-grid:not(.is-list) .product-ctas { justify-content:stretch; }\n  .product-grid:not(.is-list) .add-bag { flex:1; }\n  .product-ctas { gap:3px; }\n  .add-bag,.compare-product { padding-inline:5px; }\n  .product-usage { font-size:11px; }\n  .card-specs > div { grid-template-columns:minmax(37px,.78fr) minmax(0,1.2fr); gap:4px; font-size:11px; }\n  .product-grid:not(.is-list) .product-usage { display:none; }\n  .is-list .product-card { grid-template-columns:minmax(84px,.60fr) minmax(0,1.4fr); }\n  .is-list .product-card > .photo-frame { grid-row:span 2; align-self:start; height:auto; min-height:0; aspect-ratio:1; border-radius:7px 0 4px 0; }\n  .is-list .product-body { padding:9px 9px 0; }\n  .is-list .product-actions { grid-column:2; flex-direction:row; align-items:flex-end; text-align:left; justify-content:space-between; padding:5px 7px 8px; flex-wrap:wrap; gap:3px; }\n  .product-sheet { grid-template-columns:minmax(0,1fr); }\n  .sheet-visual { padding:9px 12px; gap:4px; }\n  .product-sheet .photo-frame { height:clamp(120px,39vw,190px); aspect-ratio:auto; }\n  .sheet-copy { padding:17px 14px 21px; }\n  .has-compare-tray { padding-bottom:calc(105px + env(safe-area-inset-bottom)); }\n  .compare-selection { display:grid; gap:3px; }\n  .compare-tags { flex-wrap:nowrap; max-width:100%; overflow:auto; padding:2px; scrollbar-width:thin; }\n  .compare-tags button { min-height:34px; flex:none; max-width:114px; font-size:11px; padding-inline:4px; }\n  .comparison-sheet { padding:10px 9px; }\n  .comparison-table :is(th,td) { padding:6px 4px; font-size:11px; }\n  .bag-line { grid-template-columns:64px minmax(0,1fr) auto; gap:5px 7px; }\n  .bag-overflow { padding-inline:12px; }\n  .bag-meta { font-size:10px; }\n  .bag-stepper { grid-template-columns:31px minmax(26px,auto) 31px; }\n  .bag-line-total { font-size:12px; }\n  .has-compare-tray .bag-toast { bottom:110px; }\n  .lab-header { gap:6px; flex-wrap:wrap; }\n  .lab-header p { margin-top:5px; font-size:13px; }\n  .export { padding-inline:8px; font-size:12px; }\n  .experiment-control { padding:8px; margin-bottom:7px; }\n  .experiment-control h2 { font-size:14px; }\n  .experiment-control p { font-size:11px; }\n  .experiment-switch { padding-inline:3px; }\n  .metric-grid { gap:5px; }\n  .metric-tile { padding:7px 5px; }\n  .metric-tile h2,.metric-tile p { font-size:11px; }\n  .metric-value { gap:1px 4px; }\n  .metric-delta { font-size:10px; }\n  .evaluation-context { margin-bottom:7px; font-size:11px; }\n  .query-inspector { grid-template-columns:minmax(0,1fr); padding:8px; }\n  .section-heading { padding:7px 8px 5px; }\n  .outcome-filter { padding:0 6px 5px; }\n  .comparison { padding:7px; }\n  .rank-pair { gap:4px; }\n  .rank-heading { padding:6px 5px; }\n  .rank-heading h3 { font-size:12px; }\n  .rank-heading p,.rank-size,.rank-share { font-size:10px; }\n  .rank-size { display:none; }\n  .rank-list li { grid-template-columns:12px minmax(0,1fr); gap:3px; padding:6px 4px; }\n  .rank-copy strong,.rank-empty { font-size:12px; }\n  .site-footer { margin-top:22px; }\n  .site-footer .wrap { min-height:60px; }\n}\n@media(max-width:365px) {\n  body[data-view=\"shop\"] .mode-nav [data-mode=\"shop\"] { display:none; }\n  .shop-hero:not(.compact) .shop-hero-copy h1 { font-size:33px; }\n}\n@media(prefers-reduced-motion:reduce) {\n  *,*::before,*::after { transition:none!important; }\n}\n","group":"前端"},{"path":"tests/bag.test.mjs","text":"import assert from \"node:assert/strict\";\nimport test from \"node:test\";\nimport { createShoppingBag } from \"../static/shopping-bag.mjs\";\n\nconst products = [\n  { id: \"lamp\", sku: \"LT-01\", name: \"台灯\", inStock: true, price: 18.99 },\n  { id: \"keyboard\", sku: \"KB-01\", name: \"键盘\", inStock: true, price: 68.2 },\n  { id: \"sold-out\", sku: \"PW-02\", name: \"充电器\", inStock: false, price: 99 }\n];\n\nfunction memoryStore(value = null) {\n  return {\n    getItem: () => value,\n    setItem: (_key, next) => { value = next; }\n  };\n}\n\ntest(\"shopping bag adds by product ID and calculates integer-cent totals\", () => {\n  const bag = createShoppingBag(products, null);\n  assert.deepEqual(bag.list(), []);\n  assert.equal(bag.add(\"lamp\").ok, true);\n  assert.equal(bag.add(\"lamp\", 2).ok, true);\n  assert.equal(bag.add(\"keyboard\").ok, true);\n  assert.equal(bag.count(), 4);\n  assert.equal(bag.subtotalCents(), 12517);\n  assert.deepEqual(bag.list().map(row => [row.product.id, row.quantity, row.unitCents, row.lineCents]), [\n    [\"lamp\", 3, 1899, 5697], [\"keyboard\", 1, 6820, 6820]\n  ]);\n  assert.equal(bag.setQuantity(\"lamp\", 2).code, \"updated\");\n  assert.equal(bag.count(), 3);\n  assert.equal(bag.remove(\"keyboard\").code, \"removed\");\n  assert.equal(bag.subtotalCents(), 3798);\n});\n\ntest(\"unavailable items and invalid or over-limit quantities do not mutate the bag\", () => {\n  const bag = createShoppingBag(products, null);\n  assert.equal(bag.add(\"nope\").code, \"unknownProduct\");\n  assert.equal(bag.add(\"sold-out\").code, \"outOfStock\");\n  for (const quantity of [0, -1, 0.5, \"2\", NaN]) {\n    assert.equal(bag.add(\"lamp\", quantity).code, \"invalidQuantity\");\n  }\n  assert.equal(bag.setQuantity(\"lamp\", 99).ok, true);\n  assert.equal(bag.add(\"lamp\").code, \"quantityLimit\");\n  assert.equal(bag.setQuantity(\"lamp\", 100).code, \"quantityLimit\");\n  assert.equal(bag.setQuantity(\"lamp\", 0).code, \"invalidQuantity\");\n  assert.equal(bag.quantity(\"lamp\"), 99);\n});\n\ntest(\"restores valid quantities, discards invalid entries, and persists removal and clearing\", () => {\n  const store = memoryStore(JSON.stringify([[\"lamp\", 2], [\"sold-out\", 3], [\"unknown\", 1], null, [\"keyboard\", -6]]));\n  let bag = createShoppingBag(products, store);\n  assert.deepEqual(bag.list().map(row => row.product.id), [\"lamp\"]);\n  bag.add(\"keyboard\", 2);\n  bag.remove(\"lamp\");\n  bag = createShoppingBag(products, store);\n  assert.equal(bag.quantity(\"lamp\"), 0);\n  assert.equal(bag.quantity(\"keyboard\"), 2);\n  bag.clear();\n  assert.equal(createShoppingBag(products, store).count(), 0);\n});\n\ntest(\"handles inaccessible or corrupt storage and rejects invalid catalog prices\", () => {\n  const corrupted = createShoppingBag(products, memoryStore(\"{not JSON\"));\n  assert.equal(corrupted.count(), 0);\n  const blocked = createShoppingBag([...products, { id: \"bad-price\", name: \"异常商品\", price: NaN, inStock: true }], {\n    getItem() { throw Error(\"blocked\"); },\n    setItem() { throw Error(\"blocked\"); }\n  });\n  assert.equal(blocked.add(\"bad-price\").ok, false);\n  assert.equal(blocked.add(\"keyboard\").ok, true);\n  assert.equal(blocked.subtotalCents(), 6820);\n});\n\ntest(\"a second tab reads the latest saved quantities before applying its changes\", () => {\n  const store = memoryStore();\n  const first = createShoppingBag(products, store);\n  const second = createShoppingBag(products, store);\n  first.add(\"lamp\", 4);\n  second.add(\"keyboard\");\n  first.decrement(\"lamp\");\n  assert.equal(second.reload(), true);\n  assert.equal(second.reload(), false);\n  assert.equal(second.quantity(\"lamp\"), 3);\n  assert.equal(second.quantity(\"keyboard\"), 1);\n  second.clear();\n  assert.equal(first.reload(), true);\n  assert.equal(first.count(), 0);\n});\n\ntest(\"a failed save leaves the current page able to keep and adjust its local items\", () => {\n  const store = {\n    getItem() { return JSON.stringify([[\"lamp\", 2]]); },\n    setItem() { throw Error(\"quota\"); }\n  };\n  const bag = createShoppingBag(products, store);\n  assert.equal(bag.add(\"lamp\").ok, true);\n  assert.equal(bag.reload(), false);\n  assert.equal(bag.quantity(\"lamp\"), 3);\n  assert.equal(bag.decrement(\"lamp\").ok, true);\n  assert.equal(bag.quantity(\"lamp\"), 2);\n});\n","group":"验收测试"},{"path":"tests/engine.test.mjs","text":"import assert from \"node:assert/strict\";\nimport {test} from \"node:test\";\nimport {benchmark, categories, products} from \"../catalog.mjs\";\nimport {evaluate, search} from \"../engine.mjs\";\n\nfunction normalized(values) {\n  return values.reduce((sum, value, index) => sum + (2 ** value - 1) / Math.log2(index + 2), 0);\n}\n\ntest(\"catalog data and 0–3 judgments refer to real, unique fixture IDs\", () => {\n  const productIds = new Set(products.map(product => product.id));\n  const categoryIds = new Set(categories.map(category => category.id));\n  assert.equal(productIds.size, products.length);\n  assert.equal(new Set(products.map(product => product.sku)).size, products.length);\n  assert.equal(new Set(benchmark.map(item => item.id)).size, benchmark.length);\n  for (const product of products) {\n    assert.ok(categoryIds.has(product.category));\n    assert.ok(Number.isFinite(product.price) && product.price >= 0);\n  }\n  for (const item of benchmark) {\n    for (const [id, grade] of Object.entries(item.relevant)) {\n      assert.ok(productIds.has(id), `${item.id} judged unknown product ${id}`);\n      assert.ok(Number.isInteger(grade) && grade >= 1 && grade \u003c= 3);\n    }\n  }\n});\n\ntest(\"exact SKU survives phonetic-free normalization; candidate additionally accepts compact SKU\", () => {\n  const typed = search(products, \" ＫＢ‐２０８ \", {strategy: \"baseline\"});\n  assert.deepEqual(typed.hits.map(({id, rank}) => [id, rank]), [[\"wired-ergo\", 1]]);\n  assert.equal(search(products, \"KB208\", {strategy: \"baseline\"}).total, 0);\n  const compact = search(products, \"KB208\", {expandAliases: false});\n  assert.equal(compact.hits[0].id, \"wired-ergo\");\n  assert.equal(compact.hits[0].expanded.length, 0);\n});\n\ntest(\"the candidate exposes the concrete synonym and respects the evaluator toggle\", () => {\n  assert.equal(search(products, \"屏幕挂灯\", {strategy: \"baseline\"}).total, 0);\n  const enabled = search(products, \"屏幕挂灯\");\n  assert.equal(enabled.total, 3);\n  assert.equal(enabled.hits[0].id, \"light-bar-pro\");\n  assert.deepEqual(enabled.hits[0].expanded, [{term: \"屏幕挂灯\", via: \"显示器挂灯\", source: \"synonym\"}]);\n  assert.equal(search(products, \"屏幕挂灯\", {expandAliases: false}).total, 0);\n  assert.equal(evaluate(products, benchmark, {expandAliases: false}).cases[0].candidate.total, 0);\n  const catalogName = search(products, \"整桌鼠标垫\").hits[0];\n  assert.equal(catalogName.id, \"felt-mat\");\n  assert.ok(catalogName.expanded.some(match => match.source === \"catalog\"));\n});\n\ntest(\"product browsing preserves selected category, stock, price, and deterministic sort with a truthful cap\", () => {\n  const result = search(products, \"\", {category: \"desk\", priceMax: 100, inStock: true, sort: \"price-asc\", limit: 3});\n  assert.ok(result.total > result.hits.length);\n  assert.equal(result.hits.length, 3);\n  assert.ok(result.hits.every(({product}) => product.category === \"desk\" && product.inStock && product.price \u003c= 100));\n  assert.deepEqual(result.hits.map(({product}) => product.price), [19, 25, 39]);\n  assert.equal(search(products, \"屏幕挂灯\", {inStock: true}).total, 2);\n  assert.equal(search(products, \"屏幕挂灯\", {category: \"power\"}).total, 0);\n});\n\ntest(\"numeric specification tokens use boundaries rather than matching 5W between 1 and 5W\", () => {\n  const result = search(products, \"5W 无线充电\");\n  assert.deepEqual(result.hits.map(({id}) => id), [\"basic-qi5\"]);\n});\n\ntest(\"evaluator uses discounted gains, Top-K reciprocal rank and separate no-match counts\", () => {\n  const run = evaluate(products, benchmark);\n  const mat = run.cases.find(item => item.id === \"mouse-pad\");\n  const ideal = normalized([3, 3, 2, 1]);\n  assert.equal(mat.baseline.ndcg, normalized([3, 3]) / ideal);\n  assert.equal(mat.candidate.ndcg, normalized([3, 3, 1, 2]) / ideal);\n  assert.equal(mat.baseline.reciprocalRank, 1);\n  const printer = run.cases.find(item => item.id === \"printer-cable\");\n  assert.equal(printer.candidate.ndcg, null);\n  assert.equal(printer.candidate.reciprocalRank, null);\n  assert.equal(printer.baseline.total, 0);\n  assert.equal(printer.candidate.total, 8);\n  assert.ok(printer.candidate.hits.every(hit => hit.grade === 0));\n  assert.equal(run.totals.judged, run.totals.queries - 4);\n  assert.equal(run.totals.candidate.unexpectedResults, 1);\n});\n\ntest(\"expanded retrieval makes the signal-splitter precision regression visible\", () => {\n  const row = evaluate(products, benchmark).cases.find(item => item.id === \"hdmi-splitter\");\n  assert.equal(row.outcome, \"unchanged\");\n  assert.ok(row.moreUnrelated);\n  assert.equal(row.baseline.relevantShare, 1);\n  assert.equal(row.candidate.relevantShare, 0.5);\n  assert.deepEqual(row.added, [\"hdmi-hub\"]);\n  assert.equal(row.candidate.hits.find(hit => hit.id === \"hdmi-hub\").grade, 0);\n  const strict = evaluate(products, benchmark, {expandAliases: false}).cases.find(item => item.id === row.id);\n  assert.equal(strict.candidate.relevantShare, 1);\n  assert.equal(strict.moreUnrelated, false);\n});\n","group":"验收测试"},{"path":"tests/http.test.mjs","text":"import assert from \"node:assert/strict\";\nimport { once } from \"node:events\";\nimport test from \"node:test\";\nimport { benchmark, categories, products } from \"../catalog.mjs\";\nimport { evaluate, search } from \"../engine.mjs\";\nimport { startServer } from \"../server.mjs\";\nimport { merchandise } from \"../static/merchandising.mjs\";\n\nasync function service(t) {\n  const server = startServer({ port: 0 });\n  await once(server, \"listening\");\n  t.after(() => new Promise((resolve) => server.close(resolve)));\n  return `http://127.0.0.1:${server.address().port}`;\n}\n\ntest(\"the HTTP service serves the catalog and uses the same search engine as the portable edition\", async (t) => {\n  const base = await service(t);\n  const catalog = await fetch(base + \"/api/catalog\");\n  assert.equal(catalog.status, 200);\n  assert.deepEqual(await catalog.json(), { products, categories });\n\n  const params = new URLSearchParams({ q: products[0].sku, expandAliases: \"0\", limit: \"1\" });\n  const request = await fetch(base + \"/api/search?\" + params);\n  assert.equal(request.status, 200);\n  assert.deepEqual(await request.json(), search(products, products[0].sku, {\n    strategy: \"candidate\", sort: \"relevance\", inStock: false, expandAliases: false, limit: 1\n  }));\n});\n\ntest(\"rank evaluation is reproducible and malformed parameters receive errors\", async (t) => {\n  const base = await service(t);\n  const score = await fetch(base + \"/api/evaluate?k=5&expandAliases=0\");\n  assert.equal(score.status, 200);\n  assert.deepEqual(await score.json(), evaluate(products, benchmark, { k: 5, expandAliases: false }));\n  for (const url of [\"/api/search?sort=unsupported\", \"/api/search?priceMax=-1\", \"/api/search?expandAliases=anything\", \"/api/evaluate?k=100\"]) {\n    const reply = await fetch(base + url);\n    assert.equal(reply.status, 400, url);\n    assert.equal(typeof (await reply.json()).error, \"string\");\n  }\n  const method = await fetch(base + \"/api/search\", { method: \"POST\" });\n  assert.equal(method.status, 405);\n  assert.equal(method.headers.get(\"Allow\"), \"GET, HEAD\");\n});\n\ntest(\"site assets are served with the proper types\", async (t) => {\n  const base = await service(t);\n  const page = await fetch(base);\n  assert.equal(page.status, 200);\n  assert.match(await page.text(), /商品搜索实验台/);\n  const media = await fetch(base + \"/media/desk.webp\", { method: \"HEAD\" });\n  assert.equal(media.status, 200);\n  assert.equal(media.headers.get(\"Content-Type\"), \"image/webp\");\n  assert.equal(await media.text(), \"\");\n  const specs = await fetch(base + \"/merchandising.mjs\", { method: \"HEAD\" });\n  assert.equal(specs.status, 200);\n  assert.match(specs.headers.get(\"Content-Type\"), /^text\\/javascript/);\n  const illustration = await fetch(base + \"/media/lt-301.webp\", { method: \"HEAD\" });\n  assert.equal(illustration.status, 200);\n  assert.equal((await fetch(base + \"/package.json\")).status, 404);\n});\n\ntest(\"listed product specs distinguish models with the same category and photo type\", () => {\n  for (const product of products) {\n    const { kind, specifications } = merchandise(product);\n    assert(kind && specifications.length >= 2, product.id);\n    assert.equal(new Set(specifications.map(row => row.label)).size, specifications.length, product.id);\n    assert(specifications.every(({ label, value }) => label.trim() && value.trim()), product.id);\n  }\n  for (const [id, length] of [[\"light-bar-pro\", 48], [\"light-bar-mini\", 36], [\"wireless-light-bar\", 52]]) {\n    const {specifications} = merchandise(products.find(product => product.id === id));\n    assert(specifications.some(({value}) => value === `${length} cm`), id);\n  }\n});\n","group":"验收测试"}],"defaultFile":"engine.mjs"}</script>
