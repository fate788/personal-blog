<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify shop search lab\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build:demo\n","group":"配置与启动"},{"path":".gitignore","text":"node_modules/\ndist/\n*.log\n.DS_Store\nThumbs.db\n","group":"配置与启动"},{"path":"README.md","text":"# 商品搜索实验台\n\n桌面办公用品商店配套的搜索实验台。顾客按品名、型号或用途搜商品。运营用固定查询和逐商品相关性分级对照基础检索和候选排序，找出搜不到、排错了以及调整后变差的查询。\n\n[打开顾客端](https://fate788.github.io/personal-blog/demos/searchlab/index.html?v=1.2) · [打开排序评测](https://fate788.github.io/personal-blog/demos/searchlab/index.html?v=1.2#evaluation) · [博客作品页](https://fate788.github.io/personal-blog/projects/searchlab/index.html)\n\n![桌面商店搜索实屏](docs/preview.webp)\n\n## 两分钟体验\n\n1. 在商店输入「屏幕」，从建议里选择「屏幕挂灯」。搜索结果可按类目、价格或库存过滤，三款挂灯的规格可以直接比较。\n2. 从商品卡或详情页把现货商品加入购物袋。打开购物袋可增减数量、移除商品和核对合计。演示购物袋保存在当前浏览器。\n3. 点击「对照这个搜索词」，立即看同一词在两套检索下的前五件商品。固定样例评测还支持切换同义词扩展和下载 CSV。\n\n## 本地启动\n\n需要 Node.js 20 或以上，无需安装依赖。Windows 可以双击 `start-search.cmd`，也可在目录运行：\n\n```sh\nnode server.mjs\nnpm test\nnpm run build:demo\n```\n\n服务地址是 [127.0.0.1:8818](http://127.0.0.1:8818/)。可用 `node server.mjs --port 8819` 更换端口。静态版本生成在 `dist/index.html`，连同相邻的 `media` 目录一起保留即可离线打开。\n\n同一检索和评测逻辑也能通过 Node 服务的只读接口调用：\n\n| 请求 | 用途 |\n| --- | --- |\n| `GET /api/catalog` | 读取商品和类目 |\n| `GET /api/search?q=65W&strategy=candidate&inStock=1` | 用候选方案搜索有现货的商品 |\n| `GET /api/search?q=65W&expandAliases=0&limit=3` | 关闭扩展并限制返回数 |\n| `GET /api/evaluate?k=5&expandAliases=1` | 核对排序、相关性分级、指标和逐词变化 |\n\n## 评测口径\n\n目录、查询、分级和产品照片用于演练。目录和查询是为作品编写的模拟数据，商品图为生成素材。商品页规格来自样例目录，品类共用图片附有示意标记。样例规模有限，指标仅描述该样例上的离线结果。用户搜索在本机内完成，公开演示无需账号。\n\nnDCG@5 同时考虑前五个结果的位置与相关程度。MRR@5 计算前五位中首个相关结果的倒数排名。没有相关商品标注的查询不计入这两个均值，仍保留在逐词对照和零结果统计里。\n\n固定样例有 56 件商品、23 条查询，19 条有相关性标注。原词基线到候选方案的 nDCG@5 从 0.246 到 0.979，零结果查询从 17 条到 3 条。前五位结果中，5 条查询也多出了未标注为相关的商品。例如「HDMI 分线器」的首位仍然是分线器，同时多召回了一款用途不同的扩展坞。查看评测列表可以逐条复查。\n\n参考了 Elasticsearch 对固定查询集合、相关性分级及排序指标的组织方式，以及 Algolia 的零结果分析和同义词配置工作流。 [Elasticsearch 排序评测](https://www.elastic.co/docs/reference/elasticsearch/rest-apis/search-rank-eval) · [Algolia 零结果优化](https://www.algolia.com/ecommerce-merchandising-playbook/null-results-optimization)\n\n商店列表、输入建议和加购反馈参考了成熟电商的场景与可用性研究。鼠标、键盘、充电器和挂灯分别采用各自的参数顺序。 [Target 商品搜索](https://www.target.com/s?searchTerm=desk+lamp) · [Baymard 搜索建议](https://baymard.com/research-articles/autocomplete-design) · [Baymard 加购反馈](https://baymard.com/ecommerce-design-examples/added-to-cart-confirmation)\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 商品搜索实验台 v1.2 源码包\n\n原始发布归档为 `商品搜索实验台-v1.2.zip`。压缩包保留其中 19 份文本文件的原始路径与字节，本文件为导出说明。\n\n需要 Node.js 20 或以上版本。在项目目录运行 node server.mjs 启动工作台，或者运行随包提供的 start-search.cmd。用 npm test 重跑自动化测试。\n","group":"项目说明"},{"path":"catalog.mjs","text":"// Fictional merchandise and graded fixtures for a reproducible ranking comparison.\nexport const categories = [\n  {id: \"desk\", label: \"桌面整理\"},\n  {id: \"input\", label: \"键鼠与交互\"},\n  {id: \"power\", label: \"充电与连接\"},\n  {id: \"lighting\", label: \"照明与计时\"},\n];\n\nconst inventory = {\n  desk: [\n    [\"felt-mat\", \"DS-101\", \"双面毛毡桌垫\", \"桌序\", 59, true, \"desk-mat\",\n      [\"80×40 cm\", \"双面\", \"全桌面\"], \"覆盖键盘和鼠标活动区的全桌面保护垫。\", [\"整桌鼠标垫\"]],\n    [\"desk-protector\", \"DS-102\", \"防水桌面保护垫\", \"桌序\", 79, true, \"desk-mat\",\n      [\"90×45 cm\", \"防水\", \"可擦洗\"], \"大桌面写字垫，水渍可擦净。\", [\"桌垫\"]],\n    [\"compact-mouse-pad\", \"DS-103\", \"细织面鼠标垫\", \"键屿\", 39, true, \"desk-mat\",\n      [\"30×25 cm\", \"防滑底\", \"布面\"], \"小尺寸鼠标垫，适合空间紧张的书桌。\"],\n    [\"gel-mouse-pad\", \"DS-104\", \"凝胶护腕鼠标垫\", \"键屿\", 65, true, \"wrist-rest\",\n      [\"腕托\", \"防滑底\"], \"鼠标垫和护腕为一体结构，可稳定放置。\"],\n    [\"silicone-clips\", \"DS-105\", \"硅胶磁吸理线器\", \"桌序\", 39, true, \"organizer\",\n      [\"磁吸\", \"免打孔\", \"三槽\"], \"桌面理线，底座免打孔粘贴，可夹三条充电线。\", [\"磁吸走线夹\"]],\n    [\"adhesi "不用打孔\", \"无需打孔\"],\n  [\"台灯\", \"桌面灯\"],\n  [\"低蓝光\", \"护眼\"],\n  [\"静音\", \"低噪\", \"静音轴\"],\n  [\"usb-c\", \"type-c\", \"usbc\", \"c口\"],\n  [\"扩展坞\", \"转接坞\", \"hub\", \"分线器\"],\n];\n\nconst expansions = new Map(synonymRules.flatMap(rule =>\n  rule.map(term => [term, rule.filter(other => term !== other)])\n));\nconst filler = new Set([\n  \"有没有\", \"可以\", \"适合\", \"想找\", \"想要\", \"需要\", \"推荐\", \"一个\", \"买个\", \"请问\", \"能\", \"的\", \"用\", \"和\", \"给\", \"要\", \"找\", \"下\",\n]);\nconst vocabulary = [...new Set([\n  ...expansions.keys(), ...filler,\n  \"机械键盘\", \"数字键盘\", \"键盘\", \"蓝牙\", \"鼠标\", \"有线\", \"无线\", \"人体工学\", \"氮化镓\", \"双口\", \"三口\", \"单口\", \"充电器\", \"充电头\", \"充电线\",\n  \"无线充电\", \"磁吸\", \"充电\", \"大桌面\", \"桌面\", \"落地灯\", \"阅读灯\", \"低亮度\", \"夜间\", \"床头\", \"照明\", \"宿舍\", \"暖光\", \"番茄钟\",\n  \"编织\", \"快充\", \"数据线\", \"收纳\", \"显示器\", \"带出门\", \"轻便\", \"租房\", \"理线\", \"折叠\", \"低延迟\", \"夹装\", \"桌下\", \"调光\", \"无级调光\",\n  \"一进两出\", \"一进一出\", \"额外按键\", \"快捷键\", \"数字区\", \"键屿\", \"桌序\", \"晴间\", \"伏线\", \"序光\",\n])].sort((left, right) => right.length - left.length);\n\nfunction normalize(text) {\n  return typeof text === \"string\"\n    ? text.normalize(\"NFKC\").toLowerCase().replace(/[‐‑−–—]/gu, \"-\")\n      .replace(/[^\\p{L}\\p{N}.\\-\\s]+/gu, \" \").trim().replace(/\\s+/gu, \" \")\n    : \"\";\n}\n\nfunction tokenize(query) {\n  const terms = new Set();\n  for (const part of query.split(\" \")) {\n    let cursor = 0;\n    let unknown = \"\";\n    while (cursor \u003c part.length) {\n      const known = vocabulary.find(word => part.startsWith(word, cursor));\n      const latin = known ? null : /^[a-z0-9]+(?:[.\\-][a-z0-9]+)*/u.exec(part.slice(cursor))?.[0];\n      const word = known || latin;\n      if (!word) {\n        unknown += part[cursor];\n        cursor++;\n        continue;\n      }\n      if (unknown) terms.add(unknown);\n      if (!filler.has(word)) terms.add(word);\n      unknown = \"\";\n      cursor += word.length;\n    }\n    if (unknown) terms.add(unknown);\n  }\n  return [...terms];\n}\n\nfunction hasTerm(text, term) {\n  if (!/^[a-z0-9][a-z0-9.\\-]*$/u.test(term)) return text.includes(term);\n  // A numeric spec or model is a whole token: 5W does not match 15W, and K7 does not match K75.\n  const marker = term.replace(/[.*+?^${}()|[\\]\\\\]/gu, \"\\\\$&\");\n  return new RegExp(`(?:^|[^a-z0-9])${marker}(?:$|[^a-z0-9])`, \"u\").test(text);\n}\n\nfunction fieldsFor(product) {\n  const name = normalize(product.name);\n  const brand = normalize(product.brand);\n  const sku = normalize(product.sku);\n  return {\n    name, brand, sku,\n    words: [[name, 8], [brand, 6], [sku, 9],\n      ...product.attributes.map(text => [normalize(text), 5]), [normalize(product.summary), 2]],\n    aliases: product.aliases.map(normalize).filter(Boolean),\n  };\n}\n\nfunction fieldMatch(words, term) {\n  let best = 0;\n  for (const [text, weight] of words) {\n    if (weight > best && hasTerm(text, term)) best = weight;\n  }\n  return best;\n}\n\nfunction literal(fields, query) {\n  if (fields.sku === query) return {score: 100, matched: [query], expanded: []};\n  const score = fields.name === query ? 24 : hasTerm(fields.name, query) ? 16 :\n    fields.brand === query ? 13 : hasTerm(fields.brand, query) ? 9 : hasTerm(fields.sku, query) ? 8 : 0;\n  return score ? {score, matched: [query], expanded: []} : null;\n}\n\nfunction oneTerm(product, fields, term, expandAliases) {\n  const direct = fieldMatch(fields.words, term);\n  if (direct) return {weight: direct, term};\n  if (!expandAliases) return null;\n  if (fields.aliases.some(alias => hasTerm(alias, term))) {\n    return {weight: 4, term, via: product.name, source: \"catalog\"};\n  }\n  let best = null;\n  for (const candidate of expansions.get(term) || []) {\n    const weight = fieldMatch(fields.words, candidate) * 0.65;\n    if (weight > (best?.weight ?? 0)) best = {weight, term, via: candidate, source: \"synonym\"};\n  }\n  return best;\n}\n\nfunction candidate(product, fields, query, terms, expandAliases) {\n  // Do not extract digits from a natural-language query and mistake them for a SKU.\n  if (/^[a-z0-9-]+$/u.test(query) && fields.sku.replaceAll(\"-\", \"\") === query.replaceAll(\"-\", \"\")) {\n    return {score: 100, matched: [query], expanded: []};\n  }\n  const exact = literal(fields, query);\n  const matches = terms.map(term => oneTerm(product, fields, term, expandAliases)).filter(Boolean);\n  const enoughTerms = terms.length > 0 && matches.length >= Math.ceil(terms.length * 0.60);\n  const exactAlias = expandAliases && fields.aliases.includes(query);\n  if (!exact && !enoughTerms && !exactAlias) return null;\n  const score = matches.reduce((sum, match) => sum + match.weight, exact?.score ?? 0) +\n    (terms.length ? (matches.length / terms.length) * 10 : 0) + (exactAlias ? 3 : 0);\n  const matched = matches.filter(match => !match.source).map(match => match.term);\n  const expanded = matches.filter(match => match.source).map(({term, via, source}) => ({term, via, source}));\n  if (exact && !matched.length) matched.push(query);\n  if (exactAlias && !expanded.length && !matched.length) expanded.push({term: query, via: product.name, source: \"catalog\"});\n  return {score, matched, expanded};\n}\n\nfunction byRelevance(left, right) {\n  return right.score - left.score || Number(right.product.inStock) - Number(left.product.inStock) ||\n    left.product.sku.localeCompare(right.product.sku, \"en\") || left.id.localeCompare(right.id, \"en\");\n}\n\nexport function search(products, query, options = {}) {\n  const strategy = options.strategy === \"baseline\" ? \"baseline\" : \"candidate\";\n  const prepared = normalize(query);\n  const useCandidate = strategy === \"candidate\";\n  const terms = useCandidate ? tokenize(prepared) : [];\n  const max = options.priceMax === \"\" || options.priceMax == null ? Infinity : Number(options.priceMax);\n  const limit = Number.isSafeInteger(options.limit) && options.limit >= 0 ? options.limit : 24;\n  const matches = [];\n\n  for (const product of products) {\n    if ((options.category && options.category !== product.category) ||\n      (options.inStock === true && !product.inStock) || product.price > max) continue;\n    if (!prepared) {\n      matches.push({id: product.id, product, score: 0, matched: [], expanded: []});\n      continue;\n    }\n    const fields = fieldsFor(product);\n    const result = useCandidate\n      ? candidate(product, fields, prepared, terms, options.expandAliases !== false)\n      : literal(fields, prepared);\n    if (result) matches.push({id: product.id, product, ...result});\n  }\n  const direction = options.sort === \"price-asc\" ? 1 : options.sort === \"price-desc\" ? -1 : 0;\n  matches.sort((left, right) => direction * (left.product.price - right.product.price) || byRelevance(left, right));\n  return {query: typeof query === \"string\" ? query.trim() : \"\", strategy, total: matches.length,\n    hits: matches.slice(0, limit).map((hit, index) => ({...hit, rank: index + 1}))};\n}\n\nfunction discountedGains(grades) {\n  return grades.reduce((total, grade, index) => total + (2 ** grade - 1) / Math.log2(index + 2), 0);\n}\n\nfunction scoreRanking(ranking, relevant, ideal) {\n  const hits = ranking.hits.map(hit => ({...hit, grade: Object.hasOwn(relevant, hit.id) ? relevant[hit.id] : 0}));\n  const firstRelevant = hits.findIndex(hit => hit.grade > 0);\n  const falsePositives = hits.filter(hit => hit.grade === 0).length;\n  return {hits, total: ranking.total, ndcg: ideal ? discountedGains(hits.map(hit => hit.grade)) / ideal : null,\n    reciprocalRank: ideal ? (firstRelevant \u003c 0 ? 0 : 1 / (firstRelevant + 1)) : null,\n    falsePositives, relevantShare: hits.length ? (hits.length - falsePositives) / hits.length : null};\n}\n\nfunction aggregate(cases, strategy) {\n  const summaries = cases.map(result => result[strategy]);\n  const judged = summaries.filter(result => result.ndcg != null);\n  const mean = field => judged.length ? judged.reduce((sum, result) => sum + result[field], 0) / judged.length : null;\n  return {ndcg: mean(\"ndcg\"), mrr: mean(\"reciprocalRank\"), zeroResults: summaries.filter(result => result.total === 0).length,\n    unexpectedResults: summaries.filter(result => result.ndcg == null && result.total > 0).length};\n}\n\nexport function evaluate(products, benchmark, options = {}) {\n  const k = Number.isSafeInteger(options.k) && options.k > 0 ? options.k : 5;\n  const cases = benchmark.map(item => {\n    const ideal = discountedGains(Object.values(item.relevant).sort((left, right) => right - left).slice(0, k));\n    const baseline = scoreRanking(search(products, item.query, {strategy: \"baseline\", limit: k}), item.relevant, ideal);\n    const candidate = scoreRanking(search(products, item.query, {\n      strategy: \"candidate\", limit: k, expandAliases: options.expandAliases,\n    }), item.relevant, ideal);\n    const deltaNdcg = ideal ? candidate.ndcg - baseline.ndcg : null;\n    const outcome = !ideal ? \"unjudged\" : Math.abs(deltaNdcg) \u003c= 1e-10 ? \"unchanged\" : deltaNdcg > 0 ? \"improved\" : \"declined\";\n    // Even if the first relevant result stays first, newly retrieved distractors can reduce result precision.\n    const moreUnrelated = candidate.falsePositives > baseline.falsePositives;\n    const baseIds = baseline.hits.map(hit => hit.id);\n    const nextIds = candidate.hits.map(hit => hit.id);\n    return {...item, baseline, candidate, deltaNdcg, outcome, moreUnrelated,\n      added: nextIds.filter(id => !baseIds.includes(id)), dropped: baseIds.filter(id => !nextIds.includes(id))};\n  });\n  const count = outcome => cases.filter(item => item.outcome === outcome).length;\n  return {k, totals: {queries: cases.length, judged: cases.length - count(\"unjudged\"),\n    baseline: aggregate(cases, \"baseline\"), candidate: aggregate(cases, \"candidate\"),\n    improved: count(\"improved\"), declined: count(\"declined\"), unchanged: count(\"unchanged\"),\n    moreUnrelated: cases.filter(item => item.moreUnrelated).length}, cases};\n}\n","group":"后端"},{"path":"package.json","text":"{\n  \"name\": \"shop-search-lab\",\n  \"version\": \"1.2.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": { \"node\": \">=20\" },\n  \"scripts\": {\n    \"start\": \"node server.mjs\",\n    \"test\": \"node --test tests/*.test.mjs\",\n    \"build:demo\": \"node portable/build.mjs\"\n  }\n}\n","group":"配置与启动"},{"path":"portable/build.mjs","text":"import { cp, mkdir, readFile, writeFile } from \"node:fs/promises\";\nimport { dirname, resolve } from \"node:path\";\n\nconst output = resolve(process.argv[2] || \"dist/index.html\");\nconst read = (path) => readFile(new URL(path, import.meta.url), \"utf8\");\nconst moduleUrl = (code) => \"data:text/javascript;base64,\" + Buffer.from(code.replaceAll(\"\\r\\n\", \"\\n\")).toString(\"base64\");\nconst [catalog, engine, merchandising, bag, bagView, suggestions, app, stylesheet, html] = await Promise.all([\n  read(\"../catalog.mjs\"), read(\"../engine.mjs\"), read(\"../static/merchandising.mjs\"),\n  read(\"../static/shopping-bag.mjs\"), read(\"../static/bag-view.mjs\"), read(\"../static/search-suggestions.mjs\"),\n  read(\"../static/app.mjs\"), read(\"../static/styles.css\"), read(\"../static/index.html\")\n]);\n\nfunction inlineImport(code, pathname, destination) {\n  return code.replaceAll(`\"${pathname}\"`, `\"${destination}\"`).replaceAll(`'${pathname}'`, `'${destination}'`);\n}\n\nconst catalogUrl = moduleUrl(catalog);\nconst engineUrl = moduleUrl(inlineImport(engine, \"./catalog.mjs\", catalogUrl));\nconst bagUrl = moduleUrl(bag);\nconst appModules = [\n  [\"../catalog.mjs\", catalogUrl],\n  [\"../engine.mjs\", engineUrl],\n  [\"./merchandising.mjs\", moduleUrl(merchandising)],\n  [\"./shopping-bag.mjs\", bagUrl],\n  [\"./bag-view.mjs\", moduleUrl(bagView)],\n  [\"./search-suggestions.mjs\", moduleUrl(suggestions)]\n];\nconst appUrl = moduleUrl(appModules.reduce((code, [path, url]) => inlineImport(code, path, url), app));\nconst styles = /\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css[\"'][^>]*>/iu;\nconst script = /\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs[\"'][^>]*>\\s*\u003c\\/script>/iu;\nconst policy = \"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\nif (!styles.test(html) || !script.test(html)) throw new Error(\"缺少前端入口。\");\nconst portable = html.replace(\"\u003chead>\", `\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(styles, () => `\u003cstyle>\\n${stylesheet}\\n\u003c/style>`)\n  .replace(script, () => `\u003cscript type=\"module\" src=\"${appUrl}\">\u003c/script>`);\n\nawait mkdir(dirname(output), { recursive: true });\nawait cp(new URL(\"../static/media/\", import.meta.url), resolve(dirname(output), \"media\"), { recursive: true });\nawait writeFile(output, portable.replaceAll(\"\\r\\n\", \"\\n\"), \"utf8\");\nconsole.log(\"已生成便携式商品搜索实验台 \" + output);\n","group":"配置与启动"},{"path":"server.mjs","text":"import { readFile } from \"node:fs/promises\";\nimport { createServer } from \"node:http\";\nimport { resolve } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport { parseArgs } from \"node:util\";\nimport { benchmark, categories, products } from \"./catalog.mjs\";\nimport { evaluate, search } from \"./engine.mjs\";\n\nconst siteFiles = new Map([\n  [\"/\", \"static/index.html\"], [\"/index.html\", \"static/index.html\"],\n  [\"/styles.css\", \"static/styles.css\"], [\"/app.mjs\", \"static/app.mjs\"],\n  [\"/merchandising.mjs\", \"static/merchandising.mjs\"],\n  [\"/shopping-bag.mjs\", \"static/shopping-bag.mjs\"], [\"/bag-view.mjs\", \"static/bag-view.mjs\"],\n  [\"/search-suggestions.mjs\", \"static/search-suggestions.mjs\"],\n  [\"/catalog.mjs\", \"catalog.mjs\"], [\"/engine.mjs\", \"engine.mjs\"]\n]);\nconst types = { html: \"text/html; charset=utf-8\", css: \"text/css; charset=utf-8\", mjs: \"text/javascript; charset=utf-8\", webp: \"image/webp\" };\nconst policy = \"default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'\";\n\nfunction write(response, status, body, contentType, head) {\n  response.writeHead(status, {\n    \"Content-Type\": contentType,\n    \"Content-Length\": Buffer.byteLength(body),\n    \"Cache-Control\": \"no-cache\",\n    \"X-Content-Type-Options\": \"nosniff\",\n    \"Content-Security-Policy\": policy\n  });\n  response.end(head ? undefined : body);\n}\n\nfunction json(response, status, value, head) {\n  write(response, status, JSON.stringify(value), \"application/json; charset=utf-8\", head);\n}\n\nfunction invalid(message) {\n  throw Object.assign(new Error(message), { status: 400 });\n}\n\nfunction integer(params, key, min, max, fallback) {\n  const value = params.get(key);\n  if (value === null) return fallback;\n  if (!/^\\d+$/.test(value) || Number(value) \u003c min || Number(value) > max) {\n    invalid(`${key} 应填写 ${min} 到 ${max} 的整数。`);\n  }\n  return Number(value);\n}\n\nfunction flag(params, key, fallback) {\n  const value = params.get(key);\n  if (value === null) return fallback;\n  if (value !== \"0\" && value !== \"1\") invalid(`${key} 应填写 0 或 1。`);\n  return value === \"1\";\n}\n\nfunction searchFromUrl(params) {\n  const query = params.get(\"q\")?.trim() || \"\";\n  const strategy = params.get(\"strategy\") ?? \"candidate\";\n  const category = params.get(\"category\") || undefined;\n  const sort = params.get(\"sort\") ?? \"relevance\";\n  if (query.length > 100) invalid(\"搜索词不能超过 100 个字符。\");\n  if (![\"baseline\", \"candidate\"].includes(strategy)) invalid(\"排序方案不存在。\");\n  if (category && !categories.some(item => item.id === category)) invalid(\"商品分类不存在。\");\n  if (![\"relevance\", \"price-asc\", \"price-desc\"].includes(sort)) invalid(\"排序方式不存在。\");\n  return search(products, query, {\n    strategy, category, sort,\n    inStock: flag(params, \"inStock\", false),\n    expandAliases: flag(params, \"expandAliases\", true),\n    priceMax: integer(params, \"priceMax\", 0, 1000000, undefined),\n    limit: integer(params, \"limit\", 1, 100, 24)\n  });\n}\n\nexport function startServer({ port = 8818 } = {}) {\n  const server = createServer(async (request, response) => {\n    const head = request.method === \"HEAD\";\n    if (!head && request.method !== \"GET\") {\n      response.setHeader(\"Allow\", \"GET, HEAD\");\n      json(response, 405, { error: \"此接口仅支持读取。\" }, head);\n      return;\n    }\n    try {\n      const url = new URL(request.url, \"http://127.0.0.1\");\n      const { pathname, searchParams } = url;\n      if (pathname === \"/api/catalog\") json(response, 200, { products, categories }, head);\n      else if (pathname === \"/api/search\") json(response, 200, searchFromUrl(searchParams), head);\n      else if (pathname === \"/api/evaluate\") {\n        const k = integer(searchParams, \"k\", 1, 20, 5);\n        const expandAliases = flag(searchParams, \"expandAliases\", true);\n        json(response, 200, evaluate(products, benchmark, { k, expandAliases }), head);\n      } else {\n        const file = siteFiles.get(pathname) || (/^\\/media\\/[a-z][a-z0-9-]*\\.webp$/.test(pathname) ? `static${pathname}` : \"\");\n        if (!file) {\n          json(response, 404, { error: \"没有找到这个页面。\" }, head);\n          return;\n        }\n        const body = await readFile(new URL(file, import.meta.url));\n        write(response, 200, body, types[file.split(\".\").at(-1)], head);\n      }\n    } catch (error) {\n      if (error.status === 400 || error instanceof TypeError && error.code === \"ERR_INVALID_URL\") {\n        json(response, 400, { error: error.status ? error.message : \"无法解析请求地址。\" }, head);\n      } else if (error.code === \"ENOENT\") json(response, 404, { error: \"没有找到这个文件。\" }, head);\n      else {\n        console.error(error);\n        json(response, 500, { error: \"搜索服务暂时不可用。\" }, head);\n      }\n    }\n  });\n  return server.listen(port, \"127.0.0.1\");\n}\n\nif (process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {\n  const { values } = parseArgs({ options: { port: { type: \"string\", default: \"8818\" } } });\n  const port = Number(values.port);\n  if (!/^\\d{1,5}$/.test(values.port) || port > 65535) throw new Error(\"端口应为 0 至 65535。\");\n  const server = startServer({ port });\n  server.on(\"listening\", () => console.log(`商品搜索实验台 http://127.0.0.1:${server.address().port}/`));\n}\n","group":"后端"},{"path":"start-search.cmd","text":"@echo off\ncd /d \"%~dp0\"\nnode server.mjs\nexit /b %errorlevel%\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import { products, categories, benchmark } from \"../catalog.mjs\";\nimport { search, evaluate } from \"../engine.mjs\";\nimport { merchandise } from \"./merchandising.mjs\";\nimport { createShoppingBag, shoppingBagStorageKey } from \"./shopping-bag.mjs\";\nimport { mountShoppingBag } from \"./bag-view.mjs\";\nimport { mountSearchSuggestions } from \"./search-suggestions.mjs\";\n\nconst app = document.querySelector(\"#app\");\nconst dialog = document.querySelector(\"#product-dialog\");\nconst comparisonDialog = document.querySelector(\"#comparison-dialog\");\nconst comparisonTray = document.querySelector(\"#compare-tray\");\nconst shoppingBagDialog = document.querySelector(\"#bag-dialog\");\nconst bagButton = document.querySelector(\"#open-bag\");\nconst bagToast = document.querySelector(\"#bag-toast\");\nconst catalog = new Map(products.map(product => [product.id, product]));\nconst categoryNames = new Map(categories.map(category => [category.id, category.label]));\nconst formatMoney = new Intl.NumberFormat(\"zh-CN\", { maximumFractionDigits: 2 });\nconst sortOptions = { relevance: \"相关度\", \"price-asc\": \"价格从低到高\", \"price-desc\": \"价格从高到低\" };\nconst priceOptions = new Map([[0, \"不限价格\"], [99, \"¥99 以内\"], [199, \"¥199 以内\"], [399, \"¥399 以内\"]]);\nconst grades = [\"未标注\", \"部分相关\", \"相关\", \"高度相关\"];\nconst outcomes = { all: \"全部\", improved: \"提升\", declined: \"下降\", unchanged: \"持平\", unjudged: \"无标注\", \"more-unrelated\": \"多出未标注\" };\nconst preferredQueries = [\"屏幕挂灯\", \"氮化镓\", \"鼠标垫\", \"笔记本支架\"];\nconst departments = {\n  input: [\"键鼠装备\", \"机械键盘、鼠标和腕托\"],\n  desk: [\"桌面收纳\", \"桌垫、理线和支架\"],\n  power: [\"充电与连接\", \"充电器、线材和扩展坞\"],\n  lighting: [\"照明与计时\", \"挂灯、台灯和计时器\"]\n};\nconst featured = [\"felt-mat\", \"k75\", \"gan65-dual\", \"basic-desk-lamp\"];\nconst refreshedPictures = new Set([\"DS-101\", \"KB-201\", \"PW-201\", \"LT-304\"]);\nconst illustratedSkus = new Set([\n  \"KB-201\", \"KB-202\", \"KB-203\", \"KB-206\", \"KB-208\", \"KB-209\", \"KB-214\",\n  \"DS-101\", \"DS-102\", \"DS-103\", \"DS-104\", \"DS-105\", \"DS-106\", \"DS-107\", \"DS-108\", \"DS-109\", \"DS-110\", \"DS-111\", \"DS-113\", \"DS-114\",\n  \"PW-201\", \"PW-202\", \"PW-203\", \"PW-211\", \"PW-212\", \"LT-301\", \"LT-302\", \"LT-303\", \"LT-304\", \"LT-305\", \"LT-306\", \"LT-307\"\n]);\nconst pageSize = 12;\nconst compareLimit = 3;\nconst selected = new Set();\nconst reports = new Map();\nconst shop = { query: \"\", category: \"\", available: false, price: 0, sort: \"relevance\", shown: pageSize };\nconst lab = { selected: \"\", outcome: \"all\", expandAliases: true, inspect: \"\" };\nlet mode = \"shop\";\nlet dialogTrigger;\nlet bagToastTimer;\n\nfunction escape(value) {\n  return String(value ?? \"\").replace(/[&\u003c>\"']/gu, char => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" })[char]);\n}\nfunction cleanQuery(value) {\n  return String(value || \"\").trim().slice(0, 100);\n}\nfunction fixed(value) {\n  return Number.isFinite(value) ? value.toFixed(3) : \"—\";\n}\nfunction signed(value) {\n  return Number.isFinite(value) && Math.abs(value) >= 0.0005 ? `${value > 0 ? \"+\" : \"−\"}${Math.abs(value).toFixed(3)}` : \"\";\n}\nfunction price(value) {\n  return `\u003cspan class=\"currency\">¥\u003c/span>${formatMoney.format(value)}`;\n}\nfunction photo(product) {\n  const specific = illustratedSkus.has(product.sku);\n  const file = specific ? product.sku.toLowerCase() : product.photo;\n  if (!/^[a-z][a-z0-9-]*$/u.test(file || \"\")) return `\u003cspan class=\"photo-placeholder\" aria-hidden=\"true\">${escape(categoryNames.get(product.category))}\u003c/span>`;\n  return `\u003cimg src=\"./media/${file}.webp${refreshedPictures.has(product.sku) ? \"?v=1.2\" : \"\"}\" alt=\"\" width=\"310\" height=\"310\" decoding=\"async\">${specific ? \"\" : '\u003csmall class=\"image-note\">品类示意\u003c/small>'}`;\n}\nfunction report() {\n  if (!reports.has(lab.expandAliases)) reports.set(lab.expandAliases, evaluate(products, benchmark, { k: 5, expandAliases: lab.expandAliases }));\n  return reports.get(lab.expandAliases);\n}\nfunction sampleCase(cases) {\n  return cases.find(entry => entry.query === \"屏幕挂灯\") || cases.find(entry => entry.outcome === \"improved\") || cases[0];\n}\nfunction visibleCases(cases) {\n  if (lab.outcome === \"more-unrelated\") return cases.filter(entry => entry.moreUnrelated);\n  return lab.outcome === \"all\" ? cases : cases.filter(entry => entry.outcome === lab.outcome);\n}\nfunction chooseCase(cases) {\n  const visible = visibleCases(cases);\n  lab.selected = visible.find(entry => entry.id === lab.selected)?.id ||\n    (lab.outcome === \"all\" ? sampleCase(visible)?.id : visible[0]?.id) || \"\";\n}\nfunction routeLink(view) {\n  const params = new URLSearchParams();\n  if (view === \"shop\") {\n    if (shop.query) params.set(\"q\", shop.query);\n    if (shop.category) params.set(\"category\", shop.category);\n    if (shop.available) params.set(\"stock\", \"1\");\n    if (shop.price) params.set(\"max\", shop.price);\n    if (shop.sort !== \"relevance\") params.set(\"sort\", shop.sort);\n  } else {\n    if (lab.selected && lab.selected !== sampleCase(report().cases)?.id) params.set(\"q\", lab.selected);\n    if (lab.outcome !== \"all\") params.set(\"outcome\", lab.outcome);\n    if (!lab.expandAliases) params.set(\"aliases\", \"0\");\n    if (lab.inspect) params.set(\"inspect\", lab.inspect);\n  }\n  return `#${view}${params.size ? `?${params}` : \"\"}`;\n}\nfunction syncHeader() {\n  const isLab = mode === \"evaluation\";\n  document.body.dataset.view = mode;\n  document.title = `${isLab ? \"搜索排序评测\" : \"桌面商店\"} · 商品搜索实验台`;\n  document.querySelector(\"#identity-title\").textContent = isLab ? \"商品搜索实验台\" : \"桌面商店\";\n  const home = routeLink(\"shop\");\n  document.querySelector(\".identity\").href = home;\n  document.querySelector(\".footer-name\").href = home;\n  bagButton.hidden = isLab;\n  if (isLab) bagToast.hidden = true;\n  document.querySelector(\"#footer-note\").textContent = isLab ? \"评测查询与相关性标注为演示样例\" : \"示例商品、价格与库存 · 商品图片为示意\";\n  for (const link of document.querySelectorAll(\".mode-nav [data-mode]\")) {\n    link.href = routeLink(link.dataset.mode);\n    if (link.dataset.mode === mode) link.setAttribute(\"aria-current\", \"page\");\n    else link.removeAttribute(\"aria-current\");\n  }\n}\nfunction rememberRoute() {\n  history.replaceState(history.state, \"\", routeLink(mode));\n  syncHeader();\n}\nfunction readRoute() {\n  const [route, query] = location.hash.slice(1).split(\"?\", 2);\n  const params = new URLSearchParams(query);\n  mode = route === \"evaluation\" ? \"evaluation\" : \"shop\";\n  if (mode === \"shop\") {\n    const category = params.get(\"category\");\n    const max = Number(params.get(\"max\"));\n    const sort = params.get(\"sort\");\n    Object.assign(shop, { query: cleanQuery(params.get(\"q\")), category: categoryNames.has(category) ? category : \"\", shown: pageSize,\n      available: params.get(\"stock\") === \"1\", price: priceOptions.has(max) ? max : 0,\n      sort: Object.hasOwn(sortOptions, sort) ? sort : \"relevance\" });\n  } else {\n    lab.expandAliases = params.get(\"aliases\") !== \"0\";\n    lab.inspect = cleanQuery(params.get(\"inspect\"));\n    const requested = params.get(\"q\");\n    lab.outcome = Object.hasOwn(outcomes, params.get(\"outcome\")) ? params.get(\"outcome\") : \"all\";\n    lab.selected = report().cases.find(entry => entry.id === requested || entry.query === requested)?.id || \"\";\n    chooseCase(report().cases);\n  }\n}\nfunction shopSearchForm() {\n  return `\u003cform class=\"shop-search\" id=\"shop-search\" role=\"search\">\u003clabel class=\"visually-hidden\" for=\"shop-query\">商品搜索词\u003c/label>\n    \u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cinput id=\"shop-query\" name=\"q\" type=\"search\" role=\"combobox\" aria-autocomplete=\"list\" aria-expanded=\"false\" aria-controls=\"shop-suggestions\" maxlength=\"100\" placeholder=\"搜索商品、品牌或型号\" autocomplete=\"off\" value=\"${escape(shop.query)}\">\n    \u003cbutton type=\"submit\">搜索\u003c/button>\u003cdiv id=\"shop-suggestions\" class=\"search-suggestions\" role=\"listbox\" aria-label=\"搜索建议\" hidden>\u003c/div>\u003c/form>`;\n}\nfunction quickQueries() {\n  return `\u003cdiv class=\"search-samples\">\u003cspan>试搜\u003c/span>${preferredQueries.map(query =>\n    `\u003cbutton type=\"button\" data-quick-query=\"${escape(query)}\">${escape(query)}\u003c/button>`).join(\"\")}\u003c/div>`;\n}\nfunction filterMenu(type, label, options, current) {\n  const trigger = type === \"price\" ? \"price-menu\" : \"sort-menu\";\n  return `\u003cdetails class=\"filter-menu\">\u003csummary id=\"${trigger}\">${escape(label)}\u003cspan class=\"chevron\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\n    \u003cdiv class=\"filter-options\" role=\"group\" aria-labelledby=\"${trigger}\">${options.map(([value, name]) =>\n      `\u003cbutton type=\"button\" data-${type}=\"${escape(value)}\" aria-pressed=\"${current === value}\">${escape(name)}\u003c/button>`).join(\"\")}\u003c/div>\u003c/details>`;\n}\nfunction filterControls() {\n  const all = [[\"\", \"全部商品\"], ...categories.map(({id, label}) => [id, label])];\n  return `\u003caside class=\"shop-filters\" aria-label=\"选购筛选\">\u003cdiv class=\"filter-heading\">\u003ch3>选购筛选\u003c/h3>\u003c/div>\n    \u003cdiv class=\"category-nav\" role=\"group\" aria-label=\"商品分类\">${all.map(([id, label]) =>\n    `\u003cbutton type=\"button\" class=\"category-tab\" data-category=\"${escape(id)}\" aria-pressed=\"${shop.category === id}\">${escape(label)}\u003c/button>`).join(\"\")}\u003c/div>\n    \u003cdiv class=\"option-nav\" aria-label=\"价格与库存\">\u003cbutton type=\"button\" class=\"available-filter\" data-available aria-pressed=\"${shop.available}\">\u003cspan aria-hidden=\"true\">\u003c/span>仅看现货\u003c/button>\n    ${filterMenu(\"price\", shop.price ? priceOptions.get(shop.price) : \"价格区间\", [...priceOptions], shop.price)}\u003c/div>\u003c/aside>`;\n}\nfunction selectedFilters() {\n  const active = [[\"category\", categoryNames.get(shop.category)], [\"available\", shop.available && \"仅看现货\"], [\"price\", shop.price && priceOptions.get(shop.price)]].filter(([, label]) => label);\n  if (!active.length) return \"\";\n  return `\u003cdiv class=\"active-filters\" aria-label=\"当前筛选\">${active.map(([key, label]) =>\n    `\u003cbutton type=\"button\" data-clear-filter=\"${key}\" aria-label=\"移除筛选 ${escape(label)}\">${escape(label)}\u003cspan aria-hidden=\"true\">×\u003c/span>\u003c/button>`).join(\"\")}\n    ${active.length > 1 ? '\u003cbutton type=\"button\" class=\"clear-all\" data-reset-shop>清除筛选\u003c/button>' : \"\"}\u003c/div>`;\n}\nfunction specList(specifications, className, limit) {\n  return `\u003cdl class=\"${className}\">${specifications.slice(0, limit).map(({label, value}) =>\n    `\u003cdiv>\u003cdt>${escape(label)}\u003c/dt>\u003cdd>${escape(value)}\u003c/dd>\u003c/div>`).join(\"\")}\u003c/dl>`;\n}\nfunction compareButton(product) {\n  const checked = selected.has(product.id);\n  return `\u003cbutton type=\"button\" class=\"compare-product\" data-compare-item=\"${escape(product.id)}\" aria-label=\"对比 ${escape(product.name)}\" aria-pressed=\"${checked}\">${checked ? \"已加入\" : \"对比\"}\u003c/button>`;\n}\nfunction bagAction(product, className = \"\") {\n  return `\u003cbutton type=\"button\" class=\"add-bag ${className}\" data-add-bag=\"${escape(product.id)}\"${product.inStock ? \"\" : \" disabled\"}>${product.inStock ? \"加入购物袋\" : \"暂时缺货\"}\u003c/button>`;\n}\nfunction productCard(product) {\n  const {kind, specifications} = merchandise(product);\n  return `\u003carticle class=\"product-card\">\u003cdiv class=\"photo-frame ${escape(product.category)}\">${photo(product)}\u003c/div>\n    \u003cdiv class=\"product-body\">\u003cp class=\"product-meta\">${escape(product.brand)} \u003cspan aria-hidden=\"true\">·\u003c/span> ${escape(kind)}\u003c/p>\n      \u003ch3>\u003cbutton type=\"button\" class=\"product-title\" data-product=\"${escape(product.id)}\" aria-label=\"查看${escape(product.name)}\">${escape(product.name)}\u003c/button>\u003c/h3>\n      \u003cp class=\"product-usage\">${escape(product.summary)}\u003c/p>${specList(specifications, \"card-specs\", 3)}\u003c/div>\n    \u003cdiv class=\"product-actions\">\u003cdiv class=\"product-offer\">\u003cspan class=\"product-price\">${price(product.price)}\u003c/span>\u003cspan class=\"stock-tag${product.inStock ? \"\" : \" sold-out\"}\">${product.inStock ? \"现货\" : \"暂缺\"}\u003c/span>\u003c/div>\n      \u003cdiv class=\"product-ctas\">${compareButton(product)}${bagAction(product)}\u003c/div>\u003c/div>\u003c/article>`;\n}\nfunction productsSection(result) {\n  const title = shop.query ? `「${escape(shop.query)}」搜索结果` : shop.category ? escape(categoryNames.get(shop.category)) : \"浏览商品\";\n  const filtered = shop.category || shop.price || shop.available;\n  const visible = result.hits.slice(0, shop.shown);\n  const sortMenu = filterMenu(\"sort\", sortOptions[shop.sort], Object.entries(sortOptions), shop.sort);\n  const replay = shop.query ? `\u003ca class=\"query-replay\" href=\"#evaluation?${new URLSearchParams({inspect:shop.query})}\">对照这个搜索词 ↗\u003c/a>` : \"\";\n  return `\u003csection class=\"catalog\" aria-labelledby=\"results-title\">\u003cdiv class=\"catalog-layout\">${filterControls()}\n    \u003cdiv class=\"catalog-results\">\u003cheader class=\"catalog-header\">\u003cdiv>\u003ch2 id=\"results-title\">${title}\u003c/h2>\u003cspan class=\"result-count\" role=\"status\">${result.total} 件商品\u003c/span>\u003c/div>\u003cdiv class=\"catalog-tools\">${replay}${sortMenu}\u003c/div>\u003c/header>\n    ${selectedFilters()}${visible.length ? `\u003cdiv class=\"product-grid${shop.query ? \" is-list\" : \"\"}\">${visible.map(({product}) => productCard(product)).join(\"\")}\u003c/div>\n      ${visible.length \u003c result.hits.length ? `\u003cbutton type=\"button\" class=\"show-products\" data-more-products>查看更多商品 \u003cspan>已显示 ${visible.length} / ${result.total}\u003c/span>\u003c/button>` : \"\"}` :\n      `\u003cdiv class=\"empty-search\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003ch3>没有找到符合条件的商品\u003c/h3>\u003cp>${filtered ? \"试试取消分类、价格或现货筛选。\" : \"试试更短的关键词，或直接输入品名和货号。\"}\u003c/p>\u003cbutton type=\"button\" data-reset-shop>${filtered ? \"清除筛选\" : \"浏览全部商品\"}\u003c/button>\u003c/div>`}\u003c/div>\u003c/div>\u003c/section>`;\n}\nfunction featureProducts(result) {\n  const primary = featured.map(id => result.hits.find(hit => hit.id === id)).filter(Boolean);\n  return { ...result, hits: [...primary, ...result.hits.filter(hit => !featured.includes(hit.id))] };\n}\nfunction departmentShelf() {\n  return `\u003csection class=\"department-shelf\" aria-labelledby=\"departments-title\">\u003cdiv class=\"department-heading\">\u003ch2 id=\"departments-title\">按用途选购\u003c/h2>\u003c/div>\n    \u003cdiv class=\"department-grid\">${Object.entries(departments).map(([id, [label, description]]) => `\u003cbutton type=\"button\" class=\"department-tile\" data-shop-department=\"${id}\">\n      \u003cimg src=\"./media/department-${id}.webp\" alt=\"\" width=\"580\" height=\"425\" decoding=\"async\">\u003cspan>\u003cstrong>${label}\u003c/strong>\u003csmall>${description}\u003c/small>\u003c/span>\u003cspan class=\"department-arrow\" aria-hidden=\"true\">↗\u003c/span>\u003c/button>`).join(\"\")}\u003c/div>\u003c/section>`;\n}\nfunction renderShop() {\n  const result = search(products, shop.query, { strategy: \"candidate\", category: shop.category || undefined,\n    priceMax: shop.price || undefined, inStock: shop.available || undefined, sort: shop.sort, limit: products.length });\n  const compact = !!(shop.query || shop.category);\n  const browsingHome = !compact && !shop.price && !shop.available && shop.sort === \"relevance\";\n  app.innerHTML = `\u003csection class=\"shop-hero${compact ? \" compact\" : \"\"}\">\u003cdiv class=\"shop-hero-copy\">\u003ch1>${compact ? \"搜索商品\" : \"给桌面换个样子\"}\u003c/h1>\n    ${compact ? \"\" : '\u003cp>选一副顺手的键鼠、一盏合适的灯，布置自己的工位。\u003c/p>'}${shopSearchForm()}${quickQueries()}\u003c/div>\n    ${compact ? \"\" : '\u003cdiv class=\"hero-photo\">\u003cimg src=\"./media/hero-red.webp\" alt=\"朱红色桌面上摆放浅色机械键盘、鼠标和台灯\" width=\"1536\" height=\"1024\" fetchpriority=\"high\">\u003c/div>'}\u003c/section>${browsingHome ? departmentShelf() : \"\"}${productsSection(browsingHome ? featureProducts(result) : result)}`;\n  renderComparisonTray();\n}\nfunction metricTile(label, baseline, candidate, count = false) {\n  const direction = Number.isFinite(baseline) && Number.isFinite(candidate) ? candidate - baseline : null;\n  const isGain = count ? direction \u003c 0 : direction > 0;\n  const delta = count && direction ? `${direction > 0 ? \"+\" : \"−\"}${Math.abs(direction)} 条` : signed(direction);\n  const value = count ? item => `${item ?? \"—\"}` : fixed;\n  return `\u003carticle class=\"metric-tile\">\u003ch2>${label}\u003c/h2>\u003cdiv class=\"metric-value\">\u003cstrong>${value(candidate)}\u003c/strong>\n    ${delta ? `\u003cspan class=\"metric-delta ${isGain ? \"gain\" : \"loss\"}\" aria-label=\"相对基线 ${escape(delta)}\">${escape(delta)}\u003c/span>` : \"\"}\u003c/div>\u003cp>基线 ${value(baseline)}\u003c/p>\u003c/article>`;\n}\nfunction caseQueryList(dataset) {\n  const selectedSample = sampleCase(dataset.cases);\n  const visible = [...visibleCases(dataset.cases)].sort((left, right) => Number(right === selectedSample) - Number(left === selectedSample));\n  return `\u003csection class=\"query-pane\" aria-labelledby=\"queries-title\">\u003cdiv class=\"section-heading\">\u003ch2 id=\"queries-title\">评测查询\u003c/h2>\u003cspan>${visible.length} / ${dataset.cases.length}\u003c/span>\u003c/div>\n    \u003cdiv class=\"outcome-filter\" role=\"group\" aria-label=\"按结果筛选\">${Object.entries(outcomes).map(([id, name]) =>\n      `\u003cbutton type=\"button\" data-outcome=\"${id}\" aria-pressed=\"${lab.outcome === id}\">${name}\u003c/button>`).join(\"\")}\u003c/div>\n    \u003cdiv class=\"case-list\" id=\"case-list\">${visible.length ? visible.map(entry =>\n      `\u003cbutton type=\"button\" class=\"case-choice\" data-case=\"${escape(entry.id)}\" aria-pressed=\"${entry.id === lab.selected}\">\u003cspan class=\"case-name\">\u003cstrong>${escape(entry.query)}\u003c/strong>\u003csmall>${escape(entry.group)}\u003c/small>\u003c/span>\n        \u003cspan class=\"outcome ${escape(entry.outcome)}\">${outcomes[entry.outcome]}${entry.moreUnrelated ? '\u003csmall class=\"outcome-warning\">多出未标注\u003c/small>' : signed(entry.deltaNdcg) ? `\u003csmall>${signed(entry.deltaNdcg)}\u003c/small>` : \"\"}\u003c/span>\u003c/button>`).join(\"\") : '\u003cp class=\"empty-queries\">当前筛选没有查询。\u003c/p>'}\u003c/div>\u003c/section>`;\n}\nfunction documentSignals(hit) {\n  const expanded = (hit.expanded || []).map(item => `${item.term} → ${item.via}`);\n  if (expanded.length) return `\u003csmall class=\"match-trace\">${escape([...new Set(expanded)].slice(0, 2).join(\" · \"))}\u003c/small>`;\n  return \"\";\n}\nfunction rankedResults(entry, strategy) {\n  const isCandidate = strategy === \"candidate\";\n  const result = entry[strategy];\n  const diff = new Set(isCandidate ? entry.added : entry.dropped);\n  const share = result.relevantShare == null ? \"—\" : `${Math.round(result.relevantShare * 100)}%`;\n  return `\u003csection class=\"rank-panel ${strategy}\" aria-labelledby=\"rank-${strategy}\">\u003cheader class=\"rank-heading\">\u003cdiv>\u003ch3 id=\"rank-${strategy}\">${isCandidate ? \"候选方案\" : \"原词基线\"}\u003c/h3>\u003cp>nDCG@5 \u003cspan>${fixed(result.ndcg)}\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"rank-quantity\">\u003cspan class=\"rank-share\" title=\"所展示结果中有相关性标注的比例\">相关 ${share}\u003c/span>\u003cspan class=\"rank-size\">召回 ${result.total} 件\u003c/span>\u003c/div>\u003c/header>\n    ${result.hits.length ? `\u003col class=\"rank-list\">${result.hits.map((hit, index) => {\n      const grade = hit.grade || Number(entry.relevant[hit.id] || 0);\n      return `\u003cli>\u003cspan class=\"rank-number\">${index + 1}\u003c/span>\u003cdiv class=\"rank-copy\">\u003cstrong>${escape(hit.product.name)}\u003c/strong>\u003csmall class=\"sku\">${escape(hit.product.sku)}\u003c/small>${documentSignals(hit)}\n        \u003cspan class=\"grade grade-${grade}\" title=\"相关性标注 ${grade}\">${grades[grade]}\u003c/span>${diff.has(hit.id) ? `\u003cspan class=\"rank-change\">${isCandidate ? \"新进\" : \"移出\"}\u003c/span>` : \"\"}\u003c/div>\u003c/li>`;\n    }).join(\"\")}\u003c/ol>` : '\u003cp class=\"rank-empty\">没有召回商品\u003c/p>'}\u003c/section>`;\n}\nfunction expectedResults(entry) {\n  const relevant = Object.entries(entry.relevant).sort(([,a], [,b]) => b - a);\n  if (!relevant.length) return \"\";\n  return `\u003cdetails class=\"judgments\">\u003csummary>查看人工标注的商品\u003cspan class=\"chevron\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cul>${relevant.map(([id, score]) => {\n    const product = catalog.get(id);\n    return `\u003cli>\u003cspan>${escape(product?.name || id)}\u003c/span>\u003cspan class=\"grade grade-${score}\">${grades[score]}\u003c/span>\u003c/li>`;\n  }).join(\"\")}\u003c/ul>\u003c/details>`;\n}\nfunction caseDetail(dataset) {\n  const entry = dataset.cases.find(item => item.id === lab.selected);\n  if (!entry) return '\u003csection class=\"comparison empty-comparison\">\u003ch2>没有可对照的查询\u003c/h2>\u003cp>切换筛选条件查看当前评测。\u003c/p>\u003c/section>';\n  return `\u003csection class=\"comparison\" aria-labelledby=\"case-title\" id=\"comparison\">\u003cheader class=\"case-header\">\u003cdiv>\u003cp>${escape(entry.group)}\u003c/p>\n    \u003ch2 id=\"case-title\" tabindex=\"-1\">${escape(entry.query)}\u003c/h2>\u003c/div>\u003ca class=\"try-query\" href=\"#shop?${new URLSearchParams({q: entry.query})}\">在商店里试搜 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/header>\n    ${entry.note ? `\u003cp class=\"case-note\">${escape(entry.note)}\u003c/p>` : \"\"}${entry.moreUnrelated ? `\u003cp class=\"case-warning\">候选前五位多出 ${entry.candidate.falsePositives - entry.baseline.falsePositives} 件未标注商品。\u003c/p>` : \"\"}\u003cdiv class=\"rank-pair\">${rankedResults(entry, \"baseline\")}${rankedResults(entry, \"candidate\")}\u003c/div>${expectedResults(entry)}\u003c/section>`;\n}\nfunction replaySection() {\n  const panels = lab.inspect ? [[\"baseline\", \"原词基线\"], [\"candidate\", \"候选方案\"]].map(([strategy, label]) => {\n    const {total, hits} = search(products, lab.inspect, {strategy, limit:5, expandAliases:lab.expandAliases});\n    return `\u003csection class=\"rank-panel ${strategy}\">\u003cheader class=\"rank-heading\">\u003ch3>${label}\u003c/h3>\u003cspan class=\"rank-size\">${total} 件\u003c/span>\u003c/header>\n      ${hits.length ? `\u003col class=\"rank-list\">${hits.map(({product, rank, expanded}) => `\u003cli>\u003cspan class=\"rank-number\">${rank}\u003c/span>\u003cdiv class=\"rank-copy\">\u003cstrong>${escape(product.name)}\u003c/strong>\u003csmall class=\"sku\">${escape(product.sku)}\u003c/small>${documentSignals({expanded})}\u003c/div>\u003c/li>`).join(\"\")}\u003c/ol>` : '\u003cp class=\"rank-empty\">没有召回商品\u003c/p>'}\u003c/section>`;\n  }).join(\"\") : \"\";\n  return `\u003csection class=\"query-inspector\" aria-labelledby=\"inspector-title\">\u003cdiv>\u003ch2 id=\"inspector-title\">自定义搜索对照\u003c/h2>\u003cp>按全目录比较前五位。这些搜索词只用于查看命中，不计入固定评测。\u003c/p>\u003c/div>\n    \u003cform id=\"inspect-query\">\u003clabel class=\"visually-hidden\" for=\"inspect-input\">要对照的搜索词\u003c/label>\u003cinput id=\"inspect-input\" name=\"q\" type=\"search\" maxlength=\"100\" placeholder=\"输入任意商品搜索词\" value=\"${escape(lab.inspect)}\" required>\u003cbutton type=\"submit\">运行对照\u003c/button>\u003c/form>\n    ${panels ? `\u003cdiv class=\"rank-pair inspector-results\" data-inspector-results>${panels}\u003c/div>` : \"\"}\u003c/section>`;\n}\nfunction renderLab() {\n  const dataset = report();\n  const { baseline, candidate, judged, queries, improved, declined, moreUnrelated } = dataset.totals;\n  app.innerHTML = `\u003cdiv class=\"lab-shell\">\u003cheader class=\"lab-header\">\u003cdiv>\u003ch1>搜索排序评测\u003c/h1>\u003cp>用同一批查询对照原词基线和候选方案，核对每个结果的相关性。\u003c/p>\u003c/div>\n    \u003cbutton type=\"button\" class=\"export\" data-export>下载 CSV \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/button>\u003c/header>\n    \u003csection class=\"experiment-control\" aria-label=\"候选方案设置\">\u003cdiv>\u003ch2>候选同义词扩展\u003c/h2>\u003cp>关闭后保留字段加权，对照同义词带来的变化。\u003c/p>\u003c/div>\n    \u003cbutton class=\"experiment-switch\" type=\"button\" data-aliases role=\"switch\" aria-checked=\"${lab.expandAliases}\" aria-label=\"候选同义词扩展\">\u003cspan aria-hidden=\"true\">\u003c/span>\u003cb>${lab.expandAliases ? \"已开启\" : \"已关闭\"}\u003c/b>\u003c/button>\u003c/section>\n    \u003cdiv class=\"metric-grid\" aria-label=\"评测指标\">${metricTile(\"nDCG@5\", baseline.ndcg, candidate.ndcg)}${metricTile(\"MRR@5\", baseline.mrr, candidate.mrr)}${metricTile(\"无结果查询\", baseline.zeroResults, candidate.zeroResults, true)}\u003c/div>\n    \u003cp class=\"evaluation-context\">${queries} 条查询，${judged} 条计入相关性指标 \u003cspan>·\u003c/span> ${improved} 条提升，${declined} 条下降，${moreUnrelated} 条多出未标注商品\u003c/p>\n    ${replaySection()}\n    \u003cdiv class=\"evaluation-grid\">${caseQueryList(dataset)}${caseDetail(dataset)}\u003c/div>\n    \u003cdetails class=\"metric-help\">\u003csummary>指标口径\u003cspan class=\"chevron\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cp>nDCG@5 衡量前五位商品的分级相关性和位置。MRR@5 计算前五位中首个有相关性标注商品的倒数排名。无相关商品标注的查询不计入这两项均值，仍检查其是否返回结果。\u003c/p>\u003c/details>\u003c/div>`;\n}\nfunction render() {\n  if (mode === \"evaluation\") renderLab();\n  else renderShop();\n  if (mode === \"evaluation\") renderComparisonTray();\n  syncHeader();\n}\nfunction restoreControl(selector, scrollTop = null) {\n  if (scrollTop !== null) document.querySelector(\"#case-list\").scrollTop = scrollTop;\n  document.querySelector(selector)?.focus({preventScroll: true});\n}\nfunction updateShop(change, control, keepResults = false) {\n  const categoryScroll = app.querySelector(\".category-nav\")?.scrollLeft || 0;\n  change();\n  if (!keepResults) shop.shown = pageSize;\n  rememberRoute();\n  renderShop();\n  app.querySelector(\".category-nav\").scrollLeft = categoryScroll;\n  if (control) restoreControl(control);\n}\nfunction shopQuery(query) {\n  updateShop(() => { Object.assign(shop, {query: cleanQuery(query), category: \"\", available: false, price: 0, sort: \"relevance\"}); });\n  window.scrollTo(0, 0);\n  document.querySelector(\"#shop-query\").focus({preventScroll: true});\n}\nfunction updateLab(change, control, preserveList = false) {\n  const listTop = preserveList ? document.querySelector(\"#case-list\").scrollTop : null;\n  change();\n  chooseCase(report().cases);\n  rememberRoute();\n  renderLab();\n  restoreControl(control, listTop);\n}\nfunction renderComparisonTray() {\n  const items = [...selected].map(id => catalog.get(id));\n  comparisonTray.hidden = mode !== \"shop\" || !items.length;\n  document.body.classList.toggle(\"has-compare-tray\", !comparisonTray.hidden);\n  if (comparisonTray.hidden) {\n    comparisonTray.replaceChildren();\n    return;\n  }\n  const ready = items.length >= 2;\n  comparisonTray.innerHTML = `\u003cdiv class=\"compare-tray-inner\">\u003cdiv class=\"compare-selection\">\u003cb>已选 ${items.length} / ${compareLimit} 件\u003c/b>\u003cdiv class=\"compare-tags\">\n    ${items.map(product => `\u003cbutton type=\"button\" data-compare-item=\"${escape(product.id)}\" data-remove-item aria-label=\"移除 ${escape(product.name)}\">\u003cspan>${escape(product.name)}\u003c/span>\u003cspan aria-hidden=\"true\">×\u003c/span>\u003c/button>`).join(\"\")}\u003c/div>\u003cp id=\"compare-status\" role=\"status\">\u003c/p>\u003c/div>\n    \u003cbutton type=\"button\" class=\"open-comparison\" data-open-comparison${ready ? \"\" : \" disabled\"}>${ready ? \"查看对比\" : \"再选一件\"}\u003c/button>\u003c/div>`;\n}\nfunction toggleComparison(id) {\n  const product = catalog.get(id);\n  if (!product) return;\n  const first = catalog.get(selected.values().next().value);\n  if (!selected.has(id) && (first && first.photo !== product.photo || selected.size >= compareLimit)) {\n    const status = document.querySelector(\".product-dialog[open] .sheet-notice\") || comparisonTray.querySelector(\"#compare-status\");\n    if (status) status.textContent = selected.size >= compareLimit ? \"最多对比 3 件，请先移除一件。\" : \"请选择同类商品，方便核对相同规格。\";\n    return;\n  }\n  if (selected.has(id)) selected.delete(id);\n  else selected.add(id);\n  const sheetNotice = dialog.querySelector(\".sheet-notice\");\n  if (sheetNotice) sheetNotice.textContent = \"\";\n  for (const control of document.querySelectorAll(`[data-compare-item=\"${CSS.escape(id)}\"]:not([data-remove-item])`)) {\n    control.setAttribute(\"aria-pressed\", String(selected.has(id)));\n    control.textContent = selected.has(id) ? \"已加入\" : \"对比\";\n  }\n  renderComparisonTray();\n}\nfunction showComparison() {\n  const items = [...selected].map(id => catalog.get(id));\n  if (items.length \u003c 2) return;\n  const specifications = items.map(product => new Map(merchandise(product).specifications.map(({label, value}) => [label, value])));\n  const keys = [...new Set(specifications.flatMap(spec => [...spec.keys()]))];\n  const specificationRows = keys.map(key => `\u003ctr>\u003cth scope=\"row\">${escape(key)}\u003c/th>${specifications.map(spec => `\u003ctd>${escape(spec.get(key) || \"—\")}\u003c/td>`).join(\"\")}\u003c/tr>`).join(\"\");\n  comparisonDialog.innerHTML = `\u003cdiv class=\"comparison-sheet\">\u003cheader class=\"comparison-heading\">\u003ch2 id=\"comparison-title\">商品规格对比\u003c/h2>\u003cbutton type=\"button\" class=\"close-dialog\" data-close aria-label=\"关闭商品对比\">×\u003c/button>\u003c/header>\n    \u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">规格\u003c/th>${items.map(product => `\u003cth scope=\"col\">\u003cdiv class=\"comparison-image\">${photo(product)}\u003c/div>\u003cspan>${escape(product.name)}\u003c/span>\u003csmall class=\"sku\">${escape(product.sku)}\u003c/small>\u003c/th>`).join(\"\")}\u003c/tr>\u003c/thead>\n    \u003ctbody>\u003ctr>\u003cth scope=\"row\">价格\u003c/th>${items.map(product => `\u003ctd>${price(product.price)}\u003c/td>`).join(\"\")}\u003c/tr>\n    \u003ctr>\u003cth scope=\"row\">库存\u003c/th>${items.map(product => `\u003ctd>${product.inStock ? \"现货\" : \"暂缺\"}\u003c/td>`).join(\"\")}\u003c/tr>${specificationRows}\u003c/tbody>\u003c/table>\u003c/div>`;\n  comparisonDialog.showModal();\n  comparisonDialog.querySelector(\"[data-close]\").focus();\n}\nfunction showProduct(id, trigger) {\n  const product = catalog.get(id);\n  if (!product) return;\n  const {kind, specifications} = merchandise(product);\n  dialogTrigger = trigger;\n  dialog.innerHTML = `\u003cdiv class=\"product-sheet\">\u003cbutton type=\"button\" class=\"close-dialog\" aria-label=\"关闭商品详情\" data-close>×\u003c/button>\n    \u003cfigure class=\"sheet-visual\">\u003cdiv class=\"photo-frame ${escape(product.category)}\">${photo(product)}\u003c/div>\u003cfigcaption>商品图为示意\u003c/figcaption>\u003c/figure>\n    \u003cdiv class=\"sheet-copy\">\u003cp class=\"product-meta\">${escape(product.brand)} · ${escape(kind)} · \u003cspan class=\"sku\">${escape(product.sku)}\u003c/span>\u003c/p>\n    \u003ch2 id=\"product-title\">${escape(product.name)}\u003c/h2>\u003cp class=\"sheet-summary\">${escape(product.summary)}\u003c/p>\n    \u003cdiv class=\"sheet-offer\">\u003cdiv>\u003cp class=\"sheet-price\">${price(product.price)}\u003c/p>\u003cp class=\"sheet-stock\">${product.inStock ? \"现货\" : \"暂时无货\"}\u003c/p>\u003c/div>\u003cdiv class=\"product-ctas\">${compareButton(product)}${bagAction(product, \"detail-add-bag\")}\u003c/div>\u003c/div>\n    \u003cp class=\"sheet-notice\" role=\"status\">\u003c/p>\u003cdiv class=\"sheet-bag-result\" hidden>\u003cp class=\"sheet-bag-message\" role=\"status\">\u003c/p>\u003cbutton type=\"button\" data-view-bag>查看购物袋\u003c/button>\u003c/div>\n    \u003csection class=\"sheet-facts\" aria-label=\"商品规格\">\u003ch3>商品规格\u003c/h3>${specList(specifications, \"sheet-specs\", specifications.length)}\u003c/section>\u003c/div>\u003c/div>`;\n  dialog.showModal();\n  dialog.querySelector(\"[data-close]\").focus();\n}\nconst bag = createShoppingBag(products);\nconst bagView = mountShoppingBag({dialog:shoppingBagDialog, bag, photo, onChange:syncBagCount});\n\nfunction syncBagCount() {\n  const count = bag.count();\n  document.querySelector(\"#bag-count\").textContent = count;\n  bagButton.setAttribute(\"aria-label\", `购物袋，${count} 件商品`);\n}\nfunction addToBag(id) {\n  const result = bag.add(id);\n  if (result.ok) syncBagCount();\n  const item = catalog.get(id);\n  const message = result.ok ? `${item.name}已加入购物袋` : result.message;\n  if (dialog.open) {\n    const feedback = dialog.querySelector(\".sheet-bag-result\");\n    feedback.hidden = false;\n    feedback.querySelector(\".sheet-bag-message\").textContent = message;\n    feedback.querySelector(\"[data-view-bag]\").hidden = !result.ok;\n    return;\n  }\n  clearTimeout(bagToastTimer);\n  bagToast.hidden = false;\n  document.querySelector(\"#bag-toast-message\").textContent = message;\n  bagToast.querySelector(\"[data-view-bag]\").hidden = !result.ok;\n  bagToastTimer = setTimeout(() => { bagToast.hidden = true; }, 6000);\n}\nfunction openBag() {\n  if (dialog.open) dialog.close();\n  bagToast.hidden = true;\n  bagView.open(bagButton);\n}\nfunction csvField(value) {\n  let text = String(value ?? \"\");\n  if (typeof value === \"string\" && /^[=+@\\-\\t\\r]/u.test(text)) text = \"'\" + text;\n  return `\"${text.replaceAll('\"', '\"\"')}\"`;\n}\nfunction downloadReport() {\n  const { cases, k } = report();\n  const rows = [[\"查询\", \"分类\", \"状态\", \"Top K\", \"候选同义词\", \"基线 nDCG\", \"候选 nDCG\", \"nDCG 变化\", \"基线倒数排名\", \"候选倒数排名\", \"基线未标注结果数\", \"候选未标注结果数\", \"候选多出未标注\", \"基线结果货号\", \"候选结果货号\", \"人工标注商品与分值\"]];\n  for (const entry of cases) rows.push([entry.query, entry.group, outcomes[entry.outcome], k, lab.expandAliases ? \"开启\" : \"关闭\",\n    entry.baseline.ndcg, entry.candidate.ndcg, entry.deltaNdcg, entry.baseline.reciprocalRank, entry.candidate.reciprocalRank,\n    entry.baseline.falsePositives, entry.candidate.falsePositives, entry.moreUnrelated ? \"是\" : \"否\",\n    entry.baseline.hits.map(hit => hit.product.sku).join(\" | \"), entry.candidate.hits.map(hit => hit.product.sku).join(\" | \"),\n    Object.entries(entry.relevant).map(([id, grade]) => `${catalog.get(id)?.sku || id}:${grade}`).join(\" | \")]);\n  const url = URL.createObjectURL(new Blob([\"\\uFEFF\", rows.map(row => row.map(csvField).join(\",\")).join(\"\\r\\n\")], {type: \"text/csv;charset=utf-8\"}));\n  const anchor = document.createElement(\"a\");\n  anchor.href = url;\n  anchor.download = `商品搜索评测-${lab.expandAliases ? \"启用\" : \"关闭\"}同义词.csv`;\n  anchor.click();\n  setTimeout(() => URL.revokeObjectURL(url), 1000);\n}\napp.addEventListener(\"submit\", event => {\n  if (event.target.id === \"shop-search\") {\n    event.preventDefault();\n    shopQuery(new FormData(event.target).get(\"q\"));\n  } else if (event.target.id === \"inspect-query\") {\n    event.preventDefault();\n    const value = cleanQuery(new FormData(event.target).get(\"q\"));\n    if (value) updateLab(() => { lab.inspect = value; }, \"#inspect-input\");\n  }\n});\napp.addEventListener(\"click\", event => {\n  const button = event.target.closest(\"button\");\n  if (!button) return;\n  const { quickQuery, category, price: priceChoice, sort, product, outcome, case: caseId } = button.dataset;\n  if (quickQuery) shopQuery(quickQuery);\n  else if (button.dataset.shopDepartment) {\n    updateShop(() => { shop.category = button.dataset.shopDepartment; }, '[data-category][aria-pressed=\"true\"]');\n    app.querySelector(\".catalog\").scrollIntoView({block:\"start\"});\n  }\n  else if (category !== undefined) updateShop(() => { shop.category = category; }, `[data-category=\"${CSS.escape(category)}\"]`);\n  else if (button.hasAttribute(\"data-available\")) updateShop(() => { shop.available = !shop.available; }, \"[data-available]\");\n  else if (priceChoice !== undefined) updateShop(() => { shop.price = Number(priceChoice); }, \"#price-menu\");\n  else if (sort) updateShop(() => { shop.sort = sort; }, \"#sort-menu\");\n  else if (product) showProduct(product, button);\n  else if (button.dataset.clearFilter) {\n    const key = button.dataset.clearFilter;\n    const defaults = {category: \"\", available: false, price: 0};\n    if (Object.hasOwn(defaults, key)) updateShop(() => { shop[key] = defaults[key]; }, \"#sort-menu\");\n  }\n  else if (button.hasAttribute(\"data-more-products\")) {\n    const previous = shop.shown;\n    updateShop(() => { shop.shown += pageSize; }, null, true);\n    app.querySelectorAll(\"[data-product]\")[previous]?.focus({preventScroll: true});\n  }\n  else if (button.hasAttribute(\"data-reset-shop\")) {\n    if (shop.category || shop.available || shop.price) updateShop(() => { Object.assign(shop, {category: \"\", available: false, price: 0}); }, '[data-category=\"\"]');\n    else shopQuery(\"\");\n  }\n  else if (button.hasAttribute(\"data-aliases\")) updateLab(() => { lab.expandAliases = !lab.expandAliases; }, \"[data-aliases]\");\n  else if (outcome) updateLab(() => { lab.outcome = outcome; }, `[data-outcome=\"${CSS.escape(outcome)}\"]`);\n  else if (caseId) {\n    updateLab(() => { lab.selected = caseId; }, `[data-case=\"${CSS.escape(caseId)}\"]`, true);\n    if (matchMedia(\"(max-width: 760px)\").matches) document.querySelector(\"#case-title\")?.focus();\n  }\n  else if (button.hasAttribute(\"data-export\")) downloadReport();\n});\ndocument.addEventListener(\"click\", event => {\n  const add = event.target.closest(\"[data-add-bag]\");\n  if (add && !add.disabled) addToBag(add.dataset.addBag);\n  if (event.target.closest(\"#open-bag,[data-view-bag]\")) openBag();\n  const compareControl = event.target.closest(\"[data-compare-item]\");\n  if (compareControl) {\n    toggleComparison(compareControl.dataset.compareItem);\n    if (compareControl.hasAttribute(\"data-remove-item\")) {\n      const removedId = compareControl.dataset.compareItem;\n      const next = comparisonTray.querySelector(\"[data-remove-item]\") || app.querySelector(`[data-compare-item=\"${CSS.escape(removedId)}\"]`) || document.querySelector(\"#shop-query\");\n      next?.focus({preventScroll: true});\n    }\n  }\n  if (event.target.closest(\"[data-open-comparison]\")) showComparison();\n  for (const menu of document.querySelectorAll(\".filter-menu[open]\")) if (!menu.contains(event.target)) menu.open = false;\n});\ndocument.addEventListener(\"keydown\", event => {\n  if (event.key !== \"Escape\") return;\n  const menu = document.querySelector(\".filter-menu[open]\");\n  if (menu) { menu.open = false; menu.querySelector(\"summary\").focus(); }\n});\nfor (const sheet of [dialog, comparisonDialog]) {\n  sheet.addEventListener(\"click\", event => {\n    if (event.target === sheet || event.target.closest(\"[data-close]\")) sheet.close();\n  });\n}\ndialog.addEventListener(\"close\", () => dialogTrigger?.focus({preventScroll: true}));\ncomparisonDialog.addEventListener(\"close\", () => comparisonTray.querySelector(\"[data-open-comparison]\")?.focus({preventScroll: true}));\nwindow.addEventListener(\"storage\", ({key}) => {\n  if ((key === shoppingBagStorageKey || key === null) && bag.reload()) {\n    syncBagCount();\n    if (shoppingBagDialog.open) bagView.refresh();\n  }\n});\nwindow.addEventListener(\"hashchange\", () => {\n  if (dialog.open) dialog.close();\n  if (comparisonDialog.open) comparisonDialog.close();\n  if (shoppingBagDialog.open) shoppingBagDialog.close();\n  readRoute();\n  render();\n  window.scrollTo(0, 0);\n  app.focus({preventScroll: true});\n});\ndocument.querySelector(\".skip-link\").addEventListener(\"click\", event => { event.preventDefault(); app.focus(); });\nmountSearchSuggestions({root:app,\n  terms:[...preferredQueries, \"机械键盘\", \"显示器挂灯\", \"收线夹\", \"静音鼠标\", \"USB-C\", \"充电器\", \"台灯\", \"无线鼠标\"],\n  findProducts:query => search(products, query, {limit:3}).hits.map(({product}) => product),\n  onQuery:shopQuery, onProduct:showProduct, categoryName:id => categoryNames.get(id)\n});\nsyncBagCount();\nreadRoute();\nrender();\n","group":"前端"},{"path":"static/bag-view.mjs","text":"const money = new Intl.NumberFormat(\"zh-CN\", { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n\nfunction escape(value) {\n  return String(value ?? \"\").replace(/[&\u003c>\"']/gu, char => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" })[char]);\n}\n\nfunction currency(cents) {\n  return `¥${money.format(cents / 100)}`;\n}\n\nfunction lineMarkup({ product, quantity, unitCents, lineCents }, photo) {\n  const id = escape(product.id);\n  const name = escape(product.name);\n  return `\u003cli class=\"bag-line\" data-bag-line=\"${id}\">\u003cdiv class=\"bag-photo\">${photo(product)}\u003c/div>\n    \u003cdiv class=\"bag-item\">\u003cp class=\"bag-name\">\u003cstrong>${name}\u003c/strong>\u003c/p>\u003cp class=\"bag-meta\">${escape(product.sku)} · 单价 ${currency(unitCents)}\u003c/p>\u003c/div>\n    \u003cdiv class=\"bag-controls\">\u003cdiv class=\"bag-stepper\" aria-label=\"${name}数量\" role=\"group\">\n      \u003cbutton type=\"button\" data-bag-decrease aria-label=\"减少 ${name} 件数\"${quantity \u003c= 1 ? \" disabled\" : \"\"}>−\u003c/button>\n      \u003coutput class=\"bag-qty\" aria-label=\"数量\">${quantity}\u003c/output>\n      \u003cbutton type=\"button\" data-bag-increase aria-label=\"增加 ${name} 件数\"${quantity >= 99 ? \" disabled\" : \"\"}>+\u003c/button>\n    \u003c/div>\u003cbutton type=\"button\" class=\"bag-remove\" data-bag-remove aria-label=\"移除 ${name}\">移除\u003c/button>\u003c/div>\n    \u003cp class=\"bag-line-total\" aria-label=\"小计 ${currency(lineCents)}\">${currency(lineCents)}\u003c/p>\u003c/li>`;\n}\n\nexport function mountShoppingBag({ dialog, bag, photo = () => \"\", onChange = () => {} }) {\n  let trigger;\n  dialog.innerHTML = `\u003csection class=\"bag-sheet\">\u003cheader class=\"bag-heading\">\u003cdiv>\u003ch2 id=\"bag-title\">购物袋\u003c/h2>\u003cp data-bag-heading-count>\u003c/p>\u003c/div>\n    \u003cbutton type=\"button\" class=\"close-dialog\" data-bag-close aria-label=\"关闭购物袋\">×\u003c/button>\u003c/header>\n    \u003cp class=\"bag-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003cdiv class=\"bag-overflow\" data-bag-list>\u003c/div>\u003cfooter class=\"bag-summary\" data-bag-summary>\u003c/footer>\u003c/section>`;\n  const status = dialog.querySelector(\".bag-status\");\n  const closeButton = dialog.querySelector(\"[data-bag-close]\");\n  const contents = dialog.querySelector(\"[data-bag-list]\");\n\n  function refresh() {\n    const lines = bag.list();\n    dialog.querySelector(\"[data-bag-heading-count]\").textContent = lines.length ? `共 ${bag.count()} 件商品` : \"\";\n    contents.innerHTML = lines.length\n      ? `\u003cul class=\"bag-list\">${lines.map(row => lineMarkup(row, photo)).join(\"\")}\u003c/ul>`\n      : `\u003cdiv class=\"bag-empty\">\u003ch3>购物袋还是空的\u003c/h3>\u003cp>在商品列表或详情页选择「加入购物袋」。\u003c/p>\u003c/div>`;\n    dialog.querySelector(\"[data-bag-summary]\").innerHTML = `\u003cp class=\"bag-disclosure\">演示购物袋，商品记录保存在当前浏览器。\u003c/p>${lines.length\n      ? `\u003cdiv class=\"bag-subtotal\">\u003cspan>商品合计\u003c/span>\u003cstrong>${currency(bag.subtotalCents())}\u003c/strong>\u003c/div>` : \"\"}\n      \u003cdiv class=\"bag-footer-actions\">${lines.length ? '\u003cbutton type=\"button\" class=\"bag-clear\" data-bag-clear>清空购物袋\u003c/button>' : \"\"}\n      \u003cbutton type=\"button\" class=\"bag-continue\" data-bag-continue>继续选购\u003c/button>\u003c/div>`;\n  }\n\n  dialog.addEventListener(\"click\", event => {\n    if (event.target === dialog || event.target.closest(\"[data-bag-close],[data-bag-continue]\")) {\n      dialog.close();\n      return;\n    }\n    const control = event.target.closest(\"[data-bag-increase],[data-bag-decrease],[data-bag-remove],[data-bag-clear]\");\n    if (!control) return;\n    const row = control.closest(\"[data-bag-line]\");\n    const id = row?.dataset.bagLine;\n    let result;\n    if (control.hasAttribute(\"data-bag-clear\")) result = bag.clear();\n    else if (control.hasAttribute(\"data-bag-remove\")) result = bag.remove(id);\n    else if (control.hasAttribute(\"data-bag-increase\")) result = bag.add(id);\n    else result = bag.decrement(id);\n\n    if (result.ok) {\n      refresh();\n      onChange();\n      const updated = [...contents.querySelectorAll(\"[data-bag-line]\")].find(item => item.dataset.bagLine === id);\n      const action = control.hasAttribute(\"data-bag-increase\") ? \"[data-bag-increase]\" : \"[data-bag-decrease]\";\n      const next = updated?.querySelector(`${action}:enabled`) ?? updated?.querySelector(\".bag-stepper button:enabled\") ??\n        contents.querySelector(\"[data-bag-remove]\") ?? dialog.querySelector(\"[data-bag-continue]\");\n      next?.focus({preventScroll: true});\n    }\n    status.textContent = result.message;\n  });\n\n  dialog.addEventListener(\"close\", () => {\n    trigger?.focus({preventScroll: true});\n    trigger = undefined;\n  });\n\n  function open(opener) {\n    if (!dialog.open) trigger = opener;\n    status.textContent = \"\";\n    if (bag.reload()) onChange();\n    refresh();\n    if (!dialog.open) dialog.showModal();\n    closeButton.focus({preventScroll: true});\n  }\n\n  return { open, refresh };\n}\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#fff8f5\">\n  \u003cmeta name=\"description\" content=\"搜索桌面用品，比较两种商品搜索排序在同一组查询上的效果。\">\n  \u003ctitle>桌面商店 · 商品搜索实验台\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#app\">跳到内容\u003c/a>\n  \u003cheader class=\"site-header\">\n    \u003cdiv class=\"wrap header-inner\">\n      \u003ca class=\"identity\" href=\"#shop\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\u003cspan id=\"identity-title\">桌面商店\u003c/span>\u003c/a>\n      \u003cdiv class=\"header-actions\">\u003cnav class=\"mode-nav\" aria-label=\"工作区\">\n        \u003ca href=\"#shop\" data-mode=\"shop\" aria-current=\"page\">商店\u003c/a>\n        \u003ca href=\"#evaluation\" data-mode=\"evaluation\">排序评测\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003c/nav>\u003cbutton class=\"open-bag\" type=\"button\" id=\"open-bag\" aria-haspopup=\"dialog\">\u003cspan class=\"bag-icon\" aria-hidden=\"true\">\u003c/span>购物袋\u003cspan class=\"bag-count\" id=\"bag-count\">0\u003c/span>\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/header>\n  \u003cmain id=\"app\" class=\"wrap\" tabindex=\"-1\">\u003cp class=\"loading\" role=\"status\">正在载入商品目录…\u003c/p>\u003c/main>\n  \u003cfooter class=\"site-footer\">\u003cdiv class=\"wrap\">\u003ca href=\"#shop\" class=\"footer-name\">桌面商店\u003c/a>\u003cp id=\"footer-note\">示例商品、价格与库存 · 商品图片为示意\u003c/p>\u003c/div>\u003c/footer>\n  \u003caside class=\"compare-tray\" id=\"compare-tray\" aria-label=\"已选对比商品\" hidden>\u003c/aside>\n  \u003cdiv class=\"bag-toast\" id=\"bag-toast\" hidden>\u003cp id=\"bag-toast-message\" role=\"status\">\u003c/p>\u003cbutton type=\"button\" data-view-bag>查看购物袋\u003c/button>\u003c/div>\n  \u003cdialog class=\"product-dialog\" id=\"product-dialog\" aria-labelledby=\"product-title\">\u003c/dialog>\n  \u003cdialog class=\"comparison-dialog\" id=\"comparison-dialog\" aria-labelledby=\"comparison-title\">\u003c/dialog>\n  \u003cdialog class=\"bag-dialog\" id=\"bag-dialog\" aria-labelledby=\"bag-title\">\u003c/dialog>\n  \u003cnoscript>\u003cp class=\"wrap loading\">请启用 JavaScript，使用商品搜索和排序评测。\u003c/p>\u003c/noscript>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/merchandising.mjs","text":"// Presentation order for the existing sample catalog. Each profile starts with\n// the facts most useful when comparing this kind of product in a result list.\nconst profiles = {\n  \"felt-mat\": [\"桌垫\", {\n    尺寸: \"80 × 40 cm\", 材质: \"毛毡\", 用法: \"双面铺设，覆盖整个桌面\",\n  }],\n  \"desk-protector\": [\"桌垫\", {\n    尺寸: \"90 × 45 cm\", 表面: \"防水、可擦洗\", 用法: \"大桌面写字垫\",\n  }],\n  \"compact-mouse-pad\": [\"鼠标垫\", {\n    尺寸: \"30 × 25 cm\", 表面: \"细织布面\", 底面: \"防滑\",\n  }],\n  \"gel-mouse-pad\": [\"鼠标垫\", {\n    腕托: \"一体式凝胶护腕\", 底面: \"防滑\",\n  }],\n  \"silicone-clips\": [\"理线夹\", {\n    容量: \"3 个线槽\", 安装: \"免打孔粘贴\", 结构: \"磁吸硅胶线夹\",\n  }],\n  \"adhesive-clips\": [\"理线夹\", {\n    包装: \"6 枚装\", 安装: \"免打孔背胶\", 材质: \"硅胶\", 安装位置: \"桌沿\",\n  }],\n  \"cable-tray\": [\"理线槽\", {\n    安装: \"桌下夹装，免打孔\", 收纳: \"充电线与排插\",\n  }],\n  \"wired-tray\": [\"理线槽\", {\n    安装: \"桌下螺丝固定\", 材质: \"钢制\", 适用桌面: \"实木桌\",\n  }],\n  \"hook-loop-ties\": [\"束线带\", {\n    包装: \"8 条装\", 结构: \"可复用魔术贴\", 材质: \"尼龙，可剪裁\",\n  }],\n  \"alum-laptop-stand\": [\"笔记本支架\", {\n    重量: \"220 g\", 兼容: \"11–16 英寸笔记本\", 调节: \"6 挡，可折叠\", 材质: \"铝合金\",\n  }],\n  \"desk-laptop-stand\": [\"笔记本支架\", {\n    调节: \"双轴升降\", 重量: \"860 g\", 材质: \"铝合金\", 底座: \"加重设计\",\n  }],\n  \"portable-laptop-stand\": [\"笔记本支架\", {\n    重量: \"185 g\", 收纳: \"折叠后可放入笔记本夹层\",\n  }],\n  \"drawer-riser\": [\"显示器增高架\", {\n    结构: \"双层，带抽屉\", 下方空间: \"可收纳键盘\",\n  }],\n  \"bamboo-riser\": [\"显示器增高架\", {\n    承重: \"15 kg\", 材质: \"竹木\", 下方空间: \"可收纳标准键盘\",\n  }],\n  k75: [\"机械键盘\", {\n    配列: \"75%\", 连接: \"蓝牙 / 2.4G / USB-C\", 轴体: \"静音轴\",\n    操控: \"独立方向键与音量旋钮\",\n  }],\n  \"quiet-84\": [\"键盘\", {\n    键数: \"84 键\", 连接: \"蓝牙\", 按键: \"低噪薄膜\",\n  }],\n  \"m104-keyboard\": [\"键盘\", {\n    键数: \"104 键\", 连接: \"USB-A 有线\", 键区: \"含标准数字区\",\n  }],\n  \"retro-81\": [\"机械键盘\", {\n    键数: \"81 键\", 连接: \"蓝牙\", 轴体: \"段落轴，可热插拔\",\n  }],\n  \"travel-keys\": [\"折叠键盘\", {\n    收纳: \"双折叠\", 连接: \"蓝牙\", 使用场景: \"平板短时办公\",\n  }],\n  numpad: [\"数字键盘\", {\n    键数: \"18 键\", 连接: \"蓝牙\", 按键: \"静音数字键\",\n  }],\n  \"quiet-mouse\": [\"鼠标\", {\n    连接: \"蓝牙 / 2.4G\", 切换: \"2 台设备\", 按键: \"静音\",\n  }],\n  \"wired-ergo\": [\"人体工学鼠标\", {\n    握姿: \"右手垂直握姿\", 连接: \"USB-A 有线\", 使用场景: \"固定工位\",\n  }],\n  \"ergo-wireless\": [\"人体工学鼠标\", {\n    握姿: \"垂直握姿\", 连接: \"蓝牙\", 切换: \"3 台设备\", 充电: \"USB-C\",\n  }],\n  \"wired-office-mouse\": [\"鼠标\", {\n    连接: \"USB-A 有线\", 握姿: \"左右手通用\", 外壳: \"对称设计\",\n  }],\n  \"mouse-wrist\": [\"鼠标腕托\", {\n    材质: \"软木\", 尺寸: \"小号\", 用法: \"鼠标前方单独放置\",\n  }],\n  \"key-wrist\": [\"键盘掌托\", {\n    长度: \"44 cm\", 材质: \"硅胶\", 适用: \"全尺寸键盘\",\n  }],\n  \"wired-macro\": [\"快捷键键盘\", {\n    键数: \"6 键\", 连接: \"USB-C 有线\", 操控: \"可设定媒体和应用快捷键\",\n  }],\n  \"track-ball\": [\"轨迹球\", {\n    操作: \"拇指拨动轨迹球\", 连接: \"蓝牙 / 2.4G\", 设计: \"使用时无需移动外壳\",\n  }],\n  \"gan65-dual\": [\"充电器\", {\n    单口功率: \"最高 65W\", 接口: \"2 × USB-C\", 协议: \"PD\", 技术: \"氮化镓\",\n  }],\n  \"gan65-fold\": [\"充电器\", {\n    标称功率: \"65W\", 接口: \"双口，支持 USB-C\", 插脚: \"可折叠\",\n    输出: \"双口共享功率\", 技术: \"氮化镓\",\n  }],\n  gan100: [\"充电器\", {\n    标称功率: \"100W\", 接口: \"三口，支持 USB-C\", 协议: \"PD\",\n    适用: \"笔记本\", 技术: \"氮化镓\",\n  }],\n  gan30: [\"充电器\", {\n    标称功率: \"30W\", 接口: \"1 × USB-C\", 协议: \"PD\",\n    适用: \"手机和小型平板\", 技术: \"氮化镓\",\n  }],\n  \"mag15-pad\": [\"无线充电板\", {\n    充电功率: \"15W\", 放置: \"平放，磁吸对齐\", 接口: \"USB-C\",\n  }],\n  \"mag15-stand\": [\"无线充电支架\", {\n    充电功率: \"15W\", 放置: \"横放或竖放\", 结构: \"磁吸双线圈\",\n  }],\n  \"basic-qi5\": [\"无线充电板\", {\n    充电功率: \"5W\", 放置: \"平放\", 接口: \"USB-C\",\n  }],\n  \"usb-c-braid-2\": [\"数据线\", {\n    线长: \"2 m\", 标称功率: \"100W\", 接口: \"双头 USB-C\", 外被: \"编织\",\n  }],\n  \"usb-c-angle-2\": [\"数据线\", {\n    线长: \"2 m\", 标称功率: \"60W\", 接口: \"USB-C，L 形弯头\", 外被: \"编织\",\n  }],\n  \"usb-c-1\": [\"数据线\", {\n    线长: \"1 m\", 标称功率: \"60W\", 接口: \"USB-C\", 外被: \"软胶\",\n  }],\n  \"hdmi-hub\": [\"扩展坞\", {\n    视频: \"HDMI 一进一出\", 接口: \"USB-C\", 扩展: \"PD / SD 读卡\",\n  }],\n  \"hdmi-splitter\": [\"分线器\", {\n    视频: \"HDMI 一进两出\", 画面规格: \"4K / 30 Hz\", 用途: \"两台屏幕显示同一信号\",\n  }],\n  \"desk-strip\": [\"排插\", {\n    孔位: \"3 个\", 线长: \"1.8 m\", 接口: \"USB-C\", 控制: \"独立开关\",\n  }],\n  \"travel-strip\": [\"排插\", {\n    孔位: \"3 个\", 线长: \"1 m\", 收纳: \"扁平线材可绕底部\",\n  }],\n  \"light-bar-pro\": [\"显示器挂灯\", {\n    灯体长度: \"48 cm\", 调节: \"色温与亮度\", 接口: \"USB-C\",\n    配光: \"非对称照明\", 安装: \"显示器上沿\",\n  }],\n  \"light-bar-mini\": [\"显示器挂灯\", {\n    灯体长度: \"36 cm\", 调节: \"亮度\", 接口: \"USB-C\", 安装: \"小尺寸显示器上沿\",\n  }],\n  \"wireless-light-bar\": [\"显示器挂灯\", {\n    灯体长度: \"52 cm\", 调节: \"无线旋钮调光\", 接口: \"USB-C\", 结构: \"横向调节支点\",\n  }],\n  \"basic-desk-lamp\": [\"台灯\", {\n    调节: \"三挡亮度\", 收纳: \"可折叠\", 接口: \"USB-C\", 使用场景: \"床头与窄桌\",\n  }],\n  \"large-clamp-lamp\": [\"台灯\", {\n    安装: \"桌沿夹装\", 调节: \"无级调光\", 模式: \"低蓝光模式\", 照明范围: \"大桌面\",\n  }],\n  \"wide-desk-lamp\": [\"台灯\", {\n    照明范围: \"双灯臂照亮大桌面\", 调节: \"亮度与色温\", 模式: \"低蓝光模式\",\n  }],\n  \"round-desk-lamp\": [\"床头灯\", {\n    光线: \"低亮度暖光\", 控制: \"定时关灯\", 底座: \"小圆盘底座\",\n  }],\n  \"floor-lamp\": [\"落地灯\", {\n    控制: \"可调光\", 灯头: \"可转向圆形灯头\", 使用场景: \"椅旁阅读\",\n  }],\n  \"film-floor-lamp\": [\"落地灯\", {\n    照明: \"暖光，反射至顶棚\", 结构: \"带桌旁小托盘\",\n  }],\n  \"touch-timer\": [\"计时器\", {\n    计时: \"25 分钟倒计时\", 声音: \"可关闭按键声\", 使用场景: \"桌面专注计时\",\n  }],\n  \"flip-timer\": [\"计时器\", {\n    启动: \"翻面启动\", 计时: \"固定倒计时\", 使用场景: \"桌面学习计时\",\n  }],\n  \"desk-clock\": [\"桌面时钟\", {\n    功能: \"时钟 / 闹钟\", 显示: \"温度\", 声音: \"静音\",\n  }],\n  \"clip-reader\": [\"夹书灯\", {\n    安装: \"夹在书页或床头\", 调节: \"三挡亮度\", 接口: \"USB-C\",\n  }],\n  \"task-lamp\": [\"台灯\", {\n    照明范围: \"广角照明，覆盖长桌\", 调节: \"无级调光\", 使用场景: \"绘图或长桌工作\",\n  }],\n};\n\nexport function merchandise(product) {\n  if (Object.hasOwn(profiles, product.id)) {\n    const [kind, facts] = profiles[product.id];\n    return {kind, specifications: Object.entries(facts).map(([label, value]) => ({label, value}))};\n  }\n  const facts = product.attributes?.join(\" / \");\n  return {kind: \"\", specifications: facts ? [{label: \"规格\", value: facts}] : []};\n}\n","group":"前端"},{"path":"static/search-suggestions.mjs","text":"const money = new Intl.NumberFormat(\"zh-CN\", { maximumFractionDigits: 2 });\n\nfunction normalize(value) {\n  return String(value ?? \"\").normalize(\"NFKC\").trim().replace(/\\s+/gu, \" \").toLocaleLowerCase(\"zh-CN\");\n}\n\nfunction optionRow(list, index, { kind, label, detail }) {\n  const option = document.createElement(\"div\");\n  option.id = `${list.id}-${index}`;\n  option.className = \"suggestion-option\";\n  option.dataset.suggestion = String(index);\n  option.dataset.kind = kind;\n  option.setAttribute(\"role\", \"option\");\n  option.setAttribute(\"aria-selected\", \"false\");\n\n  const title = document.createElement(\"span\");\n  title.className = \"suggestion-main\";\n  title.textContent = label;\n  const meta = document.createElement(\"span\");\n  meta.className = \"suggestion-meta\";\n  meta.textContent = detail;\n  option.append(title, meta);\n  return option;\n}\n\nexport function mountSearchSuggestions({ root, terms, findProducts, onQuery, onProduct, categoryName }) {\n  let input;\n  let list;\n  let draft = \"\";\n  let active = -1;\n  let options = [];\n  let composing = false;\n  const queryTerms = [...new Map(terms.map(term => [normalize(term), term])).entries()].filter(([key]) => key);\n\n  function reset({ restore = false } = {}) {\n    if (input) {\n      if (restore && active >= 0) input.value = draft;\n      input.setAttribute(\"aria-expanded\", \"false\");\n      input.removeAttribute(\"aria-activedescendant\");\n    }\n    if (list) {\n      list.hidden = true;\n      list.replaceChildren();\n    }\n    active = -1;\n    options = [];\n  }\n\n  function bind(field) {\n    if (input === field) return Boolean(list);\n    reset();\n    input = field;\n    list = field.form?.querySelector(\"#shop-suggestions\");\n    draft = field.value;\n    composing = false;\n    return Boolean(list);\n  }\n\n  function render() {\n    const typed = normalize(draft);\n    if (!typed || composing || !list) {\n      reset();\n      return;\n    }\n    const matchingTerms = queryTerms.filter(([key]) => key.startsWith(typed)).slice(0, 3);\n    const queries = matchingTerms.map(([, label]) => ({ kind: \"query\", label, detail: \"搜索词\" }));\n    const products = findProducts(draft).slice(0, 3).map(product => ({\n      kind: \"product\",\n      id: product.id,\n      label: product.name,\n      detail: [categoryName(product.category), product.sku, `¥${money.format(product.price)}`].filter(Boolean).join(\" · \"),\n    }));\n    options = [...queries, ...products];\n    active = -1;\n    list.hidden = options.length === 0;\n    input.setAttribute(\"aria-expanded\", String(!list.hidden));\n    input.removeAttribute(\"aria-activedescendant\");\n    list.replaceChildren(...options.map((option, index) => optionRow(list, index, option)));\n  }\n\n  function choose(index) {\n    const option = options[index];\n    if (
