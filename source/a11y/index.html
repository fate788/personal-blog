<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify accessibility review\non: [push, pull_request]\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build\n","group":"配置与启动"},{"path":".gitignore","text":"dist/\nnode_modules/\n","group":"配置与启动"},{"path":"README.md","text":"# 无障碍走查工作台\n\n用一套可操作的图书馆预约页面复核常见无障碍问题。切换修复前后，重新检查预览，在右侧定位问题，并记录用键盘走完预约的结果。\n\n[打开原始版本](https://fate788.github.io/personal-blog/demos/a11y/index.html?v=1.0) · [看修复后](https://fate788.github.io/personal-blog/demos/a11y/index.html?v=1.0&view=fixed) · [博客作品页](https://fate788.github.io/personal-blog/projects/a11y/index.html)\n\n![图书馆预约走查](docs/preview.webp)\n\n## 三步走查\n\n1. 在原始版本运行自动检查。选中一条问题，核对控件在页面上的实际位置与判定依据。\n2. 切换修复版，重新运行相同检查，再用 Tab 和 Enter 完成预约，检查焦点与确认提示，记录人工复核结果。\n3. 下载 JSON。报告保存两个版本的自动结果和人工结论。预约输入在当前页面内使用。\n\n## 本机运行\n\n需要 Node.js 22 或更新版本，无额外依赖。\n\n```sh\nnpm test\nnpm run build\n```\n\n构建后打开 `dist/index.html`，页面和 `dist/media` 保留在一起即可离线使用。\n\n## 检查范围\n\n自动检查读取内置预览的实际 DOM 与计算样式，覆盖预约输入标签、指定图片替代文本、帮助按钮名称、指定文本的颜色对比，以及演示段落的标题层级。颜色按 WCAG 的 sRGB 相对亮度计算。样例的说明文字从 2.20:1 提高到 8.65:1。人工核对键盘操作、可见焦点和确认信息。标题层级提示按此示例的信息结构判断。报告只记录约定的检查点，完整的无障碍评估需要覆盖更多页面、交互及辅助技术。\n\n设计依据 [WCAG 2.2](https://www.w3.org/TR/WCAG22/) 和 [WAI 无障碍检查方法](https://www.w3.org/WAI/test-evaluate/preliminary/)。\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 无障碍走查工作台 v1.0 源码包\n\n原始发布归档为 `无障碍走查工作台-v1.0.zip`。压缩包保留其中 11 份文本文件的原始路径与字节，本文件为导出说明。\n\n在 Node.js 22 或更新版本运行 npm test 和 npm run build，打开 dist/index.html。\n","group":"项目说明"},{"path":"build.mjs","text":"import { copyFile, mkdir, readFile, writeFile } from 'node:fs/promises';\nimport { dirname, resolve } from 'node:path';\n\nconst output = resolve(process.argv[2] || 'dist/index.html');\nconst read = async path => (await readFile(new URL(path, import.meta.url), 'utf8')).replaceAll('\\r\\n', '\\n');\nconst moduleUrl = source => `data:text/javascript;base64,${Buffer.from(source).toString('base64')}`;\nconst [html, css, app, engine, sample] = await Promise.all([\n  read('./static/index.html'), read('./static/styles.css'), read('./static/app.mjs'),\n  read('./engine.mjs'), read('./sample.mjs'),\n]);\n\nfunction inlineModule(source, path, script) {\n  const url = moduleUrl(script);\n  return source.replaceAll(`'${path}'`, `'${url}'`).replaceAll(`\"${path}\"`, `\"${url}\"`);\n}\n\nconst application = inlineModule(inlineModule(app, '../engine.mjs', engine), '../sample.mjs', sample);\nconst cssEntry = /\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css[\"'][^>]*>/iu;\nconst jsEntry = /\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs[\"'][^>]*>\\s*\u003c\\/script>/iu;\nif (!cssEntry.test(html) || !jsEntry.test(html)) throw new Error('找不到走查台的样式或脚本入口。');\n\nconst policy = \"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\nconst standalone = html.replace('\u003chead>', `\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(cssEntry, () => `\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(jsEntry, () => `\u003cscript type=\"module\" src=\"${moduleUrl(application)}\">\u003c/script>`);\n\nconst media = resolve(dirname(output), 'media');\nawait mkdir(media, { recursive: true });\nawait copyFile(new URL('./static/media/reading-room.webp', import.meta.url), resolve(media, 'reading-room.webp'));\nawait writeFile(output, standalone, 'utf8');\nconsole.log(`已生成无障碍走查工作台 ${output}`);\n","group":"配置与启动"},{"path":"engine.mjs","text":"const HEADING = 'h1,h2,h3,h4,h5,h6';\nconst STANDARD_TEXT_CONTRAST = 4.5;\nconst TARGET_ID = /^[a-z][a-z0-9-]*$/u;\n\nfunction colorChannels(value) {\n  if (value === 'transparent') return [0, 0, 0, 0];\n  if (/^#[\\da-f]{3}(?:[\\da-f])?$|^#[\\da-f]{6}(?:[\\da-f]{2})?$/iu.test(value)) {\n    const hex = value.slice(1);\n    const pairs = hex.length \u003c= 4 ? [...hex].map(digit => digit.repeat(2)) : hex.match(/.{2}/gu);\n    const [red, green, blue, alpha = 255] = pairs.map(pair => Number.parseInt(pair, 16));\n    return [red, green, blue, alpha / 255];\n  }\n  const match = /^rgba?\\(\\s*(\\d+(?:\\.\\d+)?)\\s*,\\s*(\\d+(?:\\.\\d+)?)\\s*,\\s*(\\d+(?:\\.\\d+)?)(?:\\s*,\\s*(\\d*\\.?\\d+))?\\s*\\)$/u.exec(value);\n  if (!match) return null;\n  const channels = match.slice(1, 4).map(Number);\n  const alpha = match[4] === undefined ? 1 : Number(match[4]);\n  return channels.every(channel => channel \u003c= 255) && alpha \u003c= 1 ? [...channels, alpha] : null;\n}\n\nfunction blend(foreground, background) {\n  const [red, green, blue, alpha] = foreground;\n  return [red, green, blue].map((channel, index) => channel * alpha + background[index] * (1 - alpha));\n}\n\nfunction luminance(rgb) {\n  const [red, green, blue] = rgb.map(channel => {\n    const srgb = channel / 255;\n    return srgb \u003c= 0.04045 ? srgb / 12.92 : ((srgb + 0.055) / 1.055) ** 2.4;\n  });\n  return 0.2126 * red + 0.7152 * green + 0.0722 * blue;\n}\n\n/** Ratio for normal text on a resolved opaque sRGB surface. */\nexport function contrastRatio(foreground, background) {\n  const ink = colorChannels(foreground);\n  const paper = colorChannels(background);\n  if (!ink || !paper || paper[3] !== 1) throw new TypeError('需要有效的 sRGB 文字颜色和不透明背景色。');\n  return ratioForChannels(ink, paper);\n}\n\nfunction ratioForChannels(ink, paper) {\n  const text = luminance(blend(ink, paper));\n  const background = luminance(paper.slice(0, 3));\n  return (Math.max(text, background) + 0.05) / (Math.min(text, background) + 0.05);\n}\n\nfunction present(element, getStyle) {\n  if (element.hidden || element.getAttribute('aria-hidden') === 'true') return false;\n  const style = getStyle(element);\n  return style.display !== 'none' && style.visibility !== 'hidden' && style.visibility !== 'collapse';\n}\n\nfunction presentInPreview(element, root, getStyle) {\n  for (let current = element; current; current = current.parentElement) {\n    if (!present(current, getStyle)) return false;\n    if (current === root) return true;\n  }\n  return false;\n}\n\nfunction contents(element, getStyle) {\n  const words = [];\n  for (const child of element.childNodes) {\n    if (child.nodeType === 3) words.push(child.textContent);\n    if (child.nodeType !== 1 || !present(child, getStyle)) continue;\n    words.push(child.localName === 'img' ? child.getAttribute('alt') ?? '' : contents(child, getStyle));\n  }\n  return words.join(' ').trim();\n}\n\n// Resolve the label patterns used in the exercise. This does not emulate the accessible-name algorithm.\nfunction authoredName(element, root) {\n  const relationships = element.getAttribute('aria-labelledby')?.trim().split(/\\s+/u) ?? [];\n  const referencedText = relationships.map(id => {\n    const target = root.ownerDocument.getElementById(id);\n    return target && root.contains(target) ? target.textContent.trim() : '';\n  }).filter(Boolean).join(' ');\n  return referencedText || element.getAttribute('aria-label')?.trim() || '';\n}\n\nfunction computationForContrast(element, root, getStyle) {\n  const foreground = colorChannels(getStyle(element).color);\n  if (!foreground) return null;\n  const layers = [];\n  let paper = null;\n  for (let current = element; current; current = current.parentElement) {\n    const style = getStyle(current);\n    if (Number(style.opacity) !== 1) return null;\n    if (!paper) {\n      if (style.backgroundImage !== 'none') return null;\n      const color = colorChannels(style.backgroundColor);\n      if (!color) return null;\n      if (color[3] === 1) paper = layers.reverse().reduce((opaque, layer) => blend(layer, opaque), color);\n      else if (color[3] > 0) layers.push(color);\n    }\n    if (current === root) break;\n  }\n  return paper ? ratioForChannels(foreground, paper) : null;\n}\n\nfunction headingLevels(root, getStyle) {\n  let previous = null;\n  const observation = new Map();\n  for (const element of root.querySelectorAll(HEADING)) {\n    if (!presentInPreview(element, root, getStyle)) continue;\n    const level = Number(element.localName.slice(1));\n    observation.set(element, { previous, level });\n    previous = level;\n  }\n  return observation;\n}\n\nconst CHECKS = [\n  {\n    marker: '[data-audit-label]', rule: 'form-label', title: '预约控件缺少关联标签', criterion: '1.3.1 / 4.1.2',\n    assess(element, root, getStyle) {\n      const named = authoredName(element, root) || [...(element.labels ?? [])]\n        .some(label => root.contains(label) && presentInPreview(label, root, getStyle) && contents(label, getStyle));\n      return named ? '' : '找不到关联的文字标签。相邻的提示文字没有通过 label 或 ARIA 与控件关联。';\n    },\n  },\n  {\n    marker: '[data-audit-informative]', rule: 'image-alt', title: '说明图片缺少替代文字', criterion: '1.1.1',\n    assess(element) {\n      return element.getAttribute('alt')?.trim() ? '' : '标为提供信息的图片缺少非空 alt，图片信息无法从此属性获得。';\n    },\n  },\n  {\n    marker: '[data-audit-name]', rule: 'button-name', title: '帮助按钮缺少可读名称', criterion: '4.1.2',\n    assess(element, root, getStyle) {\n      const name = authoredName(element, root) || contents(element, getStyle) || element.getAttribute('title')?.trim();\n      return name ? '' : '帮助按钮只有隐藏于辅助技术的图标，找不到按钮文字或明确的名称。';\n    },\n  },\n  {\n    marker: '[data-audit-contrast]', rule: 'text-contrast', title: '说明文字对比度不足或待复核', criterion: '1.4.3',\n    assess(element, root, getStyle) {\n      const ratio = computationForContrast(element, root, getStyle);\n      if (ratio === null) return '无法取得可计算的纯色背景，需人工复核这段文字。';\n      if (ratio >= STANDARD_TEXT_CONTRAST) return '';\n      const displayed = (Math.floor(ratio * 100) / 100).toFixed(2);\n      return `文字对比度为 ${displayed}:1，低于普通文字的 4.5:1 参考阈值。`;\n    },\n  },\n  {\n    marker: '[data-audit-heading]', rule: 'heading-order', title: '预约区域标题跳级', criterion: '1.3.1（层级复核提示）',\n    assess(element, _root, _getStyle, headings) {\n      const detail = headings.get(element);\n      if (!detail) return '未在走查区域内找到原生标题元素。';\n      const { previous, level } = detail;\n      return previous && level > previous + 1 ? `从 h${previous} 跳到 h${level}，请核对预约区块的标题层级。` : '';\n    },\n  },\n];\n\n/** Evaluate the annotated targets in a mounted sample and return portable evidence. */\nexport function auditPreview(root) {\n  const view = root?.ownerDocument?.defaultView;\n  if (!view || !root.isConnected) throw new TypeError('请先将样例接入浏览器文档。');\n  const getStyle = element => view.getComputedStyle(element);\n  const headings = headingLevels(root, getStyle);\n  const findings = [];\n  const ids = new Set();\n  let checked = 0;\n  for (const { marker, rule, title, criterion, assess } of CHECKS) {\n    for (const element of root.querySelectorAll(marker)) {\n      if (!presentInPreview(element, root, getStyle)) continue;\n      const id = element.getAttribute('data-audit-id');\n      if (!id || !TARGET_ID.test(id) || ids.has(id)) throw new TypeError('走查目标需要唯一的 data-audit-id。');\n      ids.add(id);\n      checked += 1;\n      const evidence = assess(element, root, getStyle, headings);\n      if (evidence) findings.push({ id, rule, selector: `[data-audit-id=\"${id}\"]`, title, criterion, evidence });\n    }\n  }\n  const failed = findings.length;\n  return { findings, totals: { checked, passed: checked - failed, failed } };\n}\n","group":"后端"},{"path":"package.json","text":"{\n  \"name\": \"accessibility-review\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": { \"node\": \">=22\" },\n  \"scripts\": {\n    \"build\": \"node build.mjs\",\n    \"test\": \"node --test tests/*.test.mjs\"\n  }\n}\n","group":"配置与启动"},{"path":"sample.mjs","text":"const SLOTS = Object.freeze([\n  ['morning', '09:00–10:30'],\n  ['midday', '11:00–12:30'],\n  ['afternoon', '14:00–15:30'],\n]);\n\nfunction node(tag, className, text) {\n  const element = document.createElement(tag);\n  if (className) element.className = className;\n  if (text) element.textContent = text;\n  return element;\n}\n\nfunction hero(fixed) {\n  const section = node('header', 'sample-hero');\n  const photo = node('img', 'sample-photo');\n  photo.src = './media/reading-room.webp';\n  photo.dataset.auditInformative = '';\n  photo.dataset.auditId = 'room-image';\n  if (fixed) photo.alt = '图书馆二层静读室，长桌沿窗排列，桌间留有通道。';\n\n  const copy = node('div', 'sample-hero-copy');\n  copy.append(\n    node('p', 'sample-kicker', '砚池图书馆 · 二层'),\n    node('h2', 'sample-title', '静读室预约'),\n    node('p', 'sample-subtitle', '挑一个时段，留出一段安静阅读的时间。'),\n  );\n\n  const button = node('button', 'sample-help-button');\n  button.type = 'button';\n  button.dataset.auditName = '';\n  button.dataset.auditId = 'help-button';\n  button.setAttribute('aria-expanded', 'false');\n  button.setAttribute('aria-controls', 'sample-booking-help');\n  if (fixed) button.setAttribute('aria-label', '预约说明');\n  const icon = node('span', 'sample-help-icon', '?');\n  icon.setAttribute('aria-hidden', 'true');\n  button.append(icon);\n  section.append(photo, copy, button);\n\n  const help = node('p', 'sample-help', '请提前 10 分钟到二层服务台，出示预约时填写的姓名。每个时段限预约一个座位。');\n  help.id = 'sample-booking-help';\n  help.hidden = true;\n  button.addEventListener('click', () => {\n    help.hidden = !help.hidden;\n    button.setAttribute('aria-expanded', String(!help.hidden));\n  });\n\n  return [section, help];\n}\n\nfunction form(fixed) {\n  const section = node('form', 'sample-form');\n  section.noValidate = true;\n  const heading = node(fixed ? 'h3' : 'h4', 'sample-section-title', '选择预约信息');\n  heading.dataset.auditHeading = '';\n  heading.dataset.auditId = 'booking-form-heading';\n  const date = node('time', 'sample-date', '12 月 2 日 · 周三');\n  date.dateTime = '2026-12-02';\n  const titleRow = node('div', 'sample-section-heading');\n  titleRow.append(heading, date);\n\n  const grid = node('div', 'sample-form-grid');\n  const nameField = node('div', 'sample-field');\n  const name = node('input', 'sample-input');\n  name.type = 'text';\n  name.id = 'sample-name';\n  name.maxLength = 24;\n  name.required = true;\n  name.autocomplete = 'off';\n  name.dataset.auditLabel = '';\n  name.dataset.auditId = 'booking-name';\n  const nameLabel = node(fixed ? 'label' : 'span', 'sample-label', '预约姓名');\n  if (fixed) nameLabel.htmlFor = name.id;\n  nameField.append(nameLabel, name);\n\n  const slotField = node('div', 'sample-field');\n  const slot = node('select', 'sample-input sample-select');\n  slot.id = 'sample-slot';\n  const timeLabel = node('label', 'sample-label', '入场时段');\n  timeLabel.htmlFor = slot.id;\n  for (const [value, label] of SLOTS) {\n    const option = node('option', '', label);\n    option.value = value;\n    slot.append(option);\n  }\n  slotField.append(timeLabel, slot);\n  grid.append(nameField, slotField);\n\n  const note = node('p', 'sample-note', '每次预约 90 分钟。离场时请带走随身物品。');\n  note.dataset.auditContrast = '';\n  note.dataset.auditId = 'booking-note';\n\n  const error = node('p', 'sample-error');\n  error.id = 'sample-error';\n  error.hidden = true;\n  const errorRegion = node('div');\n  if (fixed) errorRegion.setAttribute('role', 'alert');\n  errorRegion.append(error);\n\n  const actions = node('div', 'sample-actions');\n  const book = node('button', 'sample-submit', '确认预约');\n  book.type = 'submit';\n  actions.append(book);\n\n  const result = node('p', 'sample-result');\n  result.hidden = true;\n  const resultRegion = node('div');\n  if (fixed) resultRegion.setAttribute('role', 'status');\n  resultRegion.append(result);\n\n  function clearError() {\n    error.hidden = true;\n    error.textContent = '';\n    name.removeAttribute('aria-invalid');\n    name.removeAttribute('aria-describedby');\n  }\n\n  function clearResult() {\n    result.hidden = true;\n    result.textContent = '';\n  }\n\n  name.addEventListener('input', () => {\n    if (name.value.trim()) clearError();\n    clearResult();\n  });\n  slot.addEventListener('change', clearResult);\n  section.addEventListener('submit', event => {\n    event.preventDefault();\n    const reader = name.value.trim();\n    if (!reader) {\n      clearResult();\n      if (fixed) {\n        name.setAttribute('aria-invalid', 'true');\n        name.setAttribute('aria-describedby', error.id);\n      }\n      error.hidden = false;\n      error.textContent = '请输入预约姓名。';\n      name.focus();\n      return;\n    }\n    clearError();\n    const time = slot.selectedOptions[0].textContent;\n    result.hidden = false;\n    result.textContent = `${reader}，预约已确认。12 月 2 日 ${time}，砚池图书馆二层静读室。`;\n  });\n  section.append(titleRow, grid, note, errorRegion, actions, resultRegion);\n  return section;\n}\n\nexport function renderSample(host, version) {\n  if (version !== 'baseline' && version !== 'fixed') throw new RangeError('预约样例版本无效。');\n  const fixed = version === 'fixed';\n  const preview = node('div', `sample-booking sample-${version}`);\n  preview.append(...hero(fixed), form(fixed));\n  host.replaceChildren(preview);\n  return preview;\n}\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import { auditPreview } from '../engine.mjs';\nimport { renderSample } from '../sample.mjs';\n\nconst byId = id => document.getElementById(id);\nconst versionLabels = { baseline: '修复前', fixed: '修复后' };\nconst versionOrder = ['baseline', 'fixed'];\nconst checks = [\n  { id: 'tab-order', title: '键盘动线', guidance: '用 Tab 和 Shift+Tab 移动。选时段时，按空格打开，再用方向键和回车选择。', criterion: '2.4.3' },\n  { id: 'focus', title: '焦点可见', guidance: '逐个停在可操作控件上，确认能看清当前焦点的位置。', criterion: '2.4.7' },\n  { id: 'submit-feedback', title: '提交反馈', guidance: '先提交空表单，再填写预约信息。确认可以找到错误和成功反馈。', criterion: '3.3.1' },\n];\nconst choices = { pending: '待复核', pass: '通过', fail: '未通过' };\nconst checksByRule = {\n  'form-label': '表单标签',\n  'image-alt': '图片替代文本',\n  'button-name': '按钮名称',\n  'text-contrast': '文字对比度',\n  'heading-order': '标题层级',\n};\n\nconst state = {\n  mode: new URLSearchParams(location.search).get('view') === 'fixed' ? 'fixed' : 'baseline',\n  audits: { baseline: null, fixed: null },\n  manual: Object.fromEntries(versionOrder.map(version => [version, Object.fromEntries(checks.map(check => [check.id, 'pending']))])),\n  selected: null,\n  sampleRoot: null,\n};\n\nfunction node(tag, text, classes) {\n  const result = document.createElement(tag);\n  if (text !== undefined) result.textContent = text;\n  if (classes) result.className = classes;\n  return result;\n}\n\nfunction announce(text) {\n  byId('announcement').textContent = text;\n}\n\nfunction currentFinding() {\n  return state.audits[state.mode]?.findings.find(item => item.id === state.selected);\n}\n\nfunction targetFor(finding) {\n  return finding && state.sampleRoot?.querySelector(finding.selector);\n}\n\nfunction positionMarker() {\n  const marker = byId('focus-mark');\n  const target = targetFor(currentFinding());\n  if (!target) {\n    marker.hidden = true;\n    return;\n  }\n  const targetRect = target.getBoundingClientRect();\n  const previewRect = byId('preview-wrap').getBoundingClientRect();\n  if (!targetRect.width || !targetRect.height) {\n    marker.hidden = true;\n    return;\n  }\n  const padding = targetRect.width + 8 \u003c previewRect.width ? 4 : 0;\n  marker.style.left = `${targetRect.left - previewRect.left - padding}px`;\n  marker.style.top = `${targetRect.top - previewRect.top - padding}px`;\n  marker.style.width = `${targetRect.width + 2 * padding}px`;\n  marker.style.height = `${targetRect.height + 2 * padding}px`;\n  marker.hidden = false;\n}\n\nfunction renderDetail(finding) {\n  const panel = byId('finding-detail');\n  panel.hidden = !finding;\n  panel.replaceChildren();\n  if (finding) {\n    panel.append(\n      node('h3', '检测证据'),\n      node('p', finding.evidence),\n      node('code', finding.selector),\n    );\n  }\n  positionMarker();\n}\n\nfunction runAudit({ speak = false } = {}) {\n  const audit = auditPreview(state.sampleRoot);\n  state.audits[state.mode] = audit;\n  const { checked, passed, failed } = audit.totals;\n  byId('checked-total').textContent = checked;\n  byId('failed-total').textContent = failed;\n  byId('passed-total').textContent = passed;\n  byId('metric-version').textContent = versionLabels[state.mode];\n  const badge = byId('findings-count');\n  badge.hidden = failed === 0;\n  badge.textContent = `${failed} 项待复核`;\n\n  const noFindings = byId('empty-findings');\n  noFindings.hidden = failed > 0;\n  noFindings.textContent = '当前版本的五项自动规则均通过。仍可在下方复核键盘操作和提交反馈。';\n  if (!audit.findings.some(finding => finding.id === state.selected)) {\n    state.selected = audit.findings[0]?.id ?? null;\n  }\n\n  const list = byId('finding-list');\n  list.classList.toggle('fixed-checks', failed === 0);\n  if (failed === 0) {\n    list.replaceChildren(...Object.values(checksByRule).map(label => {\n      const item = node('div', undefined, 'fixed-check');\n      item.append(node('span', label), node('span', '通过'));\n      return item;\n    }));\n  } else {\n    list.replaceChildren(...audit.findings.map(finding => {\n      const button = node('button', undefined, 'finding-button');\n      button.type = 'button';\n      button.dataset.findingId = finding.id;\n      button.setAttribute('aria-pressed', String(state.selected === finding.id));\n      button.setAttribute('aria-controls', 'finding-detail');\n      button.append(node('span', finding.title, 'finding-name'), node('span', finding.criterion, 'finding-rule'));\n      return button;\n    }));\n  }\n\n  renderDetail(currentFinding());\n  if (speak) announce(`${versionLabels[state.mode]}检查完成。检查 ${checked} 项，${failed} 项待复核。`);\n}\n\nfunction updateManual() {\n  const outcomes = state.manual[state.mode];\n  const controls = byId('manual-list');\n  for (const element of controls.querySelectorAll('[data-outcome]')) {\n    element.setAttribute('aria-pressed', String(outcomes[element.closest('[data-manual-id]').dataset.manualId] === element.dataset.outcome));\n  }\n  const recorded = Object.values(outcomes).filter(outcome => outcome !== 'pending').length;\n  byId('manual-count').textContent = `${recorded} / ${checks.length} 已记录`;\n}\n\nfunction setupManual() {\n  const list = byId('manual-list');\n  list.replaceChildren(...checks.map(check => {\n    const item = node('section', undefined, 'manual-item');\n    item.dataset.manualId = check.id;\n    const title = node('h3', check.title);\n    title.id = `manual-${check.id}`;\n    const options = node('div', undefined, 'manual-choice');\n    options.setAttribute('role', 'group');\n    options.setAttribute('aria-labelledby', title.id);\n    for (const [key, name] of Object.entries(choices)) {\n      const button = node('button', name);\n      button.type = 'button';\n      button.dataset.outcome = key;\n      options.append(button);\n    }\n    item.append(title, node('p', check.guidance), options);\n    return item;\n  }));\n}\n\nfunction showVersion(mode, speak = false) {\n  state.mode = mode;\n  state.selected = null;\n  byId('mode-baseline').setAttribute('aria-pressed', String(mode === 'baseline'));\n  byId('mode-fixed').setAttribute('aria-pressed', String(mode === 'fixed'));\n  state.sampleRoot = renderSample(byId('preview-sample'), mode);\n  runAudit({ speak });\n  updateManual();\n}\n\nfunction saveReport() {\n  const report = {\n    schemaVersion: 1,\n    sample: '图书馆阅览室预约',\n    scope: '仅覆盖已检查的预约样例规则。键盘与提交反馈为人工复核。',\n    versions: Object.fromEntries(versionOrder.map(version => [version, {\n      name: versionLabels[version],\n      audit: state.audits[version],\n      manual: checks.map(check => ({ id: check.id, title: check.title, criterion: check.criterion, outcome: state.manual[version][check.id] })),\n    }])),\n  };\n  const url = URL.createObjectURL(new Blob([`${JSON.stringify(report, null, 2)}\\n`], { type: 'application/json;charset=utf-8' }));\n  const anchor = node('a');\n  anchor.href = url;\n  anchor.download = '图书馆预约无障碍走查.json';\n  document.body.append(anchor);\n  anchor.click();\n  anchor.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1_000);\n  announce('已导出走查报告。');\n}\n\nbyId('mode-baseline').addEventListener('click', () => { if (state.mode !== 'baseline') showVersion('baseline', true); });\nbyId('mode-fixed').addEventListener('click', () => { if (state.mode !== 'fixed') showVersion('fixed', true); });\nbyId('run-audit').addEventListener('click', () => runAudit({ speak: true }));\nbyId('export-report').addEventListener('click', saveReport);\nbyId('finding-list').addEventListener('click', event => {\n  const button = event.target.closest('[data-finding-id]');\n  if (!button) return;\n  state.selected = button.dataset.findingId;\n  for (const control of byId('finding-list').querySelectorAll('[data-finding-id]')) {\n    control.setAttribute('aria-pressed', String(control === button));\n  }\n  const finding = currentFinding();\n  renderDetail(finding);\n  targetFor(finding)?.scrollIntoView({ block: 'nearest' });\n  announce(finding.evidence);\n});\nbyId('manual-list').addEventListener('click', event => {\n  const button = event.target.closest('[data-outcome]');\n  if (!button) return;\n  const item = button.closest('[data-manual-id]');\n  state.manual[state.mode][item.dataset.manualId] = button.dataset.outcome;\n  updateManual();\n  announce(`${item.querySelector('h3').textContent}已记为${choices[button.dataset.outcome]}。`);\n});\nnew ResizeObserver(positionMarker).observe(byId('preview-sample'));\nbyId('preview-sample').addEventListener('click', () => requestAnimationFrame(positionMarker));\nbyId('preview-sample').addEventListener('submit', () => requestAnimationFrame(positionMarker));\n\nsetupManual();\nconst inactiveVersion = state.mode === 'baseline' ? 'fixed' : 'baseline';\nstate.audits[inactiveVersion] = auditPreview(renderSample(byId('preview-sample'), inactiveVersion));\nshowVersion(state.mode);\nbyId('run-audit').disabled = false;\nbyId('export-report').disabled = false;\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#291f28\">\n  \u003cmeta name=\"description\" content=\"在图书馆预约样例中对照修复前后，复核可访问性问题和键盘操作。\">\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n  \u003ctitle>无障碍走查工作台\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip\" href=\"#workbench\">跳到走查工作区\u003c/a>\n  \u003cheader class=\"mast\">\n    \u003cdiv class=\"shell mast-inner\">\n      \u003ca class=\"brand\" href=\"./index.html\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>无障碍走查工作台\u003c/a>\n      \u003cbutton type=\"button\" class=\"button mast-action\" id=\"export-report\" disabled>导出走查报告 \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cmain class=\"shell main\" id=\"workbench\" tabindex=\"-1\">\n    \u003csection class=\"intro\" aria-labelledby=\"headline\">\n      \u003cdiv class=\"intro-copy\">\n        \u003ch1 id=\"headline\">图书馆预约无障碍走查\u003c/h1>\n        \u003cp>对照修复前后，在同一条预约流程中复核问题。\u003c/p>\n        \u003cdiv class=\"intro-actions\">\n          \u003cdiv class=\"version-switch\" role=\"group\" aria-label=\"预约样例版本\">\n            \u003cbutton type=\"button\" id=\"mode-baseline\" aria-pressed=\"true\">修复前\u003c/button>\n            \u003cbutton type=\"button\" id=\"mode-fixed\" aria-pressed=\"false\">修复后\u003c/button>\n          \u003c/div>\n          \u003cbutton type=\"button\" class=\"button run-action\" id=\"run-audit\" disabled>\u003cspan aria-hidden=\"true\">↻\u003c/span> 重新检查\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003csection class=\"metrics\" aria-labelledby=\"metrics-heading\">\n        \u003cdiv class=\"metrics-head\">\u003ch2 id=\"metrics-heading\">自动检查\u003c/h2>\u003cspan id=\"metric-version\">修复前\u003c/span>\u003c/div>\n        \u003cdl id=\"audit-totals\">\n          \u003cdiv>\u003cdt>已检查\u003c/dt>\u003cdd id=\"checked-total\">–\u003c/dd>\u003c/div>\n          \u003cdiv>\u003cdt>待复核\u003c/dt>\u003cdd id=\"failed-total\">–\u003c/dd>\u003c/div>\n          \u003cdiv>\u003cdt>已通过\u003c/dt>\u003cdd id=\"passed-total\">–\u003c/dd>\u003c/div>\n        \u003c/dl>\n      \u003c/section>\n    \u003c/section>\n\n    \u003cdiv id=\"announcement\" class=\"sr-only\" role=\"status\">\u003c/div>\n    \u003csection class=\"workspace\" aria-label=\"预约样例与检查结果\">\n      \u003csection class=\"preview\" aria-labelledby=\"preview-title\">\n        \u003cdiv class=\"preview-bar\">\u003ch2 id=\"preview-title\">交互预览\u003c/h2>\u003cspan>本地预约演示\u003c/span>\u003c/div>\n        \u003cdiv class=\"preview-wrap\" id=\"preview-wrap\">\n          \u003cdiv id=\"preview-sample\">\u003c/div>\n          \u003cdiv id=\"focus-mark\" class=\"focus-mark\" aria-hidden=\"true\" hidden>\u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"findings\" aria-labelledby=\"findings-title\">\n        \u003cheader class=\"findings-head\">\u003cdiv>\u003ch2 id=\"findings-title\">问题与证据\u003c/h2>\u003cp>选择问题，定位到预约页面。\u003c/p>\u003c/div>\u003cspan id=\"findings-count\" class=\"findings-count\" hidden>\u003c/span>\u003c/header>\n        \u003cdiv id=\"finding-list\" class=\"finding-list\" aria-label=\"检查发现\">\u003c/div>\n        \u003cdiv id=\"finding-detail\" class=\"finding-detail\" hidden>\u003c/div>\n        \u003cp id=\"empty-findings\" class=\"empty-findings\" hidden>\u003c/p>\n      \u003c/section>\n    \u003c/section>\n\n    \u003csection class=\"manual\" aria-labelledby=\"manual-heading\">\n      \u003cheader class=\"manual-head\">\n        \u003cdiv>\u003ch2 id=\"manual-heading\">键盘走查\u003c/h2>\u003cp>在预约预览里操作，再给当前版本记录结果。\u003c/p>\u003c/div>\n        \u003cp class=\"manual-count\" id=\"manual-count\">0 / 3 已记录\u003c/p>\n      \u003c/header>\n      \u003cdiv class=\"manual-list\" id=\"manual-list\">\u003c/div>\n    \u003c/section>\n  \u003c/main>\n  \u003cfooter class=\"shell foot\">\n    \u003cp>检查范围限于演示页的五项自动规则。键盘操作和反馈由人工复核。\u003c/p>\n  \u003c/footer>\n  \u003cnoscript>\u003cp class=\"shell\">工作台需要 JavaScript 以运行本地检查。\u003c/p>\u003c/noscript>\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --page: #f5f0e8;\n  --paper: #fffcf6;\n  --ink: #302521;\n  --muted: #695943;\n  --night: #302331;\n  --accent: #674354;\n  --line: #dfd3c5;\n  --soft: #f2eae0;\n  --alarm: #884120;\n  --alarm-bg: #faebdd;\n  --ok: #275546;\n  --ok-bg: #e7eee4;\n  --heading: 'Noto Serif CJK SC', 'Source Han Serif SC', 'Songti SC', STSong, SimSun, serif;\n  --text: 'PingFang SC', 'Microsoft YaHei UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;\n  --number: 'Segoe UI', system-ui, sans-serif;\n  --mono: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;\n  font-family: var(--text);\n  font-size: 15px;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody { margin: 0; background: var(--page); color: var(--ink); }\nh1, h2, h3, h4, p, dl, dd { margin: 0; }\na { color: inherit; }\nbutton, input, select { font: inherit; }\nbutton { cursor: pointer; }\nbutton:disabled { opacity: .65; cursor: default; }\n:where(button, a, input, select):focus-visible { outline: 3px solid #8f5728; outline-offset: 3px; }\n.shell { width: min(1312px, 100% - 72px); margin-inline: auto; }\n.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }\n.skip { position: fixed; z-index: 5; top: 12px; left: 12px; transform: translateY(-170%); padding: 10px 15px; background: var(--paper); color: var(--ink); }\n.skip:focus { transform: none; }\n\n.mast { color: #fff7e8; background: var(--night); border-bottom: 1px solid #73586a; }\n.mast-inner { min-height: 61px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }\n.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 720; letter-spacing: .03em; text-decoration: none; white-space: nowrap; }\n.brand-mark { width: 29px; height: 29px; border: 1px solid #a3818d; border-radius: 5px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 7px; background: #51364a; }\n.brand-mark i { display: block; width: 3px; height: 12px; background: #f2dbb0; border-radius: 1px; }\n.brand-mark i:nth-child(2) { height: 10px; }\n.brand-mark i:nth-child(3) { height: 13px; transform: rotate(-15deg); margin-left: 1px; }\n.button { min-height: 36px; padding: 7px 11px; border-radius: 5px; border: 1px solid; color: inherit; font-size: 12px; font-weight: 670; white-space: nowrap; }\n.mast-action { background: #453044; border-color: #957182; color: #fff5e4; }\n.mast-action:not(:disabled):hover { background: #65455a; }\n.mast :focus-visible { outline-color: #fae4b4; }\n\n.main { padding-top: 30px; }\n.intro { display: grid; grid-template-columns: 1fr minmax(275px, .49fr); gap: 30px; align-items: end; padding: 4px 0 24px; border-bottom: 1px solid var(--line); }\n.intro-copy, .metrics { min-width: 0; }\n.intro h1 { font: 740 clamp(29px, 3.1vw, 51px)/1.2 var(--heading); letter-spacing: .033em; text-wrap: balance; }\n.intro-copy > p { margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.65; }\n.intro-actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 17px; }\n.version-switch { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid #d8c9bb; border-radius: 6px; background: #eae1d7; }\n.version-switch button { min-height: 34px; padding: 6px 15px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #513b47; font-size: 13px; font-weight: 630; white-space: nowrap; }\n.version-switch button[aria-pressed='true'] { background: #5c3d52; color: #fff5e9; border-color: #5c3d52; }\n.version-switch button[aria-pressed='false']:hover { background: #f5ede3; }\n.run-action { background: var(--paper); border-color: #c7b3ba; color: #604255; }\n.run-action:not(:disabled):hover { background: #eee2e8; }\n.run-action span { margin-right: 3px; font-size: 14px; }\n.metrics { align-self: end; border: 1px solid #ded0c0; border-top: 2px solid #986678; border-radius: 8px; padding: 13px 16px 15px; background: #fcf8f1; box-shadow: 0 8px 18px #48271107; }\n.metrics-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }\n.metrics-head h2 { font-size: 13px; }\n#metric-version { font-size: 11px; border: 1px solid #dccbbd; border-radius: 3px; padding: 2px 6px; color: #614453; background: #f9efe5; }\n.metrics dl { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }\n.metrics dl div { display: flex; flex-direction: column-reverse; gap: 3px; }\n.metrics dl div + div { border-left: 1px solid #e2d8ca; padding-left: 12px; }\n.metrics dt { font-size: 11px; font-weight: 570; color: var(--muted); white-space: nowrap; }\n.metrics dd { font: 650 clamp(20px, 3vw, 39px)/1.08 var(--number); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }\n#failed-total { color: var(--alarm); }\n#passed-total { color: var(--ok); }\n\n.workspace { display: grid; grid-template-columns: minmax(0, 1.56fr) minmax(300px, 1fr); align-items: stretch; gap: 16px; margin-top: 19px; }\n.preview, .findings, .manual { min-width: 0; border: 1px solid #d9cec1; border-radius: 8px; background: var(--paper); box-shadow: 0 7px 18px #48271108; }\n.preview { overflow: clip; }\n.preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; background: #ecdfce; border-bottom: 1px solid #dccdb9; }\n.preview-bar h2 { font-size: 13px; letter-spacing: .04em; }\n.preview-bar span { color: #5c4d3b; font-size: 11px; }\n.preview-wrap { position: relative; }\n.focus-mark { position: absolute; z-index: 2; pointer-events: none; border: 2px solid #995323; outline: 1px solid #fff8db; border-radius: 5px; box-shadow: 0 0 0 3px #ffe2a479; }\n\n.sample-booking { min-width: 0; color: #2d3029; background: #fbf9f0; }\n.sample-hero { min-height: 223px; position: relative; isolation: isolate; display: flex; align-items: end; padding: 22px; color: #fffaec; overflow: clip; background: #413b34; }\n.sample-hero::after { position: absolute; content: ''; inset: 0; z-index: -1; background: linear-gradient(90deg, #251c18c9 0%, #332923a6 47%, #3d2a2142 80%), linear-gradient(0deg, #281f1ab5, transparent 63%); }\n.sample-photo { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }\n.sample-hero-copy { max-width: calc(100% - 35px); }\n.sample-kicker { margin-bottom: 5px; color: #fff6d4; font-weight: 700; font-size: 11px; letter-spacing: .13em; }\n.sample-title { color: #fffaf0; font: 720 clamp(27px, 3.15vw, 43px)/1.15 var(--heading); letter-spacing: .055em; text-shadow: 0 1px 5px #292019; }\n.sample-subtitle { margin-top: 8px; color: #fff8e2; font-size: 12px; line-height: 1.6; }\n.sample-help-button { position: absolute; top: 14px; right: 15px; width: 40px; min-height: 40px; border: 1px solid #ebdac0; border-radius: 50%; background: #382b24; color: #fff8e3; font-family: var(--number); font-size: 16px; font-weight: 700; }\n.sample-help-button:hover { background: #624a3a; }\n.sample-help { border-bottom: 1px solid #d8cdb7; background: #f5ebd5; padding: 11px 16px; color: #553f2e; font-size: 13px; line-height: 1.65; }\n.sample-form { padding: 17px 22px 19px; }\n.sample-section-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }\n.sample-section-title { font: 720 21px/1.2 var(--heading); color: #3d352c; }\n.sample-date { color: #655746; font-size: 12px; font-weight: 620; white-space: nowrap; }\n.sample-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }\n.sample-field { display: grid; gap: 5px; min-width: 0; }\n.sample-label { color: #443a2d; font-size: 12px; font-weight: 690; }\n.sample-input { width: 100%; min-height: 39px; min-width: 0; padding: 7px 9px; border: 1px solid #9e8d7c; border-radius: 5px; color: #342e27; background: #fffdf8; }\n.sample-input::placeholder { color: #786953; }\nselect.sample-input { padding-right: 14px; }\n@supports (appearance: base-select) and selector(::picker(select)) {\n  .sample-select, .sample-select::picker(select) { appearance: base-select; }\n  .sample-select { align-items: center; cursor: pointer; }\n  .sample-select::picker-icon { color: #674354; }\n  .sample-select::picker(select) { margin-block: 4px; padding: 3px; border: 1px solid #9e8d7c; border-radius: 5px; background: #fffdf8; color: #342e27; box-shadow: 0 7px 18px #48271125; }\n  .sample-select option { min-height: 34px; padding: 6px 9px; border-radius: 3px; }\n  .sample-select option:checked { background: #eae1d7; color: #52354b; font-weight: 690; }\n  .sample-select option:is(:hover, :focus-visible) { background: #5c3d52; color: #fff5e9; }\n}\n.sample-note { display: block; width: fit-content; max-width: 100%; margin-top: 10px; padding: 4px 6px; font-size: 12px; line-height: 1.55; border-radius: 3px; }\n.sample-baseline .sample-note { color: #9fa9a6; background: #f4f5ef; }\n.sample-fixed .sample-note { color: #354a44; background: #f4f5ef; }\n.sample-baseline :focus-visible { outline: none; box-shadow: none; }\n.sample-fixed :focus-visible { outline: 3px solid #793f4e; outline-offset: 3px; }\n.sample-fixed .sample-help-button:focus-visible { outline-color: #fff3ba; }\n.sample-actions { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\n.sample-submit { min-height: 39px; border: 1px solid #503047; border-radius: 4px; padding: 8px 14px; background: #503047; color: #fff8e9; font-weight: 650; font-size: 13px; white-space: nowrap; }\n.sample-submit:hover { background: #754e64; }\n.sample-error, .sample-result { margin-top: 10px; border: 1px solid; border-radius: 5px; font-size: 13px; line-height: 1.6; padding: 7px 9px; overflow-wrap: anywhere; }\n.sample-error { color: #802923; background: #fceee5; border-color: #e4beb3; }\n.sample-result { color: #2d5143; background: #e8efe2; border-color: #bbd2bf; }\n\n.findings { padding: 16px 16px 14px; }\n.findings-head, .manual-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }\n.findings-head h2, .manual-head h2 { font: 700 23px/1.25 var(--heading); letter-spacing: .04em; }\n.findings-head p, .manual-head p { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.6; }\n.findings-count { font: 700 11px/1.2 var(--text); white-space: nowrap; border: 1px solid #e6c5b5; border-radius: 4px; padding: 3px 6px; color: var(--alarm); background: var(--alarm-bg); }\n.finding-list { display: grid; gap: 5px; margin-top: 12px; }\n.finding-button { width: 100%; min-height: 43px; display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 9px; align-items: center; text-align: left; padding: 6px 9px; color: #47372e; background: #faf5eb; border: 1px solid #e5d8c7; border-radius: 4px; }\n.finding-button::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #9b522c; }\n.finding-button[aria-pressed='true'] { background: #f5e6db; border-color: #ad765d; color: #643523; }\n.finding-button:hover { background: #faeade; }\n.finding-name { min-width: 0; font-size: 13px; font-weight: 670; overflow-wrap: anywhere; }\n.finding-rule { color: #6c4d3e; font: 620 11px/1.1 var(--number); white-space: nowrap; }\n.finding-detail { margin-top: 10px; padding: 9px 10px; background: #f7ede1; border-left: 2px solid #a86d53; border-radius: 0 4px 4px 0; }\n.finding-detail h3 { font-size: 13px; }\n.finding-detail p { margin-top: 4px; color: #574233; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }\n.finding-detail code { display: block; margin-top: 4px; color: #614555; font: 11px/1.5 var(--mono); overflow-wrap: anywhere; }\n.empty-findings { margin-top: 10px; padding: 10px 12px; border: 1px solid #c2d2bf; border-radius: 5px; background: var(--ok-bg); color: var(--ok); font-size: 13px; line-height: 1.65; }\n.fixed-checks { display: grid; gap: 4px; margin-top: 9px; }\n.fixed-check { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 9px; border-bottom: 1px solid var(--line); color: #4d3f37; font-size: 13px; }\n.fixed-check span:last-child { color: var(--ok); font-size: 11px; font-weight: 650; white-space: nowrap; }\n\n.manual { margin-top: 15px; padding: 16px; }\n.manual-head .manual-count { color: #594555; font: 650 12px/1.4 var(--text); white-space: nowrap; }\n.manual-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 12px; }\n.manual-item { min-width: 0; border: 1px solid #e3d8ca; border-radius: 5px; background: #fbf6ee; padding: 10px; }\n.manual-item h3 { font-size: 14px; }\n.manual-item p { margin-top: 4px; min-height: 2.7em; color: var(--muted); font-size: 12px; line-height: 1.55; }\n.manual-choice { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }\n.manual-choice button { min-height: 32px; white-space: nowrap; padding: 4px 6px; border: 1px solid #d8cbbe; border-radius: 4px; color: #594636; background: #fffbf2; font-size: 11px; }\n.manual-choice button[aria-pressed='true'] { background: #ede0e5; color: #604057; border-color: #9e7588; font-weight: 670; }\n.manual-choice button[data-outcome='pass'][aria-pressed='true'] { background: var(--ok-bg); color: var(--ok); border-color: #648e79; }\n.manual-choice button[data-outcome='fail'][aria-pressed='true'] { background: var(--alarm-bg); color: var(--alarm); border-color: #ac7855; }\n.foot { padding: 10px 0 20px; color: var(--muted); font-size: 11px; line-height: 1.55; }\n\n@media (max-width: 960px) {\n  .shell { width: calc(100% - 38px); }\n  .workspace { grid-template-columns: minmax(0, 1.22fr) minmax(275px, 1fr); gap: 10px; }\n  .intro { gap: 14px; }\n  .sample-form, .sample-hero { padding-inline: 15px; }\n  .findings { padding-inline: 12px; }\n}\n@media (max-width: 700px) {\n  .shell { width: calc(100% - 26px); }\n  .mast-inner { min-height: 53px; gap: 6px; }\n  .brand { gap: 6px; font-size: 13px; }\n  .brand-mark { width: 25px; height: 25px; padding-bottom: 5px; }\n  .mast-action { font-size: 11px; padding-inline: 6px; }\n  .main { padding-top: 18px; }\n  .intro { grid-template-columns: 1fr; gap: 12px; padding-bottom: 13px; }\n  .intro h1 { font-size: clamp(27px, 5.4vw, 40px); }\n  .intro-copy > p { margin-top: 7px; font-size: 13px; }\n  .intro-actions { margin-top: 10px; }\n  .metrics { padding: 9px 11px; }\n  .metrics dl { margin-top: 6px; }\n  .metrics dd { font-size: 29px; }\n  .workspace { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 13px; }\n  .sample-hero { min-height: 170px; }\n  .sample-form { padding-block: 13px; }\n  .manual { margin-top: 12px; padding: 12px; }\n  .manual-list { grid-template-columns: minmax(0, 1fr); }\n  .manual-item p { min-height: 0; }\n}\n@media (max-width: 360px) {\n  .sample-form-grid { grid-template-columns: minmax(0, 1fr); gap: 9px; }\n  .sample-kicker { letter-spacing: .08em; }\n  .sample-section-title { font-size: 19px; }\n  .sample-date { font-size: 10px; }\n}\n","group":"前端"},{"path":"tests/engine.test.mjs","text":"import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { auditPreview, contrastRatio } from '../engine.mjs';\n\nconst plain = Object.freeze({\n  color: 'rgb(0, 0, 0)', backgroundColor: 'rgba(0, 0, 0, 0)', backgroundImage: 'none',\n  opacity: '1', display: 'block', visibility: 'visible',\n});\n\nfunction node(localName, attributes = {}, children = [], computed = {}) {\n  return {\n    nodeType: 1,\n    localName,\n    style: { ...plain, ...computed },\n    childNodes: children.map(child => typeof child === 'string' ? { nodeType: 3, textContent: child } : child),\n    hidden: Object.hasOwn(attributes, 'hidden'),\n    getAttribute(name) { return attributes[name] ?? null; },\n    get textContent() { return this.childNodes.map(child => child.textContent).join(''); },\n  };\n}\n\nfunction documentTree(...nodes) {\n  const root = node('section', {}, nodes, { backgroundColor: 'rgb(244, 245, 239)' });\n  const descendants = [];\n  const rootDocument = {\n    defaultView: { getComputedStyle: element => element.style },\n    getElementById: id => descendants.find(element => element.getAttribute('id') === id),\n  };\n  function mount(parent) {\n    for (const child of parent.childNodes) {\n      if (child.nodeType !== 1) continue;\n      child.parentElement = parent;\n      descendants.push(child);\n      mount(child);\n    }\n  }\n  mount(root);\n  return Object.assign(root, {\n    isConnected: true,\n    ownerDocument: rootDocument,\n    contains: element => descendants.includes(element),\n    querySelectorAll(selector) {\n      const attribute = selector.match(/^\\[(.+)\\]$/u);\n      if (attribute) return descendants.filter(element => element.getAttribute(attribute[1]) !== null);\n      const names = selector.split(',');\n      return descendants.filter(element => names.includes(element.localName));\n    },\n  });\n}\n\nfunction preview(fixed) {\n  const input = node('input', { id: 'form-name', 'data-audit-id': 'booking-name', 'data-audit-label': '' });\n  const label = fixed ? node('label', { for: 'form-name' }, ['称呼']) : node('span', {}, ['称呼']);\n  input.labels = fixed ? [label] : [];\n  const image = node('img', {\n    'data-audit-id': 'room-image', 'data-audit-informative': '', ...(fixed && { alt: '阅览室入口旁的预约屏' }),\n  });\n  const help = node('button', {\n    'data-audit-id': 'help-button', 'data-audit-name': '', ...(fixed && { 'aria-label': '预约帮助' }),\n  }, [node('span', { 'aria-hidden': 'true' }, ['?'])]);\n  const note = node('p', { 'data-audit-id': 'booking-note', 'data-audit-contrast': '' }, ['每人每天可预约一次。'],\n    { color: fixed ? 'rgb(53, 74, 68)' : 'rgb(159, 169, 166)' });\n  const title = node(fixed ? 'h3' : 'h4', { 'data-audit-id': 'booking-form-heading', 'data-audit-heading': '' }, ['预约']);\n  return documentTree(node('h2', {}, ['阅览室']), image, help, title, label, input, note);\n}\n\ntest('reports all five baseline targets with stable selectors and localized evidence', () => {\n  const { totals, findings } = auditPreview(preview(false));\n  assert.deepEqual(totals, { checked: 5, passed: 0, failed: 5 });\n  assert.deepEqual(findings.map(item => [item.id, item.rule]), [\n    ['booking-name', 'form-label'], ['room-image', 'image-alt'], ['help-button', 'button-name'],\n    ['booking-note', 'text-contrast'], ['booking-form-heading', 'heading-order'],\n  ]);\n  for (const finding of findings) {\n    assert.equal(finding.selector, `[data-audit-id=\"${finding.id}\"]`);\n    assert.ok(finding.title && finding.criterion && finding.evidence);\n  }\n  assert.match(findings[3].evidence, /2\\.2\\d:1/u);\n  assert.match(findings[4].evidence, /h2.+h4/u);\n});\n\ntest('keeps the same evaluation denominator when all five sample targets are repaired', () => {\n  assert.deepEqual(auditPreview(preview(true)), { findings: [], totals: { checked: 5, passed: 5, failed: 0 } });\n});\n\ntest('recognizes a referenced name and ignores marked targets inside hidden panels', () => {\n  const name = node('span', { id: 'help-name' }, ['预约说明']);\n  const help = node('button', { 'aria-labelledby': 'missing help-name', 'data-audit-name': '', 'data-audit-id': 'help' });\n  const decorative = node('img', { alt: '' });\n  const hidden = node('section', {}, [node('img', { 'data-audit-informative': '', 'data-audit-id': 'missing-hidden-alt' })], { display: 'none' });\n  assert.deepEqual(auditPreview(documentTree(name, help, decorative, hidden)).totals, { checked: 1, passed: 1, failed: 0 });\n});\n\ntest('calculates sRGB contrast with unrounded thresholds and transparent foreground', () => {\n  assert.equal(contrastRatio('#000', '#fff'), 21);\n  assert.equal(contrastRatio('#abc', '#abc'), 1);\n  assert.equal(contrastRatio('transparent', '#fff'), 1);\n  assert.ok(contrastRatio('rgba(0,0,0,0.5)', '#fff') > 3.9);\n  assert.ok(contrastRatio('#767676', '#fff') > 4.5);\n  assert.ok(contrastRatio('#777777', '#fff') \u003c 4.5);\n  assert.throws(() => contrastRatio('blue', '#fff'), TypeError);\n  assert.throws(() => contrastRatio('#000', '#fff8'), TypeError);\n});\n\ntest('evaluates translucent color layers but flags gradients for manual review', () => {\n  const note = node('p', { 'data-audit-contrast': '', 'data-audit-id': 'note' }, ['说明'],\n    { color: 'rgb(0, 0, 0)', backgroundColor: 'rgba(255, 255, 255, 0.2)' });\n  const surface = node('article', {}, [note], { backgroundColor: 'rgb(255, 255, 255)' });\n  const root = documentTree(surface);\n  assert.equal(auditPreview(root).totals.passed, 1);\n  surface.style.backgroundImage = 'linear-gradient(white, black)';\n  assert.match(auditPreview(root).findings[0].evidence, /人工复核/u);\n  note.style.backgroundColor = 'rgb(255, 255, 255)';\n  assert.equal(auditPreview(root).totals.passed, 1);\n  surface.style.opacity = '0.5';\n  assert.match(auditPreview(root).findings[0].evidence, /人工复核/u);\n});\n\ntest('refuses detached roots and duplicate or malformed evidence IDs', () => {\n  assert.throws(() => auditPreview({}), /接入浏览器/u);\n  const makeTarget = id => node('img', { 'data-audit-informative': '', 'data-audit-id': id });\n  assert.throws(() => auditPreview(documentTree(makeTarget('quote\"'))), /唯一/u);\n  assert.throws(() => auditPreview(documentTree(makeTarget('duplicate'), makeTarget('duplicate'))), /唯一/u);\n});\n","group":"验收测试"}],"defaultFile":"engine.mjs"}</script>
