<script id="source-data" type="application/json">{"files":[{"path":".gitignore","text":"/target/\n/data/\n/runtime/\n*.log\n.env\n","group":"配置与启动"},{"path":"DESIGN.md","text":"# 校园场务产品视觉规范\n\n同学端和发布端共用一套暖色视觉体系。页面以暖纸色留出阅读空间，深色集中在品牌和主要操作，金属色用于少量边饰。后续作品可以沿用样式表里的色彩变量、字体层级和表单组件。\n\n| 颜色 | 色值 | 用途 |\n| --- | --- | --- |\n| 暖象牙白 | `#F7F2EA` | 页面底色与阅读留白 |\n| 暖纸白 | `#FFFDF8` | 表单、名单和阅读卡片 |\n| 深棕墨 | `#241B1C` | 正文、表单标签和关键数据 |\n| 深酒红 | `#4A1D29` | 主要按钮、活动票卡与登录主视觉 |\n| 深梅棕 | `#281A20` | 发布侧栏的底色 |\n| 暗莓色 | `#6A2E40` | 操作强调和悬停反馈 |\n| 烟粉 | `#F2E5E7` | 浅色导航的选中反馈 |\n| 古铜 | `#B29362` | 票卡细边、装饰线和局部细节 |\n| 深古铜与浅铜金 | `#75533A` / `#DFC194` | 深古铜用于浅底短标签，浅铜金用于深底图标和选中标记 |\n\n## 页面与版式\n\n- 同学端首页让象牙色正文和校园大厅配图并排，酒红活动票压在图片下方。活动列表突出时间、地点与报名情况。活动、签到和我的活动用统一导航，手机签到把活动、六位码和确认动作按操作顺序排列。\n- 发布端使用深梅棕侧栏组织工作台、我的活动、创建活动和账号设置。创建入口集中在导航栏，桌面和窄屏沿用一致的选中标记。\n- 创建活动页将填写区与同学端报名预览并排，窄屏可展开预览。模板仍在表单内，暖纸色列表以酒红和勾选标识当前项，键盘焦点可与已选项区分。\n- 发布端侧栏的账号区集中放置新手指引、账号身份与退出。两端新注册用户首次使用时分别进入对应角色的指引。小窗靠近正在讲解的控件，允许前进、后退、跳过及重播。\n- 发布端登录、注册与工作台用暖光礼堂的不同裁切建立关联。两张场景图都是生成的产品配图。活动时长与签到开放、截止时间在表单内成组填写，预览显示北京时间的具体区间，跨日会显示日期。活动倒计时、签到时段及短时码各有独立标签，二维码保留黑码和浅色留白。\n- 大标题使用随应用分发的 `Campus Serif UI`，源于 Noto Serif SC，许可随字体存放。未收录的字回退到设备字体。正文和输入控件优先用 Noto Sans SC，并为不同设备准备系统字体回退。\n- 复用入口为交付包 `src/main/resources/static/styles.css`。审查时覆盖桌面、390 像素手机和 320 像素窄屏，并检查键盘焦点。\n\n## 调研依据\n\n- 爱马仕的 Rouge H 是带棕调的深红。Cartier 的 Must de Cartier 卡包用酒红皮革作主体、金属色集中在角件。这里让酒红负责视觉重心，以古铜细边收束活动票和登录面板。 [Hermès Rouge H](https://www.hermes.com/us/en/product/satin-lipstick-rouge-h-V60001SV085/) · [Cartier Must de Cartier](https://int.cartier.com/es-eu/collections/accessories/accessories/tarjeteros-%26-monederos/l3002522-tarjetero-doble%2C-must-de-cartier.html)\n- Aesop De Meent 以樱桃木布置空间，将青铜集中在门把。这里借鉴大面积暖色与少量金属细节的比例，用在浅色工作区和深色侧栏的交接处。 [Aesop De Meent](https://www.aesop.com/stores/nl/rotterdam/23007.html)\n- 一项 182 人参与的酒店网页实验发现，较利落的轮廓能增强高端感的评价。活动票与登录面板采用克制的转角，正文和控件优先保持易读。 [Tourism Management 研究](https://www.sciencedirect.com/science/article/pii/S026151772400178X)\n- 正常字号文字的对比按 4.5∶1 检查。浅色区域采用深古铜标签，古铜基准色用于装饰。 [W3C 对比度标准](https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html)\n","group":"项目说明"},{"path":"PRODUCT.md","text":"# 校园场务 v0.12 功能与验收\n\n把活动发布、报名和到场确认放到一份名单上。发布端 `/organizer.html` 提供组织者注册、活动工作台、创建和现场名单。同学端 `/` 用于找活动、报名、签到和查看本人记录。\n\n## 角色与使用流程\n\n| 角色 | 操作 | 应看到的结果 |\n| --- | --- | --- |\n| 访客 | 在同学端首页找活动，按活动链接打开详情 | 从首页了解活动时间、地点和报名情况。详情页提供活动说明、剩余名额和开始倒计时。公开页面仅展示发布后的活动信息。 |\n| 参与者 | 注册账号、登录、报名、查看我的活动、取消未签到的报名 | 换浏览器登录仍能看到自己的状态。重复点击不会多占名额，取消后释放名额。 |\n| 已报名参与者 | 在「签到」选中已报名的活动，输入六位数字，再点击「确认签到」。也可用手机相机扫二维码后确认。 | 选择和输入期间状态保持待签到。点击确认后由服务端校验，成功时两端看到同一条签到状态。 |\n| 组织者 | 注册登录，从侧栏打开「创建活动」并保存草稿 | 工作台只在侧栏保留该入口。创建页默认是空白表单，手动填写后可保存私有草稿。 |\n| 组织者 | 在「活动信息」表单的「活动模板」字段选择讲座分享、社团招新、志愿服务、竞赛培训或文体活动模板 | 默认手动填写。选择模板后，参考值填入同一表单。可切换模板或回到「手动填写」，已填写的时间和手动修改会保留。 |\n| 组织者 | 新账号初次使用工作台，随指引前进、后退、跳过，或从侧栏的账号区再次打开 | 首次自动开始。每一步在实际控件旁提示功能，可体验从创建到现场核对名单的操作路径。 |\n| 参与者 | 新账号首次进入同学端，或在「我的活动」重开新手指引 | 三步指引在当前页面介绍活动、现场签到和我的活动。从报名链接或扫码入口注册后可以继续原来的操作。 |\n| 组织者 | 在创建表单输入活动资料，或从模板菜单选一个类型 | 报名页预览同步显示输入内容，核对后再保存草稿。键盘方向键可浏览模板，确认后套用，Escape 可收起菜单。 |\n| 组织者 | 发布自己的活动、复制报名链接、搜索名单并导出 CSV | 确认活动和名额，查看报名、签到与取消。后台可见时每 6 秒刷新名单，也可手动刷新。 |\n| 组织者 | 开启、刷新或关闭短时签到码，核对状态，必要时手工记到场 | 过期、撤销或另一场活动的码不能完成当前活动签到。手工签到可用于手机无法完成操作的情况。 |\n\n## 现场规则\n\n- 报名凭据以登录账号为准。活动容量和同一账号的报名记录由数据库约束与事务保护。\n- 发布端按活动归属检查权限。组织者只能查看和操作自己的名单、发布状态及签到码。\n- 活动以北京时间为基准。新活动默认持续 120 分钟，提前 15 分钟开放签到，开始后 30 分钟截止。组织者可设置 1 至 1440 分钟的时长、0 至 1440 分钟的提前量，以及活动开始后至活动结束之间的截止时间。短于 30 分钟的活动会将默认截止收在活动结束时。\n- 例如 14:00 开始、持续 90 分钟，若提前 15 分钟开放、开始后 20 分钟截止，13:45 起可开码和签到，14:20 起停止自助签到，15:30 活动结束并停止新增报名。已登记的到场状态可继续查看，授权组织者可以补录。\n- 同学端活动详情随时间显示距开始、距结束或已结束，并显示签到时段的开放、截止倒计时。动态码有单独的有效期，到签到截止时立即失效。调整已发布活动的时段也会撤销当前动态码。\n- 早期版本创建的活动由组织者在详情页选择「设置活动时段」后启用这套规则。\n- 签到二维码只带活动编号和有时限的签到码，不携带参与者信息。签到仍需有效账号和未取消的报名。代码默认两分钟有效，换新或关闭后旧码失效。同一账号累计输错五次后，需要等组织者换码或协助补录。\n- 本版验证动态二维码与签到资格。动态码能限制过期链接，验证实名在场需要另外确认校园身份校验、签到窗口长度与现场流程。若试点确实需要定位，应单独确认定位范围、权限告知与无定位时的替代流程。\n- 开启签到需要服务端联网。手机使用部署后可访问的 HTTPS 地址从系统相机扫码，也可在支持的浏览器添加到主屏幕。现场先用样例记录联调。\n\n## 去现场测什么\n\n用一次实际活动验证从发布到签到。试点前后各记录一次同规模名单核对任务的用时、登记差异、需要手工处理的次数。样例测试可证明规则按预期执行，实际节省时间取自试点记录。\n\n现场联调需确认活动负责人、能使用的 HTTPS 地址、手机扫码方式、报名编号的下发或身份确认方式，以及错扫、无网或忘记密码时谁来协助。\n","group":"项目说明"},{"path":"README.md","text":"# 校园场务 v0.12\n\n组织者在发布端发布活动，参与者在同学端报名。活动现场由组织者展示六位签到码和二维码。参加者在同学端选活动、输码并确认，也可以用手机相机扫码打开同一活动的确认页。两种入口共用签到状态。\n\n## 本机审查\n\n解压交付包，运行 `start-review.cmd`。需要 Java 17 或更新版本。命令窗口显示同学端和活动发布端地址。账号、活动和签到记录保存在解压目录下的 `data`。服务重启后用注册的用户名和密码重新登录即可。\n\n1. 打开活动发布端 `/organizer.html`，注册组织者账号。首次进入即开始新手指引，可以跳过。以后从侧栏账号上方的「新手指引」重新进入。\n2. 从「创建活动」填写开始时间，在「时长与签到」设置活动持续多久、提前几分钟开放签到、开始后几分钟截止。系统按北京时间预览具体起止时间。可选的活动模板会保留这些设置和手动改过的内容。保存草稿并发布后，同学就能报名。\n3. 打开同学端 `/` 找到活动，查看距开始或结束的倒计时、签到时间和剩余名额。可用虚构姓名和编号注册。「我的活动」可查报名、签到记录或重开新手指引。\n4. 在设置的签到时段内，发布者可点「生成签到码」。同学在「现场签到」选好活动输入六位码，或从二维码链接进入确认页，提交后两端显示到场状态。想立即体验，可将新活动设为五分钟后开始，保留默认提前十五分钟开放签到。\n5. 在另一活动测试取消释放名额。也可以创建并发布自己的样例活动。\n\n交付包自动启动本机审查服务。手机上的 `127.0.0.1` 指向手机本身。跨设备联调使用有权限访问的部署地址，在二维码生成端也用这个地址打开后台。\n\n## 手机试点部署\n\n见 `deploy/README.md`。样例使用 Docker Compose、Caddy HTTPS 和持久化数据卷。首次试点先用虚构记录，核对手机从系统相机扫码、登录、确认签到和后台名单。支持安装的手机浏览器可以从浏览器菜单添加到主屏幕。见 [PWA 安装条件](https://developer.mozilla.org/en-US/docs/Web/Progressive_web_apps/Guides/Making_PWAs_installable)。\n\n参与者和组织者各有自己的账号。发布端的活动、报名名单和签到操作按创建者分配管理权限。试点前确认报名编号、是否需要校园统一身份认证、签到窗口和账号找回方式。公开演示与试点各用一个实例。\n\n## 旧版活动\n\n从旧数据库升级时，已发布的旧活动仍可在同学端访问。为历史数据临时配置 `CAMPUS_LEGACY_ORGANIZER_PASSWORD` 后，原组织者可在新版注册，再到「账号设置」输入迁移口令，把无主的旧活动迁入自己的账号。迁入操作保留活动和报名记录。新部署留空即可。\n\n旧活动沿用组织者手动开码的规则。负责人可以打开该活动的「设置活动时段」，补上时长和签到时间。保存变更后原签到码立即失效，到场记录保留。\n\n## 复现验证\n\n- `mvn test` 运行 HTTP 集成测试。若用 MySQL 单独测试，可提供 `CAMPUS_TEST_DB_URL`、`CAMPUS_TEST_DB_USER`、`CAMPUS_TEST_DB_PASSWORD`。\n- `mvn package` 生成可执行 JAR。\n- 本机审查默认开启样例活动。生产配置使用 `CAMPUS_SEED_SAMPLE=false`。\n- `CAMPUS_CHECK_IN_SECRET` 是服务端签到签名密钥。按部署说明配置独立的随机值。\n- `CAMPUS_CHECK_IN_SECONDS` 配置短时签到码有效期，默认 120 秒。\n\n完整使用规则和现场验收目标见 `PRODUCT.md`，本版实测范围见 `VERIFICATION.md`，可复用的视觉约定见 `DESIGN.md`。\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 校园场务 v0.12 源码包\n\n原始发布归档为 `校园场务-v0.12.zip`。压缩包保留其中 48 份文本文件的原始路径与字节，本文件为导出说明。\n\n服务端使用 Java 17 和 Maven。可运行 `mvn test` 复跑集成测试，运行 `mvn package` 构建 JAR。若使用随发布版本提供的 `start-review.cmd`，需将所构建的应用 JAR 放在 `release/campus-events.jar`。原版界面的 WebP、PNG 和 WOFF2 素材见完整运行包。项目内的第三方 QR 源码和相应许可证随源码提供。\n","group":"项目说明"},{"path":"VERIFICATION.md","text":"# 校园场务 v0.12 验证记录\n\n## 服务端\n\nv0.12 在 Java 17 下，使用 H2 和独立的 MySQL 8.0.28 实例分别运行 14 项集成测试，两组全部通过。测试包含时间边界、权限、名额并发、两类账号的首次指引和到场确认。\n\n| 测试 | 实测结果 |\n| --- | --- |\n| 组织者账号 | 使用姓名、用户名、密码注册，另一个浏览器登录可查看同一组织者资料。重复用户名和错误密码被拒绝。 |\n| 活动归属 | 第二个组织者看不到第一位的活动，直接访问其私有名单、发布、签到码和补录接口均被拒绝。 |\n| 旧活动迁入 | 发布的旧活动仍可浏览。组织者用正确迁移口令一次性转入旧活动。另行并发验证，两个账号同时领取时只有一个能取得归属。 |\n| 角色权限与活动发布 | 草稿只对组织者可见，发布后出现在公开列表。未授权访问名单和签到管理接口被拒绝。 |\n| 参与者账号 | 重复编号、错误密码和未登录报名被拒绝。报名以账号身份为准，另一个会话登录后仍能查到原记录。 |\n| 名额并发 | 24 个已登录账号申请 8 个名额，确认 8 条。一个账号同时提交 12 次，仅占用一个名额。 |\n| 签到码与资格 | 活动发布端显示六位数字码，前导零保留。有效的本场码使已报名参与者变为已签到。换新前的码、其他活动的码、过期的码和关闭后的码被拒绝。取消或尚未报名的账号也不能签到。 |\n| 错码重试 | 同一账号在当前签到码下输错五次后收到暂停提示，其他同学仍可签到。发布端换码后该账号可重新尝试。 |\n| 组织者补录 | 组织者能为已报名者补录签到。参与者不能调用该操作。 |\n\n复现入口是 `src/test/java/cn/campus/events/CampusEventsIntegrationTest.java`。运行 `mvn test` 使用 H2。使用独立 MySQL 测试库时，通过 `CAMPUS_TEST_DB_URL`、`CAMPUS_TEST_DB_USER` 和 `CAMPUS_TEST_DB_PASSWORD` 指定连接。\n\n## 浏览器、二维码与移动界面\n\n### v0.12 时长与签到时段\n\n| 场景 | 实测结果 |\n| --- | --- |\n| 设置与预览 | 创建表单以北京时间显示时段。验证了跨午夜和跨年、设置 0 分钟提前量、自动收窄默认截止，以及手动截止超出时阻止保存。 |\n| 活动与签到的不同截止时间 | 浏览器分步推进时间到开放、开始、签到截止和活动结束。生成码与自助签到按钮在边界切换。设备设为洛杉矶时区时，活动的北京时间和开始时刻一致。 |\n| 真实服务器行为 | H2 与 MySQL 均验证开放前不能开码、到点后无法签到，临近截止时缩短动态码有效期。签到结束至活动结束之间仍可报名。活动结束后拒绝新的报名及恢复已取消的报名。 |\n| 已有活动 | 用 v0.11 可执行包建立账号、发布活动、报名并签到。再用 v0.12 打开同一数据库，核对原活动资料和到场记录。组织者可显式设置时段。变更撤销原码、保留记录，同值保存保留有效码。 |\n\n### v0.11 浏览器回归\n\n| 场景 | 检查内容 |\n| --- | --- |\n| 首次使用发布端 | 新账号跳到指引第 1 步，沿实际控件走完 11 步。列表为空时示例不会创建记录。跳过和重播可用，刷新、服务重启及另一浏览器登录后无需再次走指引。 |\n| 表单和报名预览 | 用真实后端检查 1450、679、390、320 像素。模板默认手动填写，点击和键盘选择均可套用，Escape 收起后焦点留在控件。活动名称、当地时间和地点的改动同步到报名预览。小屏的预览可以展开和收起。 |\n| 首次使用同学端 | 从活动详情注册后在原页面完成三步指引并报名。可从「我的活动」重播和跳过。签到与个人记录在再次登录后可用。 |\n| 业务联调 | 真实发布草稿，同学分别通过数字码和二维码链接确认到场，名单与导出 CSV 显示同一结果。 |\n\n### v0.10 浏览器回归\n\n| 场景 | 检查内容 |\n| --- | --- |\n| 表单内选用模板 | 验证 1450、679、390、320 像素下模板都位于「活动信息」表单内，默认是「手动填写」。键盘可以选用模板，切换和恢复手动填写均保留已填时间和手动修改。 |\n| 活动开始倒计时 | 同学端首页和两端活动详情显示开始倒计时。浏览器将测试活动推进到开始前 9 秒、7 秒和开始时间之后，验证计时切换为「开始时间已到」。发布端现场签到码仍按独立有效时间运行。 |\n\n### v0.9 浏览器回归\n\n| 场景 | 检查内容 |\n| --- | --- |\n| 表单布局 | 在 1450、679、390 和 320 像素宽度验证。创建页直接显示表单，打开和关闭模板面板时测得的表单位置保持稳定。 |\n| 模板选择面板 | 用鼠标和键盘选择或关闭面板后，焦点返回入口。手机宽度下从底部显示。新手指引中的 Escape 先关闭模板面板。 |\n| 套用与清除 | 选择后面板关闭，表单显示所用模板。切换或清除时保留实际时间和手动修改的字段。 |\n\n### v0.8 验收记录\n\n| 场景 | 检查内容 |\n| --- | --- |\n| 手动创建 | 打开创建页时所有活动字段为空。主动选择模板才填入示例，可继续手动编辑和保存。 |\n| 单一入口 | 工作台的「创建活动」只在导航栏出现一次。 |\n| 活动查找 | 桌面和窄屏均可从同学端首页查找已发布活动、判断报名状态并进入详情。 |\n| 新手指引 | 共 11 步，可前进、后退、跳过或重新打开。发布、签到和名单优先展示已有活动的实际控件，空账号使用只读示例。用空账号走完后活动列表仍为空。 |\n\n### v0.7 回归基线\n\n桌面检查模板目录与表单的横向对齐，390 和 320 像素窄屏检查目录先于表单、选项和说明可以读取。检查同学端首页、发布端登录和工作台加载自托管的 WebP 配图，以及标题字体的加载。以纯色配对计算，墨色正文与象牙白背景为 15.09∶1，暖纸白文字与深酒红按钮为 13.78∶1，浅铜金与深酒红为 8.13∶1。\n\n逐个套用五类活动模板，验证键盘可以选择，空白时间会阻止保存，切换时保留已经填写的时间、活动名称、地点和名额。保存后从组织者接口核对私有草稿的数据，再发布并继续跑通报名和签到。模板页在 320 像素下无横向溢出。\n\n用 Edge 无界面模式连接真实后端。验证组织者注册、侧栏切换、迁入旧活动、保存草稿与发布，并用独立账号检查访问隔离。一个参与者输六位码确认，另一位从 OpenCV 解出的二维码链接进入移动视口确认。工作台和导出的 CSV 都显示签到结果。重启后组织者仍可用原账号登录，参与者仍可查到签到结果。\n\n校验 PWA 应用清单、192 和 512 像素图标与 Service Worker 激活。离线时只展示通用提示，账号、活动和签到请求保持联网校验。公开 HTTPS 部署配置已做 Compose 静态检查。真机相机扫描、手机安装及活动现场使用待部署后验收。\n\nWindows 上可在安装 Python Playwright、OpenCV、NumPy、Pillow 及默认安装位置的 Edge 后运行 `mvn package` 与 `python verify-browser.py`。脚本使用端口 8770 和独立的样例数据库。\n\n## 现场效果记录\n\n用实际活动记录原流程核对名单用时和新流程耗时，并检查错记、漏签及补录次数。当前使用样例活动完成验收，实际效果待试点记录。\n","group":"项目说明"},{"path":"deploy/.env.example","text":"# Set the DNS name to an address that reaches this server.\nCAMPUS_DOMAIN=events.example.com\n# Set a stable, random server-side signing secret before starting the stack.\nCAMPUS_CHECK_IN_SECRET=\n# The packaged release already includes this file.\nCAMPUS_JAR_PATH=release/campus-events.jar\n","group":"配置与启动"},{"path":"deploy/Caddyfile","text":"{$CAMPUS_DOMAIN} {\n  encode gzip zstd\n  reverse_proxy campus-events:8768 {\n    header_up -Forwarded\n    header_up -X-Forwarded-Port\n    header_up -X-Forwarded-Prefix\n    header_up -X-Forwarded-Ssl\n  }\n}\n","group":"配置与启动"},{"path":"deploy/Dockerfile","text":"FROM eclipse-temurin:17-jre-jammy\n\nARG CAMPUS_JAR_PATH=release/campus-events.jar\nWORKDIR /app\nRUN install -d -m 750 -o 10001 -g 10001 /data\nCOPY ${CAMPUS_JAR_PATH} /app/campus-events.jar\nUSER 10001:10001\nEXPOSE 8768\nENTRYPOINT [\"java\",\"-jar\",\"/app/campus-events.jar\"]\n","group":"配置与启动"},{"path":"deploy/README.md","text":"# 手机扫码试点部署\n\n这一部署使用独立的 HTTPS 域名、Caddy 和一台校园场务服务。使用部署地址登录组织者后台，再生成签到码。手机相机识别后会打开同一个域名。\n\n## 启动\n\n1. 准备能从参与者手机网络访问的域名，将 DNS 指向运行 Docker 的服务器，并开放入站 80 和 443。\n2. 在 `deploy` 目录把 `.env.example` 复制为 `.env`，设置域名，填入稳定的随机签到签名密钥。对照项目根目录确认 `CAMPUS_JAR_PATH` 指向打包后的 JAR。\n3. 在 `deploy` 目录运行 `docker compose up -d --build`。用 `docker compose logs caddy campus-events` 查看状态。\n4. 用部署域名打开 `/organizer.html` 并注册组织者账号。先用一个试用活动走通发布、报名、扫码和后台核对。请同时用部署域名生成二维码，方便参与者跨设备打开。\n\n浏览器的安装方式随平台不同。在 Android Chrome 中可从浏览器菜单安装，在 iPhone Safari 中可从分享菜单添加到主屏幕。安装和 Service Worker 需要手机访问到受信任的 HTTPS 地址，桌面本机开发可以使用 localhost。 [安装要求](https://developer.mozilla.org/zh-CN/docs/Web/Progressive_web_apps/Guides/Making_PWAs_installable)\n\n应用数据写入 `campus_data` 卷，证书写入 `caddy_data` 卷。备份应用数据时先停止应用容器，保留部署域名和卷。恢复时使用相同应用版本验证活动、报名及签到状态。\n","group":"项目说明"},{"path":"deploy/compose.yaml","text":"services:\n  campus-events:\n    build:\n      context: ..\n      dockerfile: deploy/Dockerfile\n      args:\n        CAMPUS_JAR_PATH: ${CAMPUS_JAR_PATH:-release/campus-events.jar}\n    environment:\n      CAMPUS_SERVER_ADDRESS: 0.0.0.0\n      CAMPUS_FORWARD_HEADERS_STRATEGY: framework\n      SERVER_PORT: \"8768\"\n      CAMPUS_CHECK_IN_SECRET: ${CAMPUS_CHECK_IN_SECRET:?Set a stable random check-in signing secret in deploy/.env}\n      CAMPUS_DB_URL: \"jdbc:h2:file:/data/campus-events;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE\"\n      CAMPUS_DB_USER: sa\n      CAMPUS_SEED_SAMPLE: \"false\"\n    volumes:\n      - campus_data:/data\n    restart: unless-stopped\n\n  caddy:\n    image: caddy:2-alpine\n    environment:\n      CAMPUS_DOMAIN: ${CAMPUS_DOMAIN:?Set an HTTPS domain in deploy/.env}\n    depends_on:\n      - campus-events\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./Caddyfile:/etc/caddy/Caddyfile:ro\n      - caddy_data:/data\n      - caddy_config:/config\n    restart: unless-stopped\n\nvolumes:\n  campus_data:\n  caddy_data:\n  caddy_config:\n","group":"配置与启动"},{"path":"pom.xml","text":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003cproject xmlns=\"http://maven.apache.org/POM/4.0.0\"\n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\">\n    \u003cmodelVersion>4.0.0\u003c/modelVersion>\n    \u003cparent>\n        \u003cgroupId>org.springframework.boot\u003c/groupId>\n        \u003cartifactId>spring-boot-starter-parent\u003c/artifactId>\n        \u003cversion>3.5.16\u003c/version>\n        \u003crelativePath/>\n    \u003c/parent>\n    \u003cgroupId>cn.campus\u003c/groupId>\n    \u003cartifactId>campus-events\u003c/artifactId>\n    \u003cversion>0.12.0\u003c/version>\n    \u003cname>Campus Events\u003c/name>\n    \u003cproperties>\n        \u003cjava.version>17\u003c/java.version>\n    \u003c/properties>\n    \u003cdependencies>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-web\u003c/artifactId>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-jdbc\u003c/artifactId>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>com.h2database\u003c/groupId>\n            \u003cartifactId>h2\u003c/artifactId>\n            \u003cscope>runtime\u003c/scope>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>com.mysql\u003c/groupId>\n            \u003cartifactId>mysql-connector-j\u003c/artifactId>\n            \u003cscope>runtime\u003c/scope>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-test\u003c/artifactId>\n            \u003cscope>test\u003c/scope>\n        \u003c/dependency>\n    \u003c/dependencies>\n    \u003cbuild>\n        \u003cplugins>\n            \u003cplugin>\n                \u003cgroupId>org.springframework.boot\u003c/groupId>\n                \u003cartifactId>spring-boot-maven-plugin\u003c/artifactId>\n            \u003c/plugin>\n        \u003c/plugins>\n    \u003c/build>\n\u003c/project>\n","group":"配置与启动"},{"path":"src/main/java/cn/campus/events/AccountController.java","text":"package cn.campus.events;\n\nimport jakarta.servlet.http.HttpServletRequest;\nimport org.springframework.http.HttpHeaders;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseCookie;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.CookieValue;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\nimport java.time.Duration;\nimport java.util.List;\n\n@RestController\n@RequestMapping(\"/api/account\")\nfinal class AccountController {\n    private static final String COOKIE = ParticipantAccounts.COOKIE;\n\n    private final ParticipantAccounts accounts;\n    private final CampusEvents events;\n\n    AccountController(ParticipantAccounts accounts, CampusEvents events) {\n        this.accounts = accounts;\n        this.events = events;\n    }\n\n    @PostMapping(\"/register\")\n    ResponseEntity\u003cParticipantAccounts.Account> register(\n            @RequestBody ParticipantAccounts.Register input,\n            @CookieValue(value = COOKIE, required = false) String previousToken,\n            HttpServletRequest request) {\n        ParticipantAccounts.Account account = accounts.create(input);\n        return response(account, previousToken, request.isSecure(), HttpStatus.CREATED);\n    }\n\n    @PostMapping(\"/login\")\n    ResponseEntity\u003cParticipantAccounts.Account> login(\n            @RequestBody ParticipantAccounts.Login input,\n            @CookieValue(value = COOKIE, required = false) String previousToken,\n            HttpServletRequest request) {\n        ParticipantAccounts.Account account = accounts.authenticate(input);\n        return response(account, previousToken, request.isSecure(), HttpStatus.OK);\n    }\n\n    @GetMapping(\"/session\")\n    ParticipantAccounts.Profile session(@CookieValue(value = COOKIE, required = false) String token) {\n        return accounts.profile(accounts.require(token));\n    }\n\n    @PostMapping(\"/tour/start\")\n    TourStart startTour(@CookieValue(value = COOKIE, required = false) String token) {\n        return new TourStart(accounts.startTour(accounts.require(token)));\n    }\n\n    record TourStart(boolean started) {}\n\n    @DeleteMapping(\"/session\")\n    ResponseEntity\u003cVoid> logout(@CookieValue(value = COOKIE, required = false) String token,\n                                HttpServletRequest request) {\n        accounts.end(token);\n        return ResponseEntity.noContent().header(HttpHeaders.SET_COOKIE, cookie(\"\", Duration.ZERO, request.isSecure())).build();\n    }\n\n    @GetMapping(\"/registrations\")\n    List\u003cCampusEvents.MyRegistration> registrations(@CookieValue(value = COOKIE, required = false) String token) {\n        return events.myRegistrations(accounts.require(token));\n    }\n\n    private ResponseEntity\u003cParticipantAccounts.Account> response(ParticipantAccounts.Account account,\n            String previousToken, boolean secure, HttpStatus status) {\n        String value = accounts.begin(account, previousToken);\n        return ResponseEntity.status(status)\n                .header(HttpHeaders.SET_COOKIE, cookie(value, ParticipantAccounts.SESSION_LIFETIME, secure))\n                .body(account);\n    }\n\n    private static String cookie(String value, Duration expiry, boolean secure) {\n        return ResponseCookie.from(COOKIE, value)\n                .path(\"/api\")\n                .httpOnly(true)\n                .secure(secure)\n                .sameSite(\"Strict\")\n                .maxAge(expiry)\n                .build()\n                .toString();\n    }\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/AccountPasswords.java","text":"package cn.campus.events;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.stereotype.Component;\n\nimport javax.crypto.SecretKeyFactory;\nimport javax.crypto.spec.PBEKeySpec;\nimport java.security.GeneralSecurityException;\nimport java.util.Arrays;\nimport java.util.concurrent.Semaphore;\n\n@Component\nfinal class AccountPasswords {\n    private static final int ITERATIONS = 600_000;\n    private final Semaphore slots = new Semaphore(4);\n\n    static String validate(String password) {\n        if (password == null || password.length() \u003c 8 || password.length() > 128) {\n            throw ApiException.invalid(\"请使用 8 至 128 个字符的密码。\");\n        }\n        return password;\n    }\n\n    byte[] derive(String password, byte[] salt) {\n        if (!slots.tryAcquire()) {\n            throw new ApiException(HttpStatus.TOO_MANY_REQUESTS, \"登录或注册请求较多，请稍后再试。\");\n        }\n        char[] characters = password.toCharArray();\n        PBEKeySpec specification = new PBEKeySpec(characters, salt, ITERATIONS, 256);\n        try {\n            return SecretKeyFactory.getInstance(\"PBKDF2WithHmacSHA256\").generateSecret(specification).getEncoded();\n        } catch (GeneralSecurityException error) {\n            throw new IllegalStateException(\"PBKDF2-HMAC-SHA-256 is unavailable\", error);\n        } finally {\n            specification.clearPassword();\n            Arrays.fill(characters, '\\0');\n            slots.release();\n        }\n    }\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/ApiCachePolicy.java","text":"package cn.campus.events;\n\nimport jakarta.servlet.FilterChain;\nimport jakarta.servlet.ServletException;\nimport jakarta.servlet.http.HttpServletRequest;\nimport jakarta.servlet.http.HttpServletResponse;\nimport org.springframework.http.HttpHeaders;\nimport org.springframework.stereotype.Component;\nimport org.springframework.web.filter.OncePerRequestFilter;\n\nimport java.io.IOException;\n\n@Component\nfinal class ApiCachePolicy extends OncePerRequestFilter {\n    @Override\n    protected boolean shouldNotFilter(HttpServletRequest request) {\n        return !request.getServletPath().startsWith(\"/api/\");\n    }\n\n    @Override\n    protected void doFilterInternal(HttpServletRequest request, HttpServletResponse response, FilterChain chain)\n            throws ServletException, IOException {\n        response.setHeader(HttpHeaders.CACHE_CONTROL, \"no-store\");\n        chain.doFilter(request, response);\n    }\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/ApiErrors.java","text":"package cn.campus.events;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.http.converter.HttpMessageNotReadableException;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\nimport org.springframework.web.method.annotation.MethodArgumentTypeMismatchException;\n\nimport java.util.Map;\n\n@RestControllerAdvice\nfinal class ApiErrors {\n    @ExceptionHandler(ApiException.class)\n    ResponseEntity\u003cMap\u003cString, String>> known(ApiException error) {\n        return ResponseEntity.status(error.status).body(Map.of(\"message\", error.getMessage()));\n    }\n\n    @ExceptionHandler({HttpMessageNotReadableException.class, MethodArgumentTypeMismatchException.class})\n    ResponseEntity\u003cMap\u003cString, String>> unreadable() {\n        return ResponseEntity.status(HttpStatus.BAD_REQUEST).body(Map.of(\n                \"message\", \"请求格式无效，请检查字段类型与日期格式。\"));\n    }\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/ApiException.java","text":"package cn.campus.events;\n\nimport org.springframework.http.HttpStatus;\n\nclass ApiException extends RuntimeException {\n    final HttpStatus status;\n\n    ApiException(HttpStatus status, String message) {\n        super(message);\n        this.status = status;\n    }\n\n    static ApiException invalid(String message) {\n        return new ApiException(HttpStatus.BAD_REQUEST, message);\n    }\n\n    static ApiException missing(String message) {\n        return new ApiException(HttpStatus.NOT_FOUND, message);\n    }\n\n    static ApiException conflict(String message) {\n        return new ApiException(HttpStatus.CONFLICT, message);\n    }\n\n    static ApiException unauthorized(String message) {\n        return new ApiException(HttpStatus.UNAUTHORIZED, message);\n    }\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/CampusEvents.java","text":"package cn.campus.events;\n\nimport com.fasterxml.jackson.annotation.JsonUnwrapped;\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.dao.DuplicateKeyException;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.jdbc.core.JdbcTemplate;\nimport org.springframework.jdbc.core.RowMapper;\nimport org.springframework.jdbc.support.GeneratedKeyHolder;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Isolation;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport java.security.MessageDigest;\nimport java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Statement;\nimport java.time.Instant;\nimport java.time.LocalDateTime;\nimport java.util.HexFormat;\nimport java.util.List;\nimport java.util.Locale;\nimport java.util.Objects;\nimport java.util.Optional;\nimport java.util.regex.Pattern;\n\n@Service\nclass CampusEvents {\n    private static final int MAX_CAPACITY = 10_000;\n    private static final int MAX_FAILED_CHECK_INS = 5;\n    private static final Pattern IDENTIFIER = Pattern.compile(\"[A-Za-z0-9][A-Za-z0-9._-]{0,39}\");\n    private static final Pattern CHECK_IN_CODE = Pattern.compile(\"[0-9]{6}\");\n    private static final String EVENT_COLUMNS = \"\"\"\n            SELECT e.*, s.duration_minutes, s.check_in_opens_before_minutes, s.check_in_closes_after_minutes, (\n                SELECT COUNT(*) FROM event_registration r\n                WHERE r.event_id = e.id AND r.status \u003c> 'CANCELLED'\n            ) AS confirmed\n            \"\"\";\n    private static final String EVENT_SCHEDULE_JOIN = \" LEFT JOIN event_schedule s ON s.event_id = e.id \";\n    private static final String EVENT_DETAILS = EVENT_COLUMNS + \"FROM campus_event e\" + EVENT_SCHEDULE_JOIN;\n    private static final RowMapper\u003cEvent> EVENT_MAPPER = (row, index) -> {\n        int capacity = row.getInt(\"capacity\");\n        int confirmed = row.getInt(\"confirmed\");\n        LocalDateTime startsAt = row.getObject(\"starts_at\", LocalDateTime.class);\n        return new Event(row.getLong(\"id\"), row.getString(\"title\"), row.getString(\"description\"),\n                startsAt, row.getString(\"location\"), capacity, confirmed, capacity - confirmed,\n                EventStatus.valueOf(row.getString(\"status\")), mapSchedule(row, startsAt));\n    };\n    private static final RowMapper\u003cRosterEntry> ROSTER_MAPPER = (row, index) -> new RosterEntry(\n            row.getLong(\"id\"), row.getLong(\"event_id\"), row.getString(\"name\"), row.getString(\"identifier\"),\n            RegistrationStatus.valueOf(row.getString(\"status\")));\n\n    private final JdbcTemplate database;\n    private final int checkInSeconds;\n    private final byte[] checkInSecret;\n    private final byte[] legacyPasswordDigest;\n\n    CampusEvents(JdbcTemplate database, @Value(\"${campus.check-in-seconds}\") int checkInSeconds,\n                 @Value(\"${campus.check-in-secret}\") String checkInSecret,\n                 @Value(\"${campus.organizer.legacy-password}\") String legacyPassword) {\n        if (checkInSeconds \u003c 1 || checkInSeconds > 300) {\n            throw new IllegalArgumentException(\"campus.check-in-seconds must be between 1 and 300\");\n        }\n        this.database = database;\n        this.checkInSeconds = checkInSeconds;\n        this.checkInSecret = checkInSecret.isBlank() ? Secrets.randomBytes(32)\n                : Secrets.sha256(\"campus-check-in:\" + checkInSecret);\n        this.legacyPasswordDigest = legacyPassword.isBlank() ? null : Secrets.sha256(legacyPassword);\n    }\n\n    List\u003cEvent> publishedEvents() {\n        return database.query(EVENT_DETAILS + \"WHERE e.status = 'PUBLISHED' ORDER BY e.starts_at, e.id\", EVENT_MAPPER);\n    }\n\n    List\u003cEvent> organizerEvents(long organizerId) {\n        return database.query(EVENT_DETAILS + \"\"\"\n                JOIN event_organizer eo ON eo.event_id = e.id\n                WHERE eo.organizer_id = ?\n                ORDER BY e.starts_at, e.id\n                \"\"\", EVENT_MAPPER, organizerId);\n    }\n\n    Event publishedEvent(long id) {\n        return queryEvent(id).filter(event -> event.status() == EventStatus.PUBLISHED)\n                .orElseThrow(CampusEvents::eventMissing);\n    }\n\n    @Transactional\n    public Event createEvent(long organizerId, NewEvent input) {\n        long eventId = insertEvent(input);\n        database.update(\"INSERT INTO event_organizer (event_id, organizer_id) VALUES (?, ?)\", eventId, organizerId);\n        return organizerEvent(eventId);\n    }\n\n    private long insertEvent(NewEvent input) {\n        String title = required(input.title(), 120, \"活动名称\");\n        String description = input.description() == null ? \"\" : input.description().strip();\n        if (description.length() > 1000) {\n            throw ApiException.invalid(\"活动说明最多 1000 个字符。\");\n        }\n        if (input.startsAt() == null || input.startsAt().getYear() \u003c 1000 || input.startsAt().getYear() > 9999) {\n            throw ApiException.invalid(\"请填写有效的活动开始时间。\");\n        }\n        String location = required(input.location(), 120, \"活动地点\");\n        if (input.capacity() == null || input.capacity() \u003c 1 || input.capacity() > MAX_CAPACITY) {\n            throw ApiException.invalid(\"活动名额需要在 1 至 10000 之间。\");\n        }\n\n        EventSchedule schedule = new EventSchedule.Input(input.durationMinutes(), input.checkInOpensBeforeMinutes(),\n                input.checkInClosesAfterMinutes()).resolve(input.startsAt(), null);\n        var key = new GeneratedKeyHolder();\n        database.update(connection -> {\n            var insert = connection.prepareStatement(\"\"\"\n                    INSERT INTO campus_event (title, description, starts_at, location, capacity, status)\n                    VALUES (?, ?, ?, ?, ?, 'DRAFT')\n                    \"\"\", Statement.RETURN_GENERATED_KEYS);\n            insert.setString(1, title);\n            insert.setString(2, description);\n            insert.setObject(3, input.startsAt());\n            insert.setString(4, location);\n            insert.setInt(5, input.capacity());\n            return insert;\n        }, key);\n        long id = Objects.requireNonNull(key.getKey()).longValue();\n        insertSchedule(id, schedule);\n        return id;\n    }\n\n    private void insertSchedule(long eventId, EventSchedule schedule) {\n        database.update(\"\"\"\n                INSERT INTO event_schedule (event_id, duration_minutes, check_in_opens_before_minutes, check_in_closes_after_minutes)\n                VALUES (?, ?, ?, ?)\n                \"\"\", eventId, schedule.durationMinutes(), schedule.checkInOpensBeforeMinutes(), schedule.checkInClosesAfterMinutes());\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public Event updateSchedule(long organizerId, long eventId, EventSchedule.Input input) {\n        LockedEvent event = lockOrganizerEvent(organizerId, eventId, false);\n        if (input.durationMinutes() == null && input.checkInOpensBeforeMinutes() == null && input.checkInClosesAfterMinutes() == null) {\n            throw ApiException.invalid(\"请填写要设置的活动时长或签到时段。\");\n        }\n        EventSchedule previous = readSchedule(eventId, event.startsAt());\n        EventSchedule revised = input.resolve(event.startsAt(), previous);\n        if (!revised.equals(previous)) {\n            if (previous == null) {\n                insertSchedule(eventId, revised);\n            } else {\n                database.update(\"\"\"\n                        UPDATE event_schedule SET duration_minutes = ?, check_in_opens_before_minutes = ?,\n                            check_in_closes_after_minutes = ? WHERE event_id = ?\n                        \"\"\", revised.durationMinutes(), revised.checkInOpensBeforeMinutes(), revised.checkInClosesAfterMinutes(), eventId);\n            }\n            invalidateCheckInWindow(eventId);\n        }\n        return organizerEvent(eventId);\n    }\n\n    private static EventSchedule mapSchedule(ResultSet row, LocalDateTime startsAt) throws SQLException {\n        Integer duration = row.getObject(\"duration_minutes\", Integer.class);\n        return duration == null ? null : new EventSchedule(duration, row.getInt(\"check_in_opens_before_minutes\"),\n                row.getInt(\"check_in_closes_after_minutes\"), startsAt.atZone(EventSchedule.CAMPUS_ZONE).toInstant());\n    }\n\n    private EventSchedule readSchedule(long eventId, LocalDateTime startsAt) {\n        return database.query(\"\"\"\n                SELECT duration_minutes, check_in_opens_before_minutes, check_in_closes_after_minutes\n                FROM event_schedule WHERE event_id = ?\n                \"\"\", (row, index) -> mapSchedule(row, startsAt), eventId).stream().findFirst().orElse(null);\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public Event publishEvent(long organizerId, long eventId) {\n        lockOrganizerEvent(organizerId, eventId, false);\n        return setPublished(eventId);\n    }\n\n    private Event setPublished(long eventId) {\n        database.update(\"UPDATE campus_event SET status = 'PUBLISHED' WHERE id = ?\", eventId);\n        return organizerEvent(eventId);\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public RegistrationView register(long eventId, ParticipantAccounts.Account account) {\n        String name = account.name();\n        String identifier = account.identifier();\n\n        LockedEvent event = lockEvent(eventId, true);\n        Optional\u003cRosterEntry> existing = database.query(\"\"\"\n                SELECT id, event_id, name, identifier, status FROM event_registration\n                WHERE event_id = ? AND identifier = ?\n                \"\"\", ROSTER_MAPPER, eventId, identifier).stream().findFirst();\n        if (existing.isPresent()) {\n            RosterEntry row = existing.get();\n            if (ownedRegistration(eventId, account.id()).isEmpty()) {\n                throw ApiException.conflict(\"该编号已有旧版报名，请联系组织者确认。\");\n            }\n            if (row.status() != RegistrationStatus.CANCELLED) {\n                throw ApiException.conflict(\"你已经报名，无需重复提交。\");\n            }\n        }\n\n        EventSchedule schedule = readSchedule(eventId, event.startsAt());\n        if (schedule != null && !Instant.now().isBefore(schedule.endsAt())) {\n            throw ApiException.conflict(\"活动已结束，报名已截止。\");\n        }\n\n        int confirmed = database.queryForObject(\"\"\"\n                SELECT COUNT(*) FROM event_registration\n                WHERE event_id = ? AND status \u003c> 'CANCELLED'\n                \"\"\", Integer.class, eventId);\n        if (confirmed >= event.capacity()) {\n            throw ApiException.conflict(\"活动名额已满。\");\n        }\n\n        long registrationId;\n        if (existing.isPresent()) {\n            registrationId = existing.get().id();\n            database.update(\"\"\"\n                    UPDATE event_registration\n                    SET name = ?, status = 'REGISTERED', registered_at = CURRENT_TIMESTAMP,\n                        checked_in_at = NULL, cancelled_at = NULL\n                    WHERE id = ?\n                    \"\"\", name, registrationId);\n        } else {\n            String digest = Secrets.tokenDigest(Secrets.newToken());\n            var key = new GeneratedKeyHolder();\n            database.update(connection -> {\n                var insert = connection.prepareStatement(\"\"\"\n                        INSERT INTO event_registration (event_id, name, identifier, status, token_digest, registered_at)\n                        VALUES (?, ?, ?, 'REGISTERED', ?, CURRENT_TIMESTAMP)\n                        \"\"\", Statement.RETURN_GENERATED_KEYS);\n                insert.setLong(1, eventId);\n                insert.setString(2, name);\n                insert.setString(3, identifier);\n                insert.setString(4, digest);\n                return insert;\n            }, key);\n            registrationId = Objects.requireNonNull(key.getKey()).longValue();\n            database.update(\"\"\"\n                    INSERT INTO event_registration_owner (registration_id, account_id) VALUES (?, ?)\n                    \"\"\", registrationId, account.id());\n        }\n        return new RegistrationView(registrationId, eventId, name, RegistrationStatus.REGISTERED);\n    }\n\n    RegistrationView ownRegistration(long eventId, ParticipantAccounts.Account account) {\n        return view(ownedRegistration(eventId, account.id()).orElseThrow(CampusEvents::registrationMissing));\n    }\n\n    List\u003cMyRegistration> myRegistrations(ParticipantAccounts.Account account) {\n        return database.query(EVENT_COLUMNS + \"\"\"\n                , r.status AS registration_status\n                FROM event_registration_owner o\n                JOIN event_registration r ON r.id = o.registration_id\n                JOIN campus_event e ON e.id = r.event_id\n                \"\"\" + EVENT_SCHEDULE_JOIN + \"\"\"\n                WHERE o.account_id = ? AND e.status = 'PUBLISHED'\n                ORDER BY e.starts_at, e.id\n                \"\"\", (row, index) -> new MyRegistration(EVENT_MAPPER.mapRow(row, index),\n                RegistrationStatus.valueOf(row.getString(\"registration_status\"))), account.id());\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public void cancel(long eventId, ParticipantAccounts.Account account) {\n        lockEvent(eventId, true);\n        RosterEntry entry = ownedRegistration(eventId, account.id()).orElseThrow(CampusEvents::registrationMissing);\n        if (entry.status() == RegistrationStatus.CHECKED_IN) {\n            throw ApiException.conflict(\"已签到的报名请由组织者处理。\");\n        }\n        if (entry.status() == RegistrationStatus.REGISTERED) {\n            database.update(\"\"\"\n                    UPDATE event_registration SET status = 'CANCELLED', cancelled_at = CURRENT_TIMESTAMP\n                    WHERE id = ?\n                    \"\"\", entry.id());\n        }\n    }\n\n    List\u003cRosterEntry> roster(long organizerId, long eventId) {\n        requireOrganizerEvent(organizerId, eventId);\n        return database.query(\"\"\"\n                SELECT id, event_id, name, identifier, status FROM event_registration\n                WHERE event_id = ? ORDER BY registered_at, id\n                \"\"\", ROSTER_MAPPER, eventId);\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public RosterEntry checkIn(long organizerId, long eventId, long registrationId) {\n        lockOrganizerEvent(organizerId, eventId, true);\n        RosterEntry entry = database.query(\"\"\"\n                SELECT id, event_id, name, identifier, status FROM event_registration\n                WHERE event_id = ? AND id = ?\n                \"\"\", ROSTER_MAPPER, eventId, registrationId).stream().findFirst()\n                .orElseThrow(CampusEvents::registrationMissing);\n        return markCheckedIn(entry);\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public CheckInWindow openCheckIn(long organizerId, long eventId) {\n        LockedEvent event = lockOrganizerEvent(organizerId, eventId, true);\n        Optional\u003cActiveWindow> previous = checkInWindow(eventId);\n        EventSchedule schedule = readSchedule(eventId, event.startsAt());\n        Instant now = Instant.now();\n        Instant expiry = Instant.ofEpochMilli(now.toEpochMilli()).plusSeconds(checkInSeconds);\n        if (schedule != null) {\n            schedule.requireOpen(now);\n            if (schedule.checkInClosesAt().isBefore(expiry)) expiry = schedule.checkInClosesAt();\n        }\n        database.update(\"DELETE FROM event_check_in_code_lease WHERE expires_at_ms \u003c= ?\", now.toEpochMilli());\n        String code = reserveCheckInCode(previous, expiry);\n        String digest = HexFormat.of().formatHex(Secrets.checkInDigest(checkInSecret, code));\n        if (previous.isPresent()) {\n            database.update(\"UPDATE event_check_in_window SET code_digest = ?, expires_at_ms = ? WHERE event_id = ?\",\n                    digest, expiry.toEpochMilli(), eventId);\n        } else {\n            database.update(\"\"\"\n                    INSERT INTO event_check_in_window (event_id, code_digest, expires_at_ms) VALUES (?, ?, ?)\n                    \"\"\", eventId, digest, expiry.toEpochMilli());\n        }\n        database.update(\"DELETE FROM event_check_in_attempt WHERE event_id = ?\", eventId);\n        return new CheckInWindow(eventId, code, expiry);\n    }\n\n    private String reserveCheckInCode(Optional\u003cActiveWindow> previous, Instant expiry) {\n        for (int attempt = 0; attempt \u003c 20; attempt++) {\n            String code = Secrets.newCheckInCode();\n            byte[] digest = Secrets.checkInDigest(checkInSecret, code);\n            if (previous.isPresent() && MessageDigest.isEqual(previous.get().digest(), digest)) {\n                continue;\n            }\n            try {\n                database.update(\"INSERT INTO event_check_in_code_lease (code_digest, expires_at_ms) VALUES (?, ?)\",\n                        HexFormat.of().formatHex(digest), expiry.toEpochMilli());\n                return code;\n            } catch (DuplicateKeyException ignored) {\n                // Another event reserved this code for a currently valid window.\n            }\n        }\n        throw new ApiException(HttpStatus.SERVICE_UNAVAILABLE, \"暂时无法分配签到码，请重新生成。\");\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public void closeCheckIn(long organizerId, long eventId) {\n        lockOrganizerEvent(organizerId, eventId, true);\n        invalidateCheckInWindow(eventId);\n    }\n\n    private void invalidateCheckInWindow(long eventId) {\n        database.update(\"UPDATE event_check_in_window SET expires_at_ms = 0 WHERE event_id = ?\", eventId);\n        database.update(\"DELETE FROM event_check_in_attempt WHERE event_id = ?\", eventId);\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED, noRollbackFor = IncorrectCheckInCode.class)\n    public RegistrationView selfCheckIn(long eventId, ParticipantAccounts.Account account, String enteredCode) {\n        LockedEvent event = lockEvent(eventId, true);\n        RosterEntry entry = ownedRegistration(eventId, account.id()).orElseThrow(\n                () -> ApiException.conflict(\"请先报名参加这场活动。\"));\n        if (entry.status() == RegistrationStatus.CANCELLED) {\n            throw ApiException.conflict(\"该报名已取消，请重新报名后签到。\");\n        }\n\n        String code = enteredCode == null || enteredCode.length() > 64 ? \"\" : enteredCode.strip();\n        if (!CHECK_IN_CODE.matcher(code).matches()) {\n            throw ApiException.invalid(\"请输入组织者提供的 6 位数字签到码。\");\n        }\n        EventSchedule schedule = readSchedule(eventId, event.startsAt());\n        Instant now = Instant.now();\n        if (schedule != null) schedule.requireOpen(now);\n        ActiveWindow window = checkInWindow(eventId)\n                .filter(current -> !current.expiry().equals(Instant.EPOCH))\n                .orElseThrow(() -> ApiException.conflict(\"组织者尚未开放签到或已关闭签到。\"));\n        if (!window.expiry().isAfter(now)) {\n            throw ApiException.conflict(\"签到码已过期，请使用现场的新签到码。\");\n        }\n        int failed = database.query(\"\"\"\n                SELECT failed_count FROM event_check_in_attempt WHERE event_id = ? AND account_id = ?\n                \"\"\", (row, index) -> row.getInt(\"failed_count\"), eventId, account.id())\n                .stream().findFirst().orElse(0);\n        if (failed >= MAX_FAILED_CHECK_INS) {\n            throw new ApiException(HttpStatus.TOO_MANY_REQUESTS, \"尝试次数已用完，请联系组织者换码或补录签到。\");\n        }\n        if (!MessageDigest.isEqual(window.digest(), Secrets.checkInDigest(checkInSecret, code))) {\n            recordFailedCheckIn(eventId, account.id(), failed);\n            int remaining = MAX_FAILED_CHECK_INS - failed - 1;\n            String message = remaining == 0 ? \"签到码不匹配，尝试次数已用完，请联系组织者换码或补录签到。\"\n                    : \"签到码不匹配，还可尝试 \" + remaining + \" 次。\";\n            throw new IncorrectCheckInCode(message);\n        }\n        return view(markCheckedIn(entry));\n    }\n\n    private Optional\u003cActiveWindow> checkInWindow(long eventId) {\n        return database.query(\"\"\"\n                SELECT code_digest, expires_at_ms FROM event_check_in_window WHERE event_id = ?\n                \"\"\", (row, index) -> new ActiveWindow(HexFormat.of().parseHex(row.getString(\"code_digest\")),\n                Instant.ofEpochMilli(row.getLong(\"expires_at_ms\"))), eventId).stream().findFirst();\n    }\n\n    private void recordFailedCheckIn(long eventId, long accountId, int failed) {\n        if (failed == 0) {\n            database.update(\"\"\"\n                    INSERT INTO event_check_in_attempt (event_id, account_id, failed_count) VALUES (?, ?, 1)\n                    \"\"\", eventId, accountId);\n        } else {\n            database.update(\"\"\"\n                    UPDATE event_check_in_attempt SET failed_count = ?\n                    WHERE event_id = ? AND account_id = ?\n                    \"\"\", failed + 1, eventId, accountId);\n        }\n    }\n\n    private RosterEntry markCheckedIn(RosterEntry entry) {\n        if (entry.status() == RegistrationStatus.CANCELLED) {\n            throw ApiException.conflict(\"已取消的报名不能签到。\");\n        }\n        if (entry.status() == RegistrationStatus.REGISTERED) {\n            database.update(\"\"\"\n                    UPDATE event_registration SET status = 'CHECKED_IN', checked_in_at = CURRENT_TIMESTAMP\n                    WHERE id = ?\n                    \"\"\", entry.id());\n        }\n        return new RosterEntry(entry.id(), entry.eventId(), entry.name(), entry.identifier(), RegistrationStatus.CHECKED_IN);\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public void seedExample() {\n        if (!database.queryForList(\"SELECT id FROM campus_event LIMIT 1\", Long.class).isEmpty()) {\n            return;\n        }\n        LocalDateTime when = LocalDateTime.now(EventSchedule.CAMPUS_ZONE)\n                .toLocalDate().plusDays(14).atTime(19, 0);\n        long eventId = insertEvent(new NewEvent(\"校园开发者分享会（样例）\",\n                \"三位同学分享校园开发经验。参与者可提交报名，组织者可核对名单并签到。\",\n                when, \"学生活动中心 · 204\", 20, null, null, null));\n        setPublished(eventId);\n    }\n\n    LegacyStatus legacyStatus() {\n        if (legacyPasswordDigest == null) {\n            return new LegacyStatus(false, 0);\n        }\n        Integer available = database.queryForObject(\"\"\"\n                SELECT COUNT(*) FROM campus_event e\n                WHERE NOT EXISTS (SELECT 1 FROM event_organizer eo WHERE eo.event_id = e.id)\n                \"\"\", Integer.class);\n        return new LegacyStatus(true, Objects.requireNonNull(available));\n    }\n\n    @Transactional(isolation = Isolation.READ_COMMITTED)\n    public LegacyClaim claimLegacy(long organizerId, String password) {\n        if (legacyPasswordDigest == null) {\n            throw ApiException.missing(\"旧活动迁移未启用。\");\n        }\n        if (password == null || password.length() > 256 ||\n                !MessageDigest.isEqual(legacyPasswordDigest, Secrets.sha256(password))) {\n            throw ApiException.unauthorized(\"旧管理口令不正确。\");\n        }\n\n        // No event is deleted by this application, so the oldest row is a stable migration lock.\n        if (database.queryForList(\"SELECT id FROM campus_event ORDER BY id LIMIT 1 FOR UPDATE\", Long.class).isEmpty()) {\n            return new LegacyClaim(0);\n        }\n        List\u003cLong> available = database.queryForList(\"\"\"\n                SELECT e.id FROM campus_event e\n                WHERE NOT EXISTS (SELECT 1 FROM event_organizer eo WHERE eo.event_id = e.id)\n                ORDER BY e.id\n                \"\"\", Long.class);\n        for (long eventId : available) {\n            database.update(\"INSERT INTO event_organizer (event_id, organizer_id) VALUES (?, ?)\", eventId, organizerId);\n        }\n        return new LegacyClaim(available.size());\n    }\n\n    private void requireOrganizerEvent(long organizerId, long eventId) {\n        if (database.queryForList(\"\"\"\n                SELECT event_id FROM event_organizer WHERE event_id = ? AND organizer_id = ?\n                \"\"\", Long.class, eventId, organizerId).isEmpty()) {\n            throw eventMissing();\n        }\n    }\n\n    private LockedEvent lockOrganizerEvent(long organizerId, long eventId, boolean requirePublished) {\n        requireOrganizerEvent(organizerId, eventId);\n        return lockEvent(eventId, requirePublished);\n    }\n\n    private Event organizerEvent(long id) {\n        return queryEvent(id).orElseThrow(CampusEvents::eventMissing);\n    }\n\n    private Optional\u003cEvent> queryEvent(long id) {\n        return database.query(EVENT_DETAILS + \"WHERE e.id = ?\", EVENT_MAPPER, id).stream().findFirst();\n    }\n\n    private LockedEvent lockEvent(long eventId, boolean requirePublished) {\n        // The event row is the shared lock for every operation that changes this event's capacity usage.\n        LockedEvent event = database.query(\"SELECT starts_at, capacity, status FROM campus_event WHERE id = ? FOR UPDATE\",\n                        (row, index) -> new LockedEvent(row.getObject(\"starts_at\", LocalDateTime.class), row.getInt(\"capacity\"),\n                                EventStatus.valueOf(row.getString(\"status\"))), eventId)\n                .stream().findFirst().orElseThrow(CampusEvents::eventMissing);\n        if (requirePublished && event.status() != EventStatus.PUBLISHED) {\n            throw eventMissing();\n        }\n        return event;\n    }\n\n    private Optional\u003cRosterEntry> ownedRegistration(long eventId, long accountId) {\n        return database.query(\"\"\"\n                SELECT r.id, r.event_id, r.name, r.identifier, r.status\n                FROM event_registration r\n                JOIN event_registration_owner o ON o.registration_id = r.id\n                WHERE r.event_id = ? AND o.account_id = ?\n                \"\"\", ROSTER_MAPPER, eventId, accountId).stream().findFirst();\n    }\n\n    private static RegistrationView view(RosterEntry entry) {\n        return new RegistrationView(entry.id(), entry.eventId(), entry.name(), entry.status());\n    }\n\n    static String identifier(String input) {\n        String identifier = input == null ? \"\" : input.strip();\n        if (!IDENTIFIER.matcher(identifier).matches()) {\n            throw ApiException.invalid(\"学号或报名编号需以字母或数字开头，最多 40 个字符，可含点、下划线和横线。\");\n        }\n        return identifier.toUpperCase(Locale.ROOT);\n    }\n\n    static String required(String value, int maxLength, String label) {\n        String text = value == null ? \"\" : value.strip();\n        if (text.isEmpty() || text.length() > maxLength || text.chars().anyMatch(Character::isISOControl)) {\n            throw ApiException.invalid(label + \"需填写 1 至 \" + maxLength + \" 个字符，不能包含换行等控制字符。\");\n        }\n        return text;\n    }\n\n    private static ApiException eventMissing() {\n        return ApiException.missing(\"没有找到该活动。\");\n    }\n\n    private static ApiException registrationMissing() {\n        return ApiException.missing(\"没有找到该报名记录。\");\n    }\n\n    enum EventStatus { DRAFT, PUBLISHED }\n    enum RegistrationStatus { REGISTERED, CHECKED_IN, CANCELLED }\n\n    record NewEvent(String title, String description, LocalDateTime startsAt, String location, Integer capacity,\n                    Integer durationMinutes, Integer checkInOpensBeforeMinutes, Integer checkInClosesAfterMinutes) {}\n    record Event(long id, String title, String description, LocalDateTime startsAt, String location,\n                 int capacity, int confirmed, int remaining, EventStatus status, @JsonUnwrapped EventSchedule schedule) {}\n    record RegistrationView(long id, long eventId, String name, RegistrationStatus status) {}\n    record RosterEntry(long id, long eventId, String name, String identifier, RegistrationStatus status) {}\n    record MyRegistration(Event event, RegistrationStatus status) {}\n    record CheckInWindow(long eventId, String code, Instant expiresAt) {}\n    record LegacyStatus(boolean enabled, int available) {}\n    record LegacyClaim(int claimed) {}\n    private record LockedEvent(LocalDateTime startsAt, int capacity, EventStatus status) {}\n    private record ActiveWindow(byte[] digest, Instant expiry) {}\n\n    private static final class IncorrectCheckInCode extends ApiException {\n        private IncorrectCheckInCode(String message) {\n            super(HttpStatus.CONFLICT, message);\n        }\n    }\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/CampusEventsApplication.java","text":"package cn.campus.events;\n\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.ApplicationRunner;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.boot.autoconfigure.condition.ConditionalOnProperty;\nimport org.springframework.context.annotation.Bean;\n\n@SpringBootApplication\npublic class CampusEventsApplication {\n    public static void main(String[] args) {\n        SpringApplication.run(CampusEventsApplication.class, args);\n    }\n\n    @Bean\n    @ConditionalOnProperty(name = \"campus.seed-sample\", havingValue = \"true\")\n    ApplicationRunner sampleEvent(CampusEvents events) {\n        return args -> events.seedExample();\n    }\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/EventSchedule.java","text":"package cn.campus.events;\n\nimport com.fasterxml.jackson.annotation.JsonProperty;\n\nimport java.time.Instant;\nimport java.time.LocalDateTime;\nimport java.time.ZoneId;\nimport java.time.temporal.ChronoUnit;\nimport java.util.Objects;\n\nrecord EventSchedule(int durationMinutes, int checkInOpensBeforeMinutes, int checkInClosesAfterMinutes,\n                     Instant startsAtInstant) {\n    static final ZoneId CAMPUS_ZONE = ZoneId.of(\"Asia/Shanghai\");\n\n    EventSchedule {\n        if (durationMinutes \u003c 1 || durationMinutes > 1440) {\n            throw ApiException.invalid(\"活动时长应为 1 至 1440 分钟。\");\n        }\n        if (checkInOpensBeforeMinutes \u003c 0 || checkInOpensBeforeMinutes > 1440) {\n            throw ApiException.invalid(\"签到可在活动开始前 0 至 1440 分钟开放。\");\n        }\n        if (checkInClosesAfterMinutes \u003c 1 || checkInClosesAfterMinutes > durationMinutes) {\n            throw ApiException.invalid(\"签到截止时间须在活动开始至少 1 分钟后，且不能晚于活动结束。\");\n        }\n    }\n\n    record Input(Integer durationMinutes, Integer checkInOpensBeforeMinutes, Integer checkInClosesAfterMinutes) {\n        EventSchedule resolve(LocalDateTime startsAt, EventSchedule previous) {\n            int duration = Objects.requireNonNullElse(durationMinutes, previous == null ? 120 : previous.durationMinutes);\n            int before = Objects.requireNonNullElse(checkInOpensBeforeMinutes,\n                    previous == null ? 15 : previous.checkInOpensBeforeMinutes);\n            int after = Objects.requireNonNullElse(checkInClosesAfterMinutes,\n                    previous == null ? Math.min(30, duration) : previous.checkInClosesAfterMinutes);\n            return new EventSchedule(duration, before, after, startsAt.atZone(CAMPUS_ZONE).toInstant());\n        }\n    }\n\n    @JsonProperty\n    public Instant endsAt() {\n        return startsAtInstant.plus(durationMinutes, ChronoUnit.MINUTES);\n    }\n\n    @JsonProperty\n    public Instant checkInOpensAt() {\n        return startsAtInstant.minus(checkInOpensBeforeMinutes, ChronoUnit.MINUTES);\n    }\n\n    @JsonProperty\n    public Instant checkInClosesAt() {\n        return startsAtInstant.plus(checkInClosesAfterMinutes, ChronoUnit.MINUTES);\n    }\n\n    void requireOpen(Instant now) {\n        if (now.isBefore(checkInOpensAt())) {\n            throw ApiException.conflict(\"未到本场活动的签到开放时间。\");\n        }\n        if (!now.isBefore(checkInClosesAt())) {\n            throw ApiException.conflict(\"本场活动的签到时段已结束。\");\n        }\n    }\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/OrganizerAccounts.java","text":"package cn.campus.events;\n\nimport org.springframework.dao.DuplicateKeyException;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.jdbc.core.JdbcTemplate;\nimport org.springframework.jdbc.support.GeneratedKeyHolder;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport java.security.MessageDigest;\nimport java.sql.Statement;\nimport java.time.Duration;\nimport java.time.Instant;\nimport java.util.HashMap;\nimport java.util.HexFormat;\nimport java.util.Locale;\nimport java.util.Map;\nimport java.util.Objects;\nimport java.util.concurrent.ConcurrentHashMap;\nimport java.util.regex.Pattern;\n\n@Service\nclass OrganizerAccounts {\n    static final String COOKIE = \"campus_organizer\";\n    static final Duration SESSION_LIFETIME = Duration.ofHours(8);\n    private static final Pattern USERNAME = Pattern.compile(\"[A-Za-z0-9][A-Za-z0-9._-]{2,39}\");\n    private static final HexFormat HEX = HexFormat.of();\n    private static final int LOGIN_BUDGET = 24;\n    private static final int MAX_SOURCE_ENTRIES = 10_000;\n    private static final Duration LOGIN_INTERVAL = Duration.ofMinutes(5);\n\n    private final JdbcTemplate database;\n    private final AccountPasswords passwords;\n    private final byte[] dummySalt = Secrets.randomBytes(16);\n    private final ConcurrentHashMap\u003cString, Session> active = new ConcurrentHashMap\u003c>();\n    private final Map\u003cString, LoginWindow> loginWindows = new HashMap\u003c>();\n    private Instant nextCleanup = Instant.EPOCH;\n\n    OrganizerAccounts(JdbcTemplate database, AccountPasswords passwords) {\n        this.database = database;\n        this.passwords = passwords;\n    }\n\n    @Transactional\n    Account create(Register input) {\n        String name = CampusEvents.required(input.name(), 60, \"组织者姓名\");\n        String username = normalize(input.username());\n        if (username == null) {\n            throw ApiException.invalid(\"用户名需以字母或数字开头，共 3 至 40 个字符，可含点、下划线和横线。\");\n        }\n        String password = AccountPasswords.validate(input.password());\n        byte[] salt = Secrets.randomBytes(16);\n        String digest = HEX.formatHex(passwords.derive(password, salt));\n        var key = new GeneratedKeyHolder();\n        try {\n            database.update(connection -> {\n                var insert = connection.prepareStatement(\"\"\"\n                        INSERT INTO organizer_account (name, username, password_salt, password_digest)\n                        VALUES (?, ?, ?, ?)\n                        \"\"\", Statement.RETURN_GENERATED_KEYS);\n                insert.setString(1, name);\n                insert.setString(2, username);\n                insert.setString(3, HEX.formatHex(salt));\n                insert.setString(4, digest);\n                return insert;\n            }, key);\n        } catch (DuplicateKeyException error) {\n            throw ApiException.conflict(\"该用户名已注册，请登录或选择其他用户名。\");\n        }\n        long id = Objects.requireNonNull(key.getKey()).longValue();\n        database.update(\"INSERT INTO organizer_pending_tour (organizer_id) VALUES (?)\", id);\n        return new Account(id, name, username);\n    }\n\n    WorkspaceSession workspaceSession(String token) {\n        Account account = require(token);\n        boolean pending = !database.queryForList(\n                \"SELECT organizer_id FROM organizer_pending_tour WHERE organizer_id = ?\", Long.class, account.id()).isEmpty();\n        return new WorkspaceSession(account.id(), account.name(), account.username(), pending);\n    }\n\n    boolean startTour(long organizerId) {\n        return database.update(\"DELETE FROM organizer_pending_tour WHERE organizer_id = ?\", organizerId) == 1;\n    }\n\n    Account authenticate(Login input, String source) {\n        String username = normalize(input.username());\n        if (username == null || input.password() == null || input.password().length() > 128) {\n            throw invalidCredentials();\n        }\n        checkAttemptBudget(\"login:\" + source);\n        Credentials saved = database.query(\"\"\"\n                SELECT id, name, username, password_salt, password_digest\n                FROM organizer_account WHERE username = ?\n                \"\"\", (row, index) -> new Credentials(\n                new Account(row.getLong(\"id\"), row.getString(\"name\"), row.getString(\"username\")),\n                HEX.parseHex(row.getString(\"password_salt\")), HEX.parseHex(row.getString(\"password_digest\"))),\n                username).stream().findFirst().orElse(null);\n        byte[] digest = passwords.derive(input.password(), saved == null ? dummySalt : saved.salt());\n        if (saved == null || !MessageDigest.isEqual(digest, saved.digest())) {\n            throw invalidCredentials();\n        }\n        return saved.account();\n    }\n\n    String begin(Account account, String previousToken) {\n        end(previousToken);\n        Instant now = Instant.now();\n        active.entrySet().removeIf(entry -> !entry.getValue().expiry().isAfter(now));\n        String token = Secrets.newToken();\n        active.put(Secrets.tokenDigest(token), new Session(account, now.plus(SESSION_LIFETIME)));\n        return token;\n    }\n\n    Account require(String token) {\n        String digest = Secrets.tokenDigest(token);\n        Session session = digest == null ? null : active.get(digest);\n        if (session == null || !session.expiry().isAfter(Instant.now())) {\n            throw ApiException.unauthorized(\"请先登录组织者账号。\");\n        }\n        return session.account();\n    }\n\n    void end(String token) {\n        String digest = Secrets.tokenDigest(token);\n        if (digest != null) {\n            active.remove(digest);\n        }\n    }\n\n    synchronized void checkAttemptBudget(String source) {\n        Instant now = Instant.now();\n        if (!nextCleanup.isAfter(now)) {\n            loginWindows.values().removeIf(window -> !window.expiry().isAfter(now));\n            nextCleanup = now.plus(LOGIN_INTERVAL);\n        }\n        LoginWindow window = loginWindows.get(source);\n        if (window == null || !window.expiry().isAfter(now)) {\n            if (window == null && loginWindows.size() >= MAX_SOURCE_ENTRIES) {\n                throw tooManyAttempts();\n            }\n            window = new LoginWindow(now.plus(LOGIN_INTERVAL), 0);\n        }\n        if (window.attempts() >= LOGIN_BUDGET) {\n            throw tooManyAttempts();\n        }\n        loginWindows.put(source, new LoginWindow(window.expiry(), window.attempts() + 1));\n    }\n\n    private static String normalize(String input) {\n        String cleaned = input == null ? \"\" : input.strip();\n        return USERNAME.matcher(cleaned).matches() ? cleaned.toLowerCase(Locale.ROOT) : null;\n    }\n\n    private static ApiException invalidCredentials() {\n        return ApiException.unauthorized(\"用户名或密码不正确。\");\n    }\n\n    private static ApiException tooManyAttempts() {\n        return new ApiException(HttpStatus.TOO_MANY_REQUESTS, \"当前网络登录请求较多，请约 5 分钟后重试。\");\n    }\n\n    record Register(String name, String username, String password) {}\n    record Login(String username, String password) {}\n    record Account(long id, String name, String username) {}\n    record WorkspaceSession(long id, String name, String username, boolean tourPending) {}\n    private record Credentials(Account account, byte[] salt, byte[] digest) {}\n    private record Session(Account account, Instant expiry) {}\n    private record LoginWindow(Instant expiry, int attempts) {}\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/OrganizerController.java","text":"package cn.campus.events;\n\nimport jakarta.servlet.http.HttpServletRequest;\nimport org.springframework.http.HttpHeaders;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseCookie;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.CookieValue;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PatchMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.ResponseStatus;\nimport org.springframework.web.bind.annotation.RestController;\n\nimport java.time.Duration;\nimport java.util.List;\n\n@RestController\n@RequestMapping(\"/api/organizer\")\nfinal class OrganizerController {\n    private static final String COOKIE = OrganizerAccounts.COOKIE;\n\n    private final CampusEvents events;\n    private final OrganizerAccounts accounts;\n\n    OrganizerController(CampusEvents events, OrganizerAccounts accounts) {\n        this.events = events;\n        this.accounts = accounts;\n    }\n\n    @PostMapping(\"/register\")\n    ResponseEntity\u003cOrganizerAccounts.Account> register(@RequestBody OrganizerAccounts.Register input,\n            @CookieValue(value = COOKIE, required = false) String previousToken, HttpServletRequest request) {\n        OrganizerAccounts.Account account = accounts.create(input);\n        return started(account, previousToken, request.isSecure(), HttpStatus.CREATED);\n    }\n\n    @PostMapping(\"/login\")\n    ResponseEntity\u003cOrganizerAccounts.Account> login(@RequestBody OrganizerAccounts.Login input,\n            @CookieValue(value = COOKIE, required = false) String previousToken, HttpServletRequest request) {\n        OrganizerAccounts.Account account = accounts.authenticate(input, request.getRemoteAddr());\n        return started(account, previousToken, request.isSecure(), HttpStatus.OK);\n    }\n\n    @GetMapping(\"/session\")\n    OrganizerAccounts.WorkspaceSession session(@CookieValue(value = COOKIE, required = false) String token) {\n        return accounts.workspaceSession(token);\n    }\n\n    @PostMapping(\"/tour/start\")\n    TourStart startTour(@CookieValue(value = COOKIE, required = false) String token) {\n        return new TourStart(accounts.startTour(organizerId(token)));\n    }\n\n    @DeleteMapping(\"/session\")\n    ResponseEntity\u003cVoid> logout(@CookieValue(value = COOKIE, required = false) String token, HttpServletRequest request) {\n        accounts.end(token);\n        return ResponseEntity.noContent().header(HttpHeaders.SET_COOKIE, cookie(\"\", Duration.ZERO, request.isSecure())).build();\n    }\n\n    @GetMapping(\"/legacy\")\n    CampusEvents.LegacyStatus legacy(@CookieValue(value = COOKIE, required = false) String token) {\n        accounts.require(token);\n        return events.legacyStatus();\n    }\n\n    @PostMapping(\"/claim-legacy\")\n    CampusEvents.LegacyClaim claimLegacy(@CookieValue(value = COOKIE, required = false) String token,\n                                        @RequestBody LegacyPassword input, HttpServletRequest request) {\n        long owner = organizerId(token);\n        accounts.checkAttemptBudget(\"legacy:\" + request.getRemoteAddr());\n        return events.claimLegacy(owner, input.password());\n    }\n\n    @GetMapping(\"/events\")\n    List\u003cCampusEvents.Event> list(@CookieValue(value = COOKIE, required = false) String token) {\n        return events.organizerEvents(organizerId(token));\n    }\n\n    @PostMapping(\"/events\")\n    @ResponseStatus(HttpStatus.CREATED)\n    CampusEvents.Event create(@CookieValue(value = COOKIE, required = false) String token,\n                              @RequestBody CampusEvents.NewEvent input) {\n        return events.createEvent(organizerId(token), input);\n    }\n\n    @PatchMapping(\"/events/{id}/schedule\")\n    CampusEvents.Event updateSchedule(@CookieValue(value = COOKIE, required = false) String token,\n                                      @PathVariable long id, @RequestBody EventSchedule.Input input) {\n        return events.updateSchedule(organizerId(token), id, input);\n    }\n\n    @PostMapping(\"/events/{id}/publish\")\n    CampusEvents.Event publish(@CookieValue(value = COOKIE, required = false) String token, @PathVariable long id) {\n        return events.publishEvent(organizerId(token), id);\n    }\n\n    @GetMapping(\"/events/{id}/registrations\")\n    List\u003cCampusEvents.RosterEntry> roster(@CookieValue(value = COOKIE, required = false) String token,\n                                         @PathVariable long id) {\n        return events.roster(organizerId(token), id);\n    }\n\n    @PostMapping(\"/events/{eventId}/registrations/{id}/check-in\")\n    CampusEvents.RosterEntry checkIn(@CookieValue(value = COOKIE, required = false) String token,\n                                     @PathVariable long eventId, @PathVariable long id) {\n        return events.checkIn(organizerId(token), eventId, id);\n    }\n\n    @PostMapping(\"/events/{id}/check-in-window\")\n    CampusEvents.CheckInWindow openCheckIn(@CookieValue(value = COOKIE, required = false) String token,\n                                         @PathVariable long id) {\n        return events.openCheckIn(organizerId(token), id);\n    }\n\n    @DeleteMapping(\"/events/{id}/check-in-window\")\n    @ResponseStatus(HttpStatus.NO_CONTENT)\n    void closeCheckIn(@CookieValue(value = COOKIE, required = false) String token, @PathVariable long id) {\n        events.closeCheckIn(organizerId(token), id);\n    }\n\n    private long organizerId(String token) {\n        return accounts.require(token).id();\n    }\n\n    private ResponseEntity\u003cOrganizerAccounts.Account> started(OrganizerAccounts.Account account,\n            String previousToken, boolean secure, HttpStatus status) {\n        String token = accounts.begin(account, previousToken);\n        return ResponseEntity.status(status)\n                .header(HttpHeaders.SET_COOKIE, cookie(token, OrganizerAccounts.SESSION_LIFETIME, secure))\n                .body(account);\n    }\n\n    private static String cookie(String value, Duration expiry, boolean secure) {\n        return ResponseCookie.from(COOKIE, value)\n                .path(\"/api/organizer\")\n                .httpOnly(true)\n                .secure(secure)\n                .sameSite(\"Strict\")\n                .maxAge(expiry)\n                .build().toString();\n    }\n\n    record LegacyPassword(String password) {}\n    record TourStart(boolean started) {}\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/ParticipantAccounts.java","text":"package cn.campus.events;\n\nimport org.springframework.dao.DuplicateKeyException;\nimport org.springframework.jdbc.core.JdbcTemplate;\nimport org.springframework.jdbc.support.GeneratedKeyHolder;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport java.security.MessageDigest;\nimport java.sql.Statement;\nimport java.time.Duration;\nimport java.time.Instant;\nimport java.util.HexFormat;\nimport java.util.Objects;\nimport java.util.concurrent.ConcurrentHashMap;\n\n@Service\nclass ParticipantAccounts {\n    static final String COOKIE = \"campus_participant\";\n    static final Duration SESSION_LIFETIME = Duration.ofHours(12);\n    private static final HexFormat HEX = HexFormat.of();\n\n    private final JdbcTemplate database;\n    private final AccountPasswords passwords;\n    private final byte[] dummySalt = Secrets.randomBytes(16);\n    private final ConcurrentHashMap\u003cString, Session> active = new ConcurrentHashMap\u003c>();\n\n    ParticipantAccounts(JdbcTemplate database, AccountPasswords passwords) {\n        this.database = database;\n        this.passwords = passwords;\n    }\n\n    @Transactional\n    public Account create(Register input) {\n        String name = CampusEvents.required(input.name(), 60, \"参与者姓名\");\n        String identifier = CampusEvents.identifier(input.identifier());\n        String password = AccountPasswords.validate(input.password());\n        byte[] salt = Secrets.randomBytes(16);\n        String digest = HEX.formatHex(passwords.derive(password, salt));\n        var key = new GeneratedKeyHolder();\n        try {\n            database.update(connection -> {\n                var insert = connection.prepareStatement(\"\"\"\n                        INSERT INTO participant_account (name, identifier, password_salt, password_digest)\n                        VALUES (?, ?, ?, ?)\n                        \"\"\", Statement.RETURN_GENERATED_KEYS);\n                insert.setString(1, name);\n                insert.setString(2, identifier);\n                insert.setString(3, HEX.formatHex(salt));\n                insert.setString(4, digest);\n                return insert;\n            }, key);\n        } catch (DuplicateKeyException error) {\n            throw ApiException.conflict(\"该参与者编号已注册，请直接登录。\");\n        }\n        long id = Objects.requireNonNull(key.getKey()).longValue();\n        database.update(\"INSERT INTO participant_tour_pending (account_id) VALUES (?)\", id);\n        return new Account(id, name, identifier);\n    }\n\n    Account authenticate(Login input) {\n        String identifier;\n        try {\n            identifier = CampusEvents.identifier(input.identifier());\n        } catch (ApiException error) {\n            throw invalidCredentials();\n        }\n        if (input.password() == null || input.password().length() > 128) {\n            throw invalidCredentials();\n        }\n        Credentials credentials = database.query(\"\"\"\n                SELECT id, name, identifier, password_salt, password_digest\n                FROM participant_account WHERE identifier = ?\n                \"\"\", (row, index) -> new Credentials(\n                new Account(row.getLong(\"id\"), row.getString(\"name\"), row.getString(\"identifier\")),\n                HEX.parseHex(row.getString(\"password_salt\")), HEX.parseHex(row.getString(\"password_digest\"))),\n                identifier).stream().findFirst().orElse(null);\n        byte[] digest = passwords.derive(input.password(), credentials == null ? dummySalt : credentials.salt());\n        if (credentials == null || !MessageDigest.isEqual(digest, credentials.digest())) {\n            throw invalidCredentials();\n        }\n        return credentials.account();\n    }\n\n    String begin(Account account, String previousToken) {\n        end(previousToken);\n        Instant now = Instant.now();\n        active.entrySet().removeIf(entry -> !entry.getValue().expiry().isAfter(now));\n        String token = Secrets.newToken();\n        active.put(Secrets.tokenDigest(token), new Session(account, now.plus(SESSION_LIFETIME)));\n        return token;\n    }\n\n    Account require(String token) {\n        String digest = Secrets.tokenDigest(token);\n        Session session = digest == null ? null : active.get(digest);\n        if (session == null || !session.expiry().isAfter(Instant.now())) {\n            throw ApiException.unauthorized(\"请先登录参与者账号。\");\n        }\n        return session.account();\n    }\n\n    void end(String token) {\n        String digest = Secrets.tokenDigest(token);\n        if (digest != null) {\n            active.remove(digest);\n        }\n    }\n\n    Profile profile(Account account) {\n        boolean pending = Boolean.TRUE.equals(database.queryForObject(\n            \"SELECT COUNT(*) > 0 FROM participant_tour_pending WHERE account_id = ?\", Boolean.class, account.id()));\n        return new Profile(account.id(), account.name(), account.identifier(), pending);\n    }\n\n    boolean startTour(Account account) {\n        return database.update(\"DELETE FROM participant_tour_pending WHERE account_id = ?\", account.id()) == 1;\n    }\n\n    private static ApiException invalidCredentials() {\n        return ApiException.unauthorized(\"参与者编号或密码不正确。\");\n    }\n\n    record Register(String name, String identifier, String password) {}\n    record Login(String identifier, String password) {}\n    record Account(long id, String name, String identifier) {}\n    record Profile(long id, String name, String identifier, boolean tourPending) {}\n    private record Credentials(Account account, byte[] salt, byte[] digest) {}\n    private record Session(Account account, Instant expiry) {}\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/PublicEventsController.java","text":"package cn.campus.events;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.web.bind.annotation.CookieValue;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.ResponseStatus;\nimport org.springframework.web.bind.annotation.RestController;\n\nimport java.util.List;\n\n@RestController\n@RequestMapping(\"/api/events\")\nfinal class PublicEventsController {\n    private static final String COOKIE = ParticipantAccounts.COOKIE;\n\n    private final CampusEvents events;\n    private final ParticipantAccounts accounts;\n\n    PublicEventsController(CampusEvents events, ParticipantAccounts accounts) {\n        this.events = events;\n        this.accounts = accounts;\n    }\n\n    @GetMapping\n    List\u003cCampusEvents.Event> list() {\n        return events.publishedEvents();\n    }\n\n    @GetMapping(\"/{id}\")\n    CampusEvents.Event event(@PathVariable long id) {\n        return events.publishedEvent(id);\n    }\n\n    @PostMapping(\"/{id}/registrations\")\n    @ResponseStatus(HttpStatus.CREATED)\n    CampusEvents.RegistrationView register(@PathVariable long id,\n            @CookieValue(value = COOKIE, required = false) String token) {\n        return events.register(id, accounts.require(token));\n    }\n\n    @GetMapping(\"/{id}/registration\")\n    CampusEvents.RegistrationView ownRegistration(@PathVariable long id,\n            @CookieValue(value = COOKIE, required = false) String token) {\n        return events.ownRegistration(id, accounts.require(token));\n    }\n\n    @DeleteMapping(\"/{id}/registration\")\n    @ResponseStatus(HttpStatus.NO_CONTENT)\n    void cancel(@PathVariable long id, @CookieValue(value = COOKIE, required = false) String token) {\n        events.cancel(id, accounts.require(token));\n    }\n\n    @PostMapping(\"/{id}/self-check-in\")\n    CampusEvents.RegistrationView selfCheckIn(@PathVariable long id,\n            @CookieValue(value = COOKIE, required = false) String token, @RequestBody SelfCheckIn input) {\n        return events.selfCheckIn(id, accounts.require(token), input.code());\n    }\n\n    record SelfCheckIn(String code) {}\n}\n","group":"后端"},{"path":"src/main/java/cn/campus/events/Secrets.java","text":"package cn.campus.events;\n\nimport javax.crypto.Mac;\nimport javax.crypto.spec.SecretKeySpec;\nimport java.nio.charset.StandardCharsets;\nimport java.security.GeneralSecurityException;\nimport java.security.MessageDigest;\nimport java.security.NoSuchAlgorithmException;\nimport java.security.SecureRandom;\nimport java.util.HexFormat;\nimport java.util.Locale;\nimport java.util.regex.Pattern;\n\nfinal class Secrets {\n    private static final SecureRandom RANDOM = new SecureRandom();\n    private static final Pattern TOKEN_FORMAT = Pattern.compile(\"[0-9a-f]{64}\");\n\n    private Secrets() {\n    }\n\n    static String newToken() {\n        return HexFormat.of().formatHex(randomBytes(32));\n    }\n\n    static byte[] randomBytes(int length) {\n        byte[] bytes = new byte[length];\n        RANDOM.nextBytes(bytes);\n        return bytes;\n    }\n\n    static String newCheckInCode() {\n        return String.format(Locale.ROOT, \"%06d\", RANDOM.nextInt(1_000_000));\n    }\n\n    static byte[] checkInDigest(byte[] secret, String
