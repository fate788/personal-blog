r: 1px solid #ccbaa8;\n  border-radius: 8px;\n  background: var(--paper);\n  box-shadow: 0 12px 28px #3e24241f, 0 3px 6px #3e24240d;\n  list-style: none;\n}\n\n.template-picker[data-opens-above] [role=\"listbox\"] {\n  inset-block: auto calc(100% + 5px);\n}\n\n.template-picker [role=\"option\"] {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto 11px;\n  align-items: center;\n  gap: 7px;\n  min-height: 40px;\n  padding: 7px 10px;\n  border-radius: 4px;\n  color: var(--ink);\n  font: 500 14px / 1.4 var(--body);\n  cursor: pointer;\n}\n\n.template-picker [role=\"option\"] small {\n  color: var(--muted);\n  font: 400 11px / 1.4 var(--body);\n  font-variant-numeric: tabular-nums;\n}\n\n.template-picker [role=\"option\"]:first-child {\n  margin-block-end: 4px;\n}\n\n.template-picker [role=\"option\"]:is([data-active], :hover) {\n  background: #efe4d8;\n  color: var(--wine-deep);\n}\n\n.template-picker [role=\"option\"][aria-selected=\"true\"] {\n  background: var(--wine);\n  color: var(--paper);\n}\n\n.template-picker [role=\"option\"][aria-selected=\"true\"] small {\n  color: #f0d8bc;\n}\n\n.template-picker [role=\"option\"][aria-selected=\"true\"]::after {\n  content: '';\n  grid-column: 3;\n  width: 6px;\n  height: 10px;\n  justify-self: center;\n  margin-top: -3px;\n  border: solid #ecd4a7;\n  border-width: 0 1.5px 1.5px 0;\n  transform: rotate(45deg);\n}\n\n@media (pointer: coarse) {\n  .template-picker [role=\"option\"] { min-height: 44px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .template-picker [role=\"combobox\"] { transition: none; }\n}\n\n@media (forced-colors: active) {\n  .template-picker [role=\"option\"][aria-selected=\"true\"] { border: 1px solid Highlight; }\n  .template-picker [role=\"option\"][data-active] { outline: 1px dashed Highlight; outline-offset: -3px; }\n}\n","group":"前端"},{"path":"src/main/resources/static/tour-position.js","text":"function positionCampusTour(panel, anchor) {\n  if (panel.hidden || !anchor?.isConnected) return;\n  const viewport = window.visualViewport;\n  const inset = 12;\n  const gap = 12;\n  const leftEdge = (viewport?.offsetLeft ?? 0) + inset;\n  const topEdge = (viewport?.offsetTop ?? 0) + inset;\n  const rightEdge = leftEdge + (viewport?.width ?? document.documentElement.clientWidth) - inset * 2;\n  const bottomEdge = topEdge + (viewport?.height ?? document.documentElement.clientHeight) - inset * 2;\n  const target = anchor.getBoundingClientRect();\n  panel.style.maxWidth = Math.max(0, rightEdge - leftEdge) + 'px';\n  panel.style.maxHeight = Math.max(80, bottomEdge - topEdge) + 'px';\n  const width = panel.offsetWidth;\n  const height = panel.offsetHeight;\n  const centerX = target.left + target.width / 2;\n  const centerY = target.top + target.height / 2;\n  const horizontal = centerX - width / 2;\n  const vertical = centerY - height / 2;\n  const options = [\n    { x: target.right + gap, y: vertical, space: rightEdge - target.right - gap - width },\n    { x: target.left - gap - width, y: vertical, space: target.left - gap - leftEdge - width },\n    { x: horizontal, y: target.bottom + gap, space: bottomEdge - target.bottom - gap - height },\n    { x: horizontal, y: target.top - gap - height, space: target.top - gap - topEdge - height },\n  ];\n  const placement = options.find(option => option.space >= 0) ||\n    (options[2].space > options[3].space ? options[2] : options[3]);\n  const left = Math.max(leftEdge, Math.min(placement.x, rightEdge - width));\n  const top = Math.max(topEdge, Math.min(placement.y, bottomEdge - height));\n  panel.style.left = left + 'px';\n  panel.style.top = top + 'px';\n}\n","group":"前端"},{"path":"src/main/resources/static/workspace-layout.css","text":"/* Shared photographic cover for the public event and its authoring preview. */\n.draft-preview-cover,\nbody[data-portal=\"participant\"] .event-detail .detail-cover {\n  background:\n    linear-gradient(0deg, #311823ee, #361b2690 36%, #301a2410 84%),\n    #42232d url(\"./images/campus-gallery.webp\") center 55% / cover no-repeat;\n  color: #fff9ef;\n}\nbody[data-portal=\"participant\"] .event-detail .detail-cover::after { content: none; }\n\nbody[data-portal=\"organizer\"] {\n  --workspace-padding: clamp(24px, 3.4vw, 56px);\n  --workspace-gilt: #b59665;\n}\n.workspace-main { background: linear-gradient(116deg, #f8f4ed, #f3ece2); }\n.workspace-content { max-width: 1416px; padding-top: clamp(24px, 3.3vw, 50px); }\n.workspace-content .workspace-heading h1 { letter-spacing: .035em; line-height: 1.18; }\n.workspace-content .workspace-heading p { line-height: 1.65; }\n.workspace-content .text-action { text-underline-offset: .26em; }\n\n.organizer-schedule-editor {\n  margin-block: 14px 20px;\n  border: 1px solid var(--workspace-border);\n  border-radius: 8px;\n  background: var(--paper);\n}\n.organizer-schedule-editor summary {\n  display: flex;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 5px 14px;\n  min-height: 50px;\n  padding: 11px clamp(14px, 2vw, 25px);\n  list-style: none;\n  cursor: pointer;\n}\n.organizer-schedule-editor summary::-webkit-details-marker { display: none; }\n.organizer-schedule-editor summary strong { color: var(--wine-deep); font: 600 17px / 1.45 var(--display); }\n.organizer-schedule-editor summary span { color: var(--muted); font-size: 12px; }\n.organizer-schedule-editor summary::after {\n  content: ''; width: 7px; height: 7px; margin-inline-start: auto;\n  border: solid var(--brass-dark); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);\n}\n.organizer-schedule-editor[open] summary::after { transform: rotate(225deg); }\n.organizer-schedule-editor form { gap: 12px; margin: 0; padding: 0 clamp(14px, 2vw, 25px) 17px; }\n.organizer-schedule-editor [data-feedback]:empty { display: none; }\n.schedule-editor-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }\n.schedule-editor-actions p { flex: 1 1 220px; color: var(--muted); font-size: 13px; }\n.schedule-editor-actions .button { margin-inline-start: auto; }\n\n.workspace-creation { width: 100%; }\n.workspace-editor { display: grid; align-items: start; gap: clamp(16px, 1.7vw, 28px); }\n.workspace-creation-form {\n  gap: 23px;\n  border: 1px solid #ddcfc0;\n  border-top: 2px solid var(--workspace-gilt);\n  border-radius: 4px 4px 10px 10px;\n  padding: clamp(24px, 2.7vw, 42px);\n  background: #fffdf8;\n  box-shadow: 0 12px 38px #58351d08;\n}\n.workspace-creation-form .workspace-heading {\n  margin: 0;\n  padding-bottom: 21px;\n  border-bottom: 1px solid var(--workspace-border);\n}\n.workspace-creation-form .workspace-heading h1 { font-size: clamp(32px, 3vw, 46px); }\n.workspace-creation-form .workspace-heading p { margin-top: 6px; color: #77675f; font-size: 13px; }\n.workspace-creation-fields { gap: 20px 15px; }\n.workspace-creation-form label { color: #392927; letter-spacing: .012em; }\n.workspace-creation-form label small { margin-inline-start: .2em; color: #786861; }\n.workspace-creation-form :is(input, textarea) {\n  border-color: #d3c3b3;\n  background: #fdfaf5;\n  color: #3c282b;\n}\n.workspace-creation-form :is(input, textarea):hover { border-color: #b7a18c; }\n.workspace-creation-form :is(input, textarea)::placeholder { color: #88796e; }\n.workspace-creation-form textarea { min-height: 102px; line-height: 1.65; }\n.workspace-creation-footer { padding-top: 17px; }\n.workspace-creation-footer .button-primary {\n  padding-inline: 20px;\n  color: #fff8ef;\n  background: linear-gradient(125deg, #682d41, #4b2132);\n  border-color: #522438;\n}\n.workspace-creation-footer .button-primary:hover { background: #682e43; }\n.workspace-creation-footer .text-action { color: #705d54; font-weight: 560; }\n\n.draft-preview {\n  min-width: 0;\n  border: 1px solid #d9cbb9;\n  border-radius: 9px;\n  background: #f5eee3;\n  box-shadow: 0 8px 26px #53352408;\n}\n.draft-preview-heading { display: flex; min-height: 55px; align-items: center; justify-content: space-between; padding: 11px 19px; gap: 10px; }\n.draft-preview-heading h2 { color: #4b302f; font: 600 17px / 1.45 var(--display); letter-spacing: .055em; }\n.draft-preview-heading button {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  min-height: 40px;\n  padding-inline: 7px;\n  border: 0;\n  background: transparent;\n  color: var(--accent-hover);\n  font: 600 12px / 1.5 var(--body);\n}\n.draft-preview-heading button::after {\n  content: \"\";\n  width: 6px;\n  height: 6px;\n  margin-bottom: 3px;\n  border: solid currentColor;\n  border-width: 0 1px 1px 0;\n  transform: rotate(45deg);\n}\n.draft-preview-heading button[aria-expanded=\"true\"]::after { margin-block: 3px 0; transform: rotate(225deg); }\n.draft-preview-card { margin: 0 11px 11px; overflow: hidden; border: 1px solid #d7c9b8; border-radius: 4px; background: #fffcf5; }\n.draft-preview-cover { display: grid; align-content: end; min-height: clamp(151px, 14vw, 216px); padding: 22px; }\n.draft-preview-cover h3 {\n  display: -webkit-box;\n  overflow: hidden;\n  -webkit-line-clamp: 3;\n  -webkit-box-orient: vertical;\n  font: 600 clamp(22px, 2vw, 30px) / 1.35 var(--display);\n  letter-spacing: .035em;\n  text-shadow: 0 2px 12px #24141a9c;\n}\n.draft-preview-body { padding: 6px 18px 12px; }\n.draft-preview-body dl { display: grid; }\n.draft-preview-body dl > div {\n  display: grid;\n  grid-template-columns: 36px minmax(0, 1fr);\n  gap: 10px;\n  padding-block: 13px;\n  border-bottom: 1px solid #e6dbcc;\n  font-size: 13px;\n  line-height: 1.6;\n}\n.draft-preview-body dl > div:last-child { border-bottom: 0; }\n.draft-preview-body dt { color: #796a5f; }\n.draft-preview-body dd { color: #36282b; }\n.draft-preview-description {\n  display: -webkit-box;\n  overflow: hidden;\n  -webkit-line-clamp: 3;\n  -webkit-box-orient: vertical;\n  padding-top: 10px;\n  margin-bottom: 3px;\n  border-top: 1px solid #e6dbcc;\n  color: #665951;\n  font-size: 13px;\n  line-height: 1.65;\n  white-space: pre-line;\n}\n\n.workspace-overview .workspace-hero {\n  position: relative;\n  isolation: isolate;\n  display: block;\n  margin: 0;\n  border: 0;\n  border-radius: 9px 9px 0 0;\n  background: #34202a;\n}\n.workspace-overview .workspace-hero-photo {\n  position: absolute;\n  inset: 0;\n  z-index: -1;\n  background:\n    linear-gradient(90deg, #291822fa 2%, #34202bea 22%, #38232b8c 60%, #39232b18),\n    #4d342f url(\"./images/event-venue.webp\") center 52% / cover no-repeat;\n}\n.workspace-overview .workspace-hero-copy { position: relative; padding: clamp(25px, 3vw, 44px); }\n.workspace-overview .workspace-hero-copy::before { content: none; }\n.workspace-overview .workspace-hero time { color: #ead2ad; font-size: 12px; letter-spacing: .07em; }\n.workspace-overview .workspace-hero h1 { max-width: 19em; margin-top: 10px; color: #fff8ed; line-height: 1.25; letter-spacing: .04em; }\n.workspace-overview .workspace-hero p { margin-top: 15px; color: #f0e3d6; font-size: 13px; }\n.workspace-next-event {\n  display: grid;\n  width: fit-content;\n  max-width: min(100%, 48ch);\n  gap: 3px;\n  margin-top: 19px;\n  padding-inline-start: 13px;\n  border-inline-start: 2px solid #c7a77d;\n  color: #fff9ee;\n}\n.workspace-next-event small { color: #e4cba9; font-size: 11px; }\n.workspace-next-event strong { overflow-wrap: anywhere; font: 600 17px / 1.5 var(--display); }\n.workspace-next-event strong span { margin-inline-start: 4px; font-family: var(--body); font-size: .8em; }\n.workspace-next-event > span { color: #eee0d6; font-size: 12px; }\n.workspace-next-event:hover strong { text-decoration: underline; text-underline-offset: .23em; }\n.workspace-next-event:focus-visible { outline-color: var(--brass-light); }\n.workspace-overview .workspace-stats {\n  padding-block: 16px;\n  border-color: #ded0c2;\n  border-top: 0;\n  border-radius: 0 0 9px 9px;\n  box-shadow: 0 9px 26px #442f2307;\n}\n.workspace-overview .workspace-stat { gap: 5px; padding: 0 clamp(16px, 2.65vw, 42px); }\n.workspace-overview .workspace-stat dt { color: #746458; font-size: 12px; }\n.workspace-overview .workspace-stat dd { font-family: Georgia, var(--display); font-weight: 400; line-height: 1.05; }\n.workspace-ledger,\n.workspace-page[data-workspace-events] .workspace-section {\n  padding: 15px clamp(16px, 2vw, 28px) 6px;\n  border: 1px solid #e1d5c6;\n  border-radius: 8px;\n  background: #fffdf8;\n}\n.workspace-ledger > .section-heading { align-items: center; padding: 5px 0 14px; }\n.workspace-ledger .workspace-event-list, .workspace-ledger .workspace-empty,\n.workspace-page[data-workspace-events] :is(.workspace-event-list, .workspace-empty) { border-bottom: 0; }\n.workspace-ledger .workspace-event-row, .workspace-page[data-workspace-events] .workspace-event-row { padding-inline: 1px; }\n.workspace-ledger .workspace-event-date, .workspace-page[data-workspace-events] .workspace-event-date { background: #f8f1e7; }\n.workspace-ledger .workspace-empty { padding: 26px 2px 32px; }\n.workspace-page[data-workspace-events] .workspace-section { padding-top: 18px; }\n.workspace-content .workspace-account-grid:not(:has(.workspace-legacy)) { grid-template-columns: minmax(0, 760px); }\n\n@media (min-width: 1120px) {\n  .workspace-editor { grid-template-columns: minmax(0, 1fr) minmax(265px, 31%); }\n  .draft-preview { position: sticky; top: 25px; }\n  .draft-preview-heading button { display: none; }\n}\n@media (max-width: 1119px) {\n  .draft-preview:has([aria-expanded=\"false\"]) .draft-preview-card { display: none; }\n  .draft-preview-cover { min-height: 160px; }\n}\n@media (min-width: 1120px) and (max-width: 1339px) {\n  .workspace-creation-fields { grid-template-columns: minmax(0, 1fr) minmax(128px, .6fr); grid-template-areas: \"name template\" \"time time\" \"place capacity\"; }\n}\n@media (max-width: 800px) {\n  body[data-portal=\"organizer\"] { --workspace-padding: 20px; }\n}\n@media (max-width: 525px) {\n  body[data-portal=\"organizer\"] { --workspace-padding: 12px; }\n  .workspace-content { padding-top: 16px; }\n  .workspace-creation-form { gap: 17px; padding: 19px 15px 16px; }\n  .workspace-creation-form .workspace-heading { padding-bottom: 15px; }\n  .workspace-creation-form .workspace-heading h1 { font-size: 30px; }\n  .workspace-creation-fields { gap: 14px 10px; }\n  .workspace-creation-footer { padding-top: 12px; }\n  .draft-preview-heading { min-height: 48px; padding: 3px 13px; }\n  .workspace-overview .workspace-hero-copy { padding: 22px 17px; }\n  .workspace-overview .workspace-hero { min-height: 0; }\n  .workspace-overview .workspace-hero h1 { max-width: 100%; }\n  .workspace-overview .workspace-hero-photo { background-position: center, 67% 52%; }\n  .workspace-overview .workspace-stats { padding-block: 12px; }\n  .workspace-overview .workspace-stat { padding-inline: 10px; }\n  .workspace-overview .workspace-stat dt { font-size: 11px; }\n  .workspace-ledger, .workspace-page[data-workspace-events] .workspace-section { padding-inline: 11px; }\n}\n","group":"前端"},{"path":"src/test/java/cn/campus/events/CampusEventsIntegrationTest.java","text":"package cn.campus.events;\n\nimport com.fasterxml.jackson.databind.JsonNode;\nimport com.fasterxml.jackson.databind.ObjectMapper;\nimport java.net.URI;\nimport java.net.http.HttpClient;\nimport java.net.http.HttpRequest;\nimport java.net.http.HttpResponse;\nimport java.time.Duration;\nimport java.time.Instant;\nimport java.time.LocalDateTime;\nimport java.time.ZoneId;\nimport java.util.ArrayList;\nimport java.util.HashMap;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.Locale;\nimport java.util.Map;\nimport java.util.UUID;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.Future;\nimport java.util.concurrent.TimeUnit;\nimport org.junit.jupiter.api.Test;\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.context.SpringBootTest;\nimport org.springframework.boot.test.web.server.LocalServerPort;\nimport org.springframework.jdbc.core.JdbcTemplate;\n\nimport static org.assertj.core.api.Assertions.assertThat;\nimport static org.assertj.core.api.Assertions.assertThatThrownBy;\n\n@SpringBootTest(\n    classes = CampusEventsApplication.class,\n    webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT,\n    properties = {\n        \"CAMPUS_DB_URL=${CAMPUS_TEST_DB_URL:jdbc:h2:mem:campus_v4_integration;MODE=MySQL;DB_CLOSE_DELAY=-1}\",\n        \"CAMPUS_DB_USER=${CAMPUS_TEST_DB_USER:sa}\",\n        \"CAMPUS_DB_PASSWORD=${CAMPUS_TEST_DB_PASSWORD:}\",\n        \"CAMPUS_CHECK_IN_SECRET=test-only-stable-check-in-secret\",\n        \"CAMPUS_LEGACY_ORGANIZER_PASSWORD=legacy-integration-only-passphrase\",\n        \"CAMPUS_SEED_SAMPLE=false\"\n    }\n)\nclass CampusEventsIntegrationTest {\n    private static final String ORGANIZER_PASSWORD = \"organizer-test-passphrase\";\n    private static final String ACCOUNT_PASSWORD = \"account-only-passphrase\";\n    private final HttpClient client = HttpClient.newBuilder().version(HttpClient.Version.HTTP_1_1)\n        .connectTimeout(Duration.ofSeconds(5)).build();\n\n    @Autowired\n    private ObjectMapper mapper;\n\n    @Autowired\n    private JdbcTemplate database;\n\n    @LocalServerPort\n    private int port;\n\n    @Test\n    void organizerCanPublishDraftAndKeepRosterPrivate() throws Exception {\n        assertThat(send(\"GET\", \"/api/organizer/events\", null, null).statusCode()).isEqualTo(401);\n        String organizer = organizerCookie();\n        JsonNode draft = json(send(\"POST\", \"/api/organizer/events\", eventBody(\"私有活动\", 3), organizer), 201);\n        long id = draft.path(\"id\").asLong();\n        assertThat(draft.path(\"status\").asText()).isEqualTo(\"DRAFT\");\n        assertThat(draft.path(\"durationMinutes\").asInt()).isEqualTo(120);\n        assertThat(draft.path(\"checkInOpensBeforeMinutes\").asInt()).isEqualTo(15);\n        assertThat(draft.path(\"checkInClosesAfterMinutes\").asInt()).isEqualTo(30);\n        assertThat(send(\"GET\", event(id), null, null).statusCode()).isEqualTo(404);\n        assertThat(json(send(\"GET\", \"/api/events\", null, null), 200)).noneMatch(item -> item.path(\"id\").asLong() == id);\n        assertThat(json(send(\"POST\", manage(id) + \"/publish\", null, organizer), 200).path(\"status\").asText())\n            .isEqualTo(\"PUBLISHED\");\n        assertThat(send(\"GET\", manage(id) + \"/registrations\", null, null).statusCode()).isEqualTo(401);\n        assertThat(send(\"DELETE\", \"/api/organizer/session\", null, organizer).statusCode()).isEqualTo(204);\n        assertThat(send(\"GET\", \"/api/organizer/session\", null, organizer).statusCode()).isEqualTo(401);\n    }\n\n    @Test\n    void organizersCanRegisterAndSignInWithTheirOwnUsername() throws Exception {\n        String username = organizerUsername();\n        HttpResponse\u003cString> registration = send(\"POST\", \"/api/organizer/register\", organizerBody(username), null);\n        String session = cookie(registration, 201);\n        JsonNode identity = json(registration, 201);\n        assertThat(identity.path(\"name\").asText()).isEqualTo(\"测试组织者\");\n        assertThat(identity.path(\"username\").asText()).isEqualTo(username);\n        assertThat(identity.has(\"password\")).isFalse();\n        assertThat(json(send(\"GET\", \"/api/organizer/session\", null, session), 200).path(\"id\"))\n            .isEqualTo(identity.path(\"id\"));\n        assertThat(send(\"POST\", \"/api/organizer/register\", organizerBody(username.toUpperCase(Locale.ROOT)), null)\n            .statusCode()).isEqualTo(409);\n        assertThat(send(\"POST\", \"/api/organizer/login\", Map.of(\"username\", username, \"password\", \"incorrect-password\"), null)\n            .statusCode()).isEqualTo(401);\n        String fromAnotherDevice = cookie(send(\"POST\", \"/api/organizer/login\",\n            Map.of(\"username\", username.toUpperCase(Locale.ROOT), \"password\", ORGANIZER_PASSWORD), null), 200);\n        JsonNode secondSession = json(send(\"GET\", \"/api/organizer/session\", null, fromAnotherDevice), 200);\n        assertThat(secondSession.path(\"id\")).isEqualTo(identity.path(\"id\"));\n        assertThat(secondSession.path(\"tourPending\").booleanValue()).isTrue();\n        assertThat(send(\"POST\", \"/api/organizer/tour/start\", null, null).statusCode()).isEqualTo(401);\n        assertThat(json(send(\"POST\", \"/api/organizer/tour/start\", null, session), 200).path(\"started\").booleanValue()).isTrue();\n        assertThat(json(send(\"POST\", \"/api/organizer/tour/start\", null, fromAnotherDevice), 200).path(\"started\").booleanValue()).isFalse();\n        assertThat(json(send(\"GET\", \"/api/organizer/session\", null, fromAnotherDevice), 200).get(\"tourPending\").booleanValue()).isFalse();\n        assertThat(send(\"GET\", \"/api/account/session\", null, fromAnotherDevice).statusCode()).isEqualTo(401);\n    }\n\n    @Test\n    void privateActivityOperationsAreScopedToTheAccountThatCreatedTheEvent() throws Exception {\n        String owner = organizerCookie();\n        String other = organizerCookie();\n        long id = publish(owner, 2);\n        String participant = createAccount(newId());\n        long registrationId = signup(id, participant).path(\"id\").asLong();\n\n        assertThat(json(send(\"GET\", \"/api/organizer/events\", null, other), 200))\n            .noneMatch(event -> event.path(\"id\").asLong() == id);\n        assertThat(send(\"GET\", manage(id) + \"/registrations\", null, other).statusCode()).isEqualTo(404);\n        assertThat(send(\"POST\", manage(id) + \"/publish\", null, other).statusCode()).isEqualTo(404);\n        assertThat(send(\"POST\", manage(id) + \"/check-in-window\", null, other).statusCode()).isEqualTo(404);\n        assertThat(send(\"DELETE\", manage(id) + \"/check-in-window\", null, other).statusCode()).isEqualTo(404);\n        assertThat(send(\"POST\", manage(id) + \"/registrations/\" + registrationId + \"/check-in\", null, other)\n            .statusCode()).isEqualTo(404);\n        assertThat(send(\"GET\", manage(id) + \"/registrations\", null, participant).statusCode()).isEqualTo(401);\n        assertThat(status(id, participant)).isEqualTo(\"REGISTERED\");\n        assertThat(json(send(\"GET\", manage(id) + \"/registrations\", null, owner), 200)).hasSize(1);\n    }\n\n    @Test\n    void legacyEventsRemainPublicButRequireAProtectedClaimForManagement() throws Exception {\n        String owner = organizerCookie();\n        String other = organizerCookie();\n        String title = \"旧版样例 \" + UUID.randomUUID();\n        database.update(\"\"\"\n            INSERT INTO campus_event (title, description, starts_at, location, capacity, status)\n            VALUES (?, '', ?, '活动室', 10, 'PUBLISHED')\n            \"\"\", title, LocalDateTime.now(ZoneId.of(\"Asia/Shanghai\")).plusDays(3));\n        long id = database.queryForObject(\"SELECT id FROM campus_event WHERE title = ?\", Long.class, title);\n        assertThat(send(\"GET\", event(id), null, null).statusCode()).isEqualTo(200);\n        assertThat(send(\"GET\", manage(id) + \"/registrations\", null, owner).statusCode()).isEqualTo(404);\n        JsonNode legacy = json(send(\"GET\", \"/api/organizer/legacy\", null, owner), 200);\n        assertThat(legacy.path(\"enabled\").asBoolean()).isTrue();\n        assertThat(legacy.path(\"available\").asInt()).isPositive();\n        assertThat(send(\"POST\", \"/api/organizer/claim-legacy\", Map.of(\"password\", \"wrong-secret\"), owner)\n            .statusCode()).isEqualTo(401);\n        String legacyPassword = \"legacy-integration-only-passphrase\";\n        assertThat(json(send(\"POST\", \"/api/organizer/claim-legacy\", Map.of(\"password\", legacyPassword), owner), 200)\n            .path(\"claimed\").asInt()).isPositive();\n        assertThat(json(send(\"GET\", \"/api/organizer/events\", null, owner), 200))\n            .anyMatch(event -> event.path(\"id\").asLong() == id);\n        assertThat(send(\"GET\", manage(id) + \"/registrations\", null, other).statusCode()).isEqualTo(404);\n        assertThat(json(send(\"POST\", \"/api/organizer/claim-legacy\", Map.of(\"password\", legacyPassword), other), 200)\n            .path(\"claimed\").asInt()).isZero();\n    }\n\n    @Test\n    void accountRegistrationBindsToSignedInIdentityAndWorksOnAnotherDevice() throws Exception {\n        String organizer = organizerCookie();\n        long id = publish(organizer, 2);\n        assertThat(send(\"POST\", event(id) + \"/registrations\", null, null).statusCode()).isEqualTo(401);\n        String identifier = newId();\n        String participant = createAccount(identifier);\n        assertThat(json(send(\"GET\", \"/api/account/session\", null, participant), 200).path(\"tourPending\").asBoolean()).isTrue();\n        assertThat(send(\"POST\", \"/api/account/tour/start\", null, organizer).statusCode()).isEqualTo(401);\n        assertThat(json(send(\"POST\", \"/api/account/tour/start\", null, participant), 200).path(\"started\").asBoolean()).isTrue();\n        assertThat(send(\"POST\", \"/api/account/register\", accountBody(identifier), null).statusCode()).isEqualTo(409);\n        assertThat(send(\"POST\", \"/api/account/login\", Map.of(\"identifier\", identifier, \"password\", \"different-pass\"), null)\n            .statusCode()).isEqualTo(401);\n        JsonNode first = json(send(\"POST\", event(id) + \"/registrations\",\n            Map.of(\"name\", \"冒名\", \"identifier\", \"NOT-MY-ID\"), participant), 201);\n        assertThat(first.path(\"name\").asText()).isEqualTo(\"测试参与者\");\n        assertThat(first.path(\"status\").asText()).isEqualTo(\"REGISTERED\");\n\n        String freshLogin = cookie(send(\"POST\", \"/api/account/login\", loginBody(identifier), null), 200);\n        assertThat(json(send(\"POST\", \"/api/account/tour/start\", null, freshLogin), 200).path(\"started\").asBoolean()).isFalse();\n        assertThat(json(send(\"GET\", \"/api/account/session\", null, freshLogin), 200).path(\"identifier\").asText())\n            .isEqualToIgnoringCase(identifier);\n        assertThat(status(id, freshLogin)).isEqualTo(\"REGISTERED\");\n        JsonNode mine = json(send(\"GET\", \"/api/account/registrations\", null, freshLogin), 200);\n        assertThat(mine).anyMatch(record -> record.path(\"event\").path(\"id\").asLong() == id);\n        String stranger = createAccount(newId());\n        assertThat(send(\"DELETE\", event(id) + \"/registration\", null, stranger).statusCode()).isEqualTo(404);\n        assertThat(send(\"DELETE\", event(id) + \"/registration\", null, freshLogin).statusCode()).isEqualTo(204);\n        assertThat(status(id, freshLogin)).isEqualTo(\"CANCELLED\");\n        assertCapacity(id, 0, 2);\n\n        assertThat(send(\"DELETE\", \"/api/account/session\", null, freshLogin).statusCode()).isEqualTo(204);\n        assertThat(send(\"GET\", \"/api/account/session\", null, freshLogin).statusCode()).isEqualTo(401);\n    }\n\n    @Test\n    void checkInRequiresRegistrationAndTheCurrentEventCode() throws Exception {\n        String organizer = organizerCookie();\n        long id = publish(organizer, 4);\n        long secondEvent = publish(organizer, 4);\n        String attendee = createAccount(newId());\n        String cancelled = createAccount(newId());\n        String stranger = createAccount(newId());\n        signup(id, attendee);\n        signup(id, cancelled);\n        signup(secondEvent, attendee);\n        assertThat(send(\"DELETE\", event(id) + \"/registration\", null, cancelled).statusCode()).isEqualTo(204);\n        assertThat(send(\"POST\", manage(id) + \"/check-in-window\", null, null).statusCode()).isEqualTo(401);\n\n        String firstCode = openWindow(id, organizer);\n        String code = openWindow(id, organizer);\n        String secondCode = openWindow(secondEvent, organizer);\n        assertThat(List.of(firstCode, code, secondCode)).doesNotHaveDuplicates();\n        assertThat(scan(id, code, null).statusCode()).isEqualTo(401);\n        assertRejectedScan(id, firstCode, attendee);\n        assertRejectedScan(id, secondCode, attendee);\n        assertRejectedScan(id, code, cancelled);\n        assertRejectedScan(id, code, stranger);\n        assertThat(status(id, attendee)).isEqualTo(\"REGISTERED\");\n\n        assertThat(json(scan(id, code, attendee), 200).path(\"status\").asText()).isEqualTo(\"CHECKED_IN\");\n        assertThat(json(scan(id, code, attendee), 200).path(\"status\").asText()).isEqualTo(\"CHECKED_IN\");\n        assertThat(send(\"DELETE\", event(id) + \"/registration\", null, attendee).statusCode()).isEqualTo(409);\n        assertThat(json(send(\"GET\", manage(id) + \"/registrations\", null, organizer), 200))\n            .anyMatch(item -> item.path(\"status\").asText().equals(\"CHECKED_IN\"));\n\n        String next = createAccount(newId());\n        signup(id, next);\n        assertThat(send(\"DELETE\", manage(id) + \"/check-in-window\", null, organizer).statusCode()).isEqualTo(204);\n        assertRejectedScan(id, code, next);\n        assertThat(status(id, next)).isEqualTo(\"REGISTERED\");\n    }\n\n    @Test\n    void organizerCanCheckInRegisteredAttendeeManually() throws Exception {\n        String organizer = organizerCookie();\n        long id = publish(organizer, 1);\n        String participant = createAccount(newId());\n        long registration = signup(id, participant).path(\"id\").asLong();\n        String path = manage(id) + \"/registrations/\" + registration + \"/check-in\";\n        assertThat(send(\"POST\", path, null, participant).statusCode()).isEqualTo(401);\n        assertThat(json(send(\"POST\", path, null, organizer), 200).path(\"status\").asText()).isEqualTo(\"CHECKED_IN\");\n        assertThat(status(id, participant)).isEqualTo(\"CHECKED_IN\");\n        assertCapacity(id, 1, 0);\n    }\n\n    @Test\n    void eventSchedulesUseCampusTimeAndValidateTheConfiguredMinutes() throws Exception {\n        String owner = organizerCookie();\n        var body = new HashMap\u003c>(eventBody(\"跨日活动\", 5));\n        body.put(\"startsAt\", \"2030-12-31T23:50\");\n        body.put(\"durationMinutes\", 90);\n        body.put(\"checkInOpensBeforeMinutes\", 25);\n        body.put(\"checkInClosesAfterMinutes\", 45);\n        JsonNode draft = json(send(\"POST\", \"/api/organizer/events\", body, owner), 201);\n        assertThat(draft.path(\"startsAtInstant\").asText()).isEqualTo(\"2030-12-31T15:50:00Z\");\n        assertThat(draft.path(\"endsAt\").asText()).isEqualTo(\"2030-12-31T17:20:00Z\");\n        assertThat(draft.path(\"checkInOpensAt\").asText()).isEqualTo(\"2030-12-31T15:25:00Z\");\n        assertThat(draft.path(\"checkInClosesAt\").asText()).isEqualTo(\"2030-12-31T16:35:00Z\");\n        EventSchedule schedule = new EventSchedule(90, 25, 45, Instant.parse(draft.path(\"startsAtInstant\").asText()));\n        assertThatThrownBy(() -> schedule.requireOpen(schedule.checkInOpensAt().minusNanos(1))).isInstanceOf(ApiException.class);\n        schedule.requireOpen(schedule.checkInOpensAt());\n        schedule.requireOpen(schedule.checkInClosesAt().minusNanos(1));\n        assertThatThrownBy(() -> schedule.requireOpen(schedule.checkInClosesAt())).isInstanceOf(ApiException.class);\n\n        for (var invalid : List.of(Map.entry(\"durationMinutes\", 0), Map.entry(\"durationMinutes\", 1441),\n                Map.entry(\"checkInOpensBeforeMinutes\", -1), Map.entry(\"checkInOpensBeforeMinutes\", 1441),\n                Map.entry(\"checkInClosesAfterMinutes\", 0), Map.entry(\"checkInClosesAfterMinutes\", 91),\n                Map.entry(\"durationMinutes\", 90.5))) {\n            var rejected = new HashMap\u003c>(body);\n            rejected.put(invalid.getKey(), invalid.getValue());\n            assertThat(send(\"POST\", \"/api/organizer/events\", rejected, owner).statusCode()).isEqualTo(400);\n        }\n        body.put(\"durationMinutes\", 10);\n        body.remove(\"checkInClosesAfterMinutes\");\n        JsonNode shortEvent = json(send(\"POST\", \"/api/organizer/events\", body, owner), 201);\n        assertThat(shortEvent.path(\"checkInClosesAfterMinutes\").asInt()).isEqualTo(10);\n    }\n\n    @Test\n    void scheduleLimitsCodeIssuanceAttendanceAndRegistrationAtTheirRespectiveDeadlines() throws Exception {\n        String owner = organizerCookie();\n        LocalDateTime now = LocalDateTime.now(EventSchedule.CAMPUS_ZONE).withNano(0);\n        var body = new HashMap\u003c>(eventBody(\"现场签到时段\", 8));\n        body.put(\"startsAt\", now.minusSeconds(10).toString());\n        body.put(\"durationMinutes\", 60);\n        body.put(\"checkInOpensBeforeMinutes\", 0);\n        body.put(\"checkInClosesAfterMinutes\", 1);\n        long id = json(send(\"POST\", \"/api/organizer/events\", body, owner), 201).path(\"id\").asLong();\n        JsonNode published = json(send(\"POST\", manage(id) + \"/publish\", null, owner), 200);\n        String registered = createAccount(newId());\n        String cancelled = createAccount(newId());\n        long registrationId = signup(id, registered).path(\"id\").asLong();\n        signup(id, cancelled);\n        assertThat(send(\"DELETE\", event(id) + \"/registration\", null, cancelled).statusCode()).isEqualTo(204);\n        JsonNode window = json(send(\"POST\", manage(id) + \"/check-in-window\", null, owner), 200);\n        assertThat(window.path(\"expiresAt\")).isEqualTo(published.path(\"checkInClosesAt\"));\n        String code = window.path(\"code\").asText();\n        database.update(\"UPDATE campus_event SET starts_at = ? WHERE id = ?\", now.plusDays(1), id);\n        assertThat(json(send(\"POST\", manage(id) + \"/check-in-window\", null, owner), 409).path(\"message\").asText())\n            .contains(\"未到\");\n        assertThat(json(scan(id, code, registered), 409).path(\"message\").asText()).contains(\"未到\");\n        database.update(\"UPDATE campus_event SET starts_at = ? WHERE id = ?\", now.minusMinutes(2), id);\n        assertThat(json(send(\"POST\", manage(id) + \"/check-in-window\", null, owner), 409).path(\"message\").asText())\n            .contains(\"时段已结束\");\n        assertThat(json(scan(id, code, registered), 409).path(\"message\").asText()).contains(\"时段已结束\");\n        signup(id, createAccount(newId()));\n        database.update(\"UPDATE campus_event SET starts_at = ? WHERE id = ?\", now.minusDays(1), id);\n        for (String account : List.of(cancelled, createAccount(newId()))) {\n            assertThat(json(send(\"POST\", event(id) + \"/registrations\", null, account), 409).path(\"message\").asText())\n                .contains(\"活动已结束\");\n        }\n        assertThat(status(id, cancelled)).isEqualTo(\"CANCELLED\");\n        assertThat(json(send(\"POST\", manage(id) + \"/registrations/\" + registrationId + \"/check-in\", null, owner), 200)\n            .path(\"status\").asText()).isEqualTo(\"CHECKED_IN\");\n    }\n\n    @Test\n    void assigningOrChangingAScheduleRevokesCodesButKeepsRegistrationsAndLeases() throws Exception {\n        String owner = organizerCookie();\n        long ownerId = json(send(\"GET\", \"/api/organizer/session\", null, owner), 200).path(\"id\").asLong();\n        String title = \"原有活动 \" + UUID.randomUUID();\n        database.update(\"\"\"\n            INSERT INTO campus_event (title, description, starts_at, location, capacity, status)\n            VALUES (?, '', ?, '多功能厅', 10, 'PUBLISHED')\n            \"\"\", title, LocalDateTime.now(EventSchedule.CAMPUS_ZONE).withNano(0).minusMinutes(10));\n        long id = database.queryForObject(\"SELECT id FROM campus_event WHERE title = ?\", Long.class, title);\n        database.update(\"INSERT INTO event_organizer (event_id, organizer_id) VALUES (?, ?)\", id, ownerId);\n        assertThat(json(send(\"GET\", event(id), null, null), 200).has(\"durationMinutes\")).isFalse();\n        String a = createAccount(newId());\n        String b = createAccount(newId());\n        signup(id, a);\n        signup(id, b);\n        String old = openWindow(id, owner);\n        json(scan(id, old, a), 200);\n        String wrong = String.format(Locale.ROOT, \"%06d\", (Integer.parseInt(old) + 1) % 1_000_000);\n        assertThat(scan(id, wrong, b).statusCode()).isEqualTo(409);\n        String path = manage(id) + \"/schedule\";\n        var change = Map.of(\"durationMinutes\", 75, \"checkInOpensBeforeMinutes\", 10, \"checkInClosesAfterMinutes\", 25);\n        assertThat(send(\"PATCH\", path, change, b).statusCode()).isEqualTo(401);\n        assertThat(send(\"PATCH\", path, change, organizerCookie()).statusCode()).isEqualTo(404);\n        assertThat(send(\"PATCH\", path, Map.of(), owner).statusCode()).isEqualTo(400);\n        String digest = database.queryForObject(\"SELECT code_digest FROM event_check_in_window WHERE event_id = ?\", String.class, id);\n        JsonNode revised = json(send(\"PATCH\", path, change, owner), 200);\n        assertThat(json(send(\"GET\", event(id), null, null), 200)).isEqualTo(revised);\n        assertThat(revised.path(\"durationMinutes\").asInt()).isEqualTo(75);\n        assertThat(status(id, a)).isEqualTo(\"CHECKED_IN\");\n        assertThat(json(scan(id, old, b), 409).path(\"message\").asText()).contains(\"关闭\");\n        assertThat(database.queryForObject(\"SELECT COUNT(*) FROM event_check_in_attempt WHERE event_id = ?\", Integer.class, id)).isZero();\n        assertThat(database.queryForObject(\"SELECT COUNT(*) FROM event_check_in_code_lease WHERE code_digest = ?\", Integer.class, digest)).isOne();\n        String current = openWindow(id, owner);\n        assertThat(current).isNotEqualTo(old);\n        json(send(\"PATCH\", path, change, owner), 200);\n        assertThat(send(\"PATCH\", path, Map.of(\"durationMinutes\", 5), owner).statusCode()).isEqualTo(400);\n        json(scan(id, current, b), 200);\n        json(send(\"PATCH\", path, Map.of(\"durationMinutes\", 90), owner), 200);\n        assertThat(scan(id, current, b).statusCode()).isEqualTo(409);\n        assertCapacity(id, 2, 8);\n    }\n\n    @Test\n    void expiredCodeDoesNotConfirmAttendance() throws Exception {\n        String organizer = organizerCookie();\n        long id = publish(organizer, 2);\n        String participant = createAccount(newId());\n        signup(id, participant);\n        String code = openWindow(id, organizer);\n        database.update(\"UPDATE event_check_in_window SET expires_at_ms = ? WHERE event_id = ?\",\n            Instant.now().minusSeconds(1).toEpochMilli(), id);\n        assertThat(scan(id, code, participant).statusCode()).isEqualTo(409);\n        assertThat(status(id, participant)).isEqualTo(\"REGISTERED\");\n    }\n\n    @Test\n    void incorrectNumericAttemptsExpireWithTheCurrentCode() throws Exception {\n        String organizer = organizerCookie();\n        long id = publish(organizer, 3);\n        String participant = createAccount(newId());\n        String secondParticipant = createAccount(newId());\n        signup(id, participant);\n        signup(id, secondParticipant);\n        String code = openWindow(id, organizer);\n        String wrong = String.format(Locale.ROOT, \"%06d\", (Integer.parseInt(code) + 1) % 1_000_000);\n\n        assertThat(scan(id, \"12A456\", participant).statusCode()).isEqualTo(400);\n        for (int i = 0; i \u003c 5; i++) assertThat(scan(id, wrong, participant).statusCode()).isEqualTo(409);\n        assertThat(scan(id, code, participant).statusCode()).isEqualTo(429);\n        assertThat(status(id, participant)).isEqualTo(\"REGISTERED\");\n        assertThat(json(scan(id, code, secondParticipant), 200).path(\"status\").asText()).isEqualTo(\"CHECKED_IN\");\n\n        String next = openWindow(id, organizer);\n        assertThat(next).isNotEqualTo(code);\n        assertThat(json(scan(id, next, participant), 200).path(\"status\").asText()).isEqualTo(\"CHECKED_IN\");\n    }\n\n    @Test\n    void competingSignedInAccountsCannotOverbook() throws Exception {\n        String organizer = organizerCookie();\n        long id = publish(organizer, 8);\n        List\u003cString> sessions = new ArrayList\u003c>();\n        for (int i = 0; i \u003c 24; i++) sessions.add(createAccount(newId()));\n        List\u003cInteger> results = compete(id, sessions);\n        assertThat(results).containsOnly(201, 409);\n        assertThat(results.stream().filter(value -> value == 201).count()).isEqualTo(8);\n        assertCapacity(id, 8, 0);\n        var unique = new HashSet\u003cString>();\n        JsonNode roster = json(send(\"GET\", manage(id) + \"/registrations\", null, organizer), 200);\n        for (JsonNode row : roster) unique.add(row.path(\"identifier\").asText());\n        assertThat(unique).hasSize(8);\n    }\n\n    @Test\n    void competingRequestsFromOneAccountConsumeOneSeat() throws Exception {\n        long id = publish(organizerCookie(), 8);\n        List\u003cInteger> results = compete(id, java.util.Collections.nCopies(12, createAccount(newId())));\n        assertThat(results).containsOnly(201, 409);\n        assertThat(results.stream().filter(value -> value == 201).count()).isEqualTo(1);\n        assertCapacity(id, 1, 7);\n    }\n\n    private List\u003cInteger> compete(long id, List\u003cString> sessions) throws Exception {\n        var workers = Executors.newFixedThreadPool(sessions.size());\n        var start = new CountDownLatch(1);\n        var ready = new CountDownLatch(sessions.size());\n        try {\n            List\u003cFuture\u003cInteger>> results = new ArrayList\u003c>();\n            for (String session : sessions) {\n                results.add(workers.submit(() -> {\n                    ready.countDown();\n                    if (!start.await(10, TimeUnit.SECONDS)) throw new IllegalStateException(\"Concurrent test did not start\");\n                    return send(\"POST\", event(id) + \"/registrations\", null, session).statusCode();\n                }));\n            }\n            assertThat(ready.await(10, TimeUnit.SECONDS)).isTrue();\n            start.countDown();\n            List\u003cInteger> statuses = new ArrayList\u003c>();\n            for (Future\u003cInteger> result : results) statuses.add(result.get(20, TimeUnit.SECONDS));\n            return statuses;\n        } finally {\n            start.countDown();\n            workers.shutdownNow();\n        }\n    }\n\n    private void assertCapacity(long id, int confirmed, int remaining) throws Exception {\n        JsonNode item = json(send(\"GET\", event(id), null, null), 200);\n        assertThat(item.path(\"confirmed\").asInt()).isEqualTo(confirmed);\n        assertThat(item.path(\"remaining\").asInt()).isEqualTo(remaining);\n        assertThat(item.has(\"registrations\")).isFalse();\n    }\n\n    private void assertRejectedScan(long id, String code, String account) throws Exception {\n        assertThat(scan(id, code, account).statusCode()).isIn(400, 403, 404, 409, 410);\n    }\n\n    private HttpResponse\u003cString> scan(long id, String code, String account) throws Exception {\n        return send(\"POST\", event(id) + \"/self-check-in\", Map.of(\"code\", code), account);\n    }\n\n    private String openWindow(long id, String organizer) throws Exception {\n        JsonNode window = json(send(\"POST\", manage(id) + \"/check-in-window\", null, organizer), 200);\n        assertThat(window.path(\"eventId\").asLong()).isEqualTo(id);\n        assertThat(Instant.parse(window.path(\"expiresAt\").asText())).isAfter(Instant.now());\n        assertThat(window.path(\"code\").asText()).matches(\"[0-9]{6}\");\n        return window.path(\"code\").asText();\n    }\n\n    private String status(long id, String account) throws Exception {\n        return json(send(\"GET\", event(id) + \"/registration\", null, account), 200).path(\"status\").asText();\n    }\n\n    private JsonNode signup(long id, String account) throws Exception {\n        return json(send(\"POST\", event(id) + \"/registrations\", null, account), 201);\n    }\n\n    private String createAccount(String identifier) throws Exception {\n        return cookie(send(\"POST\", \"/api/account/register\", accountBody(identifier), null), 201);\n    }\n\n    private String organizerCookie() throws Exception {\n        return cookie(send(\"POST\", \"/api/organizer/register\", organizerBody(organizerUsername()), null), 201);\n    }\n\n    private static String organizerUsername() {\n        return \"org-\" + UUID.randomUUID().toString().substring(0, 14);\n    }\n\n    private static Map\u003cString, String> organizerBody(String username) {\n        return Map.of(\"name\", \"测试组织者\", \"username\", username, \"password\", ORGANIZER_PASSWORD);\n    }\n\n    private long publish(String organizer, int capacity) throws Exception {\n        long id = json(send(\"POST\", \"/api/organizer/events\", eventBody(\"测试活动\", capacity), organizer), 201)\n            .path(\"id\").asLong();\n        json(send(\"POST\", manage(id) + \"/publish\", null, organizer), 200);\n        return id;\n    }\n\n    private Map\u003cString, Object> eventBody(String title, int capacity) {\n        return Map.of(\n            \"title\", title, \"description\", \"HTTP integration test fixture\",\n            \"startsAt\", LocalDateTime.now(ZoneId.of(\"Asia/Shanghai\")).plusMinutes(2).withNano(0).toString(),\n            \"location\", \"活动室\", \"capacity\", capacity\n        );\n    }\n\n    private Map\u003cString, String> accountBody(String identifier) {\n        return Map.of(\"name\", \"测试参与者\", \"identifier\", identifier, \"password\", ACCOUNT_PASSWORD);\n    }\n\n    private Map\u003cString, String> loginBody(String identifier) {\n        return Map.of(\"identifier\", identifier, \"password\", ACCOUNT_PASSWORD);\n    }\n\n    private static String newId() {\n        return \"QA-\" + UUID.randomUUID().toString().substring(0, 14);\n    }\n\n    private static String event(long id) { return \"/api/events/\" + id; }\n    private static String manage(long id) { return \"/api/organizer/events/\" + id; }\n\n    private String cookie(HttpResponse\u003cString> response, int status) {\n        assertThat(response.statusCode()).as(\"HTTP response %s\", response.body()).isEqualTo(status);\n        String raw = response.headers().firstValue(\"Set-Cookie\").orElseThrow();\n        assertThat(raw.toLowerCase(Locale.ROOT)).contains(\"httponly\", \"samesite=strict\");\n        return raw.split(\";\", 2)[0];\n    }\n\n    private JsonNode json(HttpResponse\u003cString> response, int status) throws Exception {\n        assertThat(response.statusCode()).as(\"HTTP response %s\", response.body()).isEqualTo(status);\n        return mapper.readTree(response.body());\n    }\n\n    private HttpResponse\u003cString> send(String method, String path, Object body, String cookie) throws Exception {\n        HttpRequest.Builder request = HttpRequest.newBuilder(URI.create(\"http://127.0.0.1:\" + port + path))\n            .timeout(Duration.ofSeconds(25)).header(\"Accept\", \"application/json\");\n        if (cookie != null) request.header(\"Cookie\", cookie);\n        if (body == null) {\n            request.method(method, HttpRequest.BodyPublishers.noBody());\n        } else {\n            request.header(\"Content-Type\", \"application/json\")\n                .method(method, HttpRequest.BodyPublishers.ofString(mapper.writeValueAsString(body)));\n        }\n        return client.send(request.build(), HttpResponse.BodyHandlers.ofString());\n    }\n}\n","group":"验收测试"},{"path":"start-review.cmd","text":"@echo off\nsetlocal\nchcp 65001 >nul\ncd /d \"%~dp0\"\nwhere java >nul 2>&1\nif errorlevel 1 (\n    echo Java 17 or newer is required.\n    pause\n    exit /b 1\n)\nif not exist \"release\\campus-events.jar\" (\n    echo release\\campus-events.jar was not found.\n    pause\n    exit /b 1\n)\nif not defined SERVER_PORT set \"SERVER_PORT=8768\"\nif not defined CAMPUS_SEED_SAMPLE set \"CAMPUS_SEED_SAMPLE=true\"\nset \"CAMPUS_SERVER_ADDRESS=127.0.0.1\"\necho.\npowershell.exe -NoProfile -Command \"$base = 'http://127.0.0.1:' + $env:SERVER_PORT; Write-Output ('Participant: ' + $base + '/'); Write-Output ('Organizer workspace: ' + $base + '/organizer.html')\"\necho Use Ctrl+C to stop the application.\necho.\njava -jar \"release\\campus-events.jar\"\nif errorlevel 1 pause\n","group":"配置与启动"},{"path":"verify-browser.py","text":"import contextlib\nimport io\nimport json\nimport os\nimport re\nimport secrets\nimport subprocess\nimport time\nfrom datetime import datetime, timedelta, timezone\nfrom pathlib import Path\nfrom tempfile import mkdtemp\nfrom urllib.request import urlopen\n\nimport cv2\nimport numpy as np\nfrom PIL import Image\nfrom playwright.sync_api import expect, sync_playwright\n\n\nPROJECT = Path(__file__).resolve().parent\nPORT = 8770\nBASE = f\"http://127.0.0.1:{PORT}\"\nEDGE = r\"C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\"\nRUNTIME = PROJECT / \"runtime\"\nRUNTIME.mkdir(exist_ok=True)\nINSTANCE = Path(mkdtemp(dir=RUNTIME, prefix=\"browser-v12-\"))\nLEGACY_PASSWORD = secrets.token_urlsafe(18)\nORGANIZER_PASSWORD = secrets.token_urlsafe(16)\nORGANIZER_USERNAME = \"review-publisher\"\nPARTICIPANT_PASSWORD = secrets.token_urlsafe(14)\nENV = os.environ | {\n    \"CAMPUS_DB_URL\": \"jdbc:h2:file:./data/campus-events;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0\",\n    \"CAMPUS_DB_USER\": \"sa\",\n    \"CAMPUS_DB_PASSWORD\": \"\",\n    \"CAMPUS_CHECK_IN_SECRET\": secrets.token_urlsafe(32),\n    \"CAMPUS_LEGACY_ORGANIZER_PASSWORD\": LEGACY_PASSWORD,\n    \"CAMPUS_SEED_SAMPLE\": \"true\",\n    \"CAMPUS_SERVER_ADDRESS\": \"127.0.0.1\",\n    \"SERVER_PORT\": str(PORT),\n}\nJAR = PROJECT / \"target\" / \"campus-events-0.12.0.jar\"\n\n\n@contextlib.contextmanager\ndef server(stage):\n    with (INSTANCE / f\"{stage}.log\").open(\"wb\") as log:\n        process = subprocess.Popen(\n            [\"java\", \"-jar\", str(JAR)], cwd=INSTANCE, env=ENV,\n            stdout=log, stderr=subprocess.STDOUT, creationflags=subprocess.CREATE_NO_WINDOW,\n        )\n        try:\n            for _ in range(120):\n                if process.poll() is not None:\n                    raise RuntimeError(f\"Server stopped. Check {log.name}.\")\n                try:\n                    with urlopen(f\"{BASE}/api/events\", timeout=0.5) as response:\n                        assert response.status == 200\n                    break\n                except OSError:\n                    time.sleep(0.25)\n            else:\n                raise RuntimeError(f\"Server did not start. Check {log.name}.\")\n            yield\n        finally:\n            if process.poll() is None:\n                process.terminate()\n                process.wait(timeout=15)\n\n\ndef organizer_login(page):\n    page.goto(f\"{BASE}/organizer.html\")\n    form = page.locator(\"#organizer-login-form\")\n    form.locator('[name=\"username\"]').fill(ORGANIZER_USERNAME)\n    form.locator('[name=\"password\"]').fill(ORGANIZER_PASSWORD)\n    form.locator('[type=\"submit\"]').click()\n    expect(page.locator(\".workspace-nav\")).to_be_visible()\n\n\ndef organizer_register(page, username, name):\n    page.goto(f\"{BASE}/organizer.html#organizer/register\")\n    form = page.locator(\"#organizer-register-form\")\n    form.locator('[name=\"name\"]').fill(name)\n    form.locator('[name=\"username\"]').fill(username)\n    form.locator('[name=\"password\"]').fill(ORGANIZER_PASSWORD)\n    confirmation = form.locator('[name=\"confirmPassword\"]')\n    if confirmation.count():\n        confirmation.fill(ORGANIZER_PASSWORD)\n    form.locator('[type=\"submit\"]').click()\n    expect(page.locator(\".workspace-nav\")).to_be_visible()\n    expect(page.locator(\".workspace-identity\")).to_contain_text(name)\n\n\ndef participant_login(page, identifier):\n    form = page.locator(\"#account-login-form\")\n    form.locator('[name=\"identifier\"]').fill(identifier)\n    form.locator('[name=\"password\"]').fill(PARTICIPANT_PASSWORD)\n    form.locator('[type=\"submit\"]').click()\n\n\ndef create_participant(page, event_id, name, identifier):\n    page.goto(f\"{BASE}/#event/{event_id}\")\n    page.locator(\".registration-panel\").get_by_role(\"link\", name=\"注册账号\").click()\n    signup = page.locator(\"#account-register-form\")\n    signup.locator('[name=\"name\"]').fill(name)\n    signup.locator('[name=\"identifier\"]').fill(identifier)\n    signup.locator('[name=\"password\"]').fill(PARTICIPANT_PASSWORD)\n    signup.locator('[type=\"submit\"]').click()\n    expect(page).to_have_url(f\"{BASE}/#event/{event_id}\")\n    expect(page.locator(\".registration-panel\")).to_contain_text(name)\n    tour = page.locator(\"#student-tour\")\n    expect(tour.get_by_role(\"heading\", name=\"找到活动并报名\")).to_be_visible()\n    for title in (\"到场后签到\", \"查看报名记录\"):\n        tour.get_by_role(\"button\", name=\"下一步\").click()\n        expect(tour.get_by_role(\"heading\", name=title)).to_be_visible()\n    tour.get_by_role(\"button\", name=\"完成指引\").click()\n    expect(page).to_have_url(f\"{BASE}/#event/{event_id}\")\n    page.locator(\"#registration-form [type='submit']\").click()\n    expect(page.locator('[data-action=\"cancel-registration\"]')).to_be_visible()\n\n\ndef checkin_status(page, event_id):\n    return page.request.get(f\"{BASE}/api/events/{event_id}/registration\").json()[\"status\"]\n\n\ndef assert_checkin_boundaries(page, action, event):\n    page.evaluate(\"window.realNow = Date.now\")\n    for stamp, offset, enabled in (\n        (event[\"checkInOpensAt\"], -1, False),\n        (event[\"checkInOpensAt\"], 0, True),\n        (event[\"checkInClosesAt\"], -1, True),\n        (event[\"checkInClosesAt\"], 0, False),\n    ):\n        page.evaluate(\"([stamp,offset]) => { Date.now = () => Date.parse(stamp) + offset }\", [stamp, offset])\n        if enabled:\n            expect(action).to_be_enabled()\n        else:\n            expect(action).to_be_disabled()\n    page.evaluate(\"Date.now = window.realNow\")\n    expect(action).to_be_enabled()\n\n\ndef decoded_qr(page):\n    qr = page.locator(\"[data-checkin-qr]\")\n    expect(qr).to_be_visible()\n    pixels = qr.screenshot(path=INSTANCE / \"checkin-qr.png\")\n    matrix = cv2.imdecode(np.frombuffer(pixels, np.uint8), cv2.IMREAD_GRAYSCALE)\n    detector = cv2.QRCodeDetector()\n    for size in (None, 440, 660):\n        scaled = matrix if size is None else cv2.resize(matrix, (size, size), interpolation=cv2.INTER_NEAREST)\n        url, _, _ = detector.detectAndDecode(scaled)\n        if url:\n            return url\n    raise AssertionError(\"Could not decode the displayed QR code\")\n\n\nwith sync_playwright() as playwright:\n    browser = playwright.chromium.launch(executable_path=EDGE, headless=True)\n    desktop = browser.new_page(viewport={\"width\": 1450, \"height\": 960}, reduced_motion=\"reduce\")\n    organizer = browser.new_page(viewport={\"width\": 1450, \"height\": 960}, accept_downloads=True, reduced_motion=\"reduce\")\n    phone = browser.new_page(viewport={\"width\": 390, \"height\": 844}, is_mobile=True, has_touch=True, reduced_motion=\"reduce\")\n    errors = []\n    for page in (desktop, organizer, phone):\n        page.on(\"pageerror\", lambda error: errors.append(str(error)))\n\n    with server(\"initial\"):\n        desktop.goto(f\"{BASE}/\")\n        expect(desktop.locator(\"main\")).to_contain_text(\"校园开发者分享会\")\n        expect(desktop.locator(\"html\")).to_have_css(\"background-color\", \"rgb(247, 242, 234)\")\n        expect(desktop.locator('meta[name=\"theme-color\"]')).to_have_attribute(\"content\", \"#4a1d29\")\n        expect(desktop.locator(\".hero-side\")).to_have_css(\"background-image\", re.compile(\"campus-gallery.webp\"))\n        expect(desktop.locator(\".featured [data-event-start-countdown]\")).to_contain_text(\"距活动开始\")\n        directory_search = desktop.locator(\"[data-event-search]\")\n        directory_search.fill(\"204\")\n        expect(desktop.locator(\"#event-list\")).to_contain_text(\"校园开发者分享会\")\n        directory_search.fill(\"无匹配项\")\n
