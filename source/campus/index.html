vent => {\n      if (!picker.contains(event.target)) close();\n    }, { capture: true, signal });\n    window.addEventListener('scroll', position, { passive: true, signal });\n    window.addEventListener('resize', position, { signal });\n    window.visualViewport?.addEventListener('resize', position, { signal });\n    window.visualViewport?.addEventListener('scroll', position, { passive: true, signal });\n    window.addEventListener('hashchange', close, { signal });\n  }\n\n  function choose(option) {\n    input.value = option.dataset.value;\n    input.dispatchEvent(new Event('change', { bubbles: true }));\n    const selected = options.find(item => item.dataset.value === input.value);\n    for (const item of options) item.setAttribute('aria-selected', String(item === selected));\n    trigger.querySelector('[data-template-value]').textContent = selected.firstElementChild.textContent;\n    close();\n    trigger.focus({ preventScroll: true });\n    input.form.dispatchEvent(new Event('creationpreviewchange'));\n  }\n\n  trigger.addEventListener('click', () => list.hidden ? open() : close());\n  trigger.addEventListener('blur', close);\n  // Keep DOM focus on the combobox while a pointer operates the active descendant.\n  list.addEventListener('mousedown', event => {\n    if (event.target.closest('[role=\"option\"]')) event.preventDefault();\n  });\n  list.addEventListener('click', event => {\n    const option = event.target.closest('[role=\"option\"]');\n    if (option) choose(option);\n  });\n  trigger.addEventListener('keydown', event => {\n    if (event.isComposing) return;\n    const { key } = event;\n    if (key === 'Escape' && !list.hidden) {\n      event.preventDefault();\n      event.stopPropagation();\n      close();\n      return;\n    }\n    if (key === 'Tab') {\n      if (!list.hidden && options[active].dataset.value !== input.value) choose(options[active]);\n      else close();\n      return;\n    }\n    if (key === 'Enter' || key === ' ') {\n      event.preventDefault();\n      if (list.hidden) open();\n      else choose(options[active]);\n      return;\n    }\n    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(key)) {\n      event.preventDefault();\n      open();\n      if (key === 'Home') highlight(0);\n      else if (key === 'End') highlight(options.length - 1);\n      else highlight(active + (key === 'ArrowDown' ? 1 : -1));\n    }\n  });\n}\n\nfunction bindScheduleFields(form) {\n  const group = form.querySelector('.schedule-fields');\n  const { durationMinutes: duration, checkInOpensBeforeMinutes: opens, checkInClosesAfterMinutes: closes, startsAt } = form.elements;\n  const error = group.querySelector('.schedule-error');\n  const summary = group.querySelector('[data-schedule-summary]');\n  let manualClose = group.dataset.customClose === 'true';\n  const ranges = { activity: '', checkIn: '' };\n\n  // datetime-local represents a campus wall-clock value even when the organizer travels.\n  const savedStart = group.dataset.scheduleStart;\n  const savedHasOffset = /(?:Z|[+-]\\d\\d:\\d\\d)$/i.test(savedStart);\n  const savedWallTime = savedHasOffset\n    ? Date.parse(savedStart) + 8 * 3600000 : Date.parse(savedStart + 'Z');\n\n  function range(start, end) {\n    const first = new Date(start).toISOString().slice(0, 16);\n    const last = new Date(end).toISOString().slice(0, 16);\n    const endLabel = first.slice(0, 10) === last.slice(0, 10) ? last.slice(11) : dateParts(last).full;\n    return `${dateParts(first).full} 至 ${endLabel}`;\n  }\n\n  function update(event) {\n    if (event && event.target !== startsAt && !group.contains(event.target)) return;\n    if (event?.target === closes) manualClose = true;\n    const minutes = duration.valueAsNumber;\n    const validDuration = duration.validity.valid;\n    closes.max = validDuration ? String(minutes) : '1440';\n    if (validDuration && !manualClose && event?.target === duration) closes.value = String(Math.min(30, minutes));\n    const message = validDuration && closes.valueAsNumber > minutes\n      ? `签到截止不能晚于活动结束，请填写 1 至 ${minutes} 分钟。` : '';\n    closes.setCustomValidity(message);\n    if (message) closes.setAttribute('aria-invalid', 'true');\n    else closes.removeAttribute('aria-invalid');\n    error.textContent = message;\n    const start = startsAt ? startsAt.valueAsNumber : savedWallTime;\n    ranges.activity = Number.isFinite(start) && validDuration ? range(start, start + minutes * 60000) : '';\n    ranges.checkIn = Number.isFinite(start) && validDuration && opens.validity.valid && closes.validity.valid\n      ? range(start - opens.valueAsNumber * 60000, start + closes.valueAsNumber * 60000) : '';\n    summary.textContent = [ranges.activity && '活动 ' + ranges.activity, ranges.checkIn && '签到 ' + ranges.checkIn]\n      .filter(Boolean).join('\\n');\n  }\n  form.addEventListener('input', update);\n  update();\n  return ranges;\n}\n\nfunction bindDraftPreview(form, ranges) {\n  const preview = form.parentElement.querySelector('.draft-preview');\n  const slots = [...preview.querySelectorAll('[data-preview]')];\n  const toggle = preview.querySelector('[data-toggle-preview]');\n  toggle.addEventListener('click', () => {\n    const open = toggle.getAttribute('aria-expanded') !== 'true';\n    toggle.setAttribute('aria-expanded', String(open));\n    toggle.textContent = open ? '收起预览' : '展开预览';\n  });\n  function update() {\n    for (const slot of slots) {\n      const name = slot.dataset.preview;\n      const input = form.elements.namedItem(name);\n      const value = input?.value.trim() || '';\n      let content = value;\n      if (name === 'description') {\n        slot.hidden = !value;\n      } else if (name === 'title') {\n        content = value || '未命名活动';\n      } else if (name === 'startsAt') {\n        content = ranges.activity || (value ? dateParts(value).full : '待填写');\n      } else if (name === 'checkInRange') {\n        content = ranges.checkIn || '待填写';\n      } else if (name === 'capacity') {\n        content = value && input.validity.valid ? `${value} 人` : '待填写';\n      } else {\n        content = value || '待填写';\n      }\n      if (slot.textContent !== content) slot.textContent = content;\n    }\n  }\n  form.addEventListener('input', update);\n  form.addEventListener('creationpreviewchange', update);\n  update();\n}\n\nfunction bindCreation(hash) {\n  const form = document.querySelector('#create-event-form');\n  const ranges = bindScheduleFields(form);\n  bindDraftPreview(form, ranges);\n  const templateValue = form.elements.namedItem('eventTemplate');\n  const templateStatus = form.querySelector('[data-template-status]');\n  const templateValues = new Map();\n  let appliedTemplate = '';\n  form.addEventListener('input', event => templateValues.delete(event.target.name));\n  templateValue.addEventListener('change', () => {\n    if (!templateValue.value) {\n      for (const [name, value] of templateValues) {\n        const input = form.elements.namedItem(name);\n        if (input.value === value) input.value = '';\n      }\n      templateValues.clear();\n      appliedTemplate = '';\n      templateStatus.textContent = '已切回手动填写。';\n      return;\n    }\n    const template = eventTemplates.find(item => item.id === templateValue.value);\n    const fields = Object.entries(template.fields);\n    let kept = 0;\n    for (const [name, value] of fields) {\n      const input = form.elements.namedItem(name);\n      if (input.value.trim() && input.value !== templateValues.get(name)) {\n        kept++;\n        continue;\n      }\n      input.value = value;\n      templateValues.set(name, value);\n    }\n    if (kept === fields.length) {\n      templateValue.value = appliedTemplate;\n      templateStatus.textContent = '已保留所有手填内容。清空需要替换的字段后可套用模板。';\n      return;\n    }\n    appliedTemplate = template.id;\n    templateStatus.textContent = `已套用「${template.label}」${kept ? '，已保留手填内容' : ''}。`;\n  });\n  bindTemplatePicker(templateValue);\n  onSubmit('#create-event-form', async form => {\n    const body = {\n      title: field(form, 'title'),\n      description: field(form, 'description'),\n      startsAt: field(form, 'startsAt'),\n      durationMinutes: Number(field(form, 'durationMinutes')),\n      checkInOpensBeforeMinutes: Number(field(form, 'checkInOpensBeforeMinutes')),\n      checkInClosesAfterMinutes: Number(field(form, 'checkInClosesAfterMinutes')),\n      location: field(form, 'location'),\n      capacity: Number(field(form, 'capacity')),\n    };\n    const result = await api('/organizer/events', { method: 'POST', body });\n    if (location.hash === hash) navigate(`#organizer/${pathId(result.id)}`, '草稿已保存，可以发布活动。');\n  });\n}\n\nfunction bindManagement(id, records) {\n  bindOrganizerSchedule(id);\n  const hash = `#organizer/${id}`;\n  const publish = document.querySelector('[data-action=\"publish-event\"]');\n  publish?.addEventListener('click', () => perform(publish, publish.closest('[data-event-actions]'), async () => {\n    await api(`/organizer/events/${id}/publish`, { method: 'POST' });\n    if (location.hash === hash) navigate(hash, '活动已发布，可以分享公开报名页。');\n  }));\n  const copy = document.querySelector('[data-action=\"copy-event-link\"]');\n  copy?.addEventListener('click', () => perform(copy, copy.closest('[data-event-actions]'), async () => {\n    const container = copy.closest('[data-event-actions]');\n    const url = siteLink(eventLink(id));\n    try {\n      await navigator.clipboard.writeText(url);\n      inlineFeedback(container, '报名链接已复制。', false);\n    } catch {\n      const fallback = container.querySelector('.share-fallback');\n      fallback.hidden = false;\n      const input = fallback.querySelector('[data-share-url]');\n      input.value = url;\n      input.select();\n      inlineFeedback(container, '报名链接已选中，可以复制。', false);\n    }\n  }));\n  const qr = document.querySelector('.qr-panel');\n  if (qr) bindQr(id, qr);\n\n  const roster = document.querySelector('.roster-panel');\n  if (!roster) return;\n  const search = roster.querySelector('[data-roster-search]');\n  const results = roster.querySelector('[data-roster-results]');\n  let registrations = records;\n  let refreshing = null;\n  const redrawResults = () => results.innerHTML = rosterResults(registrations, search.value);\n  const refresh = () => {\n    if (refreshing) return refreshing;\n    refreshing = api(`/organizer/events/${id}/registrations`).then(updated => {\n      if (!roster.isConnected || location.hash !== hash) return;\n      if (JSON.stringify(updated) === JSON.stringify(registrations)) return;\n      registrations = updated;\n      roster.querySelector('[data-roster-count]').textContent = `${registrations.length} 条记录`;\n      roster.querySelector('[data-roster-summary]').innerHTML = rosterSummary(registrations);\n      redrawResults();\n    }).finally(() => refreshing = null);\n    return refreshing;\n  };\n  search.addEventListener('input', redrawResults);\n  roster.addEventListener('click', event => {\n    const button = event.target.closest('button[data-action]');\n    if (!button) return;\n    perform(button, roster, async () => {\n      if (button.dataset.action === 'export-roster') {\n        await refresh();\n        if (roster.isConnected) exportRoster(id, registrations);\n      } else if (button.dataset.action === 'refresh-roster') {\n        await refresh();\n        if (roster.isConnected) inlineFeedback(roster, '名单已更新。', false);\n      } else if (button.dataset.action === 'check-in') {\n        await api(`/organizer/events/${id}/registrations/${pathId(button.dataset.id)}/check-in`, { method: 'POST' });\n        await refresh();\n        if (roster.isConnected) inlineFeedback(roster, '已补录到场。', false);\n      }\n    });\n  });\n  rosterPoll = setInterval(() => {\n    if (document.visibilityState === 'visible') refresh().catch(() => {});\n  }, 6000);\n}\n\nfunction bindQr(id, qr) {\n  const open = qr.querySelector('[data-action=\"open-check-in\"]');\n  const close = qr.querySelector('[data-action=\"close-check-in\"]');\n  const update = (button, publish) => perform(button, qr, async () => {\n    open.disabled = true;\n    close.disabled = true;\n    try {\n      const state = await api(`/organizer/events/${id}/check-in-window`, { method: publish ? 'POST' : 'DELETE' });\n      if (publish) activeWindows.set(id, state);\n      else activeWindows.delete(id);\n      saveActiveWindows();\n      if (qr.isConnected) {\n        qr.querySelector('.qr-content').innerHTML = qrMarkup(id, state);\n        open.textContent = publish ? '换新签到码' : '生成签到码';\n        inlineFeedback(qr, publish ? '签到码已生效。' : '本场签到已停止。', false);\n        updateCountdown();\n      }\n    } finally {\n      open.disabled = false;\n      close.disabled = false;\n    }\n  });\n  open.addEventListener('click', () => update(open, true));\n  close.addEventListener('click', () => update(close, false));\n  qr.addEventListener('click', event => {\n    const copy = event.target.closest('[data-action=\"copy-check-in-code\"]');\n    if (!copy) return;\n    perform(copy, qr, async () => {\n      const state = activeWindows.get(id);\n      if (!state || Date.parse(state.expiresAt) \u003c= Date.now()) throw new Error('签到码已过期，请换新。');\n      try {\n        await navigator.clipboard.writeText(state.code);\n        inlineFeedback(qr, '签到码已复制。', false);\n      } catch {\n        const range = document.createRange();\n        range.selectNodeContents(qr.querySelector('[data-checkin-code]'));\n        const selection = window.getSelection();\n        selection.removeAllRanges();\n        selection.addRange(range);\n        inlineFeedback(qr, '已选中签到码，可以复制。', false);\n      }\n    });\n  });\n  updateCountdown();\n}\n\nfunction updateCountdown() {\n  const output = document.querySelector('[data-checkin-countdown]');\n  if (!output) return;\n  const state = activeWindows.get(route().id);\n  const seconds = Math.max(0, Math.ceil((Date.parse(state?.expiresAt) - Date.now()) / 1000));\n  if (!seconds) {\n    const schedule = output.closest('.qr-panel').querySelector('[data-checkin-schedule]');\n    const closed = schedule && Date.now() >= Number(schedule.dataset.closes);\n    document.querySelector('[data-checkin-url]').hidden = true;\n    document.querySelector('.checkin-display').hidden = true;\n    const expired = document.querySelector('[data-checkin-expired]');\n    expired.textContent = closed ? '本场签到时段已结束' : '签到码已过期，请在签到时段内换新';\n    expired.hidden = false;\n  } else {\n    output.textContent = `本码剩余 ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;\n  }\n}\n\nfunction updateEventStartClocks() {\n  const now = Date.now();\n  refreshDirectoryTime?.(now);\n  for (const clock of app.querySelectorAll('[data-event-start-countdown]:not([data-event-started])')) {\n    const start = Number(clock.dataset.eventStartCountdown);\n    const end = Number(clock.dataset.eventEnd);\n    const [label, text] = activityClockState(start, end, now);\n    const caption = clock.querySelector('.event-start-label');\n    if (caption.textContent !== label) caption.textContent = label;\n    const value = clock.querySelector('[data-event-start-value]');\n    if (value.textContent !== text) value.textContent = text;\n    if (!label) clock.setAttribute('data-event-started', '');\n    if (start \u003c= now) {\n      const featuredLabel = clock.closest('.featured')?.querySelector('[data-featured-start-label]');\n      const featuredState = now \u003c end ? '正在进行' : '活动提醒';\n      if (featuredLabel && featuredLabel.textContent !== featuredState) featuredLabel.textContent = featuredState;\n    }\n  }\n  for (const schedule of app.querySelectorAll('[data-checkin-schedule]')) {\n    const [phase, left] = checkInPhase(Number(schedule.dataset.opens), Number(schedule.dataset.closes), now);\n    const caption = schedule.querySelector('[data-checkin-phase]');\n    const timer = schedule.querySelector('[data-checkin-time-left]');\n    if (caption.textContent !== phase) caption.textContent = phase;\n    if (timer.textContent !== left) timer.textContent = left;\n  }\n  for (const group of app.querySelectorAll('[data-checkin-gate]')) {\n    const disabled = now \u003c Number(group.dataset.opens) || now >= Number(group.dataset.closes);\n    if (group.disabled !== disabled) group.disabled = disabled;\n  }\n  for (const offers of app.querySelectorAll('[data-registration-offers]:not([hidden])')) {\n    if (now >= Number(offers.dataset.registrationOffers)) {\n      offers.disabled = true;\n      offers.hidden = true;\n      offers.parentElement.querySelector('[data-registration-ended]').hidden = false;\n    }\n  }\n  for (const tag of app.querySelectorAll('[data-registration-tag-end]')) {\n    if (now >= Number(tag.dataset.registrationTagEnd)) {\n      tag.textContent = '活动已结束';\n      tag.className = 'tag tag-muted';\n      tag.removeAttribute('data-registration-tag-end');\n    }\n  }\n  for (const link of app.querySelectorAll('[data-card-action-end]')) {\n    if (now >= Number(link.dataset.cardActionEnd)) {\n      link.textContent = '查看详情';\n      link.removeAttribute('data-card-action-end');\n    }\n  }\n}\n\nfunction csvText(value) {\n  let cell = String(value ?? '');\n  if (/^\\s*[=+@-]/.test(cell) || /^[\\t\\r\\n]/.test(cell)) cell = `'${cell}`;\n  return `\"${cell.replaceAll('\"', '\"\"')}\"`;\n}\n\nfunction exportRoster(id, records) {\n  const labels = { REGISTERED: '待签到', CHECKED_IN: '已签到', CANCELLED: '已取消' };\n  const rows = [['姓名', '报名编号', '状态'], ...records.map(record => [record.name, record.identifier, labels[record.status] || record.status])];\n  const csv = '\\ufeff' + rows.map(row => row.map(csvText).join(',')).join('\\r\\n');\n  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));\n  const download = document.createElement('a');\n  download.href = url;\n  download.download = `校园活动-${id}-报名名单.csv`;\n  document.body.append(download);\n  download.click();\n  download.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1000);\n}\n\nwindow.addEventListener('hashchange', () => render({ focus: true }));\nwindow.addEventListener('pageshow', event => { if (event.persisted) render(); });\nsetInterval(() => {\n  updateCountdown();\n  updateEventStartClocks();\n}, 1000);\ndocument.querySelector('.skip-link').addEventListener('click', event => {\n  event.preventDefault();\n  document.querySelector('#main-section').focus();\n});\nrender();\n","group":"前端"},{"path":"src/main/resources/static/fonts/OFL-Campus-Serif-UI.txt","text":"© 2017-2023 Adobe (http://www.adobe.com/).\n\nCampus Serif UI is a renamed, limited-glyph subset of Noto Serif SC 2.002.\nUpstream project: https://github.com/notofonts/noto-cjk/tree/main/Serif\n\nThis Font Software is licensed under the SIL Open Font License,\nVersion 1.1.\n\nThis license is copied below, and is also available with a FAQ at:\nhttp://scripts.sil.org/OFL\n\n-----------------------------------------------------------\nSIL OPEN FONT LICENSE Version 1.1 - 26 February 2007\n-----------------------------------------------------------\n\nPREAMBLE\nThe goals of the Open Font License (OFL) are to stimulate worldwide\ndevelopment of collaborative font projects, to support the font\ncreation efforts of academic and linguistic communities, and to\nprovide a free and open framework in which fonts may be shared and\nimproved in partnership with others.\n\nThe OFL allows the licensed fonts to be used, studied, modified and\nredistributed freely as long as they are not sold by themselves. The\nfonts, including any derivative works, can be bundled, embedded,\nredistributed and/or sold with any software provided that any reserved\nnames are not used by derivative works. The fonts and derivatives,\nhowever, cannot be released under any other type of license. The\nrequirement for fonts to remain under this license does not apply to\nany document created using the fonts or their derivatives.\n\nDEFINITIONS\n\"Font Software\" refers to the set of files released by the Copyright\nHold  src=\"/tour-position.js?v=0.12\" defer>\u003c/script>\n  \u003cscript src=\"/student-tour.js?v=0.12\" defer>\u003c/script>\n  \u003cscript src=\"/app.js?v=0.12\" defer>\u003c/script>\n  \u003cscript src=\"./pwa.js\" defer>\u003c/script>\n\u003c/head>\n\u003cbody data-portal=\"participant\">\n  \u003ca class=\"skip-link\" href=\"#main-section\">跳到主要内容\u003c/a>\n  \u003cheader class=\"site-header\">\n    \u003cdiv class=\"container site-bar\">\n      \u003ca class=\"brand\" href=\"#events\">\u003cspan class=\"brand-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>校园场务\u003c/span>\u003cspan class=\"portal-label\">同学端\u003c/span>\u003c/a>\n      \u003cnav class=\"primary-nav\" aria-label=\"同学端导航\">\n        \u003ca href=\"#events\" data-nav=\"events\">\u003ci class=\"nav-icon nav-events\" aria-hidden=\"true\">\u003c/i>活动\u003c/a>\n        \u003ca href=\"#attendance\" data-nav=\"attendance\">\u003ci class=\"nav-icon nav-check-in\" aria-hidden=\"true\">\u003c/i>现场签到\u003c/a>\n        \u003ca href=\"#mine\" data-nav=\"mine\">\u003ci class=\"nav-icon nav-mine\" aria-hidden=\"true\">\u003c/i>我的活动\u003c/a>\n      \u003c/nav>\n    \u003c/div>\n  \u003c/header>\n  \u003cmain class=\"container\" id=\"main-section\" tabindex=\"-1\">\n    \u003cdiv id=\"app\" aria-busy=\"true\">\u003cp class=\"loading\">正在载入校园活动…\u003c/p>\u003c/div>\n  \u003c/main>\n  \u003cfooter class=\"site-footer\">\n    \u003cdiv class=\"container footer-content\">\n      \u003cdiv>\u003cspan>校园场务\u003c/span>\u003ca href=\"https://github.com/fate788/campus-events\" aria-label=\"校园场务的 GitHub 仓库，作者 fate788\">GitHub · @fate788\u003c/a>\u003c/div>\n      \u003cdiv class=\"actions\">\u003cbutton class=\"button button-secondary\" type=\"button\" data-pwa-install hidden>安装应用\u003c/button>\n        \u003ca class=\"portal-switch\" href=\"/organizer.html\">活动发布端 ↗\u003c/a>\u003c/div>\n    \u003c/div>\n  \u003c/footer>\n  \u003cnoscript>\u003cp class=\"container\">请在浏览器中开启 JavaScript 使用报名和签到。\u003c/p>\u003c/noscript>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"src/main/resources/static/manifest.webmanifest","text":"{\n  \"id\": \"./\",\n  \"name\": \"校园场务 · 活动报名与签到\",\n  \"short_name\": \"校园场务\",\n  \"description\": \"校园活动、在线报名与现场签到。\",\n  \"lang\": \"zh-CN\",\n  \"start_url\": \"./#events\",\n  \"scope\": \"./\",\n  \"display\": \"standalone\",\n  \"background_color\": \"#f7f2ea\",\n  \"theme_color\": \"#4a1d29\",\n  \"prefer_related_applications\": false,\n  \"icons\": [\n    {\n      \"src\": \"./icons/icon-192.png\",\n      \"sizes\": \"192x192\",\n      \"type\": \"image/png\",\n      \"purpose\": \"any maskable\"\n    },\n    {\n      \"src\": \"./icons/icon-512.png\",\n      \"sizes\": \"512x512\",\n      \"type\": \"image/png\",\n      \"purpose\": \"any maskable\"\n    }\n  ]\n}\n","group":"前端"},{"path":"src/main/resources/static/offline.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#4a1d29\">\n  \u003ctitle>暂时离线 · 校园场务\u003c/title>\n  \u003cstyle>\n    :root { font: 16px/1.65 system-ui, sans-serif; color: #241b1c; background: #f7f2ea; }\n    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }\n    main { margin: 24px; padding: clamp(24px, 7vw, 48px); max-width: 28em; background: #fffdf8; border: 1px solid #e2d5c5; border-top: 2px solid #b79661; border-radius: 12px; }\n    h1 { margin: 0; color: #4a1d29; font: 600 2rem/1.25 \"Songti SC\", SimSun, serif; }\n    p { margin: 1em 0 1.35em; }\n    a { color: #fffdf8; background: #6a2e40; padding: .65em 1em; border-radius: .45em; display: inline-block; font-weight: 650; text-decoration: none; }\n    a:focus-visible { outline: 2px solid #6a2e40; outline-offset: 4px; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003ch1>连接中断\u003c/h1>\n    \u003cp>恢复网络后重新打开活动页面。报名和签到须等服务器确认。\u003c/p>\n    \u003ca href=\"./#events\">重新打开活动列表\u003c/a>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"src/main/resources/static/organizer-tour.css","text":".workspace-rail-footer {\n  padding-top: 0;\n  border-top: 0;\n}\n\n.workspace-guide-trigger {\n  display: flex;\n  width: 100%;\n  align-items: center;\n  gap: 10px;\n  min-height: 44px;\n  margin-bottom: 8px;\n  padding: 7px 10px;\n  border: 0;\n  border-radius: 6px;\n  background: transparent;\n  color: #f1dfca;\n  white-space: nowrap;\n  font: 550 13px / 1.4 var(--body, sans-serif);\n}\n\n.workspace-guide-trigger:hover, .workspace-logout:hover { background: #ffffff10; color: #fff9ed; }\n.workspace-guide-trigger svg, .workspace-logout svg { width: 18px; height: 18px; flex: none; }\n.workspace-guide-trigger svg { color: var(--brass-light); }\n.workspace-profile-strip {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  align-items: center;\n  padding-top: 12px;\n  border-top: 1px solid var(--workspace-dark-rule);\n}\n.workspace-profile-strip .workspace-account { padding: 5px 3px; }\n.workspace-avatar {\n  color: #ffeccc;\n  background: linear-gradient(145deg, #6c4c4c, #482d36);\n  border: 1px solid #dcbb8a50;\n  border-radius: 9px;\n  font: 600 17px / 1 var(--display);\n}\n.workspace-logout {\n  display: grid;\n  place-items: center;\n  width: 36px;\n  height: 40px;\n  padding: 0;\n  border: 0;\n  border-radius: 6px;\n  background: transparent;\n  color: #d6bfb3;\n}\n.workspace-student-switch { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }\n\n@media (max-width: 800px) {\n  .workspace-rail-footer { display: flex; align-items: center; gap: 6px; }\n  .workspace-rail-footer [data-feedback]:empty { display: none; }\n  .workspace-rail-footer [data-feedback]:not(:empty) { position: absolute; inset: 100% 8px auto; z-index: 3; }\n  .workspace-guide-trigger { width: auto; min-height: 40px; margin: 0; padding-inline: 8px; gap: 6px; font-size: 12px; }\n  .workspace-profile-strip { display: flex; align-items: center; gap: 2px; padding: 0 0 0 7px; border-top: 0; border-left: 1px solid var(--workspace-dark-rule); }\n  .workspace-rail-footer .workspace-account { display: flex; max-width: 125px; }\n  .workspace-avatar { width: 29px; height: 29px; flex-basis: 29px; font-size: 14px; }\n  .workspace-identity strong { font-size: 12px; }\n  .workspace-identity small { margin-top: 0; font-size: 10px; }\n}\n\n@media (max-width: 525px) {\n  .workspace-rail-footer .workspace-account { max-width: 94px; gap: 6px; }\n  .workspace-rail-footer { gap: 1px; }\n  .workspace-profile-strip { padding-left: 4px; }\n  .workspace-logout { width: 32px; }\n}\n@media (max-width: 359px) {\n  .workspace-profile-strip .workspace-identity { display: none; }\n}\n\n.organizer-tour {\n  position: fixed;\n  z-index: 12;\n  width: min(332px, calc(100vw - 24px));\n  max-height: calc(100dvh - 24px);\n  overflow: auto;\n  padding: 17px 19px 18px;\n  border: 1px solid #c8b59d;\n  border-radius: 11px;\n  background: linear-gradient(120deg, #fffcf7, #faf4ea);\n  color: var(--ink);\n  box-shadow: 0 17px 42px #32151d2c, 0 2px 7px #32151d12, inset 0 1px 0 #fff;\n}\n\n.organizer-tour-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  gap: 12px;\n  color: var(--brass-dark);\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: .045em;\n}\n.organizer-tour-header > :first-child { display: inline-flex; align-items: center; gap: 8px; }\n.organizer-tour-header > :first-child::before { content: \"\"; width: 18px; height: 1px; background: var(--brass); }\n.organizer-tour-header > :last-child:not(:first-child) { font-variant-numeric: tabular-nums; }\n\n.organizer-tour h2 {\n  margin-top: 9px;\n  color: var(--wine-deep);\n  font: 600 22px / 1.35 var(--display);\n  letter-spacing: .018em;\n}\n\n.organizer-tour h2:focus { outline: none; }\n\n.organizer-tour p {\n  margin-top: 6px;\n  color: var(--muted);\n  font-size: 14px;\n  line-height: 1.65;\n}\n\n.organizer-tour-actions {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: flex-end;\n  align-items: center;\n  gap: 7px;\n  margin-top: 13px;\n}\n\n.organizer-tour-actions .button { min-height: 40px; padding-inline: 12px; border-radius: 6px; }\n.organizer-tour-actions [data-tour-action=\"skip\"] { margin-inline-end: auto; border-color: transparent; }\n[data-tour-highlight]:not(:focus-visible) { outline: 2px solid var(--brass); outline-offset: 3px; }\n\n@media (max-width: 390px) {\n  .workspace-guide-trigger { gap: 5px; padding-inline: 5px; }\n  .organizer-tour { padding-inline: 13px; }\n  .organizer-tour h2 { font-size: 19px; }\n}\n","group":"前端"},{"path":"src/main/resources/static/organizer-tour.js","text":"(() => {\n  const app = document.querySelector('#app');\n  const opener = '[data-start-organizer-tour]';\n  const firstVisitHandled = new Set();\n  const panel = document.createElement('section');\n  panel.id = 'organizer-tour';\n  panel.className = 'organizer-tour';\n  panel.hidden = true;\n  panel.setAttribute('role', 'dialog');\n  panel.setAttribute('aria-labelledby', 'organizer-tour-title');\n  panel.setAttribute('aria-describedby', 'organizer-tour-description');\n  document.body.append(panel);\n\n  let tour;\n  let anchor;\n  let positionFrame = 0;\n\n  function organizer() {\n    return app.querySelector('[data-organizer-username]')?.dataset.organizerUsername;\n  }\n\n  function setAnchor(target) {\n    if (anchor !== target) anchor?.removeAttribute('data-tour-highlight');\n    anchor = target;\n    anchor?.setAttribute('data-tour-highlight', '');\n  }\n\n  function close({ restoreFocus = true, resume = true } = {}) {\n    if (!tour) return;\n    const returnHash = resume && tour.returnHash;\n    tour.controller?.abort();\n    tour = null;\n    panel.hidden = true;\n    setAnchor(null);\n    if (returnHash && location.hash !== returnHash && !hasUnsavedActivity()) location.hash = returnHash;\n    else if (restoreFocus) app.querySelector(opener)?.focus({ preventScroll: true });\n  }\n\n  function position() {\n    window.positionCampusTour(panel, anchor);\n  }\n\n  function schedulePosition() {\n    if (!tour || panel.hidden || positionFrame) return;\n    positionFrame = requestAnimationFrame(() => {\n      positionFrame = 0;\n      position();\n    });\n  }\n\n  function show({ title, description, progress, buttons, target, focus = false, scroll = false }) {\n    panel.innerHTML = `\n      \u003cheader class=\"organizer-tour-header\">\n        \u003cspan>新手指引\u003c/span>${progress ? `\u003cspan>${progress}\u003c/span>` : ''}\n      \u003c/header>\n      \u003ch2 id=\"organizer-tour-title\" tabindex=\"-1\">${title}\u003c/h2>\n      \u003cp id=\"organizer-tour-description\">${description}\u003c/p>\n      \u003cdiv class=\"organizer-tour-actions\">${buttons}\u003c/div>\n    `;\n    setAnchor(target || app.querySelector('#page-title'));\n    if (scroll && anchor) anchor.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'instant' });\n    panel.hidden = false;\n    position();\n    if (focus) panel.querySelector('h2').focus({ preventScroll: true });\n  }\n\n  function button(action, label, style = 'secondary') {\n    return `\u003cbutton class=\"button button-${style}\" type=\"button\" data-tour-action=\"${action}\">${label}\u003c/button>`;\n  }\n\n  async function ownedEventHashes(signal) {\n    let events = [];\n    try {\n      const response = await fetch('/api/organizer/events', {\n        credentials: 'same-origin', cache: 'no-store', signal,\n      });\n      if (response.ok) events = await response.json();\n    } catch {\n      // Read-only example pages remain available when the list cannot be loaded.\n    }\n    const hashFor = status => {\n      const event = Array.isArray(events) && events.find(event =>\n        event.status === status && /^\\d+$/.test(event.id),\n      );\n      return event ? '#organizer/' + event.id : null;\n    };\n    return {\n      draft: hashFor('DRAFT') || '#organizer/guide-draft',\n      published: hashFor('PUBLISHED') || '#organizer/guide-published',\n    };\n  }\n\n  function steps({ draft, published }) {\n    return [\n      {\n        hash: '#organizer', selector: '.workspace-stats',\n        title: '活动概况',\n        description: '工作台显示活动总数、草稿、已发布活动和有效报名。向下可看到近期活动。',\n      },\n      {\n        hash: '#organizer', selector: '.workspace-nav a[href=\"#organizer/new\"]',\n        title: '创建活动',\n        description: '从侧栏进入创建页。活动先保存为草稿，核对后再发布。',\n      },\n      {\n        hash: '#organizer/new', selector: '#create-event-form [name=\"title\"]',\n        title: '从空白开始',\n        description: '填写名称、开始时间、地点和名额。在「时长与签到」设置活动何时结束、同学可以何时签到。',\n      },\n      {\n        hash: '#organizer/new', selector: '[data-creation-mode=\"template\"]',\n        title: '按需套用模板',\n        description: '默认手动填写。需要参考时，在表单的「活动模板」下拉框选择一个类型，已填的时间和手动修改会保留。',\n      },\n      {\n        hash: '#organizer/new', selector: '#create-event-form button[type=\"submit\"]',\n        title: '保存草稿',\n        description: '保存后只有组织者能看到草稿。可先核对内容，再决定何时发布。',\n      },\n      {\n        hash: '#organizer/events', selector: '.workspace-search',\n        title: '查找和管理活动',\n        description: '按活动名称或地点搜索，也能用旁边的状态筛选查找草稿和已发布活动。',\n      },\n      {\n        hash: draft, selector: '[data-action=\"publish-event\"]',\n        title: '发布报名',\n        description: '在草稿详情核对时间、地点后，点击发布。同学随后就能在同学端报名。',\n      },\n      {\n        hash: published, selector: '[data-action=\"copy-event-link\"]',\n        title: '分享报名入口',\n        description: '复制报名链接后，可以发给同学。旁边的入口可查看同学实际看到的报名页。',\n      },\n      {\n        hash: published, selector: '[data-action=\"open-check-in\"]',\n        title: '开启现场签到',\n        description: '活动开始时生成临时二维码和六位签到码。需要时可换码，也可以停止本场签到。',\n      },\n      {\n        hash: published, selector: '[data-action=\"export-roster\"]',\n        title: '核对和导出名单',\n        description: '可按姓名或报名编号查找，核对到场状态、补录签到，或把名单导出为 CSV。',\n      },\n      {\n        hash: '#organizer/account', selector: '.workspace-profile',\n        title: '账号设置',\n        description: '这里可以核对组织者姓名和用户名。以后可以从导航里的「新手指引」重新走一遍。',\n      },\n    ];\n  }\n\n  function paintStep() {\n    if (!tour || app.getAttribute('aria-busy') === 'true') return;\n    const step = tour.steps[tour.index];\n    const last = tour.index === tour.steps.length - 1;\n    show({\n      ...step,\n      progress: `${tour.index + 1} / ${tour.steps.length}`,\n      buttons: button('skip', '跳过') +\n        (tour.index > 0 ? button('previous', '上一步') : '') +\n        button('next', last ? '完成指引' : '下一步', 'primary'),\n      target: app.querySelector(step.selector),\n      focus: true,\n      scroll: true,\n    });\n  }\n\n  function hasUnsavedActivity() {\n    const form = app.querySelector('#create-event-form');\n    return !!form && [...new FormData(form)].some(([name, value]) => {\n      const initial = form.elements.namedItem(name)?.dataset.initialMinutes || '';\n      return String(value).trim() !== initial;\n    });\n  }\n\n  function move(index, discard = false) {\n    if (index === tour.steps.length) {\n      close();\n      return;\n    }\n    const step = tour.steps[index];\n    if (step.hash !== location.hash && !discard && hasUnsavedActivity()) {\n      tour.pending = index;\n      show({\n        title: '当前活动还未保存',\n        description: '继续下一页会清除未保存的内容。你也可以退出指引，留在表单继续填写。',\n        buttons: button('skip', '继续填写') + button('discard', '离开当前页', 'primary'),\n        target: app.querySelector('#create-event-form button[type=\"submit\"]'),\n        focus: true,\n        scroll: true,\n      });\n      return;\n    }\n    tour.index = index;\n    tour.stage = 'step';\n    tour.hash = step.hash;\n    if (location.hash === step.hash) paintStep();\n    else {\n      panel.hidden = true;\n      setAnchor(null);\n      location.hash = step.hash;\n    }\n  }\n\n  async function begin(firstVisit = false) {\n    const username = organizer();\n    if (!username) return;\n    close({ restoreFocus: false, resume: false });\n    const active = {\n      username, hash: location.hash, stage: 'loading', controller: new AbortController(),\n      returnHash: firstVisit && location.hash !== '#organizer' ? location.hash : null,\n    };\n    tour = active;\n    if (firstVisit) {\n      firstVisitHandled.add(username);\n      const timeout = setTimeout(() => active.controller.abort(), 3000);\n      try {\n        const response = await fetch('/api/organizer/tour/start', {\n          method: 'POST', credentials: 'same-origin', cache: 'no-store', signal: active.controller.signal,\n        });\n        if (response.status === 401 || (response.ok && !(await response.json()).started)) {\n          if (tour === active) close({ restoreFocus: false, resume: false });\n          return;\n        }\n      } catch {\n        // The guide remains available for this visit if receipt of the start could not be confirmed.\n      } finally {\n        clearTimeout(timeout);\n      }\n      if (tour !== active) return;\n    }\n    const timeout = setTimeout(() => active.controller.abort(), 3000);\n    const events = await ownedEventHashes(active.controller.signal);\n    clearTimeout(timeout);\n    if (tour !== active) return;\n    tour.steps = steps(events);\n    move(0);\n  }\n\n  function sync() {\n    if (app.getAttribute('aria-busy') === 'true') return;\n    const username = organizer();\n    const target = app.querySelector(opener);\n    if (target) {\n      target.setAttribute('aria-haspopup', 'dialog');\n      target.setAttribute('aria-controls', panel.id);\n      target.hidden = false;\n    }\n    if (tour && (!username || tour.username !== username)) {\n      close({ restoreFocus: false, resume: false });\n    }\n    if (!username || !target) return;\n    if (tour?.stage === 'step' && tour.hash === location.hash && (panel.hidden || !anchor?.isConnected)) {\n      paintStep();\n    }\n    const pending = app.querySelector('[data-tour-pending=\"true\"]');\n    if (!tour && pending && !firstVisitHandled.has(username)) void begin(true);\n  }\n\n  document.addEventListener('click', event => {\n    if (event.target.closest(opener)) void begin();\n  });\n  panel.addEventListener('click', event => {\n    const action = event.target.closest('[data-tour-action]')?.dataset.tourAction;\n    if (!action || !tour) return;\n    if (action === 'skip') close();\n    if (action === 'next') move(tour.index + 1);\n    if (action === 'previous') move(tour.index - 1);\n    if (action === 'discard') move(tour.pending, true);\n  });\n  document.addEventListener('keydown', event => {\n    if (event.key === 'Escape' && !event.defaultPrevented && tour && !panel.hidden && !(event.target instanceof HTMLSelectElement)) {\n      event.preventDefault();\n      close({ restoreFocus: panel.contains(document.activeElement) });\n    }\n  });\n  window.addEventListener('hashchange', () => {\n    if (tour && location.hash !== tour.hash) close({ restoreFocus: false, resume: false });\n  });\n  window.addEventListener('scroll', schedulePosition, { passive: true });\n  window.addEventListener('resize', schedulePosition);\n  window.visualViewport?.addEventListener('resize', schedulePosition);\n  window.visualViewport?.addEventListener('scroll', schedulePosition, { passive: true });\n  new MutationObserver(sync).observe(app, {\n    childList: true, attributes: true, attributeFilter: ['aria-busy'],\n  });\n  sync();\n})();\n","group":"前端"},{"path":"src/main/resources/static/organizer.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  \u003cmeta name=\"color-scheme\" content=\"light\">\n  \u003cmeta name=\"theme-color\" content=\"#4a1d29\">\n  \u003ctitle>校园场务 · 活动发布端\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/styles.css?v=0.12\">\n  \u003clink rel=\"stylesheet\" href=\"/workspace-layout.css?v=0.12\">\n  \u003clink rel=\"stylesheet\" href=\"/schedule-form.css?v=0.12\">\n  \u003clink rel=\"stylesheet\" href=\"/schedule-clock.css?v=0.12\">\n  \u003clink rel=\"stylesheet\" href=\"/template-picker.css?v=0.12\">\n  \u003clink rel=\"stylesheet\" href=\"/organizer-tour.css?v=0.12\">\n  \u003clink rel=\"icon\" href=\"/icons/icon-192.png\">\n  \u003cscript src=\"/qr.js\" defer>\u003c/script>\n  \u003cscript src=\"/app.js?v=0.12\" defer>\u003c/script>\n  \u003cscript src=\"/tour-position.js?v=0.12\" defer>\u003c/script>\n  \u003cscript src=\"/organizer-tour.js?v=0.12\" defer>\u003c/script>\n\u003c/head>\n\u003cbody data-portal=\"organizer\">\n  \u003ca class=\"skip-link\" href=\"#main-section\">跳到主要内容\u003c/a>\n  \u003cmain class=\"organizer-root\" id=\"main-section\" tabindex=\"-1\">\n    \u003cdiv id=\"app\" aria-busy=\"true\">\u003cp class=\"loading\">正在载入活动管理…\u003c/p>\u003c/div>\n  \u003c/main>\n  \u003cfooter class=\"site-footer\">\u003cdiv class=\"container footer-content\">\n    \u003cspan>校园场务 · 活动发布端\u003c/span>\u003ca href=\"https://github.com/fate788/campus-events\" aria-label=\"校园场务的 GitHub 仓库，作者 fate788\">GitHub · @fate788\u003c/a>\n  \u003c/div>\u003c/footer>\n  \u003cnoscript>\u003cp class=\"container\">请在浏览器中开启 JavaScript 管理活动。\u003c/p>\u003c/noscript>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"src/main/resources/static/pwa.js","text":"(() => {\n  if (window.isSecureContext && 'serviceWorker' in navigator) {\n    navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).catch(error => {\n      console.warn('Campus service worker could not be registered.', error);\n    });\n  }\n\n  const installButton = document.querySelector('[data-pwa-install]');\n  if (!installButton) return;\n\n  let installPrompt;\n  window.addEventListener('beforeinstallprompt', event => {\n    event.preventDefault();\n    installPrompt = event;\n    installButton.hidden = false;\n  });\n\n  installButton.addEventListener('click', async () => {\n    if (!installPrompt) return;\n    const prompt = installPrompt;\n    installPrompt = undefined;\n    installButton.hidden = true;\n    try {\n      await prompt.prompt();\n    } catch (error) {\n      console.warn('Campus install prompt could not be shown.', error);\n    }\n  });\n\n  window.addEventListener('appinstalled', () => {\n    installPrompt = undefined;\n    installButton.hidden = true;\n  });\n})();\n","group":"前端"},{"path":"src/main/resources/static/qr.js","text":"//---------------------------------------------------------------------\n//\n// QR Code Generator for JavaScript\n//\n// Copyright (c) 2009 Kazuhiko Arase\n//\n// URL: http://www.d-project.com/\n//\n// Licensed under the MIT license:\n//  http://www.opensource.org/licenses/mit-license.php\n//\n// The word 'QR Code' is registered trademark of\n// DENSO WAVE INCORPORATED\n//  http://www.denso-wave.com/qrcode/faqpatent-e.html\n//\n//---------------------------------------------------------------------\n\nvar qrcode = function() {\n\n  //---------------------------------------------------------------------\n  // qrcode\n  //---------------------------------------------------------------------\n\n  /**\n   * qrcode\n   * @param typeNumber 1 to 40\n   * @param errorCorrectionLevel 'L','M','Q','H'\n   */\n  var qrcode = function(typeNumber, errorCorrectionLevel) {\n\n    var PAD0 = 0xEC;\n    var PAD1 = 0x11;\n\n    var _typeNumber = typeNumber;\n    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];\n    var _modules = null;\n    var _moduleCount = 0;\n    var _dataCache = null;\n    var _dataList = [];\n\n    var _this = {};\n\n    var makeImpl = function(test, maskPattern) {\n\n      _moduleCount = _typeNumber * 4 + 17;\n      _modules = function(moduleCount) {\n        var modules = new Array(moduleCount);\n        for (var row = 0; row \u003c moduleCount; row += 1) {\n          modules[row] = new Array(moduleCount);\n          for (var col = 0; col \u003c moduleCount; col += 1) {\n            modules[row][col] = null;\n          }\n        }\n        return modules;\n      }(_moduleCount);\n\n      setupPositionProbePattern(0, 0);\n      setupPositionProbePattern(_moduleCount - 7, 0);\n      setupPositionProbePattern(0, _moduleCount - 7);\n      setupPositionAdjustPattern();\n      setupTimingPattern();\n      setupTypeInfo(test, maskPattern);\n\n      if (_typeNumber >= 7) {\n        setupTypeNumber(test);\n      }\n\n      if (_dataCache == null) {\n        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);\n      }\n\n      mapData(_dataCache, maskPattern);\n    };\n\n    var setupPositionProbePattern = function(row, col) {\n\n      for (var r = -1; r \u003c= 7; r += 1) {\n\n        if (row + r \u003c= -1 || _moduleCount \u003c= row + r) continue;\n\n        for (var c = -1; c \u003c= 7; c += 1) {\n\n          if (col + c \u003c= -1 || _moduleCount \u003c= col + c) continue;\n\n          if ( (0 \u003c= r && r \u003c= 6 && (c == 0 || c == 6) )\n              || (0 \u003c= c && c \u003c= 6 && (r == 0 || r == 6) )\n              || (2 \u003c= r && r \u003c= 4 && 2 \u003c= c && c \u003c= 4) ) {\n            _modules[row + r][col + c] = true;\n          } else {\n            _modules[row + r][col + c] = false;\n          }\n        }\n      }\n    };\n\n    var getBestMaskPattern = function() {\n\n      var minLostPoint = 0;\n      var pattern = 0;\n\n      for (var i = 0; i \u003c 8; i += 1) {\n\n        makeImpl(true, i);\n\n        var lostPoint = QRUtil.getLostPoint(_this);\n\n        if (i == 0 || minLostPoint > lostPoint) {\n          minLostPoint = lostPoint;\n          pattern = i;\n        }\n      }\n\n      return pattern;\n    };\n\n    var setupTimingPattern = function() {\n\n      for (var r = 8; r \u003c _moduleCount - 8; r += 1) {\n        if (_modules[r][6] != null) {\n          continue;\n        }\n        _modules[r][6] = (r % 2 == 0);\n      }\n\n      for (var c = 8; c \u003c _moduleCount - 8; c += 1) {\n        if (_modules[6][c] != null) {\n          continue;\n        }\n        _modules[6][c] = (c % 2 == 0);\n      }\n    };\n\n    var setupPositionAdjustPattern = function() {\n\n      var pos = QRUtil.getPatternPosition(_typeNumber);\n\n      for (var i = 0; i \u003c pos.length; i += 1) {\n\n        for (var j = 0; j \u003c pos.length; j += 1) {\n\n          var row = pos[i];\n          var col = pos[j];\n\n          if (_modules[row][col] != null) {\n            continue;\n          }\n\n          for (var r = -2; r \u003c= 2; r += 1) {\n\n            for (var c = -2; c \u003c= 2; c += 1) {\n\n              if (r == -2 || r == 2 || c == -2 || c == 2\n                  || (r == 0 && c == 0) ) {\n                _modules[row + r][col + c] = true;\n              } else {\n                _modules[row + r][col + c] = false;\n              }\n            }\n          }\n        }\n      }\n    };\n\n    var setupTypeNumber = function(test) {\n\n      var bits = QRUtil.getBCHTypeNumber(_typeNumber);\n\n      for (var i = 0; i \u003c 18; i += 1) {\n        var mod = (!test && ( (bits >> i) & 1) == 1);\n        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;\n      }\n\n      for (var i = 0; i \u003c 18; i += 1) {\n        var mod = (!test && ( (bits >> i) & 1) == 1);\n        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;\n      }\n    };\n\n    var setupTypeInfo = function(test, maskPattern) {\n\n      var data = (_errorCorrectionLevel \u003c\u003c 3) | maskPattern;\n      var bits = QRUtil.getBCHTypeInfo(data);\n\n      // vertical\n      for (var i = 0; i \u003c 15; i += 1) {\n\n        var mod = (!test && ( (bits >> i) & 1) == 1);\n\n        if (i \u003c 6) {\n          _modules[i][8] = mod;\n        } else if (i \u003c 8) {\n          _modules[i + 1][8] = mod;\n        } else {\n          _modules[_moduleCount - 15 + i][8] = mod;\n        }\n      }\n\n      // horizontal\n      for (var i = 0; i \u003c 15; i += 1) {\n\n        var mod = (!test && ( (bits >> i) & 1) == 1);\n\n        if (i \u003c 8) {\n          _modules[8][_moduleCount - i - 1] = mod;\n        } else if (i \u003c 9) {\n          _modules[8][15 - i - 1 + 1] = mod;\n        } else {\n          _modules[8][15 - i - 1] = mod;\n        }\n      }\n\n      // fixed module\n      _modules[_moduleCount - 8][8] = (!test);\n    };\n\n    var mapData = function(data, maskPattern) {\n\n      var inc = -1;\n      var row = _moduleCount - 1;\n      var bitIndex = 7;\n      var byteIndex = 0;\n      var maskFunc = QRUtil.getMaskFunction(maskPattern);\n\n      for (var col = _moduleCount - 1; col > 0; col -= 2) {\n\n        if (col == 6) col -= 1;\n\n        while (true) {\n\n          for (var c = 0; c \u003c 2; c += 1) {\n\n            if (_modules[row][col - c] == null) {\n\n              var dark = false;\n\n              if (byteIndex \u003c data.length) {\n                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);\n              }\n\n              var mask = maskFunc(row, col - c);\n\n              if (mask) {\n                dark = !dark;\n              }\n\n              _modules[row][col - c] = dark;\n              bitIndex -= 1;\n\n              if (bitIndex == -1) {\n                byteIndex += 1;\n                bitIndex = 7;\n              }\n            }\n          }\n\n          row += inc;\n\n          if (row \u003c 0 || _moduleCount \u003c= row) {\n            row -= inc;\n            inc = -inc;\n            break;\n          }\n        }\n      }\n    };\n\n    var createBytes = function(buffer, rsBlocks) {\n\n      var offset = 0;\n\n      var maxDcCount = 0;\n      var maxEcCount = 0;\n\n      var dcdata = new Array(rsBlocks.length);\n      var ecdata = new Array(rsBlocks.length);\n\n      for (var r = 0; r \u003c rsBlocks.length; r += 1) {\n\n        var dcCount = rsBlocks[r].dataCount;\n        var ecCount = rsBlocks[r].totalCount - dcCount;\n\n        maxDcCount = Math.max(maxDcCount, dcCount);\n        maxEcCount = Math.max(maxEcCount, ecCount);\n\n        dcdata[r] = new Array(dcCount);\n\n        for (var i = 0; i \u003c dcdata[r].length; i += 1) {\n          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];\n        }\n        offset += dcCount;\n\n        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);\n        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);\n\n        var modPoly = rawPoly.mod(rsPoly);\n        ecdata[r] = new Array(rsPoly.getLength() - 1);\n        for (var i = 0; i \u003c ecdata[r].length; i += 1) {\n          var modIndex = i + modPoly.getLength() - ecdata[r].length;\n          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;\n        }\n      }\n\n      var totalCodeCount = 0;\n      for (var i = 0; i \u003c rsBlocks.length; i += 1) {\n        totalCodeCount += rsBlocks[i].totalCount;\n      }\n\n      var data = new Array(totalCodeCount);\n      var index = 0;\n\n      for (var i = 0; i \u003c maxDcCount; i += 1) {\n        for (var r = 0; r \u003c rsBlocks.length; r += 1) {\n          if (i \u003c dcdata[r].length) {\n            data[index] = dcdata[r][i];\n            index += 1;\n          }\n        }\n      }\n\n      for (var i = 0; i \u003c maxEcCount; i += 1) {\n        for (var r = 0; r \u003c rsBlocks.length; r += 1) {\n          if (i \u003c ecdata[r].length) {\n            data[index] = ecdata[r][i];\n            index += 1;\n          }\n        }\n      }\n\n      return data;\n    };\n\n    var createData = function(typeNumber, errorCorrectionLevel, dataList) {\n\n      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);\n\n      var buffer = qrBitBuffer();\n\n      for (var i = 0; i \u003c dataList.length; i += 1) {\n        var data = dataList[i];\n        buffer.put(data.getMode(), 4);\n        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );\n        data.write(buffer);\n      }\n\n      // calc num max data.\n      var totalDataCount = 0;\n      for (var i = 0; i \u003c rsBlocks.length; i += 1) {\n        totalDataCount += rsBlocks[i].dataCount;\n      }\n\n      if (buffer.getLengthInBits() > totalDataCount * 8) {\n        throw 'code length overflow. ('\n          + buffer.getLengthInBits()\n          + '>'\n          + totalDataCount * 8\n          + ')';\n      }\n\n      // end code\n      if (buffer.getLengthInBits() + 4 \u003c= totalDataCount * 8) {\n        buffer.put(0, 4);\n      }\n\n      // padding\n      while (buffer.getLengthInBits() % 8 != 0) {\n        buffer.putBit(false);\n      }\n\n      // padding\n      while (true) {\n\n        if (buffer.getLengthInBits() >= totalDataCount * 8) {\n          break;\n        }\n        buffer.put(PAD0, 8);\n\n        if (buffer.getLengthInBits() >= totalDataCount * 8) {\n          break;\n        }\n        buffer.put(PAD1, 8);\n      }\n\n      return createBytes(buffer, rsBlocks);\n    };\n\n    _this.addData = function(data, mode) {\n\n      mode = mode || 'Byte';\n\n      var newData = null;\n\n      switch(mode) {\n      case 'Numeric' :\n        newData = qrNumber(data);\n        break;\n      case 'Alphanumeric' :\n        newData = qrAlphaNum(data);\n        break;\n      case 'Byte' :\n        newData = qr8BitByte(data);\n        break;\n      case 'Kanji' :\n        newData = qrKanji(data);\n        break;\n      default :\n        throw 'mode:' + mode;\n      }\n\n      _dataList.push(newData);\n      _dataCache = null;\n    };\n\n    _this.isDark = function(row, col) {\n      if (row \u003c 0 || _moduleCount \u003c= row || col \u003c 0 || _moduleCount \u003c= col) {\n        throw row + ',' + col;\n      }\n      return _modules[row][col];\n    };\n\n    _this.getModuleCount = function() {\n      return _moduleCount;\n    };\n\n    _this.make = function() {\n      if (_typeNumber \u003c 1) {\n        var typeNumber = 1;\n\n        for (; typeNumber \u003c 40; typeNumber++) {\n          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);\n          var buffer = qrBitBuffer();\n\n          for (var i = 0; i \u003c _dataList.length; i++) {\n            var data = _dataList[i];\n            buffer.put(data.getMode(), 4);\n            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );\n            data.write(buffer);\n          }\n\n          var totalDataCount = 0;\n          for (var i = 0; i \u003c rsBlocks.length; i++) {\n            totalDataCount += rsBlocks[i].dataCount;\n          }\n\n          if (buffer.getLengthInBits() \u003c= totalDataCount * 8) {\n            break;\n          }\n        }\n\n        _typeNumber = typeNumber;\n      }\n\n      makeImpl(false, getBestMaskPattern() );\n    };\n\n    _this.createTableTag = function(cellSize, margin) {\n\n      cellSize = cellSize || 2;\n      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;\n\n      var qrHtml = '';\n\n      qrHtml += '\u003ctable style=\"';\n      qrHtml += ' border-width: 0px; border-style: none;';\n      qrHtml += ' border-collapse: collapse;';\n      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';\n      qrHtml += '\">';\n      qrHtml += '\u003ctbody>';\n\n      for (var r = 0; r \u003c _this.getModuleCount(); r += 1) {\n\n        qrHtml += '\u003ctr>';\n\n        for (var c = 0; c \u003c _this.getModuleCount(); c += 1) {\n          qrHtml += '\u003ctd style=\"';\n          qrHtml += ' border-width: 0px; border-style: none;';\n          qrHtml += ' border-collapse: collapse;';\n          qrHtml += ' padding: 0px; margin: 0px;';\n          qrHtml += ' width: ' + cellSize + 'px;';\n          qrHtml += ' height: ' + cellSize + 'px;';\n          qrHtml += ' background-color: ';\n          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';\n          qrHtml += ';';\n          qrHtml += '\"/>';\n        }\n\n        qrHtml += '\u003c/tr>';\n      }\n\n      qrHtml += '\u003c/tbody>';\n      qrHtml += '\u003c/table>';\n\n      return qrHtml;\n    };\n\n    _this.createSvgTag = function(cellSize, margin, alt, title) {\n\n      var opts = {};\n      if (typeof arguments[0] == 'object') {\n        // Called by options.\n        opts = arguments[0];\n        // overwrite cellSize and margin.\n        cellSize = opts.cellSize;\n        margin = opts.margin;\n        alt = opts.alt;\n        title = opts.title;\n      }\n\n      cellSize = cellSize || 2;\n      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;\n\n      // Compose alt property surrogate\n      alt = (typeof alt === 'string') ? {text: alt} : alt || {};\n      alt.text = alt.text || null;\n      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;\n\n      // Compose title property surrogate\n      title = (typeof title === 'string') ? {text: title} : title || {};\n      title.text = title.text || null;\n      title.id = (title.text) ? title.id || 'qrcode-title' : null;\n\n      var size = _this.getModuleCount() * cellSize + margin * 2;\n      var c, mc, r, mr, qrSvg='', rect;\n\n      rect = 'l' + cellSize + ',0 0,' + cellSize +\n        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';\n\n      qrSvg += '\u003csvg version=\"1.1\" xmlns=\"http://www.w3.org/2000/svg\"';\n      qrSvg += !opts.scalable ? ' width=\"' + size + 'px\" height=\"' + size + 'px\"' : '';\n      qrSvg += ' viewBox=\"0 0 ' + size + ' ' + size + '\" ';\n      qrSvg += ' preserveAspectRatio=\"xMinYMin meet\"';\n      qrSvg += (title.text || alt.text) ? ' role=\"img\" aria-labelledby=\"' +\n          escapeXml([title.id, alt.id].join(' ').trim() ) + '\"' : '';\n      qrSvg += '>';\n      qrSvg += (title.text) ? '\u003ctitle id=\"' + escapeXml(title.id) + '\">' +\n          escapeXml(title.text) + '\u003c/title>' : '';\n      qrSvg += (alt.text) ? '\u003cdescription id=\"' + escapeXml(alt.id) + '\">' +\n          escapeXml(alt.text) + '\u003c/description>' : '';\n      qrSvg += '\u003crect width=\"100%\" height=\"100%\" fill "0 0 ${units} ${units}\" shape-rendering=\"crispEdges\">\u003crect width=\"${units}\" height=\"${units}\" fill=\"${palette.light}\"/>\u003cpath fill=\"${palette.dark}\" d=\"${marks}\"/>\u003c/svg>`;\n  }\n\n  window.CampusQr = Object.freeze({ toSvg });\n})();\n","group":"前端"},{"path":"src/main/resources/static/schedule-clock.css","text":".checkin-schedule {\n  min-width: 0;\n  margin-block: 13px 15px;\n  padding: 11px 13px;\n  border-inline-start: 2px solid var(--brass);\n  background: #f7f0e7;\n  color: var(--wine-deep);\n}\n.checkin-schedule > div {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 4px 12px;\n}\n.checkin-schedule strong { font-size: 14px; font-weight: 650; }\n.checkin-schedule [role=\"timer\"] {\n  color: var(--wine);\n  font-size: 12px;\n  font-weight: 600;\n  font-variant-numeric: tabular-nums;\n}\n.schedule-range { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.65; }\n.schedule-range small { margin-inline-start: 6px; white-space: nowrap; font-size: 11px; }\n.registration-offers, .checkin-gate {\n  min-inline-size: 0;\n  margin: 0;\n  padding: 0;\n  border: 0;\n}\n.registration-offers p { margin-block: 10px; }\n.checkin-code-form .checkin-gate, [data-attendance-controls] { display: grid; gap: 12px; }\n[data-attendance-controls] .checkin-schedule { margin: 0; }\n.checkin-gate:disabled :is(input, button) { cursor: default; }\n.checkin-gate:disabled input { color: var(--muted); background: var(--quiet); }\n","group":"前端"},{"path":"src/main/resources/static/schedule-form.css","text":".schedule-fields {\n  container-type: inline-size;\n  min-width: 0;\n  margin: 0;\n  padding: 8px 0 0;\n  border: 0;\n  border-top: 1px solid var(--workspace-border);\n}\n.schedule-fields legend {\n  padding: 0 12px 0 0;\n  color: var(--wine);\n  font: 600 18px / 1.5 var(--display);\n  letter-spacing: .02em;\n}\n.schedule-inputs {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 12px 14px;\n}\n.schedule-inputs label { align-self: end; line-height: 1.5; }\n.schedule-minute-input { position: relative; display: block; min-width: 0; }\n.schedule-minute-input input {\n  padding-inline-end: 44px;\n  font-variant-numeric: tabular-nums;\n  appearance: textfield;\n}\n.schedule-minute-input input::-webkit-inner-spin-button,\n.schedule-minute-input input::-webkit-outer-spin-button { margin: 0; appearance: none; }\n.schedule-minute-input > span {\n  position: absolute;\n  inset: 50% 12px auto auto;\n  color: var(--muted);\n  font: 400 12px / 1.3 var(--body);\n  transform: translateY(-50%);\n  pointer-events: none;\n}\n.schedule-minute-input input[aria-invalid=\"true\"] { border-color: var(--accent); }\n.schedule-fields :is(.schedule-summary, .schedule-error) { margin: 8px 0 0; font-size: 12px; line-height: 1.65; }\n.schedule-fields .schedule-error { color: var(--accent); }\n.schedule-fields .schedule-summary {\n  color: var(--muted);\n  white-space: pre-line;\n  font-variant-numeric: tabular-nums;\n}\n.schedule-fields :is(.schedule-summary, .schedule-error):empty { display: none; }\n@media (min-width: 1120px) {\n  .workspace-creation-form .schedule-summary { display: none; }\n}\n@container (max-width: 380px) {\n  .schedule-inputs { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .schedule-inputs > label:first-child {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-template-columns: 1fr 1fr;\n    align-items: center;\n    gap: 14px;\n  }\n  .schedule-inputs > label:first-child input { margin-block-start: 0; }\n}\n","group":"前端"},{"path":"src/main/resources/static/service-worker.js","text":"const OFFLINE_CACHE_PREFIX = 'campus-offline-';\nconst OFFLINE_CACHE_NAME = OFFLINE_CACHE_PREFIX + '5';\nconst OFFLINE_PAGE = new URL('offline.html', self.registration.scope);\nconst API_PATH = new URL('api/', self.registration.scope).pathname;\n\nself.addEventListener('install', event => {\n  event.waitUntil((async () => {\n    const cache = await caches.open(OFFLINE_CACHE_NAME);\n    await cache.add(new Request(OFFLINE_PAGE, { cache: 'reload' }));\n    await self.skipWaiting();\n  })());\n});\n\nself.addEventListener('activate', event => {\n  event.waitUntil((async () => {\n    const keys = await caches.keys();\n    const superseded = keys.filter(key => key.startsWith(OFFLINE_CACHE_PREFIX) && key !== OFFLINE_CACHE_NAME);\n    await Promise.all(superseded.map(key => caches.delete(key)));\n    await self.clients.claim();\n  })());\n});\n\nself.addEventListener('fetch', event => {\n  const { request } = event;\n  const url = new URL(request.url);\n  if (request.method !== 'GET' || request.mode !== 'navigate'\n      || url.origin !== self.location.origin || url.pathname.startsWith(API_PATH)) return;\n\n  // Every application request stays network-only. Cache only the generic offline notice.\n  event.respondWith(fetch(request).catch(async () => {\n    const cache = await caches.open(OFFLINE_CACHE_NAME);\n    return (await cache.match(OFFLINE_PAGE)) || Response.error();\n  }));\n});\n","group":"前端"},{"path":"src/main/resources/static/student-tour.js","text":"(() => {\n  const steps = [\n    { nav: 'events', title: '找到活动并报名', text: '从「活动」按名称或地点查找，打开详情后可查看剩余名额并确认报名。' },\n    { nav: 'attendance', title: '到场后签到', text: '到场后点「现场签到」，选好已报名的活动，输入现场的六位码。也可以用手机相机扫描现场二维码。' },\n    { nav: 'mine', title: '查看报名记录', text: '「我的活动」保存你的报名和签到状态，也可以从这里重新打开指引。' },\n  ];\n  const panel = document.createElement('section');\n  panel.id = 'student-tour';\n  panel.className = 'organizer-tour';\n  panel.hidden = true;\n  panel.setAttribute('role', 'dialog');\n  panel.setAttribute('aria-labelledby', 'student-tour-title');\n  panel.setAttribute('aria-describedby', 'student-tour-description');\n  document.body.append(panel);\n  let accountId;\n  let index;\n  let anchor;\n  let returnFocus;\n  const starting = new Set();\n\n  function close(restoreFocus = false) {\n    anchor?.removeAttribute('data-tour-highlight');\n    panel.hidden = true;\n    if (restoreFocus && returnFocus?.isConnected) returnFocus.focus({ preventScroll: true });\n    anchor = null;\n    returnFocus = null;\n  }\n\n  function show(stepIndex) {\n    index = stepIndex;\n    const step = steps[index];\n    anchor?.removeAttribute('data-tour-highlight');\n    anchor = document.querySelector(`.primary-nav [data-nav=\"${step.nav}\"]`);\n    anchor.setAttribute('data-tour-highlight', '');\n    anchor.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'instant' });\n    panel.innerHTML = `\n      \u003cheader class=\"organizer-tour-header\">\u003cspan>新手指引\u003c/span>\u003cspan>${index + 1} / ${steps.length}\u003c/span>\u003c/header>\n      \u003ch2 id=\"student-tour-title\" tabindex=\"-1\">${step.title}\u003c/h2>\u003cp id=\"student-tour-description\">${step.text}\u003c/p>\n      \u003cdiv class=\"organizer-tour-actions\">\n        \u003cbutton type=\"button\" class=\"button button-secondary\" data-tour-action=\"skip\">跳过\u003c/button>\n        ${index ? '\u003cbutton type=\"button\" class=\"button button-secondary\" data-tour-action=\"previous\">上一步\u003c/button>' : ''}\n        \u003cbutton type=\"button\" class=\"button button-primary\" data-tour-action=\"next\">${index + 1 === steps.length ? '完成指引' : '下一步'}\u003c/button>\n      \u003c/div>`;\n    panel.hidden = false;\n    positionCampusTour(panel, anchor);\n    panel.querySelector('h2').focus({ preventScroll: true });\n  }\n\n  async function update(account) {\n    const id = account?.id;\n    if (accountId !== id) close();\n    accountId = id;\n    if (!account?.tourPending || starting.has(id) || !panel.hidden) return;\n    starting.add(id);\n    try {\n      const { started } = await api('/account/tour/start', { method: 'POST' });\n      if (started && id === accountId && panel.hidden) {\n        returnFocus = document.querySelector('#page-title');\n        show(0);\n      }\n    } catch {\n      // A later visit can claim the introduction if the service was unavailable.\n    } finally {\n      starting.delete(id);\n    }\n  }\n\n  document.addEventListener('click', event => {\n    const trigger = event.target.closest('[data-start-student-tour]');\n    if (trigger) {\n      returnFocus = trigger;\n      show(0);\n    }\n  });\n  panel.addEventListener('click', event => {\n    const action = event.target.closest('button')?.dataset.tourAction;\n    if (action === 'previous') show(index - 1);\n    if (action === 'next' && index + 1 \u003c steps.length) show(index + 1);\n    else if (action === 'skip' || action === 'next') close(true);\n  });\n  document.addEventListener('keydown', event => {\n    if (!panel.hidden && event.key === 'Escape') {\n      event.preventDefault();\n      close(panel.contains(document.activeElement));\n    }\n  });\n  window.addEventListener('hashchange', () => close());\n  const position = () => positionCampusTour(panel, anchor);\n  window.addEventListener('resize', position);\n  window.addEventListener('scroll', position, { passive: true });\n  window.visualViewport?.addEventListener('resize', position);\n  window.visualViewport?.addEventListener('scroll', position, { passive: true });\n  window.updateStudentTour = update;\n})();\n","group":"前端"},{"path":"src/main/resources/static/styles.css","text":"@font-face {\n  font-family: \"Campus Serif UI\";\n  src: url(\"./fonts/campus-serif-ui.woff2\") format(\"woff2\");\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n}\n\n:root {\n  --canvas: #f7f2ea;\n  --paper: #fffdf8;\n  --ink: #241b1c;\n  --wine: #4a1d29;\n  --wine-deep: #331721;\n  --espresso: #281a20;\n  --brass: #b29362;\n  --brass-dark: #75533a;\n  --brass-light: #dfc194;\n  --muted: #665653;\n  --line: #e4d9ce;\n  --line-strong: #bcaaa0;\n  --tint: #f2e5e7;\n  --quiet: #f3ebe3;\n  --accent: #6a2e40;\n  --accent-hover: #4f2030;\n  --focus: #7e374e;\n  --radius: 13px;\n  --shadow: 0 8px 24px #35242008;\n  --display: \"Campus Serif UI\", \"Noto Serif SC\", \"Songti SC\", \"Noto Serif CJK SC\", \"STSong\", SimSun, serif;\n  --body: \"Noto Sans SC\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei UI\", \"Microsoft YaHei\", \"Noto Sans CJK SC\", system-ui, sans-serif;\n  font-family: var(--body);\n  color: var(--ink);\n  background: var(--canvas);\n  color-scheme: light;\n  font-synthesis: none;\n  -webkit-text-size-adjust: 100%;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody { min-height: 100vh; margin: 0; display: flex; flex-direction: column; }\nmain { flex: 1; }\na { color: inherit; text-decoration: none; }\nbutton, input, textarea, select { font: inherit; }\nbutton { cursor: pointer; }\nbutton:disabled { cursor: wait; opacity: .6; }\nh1, h2, h3, p, dl, dd, ul, ol { margin: 0; }\nh1, h2, h3, p, dd, td, small { overflow-wrap: anywhere; }\n:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }\nh1[tabindex=\"-1\"]:focus, main[tabindex=\"-1\"]:focus { outline: none; }\n.container { width: min(calc(100% - 64px), 1112px); margin-inline: auto; }\n.muted { color: var(--muted); }\n.skip-link { position: fixed; z-index: 7; left: -100vw; top: 12px; padding: 10px 14px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); }\n.skip-link:focus { left: 12px; }\n.loading { padding: 36px 0; color: var(--muted); }\n\n.site-header { background: var(--paper); border-bottom: 1px solid var(--line); }\n.site-bar { min-height: 74px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }\n.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }\nbody[data-portal=\"participant\"] .brand { color: var(--wine-deep); font-family: var(--display); font-size: 19px; font-weight: 650; letter-spacing: .035em; }\nbody[data-portal=\"participant\"] .brand .portal-label { font-family: var(--body); }\n.brand-icon { position: relative; width: 34px; height:
