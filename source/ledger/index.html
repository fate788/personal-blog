<script id="source-data" type="application/json">{"files":[{"path":"README.md","text":"# 合账 · 双账核对工作台 v0.2\n\n给运营或财务核对系统订单与渠道账单。把两侧数据转换为相同的三列 CSV，导入后可按差异类别和业务单号筛选，核对原始行、记录复核结论并导出报告。内置样例为合成数据。\n\n**作品分类**　产品研发 / 业务后端、Web 前端，数据工程 / 数据质量。行业为电商与支付。\n\n## 在本机运行\n\n解压文件夹，使用 Python 3.10 或更新版本。Windows 可双击 `start-review.cmd`，也可在本目录运行 `python server.py`，然后访问 [本机双账核对](http://127.0.0.1:8792/)。只需 Python 标准库。端口已被占用时可运行 `python server.py --port 8802`。使用另一个实例时需指定独立数据库，例如 `--db data/review-2.sqlite3`。\n\n## 一分钟体验\n\n1. 点击「核对样例账单」。实际输入文件位于 `samples/left.csv` 和 `samples/right.csv`。\n2. 点击「金额不符」，搜索 `000127`。两边 CSV 的第 4 行分别为 128.00 元和 118.00 元。切到「重复键」，可以查到需要核对的原始行号。\n3. 打开这笔差异的「复核差异」，核对原始行，填入复核人、差异原因和处理结论。演示时可记录“金额相差 10 元，原因待核实”“交运营核查渠道明细”。复核人是本机手填署名。\n4. 保存后切换至「已复核」，重新打开记录，查看当前结论或追加一版更正。两个页面同时修改时，较晚保存的一方可对照最新结论再决定是否提交。\n5. 导出完整报告可查看最近的复核结论。返回工作台并再次运行相同样例，会直接打开同一批次，已有复核历史仍可查。\n\n## 数据约定\n\n表头为 `业务单号,类型,金额`。类型为「收款」或「退款」，金额为非负十进制元数，精确到分。上传限制为每侧 2 MiB、20,000 条数据。支持 UTF-8、带 BOM 的 UTF-8、GB18030。通过表格软件打开 CSV 时，将「业务单号」列指定为文本，可保留显示的前导零。\n\n核对键为业务单号与类型。同一单号的收款和退款分别比较。同一键出现多次时保留双方行号，交给人工复核，适用于发现部分退款等需要更细粒度标识的情形。文件结构损坏会产生失败任务和原因。金额、单号等单行错误单列明细。「待复核」计数包括待核查的业务键和无效记录，不能直接当作损失金额或订单数。\n\n渠道原始账单需先转换为上述三列。当前只处理同一币种的两份本地文件。工作台使用同一台电脑上的本地数据库，复核署名没有账号认证。真实渠道接入及团队分派另行规划。\n\n## 实现和复现\n\n- `engine.py` 解析及验证记录，按复合键分组，给出两侧行号，导出 UTF-8 BOM 的完整 CSV。导出会转义可能触发表格公式的文本。\n- 新版可在差异处回看相关源行的字段值。打开旧批次时保留旧版已保存的金额和来源行号。再次上传内容相同的两份 CSV，可以补齐差异原始字段，并保留原批次和复核历史。更正复核会追加版本，保留之前填写的人、原因和结论。\n- `GET /api/health` 返回服务状态、排队数、运行数与最早未完成任务的等待秒数。故障响应工作台从此端点只读探测。\n- `server.py` 只监听本机，使用 SQLite 存储异步批次。相同的两份文件按内容复用批次。重启时重新处理运行中断的任务。文件处理结束后数据库保留结果与文件名，清除任务中的源文件内容。历史供本机同一工作台使用。\n- 运行 `python -m unittest discover -v` 复现核对与服务端测试。内置样例为 8 行系统订单、6 行渠道数据，结果为 3 组一致，金额不符、仅系统、仅渠道、重复键、无效记录各 1 项。\n\n业务背景见 [微信支付账单开发指引](https://pay.wechatpay.cn/doc/v3/merchant/4013071218) 与 [美团配送对账体系实践](https://tech.meituan.com/2018/03/21/balance-accounts.html)。本版原型的核对规则及样例为独立实现。\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 双账核对工作台 v0.2 源码包\n\n原始发布归档为 `双账核对工作台-v0.2.zip`。压缩包保留其中 12 份文本文件的原始路径与字节，本文件为导出说明。\n\n使用 Python 3.10 或更新版本，在项目根目录运行 `python server.py` 或 `python -m unittest discover -v`。合成 CSV 样例位于 `samples/`。定制 WOFF2 字体随完整运行包提供，源码包保留字体许可证，浏览器可回退到系统字体。\n","group":"项目说明"},{"path":"engine.py","text":"\"\"\"Match two CSV statements using exact amounts and explicit transaction identities.\"\"\"\n\nimport csv\nimport io\nimport re\nfrom collections import defaultdict\nfrom dataclasses import dataclass\nfrom itertools import chain\n\n\nHEADER = (\"业务单号\", \"类型\", \"金额\")\nSTATUSES = {\n    \"matched\": \"一致\", \"amount\": \"金额不符\", \"only_left\": \"仅系统\",\n    \"only_right\": \"仅渠道\", \"duplicate\": \"重复键\", \"invalid\": \"无效记录\",\n}\nAMOUNT = re.compile(r\"[0-9]+(?:\\.[0-9]{1,2})?\\Z\")\nKEYS = (\"key\", \"kind\", \"left\", \"right\", \"left_lines\", \"right_lines\", \"note\")\nMAX_FILE_BYTES = 4 * 1024 * 1024\nMAX_RECORDS = 20_000\n\n\n@dataclass(frozen=True)\nclass Record:\n    line: int\n    key: str\n    kind: str\n    amount: str\n    error: str\n    values: list\n\n    def source(self):\n        return {\"line\": self.line, \"values\": self.values}\n\n\ndef _amount(raw):\n    if not AMOUNT.fullmatch(raw):\n        return \"\"\n    whole, _, cents = raw.partition(\".\")\n    return (whole.lstrip(\"0\") or \"0\") + \".\" + cents.ljust(2, \"0\")\n\n\ndef _decode(data, source):\n    if not isinstance(data, bytes):\n        raise ValueError(f\"{source}文件必须以字节形式提交。\")\n    if len(data) > MAX_FILE_BYTES:\n        raise ValueError(f\"{source}文件超过 4 MiB，请分批导入。\")\n    if b\"\\x00\" in data:\n        raise ValueError(f\"{source}文件含空字符，请另存为 UTF-8 或 GB18030 的 CSV。\")\n    try:\n        return data.decode(\"utf-8-sig\")\n    except UnicodeDecodeError:\n        if not data.startswith(b\"\\xef\\xbb\\xbf\"):\n            try:\n                return data.decode(\"gb18030\")\n            except UnicodeDecodeError:\n                pass\n    raise ValueError(f\"{source}文件编码无效，请另存为 UTF-8 或 GB18030。\")\n\n\ndef _records(data, source):\n    text = _decode(data, source)\n    reader = csv.reader(io.StringIO(text, newline=\"\"), strict=True)\n    if not text.strip():\n        raise ValueError(f\"{source}文件为空，缺少表头。\")\n    # csv.reader accepts a literal quote inside an unquoted field. Match the CSV\n    # grammar as well so a broken export cannot silently change a transaction ID.\n    unquoted_quote = _bad_quote_line(text)\n    if unquoted_quote:\n        raise ValueError(f\"{source}第 {unquoted_quote} 行 CSV 引号格式错误。\")\n    try:\n        header = next(reader)\n        if tuple(part.strip() for part in header) != HEADER:\n            raise ValueError(f\"{source}表头必须为 业务单号,类型,金额。\")\n        result = []\n        while True:\n            line = reader.line_num + 1\n            columns = next(reader, None)\n            if columns is None:\n                return result\n            if len(result) == MAX_RECORDS:\n                raise ValueError(f\"{source}超过 {MAX_RECORDS} 条记录，请分批导入。\")\n            key, kind, raw = (columns + [\"\", \"\", \"\"])[:3]\n            key, kind, raw = key.strip(), kind.strip(), raw.strip()\n            amount = _amount(raw)\n            errors = []\n            if len(columns) != 3:\n                errors.append(f\"应有 3 列，实际 {len(columns)} 列\")\n            if not key:\n                errors.append(\"业务单号为空\")\n            if kind not in (\"收款\", \"退款\"):\n                errors.append(\"类型须为收款或退款\")\n            if not amount:\n                shown = raw[:40] + (\"…\" if len(raw) > 40 else \"\")\n                errors.append(f\"金额「{shown}」须为非负十进制数，最多两位小数\")\n            result.append(Record(line, key, kind, amount, \"，\".join(errors), columns))\n    except csv.Error as exc:\n        raise ValueError(f\"{source}第 {reader.line_num or 1} 行附近 CSV 无法解析，检查引号、字段长度和文件完整性。\") from exc\n\n\ndef _bad_quote_line(text):\n    # Match complete, legal fields in bulk. An unmatched suffix starts at a bad field.\n    if '\"' not in text:\n        return None\n    end = 0\n    while end \u003c len(text):\n        field = _CSV_FIELD.match(text, end)\n        if not field:\n            break\n        end = field.end()\n    if end == len(text):\n        return None\n    return len(re.findall(r\"\\r\\n|\\r|\\n\", text[:end])) + 1\n\n\n_CSV_FIELD = re.compile(r'(?:\"(?:[^\"]|\"\")*\"|[^,\"\\r\\n]*)(?:,|\\r\\n|\\r|\\n|\\Z)')\n\n\ndef _row(status, key, kind, left, right, note):\n    def amount(records):\n        return records[0].amount if len(records) == 1 else \"\"\n\n    def lines(records):\n        return \", \".join(str(item.line) for item in records)\n\n    row = dict(status=status, key=key, kind=kind, left=amount(left), right=amount(right),\n               left_lines=lines(left), right_lines=lines(right), note=note)\n    if status != \"matched\":\n        row[\"sources\"] = {\"left\": [record.source() for record in left],\n                          \"right\": [record.source() for record in right]}\n    return row\n\n\ndef reconcile(left_bytes, right_bytes):\n    \"\"\"Return group counts and row-level evidence, including physical CSV line numbers.\"\"\"\n    left = _records(left_bytes, \"系统订单\")\n    right = _records(right_bytes, \"渠道账单\")\n    groups = defaultdict(lambda: ([], []))\n    rows = []\n    for side, records in enumerate((left, right)):\n        for record in records:\n            if record.key and record.kind in (\"收款\", \"退款\"):\n                groups[record.key, record.kind][side].append(record)\n            if record.error:\n                origin = (\"系统订单\", \"渠道账单\")[side]\n                rows.append(_row(\"invalid\", record.key, record.kind, [] if side else [record],\n                                 [record] if side else [], f\"{origin}第 {record.line} 行：{record.error}\"))\n\n    for (key, kind), (system, channel) in groups.items():\n        if len(system) > 1 or len(channel) > 1:\n            status = \"duplicate\"\n            note = f\"系统 {len(system)} 行、渠道 {len(channel)} 行，请按原始行号逐笔核查。\"\n        elif any(record.error for record in chain(system, channel)):\n            # Neither a match nor a one-sided omission can be established. Attach\n            # counterpart evidence to the invalid record without counting it twice.\n            continue\n        elif not system:\n            status, note = \"only_right\", \"系统订单中未找到此业务单号和类型。\"\n        elif not channel:\n            status, note = \"only_left\", \"渠道账单中未找到此业务单号和类型。\"\n        elif system[0].amount != channel[0].amount:\n            status, note = \"amount\", \"同一业务单号和类型的两侧金额不同。\"\n        else:\n            status, note = \"matched\", \"\"\n        rows.append(_row(status, key, kind, system, channel, note))\n\n    for row in rows:\n        if row[\"status\"] != \"invalid\":\n            continue\n        sides = groups.get((row[\"key\"], row[\"kind\"]))\n        if not sides or any(len(side) > 1 for side in sides):\n            continue\n        for side, name in zip(sides, (\"left\", \"right\")):\n            if side:\n                row[name] = side[0].amount\n                row[name + \"_lines\"] = str(side[0].line)\n                row[\"sources\"][name] = [side[0].source()]\n    counts = dict.fromkeys(STATUSES, 0)\n    for row in rows:\n        counts[row[\"status\"]] += 1\n    return dict(counts=counts, rows=rows, left_count=len(left), right_count=len(right))\n\n\ndef restore_sources(result, left_bytes, right_bytes):\n    \"\"\"Copy only the original columns referenced by a saved row, preserving its review identity.\"\"\"\n    missing = [row for row in result[\"rows\"] if row[\"status\"] != \"matched\" and row.get(\"sources\") is None]\n    if not missing:\n        return False\n    originals = {}\n    for side, data, label in ((\"left\", left_bytes, \"系统订单\"), (\"right\", right_bytes, \"渠道账单\")):\n        originals[side] = {item.line: item.source() for item in _records(data, label)}\n    for row in missing:\n        sources = {}\n        for side, records in originals.items():\n            lines = row[side + \"_lines\"]\n            sources[side] = [records[int(number)] for number in lines.split(\",\")] if lines else []\n        if not (sources[\"left\"] or sources[\"right\"]):\n            raise ValueError(\"旧差异记录缺少原始行号。\")\n        row[\"sources\"] = sources\n    return True\n\n\ndef _safe_cell(value):\n    text = str(value)\n    stripped = text.lstrip()\n    if stripped.startswith((\"=\", \"+\", \"-\", \"@\", \"＝\", \"＋\", \"－\", \"＠\")) or text.startswith((\"\\t\", \"\\r\", \"\\n\")):\n        return \"'\" + text\n    return text\n\n\ndef export_csv(result, include_reviews=False):\n    \"\"\"Export the full audited result, with a BOM and spreadsheet-safe text cells.\"\"\"\n    output = io.StringIO(newline=\"\")\n    writer = csv.writer(output)\n    headers = [\"比对结果\", \"业务单号\", \"类型\", \"系统金额\", \"渠道金额\", \"系统行号\", \"渠道行号\", \"核查说明\"]\n    if include_reviews:\n        headers.extend((\"复核状态\", \"复核人（手填）\", \"差异原因\", \"处理结论\", \"修订版本\", \"记录时间（UTC）\"))\n    writer.writerow(headers)\n    for row in result[\"rows\"]:\n        cells = [_safe_cell(row[key]) for key in KEYS]\n        if include_reviews:\n            review = row.get(\"review\") or {}\n            state = \"已复核\" if review else (\"无需复核\" if row[\"status\"] == \"matched\" else \"待复核\")\n            cells.append(state)\n            cells.extend(_safe_cell(review.get(key, \"\")) for key in (\"reviewer\", \"reason\", \"conclusion\", \"version\", \"created_at\"))\n        writer.writerow((STATUSES[row[\"status\"]], *cells))\n    return output.getvalue().encode(\"utf-8-sig\")\n","group":"后端"},{"path":"samples/left.csv","text":"业务单号,类型,金额\n000125,收款,68.00\n000125,退款,12.50\n000127,收款,128.00\n000128,收款,39.90\n000130,收款,88.00\n000130,收款,88.00\n000132,退款,-3.50\n000133,收款,0.10\n","group":"数据与样例"},{"path":"samples/right.csv","text":"业务单号,类型,金额\n000125,收款,68.0\n000125,退款,12.50\n000127,收款,118.00\n000129,退款,16.00\n000130,收款,88.00\n000133,收款,0.1\n","group":"数据与样例"},{"path":"server.py","text":"\"\"\"Local reconciliation job server. Run with Python 3.10 or newer.\"\"\"\nimport argparse\nimport base64\nimport binascii\nimport hashlib\nimport json\nimport logging\nimport os\nimport re\nimport sqlite3\nimport threading\nfrom contextlib import closing, contextmanager\nfrom datetime import datetime, timezone\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom pathlib import Path\nfrom urllib.parse import parse_qs, urlsplit\n\nfrom engine import export_csv, reconcile, restore_sources\n\n\nROOT = Path(__file__).resolve().parent\nMAX_FILE = 2 * 1024 * 1024\nMAX_BASE64 = 4 * ((MAX_FILE + 2) // 3)\nMAX_REQUEST = 2 * MAX_BASE64 + 16_384\nJOB_ROUTE = re.compile(r\"/api/jobs/([1-9][0-9]{0,17})(/export\\.csv)?\")\nREVIEW_ROUTE = re.compile(r\"/api/jobs/([1-9][0-9]{0,17})/rows/([1-9][0-9]{0,8})/reviews\")\nPUBLIC_FIELDS = \"\"\"id, status, created_at, left_name, right_name, error, counts, left_count, right_count,\n    (SELECT count(*) FROM reviews WHERE job_id=jobs.id AND version=1) AS reviewed_count\"\"\"\nREVIEW_FIELDS = \"version, reviewer, reason, conclusion, created_at\"\n\n\ndef timestamp():\n    return datetime.now(timezone.utc).isoformat(timespec=\"milliseconds\").replace(\"+00:00\", \"Z\")\n\n\nclass RequestProblem(Exception):\n    def __init__(self, status, message):\n        super().__init__(message)\n        self.status = status\n\n\n@contextmanager\ndef exclusive_worker(db_path):\n    \"\"\"Only the process holding this lock may recover this database's interrupted jobs.\"\"\"\n    lock_path = db_path.with_name(db_path.name + \".lock\")\n    with lock_path.open(\"a+b\") as lock:\n        if os.name == \"nt\":\n            import msvcrt\n            if lock.tell() == 0:\n                lock.write(b\"0\")\n                lock.flush()\n            lock.seek(0)\n            try:\n                msvcrt.locking(lock.fileno(), msvcrt.LK_NBLCK, 1)\n            except OSError as error:\n                raise RuntimeError(\"这个数据库已有对账工作台在使用。\") from error\n        else:\n            import fcntl\n            try:\n                fcntl.flock(lock.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)\n            except BlockingIOError as error:\n                raise RuntimeError(\"这个数据库已有对账工作台在使用。\") from error\n        yield\n\n\nclass JobStore:\n    def __init__(self, path):\n        self.path = path\n        self.pending = threading.Event()\n        self.stopping = threading.Event()\n        with self.connection() as db:\n            db.execute(\"PRAGMA journal_mode=WAL\")\n            db.execute(\"\"\"CREATE TABLE IF NOT EXISTS jobs (\n                id INTEGER PRIMARY KEY, fingerprint TEXT NOT NULL UNIQUE,\n                status TEXT NOT NULL CHECK (status IN ('queued','running','done','failed')),\n                created_at TEXT NOT NULL, left_name TEXT NOT NULL, right_name TEXT NOT NULL,\n                left_file BLOB, right_file BLOB, result TEXT, error TEXT,\n                counts TEXT, left_count INTEGER, right_count INTEGER,\n                evidence_version INTEGER NOT NULL DEFAULT 0\n            )\"\"\")\n            if \"evidence_version\" not in {column[\"name\"] for column in db.execute(\"PRAGMA table_info(jobs)\")}:\n                db.execute(\"ALTER TABLE jobs ADD COLUMN evidence_version INTEGER NOT NULL DEFAULT 0\")\n            # A row's position and business result remain stable when a matching\n            # pair of files later supplies raw columns for a pre-review batch.\n            db.execute(\"\"\"CREATE TABLE IF NOT EXISTS reviews (\n                job_id INTEGER NOT NULL REFERENCES jobs(id), row_id INTEGER NOT NULL,\n                version INTEGER NOT NULL CHECK (version >= 1), reviewer TEXT NOT NULL,\n                reason TEXT NOT NULL, conclusion TEXT NOT NULL, created_at TEXT NOT NULL,\n                PRIMARY KEY (job_id, row_id, version)\n            )\"\"\")\n            db.execute(\"\"\"CREATE INDEX IF NOT EXISTS jobs_pending_age ON jobs(status,created_at)\n                          WHERE status IN ('queued','running')\"\"\")\n            db.execute(\"UPDATE jobs SET status = 'queued' WHERE status = 'running'\")\n\n    @contextmanager\n    def connection(self):\n        with closing(sqlite3.connect(self.path, timeout=12)) as db:\n            db.row_factory = sqlite3.Row\n            db.execute(\"PRAGMA foreign_keys=ON\")\n            with db:\n                yield db\n\n    def submit(self, left, right, left_name, right_name):\n        fingerprint = hashlib.sha256(hashlib.sha256(left).digest() + hashlib.sha256(right).digest()).hexdigest()\n        stamp = timestamp()\n        with self.connection() as db:\n            existing = db.execute(\"SELECT id,status,evidence_version FROM jobs WHERE fingerprint=?\", (fingerprint,)).fetchone()\n            if existing is not None:\n                if existing[\"status\"] == \"done\" and existing[\"evidence_version\"] == 0:\n                    self.restore_legacy(db, existing[\"id\"], left, right)\n                return {\"id\": existing[\"id\"], \"reused\": True}\n            cursor = db.execute(\"\"\"INSERT INTO jobs\n                (fingerprint,status,created_at,left_name,right_name,left_file,right_file)\n                VALUES (?, 'queued', ?, ?, ?, ?, ?) ON CONFLICT(fingerprint) DO NOTHING\"\"\",\n                (fingerprint, stamp, left_name, right_name, left, right))\n            reused = cursor.rowcount == 0\n            job_id = db.execute(\"SELECT id FROM jobs WHERE fingerprint=?\", (fingerprint,)).fetchone()[\"id\"]\n        self.pending.set()\n        return {\"id\": job_id, \"reused\": reused}\n\n    @staticmethod\n    def restore_legacy(db, job_id, left, right):\n        # The normal submit path has already matched the exact bytes from both\n        # uploads. Serialize the one-time attachment against parallel submissions.\n        db.execute(\"BEGIN IMMEDIATE\")\n        saved = db.execute(\"SELECT result FROM jobs WHERE id=? AND status='done' AND evidence_version=0\",\n                           (job_id,)).fetchone()\n        if saved is None:\n            return\n        try:\n            result = json.loads(saved[\"result\"])\n            changed = restore_sources(result, left, right)\n        except (ValueError, TypeError, KeyError):\n            logging.warning(\"Original line references could not be restored for batch %s\", job_id)\n            return\n        if changed:\n            db.execute(\"UPDATE jobs SET result=?,evidence_version=1 WHERE id=?\",\n                       (json.dumps(result, ensure_ascii=False, allow_nan=False), job_id))\n        else:\n            db.execute(\"UPDATE jobs SET evidence_version=1 WHERE id=?\", (job_id,))\n\n    def process(self):\n        while not self.stopping.is_set():\n            self.pending.clear()\n            try:\n                with self.connection() as db:\n                    # This worker holds the exclusive process lock. A running row here can\n                    # only be its own interrupted write, and is safe to recompute.\n                    job = db.execute(\"\"\"SELECT id, left_file, right_file FROM jobs\n                        WHERE status IN ('queued','running') ORDER BY id LIMIT 1\"\"\").fetchone()\n                    if job is not None:\n                        db.execute(\"UPDATE jobs SET status='running' WHERE id=?\", (job[\"id\"],))\n                if job is None:\n                    self.pending.wait(5)\n                    continue\n                self.finish(job)\n            except sqlite3.Error:\n                logging.exception(\"Database unavailable while processing a job\")\n                self.stopping.wait(1)\n\n    def finish(self, job):\n        try:\n            result = reconcile(job[\"left_file\"], job[\"right_file\"])\n            encoded = json.dumps(result, ensure_ascii=False, allow_nan=False)\n            counts = json.dumps(result[\"counts\"])\n            left_count, right_count = result[\"left_count\"], result[\"right_count\"]\n        except Exception as error:\n            if isinstance(error, ValueError):\n                message = str(error) or \"账单格式有误，请检查模板后再导入。\"\n            else:\n                logging.exception(\"Unexpected reconciliation error in job %s\", job[\"id\"])\n                message = \"核对过程中出现错误，请检查输入的账单格式。\"\n            with self.connection() as db:\n                db.execute(\"\"\"UPDATE jobs SET status='failed', error=?, left_file=NULL, right_file=NULL\n                    WHERE id=?\"\"\", (message, job[\"id\"]))\n            return\n        with self.connection() as db:\n            db.execute(\"\"\"UPDATE jobs SET status='done', evidence_version=1, result=?, counts=?, left_count=?, right_count=?,\n                left_file=NULL, right_file=NULL WHERE id=?\"\"\",\n                (encoded, counts, left_count, right_count, job[\"id\"]))\n\n    @staticmethod\n    def decode(row):\n        data = {key: row[key] for key in row.keys() if row[key] is not None}\n        for key in (\"counts\", \"result\"):\n            if key in data:\n                data[key] = json.loads(data[key])\n        return data\n\n    def list_jobs(self):\n        with self.connection() as db:\n            rows = db.execute(f\"SELECT {PUBLIC_FIELDS} FROM jobs ORDER BY id DESC\")\n            return [self.decode(row) for row in rows]\n\n    def get(self, job_id):\n        with self.connection() as db:\n            db.execute(\"BEGIN\")\n            row = db.execute(f\"SELECT {PUBLIC_FIELDS}, result FROM jobs WHERE id=?\", (job_id,)).fetchone()\n            if row is None:\n                raise RequestProblem(404, \"找不到这个核对批次。\")\n            job = self.decode(row)\n            if job[\"status\"] == \"done\":\n                rows = job[\"result\"][\"rows\"]\n                for row_id, item in enumerate(rows, start=1):\n                    item[\"row_id\"] = row_id\n                    item[\"review\"] = None\n                    item.pop(\"sources\", None)\n                latest = db.execute(f\"\"\"SELECT r.row_id, {REVIEW_FIELDS} FROM reviews AS r\n                    WHERE r.job_id=? AND NOT EXISTS (\n                        SELECT 1 FROM reviews AS newer WHERE newer.job_id=r.job_id\n                          AND newer.row_id=r.row_id AND newer.version>r.version)\"\"\", (job_id,))\n                for entry in latest:\n                    review = dict(entry)\n                    rows[review.pop(\"row_id\") - 1][\"review\"] = review\n        return job\n\n    @staticmethod\n    def review_row(db, job_id, row_id):\n        job = db.execute(\"\"\"SELECT status, json_extract(result, ?) AS item FROM jobs WHERE id=?\"\"\",\n                         (f\"$.rows[{row_id - 1}]\", job_id)).fetchone()\n        if job is None:\n            raise RequestProblem(404, \"找不到这个核对批次。\")\n        if job[\"status\"] != \"done\":\n            raise RequestProblem(409, \"核对完成后才能复核差异。\")\n        if job[\"item\"] is None:\n            raise RequestProblem(404, \"找不到这条差异。\")\n        item = json.loads(job[\"item\"])\n        if item[\"status\"] == \"matched\":\n            raise RequestProblem(400, \"这条记录金额一致，无需复核。\")\n        return item\n\n    def history(self, job_id, row_id):\n        with self.connection() as db:\n            db.execute(\"BEGIN\")\n            item = self.review_row(db, job_id, row_id)\n            records = db.execute(f\"\"\"SELECT {REVIEW_FIELDS} FROM reviews\n                WHERE job_id=? AND row_id=? ORDER BY version\"\"\", (job_id, row_id))\n            return {\"history\": [dict(r) for r in records], \"sources\": item.get(\"sources\")}\n\n    def add_review(self, job_id, row_id, data):\n        expected = data.get(\"expected_version\")\n        if type(expected) is not int or not 0 \u003c= expected \u003c 2**63 - 1:\n            raise RequestProblem(400, \"缺少有效的修订版本，请刷新差异后再试。\")\n        fields = {}\n        for key, label, limit in ((\"reviewer\", \"复核人\", 40), (\"reason\", \"差异原因\", 300), (\"conclusion\", \"处理结论\", 300)):\n            value = data.get(key)\n            if not isinstance(value, str) or not 1 \u003c= len(value.strip()) \u003c= limit:\n                raise RequestProblem(400, f\"{label}须填写 1 至 {limit} 个字。\")\n            if re.search(r\"[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f\\x7f\\ud800-\\udfff]\", value):\n                raise RequestProblem(400, f\"{label}包含不能保存的字符。\")\n            fields[key] = value.strip()\n        with self.connection() as db:\n            db.execute(\"BEGIN IMMEDIATE\")\n            self.review_row(db, job_id, row_id)\n            version, = db.execute(\"\"\"SELECT COALESCE(MAX(version),0) FROM reviews\n                WHERE job_id=? AND row_id=?\"\"\", (job_id, row_id)).fetchone()\n            if expected != version:\n                raise RequestProblem(409, \"这条差异已有新的复核记录，请查看最新版本后再提交。\")\n            review = {**fields, \"version\": version + 1, \"created_at\": timestamp()}\n            db.execute(\"\"\"INSERT INTO reviews (job_id,row_id,version,reviewer,reason,conclusion,created_at)\n                VALUES (:job_id,:row_id,:version,:reviewer,:reason,:conclusion,:created_at)\"\"\",\n                       {**review, \"job_id\": job_id, \"row_id\": row_id})\n        return {\"review\": review}\n\n    def health(self):\n        with self.connection() as db:\n            counts = db.execute(\"\"\"SELECT status, count(*) AS size, min(created_at) AS oldest\n                FROM jobs WHERE status IN ('queued','running') GROUP BY status\"\"\").fetchall()\n        queue = {\"queued\": 0, \"running\": 0, \"oldest_pending_seconds\": 0}\n        now = datetime.now(timezone.utc)\n        for group in counts:\n            queue[group[\"status\"]] = group[\"size\"]\n            oldest = datetime.fromisoformat(group[\"oldest\"].replace(\"Z\", \"+00:00\"))\n            queue[\"oldest_pending_seconds\"] = max(queue[\"oldest_pending_seconds\"], int((now - oldest).total_seconds()))\n        return {\"service\": \"reconcile\", \"status\": \"ok\", \"queue\": queue}\n\n\nclass Handler(BaseHTTPRequestHandler):\n    server_version = \"Reconcile\"\n\n    def verify_origin(self):\n        hosts = self.headers.get_all(\"Host\") or []\n        port = self.server.server_port\n        allowed = {f\"127.0.0.1:{port}\", f\"localhost:{port}\"}\n        if port == 80:\n            allowed.update((\"127.0.0.1\", \"localhost\"))\n        if len(hosts) != 1 or hosts[0].lower() not in allowed:\n            raise RequestProblem(403, \"请从本机工作台地址打开。\")\n        origins = self.headers.get_all(\"Origin\") or []\n        if origins and (len(origins) != 1 or origins[0].lower() != \"http://\" + hosts[0].lower()):\n            raise RequestProblem(403, \"请在当前工作台中发起请求。\")\n\n    def respond(self, status, body, mime, attachment=None):\n        self.send_response(status)\n        self.send_header(\"Content-Type\", mime)\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.send_header(\"Cache-Control\", \"no-store\")\n        self.send_header(\"X-Content-Type-Options\", \"nosniff\")\n        if attachment:\n            self.send_header(\"Content-Disposition\", f'attachment; filename=\"{attachment}\"')\n        self.end_headers()\n        if self.command != \"HEAD\":\n            self.wfile.write(body)\n\n    def json_response(self, status, data):\n        self.respond(status, json.dumps(data, ensure_ascii=False).encode(), \"application/json; charset=utf-8\")\n\n    def read_json(self, limit, size_error):\n        lengths = self.headers.get_all(\"Content-Length\") or []\n        if self.headers.get(\"Transfer-Encoding\"):\n            raise RequestProblem(400, \"请用指定长度的 JSON 提交数据。\")\n        if len(lengths) != 1 or not re.fullmatch(r\"[0-9]{1,10}\", lengths[0]):\n            raise RequestProblem(411, \"请求缺少有效的内容长度。\")\n        length = int(lengths[0])\n        if length > limit:\n            raise RequestProblem(413, size_error)\n        if self.headers.get_content_type() != \"application/json\":\n            raise RequestProblem(415, \"请使用 JSON 提交数据。\")\n        self.connection.settimeout(15)\n        raw = self.rfile.read(length)\n        if len(raw) != length:\n            raise RequestProblem(400, \"数据没有完整上传，请重试。\")\n        try:\n            data = json.loads(raw.decode(\"utf-8\"))\n        except (ValueError, RecursionError):\n            raise RequestProblem(400, \"请求内容不是有效的 UTF-8 JSON。\") from None\n        if not isinstance(data, dict):\n            raise RequestProblem(400, \"请提交有效的 JSON 对象。\")\n        return data\n\n    def files(self):\n        data = self.read_json(MAX_REQUEST, \"每份账单最大支持 2 MiB。\")\n        uploads, names = [], []\n        for key, example in ((\"left\", \"业务账单.csv\"), (\"right\", \"渠道账单.csv\")):\n            value = data.get(key)\n            if not isinstance(value, str) or not value:\n                raise RequestProblem(400, \"请同时提供两份非空的 CSV 账单。\")\n            if len(value) > MAX_BASE64:\n                raise RequestProblem(413, \"每份账单最大支持 2 MiB。\")\n            try:\n                binary = base64.b64decode(value, validate=True)\n            except (ValueError, binascii.Error):\n                raise RequestProblem(400, \"文件内容不是有效的 Base64 编码。\") from None\n            if len(binary) > MAX_FILE:\n                raise RequestProblem(413, \"每份账单最大支持 2 MiB。\")\n            name = data.get(key + \"_name\", example)\n            if not isinstance(name, str):\n                raise RequestProblem(400, \"文件名应为文本。\")\n            name = re.sub(r\"[\\x00-\\x1f\\x7f]\", \"\", re.split(r\"[/\\\\]\", name)[-1]).strip()\n            if any(0xD800 \u003c= ord(c) \u003c= 0xDFFF for c in name):\n                raise RequestProblem(400, \"请提供有效的文件名。\")\n            names.append(name[:180] or example)\n            uploads.append(binary)\n        return uploads + names\n\n    def dispatch(self):\n        self.verify_origin()\n        url = urlsplit(self.path)\n        path = url.path\n        store = self.server.store\n        reviews = REVIEW_ROUTE.fullmatch(path)\n        if reviews:\n            job_id, row_id = map(int, reviews.groups())\n            if self.command == \"POST\":\n                data = self.read_json(16384, \"复核内容过长，请缩短后重试。\")\n                return self.json_response(201, store.add_review(job_id, row_id, data))\n            return self.json_response(200, store.history(job_id, row_id))\n        if self.command == \"POST\":\n            if path != \"/api/jobs\":\n                raise RequestProblem(404, \"地址不存在。\")\n            job = store.submit(*self.files())\n            return self.json_response(200 if job[\"reused\"] else 202, job)\n        if path == \"/api/health\":\n            return self.json_response(200, store.health())\n        if path == \"/api/jobs\":\n            return self.json_response(200, {\"jobs\": store.list_jobs()})\n        match = JOB_ROUTE.fullmatch(path)\n        if match:\n            job = store.get(int(match[1]))\n            if match[2]:\n                if job[\"status\"] != \"done\":\n                    raise RequestProblem(409, \"完成核对后即可导出。\")\n                include_reviews = parse_qs(url.query).get(\"reviews\") == [\"1\"]\n                return self.respond(200, export_csv(job[\"result\"], include_reviews), \"text/csv; charset=utf-8\",\n                                    f\"reconciliation-{job['id']}.csv\")\n            return self.json_response(200, job)\n        static = {\n            \"/\": (\"web/index.html\", \"text/html; charset=utf-8\"),\n            \"/index.html\": (\"web/index.html\", \"text/html; charset=utf-8\"),\n            \"/app.js\": (\"web/app.js\", \"application/javascript; charset=utf-8\"),\n            \"/style.css\": (\"web/style.css\", \"text/css; charset=utf-8\"),\n            \"/samples/left.csv\": (\"samples/left.csv\", \"text/csv; charset=utf-8\"),\n            \"/samples/right.csv\": (\"samples/right.csv\", \"text/csv; charset=utf-8\"),\n        }\n        if path in static:\n            name, mime = static[path]\n        elif re.fullmatch(r\"/fonts/[a-zA-Z0-9_.-]+\\.woff2\", path):\n            name, mime = \"web\" + path, \"font/woff2\"\n        else:\n            raise RequestProblem(404, \"地址不存在。\")\n        try:\n            data = (ROOT / name).read_bytes()\n        except FileNotFoundError:\n            raise RequestProblem(404, \"文件不存在。\") from None\n        self.respond(200, data, mime)\n\n    def do_GET(self):\n        try:\n            self.dispatch()\n        except RequestProblem as error:\n            self.json_response(error.status, {\"error\": str(error)})\n        except (BrokenPipeError, ConnectionResetError):\n            pass\n        except TimeoutError:\n            self.json_response(408, {\"error\": \"请求超时，请重试。\"})\n        except Exception:\n            logging.exception(\"Request failed\")\n            self.json_response(500, {\"error\": \"工作台暂时无法处理请求，请重试。\"})\n\n    do_HEAD = do_GET\n    do_POST = do_GET\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"本机双账核对工作台\")\n    parser.add_argument(\"--port\", type=int, default=8792)\n    parser.add_argument(\"--db\", type=Path, default=ROOT / \"data\" / \"jobs.sqlite3\")\n    options = parser.parse_args()\n    path = options.db.resolve()\n    path.parent.mkdir(parents=True, exist_ok=True)\n    with ThreadingHTTPServer((\"127.0.0.1\", options.port), Handler) as server, exclusive_worker(path):\n        store = JobStore(path)\n        server.store = store\n        worker = threading.Thread(target=store.process, name=\"reconciliation-worker\", daemon=True)\n        worker.start()\n        print(f\"http://127.0.0.1:{server.server_port}/\", flush=True)\n        try:\n            server.serve_forever()\n        except KeyboardInterrupt:\n            pass\n        finally:\n            store.stopping.set()\n            store.pending.set()\n            worker.join()\n\n\nif __name__ == \"__main__\":\n    main()\n","group":"后端"},{"path":"start-review.cmd","text":"@echo off\nsetlocal\ncd /d \"%~dp0\"\nwhere py >nul 2>nul\nif errorlevel 1 (\n  python server.py\n) else (\n  py -3 server.py\n)\nif errorlevel 1 pause\n","group":"配置与启动"},{"path":"test_engine.py","text":"import csv\nimport io\nimport unittest\nfrom pathlib import Path\n\nimport engine\n\n\ndef statement(*records, encoding=\"utf-8\"):\n    file = io.StringIO(newline=\"\")\n    writer = csv.writer(file)\n    writer.writerow(engine.HEADER)\n    writer.writerows(records)\n    return file.getvalue().encode(encoding)\n\n\nclass ReconciliationTests(unittest.TestCase):\n    def test_sample_counts_and_evidence(self):\n        folder = Path(__file__).parent / \"samples\"\n        result = engine.reconcile((folder / \"left.csv\").read_bytes(), (folder / \"right.csv\").read_bytes())\n        self.assertEqual((result[\"left_count\"], result[\"right_count\"]), (8, 6))\n        self.assertEqual(result[\"counts\"], dict(matched=3, amount=1, only_left=1, only_right=1, duplicate=1, invalid=1))\n        diff = next(r for r in result[\"rows\"] if r[\"status\"] == \"amount\")\n        self.assertEqual([diff[f] for f in (\"key\", \"kind\", \"left\", \"right\", \"left_lines\", \"right_lines\")],\n                         [\"000127\", \"收款\", \"128.00\", \"118.00\", \"4\", \"4\"])\n        self.assertEqual(sum(result[\"counts\"].values()), len(result[\"rows\"]))\n\n    def test_exact_amounts_and_no_cross_kind_or_key_netting(self):\n        left = statement((\"0001\", \"收款\", \"00001.2\"), (\"0001\", \"退款\", \"1.2\"), (\"1\", \"收款\", \"0.07\"),\n                         (\"big\", \"收款\", \"123456789123456789123456789.99\"), encoding=\"utf-8-sig\")\n        right = statement((\"0001\", \"收款\", \"1.20\"), (\"1\", \"收款\", \"0.07\"),\n                          (\"big\", \"收款\", \"123456789123456789123456789.98\"), encoding=\"gb18030\")\n        out = engine.reconcile(left, right)\n        self.assertEqual((out[\"counts\"][\"matched\"], out[\"counts\"][\"only_left\"], out[\"counts\"][\"amount\"]), (2, 1, 1))\n        self.assertEqual(next(r for r in out[\"rows\"] if r[\"kind\"] == \"退款\")[\"key\"], \"0001\")\n\n    def test_duplicates_are_never_summed_or_matched(self):\n        out = engine.reconcile(statement((\"a\", \"收款\", \"1.10\"), (\"a\", \"收款\", \"2.20\")),\n                               statement((\"a\", \"收款\", \"3.30\")))\n        row, = out[\"rows\"]\n        self.assertEqual([row[k] for k in (\"status\", \"left\", \"right\", \"left_lines\", \"right_lines\")],\n                         [\"duplicate\", \"\", \"3.30\", \"2, 3\", \"2\"])\n        other = engine.reconcile(statement((\"a\", \"收款\", \"3.30\")),\n                                 statement((\"a\", \"收款\", \"3.30\"), (\"a\", \"收款\", \"3.30\")))\n        self.assertEqual(other[\"rows\"][0][\"status\"], \"duplicate\")\n\n    def test_invalid_rows_and_same_key_bad_amount(self):\n        malformed = [\"-1\", \"+1\", \"1.234\", \"1e2\", \"NaN\", \"１２\", \"\", \".5\", \"1.\"]\n        data = statement(*[(str(i), \"收款\", v) for i, v in enumerate(malformed)],\n                         (\"\", \"收款\", \"1.20\"), (\"12\", \"支付\", \"1\"), (\"13\", \"退款\"), (\"14\", \"退款\", \"2\", \"多余\"))\n        out = engine.reconcile(data, statement((\"0\", \"收款\", \"1.00\")))\n        self.assertEqual(out[\"counts\"][\"invalid\"], 13)\n        self.assertEqual(out[\"counts\"][\"only_right\"], 0)\n        self.assertIn(\"-1\", out[\"rows\"][0][\"note\"])\n        self.assertEqual(out[\"rows\"][0][\"right_lines\"], \"2\")\n        self.assertTrue(all(\"系统订单第 \" in row[\"note\"] for row in out[\"rows\"]))\n\n    def test_invalid_member_of_duplicate_is_diagnosed(self):\n        out = engine.reconcile(statement((\"a\", \"收款\", \"100\"), (\"a\", \"收款\", \"bad\")),\n                               statement((\"a\", \"收款\", \"100\")))\n        self.assertEqual((out[\"counts\"][\"invalid\"], out[\"counts\"][\"duplicate\"], out[\"counts\"][\"matched\"]),\n                         (1, 1, 0))\n\n    def test_quoted_fields_and_multiline_record_evidence(self):\n        data = statement(('餐厅,\"A\"\\n单', \"收款\", \"10\"), (\"B\", \"退款\", \"5\"))\n        result = engine.reconcile(data, data)\n        self.assertEqual([row[\"left_lines\"] for row in result[\"rows\"]], [\"2\", \"4\"])\n        self.assertEqual(result[\"rows\"][0][\"key\"], '餐厅,\"A\"\\n单')\n        self.assertEqual(result[\"counts\"][\"matched\"], 2)\n\n    def test_file_errors_never_return_partial_results(self):\n        head = \",\".join(engine.HEADER)\n        for suffix in ('\\n\"a,收款,1', '\\na\"b,收款,1', '\\n\"a\"junk,收款,1'):\n            with self.subTest(suffix=suffix), self.assertRaisesRegex(ValueError, \"CSV\"):\n                engine.reconcile((head + suffix).encode(), statement())\n        for data in (b\"\", b\"wrong,header\\n\", b\"\\xef\\xbb\\xbf\\xff\", b\"a\\x00b\",\n                     b\"a\" * (engine.MAX_FILE_BYTES + 1), statement() + b\"\\n\" * (engine.MAX_RECORDS + 1)):\n            with self.subTest(length=len(data)), self.assertRaises(ValueError):\n                engine.reconcile(statement(), data)\n        self.assertEqual(engine.reconcile(statement(), statement())[\"rows\"], [])\n\n    def test_export_has_bom_evidence_and_formula_safety(self):\n        left = statement((\"000127\", \"收款\", \"128\"), (\"=1+1\", \"收款\", \"1\"), (\"001\", \"@danger\", \"-4\"))\n        report = engine.export_csv(engine.reconcile(left, statement()))\n        self.assertTrue(report.startswith(b\"\\xef\\xbb\\xbf\"))\n        rows = list(csv.DictReader(io.StringIO(report.decode(\"utf-8-sig\"), newline=\"\")))\n        cells = {row[\"业务单号\"]: row for row in rows}\n        self.assertEqual(cells[\"000127\"][\"系统金额\"], \"128.00\")\n        self.assertIn(\"'=1+1\", cells)\n        self.assertEqual(cells[\"001\"][\"类型\"], \"'@danger\")\n        self.assertEqual(cells[\"000127\"][\"系统行号\"], \"2\")\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n","group":"验收测试"},{"path":"test_server.py","text":"import base64\nimport csv\nimport io\nimport json\nimport os\nimport re\nimport sqlite3\nimport subprocess\nimport sys\nimport tempfile\nimport time\nimport unittest\nfrom concurrent.futures import ThreadPoolExecutor\nfrom contextlib import closing, contextmanager\nfrom pathlib import Path\nfrom urllib.error import HTTPError\nfrom urllib.request import Request, urlopen\n\n\nROOT = Path(__file__).resolve().parent\nJOBS = \"/api/jobs\"\nHEADER = \"业务单号,类型,金额\\n\"\n\n# The wrapper pauses only inside the calculation for one marked job. By this\n# point the actual worker has committed 'running' and retained both inputs.\n# No production hooks, timing-dependent large file, or database fixture needed.\nPAUSE_MARKED_JOB = \"\"\"\nimport threading\nimport server\noriginal = server.reconcile\ndef pause_marked(left, right):\n    if b'CRASH-PENDING' in left:\n        threading.Event().wait()\n    return original(left, right)\nserver.reconcile = pause_marked\nserver.main()\n\"\"\"\n\n\n@contextmanager\ndef start_server(db_path, *, pause_marked=False):\n    command = [sys.executable, \"-u\"]\n    command += [\"-c\", PAUSE_MARKED_JOB] if pause_marked else [str(ROOT / \"server.py\")]\n    command += [\"--port\", \"0\", \"--db\", str(db_path)]\n    log_path = db_path.with_suffix(\".log\")\n    with log_path.open(\"wb\") as log:\n        process = subprocess.Popen(\n            command, cwd=ROOT, stdout=log, stderr=subprocess.STDOUT,\n            creationflags=getattr(subprocess, \"CREATE_NO_WINDOW\", 0),\n            env={**os.environ, \"PYTHONIOENCODING\": \"utf-8\"},\n        )\n        try:\n            deadline = time.monotonic() + 10\n            while time.monotonic() \u003c deadline:\n                output = log_path.read_text(encoding=\"utf-8\", errors=\"replace\")\n                if process.poll() is not None:\n                    raise AssertionError(f\"Server exited during startup: {output}\")\n                address = re.search(r\"^(http://127\\.0\\.0\\.1:\\d+)/\", output, re.MULTILINE)\n                if address:\n                    break\n                time.sleep(.025)\n            else:\n                raise AssertionError(\"Server did not announce its local port\")\n            yield address.group(1)\n        finally:\n            if process.poll() is None:\n                process.kill()\n            process.wait(timeout=10)\n\n\ndef files(key=\"PAY-01\"):\n    content = (HEADER + f\"{key},收款,12.30\\n\").encode()\n    encoded = base64.b64encode(content).decode(\"ascii\")\n    return {\"left\": encoded, \"right\": encoded, \"left_name\": \"系统.csv\", \"right_name\": \"渠道.csv\"}\n\n\ndef samples():\n    return {side: base64.b64encode((ROOT / \"samples\" / f\"{side}.csv\").read_bytes()).decode(\"ascii\")\n            for side in (\"left\", \"right\")}\n\n\ndef review(version, reviewer=\"李同学\"):\n    return {\"reviewer\": reviewer, \"reason\": \"  渠道金额需再查  \", \"conclusion\": \"请结算核查\", \"expected_version\": version}\n\n\ndef exchange(base, path=JOBS, payload=None):\n    body = json.dumps(payload).encode() if payload is not None else None\n    request = Request(base + path, data=body, headers={\"Content-Type\": \"application/json\"})\n    try:\n        response = urlopen(request, timeout=5)\n    except HTTPError as error:\n        response = error\n    with response:\n        data = response.read()\n        if response.headers.get_content_type() == \"application/json\":\n            data = json.loads(data)\n        return response.status, data\n\n\nclass ServerTest(unittest.TestCase):\n    def setUp(self):\n        folder = tempfile.TemporaryDirectory()\n        self.addCleanup(folder.cleanup)\n        self.db = Path(folder.name) / \"jobs.sqlite3\"\n\n    def submit(self, base, payload):\n        status, new = exchange(base, payload=payload)\n        self.assertEqual((status, new[\"reused\"]), (202, False))\n        return new[\"id\"]\n\n    def await_status(self, base, job_id, expected):\n        deadline = time.monotonic() + 8\n        while time.monotonic() \u003c deadline:\n            status, job = exchange(base, f\"{JOBS}/{job_id}\")\n            self.assertEqual(status, 200)\n            if job[\"status\"] == expected:\n                return job\n            if job[\"status\"] in (\"done\", \"failed\"):\n                self.fail(f\"Expected {expected}: {job}\")\n            time.sleep(.025)\n        self.fail(f\"Job {job_id} did not reach {expected}\")\n\n    def test_concurrent_identical_inputs_create_one_result_and_export(self):\n        with start_server(self.db) as base, ThreadPoolExecutor(max_workers=8) as pool:\n            submissions = list(pool.map(lambda _: exchange(base, payload=files()), range(16)))\n            self.assertEqual(sum(status == 202 for status, _ in submissions), 1)\n            self.assertEqual(sum(status == 200 and job[\"reused\"] for status, job in submissions), 15)\n            job_ids = {job[\"id\"] for _, job in submissions}\n            self.assertEqual(len(job_ids), 1)\n            job_id = job_ids.pop()\n            result = self.await_status(base, job_id, \"done\")[\"result\"]\n            self.assertEqual(result[\"counts\"][\"matched\"], 1)\n            self.assertEqual(result[\"rows\"][0][\"key\"], \"PAY-01\")\n            self.assertEqual(len(exchange(base)[1][\"jobs\"]), 1)\n            self.assertEqual(exchange(base, payload={**files(), \"left_name\": \"改名.csv\"}),\n                             (200, {\"id\": job_id, \"reused\": True}))\n            status, csv = exchange(base, f\"{JOBS}/{job_id}/export.csv\")\n            self.assertEqual(status, 200)\n            self.assertTrue(csv.startswith(b\"\\xef\\xbb\\xbf\"))\n            self.assertIn(\"PAY-01\", csv.decode(\"utf-8-sig\"))\n\n    def test_bad_header_is_a_failed_job_and_next_job_still_completes(self):\n        with start_server(self.db) as base:\n            bad = {**files(), \"left\": base64.b64encode(b\"wrong,header\\r\\n\").decode(\"ascii\")}\n            failed = self.submit(base, bad)\n            self.assertIn(\"表头\", self.await_status(base, failed, \"failed\")[\"error\"])\n            self.assertEqual(exchange(base, f\"{JOBS}/{failed}/export.csv\")[0], 409)\n            valid = self.submit(base, files())\n            self.await_status(base, valid, \"done\")\n            self.assertEqual([job[\"status\"] for job in exchange(base)[1][\"jobs\"]], [\"done\", \"failed\"])\n\n    def test_process_loss_preserves_done_and_recovers_running_and_queued(self):\n        with start_server(self.db, pause_marked=True) as base:\n            done = self.submit(base, files())\n            original = self.await_status(base, done, \"done\")\n            running = self.submit(base, files(\"CRASH-PENDING\"))\n            self.await_status(base, running, \"running\")\n            queued = self.submit(base, files(\"AFTER-CRASH\"))\n            self.await_status(base, queued, \"queued\")\n        # The context manager killed the process without a graceful shutdown.\n        # Restart the regular executable against exactly the same SQLite file.\n        with start_server(self.db) as base:\n            self.assertEqual(self.await_status(base, done, \"done\"), original)\n            self.assertEqual(self.await_status(base, running, \"done\")[\"result\"][\"rows\"][0][\"key\"], \"CRASH-PENDING\")\n            self.assertEqual(self.await_status(base, queued, \"done\")[\"result\"][\"rows\"][0][\"key\"], \"AFTER-CRASH\")\n            self.assertEqual(exchange(base, payload=files(\"CRASH-PENDING\")), (200, {\"id\": running, \"reused\": True}))\n            self.assertEqual([job[\"id\"] for job in exchange(base)[1][\"jobs\"]], [queued, running, done])\n\n    def test_review_history_and_raw_duplicate_lines_survive_reimport_and_restart(self):\n        with start_server(self.db) as base:\n            job_id = self.submit(base, samples())\n            job = self.await_status(base, job_id, \"done\")\n            row = next(r for r in job[\"result\"][\"rows\"] if r[\"status\"] == \"duplicate\")\n            path = f\"{JOBS}/{job_id}/rows/{row['row_id']}/reviews\"\n            self.assertIsNone(row[\"review\"])\n            self.assertNotIn(\"sources\", row)\n            details = exchange(base, path)[1]\n            self.assertEqual(details[\"history\"], [])\n            for side in (\"left\", \"right\"):\n                source_csv = (ROOT / \"samples\" / f\"{side}.csv\").read_text(encoding=\"utf-8-sig\")\n                lines = list(csv.reader(io.StringIO(source_csv)))\n                for item in details[\"sources\"][side]:\n                    self.assertEqual(item[\"values\"], lines[item[\"line\"] - 1])\n            self.assertGreater(len(details[\"sources\"][\"left\"]), 1)\n            first = review(0)\n            first[\"conclusion\"] = \"=待确认\"\n            status, saved = exchange(base, path, first)\n            self.assertEqual(status, 201)\n            self.assertEqual(saved[\"review\"][\"reason\"], first[\"reason\"].strip())\n            _, report = exchange(base, f\"{JOBS}/{job_id}/export.csv?reviews=1\")\n            report_rows = list(csv.DictReader(io.StringIO(report.decode(\"utf-8-sig\"))))\n            reviewed = next(r for r in report_rows if r[\"复核状态\"] == \"已复核\")\n            self.assertEqual((reviewed[\"复核人（手填）\"], reviewed[\"处理结论\"]), (\"李同学\", \"'=待确认\"))\n            self.assertNotIn(\"复核状态\", exchange(base, f\"{JOBS}/{job_id}/export.csv\")[1].decode(\"utf-8-sig\").splitlines()[0])\n        with start_server(self.db) as base:\n            self.assertEqual(exchange(base, payload=samples()), (200, {\"id\": job_id, \"reused\": True}))\n            status, second = exchange(base, path, {**review(1), \"conclusion\": \"结算已明确两笔退款的流水号\"})\n            self.assertEqual((status, second[\"review\"][\"version\"]), (201, 2))\n            self.assertEqual(exchange(base, path)[1], {\"history\": [saved[\"review\"], second[\"review\"]], \"sources\": details[\"sources\"]})\n            job = self.await_status(base, job_id, \"done\")\n            self.assertEqual(job[\"reviewed_count\"], 1)\n            self.assertEqual(job[\"result\"][\"rows\"][row[\"row_id\"] - 1][\"review\"], second[\"review\"])\n            self.assertEqual(exchange(base)[1][\"jobs\"][0][\"reviewed_count\"], 1)\n\n    def test_review_conflicts_and_invalid_changes_do_not_overwrite(self):\n        with start_server(self.db) as base, ThreadPoolExecutor(max_workers=4) as pool:\n            job_id = self.submit(base, samples())\n            rows = self.await_status(base, job_id, \"done\")[\"result\"][\"rows\"]\n            prefix = f\"{JOBS}/{job_id}/rows\"\n            row = next(r for r in rows if r[\"status\"] == \"amount\")\n            path = f\"{prefix}/{row['row_id']}/reviews\"\n            for change in ({\"reviewer\": \"  \"}, {\"conclusion\": \"\"}, {\"reason\": \"x\" * 301},\n                           {\"expected_version\": None}, {\"expected_version\": True}, {\"reviewer\": \"\\ud800\"}):\n                self.assertEqual(exchange(base, path, {**review(0), **change})[0], 400)\n            matched = next(r[\"row_id\"] for r in rows if r[\"status\"] == \"matched\")\n            self.assertEqual(exchange(base, f\"{prefix}/{matched}/reviews\", review(0))[0], 400)\n            self.assertEqual(exchange(base, f\"{prefix}/99999/reviews\", review(0))[0], 404)\n            attempts = list(pool.map(lambda i: exchange(base, path, review(0, f\"复核人{i}\")), range(4)))\n            self.assertCountEqual([status for status, _ in attempts], [201, 409, 409, 409])\n            winner = next(value[\"review\"] for status, value in attempts if status == 201)\n            self.assertEqual(exchange(base, path)[1][\"history\"], [winner])\n\n    def test_pre_review_database_migrates_without_original_files(self):\n        # Recreate the persisted shape of a finished v0.1 job, which kept line\n        # numbers but discarded the original uploads and had no reviews table.\n        with start_server(self.db) as base:\n            job_id = self.submit(base, samples())\n            self.await_status(base, job_id, \"done\")\n        with closing(sqlite3.connect(self.db)) as db, db:\n            db.execute(\"DROP TABLE reviews\")\n            db.execute(\"ALTER TABLE jobs DROP COLUMN evidence_version\")\n            result = json.loads(db.execute(\"SELECT result FROM jobs WHERE id=?\", (job_id,)).fetchone()[0])\n            for row in result[\"rows\"]:\n                row.pop(\"sources\", None)\n            db.execute(\"UPDATE jobs SET result=? WHERE id=?\", (json.dumps(result), job_id))\n        with start_server(self.db) as base:\n            job = self.await_status(base, job_id, \"done\")\n            line = next(row for row in job[\"result\"][\"rows\"] if row[\"status\"] == \"amount\")\n            self.assertEqual((line[\"left_lines\"], line[\"right_lines\"]), (\"4\", \"4\"))\n            path = f\"{JOBS}/{job_id}/rows/{line['row_id']}/reviews\"\n            self.assertEqual(exchange(base, path)[1], {\"history\": [], \"sources\": None})\n            status, saved = exchange(base, path, review(0))\n            self.assertEqual(status, 201)\n            before = exchange(base, f\"{JOBS}/{job_id}\")[1]\n            with ThreadPoolExecutor(max_workers=4) as pool:\n                attempts = list(pool.map(lambda _: exchange(base, payload=samples()), range(4)))\n            for attempt in attempts:\n                self.assertEqual(attempt, (200, {\"id\": job_id, \"reused\": True}))\n            restored = exchange(base, path)[1]\n            self.assertEqual(restored[\"history\"], [saved[\"review\"]])\n            self.assertEqual(restored[\"sources\"][\"left\"], [{\"line\": 4, \"values\": [\"000127\", \"收款\", \"128.00\"]}])\n            self.assertEqual(restored[\"sources\"][\"right\"], [{\"line\": 4, \"values\": [\"000127\", \"收款\", \"118.00\"]}])\n            self.assertEqual(before, exchange(base, f\"{JOBS}/{job_id}\")[1])\n            self.assertEqual(len(exchange(base)[1][\"jobs\"]), 1)\n            self.assertEqual(exchange(base, payload=samples()), (200, {\"id\": job_id, \"reused\": True}))\n            self.assertEqual(exchange(base, path)[1], restored)\n\n    def test_health_reports_aggregate_queue_only(self):\n        path = \"/api/health\"\n        empty = {\"queued\": 0, \"running\": 0, \"oldest_pending_seconds\": 0}\n        with start_server(self.db, pause_marked=True) as base:\n            self.assertEqual(exchange(base, path), (200, {\"service\": \"reconcile\", \"status\": \"ok\", \"queue\": empty}))\n            running = self.submit(base, files(\"CRASH-PENDING\"))\n            self.await_status(base, running, \"running\")\n            queued = self.submit(base, files(\"PRIVATE-BILLING-KEY\"))\n            self.await_status(base, queued, \"queued\")\n            with closing(sqlite3.connect(self.db)) as db, db:\n                db.execute(\"UPDATE jobs SET created_at='2020-01-01T00:00:00.000Z' WHERE id=?\", (running,))\n            health = exchange(base, path)[1]\n            self.assertEqual(set(health), {\"service\", \"status\", \"queue\"})\n            self.assertEqual(set(health[\"queue\"]), set(empty))\n            self.assertEqual((health[\"queue\"][\"queued\"], health[\"queue\"][\"running\"]), (1, 1))\n            self.assertGreater(health[\"queue\"][\"oldest_pending_seconds\"], 60)\n            self.assertNotIn(\"PRIVATE\", json.dumps(health))\n            self.assertEqual(exchange(base, f\"{JOBS}/{running}/rows/1/reviews\", review(0))[0], 409)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n","group":"验收测试"},{"path":"web/app.js","text":"'use strict';\n\nconst main = document.querySelector('main');\nconst dialog = document.querySelector('#format-dialog');\nconst statusText = { queued: '排队中', running: '核对中', done: '已完成', failed: '需重新导入' };\nconst categories = {\n  amount: '金额不符', only_left: '仅系统有', only_right: '仅渠道有',\n  duplicate: '重复键', invalid: '无效记录', matched: '一致',\n};\nconst escapeText = value => String(value ?? '').replace(/[&\u003c>\"']/g, char =>\n  ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[char]);\nconst pageSize = 25;\nlet view = 0;\nlet poll;\nlet reuseNotice = null;\n\nasync function request(path, options) {\n  const response = await fetch(path, { cache: 'no-store', ...options });\n  const data = await response.json();\n  if (!response.ok) {\n    const error = new Error(data.error || '暂时无法读取任务。');\n    error.status = response.status;\n    throw error;\n  }\n  return data;\n}\nfunction dateLabel(value) {\n  return new Date(value).toLocaleString('zh-CN', { hour12: false });\n}\nfunction reviewCount(counts) {\n  return Object.keys(categories).reduce((n, key) => n + (key === 'matched' ? 0 : counts[key] || 0), 0);\n}\nfunction historyRows(jobs) {\n  if (!jobs.length) return '\u003cdiv class=\"empty\">\u003cstrong>还没有核对记录\u003c/strong>\u003cp>运行示例或导入两份账单后，可在这里重新打开结果。\u003c/p>\u003c/div>';\n  return jobs.map(job => `\u003ca class=\"job-row\" href=\"#job/${Number(job.id)}\">\u003cdiv>\u003cstrong>${escapeText(job.left_name)} × ${escapeText(job.right_name)}\u003c/strong>\n    \u003csmall>批次 #${Number(job.id)}${job.counts ? ' · ' + reviewCount(job.counts) + ' 项差异' : ''}${job.reviewed_count ? ' · ' + Number(job.reviewed_count) + ' 项已复核' : ''}\u003c/small>\u003c/div>\n    \u003cspan class=\"job-time\">${escapeText(dateLabel(job.created_at))}\u003c/span>\u003cspan class=\"job-status\">${escapeText(statusText[job.status])} ↗\u003c/span>\u003c/a>`).join('');\n}\nfunction fileField(key, title) {\n  return `\u003clabel class=\"file-field\">\u003cspan>${title}\u003c/span>\u003cspan class=\"file-shell\">\n    \u003ci class=\"file-icon\" aria-hidden=\"true\">\u003c/i>\u003cb data-file-name>选择 CSV\u003c/b>\u003csmall>\u003c/small>\n    \u003cinput type=\"file\" name=\"${key}\" accept=\".csv,text/csv\" required>\u003c/span>\u003c/label>`;\n}\nfunction showNew() {\n  main.innerHTML = `\u003cdiv class=\"page-intro\">\u003cdiv>\u003ch1 tabindex=\"-1\">双账核对工作台\u003c/h1>\n    \u003cp>逐笔核对收款与退款，从差异查回原始行，记录复核结论。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"entry-grid\">\u003csection class=\"card import\" aria-labelledby=\"import-title\">\n      \u003ch2 id=\"import-title\">导入两份账单\u003c/h2>\u003cp class=\"sub\">按业务单号和收退款类型配对，金额精确到分。\u003c/p>\n      \u003cform id=\"import-form\">\u003cdiv class=\"file-pair\">${fileField('left', '系统订单')}${fileField('right', '渠道账单')}\u003c/div>\n      \u003cdiv class=\"import-foot\">\u003cbutton class=\"primary action\" type=\"submit\">开始核对 \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/button>\n        \u003cbutton type=\"button\" class=\"link\" data-format>查看文件格式\u003c/button>\u003c/div>\u003c/form>\n      \u003cp class=\"error\" role=\"alert\" id=\"upload-note\">\u003c/p>\n    \u003c/section>\u003caside class=\"specimen\">\u003cdiv class=\"top\">\u003ch2>样例账单\u003c/h2>\u003csmall>收款 · 000127\u003c/small>\u003c/div>\n      \u003cdiv class=\"amount-pair\">\u003cdiv>\u003cspan>系统订单\u003c/span>\u003cstrong>¥128.00\u003c/strong>\u003c/div>\n        \u003cdiv>\u003cspan>渠道账单\u003c/span>\u003cstrong>¥118.00\u003c/strong>\u003c/div>\u003c/div>\n      \u003cdiv>\u003cp>两边相差 10.00 元。打开合成样例，查看这笔差异的出处。\u003c/p>\n      \u003cbutton id=\"run-sample\" class=\"action\" style=\"margin-top:12px\" type=\"button\">核对样例账单 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003c/div>\n    \u003c/aside>\u003c/div>\u003csection class=\"recent\">\u003cdiv class=\"section-title\">\u003ch2>最近核对\u003c/h2>\u003ca class=\"link\" href=\"#history\">全部记录 ↗\u003c/a>\u003c/div>\n      \u003cdiv class=\"ledger\" id=\"recent-list\" aria-live=\"polite\">\u003cp class=\"pending\">正在读取记录…\u003c/p>\u003c/div>\u003c/section>`;\n  const form = main.querySelector('form');\n  const version = view;\n  form.addEventListener('change', event => {\n    const input = event.target;\n    const file = input.files?.[0];\n    input.parentElement.querySelector('b').textContent = file?.name || '选择 CSV';\n    input.parentElement.querySelector('small').textContent = file ? Math.ceil(file.size / 1024) + ' KiB' : '';\n    document.querySelector('#upload-note').textContent = '';\n  });\n  form.addEventListener('submit', event => { event.preventDefault(); submit(form, false, version); });\n  main.querySelector('#run-sample').onclick = () => submit(form, true, version);\n  main.querySelector('[data-format]').onclick = () => dialog.showModal();\n  loadHistory(version, true);\n}\nasync function encodeFile(file) {\n  if (file.size > 2 * 1024 * 1024) throw new Error('每份 CSV 最大为 2 MiB。');\n  if (!file.size) throw new Error('文件为空，请检查账单。');\n  const data = await new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(reader.result);\n    reader.onerror = () => reject(new Error('读取文件失败，请重新选择。'));\n    reader.readAsDataURL(file);\n  });\n  return data.slice(data.indexOf(',') + 1);\n}\nasync function sampleFile(path) {\n  const response = await fetch('/samples/' + path + '.csv');\n  if (!response.ok) throw new Error('样例文件未能读取。');\n  return response.blob();\n}\nasync function submit(form, sample, version) {\n  const buttons = [form.querySelector('[type=submit]'), main.querySelector('#run-sample')];\n  if (buttons.some(button => button.disabled)) return;\n  buttons.forEach(button => { button.disabled = true; });\n  const note = main.querySelector('#upload-note');\n  note.textContent = '正在提交核对任务…';\n  try {\n    const [left, right] = sample ? await Promise.all([sampleFile('left'), sampleFile('right')])\n      : [form.elements.left.files[0], form.elements.right.files[0]];\n    const [a, b] = await Promise.all([encodeFile(left), encodeFile(right)]);\n    const job = await request('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ left: a, right: b, left_name: sample ? '系统订单样例.csv' : left.name,\n        right_name: sample ? '渠道账单样例.csv' : right.name }) });\n    if (version !== view) return;\n    reuseNotice = job.reused ? String(job.id) : null;\n    location.hash = 'job/' + job.id;\n  } catch (error) {\n    if (version === view) note.textContent = error.message;\n  } finally {\n    buttons.forEach(button => { button.disabled = false; });\n  }\n}\nasync function loadHistory(version, recent) {\n  const box = main.querySelector('#recent-list');\n  try {\n    const { jobs } = await request('/api/jobs');\n    if (view === version) box.innerHTML = historyRows(recent ? jobs.slice(0, 3) : jobs);\n  } catch (error) {\n    if (view === version) box.innerHTML = `\u003cp class=\"empty\">读取记录失败。\u003cbutton class=\"link\" data-retry>重新读取\u003c/button>\u003c/p>`;\n    box.querySelector('[data-retry]')?.addEventListener('click', () => loadHistory(version, recent));\n  }\n}\nfunction showHistory() {\n  main.innerHTML = `\u003cdiv class=\"page-intro\">\u003cdiv>\u003ch1 tabindex=\"-1\">任务记录\u003c/h1>\u003cp>按创建时间查看本机保存的核对批次。\u003c/p>\u003c/div>\n    \u003ca class=\"primary action\" href=\"#new\">新建核对\u003c/a>\u003c/div>\u003cdiv class=\"ledger\" id=\"recent-list\">\u003cp class=\"pending\">正在读取记录…\u003c/p>\u003c/div>`;\n  loadHistory(view, false);\n}\nfunction lineLabel(lineText) {\n  if (!lineText) return '无对应行';\n  const lines = lineText.split(', ');\n  if (lines.length \u003c= 3) return '第 ' + escapeText(lineText) + ' 行';\n  return '第 ' + escapeText(lines.slice(0, 3).join('、')) + ' 等 ' + lines.length + ' 行';\n}\n\nfunction renderSources(container, sources, job, row) {\n  const sides = [['left', '系统订单'], ['right', '渠道账单']];\n  container.innerHTML = sides.map(([side, label]) => `\u003csection data-side=\"${side}\">\u003csmall>${label}\u003c/small>\n    \u003cstrong>${row[side] ? '¥' + escapeText(row[side]) : row[side + '_lines'] ? '见原始行' : '无对应金额'}\u003c/strong>\n    \u003cspan class=\"wrap\">${escapeText(job[side + '_name'])}\u003c/span>\n    \u003cspan class=\"source-location\">${lineLabel(row[side + '_lines'])}\u003c/span>\u003c/section>`).join('');\n  for (const [side] of sides) {\n    const original = sources?.[side];\n    if (!original?.length) continue;\n    const column = container.querySelector(`[data-side=\"${side}\"]`);\n    column.insertAdjacentHTML('beforeend', `\u003cdetails class=\"raw-lines\">\u003csummary>查看原始行（${original.length}）\u003c/summary>\n      \u003cdiv class=\"raw-list\">\u003c/div>\u003cdiv class=\"raw-pages\" ${original.length \u003c= 8 ? 'hidden' : ''}>\n      \u003cbutton type=\"button\" data-step=\"-1\" aria-label=\"上一组原始行\">上一组\u003c/button>\u003cspan>\u003c/span>\n      \u003cbutton type=\"button\" data-step=\"1\" aria-label=\"下一组原始行\">下一组\u003c/button>\u003c/div>\u003c/details>`);\n    const details = column.querySelector('details');\n    let start = 0;\n    function slice() {\n      const stop = Math.min(start + 8, original.length);\n      details.querySelector('.raw-list').innerHTML = original.slice(start, stop).map(record => {\n        const fields = record.values.map((value, index) => {\n          const label = ['单号', '类型', '金额'][index] || '第 ' + (index + 1) + ' 列';\n          return `\u003cdiv>\u003cdt>${label}\u003c/dt>\u003cdd>${escapeText(value || '（空）')}\u003c/dd>\u003c/div>`;\n        }).join('');\n        return `\u003csection>\u003cb>第 ${Number(record.line)} 行\u003c/b>\u003cdl>${fields}\u003c/dl>\u003c/section>`;\n      }).join('');\n      details.querySelector('[data-step=\"-1\"]').disabled = start === 0;\n      details.querySelector('[data-step=\"1\"]').disabled = stop === original.length;\n      details.querySelector('.raw-pages span').textContent = `${start + 1}–${stop}`;\n    }\n    details.ontoggle = () => { if (details.open) slice(); };\n    details.querySelector('.raw-pages').onclick = event => {\n      const button = event.target.closest('[data-step]');\n      if (button) { start += Number(button.dataset.step) * 8; slice(); }\n    };\n  }\n  if (sources === null) {\n    container.insertAdjacentHTML('afterend', '\u003cp class=\"legacy-source\">旧批次保留了来源行号和核对金额。再次导入原来的两份 CSV，可以补齐原始字段并保留已有复核。\u003c/p>');\n  }\n}\n\nfunction renderReviews(records) {\n  if (!records.length) return '\u003cp class=\"no-review\">尚无复核记录。\u003c/p>';\n  function entry(record) {\n    return `\u003carticle class=\"review-entry\">\u003cdiv>\u003cstrong>${escapeText(record.reviewer)}\u003c/strong>\n      \u003csmall>第 ${Number(record.version)} 次 · ${escapeText(dateLabel(record.created_at))}\u003c/small>\u003c/div>\n      \u003cdl>\u003cdt>差异原因\u003c/dt>\u003cdd>${escapeText(record.reason)}\u003c/dd>\u003cdt>处理结论\u003c/dt>\u003cdd>${escapeText(record.conclusion)}\u003c/dd>\u003c/dl>\u003c/article>`;\n  }\n  const previous = records.slice(0, -1).reverse();\n  return entry(records[records.length - 1]) + (previous.length\n    ? `\u003cdetails class=\"older-reviews\">\u003csummary>更早的记录（${previous.length}）\u003c/summary>${previous.map(entry).join('')}\u003c/details>` : '');\n}\n\nfunction openReview(job, row, update, restoreFocus) {\n  const panel = document.createElement('dialog');\n  panel.className = 'review-panel';\n  panel.setAttribute('aria-labelledby', 'review-title');\n  panel.innerHTML = `\u003cdiv class=\"review-head\">\u003cdiv>\u003csmall>批次 #${Number(job.id)} · ${categories[row.status]}\u003c/small>\n    \u003ch2 id=\"review-title\">差异复核\u003c/h2>\u003c/div>\u003cbutton class=\"action\" type=\"button\" data-close>返回明细\u003c/button>\u003c/div>\n    \u003cdiv class=\"review-content\">\u003ch3 class=\"review-key\">${escapeText(row.key || '未填单号')}\u003cspan>${escapeText(row.kind || '未填类型')}\u003c/span>\u003c/h3>\n    \u003cp class=\"review-note\">${escapeText(row.note)}\u003c/p>\u003cdiv class=\"source-pair\">\u003c/div>\n    \u003csection class=\"review-ledger\">\u003cdiv class=\"review-section\">\u003ch3>复核记录\u003c/h3>\n      \u003cbutton class=\"link\" type=\"button\" data-amend hidden>追加复核记录\u003c/button>\u003c/div>\u003cdiv data-history>\u003c/div>\u003c/section>\n    \u003cp class=\"review-feedback\" data-feedback role=\"status\" tabindex=\"-1\">\u003c/p>\n    \u003cbutton class=\"action\" type=\"button\" data-reload hidden>重新读取记录\u003c/button>\n    \u003cform class=\"review-form\" hidden>\u003clabel>复核人\u003cinput type=\"text\" name=\"reviewer\" maxlength=\"40\" required autocomplete=\"off\" aria-describedby=\"signature-note\">\u003c/label>\n      \u003csmall id=\"signature-note\">本机手填署名，身份未经账号验证。\u003c/small>\n      \u003cdiv class=\"review-fields\">\u003clabel>差异原因\u003ctextarea name=\"reason\" maxlength=\"300\" rows=\"2\" required>\u003c/textarea>\u003c/label>\n      \u003clabel>处理结论\u003ctextarea name=\"conclusion\" maxlength=\"300\" rows=\"2\" required>\u003c/textarea>\u003c/label>\u003c/div>\n      \u003cdiv class=\"review-actions\">\u003cbutton class=\"action primary\" type=\"submit\">保存复核记录\u003c/button>\n      \u003cbutton class=\"link\" type=\"button\" data-cancel hidden>取消追加\u003c/button>\u003c/div>\u003c/form>\u003c/div>`;\n  main.append(panel);\n  const form = panel.querySelector('form');\n  const feedback = panel.querySelector('[data-feedback]');\n  const amend = panel.querySelector('[data-amend]');\n  const cancel = panel.querySelector('[data-cancel]');\n  const close = panel.querySelector('[data-close]');\n  const reload = panel.querySelector('[data-reload]');\n  const sourceBox = panel.querySelector('.source-pair');\n  const recordsBox = panel.querySelector('[data-history]');\n  const endpoint = `/api/jobs/${Number(job.id)}/rows/${Number(row.row_id)}/reviews`;\n  let records = [];\n  let saving = false;\n  let isCurrent = false;\n  let editing = false;\n  function paint() {\n    recordsBox.innerHTML = renderReviews(records);\n    amend.hidden = !records.length || editing || !isCurrent;\n    form.hidden = !isCurrent || Boolean(records.length && !editing);\n    cancel.hidden = !records.length;\n  }\n  function acceptHistory(history) {\n    records = history;\n    isCurrent = true;\n    update(records[records.length - 1] || null);\n    paint();\n  }\n  async function load(message) {\n    isCurrent = false;\n    form.hidden = true;\n    amend.hidden = true;\n    reload.hidden = true;\n    feedback.textContent = '正在读取原始行与复核记录…';\n    try {\n      const data = await request(endpoint);\n      if (!panel.isConnected || !panel.open) return;\n      panel.querySelector('.legacy-source')?.remove();\n      renderSources(sourceBox, data.sources, job, row);\n      acceptHistory(data.history);\n      feedback.textContent = message;\n    } catch (error) {\n      if (!panel.isConnected || !panel.open) return;\n      reload.hidden = false;\n      feedback.textContent = error.message;\n    }\n  }\n  amend.onclick = () => {\n    editing = true;\n    paint();\n    feedback.textContent = '';\n    form.elements.reviewer.focus();\n  };\n  cancel.onclick = () => { editing = false; form.reset(); paint(); amend.focus(); };\n  close.onclick = () => panel.close();\n  panel.addEventListener('cancel', event => { if (saving) event.preventDefault(); });\n  panel.addEventListener('close', () => { panel.remove(); restoreFocus(); }, { once: true });\n  reload.onclick = () => load(editing ? '已读取最新记录，请核对后保存。' : '');\n  form.onsubmit = async event => {\n    event.preventDefault();\n    if (saving || !isCurrent) return;\n    const fields = [form.elements.reviewer, form.elements.reason, form.elements.conclusion];\n    const blank = fields.find(field => !field.value.trim());\n    if (blank) { feedback.textContent = '请填全复核人、差异原因与处理结论。'; blank.focus(); return; }\n    const payload = Object.fromEntries(fields.map(field => [field.name, field.value.trim()]));\n    payload.expected_version = records.length ? records[records.length - 1].version : 0;\n    saving = true;\n    [...form.elements, close].forEach(control => { control.disabled = true; });\n    feedback.textContent = '正在保存…';\n    try {\n      const data = await request(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });\n      if (!panel.isConnected || !panel.open) return;\n      editing = false;\n      form.reset();\n      acceptHistory([...records, data.review]);\n      feedback.textContent = '复核记录已保存。';\n      feedback.focus();\n    } catch (error) {\n      if (!panel.isConnected || !panel.open) return;\n      if (error.status === 409) {\n        editing = true;\n        await load('这笔差异已有新的复核记录。已保留你的草稿，请对照最新结论后再保存。');\n      } else {\n        feedback.textContent = error.message;\n      }\n    } finally {\n      saving = false;\n      [...form.elements, close].forEach(control => { control.disabled = false; });\n    }\n  };\n  panel.showModal();\n  load('');\n}\n\nfunction renderResult(job) {\n  const { counts, rows, left_count, right_count } = job.result;\n  const types = ['review', 'reviewed', ...Object.keys(categories), 'all'];\n  const total = reviewCount(counts);\n  const labels = { ...categories, review: '待复核', reviewed: '已复核', all: '全部' };\n  const totals = { ...counts, all: rows.length };\n  let reviewed = rows.filter(row => row.review).length;\n  let selected = total > reviewed ? 'review' : reviewed ? 'reviewed' : 'all';\n  let page = 0;\n  main.innerHTML = `\u003cdiv class=\"crumb\">\u003ca href=\"#history\">任务记录\u003c/a> / 批次 #${Number(job.id)}\u003c/div>\n    \u003cdiv class=\"page-intro\">\u003cdiv>\u003ch1 tabindex=\"-1\">核对结果\u003c/h1>\u003cp class=\"wrap\">${escapeText(job.left_name)} × ${escapeText(job.right_name)}\u003c/p>\u003c/div>\n    \u003cdiv class=\"actions\">\u003ca class=\"action\" href=\"#new\">新建核对\u003c/a>\u003ca class=\"action primary\" href=\"/api/jobs/${Number(job.id)}/export.csv?reviews=1\" download>导出完整报告 ↓\u003c/a>\u003c/div>\u003c/div>\n    ${reuseNotice === String(job.id) ? '\u003cp class=\"sub\" style=\"margin-bottom:10px\" role=\"status\">已打开相同文件的已有核对结果。\u003c/p>' : ''}\n    \u003csection class=\"metrics\" aria-label=\"核对概况\">\u003cdiv class=\"metric\">\u003csmall>待复核\u003c/small>\u003cstrong id=\"pending-total\">\u003c/strong>\u003cspan id=\"review-progress\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"metric\">\u003csmall>一致\u003c/small>\u003cstrong>${counts.matched}\u003c/strong>\u003cspan>业务键与金额均一致\u003c/span>\u003c/div>\n    \u003cdiv class=\"metric\">\u003csmall>输入行数\u003c/small>\u003cstrong>${left_count} / ${right_count}\u003c/strong>\u003cspan>系统 / 渠道\u003c/span>\u003c/div>\u003c/section>\n    \u003cdiv class=\"result-tools\">\u003ch2>逐笔明细\u003c/h2>\u003clabel>业务单号 \u003cinput type=\"search\" id=\"search\" placeholder=\"输入单号查找\" autocomplete=\"off\">\u003c/label>\u003c/div>\n    \u003cdiv class=\"filters\" role=\"group\" aria-label=\"结果筛选\">${types.map(key =>\n      `\u003cbutton class=\"filter\" type=\"button\" data-filter=\"${key}\">\u003c/button>`).join('')}\u003c/div>\n    \u003cp class=\"scroll-hint\">左右滑动可查看两侧金额和核查说明。\u003c/p>\n    \u003cdiv class=\"table-panel\" role=\"region\" aria-label=\"核对明细，窄屏可横向滚动\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\n    \u003cth>核对与复核\u003c/th>\u003cth>业务单号 / 类型\u003c/th>\u003cth>系统金额 · 元\u003c/th>\u003cth>渠道金额 · 元\u003c/th>\u003cth>核查说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cdiv class=\"pager\">\u003cspan id=\"range\" role=\"status\">\u003c/span>\u003cdiv class=\"actions\">\u003cbutton id=\"prev\">上一页\u003c/button>\u003cbutton id=\"next\">下一页\u003c/button>\u003c/div>\u003c/div>`;\n  const search = main.querySelector('#search');\n  const prev = main.querySelector('#prev');\n  const next = main.querySelector('#next');\n  function renderRows() {\n    const term = search.value.trim();\n    const filtered = rows.filter(row => {\n      if (!row.key.includes(term)) return false;\n      if (selected === 'review') return row.status !== 'matched' && !row.review;\n      if (selected === 'reviewed') return Boolean(row.review);\n      return selected === 'all' || row.status === selected;\n    });\n    page = Math.min(page, Math.max(0, Math.ceil(filtered.length / pageSize) - 1));\n    main.querySelector('#pending-total').textContent = total - reviewed;\n    main.querySelector('#review-progress').textContent = `已复核 ${reviewed} / ${total} 项差异`;\n    const start = page * pageSize;\n    const end = Math.min(start + pageSize, filtered.length);\n    main.querySelector('tbody').innerHTML = filtered.slice(start, end).map(row => {\n      const money = (amount, lines) => `\u003ctd class=\"money\">${escapeText(amount || '—')}\u003csmall>${lineLabel(lines)}\u003c/small>\u003c/td>`;\n      const action = row.status === 'matched' ? '' : row.row_id\n        ? `\u003cbutton class=\"row-review\" type=\"button\" data-row-id=\"${Number(row.row_id)}\">${row.review ? '已复核 · 查看' : '复核差异'} \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>`\n        : '\u003csmall>需运行 v0.2 服务以复核\u003c/small>';\n      return `\u003ctr>\u003ctd>\u003cspan class=\"tag ${row.status}\">${labels[row.status]}\u003c/span>${action}\u003c/td>\u003ctd>\u003cb>${escapeText(row.key || '未填单号')}\u003c/b>\u003csmall>${escapeText(row.kind || '未填类型')}\u003c/small>\u003c/td>\n        ${money(row.left, row.left_lines)}${money(row.right, row.right_lines)}\u003ctd>${escapeText(row.note || '两侧金额一致。')}\u003c/td>\u003c/tr>`;\n    }).join('') || '\u003ctr>\u003ctd colspan=\"5\" class=\"empty\">当前条件下没有记录。\u003c/td>\u003c/tr>';\n    main.querySelector('#range').textContent = filtered.length ? `显示 ${start + 1}–${end}，共 ${filtered.length} 项` : '共 0 项';\n    prev.disabled = page === 0; next.disabled = end >= filtered.length;\n    totals.review = total - reviewed;\n    totals.reviewed = reviewed;\n    main.querySelectorAll('[data-filter]').forEach(button => {\n      const key = button.dataset.filter;\n      button.textContent = labels[key] + ' ' + totals[key];\n      button.setAttribute('aria-pressed', String(key === selected));\n    });\n  }\n  main.querySelector('tbody').onclick = event => {\n    const button = event.target.closest('[data-row-id]');\n    if (!button) return;\n    const row = rows.find(item => item.row_id === Number(button.dataset.rowId));\n    if (!row) return;\n    openReview(job, row, current => {\n      if (!row.review && current) reviewed++;\n      row.review = current;\n      renderRows();\n    }, () => {\n      const target = main.querySelector(`[data-row-id=\"${row.row_id}\"]`) || main.querySelector(`[data-filter=\"${selected}\"]`);\n      target?.focus({ preventScroll: true });\n    });\n  };\n  main.querySelector('.filters').onclick = event => {\n    const button = event.target.closest('[data-filter]');\n    if (button) { selected = button.dataset.filter; page = 0; renderRows(); }\n  };\n  search.oninput = () => { page = 0; renderRows(); };\n  prev.onclick = () => { if (page > 0) page--; renderRows(); };\n  next.onclick = () => { page++; renderRows(); };\n  renderRows();\n}\nasync function showJob(id, version) {\n  try {\n    const job = await request('/api/jobs/' + id);\n    if (view !== version) return;\n    if (job.status === 'done') { renderResult(job); return; }\n    if (job.status === 'failed') throw new Error(job.error || '核对失败，请检查文件格式。');\n    main.innerHTML = `\u003cdiv class=\"page-intro\">\u003cdiv>\u003ch1 tabindex=\"-1\">正在核对\u003c/h1>\u003cp role=\"status\">批次 #${id} · ${escapeText(statusText[job.status])}。稍后也可从任务记录打开。\u003c/p>\u003c/div>\u003ca class=\"action\" href=\"#history\">查看记录\u003c/a>\u003c/div>`;\n    poll = setTimeout(() => showJob(id, version), 600);\n  } catch (error) {\n    if (view !== version) return;\n    main.innerHTML = `\u003cdiv class=\"page-intro\">\u003cdiv>\u003ch1 tabindex=\"-1\">无法显示结果\u003c/h1>\u003cp role=\"alert\">${escapeText(error.message)}\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"actions\">\u003ca class=\"action primary\" href=\"#new\">重新导入\u003c/a>\u003cbutton class=\"action\" data-refresh>重新读取\u003c/button>\u003c/div>`;\n    main.querySelector('[data-refresh]').onclick = () => showJob(id, version);\n  }\n}\nfunction navigate() {\n  clearTimeout(poll);\n  const version = ++view;\n  const hash = location.hash.slice(1);\n  const job = /^job\\/(\\d+)$/.exec(hash);\n  if (hash === 'history') showHistory();\n  else if (job) { main.innerHTML = '\u003cp class=\"pending\">正在读取核对结果…\u003c/p>'; showJob(job[1], version); }\n  else { reuseNotice =
