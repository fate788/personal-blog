 null; showNew(); }\n  document.querySelectorAll('[data-nav]').forEach(link => {\n    if (link.dataset.nav === (hash === 'history' || job ? 'history' : 'new')) link.setAttribute('aria-current', 'page');\n    else link.removeAttribute('aria-current');\n  });\n  window.scrollTo(0, 0);\n}\ndocument.querySelector('#guide').onclick = () => dialog.showModal();\ndocument.querySelector('#close-dialog').onclick = () => dialog.close();\ndocument.querySelector('.skip').onclick = event => { event.preventDefault(); main.focus(); };\nwindow.addEventListener('hashchange', () => { navigate(); main.focus({ preventScroll: true }); });\nnavigate();\n","group":"前端"},{"path":"web/fonts/OFL-Campus-Serif-UI.txt","text":"© 2017-2023 Adobe (http://www.adobe.com/).\n\nCampus Serif UI is a renamed, limited-glyph subset of Noto Serif SC 2.002.\nUpstream project: https://github.com/notofonts/noto-cjk/tree/main/Serif\n\nThis Font Software is licensed under the SIL Open Font License,\nVersion 1.1.\n\nThis license is copied below, and is also available with a FAQ at:\nhttp://scripts.sil.org/OFL\n\n-----------------------------------------------------------\nSIL OPEN FONT LICENSE Version 1.1 - 26 February 2007\n-----------------------------------------------------------\n\nPREAMBLE\nThe goals of the Open Font License (OFL) are to stimulate worldwide\ndevelopment of collaborative font projects, to support the font\ncreation efforts of academic and linguistic communities, and to\nprovide a free and open framework in which fonts may be shared and\nimproved in partnership with others.\n\nThe OFL allows the licensed fonts to be used, studied, modified and\nredistributed freely as long as they are not sold by themselves. The\nfonts, including any derivative works, can be bundled, embedded,\nredistributed and/or sold with any software provided that any reserved\nnames are not used by derivative works. The fonts and derivatives,\nhowever, cannot be released under any other type of license. The\nrequirement \"true\">\u003c/span>合账\u003c/a>\n    \u003cnav aria-label=\"主导航\">\u003ca href=\"#new\" data-nav=\"new\">核对工作区\u003c/a>\u003ca href=\"#history\" data-nav=\"history\">任务记录\u003c/a>\u003c/nav>\n    \u003cbutton class=\"guide\" type=\"button\" id=\"guide\">\u003cspan aria-hidden=\"true\">?\u003c/span> 导入说明\u003c/button>\n  \u003c/div>\u003c/header>\n  \u003cmain id=\"main\" tabindex=\"-1\">\u003cp class=\"pending\">正在载入工作区…\u003c/p>\u003c/main>\n  \u003cfooter>\u003cspan>合账 · 双账核对工作台\u003c/span>\u003cspan>本机存储\u003c/span>\n    \u003ca href=\"https://github.com/fate788/ledger-reconciliation\" aria-label=\"双账核对工作台的 GitHub 仓库，作者 fate788\">GitHub · @fate788\u003c/a>\n  \u003c/footer>\n  \u003cdialog id=\"format-dialog\" aria-labelledby=\"dialog-title\">\n    \u003cdiv class=\"section-title\">\u003ch2 id=\"dialog-title\">导入说明\u003c/h2>\u003cbutton class=\"icon-btn\" type=\"button\" id=\"close-dialog\" aria-label=\"关闭说明\">×\u003c/button>\u003c/div>\n    \u003cp>两份表都按下面三个列名提供 CSV。金额单位为元，支持 UTF-8 和 GB18030，每份最多 2 MiB。\u003c/p>\n    \u003cpre>业务单号,类型,金额\n000127,收款,128.00\n000127,退款,10.00\u003c/pre>\n    \u003cp>系统按「业务单号 + 类型」配对，保留单号前导零。金额填写非负数，最多两位小数。相同键多次出现会进入人工复核，例如同一订单分次退款。\u003c/p>\n    \u003cp>如需使用渠道账单，请先转换成上述三列。导入的数据和任务保存在运行服务的这台电脑。\u003c/p>\n    \u003cdiv class=\"links\">\u003ca href=\"/samples/left.csv\" download=\"系统流水样例.csv\">下载系统流水样例 ↓\u003c/a>\u003ca href=\"/samples/right.csv\" download=\"渠道账单样例.csv\">下载渠道账单样例 ↓\u003c/a>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\u003c/html>\n","group":"前端"},{"path":"web/style.css","text":"@font-face {\n  font-family:CampusDisplay;\n  src:url('/fonts/campus-serif-ui.woff2') format('woff2');\n  font-weight:600;\n  font-display:swap;\n}\n\n:root {\n  --ink:#282928;\n  --muted:#60605b;\n  --graphite:#303130;\n  --gold:#a78850;\n  --action:#dbc28c;\n  --action-hover:#e7d3a8;\n  --line:#d8d6cb;\n  --paper:#fffefa;\n  --canvas:#f3f2ed;\n  --serif:CampusDisplay,\"Noto Serif SC\",\"Songti SC\",SimSun,serif;\n  --sans:\"Microsoft YaHei UI\",\"PingFang SC\",\"Noto Sans SC\",system-ui,sans-serif;\n  font:15px/1.6 var(--sans);\n  color:var(--ink);\n  background:var(--canvas);\n  color-scheme:light;\n}\n\n* {\n  box-sizing:border-box;\n}\n\nbody {\n  margin:0;\n  min-height:100vh;\n  display:flex;\n  flex-direction:column;\n}\n\nh1,h2,h3,p,figure {\n  margin:0;\n}\n\na {\n  color:inherit;\n  text-underline-offset:4px;\n}\n\nbutton,select,input {\n  font:inherit;\n  color:inherit;\n}\n\nbutton {\n  cursor:pointer;\n}\n\nbutton:disabled {\n  cursor:default;\n  opacity:.58;\n}\n\n[hidden] {\n  display:none!important;\n}\n\n:focus-visible {\n  outline:2px solid #866726;\n  outline-offset:4px;\n}\n\nh1:focus,main:focus {\n  outline:0;\n}\n\n.skip {\n  position:absolute;\n  left:-200vw;\n  z-index:3;\n  background:var(--paper);\n  padding:8px;\n}\n\n.skip:focus {\n  left:8px;\n}\n\n.mast {\n  color:#f8f5e9;\n  background:#242525;\n  border-bottom:2px solid #a48956;\n}\n\n.mast-inner,main,footer {\n  width:min(1180px,calc(100% - 76px));\n  margin:auto;\n}\n\n.mast-inner {\n  display:flex;\n  align-items:center;\n  min-height:68px;\n  gap:clamp(32px,6vw,84px);\n}\n\n.brand {\n  display:flex;\n  align-items:center;\n  gap:12px;\n  text-decoration:none;\n  font:600 25px/1.2 var(--serif);\n  letter-spacing:.12em;\n}\n\n.mark {\n  height:26px;\n  width:24px;\n  border:1px solid #ddc591;\n  position:relative;\n  display:inline-block;\n}\n\n.mark:before,.mark:after {\n  content:\"\";\n  position:absolute;\n  left:5px;\n  right:5px;\n  height:1px;\n  background:#ddc591;\n  top:8px;\n}\n\n.mark:after {\n  top:15px;\n  right:8px;\n}\n\n.mast nav {\n  align-self:stretch;\n  display:flex;\n  gap:25px;\n}\n\n.mast nav a {\n  color:#cfcec5;\n  display:grid;\n  align-items:center;\n  position:relative;\n  text-decoration:none;\n  font-size:14px;\n}\n\n.mast nav a[aria-current] {\n  color:#fffdf3;\n}\n\n.mast nav a[aria-current]:after {\n  content:\"\";\n  height:2px;\n  background:#d9bd84;\n  position:absolute;\n  bottom:10px;\n  left:0;\n  right:0;\n}\n\n.guide {\n  margin-left:auto;\n  background:transparent;\n  color:#e1ded2;\n  border:0;\n  min-height:42px;\n}\n\n.guide span {\n  display:inline-grid;\n  place-items:center;\n  line-height:1;\n  width:17px;\n  height:17px;\n  border-radius:50%;\n  border:1px solid #b3a181;\n  font-size:11px;\n}\n\nmain {\n  flex:1;\n  padding:clamp(28px,4.2vw,66px) 0 48px;\n}\n\n.page-intro {\n  display:flex;\n  align-items:end;\n  justify-content:space-between;\n  gap:15px;\n  margin-bottom:25px;\n}\n\n.page-intro h1 {\n  font:600 clamp(32px,4.3vw,57px)/1.25 var(--serif);\n  color:#272826;\n  letter-spacing:.025em;\n}\n\n.page-intro p {\n  color:var(--muted);\n  margin-top:9px;\n}\n\n.page-intro .actions,.actions {\n  display:flex;\n  align-items:center;\n  gap:11px;\n  flex-wrap:wrap;\n}\n\n.action {\n  display:inline-flex;\n  align-items:center;\n  justify-content:center;\n  gap:7px;\n  min-height:42px;\n  padding:8px 16px;\n  border:1px solid #c6c2b4;\n  background:var(--paper);\n  color:#34352f;\n  border-radius:5px;\n  text-decoration:none;\n  font-weight:600;\n  font-size:14px;\n}\n\n.action:hover,.icon-btn:hover {\n  border-color:#99865d;\n  background:#eeeade;\n}\n\n.primary {\n  border-color:#a98c54;\n  background:var(--action);\n  color:#29271d;\n}\n\n.primary:hover {\n  background:var(--action-hover);\n  color:#29271d;\n}\n\n.link {\n  border:0;\n  padding:5px 0;\n  background:none;\n  color:var(--graphite);\n  font-size:14px;\n  font-weight:600;\n}\n\n.link:hover {\n  text-decoration:underline;\n}\n\n.entry-grid {\n  display:grid;\n  grid-template-columns:minmax(0,1.62fr) minmax(270px,1fr);\n  gap:20px;\n}\n\n.card {\n  min-width:0;\n  border:1px solid var(--line);\n  background:var(--paper);\n  border-radius:7px;\n}\n\n.import {\n  padding:clamp(20px,2.5vw,32px);\n}\n\nh2 {\n  font:600 23px/1.4 var(--serif);\n  color:#2f302c;\n}\n\n.muted,.sub {\n  color:var(--muted);\n}\n\n.sub {\n  font-size:13px;\n  margin-top:4px;\n}\n\n.file-pair {\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  gap:12px;\n  margin:23px 0 18px;\n}\n\n.file-field {\n  display:block;\n  min-width:0;\n}\n\n.file-field>span:first-child {\n  display:block;\n  color:#3c3d37;\n  font-weight:650;\n  font-size:13px;\n  margin-bottom:6px;\n}\n\n.file-shell {\n  position:relative;\n  display:flex;\n  flex-wrap:wrap;\n  align-items:center;\n  gap:6px 10px;\n  min-height:66px;\n  padding:11px 12px;\n  border:1px dashed #bcb7a7;\n  border-radius:5px;\n  background:#f8f7f2;\n  cursor:pointer;\n}\n\n.file-shell:hover {\n  border-color:var(--graphite);\n}\n\n.file-shell:focus-within {\n  outline:2px solid #866726;\n  outline-offset:2px;\n}\n\n.file-shell input {\n  position:absolute;\n  inset:0;\n  width:100%;\n  height:100%;\n  opacity:0;\n  cursor:pointer;\n}\n\n.file-shell b {\n  font-size:13px;\n  font-weight:600;\n  color:var(--graphite);\n  overflow-wrap:anywhere;\n}\n\n.file-shell small {\n  color:var(--muted);\n  font-size:11px;\n}\n\n.file-icon {\n  display:inline-block;\n  flex:0 0 16px;\n  height:20px;\n  border:1px solid #8b7956;\n  border-radius:2px;\n  position:relative;\n}\n\n.file-icon:after {\n  content:\"\";\n  position:absolute;\n  left:3px;\n  right:3px;\n  bottom:5px;\n  height:1px;\n  background:#8b7956;\n  box-shadow:0 -4px #8b7956;\n}\n\n.import-foot {\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:12px;\n  flex-wrap:wrap;\n  border-top:1px solid var(--line);\n  padding-top:16px;\n}\n\n.specimen {\n  position:relative;\n  overflow:hidden;\n  display:flex;\n  flex-direction:column;\n  justify-content:space-between;\n  gap:19px;\n  border:1px solid #494a44;\n  border-radius:7px;\n  background:linear-gradient(116deg,#292a29,#41423c);\n  color:#f6f4ed;\n  padding:clamp(22px,2.6vw,35px);\n}\n\n.specimen .top {\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:12px;\n}\n\n.specimen h2 {\n  color:#fffaed;\n  font-size:22px;\n}\n\n.specimen small {\n  color:#d0c8b9;\n  font-size:12px;\n}\n\n.amount-pair {\n  display:grid;\n  grid-template-columns:1fr 1fr;\n  gap:10px;\n  border-block:1px solid #ffffff30;\n  padding:15px 0;\n}\n\n.amount-pair>div+div {\n  padding-left:14px;\n  border-left:1px solid #ffffff2e;\n}\n\n.amount-pair span {\n  display:block;\n  color:#d1cfc4;\n  font-size:12px;\n}\n\n.amount-pair strong {\n  color:#efdbb0;\n  font:500 clamp(21px,2.1vw,31px)/1.4 Georgia,serif;\n  font-variant-numeric:tabular-nums;\n  white-space:nowrap;\n}\n\n.specimen p {\n  font-size:13px;\n  color:#ded7c5;\n}\n\n.recent {\n  margin-top:32px;\n}\n\n.section-title {\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:12px;\n  margin-bottom:14px;\n}\n\n.ledger {\n  border-top:2px solid #a38a5b;\n  border-bottom:1px solid var(--line);\n  background:var(--paper);\n}\n\n.job-row {\n  display:grid;\n  grid-template-columns:minmax(0,1.8fr) minmax(100px,.8fr) auto;\n  align-items:center;\n  gap:14px;\n  min-height:58px;\n  padding:11px 16px;\n  text-decoration:none;\n  border-bottom:1px solid #e4e2d7;\n}\n\n.job-row:last-child {\n  border:0;\n}\n\n.job-row:hover {\n  background:#f0eee5;\n}\n\n.job-row strong {\n  display:block;\n  font-size:14px;\n  overflow-wrap:anywhere;\n}\n\n.job-row small,.job-time {\n  color:var(--muted);\n  font-size:12px;\n}\n\n.job-status,.tag {\n  display:inline-block;\n  font-size:12px;\n  font-weight:600;\n  color:#5c4c27;\n  background:#eee8d6;\n  border-radius:3px;\n  padding:2px 7px;\n}\n\n.empty,.pending {\n  padding:25px 18px;\n  color:var(--muted);\n}\n\n.empty p {\n  font-size:13px;\n  margin-top:3px;\n}\n\n.error {\n  margin-top:10px;\n  color:#795613;\n  font-size:14px;\n}\n\n.crumb {\n  margin-bottom:12px;\n  font-size:13px;\n}\n\n.metrics {\n  margin-bottom:22px;\n  display:grid;\n  grid-template-columns:repeat(3,minmax(0,1fr));\n  background:var(--paper);\n  border:1px solid var(--line);\n  border-top:2px solid var(--gold);\n  border-radius:5px;\n}\n\n.metric {\n  min-width:0;\n  padding:16px 22px;\n}\n\n.metric+.metric {\n  border-left:1px solid var(--line);\n}\n\n.metric small {\n  display:block;\n  color:var(--muted);\n  font-size:12px;\n}\n\n.metric strong {\n  display:block;\n  font:600 31px/1.5 var(--serif);\n  font-variant-numeric:tabular-nums;\n  color:var(--graphite);\n}\n\n.metric span {\n  font-size:12px;\n  color:var(--muted);\n}\n\n.filters {\n  display:flex;\n  align-items:center;\n  gap:6px;\n  flex-wrap:wrap;\n  margin:13px 0;\n}\n\n.filter {\n  background:transparent;\n  border:1px solid var(--line);\n  padding:5px 10px;\n  min-height:35px;\n  border-radius:4px;\n  color:var(--muted);\n  font-size:13px;\n}\n\n.filter[aria-pressed=true] {\n  color:#fffdf5;\n  background:var(--graphite);\n  border-color:var(--graphite);\n}\n\n.table-panel {\n  min-width:0;\n  overflow-x:auto;\n  background:var(--paper);\n  border:1px solid var(--line);\n  border-top:2px solid #a38a5b;\n  border-radius:4px;\n}\n\ntable {\n  border-collapse:collapse;\n  width:100%;\n  font-size:13px;\n  text-align:left;\n}\n\nth,td {\n  padding:11px 13px;\n  border-bottom:1px solid #e4e2d7;\n}\n\nth {\n  background:#eeeDE5;\n  font-weight:650;\n  color:var(--muted);\n  white-space:nowrap;\n}\n\ntd {\n  vertical-align:top;\n  overflow-wrap:anywhere;\n}\n\ntd small {\n  display:block;\n  color:var(--muted);\n  font-size:11px;\n}\n\ntd.money {\n  font-variant-numeric:tabular-nums;\n  white-space:nowrap;\n}\n\n.tag.matched {\n  background:#e9eae3;\n  color:#50524c;\n}\n\n.tag.amount,.tag.duplicate {\n  background:#efe4c6;\n  color:#60491e;\n}\n\n.pager,.result-tools {\n  display:flex;\n  justify-content:space-between;\n  align-items:center;\n  gap:10px;\n  flex-wrap:wrap;\n}\n\n.pager {\n  padding:13px 0;\n  font-size:13px;\n  color:var(--muted);\n}\n\n.pager button {\n  background:var(--paper);\n  border:1px solid var(--line);\n  border-radius:4px;\n  padding:4px 9px;\n}\n\n.result-tools input {\n  min-width:0;\n  max-width:100%;\n  background:var(--paper);\n  border:1px solid #c4c1b4;\n  border-radius:5px;\n  padding:6px 9px;\n}\n\n.result-tools label {\n  font-size:13px;\n  color:var(--muted);\n}\n\nfooter {\n  border-top:1px solid var(--line);\n  color:var(--muted);\n  display:flex;\n  flex-wrap:wrap;\n  justify-content:space-between;\n  gap:10px;\n  padding:16px 0;\n  font-size:12px;\n}\n\ndialog {\n  width:min(490px,calc(100vw - 32px));\n  border:1px solid var(--line);\n  border-top:3px solid var(--gold);\n  background:var(--paper);\n  color:var(--ink);\n  border-radius:6px;\n  padding:24px;\n}\n\ndialog::backdrop {\n  background:#18191883;\n}\n\ndialog p {\n  font-size:14px;\n  margin:11px 0;\n}\n\n.icon-btn {\n  border:1px solid var(--line);\n  background:var(--paper);\n  border-radius:4px;\n  min-width:32px;\n  min-height:32px;\n}\n\npre {\n  font:14px/1.65 Consolas,monospace;\n  background:#eeece2;\n  padding:12px;\n  overflow:auto;\n}\n\n.links {\n  display:flex;\n  gap:14px;\n  flex-wrap:wrap;\n  font-size:13px;\n  color:var(--graphite);\n}\n\n.wrap {\n  overflow-wrap:anywhere;\n}\n\n@media(max-width:820px) {\n  .entry-grid {\n    grid-template-columns:minmax(0,1.25fr) minmax(220px,1fr);\n  }\n  .file-pair {\n    grid-template-columns:1fr;\n  }\n  .file-shell {\n    min-height:45px;\n  }\n  .mast-inner,main,footer {\n    width:calc(100% - 40px);\n  }\n  .mast-inner {\n    gap:22px;\n  }\n  .page-intro {\n    align-items:start;\n  }\n  .table-panel table {\n    min-width:680px;\n  }\n}\n\n@media(max-width:600px) {\n  .mast-inner,main,footer {\n    width:calc(100% - 28px);\n  }\n  .mast-inner {\n    min-height:57px;\n    gap:15px;\n  }\n  .mast nav {\n    gap:12px;\n  }\n  .mast nav a,.guide {\n    font-size:12px;\n  }\n  .brand {\n    font-size:20px;\n    gap:6px;\n  }\n  .mark {\n    height:21px;\n    width:19px;\n  }\n  .guide {\n    padding:0;\n  }\n  .guide span {\n    display:none;\n  }\n  .entry-grid {\n    grid-template-columns:1fr;\n    gap:13px;\n  }\n  .page-intro {\n    flex-direction:column;\n    align-items:start;\n    margin-bottom:17px;\n  }\n  .page-intro p {\n    font-size:14px;\n  }\n  .import {\n    padding:16px;\n  }\n  .file-pair {\n    grid-template-columns:repeat(2,minmax(0,1fr));\n    gap:9px;\n    margin:16px 0;\n  }\n  .file-shell {\n    min-height:66px;\n  }\n  .specimen {\n    gap:12px;\n    padding:17px;\n  }\n  .amount-pair {\n    padding:10px 0;\n  }\n  .job-row {\n    grid-template-columns:minmax(0,1fr) auto;\n    padding:9px 12px;\n  }\n  .job-time {\n    grid-column:1/-1;\n    grid-row:2;\n  }\n  .metric {\n    padding:11px 8px;\n  }\n  .metric strong {\n    font-size:24px;\n  }\n  .metrics {\n    margin-bottom:18px;\n  }\n  .recent {\n    margin-top:22px;\n  }\n  .result-tools {\n    align-items:start;\n  }\n  .result-tools input {\n    width:150px;\n  }\n  .guide {\n    white-space:nowrap;\n  }\n}\n\n.scroll-hint {\n  display:none;\n}\n\n@media(max-width:720px) {\n  .scroll-hint {\n    display:block;\n    color:var(--muted);\n    margin:0 0 6px;\n    font-size:12px;\n  }\n}\n\n.tag.invalid {\n  background:#44443e;\n  color:#fffdfa;\n}\n\n::selection {\n  background:#ead8ad;\n  color:#282923;\n}\n\n.row-review {\n  display:block;\n  color:#655028;\n  background:transparent;\n  border:0;\n  padding:6px 0 1px;\n  font-weight:650;\n  font-size:13px;\n  white-space:nowrap;\n}\n.row-review:hover,.raw-lines summary:hover,.older-reviews summary:hover {\n  text-decoration:underline;\n  text-underline-offset:3px;\n}\n.review-panel {\n  padding:0;\n  width:min(690px,calc(100vw - 28px));\n  max-height:min(88vh,900px);\n  max-height:min(88dvh,900px);\n  border-radius:8px;\n  overflow:auto;\n  overscroll-behavior:contain;\n}\n.review-head,.review-section,.review-actions,.raw-pages {\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:12px;\n}\n.review-head {\n  background:var(--graphite);\n  color:var(--paper);\n  padding:16px 24px;\n}\n.review-head h2 {color:var(--paper);font-size:25px}\n.review-head small {color:#e2d2af;font-size:12px}\n.review-head .action {\n  color:var(--paper);\n  background:transparent;\n  border-color:#847e70;\n}\n.review-head .action:hover {background:#4b4a43}\n.review-content {padding:18px 24px 22px}\n.review-key {\n  font:600 25px/1.3 var(--serif);\n  overflow-wrap:anywhere;\n}\n.review-key span {font:13px var(--sans);color:var(--muted);margin-left:9px}\n.review-note,.review-panel .legacy-source {color:var(--muted);font-size:13px;margin:5px 0 10px}\n.source-pair,.review-fields {\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  gap:12px;\n}\n.source-pair {\n  border-block:1px solid var(--line);\n  background:#f4f2ea;\n  padding:11px 13px;\n}\n.source-pair>section {min-width:0}\n.source-pair>section+section {padding-left:13px;border-left:1px solid var(--line)}\n.source-pair>section>small,.source-pair>section>span {\n  display:block;font-size:12px;color:var(--muted);\n}\n.source-pair>section>strong {\n  display:block;font:600 22px/1.45 var(--serif);margin:2px 0 4px;\n  overflow-wrap:anywhere;font-variant-numeric:tabular-nums;\n}\n.source-location {overflow-wrap:anywhere}\n.raw-lines,.older-reviews {font-size:13px;margin-top:6px}\n.raw-lines summary,.older-reviews summary {cursor:pointer;color:#69532b;font-weight:600}\n.raw-list section {padding:6px 0;border-top:1px solid var(--line)}\n.raw-list section:first-child {margin-top:6px}\n.raw-list dl,.raw-list dd,.review-entry dl,.review-entry dd {margin:0}\n.raw-list dl div {display:flex;gap:6px}\n.raw-list dt {color:var(--muted);flex:0 0 auto}\n.raw-list dd,.review-entry dd {overflow-wrap:anywhere;white-space:pre-wrap}\n.raw-pages {justify-content:start;gap:5px;flex-wrap:wrap;font-size:11px}\n.raw-pages button {\n  border:1px solid var(--line);border-radius:3px;background:var(--paper);padding:3px 6px;\n}\n.review-ledger {margin-top:17px}\n.review-section h3 {font:600 19px/1.4 var(--serif)}\n.review-section .link {color:#69532b}\n.review-panel .no-review {font-size:
