<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify API regression lab\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build:demo\n      - run: node scripts/gate.mjs --candidate candidate-b > report.json\n      - uses: actions/upload-artifact@v4\n        with:\n          name: sample-regression-report\n          path: report.json\n","group":"配置与启动"},{"path":".gitignore","text":"node_modules/\ndist/\n*.log\n.DS_Store\nThumbs.db\n","group":"配置与启动"},{"path":"README.md","text":"# 接口回归验收台\n\n用同一组电商订单接口请求验证两个版本。在发布前检查 HTTP 状态、必填字段、字段类型和稳定的业务值。报告能定位到具体的 JSON 路径，保留基线与候选两份响应，区分阻断发布的差异、兼容变更和可忽略字段。\n\n[打开公开验收台](https://fate788.github.io/personal-blog/demos/apiregression/index.html) · [博客作品页](https://fate788.github.io/personal-blog/projects/apiregression/index.html)\n\n![接口回归验收台实屏](docs/preview.webp)\n\n## 体验一次发布验收\n\n1. 用订单服务 `1.8.0` 对照 `1.8.1-rc.1`。打开订单详情用例，查看两边同为 HTTP 200 时，`$.data.amountCents` 为什么从数值变成了字符串，以及它会影响哪里。\n2. 切换到修订后的 `1.8.1-rc.2` 并重新运行。确认必须保留的契约都通过，新增字段仍有记录。\n3. 导出报告，复查同一字段在基线版和候选版中的具体值。\n\n## 启动与命令行验收\n\n需要 Node.js 20 或以上，无需安装依赖。Windows 可双击 `start-regression.cmd`，也可在项目目录运行：\n\n```sh\nnode server.mjs\nnpm test\nnpm run build:demo\n```\n\n本机工作台地址为 [127.0.0.1:8824](http://127.0.0.1:8824/)。在本机运行时，工作台发送实际 HTTP 请求到同进程里的样例订单服务。公开演示和便携 HTML 使用同样的验收逻辑与固定响应。在 `dist/index.html` 可以离线复跑。\n\n命令行会自动启动临时本机订单服务，执行对应版本的同一套验收并输出 JSON，运行结束后释放端口。GitHub Actions 用这条命令生成样例报告。\n\n```sh\nnode scripts/gate.mjs --candidate candidate-a > blocked.json\nnode scripts/gate.mjs --candidate candidate-b > passed.json\n```\n\n退出码 `0` 代表验收通过，`1` 代表发现阻断项，`2` 代表参数或执行失败。演示数据是虚构订单。用例、两版响应和协议检查字段都可在 `fixtures.mjs` 核对。\n\n设计参考了批量运行请求和把接口兼容性结论用于发布流程的做法。 [Postman 请求集合运行](https://learning.postman.com/docs/tests-and-scripts/running-collections/intro-to-collection-runs/) · [Pact Can I Deploy](https://docs.pact.io/pact_broker/can_i_deploy)\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 接口回归验收台 v1.0 源码包\n\n原始发布归档为 `接口回归验收台-v1.0.zip`。压缩包保留其中 18 份文本文件的原始路径与字节，本文件为导出说明。\n\n需要 Node.js 20 或以上。运行 node server.mjs 或双击 start-regression.cmd。命令行和 CI 可执行 node scripts/gate.mjs --candidate candidate-b。\n","group":"项目说明"},{"path":"engine.mjs","text":"function kind(value) {\n  if (Array.isArray(value)) return \"array\";\n  return value === null ? \"null\" : typeof value;\n}\n\nfunction findPropertyPath(path, key) {\n  return /^[A-Za-z_$][A-Za-z0-9_$]*$/u.test(key) ? `${path}.${key}` : `${path}[${JSON.stringify(key)}]`;\n}\n\nfunction pathRule(contract, name, path, pattern) {\n  const rules = contract[name] || [];\n  return rules.includes(path) || rules.includes(pattern);\n}\n\nfunction addFinding(findings, level, code, path, message, expected, actual) {\n  findings.push({kind: level, code, path, message, expected: structuredClone(expected), actual: structuredClone(actual)});\n}\n\nfunction inspectValue(before, after, path, pattern, result) {\n  if (Object.is(before, after)) return;\n  const {contract, findings, ignored} = result;\n  if (pathRule(contract, \"ignorePaths\", path, pattern)) {\n    // Fixture values are JSON. Ignore duplicate copies of unchanged objects as well as scalars.\n    if (JSON.stringify(before) !== JSON.stringify(after)) ignored.push({path, message: \"动态字段按契约忽略。\"});\n    return;\n  }\n\n  const expectedType = kind(before);\n  const actualType = kind(after);\n  if (expectedType !== actualType) {\n    if (expectedType === \"null\" || actualType === \"null\") {\n      const expected = contract.nullableTypes?.[path] ?? contract.nullableTypes?.[pattern];\n      if (expected && (expectedType === \"null\" ? actualType : expectedType) === expected) {\n        addFinding(findings, \"change\", \"NULLABLE_VALUE_CHANGED\", path, \"可空字段已更新。\", before, after);\n        return;\n      }\n    }\n    addFinding(findings, \"blocker\", \"TYPE_CHANGED\", path, `字段类型由 ${expectedType} 变为 ${actualType}。`, before, after);\n    return;\n  }\n\n  if (expectedType === \"array\") {\n    if (before.length !== after.length) {\n      addFinding(findings, \"blocker\", \"ARRAY_LENGTH_CHANGED\", path, \"固定案例中的数组元素数量发生变化。\", before.length, after.length);\n    }\n    for (let index = 0; index \u003c Math.min(before.length, after.length); index++) {\n      inspectValue(before[index], after[index], `${path}[${index}]`, `${pattern}[*]`, result);\n    }\n  } else if (expectedType === \"object\") {\n    for (const [key, value] of Object.entries(before)) {\n      const child = findPropertyPath(path, key);\n      const childPattern = findPropertyPath(pattern, key);\n      if (Object.hasOwn(after, key)) {\n        inspectValue(value, after[key], child, childPattern, result);\n      } else if (pathRule(contract, \"ignorePaths\", child, childPattern)) {\n        ignored.push({path: child, message: \"动态字段按契约忽略。\"});\n      } else if (pathRule(contract, \"optionalPaths\", child, childPattern)) {\n        addFinding(findings, \"change\", \"OPTIONAL_FIELD_REMOVED\", child, \"可选字段已省略。\", value, undefined);\n      } else {\n        addFinding(findings, \"blocker\", \"FIELD_MISSING\", child, \"候选响应缺少基线的必需字段。\", value, undefined);\n      }\n    }\n    for (const [key, value] of Object.entries(after)) {\n      if (Object.hasOwn(before, key)) continue;\n      const child = findPropertyPath(path, key);\n      if (pathRule(contract, \"ignorePaths\", child, findPropertyPath(pattern, key))) ignored.push({path: child, message: \"动态字段按契约忽略。\"});\n      else addFinding(findings, \"change\", \"FIELD_ADDED\", child, \"候选响应新增字段，原有字段仍受校验。\", undefined, value);\n    }\n  } else if (pathRule(contract, \"allowValuePaths\", path, pattern)) {\n    addFinding(findings, \"change\", \"ALLOWED_VALUE_CHANGED\", path, \"此字段允许改值，类型仍需兼容。\", before, after);\n  } else {\n    addFinding(findings, \"blocker\", \"STABLE_VALUE_CHANGED\", path, \"固定案例中的业务值发生变化。\", before, after);\n  }\n}\n\nfunction snapshot(responses, id) {\n  return responses && Object.hasOwn(responses, id) ? responses[id] : null;\n}\n\nfunction isResponse(value) {\n  return Number.isInteger(value?.status) && value.status >= 100 && value.status \u003c= 599 &&\n    Object.hasOwn(value, \"body\") && value.body !== undefined;\n}\n\nfunction inspectCase(testCase, baselineResponses, candidateResponses) {\n  const baseline = snapshot(baselineResponses, testCase.id);\n  const candidate = snapshot(candidateResponses, testCase.id);\n  const findings = [];\n  const ignored = [];\n  if (!isResponse(baseline) || !isResponse(candidate)) {\n    const unavailable = [!isResponse(baseline) && \"基线\", !isResponse(candidate) && \"候选\"].filter(Boolean).join(\"及\");\n    addFinding(findings, \"blocker\", \"RESPONSE_MISSING\", \"$\", `${unavailable}响应无法用于验收。`, undefined, undefined);\n  } else {\n    if (baseline.status !== candidate.status) {\n      addFinding(findings, \"blocker\", \"HTTP_STATUS_CHANGED\", \"HTTP 状态\", \"候选响应的 HTTP 状态码与基线不同。\", baseline.status, candidate.status);\n    }\n    inspectValue(baseline.body, candidate.body, \"$\", \"$\", {contract: testCase.contract || {}, findings, ignored});\n  }\n  const bestAvailable = (response) => isResponse(response) ? structuredClone(response) : {status: null, body: null};\n  return {id: testCase.id, title: testCase.title, group: testCase.group,\n    method: testCase.method, path: testCase.path, description: testCase.description,\n    verdict: findings.some(({kind}) => kind === \"blocker\") ? \"blocked\" : \"passed\",\n    baseline: bestAvailable(baseline), candidate: bestAvailable(candidate), findings, ignored};\n}\n\nexport function evaluateRelease({suite, baseline, candidate, baselineResponses, candidateResponses}) {\n  const cases = suite.cases.map((testCase) => inspectCase(testCase, baselineResponses, candidateResponses));\n  const blocked = cases.filter(({verdict}) => verdict === \"blocked\").length;\n  const changes = cases.reduce((total, entry) => total + entry.findings.filter(({kind}) => kind === \"change\").length, 0);\n  const ignored = cases.reduce((total, entry) => total + entry.ignored.length, 0);\n  return {suiteId: suite.id, suiteTitle: suite.title, baseline, candidate,\n    verdict: blocked ? \"blocked\" : \"passed\", totals: {cases: cases.length, passed: cases.length - blocked, blocked, changes, ignored}, cases};\n}\n","group":"后端"},{"path":"fixtures.mjs","text":"export const releases = [\n  {id: \"baseline\", label: \"订单服务 1.8.0\", description: \"线上兼容基线，订单查询、创建及售后流程。\"},\n  {id: \"candidate-a\", label: \"订单服务 1.8.1-rc.1\", description: \"首次候选版，调整金额、订单明细及异常响应。\"},\n  {id: \"candidate-b\", label: \"订单服务 1.8.1-rc.2\", description: \"修订后的候选版，保留原有契约并新增可选信息。\"},\n];\n\nconst sharedIgnore = [\"$.meta.requestId\", \"$.meta.servedAt\"];\n\nfunction testCase(id, title, group, method, path, description, rules = {}, requestBody) {\n  return {id, title, group, method, path, description, requestBody, contract: {...rules, ignorePaths: sharedIgnore}};\n}\n\nexport const suite = {\n  id: \"partner-order-api\",\n  title: \"合作方订单 API 回归套件\",\n  subject: \"零售订单服务 · 合作方集成\",\n  cases: [\n    testCase(\"order-detail\", \"查询订单详情\", \"订单读取\", \"GET\", \"/v1/orders/ORD-7821\",\n      \"合作方使用整数分对账，订单 ID、币种与金额含义必须稳定。\"),\n    testCase(\"order-list\", \"分页读取订单\", \"订单读取\", \"GET\", \"/v1/orders?limit=2\",\n      \"合作方维护每个 SKU 的库存，列表元素的商品数量及分页游标参与校验。\"),\n    testCase(\"order-summary\", \"读取订单统计\", \"订单读取\", \"GET\", \"/v1/orders/summary\",\n      \"核心计数保持稳定，展示标题可调整。弃用的看板链接可以缺省。\",\n      {allowValuePaths: [\"$.data.displayLabel\"], optionalPaths: [\"$.data.legacyReportLink\"]}),\n    testCase(\"empty-order-list\", \"查询无结果订单\", \"订单读取\", \"GET\", \"/v1/orders?status=REJECTED\",\n      \"查不到记录时保留空数组和空游标，客户端可以继续迭代列表。\"),\n    testCase(\"create-order\", \"创建一笔合作方订单\", \"订单写入\", \"POST\", \"/v1/orders\",\n      \"客户端用 HTTP 201 区分创建成功。创建回执中的订单号和金额仍须可读。\", {},\n      {partnerOrderId: \"PO-DEMO-801\", sku: \"LT-301\", quantity: 2}),\n    testCase(\"cancel-order\", \"取消待发货订单\", \"订单写入\", \"POST\", \"/v1/orders/ORD-7822/cancel\",\n      \"调用端只有收到 CANCELLED 才会关闭订单和释放后续作业。\", {}, {reason: \"CUSTOMER_REQUEST\"}),\n    testCase(\"shipment\", \"查询发货信息\", \"履约售后\", \"GET\", \"/v1/orders/ORD-7821/shipment\",\n      \"承运商与运单码供合作方展示和查询，新的通知方式可选。\"),\n    testCase(\"refunds\", \"读取退款记录\", \"履约售后\", \"GET\", \"/v1/orders/ORD-7822/refunds\",\n      \"对已完成的历史退款补齐到账时间。旧记录允许 null，新值必须是字符串，金额仍按整数分读取。\",\n      {nullableTypes: {\"$.data.refunds[*].settledAt\": \"string\"}, allowValuePaths: [\"$.data.refunds[*].settledAt\"]}),\n    testCase(\"order-not-found\", \"读取不存在的订单\", \"异常兼容\", \"GET\", \"/v1/orders/ORD-9999\",\n      \"调用端根据 404 与业务错误码展示订单不存在。错误文字可调整。\",\n      {allowValuePaths: [\"$.error.message\"]}),\n    testCase(\"invalid-order\", \"拒绝数量无效的订单\", \"异常兼容\", \"POST\", \"/v1/orders/validation-demo\",\n      \"HTTP 422、业务错误码及具体字段用于保留订单表单错误提示。\", {},\n      {partnerOrderId: \"PO-DEMO-802\", sku: \"LT-301\", quantity: 0}),\n  ],\n};\n\nconst original = {\n  \"order-detail\": {status: 200, body: {data: {id: \"ORD-7821\", partnerOrderId: \"PO-DEMO-800\", status: \"SHIPPED\",\n    amountCents: 29900, currency: \"CNY\", items: [{sku: \"LT-301\", name: \"显示器挂灯 Pro\", quantity: 1, unitPriceCents: 29900}]}}},\n  \"order-list\": {status: 200, body: {data: {orders: [\n    {id: \"ORD-7821\", amountCents: 29900, items: [{sku: \"LT-301\", quantity: 1}]},\n    {id: \"ORD-7822\", amountCents: 33800, items: [{sku: \"LT-302\", quantity: 2}]},\n  ], nextCursor: \"ORD-7822\"}}},\n  \"order-summary\": {status: 200, body: {data: {total: 12, open: 4, currency: \"CNY\", displayLabel: \"订单概览\", legacyReportLink: \"/reports/orders\"}}},\n  \"empty-order-list\": {status: 200, body: {data: {orders: [], nextCursor: null}}},\n  \"create-order\": {status: 201, body: {data: {id: \"ORD-7823\", partnerOrderId: \"PO-DEMO-801\", status: \"OPEN\", amountCents: 59800}}},\n  \"cancel-order\": {status: 200, body: {data: {id: \"ORD-7822\", status: \"CANCELLED\", reversalQueued: true}}},\n  \"shipment\": {status: 200, body: {data: {orderId: \"ORD-7821\", carrier: \"华辰快运\", trackingCode: \"DEMO-88209738\", delivered: false}}},\n  \"refunds\": {status: 200, body: {data: {orderId: \"ORD-7822\", refunds: [{id: \"RF-0441\", amountCents: 33800, status: \"SETTLED\", settledAt: null}]}}},\n  \"order-not-found\": {status: 404, body: {error: {code: \"ORDER_NOT_FOUND\", message: \"订单不存在\"}}},\n  \"invalid-order\": {status: 422, body: {error: {code: \"INVALID_ORDER\", message: \"订单数量不正确\", fields: [{field: \"quantity\", reason: \"MINIMUM_1\"}]}}},\n};\n\nconst compatibleChanges = {\n  shipment: (response) => { response.body.data.notificationChannel = \"APP\"; },\n  \"order-summary\": (response) => {\n    response.body.data.displayLabel = \"订单总览\";\n    delete response.body.data.legacyReportLink;\n  },\n  \"order-not-found\": (response) => { response.body.error.message = \"未找到此订单，请核对编号\"; },\n  refunds: (response) => { response.body.data.refunds[0].settledAt = \"2026-11-26T02:49:00Z\"; },\n};\n\nconst incompatibleChanges = {\n  \"order-detail\": (response) => { response.body.data.amountCents = \"29900\"; },\n  \"order-list\": (response) => { delete response.body.data.orders[1].items[0].quantity; },\n  \"create-order\": (response) => { response.status = 200; },\n  \"cancel-order\": (response) => { response.body.data.status = \"CANCEL_PENDING\"; },\n  \"invalid-order\": (response) => { response.body.error.fields = null; },\n};\n\nexport function getFixtureResponse(releaseId, caseId) {\n  const releaseIndex = releases.findIndex(({id}) => id === releaseId);\n  if (releaseIndex \u003c 0 || !Object.hasOwn(original, caseId)) throw new RangeError(\"未找到版本或固定验收用例。\");\n  const response = structuredClone(original[caseId]);\n  const caseIndex = suite.cases.findIndex(({id}) => id === caseId) + 1;\n  response.body.meta = {\n    requestId: `demo-${releaseIndex + 1}-${String(caseIndex).padStart(2, \"0\")}`,\n    servedAt: `2026-11-27T0${releaseIndex + 1}:15:00Z`,\n  };\n  if (releaseIndex > 0 && Object.hasOwn(compatibleChanges, caseId)) compatibleChanges[caseId](response);\n  if (releaseIndex === 1 && Object.hasOwn(incompatibleChanges, caseId)) incompatibleChanges[caseId](response);\n  return response;\n}\n","group":"数据与样例"},{"path":"package.json","text":"{\n  \"name\": \"api-regression-lab\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": { \"node\": \">=20\" },\n  \"scripts\": {\n    \"start\": \"node server.mjs\",\n    \"test\": \"node --test tests/*.test.mjs\",\n    \"gate\": \"node scripts/gate.mjs\",\n    \"build:demo\": \"node portable/build.mjs\"\n  }\n}\n","group":"配置与启动"},{"path":"portable/build.mjs","text":"import { mkdir, readFile, writeFile } from \"node:fs/promises\";\nimport { dirname, resolve } from \"node:path\";\n\nconst output = resolve(process.argv[2] || \"dist/index.html\");\nconst read = (path) => readFile(new URL(path, import.meta.url), \"utf8\");\nconst moduleUrl = (source) => \"data:text/javascript;base64,\" + Buffer.from(source.replaceAll(\"\\r\\n\", \"\\n\")).toString(\"base64\");\nconst [engine, fixtures, embeddedTransport, app, css, html] = await Promise.all([\n  read(\"../engine.mjs\"), read(\"../fixtures.mjs\"), read(\"transport.mjs\"), read(\"../static/app.mjs\"),\n  read(\"../static/styles.css\"), read(\"../static/index.html\")\n]);\n\nfunction replaceImport(source, path, url) {\n  return source.replaceAll(`\"${path}\"`, `\"${url}\"`).replaceAll(`'${path}'`, `'${url}'`);\n}\n\nconst engineUrl = moduleUrl(engine);\nconst fixturesUrl = moduleUrl(fixtures);\nconst inlineShared = source => replaceImport(replaceImport(source, \"../engine.mjs\", engineUrl), \"../fixtures.mjs\", fixturesUrl);\nconst transportUrl = moduleUrl(inlineShared(embeddedTransport));\nconst appUrl = moduleUrl(replaceImport(inlineShared(app), \"./transport.mjs\", transportUrl));\nconst stylesheet = /\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css[\"'][^>]*>/iu;\nconst script = /\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs[\"'][^>]*>\\s*\u003c\\/script>/iu;\nconst policy = \"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\nif (!stylesheet.test(html) || !script.test(html)) throw new Error(\"缺少工作台的 HTML 入口。\");\n\nconst portable = html.replace(\"\u003chead>\", `\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(stylesheet, () => `\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(script, () => `\u003cscript type=\"module\" src=\"${appUrl}\">\u003c/script>`);\nawait mkdir(dirname(output), { recursive: true });\nawait writeFile(output, portable.replaceAll(\"\\r\\n\", \"\\n\"), \"utf8\");\nconsole.log(`已生成便携式接口回归验收台 ${output}`);\n","group":"配置与启动"},{"path":"portable/transport.mjs","text":"import { evaluateRelease } from \"../engine.mjs\";\nimport { getFixtureResponse, releases, suite } from \"../fixtures.mjs\";\n\nexport const executionMode = \"embedded\";\n\nfunction collectResponses(release) {\n  return Object.fromEntries(suite.cases.map(({ id }) => [id, getFixtureResponse(release.id, id)]));\n}\n\nexport async function runRegression(candidateReleaseId, { signal } = {}) {\n  if (signal?.aborted) throw signal.reason;\n  const baseline = releases.find(release => release.id === \"baseline\");\n  const candidate = releases.find(release => release.id === candidateReleaseId && release.id !== \"baseline\");\n  if (!candidate) throw new RangeError(\"请选择有效的候选版本。\");\n  return evaluateRelease({ suite, baseline, candidate, baselineResponses: collectResponses(baseline),\n    candidateResponses: collectResponses(candidate) });\n}\n","group":"前端"},{"path":"scripts/gate.mjs","text":"import { once } from \"node:events\";\nimport { parseArgs } from \"node:util\";\nimport { releases } from \"../fixtures.mjs\";\nimport { startServer } from \"../server.mjs\";\nimport { runRegression } from \"../static/transport.mjs\";\n\nlet service;\ntry {\n  const { values } = parseArgs({ options: { candidate: { type: \"string\" } } });\n  const candidates = releases.filter(release => release.id !== \"baseline\");\n  if (!candidates.some(release => release.id === values.candidate)) {\n    throw new Error(`请用 --candidate 选择候选版本（${candidates.map(release => release.id).join(\" / \")}）。`);\n  }\n  service = startServer({ port: 0 });\n  await once(service, \"listening\");\n  const port = service.address().port;\n  const report = await runRegression(values.candidate, {\n    origin: `http://127.0.0.1:${port}`,\n    signal: AbortSignal.timeout(15000)\n  });\n  if (![\"passed\", \"blocked\"].includes(report.verdict)) throw new Error(\"无法识别回归报告的结论。\");\n  process.stdout.write(JSON.stringify(report, null, 2) + \"\\n\");\n  process.exitCode = report.verdict === \"passed\" ? 0 : 1;\n} catch (error) {\n  process.stderr.write(`接口验收执行失败。${error.message}\\n`);\n  process.exitCode = 2;\n} finally {\n  if (service) await new Promise(resolve => service.close(resolve));\n}\n","group":"配置与启动"},{"path":"server.mjs","text":"import { readFile } from \"node:fs/promises\";\nimport { createServer } from \"node:http\";\nimport { resolve } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport { isDeepStrictEqual, parseArgs } from \"node:util\";\nimport { getFixtureResponse, releases, suite } from \"./fixtures.mjs\";\n\nconst siteFiles = new Map([\n  [\"/\", \"static/index.html\"], [\"/index.html\", \"static/index.html\"], [\"/app.mjs\", \"static/app.mjs\"],\n  [\"/styles.css\", \"static/styles.css\"], [\"/transport.mjs\", \"static/transport.mjs\"],\n  [\"/engine.mjs\", \"engine.mjs\"], [\"/fixtures.mjs\", \"fixtures.mjs\"],\n  [\"/static/index.html\", \"static/index.html\"], [\"/static/app.mjs\", \"static/app.mjs\"],\n  [\"/static/styles.css\", \"static/styles.css\"], [\"/static/transport.mjs\", \"static/transport.mjs\"]\n]);\nconst types = { html: \"text/html; charset=utf-8\", css: \"text/css; charset=utf-8\", mjs: \"text/javascript; charset=utf-8\" };\nconst policy = \"default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'\";\nconst maxBodyBytes = 16_384;\nconst fixturePaths = new Map();\nfor (const release of releases) {\n  for (const testCase of suite.cases) {\n    const path = `/fixtures/${release.id}${testCase.path}`;\n    if (!fixturePaths.has(path)) fixturePaths.set(path, new Map());\n    const methods = fixturePaths.get(path);\n    if (methods.has(testCase.method)) throw new Error(`${testCase.method} ${path} 样例重复。`);\n    methods.set(testCase.method, { release, testCase });\n  }\n}\n\nfunction reply(response, status, body, type, head = false) {\n  const noContent = [204, 205, 304].includes(status);\n  response.writeHead(status, {\n    \"Content-Type\": type,\n    ...(noContent ? {} : { \"Content-Length\": Buffer.byteLength(body) }),\n    \"Cache-Control\": \"no-store\",\n    \"X-Content-Type-Options\": \"nosniff\",\n    \"Content-Security-Policy\": policy\n  });\n  response.end(head || noContent ? undefined : body);\n}\n\nfunction json(response, status, value, head = false) {\n  reply(response, status, JSON.stringify(value), \"application/json; charset=utf-8\", head);\n}\n\nfunction inputError(status, message) {\n  return Object.assign(new Error(message), { status });\n}\n\nfunction readBody(request) {\n  return new Promise((accept, reject) => {\n    const chunks = [];\n    let size = 0;\n    request.on(\"data\", chunk => {\n      size += chunk.length;\n      if (size \u003c= maxBodyBytes) chunks.push(chunk);\n      else reject(inputError(413, \"请求体超过样例上限。\"));\n    });\n    request.once(\"end\", () => accept(Buffer.concat(chunks).toString(\"utf8\")));\n    request.once(\"error\", reject);\n  });\n}\n\nasync function verifyFixtureBody(request, expected) {\n  const raw = await readBody(request);\n  if (expected === undefined && !raw) return;\n  if (!/^application\\/json\\s*(?:;|$)/iu.test(request.headers[\"content-type\"] || \"\")) {\n    throw inputError(415, \"样例请求体需要使用 JSON。\");\n  }\n  let input;\n  try {\n    input = JSON.parse(raw);\n  } catch {\n    throw inputError(400, \"无法解析样例请求体。\");\n  }\n  if (!isDeepStrictEqual(input, expected)) throw inputError(400, \"请求体需要与固定样例一致。\");\n}\n\nexport function startServer({ port = 8824 } = {}) {\n  const server = createServer(async (request, response) => {\n    const head = request.method === \"HEAD\";\n    const address = server.address();\n    const host = request.headers.host?.toLowerCase();\n    try {\n      if (![ `127.0.0.1:${address.port}`, `localhost:${address.port}` ].includes(host)) {\n        throw inputError(403, \"该服务仅供本机演练使用。\");\n      }\n      const source = request.headers.origin;\n      if (source && source !== `http://${host}`) throw inputError(403, \"样例请求需要来自同源工作台。\");\n      if (!request.url?.startsWith(\"/\") || request.url.startsWith(\"//\")) throw inputError(400, \"样例地址无效。\");\n      const url = new URL(request.url, `http://${host}`);\n      if (url.origin !== `http://${host}` || url.hash) throw inputError(400, \"样例地址无效。\");\n\n      if (url.pathname.startsWith(\"/fixtures/\")) {\n        const methods = fixturePaths.get(url.pathname + url.search);\n        if (!methods) throw inputError(404, \"未找到该样例接口。\");\n        const scenario = methods.get(request.method);\n        if (!scenario) {\n          response.setHeader(\"Allow\", [...methods.keys()].join(\", \"));\n          throw inputError(405, \"该方法不在样例中。\");\n        }\n        const { release, testCase } = scenario;\n        await verifyFixtureBody(request, testCase.requestBody);\n        const fixture = getFixtureResponse(release.id, testCase.id);\n        response.setHeader(\"X-Regression-Fixture\", testCase.id);\n        json(response, fixture.status, fixture.body);\n        return;\n      }\n      if (request.method !== \"GET\" && !head) {\n        response.setHeader(\"Allow\", \"GET, HEAD\");\n        throw inputError(405, \"静态页面仅支持读取。\");\n      }\n      const file = siteFiles.get(url.pathname);\n      if (!file) throw inputError(404, \"页面不存在。\");\n      const body = await readFile(new URL(file, import.meta.url));\n      reply(response, 200, body, types[file.split(\".\").at(-1)], head);\n    } catch (error) {\n      switch (true) {\n        case Boolean(error.status): json(response, error.status, { error: error.message }, head); break;\n        case error.code === \"ENOENT\": json(response, 404, { error: \"页面不存在。\" }, head); break;\n        case error.code === \"ERR_INVALID_URL\": json(response, 400, { error: \"样例地址无效。\" }, head); break;\n        default:\n          console.error(error);\n          json(response, 500, { error: \"样例服务暂时不可用。\" }, head);\n      }\n    }\n  });\n  return server.listen(port, \"127.0.0.1\");\n}\n\nif (process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {\n  const { values } = parseArgs({ options: { port: { type: \"string\", default: \"8824\" } } });\n  const port = Number(values.port);\n  if (!/^\\d{1,5}$/u.test(values.port) || port > 65535) throw new Error(\"端口应为 0 至 65535。\");\n  const server = startServer({ port });\n  server.on(\"listening\", () => console.log(`接口回归验收台 http://127.0.0.1:${server.address().port}/`));\n}\n","group":"后端"},{"path":"start-regression.cmd","text":"@echo off\ncd /d \"%~dp0\"\nnode server.mjs\nexit /b %errorlevel%\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import { releases, suite } from \"../fixtures.mjs\";\nimport { executionMode, runRegression } from \"./transport.mjs\";\n\nconst byId = id => document.getElementById(id);\nconst baseline = releases.find(release => release.id === \"baseline\");\nconst candidates = releases.filter(release => release.id !== baseline.id);\nconst summary = byId(\"run-summary\");\nconst runButton = byId(\"run-suite\");\nconst exportButton = byId(\"export-report\");\nconst workspace = byId(\"workspace\");\nconst list = byId(\"case-list\");\nconst detail = byId(\"case-detail\");\nconst params = new URLSearchParams(location.search);\nlet candidateId = candidates.find(release => release.id === (params.get(\"candidate\") || params.get(\"release\")))?.id ?? candidates[0].id;\nlet filter = \"all\";\nlet currentCase = params.get(\"case\") || \"\";\nlet currentPath = \"\";\nlet report;\nlet running = false;\n\nconst escaped = value => String(value ?? \"\").replace(/[&\u003c>\"']/gu, character => ({\n  \"&\":\"&amp;\", \"\u003c\":\"&lt;\", \">\":\"&gt;\", '\"':\"&quot;\", \"'\":\"&#39;\"\n})[character]);\nconst versionNumber = release => release.label.split(\" \").at(-1);\n\nfunction releaseControls() {\n  byId(\"product-area\").textContent = suite.subject;\n  const label = byId(\"execution-label\");\n  label.textContent = executionMode === \"http\" ? \"本地 HTTP 样例服务\" : \"浏览器样例环境\";\n  label.hidden = false;\n  byId(\"baseline-version\").innerHTML = `\u003cspan>基线版本\u003c/span>\u003cstrong>${escaped(versionNumber(baseline))}\u003c/strong>`;\n  byId(\"candidate-version\").innerHTML = `\u003cdiv>\u003cspan class=\"release-label\" id=\"candidate-label\">候选版本\u003c/span>\n    \u003cdiv role=\"group\" class=\"release-buttons\" aria-labelledby=\"candidate-label\">${candidates.map(release =>\n      `\u003cbutton type=\"button\" data-candidate=\"${escaped(release.id)}\" aria-pressed=\"${release.id === candidateId}\"${running ? \" disabled\" : \"\"}>${escaped(versionNumber(release))}\u003c/button>`\n    ).join(\"\")}\u003c/div>\u003c/div>\u003cp>${escaped(candidates.find(release => release.id === candidateId).description)}\u003c/p>`;\n}\n\nfunction counts(result) {\n  const blocked = result.verdict === \"blocked\";\n  const {totals} = result;\n  return `\u003cdiv class=\"verdict-heading${blocked ? \" block\" : \" pass\"}\">\u003cspan class=\"verdict-mark\" aria-hidden=\"true\">${blocked ? \"!\" : \"✓\"}\u003c/span>\n    \u003cdiv>\u003ch2>${blocked ? \"发布阻断\" : \"验收通过\"}\u003c/h2>\u003cp>基线 ${escaped(versionNumber(result.baseline))} \u003cspan aria-hidden=\"true\">→\u003c/span> 候选 ${escaped(versionNumber(result.candidate))}\u003c/p>\u003c/div>\u003c/div>\n    \u003cdl class=\"summary-counts\">\u003cdiv>\u003cdt>验收用例\u003c/dt>\u003cdd>${totals.cases}\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>阻断\u003c/dt>\u003cdd class=\"${blocked ? \"warning-text\" : \"\"}\">${totals.blocked}\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>通过\u003c/dt>\u003cdd>${totals.passed}\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>兼容变化\u003c/dt>\u003cdd>${totals.changes}\u003c/dd>\u003c/div>\u003c/dl>`;\n}\n\nfunction shownCases() {\n  return report?.cases.filter(item => filter === \"all\" || item.verdict === filter) ?? [];\n}\n\nfunction updateCases() {\n  const shown = shownCases();\n  const active = shown.find(item => item.id === currentCase) ?? shown.find(item => item.verdict === \"blocked\") ?? shown[0];\n  if (active?.id !== currentCase) currentPath = \"\";\n  currentCase = active?.id ?? \"\";\n  byId(\"case-amount\").textContent = `${shown.length} / ${report.cases.length}`;\n  for (const button of byId(\"case-filters\").querySelectorAll(\"button\")) {\n    button.setAttribute(\"aria-pressed\", String(button.dataset.filter === filter));\n  }\n  const existingScroll = list.querySelector(\".case-rows\")?.scrollTop ?? 0;\n  list.innerHTML = shown.length ? `\u003col class=\"case-rows\">${shown.map(item => {\n    const blockers = item.findings.filter(entry => entry.kind === \"blocker\").length;\n    return `\u003cli>\u003cbutton type=\"button\" class=\"case-row\" data-case=\"${escaped(item.id)}\" aria-pressed=\"${item.id === currentCase}\">\n      \u003cspan class=\"case-label\">\u003cstrong>${escaped(item.title)}\u003c/strong>\u003csmall>\u003cspan class=\"verb\">${escaped(item.method)}\u003c/span>\u003cspan class=\"endpoint\">${escaped(item.path)}\u003c/span>\u003c/small>\u003c/span>\n      \u003cspan class=\"case-state ${item.verdict}\">${item.verdict === \"blocked\" ? `${blockers} 处阻断` : \"通过\"}\u003c/span>\u003c/button>\u003c/li>`;\n  }).join(\"\")}\u003c/ol>` : '\u003cp class=\"empty-list\">当前筛选没有用例。\u003c/p>';\n  const rows = list.querySelector(\".case-rows\");\n  if (rows) rows.scrollTop = existingScroll;\n  showDetail(active);\n}\n\nfunction jsonRows(value) {\n  const rows = [];\n  function print(value, path, depth, prefix = \"\", suffix = \"\") {\n    const indent = \"  \".repeat(depth);\n    if (value === null || typeof value !== \"object\") {\n      rows.push({path, text:indent + prefix + (JSON.stringify(value) ?? \"—\") + suffix});\n      return;\n    }\n    const array = Array.isArray(value);\n    const open = array ? \"[\" : \"{\";\n    const close = array ? \"]\" : \"}\";\n    const entries = Object.entries(value);\n    if (!entries.length) {\n      rows.push({path, text:indent + prefix + open + close + suffix});\n      return;\n    }\n    rows.push({path, text:indent + prefix + open});\n    entries.forEach(([key, child], index) => {\n      const property = /^[A-Za-z_$][A-Za-z0-9_$]*$/u.test(key) ? `.${key}` : `[${JSON.stringify(key)}]`;\n      print(child, path + (array ? `[${key}]` : property), depth + 1, array ? \"\" : JSON.stringify(key) + \": \", index \u003c entries.length - 1 ? \",\" : \"\");\n    });\n    rows.push({path:\"\", text:indent + close + suffix});\n  }\n  print(value, \"$\", 0);\n  return rows;\n}\n\nfunction valueToken(line) {\n  const tokenSeparator = /(\"(?:[^\"\\\\]|\\\\.)*\")(\\s*:)?|\\b(true|false|null)\\b|(-?\\d+(?:\\.\\d+)?)(?=,?$)/gu;\n  const segments = [];\n  let cursor = 0;\n  for (const match of line.matchAll(tokenSeparator)) {\n    const [token, quoted, colon, literal] = match;\n    const className = colon ? \"json-key\" : quoted ? \"json-string\" : literal ? \"json-literal\" : \"json-number\";\n    segments.push(escaped(line.slice(cursor,match.index)), `\u003cspan class=\"${className}\">${escaped(token)}\u003c/span>`);\n    cursor = match.index + token.length;\n  }\n  return segments.join(\"\") + escaped(line.slice(cursor));\n}\n\nfunction response(label, item, side) {\n  const message = item[side];\n  const serialized = jsonRows(message.body);\n  const hasPath = serialized.some(line => line.path === currentPath);\n  const status = String(message.status ?? \"—\");\n  const statusSelected = currentPath.startsWith(\"HTTP\") || currentPath === \"status\";\n  const missingPath = currentPath.startsWith(\"$\") && !hasPath;\n  return `\u003csection class=\"response ${side}\" aria-label=\"${escaped(label)}响应\">\u003cdiv class=\"response-head\">\u003ch4>${escaped(label)}\u003c/h4>\u003cspan class=\"http-status${Number(status) >= 400 ? \" http-error\" : \"\"}${statusSelected ? \" is-target\" : \"\"}\">${escaped(status)}\u003c/span>\u003c/div>\n    \u003cpre tabindex=\"0\" aria-label=\"${escaped(label)} JSON\">\u003ccode>${serialized.map((line, index) =>\n      `\u003cspan class=\"code-line${line.path && line.path === currentPath ? \" is-target\" : \"\"}\" data-json-path=\"${escaped(line.path)}\">\u003cspan class=\"line-no\" aria-hidden=\"true\">${index + 1}\u003c/span>\u003cspan>${valueToken(line.text)}\u003c/span>\u003c/span>`\n    ).join(\"\")}\u003c/code>\u003c/pre>${missingPath ? `\u003cp class=\"missing-path\">响应中没有 \u003ccode>${escaped(currentPath)}\u003c/code>\u003c/p>` : \"\"}\u003c/section>`;\n}\n\nfunction showDetail(item) {\n  if (!item) {\n    detail.innerHTML = '\u003cdiv class=\"empty-detail\">请选择有结果的用例。\u003c/div>';\n    return;\n  }\n  const ignored = item.ignored.map(entry => ({...entry, kind:\"ignored\"}));\n  const rows = [...item.findings, ...ignored];\n  if (!rows.some(entry => entry.path === currentPath)) currentPath = item.findings[0]?.path ?? \"\";\n  const verdict = item.verdict === \"blocked\" ? \"阻断\" : \"通过\";\n  const request = suite.cases.find(entry => entry.id === item.id)?.requestBody;\n  detail.innerHTML = `\u003cheader class=\"detail-head\">\u003cdiv>\u003cp class=\"path\">\u003cspan class=\"verb\">${escaped(item.method)}\u003c/span>\u003ccode>${escaped(item.path)}\u003c/code>\u003c/p>\n    \u003ch2 class=\"detail-title\" tabindex=\"-1\">${escaped(item.title)}\u003c/h2>\u003cp class=\"description\">${escaped(item.description)}\u003c/p>\u003c/div>\u003cspan class=\"detail-verdict ${item.verdict}\">${verdict}\u003c/span>\u003c/header>\n    \u003cdiv class=\"detail-body\">${request ? `\u003cdetails class=\"request-body\">\u003csummary>请求体 \u003cspan>JSON\u003c/span>\u003c/summary>\u003cpre>\u003ccode>${escaped(JSON.stringify(request,null,2))}\u003c/code>\u003c/pre>\u003c/details>` : \"\"}\n    \u003csection class=\"finding-section\" aria-labelledby=\"findings-heading\">\u003ch3 id=\"findings-heading\">差异与检查项\u003c/h3>\n    ${item.findings.length ? findingsMarkup(item.findings) : '\u003cp class=\"no-findings\">响应符合既有契约。\u003c/p>'}\n    ${ignored.length ? `\u003cdetails class=\"ignored-meta\"${ignored.some(entry => entry.path === currentPath) ? \" open\" : \"\"}>\u003csummary>${ignored.length} 个动态字段已忽略\u003c/summary>${findingsMarkup(ignored)}\u003c/details>` : \"\"}\u003c/section>\n    \u003cdiv class=\"snapshot-heading\">\u003ch3>响应对照\u003c/h3>\u003cspan>JSON\u003c/span>\u003c/div>\u003cdiv class=\"snapshots\">${response(\"基线 \" + versionNumber(report.baseline), item, \"baseline\")}${response(\"候选 \" + versionNumber(report.candidate), item, \"candidate\")}\u003c/div>\u003c/div>`;\n}\n\nfunction findingsMarkup(entries) {\n  return `\u003cul class=\"findings\">${entries.map(entry => `\u003cli>\u003cbutton type=\"button\" class=\"finding ${escaped(entry.kind)}\" data-path=\"${escaped(entry.path)}\" aria-pressed=\"${entry.path === currentPath}\">\n    \u003cspan class=\"finding-label\">${entry.kind === \"blocker\" ? \"阻断\" : entry.kind === \"change\" ? \"兼容\" : \"已忽略\"}\u003c/span>\u003ccode>${escaped(entry.path)}\u003c/code>\u003cspan class=\"finding-copy\">${escaped(entry.message)}\u003c/span>\u003c/button>\u003c/li>`).join(\"\")}\u003c/ul>`;\n}\n\nasync function run() {\n  if (running) return;\n  running = true;\n  report = undefined;\n  runButton.disabled = true;\n  runButton.setAttribute(\"aria-busy\", \"true\");\n  exportButton.disabled = true;\n  workspace.hidden = true;\n  summary.className = \"run-summary\";\n  summary.innerHTML = '\u003cp class=\"loading\">正在执行两版接口的验收用例…\u003c/p>';\n  releaseControls();\n  try {\n    report = await runRegression(candidateId);\n    summary.className = `run-summary ${report.verdict}`;\n    summary.innerHTML = counts(report);\n    filter = \"all\";\n    currentPath = \"\";\n    if (params.get(\"case\") !== currentCase) currentCase = \"\";\n    updateCases();\n    workspace.hidden = false;\n    exportButton.disabled = false;\n  } catch (error) {\n    summary.className = \"run-summary error\";\n    summary.innerHTML = `\u003cp class=\"loading\">验收未完成。${escaped(error?.message || \"请稍后重试。\")}\u003c/p>`;\n  } finally {\n    running = false;\n    runButton.disabled = false;\n    runButton.removeAttribute(\"aria-busy\");\n    releaseControls();\n  }\n}\n\nfunction download() {\n  if (!report) return;\n  const link = document.createElement(\"a\");\n  link.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2) + \"\\n\"], {type:\"application/json;charset=utf-8\"}));\n  link.download = `发布验收-${report.candidate.id}.json`;\n  link.click();\n  setTimeout(() => URL.revokeObjectURL(link.href), 1000);\n}\n\nbyId(\"candidate-version\").addEventListener(\"click\", event => {\n  const button = event.target.closest(\"[data-candidate]\");\n  if (!button || button.dataset.candidate === candidateId) return;\n  candidateId = button.dataset.candidate;\n  releaseControls();\n  byId(\"candidate-version\").querySelector('[aria-pressed=\"true\"]').focus({preventScroll:true});\n  report = undefined;\n  exportButton.disabled = true;\n  workspace.hidden = true;\n  summary.className = \"run-summary\";\n  summary.innerHTML = '\u003cp class=\"loading\">候选版本已切换。运行验收后可查看这一版本的结果。\u003c/p>';\n});\nbyId(\"case-filters\").addEventListener(\"click\", event => {\n  const button = event.target.closest(\"[data-filter]\");\n  if (!button || button.dataset.filter === filter) return;\n  filter = button.dataset.filter;\n  updateCases();\n});\nlist.addEventListener(\"click\", event => {\n  const button = event.target.closest(\"[data-case]\");\n  if (!button) return;\n  if (button.dataset.case !== currentCase) {\n    currentPath = \"\";\n    currentCase = button.dataset.case;\n    updateCases();\n  }\n  if (matchMedia(\"(max-width: 820px)\").matches) detail.querySelector(\".detail-title\")?.focus();\n  else [...list.querySelectorAll(\"[data-case]\")].find(control => control.dataset.case === currentCase)?.focus({preventScroll:true});\n});\ndetail.addEventListener(\"click\", event => {\n  const button = event.target.closest(\"[data-path]\");\n  if (!button) return;\n  currentPath = button.dataset.path;\n  const wasIgnored = button.classList.contains(\"ignored\");\n  showDetail(report.cases.find(item => item.id === currentCase));\n  if (wasIgnored) detail.querySelector(\".ignored-meta\").open = true;\n  [...detail.querySelectorAll(\"[data-path]\")].find(control => control.dataset.path === currentPath)?.focus({preventScroll:true});\n  for (const code of detail.querySelectorAll(\"pre\")) {\n    const target = code.querySelector(\".is-target\");\n    if (target) code.scrollTop = Math.max(0, target.offsetTop - code.clientHeight / 3);\n  }\n});\nrunButton.addEventListener(\"click\", run);\nexportButton.addEventListener(\"click\", download);\nreleaseControls();\nvoid run();\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#171525\">\n  \u003cmeta name=\"description\" content=\"对照两版订单接口，核对状态码、字段类型和业务值，生成发布验收报告。\">\n  \u003ctitle>接口回归验收台\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#run-heading\">跳到验收工作区\u003c/a>\n  \u003cheader class=\"site-header\">\n    \u003cdiv class=\"shell mast\">\n      \u003ca class=\"identity\" href=\"./index.html\">\u003cspan class=\"mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan>接口回归验收台\u003c/span>\u003c/a>\n      \u003cp id=\"execution-label\" class=\"execution-label\" hidden>\u003c/p>\n    \u003c/div>\n  \u003c/header>\n  \u003cmain class=\"shell desk\" id=\"app\">\n    \u003cheader class=\"desk-heading\">\n      \u003cdiv>\u003cp class=\"product-area\" id=\"product-area\">订单接口\u003c/p>\u003ch1 id=\"run-heading\" tabindex=\"-1\">发布验收\u003c/h1>\u003c/div>\n      \u003cdiv class=\"desk-actions\">\n        \u003cbutton class=\"button export-button\" type=\"button\" id=\"export-report\" disabled>导出报告\u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/button>\n        \u003cbutton class=\"button run-button\" type=\"button\" id=\"run-suite\">\u003cspan class=\"play-mark\" aria-hidden=\"true\">\u003c/span>运行验收\u003c/button>\n      \u003c/div>\n    \u003c/header>\n    \u003csection class=\"release-box\" aria-label=\"对照版本\">\n      \u003cdiv id=\"baseline-version\" class=\"baseline-version\">\u003c/div>\n      \u003cdiv id=\"candidate-version\" class=\"candidate-version\">\u003c/div>\n    \u003c/section>\n    \u003csection id=\"run-summary\" class=\"run-summary\" aria-live=\"polite\" aria-atomic=\"true\">\u003cp class=\"loading\">正在准备验收用例…\u003c/p>\u003c/section>\n    \u003cdiv id=\"workspace\" class=\"workspace\" hidden>\n      \u003csection class=\"case-panel\" aria-labelledby=\"case-list-heading\">\u003cdiv class=\"case-head\">\u003ch2 id=\"case-list-heading\">验收用例\u003c/h2>\u003cspan class=\"case-amount\" id=\"case-amount\">\u003c/span>\u003c/div>\n        \u003cdiv class=\"case-filters\" id=\"case-filters\" aria-label=\"筛选用例\">\n          \u003cbutton type=\"button\" data-filter=\"all\" aria-pressed=\"true\">全部\u003c/button>\n          \u003cbutton type=\"button\" data-filter=\"blocked\" aria-pressed=\"false\">阻断\u003c/button>\n          \u003cbutton type=\"button\" data-filter=\"passed\" aria-pressed=\"false\">通过\u003c/button>\n        \u003c/div>\n        \u003cdiv id=\"case-list\">\u003c/div>\u003c/section>\n      \u003csection id=\"case-detail\" class=\"case-detail\" aria-label=\"用例详情\">\u003c/section>\n    \u003c/div>\n  \u003c/main>\n  \u003cfooter class=\"site-footer\">\u003cdiv class=\"shell\">\u003cp>订单 API · 发布验收\u003c/p>\u003cp>样例请求与响应数据\u003c/p>\u003c/div>\u003c/footer>\n  \u003cnoscript>\u003cp class=\"shell loading\">请启用 JavaScript 以运行验收。\u003c/p>\u003c/noscript>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --paper: #f8f8fc;\n  --surface: #ffffff;\n  --ink: #211e2d;\n  --slate: #504b63;\n  --muted: #665f76;\n  --edge: #e0ddeb;\n  --rule: #eae7f1;\n  --violet: #593ac5;\n  --violet-deep: #482baf;\n  --violet-tint: #f0ebff;\n  --amber: #7a4a08;\n  --amber-tint: #fff2d5;\n  --green: #216447;\n  --green-tint: #e8f5ed;\n  --night: #171525;\n  --code: \"Cascadia Code\", \"SFMono-Regular\", Consolas, monospace;\n  --gutter: clamp(15px, 4.8vw, 66px);\n  font: 15px/1.5 system-ui, \"PingFang SC\", \"Microsoft YaHei UI\", sans-serif;\n  background: var(--paper);\n  color: var(--ink);\n}\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; min-width: 280px; min-height: 100dvh; display: flex; flex-direction: column; }\n[hidden] { display: none !important; }\n:where(h1,h2,h3,h4,p,dl,dd,ol,ul) { margin: 0; padding: 0; }\n:where(button) { font: inherit; color: inherit; cursor: pointer; }\nbutton:disabled { cursor: default; }\na { color: inherit; text-decoration: none; }\n:where(a,button,pre):focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }\ncode { font: .95em/1.5 var(--code); }\n.shell { width: min(100%, 1490px); margin-inline: auto; padding-inline: var(--gutter); }\n.skip-link { position: fixed; z-index: 8; top: 8px; left: 9px; transform: translateY(-150%); padding: 9px 12px; border-radius: 5px; background: #fff; color: var(--violet); font-weight: 720; }\n.skip-link:focus-visible { transform: none; }\n\n.site-header { background: var(--night); color: #f7f3ff; border-bottom: 1px solid #302942; }\n.mast { min-height: 65px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }\n.identity { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 3px 1px; font-size: 18px; font-weight: 760; letter-spacing: -.035em; }\n.identity:focus-visible { outline-color: #bba3ff; }\n.mark { flex: none; width: 29px; height: 29px; display: inline-grid; align-content: center; gap: 3px; padding: 0 5px; border: 1px solid #8170bf; border-radius: 6px; background: #352663; }\n.mark i { display: block; width: 13px; height: 2px; border-radius: 1px; background: #ded2ff; }\n.mark i:nth-child(2) { width: 10px; margin-left: 4px; background: #ba9efa; }\n.mark i:nth-child(3) { width: 8px; background: #f4c978; }\n.execution-label { display: flex; align-items: center; gap: 7px; color: #d2c9e4; font-size: 12px; white-space: nowrap; }\n.execution-label::before { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: #bca6ff; box-shadow: 0 0 0 3px #674ea44f; }\n\n.desk { flex: 1; padding-top: clamp(24px, 3.5vw, 49px); padding-bottom: 38px; }\n.desk-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 9px 18px; margin-bottom: 18px; }\n.product-area { color: #6c5791; font-size: 13px; font-weight: 710; letter-spacing: .035em; }\n.desk-heading h1 { margin-top: 4px; font-size: clamp(33px, 5vw, 63px); font-weight: 810; line-height: 1.11; letter-spacing: -.063em; }\n.desk-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }\n.button { min-height: 46px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 7px 13px; border: 1px solid var(--edge); border-radius: 6px; font-size: 13px; font-weight: 735; white-space: nowrap; }\n.export-button { background: var(--surface); color: #4c426c; }\n.export-button:hover { border-color: #baa7f1; }\n.export-button:disabled { color: #746c82; background: #f1eff6; }\n.run-button { background: var(--violet); color: #fff; border-color: var(--violet); box-shadow: 0 3px 7px #5534af35; }\n.run-button:hover { background: var(--violet-deep); }\n.run-button:disabled { opacity: .76; }\n.play-mark { width: 0; height: 0; border: 5px solid transparent; border-left: 8px solid currentColor; border-right: 0; margin-left: 1px; }\n\n.release-box { display: grid; grid-template-columns: minmax(142px, .34fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--edge); border-radius: 9px; background: #fff; box-shadow: 0 3px 10px #312a4a08; }\n.baseline-version { display: grid; align-content: center; gap: 2px; padding: 13px 15px; background: #f2eff8; color: #4f4664; border-radius: 8px 0 0 8px; }\n.baseline-version span,.release-label { font-size: 12px; font-weight: 700; color: #625777; }\n.baseline-version strong { overflow-wrap: anywhere; font: 720 16px/1.4 var(--code); }\n.candidate-version { display: flex; align-items: center; gap: 10px 16px; padding: 12px 14px; min-width: 0; }\n.candidate-version > div { flex: none; display: grid; gap: 4px; }\n.candidate-version p { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }\n.release-buttons { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--edge); border-radius: 6px; background: #f7f5fa; }\n.release-buttons button { min-height: 37px; padding: 3px 9px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #554665; text-align: left; white-space: nowrap; font-size: 12px; font-weight: 700; }\n.release-buttons button:hover { color: var(--violet); }\n.release-buttons button[aria-pressed=\"true\"] { border-color: #d5c7f8; background: #fff; color: var(--violet-deep); box-shadow: 0 2px 5px #35275010; }\n\n.run-summary { display: grid; grid-template-columns: minmax(170px, .6fr) minmax(0, 1.4fr); align-items: center; gap: 10px 14px; min-height: 92px; padding: 12px 15px; margin: 12px 0 14px; border: 1px solid var(--edge); border-left: 3px solid #9783c4; border-radius: 8px; background: #fff; }\n.run-summary.blocked { border-color: #e8d6b4; border-left-color: #df9a2c; background: #fffbf2; }\n.run-summary.passed { border-color: #d3eadc; border-left-color: #419265; background: #f6fbf8; }\n.run-summary.error { border-left-color: #b44454; background: #fff1f2; }\n.loading { color: var(--muted); font-size: 13px; grid-column: 1 / -1; overflow-wrap: anywhere; }\n.verdict-heading { display: flex; align-items: center; gap: 10px; min-width: 0; }\n.verdict-mark { display: inline-grid; place-items: center; flex: 0 0 38px; width: 38px; height: 38px; border: 1px solid #f1d39a; border-radius: 7px; background: var(--amber-tint); color: var(--amber); font: 800 23px/1 var(--code); }\n.verdict-heading.pass .verdict-mark { background: var(--green-tint); border-color: #c7e6d2; color: var(--green); }\n.verdict-heading h2 { font-size: 21px; line-height: 1.25; font-weight: 800; }\n.verdict-heading p { margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 645; overflow-wrap: anywhere; }\n.summary-counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }\n.summary-counts > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 0 clamp(5px, 1.5vw, 17px); border-left: 1px solid #786c5524; }\n.summary-counts dt { color: var(--muted); font-size: 12px; }\n.summary-counts dd { font: 780 clamp(21px, 3vw, 32px)/1 var(--code); font-variant-numeric: tabular-nums; }\n.summary-counts dd.warning-text { color: #8f550c; }\n\n.workspace umns: auto minmax(90px, .72fr) minmax(0, 1fr); gap: 4px 8px; align-items: center; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 5px; text-align: left; background: #fdfcff; }\n.finding:hover { border-color: #c2afea; }\n.finding[aria-pressed=\"true\"] { border-color: #d8c9f3; background: #f6f0ff; }\n.finding.blocker[aria-pressed=\"true\"] { border-color: #e8cea0; background: #fff8e8; }\n.finding-label { min-width: 3em; color: #66479a; font-size: 11px; font-weight: 730; }\n.finding.blocker .finding-label { color: var(--amber); }\n.finding.change .finding-label { color: var(--green); }\n.finding.ignored .finding-label { color: #6c5b79; }\n.finding code { color: #493658; font: 660 11px/1.35 var(--code); overflow-wrap: anywhere; }\n.finding-copy,.no-findings { color: #655970; font-size: 12px; overflow-wrap: anywhere; }\n.no-findings { margin-top: 6px; }\n.ignored-meta { margin-top: 3px; color: #645674; font-size: 12px; }\n.ignored-meta summary { width: fit-content; min-height: 37px; padding: 8px 0; cursor: pointer; }\n.ignored-meta .findings { margin-top: 0; }\n.snapshot-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 15px 0 6px; }\n.snapshot-heading > span { color: #746184; font: 680 11px/1.3 var(--code); }\n.snapshots { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }\n.response { min-width: 0; overflow: hidden; border: 1px solid var(--edge); border-radius: 6px; background: #fbfafc; }\n.response-head { display: flex; min-height: 41px; justify-content: space-between; align-items: center; gap: 5px; padding: 5px 8px; border-bottom: 1px solid var(--edge); background: #f4f1f7; }\n.response.candidate .response-head { background: #f0ebfb; }\n.response-head h4 { color: #584269; font: 690 12px/1.3 var(--code); overflow-wrap: anywhere; }\n.http-status { flex: none; color: #296049; background: #e6f1ea; border: 1px solid #d5e7db; border-radius: 4px; padding: 3px 5px; font: 735 11px/1.3 var(--code); }\n.http-status.http-error { color: #785037; background: #fff1e7; border-color: #efddcd; }\n.http-status.is-target { background: var(--amber-tint); border-color: #edd5a6; color: var(--amber); }\n.response pre { position: relative; max-height: 254px; min-height: 140px; margin: 0; padding: 6px 0; overflow: auto; scrollbar-width: thin; color: #574365; font: 510 11px/1.55 var(--code); }\n.response pre:focus-visible { outline-offset: -2px; }\n.response pre > code { min-width: max-content; display: block; font: inherit; }\n.code-line { display: flex; align-items: baseline; gap: 8px; min-height: 18px; padding-right: 9px; }\n.line-no { flex: 0 0 23px; width: 23px; text-align: right; color: #81778a; user-select: none; }\n.code-line.is-target { background: #ffecc2; box-shadow: inset 2px 0 #cb7c15; }\n.json-key { color: #55378a; }\n.json-string { color: #28634e; }\n.json-literal { color: #842e60; }\n.json-number { color: #863d34; }\n.missing-path { padding: 5px 7px; border-top: 1px solid #ecddbd; color: #704b19; background: #fff5dc; font-size: 11px; overflow-wrap: anywhere; }\n.missing-path code { color: inherit; }\n.site-footer { border-top: 1px solid var(--edge); color: #756680; font-size: 12px; }\n.site-footer .shell { display: flex; justify-content: space-between; gap: 7px; min-height: 46px; align-items: center; }\n\n@media (max-width: 1050px) {\n  .workspace { grid-template-columns: minmax(213px,.34fr) minmax(0,1fr); }\n  .candidate-version { gap: 7px 12px; }\n  .case-row { padding-left: 10px; }\n}\n\n@media (max-width: 820px) {\n  .workspace { grid-template-columns: minmax(0,1fr); gap: 9px; }\n  .case-rows { max-height: clamp(161px,35vh,260px); }\n  .case-row { min-height: 51px; }\n  .case-filters button { min-height: 40px; }\n}\n\n@media (max-width: 520px) {\n  :root { --gutter: 11px; }\n  .mast { min-height: 52px; }\n  .identity { gap: 6px; font-size: 15px; }\n  .mark { width: 25px; height: 25px; padding: 0 3px; }\n  .execution-label { gap: 5px; font-size: 10px; }\n  .desk { padding-top: 18px; padding-bottom: 23px; }\n  .desk-heading { flex-wrap: wrap; margin-bottom: 12px; gap: 7px; }\n  .desk-heading h1 { font-size: 34px; }\n  .desk-actions { gap: 5px; }\n  .button { min-height: 44px; min-width: 0; padding-inline: 7px; gap: 3px; font-size: 11px; }\n  .product-area { font-size: 11px; }\n  .release-box { grid-template-columns: minmax(0,.37fr) minmax(0,1fr); }\n  .baseline-version { padding: 9px 6px; }\n  .baseline-version strong { font-size: 13px; }\n  .candidate-version { display: grid; gap: 4px; padding: 6px; }\n  .candidate-version > div { min-width: 0; }\n  .release-buttons { width: fit-content; max-width: 100%; gap: 1px; padding: 2px; }\n  .release-buttons button { min-width: 0; min-height: 39px; padding: 3px 4px; font-size: 11px; white-space: normal; overflow-wrap: anywhere; }\n  .candidate-version p { font-size: 11px; }\n  .run-summary { grid-template-columns: minmax(0,1fr); gap: 8px; margin-block: 8px 9px; padding: 8px 9px; }\n  .verdict-mark { flex-basis: 31px; width: 31px; height: 31px; font-size: 19px; }\n  .verdict-heading { gap: 6px; }\n  .verdict-heading h2 { font-size: 17px; }\n  .verdict-heading p { margin-top: 2px; }\n  .summary-counts > div:first-child { border-left: 0; padding-left: 0; }\n  .summary-counts > div { padding-inline: 6px; gap: 2px; }\n  .summary-counts dt { font-size: 11px; }\n  .summary-counts dd { font-size: 21px; }\n  .case-head { padding: 7px 8px 1px; }\n  .case-filters { padding: 2px 7px 4px; }\n  .case-filters button { min-height: 38px; }\n  .detail-head { padding: 9px 8px 8px; }\n  .description { font-size: 12px; }\n  .detail-body { padding: 8px; }\n  .finding { min-height: 44px; padding: 4px 5px; grid-template-columns: auto minmax(0,1fr); gap: 2px 4px; }\n  .finding-copy { grid-column: 2; font-size: 11px; }\n  .finding-label { min-width: 2.75em; }\n  .snapshot-heading { margin-block: 10px 4px; }\n  .snapshots { gap: 4px; }\n  .response-head { padding-inline: 4px; }\n  .response-head h4 { font-size: 10px; }\n  .response pre { font-size: 10px; max-height: 215px; }\n  .http-status { padding-inline: 3px; }\n  .code-line { gap: 4px; }\n  .line-no { flex-basis: 15px; width: 15px; }\n}\n","group":"前端"},{"path":"static/transport.mjs","text":"import { evaluateRelease } from \"../engine.mjs\";\nimport { releases, suite } from \"../fixtures.mjs\";\n\nexport const executionMode = \"http\";\n\nfunction serviceOrigin(origin) {\n  if (origin === undefined) return \"\";\n  if (typeof origin !== \"string\" || !/^http:\\/\\/127\\.0\\.0\\.1:\\d+$/u.test(origin)) {\n    throw new Error(\"HTTP 演练仅支持本机样例服务。\");\n  }\n  return origin;\n}\n\nasync function collectResponses(release, origin, signal) {\n  const entries = await Promise.all(suite.cases.map(async ({ id, method, path, requestBody }) => {\n    const body = requestBody === undefined ? undefined : JSON.stringify(requestBody);\n    const response = await fetch(`${origin}/fixtures/${release.id}${path}`, {\n      method,\n      body,\n      headers: body === undefined ? undefined : { \"Content-Type\": \"application/json\" },\n      signal,\n      redirect: \"error\",\n      cache: \"no-store\"\n    });\n    if (response.headers.get(\"X-Regression-Fixture\") !== id) {\n      throw new Error(`${method} ${path} 未收到对应的 ${release.label} 样例响应（HTTP ${response.status}）。`);\n    }\n    const payload = await response.text();\n    return [id, { status: response.status, body: payload ? JSON.parse(payload) : null }];\n  }));\n  return Object.fromEntries(entries);\n}\n\nexport async function runRegression(candidateReleaseId, { origin, signal } = {}) {\n  const baseline = releases.find(release => release.id === \"baseline\");\n  const candidate = releases.find(release => release.id === candidateReleaseId && release.id !== \"baseline\");\n  if (!candidate) throw new RangeError(\"请选择有效的候选版本。\");\n  const base = serviceOrigin(origin);\n  const requestSignal = signal ?? AbortSignal.timeout(12000);\n  const [baselineResponses, candidateResponses] = await Promise.all([\n    collectResponses(baseline, base, requestSignal),\n    collectResponses(candidate, base, requestSignal)\n  ]);\n  return evaluateRelease({ suite, baseline, candidate, baselineResponses, candidateResponses });\n}\n","group":"前端"},{"path":"tests/engine.test.mjs","text":"import assert from \"node:assert/strict\";\nimport test from \"node:test\";\nimport {evaluateRelease} from \"../engine.mjs\";\nimport {getFixtureResponse, releases, suite} from \"../fixtures.mjs\";\n\nconst [baseline, broken, corrected] = releases;\nconst responsesFor = (releaseId) => Object.fromEntries(suite.cases.map(({id}) => [id, getFixtureResponse(releaseId, id)]));\n\nfunction evaluate(candidate, candidateResponses = responsesFor(candidate.id)) {\n  return evaluateRelease({suite, baseline, candidate, baselineResponses: responsesFor(baseline.id), candidateResponses});\n}\n\ntest(\"candidate rc.1 is blocked for five traceable regressions despite successful HTTP responses\", () => {\n  const report = evaluate(broken);\n  assert.equal(report.verdict, \"blocked\");\n  assert.deepEqual(report.totals, {cases: 10, passed: 5, blocked: 5, changes: 5, ignored: 20});\n  const details = report.cases.find(({id}) => id === \"order-detail\");\n  assert.equal(details.baseline.status, 200);\n  assert.equal(details.candidate.status, 200);\n  assert.deepEqual(details.findings[0], {kind: \"blocker\", code: \"TYPE_CHANGED\", path: \"$.data.amountCents\",\n    message: \"字段类型由 number 变为 string。\", expected: 29900, actual: \"29900\"});\n  assert.deepEqual(report.cases.flatMap(({findings}) => findings.filter(({kind}) => kind === \"blocker\").map(({code}) => code)),\n    [\"TYPE_CHANGED\", \"FIELD_MISSING\", \"HTTP_STATUS_CHANGED\", \"STABLE_VALUE_CHANGED\", \"TYPE_CHANGED\"]);\n  const listFinding = report.cases.find(({id}) => id === \"order-list\").findings[0];\n  assert.equal(listFinding.path, \"$.data.orders[1].items[0].quantity\");\n  assert.equal(listFinding.expected, 2);\n  assert.equal(listFinding.actual, undefined);\n});\n\ntest(\"rc.2 passes including added, optional, display, and nullable fields\", () => {\n  const report = evaluate(corrected);\n  assert.equal(report.verdict, \"passed\");\n  assert.deepEqual(report.totals, {cases: 10, passed: 10, blocked: 0, changes: 5, ignored: 20});\n  assert.deepEqual(report.cases.flatMap(({findings}) => findings.map(({code}) => code)),\n    [\"ALLOWED_VALUE_CHANGED\", \"OPTIONAL_FIELD_REMOVED\", \"FIELD_ADDED\", \"NULLABLE_VALUE_CHANGED\", \"ALLOWED_VALUE_CHANGED\"]);\n  assert.deepEqual(report.cases.find(({id}) => id === \"shipment\").ignored.map(({path}) => path),\n    [\"$.meta.requestId\", \"$.meta.servedAt\"]);\n});\n\ntest(\"allowing a value change does not allow an unexpected type or a new incompatible nullable value\", () => {\n  const candidate = responsesFor(corrected.id);\n  candidate[\"order-summary\"].body.data.displayLabel = false;\n  candidate.refunds.body.data.refunds[0].settledAt = 100;\n  const report = evaluate(corrected, candidate);\n  assert.deepEqual(report.cases.flatMap(({findings}) => findings.filter(({kind}) => kind === \"blocker\").map(({path}) => path)),\n    [\"$.data.displayLabel\", \"$.data.refunds[0].settledAt\"]);\n});\n\ntest(\"optional and ignored fields may be omitted, but the pagination contract still fails closed\", () => {\n  const candidate = responsesFor(corrected.id);\n  delete candidate[\"order-summary\"].body.meta.requestId;\n  delete candidate[\"empty-order-list\"].body.data.nextCursor;\n  candidate[\"order-list\"].body.data.orders.pop();\n  const report = evaluate(corrected, candidate);\n  const optional = report.cases.find(({id}) => id === \"order-summary\");\n  assert.equal(optional.verdict, \"passed\");\n  assert(optional.ignored.some(({path}) => path === \"$.meta.requestId\"));\n  assert.deepEqual(report.cases.flatMap(({findings}) => findings.filter(({kind}) => kind === \"blocker\").map(({code}) => code)),\n    [\"ARRAY_LENGTH_CHANGED\", \"FIELD_MISSING\"]);\n});\n\ntest(\"missing and malformed snapshots are distinguishable from a passing comparison\", () => {\n  const candidate = responsesFor(corrected.id);\n  delete candidate[\"order-detail\"];\n  candidate[\"order-list\"].status = \"200\";\n  const report = evaluate(corrected, candidate);\n  assert.equal(report.totals.blocked, 2);\n  assert.equal(report.cases[0].findings[0].code, \"RESPONSE_MISSING\");\n  assert.deepEqual(report.cases[0].candidate, {status: null, body: null});\n});\n\ntest(\"fixture calls and rendered findings keep independent JSON snapshots\", () => {\n  const candidate = responsesFor(broken.id);\n  const report = evaluate(broken, candidate);\n  candidate[\"order-detail\"].body.data.amountCents = \"99900\";\n  assert.equal(report.cases[0].candidate.body.data.amountCents, \"29900\");\n  assert.equal(getFixtureResponse(broken.id, \"order-detail\").body.data.amountCents, \"29900\");\n  assert.throws(() => getFixtureResponse(\"missing\", \"order-detail\"), RangeError);\n  assert.throws(() => getFixtureResponse(baseline.id, \"constructor\"), RangeError);\n});\n","group":"验收测试"},{"path":"tests/gate.test.mjs","text":"import assert from \"node:assert/strict\";\nimport { spawnSync } from \"node:child_process\";\nimport { fileURLToPath } from \"node:url\";\nimport test from \"node:test\";\n\nconst entry = fileURLToPath(new URL(\"../scripts/gate.mjs\", import.meta.url));\n\nfunction gate(...args) {\n  const result = spawnSync(process.execPath, [entry, ...args], { encoding: \"utf8\", timeout: 20000 });\n  if (result.error) throw result.error;\n  return result;\n}\n\ntest(\"the command-line gate produces a report and blocks an incompatible release\", () => {\n  const run = gate(\"--candidate\", \"candidate-a\");\n  assert.equal(run.status, 1, run.stderr);\n  const report = JSON.parse(run.stdout);\n  assert.equal(report.candidate.id, \"candidate-a\");\n  assert.equal(report.verdict, \"blocked\");\n  const order = report.cases.find(entry => entry.id === \"order-detail\");\n  assert.equal(order.baseline.status, 200);\n  assert.equal(order.candidate.status, 200);\n  assert(order.findings.some(finding => finding.path === \"$.data.amountCents\" && finding.kind === \"blocker\"));\n});\n\ntest(\"compatible samples pass and invalid invocations fail without a report\", () => {\n  const run = gate(\"--candidate\", \"candidate-b\");\n  assert.equal(run.status, 0, run.stderr);\n  assert.equal(JSON.parse(run.stdout).verdict, \"passed\");\n  const invalid = gate(\"--candidate\", \"baseline\");\n  assert.equal(invalid.status, 2);\n  assert.equal(invalid.stdout, \"\");\n  assert.match(invalid.stderr, /--candidate/);\n});\n","group":"验收测试"},{"path":"tests/http.test.mjs","text":"import assert from \"node:assert/strict\";\nimport { once } from \"node:events\";\nimport test from \"node:test\";\nimport { getFixtureResponse, releases, suite } from \"../fixtures.mjs\";\nimport { runRegression as runEmbedded } from \"../portable/transport.mjs\";\nimport { startServer } from \"../server.mjs\";\nimport { runRegression as runHttp } from \"../static/transport.mjs\";\n\nasync function service(t) {\n  const server = startServer({ port: 0 });\n  await once(server, \"listening\");\n  t.after(() => new Promise(resolve => server.close(resolve)));\n  return `http://127.0.0.1:${server.address().port}`;\n}\n\nfunction caseUrl(origin, release, testCase) {\n  return `${origin}/fixtures/${release}${testCase.path}`;\n}\n\nfunction requestFor({ method, requestBody }) {\n  return requestBody === undefined ? { method } : {\n    method,\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify(requestBody)\n  };\n}\n\ntest(\"fixed calls return the expected status and payload on the wire, including business errors\", async t => {\n  const origin = await service(t);\n  for (const release of releases) {\n    for (const testCase of suite.cases) {\n      const fixture = getFixtureResponse(release.id, testCase.id);\n      const response = await fetch(caseUrl(origin, release.id, testCase), requestFor(testCase));\n      assert.equal(response.status, fixture.status, testCase.id);\n      assert.equal(response.headers.get(\"X-Regression-Fixture\"), testCase.id);\n      const body = await response.text();\n      assert.deepEqual(body ? JSON.parse(body) : null, fixture.body, testCase.id);\n    }\n  }\n});\n\ntest(\"both candidate verdicts are identical across actual HTTP and offline embedded execution\", async t => {\n  const origin = await service(t);\n  for (const [candidate, verdict] of [[\"candidate-a\", \"blocked\"], [\"candidate-b\", \"passed\"]]) {\n    const report = await runHttp(candidate, { origin });\n    assert.equal(report.verdict, verdict);\n    assert.deepEqual(report, await runEmbedded(candidate));\n  }\n  await assert.rejects(runHttp(\"baseline\", { origin }), RangeError);\n  await assert.rejects(runHttp(\"candidate-a\", { origin: \"https://example.invalid\" }), /本机/u);\n});\n\ntest(\"fixed routes reject unscheduled combinations and never tag them as fixture results\", async t => {\n  const origin = await service(t);\n  const testCase = suite.cases.find(item => item.method === \"POST\" && item.requestBody !== undefined);\n  assert(testCase);\n  const address = caseUrl(origin, \"baseline\", testCase);\n  const attempts = [\n    [caseUrl(origin, \"unknown\", testCase), requestFor(testCase), 404],\n    [address + \"?free-form=1\", requestFor(testCase), 404],\n    [address, { method: \"DELETE\" }, 405],\n    [address, { ...requestFor(testCase), body: '{\"different\":true}' }, 400],\n    [address, { ...requestFor(testCase), body: \"{\" }, 400],\n    [address, { method: \"POST\", body: \"sample\" }, 415],\n    [address, { ...requestFor(testCase), body: '\"' + \"x\".repeat(16_384) + '\"' }, 413],\n    [address, { ...requestFor(testCase), headers: { \"Content-Type\": \"application/json\", Origin: \"https://example.invalid\" } }, 403]\n  ];\n  for (const [url, options, code] of attempts) {\n    const response = await fetch(url, options);\n    assert.equal(response.status, code);\n    assert.equal(response.headers.get(\"X-Regression-Fixture\"), null);\n    assert.equal(typeof (await response.json()).error, \"string\");\n  }\n});\n\ntest(\"the server exposes the frontend entry points and only listed files\", async t => {\n  const origin = await service(t);\n  for (const [path, mime] of [[\"/\", \"text/html\"], [\"/styles.css\", \"text/css\"], [\"/app.mjs\", \"text/javascript\"],\n    [\"/transport.mjs\", \"text/javascript\"], [\"/engine.mjs\", \"text/javascript\"], [\"/fixtures.mjs\", \"text/javascript\"]]) {\n    const reply = await fetch(origin + path, { method: \"HEAD\" });\n    assert.equal(reply.status, 200, path);\n    assert(reply.headers.get(\"Content-Type\").startsWith(mime), path);\n    assert.equal(await reply.text(), \"\");\n  }\n  assert.equal((await fetch(origin + \"/package.json\")).status, 404);\n});\n","group":"验收测试"}],"defaultFile":"engine.mjs"}</script>
