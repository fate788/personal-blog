<script id="source-data" type="application/json">{"files":[{"path":"README.md","text":"# 故障响应工作台 v0.1\n\n供值班人员在本机探测双账核对服务，签收异常并确认恢复。真实探针仅读取对账健康接口的队列数量、等待时间和服务状态。另一套独立的 HTTP 服务提供可重复的故障演练。\n\n**作品分类**　平台可靠性 / 运维开发、SRE。应用场景为跨行业服务运维，本次接入电商与支付场景的双账核对服务。\n\n## 在本机运行\n\n需要 Python 3.10 或更新版本，只用标准库。解压后在 Windows 双击 `start-incident.cmd`，或在本目录运行 `python server.py`。浏览器打开 [本机工作台](http://127.0.0.1:8793/)。\n\n要查看真实探针，另启动双账核对工作台 v0.2，默认端口 8792。若它使用其他端口，例如 8802，可运行 `python server.py --ledger-port 8802`。对账服务未开时，会如实记录连接异常，隔离演练仍可独立使用。可用 `--port` 指定工作台端口，用 `--db` 指定事件数据库。\n\n## 五分钟演示\n\n1. 在「监控总览」核对两个探针。双账服务启动且空闲时，可看到实时 HTTP 探测耗时、零排队与近 20 次采样。\n2. 进入「故障演练」，选「任务积压」并启动。隔离服务继续返回 HTTP 200，样例队列有 4 项排队、1 项运行，最早任务已等 95 秒。打开新事件，核对首次探测记录。\n3. 签收事件，再回到演练页点击「立即探测」。相同故障的异常采样次数增加，事件编号保持一致。双账探针独立采样。\n4. 点击「解除故障」。第一次健康探测进入恢复验证，再次探测健康后自动关闭。打开「事件记录」选择此次演练，导出时间线 CSV，核对首次异常、签收、解除和恢复的先后。\n5. 可换成 HTTP 503 或响应延迟演练。界面上的真实服务和演练数据分别标注来源，每次切换演练都会立即触发探测。\n\n## 判定与数据\n\n- 每个目标独立轮询，一次采样结束后等待约 3 秒。未完成任务最久达到 45 秒、健康接口耗时达到 400 毫秒、HTTP 错误、无法连接或健康数据不符合契约均会生成异常采样。\n- 每个目标同时最多有一条未恢复事件。重复故障累计采样数，连续两次健康才恢复，恢复过程中复发则重新计数。签收表示有人看到告警，恢复由探针判断。\n- 数据存在本机 SQLite 中。每个目标保留近 20 个采样点，事件和处置时间线持久化。列表展示全部未结束事件和最近 60 起已恢复事件，已有事件的详情链接和 CSV 可按编号回查。\n- 演练故障通过本机独立 HTTP 端点返回预设队列或状态，真实探针使用同一套探测、归并与恢复逻辑。页面时间使用浏览器本地时区，CSV 时间标为 UTC。\n\n运行 `python -m unittest discover -v` 可在隔离环境重放探测、持续异常、恢复时复发和持久化等用例。\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 故障响应工作台 v0.1 源码包\n\n原始发布归档为 `故障响应工作台-v0.1.zip`。压缩包保留其中 8 份文本文件的原始路径与字节，本文件为导出说明。\n\n使用 Python 3.10 或更新版本，在项目根目录运行 `python server.py` 或 `python -m unittest discover -v`。演练服务会随工作台启动。README 中列出了真实对账服务的探针连接方式。\n","group":"项目说明"},{"path":"monitor.py","text":"\"\"\"Read-only local HTTP probe and durable incident state.\"\"\"\nfrom contextlib import closing\nimport http.client\nimport json\nimport sqlite3\nimport threading\nimport time\nfrom datetime import datetime, timezone\nfrom urllib.parse import urlsplit\n\n\nSLOW_MS = 400\nBACKLOG_SECONDS = 45\nINTERVAL_SECONDS = 3\nSCENARIOS = {\"idle\": \"正常\", \"backlog\": \"任务积压\", \"errors\": \"接口错误\", \"slow\": \"响应延迟\"}\nTARGET_NAMES = {\"ledger\": \"双账核对工作台\", \"drill\": \"隔离演练服务\"}\n\n\nclass Problem(Exception):\n    def __init__(self, status, message):\n        super().__init__(message)\n        self.status = status\n\n\ndef now():\n    return datetime.now(timezone.utc).isoformat(timespec=\"milliseconds\").replace(\"+00:00\", \"Z\")\n\n\ndef observe(url, origin):\n    \"\"\"A single HTTP request with no proxy, redirects, or credentials.\"\"\"\n    endpoint = urlsplit(url)\n    started = time.monotonic()\n    result = dict(ok=False, reason=\"unreachable\", message=\"连接失败\",\n                  http_status=None, latency_ms=None, queued=None, running=None, oldest_pending_seconds=None)\n\n    def outcome(reason, message):\n        result.update(at=now(), ok=reason == \"ok\", reason=reason, message=message)\n        return result\n\n    try:\n        with closing(http.client.HTTPConnection(endpoint.hostname, endpoint.port, timeout=2)) as conn:\n            conn.request(\"GET\", endpoint.path, headers={\"Accept\": \"application/json\"})\n            response = conn.getresponse()\n            result[\"http_status\"] = response.status\n            raw = response.read(16385)\n        result[\"latency_ms\"] = round((time.monotonic() - started) * 1000)\n        if response.status != 200:\n            return outcome(\"errors\", f\"健康接口返回 HTTP {response.status}。\")\n        if len(raw) > 16384:\n            return outcome(\"invalid\", \"健康响应超过约定大小，无法核验。\")\n        data = json.loads(raw)\n        required = (\"queued\", \"running\", \"oldest_pending_seconds\")\n        expected_service = \"reconcile\" if origin == \"ledger\" else \"incident-fixture\"\n        if (not isinstance(data, dict) or data.get(\"service\") != expected_service or\n                not isinstance(data.get(\"status\"), str) or not isinstance(data.get(\"queue\"), dict)):\n            return outcome(\"invalid\", \"健康响应缺少约定的服务标识、状态或队列。\")\n        queue = data[\"queue\"]\n        if any(type(queue.get(key)) is not int or queue[key] \u003c 0 for key in required):\n            return outcome(\"invalid\", \"队列指标缺失或取值无效。\")\n        result.update({key: queue[key] for key in required})\n        if data[\"status\"] != \"ok\":\n            return outcome(\"errors\", \"健康接口报告服务状态异常。\")\n        if queue[\"queued\"] + queue[\"running\"] and queue[\"oldest_pending_seconds\"] >= BACKLOG_SECONDS:\n            return outcome(\"backlog\", f\"HTTP 200，排队 {queue['queued']} 项、运行 {queue['running']} 项，最早未完成任务已等 {queue['oldest_pending_seconds']} 秒。\")\n        if result[\"latency_ms\"] >= SLOW_MS:\n            return outcome(\"slow\", f\"HTTP 200，健康请求耗时 {result['latency_ms']} 毫秒，阈值为 {SLOW_MS} 毫秒。\")\n        return outcome(\"ok\", f\"HTTP 200，耗时 {result['latency_ms']} 毫秒，排队 {queue['queued']} 项、运行 {queue['running']} 项。\")\n    except (OSError, http.client.HTTPException):\n        result[\"latency_ms\"] = round((time.monotonic() - started) * 1000)\n        return outcome(\"unreachable\", \"健康请求未完成，请核对本机服务是否启动或应答超时。\")\n    except (ValueError, UnicodeError, RecursionError):\n        return outcome(\"invalid\", \"健康接口返回了无法解析的 JSON。\")\n\n\nclass Store:\n    def __init__(self, path):\n        self.lock = threading.RLock()\n        self.db = sqlite3.connect(path, check_same_thread=False)\n        self.db.row_factory = sqlite3.Row\n        self.db.executescript(\"\"\"\n            PRAGMA journal_mode=WAL;\n            PRAGMA foreign_keys=ON;\n            CREATE TABLE IF NOT EXISTS samples (\n                id INTEGER PRIMARY KEY, target TEXT NOT NULL, data TEXT NOT NULL\n            );\n            CREATE INDEX IF NOT EXISTS sample_target ON samples(target,id);\n            CREATE TABLE IF NOT EXISTS incidents (\n                id INTEGER PRIMARY KEY, target TEXT NOT NULL, reason TEXT NOT NULL,\n                status TEXT NOT NULL, opened_at TEXT NOT NULL, acknowledged_at TEXT,\n                resolved_at TEXT, failed_samples INTEGER NOT NULL, healthy_streak INTEGER NOT NULL,\n                summary TEXT NOT NULL\n            );\n            CREATE UNIQUE INDEX IF NOT EXISTS one_active ON incidents(target) WHERE status \u003c> 'resolved';\n            CREATE TABLE IF NOT EXISTS events (\n                seq INTEGER PRIMARY KEY, incident_id INTEGER NOT NULL REFERENCES incidents(id),\n                at TEXT NOT NULL, kind TEXT NOT NULL, message TEXT NOT NULL\n            );\n            CREATE INDEX IF NOT EXISTS event_parent ON events(incident_id,seq);\n            CREATE TABLE IF NOT EXISTS drill_mode (\n                id INTEGER PRIMARY KEY CHECK (id=1), scenario TEXT NOT NULL, changed_at TEXT NOT NULL\n            );\n        \"\"\")\n        with self.db:\n            self.db.execute(\"INSERT OR IGNORE INTO drill_mode VALUES (1,'idle',?)\", (now(),))\n\n    def close(self):\n        with self.lock:\n            self.db.close()\n\n    def event(self, incident_id, at, kind, message):\n        self.db.execute(\"INSERT INTO events(incident_id,at,kind,message) VALUES (?,?,?,?)\",\n                        (incident_id, at, kind, message))\n\n    def active(self, target):\n        return self.db.execute(\"SELECT * FROM incidents WHERE target=? AND status \u003c> 'resolved'\", (target,)).fetchone()\n\n    def record(self, target, sample):\n        with self.lock, self.db:\n            self.db.execute(\"INSERT INTO samples(target,data) VALUES (?,?)\", (target, json.dumps(sample, ensure_ascii=False)))\n            self.db.execute(\"\"\"DELETE FROM samples WHERE target=? AND id NOT IN\n                (SELECT id FROM samples WHERE target=? ORDER BY id DESC LIMIT 20)\"\"\", (target, target))\n            incident = self.active(target)\n            stamp, message = sample[\"at\"], sample[\"message\"]\n            if not sample[\"ok\"]:\n                if incident is None:\n                    key = self.db.execute(\"\"\"INSERT INTO incidents\n                        (target,reason,status,opened_at,failed_samples,healthy_streak,summary)\n                        VALUES (?,?,'open',?,1,0,?)\"\"\", (target, sample[\"reason\"], stamp, message)).lastrowid\n                    self.event(key, stamp, \"detected\", message)\n                    return\n                key = incident[\"id\"]\n                if incident[\"healthy_streak\"]:\n                    self.event(key, stamp, \"relapsed\", \"恢复确认中再次出现异常。\" + message)\n                elif incident[\"reason\"] != sample[\"reason\"]:\n                    self.event(key, stamp, \"symptom\", \"探针异常类型发生变化。\" + message)\n                self.db.execute(\"\"\"UPDATE incidents SET reason=?, failed_samples=failed_samples+1,\n                    healthy_streak=0, summary=? WHERE id=?\"\"\", (sample[\"reason\"], message, key))\n            elif incident is not None:\n                key = incident[\"id\"]\n                if incident[\"healthy_streak\"] == 0:\n                    self.db.execute(\"UPDATE incidents SET healthy_streak=1 WHERE id=?\", (key,))\n                    self.event(key, stamp, \"healthy_probe\", \"第一次健康采样。\" + message)\n                else:\n                    self.db.execute(\"UPDATE incidents SET status='resolved', resolved_at=?, healthy_streak=2 WHERE id=?\",\n                                    (stamp, key))\n                    self.event(key, stamp, \"resolved\", \"连续两次健康采样，事件已恢复。\" + message)\n\n    def acknowledge(self, key):\n        with self.lock, self.db:\n            row = self.db.execute(\"SELECT status FROM incidents WHERE id=?\", (key,)).fetchone()\n            if row is None:\n                raise Problem(404, \"未找到这条事件。\")\n            if row[\"status\"] == \"resolved\":\n                raise Problem(409, \"事件已经恢复。\")\n            if row[\"status\"] == \"open\":\n                stamp = now()\n                self.db.execute(\"UPDATE incidents SET status='acknowledged',acknowledged_at=? WHERE id=?\", (stamp, key))\n                self.event(key, stamp, \"acknowledged\", \"值班人已确认收到告警。\")\n\n    def drill(self):\n        with self.lock:\n            return dict(self.db.execute(\"SELECT scenario, changed_at FROM drill_mode\").fetchone())\n\n    def set_mode(self, scenario):\n        with self.lock, self.db:\n            before = self.drill()[\"scenario\"]\n            if before == scenario:\n                return False\n            active = self.active(\"drill\")\n            if scenario != \"idle\" and (before != \"idle\" or active is not None):\n                raise Problem(409, \"请先解除当前演练，并等待连续两次健康采样确认恢复。\")\n            stamp = now()\n            self.db.execute(\"UPDATE drill_mode SET scenario=?,changed_at=?\", (scenario, stamp))\n            if active is not None and scenario == \"idle\":\n                self.event(active[\"id\"], stamp, \"action\", \"已解除演练条件，等待探针验证恢复。\")\n            return True\n\n    def _details(self, row):\n        item = dict(row)\n        item[\"origin\"] = \"live\" if item[\"target\"] == \"ledger\" else \"drill\"\n        item[\"timeline\"] = [dict(event) for event in self.db.execute(\n            \"SELECT at,kind,message FROM events WHERE incident_id=? ORDER BY seq\", (item[\"id\"],))]\n        return item\n\n    def incident(self, key):\n        with self.lock:\n            row = self.db.execute(\"SELECT * FROM incidents WHERE id=?\", (key,)).fetchone()\n            if row is None:\n                raise Problem(404, \"未找到这条事件。\")\n            return self._details(row)\n\n    def state(self, urls):\n        with self.lock:\n            targets = []\n            for key, url in urls.items():\n                samples = [json.loads(row[0]) for row in self.db.execute(\n                    \"SELECT data FROM samples WHERE target=? ORDER BY id\", (key,))]\n                last = samples[-1] if samples else None\n                active = self.active(key)\n                status = \"unknown\" if last is None else (\"healthy\" if last[\"ok\"] else \"unhealthy\")\n                if active is not None and active[\"healthy_streak\"]:\n                    status = \"recovering\"\n                targets.append(dict(id=key, label=TARGET_NAMES[key], url=url, status=status, last=last, samples=samples))\n            rows = self.db.execute(\"\"\"SELECT * FROM incidents WHERE status \u003c> 'resolved' OR id IN\n                (SELECT id FROM incidents WHERE status='resolved' ORDER BY id DESC LIMIT 60) ORDER BY id DESC\"\"\").fetchall()\n            return dict(targets=targets, incidents=[self._details(row) for row in rows], drill=self.drill(),\n                        interval_seconds=INTERVAL_SECONDS,\n                        thresholds={\"latency_ms\": SLOW_MS, \"oldest_pending_seconds\": BACKLOG_SECONDS, \"healthy_samples\": 2})\n","group":"后端"},{"path":"server.py","text":"\"\"\"Local incident desk. Run with Python 3.10 or later.\"\"\"\nimport argparse\nfrom contextlib import contextmanager\nimport csv\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nimport io\nimport json\nimport logging\nimport mimetypes\nimport os\nfrom pathlib import Path\nimport re\nimport threading\nimport time\nfrom urllib.parse import unquote, urlsplit\n\nfrom monitor import INTERVAL_SECONDS, SCENARIOS, Problem, Store, observe\n\n\nROOT = Path(__file__).resolve().parent\nINCIDENT_ROUTE = re.compile(r\"/api/incidents/([1-9][0-9]{0,17})(/timeline\\.csv|/ack)?\")\n\n\n@contextmanager\ndef own_database(path):\n    \"\"\"One periodic sampler owns each incident database, including across processes.\"\"\"\n    with path.with_name(path.name + \".lock\").open(\"a+b\") as handle:\n        if os.name == \"nt\":\n            import msvcrt\n            if not handle.tell():\n                handle.write(b\"0\")\n                handle.flush()\n            handle.seek(0)\n            try:\n                msvcrt.locking(handle.fileno(), msvcrt.LK_NBLCK, 1)\n            except OSError as error:\n                raise RuntimeError(\"另一个工作台正在探测并写入此数据库。\") from error\n        else:\n            import fcntl\n            try:\n                fcntl.flock(handle.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)\n            except BlockingIOError as error:\n                raise RuntimeError(\"另一个工作台正在探测并写入此数据库。\") from error\n        yield\n\n\nclass LocalHandler(BaseHTTPRequestHandler):\n    def log_message(self, *args):\n        pass\n\n    def send_bytes(self, body, content_type, status=200, attachment=None):\n        self.send_response(status)\n        self.send_header(\"Content-Type\", content_type)\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.send_header(\"Cache-Control\", \"no-store\")\n        self.send_header(\"X-Content-Type-Options\", \"nosniff\")\n        if attachment:\n            self.send_header(\"Content-Disposition\", f'attachment; filename=\"{attachment}\"')\n        self.end_headers()\n        self.wfile.write(body)\n\n    def send_json(self, data, status=200):\n        self.send_bytes(json.dumps(data, ensure_ascii=False).encode(), \"application/json; charset=utf-8\", status)\n\n\nclass Fixture(LocalHandler):\n    \"\"\"An independent loopback endpoint; modes only affect this fixture.\"\"\"\n    def do_GET(self):\n        if self.path != \"/api/health\":\n            return self.send_json({\"error\": \"路径不存在。\"}, 404)\n        scenario = self.server.store.drill()[\"scenario\"]\n        if scenario == \"errors\":\n            return self.send_json({\"service\": \"incident-fixture\", \"status\": \"unavailable\"}, 503)\n        if scenario == \"slow\":\n            time.sleep(0.65)\n        queue = {\"queued\": 4, \"running\": 1, \"oldest_pending_seconds\": 95} if scenario == \"backlog\" else {\n            \"queued\": 0, \"running\": 0, \"oldest_pending_seconds\": 0}\n        self.send_json({\"service\": \"incident-fixture\", \"status\": \"ok\", \"queue\": queue})\n\n\nclass Controller:\n    def __init__(self, store, ledger_port, fixture_port):\n        self.store = store\n        self.urls = {\"ledger\": f\"http://127.0.0.1:{ledger_port}/api/health\",\n                     \"drill\": f\"http://127.0.0.1:{fixture_port}/api/health\"}\n        self.locks = {key: threading.RLock() for key in self.urls}\n        self.stopping = threading.Event()\n        self.workers = []\n\n    def probe(self, target):\n        if not isinstance(target, str) or target not in self.urls:\n            raise Problem(400, \"请选择已有的探针目标。\")\n        with self.locks[target]:\n            self.store.record(target, observe(self.urls[target], target))\n\n    def switch(self, scenario):\n        if not isinstance(scenario, str) or scenario not in SCENARIOS:\n            raise Problem(400, \"未知的演练场景。\")\n        with self.locks[\"drill\"]:\n            if self.store.set_mode(scenario):\n                self.probe(\"drill\")\n\n    def run(self, target):\n        while not self.stopping.is_set():\n            try:\n                self.probe(target)\n            except Exception:\n                logging.exception(\"Cannot save probe for %s\", target)\n            self.stopping.wait(INTERVAL_SECONDS)\n\n    def start(self):\n        self.workers = [threading.Thread(target=self.run, args=(key,), daemon=True) for key in self.urls]\n        for worker in self.workers:\n            worker.start()\n\n    def stop(self):\n        self.stopping.set()\n        for worker in self.workers:\n            worker.join()\n\n    def state(self):\n        return self.store.state(self.urls)\n\n\nclass Desk(LocalHandler):\n    def handle_api(self, method):\n        try:\n            port = self.server.server_port\n            hosts = {f\"localhost:{port}\", f\"127.0.0.1:{port}\"}\n            if self.headers.get(\"Host\", \"\").lower() not in hosts:\n                raise Problem(403, \"请通过本机地址打开工作台。\")\n            self.route(method)\n        except Problem as error:\n            self.send_json({\"error\": str(error)}, error.status)\n        except (BrokenPipeError, ConnectionResetError, ConnectionAbortedError):\n            pass\n        except Exception:\n            logging.exception(\"Incident desk request failed\")\n            self.send_json({\"error\": \"工作台未能完成本次操作。\"}, 500)\n\n    def do_GET(self):\n        self.handle_api(\"GET\")\n\n    def do_POST(self):\n        self.handle_api(\"POST\")\n\n    def body(self):\n        try:\n            size = int(self.headers.get(\"Content-Length\", \"0\"))\n        except ValueError as error:\n            raise Problem(400, \"请求长度无效。\") from error\n        if not 0 \u003c size \u003c= 2048:\n            raise Problem(400, \"请提供一个简短的 JSON 对象。\")\n        if self.headers.get_content_type() != \"application/json\":\n            raise Problem(415, \"请求需要 JSON 内容类型。\")\n        origin = self.headers.get(\"Origin\")\n        if origin and origin != \"http://\" + self.headers[\"Host\"]:\n            raise Problem(403, \"请从本机工作台发起操作。\")\n        try:\n            payload = json.loads(self.rfile.read(size))\n        except (ValueError, UnicodeError, RecursionError) as error:\n            raise Problem(400, \"无法读取操作参数。\") from error\n        if not isinstance(payload, dict):\n            raise Problem(400, \"操作参数必须是对象。\")\n        return payload\n\n    def route(self, method):\n        path = urlsplit(self.path).path\n        controller = self.server.controller\n        store = controller.store\n        item = INCIDENT_ROUTE.fullmatch(path)\n        if method == \"POST\":\n            payload = self.body()\n            if path == \"/api/drill\":\n                controller.switch(payload.get(\"scenario\"))\n            elif path == \"/api/probe\":\n                controller.probe(payload.get(\"target\"))\n            elif item and item[2] == \"/ack\":\n                store.acknowledge(int(item[1]))\n            else:\n                raise Problem(404, \"操作路径不存在。\")\n            return self.send_json(controller.state())\n        if path == \"/api/state\":\n            return self.send_json(controller.state())\n        if item and item[2] in (None, \"/timeline.csv\"):\n            incident = store.incident(int(item[1]))\n            if item[2] is None:\n                return self.send_json(incident)\n            stream = io.StringIO(newline=\"\")\n            writer = csv.writer(stream)\n            writer.writerow([\"事件编号\", \"探针来源\", \"时间（UTC）\", \"记录类型\", \"观察或处置\"])\n            for event in incident[\"timeline\"]:\n                writer.writerow([incident[\"id\"], incident[\"origin\"], event[\"at\"], event[\"kind\"], event[\"message\"]])\n            return self.send_bytes(stream.getvalue().encode(\"utf-8-sig\"), \"text/csv; charset=utf-8\",\n                                   attachment=f\"incident-{incident['id']}-timeline.csv\")\n        if path.startswith(\"/api/\"):\n            raise Problem(404, \"未找到接口。\")\n        static = ROOT / \"static\"\n        candidate = (static / (unquote(path).lstrip(\"/\") or \"index.html\")).resolve()\n        if static not in candidate.parents or not candidate.is_file():\n            raise Problem(404, \"未找到页面。\")\n        content_type = {\".css\": \"text/css\", \".html\": \"text/html\", \".js\": \"text/javascript\"}.get(candidate.suffix)\n        if content_type:\n            content_type += \"; charset=utf-8\"\n        else:\n            content_type = mimetypes.guess_type(str(candidate))[0] or \"application/octet-stream\"\n        self.send_bytes(candidate.read_bytes(), content_type)\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"本机故障响应工作台\")\n    parser.add_argument(\"--db\", type=Path, default=ROOT / \"data\" / \"incident.sqlite3\")\n    parser.add_argument(\"--port\", type=int, default=8793)\n    parser.add_argument(\"--ledger-port\", type=int, default=8792, help=\"本机对账服务端口，默认 8792\")\n    args = parser.parse_args()\n    if not 1 \u003c= args.ledger_port \u003c= 65535 or not 0 \u003c= args.port \u003c= 65535:\n        parser.error(\"端口无效。\")\n    args.db.parent.mkdir(parents=True, exist_ok=True)\n    with own_database(args.db), ThreadingHTTPServer((\"127.0.0.1\", args.port), Desk) as app, \\\n            ThreadingHTTPServer((\"127.0.0.1\", 0), Fixture) as fixture:\n        store = Store(args.db)\n        fixture.store = store\n        controller = Controller(store, args.ledger_port, fixture.server_port)\n        app.controller = controller\n        fixture_thread = threading.Thread(target=fixture.serve_forever, daemon=True)\n        fixture_thread.start()\n        controller.start()\n        try:\n            print(f\"http://127.0.0.1:{app.server_port}/\", flush=True)\n            app.serve_forever()\n        except KeyboardInterrupt:\n            pass\n        finally:\n            controller.stop()\n            fixture.shutdown()\n            fixture_thread.join()\n            store.close()\n\n\nif __name__ == \"__main__\":\n    main()\n","group":"后端"},{"path":"start-incident.cmd","text":"@echo off\nsetlocal\ncd /d \"%~dp0\"\nwhere py >nul 2>nul\nif errorlevel 1 (\n  python server.py\n) else (\n  py -3 server.py\n)\nif errorlevel 1 pause\n","group":"配置与启动"},{"path":"static/app.js","text":"\"use strict\";\n\nconst targets = {ledger:\"双账核对服务\", drill:\"隔离演练服务\"};\nconst reasons = {ok:\"探测正常\", backlog:\"任务积压\", errors:\"服务错误\", slow:\"响应缓慢\", unreachable:\"连接失败\", invalid:\"健康数据无效\"};\nconst scenarios = {\n  backlog:[\"任务积压\",\"健康接口仍能访问，但最早待处理任务已超时。\"],\n  errors:[\"服务错误\",\"演练服务返回错误状态，查看首次异常与后续恢复。\"],\n  slow:[\"响应缓慢\",\"演练服务延迟返回，观察耗时触发的告警。\"]\n};\nconst targetStates = {unknown:[\"待探测\",\"none\"],healthy:[\"正常\",\"\"],unhealthy:[\"异常\",\"bad\"],recovering:[\"恢复验证中\",\"warn\"]};\nconst incidentStates = {open:[\"待签收\",\"bad\"],acknowledged:[\"已签收\",\"warn\"],resolved:[\"已恢复\",\"\"]};\nconst el = id => document.getElementById(id);\nconst escape = value => String(value ?? \"\").replace(/[&\u003c>\"']/g, char => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[char]));\nconst dates = new Intl.DateTimeFormat(\"zh-CN\",{month:\"2-digit\",day:\"2-digit\",hour:\"2-digit\",minute:\"2-digit\",second:\"2-digit\",hour12:false});\nconst clocks = new Intl.DateTimeFormat(\"zh-CN\",{hour:\"2-digit\",minute:\"2-digit\",second:\"2-digit\",hour12:false});\nlet state = null;\nlet currentView = \"\";\nlet working = false;\nlet pollInFlight = false;\nlet sequence = 0;\nlet latest = 0;\nlet lastReceived = null;\nlet chosenScenario = \"backlog\";\nlet archiveId = 0;\nlet archiveRecord = null;\nlet archiveMessage = \"\";\n\nasync function loadArchived(id) {\n  archiveId=id;\n  archiveRecord=null;\n  archiveMessage=\"正在读取这条事件…\";\n  try {\n    const response=await fetch(\"/api/incidents/\"+id,{cache:\"no-store\"});\n    const data=await response.json();\n    if(archiveId!==id) return;\n    if(response.ok) archiveRecord=data;\n    else archiveMessage=data.error || \"事件读取失败。\";\n  } catch {\n    if(archiveId===id) archiveMessage=\"读取失败，请重新打开该事件。\";\n  }\n  if(route().id===id) render();\n}\n\nfunction stamp(value, compact=false) {\n  const date = new Date(value || NaN);\n  return Number.isNaN(date.getTime()) ? \"—\" : (compact ? clocks : dates).format(date);\n}\nfunction chip([label,kind]) {\n  return '\u003cspan class=\"chip '+kind+'\">'+escape(label)+'\u003c/span>';\n}\nfunction setMarkup(id, html) {\n  const node = el(id);\n  if (!node || node.savedMarkup === html) return;\n  const priorFocus = node.contains(document.activeElement) ? document.activeElement.id : \"\";\n  node.innerHTML = html;\n  node.savedMarkup = html;\n  if (priorFocus) el(priorFocus)?.focus({preventScroll:true});\n}\nfunction action(label,command,id,primary=false) {\n  return '\u003cbutton type=\"button\" id=\"'+id+'\" class=\"button'+(primary?' primary':'')+'\" data-command=\"'+command+'\">'+escape(label)+'\u003c/button>';\n}\nfunction eventStatus(item) {\n  return chip(incidentStates[item.status] || [\"未知\",\"none\"]);\n}\nfunction eventTitle(item) {\n  return targets[item.target]+\" · \"+(reasons[item.reason] || item.summary || \"服务异常\");\n}\nfunction serviceCard(target) {\n  const last = target.last || {};\n  const count = (value,unit) => Number.isFinite(value) ? escape(value)+'\u003csmall>'+unit+'\u003c/small>' : \"—\";\n  const samples = target.samples || [];\n  const failed = samples.filter(sample=>!sample.ok).length;\n  const strip = samples.map(sample=>'\u003ci class=\"bar'+(sample.ok?'':' fail')+'\" title=\"'+escape(stamp(sample.at)+' '+(sample.ok?'成功':'异常'))+'\">\u003c/i>').join(\"\");\n  return '\u003carticle class=\"service '+escape(target.id)+'\">'+\n    '\u003cdiv class=\"service-head\">\u003cdiv>\u003ch3 class=\"service-name\">'+escape(targets[target.id] || target.label)+'\u003c/h3>'+\n    '\u003cp class=\"scope\">'+(target.id===\"ledger\"?'真实探针 · 双账健康接口':'独立模拟服务 · 本机演练')+'\u003c/p>\u003c/div>'+chip(targetStates[target.status] || targetStates.unknown)+'\u003c/div>'+\n    '\u003cdl class=\"metrics\">\u003cdiv>\u003cdt>响应耗时\u003c/dt>\u003cdd>'+count(last.latency_ms,\"ms\")+'\u003c/dd>\u003c/div>'+\n    '\u003cdiv>\u003cdt>排队任务\u003c/dt>\u003cdd>'+count(last.queued,\"项\")+'\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>最早待处理\u003c/dt>\u003cdd>'+count(last.oldest_pending_seconds,\"秒\")+'\u003c/dd>\u003c/div>\u003c/dl>'+\n    '\u003cdiv class=\"strip\">\u003cspan class=\"bars-caption\">近 '+samples.length+' 次探测 · '+failed+' 次异常\u003c/span>\u003cspan class=\"bars\" aria-hidden=\"true\">'+strip+'\u003c/span>\u003c/div>'+\n    (last.ok===false?'\u003cp class=\"service-note\">'+escape(last.message || reasons[last.reason])+'\u003c/p>':'')+\n    '\u003cdiv class=\"service-bottom\">\u003ctime>上次 '+stamp(last.at,true)+'\u003c/time>'+\n    '\u003cbutton type=\"button\" class=\"text-link\" id=\"probe-'+escape(target.id)+'\" data-command=\"probe-'+escape(target.id)+'\">立即探测\u003c/button>\u003c/div>\u003c/article>';\n}\nfunction eventList(items,empty) {\n  if (!items.length) return '\u003cp class=\"empty\">'+escape(empty)+'\u003c/p>';\n  return '\u003cul class=\"event-list\">'+items.map(item=>'\u003cli class=\"event-item\">\u003ca id=\"item-'+Number(item.id)+'\" href=\"#incident/'+Number(item.id)+'\">\u003cspan>\u003cstrong>'+escape(eventTitle(item))+'\u003c/strong>'+\n    '\u003csmall>#'+Number(item.id)+'　'+stamp(item.opened_at)+'　'+(item.target===\"drill\"?\"隔离演练\":\"真实服务\")+'\u003c/small>\u003c/span>'+eventStatus(item)+'\u003c/a>\u003c/li>').join(\"\")+'\u003c/ul>';\n}\nfunction route() {\n  const hash=location.hash.slice(1);\n  if (hash===\"drill\") return {page:\"drill\"};\n  if (/^history(?:\\/(?:drill|ledger))?$/.test(hash)) return {page:\"history\",filter:hash.split(\"/\")[1] || \"all\"};\n  if (/^incident\\/[1-9]\\d*$/.test(hash)) return {page:\"incident\",id:Number(hash.split(\"/\")[1])};\n  return {page:\"overview\"};\n}\nfunction pageShell(view) {\n  const pages = {\n    overview:[\"监控总览\",\"查看真实服务和演练环境的探测结果。\",\"\"],\n    drill:[\"故障演练\",\"在隔离服务触发故障，跟踪告警、签收与恢复。\",'\u003ca class=\"button\" href=\"#history/drill\">演练记录\u003c/a>'],\n    history:[\"事件记录\",\"查看所有未结束事件与最近 60 起已恢复事件。\",\"\"],\n    incident:[\"事件详情\",\"核对探测证据和每一次状态变更。\",'\u003ca class=\"button\" href=\"#history\">返回事件记录\u003c/a>']\n  };\n  const [title,subtitle,headAction]=pages[view.page];\n  el(\"title\").textContent=title;\n  el(\"subtitle\").textContent=subtitle;\n  setMarkup(\"head-action\",headAction);\n  for(const a of document.querySelectorAll(\"[data-nav]\")){\n    if(a.dataset.nav===(view.page===\"incident\"?\"history\":view.page)) a.setAttribute(\"aria-current\",\"page\");\n    else a.removeAttribute(\"aria-current\");\n  }\n  const body={\n    overview:'\u003csection>\u003cdiv class=\"section-title\">\u003ch2>服务探针\u003c/h2>\u003csmall id=\"frequency\">\u003c/small>\u003c/div>\u003cdiv id=\"services\" class=\"services\">\u003c/div>\u003c/section>'+\n      '\u003cdiv class=\"lower\">\u003csection class=\"panel\">\u003cdiv class=\"section-title\">\u003ch2>最近事件\u003c/h2>\u003ca class=\"text-link\" href=\"#history\">全部记录\u003c/a>\u003c/div>\u003cdiv id=\"recent\">\u003c/div>\u003c/section>'+\n      '\u003csection class=\"panel aside-panel\">\u003ch2>演练一次任务积压\u003c/h2>\u003cp>模拟后台任务停止处理，查看健康接口仍能响应时，值班台如何发现问题。\u003c/p>\u003ca class=\"button primary\" href=\"#drill\">进入故障演练 \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/section>\u003c/div>',\n    drill:'\u003cdiv class=\"drill-layout\">\u003csection class=\"panel\">\u003cdiv class=\"section-title\">\u003ch2>演练控制\u003c/h2>\u003cspan id=\"drill-badge\">\u003c/span>\u003c/div>'+\n      '\u003cfieldset class=\"scenarios\" id=\"scenario-fields\">\u003clegend>选择故障场景\u003c/legend>'+\n      Object.entries(scenarios).map(([key,[name,desc]])=>'\u003clabel class=\"scenario\">\u003cinput id=\"choice-'+key+'\" type=\"radio\" name=\"scenario\" value=\"'+key+'\" '+(key===chosenScenario?'checked':'')+'>\u003cspan>\u003cstrong>'+name+'\u003c/strong>\u003csmall>'+desc+'\u003c/small>\u003c/span>\u003c/label>').join(\"\")+\n      '\u003c/fieldset>\u003cdiv id=\"drill-actions\">\u003c/div>\u003cp class=\"state-note\" id=\"thresholds\">\u003c/p>\u003c/section>\u003cdiv id=\"drill-service\">\u003c/div>\u003c/div>'+\n      '\u003csection class=\"panel stacked\" style=\"margin-top:16px\">\u003cdiv class=\"section-title\">\u003ch2>本环境事件\u003c/h2>\u003ca class=\"text-link\" href=\"#history/drill\">全部演练记录\u003c/a>\u003c/div>\u003cdiv id=\"drill-events\">\u003c/div>\u003c/section>',\n    history:'\u003csection class=\"panel\">\u003cdiv class=\"section-title\">\u003ch2>事件列表\u003c/h2>\u003csmall id=\"event-count\">\u003c/small>\u003c/div>\u003cnav id=\"filters\" class=\"list-filter\" aria-label=\"筛选事件来源\">\u003c/nav>\u003cdiv id=\"events\">\u003c/div>\u003c/section>',\n    incident:'\u003cdiv id=\"event-detail\">\u003c/div>'\n  };\n  setMarkup(\"workspace\",body[view.page]);\n}\nfunction renderDetails(item) {\n  if(!item) return '\u003csection class=\"panel\">\u003ch2>事件记录\u003c/h2>\u003cp class=\"body-copy\">'+escape(archiveMessage)+'\u003c/p>\u003c/section>';\n  let timeline=(item.timeline || []).map(step=>'\u003cli>\u003cdiv>\u003ctime>'+stamp(step.at)+'\u003c/time>\u003cp>'+escape(step.message)+'\u003c/p>\u003c/div>\u003c/li>').join(\"\");\n  const fact=(key,val)=>'\u003cdiv>\u003cdt>'+key+'\u003c/dt>\u003cdd>'+escape(val)+'\u003c/dd>\u003c/div>';\n  return '\u003cdiv class=\"detail-layout\">\u003csection class=\"panel\">\u003cdiv class=\"section-title\">\u003ch2>'+escape(eventTitle(item))+'\u003c/h2>'+eventStatus(item)+'\u003c/div>'+\n    '\u003cp class=\"body-copy\">'+escape(item.summary)+'\u003c/p>\u003ch3 style=\"margin-top:16px\">处置时间线\u003c/h3>\u003col class=\"timeline\">'+timeline+'\u003c/ol>\u003c/section>'+\n    '\u003csection class=\"panel\">\u003ch2>事件凭据\u003c/h2>\u003cdl class=\"facts\">'+fact(\"事件编号\",\"#\"+item.id)+fact(\"来源\",item.target===\"drill\"?\"隔离演练\":\"双账核对服务\")+fact(\"首次异常\",stamp(item.opened_at))+fact(\"异常采样\",item.failed_samples+\" 次\")+fact(\"签收时间\",stamp(item.acknowledged_at))+fact(\"恢复时间\",stamp(item.resolved_at))+\n    '\u003c/dl>\u003cdiv class=\"actions\">'+(item.status===\"open\"?action(\"签收事件\",\"ack-\"+item.id,\"ack-event\",true):'')+\n    '\u003ca class=\"button\" href=\"/api/incidents/'+Number(item.id)+'/timeline.csv\" download>导出时间线 CSV\u003c/a>\u003c/div>'+\n    (item.target===\"drill\" && item.status!==\"resolved\"?'\u003cp class=\"state-note\">\u003ca class=\"text-link\" href=\"#drill\">返回演练控制\u003c/a>\u003c/p>':'')+'\u003c/section>\u003c/div>';\n}\nfunction render() {\n  const view=route();\n  if(currentView!==view.page){\n    pageShell(view);\n    currentView=view.page;\n  }\n  if(!state) return;\n  const events=state.incidents || [];\n  if(view.page===\"overview\"){\n    el(\"frequency\").textContent=\"采样间隔约 \"+state.interval_seconds+\" 秒\";\n    setMarkup(\"services\",state.targets.map(serviceCard).join(\"\"));\n    setMarkup(\"recent\",eventList(events.slice(0,4),\"尚无事件。发生异常后的首次探测会自动建立记录。\"));\n  } else if(view.page===\"drill\"){\n    const current=state.drill.scenario;\n    const active=current!==\"idle\";\n    const drill=state.targets.find(target=>target.id===\"drill\");\n    const limits=state.thresholds;\n    el(\"thresholds\").textContent=\"未完成任务最久满 \"+limits.oldest_pending_seconds+\" 秒，或响应耗时达到 \"+limits.latency_ms+\" ms 即告警。切换演练会立即采样，解除后需连续 \"+limits.healthy_samples+\" 次正常才会关闭事件。\";\n    setMarkup(\"drill-badge\",chip(active?[scenarios[current]?.[0] || \"演练中\",\"warn\"]:[\"待命\",\"none\"]));\n    el(\"scenario-fields\").disabled=active || drill.status===\"recovering\" || working;\n    setMarkup(\"drill-actions\",active?action(\"解除故障\",\"stop\",\"drill-stop\",true):drill.status===\"recovering\"?'\u003cp class=\"body-copy\">正在验证恢复，可在演练服务上立即探测。\u003c/p>':action(\"启动演练\",\"start\",\"drill-start\",true));\n    setMarkup(\"drill-service\",serviceCard(drill));\n    setMarkup(\"drill-events\",eventList(events.filter(item=>item.target===\"drill\").slice(0,3),\"还没有演练事件。选择一个故障场景即可开始。\"));\n  } else if(view.page===\"history\"){\n    const filtered=events.filter(item=>view.filter===\"all\" || item.target===view.filter);\n    el(\"event-count\").textContent=filtered.length+\" 起\";\n    setMarkup(\"filters\",[[\"all\",\"全部\"],[\"ledger\",\"真实服务\"],[\"drill\",\"隔离演练\"]].map(([key,name])=>'\u003ca href=\"#history'+(key===\"all\"?'':'/'+key)+'\" aria-current=\"'+(key===view.filter)+'\">'+name+'\u003c/a>').join(\"\"));\n    setMarkup(\"events\",eventList(filtered,\"该来源暂无事件。\"));\n  } else {\n    let record=events.find(item=>item.id===view.id);\n    if(!record) {\n      if(archiveId!==view.id) loadArchived(view.id);\n      record=archiveRecord;\n    }\n    setMarkup(\"event-detail\",renderDetails(record));\n  }\n  document.querySelectorAll(\"[data-command]\").forEach(btn=>{btn.disabled=working;});\n  el(\"workspace\").setAttribute(\"aria-busy\",\"false\");\n  el(\"last-update\").textContent=\"更新于 \"+stamp(lastReceived,true);\n}\nfunction errorMessage(message) {\n  el(\"notice\").hidden=!message;\n  el(\"notice\").textContent=message;\n}\nasync function exchange(url,body) {\n  const seq=++sequence;\n  const options=body===undefined?{cache:\"no-store\"}:{method:\"POST\",headers:{\"Content-Type\":\"application/json\"},body:JSON.stringify(body)};\n  const response=await fetch(url,options);\n  const data=await response.json();\n  if(!response.ok) throw new Error(data.error || \"请求未完成。\");\n  if(seq>=latest){\n    latest=seq;\n    state=data;\n    lastReceived=new Date();\n    render();\n  }\n}\nlet connectionIssue=false;\nasync function poll() {\n  if(working || pollInFlight || document.hidden) return;\n  pollInFlight=true;\n  try{\n    await exchange(\"/api/state\");\n    if(connectionIssue) {errorMessage(\"\");connectionIssue=false;}\n  } catch {\n    if(!working){connectionIssue=true;errorMessage(\"状态更新中断，将自动重试。请确认本机故障响应服务已启动。\");}\n  } finally {pollInFlight=false;}\n}\ndocument.addEventListener(\"change\",event=>{\n  if(event.target.name===\"scenario\") chosenScenario=event.target.value;\n});\ndocument.addEventListener(\"click\",async event=>{\n  const button=event.target.closest(\"[data-command]\");\n  if(!button || working) return;\n  const command=button.dataset.command;\n  let url,body;\n  if(command===\"start\" || command===\"stop\"){url=\"/api/drill\";body={scenario:command===\"stop\"?\"idle\":chosenScenario};}\n  else if(command.startsWith(\"probe-\")){url=\"/api/probe\";body={target:command.slice(6)};}\n  else if(command.startsWith(\"ack-\")){url=\"/api/incidents/\"+Number(command.slice(4))+\"/ack\";body={};}\n  else return;\n  working=true;\n  errorMessage(\"\");\n  render();\n  try{await exchange(url,body);}\n  catch(error){errorMessage(error.message || \"操作未完成，请重试。\");}\n  finally{working=false;render();}\n});\nwindow.addEventListener(\"hashchange\",()=>{render();window.scrollTo(0,0);});\ndocument.addEventListener(\"visibilitychange\",()=>{if(!document.hidden) poll();});\nrender();\npoll();\nwindow.setInterval(poll,2100);\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"color-scheme\" content=\"light\">\n  \u003ctitle>故障响应工作台\u003c/title>\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"/style.css\">\n  \u003cscript src=\"/app.js\" defer>\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip\" href=\"#main-content\">跳至工作区\u003c/a>\n  \u003caside class=\"rail\">\n    \u003ca class=\"brand\" href=\"#overview\" aria-label=\"故障响应工作台首页\">\u003cspan class=\"mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan>值班台\u003c/span>\u003c/a>\n    \u003cnav aria-label=\"工作台导航\">\n      \u003ca href=\"#overview\" data-nav=\"overview\">\u003cspan class=\"nav-icon overview-icon\" aria-hidden=\"true\">\u003c/span>监控总览\u003c/a>\n      \u003ca href=\"#drill\" data-nav=\"drill\">\u003cspan class=\"nav-icon drill-icon\" aria-hidden=\"true\">\u003c/span>故障演练\u003c/a>\n      \u003ca href=\"#history\" data-nav=\"history\">\u003cspan class=\"nav-icon history-icon\" aria-hidden=\"true\">\u003c/span>事件记录\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"rail-foot\">\u003ci>\u003c/i>本机工作区\u003c/div>\n  \u003c/aside>\n  \u003cmain id=\"main-content\" tabindex=\"-1\">\n    \u003cdiv class=\"context\">\u003cspan>平台可靠性 \u003cspan class=\"slash\">/\u003c/span> 运维开发\u003c/span>\u003cspan id=\"last-update\" role=\"status\">连接中\u003c/span>\u003c/div>\n    \u003cheader class=\"heading\">\u003cdiv>\u003ch1 id=\"title\">监控总览\u003c/h1>\u003cp id=\"subtitle\">查看真实服务和演练环境的探测结果。\u003c/p>\u003c/div>\u003cdiv id=\"head-action\">\u003c/div>\u003c/header>\n    \u003cdiv id=\"notice\" role=\"alert\" hidden>\u003c/div>\n    \u003cdiv id=\"workspace\" aria-busy=\"true\">\u003cp class=\"empty\">正在读取服务状态…\u003c/p>\u003c/div>\n    \u003cfooter class=\"project-credit\">\u003ca href=\"https://github.com/fate788/incident-response\" aria-label=\"故障响应工作台的 GitHub 仓库，作者 fate788\">GitHub · @fate788\u003c/a>\u003c/footer>\n    \u003cnoscript>请启用 JavaScript 以获取实时探测数据。\u003c/noscript>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/style.css","text":":root{--paper:#f4f2ec;--panel:#fbfaf6;--ink:#282927;--muted:#67675f;--line:#d8d5cb;--char:#262726;--gold:#71582e;--pale:#e9dfc9;--light:#dac69c;--serif:\"Songti SC\",\"STSong\",\"SimSun\",serif;font-family:\"Microsoft YaHei UI\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:15px}\n*{box-sizing:border-box}body{margin:0;line-height:1.6}h1,h2,h3,p,ul,ol,dl,dd{margin:0}button,input,a{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}button:disabled{opacity:.57;cursor:wait}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #a47b36;outline-offset:4px}.skip{position:fixed;left:12px;top:-80px;z-index:5;background:white;padding:9px 14px}.skip:focus{top:8px}\n.rail{position:fixed;inset:0 auto 0 0;width:174px;background:#222422;color:#efece3;display:flex;flex-direction:column;padding:30px 16px 18px;border-right:1px solid #333531}.brand{display:flex;align-items:center;gap:12px;font:600 23px/1.5 var(--serif);padding:0 9px 27px;border-bottom:1px solid #464740}.mark{display:inline-flex;align-items:center;justify-content:center;gap:3px;width:34px;height:34px;border:1px solid #a99264;border-radius:50%}.mark i{background:#dec99c;width:2px;height:9px}.mark i:nth-child(2){height:17px}.mark i:nth-child(3){height:12px}\n.rail nav{display:grid;gap:5px;margin-top:23px}.rail nav a{display:flex;align-items:center;gap:12px;padding:10px 13px;color:#cdcec4;border:1px solid transparent;border-radius:5px;font-size:14px}.rail nav a:hover{color:white;background:#323431}.rail nav a[aria-current=\"page\"]{color:#f4e7c9;background:#393b35;border-color:#545344}.nav-icon{display:inline-block;width:13px;height:13px;position:relative;color:inherit}.overview-icon{border:1px solid currentColor;border-radius:2px;background:linear-gradient(90deg,transparent 45%,currentColor 45% 54%,transparent 54%),linear-gradient(transparent 45%,currentColor 45% 54%,transparent 54%)}.drill-icon{border:1px solid currentColor;border-radius:50%}.drill-icon:before{content:\"\";position:absolute;inset:3px;border:1px solid currentColor;border-radius:50%}.history-icon{background:repeating-linear-gradient(to bottom,currentColor 0 1px,transparent 1px 5px);height:11px}.rail-foot{margin-top:auto;color:#b6b8ae;font-size:12px;padding:14px 10px 0;border-top:1px solid #464740}.rail-foot i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d3be91;margin-right:8px}\nmain{margin-left:174px;max-width:1600px;padding:0 clamp(20px,3.6vw,58px) 45px}.context{height:57px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;gap:12px}.slash{margin:0 6px;color:#aaa69c}.heading{padding:26px 0 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}h1,h2,h3{color:var(--ink)}h1,h2,.service-name{font-family:var(--serif)}h1{font-size:clamp(31px,3.4vw,48px);line-height:1.2;letter-spacing:.035em;font-weight:650}.heading p,.section-desc{margin-top:5px;color:var(--muted);font-size:14px}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);color:var(--ink);border:1px solid #bcb9ae;border-radius:5px;min-height:36px;padding:6px 13px;font-weight:550;font-size:13px;white-space:nowrap}.button:hover{border-color:var(--ink)}.button.primary{background:var(--char);color:#f5f0e4;border-color:var(--char)}.button.primary:hover{background:#3a3c36}.text-link{border:0;background:none;padding:3px 0;color:var(--gold);font-size:13px;text-decoration:underline;text-underline-offset:4px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}\n#notice{background:#f0e5c9;border:1px solid #c3a36b;color:#544121;padding:10px 15px;margin-bottom:15px;border-radius:5px}#notice[hidden]{display:none}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}h2{font-size:23px;line-height:1.45}.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.service,.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-width:0}.service{padding:17px 19px 13px;border-top:2px solid #8e784c}.service.drill{border-top-color:#888a7c}.service-head,.service-bottom,.event-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}.service-name{font-size:22px;line-height:1.35}.scope{font-size:12px;color:var(--muted);margin:3px 0 0}.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;padding:3px 8px;border:1px solid #d4d0c4;border-radius:30px;color:#54574c;background:#efefe8}.chip::before{content:\"\";width:6px;height:6px;border-radius:50%;background:#62685c}.chip.warn{background:#f4e7c5;border-color:#d0b581;color:#694d20}.chip.warn::before{background:#9a702d}.chip.bad{background:#45443e;border-color:#45443e;color:#f5e4be}.chip.bad::before{background:#e0b56c}.chip.none{background:transparent;color:#75746b}.chip.none::before{background:#96968f}\n.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);margin:15px 0 10px;padding:9px 0;gap:7px}.metrics dt,.bars-caption,.meta-label{color:var(--muted);font-size:12px}.metrics dd{font-family:\"Segoe UI\",system-ui,sans-serif;font-weight:590;line-height:1.45;font-size:21px;font-variant-numeric:tabular-nums}.metrics small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}.bars{display:flex;gap:3px;align-items:stretch;height:12px;flex:1;max-width:160px}.bar{flex:1;min-width:2px;background:#c3b79a;border-radius:1px}.bar.fail{background:repeating-linear-gradient(135deg,#585349 0 2px,#b39a69 2px 4px)}.bars-caption{font-size:11px}.strip{display:flex;align-items:center;gap:8px;margin-top:7px}.service-bottom{margin-top:7px}.service-bottom time,.service-note{font-size:12px;color:var(--muted)}.service-note{margin:7px 0;overflow-wrap:anywhere}\n.lower{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(235px,.85fr);gap:16px;align-items:start;margin-top:22px}.panel{padding:18px 20px}.panel + .panel.stacked{margin-top:16px}.aside-panel{background:#eae7df;border-color:#d9d4c7}.aside-panel h2{font-size:23px}.aside-panel p,.empty,.body-copy{color:var(--muted);font-size:14px}.aside-panel p{margin:6px 0 14px}.empty{padding:15px 0;border-top:1px solid var(--line)}.event-list{list-style:none;padding:0}.event-item{border-top:1px solid var(--line)}.event-item a{padding:11px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:center}.event-item a:hover strong{text-decoration:underline;text-underline-offset:3px}.event-item strong{font-size:15px}.event-item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}\n.drill-layout,.detail-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(255px,.9fr);gap:16px;align-items:start}.scenarios{border:0;padding:0;margin:15px 0}.scenarios legend{font-size:14px;font-weight:600;padding:0;margin:0 0 6px}.scenario{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:10px 12px;background:#f7f5ef;border-radius:5px;margin:6px 0;cursor:pointer}.scenario:has(:checked){background:#eee7d7;border-color:#a89366}.scenario input{accent-color:#61513b}.scenario strong{font-size:14px}.scenario small{font-size:12px;color:var(--muted);display:block}\n.drill-note,.state-note{font-size:13px;margin:9px 0 13px;color:var(--muted)}.state-note{margin-bottom:0}.list-filter{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 15px}.list-filter a{border-radius:16px;border:1px solid #ccc8bd;padding:3px 12px;font-size:13px;color:var(--muted)}.list-filter a[aria-current=\"true\"]{background:#343632;border-color:#343632;color:white}.timeline{list-style:none;padding:0;margin:13px 0 0}.timeline li{position:relative;display:grid;grid-template-columns:9px 1fr;align-items:start;gap:12px;padding-bottom:14px}.timeline li:before{content:\"\";width:7px;height:7px;margin-top:7px;border-radius:50%;background:var(--gold);z-index:1}.timeline li:not(:last-child):after{content:\"\";position:absolute;top:12px;bottom:-6px;left:3px;border-left:1px solid #cfc4ab}.timeline time{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.timeline p{font-size:14px}.facts{margin:12px 0}.facts>div{display:flex;justify-content:space-between;align-items:start;gap:14px;border-bottom:1px solid var(--line);padding:7px 0;font-size:13px}.facts dt{color:var(--muted)}.facts dd{text-align:right;overflow-wrap:anywhere}.return{display:inline-block;margin-bottom:10px}\n@media(min-width:1600px){.rail{width:196px}main{margin-left:196px}}\n@media(max-width:980px){.rail{width:150px;padding-inline:10px}main{margin-left:150px;padding-inline:18px}.service,.panel{padding-inline:14px}.lower,.drill-layout,.detail-layout{grid-template-columns:minmax(0,1.2fr) minmax(225px,1fr)}}\n@media(max-width:760px){.rail{position:static;inset:auto;display:flex;flex-direction:row;align-items:center;width:auto;padding:8px 14px;gap:16px}.brand{padding:0;border:0;font-size:18px;gap:6px;white-space:nowrap}.mark{width:25px;height:25px;gap:2px}.mark i:nth-child(2){height:12px}.rail nav{display:flex;margin:0 0 0 auto;gap:1px}.rail nav a{font-size:13px;padding:7px 8px;gap:0}.nav-icon,.rail-foot{display:none}main{margin:0;padding-inline:16px}.context{height:40px}.heading{padding:20px 0 16px}.lower,.drill-layout,.detail-layout{grid-template-columns:1fr}.services{gap:9px}.strip{flex-wrap:wrap}.bars{flex-basis:80px}.lower{margin-top:16px}}\n@media(max-width:540px){.services{grid-template-columns:1fr}.metrics{margin:11px 0 8px}.heading,.section-title{align-items:flex-start}.heading{flex-wrap:wrap;gap:9px}.heading h1{font-size:32px}.rail{padding:8px 9px;gap:5px}.rail nav a{padding:6px 7px}.brand{font-size:17px}.context{font-size:11px}.panel,.service{padding:14px}.service-name{font-size:20px}.aside-panel h2,h2{font-size:21px}.event-item a{gap:4px}.button{min-height:39px}.service-bottom{margin-top:4px}.section-desc{font-size:13px}}\n\n.project-credit { margin-top:24px; padding:14px 0; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }\n.project-credit a { text-decoration:underline; text-underline-offset:3px; }\n","group":"前端"},{"path":"test_incident.py","text":"from concurrent.futures import ThreadPoolExecutor\nfrom contextlib import contextmanager\nimport csv\nfrom http.server import ThreadingHTTPServer\nimport io\nimport json\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport tempfile\nimport threading\nimport unittest\nfrom urllib.error import HTTPError\nfrom urllib.request import Request, urlopen\n\nfrom monitor import BACKLOG_SECONDS, SLOW_MS, Store, observe\nfrom server import LocalHandler\n\n\nROOT = Path(__file__).resolve().parent\nGOOD_QUEUE = dict(queued=0, running=0, oldest_pending_seconds=0)\n\n\nclass LedgerEndpoint(LocalHandler):\n    def do_GET(self):\n        self.server.calls.append((self.command, self.path))\n        payload, status = self.server.reply\n        self.send_json(payload, status)\n\n\n@contextmanager\ndef ledger():\n    with ThreadingHTTPServer((\"127.0.0.1\", 0), LedgerEndpoint) as app:\n        app.reply = ({\"service\": \"reconcile\", \"status\": \"ok\", \"queue\": GOOD_QUEUE}, 200)\n        app.calls = []\n        worker = threading.Thread(target=app.serve_forever)\n        worker.start()\n        try:\n            yield app\n        finally:\n            app.shutdown()\n            worker.join()\n\n\n@contextmanager\ndef desk(db, port):\n    process = subprocess.Popen([sys.executable, \"-B\", \"-u\", str(ROOT / \"server.py\"), \"--port\", \"0\", \"--db\",\n                                str(db), \"--ledger-port\", str(port)], stdout=subprocess.PIPE, stderr=subprocess.PIPE,\n                               encoding=\"utf-8\", creationflags=getattr(subprocess, \"CREATE_NO_WINDOW\", 0))\n    try:\n        base = process.stdout.readline().strip().rstrip(\"/\")\n        if not base.startswith(\"http://127.0.0.1:\"):\n            raise RuntimeError(process.stderr.read())\n        yield base\n    finally:\n        process.terminate()\n        process.communicate(timeout=10)\n\n\ndef api(base, path, payload=None, headers=None):\n    data = None if payload is None else json.dumps(payload).encode()\n    request = Request(base + path, data=data, headers={\"Content-Type\": \"application/json\", **(headers or {})})\n    with urlopen(request, timeout=10) as response:\n        return json.load(response)\n\n\ndef sample(ok, reason=\"backlog\"):\n    return dict(at=\"2026-01-01T00:00:00.000Z\", ok=ok, reason=\"ok\" if ok else reason,\n                message=\"采样结果\", http_status=200, latency_ms=1, **GOOD_QUEUE)\n\n\nclass MonitoringTests(unittest.TestCase):\n    def test_incident_reopens_only_after_stable_recovery(self):\n        store = Store(\":memory:\")\n        try:\n            with ThreadPoolExecutor(max_workers=6) as pool:\n                list(pool.map(lambda _: store.record(\"drill\", sample(False)), range(12)))\n            store.acknowledge(1)\n            store.acknowledge(1)\n            store.record(\"drill\", sample(True))\n            store.record(\"drill\", sample(False, \"slow\"))\n            store.record(\"drill\", sample(False, \"errors\"))\n            store.record(\"drill\", sample(True))\n            store.record(\"drill\", sample(True))\n            incident = store.incident(1)\n            self.assertEqual(incident[\"failed_samples\"], 14)\n            self.assertEqual(incident[\"status\"], \"resolved\")\n            self.assertEqual([event[\"kind\"] for event in incident[\"timeline\"]],\n                             [\"detected\", \"acknowledged\", \"healthy_probe\", \"relapsed\", \"symptom\", \"healthy_probe\", \"resolved\"])\n            store.record(\"drill\", sample(False))\n            self.assertEqual(store.incident(2)[\"status\"], \"open\")\n        finally:\n            store.close()\n\n    def test_history_retention_preserves_full_incident(self):\n        store = Store(\":memory:\")\n        try:\n            store.record(\"ledger\", sample(False))\n            for _ in range(26):\n                store.record(\"ledger\", sample(True))\n            data = store.state({\"ledger\": \"http://127.0.0.1\"})\n            self.assertEqual(len(data[\"targets\"][0][\"samples\"]), 20)\n            self.assertTrue(all(s[\"ok\"] for s in data[\"targets\"][0][\"samples\"]))\n            self.assertEqual(data[\"incidents\"][0][\"origin\"], \"live\")\n            self.assertEqual(data[\"incidents\"][0][\"status\"], \"resolved\")\n        finally:\n            store.close()\n\n    def test_monitor_requires_valid_queue_and_detects_stuck_work_on_http_200(self):\n        with ledger() as app:\n            url = f\"http://127.0.0.1:{app.server_port}/api/health\"\n            def read(queue):\n                app.reply = (dict(service=\"reconcile\", status=\"ok\", queue=queue), 200)\n                return observe(url, \"ledger\")\n            self.assertTrue(read(GOOD_QUEUE)[\"ok\"])\n            self.assertEqual(read(dict(queued=0, running=1, oldest_pending_seconds=BACKLOG_SECONDS))[\"reason\"], \"backlog\")\n            self.assertEqual(read(dict(queued=-1, running=0, oldest_pending_seconds=0))[\"reason\"], \"invalid\")\n            self.assertEqual(read(dict(queued=True, running=0, oldest_pending_seconds=0))[\"reason\"], \"invalid\")\n            app.reply = (dict(service=\"other\", status=\"ok\", queue=GOOD_QUEUE), 200)\n            self.assertEqual(observe(url, \"ledger\")[\"reason\"], \"invalid\")\n            app.reply = ({\"status\": \"fail\"}, 503)\n            self.assertEqual(observe(url, \"ledger\")[\"http_status\"], 503)\n\n    def test_full_fixture_workflow_csv_and_restart(self):\n        with tempfile.TemporaryDirectory() as temp, ledger() as app:\n            db = Path(temp) / \"desk.sqlite3\"\n            with desk(db, app.server_port) as base:\n                self.assertTrue(api(base, \"/api/probe\", {\"target\": \"ledger\"})[\"targets\"][0][\"last\"][\"ok\"])\n                for scenario in (\"backlog\", \"errors\", \"slow\"):\n                    state = api(base, \"/api/drill\", {\"scenario\": scenario})\n                    incident = state[\"incidents\"][0]\n                    self.assertEqual(incident[\"origin\"], \"drill\")\n                    self.assertEqual(incident[\"reason\"], scenario)\n                    target = next(t for t in state[\"targets\"] if t[\"id\"] == \"drill\")\n                    if scenario == \"slow\":\n                        self.assertGreaterEqual(target[\"last\"][\"latency_ms\"], SLOW_MS)\n                    if scenario == \"errors\":\n                        self.assertEqual(target[\"last\"][\"http_status\"], 503)\n                    incident_path = f\"/api/incidents/{incident['id']}\"\n                    with self.assertRaises(HTTPError) as problem:\n                        api(base, \"/api/drill\", {\"scenario\": \"slow\" if scenario == \"backlog\" else \"backlog\"})\n                    self.assertEqual(problem.exception.code, 409)\n                    self.assertEqual(api(base, \"/api/probe\", {\"target\": \"drill\"})[\"incidents\"][0][\"id\"], incident[\"id\"])\n                    state = api(base, incident_path + \"/ack\", {})\n                    self.assertEqual(state[\"incidents\"][0][\"status\"], \"acknowledged\")\n                    api(base, \"/api/drill\", {\"scenario\": \"idle\"})\n                    api(base, \"/api/probe\", {\"target\": \"drill\"})\n                    recovered = api(base, incident_path)\n                    self.assertEqual(recovered[\"status\"], \"resolved\")\n                    self.assertEqual(recovered[\"timeline\"][-1][\"kind\"], \"resolved\")\n                    with urlopen(base + incident_path + \"/timeline.csv\") as download:\n                        self.assertIn(\"attachment\", download.headers[\"Content-Disposition\"])\n                        rows = list(csv.reader(io.StringIO(download.read().decode(\"utf-8-sig\"))))\n                        self.assertEqual(len(rows), 1 + len(recovered[\"timeline\"]))\n                self.assertTrue(app.calls)\n                self.assertEqual(set(app.calls), {(\"GET\", \"/api/health\")})\n            with desk(db, app.server_port) as restarted:\n                self.assertEqual(api(restarted, \"/api/incidents/3\")[\"status\"], \"resolved\")\n                self.assertEqual(api(restarted, \"/api/state\")[\"drill\"][\"scenario\"], \"idle\")\n\n    def test_active_fixture_survives_restart_and_cross_origin_controls_are_rejected(self):\n        with tempfile.TemporaryDirectory() as temp, ledger() as app:\n            db = Path(temp) / \"desk.sqlite3\"\n            with desk(db, app.server_port) as base:\n                with self.assertRaises(HTTPError) as problem:\n                    api(base, \"/api/drill\", {\"scenario\": \"errors\"}, {\"Origin\": \"https://example.com\"})\n                self.assertEqual(problem.exception.code, 403)\n                with self.assertRaises(HTTPError) as problem:\n                    api(base, \"/api/probe\", {\"target\": {\"url\": \"invalid\"}})\n                self.assertEqual(problem.exception.code, 400)\n                row = api(base, \"/api/drill\", {\"scenario\": \"backlog\"})[\"incidents\"][0]\n            with desk(db, app.server_port) as restarted:\n                after = api(restarted, \"/api/probe\", {\"target\": \"drill\"})\n                self.assertEqual(after[\"drill\"][\"scenario\"], \"backlog\")\n                self.assertEqual(after[\"incidents\"][0][\"id\"], row[\"id\"])\n                self.assertEqual(len(after[\"incidents\"]), 1)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n","group":"验收测试"}],"defaultFile":"monitor.py"}</script>
