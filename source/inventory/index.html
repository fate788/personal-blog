<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify mobile inventory\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build:demo\n","group":"配置与启动"},{"path":".gitignore","text":"/data/\n/dist/\n/node_modules/\n*.sqlite\n*.sqlite-*\n.env\n","group":"配置与启动"},{"path":"README.md","text":"# 移动盘点工作台\n\n适合仓库按库位盘点。盘点员打开任务，用货号或条码找到商品。断网时，数量先写入手机浏览器的 IndexedDB。重新联网后，每条记录用独立操作编号补传，服务器收到重复操作时返回原回执。两人盲盘后，只要数量不一致或偏离账面，就进入主管复核。\n\n[打开公开演练](https://fate788.github.io/personal-blog/demos/inventory/) · [博客作品页](https://fate788.github.io/personal-blog/projects/inventory/index.html)\n\n![移动盘点工作台实屏](docs/preview.webp)\n\n## 两分钟演练\n\n1. 在仓员甲的工作台，点「开始离线盘点」打开 A01 的「牛皮纸封箱胶带」，记录 23 卷。刷新页面，待同步记录仍在。\n2. 点「恢复连接」同步。切到仓员乙，同一货品登记 24 卷。\n3. 切到仓库主管，从差异列表打开这项货品。核对 23、24 和账面 24，填写最终盘点数量和复核理由。结案页可以回看两份原始计数及处理记录。\n\n公开演练保存在访客当前浏览器，记录使用虚构库位和商品。浏览器的「模拟断网」暂停补传。要从初始示例再试一遍，可以用新的隐私窗口。服务版在实际网络中断时也可暂存操作，补传时身份与工作区必须和原记录一致。\n\n## 运行\n\n需要 Node.js 22.13 或以上版本，无需安装项目依赖。\n\n```sh\nnode server.mjs\nnpm test\nnpm run build:demo\n```\n\n服务默认在 [127.0.0.1:8808](http://127.0.0.1:8808/) 监听。先连网打开工作台并读取任务，再断网工作。HTTPS 或本地回环源可由 Service Worker 缓存页面和静态资源。浏览器支持安装时，可在菜单里添加到主屏幕。待同步记录由 IndexedDB 保存，实际复核需要连接服务器。\n\n团队试用通过 `--team` 启动，三种角色各用独立账号登录，操作写入同一 SQLite 数据库。启动前设置各账号的密码，密码至少 12 个字符。\n\n| 登录账号 | 环境变量 |\n| --- | --- |\n| `counter-a` | `INVENTORY_COUNTER_A_PASSWORD` |\n| `counter-b` | `INVENTORY_COUNTER_B_PASSWORD` |\n| `reviewer` | `INVENTORY_REVIEWER_PASSWORD` |\n\n```powershell\n$env:INVENTORY_COUNTER_A_PASSWORD = Read-Host \"盘点员甲密码\" -MaskInput\n$env:INVENTORY_COUNTER_B_PASSWORD = Read-Host \"盘点员乙密码\" -MaskInput\n$env:INVENTORY_REVIEWER_PASSWORD = Read-Host \"复核员密码\" -MaskInput\nnode server.mjs --team --db data/team.sqlite\n```\n\n首版使用内置盘点任务，可在 `domain.mjs` 配置示范账目与库位。团队模式适用于内部流程试用，结案结果记录为本次盘点的最终数量和历史。需要不同设备访问时，可部署在 HTTPS 反向代理后，指定 `--origin https://盘点台域名 --secure-cookie`，代理需传入外部 Host。\n\n## 设计与验收\n\n- 盘点员只看到自己提交的原始数量。主管看到两个原始计数和账面数，结案时提供理由。审核提交带版本号，旧页面无法覆盖后来提交的结论。\n- 服务器在 SQLite 的同一事务中保存盘点记录和操作回执。同一操作 ID 可以重试，更换内容后复用 ID 会被拒绝。客户端仅在收到回执后移出队列。\n- Service Worker 只缓存应用资源。实时数据在应用内按工作区和账号隔离保存，API 请求会重新发给服务器。\n\n按库位筛选后，可使用键盘输入模式的扫码枪读取条码，也可手动输入。只有一个匹配项时，按回车可直接打开盘点。仓库和扫码工作台照片为生成的场景素材，随安装包离线可用。工作流参考 Dynamics 365 的按库位循环盘点及 Odoo 的条码盘点。[Dynamics 365 循环盘点](https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/cycle-counting) · [Odoo 条码盘点](https://www.odoo.com/documentation/19.0/applications/inventory_and_mrp/barcode/operations/adjustments.html)\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 移动盘点工作台 v1.1 源码包\n\n原始发布归档为 `移动盘点工作台-v1.1.zip`。压缩包保留其中 19 份文本文件的原始路径与字节，本文件为导出说明。\n\n需要 Node.js 22.13 或以上版本，在项目目录运行 node server.mjs。独立账号与离线验证见项目 README。\n","group":"项目说明"},{"path":"domain.mjs","text":"export const actors = Object.freeze([\n  Object.freeze({ id: \"counter-a\", name: \"仓员甲\", role: \"counter\" }),\n  Object.freeze({ id: \"counter-b\", name: \"仓员乙\", role: \"counter\" }),\n  Object.freeze({ id: \"reviewer\", name: \"仓库主管\", role: \"reviewer\" }),\n]);\n\nconst locations = [\n  { id: \"a01\", name: \"A01 包材架\", zone: \"A 区 · 出库包装\" },\n  { id: \"a02\", name: \"A02 辅料架\", zone: \"A 区 · 出库包装\" },\n  { id: \"b01\", name: \"B01 工具柜\", zone: \"B 区 · 备货工作区\" },\n];\n\nfunction stockItem(id, locationId, name, sku, barcode, unit, expected) {\n  return { id, locationId, name, sku, barcode, unit, expected, status: \"open\", revision: 0, counts: [] };\n}\n\nexport function createWorkspace(now = Date.now()) {\n  const state = {\n    locations: locations.map(location => ({ ...location })),\n    items: [\n      stockItem(\"a01-tape\", \"a01\", \"牛皮纸封箱胶带\", \"PK-104\", \"2900000000018\", \"卷\", 24),\n      stockItem(\"a01-carton\", \"a01\", \"中号瓦楞箱\", \"PK-208\", \"2900000000025\", \"个\", 32),\n      stockItem(\"a01-wrap\", \"a01\", \"蜂窝缓冲纸\", \"PK-313\", \"2900000000032\", \"卷\", 18),\n      stockItem(\"a02-label\", \"a02\", \"条码标签纸\", \"PK-408\", \"2900000000049\", \"卷\", 48),\n      stockItem(\"a02-sleeve\", \"a02\", \"防静电包装袋\", \"PK-512\", \"2900000000056\", \"包\", 12),\n      stockItem(\"b01-cutter\", \"b01\", \"安全开箱刀\", \"TO-601\", \"2900000000063\", \"把\", 10),\n      stockItem(\"b01-marker\", \"b01\", \"黑色油性记号笔\", \"TO-708\", \"2900000000070\", \"支\", 0),\n    ],\n    history: [],\n    receipts: [],\n  };\n\n  // These closed stock checks illustrate an agreement and a difference while A01 remains available to count.\n  const label = state.items.find(item => item.id === \"a02-label\");\n  const cutter = state.items.find(item => item.id === \"b01-cutter\");\n  submitCount(state, actors[0], label, \"sample-label-a\", 48, now - 15 * 60_000);\n  submitCount(state, actors[1], label, \"sample-label-b\", 48, now - 14 * 60_000);\n  submitCount(state, actors[0], cutter, \"sample-cutter-a\", 10, now - 12 * 60_000);\n  submitCount(state, actors[1], cutter, \"sample-cutter-b\", 9, now - 11 * 60_000);\n  return state;\n}\n\nfunction response(body, status = 200) {\n  return { status, body };\n}\n\nfunction reject(status, code, error) {\n  return response({ error, code }, status);\n}\n\nfunction audit(state, item, actor, at, type, details = {}) {\n  state.history.push({\n    id: \"event-\" + (state.history.length + 1),\n    itemId: item.id,\n    at,\n    type,\n    actorId: actor.id,\n    actorName: actor.name,\n    ...details,\n  });\n}\n\nfunction submitCount(state, actor, item, opId, quantity, now) {\n  const count = { id: opId, actorId: actor.id, actorName: actor.name, quantity, at: now };\n  item.counts.push(count);\n  item.revision += 1;\n  audit(state, item, actor, now, \"counted\", { quantity });\n\n  if (item.counts.length === 2) {\n    if (item.counts.every(entry => entry.quantity === item.expected)) {\n      item.status = \"agreed\";\n      item.finalQuantity = item.expected;\n    } else {\n      item.status = \"review\";\n    }\n    audit(state, item, { id: \"system\", name: \"系统\" }, now, item.status);\n  }\n\n  const result = { itemId: item.id, revision: item.revision, status: item.status };\n  state.receipts.push({ opId, itemId: item.id, actorId: actor.id, quantity, result });\n  return { ...result };\n}\n\nfunction workspace(state, actor) {\n  const reviewer = actor.role === \"reviewer\";\n  return {\n    actor: { ...actor },\n    locations: state.locations.map(location => ({ ...location })),\n    items: state.items.map(item => {\n      const { expected, finalQuantity, counts, decision, ...header } = item;\n      return {\n        ...header,\n        ...(reviewer ? { expected } : {}),\n        ...(finalQuantity !== undefined && (reviewer || item.status === \"closed\") ? { finalQuantity } : {}),\n        ...(reviewer && decision ? { decision: { ...decision } } : {}),\n        counts: counts.filter(entry => reviewer || entry.actorId === actor.id).map(entry => ({ ...entry })),\n      };\n    }),\n    history: [...state.history].reverse().filter(entry => reviewer || entry.actorId === actor.id)\n      .map(({ actorId, ...entry }) => entry),\n  };\n}\n\nfunction validQuantity(quantity) {\n  return Number.isSafeInteger(quantity) && quantity >= 0;\n}\n\nfunction countItem(state, actor, body, now) {\n  if (actor.role !== \"counter\")\n    return reject(403, \"COUNTER_ONLY\", \"只有盘点员可以提交实点数量。\");\n\n  const { opId, itemId, quantity } = body;\n  if (typeof opId !== \"string\" || !/^[a-z0-9][a-z0-9._:-]{0,127}$/iu.test(opId) || typeof itemId !== \"string\")\n    return reject(422, \"INVALID_OPERATION\", \"请提供有效的操作编号和商品编号。\");\n  if (!validQuantity(quantity))\n    return reject(422, \"INVALID_QUANTITY\", \"实点数量必须为 0 或正整数。\");\n\n  const previous = state.receipts.find(entry => entry.opId === opId);\n  if (previous) {\n    if (previous.itemId !== itemId || previous.actorId !== actor.id || previous.quantity !== quantity)\n      return reject(409, \"OPERATION_CONFLICT\", \"该操作编号已经用于另一条盘点记录。\");\n    return response({ ...previous.result, replayed: true });\n  }\n\n  const item = state.items.find(entry => entry.id === itemId);\n  if (!item) return reject(404, \"ITEM_NOT_FOUND\", \"没有找到该库位商品。\");\n  if (item.counts.some(entry => entry.actorId === actor.id))\n    return reject(409, \"ALREADY_COUNTED\", \"你已经提交过这件商品的盘点记录，原记录已保留。\");\n  if (item.status !== \"open\")\n    return reject(409, \"COUNTING_ENDED\", \"这件商品已经结束盘点。\");\n\n  return response(submitCount(state, actor, item, opId, quantity, now), 201);\n}\n\nfunction resolveItem(state, actor, id, body, now) {\n  if (actor.role !== \"reviewer\")\n    return reject(403, \"REVIEWER_ONLY\", \"只有主管可以作出复核决定。\");\n\n  const item = state.items.find(entry => entry.id === id);\n  if (!item) return reject(404, \"ITEM_NOT_FOUND\", \"没有找到该库位商品。\");\n\n  const { revision, quantity } = body;\n  const note = typeof body.note === \"string\" ? body.note.trim() : \"\";\n  if (!Number.isSafeInteger(revision) || revision \u003c 0)\n    return reject(422, \"INVALID_REVISION\", \"请重新打开要复核的商品。\");\n  if (!validQuantity(quantity))\n    return reject(422, \"INVALID_QUANTITY\", \"复核数量必须为 0 或正整数。\");\n  if (!note || note.length > 500)\n    return reject(422, \"INVALID_NOTE\", \"请填写不超过 500 字的复核依据。\");\n  if (item.revision !== revision)\n    return reject(409, \"STALE_REVISION\", \"数据已更新，请刷新后重新核对。\");\n  if (item.status !== \"review\")\n    return reject(409, \"NOT_PENDING_REVIEW\", \"这件商品当前无需复核。\");\n\n  item.status = \"closed\";\n  item.revision += 1;\n  item.finalQuantity = quantity;\n  item.decision = { actorId: actor.id, actorName: actor.name, quantity, note, at: now };\n  audit(state, item, actor, now, \"closed\", { quantity, note });\n  return response({ itemId: id, revision: item.revision, status: item.status });\n}\n\nexport function dispatch(state, { method, path, actorId, now = Date.now(), body = {} }) {\n  const actor = actors.find(person => person.id === actorId);\n  if (!actor) return reject(401, \"UNKNOWN_ACTOR\", \"请先选择工作身份。\");\n  if (method === \"GET\" && path === \"/api/workspace\") return response(workspace(state, actor));\n  if (method !== \"POST\") return reject(404, \"UNKNOWN_ROUTE\", \"没有找到该操作。\");\n  if (!body || typeof body !== \"object\" || Array.isArray(body))\n    return reject(422, \"INVALID_BODY\", \"请提供有效的请求内容。\");\n  if (path === \"/api/counts\") return countItem(state, actor, body, now);\n  const resolve = /^\\/api\\/items\\/([a-z0-9-]+)\\/resolve$/u.exec(path);\n  if (resolve) return resolveItem(state, actor, resolve[1], body, now);\n  return reject(404, \"UNKNOWN_ROUTE\", \"没有找到该操作。\");\n}\n","group":"后端"},{"path":"package.json","text":"{\n  \"name\":\"mobile-inventory\",\n  \"version\":\"1.1.0\",\n  \"private\":true,\n  \"type\":\"module\",\n  \"engines\":{\"node\":\">=22.13\"},\n  \"scripts\":{\n    \"start\":\"node server.mjs\",\n    \"test\":\"node --test tests/*.test.mjs\",\n    \"build:demo\":\"node portable/build.mjs\"\n  }\n}\n","group":"配置与启动"},{"path":"portable/build.mjs","text":"import {mkdir,readFile,writeFile,copyFile} from \"node:fs/promises\";\nimport {dirname,resolve} from \"node:path\";\nimport {fileURLToPath} from \"node:url\";\n\nconst output=resolve(process.argv[2] || \"dist/index.html\");\nconst read=file=>readFile(new URL(file,import.meta.url),\"utf8\");\nconst assets=[\"sw.js\",\"manifest.webmanifest\",\"icon-192.png\",\"icon-512.png\",\"hero.webp\",\"scan-station.webp\"];\nconst source=file=>fileURLToPath(new URL(\"../static/\"+file,import.meta.url));\nconst asModule=code=>\"data:text/javascript;base64,\"+Buffer.from(code.replace(/\\r\\n/gu,\"\\n\"),\"utf8\").toString(\"base64\");\nfunction replaceModule(code,path,uri){\n  const quote=code.includes(`\"${path}\"`) ? '\"' : \"'\";\n  const pattern=quote+path+quote;\n  if(!code.includes(pattern))throw new Error(\"Missing module \"+path);\n  return code.replaceAll(pattern,JSON.stringify(uri));\n}\nconst [domain,store,transport,workflow,app,css,html]=await Promise.all([\n  read(\"../domain.mjs\"),read(\"../static/storage.mjs\"),read(\"transport.mjs\"),\n  read(\"../static/offline.mjs\"),read(\"../static/app.mjs\"),read(\"../static/styles.css\"),read(\"../static/index.html\"),\n]);\nconst storeModule=asModule(store);\nconst bridge=asModule(replaceModule(replaceModule(transport,\"../domain.mjs\",asModule(domain)),\"./storage.mjs\",storeModule));\nconst logic=asModule(replaceModule(replaceModule(workflow,\"./transport.mjs\",bridge),\"./storage.mjs\",storeModule));\nconst main=asModule(replaceModule(app,\"./offline.mjs\",logic));\nconst cssTag=/\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css(?:\\?[^\"']*)?[\"'][^>]*>/iu;\nconst scriptTag=/\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs(?:\\?[^\"']*)?[\"'][^>]*>\\s*\u003c\\/script>/iu;\nif(!cssTag.test(html)||!scriptTag.test(html))throw new Error(\"Missing frontend tags.\");\nconst policy=\"default-src 'none'; style-src 'unsafe-inline'; script-src data:; worker-src 'self'; manifest-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\nconst portable=html.replace(\"\u003chtml \",'\u003chtml data-edition=\"public\" ')\n  .replace(\"\u003chead>\",`\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(cssTag,()=>`\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(scriptTag,()=>`\u003cscript type=\"module\" src=\"${main}\">\u003c/script>`);\nconst directory=dirname(output);\nawait mkdir(directory,{recursive:true});\nawait writeFile(output,portable.replace(/\\r\\n/gu,\"\\n\"),\"utf8\");\nawait Promise.all(assets.map(file=>copyFile(source(file),resolve(directory,file))));\nconsole.log(\"Browser demo written to \"+output);\n","group":"配置与启动"},{"path":"portable/transport.mjs","text":"import {actors,createWorkspace,dispatch} from \"../domain.mjs\";\nimport {storage} from \"./storage.mjs\";\n\nexport default async function request(path,{method=\"GET\",body={},session}={}){\n  let result;\n  await storage(\"simulation-server\",prior=>{\n    const state=prior || {id:crypto.randomUUID(),actorId:\"counter-a\",workspace:createWorkspace()};\n    const identity=()=>({mode:\"demo\",workspaceId:state.id,actors,actor:actors.find(actor=>actor.id===state.actorId)});\n    if(method===\"GET\" && path===\"/api/session\"){\n      result={status:200,body:identity()};\n    }else if(method===\"POST\" && path===\"/api/session/role\"){\n      const actor=actors.find(item=>item.id===body.id);\n      if(!actor)result={status:422,body:{error:\"没有该演练身份。\"}};\n      else{state.actorId=actor.id;result={status:200,body:identity()};}\n    }else if(!session || session.workspaceId!==state.id || session.actor?.id!==state.actorId){\n      result={status:409,body:{error:\"工作台身份已更新，请重新连接后同步。\",code:\"SESSION_CHANGED\"}};\n    }else{\n      result=dispatch(state.workspace,{path,method,body,actorId:state.actorId,now:Date.now()});\n    }\n    return state;\n  });\n  if(result.status>=400)throw Object.assign(new Error(result.body.error),{status:result.status,code:result.body.code});\n  return result.body;\n}\n","group":"前端"},{"path":"server.mjs","text":"import {createHash, randomBytes, scrypt, scryptSync, timingSafeEqual} from \"node:crypto\";\nimport {closeSync, mkdirSync, openSync, readFileSync} from \"node:fs\";\nimport {createServer} from \"node:http\";\nimport {dirname, resolve} from \"node:path\";\nimport {DatabaseSync} from \"node:sqlite\";\nimport {fileURLToPath} from \"node:url\";\nimport {parseArgs, promisify} from \"node:util\";\nimport {actors, createWorkspace, dispatch} from \"./domain.mjs\";\n\nconst loopback = new Set([\"127.0.0.1\", \"localhost\", \"::1\", \"[::1]\"]);\nconst maxBody = 24 * 1024;\nconst demoAge = 30 * 24 * 3600;\nconst teamAge = 12 * 3600;\nconst localActors = new Map(actors.map(actor => [actor.id, actor]));\nconst deriveKey = promisify(scrypt);\nconst files = new Map([\n  [\"/\", [\"index.html\", \"text/html; charset=utf-8\"]],\n  [\"/index.html\", [\"index.html\", \"text/html; charset=utf-8\"]],\n  [\"/styles.css\", [\"styles.css\", \"text/css; charset=utf-8\"]],\n  [\"/app.mjs\", [\"app.mjs\", \"text/javascript; charset=utf-8\"]],\n  [\"/transport.mjs\", [\"transport.mjs\", \"text/javascript; charset=utf-8\"]],\n  [\"/offline.mjs\", [\"offline.mjs\", \"text/javascript; charset=utf-8\"]],\n  [\"/storage.mjs\", [\"storage.mjs\", \"text/javascript; charset=utf-8\"]],\n  [\"/sw.js\", [\"sw.js\", \"text/javascript; charset=utf-8\"]],\n  [\"/manifest.webmanifest\", [\"manifest.webmanifest\", \"application/manifest+json\"]],\n  [\"/icon-192.png\", [\"icon-192.png\", \"image/png\"]],\n  [\"/icon-512.png\", [\"icon-512.png\", \"image/png\"]],\n  [\"/hero.webp\", [\"hero.webp\", \"image/webp\"]],\n  [\"/scan-station.webp\", [\"scan-station.webp\", \"image/webp\"]],\n]);\n\nclass HTTPError extends Error {\n  constructor(status, message, code) {\n    super(message);\n    this.status = status;\n    this.code = code;\n  }\n}\n\nfunction required(condition, status, message, code) {\n  if (!condition) throw new HTTPError(status, message, code);\n}\n\nfunction teamAccounts() {\n  const rolePasswords = [\n    [\"counter-a\", \"INVENTORY_COUNTER_A_PASSWORD\"],\n    [\"counter-b\", \"INVENTORY_COUNTER_B_PASSWORD\"],\n    [\"reviewer\", \"INVENTORY_REVIEWER_PASSWORD\"],\n  ];\n  const used = new Set();\n  return new Map(rolePasswords.map(([id, key]) => {\n    const password = process.env[key];\n    if (typeof password !== \"string\" || password.length \u003c 12 || password.length > 256 || used.has(password))\n      throw new Error(`${key} 应包含 12 到 256 个字符，各账号密码应不同。`);\n    used.add(password);\n    const salt = randomBytes(16);\n    return [id, {salt, key:scryptSync(password, salt, 64)}];\n  }));\n}\n\nfunction originConfig(host, origin, secureCookie) {\n  const url = origin ? new URL(origin) : null;\n  if (url && (![\"http:\", \"https:\"].includes(url.protocol) || origin !== url.origin))\n    throw new Error(\"--origin 应为完整源地址，例如 https://inventory.example.com。\");\n  const external = !loopback.has(host) || (url && !loopback.has(url.hostname));\n  if ((external || secureCookie) && url?.protocol !== \"https:\")\n    throw new Error(\"外部访问需配置 HTTPS 反向代理和 --origin。\");\n  return {url, secure:url?.protocol === \"https:\"};\n}\n\nfunction checkRequest(request, {url,secure}) {\n  let host;\n  try { host = new URL(`${secure ? \"https\" : \"http\"}://${request.headers.host || \"\"}`); }\n  catch { throw new HTTPError(400, \"请求主机地址无效。\"); }\n  required(host.pathname === \"/\" && !host.username && !host.password && !host.search && !host.hash,\n    400, \"请求主机地址无效。\");\n  required(url ? host.host === url.host : loopback.has(host.hostname), 400, \"请求主机与工作台配置不匹配。\");\n  required(request.url?.startsWith(\"/\") && !request.url.startsWith(\"//\") && !request.url.includes(\"\\\\\"), 400, \"请求路径无效。\");\n  const path = new URL(request.url, url || host);\n  required(path.origin === (url || host).origin, 400, \"请求路径无效。\");\n  return path;\n}\n\nfunction verifyAPI(request, origin, method) {\n  const site = request.headers[\"sec-fetch-site\"];\n  required(!site || site === \"same-origin\" || site === \"none\", 403, \"该操作仅允许从工作台发起。\");\n  required(!request.headers.origin || request.headers.origin === origin, 403, \"请求源与工作台不一致。\");\n  if (method !== \"POST\") return;\n  required(request.headers[\"x-workspace-request\"] === \"1\", 403, \"请求未通过校验，请刷新页面。\");\n  required(/^application\\/json(?:\\s*;|$)/i.test(request.headers[\"content-type\"] || \"\"),\n    415, \"请提交 JSON 请求。\");\n}\n\nasync function readBody(request) {\n  required(Number(request.headers[\"content-length\"] || 0) \u003c= maxBody, 413, \"请求内容过长。\");\n  const chunks = [];\n  let bytes = 0;\n  for await (const chunk of request.iterator({destroyOnReturn:false})) {\n    bytes += chunk.length;\n    if (bytes > maxBody) {\n      request.resume();\n      throw new HTTPError(413, \"请求内容过长。\");\n    }\n    chunks.push(chunk);\n  }\n  let value;\n  try { value = JSON.parse(Buffer.concat(chunks).toString(\"utf8\")); }\n  catch { throw new HTTPError(400, \"无法读取请求中的 JSON。\"); }\n  required(value && typeof value === \"object\" && !Array.isArray(value), 400, \"请提交 JSON 对象。\");\n  return value;\n}\n\nfunction digest(token) { return createHash(\"sha256\").update(token).digest(\"hex\"); }\nfunction opaqueToken() { return randomBytes(32).toString(\"hex\"); }\n\nfunction readCookie(request, name) {\n  for (const entry of (request.headers.cookie || \"\").split(\";\")) {\n    const [key,value] = entry.trim().split(\"=\",2);\n    if (key === name && /^[a-f0-9]{64}$/.test(value)) return digest(value);\n  }\n  return \"\";\n}\n\nfunction openStore(path, mode) {\n  if (path !== \":memory:\") {\n    mkdirSync(dirname(resolve(path)), {recursive:true, mode:0o700});\n    closeSync(openSync(path, \"a\", 0o600));\n  }\n  const db = new DatabaseSync(path);\n  db.exec(`\n    PRAGMA journal_mode=WAL;\n    PRAGMA busy_timeout=4000;\n    PRAGMA foreign_keys=ON;\n    CREATE TABLE IF NOT EXISTS workspaces(\n      id TEXT PRIMARY KEY, mode TEXT NOT NULL, state TEXT NOT NULL, touched_at INTEGER NOT NULL\n    ) STRICT;\n    CREATE UNIQUE INDEX IF NOT EXISTS inventory_single_team ON workspaces(mode) WHERE mode='team';\n    CREATE TABLE IF NOT EXISTS sessions(\n      token TEXT PRIMARY KEY, workspace_id TEXT NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,\n      actor_id TEXT NOT NULL, expires_at INTEGER NOT NULL\n    ) STRICT;\n    CREATE INDEX IF NOT EXISTS inventory_session_expiration ON sessions(expires_at);\n    CREATE INDEX IF NOT EXISTS inventory_workspace_retention ON workspaces(mode,touched_at);\n  `);\n  const put = db.prepare(\"INSERT INTO workspaces(id,mode,state,touched_at) VALUES(?,?,?,?)\");\n  const lookup = db.prepare(\"SELECT id FROM workspaces WHERE mode='team'\");\n  const sign = db.prepare(\"INSERT INTO sessions(token,workspace_id,actor_id,expires_at) VALUES(?,?,?,?)\");\n  const lookupSession = db.prepare(`SELECT w.id,w.state,s.actor_id FROM sessions s\n    JOIN workspaces w ON w.id=s.workspace_id WHERE s.token=? AND s.expires_at>? AND w.mode=?`);\n  const removeSession = db.prepare(\"DELETE FROM sessions WHERE token=?\");\n  const changeActor = db.prepare(\"UPDATE sessions SET actor_id=? WHERE token=?\");\n  const write = db.prepare(\"UPDATE workspaces SET state=?,touched_at=? WHERE id=?\");\n  const clearSessions = db.prepare(\"DELETE FROM sessions WHERE expires_at\u003c=?\");\n  const clearDemo = db.prepare(\"DELETE FROM workspaces WHERE mode='demo' AND touched_at\u003c?\");\n  let lastCleanup = 0;\n\n  function transaction(callback) {\n    db.exec(\"BEGIN IMMEDIATE\");\n    try {\n      const result = callback();\n      db.exec(\"COMMIT\");\n      return result;\n    } catch (error) {\n      db.exec(\"ROLLBACK\");\n      throw error;\n    }\n  }\n  function create(now) {\n    const id = opaqueToken();\n    put.run(id,mode,JSON.stringify(createWorkspace(now)),now);\n    return id;\n  }\n\n  const shared = mode === \"team\" ? transaction(() => lookup.get()?.id || create(Date.now())) : \"\";\n  return {\n    db, transaction,\n    cleanup(now) {\n      if (now-lastCleanup \u003c 60_000) return;\n      clearSessions.run(now);\n      clearDemo.run(now-demoAge*1000);\n      lastCleanup = now;\n    },\n    session(token, now) { return token && lookupSession.get(token,now,mode); },\n    issue(actorId, now) {\n      const token = opaqueToken();\n      const id = shared || create(now);\n      sign.run(digest(token),id,actorId,now+(shared ? teamAge : demoAge)*1000);\n      return {id,token};\n    },\n    remove(token, now) {\n      if (token && lookupSession.get(token,now,mode)) removeSession.run(token);\n    },\n    changeActor(token, actorId) { changeActor.run(actorId,token); },\n    save(session, state, now) { write.run(JSON.stringify(state),now,session.id); },\n  };\n}\n\nexport function startServer({port=8808, host=\"127.0.0.1\", dbPath, origin, secureCookie=false, team=false} = {}) {\n  const config = originConfig(host,origin,secureCookie);\n  const mode = team ? \"team\" : \"demo\";\n  const accounts = team ? teamAccounts() : null;\n  const database = dbPath || fileURLToPath(new URL(`./data/${mode}.sqlite`,import.meta.url));\n  const store = openStore(database,mode);\n  const cookieName = (config.secure ? \"__Host-\" : \"\") + (team ? \"inventoryTeam\" : \"inventoryDemo\");\n  const cookie = (token, age) => `${cookieName}=${token}; Path=/; HttpOnly; SameSite=Strict; Max-Age=${age}${config.secure ? \"; Secure\" : \"\"}`;\n  const publicSession = (actorId,id) => ({\n    mode, actor:localActors.get(actorId) || null, actors:team ? [] : actors, workspaceId:id || null,\n  });\n  const attempts = new Map();\n  const fallback = {salt:randomBytes(16),key:randomBytes(64)};\n\n  function send(response,status,body,headers={}) {\n    response.writeHead(status,{\"Content-Type\":\"application/json; charset=utf-8\",\"Cache-Control\":\"no-store\",...headers});\n    response.end(JSON.stringify(body));\n  }\n\n  async function login(request,response,input,oldToken) {\n    required(accounts,404,\"当前工作区使用演示身份。\");\n    const address = request.socket.remoteAddress;\n    const now = Date.now();\n    for (const [key, attempt] of attempts) if (attempt.expires \u003c= now) attempts.delete(key);\n    const attempt = attempts.get(address) || {count:0,expires:now+60_000};\n    required(attempt.count\u003c24,429,\"尝试次数过多，请稍后重试。\");\n    attempts.set(address,{...attempt,count:attempt.count+1});\n    const {id,password} = input;\n    required(typeof id === \"string\" && typeof password === \"string\" && password.length>=1 && password.length\u003c=256,\n      400,\"请填写账号和密码。\");\n    const account = accounts.get(id);\n    const expected = account || fallback;\n    const checked = await deriveKey(password,expected.salt,expected.key.length);\n    required(timingSafeEqual(checked,expected.key) && account,401,\"账号或密码不正确。\");\n    const result = store.transaction(() => {\n      store.remove(oldToken,Date.now());\n      return store.issue(id,Date.now());\n    });\n    send(response,200,publicSession(id,result.id),{\"Set-Cookie\":cookie(result.token,teamAge)});\n  }\n\n  function routeAPI(request,response,method,path,body,token) {\n    const now = Date.now();\n    const result = store.transaction(() => {\n      store.cleanup(now);\n      const session = store.session(token,now);\n      if (method === \"GET\" && path === \"/api/session\") {\n        if (!session && !team) {\n          const fresh = store.issue(\"counter-a\",now);\n          return {status:200, body:publicSession(\"counter-a\",fresh.id), signed:cookie(fresh.token,demoAge)};\n        }\n        return {status:200,body:publicSession(session?.actor_id,session?.id)};\n      }\n      if (method === \"POST\" && path === \"/api/logout\") {\n        required(team,404,\"演示工作区无需退出。\");\n        store.remove(token,now);\n        return {status:200,body:publicSession(),signed:cookie(\"\",0)};\n      }\n      required(session,401,\"请先打开工作区或重新登录。\");\n      if (method === \"POST\" && path === \"/api/session/role\") {\n        required(!team,403,\"团队角色由登录账号决定。\");\n        required(localActors.has(body.id),400,\"请选择有效的演示身份。\");\n        store.changeActor(token,body.id);\n        return {status:200,body:publicSession(body.id,session.id)};\n      }\n      const scopedRead = method === \"GET\" && path === \"/api/workspace\"\n        && (request.headers[\"x-workspace-id\"] !== undefined || request.headers[\"x-workspace-actor\"] !== undefined);\n      if (method === \"POST\" || scopedRead) {\n        required(request.headers[\"x-workspace-id\"] === session.id && request.headers[\"x-workspace-actor\"] === session.actor_id,\n          409, \"工作区或身份已经切换，请回到原身份再同步。\",\"SESSION_SCOPE_CHANGED\");\n      }\n      const state = JSON.parse(session.state);\n      const result = dispatch(state,{method,path,actorId:session.actor_id,now,body});\n      if (method === \"POST\" && result.status\u003c400) store.save(session,state,now);\n      return result;\n    });\n    send(response,result.status,result.body,result.signed ? {\"Set-Cookie\":result.signed} : {});\n  }\n\n  const server = createServer({maxHeaderSize:16*1024,requestTimeout:10_000,headersTimeout:8000},async (request,response) => {\n    response.setHeader(\"X-Content-Type-Options\",\"nosniff\");\n    response.setHeader(\"Referrer-Policy\",\"no-referrer\");\n    response.setHeader(\"X-Frame-Options\",\"DENY\");\n    response.setHeader(\"Cross-Origin-Resource-Policy\",\"same-origin\");\n    response.setHeader(\"Content-Security-Policy\",\n      \"default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\");\n    try {\n      const url = checkRequest(request,config);\n      const {method} = request;\n      if (url.pathname.startsWith(\"/api/\")) {\n        required(method === \"GET\" || method === \"POST\",405,\"不支持的接口方法。\");\n        verifyAPI(request,url.origin,method);\n        const body = method === \"POST\" ? await readBody(request) : {};\n        const token = readCookie(request,cookieName);\n        if (method === \"POST\" && url.pathname === \"/api/login\") await login(request,response,body,token);\n        else routeAPI(request,response,method,url.pathname,body,token);\n        return;\n      }\n      const file = files.get(url.pathname);\n      required(file && (method === \"GET\" || method === \"HEAD\"),404,\"未找到页面。\");\n      const [name,type] = file;\n      const contents = readFileSync(new URL(`./static/${name}`,import.meta.url));\n      response.writeHead(200,{\"Content-Type\":type,\"Content-Length\":contents.length,\"Cache-Control\":\"no-cache\"});\n      response.end(method === \"HEAD\" ? undefined : contents);\n    } catch (error) {\n      if (response.destroyed) return;\n      if (error instanceof HTTPError) send(response,error.status,{error:error.message,code:error.code});\n      else {\n        console.error(error.code || error.name || \"RequestError\");\n        send(response,500,{error:\"工作台暂时不可用，请稍后重试。\"});\n      }\n    }\n  });\n  server.on(\"close\",() => store.db.close());\n  return server.listen(port,host);\n}\n\nif (process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {\n  const {values} = parseArgs({options:{\n    port:{type:\"string\",default:\"8808\"},host:{type:\"string\",default:\"127.0.0.1\"},\n    db:{type:\"string\"},origin:{type:\"string\"},team:{type:\"boolean\"},\"secure-cookie\":{type:\"boolean\"},\n  }});\n  if (!/^\\d{1,5}$/.test(values.port) || Number(values.port)>65535) throw new Error(\"端口应为 0 至 65535。\");\n  const server = startServer({\n    host:values.host,port:Number(values.port),dbPath:values.db,origin:values.origin,\n    secureCookie:values[\"secure-cookie\"],team:values.team,\n  });\n  server.on(\"listening\",() => {\n    const address = server.address();\n    const host = address.family === \"IPv6\" ? `[${address.address}]` : address.address;\n    console.log(`http://${host}:${address.port}/`);\n  });\n}\n","group":"后端"},{"path":"start-inventory.cmd","text":"@echo off\nsetlocal\ncd /d \"%~dp0\"\nwhere node.exe >nul 2>&1\nif errorlevel 1 (\n  echo Node.js 22.13 or newer is required.\n  pause\n  exit /b 1\n)\nnode server.mjs\nif errorlevel 1 pause\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import {openInventory} from \"./offline.mjs\";\n\nconst main = document.querySelector(\"#inventory-main\");\nconst toolbar = document.querySelector(\"#toolbar\");\nconst navigation = document.querySelector(\"#navigation\");\nconst dialog = document.querySelector(\"#work-dialog\");\nconst formContent = document.querySelector(\"#form-content\");\nconst notice = document.querySelector(\"#notice\");\nconst routes = {\n  count:[\"盘点任务\",\"box\"], queue:[\"同步队列\",\"sync\"],\n  review:[\"差异复核\",\"clipboard\"], history:[\"作业记录\",\"clock\"],\n};\nconst stateLabels = {\n  open:\"待盘点\", local:\"待同步\", counted:\"已提交\", agreed:\"两次一致\", review:\"待复核\", closed:\"已结案\",\n};\nconst eventLabels = {\n  counted:\"提交实点\", agreed:\"两次一致\", review:\"进入差异复核\", closed:\"主管确认结案\",\n};\nconst paths = {\n  box:\"M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4m-8 4v10m-4-16 8 4\",\n  pin:\"M19 10c0 4.5-7 10-7 10S5 14.5 5 10a7 7 0 1 1 14 0zm-4 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0z\",\n  clipboard:\"M8 4h8v4H8zM8 6H5v15h14V6h-3M8 13h8m-8 4h5\",\n  sync:\"M19 8a8 8 0 0 0-14-1L3 9m0-5v5h5m-3 7a8 8 0 0 0 14 1l2-2m0 5v-5h-5\",\n  clock:\"M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zm-9-5v5l3 2\",\n  user:\"M16 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM4 20a8 8 0 0 1 16 0\",\n  arrow:\"M4 12h15m-5-5 5 5-5 5\",\n  search:\"M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0zm-2 4 5 5\",\n  code:\"M4 5h4m-4 0v4m16-4h-4m4 0v4M4 19h4m-4 0v-4m16 4h-4m4 0v-4M8 8v8m3-8v8m3-8v8m2-8v8\",\n  info:\"M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zm-9 0v4m0-8h.01\",\n  close:\"M6 6l12 12M18 6L6 18\",\n  check:\"M4 12l5 5L20 6\",\n};\nconst date = new Intl.DateTimeFormat(\"zh-CN\",{month:\"2-digit\",day:\"2-digit\",hour:\"2-digit\",minute:\"2-digit\",hourCycle:\"h23\"});\nconst number = new Intl.NumberFormat(\"zh-CN\");\nlet inventory;\nlet snapshot;\nlet tab = \"count\";\nlet search = \"\";\nlet location = \"\";\nlet actorBusy = false;\nlet actionBusy = false;\nlet notificationTimer;\n\nfunction esc(value) {\n  return String(value??\"\").replace(/[&\u003c>'\"]/gu,char=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"})[char]);\n}\nfunction icon(name) {\n  return `\u003cspan class=\"icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"${paths[name]}\"/>\u003c/svg>\u003c/span>`;\n}\nfunction time(value) {\n  return Number.isFinite(new Date(value).valueOf()) && value!=null ? date.format(new Date(value)) : \"—\";\n}\nfunction qty(value) {\n  return Number.isSafeInteger(value) ? number.format(value) : \"—\";\n}\nfunction go(target) {\n  if(window.location.hash===target){render();return;}\n  window.location.hash=target;\n}\nfunction state() {\n  return snapshot?.workspace || {items:[],locations:[],history:[]};\n}\nfunction actor() {\n  return snapshot?.session?.actor;\n}\nfunction demo() {\n  return snapshot?.session?.mode===\"demo\";\n}\nfunction reviewer() {\n  return actor()?.role===\"reviewer\";\n}\nfunction queue() {\n  return (snapshot?.pending || []).filter(entry=>entry.actorId===actor()?.id);\n}\nfunction findItem(itemId) {\n  return state().items.find(item=>item.id===itemId);\n}\nfunction findLocation(locationId) {\n  return state().locations.find(entry=>entry.id===locationId);\n}\nfunction own(item) {\n  return item.counts?.find(entry=>entry.actorId===actor()?.id);\n}\nfunction ownPending(item) {\n  return queue().find(entry=>entry.itemId===item.id);\n}\nfunction countState(item) {\n  return ownPending(item) ? \"local\" : own(item) && item.status===\"open\" ? \"counted\" : item.status;\n}\nfunction labelState(status) {\n  const kind={local:\"pending\",counted:\"received\",review:\"conflict\",agreed:\"done\",closed:\"done\"}[status] || \"\";\n  return `\u003cspan class=\"tag ${kind}\">${esc(stateLabels[status] || status)}\u003c/span>`;\n}\nfunction link(text,href,styling=\"\",symbol=\"arrow\") {\n  return `\u003ca class=\"btn ${styling}\" href=\"${esc(href)}\">${esc(text)}${symbol?icon(symbol):\"\"}\u003c/a>`;\n}\nfunction button(text,attr,styling=\"\",symbol=\"\") {\n  return `\u003cbutton class=\"btn ${styling}\" type=\"button\" ${attr}>${symbol?icon(symbol):\"\"}${esc(text)}\u003c/button>`;\n}\nfunction note(text,error=false) {\n  return `\u003cp class=\"notice-inline${error?\" error\":\"\"}\"${error?' role=\"alert\"':\"\"}>${icon(\"info\")}${esc(text)}\u003c/p>`;\n}\nfunction heading(title,subtitle,actions=\"\") {\n  return `\u003cheader class=\"heading\">\u003cdiv>\u003ch1>${esc(title)}\u003c/h1>\u003cp>${esc(subtitle)}\u003c/p>\u003c/div>${actions?`\u003cdiv class=\"actions\">${actions}\u003c/div>`:\"\"}\u003c/header>`;\n}\nfunction panel(title,subtitle,body,actions=\"\") {\n  return `\u003csection class=\"panel\">\u003cheader class=\"panel-head\">\u003cdiv>\u003ch2>${esc(title)}\u003c/h2>${subtitle?`\u003cp>${esc(subtitle)}\u003c/p>`:\"\"}\u003c/div>${actions}\u003c/header>${body}\u003c/section>`;\n}\nfunction flash(message) {\n  clearTimeout(notificationTimer);\n  notice.textContent=message;\n  notice.hidden=false;\n  notificationTimer=setTimeout(()=>{notice.hidden=true;},3100);\n}\nfunction setToolbar() {\n  const a=actor();\n  const offline=!!snapshot?.offline;\n  const network=`\u003cspan class=\"network ${offline?\"offline\":\"online\"}\" data-network=\"${offline?\"offline\":\"online\"}\" role=\"status\">${snapshot?.syncing?\"正在同步\":offline?\"离线模式\":\"网络可用\"}\u003c/span>`;\n  const sim=demo()?button(snapshot.forcedOffline?\"恢复连接\":\"模拟断网\",\"data-offline\",\"quiet\"):\"\";\n  const identity=demo()&&a?`\u003cdetails class=\"identity-control\">\u003csummary aria-label=\"切换演示身份，当前${esc(a.name)}\">${icon(\"user\")}${esc(a.name)}\u003c/summary>\n    \u003cdiv class=\"identity-options\" role=\"group\" aria-label=\"演示身份\">${snapshot.session.actors.map(person=>\n      `\u003cbutton type=\"button\" data-actor=\"${esc(person.id)}\" aria-pressed=\"${person.id===a.id}\" ${snapshot.offline||actorBusy?'disabled':\"\"}>${esc(person.name)} · ${person.role===\"reviewer\"?\"复核\":\"盘点\"}\u003c/button>`\n    ).join(\"\")}\u003c/div>\u003c/details>`:a?`\u003cspan class=\"operator\">${icon(\"user\")}${esc(a.name)}\u003c/span>${button(\"退出\",\"data-logout\",\"quiet\")}`:\"\";\n  const opened=toolbar.querySelector(\".identity-control\")?.open;\n  toolbar.innerHTML=network+sim+identity;\n  if(opened)toolbar.querySelector(\".identity-control\")?.setAttribute(\"open\",\"\");\n  document.querySelector(\"#mode\").textContent=demo()?\"隔离演练工作区\":\"仓库团队工作区\";\n}\nfunction setNav() {\n  const pending=queue().length;\n  const reviews=reviewer()?state().items.filter(item=>item.status===\"review\").length:0;\n  const label=document.querySelector(\"#breadcrumb\");\n  label.textContent=actor()?routes[tab][0]:\"团队登录\";\n  navigation.innerHTML=actor()?Object.entries(routes).map(([id,[title,symbol]])=>{\n    const amount=id===\"queue\"?pending:id===\"review\"?reviews:0;\n    return `\u003ca class=\"rail-link\" href=\"#${id}\"${tab===id?' aria-current=\"page\"':\"\"}>${icon(symbol)}${title}\n      ${amount?`\u003cspan class=\"nav-count\">${qty(amount)}\u003c/span>`:\"\"}\u003c/a>`;\n  }).join(\"\"):\"\";\n}\nfunction loginView() {\n  main.innerHTML=`\u003csection class=\"panel login\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003ch1>登录仓库团队\u003c/h1>\u003cp>使用主管分配的盘点员或复核账号。\u003c/p>\u003c/div>\u003c/div>\n    \u003cform id=\"login-form\" class=\"form-grid panel-body\" method=\"post\">\u003clabel class=\"field\">账号\u003cinput name=\"account\" autocomplete=\"username\" required maxlength=\"90\">\u003c/label>\n      \u003clabel class=\"field\">密码\u003cinput name=\"password\" type=\"password\" autocomplete=\"current-password\" required maxlength=\"180\">\u003c/label>\n      \u003cp class=\"form-error\" role=\"alert\" hidden>\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" type=\"submit\">登录工作台 ${icon(\"arrow\")}\u003c/button>\u003c/div>\n    \u003c/form>\u003c/section>`;\n}\nfunction homeHero() {\n  const practice=demo()&&!reviewer();\n  return `\u003cheader class=\"warehouse-hero\">\u003cdiv class=\"hero-visual\" aria-hidden=\"true\">\u003cimg src=\"./hero.webp\" alt=\"\" width=\"1440\" height=\"960\" fetchpriority=\"high\">\u003c/div>\n    \u003cdiv class=\"hero-copy\">\u003ch1>库位盘点\u003c/h1>\u003cp>${reviewer()?\"查找库位商品，核对盘点进度和差异。\":\"按库位确认商品，录入实际清点的数量。\"}\u003c/p>\n    \u003cdiv class=\"actions\">${button(\"查找商品\",\"data-focus-lookup\",\"primary\",\"code\")}${practice?button(\"开始离线盘点\",\"data-try-offline\",\"quiet\"):\"\"}\u003c/div>\u003c/div>\u003c/header>`;\n}\nfunction metrics() {\n  const {items,locations}=state();\n  const pending=queue().length;\n  const last=reviewer()?[items.filter(item=>item.status===\"review\").length,\"待复核商品\"]:\n    [items.filter(item=>countState(item)===\"open\").length,\"待盘商品\"];\n  return `\u003cdl class=\"panel metric-strip\" aria-label=\"盘点概况\">\n    \u003cdiv class=\"metric\">${icon(\"pin\")}\u003cdt>盘点库位\u003c/dt>\u003cdd>\u003cstrong>${qty(locations.length)}\u003c/strong>\u003c/dd>\u003c/div>\n    \u003cdiv class=\"metric\">${icon(reviewer()?\"clipboard\":\"box\")}\u003cdt>${last[1]}\u003c/dt>\u003cdd>\u003cstrong>${qty(last[0])}\u003c/strong>\u003c/dd>\u003c/div>\n    \u003cdiv class=\"metric${pending?\" warning\":\"\"}\">${icon(\"sync\")}\u003cdt>待同步\u003c/dt>\u003cdd>\u003cstrong data-pending-count>${qty(pending)}\u003c/strong>\u003c/dd>\u003c/div>\u003c/dl>`;\n}\nfunction lookup() {\n  const picks=state().locations.map(entry=>{\n    const code=entry.id.toUpperCase();\n    const name=entry.name.startsWith(code+\" \")?entry.name.slice(code.length+1):entry.name;\n    return `\u003cbutton class=\"slot-filter\" type=\"button\" data-location=\"${esc(entry.id)}\" aria-label=\"${esc(entry.name)}\" aria-pressed=\"${entry.id===location}\">\u003cb class=\"mono\">${esc(code)}\u003c/b>\u003cspan>${esc(name)}\u003c/span>\u003c/button>`;\n  }).join(\"\");\n  return `\u003cdiv class=\"lookup-body\">\u003clabel class=\"lookup\">${icon(\"code\")}\u003cspan class=\"sr-only\">查找商品\u003c/span>\n    \u003cinput id=\"lookup\" type=\"search\" inputmode=\"search\" autocomplete=\"off\" value=\"${esc(search)}\" placeholder=\"输入品名、SKU 或条码\">\u003c/label>\n    \u003cdiv class=\"slot-filters\" role=\"group\" aria-label=\"按库位筛选\">\u003cbutton class=\"slot-filter all-slots\" type=\"button\" data-location=\"\" aria-pressed=\"${!location}\">${icon(\"pin\")}全部库位\u003c/button>${picks}\u003c/div>\u003c/div>`;\n}\nfunction matchingItems() {\n  const match=search.trim().toLocaleLowerCase();\n  return state().items.filter(item=>(!location||item.locationId===location)&&\n    (!match||[item.name,item.sku,item.barcode].some(text=>String(text).toLocaleLowerCase().includes(match))));\n}\nfunction itemMarkup(items) {\n  if(!items.length)return '\u003cp class=\"state-text\">没有匹配的商品。请检查品名、SKU 或条码。\u003c/p>';\n  return items.map(item=>{\n    const status=countState(item);\n    const place=findLocation(item.locationId);\n    const pending=ownPending(item);\n    const saved=own(item);\n    const count=pending||saved;\n    const detail=count?` · ${qty(count.quantity)} ${esc(item.unit)}`:\"\";\n    return `\u003cbutton class=\"row inventory-row\" type=\"button\" data-item=\"${esc(item.id)}\" data-count-state=\"${status}\">\n      \u003cspan class=\"row-mark${pending?\" amber\":\"\"}\">${icon(\"box\")}\u003c/span>\u003cspan class=\"row-copy\">\u003cstrong>${esc(item.name)}\u003c/strong>\n      \u003csmall>${esc(place?.name || item.locationId)} \u003cspan aria-hidden=\"true\">·\u003c/span> \u003cspan class=\"mono\">${esc(item.sku)}\u003c/span>${detail}\u003c/small>\u003c/span>\n      ${labelState(status)}\u003cspan class=\"row-arrow\">${icon(\"arrow\")}\u003c/span>\u003c/button>`;\n  }).join(\"\");\n}\nfunction updateItemList() {\n  const items=matchingItems();\n  main.querySelector(\"#filter-count\").textContent=`${qty(items.length)} 项`;\n  main.querySelector(\"#item-list\").innerHTML=itemMarkup(items);\n}\nfunction scanGuide() {\n  const message=snapshot.offline?\"当前离线，新记录会先保存在这台设备。\":\n    \"连接中断时照常录入，待发送的记录可在同步队列查看。\";\n  return `\u003caside class=\"panel scan-guide\">\u003cimg src=\"./scan-station.webp\" alt=\"在包装台用手持扫码枪读取纸箱条码\" width=\"720\" height=\"480\">\n    \u003cdiv class=\"panel-body\">\u003ch2>现场扫码\u003c/h2>\u003cp>点商品输入框后，用扫码枪读取条码，也可以手动输入。唯一匹配时按回车打开盘点。\u003c/p>\n    \u003cdiv class=\"guide-status\">${icon(\"sync\")}\u003cp>${message}\u003c/p>\u003c/div>${link(\"打开同步队列\",\"#queue\",\"full\")}\u003c/div>\u003c/aside>`;\n}\nfunction support() {\n  const pending=queue().length;\n  const network=snapshot.offline?\"记录会先保存在这台设备。恢复连接后会自动补传。\":\n    pending?\"待同步记录已保存在这台设备，可手动尝试补传。\":\"提交的原始数量随作业记录保留。盘点结果不一致时，由主管复核。\";\n  const blind=reviewer()?\"复核时会同时看到两位盘点员的报数、账面数量和结案理由。\":\n    \"盘点时只会显示自己的记录。两位盘点员各自报数后，系统再判断是否需要主管复核。\";\n  return `\u003cdiv class=\"content-stack\">\n    ${panel(\"同步状态\",\"\",`\u003cdiv class=\"panel-body\">\u003cp>${network}\u003c/p>${link(\"打开同步队列\",\"#queue\",\"full\")}\u003c/div>`)}\n    ${panel(\"独立盘点\",\"\",`\u003cdiv class=\"panel-body\">\u003cp>${blind}\u003c/p>${link(\"查看复核入口\",\"#review\",\"full\")}\u003c/div>`)}\u003c/div>`;\n}\nfunction renderCounts() {\n  const items=matchingItems();\n  main.innerHTML=homeHero()+metrics()+`\u003cdiv class=\"content-grid count-grid\">\u003csection class=\"panel task-panel\">\n    \u003cheader class=\"panel-head\">\u003ch2>库位商品\u003c/h2>\u003cspan class=\"result-count\" id=\"filter-count\" role=\"status\">${qty(items.length)} 项\u003c/span>\u003c/header>\n    ${lookup()}\u003cdiv id=\"item-list\" class=\"list\">${itemMarkup(items)}\u003c/div>\u003c/section>${scanGuide()}\u003c/div>`;\n}\nfunction renderQueue() {\n  const pending=queue();\n  const safeRows=pending.map(entry=>{\n    const item=findItem(entry.itemId);\n    const failed=entry.error?.message || entry.error;\n    return `\u003cli>\u003cdiv class=\"row\" data-queue-item=\"${esc(entry.itemId)}\">\u003cspan class=\"row-mark amber\">${icon(failed?\"info\":\"sync\")}\u003c/span>\n      \u003cspan class=\"row-copy\">\u003cstrong>${esc(item?.name || entry.itemId)}\u003c/strong>\n        \u003csmall>${qty(entry.quantity)} ${esc(item?.unit || \"\")} · ${time(entry.at)}${failed?` · ${esc(failed)}`:\"\"}\u003c/small>\u003c/span>\n      \u003cspan class=\"tag ${failed?\"conflict\":\"pending\"}\">${failed?\"未被接收\":\"待发送\"}\u003c/span>\n      ${failed?button(\"处理\",`data-queue-review=\"${esc(entry.opId)}\"`,\"quiet\"):\"\"}\u003c/div>\u003c/li>`;\n  }).join(\"\");\n  main.innerHTML=heading(\"同步队列\",\"保存到本机的记录会在连接可用时补传。\",\n    button(snapshot.syncing?\"正在同步\":\"立即同步\",`data-sync ${snapshot.forcedOffline||!navigator.onLine||snapshot.syncing||!pending.some(entry=>!entry.error)?\"disabled\":\"\"}`,\"primary\",\"sync\"))+\n    (snapshot.offline?note(\"当前离线。已保存的盘点可在关闭工作台或重新打开后继续同步。\"):\"\")+\n    `\u003cdiv class=\"content-grid\">${panel(\"本机待发送\",`${qty(pending.length)} 条记录`,safeRows?\n      `\u003cul class=\"list\">${safeRows}\u003c/ul>`:'\u003cp class=\"state-text\">没有待同步记录。新的离线盘点会出现在这里。\u003c/p>')}${support()}\u003c/div>`;\n}\nfunction compareValue(value,unit) {\n  return value==null?\"—\":`${qty(value)} \u003csmall>${esc(unit)}\u003c/small>`;\n}\nfunction compare(item) {\n  const counted=item.counts || [];\n  const originalCounts=[\"第一位盘点员\",\"第二位盘点员\"].map((fallback,index)=>{\n    const value=counted[index]?.quantity;\n    const delta=value!=null&&item.expected!=null?value-item.expected:0;\n    return `\u003cdiv class=\"${delta?\"has-difference\":\"\"}\">\u003cdt>${esc(counted[index]?.actorName || fallback)}\u003c/dt>\u003cdd>${compareValue(value,item.unit)}\n      ${delta?`\u003cspan class=\"difference\">${delta>0?\"多\":\"少\"} ${qty(Math.abs(delta))} ${esc(item.unit)}\u003c/span>`:\"\"}\u003c/dd>\u003c/div>`;\n  });\n  return `\u003cdl class=\"compare-grid\">\u003cdiv>\u003cdt>账面数量\u003c/dt>\u003cdd>${compareValue(item.expected,item.unit)}\u003c/dd>\u003c/div>${originalCounts.join(\"\")}\u003c/dl>`;\n}\nfunction reviewRows(items,closed=false) {\n  if(!items.length)return `\u003cp class=\"state-text\">${closed?\"还没有已复核的商品。\":\"当前没有待复核的盘点差异。\"}\u003c/p>`;\n  return items.map(item=>{\n    const place=findLocation(item.locationId);\n    return `\u003cbutton type=\"button\" class=\"row inventory-row\" data-review-item=\"${esc(item.id)}\" data-review-state=\"${item.status}\">\n      \u003cspan class=\"row-mark${closed?\"\":\" amber\"}\">${icon(closed?\"check\":\"clipboard\")}\u003c/span>\n      \u003cspan class=\"row-copy\">\u003cstrong>${esc(item.name)}\u003c/strong>\u003csmall>${esc(place?.name || item.locationId)} · \u003cspan class=\"mono\">${esc(item.sku)}\u003c/span>\n      ${closed?` · 确认 ${compareValue(item.finalQuantity,item.unit)}`:\"\"}\u003c/small>\u003c/span>\n      ${labelState(item.status)}\u003cspan class=\"row-arrow\">${icon(\"arrow\")}\u003c/span>\u003c/button>`;\n  }).join(\"\");\n}\nfunction renderReview() {\n  const isReviewer=reviewer();\n  const items=state().items;\n  const tasks=items.filter(item=>item.status===\"review\");\n  const closed=items.filter(item=>item.status===\"closed\");\n  const switcher=!isReviewer&&demo()&&!snapshot.offline?button(\"切换到主管\",'data-actor=\"reviewer\"',\"primary\",\"user\"):\"\";\n  const help=isReviewer?\"对比账面和两次独立实点，填入最终确认数量和理由。\":\n    \"盘点员可查看进度。主管登录后可以核对原始数量并结案。\";\n  main.innerHTML=heading(\"差异复核\",help,switcher)+(snapshot.offline?note(\"当前离线。可以查看最近缓存的任务，恢复连接后才能复核结案。\"):\"\")+\n    (isReviewer?`\u003cdiv class=\"content-grid\">\u003cdiv class=\"content-stack\">\n      ${panel(\"待复核商品\",`${qty(tasks.length)} 项差异待处理`,`\u003cdiv class=\"list\">${reviewRows(tasks)}\u003c/div>`)}\n      ${panel(\"已结案\",\"保留两次原始盘点与最后的复核决定\",`\u003cdiv class=\"list\">${reviewRows(closed,true)}\u003c/div>`)}\u003c/div>\n      ${panel(\"复核依据\",\"\",'\u003cdiv class=\"panel-body\">\u003cp>主管确认时填写最终数量和理由。若另一位主管已经处理，刷新任务后需重新核对。\u003c/p>\u003c/div>')}\u003c/div>`:\n      panel(\"主管复核入口\",\"\",'\u003cp class=\"state-text\">完成两次盘点后，差异会送入主管的复核队列。\u003c/p>'));\n}\nfunction renderHistory() {\n  const events=state().history;\n  const lines=events.map(event=>{\n    const item=findItem(event.itemId);\n    return `\u003cli data-history-type=\"${esc(event.type)}\">\u003cdiv class=\"row\">\u003cspan class=\"row-mark\">${icon(event.type===\"closed\"?\"check\":\"clock\")}\u003c/span>\n      \u003cspan class=\"row-copy\">\u003cstrong>${esc(eventLabels[event.type] || event.type)} \u003cspan class=\"muted\">·\u003c/span> ${esc(item?.name || event.itemId)}\u003c/strong>\n      \u003csmall>${esc(event.actorName)} · ${time(event.at)}${event.quantity==null?\"\":` · ${qty(event.quantity)} ${esc(item?.unit || \"\")}`}\u003c/small>\n      ${event.note?`\u003csmall class=\"history-note\">${esc(event.note)}\u003c/small>`:\"\"}\u003c/span>\u003c/div>\u003c/li>`;\n  }).join(\"\");\n  main.innerHTML=heading(\"作业记录\",reviewer()?\"查看每件商品从记录实点到主管结案的过程。\":\"查看本账号已经提交的盘点。\")+\n    panel(\"最近作业\",`${qty(events.length)} 条记录`,lines?`\u003col class=\"list\">${lines}\u003c/ol>`:'\u003cp class=\"state-text\">还没有已同步的作业记录。\u003c/p>');\n}\nfunction render() {\n  if(!snapshot)return;\n  setToolbar();\n  setNav();\n  if(!actor()){if(!main.querySelector(\"#login-form\"))loginView();return;}\n  if (!state().locations.length) {\n    main.innerHTML=heading(\"库位盘点\",\"需要先在线加载一次盘点数据。\")+\n      note(snapshot.error || \"当前设备还没有缓存的任务。\",!!snapshot.error)+\n      (snapshot.forcedOffline||!navigator.onLine?\"\":`\u003cdiv class=\"retry\">${button(\"重新加载\",\"data-refresh\",\"primary\",\"sync\")}\u003c/div>`);\n    return;\n  }\n  const focusLookup=document.activeElement?.id===\"lookup\";\n  const caret=focusLookup?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;\n  if(tab===\"queue\")renderQueue();\n  else if(tab===\"review\")renderReview();\n  else if(tab===\"history\")renderHistory();\n  else renderCounts();\n  if(focusLookup&&tab===\"count\") {\n    const input=main.querySelector(\"#lookup\");\n    input?.focus();\n    if(input&&caret)input.setSelectionRange(...caret);\n  }\n  if(snapshot.error)main.insertAdjacentHTML(\"afterbegin\",note(snapshot.error,true));\n}\nfunction presentDialog(title,subtitle,body) {\n  formContent.innerHTML=`\u003cheader class=\"dialog-head\">\u003cdiv>\u003ch2 id=\"dialog-title\">${esc(title)}\u003c/h2>\u003cp>${esc(subtitle)}\u003c/p>\u003c/div>\n    \u003cbutton class=\"dialog-close\" type=\"button\" aria-label=\"关闭\" data-dialog-close>${icon(\"close\")}\u003c/button>\u003c/header>\n    \u003cdiv class=\"dialog-body\">${body}\u003c/div>`;\n  if(!dialog.open)dialog.showModal();\n  const input=formContent.querySelector(\"[name=quantity]\");\n  if(input)input.focus();\n}\nconst closeControl=button(\"关闭\",\"data-dialog-close\",\"quiet\");\nfunction quantityInput(unit,value=\"\") {\n  return `\u003clabel class=\"field\" for=\"quantity-field\">实点数量（${esc(unit)}）\u003c/label>\n    \u003cdiv class=\"qty-field\">\u003cbutton class=\"btn\" type=\"button\" aria-label=\"数量减一\" data-adjust=\"-1\">−\u003c/button>\n      \u003cinput id=\"quantity-field\" name=\"quantity\" type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"1\" required value=\"${esc(value)}\">\n      \u003cbutton class=\"btn\" type=\"button\" aria-label=\"数量加一\" data-adjust=\"1\">+\u003c/button>\u003c/div>`;\n}\nfunction openItem(id) {\n  const item=findItem(id);\n  if(!item)return;\n  if(reviewer()){openReview(id);return;}\n  const pending=ownPending(item);\n  const saved=own(item);\n  const toEdit=!pending&&!saved&&item.status===\"open\";\n  const detail=findLocation(item.locationId)?.name || item.locationId;\n  const subtitle=`${detail} · ${item.sku}`;\n  if(toEdit) {\n    presentDialog(item.name,subtitle,`\u003cform id=\"count-form\" data-for-item=\"${esc(id)}\" class=\"form-grid\">\n      \u003cp class=\"slot-label\">${icon(\"code\")}\u003cspan class=\"mono\">${esc(item.barcode)}\u003c/span>\u003c/p>\n      ${quantityInput(item.unit)}\n      \u003cp class=\"slot-label\">${icon(\"info\")}${snapshot.offline?\"离线保存，恢复连接后自动补传。\":\"只填写现场清点结果。提交后保留原始记录。\"}\u003c/p>\n      \u003cp class=\"form-error\" role=\"alert\" hidden>\u003c/p>\u003cdiv class=\"actions\">${closeControl}\u003cbutton class=\"btn primary\" type=\"submit\">${snapshot.offline?\"保存到本机\":\"保存盘点记录\"} ${icon(\"arrow\")}\u003c/button>\u003c/div>\u003c/form>`);\n    return;\n  }\n  const count=pending||saved;\n  presentDialog(item.name,subtitle,`\u003cdiv class=\"form-grid\">${labelState(countState(item))}${count?\n    `\u003cp class=\"read-number\">\u003cstrong>${qty(count.quantity)}\u003c/strong> ${esc(item.unit)}\u003c/p>\u003cp class=\"slot-label\">${time(count.at)} 的实点记录\u003c/p>`:\n    '\u003cp class=\"state-text\">该商品已结束盘点。\u003c/p>'}\n    ${item.finalQuantity!=null?`\u003cp>主管确认 ${compareValue(item.finalQuantity,item.unit)}\u003c/p>`:\"\"}\n    \u003cdiv class=\"actions\">${closeControl}\u003c/div>\u003c/div>`);\n}\nfunction openReview(id) {\n  const item=findItem(id);\n  if(!reviewer()||!item)return;\n  const subtitle=`${findLocation(item.locationId)?.name || item.locationId} · ${item.sku}`;\n  const comparison=compare(item);\n  if(item.status===\"review\"&&!snapshot.offline) {\n    presentDialog(item.name,subtitle,comparison+`\u003cform id=\"review-form\" data-for-item=\"${esc(id)}\" data-revision=\"${esc(item.revision)}\" class=\"form-grid\">\n      ${quantityInput(item.unit)}\n      \u003clabel class=\"field\">复核理由\u003ctextarea name=\"note\" required maxlength=\"500\" placeholder=\"填写复点或现场核对依据\">\u003c/textarea>\u003c/label>\n      \u003cp class=\"form-error\" role=\"alert\" hidden>\u003c/p>\u003cdiv class=\"actions\">${closeControl}\u003cbutton class=\"btn primary\" type=\"submit\">确认结案 ${icon(\"check\")}\u003c/button>\u003c/div>\u003c/form>`);\n    const label=formContent.querySelector('label[for=\"quantity-field\"]');\n    label.textContent=`最终确认数量（${item.unit}）`;\n  } else {\n    presentDialog(item.name,subtitle,`${comparison}\u003cdiv class=\"form-grid\">${labelState(item.status)}\n      ${item.decision?`\u003cp>确认 ${compareValue(item.decision.quantity,item.unit)} · ${esc(item.decision.actorName)}\u003c/p>\u003cp>${esc(item.decision.note)}\u003c/p>`:\"\"}\n      ${item.status===\"review\"?note(\"离线时仅可查看。恢复连接后才能完成复核。\"):\"\"}\u003cdiv class=\"actions\">${closeControl}\u003c/div>\u003c/div>`);\n  }\n}\nfunction openRejected(opId) {\n  const entry=queue().find(candidate=>candidate.opId===opId && candidate.error);\n  if(!entry)return;\n  const item=findItem(entry.itemId);\n  presentDialog(\"处理未接收记录\",item?.name || entry.itemId,`\u003cdiv class=\"form-grid\">\n    \u003cp>本地实点 ${qty(entry.quantity)} ${esc(item?.unit || \"\")} · ${time(entry.at)}\u003c/p>\n    ${note(entry.error.message || entry.error,true)}\n    \u003cp>移出队列会删除本机的这一份待传记录。已同步的作业记录仍可在历史中查看。\u003c/p>\n    \u003cdiv class=\"actions\">${closeControl}${button(\"移出队列\",`data-remove-rejected=\"${esc(opId)}\"`,\"primary\")}\u003c/div>\u003c/div>`);\n}\nfunction formError(form,error) {\n  const output=form.querySelector(\".form-error\");\n  output.textContent=error?.message || String(error);\n  output.hidden=false;\n}\nasync function onForm(event) {\n  const form=event.target;\n  if(![\"login-form\",\"count-form\",\"review-form\"].includes(form.id))return;\n  event.preventDefault();\n  const submit=form.querySelector('[type=\"submit\"]');\n  if(submit.disabled)return;\n  submit.disabled=true;\n  const fields=new FormData(form);\n  try {\n    if(form.id===\"login-form\") {\n      await inventory.login(fields.get(\"account\"),fields.get(\"password\"));\n      go(actor()?.role===\"reviewer\"?\"#review\":\"#count\");\n      return;\n    }\n    const quantity=Number(fields.get(\"quantity\"));\n    if(fields.get(\"quantity\")===\"\" || !Number.isSafeInteger(quantity) || quantity\u003c0)\n      throw new Error(\"请输入 0 或正整数。\");\n    if(form.id===\"count-form\") {\n      await inventory.saveCount(form.dataset.forItem,quantity);\n      flash(snapshot.offline?\"已保存到这台设备，等待同步。\":\"盘点已保存，正在检查同步状态。\");\n    } else {\n      const noteText=fields.get(\"note\").trim();\n      if(!noteText)throw new Error(\"请填写复核理由。\");\n      await inventory.resolve(form.dataset.forItem,{revision:Number(form.dataset.revision),quantity,note:noteText});\n      flash(\"差异已确认结案，原始盘点记录已保留。\");\n    }\n    dialog.close();\n    render();\n    main.focus({preventScroll:true});\n  } catch(error) {\n    formError(form,error);\n  } finally {\n    submit.disabled=false;\n  }\n}\nasync function operate(control) {\n  if(actionBusy)return;\n  actionBusy=true;\n  control.disabled=true;\n  try {\n    if(control.matches(\"[data-offline]\")) {\n      const joining=snapshot.forcedOffline;\n      await inventory.setOffline(!joining);\n      flash(joining?\"模拟连接已恢复。\":\"模拟断网已开启，可继续盘点。\");\n    } else if(control.matches(\"[data-sync]\")) {\n      const result=await inventory.sync();\n      flash(result.failed?`已补传 ${result.sent} 条，${result.failed} 条需要检查。`:`已补传 ${result.sent} 条记录。`);\n    } else if(control.matches(\"[data-try-offline]\")) {\n      const item=findItem(\"a01-tape\");\n      if(!item)return;\n      if(own(item)||ownPending(item)||item.status!==\"open\"){openItem(item.id);return;}\n      if(!snapshot.offline)await inventory.setOffline(true);\n      openItem(item.id);\n    } else if(control.matches(\"[data-logout]\")) {\n      await inventory.logout();\n      go(\"#count\");\n    } else if(control.matches(\"[data-refresh]\")) {\n      await inventory.refresh();\n    } else if(control.matches(\"[data-remove-rejected]\")) {\n      await inventory.discardRejected(control.dataset.removeRejected);\n      dialog.close();\n      flash(\"已从本地队列移除。\");\n    }\n  } catch(error) {\n    flash(error.message);\n  } finally {\n    control.disabled=false;\n    actionBusy=false;\n  }\n}\nasync function changeActor(id) {\n  if(actorBusy || actor()?.id===id)return;\n  actorBusy=true;\n  setToolbar();\n  try {\n    await inventory.switchRole(id);\n    toolbar.querySelector(\".identity-control\")?.removeAttribute(\"open\");\n    go(reviewer()?\"#review\":\"#count\");\n    flash(`当前演练身份为${actor()?.name}。`);\n  } catch(error) {\n    flash(error.message);\n  } finally {\n    actorBusy=false;\n    setToolbar();\n  }\n}\nfunction activeTab() {\n  const requested=window.location.hash.slice(1);\n  tab=Object.hasOwn(routes,requested)?requested:\"count\";\n}\nfunction onClick(event) {\n  const identity=toolbar.querySelector(\".identity-control\");\n  if(identity?.open&&!identity.contains(event.target))identity.open=false;\n  const control=event.target.closest(\"button\");\n  if(!control||!inventory)return;\n  if(control.matches(\"[data-item]\"))openItem(control.dataset.item);\n  else if(control.matches(\"[data-review-item]\"))openReview(control.dataset.reviewItem);\n  else if(control.matches(\"[data-queue-review]\"))openRejected(control.dataset.queueReview);\n  else if(control.matches(\"[data-dialog-close]\"))dialog.close();\n  else if(control.matches(\"[data-adjust]\")) {\n    const input=formContent.querySelector(\"[name=quantity]\");\n    const updated=Math.max(0,Number(input.value || 0)+Number(control.dataset.adjust));\n    if(Number.isSafeInteger(updated))input.value=String(updated);\n    input.focus();\n  } else if(control.matches(\"[data-location]\")) {\n    location=control.dataset.location;\n    main.querySelectorAll(\"[data-location]\").forEach(option=>option.setAttribute(\"aria-pressed\",option===control));\n    updateItemList();\n  } else if(control.matches(\"[data-focus-lookup]\")) {\n    const input=main.querySelector(\"#lookup\");\n    input.focus({preventScroll:true});\n    input.scrollIntoView({block:\"nearest\"});\n  } else if(control.matches(\"[data-actor]\"))void changeActor(control.dataset.actor);\n  else if(control.matches(\"[data-offline],[data-sync],[data-try-offline],[data-logout],[data-refresh],[data-remove-rejected]\"))void operate(control);\n}\ndocument.addEventListener(\"submit\",onForm);\ndocument.addEventListener(\"click\",onClick);\ndocument.addEventListener(\"input\",event=>{\n  if(event.target.id!==\"lookup\")return;\n  search=event.target.value;\n  updateItemList();\n});\ndocument.addEventListener(\"keydown\",event=>{\n  if(event.key!==\"Enter\"||event.target.id!==\"lookup\")return;\n  const matches=main.querySelectorAll(\"#item-list button\");\n  if(matches.length===1)openItem(matches[0].dataset.item);\n});\nwindow.addEventListener(\"hashchange\",()=>{\n  if(dialog.open)dialog.close();\n  activeTab();\n  render();\n  window.scrollTo(0,0);\n  main.focus({preventScroll:true});\n});\ntry {\n  inventory=await openInventory();\n  snapshot=inventory.snapshot;\n  activeTab();\n  inventory.subscribe(next=>{snapshot=next;render();});\n  render();\n} catch(error) {\n  main.innerHTML=heading(\"移动盘点工作台\",\"打开工作区时遇到问题。\")+\n    note(error.message,true)+`\u003cdiv class=\"retry\">${link(\"重新加载\",\"./index.html\",\"primary\",\"sync\")}\u003c/div>`;\n} finally {\n  main.setAttribute(\"aria-busy\",\"false\");\n}\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  \u003cmeta name=\"theme-color\" content=\"#142233\">\n  \u003ctitle>移动盘点工作台\u003c/title>\n  \u003clink rel=\"manifest\" href=\"./manifest.webmanifest\">\n  \u003clink rel=\"icon\" href=\"./icon-192.png\" type=\"image/png\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n  \u003cscript defer type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#inventory-main\">跳到工作区\u003c/a>\n  \u003cdiv class=\"shell\">\n    \u003caside class=\"rail\">\n      \u003ca class=\"brand\" href=\"#count\">\n        \u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\n        \u003cspan>\u003cstrong>移动盘点\u003c/strong>\u003csmall>仓储作业\u003c/small>\u003c/span>\n      \u003c/a>\n      \u003cnav id=\"navigation\" aria-label=\"工作区导航\">\u003c/nav>\n      \u003cdiv class=\"rail-foot\">\n        \u003cp id=\"mode\">\u003c/p>\n        \u003ca href=\"https://github.com/fate788/mobile-inventory\" target=\"_blank\" rel=\"noopener\">GitHub 源码 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/aside>\n    \u003cdiv class=\"workspace\">\n      \u003cheader class=\"topbar\">\n        \u003cdiv class=\"top-path\">\u003cspan>仓库作业\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cb id=\"breadcrumb\">移动盘点\u003c/b>\u003c/div>\n        \u003cdiv class=\"top-tools\" id=\"toolbar\">\u003c/div>\n      \u003c/header>\n      \u003cmain id=\"inventory-main\" class=\"main\" tabindex=\"-1\" aria-busy=\"true\">\n        \u003cp class=\"loading\" role=\"status\">正在读取盘点任务…\u003c/p>\n      \u003c/main>\n    \u003c/div>\n  \u003c/div>\n  \u003cdialog id=\"work-dialog\" aria-labelledby=\"dialog-title\">\u003cdiv id=\"form-content\">\u003c/div>\u003c/dialog>\n  \u003cdiv class=\"notice\" id=\"notice\" role=\"status\" hidden>\u003c/div>\n  \u003cnoscript>\u003cp class=\"loading\">请启用 JavaScript 以使用移动盘点工作台。\u003c/p>\u003c/noscript>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/manifest.webmanifest","text":"{\n  \"id\":\"./\",\n  \"name\":\"移动盘点工作台\",\n  \"short_name\":\"移动盘点\",\n  \"lang\":\"zh-CN\",\n  \"start_url\":\"./index.html\",\n  \"scope\":\"./\",\n  \"display\":\"standalone\",\n  \"background_color\":\"#edf1f5\",\n  \"theme_color\":\"#142233\",\n  \"icons\":[\n    {\"src\":\"./icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\",\"purpose\":\"any\"},\n    {\"src\":\"./icon-512.png\",\"sizes\":\"512x512\",\"type\":\"image/png\",\"purpose\":\"any\"}\n  ]\n}\n","group":"前端"},{"path":"static/offline.mjs","text":"import request from \"./transport.mjs\";\nimport {storage} from \"./storage.mjs\";\n\nconst noWorkspace={actor:null, locations:[], items:[], history:[]};\nconst blankSession={mode:\"demo\",actor:null,actors:[],workspaceId:null};\nconst keyFor=session=>[session.workspaceId,session.actor.id].join(\":\");\nconst transportError=error=>error.status===undefined || error.status>=500;\nfunction queueError(error){\n  return error?.message || \"操作未完成，请稍后重试。\";\n}\n\nexport async function openInventory(){\n  let session=blankSession, workspace=noWorkspace, pending=[], forcedOffline=false, unavailable=false;\n  let syncing=false, error=\"\", inFlight=null, mapping=false;\n  const listeners=new Set();\n  const snapshot=()=>({session,workspace,pending,offline:forcedOffline||!navigator.onLine||unavailable,\n    forcedOffline,syncing,error});\n  const notify=()=>{for(const listener of listeners)listener(snapshot());};\n  if(\"serviceWorker\" in navigator && /^https?:$/u.test(location.protocol))\n    navigator.serviceWorker.register(\"./sw.js\").catch(()=>{});\n\n  async function applySession(next){\n    const old=session.actor ? keyFor(session) : \"\";\n    const key=next.actor ? keyFor(next) : \"\";\n    if(old!==key || !key)workspace=noWorkspace;\n    session=next;\n    await storage(\"session\",()=>next.mode===\"team\"&&!next.actor?{...next,workspaceId:null}:next);\n    if(!key){pending=[];notify();return;}\n    const [cached,queue]=await Promise.all([storage(\"workspace:\"+key),storage(\"queue:\"+key)]);\n    workspace=cached || noWorkspace;\n    pending=queue || [];\n    notify();\n  }\n\n  async function load(){\n    if(!session.actor)return;\n    const current=session,key=keyFor(current);\n    const cached=await request(\"/api/workspace\",{session:current});\n    if(session!==current)return;\n    workspace=cached;\n    await storage(\"workspace:\"+key,()=>cached);\n    notify();\n  }\n\n  async function refresh(){\n    if(mapping || forcedOffline || !navigator.onLine)return snapshot();\n    mapping=true;\n    try {\n      const next=await request(\"/api/session\");\n      await applySession(next);\n      unavailable=false;\n      await load();\n      error=\"\";\n    } catch(fault){\n      unavailable=transportError(fault);\n      error=queueError(fault);\n    } finally {\n      mapping=false;\n      notify();\n    }\n    return snapshot();\n  }\n\n  async function patchQueue(key,apply){\n    const updated=await storage(\"queue:\"+key,queue=>apply(queue || []));\n    if(session.actor && key===keyFor(session))pending=updated;\n    notify();\n    return updated;\n  }\n\n  async function deliver(){\n    if(!session.actor || mapping || forcedOffline || !navigator.onLine)return {sent:0,failed:0};\n    let sent=0,failed=0;\n    const current=session,key=keyFor(current);\n    syncing=true;error=\"\";notify();\n    try{\n      // Each acknowledged entry is removed only after the server commits it.\n      const attempted=new Set();\n      for(;;){\n        if(!session.actor || key!==keyFor(session) || forcedOffline || !navigator.onLine)break;\n        const operation=(await storage(\"queue:\"+key) || []).find(entry=>!entry.error && !attempted.has(entry.opId));\n        if(!operation)break;\n        attempted.add(operation.opId);\n        const {opId,itemId,quantity}=operation;\n        try{\n          await request(\"/api/counts\",{method:\"POST\",session:current,body:{opId,itemId,quantity}});\n          await patchQueue(key,queue=>queue.filter(entry=>entry.opId!==opId));\n          unavailable=false;\n          sent++;\n        }catch(fault){\n          failed++;\n          error=queueError(fault);\n          if(transportError(fault)){unavailable=true;break;}\n          if(fault.status===401 || fault.status===403 || [\"SESSION_CHANGED\",\"SESSION_SCOPE_CHANGED\"].includes(fault.code)){\n            await refresh();\n            error=queueError(fault);\n            break;\n          }\n          await patchQueue(key,queue=>queue.map(entry=>entry.opId===opId?{...entry,error}:entry));\n        }\n      }\n      if(!forcedOffline && navigator.onLine && !unavailable)await load();\n    }catch(fault){\n      error=queueError(fault);\n      unavailable=transportError(fault);\n    } finally {\n      syncing=false;notify();\n    }\n    return {sent,failed};\n  }\n\n  function sync(){\n    if(!inFlight)inFlight=(async()=>{\n      if(unavailable)await refresh();\n      return deliver();\n    })().finally(()=>{inFlight=null;});\n    return inFlight;\n  }\n  async function saveCount(itemId,quantity){\n    const actor=session.actor;\n    if(actor?.role!==\"counter\" || mapping)throw new Error(\"当前身份不能记录数量。\");\n    if(!workspace.items.some(item=>item.id===itemId && item.status===\"open\" && !item.counts.length))\n      throw new Error(\"这项货品已登记或未分配给当前工作台。\");\n    if(!Number.isSafeInteger(quantity)||quantity\u003c0)throw new Error(\"请输入 0 或正整数。\");\n    const key=keyFor(session);\n    const entry={opId:crypto.randomUUID(),itemId,quantity,actorId:actor.id,at:Date.now()};\n    await patchQueue(key,queue=>{\n      if(queue.some(item=>item.itemId===itemId))throw new Error(\"该货品已有本地记录，请先处理同步队列。\");\n      return [...queue,entry];\n    });\n    if(!snapshot().offline)void sync();\n    return entry;\n  }\n  async function setOffline(value){\n    if(session.mode!==\"demo\")throw new Error(\"仅演练提供网络开关。\");\n    forcedOffline=Boolean(value);\n    await storage(\"forced-offline\",()=>forcedOffline);\n    notify();\n    if(!forcedOffline){\n      await refresh();\n      return sync();\n    }\n    return {sent:0,failed:0};\n  }\n  async function changeIdentity(path,body){\n    if(mapping || forcedOffline || !navigator.onLine)throw new Error(\"连接后才能切换身份。\");\n    mapping=true;\n    try {\n      if(inFlight)await inFlight;\n      const next=await request(path,{method:\"POST\",body});\n      await applySession(next);\n      unavailable=false;\n      error=\"\";\n      try {await load();}\n      catch(fault){unavailable=transportError(fault);error=queueError(fault);}\n    } finally {mapping=false;notify();}\n    if(session.actor)void sync();\n    return session;\n  }\n  async function resolve(itemId,body){\n    if(snapshot().offline || mapping)throw new Error(\"复核需要连接服务器。\");\n    const current=session;\n    const result=await request(\"/api/items/\"+encodeURIComponent(itemId)+\"/resolve\",{method:\"POST\",session:current,body});\n    await load();\n    return result;\n  }\n  async function discardRejected(opId){\n    if(!session.actor)throw new Error(\"请登录原账号处理本地记录。\");\n    await patchQueue(keyFor(session),queue=>queue.filter(entry=>entry.opId!==opId || !entry.error));\n  }\n  async function connectionChanged(){\n    if(navigator.onLine && !forcedOffline)await refresh();\n    notify();\n    if(!snapshot().offline)void sync();\n  }\n  window.addEventListener(\"online\",()=>void connectionChanged());\n  window.addEventListener(\"offline\",notify);\n  const [cached,savedDisconnection]=await Promise.all([storage(\"session\"),storage(\"forced-offline\")]);\n  forcedOffline=Boolean(savedDisconnection);\n  if(cached)await applySession(cached);\n  if(!cached || !forcedOffline)await refresh();\n  if(!snapshot().offline && pending.length)void sync();\n  return {\n    get snapshot(){return snapshot();},\n    subscribe(listener){listeners.add(listener);return ()=>listeners.delete(listener);},\n    saveCount,sync,setOffline,refresh,resolve,discardRejected,\n    switchRole:id=>changeIdentity(\"/api/session/role\",{id}),\n    login:(id,password)=>changeIdentity(\"/api/login\",{id,password}),\n    logout:()=>changeIdentity(\"/api/logout\",{}),\n  };\n}\n","group":"前端"},{"path":"static/storage.mjs","text":"export const edition=document.documentElement.dataset.edition || \"server\";\nconst name=\"warehouse-count-\"+edition;\nconst objectStore=\"records\";\n\nconst database=new Promise((resolve,reject)=>{\n  try{\n    const opening=indexedDB.open(name,1);\n    opening.onupgradeneeded=()=>opening.result.createObjectStore(objectStore);\n    opening.onsuccess=()=>resolve(opening.result);\n    opening.onerror=()=>reject(opening.error || new Error(\"无法打开浏览器离线存储。\"));\n    opening.onblocked=()=>reject(new Error(\"另一页面正在使用旧版离线存储。\"));\n  }catch(error){reject(error);}\n});\n\nexport async function storage(key,update) {\n  const db=await database;\n  return new Promise((resolve,reject)=>{\n    const tx=db.transaction(objectStore,update?\"readwrite\":\"readonly\");\n    const store=tx.objectStore(objectStore);\n    const reading=store.get(key);\n    let value,failure;\n    reading.onsuccess=()=>{\n      try{\n        value=update?update(reading.result):reading.result;\n        if(update)store.put(value,key);\n      }catch(error){failure=error;tx.abort();}\n    };\n    tx.oncomplete=()=>resolve(value);\n    tx.onabort=()=>reject(failure || tx.error || new Error(\"无法保存浏览器中的盘点记录。\"));\n  });\n}\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --canvas: #edf1f5;\n  --paper: #fff;\n  --paper-soft: #f5f7f9;\n  --ink: #172637;\n  --body: #34475a;\n  --muted: #516478;\n  --rule: #d5dfe8;\n  --rule-soft: #e5ecf1;\n  --nav: #142233;\n  --nav-text: #b9c9d9;\n  --accent: #23496a;\n  --signal: #ffb554;\n  --amber: #7b480d;\n  --sand: #fff2dc;\n  --focus: #a95003;\n  --round: 8px;\n  --rail: 202px;\n  --gutter: clamp(20px,2.7vw,42px);\n  --sans: \"Inter\",\"PingFang SC\",\"Microsoft YaHei UI\",\"Noto Sans CJK SC\",system-ui,sans-serif;\n  --mono: \"Cascadia Mono\",\"IBM Plex Mono\",\"SFMono-Regular\",Consolas,monospace;\n  font: 14px/1.55 var(--sans);\n  color: var(--ink);\n  background: var(--canvas);\n}\n* { box-sizing:border-box; }\nbody { margin:0; min-width:280px; }\n[hidden] { display:none !important; }\n::selection { background:#ffdfb1; color:var(--ink); }\n:where(h1,h2,h3,h4,p,ol,ul,dl,dd,fieldset) { margin:0; padding:0; }\na { color:inherit; text-decoration:none; }\nbutton,input,textarea { font:inherit; color:inherit; }\nbutton { cursor:pointer; }\nbutton:disabled { cursor:not-allowed; opacity:.53; }\n:where(a,button,input,textarea,summary):focus-visible { outline:2px solid var(--focus); outline-offset:3px; }\n.rail :focus-visible,.warehouse-hero :focus-visible { outline-color:#ffcd8a; }\n.skip-link { position:fixed; z-index:6; left:12px; top:-60px; padding:8px 14px; background:var(--paper); border-radius:5px; }\n.skip-link:focus { top:12px; }\n.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }\n.icon { display:inline-grid; place-items:center; flex:none; width:1.2em; height:1.2em; }\n.icon svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }\n.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }\n.muted { color:var(--muted); }\n.shell { min-height:100vh; }\n.rail { position:fixed; inset:0 auto 0 0; z-index:2; width:var(--rail); display:flex; flex-direction:column; color:var(--nav-text); background:var(--nav); border-right:1px solid #273b50; }\n.brand { display:flex; align-items:center; gap:11px; padding:27px 19px; line-height:1.2; color:#fff; }\n.brand strong { display:block; font-size:19px; font-weight:740; white-space:nowrap; }\n.brand small { display:block; color:#a6bbcf; margin-top:4px; font-size:11px; }\n.brand-mark { display:flex; gap:4px; padding:7px; align-items:center; justify-content:center; width:35px; height:35px; border-radius:5px; background:var(--signal); color:#233244; }\n.brand-mark i { width:2px; height:14px; background:currentColor; }\n.brand-mark i:nth-child(2) { width:4px; height:18px; }\n.rail nav { display:grid; margin-inline:12px; gap:5px; padding:14px 0; border-top:1px solid #ffffff21; }\n.rail nav:empty { display:none; }\n.rail-link { display:flex; align-items:center; gap:11px; min-height:45px; padding:8px 12px; position:relative; border:1px solid transparent; border-radius:5px; font-weight:630; font-size:13px; white-space:nowrap; }\n.rail-link .icon { font-size:17px; }\n.rail-link:hover { background:#22364a; color:#fff; }\n.rail-link[aria-current=\"page\"] { color:#ffcc88; background:#25374b; border-color:#344b60; box-shadow:inset 3px 0 #ffb554; }\n.nav-count { margin-left:auto; min-width:20px; padding:2px 5px; border-radius:4px; background:var(--signal); color:#212b36; font:700 11px/1.3 var(--mono); text-align:center; }\n.rail-foot { margin:auto 16px 19px; padding:14px 3px 0; border-top:1px solid #ffffff20; font-size:12px; }\n.rail-foot p { color:#a9bed0; margin-bottom:11px; }\n.rail-foot a { display:flex; justify-content:space-between; gap:7px; }\n.rail-foot a:hover { color:#fff; }\n.workspace { margin-left:var(--rail); min-width:0; }\n.topbar { display:flex; justify-content:space-between; align-items:center; gap:8px 18px; padding:6px var(--gutter); min-height:62px; background:var(--paper); border-bottom:1 kground:var(--paper); box-shadow:0 2px 3px #172c4510; }\n.panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px 15px; flex-wrap:wrap; padding:15px 17px; border-bottom:1px solid var(--rule-soft); }\n.panel-head h2,.panel-body h2 { font-size:18px; font-weight:735; letter-spacing:-.015em; }\n.panel-head p,.panel-body > p { color:var(--muted); font-size:13px; margin-top:4px; }\n.panel-body { padding:16px; }\n.panel-body .btn.full { margin-top:12px; }\n.warehouse-hero { position:relative; isolation:isolate; display:grid; align-items:center; min-height:215px; overflow:hidden; border:1px solid #25384a; border-radius:var(--round); background:#17283a; color:#fff; box-shadow:0 7px 15px #21344522; }\n.hero-visual { position:absolute; inset:0 0 0 auto; z-index:-1; width:63%; }\n.hero-visual img { display:block; width:100%; height:100%; object-fit:cover; object-position:63% 50%; }\n.hero-visual::after { content:\"\"; position:absolute; inset:0; background:linear-gradient(90deg,#17283a 0%,#17283aeb 9%,#17283a4f 38%,#101f3014 76%); }\n.hero-copy { width:min(100%,610px); padding:25px clamp(18px,3vw,37px); }\n.hero-copy h1 { font-size:clamp(35px,4vw,54px); line-height:1.1; font-weight:780; letter-spacing:-.042em; }\n.hero-copy p { margin-top:10px; color:#d5e1ed; font-size:14px; }\n.hero-copy .actions { margin-top:18px; }\n.hero-copy .primary { background:var(--signal); color:#1d2a36; border-color:var(--signal); padding-inline:16px; }\n.hero-copy .primary:hover { background:#ffcc80; border-color:#ffcc80; }\n.hero-copy .quiet { color:#f1f5fa; background:#25384bcc; border-color:#6f8296; }\n.hero-copy .quiet:hover { background:#334c65; border-color:#a8bbcd; }\n.metric-strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:15px; }\n.metric { display:grid; grid-template-columns:36px minmax(0,1fr); grid-template-areas:\"symbol label\" \"symbol count\"; column-gap:12px; row-gap:3px; align-items:center; padding:12px 16px; min-width:0;
