();\n  })());\n});\nself.addEventListener(\"activate\",event=>{\n  event.waitUntil((async()=>{\n    const keys=await caches.keys();\n    const previous=keys.filter(key=>key!==cacheName&&key.startsWith(cachePrefix)&&key.slice(key.indexOf(\":\")+1)===cacheScope);\n    await Promise.all(previous.map(key=>caches.delete(key)));\n    await self.clients.claim();\n  })());\n});\nself.addEventListener(\"fetch\",event=>{\n  const url=new URL(event.request.url);\n  const scope=new URL(self.registration.scope);\n  if(event.request.method!==\"GET\" || url.origin!==scope.origin || !url.pathname.startsWith(scope.pathname))return;\n  const resource=url.pathname.slice(scope.pathname.length);\n  if(resource.startsWith(\"api/\"))return;\n  const navigation=event.request.mode===\"navigate\";\n  if(!navigation&&!files.some(file=>resource===file.slice(2)))return;\n  event.respondWith((async()=>{\n    const cache=await caches.open(cacheName);\n    const path=new URL(navigation?\"./index.html\":\"./\"+resource,scope);\n    try{\n      const response=await fetch(event.request);\n      if(!response.ok)return response;\n      const type=response.headers.get(\"Content-Type\") || \"\";\n      if(navigation && !type.startsWith(\"text/html\"))return response;\n      await cache.put(path,response.clone());\n      return response;\n    }catch(error){\n      return await cache.match(path) || Response.error();\n    }\n  })());\n});\n","group":"前端"},{"path":"static/transport.mjs","text":"export default async function request(path,{method=\"GET\",body,session}={}) {\n  const headers={Accept:\"application/json\"};\n  if(session?.actor){\n    headers[\"X-Workspace-Id\"]=session.workspaceId;\n    headers[\"X-Workspace-Actor\"]=session.actor.id;\n  }\n  const options={method,headers,cache:\"no-store\",credentials:\"same-origin\"};\n  if(method===\"POST\"){\n    headers[\"Content-Type\"]=\"application/json\";\n    headers[\"X-Workspace-Request\"]=\"1\";\n    options.body=JSON.stringify(body || {});\n  }\n  const response=await fetch(path,options);\n  const data=await response.json();\n  if(!response.ok)throw Object.assign(new Error(data.error || \"工作台请求失败。\"),{status:response.status,code:data.code});\n  return data;\n}\n","group":"前端"},{"path":"tests/domain.test.mjs","text":"import assert from \"node:assert/strict\";\nimport { test } from \"node:test\";\nimport { actors, createWorkspace, dispatch } from \"../domain.mjs\";\n\nconst start = Date.UTC(2026, 10, 28, 1);\nconst target = \"a01-tape\";\n\nfunction client(state, actorId) {\n  return {\n    workspace: () => dispatch(state, { method: \"GET\", path: \"/api/workspace\", actorId }),\n    count: (opId, quantity, itemId = target, now = start) => dispatch(state, {\n      method: \"POST\", path: \"/api/counts\", actorId, now, body: { opId, itemId, quantity },\n    }),\n    resolve: (revision, quantity, note, itemId = target, now = start + 120_000) => dispatch(state, {\n      method: \"POST\", path: `/api/items/${itemId}/resolve`, actorId, now,\n      body: { revision, quantity, note },\n    }),\n  };\n}\n\nfunction selected(view, itemId = target) {\n  return view.body.items.find(item => item.id === itemId);\n}\n\ntest(\"the three roles share after serialization while blind counters only receive their own observations\", () => {\n  const state = JSON.parse(JSON.stringify(createWorkspace(start)));\n  const first = client(state, actors[0].id);\n  const second = client(state, actors[1].id);\n  const supervisor = client(state, actors[2].id);\n  assert.equal(first.count(\"a-23\", 23).status, 201);\n  const own = selected(first.workspace());\n  assert.equal(own.counts.length, 1);\n  assert.equal(own.counts[0].quantity, 23);\n  const before = selected(second.workspace());\n  assert.equal(before.counts.length, 0);\n  assert.equal(\"expected\" in before, false);\n  assert.equal(second.workspace().body.history.some(entry => entry.itemId === target), false);\n\n  assert.equal(second.count(\"b-24\", 24, target, start + 10).body.status, \"review\");\n  const pending = selected(supervisor.workspace());\n  assert.equal(pending.expected, 24);\n  assert.equal(pending.revision, 2);\n  assert.deepEqual(pending.counts.map(entry => entry.quantity), [23, 24]);\n  assert.equal(\"finalQuantity\" in selected(first.workspace()), false);\n  assert.equal(first.resolve(2, 25, \"越权提交。\").status, 403);\n  assert.equal(supervisor.count(\"r-no\", 44).status, 403);\n\n  const resolution = supervisor.resolve(2, 24, \"人工复点确认 24 卷。\");\n  assert.deepEqual(resolution.body, { itemId: target, revision: 3, status: \"closed\" });\n  const reviewed = selected(supervisor.workspace());\n  assert.deepEqual(reviewed.counts.map(entry => entry.quantity), [23, 24]);\n  assert.equal(reviewed.decision.note, \"人工复点确认 24 卷。\");\n  assert.equal(reviewed.decision.at, start + 120_000);\n  const blindClosed = selected(first.workspace());\n  assert.equal(blindClosed.finalQuantity, 24);\n  assert.deepEqual(blindClosed.counts.map(entry => entry.quantity), [23]);\n  assert.equal(\"decision\" in blindClosed, false);\n  assert.deepEqual(supervisor.workspace().body.history.filter(entry => entry.itemId === target).map(entry => entry.type),\n    [\"closed\", \"review\", \"counted\", \"counted\"]);\n});\n\ntest(\"replaying an offline operation returns the original receipt and adds no new count or audit event\", () => {\n  const state = createWorkspace(start);\n  const first = client(state, \"counter-a\");\n  const second = client(state, \"counter-b\");\n  const supervisor = client(state, \"reviewer\");\n  const operation = first.count(\"submit-001\", 23);\n  second.count(\"submit-002\", 24);\n  supervisor.resolve(2, 24, \"实际复点为 24 卷。\");\n  const beforeRetry = JSON.stringify(state);\n  const replay = first.count(\"submit-001\", 23, target, start + 1_000_000);\n  assert.equal(replay.status, 200);\n  assert.deepEqual(replay.body, { ...operation.body, replayed: true });\n  assert.equal(first.count(\"submit-001\", 24).body.code, \"OPERATION_CONFLICT\");\n  assert.equal(first.count(\"submit-001\", 23, \"a01-wrap\").body.code, \"OPERATION_CONFLICT\");\n  assert.equal(second.count(\"submit-001\", 23).body.code, \"OPERATION_CONFLICT\");\n  assert.equal(first.count(\"submit-003\", 24).body.code, \"ALREADY_COUNTED\");\n  assert.equal(supervisor.resolve(2, 25, \"旧页面再次复核。\").body.code, \"STALE_REVISION\");\n  assert.equal(supervisor.resolve(3, 25, \"当前结论也不能覆盖。\").body.code, \"NOT_PENDING_REVIEW\");\n  assert.equal(JSON.stringify(state), beforeRetry);\n});\n\ntest(\"zero and agreement against expected are valid, agreement against a different baseline needs review\", () => {\n  const state = createWorkspace(start);\n  const first = client(state, \"counter-a\");\n  const second = client(state, \"counter-b\");\n  const supervisor = client(state, \"reviewer\");\n  const marker = \"b01-marker\";\n  first.count(\"zero-a\", 0, marker);\n  assert.equal(second.count(\"zero-b\", 0, marker).body.status, \"agreed\");\n  assert.equal(selected(supervisor.workspace(), marker).finalQuantity, 0);\n  assert.equal(\"finalQuantity\" in selected(second.workspace(), marker), false);\n\n  first.count(\"different-a\", 30, \"a01-carton\");\n  assert.equal(second.count(\"different-b\", 30, \"a01-carton\").body.status, \"review\");\n  assert.equal(selected(supervisor.workspace(), \"a01-carton\").expected, 32);\n  const reviewedZero = supervisor.resolve(2, 0, \"该位置实际已经移空。\", \"a01-carton\");\n  assert.equal(reviewedZero.body.status, \"closed\");\n  assert.equal(selected(second.workspace(), \"a01-carton\").finalQuantity, 0);\n});\n\ntest(\"invalid and unopened actions do not mutate stored history or receipt state\", () => {\n  const state = createWorkspace(start);\n  const first = client(state, \"counter-a\");\n  const supervisor = client(state, \"reviewer\");\n  const immutable = JSON.stringify(state);\n  for (const invalid of [-1, 1.5, \"4\", Infinity, Number.MAX_SAFE_INTEGER + 1, null]) {\n    assert.equal(first.count(\"invalid-quantity\", invalid).status, 422);\n  }\n  assert.equal(first.count(\"empty item\", 3).status, 422);\n  assert.equal(first.count(\"unknown\", 3, \"definitely-missing\").status, 404);\n  assert.equal(supervisor.resolve(0, 3, \"未开始的商品。\").body.code, \"NOT_PENDING_REVIEW\");\n  assert.equal(supervisor.resolve(2, 3, \"  \", \"b01-cutter\").body.code, \"INVALID_NOTE\");\n  assert.equal(supervisor.resolve(2, 3, \"字\".repeat(501), \"b01-cutter\").body.code, \"INVALID_NOTE\");\n  assert.equal(client(state, \"unknown\").workspace().status, 401);\n  assert.equal(dispatch(state, { method: \"POST\", path: \"/api/counts\", actorId: \"counter-a\", body: null }).status, 422);\n  assert.equal(JSON.stringify(state), immutable);\n});\n\ntest(\"a workspace response cannot mutate previously accepted immutable observations\", () => {\n  const state = createWorkspace(start);\n  const first = client(state, \"counter-a\");\n  first.count(\"immutable-a\", 23);\n  const view = first.workspace();\n  selected(view).counts[0].quantity = 88;\n  view.body.locations[0].name = \"no\";\n  assert.equal(selected(first.workspace()).counts[0].quantity, 23);\n  assert.notEqual(first.workspace().body.locations[0].name, \"no\");\n});\n","group":"验收测试"},{"path":"tests/http.test.mjs","text":"import assert from \"node:assert/strict\";\nimport {spawn} from \"node:child_process\";\nimport {once} from \"node:events\";\nimport {mkdtemp, rm, rmdir} from \"node:fs/promises\";\nimport {get} from \"node:http\";\nimport {tmpdir} from \"node:os\";\nimport {join} from \"node:path\";\nimport test from \"node:test\";\n\nconst credentials = {\n  \"counter-a\":\"valid-fixture-counter-a\",\n  \"counter-b\":\"valid-fixture-counter-b\",\n  reviewer:\"valid-fixture-reviewer\",\n};\nconst directory = new URL(\"../\",import.meta.url);\n\nasync function host(t,{db=\":memory:\",team=false}={}) {\n  const env = {...process.env,\n    INVENTORY_COUNTER_A_PASSWORD:credentials[\"counter-a\"],\n    INVENTORY_COUNTER_B_PASSWORD:credentials[\"counter-b\"],\n    INVENTORY_REVIEWER_PASSWORD:credentials.reviewer,\n  };\n  const args = [\"server.mjs\",\"--port\",\"0\",\"--db\",db,...(team ? [\"--team\"] : [])];\n  const processHandle = spawn(process.execPath,args,{cwd:directory,env,stdio:[\"ignore\",\"pipe\",\"pipe\"]});\n  let output = \"\", errors = \"\";\n  processHandle.stderr.on(\"data\",message => { errors += message; });\n  const exit = once(processHandle,\"exit\");\n  const stop = async () => {\n    if (processHandle.exitCode === null && processHandle.signalCode === null) processHandle.kill();\n    await exit.catch(() => {});\n  };\n  t.after(stop);\n  const base = await new Promise((resolve,reject) => {\n    processHandle.stdout.on(\"data\",out => {\n      output += out;\n      const url = output.match(/http:\\/\\/127\\.0\\.0\\.1:\\d+\\//u);\n      if (url) resolve(url[0].slice(0,-1));\n    });\n    processHandle.on(\"error\",reject);\n    processHandle.on(\"exit\",code => reject(new Error(`Host exited (${code}) ${errors}`)));\n  });\n  return {base,stop};\n}\n\nfunction browser(base) {\n  let cookie = \"\", session;\n  return { async api(path,body,extra={}) {\n    const headers = {...(cookie ? {Cookie:cookie} : {})};\n    if (session?.workspaceId) {\n      headers[\"X-Workspace-Id\"] = session.workspaceId;\n      headers[\"X-Workspace-Actor\"] = session.actor.id;\n    }\n    if (body !== undefined) {\n      headers[\"Content-Type\"] = \"application/json\";\n      headers[\"X-Workspace-Request\"] = \"1\";\n    }\n    const response = await fetch(base+path,{\n      method:body === undefined ? \"GET\" : \"POST\",\n      body:body === undefined ? undefined : JSON.stringify(body),\n      headers:{...headers,...extra},\n    });\n    const data = await response.json();\n    const saved = response.headers.get(\"Set-Cookie\");\n    if (saved) cookie = saved.split(\";\",1)[0];\n    if (response.ok && Object.hasOwn(data,\"workspaceId\")) session = data;\n    return {body:data,status:response.status,headers:response.headers};\n  }};\n}\n\nconst readTape = workspace => workspace.items.find(item => item.id === \"a01-tape\");\nconst count = (opId,quantity) => ({opId,itemId:\"a01-tape\",quantity});\nconst decision = (revision,quantity) => ({revision,quantity,note:\"主管现场复点\"});\nconst workspace = \"/api/workspace\";\nconst resolveTape = \"/api/items/a01-tape/resolve\";\nconst pickRole = \"/api/session/role\";\n\ntest(\"demo workspace stays isolated, rejects stale identity, and replays a queued count exactly once\", {timeout:15_000}, async t => {\n  const {base} = await host(t);\n  const worker = browser(base);\n  const first = await worker.api(\"/api/session\");\n  assert.equal(first.body.actor.id,\"counter-a\");\n  assert.equal(first.body.mode,\"demo\");\n  assert.match(first.headers.get(\"Set-Cookie\"),/HttpOnly/u);\n  assert.match(first.headers.get(\"Cache-Control\"),/no-store/u);\n  const results = await Promise.all([\n    worker.api(\"/api/counts\",count(\"offline-a\",23)),\n    worker.api(\"/api/counts\",count(\"offline-a\",23)),\n  ]);\n  assert.deepEqual(results.map(result=>result.status).sort(),[200,201]);\n  assert.equal(results.find(result=>result.status === 200).body.replayed,true);\n  assert.equal((await worker.api(\"/api/counts\",count(\"offline-a\",22))).body.code,\"OPERATION_CONFLICT\");\n  assert.equal((await worker.api(resolveTape,decision(1,23))).status,403);\n\n  const switched = await worker.api(pickRole,{id:\"counter-b\"});\n  assert.equal(switched.body.workspaceId,first.body.workspaceId);\n  const stale = {\"X-Workspace-Actor\":\"counter-a\"};\n  assert.equal((await worker.api(workspace,undefined,stale)).body.code,\"SESSION_SCOPE_CHANGED\");\n  assert.equal((await worker.api(\"/api/counts\",count(\"offline-b\",24),stale)).status,409);\n  assert.deepEqual(readTape((await worker.api(workspace)).body).counts,[]);\n  assert.equal((await worker.api(\"/api/counts\",count(\"offline-b\",24))).body.status,\"review\");\n  await worker.api(pickRole,{id:\"reviewer\"});\n  const before = readTape((await worker.api(workspace)).body);\n  assert.deepEqual(before.counts.map(entry=>entry.quantity),[23,24]);\n  assert.equal((await worker.api(resolveTape,decision(1,24))).body.code,\"STALE_REVISION\");\n  assert.equal((await worker.api(resolveTape,decision(before.revision,24))).body.status,\"closed\");\n\n  const fresh = browser(base);\n  const independent = await fresh.api(\"/api/session\");\n  assert.notEqual(independent.body.workspaceId,first.body.workspaceId);\n  assert.deepEqual(readTape((await fresh.api(workspace)).body).counts,[]);\n  const misdirected = await new Promise((resolve,reject) => {\n    get(base+\"/api/session\",{headers:{Host:\"untrusted.example\"}},response => {\n      response.resume();\n      resolve(response.statusCode);\n    }).on(\"error\",reject);\n  });\n  assert.equal(misdirected,400);\n  assert.equal((await worker.api(workspace,undefined,{Origin:\"https://invalid.example\"})).status,403);\n  assert.equal((await worker.api(\"/api/counts\",count(\"too-large\",2),{\"X-Workspace-Request\":\"0\"})).status,403);\n  assert.equal((await worker.api(\"/api/counts\",{...count(\"too-large\",2),extra:\"A\".repeat(25*1024)})).status,413);\n  assert.equal((await fetch(base+\"/domain.mjs\")).status,404);\n});\n\ntest(\"team sessions authenticate separately, share count progress, and keep the scope across server restarts\", {timeout:15_000}, async t => {\n  const temp = await mkdtemp(join(tmpdir(),\"inventory-http-\"));\n  const db = join(temp,\"trial.sqlite\");\n  let service;\n  try {\n    service = await host(t,{db,team:true});\n    const user = browser(service.base), other = browser(service.base);\n    const login = (client,id) => client.api(\"/api/login\",{id,password:credentials[id]});\n    assert.equal((await user.api(\"/api/session\")).body.actor,null);\n    assert.equal((await user.api(workspace)).status,401);\n    assert.equal((await user.api(\"/api/login\",{id:\"counter-a\",password:\"incorrect\"})).status,401);\n    const account = await login(user,\"counter-a\");\n    assert.equal(account.body.mode,\"team\");\n    assert.deepEqual(account.body.actors,[]);\n    const scope = account.body.workspaceId;\n    assert.equal((await user.api(pickRole,{id:\"reviewer\"})).status,403);\n    assert.equal((await user.api(\"/api/counts\",count(\"team-a\",0))).status,201);\n    assert.equal((await login(other,\"counter-b\")).body.workspaceId,scope);\n    assert.equal((await other.api(\"/api/counts\",count(\"team-b\",24))).body.status,\"review\");\n    assert.equal((await user.api(\"/api/logout\",{})).status,200);\n    assert.equal((await user.api(workspace)).status,401);\n    await service.stop();\n\n    service = await host(t,{db,team:true});\n    const manager = browser(service.base);\n    assert.equal((await login(manager,\"reviewer\")).body.workspaceId,scope);\n    const pending = readTape((await manager.api(workspace)).body);\n    assert.equal(pending.status,\"review\");\n    assert.deepEqual(pending.counts.map(entry => entry.quantity),[0,24]);\n    assert.equal((await manager.api(resolveTape,decision(pending.revision,24))).body.status,\"closed\");\n  } finally {\n    if (service) await service.stop();\n    for (const filename of [db,db+\"-shm\",db+\"-wal\"]) await rm(filename,{force:true});\n    await rmdir(temp);\n  }\n});\n","group":"验收测试"}],"defaultFile":"domain.mjs"}</script>
