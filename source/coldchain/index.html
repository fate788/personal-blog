order-top: 1px solid var(--line); }\n  .observations { gap: 12px; }\n  .panel-heading { padding: 13px 11px 9px; }\n  .panel-heading h2 { font-size: 15px; }\n  .panel-heading p { font-size: 11px; }\n  .chart-legend { gap: 4px 7px; max-width: 122px; font-size: 9px; }\n  .stats { margin-inline: 11px; }\n  .stat { padding: 7px 5px; }\n  .stat p { font-size: 9px; }\n  .chart-wrap { padding-inline: 5px 9px; }\n  #telemetry-chart { height: 172px; }\n  .playback { margin-inline: 11px; margin-bottom: 11px; }\n  .button-group { gap: 3px; }\n  .button { padding-inline: 6px; }\n  .route-list { padding-inline: 10px; }\n  .route-item { flex: auto; }\n  .route-link span { display: grid; grid-template-columns: minmax(0, 1fr) auto; }\n  .incident-list { padding-inline: 11px; }\n  .incident-empty { margin-inline: 11px; }\n  .incident-detail { grid-template-columns: minmax(0, 1fr); padding: 12px 11px; gap: 12px; }\n  .handoff { padding: 10px 0 0; border-left: 0; border-top: 1px solid var(--line); }\n  .raw-data summary { padding-inline: 11px; }\n}\n","group":"前端"},{"path":"static/transport.mjs","text":"export const executionMode = \"http\";\n\nasync function request(path, { origin = \"\", signal, method = \"GET\", input } = {}) {\n  if (origin && !/^http:\\/\\/(?:127\\.0\\.0\\.1|localhost):\\d{1,5}$/u.test(origin)) {\n    throw new Error(\"本机样例服务地址无效。\");\n  }\n  const body = input === undefined ? undefined : JSON.stringify(input);\n  const response = await fetch(`${origin}/api/${path}`, {\n    method,\n    body,\n    headers: body === undefined ? undefined : { \"Content-Type\": \"application/json\" },\n    cache: \"no-store\",\n    redirect: \"error\",\n    signal: signal ?? AbortSignal.timeout(12000)\n  });\n  const payload = await response.json();\n  if (!response.ok) {\n    throw Object.assign(new Error(payload.message || \"样例服务暂时不可用。\"), { code: payload.code });\n  }\n  return payload;\n}\n\nexport function loadWorkspace(options) {\n  return request(\"workspace\", options);\n}\n\nexport function saveHandoff(input, options) {\n  return request(\"handoffs\", { ...options, method: \"POST\", input });\n}\n","group":"前端"},{"path":"tests/domain.test.mjs","text":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { createHandoff, normalizeSamples, projectTrip } from '../domain.mjs';\nimport { TRIPS } from '../fixtures.mjs';\n\nconst [excursionTrip, normalTrip, gapTrip] = TRIPS;\nconst localAt = (date, time) => new Date(`${date}T${time}:00+08:00`).toISOString();\nconst on27 = time => localAt('2026-11-27', time);\nconst on26 = time => localAt('2026-11-26', time);\n\ntest('an excursion appears after the configured observed span and retains its ID through recovery', () => {\n  assert.equal(projectTrip(excursionTrip, { cursorAt: on27('08:54') }).incidents.length, 0);\n  const active = projectTrip(excursionTrip, { cursorAt: on27('08:55') }).incidents[0];\n  assert.equal(active.status, 'active');\n  assert.equal(active.durationMinutes, 15);\n  assert.equal(active.endAt, on27('08:55'));\n\n  const final = projectTrip(excursionTrip);\n  const [incident] = final.incidents;\n  assert.equal(final.incidents.length, 1);\n  assert.equal(final.stats.readingCount, 22);\n  assert.equal(final.stats.coveragePercent, 100);\n  assert.equal(incident.id, active.id);\n  assert.equal(incident.direction, 'high');\n  assert.equal(incident.status, 'closed');\n  assert.equal(incident.durationMinutes, 25);\n  assert.equal(incident.startAt, on27('08:40'));\n  assert.equal(incident.endAt, on27('09:05'));\n  assert.equal(incident.resolvedAt, on27('09:10'));\n  assert.equal(incident.maxC, 10.8);\n  assert.ok(final.events.some(event => event.type === 'door-open' && event.at === on27('08:40')));\n});\n\ntest('a clean route projects every reading and reports no incident', () => {\n  const clean = projectTrip(normalTrip);\n  assert.equal(clean.progress, 1);\n  assert.equal(clean.currentLandmark.label, normalTrip.destination);\n  assert.deepEqual(clean.incidents, []);\n  assert.equal(clean.stats.readingCount, 17);\n  assert.equal(clean.stats.lastTempC, 5.2);\n});\n\ntest('gaps open when a reading is due, hide current temperature and close with an actual observation', () => {\n  assert.equal(projectTrip(gapTrip, { cursorAt: on26('13:29') }).gaps.length, 0);\n  const missing = projectTrip(gapTrip, { cursorAt: on26('13:30') });\n  assert.equal(missing.gaps[0].durationMinutes, 0);\n  assert.equal(missing.gaps[0].missingCount, 1);\n  assert.equal(missing.gaps[0].status, 'active');\n  assert.equal(missing.stats.currentTempC, null);\n  assert.equal(missing.stats.lastTempC, 5.8);\n  assert.equal(missing.stats.lastAt, on26('13:25'));\n\n  const recovered = projectTrip(gapTrip, { cursorAt: on26('13:55') });\n  const [gap] = recovered.incidents;\n  assert.equal(gap.id, missing.incidents[0].id);\n  assert.equal(gap.type, 'gap');\n  assert.equal(gap.status, 'closed');\n  assert.equal(gap.durationMinutes, 25);\n  assert.equal(gap.missingCount, 5);\n  assert.equal(gap.maxC, null);\n  assert.equal(gap.minC, null);\n  assert.equal(gap.resolvedAt, on26('13:55'));\n  assert.equal(recovered.stats.currentTempC, 6.3);\n  assert.equal(projectTrip(gapTrip).stats.coveragePercent, 75);\n});\n\ntest('the control range includes both edges and a gap separates repeated high runs', () => {\n  const rangeEdge = { ...normalTrip, samples: normalTrip.samples.map((sample, index) => ({ ...sample, tempC: index % 2 ? 2 : 8 })) };\n  assert.equal(projectTrip(rangeEdge).incidents.length, 0);\n\n  const highWithGap = {\n    ...gapTrip,\n    samples: gapTrip.samples.map((sample, index) => ({ ...sample, tempC: index \u003c= 8 ? 10 : sample.tempC })),\n  };\n  const [high, gap] = projectTrip(highWithGap).incidents;\n  assert.equal(projectTrip(highWithGap).incidents.length, 2);\n  assert.equal(high.type, 'excursion');\n  assert.equal(high.endAt, on26('13:25'));\n  assert.equal(high.resolvedAt, gap.startAt);\n  assert.equal(high.durationMinutes, 25);\n  assert.equal(gap.type, 'gap');\n});\n\ntest('a low-temperature run follows the lower policy edge and keeps its own extreme', () => {\n  const lowTrip = {\n    ...normalTrip,\n    samples: normalTrip.samples.map((sample, index) => ({ ...sample, tempC: [1.9, 1.4, 1.1, 1.8][index] ?? sample.tempC })),\n  };\n  const [low] = projectTrip(lowTrip).incidents;\n  assert.equal(low.direction, 'low');\n  assert.equal(low.limit, 2);\n  assert.equal(low.minC, 1.1);\n  assert.equal(low.durationMinutes, 15);\n});\n\ntest('normalization supports out-of-order retries and reconciles conflicting duplicate records deterministically', () => {\n  const [a, b, c] = normalTrip.samples;\n  const noisy = [c, { ...a, at: b.at }, { ...a, doorOpen: null }, b, a, c, { ...b, id: 'zz-conflict', tempC: 100 }, { ...c, id: 'bad', tempC: null }];\n  const expected = [a, b, c].map(reading => reading.id === a.id ? { ...reading, doorOpen: null } : reading);\n  assert.deepEqual(normalizeSamples(noisy, normalTrip), expected);\n  assert.deepEqual(normalizeSamples(noisy.toReversed(), normalTrip), expected);\n  assert.equal(projectTrip({ ...normalTrip, samples: noisy }).stats.readingCount, 3);\n});\n\ntest('handoff requires a supported decision and note and projects back onto its incident', () => {\n  const [incident] = projectTrip(excursionTrip).incidents;\n  const action = 'hold-for-review';\n  const at = on27('09:55');\n  assert.throws(() => createHandoff(incident, { action, note: ' ', at }), /交接说明/);\n  assert.throws(() => createHandoff(incident, { action, note: '多'.repeat(241), at }), /交接说明/);\n  assert.throws(() => createHandoff(incident, { action: 'other', note: '复核', at }), /处置方式/);\n  assert.throws(() => createHandoff(incident, { action, note: '复核' }), /交接时间/);\n  const handoff = createHandoff(incident, { action, note: '  到货复测后确认。 ', at });\n  assert.deepEqual(handoff, { incidentId: incident.id, action, note: '到货复测后确认。', at });\n  assert.deepEqual(projectTrip(excursionTrip, { handoffs: { [incident.id]: handoff } }).incidents[0].handoff, handoff);\n});\n","group":"验收测试"},{"path":"tests/http.test.mjs","text":"import assert from \"node:assert/strict\";\nimport { once } from \"node:events\";\nimport { mkdtemp, rm } from \"node:fs/promises\";\nimport { tmpdir } from \"node:os\";\nimport { join } from \"node:path\";\nimport { test } from \"node:test\";\nimport { projectTrip } from \"../domain.mjs\";\nimport { TRIPS } from \"../fixtures.mjs\";\nimport { createEmbeddedTransport } from \"../portable/transport.mjs\";\nimport { startServer } from \"../server.mjs\";\nimport { loadWorkspace, saveHandoff } from \"../static/transport.mjs\";\n\nconst firstTime = \"2026-11-28T04:00:00.000Z\";\nconst laterTime = \"2026-11-28T05:00:00.000Z\";\nconst sample = TRIPS.find(trip => trip.scenario === \"excursion\");\nconst incident = projectTrip(sample).incidents[0];\nconst input = {\n  tripId: sample.id,\n  incidentId: incident.id,\n  action: \"inspect-on-arrival\",\n  note: \"  收货时核对温度与中转记录。  \",\n  operationId: \"operation-001\"\n};\n\nasync function start(options) {\n  const server = startServer({ port: 0, dbPath: \":memory:\", clock: () => firstTime, ...options });\n  await once(server, \"listening\");\n  return {\n    origin: `http://127.0.0.1:${server.address().port}`,\n    stop: () => new Promise((resolve, reject) => server.close(error => error ? reject(error) : resolve()))\n  };\n}\n\nfunction post(origin, value, headers = {}) {\n  return fetch(`${origin}/api/handoffs`, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", ...headers },\n    body: JSON.stringify(value)\n  });\n}\n\ntest(\"workspace serves fixture telemetry read-only and creates one handoff across simultaneous retries\", async t => {\n  const { origin, stop } = await start();\n  t.after(stop);\n  const workspace = await loadWorkspace({ origin });\n  assert.deepEqual(workspace, { trips: TRIPS, handoffs: {} });\n  const cannotRewrite = await fetch(`${origin}/api/workspace`, { method: \"POST\", body: \"{}\" });\n  assert.equal(cannotRewrite.status, 405);\n  assert.equal(cannotRewrite.headers.get(\"Allow\"), \"GET, HEAD\");\n\n  const writes = await Promise.all([post(origin, input), post(origin, input)]);\n  assert.deepEqual(writes.map(response => response.status).sort(), [200, 201]);\n  const [created, replay] = await Promise.all(writes.toSorted((a, b) => b.status - a.status)\n    .map(response => response.json()));\n  assert.deepEqual(created, { handoff: { ...input, note: input.note.trim(), at: firstTime }, replayed: false });\n  assert.deepEqual(replay, { handoff: created.handoff, replayed: true });\n  assert.deepEqual(await loadWorkspace({ origin }), {\n    trips: workspace.trips,\n    handoffs: { [incident.id]: created.handoff }\n  });\n\n  await assert.rejects(saveHandoff({ ...input, note: \"其他处置\" }, { origin }), { code: \"operation_conflict\" });\n  await assert.rejects(saveHandoff({ ...input, operationId: \"operation-002\" }, { origin }), { code: \"incident_already_recorded\" });\n});\n\ntest(\"sample-only handoff API rejects invalid JSON, unknown evidence and cross-origin writes\", async t => {\n  const { origin, stop } = await start();\n  t.after(stop);\n  const invalidCases = [\n    [input, { Origin: \"https://foreign.example\" }, 403, \"origin_mismatch\"],\n    [input, { \"Sec-Fetch-Site\": \"cross-site\" }, 403, \"origin_mismatch\"],\n    [input, { \"Content-Type\": \"text/plain\" }, 415, \"invalid_content_type\"],\n    [{ ...input, note: \"长\".repeat(2000) }, {}, 413, \"body_too_large\"],\n    [{ ...input, tripId: \"unknown\" }, {}, 404, \"unknown_trip\"],\n    [{ ...input, incidentId: \"unknown\" }, {}, 404, \"unknown_incident\"],\n    [{ ...input, action: \"unknown\" }, {}, 422, \"invalid_handoff\"],\n    [{ ...input, operationId: \"x\" }, {}, 400, \"invalid_operation_id\"],\n    [{ ...input, note: \" \" }, {}, 422, \"invalid_handoff\"]\n  ];\n  for (const [value, headers, status, code] of invalidCases) {\n    const response = await post(origin, value, headers);\n    assert.equal(response.status, status);\n    assert.equal((await response.json()).code, code);\n  }\n  const malformed = await fetch(`${origin}/api/handoffs`, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: \"{\"\n  });\n  assert.equal(malformed.status, 400);\n  assert.equal((await malformed.json()).code, \"invalid_json\");\n  assert.deepEqual((await loadWorkspace({ origin })).handoffs, {});\n});\n\ntest(\"SQLite retains the original disposition and operation across restarts\", async () => {\n  const directory = await mkdtemp(join(tmpdir(), \"coldchain-trace-\"));\n  const dbPath = join(directory, \"handoffs.sqlite\");\n  try {\n    const first = await start({ dbPath });\n    let saved;\n    try {\n      saved = await saveHandoff({ ...input, at: laterTime }, { origin: first.origin });\n      assert.equal(saved.handoff.at, firstTime);\n    } finally {\n      await first.stop();\n    }\n    const next = await start({ dbPath, clock: () => laterTime });\n    try {\n      assert.deepEqual((await loadWorkspace({ origin: next.origin })).handoffs[incident.id], saved.handoff);\n      const retry = await saveHandoff({ ...input, note: input.note.trim() }, { origin: next.origin });\n      assert.deepEqual(retry, { handoff: saved.handoff, replayed: true });\n    } finally {\n      await next.stop();\n    }\n  } finally {\n    await rm(directory, { recursive: true, force: true });\n  }\n});\n\ntest(\"embedded edition validates and reloads handoffs from browser storage without mutating fixtures\", async () => {\n  const values = new Map();\n  const storage = {\n    getItem: key => values.get(key) ?? null,\n    setItem: (key, value) => values.set(key, value)\n  };\n  const first = createEmbeddedTransport({ storage, clock: () => firstTime });\n  const original = await first.loadWorkspace();\n  original.trips[0].samples[0].tempC = -100;\n  assert.deepEqual((await first.loadWorkspace()).trips, TRIPS);\n\n  const saved = await first.saveHandoff(input);\n  const later = createEmbeddedTransport({ storage, clock: () => laterTime });\n  assert.deepEqual((await later.loadWorkspace()).handoffs[incident.id], saved.handoff);\n  assert.deepEqual(await later.saveHandoff(input), { handoff: saved.handoff, replayed: true });\n  await assert.rejects(later.saveHandoff({ ...input, note: \"其他处置\" }), { code: \"operation_conflict\" });\n  await assert.rejects(later.saveHandoff({ ...input, operationId: \"operation-002\" }), { code: \"incident_already_recorded\" });\n  await assert.rejects(later.saveHandoff({ ...input, note: \"\" }), { code: \"invalid_handoff\" });\n});\n","group":"验收测试"}],"defaultFile":"domain.mjs"}</script>
