<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify coldchain trace\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build:demo\n","group":"配置与启动"},{"path":".gitignore","text":"node_modules/\ndist/\ndata/\n*.sqlite*\n*.log\n.DS_Store\nThumbs.db\n","group":"配置与启动"},{"path":"README.md","text":"# 冷链运输追溯台\n\n面向食品冷链调度的遥测回放演练。选择一趟运输，按时间回看车厢温度和经停记录，区分持续越限与传感器断报。打开异常证据可以核对原始采样，并把复核行动和说明交接给下一班。\n\n[打开调度工作台](https://fate788.github.io/personal-blog/demos/coldchain/index.html?v=1.0) · [博客作品页](https://fate788.github.io/personal-blog/projects/coldchain/index.html)\n\n![冷链运输追溯台实屏](docs/preview.webp)\n\n## 体验流程\n\n1. 选择有温度异常的车次，拖动回放时间，查看越限从哪一条采样开始、达到何时才满足持续时长。\n2. 切到传感器断报车次，检查缺口两侧的采样与恢复时间。缺口期间没有读数，折线在缺口处断开。\n3. 从异常证据填写处置动作和交接说明。刷新后可恢复交接，理由和事件证据都能查回。\n4. 展开「原始采样记录」，导出回放时间内已经收到的原始读数，供后续核对。\n\n## 运行\n\n需要 Node.js 22.13 或以上，无需安装依赖。Windows 可以双击 `start-coldchain.cmd`，也可在项目目录运行：\n\n```sh\nnode server.mjs\nnpm test\nnpm run build:demo\n```\n\n本机监听 [127.0.0.1:8830](http://127.0.0.1:8830/)。通过 HTTP 读取预设的车辆遥测数据，并把交接写入 SQLite。公开体验使用相同的回放和判断逻辑，交接保存在当前浏览器。便携版本位于 `dist/index.html`，与同目录下的 `media` 一起保留即可离线打开。\n\n## 数据口径\n\n3 趟车都是合成样例。样例每 5 分钟期望收到一次遥测，温度区间设为 2–8 ℃，连续收到的首末两条越限样本跨度至少 15 分钟时才生成异常。场景温度与时长规则用于演练。持续时长来自实际可见采样，不能推断更细时间点或断报期间的温度。运输节点和开门记录用于复核上下文。图库展示的是生成的仓配场景。\n\n设计参考了 GS1 对追溯事件时间、地点、业务上下文和传感器读数的组织方式。 [GS1 EPCIS 介绍](https://www.gs1.org/standards/epcis) · [GS1 传感器报告场景](https://ref.gs1.org/standards/cbv/2.0.0/)\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 冷链运输追溯台 v1.0 源码包\n\n原始发布归档为 `冷链运输追溯台-v1.0.zip`。压缩包保留其中 16 份文本文件的原始路径与字节，本文件为导出说明。\n\n需要 Node.js 22.13 或以上。运行 node server.mjs 或双击 start-coldchain.cmd；npm test 复跑验收。\n","group":"项目说明"},{"path":"domain.mjs","text":"const MINUTE = 60_000;\n\nexport const HANDOFF_ACTIONS = Object.freeze([\n  { id: 'hold-for-review', label: '暂扣复核' },\n  { id: 'inspect-on-arrival', label: '到货核验' },\n  { id: 'recover-telemetry', label: '补录设备数据' },\n]);\n\nfunction iso(time) {\n  return new Date(time).toISOString();\n}\n\nfunction minutesBetween(start, end) {\n  return Math.round((end - start) / MINUTE * 10) / 10;\n}\n\nfunction compareText(a, b) {\n  return a === b ? 0 : a \u003c b ? -1 : 1;\n}\n\nfunction compareReadings(a, b) {\n  return compareText(a.at, b.at) || compareText(a.id, b.id) || a.tempC - b.tempC\n    || compareText(a.zone, b.zone) || (a.doorOpen ?? -1) - (b.doorOpen ?? -1);\n}\n\nexport function normalizeSamples(samples, { startAt, endAt }) {\n  const start = Date.parse(startAt);\n  const end = Date.parse(endAt);\n  const ordered = samples.flatMap(sample => {\n    if (!sample || typeof sample.id !== 'string' || !sample.id || !Number.isFinite(sample.tempC)) return [];\n    const time = Date.parse(sample.at);\n    if (!Number.isFinite(time) || time \u003c start || time > end) return [];\n    return [{\n      id: sample.id,\n      at: iso(time),\n      tempC: sample.tempC,\n      zone: typeof sample.zone === 'string' ? sample.zone : '',\n      doorOpen: typeof sample.doorOpen === 'boolean' ? sample.doorOpen : null,\n    }];\n  }).sort(compareReadings);\n\n  // Repeated IDs or timestamps represent one reading. A stable ordering also resolves conflicting copies.\n  const seenIds = new Set();\n  const seenTimes = new Set();\n  return ordered.filter(sample => {\n    if (seenIds.has(sample.id)) return false;\n    seenIds.add(sample.id);\n    if (seenTimes.has(sample.at)) return false;\n    seenTimes.add(sample.at);\n    return true;\n  });\n}\n\nfunction gapFor(trip, landmarks, firstMissing, until, interval, previous, recovery) {\n  const startAt = iso(firstMissing);\n  const endAt = iso(until);\n  const durationMinutes = minutesBetween(firstMissing, until);\n  const missingCount = recovery\n    ? Math.ceil((until - firstMissing) / interval)\n    : Math.floor((until - firstMissing) / interval) + 1;\n  const zone = landmarks.findLast(landmark => landmark.at \u003c= startAt)?.zone ?? previous?.zone ?? '';\n  const evidence = [{ at: startAt, label: '该采样时刻起无遥测记录' }];\n  if (previous) evidence.unshift({ at: previous.at, label: `缺口前最后读数 ${previous.tempC} ℃` });\n  if (recovery) evidence.push({ at: recovery.at, label: `恢复上报，观测 ${recovery.tempC} ℃` });\n  return {\n    id: `${trip.id}:gap:${startAt}`,\n    type: 'gap',\n    title: '遥测数据中断',\n    startAt, endAt, durationMinutes, missingCount, zone, evidence,\n    status: recovery ? 'closed' : 'active',\n    resolvedAt: recovery?.at ?? null,\n    minC: null,\n    maxC: null,\n    limit: null,\n    lastKnownAt: previous?.at ?? null,\n    cause: '设备遥测缺失，缺口内温度未知',\n  };\n}\n\nfunction findGaps(trip, landmarks, samples, cursor, interval) {\n  const gaps = [];\n  let previous;\n  let expectedAt = Date.parse(trip.startAt);\n  for (const sample of samples) {\n    const time = Date.parse(sample.at);\n    if (time > expectedAt) gaps.push(gapFor(trip, landmarks, expectedAt, time, interval, previous, sample));\n    previous = sample;\n    expectedAt = time + interval;\n  }\n  if (cursor >= expectedAt) gaps.push(gapFor(trip, landmarks, expectedAt, cursor, interval, previous));\n  return gaps;\n}\n\nfunction readingExtremes(samples) {\n  let min;\n  let max;\n  for (const sample of samples) {\n    if (!min || sample.tempC \u003c min.tempC) min = sample;\n    if (!max || sample.tempC > max.tempC) max = sample;\n  }\n  return { min, max };\n}\n\nfunction excursionFor(trip, run, direction, gap, nextReading) {\n  const first = run[0];\n  const last = run.at(-1);\n  const durationMinutes = minutesBetween(Date.parse(first.at), Date.parse(last.at));\n  if (Date.parse(last.at) - Date.parse(first.at) \u003c trip.policy.minExcursionMinutes * MINUTE) return null;\n  const { min, max } = readingExtremes(run);\n  const isHigh = direction === 'high';\n  const extreme = isHigh ? max : min;\n  const limit = isHigh ? trip.policy.maxC : trip.policy.minC;\n  const evidence = [{ at: first.at, label: `首次${isHigh ? '超过上限' : '低于下限'}，观测 ${first.tempC} ℃` }];\n  if (extreme !== first && extreme !== last) evidence.push({ at: extreme.at, label: `此段观测${isHigh ? '最高' : '最低'} ${extreme.tempC} ℃` });\n  if (last !== first) evidence.push({ at: last.at, label: `此段末次超限读数 ${last.tempC} ℃` });\n  if (gap) evidence.push({ at: gap.startAt, label: '随后出现采样缺口，超限时长计算截至末次读数' });\n  if (!gap && nextReading) evidence.push({ at: nextReading.at, label: `收到后续读数 ${nextReading.tempC} ℃，结束此段超限记录` });\n  const resolvedAt = gap?.startAt ?? nextReading?.at ?? null;\n  return {\n    id: `${trip.id}:excursion:${first.at}`,\n    type: 'excursion',\n    title: isHigh ? '温度超过上限' : '温度低于下限',\n    direction,\n    startAt: first.at,\n    endAt: last.at,\n    durationMinutes,\n    minC: min.tempC,\n    maxC: max.tempC,\n    limit,\n    status: resolvedAt ? 'closed' : 'active',\n    resolvedAt,\n    zone: first.zone,\n    evidence,\n    cause: `连续采样的读数${isHigh ? '高于' : '低于'} ${limit} ℃，首末观测跨度达到 ${trip.policy.minExcursionMinutes} 分钟`,\n  };\n}\n\nfunction findExcursions(trip, samples, gaps, interval) {\n  const gapsAfter = new Map(gaps.map(gap => [gap.lastKnownAt, gap]));\n  const incidents = [];\n  let run = [];\n  let direction;\n\n  function finishRun(gap, nextReading) {\n    if (run.length === 0) return;\n    const incident = excursionFor(trip, run, direction, gap, nextReading);\n    if (incident) incidents.push(incident);\n    run = [];\n  }\n\n  for (const sample of samples) {\n    const previous = run.at(-1);\n    const nextDirection = sample.tempC > trip.policy.maxC ? 'high'\n      : sample.tempC \u003c trip.policy.minC ? 'low' : null;\n    if (previous && Date.parse(sample.at) - Date.parse(previous.at) > interval) {\n      finishRun(gapsAfter.get(previous.at));\n    } else if (nextDirection !== direction) {\n      finishRun(null, sample);\n    }\n    if (nextDirection) run.push(sample);\n    direction = nextDirection;\n  }\n  finishRun(gapsAfter.get(run.at(-1)?.at));\n  return incidents;\n}\n\nfunction findEvents(landmarks, samples, interval) {\n  const events = landmarks.map((landmark, index) => ({ ...landmark, id: `landmark-${index}`, type: 'landmark' }));\n  let previous;\n  for (const sample of samples) {\n    const contiguous = previous && Date.parse(sample.at) - Date.parse(previous.at) \u003c= interval;\n    const priorDoor = contiguous ? previous.doorOpen : null;\n    const doorOpened = sample.doorOpen === true && priorDoor !== true;\n    const doorClosed = sample.doorOpen === false && priorDoor === true;\n    if (doorOpened || doorClosed) {\n      events.push({\n        id: `door-${sample.id}`,\n        type: doorOpened ? 'door-open' : 'door-closed',\n        at: sample.at,\n        label: doorOpened ? '检测到车厢门打开' : '检测到车厢门关闭',\n        zone: sample.zone,\n      });\n    }\n    previous = sample;\n  }\n  return events.sort((a, b) => compareText(a.at, b.at));\n}\n\nexport function projectTrip(trip, { cursorAt, handoffs = {} } = {}) {\n  const start = Date.parse(trip.startAt);\n  const end = Date.parse(trip.endAt);\n  const interval = trip.intervalMinutes * MINUTE;\n  const { minC, maxC, minExcursionMinutes } = trip.policy;\n  if (!Number.isFinite(start) || !Number.isFinite(end) || end \u003c start || !Number.isFinite(interval) || interval \u003c= 0\n    || ![minC, maxC, minExcursionMinutes].every(Number.isFinite) || minC > maxC || minExcursionMinutes \u003c= 0) {\n    throw new Error('行程起止时间或监测规则无效');\n  }\n\n  const requested = typeof cursorAt === 'number' ? cursorAt : Date.parse(cursorAt);\n  const cursor = Number.isFinite(requested) ? Math.min(end, Math.max(start, requested)) : end;\n  const timestamp = iso(cursor);\n  const samples = normalizeSamples(trip.samples, trip).filter(sample => sample.at \u003c= timestamp);\n  const landmarks = trip.landmarks.map(landmark => ({ ...landmark, at: iso(Date.parse(landmark.at)) }))\n    .filter(landmark => landmark.at \u003c= timestamp).sort((a, b) => compareText(a.at, b.at));\n  const gaps = findGaps(trip, landmarks, samples, cursor, interval);\n  const incidents = [...findExcursions(trip, samples, gaps, interval), ...gaps]\n    .sort((a, b) => compareText(a.startAt, b.startAt)).map(incident => ({\n      ...incident,\n      handoff: Object.hasOwn(handoffs, incident.id) ? handoffs[incident.id] : null,\n    }));\n  const events = findEvents(landmarks, samples, interval);\n  const { min, max } = readingExtremes(samples);\n  const lastSample = samples.at(-1) ?? null;\n  const expectedReadings = Math.floor((cursor - start) / interval) + 1;\n  const doorEvents = events.filter(event => event.type === 'door-open');\n  const activeGap = gaps.at(-1)?.status === 'active';\n  return {\n    trip,\n    cursorAt: timestamp,\n    samples,\n    gaps,\n    incidents,\n    events,\n    currentLandmark: landmarks.at(-1) ?? null,\n    progress: end === start ? 1 : (cursor - start) / (end - start),\n    stats: {\n      readingCount: samples.length,\n      expectedReadings,\n      gapCount: gaps.length,\n      incidentCount: incidents.length,\n      minC: min?.tempC ?? null,\n      maxC: max?.tempC ?? null,\n      lastTempC: lastSample?.tempC ?? null,\n      currentTempC: activeGap ? null : lastSample?.tempC ?? null,\n      lastAt: lastSample?.at ?? null,\n      lastSample,\n      coveragePercent: Math.min(100, Math.round(samples.length / expectedReadings * 1_000) / 10),\n      doorOpenCount: doorEvents.length,\n      lastDoorOpen: doorEvents.at(-1) ?? null,\n    },\n  };\n}\n\nexport function createHandoff(incident, { action, note, at } = {}) {\n  if (!incident?.id) throw new Error('请选择一条异常记录');\n  if (!HANDOFF_ACTIONS.some(option => option.id === action)) throw new Error('请选择有效的处置方式');\n  const cleanNote = typeof note === 'string' ? note.trim() : '';\n  if (!cleanNote || Array.from(cleanNote).length > 240) throw new Error('交接说明需填写 1–240 个字');\n  const time = typeof at === 'number' ? at : Date.parse(at);\n  if (!Number.isFinite(time)) throw new Error('交接时间无效');\n  return { incidentId: incident.id, action, note: cleanNote, at: iso(time) };\n}\n","group":"后端"},{"path":"fixtures.mjs","text":"const policy = Object.freeze({ minC: 2, maxC: 8, minExcursionMinutes: 15 });\n\nfunction at(date, hours, minutes) {\n  return new Date(`${date}T${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:00+08:00`).toISOString();\n}\n\nfunction makeTrip({ id, name, scenario, date, hour, origin, destination, shipment, vehicle, subtitle, estimate, temperatures, landmarks, doors = [] }) {\n  const intervalMinutes = 5;\n  const finalMinute = (temperatures.length - 1) * intervalMinutes;\n  const timeAt = minute => at(date, hour + Math.floor(minute / 60), minute % 60);\n  const waypoints = landmarks.map(([minute, label, zone]) => ({ at: timeAt(minute), label, zone }));\n  const samples = temperatures.flatMap((tempC, index) => {\n    if (tempC === null) return [];\n    const minute = index * intervalMinutes;\n    const timestamp = timeAt(minute);\n    return [{\n      id: `${id}-reading-${String(index).padStart(3, '0')}`,\n      at: timestamp,\n      tempC,\n      zone: waypoints.findLast(waypoint => waypoint.at \u003c= timestamp).zone,\n      doorOpen: doors.some(([openAt, closeAt]) => minute >= openAt && minute \u003c closeAt),\n    }];\n  });\n  return {\n    id, name, scenario, shipment, vehicle, origin, destination, subtitle, estimate,\n    startAt: timeAt(0),\n    endAt: timeAt(finalMinute),\n    intervalMinutes,\n    policy,\n    landmarks: waypoints,\n    samples,\n  };\n}\n\nexport const TRIPS = [\n  makeTrip({\n    id: 'cc-1028',\n    name: '滨江门店补货',\n    scenario: 'excursion',\n    date: '2026-11-27',\n    hour: 8,\n    origin: '东湖中央冷库',\n    destination: '滨江门店集配点',\n    shipment: '低温酸奶 · 36 箱',\n    vehicle: '冷藏车 C-17',\n    subtitle: '冷藏乳品 · 同城配送',\n    estimate: { distanceKm: 42, carrier: '东湖冷链车队' },\n    temperatures: [4.2, 4.1, 4.3, 4.2, 4.4, 4.7, 5.5, 6.8, 8.4, 9.5, 10.3, 10.8, 10.1, 8.7, 7.6, 6.5, 5.8, 5.2, 4.9, 4.8, 4.7, 4.8],\n    landmarks: [\n      [0, '东湖中央冷库', '装车月台'],\n      [20, '驶离冷库', '第一段运输'],\n      [40, '北湾中转站', '临时中转月台'],\n      [55, '离开中转站', '第二段运输'],\n      [90, '滨江门店集配点', '到货交接区'],\n    ],\n    doors: [[0, 5], [40, 50], [90, 95]],\n  }),\n  makeTrip({\n    id: 'cc-1027',\n    name: '南桥商超早餐配送',\n    scenario: 'normal',\n    date: '2026-11-27',\n    hour: 6,\n    origin: '西桥分拨库',\n    destination: '南桥商超配送口',\n    shipment: '盒装鲜奶 · 24 箱',\n    vehicle: '冷藏车 C-08',\n    subtitle: '冷藏乳品 · 早班配送',\n    estimate: { distanceKm: 28, carrier: '西桥冷链车队' },\n    temperatures: [4.4, 4.6, 4.7, 4.9, 4.5, 4.3, 4.2, 4.6, 4.8, 5.1, 5.7, 5.4, 5.0, 4.8, 4.8, 4.9, 5.2],\n    landmarks: [\n      [0, '西桥分拨库', '装车月台'],\n      [15, '驶离分拨库', '市区运输'],\n      [45, '南桥物流园', '园区西门'],\n      [70, '南桥商超配送口', '到货交接区'],\n    ],\n    doors: [[0, 5], [70, 75]],\n  }),\n  makeTrip({\n    id: 'cc-1026',\n    name: '江北分拨仓调拨',\n    scenario: 'gap',\n    date: '2026-11-26',\n    hour: 13,\n    origin: '临港集配仓',\n    destination: '江北分拨仓',\n    shipment: '冷藏果汁 · 48 箱',\n    vehicle: '冷藏车 C-12',\n    subtitle: '冷藏饮品 · 跨区调拨',\n    estimate: { distanceKm: 61, carrier: '临港冷链车队' },\n    temperatures: [5.1, 5.3, 5.1, 5.4, 5.6, 5.8, null, null, null, null, null, 6.3, 6.2, 6.0, 5.6, 5.8, 5.4, 5.5, 5.6, 5.5],\n    landmarks: [\n      [0, '临港集配仓', '装车月台'],\n      [20, '驶离集配仓', '跨区运输'],\n      [60, '江北分拨园区', '园区入口'],\n      [85, '江北分拨仓', '到货交接区'],\n    ],\n    doors: [[0, 5], [85, 90]],\n  }),\n];\n","group":"数据与样例"},{"path":"package.json","text":"{\n  \"name\": \"coldchain-trace\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": { \"node\": \">=22.13\" },\n  \"scripts\": {\n    \"start\": \"node server.mjs\",\n    \"test\": \"node --test tests/*.test.mjs\",\n    \"build:demo\": \"node portable/build.mjs\"\n  }\n}\n","group":"配置与启动"},{"path":"portable/build.mjs","text":"import { copyFile, mkdir, readFile, writeFile } from \"node:fs/promises\";\nimport { dirname, resolve } from \"node:path\";\n\nconst output = resolve(process.argv[2] || \"dist/index.html\");\nconst read = (path) => readFile(new URL(path, import.meta.url), \"utf8\");\nconst moduleUrl = (source) => \"data:text/javascript;base64,\" + Buffer.from(source.replaceAll(\"\\r\\n\", \"\\n\")).toString(\"base64\");\nconst [domain, fixtures, transport, app, css, html] = await Promise.all([\n  read(\"../domain.mjs\"), read(\"../fixtures.mjs\"), read(\"transport.mjs\"), read(\"../static/app.mjs\"),\n  read(\"../static/styles.css\"), read(\"../static/index.html\")\n]);\n\nfunction replaceImport(source, filepath, url) {\n  return source.replaceAll(`\"${filepath}\"`, `\"${url}\"`).replaceAll(`'${filepath}'`, `'${url}'`);\n}\n\nconst domainUrl = moduleUrl(domain);\nconst fixturesUrl = moduleUrl(replaceImport(fixtures, \"./domain.mjs\", domainUrl));\nconst inlineShared = source => replaceImport(replaceImport(source, \"../domain.mjs\", domainUrl), \"../fixtures.mjs\", fixturesUrl);\nconst transportUrl = moduleUrl(inlineShared(transport));\nconst appUrl = moduleUrl(replaceImport(inlineShared(app), \"./transport.mjs\", transportUrl));\nconst stylesheet = /\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css[\"'][^>]*>/iu;\nconst script = /\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs[\"'][^>]*>\\s*\u003c\\/script>/iu;\nconst policy = \"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\nif (!stylesheet.test(html) || !script.test(html)) throw new Error(\"缺少工作台的 HTML 入口。\");\n\nconst portable = html.replace(\"\u003chead>\", `\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(stylesheet, () => `\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(script, () => `\u003cscript type=\"module\" src=\"${appUrl}\">\u003c/script>`);\nconst media = resolve(dirname(output), \"media\");\nawait mkdir(media, { recursive: true });\nawait copyFile(new URL(\"../static/media/cold-dock.webp\", import.meta.url), resolve(media, \"cold-dock.webp\"));\nawait writeFile(output, portable.replaceAll(\"\\r\\n\", \"\\n\"), \"utf8\");\nconsole.log(`已生成便携式冷链运输追溯台 ${output}`);\n","group":"配置与启动"},{"path":"portable/transport.mjs","text":"import { createHandoff, projectTrip } from \"../domain.mjs\";\nimport { TRIPS } from \"../fixtures.mjs\";\n\nexport const executionMode = \"embedded\";\nconst storageKey = \"coldchain-trace:handoffs:v1\";\n\nfunction handoffError(status, code, message) {\n  return Object.assign(new Error(message), { status, code });\n}\n\nexport function prepareHandoff(input, at) {\n  if (!input || typeof input !== \"object\" || Array.isArray(input)) {\n    throw handoffError(400, \"invalid_input\", \"请提交一个交接记录对象。\");\n  }\n  const { tripId, incidentId, action, note, operationId } = input;\n  if (typeof operationId !== \"string\" || !/^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$/u.test(operationId)) {\n    throw handoffError(400, \"invalid_operation_id\", \"交接操作编号无效。\");\n  }\n  const trip = TRIPS.find(candidate => candidate.id === tripId);\n  if (!trip) throw handoffError(404, \"unknown_trip\", \"找不到这条样例运单。\");\n  const incident = projectTrip(trip).incidents.find(candidate => candidate.id === incidentId);\n  if (!incident) throw handoffError(404, \"unknown_incident\", \"这条样例运单中找不到该事件。\");\n  try {\n    return { tripId, ...createHandoff(incident, { action, note, at }), operationId };\n  } catch (error) {\n    throw handoffError(422, \"invalid_handoff\", error.message);\n  }\n}\n\nexport function replayHandoff(handoff, previous) {\n  if (!previous) throw handoffError(409, \"incident_already_recorded\", \"这一事件已留下交接记录。\");\n  if ([\"tripId\", \"incidentId\", \"action\", \"note\"].some(field => previous[field] !== handoff[field])) {\n    throw handoffError(409, \"operation_conflict\", \"操作编号已用于其他交接内容。\");\n  }\n  return { handoff: previous, replayed: true };\n}\n\nfunction browserStorage() {\n  try {\n    const storage = globalThis.localStorage;\n    storage?.getItem(storageKey);\n    return storage;\n  } catch {\n    return undefined;\n  }\n}\n\nexport function createEmbeddedTransport({\n  storage = browserStorage(),\n  locks = globalThis.navigator?.locks,\n  clock = () => new Date().toISOString()\n} = {}) {\n  let memory = {};\n\n  function readHandoffs() {\n    if (!storage) return memory;\n    try {\n      const saved = storage.getItem(storageKey);\n      if (saved === null) return {};\n      const handoffs = JSON.parse(saved);\n      if (!handoffs || typeof handoffs !== \"object\" || Array.isArray(handoffs)) throw new TypeError();\n      return handoffs;\n    } catch {\n      throw handoffError(500, \"storage_read_failed\", \"读取此浏览器保存的交接记录失败。\");\n    }\n  }\n\n  async function loadWorkspace({ signal } = {}) {\n    signal?.throwIfAborted();\n    return { trips: structuredClone(TRIPS), handoffs: structuredClone(readHandoffs()) };\n  }\n\n  async function saveHandoff(input, { signal } = {}) {\n    signal?.throwIfAborted();\n    const handoff = prepareHandoff(input, clock());\n    function write() {\n      const handoffs = readHandoffs();\n      const previous = Object.values(handoffs).find(record => record?.operationId === handoff.operationId);\n      if (previous || Object.hasOwn(handoffs, handoff.incidentId)) {\n        return structuredClone(replayHandoff(handoff, previous));\n      }\n      const next = { ...handoffs, [handoff.incidentId]: handoff };\n      if (storage) {\n        try {\n          storage.setItem(storageKey, JSON.stringify(next));\n        } catch {\n          throw handoffError(500, \"storage_write_failed\", \"保存到此浏览器失败，请检查站点存储设置。\");\n        }\n      } else {\n        memory = next;\n      }\n      return { handoff: structuredClone(handoff), replayed: false };\n    }\n    if (storage && locks) {\n      let acquired = false;\n      try {\n        return await locks.request(storageKey, signal ? { signal } : {}, () => {\n          acquired = true;\n          return write();\n        });\n      } catch (error) {\n        if (acquired || error.name !== \"SecurityError\") throw error;\n      }\n    }\n    return write();\n  }\n\n  return { loadWorkspace, saveHandoff };\n}\n\nlet embedded;\n\nexport function loadWorkspace(options) {\n  embedded ??= createEmbeddedTransport();\n  return embedded.loadWorkspace(options);\n}\n\nexport function saveHandoff(input, options) {\n  embedded ??= createEmbeddedTransport();\n  return embedded.saveHandoff(input, options);\n}\n","group":"前端"},{"path":"server.mjs","text":"import { mkdirSync } from \"node:fs\";\nimport { readFile } from \"node:fs/promises\";\nimport { createServer as createHTTPServer } from \"node:http\";\nimport { dirname, resolve } from \"node:path\";\nimport { DatabaseSync } from \"node:sqlite\";\nimport { fileURLToPath } from \"node:url\";\nimport { parseArgs } from \"node:util\";\nimport { TRIPS } from \"./fixtures.mjs\";\nimport { prepareHandoff, replayHandoff } from \"./portable/transport.mjs\";\n\nconst database = fileURLToPath(new URL(\"./data/handoffs.sqlite\", import.meta.url));\nconst maxBodyBytes = 4096;\nconst policy = \"default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'\";\nconst mimeTypes = {\n  html: \"text/html; charset=utf-8\",\n  mjs: \"text/javascript; charset=utf-8\",\n  css: \"text/css; charset=utf-8\",\n  webp: \"image/webp\"\n};\nconst siteFiles = new Map([\n  [\"/\", \"static/index.html\"],\n  [\"/domain.mjs\", \"domain.mjs\"],\n  [\"/fixtures.mjs\", \"fixtures.mjs\"]\n]);\nfor (const name of [\"index.html\", \"styles.css\", \"app.mjs\", \"transport.mjs\", \"media/cold-dock.webp\"]) {\n  siteFiles.set(`/${name}`, `static/${name}`);\n  siteFiles.set(`/static/${name}`, `static/${name}`);\n}\n\nfunction requestError(status, code, message) {\n  return Object.assign(new Error(message), { status, code });\n}\n\nfunction openStore(path) {\n  if (path !== \":memory:\") mkdirSync(dirname(resolve(path)), { recursive: true });\n  const db = new DatabaseSync(path);\n  db.exec(`\n    PRAGMA busy_timeout = 4000;\n    PRAGMA journal_mode = WAL;\n    CREATE TABLE IF NOT EXISTS handoffs (\n      operation_id TEXT PRIMARY KEY,\n      trip_id TEXT NOT NULL,\n      incident_id TEXT NOT NULL UNIQUE,\n      action TEXT NOT NULL,\n      note TEXT NOT NULL,\n      captured_at TEXT NOT NULL\n    ) STRICT;\n  `);\n  const columns = 'trip_id AS tripId, incident_id AS incidentId, action, note, captured_at AS at, operation_id AS operationId';\n  const select = db.prepare(`SELECT ${columns} FROM handoffs ORDER BY captured_at, operation_id`);\n  const findOperation = db.prepare(`SELECT ${columns} FROM handoffs WHERE operation_id = ?`);\n  const insert = db.prepare(`\n    INSERT INTO handoffs(operation_id, trip_id, incident_id, action, note, captured_at)\n    VALUES (?, ?, ?, ?, ?, ?)\n    ON CONFLICT DO NOTHING\n  `);\n  return {\n    list() {\n      return Object.fromEntries(select.all().map(record => [record.incidentId, record]));\n    },\n    record(handoff) {\n      const { operationId, tripId, incidentId, action, note, at } = handoff;\n      if (insert.run(operationId, tripId, incidentId, action, note, at).changes) {\n        return { handoff, replayed: false };\n      }\n      return replayHandoff(handoff, findOperation.get(operationId));\n    },\n    close() {\n      db.close();\n    }\n  };\n}\n\nfunction reply(response, status, body, type, head) {\n  response.writeHead(status, {\n    \"Content-Type\": type,\n    \"Content-Length\": Buffer.byteLength(body),\n    \"Cache-Control\": \"no-store\",\n    \"Content-Security-Policy\": policy,\n    \"X-Content-Type-Options\": \"nosniff\",\n    \"Referrer-Policy\": \"no-referrer\"\n  });\n  response.end(head ? undefined : body);\n}\n\nfunction json(response, status, payload, head = false) {\n  reply(response, status, JSON.stringify(payload), \"application/json; charset=utf-8\", head);\n}\n\nfunction checkRequest(request, port) {\n  const host = request.headers.host?.toLowerCase();\n  if (host !== `127.0.0.1:${port}` && host !== `localhost:${port}`) {\n    throw requestError(403, \"local_only\", \"此服务仅供本机演练。\");\n  }\n  const origin = `http://${host}`;\n  if (!request.url?.startsWith(\"/\") || request.url.startsWith(\"//\") || request.url.includes(\"\\\\\")) {\n    throw requestError(400, \"invalid_path\", \"请求地址无效。\");\n  }\n  const url = new URL(request.url, origin);\n  if (url.origin !== origin || url.hash) {\n    throw requestError(400, \"invalid_path\", \"请求地址无效。\");\n  }\n  if (url.pathname.startsWith(\"/api/\")) {\n    const site = request.headers[\"sec-fetch-site\"];\n    if ((request.headers.origin && request.headers.origin !== origin) || (site && ![\"same-origin\", \"none\"].includes(site))) {\n      throw requestError(403, \"origin_mismatch\", \"请从本机工作台发起请求。\");\n    }\n  }\n  return url.pathname;\n}\n\nasync function readJSON(request) {\n  if (!/^application\\/json(?:\\s*;|$)/iu.test(request.headers[\"content-type\"] || \"\")) {\n    throw requestError(415, \"invalid_content_type\", \"请提交 JSON 交接内容。\");\n  }\n  if (Number(request.headers[\"content-length\"] || 0) > maxBodyBytes) {\n    throw requestError(413, \"body_too_large\", \"交接内容过长。\");\n  }\n  const chunks = [];\n  let bytes = 0;\n  for await (const chunk of request.iterator({ destroyOnReturn: false })) {\n    bytes += chunk.length;\n    if (bytes > maxBodyBytes) {\n      request.resume();\n      throw requestError(413, \"body_too_large\", \"交接内容过长。\");\n    }\n    chunks.push(chunk);\n  }\n  try {\n    return JSON.parse(Buffer.concat(chunks).toString(\"utf8\"));\n  } catch {\n    throw requestError(400, \"invalid_json\", \"无法读取请求中的 JSON。\");\n  }\n}\n\nfunction requireMethod(request, response, ...allowed) {\n  if (allowed.includes(request.method)) return;\n  response.setHeader(\"Allow\", allowed.join(\", \"));\n  throw requestError(405, \"method_not_allowed\", \"此请求方法不可用。\");\n}\n\nexport function createServer({ dbPath = database, clock = () => new Date().toISOString() } = {}) {\n  const store = openStore(dbPath);\n  const server = createHTTPServer(async (request, response) => {\n    const head = request.method === \"HEAD\";\n    try {\n      const path = checkRequest(request, server.address()?.port);\n      if (path === \"/api/workspace\") {\n        requireMethod(request, response, \"GET\", \"HEAD\");\n        json(response, 200, { trips: TRIPS, handoffs: store.list() }, head);\n      } else if (path === \"/api/handoffs\") {\n        requireMethod(request, response, \"POST\");\n        const input = await readJSON(request);\n        const record = store.record(prepareHandoff(input, clock()));\n        json(response, record.replayed ? 200 : 201, record);\n      } else {\n        const file = siteFiles.get(path);\n        if (!file) throw requestError(404, \"not_found\", \"未找到此页面。\");\n        requireMethod(request, response, \"GET\", \"HEAD\");\n        reply(response, 200, await readFile(new URL(file, import.meta.url)), mimeTypes[file.split(\".\").at(-1)], head);\n      }\n    } catch (error) {\n      if (error.status) json(response, error.status, { code: error.code, message: error.message }, head);\n      else if (error.code === \"ENOENT\") json(response, 404, { code: \"not_found\", message: \"未找到此页面。\" }, head);\n      else {\n        console.error(error);\n        json(response, 500, { code: \"service_unavailable\", message: \"样例服务暂时不可用。\" }, head);\n      }\n    }\n  });\n  let closed = false;\n  const closeStore = () => {\n    if (closed) return;\n    closed = true;\n    store.close();\n  };\n  server.once(\"close\", closeStore);\n  server.once(\"error\", closeStore);\n  return server;\n}\n\nexport function startServer({ port = 8830, ...options } = {}) {\n  return createServer(options).listen(port, \"127.0.0.1\");\n}\n\nif (process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {\n  const { values } = parseArgs({ options: { port: { type: \"string\", default: \"8830\" }, db: { type: \"string\" } } });\n  const port = Number(values.port);\n  if (!/^\\d{1,5}$/u.test(values.port) || port > 65535) throw new Error(\"端口应为 0 至 65535。\");\n  const server = startServer({ port, dbPath: values.db });\n  server.once(\"listening\", () => console.log(`冷链运输追溯台 http://127.0.0.1:${server.address().port}/`));\n  server.once(\"error\", (error) => {\n    console.error(error.message);\n    process.exitCode = 1;\n  });\n}\n","group":"后端"},{"path":"start-coldchain.cmd","text":"@echo off\ncd /d \"%~dp0\"\nnode server.mjs\nexit /b %errorlevel%\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import { HANDOFF_ACTIONS, projectTrip } from '../domain.mjs';\nimport { executionMode, loadWorkspace, saveHandoff } from './transport.mjs';\n\nconst $ = id => document.getElementById(id);\nconst enc = value => String(value ?? '').replace(/[&\u003c>\"']/g, char => ({\n  '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;',\n})[char]);\n\nconst clockFormat = new Intl.DateTimeFormat('zh-CN', {\n  timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',\n});\nconst dateFormat = new Intl.DateTimeFormat('zh-CN', {\n  timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',\n});\n\nconst clock = at => at ? clockFormat.format(new Date(at)) : '—';\nconst date = at => at ? dateFormat.format(new Date(at)) : '—';\nconst temperature = value => value === null ? '—' : `${value.toFixed(1)} ℃`;\n\nconst scenarios = {\n  all: { label: '全部运单' },\n  excursion: { label: '温度超限', color: 'warning' },\n  normal: { label: '全程正常', color: '' },\n  gap: { label: '采样缺失', color: 'gap' },\n};\n\nlet workspace = { trips: [], handoffs: {} };\nlet trip;\nlet fullProjection;\nlet projection;\nlet slot = 0;\nlet totalSlots = 0;\nlet filter = 'all';\nlet incidentId;\nlet formRecordId;\nlet replayTimer;\nconst drafts = new Map();\n\nfunction setMarkup(id, html) {\n  const element = $(id);\n  if (element.sourceMarkup === html) return;\n  element.innerHTML = html;\n  element.sourceMarkup = html;\n}\n\nfunction badge(scenario) {\n  const { color, label } = scenarios[scenario] ?? scenarios.normal;\n  return `\u003cspan class=\"badge ${color}\">${label}\u003c/span>`;\n}\n\nfunction renderShipments() {\n  const filtered = workspace.trips.filter(item => filter === 'all' || item.scenario === filter);\n  $('filter-label').textContent = scenarios[filter].label;\n  for (const button of $('filter-menu').querySelectorAll('[data-filter]')) {\n    button.setAttribute('aria-pressed', String(button.dataset.filter === filter));\n  }\n  setMarkup('shipment-list', filtered.map(item => `\n    \u003cbutton class=\"shipment\" data-trip=\"${enc(item.id)}\" type=\"button\" aria-pressed=\"${item.id === trip?.id}\">\n      \u003cspan class=\"shipment-line\">\u003cspan class=\"shipment-ref\">${enc(item.id.toUpperCase())}\u003c/span>${badge(item.scenario)}\u003c/span>\n      \u003cspan class=\"shipment-route\">${enc(item.name)}\u003c/span>\n      \u003cspan class=\"shipment-foot\">\u003cspan>${enc(item.shipment)}\u003c/span>\u003ctime datetime=\"${enc(item.startAt)}\">${clock(item.startAt)}\u003c/time>\u003c/span>\n    \u003c/button>`).join(''));\n}\n\nfunction rememberTrip(id) {\n  const address = new URL(location.href);\n  address.searchParams.set('trip', id);\n  try {\n    history.replaceState(null, '', address);\n  } catch {\n    // Some browsers restrict address changes for a local static file.\n  }\n}\n\nfunction selectTrip(item, updateAddress = true) {\n  if (!item) return;\n  pauseReplay();\n  trip = item;\n  fullProjection = projectTrip(trip, { handoffs: workspace.handoffs });\n  totalSlots = Math.ceil((Date.parse(trip.endAt) - Date.parse(trip.startAt)) / (trip.intervalMinutes * 60_000));\n  incidentId = undefined;\n  if (updateAddress) rememberTrip(trip.id);\n  $('trip-workspace').hidden = false;\n  $('trip-reference').textContent = trip.id.toUpperCase();\n  setMarkup('trip-status', badge(trip.scenario));\n  $('trip-name').textContent = trip.name;\n  $('trip-journey').textContent = `${trip.origin} → ${trip.destination}`;\n  $('trip-meta').textContent = [trip.shipment, trip.vehicle, trip.estimate?.carrier, trip.estimate?.distanceKm && `${trip.estimate.distanceKm} 公里`].filter(Boolean).join('  /  ');\n  $('trip-start').textContent = `${date(trip.startAt)} ${clock(trip.startAt)}`;\n  $('trip-end').textContent = clock(trip.endAt);\n  const { minC, maxC, minExcursionMinutes } = trip.policy;\n  $('chart-note').textContent = `${minC}–${maxC} ℃ · 每 ${trip.intervalMinutes} 分钟采样 · 持续 ${minExcursionMinutes} 分钟触发超限`;\n  $('cursor-input').max = String(totalSlots);\n  $('raw-data').open = false;\n  seek(totalSlots);\n  renderShipments();\n}\n\nfunction seek(index) {\n  if (!trip) return;\n  slot = Math.min(totalSlots, Math.max(0, index));\n  const at = Math.min(Date.parse(trip.endAt), Date.parse(trip.startAt) + slot * trip.intervalMinutes * 60_000);\n  projection = projectTrip(trip, { cursorAt: at, handoffs: workspace.handoffs });\n  renderReplay();\n}\n\nfunction seekAt(at) {\n  const index = Math.ceil((Date.parse(at) - Date.parse(trip.startAt)) / (trip.intervalMinutes * 60_000));\n  seek(index);\n}\n\nfunction renderReplay() {\n  const { cursorAt, stats } = projection;\n  $('cursor-input').value = String(slot);\n  $('cursor-input').setAttribute('aria-valuetext', `${date(cursorAt)} ${clock(cursorAt)}`);\n  $('cursor-time').value = clock(cursorAt);\n  $('seek-start').disabled = $('seek-prev').disabled = slot === 0;\n  $('seek-end').disabled = $('seek-next').disabled = slot === totalSlots;\n  $('seek-incident').disabled = fullProjection.incidents.length === 0;\n  const unknown = stats.currentTempC === null;\n  const nowWarning = !unknown && (stats.currentTempC \u003c trip.policy.minC || stats.currentTempC > trip.policy.maxC);\n  setMarkup('telemetry-stats', `\n    \u003cdl class=\"stat\">\u003cdt>回放温度\u003c/dt>\u003cdd class=\"${unknown ? 'gap' : nowWarning ? 'warning' : ''}\">${unknown ? '未知' : temperature(stats.currentTempC)}\u003c/dd>\u003cp>${\n      stats.lastAt ? `${unknown ? '末次采样' : '实测于'} ${clock(stats.lastAt)}` : '尚无采样'}\u003c/p>\u003c/dl>\n    \u003cdl class=\"stat\">\u003cdt>已观测最高\u003c/dt>\u003cdd>${temperature(stats.maxC)}\u003c/dd>\u003cp>当前回放区间\u003c/p>\u003c/dl>\n    \u003cdl class=\"stat\">\u003cdt>采样覆盖率\u003c/dt>\u003cdd>${stats.coveragePercent}%\u003c/dd>\u003cp>${stats.readingCount} / ${stats.expectedReadings} 条采样\u003c/p>\u003c/dl>`);\n  renderChart();\n  renderRoute();\n  renderIncidents();\n  renderReadings();\n}\n\nfunction renderChart() {\n  if (!projection) return;\n  const chart = $('telemetry-chart');\n  const width = chart.clientWidth;\n  const height = chart.clientHeight;\n  if (width \u003c= 0 || height \u003c= 0) return;\n\n  const left = 33;\n  const right = width - 12;\n  const top = 19;\n  const bottom = height - 25;\n  const start = Date.parse(trip.startAt);\n  const end = Date.parse(trip.endAt);\n  const range = Math.max(1, end - start);\n  const lows = projection.stats.minC ?? trip.policy.minC;\n  const highs = projection.stats.maxC ?? trip.policy.maxC;\n  const low = Math.min(0, Math.floor(lows / 2) * 2);\n  const high = Math.max(12, Math.ceil(highs / 2) * 2);\n  const x = at => left + (Date.parse(at) - start) / range * (right - left);\n  const y = value => bottom - (value - low) / (high - low) * (bottom - top);\n  const isOut = value => value > trip.policy.maxC || value \u003c trip.policy.minC;\n  const slices = width \u003c 400 ? 3 : 5;\n  const cursor = x(projection.cursorAt);\n\n  const ticksY = Array.from({ length: 5 }, (_, n) => Math.round(low + n / 4 * (high - low)));\n  for (const threshold of [trip.policy.minC, trip.policy.maxC]) {\n    if (!ticksY.includes(threshold) && ticksY.every(tick => Math.abs(tick - threshold) >= 2)) ticksY.push(threshold);\n  }\n  const ticksX = Array.from({ length: slices + 1 }, (_, n) => {\n    const tickSlot = Math.round(n / slices * totalSlots);\n    return new Date(Math.min(end, start + tickSlot * trip.intervalMinutes * 60_000)).toISOString();\n  });\n\n  const gaps = projection.gaps.map(gap => {\n    const from = x(gap.startAt);\n    const to = Math.max(from + 1, x(gap.endAt));\n    const available = to - from;\n    const center = (from + to) / 2;\n    return `\u003cg>\n      \u003crect x=\"${from}\" y=\"${top}\" width=\"${available}\" height=\"${bottom - top}\" fill=\"url(#gap-pattern)\" stroke=\"#8b98b0\" stroke-dasharray=\"3 3\" class=\"telemetry-gap\">\n        \u003ctitle>${clock(gap.startAt)}起缺少 ${gap.missingCount} 条采样\u003c/title>\n      \u003c/rect>\n      ${available >= 47 ? `\u003ctext x=\"${center}\" y=\"${top + 13}\" class=\"gap-caption\" text-anchor=\"middle\">无读数\u003c/text>` : ''}\n    \u003c/g>`;\n  }).join('');\n  const excursions = projection.incidents.filter(item => item.type === 'excursion').map(item => {\n    const from = x(item.startAt);\n    const to = x(item.endAt);\n    return `\u003cg>\n      \u003crect x=\"${from}\" y=\"${top}\" width=\"${Math.max(1, to - from)}\" height=\"${bottom - top}\" fill=\"#fbe4ce\" fill-opacity=\".7\" />\n      ${to - from >= 47 ? `\u003ctext x=\"${(from + to) / 2}\" y=\"${top - 4}\" class=\"warning-caption\" text-anchor=\"middle\">持续超限\u003c/text>` : ''}\n    \u003c/g>`;\n  }).join('');\n\n  const lines = projection.samples.map((sample, index) => {\n    const previous = projection.samples[index - 1];\n    if (!previous || Date.parse(sample.at) - Date.parse(previous.at) > trip.intervalMinutes * 60_000) return '';\n    const warning = isOut(sample.tempC) && isOut(previous.tempC);\n    return `\u003cpath d=\"M${x(previous.at)} ${y(previous.tempC)} L${x(sample.at)} ${y(sample.tempC)}\" fill=\"none\" stroke=\"${warning ? '#b85c23' : '#197a6e'}\" stroke-width=\"2.3\" stroke-linecap=\"round\" />`;\n  }).join('');\n  const readingMarkers = projection.samples.map((sample, index) => {\n    const color = isOut(sample.tempC) ? '#a9511d' : '#197a6e';\n    const isLatest = index === projection.samples.length - 1 && projection.stats.currentTempC !== null;\n    return `\u003ccircle cx=\"${x(sample.at)}\" cy=\"${y(sample.tempC)}\" r=\"${isLatest ? 4.4 : 2.5}\" fill=\"#fff\" stroke=\"${color}\" stroke-width=\"${isLatest ? 2.2 : 1.5}\">\u003ctitle>${clock(sample.at)} · ${temperature(sample.tempC)}\u003c/title>\u003c/circle>`;\n  }).join('');\n\n  chart.setAttribute('viewBox', `0 0 ${width} ${height}`);\n  chart.setAttribute('aria-label', `运输温度曲线，回放至 ${clock(projection.cursorAt)}，${projection.stats.readingCount} 条实测，${projection.gaps.length} 段缺失`);\n  setMarkup('telemetry-chart', `\n    \u003cdefs>\u003cpattern id=\"gap-pattern\" width=\"7\" height=\"7\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">\n      \u003crect width=\"7\" height=\"7\" fill=\"#edf0f7\" fill-opacity=\".95\" />\u003cline x1=\"0\" y1=\"0\" x2=\"0\" y2=\"7\" stroke=\"#d4dce9\" stroke-width=\"2\" />\n    \u003c/pattern>\u003c/defs>\n    \u003crect x=\"${left}\" y=\"${y(trip.policy.maxC)}\" width=\"${right - left}\" height=\"${y(trip.policy.minC) - y(trip.policy.maxC)}\" fill=\"#e3f1ed\" />\n    ${ticksY.map(tick => `\u003cline x1=\"${left}\" x2=\"${right}\" y1=\"${y(tick)}\" y2=\"${y(tick)}\" stroke=\"#d7e4e5\" />\u003ctext x=\"${left - 6}\" y=\"${y(tick) + 3}\" text-anchor=\"end\">${tick}\u003c/text>`).join('')}\n    \u003ctext x=\"${left - 6}\" y=\"${top - 5}\" text-anchor=\"end\">℃\u003c/text>\n    ${excursions}${gaps}\n    \u003cline x1=\"${cursor}\" x2=\"${cursor}\" y1=\"${top}\" y2=\"${bottom}\" stroke=\"#346a65\" stroke-width=\"1.1\" stroke-dasharray=\"3 3\" />\n    ${lines}${readingMarkers}\n    ${ticksX.map((at, index) => `\u003ctext x=\"${x(at)}\" y=\"${bottom + 17}\" text-anchor=\"${index === 0 ? 'start' : index === ticksX.length - 1 ? 'end' : 'middle'}\">${clock(at)}\u003c/text>`).join('')}`);\n}\n\nfunction renderRoute() {\n  const { cursorAt, currentLandmark, events, gaps } = projection;\n  $('route-position').textContent = currentLandmark ? `回放所在 · ${currentLandmark.zone}` : '等待首个节点';\n  const milestones = [\n    ...trip.landmarks.map((event, index) => ({ ...event, id: `landmark-${index}`, type: 'landmark' })),\n    ...gaps.map(gap => ({ at: gap.startAt, id: gap.id, type: 'missing', label: '采样缺失', zone: `缺少 ${gap.missingCount} 条采样` })),\n  ].sort((first, second) => first.at.localeCompare(second.at));\n  const doorObservations = new Map();\n  for (const event of events) {\n    if (event.type !== 'door-open' && event.type !== 'door-closed') continue;\n    const landmark = trip.landmarks.findLast(candidate => candidate.at \u003c= event.at);\n    if (!landmark) continue;\n    const associated = doorObservations.get(landmark.at) ?? [];\n    associated.push(event);\n    doorObservations.set(landmark.at, associated);\n  }\n  setMarkup('route-list', milestones.map(event => {\n    const style = event.at > cursorAt ? 'future' : event.type === 'missing' ? 'missing'\n      : currentLandmark?.at === event.at ? 'current' : '';\n    const observations = event.type === 'landmark' ? doorObservations.get(event.at) ?? [] : [];\n    return `\u003cli class=\"route-item ${style}\">\n      \u003ci class=\"route-mark\" aria-hidden=\"true\">\u003c/i>\n      \u003cdiv class=\"route-content\">\n        \u003cbutton class=\"route-link\" type=\"button\" data-route-key=\"${enc(event.id)}\" data-seek-at=\"${enc(event.at)}\" ${style === 'current' ? 'aria-current=\"step\"' : ''}>\n          \u003cspan>${enc(event.label)} \u003ctime datetime=\"${enc(event.at)}\">${clock(event.at)}\u003c/time>\u003c/span>\u003csmall>${enc(event.zone)}\u003c/small>\n        \u003c/button>\n        ${observations.length ? `\u003cdiv class=\"route-observations\">${observations.map(door => `\n          \u003cbutton class=\"door-reading\" type=\"button\" data-route-key=\"${enc(door.id)}\" data-seek-at=\"${enc(door.at)}\" aria-label=\"${enc(door.label)} · ${clock(door.at)}\">\n            ${door.type === 'door-open' ? '开门' : '关门'} \u003ctime datetime=\"${enc(door.at)}\">${clock(door.at)}\u003c/time>\n          \u003c/button>`).join('')}\u003c/div>` : ''}\n      \u003c/div>\u003c/li>`;\n  }).join(''));\n}\n\nfunction incidentStatus(incident) {\n  const active = incident.status === 'active';\n  const state = incident.handoff ? '已登记' : active ? '进行中' : '待处置';\n  return `\u003cspan class=\"badge ${incident.handoff ? 'neutral' : incident.type === 'gap' ? 'gap' : 'warning'}\">${state}\u003c/span>`;\n}\n\nfunction renderIncidents() {\n  const { incidents } = projection;\n  $('incident-count').textContent = `${incidents.length} 条`;\n  const current = incidents.find(item => item.id === incidentId) ?? incidents[0];\n  if (current) incidentId = current.id;\n  $('incident-empty').hidden = Boolean(current);\n  $('incident-detail').hidden = !current;\n  setMarkup('incident-list', incidents.map(item => `\n    \u003cbutton class=\"incident-choice\" data-incident=\"${enc(item.id)}\" type=\"button\" aria-pressed=\"${item === current}\">\n      \u003cstrong>${enc(item.title)}\u003c/strong>\u003ctime datetime=\"${enc(item.startAt)}\">${clock(item.startAt)}\u003c/time>${incidentStatus(item)}\n    \u003c/button>`).join(''));\n  if (!current) {\n    $('incident-empty').textContent = slot === totalSlots ? '本单在已记录的运输过程内未触发异常。' : '当前回放时刻未触发异常。可拖动时间轴查看后续记录。';\n    return;\n  }\n  const endsAt = current.status === 'closed' && current.type === 'gap' ? current.resolvedAt : current.endAt;\n  const rangeLabel = current.type === 'gap' ? '数据缺失区间' : '首末超限观测';\n  setMarkup('evidence-summary', `\n    \u003cdiv>\u003cdt>${rangeLabel}\u003c/dt>\u003cdd>${clock(current.startAt)} – ${clock(endsAt)} · ${current.durationMinutes} 分钟\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>${current.type === 'gap' ? '缺少采样' : '超限极值'}\u003c/dt>\u003cdd>${\n      current.type === 'gap' ? `${current.missingCount} 条 · 温度未知` : temperature(current.direction === 'low' ? current.minC : current.maxC)}\u003c/dd>\u003c/div>\n    \u003cdiv class=\"evidence-wide\">\u003cdt>判断依据\u003c/dt>\u003cdd>${enc(current.cause)}\u003c/dd>\u003c/div>\n  `);\n  setMarkup('evidence-list', current.evidence.map(event => `\u003cli>\u003ctime datetime=\"${enc(event.at)}\">${clock(event.at)}\u003c/time>\u003cspan>${enc(event.label)}\u003c/span>\u003c/li>`).join(''));\n  renderHandoff(current);\n}\n\nfunction renderHandoff(incident) {\n  const saved = incident.handoff;\n  $('handoff-record').hidden = !saved;\n  $('handoff-form').hidden = Boolean(saved);\n  if (saved) {\n    const decision = HANDOFF_ACTIONS.find(item => item.id === saved.action)?.label ?? saved.action;\n    setMarkup('handoff-record', `\u003cdiv class=\"handoff-saved\">\u003cstrong>${enc(decision)}\u003c/strong>\u003cp>${enc(saved.note)}\u003c/p>\u003ctime datetime=\"${enc(saved.at)}\">${date(saved.at)} ${clock(saved.at)} 已保存\u003c/time>\u003c/div>`);\n  }\n  if (formRecordId === incident.id) return;\n  formRecordId = incident.id;\n  const draft = drafts.get(incident.id);\n  $('handoff-form').reset();\n  $('handoff-note').value = draft?.note ?? '';\n  const action = [...$('action-options').querySelectorAll('input')].find(input => input.value === draft?.action);\n  if (action) action.checked = true;\n  updateHandoffMessage(draft?.message ?? '', draft?.error);\n  $('handoff-save').disabled = Boolean(draft?.saving);\n}\n\nfunction renderReadings() {\n  $('raw-count').textContent = `${projection.samples.length} 条`;\n  $('download-readings').disabled = projection.samples.length === 0;\n  if (!$('raw-data').open) return;\n  const records = projection.samples.toReversed().map(sample => `\u003ctr>\n    \u003ctd>${clock(sample.at)}\u003c/td>\u003ctd>${temperature(sample.tempC)}\u003c/td>\u003ctd>${enc(sample.zone)}\u003c/td>\u003ctd>${sample.doorOpen == null ? '未知' : sample.doorOpen ? '打开' : '关闭'}\u003c/td>\n  \u003c/tr>`).join('');\n  setMarkup('raw-table', records || '\u003ctr>\u003ctd colspan=\"4\" class=\"table-empty\">当前时刻无记录\u003c/td>\u003c/tr>');\n}\n\nfunction downloadReadings() {\n  const quote = value => `\"${String(value ?? '').replaceAll('\"', '\"\"')}\"`;\n  const records = [['运单号', '采样记录 ID', '采样时间 UTC', '温度 ℃', '采样位置', '厢门']];\n  for (const sample of projection.samples) {\n    records.push([trip.id, sample.id, sample.at, sample.tempC, sample.zone,\n      sample.doorOpen == null ? '未知' : sample.doorOpen ? '打开' : '关闭']);\n  }\n  const blob = new Blob(['\\uFEFF', records.map(row => row.map(quote).join(',')).join('\\r\\n'), '\\r\\n'],\n    { type: 'text/csv;charset=utf-8' });\n  const url = URL.createObjectURL(blob);\n  const anchor = document.createElement('a');\n  anchor.href = url;\n  anchor.download = `${trip.id}-${clock(projection.cursorAt).replace(':', '')}-readings.csv`;\n  document.body.append(anchor);\n  anchor.click();\n  anchor.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1_000);\n}\n\nfunction pauseReplay() {\n  if (replayTimer) clearInterval(replayTimer);\n  replayTimer = undefined;\n  $('play-toggle').textContent = '回放';\n}\n\nfunction toggleReplay() {\n  if (replayTimer) {\n    pauseReplay();\n    return;\n  }\n  if (slot === totalSlots) seek(0);\n  $('play-toggle').textContent = '暂停';\n  replayTimer = setInterval(() => {\n    seek(slot + 1);\n    if (slot === totalSlots) pauseReplay();\n  }, 360);\n}\n\nfunction setSavePending(saving) {\n  $('handoff-save').disabled = saving;\n  $('handoff-actions').disabled = saving;\n  $('handoff-note').readOnly = saving;\n}\n\nfunction updateHandoffMessage(message, error = false) {\n  $('handoff-message').textContent = message;\n  $('handoff-message').classList.toggle('error', Boolean(error));\n}\n\nfunction readDraft() {\n  if (!formRecordId) return;\n  const note = $('handoff-note').value;\n  const action = $('action-options').querySelector('input:checked')?.value ?? '';\n  const previous = drafts.get(formRecordId);\n  if (previous?.saving) return;\n  if (!previous || previous.note !== note || previous.action !== action) {\n    drafts.set(formRecordId, { note, action });\n    updateHandoffMessage('');\n  }\n}\n\nasync function submitHandoff(event) {\n  event.preventDefault();\n  pauseReplay();\n  const tripId = trip.id;\n  const id = formRecordId;\n  readDraft();\n  const draft = drafts.get(id);\n  if (!draft || draft.saving) return;\n  const { note, action } = draft;\n  if (!action || !note.trim()) {\n    updateHandoffMessage('请选择处置决定并填写交接备注。', true);\n    return;\n  }\n  draft.operationId ??= globalThis.crypto.randomUUID?.() ?? `op-${Date.now()}-${Array.from(crypto.getRandomValues(new Uint32Array(3))).join('-')}`;\n  draft.saving = true;\n  $('handoff-save').disabled = true;\n  updateHandoffMessage('正在保存…');\n  try {\n    const { handoff } = await saveHandoff({ tripId, incidentId: id, action, note, operationId: draft.operationId });\n    workspace.handoffs[id] = handoff;\n    drafts.delete(id);\n    if (trip.id === tripId) seek(slot);\n  } catch (error) {\n    draft.message = error.message || '保存失败，请重试。';\n    draft.error = true;\n    if (error.code === 'incident_already_recorded') {\n      try {\n        const updated = await loadWorkspace();\n        workspace.handoffs = updated.handoffs;\n        if (trip.id === tripId) seek(slot);\n      } catch {\n        // Keep the original conflict reason if refreshing the record fails.\n      }\n    }\n  } finally {\n    draft.saving = false;\n    if (id === formRecordId) {\n      $('handoff-save').disabled = false;\n      updateHandoffMessage(draft.message ?? '', draft.error);\n    }\n  }\n}\n\n$('shipment-list').addEventListener('click', event => {\n  const id = event.target.closest('[data-trip]')?.dataset.trip;\n  if (id && id !== trip?.id) {\n    selectTrip(workspace.trips.find(item => item.id === id));\n    [...$('shipment-list').querySelectorAll('[data-trip]')].find(button => button.dataset.trip === id)?.focus({ preventScroll: true });\n  }\n});\n\n$('filter-menu').addEventListener('click', event => {\n  const menu = $('filter-menu');\n  const choice = event.target.closest('[data-filter]')?.dataset.filter;\n  if (!choice) return;\n  filter = choice;\n  const matching = workspace.trips.filter(item => filter === 'all' || item.scenario === filter);\n  if (matching.length && !matching.some(item => item.id === trip?.id)) selectTrip(matching[0]);\n  renderShipments();\n  menu.open = false;\n  menu.querySelector('summary').focus();\n});\n\ndocument.addEventListener('click', event => {\n  const menu = $('filter-menu');\n  if (!menu.contains(event.target)) menu.open = false;\n});\n\ndocument.addEventListener('keydown', event => {\n  const menu = $('filter-menu');\n  if (event.key === 'Escape' && menu.open) {\n    menu.open = false;\n    menu.querySelector('summary').focus();\n  }\n});\n\n$('cursor-input').addEventListener('input', event => {\n  pauseReplay();\n  seek(Number(event.target.value));\n});\n\nfor (const [id, position] of [\n  ['seek-start', () => 0], ['seek-prev', () => slot - 1],\n  ['seek-next', () => slot + 1], ['seek-end', () => totalSlots],\n]) {\n  $(id).addEventListener('click', () => {\n    pauseReplay();\n    seek(position());\n  });\n}\n\n$('play-toggle').addEventListener('click', toggleReplay);\n$('seek-incident').addEventListener('click', () => {\n  const first = fullProjection.incidents[0];\n  if (!first) return;\n  pauseReplay();\n  incidentId = first.id;\n  const offset = first.type === 'excursion' ? trip.policy.minExcursionMinutes * 60_000 : 0;\n  seekAt(new Date(Date.parse(first.startAt) + offset).toISOString());\n});\n\n$('route-list').addEventListener('click', event => {\n  const target = event.target.closest('[data-seek-at]');\n  const at = target?.dataset.seekAt;\n  if (!at) return;\n  pauseReplay();\n  seekAt(at);\n  [...$('route-list').querySelectorAll('[data-seek-at]')].find(button => button.dataset.routeKey === target.dataset.routeKey)?.focus({ preventScroll: true });\n});\n\n$('incident-list').addEventListener('click', event => {\n  const id = event.target.closest('[data-incident]')?.dataset.incident;\n  if (!id) return;\n  pauseReplay();\n  incidentId = id;\n  renderIncidents();\n  [...$('incident-list').querySelectorAll('[data-incident]')].find(button => button.dataset.incident === id)?.focus({ preventScroll: true });\n});\n\n$('handoff-form').addEventListener('focusin', pauseReplay);\n$('handoff-form').addEventListener('input', readDraft);\n$('handoff-form').addEventListener('submit', submitHandoff);\n$('raw-data').addEventListener('toggle', () => {\n  if (projection) renderReadings();\n});\n$('download-readings').addEventListener('click', downloadReadings);\nnew ResizeObserver(renderChart).observe($('telemetry-chart'));\n\nsetMarkup('action-options', HANDOFF_ACTIONS.map(option => `\u003clabel class=\"action-option\">\n  \u003cinput type=\"radio\" name=\"handoff-action\" value=\"${enc(option.id)}\">\u003cspan>${enc(option.label)}\u003c/span>\n\u003c/label>`).join(''));\n\n$('environment-label').textContent = executionMode === 'embedded' ? '离线样例' : '样例工作区';\n$('load-notice').hidden = false;\n$('load-notice').textContent = '正在加载样例运单…';\n\ntry {\n  workspace = await loadWorkspace();\n  const requested = new URLSearchParams(location.search).get('trip');\n  selectTrip(workspace.trips.find(item => item.id === requested) ?? workspace.trips[0], false);\n  $('load-notice').hidden = workspace.trips.length > 0;\n  if (!$('load-notice').hidden) $('load-notice').textContent = '暂无样例运单。';\n} catch (error) {\n  $('load-notice').textContent = `无法加载样例运单。${error.message}`;\n}\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#142f32\">\n  \u003cmeta name=\"description\" content=\"用运输路单、温度遥测和异常证据复核冷链运输过程。\">\n  \u003ctitle>冷链运输追溯台\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#workspace\">跳到运单工作区\u003c/a>\n  \u003cheader class=\"app-header\">\n    \u003cdiv class=\"app-header-inner\">\n      \u003ca class=\"brand\" href=\"./index.html\" aria-label=\"冷链运输追溯台首页\">\n        \u003cspan class=\"brand-symbol\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\n        \u003cspan>冷链追溯\u003c/span>\n      \u003c/a>\n      \u003cspan class=\"app-section\">运输工作台\u003c/span>\n      \u003cspan class=\"environment\">\u003ci>\u003c/i>\u003cspan id=\"environment-label\">样例数据\u003c/span>\u003c/span>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cmain class=\"workspace\" id=\"workspace\">\n    \u003cheader class=\"page-heading\">\n      \u003cdiv>\n        \u003ch1>运输追溯\u003c/h1>\n        \u003cp>回放在途温度与交接记录，定位异常并登记处置。\u003c/p>\n      \u003c/div>\n      \u003cp class=\"timezone\">时间均为北京时间 \u003cspan>UTC+8\u003c/span>\u003c/p>\n    \u003c/header>\n\n    \u003cdiv class=\"notice\" id=\"load-notice\" role=\"status\" hidden>\u003c/div>\n    \u003cdiv class=\"workspace-grid\">\n      \u003caside class=\"shipment-board panel\" aria-labelledby=\"shipment-title\">\n        \u003cfigure class=\"dock-image\">\n          \u003cimg src=\"./media/cold-dock.webp\" alt=\"\" width=\"1240\" height=\"560\" decoding=\"async\">\n          \u003cfigcaption>冷链运输 · 样例运单\u003c/figcaption>\n        \u003c/figure>\n        \u003cdiv class=\"board-title\">\n          \u003ch2 id=\"shipment-title\">运单列表\u003c/h2>\n          \u003cdetails class=\"filter-menu\" id=\"filter-menu\">\n            \u003csummary>\u003cspan id=\"filter-label\">全部运单\u003c/span>\u003cspan class=\"chevron\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\n            \u003cdiv class=\"filter-options\" aria-label=\"运单状态\">\n              \u003cbutton type=\"button\" data-filter=\"all\" aria-pressed=\"true\">全部运单\u003c/button>\n              \u003cbutton type=\"button\" data-filter=\"excursion\" aria-pressed=\"false\">温度超限\u003c/button>\n              \u003cbutton type=\"button\" data-filter=\"normal\" aria-pressed=\"false\">全程正常\u003c/button>\n              \u003cbutton type=\"button\" data-filter=\"gap\" aria-pressed=\"false\">采样缺失\u003c/button>\n            \u003c/div>\n          \u003c/details>\n        \u003c/div>\n        \u003cdiv id=\"shipment-list\" class=\"shipment-list\" aria-label=\"选择运单\">\u003c/div>\n      \u003c/aside>\n\n      \u003cdiv class=\"trip-workspace\" id=\"trip-workspace\" hidden>\n        \u003csection class=\"trip-header panel\" aria-labelledby=\"trip-name\">\n          \u003cdiv class=\"trip-title\">\n            \u003cdiv class=\"trip-title-meta\">\n              \u003cspan class=\"trip-reference\" id=\"trip-reference\">\u003c/span>\n              \u003cspan id=\"trip-status\">\u003c/span>\n            \u003c/div>\n            \u003ch2 id=\"trip-name\">\u003c/h2>\n            \u003cp class=\"trip-meta\">\u003cspan class=\"trip-journey\" id=\"trip-journey\">\u003c/span>\u003cspan id=\"trip-meta\">\u003c/span>\u003c/p>\n          \u003c/div>\n          \u003cdl class=\"trip-time-window\">\n            \u003cdiv>\u003cdt>发运时间\u003c/dt>\u003cdd id=\"trip-start\">\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>回放终点\u003c/dt>\u003cdd id=\"trip-end\">\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/section>\n\n        \u003cdiv class=\"observations\">\n          \u003csection class=\"telemetry panel\" aria-labelledby=\"telemetry-title\">\n            \u003cheader class=\"panel-heading\">\n              \u003cdiv>\u003ch2 id=\"telemetry-title\">在途温度\u003c/h2>\u003cp id=\"chart-note\">\u003c/p>\u003c/div>\n              \u003cdiv class=\"chart-legend\" aria-label=\"图例\">\n                \u003cspan>\u003ci class=\"legend-line\">\u003c/i>实测\u003c/span>\n                \u003cspan>\u003ci class=\"legend-band\">\u003c/i>设定区间\u003c/span>\n                \u003cspan>\u003ci class=\"legend-gap\">\u003c/i>缺失\u003c/span>\n              \u003c/div>\n            \u003c/header>\n            \u003cdiv class=\"stats\" id=\"telemetry-stats\">\u003c/div>\n            \u003cdiv class=\"chart-wrap\">\n              \u003csvg id=\"telemetry-chart\" role=\"img\" aria-label=\"运输温度曲线\" preserveAspectRatio=\"none\">\u003c/svg>\n            \u003c/div>\n            \u003cdiv class=\"playback\">\n              \u003cdiv class=\"playback-top\">\n                \u003clabel class=\"playback-label\" for=\"cursor-input\">运输回放\u003c/label>\n                \u003coutput id=\"cursor-time\" for=\"cursor-input\">\u003c/output>\n              \u003c/div>\n              \u003cinput type=\"range\" id=\"cursor-input\" min=\"0\" max=\"1\" value=\"1\" step=\"1\">\n              \u003cdiv class=\"playback-controls\">\n                \u003cdiv class=\"button-group\">\n                  \u003cbutton type=\"button\" class=\"button button-subtle\" id=\"seek-start\">起点\u003c/button>\n                  \u003cbutton type=\"button\" class=\"button button-subtle\" id=\"seek-prev\" aria-label=\"后退一个采样周期\">−\u003c/button>\n                  \u003cbutton type=\"button\" class=\"button button-dark\" id=\"play-toggle\">回放\u003c/button>\n                  \u003cbutton type=\"button\" class=\"button button-subtle\" id=\"seek-next\" aria-label=\"前进一个采样周期\">+\u003c/button>\n                  \u003cbutton type=\"button\" class=\"button button-subtle\" id=\"seek-end\">终点\u003c/button>\n                \u003c/div>\n                \u003cbutton type=\"button\" class=\"button button-jump\" id=\"seek-incident\">跳到异常 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/section>\n          \u003csection class=\"route panel\" aria-labelledby=\"route-title\">\n            \u003cheader class=\"panel-heading route-heading\">\n              \u003cdiv>\u003ch2 id=\"route-title\">运输节点\u003c/h2>\u003cp id=\"route-position\">\u003c/p>\u003c/div>\n            \u003c/header>\n            \u003col class=\"route-list\" id=\"route-list\">\u003c/ol>\n          \u003c/section>\n        \u003c/div>\n\n        \u003csection class=\"investigation panel\" aria-labelledby=\"investigation-title\">\n          \u003cheader class=\"panel-heading\">\n            \u003cdiv>\u003ch2 id=\"investigation-title\">异常与处置\u003c/h2>\u003cp>查看触发依据并保存交接决定。\u003c/p>\u003c/div>\n            \u003cspan class=\"count\" id=\"incident-count\">\u003c/span>\n          \u003c/header>\n          \u003cdiv id=\"incident-list\" class=\"incident-list\" aria-label=\"选择异常\">\u003c/div>\n          \u003cdiv class=\"incident-empty\" id=\"incident-empty\">\u003c/div>\n          \u003cdiv class=\"incident-detail\" id=\"incident-detail\" hidden>\n            \u003csection aria-labelledby=\"evidence-title\" class=\"evidence\">\n              \u003ch3 id=\"evidence-title\">异常证据\u003c/h3>\n              \u003cdl id=\"evidence-summary\" class=\"evidence-summary\">\u003c/dl>\n              \u003col id=\"evidence-list\" class=\"evidence-list\">\u003c/ol>\n            \u003c/section>\n            \u003csection class=\"handoff\" aria-labelledby=\"handoff-title\">\n              \u003ch3 id=\"handoff-title\">交接处置\u003c/h3>\n              \u003cdiv id=\"handoff-record\" role=\"status\" hidden>\u003c/div>\n              \u003cform id=\"handoff-form\">\n                \u003cfieldset id=\"handoff-actions\">\n                  \u003clegend>处置决定\u003c/legend>\n                  \u003cdiv class=\"action-options\" id=\"action-options\">\u003c/div>\n                \u003c/fieldset>\n                \u003clabel class=\"note-label\" for=\"handoff-note\">交接备注\u003c/label>\n                \u003ctextarea id=\"handoff-note\" rows=\"3\" maxlength=\"240\" required placeholder=\"写明隔离、核验或设备排查安排\">\u003c/textarea>\n                \u003cdiv class=\"form-actions\">\n                  \u003cbutton type=\"submit\" class=\"button button-dark\" id=\"handoff-save\">保存处置\u003c/button>\n                  \u003cp id=\"handoff-message\" role=\"status\">\u003c/p>\n                \u003c/div>\n              \u003c/form>\n            \u003c/section>\n          \u003c/div>\n        \u003c/section>\n\n        \u003cdetails class=\"raw-data panel\" id=\"raw-data\">\n          \u003csummary>\u003cspan>遥测明细 \u003cspan class=\"count\" id=\"raw-count\">\u003c/span>\u003c/span>\u003cspan class=\"chevron\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\n          \u003cdiv class=\"table-wrap\">\n            \u003ctable>\n              \u003cthead>\u003ctr>\u003cth scope=\"col\">采样时间\u003c/th>\u003cth scope=\"col\">温度\u003c/th>\u003cth scope=\"col\">采样位置\u003c/th>\u003cth scope=\"col\">厢门\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody id=\"raw-table\">\u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003cdiv class=\"raw-tools\">\u003cbutton type=\"button\" class=\"button button-subtle\" id=\"download-readings\">导出当前回放 CSV\u003c/button>\u003c/div>\n        \u003c/details>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: light;\n  --background: #edf2f3;\n  --surface: #fff;\n  --surface-soft: #f6f9f9;\n  --ink: #172d32;\n  --muted: #536970;\n  --line: #dce6e7;\n  --line-strong: #cbdcdd;\n  --teal: #12645e;\n  --teal-dark: #14423f;\n  --teal-soft: #e7f2ef;\n  --warning: #8f450d;\n  --warning-soft: #fff0df;\n  --gap: #42516c;\n  --gap-soft: #edf0f7;\n  --radius: 14px;\n  --shadow: 0 2px 3px #193c4208, 0 10px 30px #193c4206;\n  font-family: Inter, \"PingFang SC\", \"Microsoft YaHei UI\", \"Microsoft YaHei\", system-ui, sans-serif;\n  font-size: 14px;\n  font-synthesis: none;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody { margin: 0; color: var(--ink); background: var(--background); line-height: 1.5; }\na { color: inherit; }\nbutton, input, textarea { font: inherit; }\nbutton { cursor: pointer; }\nbutton:disabled { cursor: default; opacity: .58; }\nbutton, a, summary, input, textarea { -webkit-tap-highlight-color: transparent; }\n:focus-visible { outline: 2px solid #26948b; outline-offset: 3px; }\nh1, h2, h3, p, dl, ol, figure { margin: 0; }\nsvg { display: block; }\n\n.skip-link { position: fixed; top: -70px; left: 16px; z-index: 10; padding: 10px 16px; border-radius: 6px; color: white; background: var(--teal-dark); }\n.skip-link:focus { top: 10px; }\n\n.app-header { background: #142f32; color: #dceceb; border-bottom: 1px solid #285251; }\n.app-header-inner { display: flex; align-items: center; gap: 20px; max-width: 1496px; min-height: 60px; margin-inline: auto; padding-inline: clamp(18px, 4vw, 50px); }\n.brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 720; letter-spacing: .055em; color: #f4faf9; text-decoration: none; white-space: nowrap; }\n.brand-symbol { display: inline-grid; width: 32px; height: 32px; place-content: center; position: relative; border: 1px solid #6aaea1; border-radius: 9px; background: linear-gradient(145deg, #2f645b, #193c3a); }\n.brand-symbol i { position: absolute; top: calc(50% - 1px); left: 7px; width: 16px; height: 2px; background: #baeee0; border-radius: 5px; }\n.brand-symbol i:nth-child(2) { transform: rotate(60deg); }\n.brand-symbol i:nth-child(3) { transform: rotate(-60deg); }\n.app-section { border-left: 1px solid #3c5758; padding-left: 18px; color: #adc4c5; font-size: 12px; white-space: nowrap; }\n.environment { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; padding: 4px 10px; border: 1px solid #4a6766; border-radius: 22px; color: #d5ece7; font-size: 11px; }\n.environment i { width: 6px; height: 6px; border-radius: 99px; background: #94d7bd; }\n\n.workspace { max-width: 1496px; margin-inline: auto; padding: 27px clamp(18px, 4vw, 50px) 44px; }\n.page-heading { display: flex; align-items: fle
