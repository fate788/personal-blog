<script id="source-data" type="application/json">{"files":[{"path":".github/workflows/check.yml","text":"name: Verify log privacy review\non: [push, pull_request]\njobs:\n  review:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n      - run: npm run build\n      - run: npm run review\n","group":"配置与启动"},{"path":".gitignore","text":"dist/\nnode_modules/\n*.jsonl\n*.ndjson\n","group":"配置与启动"},{"path":"README.md","text":"# 日志隐私抽检台\n\n给维护采集规则的开发和运维人员复核日志脱敏。用同一批 JSONL 复跑两套规则，逐行核对遗漏的敏感字段及受影响的排障字段，再导出脱敏结果和仅含统计的审查报告。\n\n[打开体验](https://fate788.github.io/personal-blog/demos/logprivacy/index.html?v=1.0) · [作品说明](https://fate788.github.io/personal-blog/projects/logprivacy/index.html)\n\n![抽检台实屏](docs/preview.webp)\n\n## 体验流程\n\n1. 打开 12 行合成日志，切换基线与候选规则，查看同一条记录中的原始值、变更后值和判定依据。\n2. 在候选规则关闭正文扫描或关闭保留追踪 ID，查看导出状态和受影响的行。\n3. 恢复候选规则，下载脱敏 JSONL 和审查报告。导入文件时，每个非空行应是一个 JSON 对象，单批最多 2,000 行及 1 MiB。较长的数字标识请用字符串保存。导入批次依据预设字段和模式抽检，需要人工确认后才能导出日志。\n\n公开体验在当前浏览器内存中处理，刷新会清空导入和复核状态。打包版本通过内容安全策略禁止网络连接。审查报告仅列统计、规则参数、位置和发现类型。\n\n## 在本机复跑\n\n需要 Node.js 22 或更新版本，无额外依赖。\n\n```sh\nnpm test\nnpm run build\nnpm run review\nnode cli.mjs --demo --baseline\nnode cli.mjs --input ./events.jsonl --out ./redacted.jsonl --confirm-reviewed\n```\n\n构建产物为 `dist/index.html`，可双击离线使用。CLI 退出码 `0` 表示通过，`1` 表示输入或文件错误，`2` 表示抽检阻断或待确认。输出文件须使用新路径。`--compare` 会把基线和所选规则的统计放在同一份报告。`--no-text` 和 `--mask-trace` 可单独关闭对应候选项。\n\n## 抽检口径\n\n合成批次含逐项标注，分别核对敏感值和应保留的诊断字段。导入批次的发现取决于内置字段和文本模式，导出仅表示当前抽检通过。可先从源头控制记录字段，再用本工具回归验证规则。设计参考 [OWASP 日志指南](https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html#data-to-exclude) 与 [OpenTelemetry 敏感数据处理](https://opentelemetry.io/docs/security/handling-sensitive-data/)。\n","group":"项目说明"},{"path":"SOURCE-PACKAGE.md","text":"# 日志隐私抽检台 v1.0 源码包\n\n原始发布归档为 `日志隐私抽检台-v1.0.zip`。压缩包保留其中 13 份文本文件的原始路径与字节，本文件为导出说明。\n\n需要 Node.js 22 或更新版本。npm test 运行验收，npm run build 生成离线网页，npm run review 对照样例。\n","group":"项目说明"},{"path":"build.mjs","text":"import { mkdir, readFile, writeFile } from 'node:fs/promises';\nimport { dirname, resolve } from 'node:path';\n\nconst output = resolve(process.argv[2] || 'dist/index.html');\nconst read = async path => (await readFile(new URL(path, import.meta.url), 'utf8')).replaceAll('\\r\\n', '\\n');\nconst moduleUrl = source => `data:text/javascript;base64,${Buffer.from(source).toString('base64')}`;\nconst [html, css, app, engine, fixtures] = await Promise.all([\n  read('./static/index.html'), read('./static/styles.css'), read('./static/app.mjs'),\n  read('./engine.mjs'), read('./fixtures.mjs'),\n]);\n\nfunction inlineImport(source, filename, url) {\n  return source.replaceAll(`'${filename}'`, `'${url}'`).replaceAll(`\"${filename}\"`, `\"${url}\"`);\n}\n\nconst engineUrl = moduleUrl(engine);\nconst fixturesUrl = moduleUrl(inlineImport(fixtures, './engine.mjs', engineUrl));\nconst appSource = inlineImport(inlineImport(app, '../engine.mjs', engineUrl), '../fixtures.mjs', fixturesUrl);\nconst styleTag = /\u003clink\\b[^>]*href=[\"'](?:\\.\\/)?styles\\.css[\"'][^>]*>/iu;\nconst scriptTag = /\u003cscript\\b[^>]*src=[\"'](?:\\.\\/)?app\\.mjs[\"'][^>]*>\\s*\u003c\\/script>/iu;\nconst policy = \"default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'\";\n\nif (!styleTag.test(html) || !scriptTag.test(html)) throw new Error('缺少工作台的样式或脚本入口。');\nconst portable = html.replace('\u003chead>', `\u003chead>\\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"${policy}\">`)\n  .replace(styleTag, () => `\u003cstyle>\\n${css}\\n\u003c/style>`)\n  .replace(scriptTag, () => `\u003cscript type=\"module\" src=\"${moduleUrl(appSource)}\">\u003c/script>`);\n\nawait mkdir(dirname(output), { recursive: true });\nawait writeFile(output, portable, 'utf8');\nconsole.log(`已生成日志隐私抽检台 ${output}`);\n","group":"配置与启动"},{"path":"cli.mjs","text":"import { open, stat, unlink } from 'node:fs/promises';\nimport { analyze, BASELINE, CANDIDATE, createSummary, exportJsonl, MAX_INPUT_BYTES, parseJsonl } from './engine.mjs';\nimport { SAMPLE_ANNOTATIONS, SAMPLE_RECORDS } from './fixtures.mjs';\n\nconst HELP = `日志隐私抽检台 · 本机命令行\n\nnode cli.mjs --demo [选项]\nnode cli.mjs --input \u003c日志.jsonl> [选项]\n\n  --compare           同时输出基线和所选规则的报告\n  --baseline          使用基线规则\n  --no-text           关闭消息里的敏感内容识别\n  --mask-trace        允许规则遮盖排障追踪字段\n  --out \u003c新文件>      通过抽检后写入脱敏 JSONL\n  --confirm-reviewed  已人工复核未标注日志，允许申请导出\n  --help, -h          查看帮助\n\n标准输出为 JSON 报告。退出码 0 表示检查通过，2 表示抽检阻断或导出待复核，1 表示参数、输入或写入错误。\n未标注日志的报告只覆盖规则可检查的范围。`;\n\nconst flags = new Set(['--demo', '--compare', '--baseline', '--no-text', '--mask-trace', '--confirm-reviewed']);\nconst pathArgs = new Set(['--input', '--out']);\n\nclass CliError extends Error {}\n\nfunction parseArgs(argv) {\n  const options = new Map();\n  for (let index = 0; index \u003c argv.length; index += 1) {\n    const name = argv[index];\n    if (options.has(name) || (!flags.has(name) && !pathArgs.has(name))) {\n      throw new CliError('存在未知或重复的参数。运行 node cli.mjs --help 查看用法。');\n    }\n    if (flags.has(name)) {\n      options.set(name, true);\n      continue;\n    }\n    const value = argv[index + 1];\n    if (!value || value.startsWith('--')) throw new CliError('输入和输出选项需要文件路径。');\n    options.set(name, value);\n    index += 1;\n  }\n  if (options.has('--demo') === options.has('--input')) {\n    throw new CliError('请用 --demo 运行样例，或用 --input 指定一个本地日志文件。');\n  }\n  return options;\n}\n\nasync function readInput(path) {\n  try {\n    const info = await stat(path);\n    if (!info.isFile() || info.size > MAX_INPUT_BYTES) {\n      throw new CliError(`请提供不超过 ${MAX_INPUT_BYTES} 字节的普通日志文件。`);\n    }\n    const file = await open(path, 'r');\n    try {\n      const bytes = Buffer.allocUnsafe(MAX_INPUT_BYTES + 1);\n      let length = 0;\n      while (length \u003c bytes.length) {\n        const { bytesRead } = await file.read(bytes, length, bytes.length - length, null);\n        if (!bytesRead) break;\n        length += bytesRead;\n      }\n      if (length > MAX_INPUT_BYTES) throw new CliError(`日志超过 ${MAX_INPUT_BYTES} 字节。`);\n      try {\n        return new TextDecoder('utf-8', { fatal: true }).decode(bytes.subarray(0, length));\n      } catch {\n        throw new CliError('日志文件需要使用 UTF-8 编码。');\n      }\n    } finally {\n      await file.close();\n    }\n  } catch (error) {\n    if (error instanceof CliError) throw error;\n    throw new CliError('无法读取指定的日志文件。');\n  }\n}\n\nasync function writeNewFile(path, contents) {\n  let file;\n  try {\n    file = await open(path, 'wx', 0o600);\n  } catch (error) {\n    if (error.code === 'EEXIST') throw new CliError('输出文件已存在，请指定一个新文件。');\n    throw new CliError('无法创建输出文件。');\n  }\n  try {\n    try {\n      await file.writeFile(contents, 'utf8');\n    } finally {\n      await file.close();\n    }\n  } catch {\n    await unlink(path).catch(() => {});\n    throw new CliError('写入脱敏日志失败。');\n  }\n}\n\nasync function loadRecords(path) {\n  const text = await readInput(path);\n  try {\n    return parseJsonl(text);\n  } catch (error) {\n    throw new CliError(error.message);\n  }\n}\n\nasync function run(argv) {\n  if (argv.length === 1 && ['--help', '-h'].includes(argv[0])) {\n    console.log(HELP);\n    return 0;\n  }\n  const options = parseArgs(argv);\n  const demo = options.has('--demo');\n  const records = demo ? SAMPLE_RECORDS : await loadRecords(options.get('--input'));\n  const annotations = demo ? SAMPLE_ANNOTATIONS : undefined;\n  const policy = options.has('--baseline') ? BASELINE : {\n    scanText: CANDIDATE.scanText && !options.has('--no-text'),\n    preserveTrace: CANDIDATE.preserveTrace && !options.has('--mask-trace'),\n  };\n  const selected = analyze(records, { policy, annotations });\n  const summary = createSummary(selected);\n  const report = options.has('--compare')\n    ? { baseline: createSummary(analyze(records, { policy: BASELINE, annotations })), selected: summary }\n    : summary;\n  console.log(JSON.stringify(report, null, 2));\n  if (!selected.gate.allowed) return 2;\n\n  const output = options.get('--out');\n  if (!output) return 0;\n  const confirmUnlabeled = options.has('--confirm-reviewed');\n  if (!selected.gate.labeled && !confirmUnlabeled) {\n    console.error('未标注日志需要人工复核。复核完成后可用 --confirm-reviewed 申请导出。');\n    return 2;\n  }\n  await writeNewFile(output, exportJsonl(selected, { confirmUnlabeled }));\n  return 0;\n}\n\ntry {\n  process.exitCode = await run(process.argv.slice(2));\n} catch (error) {\n  console.error(error instanceof CliError ? error.message : '无法处理日志。请检查文件格式和参数。');\n  process.exitCode = 1;\n}\n","group":"配置与启动"},{"path":"engine.mjs","text":"export const MAX_INPUT_BYTES = 1_048_576;\nexport const MAX_ROWS = 2_000;\nconst MAX_DEPTH = 24;\n\nexport const BASELINE = Object.freeze({ scanText: false, preserveTrace: false });\nexport const CANDIDATE = Object.freeze({ scanText: true, preserveTrace: true });\n\nconst FIELD_CATEGORIES = new Map([\n  ...['email', 'useremail', 'customeremail', 'receiveremail', 'emailaddress'].map(key => [key, 'email']),\n  ...['phone', 'mobile', 'phonenumber', 'mobilephone', 'telephone', 'receiverphone'].map(key => [key, 'phone']),\n  ...['authorization', 'accesstoken', 'refreshtoken', 'authtoken', 'sessionid', 'cookie', 'setcookie',\n    'password', 'apikey', 'clientsecret'].map(key => [key, 'credential']),\n]);\nconst TRACE_FIELDS = new Set(['traceid', 'spanid', 'requestid', 'correlationid']);\nconst DIAGNOSTIC_FIELDS = new Set([\n  'timestamp', 'service', 'level', 'event', 'route', 'status', 'statuscode', 'method', 'latencyms', 'queue', 'orderid',\n]);\nconst CONTAINER_FIELDS = new Set([\n  'actor', 'attributes', 'headers', 'http', 'delivery', 'contacts', 'customer', 'notifications', 'message',\n]);\nconst MARKS = Object.freeze({\n  email: '[邮箱已遮蔽]', phone: '[电话已遮蔽]', credential: '[凭据已遮蔽]', trace: '[链路标识已遮蔽]',\n});\n\nconst TEXT_PATTERNS = [\n  ['credential', /\\bBearer[ \\t]+[A-Za-z0-9._~+/=-]{8,}/gi],\n  ['email', /(?\u003c![A-Z0-9.!#$%&'*+/=?^_`{|}~-])[A-Z0-9.!#$%&'*+/=?^_`{|}~-]{1,64}@[A-Z0-9](?:[A-Z0-9-]{0,61}[A-Z0-9])?(?:\\.[A-Z0-9](?:[A-Z0-9-]{0,61}[A-Z0-9])?){1,10}(?![A-Z0-9-])/gi],\n  ['phone', /(?\u003c!\\d)(?:\\+1[ -])?(?:\\([2-9]\\d{2}\\)|[2-9]\\d{2})[ .-][2-9]\\d{2}[ .-]\\d{4}(?!\\d)|(?\u003c!\\d)(?:(?:\\+?86)[ -]?)?1[3-9]\\d{9}(?!\\d)/g],\n];\n\nfunction normalizedKey(key) {\n  return key.toLowerCase().replace(/[-_.]/g, '');\n}\n\nfunction normalizedPolicy(policy) {\n  if (!policy || typeof policy.scanText !== 'boolean' || typeof policy.preserveTrace !== 'boolean') {\n    throw new TypeError('规则需要指定正文扫描和链路保留选项。');\n  }\n  return { scanText: policy.scanText, preserveTrace: policy.preserveTrace };\n}\n\nfunction asPointer(parent, key) {\n  return `${parent}/${String(key).replaceAll('~', '~0').replaceAll('/', '~1')}`;\n}\n\nfunction pointerParts(pointer) {\n  return pointer.slice(1).split('/').map(key => key.replaceAll('~1', '/').replaceAll('~0', '~'));\n}\n\nfunction atPointer(record, pointer) {\n  let value = record;\n  for (const key of pointerParts(pointer)) {\n    if (value === null || typeof value !== 'object' || !Object.hasOwn(value, key)) return undefined;\n    value = value[key];\n  }\n  return value;\n}\n\nfunction isRecord(value) {\n  if (value === null || typeof value !== 'object') return false;\n  const prototype = Object.getPrototypeOf(value);\n  return prototype === Object.prototype || prototype === null;\n}\n\nfunction validateTree(value, depth = 0) {\n  if (depth > MAX_DEPTH) throw new RangeError(`字段嵌套超过 ${MAX_DEPTH} 层。`);\n  if (Array.isArray(value) || isRecord(value)) {\n    for (const child of Object.values(value)) validateTree(child, depth + 1);\n    return;\n  }\n  if (value !== null && typeof value !== 'string' && typeof value !== 'boolean' && !Number.isFinite(value)) {\n    throw new TypeError('字段包含无效的 JSON 值。');\n  }\n  if (Number.isInteger(value) && !Number.isSafeInteger(value)) {\n    throw new RangeError('整数超出安全精度，请把长编号写为字符串。');\n  }\n}\n\nexport function parseJsonl(text) {\n  if (typeof text !== 'string') throw new TypeError('请选择 UTF-8 文本。');\n  if (new TextEncoder().encode(text).byteLength > MAX_INPUT_BYTES) throw new RangeError('文件超过 1 MiB。');\n  const records = [];\n  for (const [index, line] of text.replace(/^\\uFEFF/, '').split(/\\r?\\n/).entries()) {\n    const content = line.trim();\n    if (!content) continue;\n    if (records.length >= MAX_ROWS) throw new RangeError(`第 ${index + 1} 行：最多处理 ${MAX_ROWS} 条记录。`);\n    let record;\n    try {\n      record = JSON.parse(content);\n    } catch {\n      throw new SyntaxError(`第 ${index + 1} 行：无法解析 JSON。`);\n    }\n    if (!isRecord(record)) throw new TypeError(`第 ${index + 1} 行：每行需要一个 JSON 对象。`);\n    try {\n      validateTree(record);\n    } catch (error) {\n      throw new TypeError(`第 ${index + 1} 行：${error.message}`);\n    }\n    records.push(record);\n  }\n  if (!records.length) throw new RangeError('文件中未找到日志记录。');\n  return records;\n}\n\nfunction hasValue(value) {\n  if (typeof value === 'string') return value.trim() !== '' && !Object.values(MARKS).includes(value);\n  if (Array.isArray(value)) return value.some(hasValue);\n  if (isRecord(value)) return Object.values(value).some(hasValue);\n  return value !== null;\n}\n\nfunction textReferences(value, path) {\n  return TEXT_PATTERNS.flatMap(([category, pattern]) =>\n    [...new Set(Array.from(value.matchAll(pattern), match => match[0]))].map(literal => ({\n      kind: 'sensitive', path, category, literal,\n    })),\n  );\n}\n\nfunction rewriteText(value) {\n  for (const [category, pattern] of TEXT_PATTERNS) value = value.replace(pattern, MARKS[category]);\n  return value;\n}\n\nfunction isCanonicalTrace(value, key) {\n  if (key === 'traceid') return /^(?!0{32}$)[a-f0-9]{32}$/i.test(value);\n  return key === 'spanid' && /^(?!0{16}$)[a-f0-9]{16}$/i.test(value);\n}\n\nfunction transform(value, policy, key = '') {\n  const normalized = normalizedKey(key);\n  const sensitive = FIELD_CATEGORIES.get(normalized);\n  if (sensitive && hasValue(value)) return MARKS[sensitive];\n  if (!policy.preserveTrace && TRACE_FIELDS.has(normalized) && hasValue(value)) return MARKS.trace;\n  if (Array.isArray(value)) return value.map(child => transform(child, policy));\n  if (isRecord(value)) {\n    return Object.fromEntries(Object.entries(value).map(([name, child]) => [name, transform(child, policy, name)]));\n  }\n  return typeof value === 'string' && policy.scanText && !isCanonicalTrace(value, normalized) ? rewriteText(value) : value;\n}\n\nfunction estimateReferences(record) {\n  const references = [];\n  function visit(value, path, key = '') {\n    const normalized = normalizedKey(key);\n    const category = FIELD_CATEGORIES.get(normalized);\n    if (category && hasValue(value)) {\n      references.push({ kind: 'sensitive', path, category });\n      return;\n    }\n    if (TRACE_FIELDS.has(normalized) && hasValue(value)) references.push({ kind: 'protected', path, category: 'trace' });\n    if (DIAGNOSTIC_FIELDS.has(normalized) && hasValue(value)) references.push({ kind: 'protected', path, category: 'diagnostic' });\n    if (typeof value === 'string' && !isCanonicalTrace(value, normalized)) references.push(...textReferences(value, path));\n    if (Array.isArray(value)) value.forEach((child, index) => visit(child, asPointer(path, index)));\n    if (isRecord(value)) {\n      for (const [name, child] of Object.entries(value)) {\n        const childPath = asPointer(path, name);\n        for (const reference of textReferences(name, childPath)) references.push({ ...reference, location: 'key' });\n        visit(child, childPath, name);\n      }\n    }\n  }\n  visit(record, '');\n  return references;\n}\n\nfunction sameValue(first, second) {\n  if (Object.is(first, second)) return true;\n  if (first === null || second === null || typeof first !== 'object' || typeof second !== 'object') return false;\n  return JSON.stringify(first) === JSON.stringify(second);\n}\n\nfunction evidence(reference, source, redacted, scanText) {\n  const { kind, path: sourcePath, category, literal, location } = reference;\n  const after = atPointer(redacted, sourcePath);\n  const before = atPointer(source, sourcePath);\n  const path = pointerParts(sourcePath).reduce((prefix, part) =>\n    asPointer(prefix, textReferences(part, '').length ? '[敏感键]' : part), '');\n  if (kind === 'protected' && !sameValue(before, after)) {\n    return { kind: 'overmask', path, category, reason: '这项排障信息在输出中被改写或遮蔽。' };\n  }\n  if (location === 'key') {\n    return after === undefined ? null : { kind: 'leak', path, category, reason: '敏感内容出现在字段名称中，需要先修正日志结构。' };\n  }\n  const retained = literal === undefined\n    ? after !== undefined && after !== null && !Object.values(MARKS).includes(after)\n    : typeof after === 'string' && after.includes(literal);\n  if (kind === 'sensitive' && retained) {\n    const reason = literal !== undefined && !scanText ? '未启用正文扫描，字符串中的敏感值仍留在输出中。' : '输出中仍能找到此敏感字段或值。';\n    return { kind: 'leak', path, category, reason };\n  }\n  return null;\n}\n\nfunction validateAnnotation(reference, source, index) {\n  const { kind, path, category, literal } = reference ?? {};\n  const sourceValue = typeof path === 'string' && /^(?:\\/(?:[^~/]|~[01])*)+$/.test(path) ? atPointer(source, path) : undefined;\n  const supported = kind === 'sensitive' && ['email', 'phone', 'credential'].includes(category)\n    || kind === 'protected' && ['trace', 'diagnostic'].includes(category);\n  const validLiteral = literal === undefined || kind === 'sensitive' && typeof literal === 'string'\n    && literal.length > 0 && typeof sourceValue === 'string' && sourceValue.includes(literal);\n  if (!supported || sourceValue === undefined || !hasValue(sourceValue) || !validLiteral) {\n    throw new TypeError(`第 ${index + 1} 条记录包含无效标注。`);\n  }\n}\n\nexport function analyze(records, { policy = CANDIDATE, annotations } = {}) {\n  const active = normalizedPolicy(policy);\n  if (!Array.isArray(records) || !records.length || records.length > MAX_ROWS) {\n    throw new RangeError(`需要 1 至 ${MAX_ROWS} 条日志记录。`);\n  }\n  const labeled = annotations !== undefined;\n  if (labeled && (!Array.isArray(annotations) || annotations.length !== records.length || annotations.some(row => !Array.isArray(row)))) {\n    throw new TypeError('标注批次与日志记录不匹配。');\n  }\n  const totals = { rows: records.length, sensitive: 0, protected: 0, leaks: 0, overmasks: 0, changed: 0 };\n  const rows = records.map((source, index) => {\n    if (!isRecord(source)) throw new TypeError(`第 ${index + 1} 条记录需要一个 JSON 对象。`);\n    validateTree(source);\n    const redacted = transform(source, active);\n    const references = labeled ? annotations[index] : estimateReferences(source);\n    const findings = [];\n    for (const reference of references) {\n      if (labeled) validateAnnotation(reference, source, index);\n      if (reference.kind === 'sensitive') totals.sensitive++;\n      else totals.protected++;\n      const finding = evidence(reference, source, redacted, active.scanText);\n      if (!finding) continue;\n      findings.push(finding);\n      if (finding.kind === 'leak') totals.leaks++;\n      else totals.overmasks++;\n    }\n    if (!sameValue(source, redacted)) totals.changed++;\n    return {\n      id: `L${String(index + 1).padStart(3, '0')}`,\n      service: typeof source.service === 'string' && source.service.trim() ? source.service : '未标注服务',\n      source, redacted, findings,\n    };\n  });\n  return { rows, totals, gate: { labeled, allowed: totals.leaks === 0 && totals.overmasks === 0 }, policy: active };\n}\n\nfunction safePath(path, source) {\n  let parent = source;\n  return pointerParts(path).map(part => {\n    const key = normalizedKey(part);\n    const known = FIELD_CATEGORIES.has(key) || TRACE_FIELDS.has(key) || DIAGNOSTIC_FIELDS.has(key) || CONTAINER_FIELDS.has(key);\n    const safePart = Array.isArray(parent) && /^\\d{1,6}$/.test(part) ? part : known ? key : '*';\n    parent = parent !== null && typeof parent === 'object' && Object.hasOwn(parent, part) ? parent[part] : undefined;\n    return safePart;\n  }).reduce(asPointer, '');\n}\n\nexport function createSummary(result) {\n  const { rows, totals, gate, policy } = result;\n  const findings = rows.flatMap(({ id, source, findings: entries }) => entries.map(finding => ({\n    ...finding, id, path: gate.labeled ? finding.path : safePath(finding.path, source),\n  })));\n  return { totals: { ...totals }, gate: { ...gate }, policy: { ...policy }, findings };\n}\n\nexport function exportJsonl(result, { confirmUnlabeled = false } = {}) {\n  if (!result.gate.allowed) throw new Error('仍有漏遮或误遮，无法导出处理后的日志。');\n  if (!result.gate.labeled && confirmUnlabeled !== true) throw new Error('请先确认已人工检查导入日志的脱敏结果。');\n  return result.rows.map(({ redacted }) => JSON.stringify(redacted)).join('\\n') + '\\n';\n}\n","group":"后端"},{"path":"fixtures.mjs","text":"const SAMPLE_EMAIL = 'member-204@updates.example';\nconst SAMPLE_PHONE = '+1 202-555-0142';\nconst SAMPLE_BEARER = 'Bearer DEMO_ONLY_DO_NOT_USE_9e217416';\n\nfunction record(minute, service, level, event, extras) {\n  return {\n    timestamp: `2026-11-28T02:${String(minute).padStart(2, '0')}:00.000Z`,\n    level,\n    service,\n    event,\n    trace_id: `${'0'.repeat(30)}${minute.toString(16).padStart(2, '0')}`,\n    ...extras,\n  };\n}\n\nexport const SAMPLE_RECORDS = [\n  record(1, 'identity-gateway', 'INFO', 'profile.updated', {\n    message: '账户偏好已保存。', actor: { email: 'profile-sample@identity.example' }, http: { method: 'PATCH', status: 204 },\n  }),\n  record(3, 'notification-job', 'WARN', 'email.delivery_retry', {\n    message: `由供应商暂存，计划重发给 ${SAMPLE_EMAIL}。`, latency_ms: 830,\n  }),\n  record(4, 'identity-gateway', 'WARN', 'session.refresh_denied', {\n    message: '会话刷新返回拒绝。', headers: { authorization: 'Bearer DEMO_ONLY_DO_NOT_USE_04auth' }, http: { status: 401 },\n  }),\n  record(6, 'fulfillment-api', 'INFO', 'courier.callback_scheduled', {\n    message: `承运商将回拨 ${SAMPLE_PHONE} 确认交付。`, queue: 'delivery-followup',\n  }),\n  record(9, 'fulfillment-api', 'INFO', 'shipment.assigned', {\n    message: '包裹已分给待取班次。', delivery: { contacts: [{ kind: 'recipient', phone: '+1 202-555-0173' }] },\n    order_id: 'DEMO-ORD-6089',\n  }),\n  record(10, 'order-api', 'ERROR', 'invoice.gateway_timeout', {\n    message: '开票服务超时，待重试。', http: { method: 'POST', status: 504 },\n  }),\n  record(12, 'identity-gateway', 'INFO', 'session.revoked', {\n    message: '会话已失效。', headers: { cookie: 'demo_session=DEMO_ONLY_DO_NOT_USE_12cookie' }, http: { status: 204 },\n  }),\n  record(14, 'order-api', 'INFO', 'order.summary_viewed', {\n    message: '读取订单摘要。', attributes: { request_id: 'DEMO-REQUEST-0048' }, route: '/orders/:id/summary',\n  }),\n  record(17, 'notification-job', 'ERROR', 'push.provider_rejected', {\n    message: `模拟供应商拒绝授权 ${SAMPLE_BEARER}，已触发重试。`, latency_ms: 320,\n  }),\n  record(18, 'order-api', 'INFO', 'receipt.requested', {\n    message: '收据申请受理。', attributes: { customer: { email: 'receipt-sample@billing.example' } }, status: 'accepted',\n  }),\n  record(20, 'notification-job', 'INFO', 'push.destination_added', {\n    message: '通知端点已标记。', notifications: [{ channel: 'push', access_token: 'DEMO_ONLY_DO_NOT_USE_20push' }],\n  }),\n  record(22, 'fulfillment-api', 'INFO', 'delivery.completed', {\n    message: '包裹送达事件已受理。', http: { status: 202 },\n  }),\n];\n\nconst sensitive = (path, category, literal) => ({ kind: 'sensitive', path, category, literal });\nconst diagnostic = path => ({ kind: 'protected', path, category: 'diagnostic' });\nconst trace = (path = '/trace_id') => ({ kind: 'protected', path, category: 'trace' });\n\n// 每行固定标注独立于脱敏规则。正文中的标注仅覆盖敏感片段，保留其余句子。\nexport const SAMPLE_ANNOTATIONS = [\n  [trace(), diagnostic('/http/status'), sensitive('/actor/email', 'email')],\n  [trace(), diagnostic('/latency_ms'), sensitive('/message', 'email', SAMPLE_EMAIL)],\n  [trace(), diagnostic('/http/status'), sensitive('/headers/authorization', 'credential')],\n  [trace(), diagnostic('/queue'), sensitive('/message', 'phone', SAMPLE_PHONE)],\n  [trace(), diagnostic('/order_id'), sensitive('/delivery/contacts/0/phone', 'phone')],\n  [trace(), diagnostic('/http/status')],\n  [trace(), diagnostic('/http/status'), sensitive('/headers/cookie', 'credential')],\n  [trace(), trace('/attributes/request_id'), diagnostic('/route')],\n  [trace(), diagnostic('/latency_ms'), sensitive('/message', 'credential', SAMPLE_BEARER)],\n  [trace(), diagnostic('/status'), sensitive('/attributes/customer/email', 'email')],\n  [trace(), diagnostic('/event'), sensitive('/notifications/0/access_token', 'credential')],\n  [trace(), diagnostic('/http/status')],\n];\n","group":"数据与样例"},{"path":"package.json","text":"{\n  \"name\": \"log-privacy-review\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": { \"node\": \">=22\" },\n  \"scripts\": {\n    \"test\": \"node --test tests/*.test.mjs\",\n    \"build\": \"node build.mjs\",\n    \"review\": \"node cli.mjs --demo --compare\"\n  }\n}\n","group":"配置与启动"},{"path":"static/app.mjs","text":"import {\n  BASELINE, CANDIDATE, MAX_INPUT_BYTES, analyze, createSummary, exportJsonl, parseJsonl,\n} from '../engine.mjs';\nimport { SAMPLE_ANNOTATIONS, SAMPLE_RECORDS } from '../fixtures.mjs';\n\nconst byId = id => document.getElementById(id);\nconst PAGE_SIZE = 5;\nconst CODE_LIMIT = 400;\nconst LABELS = { leak: '漏遮', overmask: '误遮', fixed: '已修正' };\nconst CATEGORY = { email: '邮箱', phone: '电话号码', credential: '认证凭据', trace: '链路标识', diagnostic: '排障字段' };\nconst POLICY_NAMES = { baseline: '基线规则', candidate: '候选规则' };\nconst state = {\n  records: SAMPLE_RECORDS, annotations: SAMPLE_ANNOTATIONS, filename: '服务链路抽检.jsonl',\n  view: new URLSearchParams(location.search).get('view') === 'baseline' ? 'baseline' : 'candidate',\n  filter: 'all', page: 0, selected: '', activeFinding: 0, fullRecord: false, confirmed: false, reading: 0,\n  baseline: null, candidate: null,\n};\n\nfunction element(tag, className, text) {\n  const node = document.createElement(tag);\n  if (className) node.className = className;\n  if (text !== undefined) node.textContent = text;\n  return node;\n}\n\nfunction button(className, text) {\n  const node = element('button', className, text);\n  node.type = 'button';\n  return node;\n}\n\nfunction selectedResult() {\n  return state[state.view];\n}\n\nfunction getPolicy() {\n  return { scanText: byId('scan-text').checked, preserveTrace: byId('preserve-trace').checked };\n}\n\nfunction notice(text = '', tone = 'success') {\n  const node = byId('notice');\n  node.dataset.tone = tone;\n  node.textContent = text;\n  node.hidden = !text;\n}\n\nfunction recalculate() {\n  const options = { annotations: state.annotations };\n  state.baseline = analyze(state.records, { ...options, policy: BASELINE });\n  state.candidate = analyze(state.records, { ...options, policy: getPolicy() });\n}\n\nfunction countLabel(total) {\n  return state.candidate.gate.labeled ? `${total} 条日志 · 已人工标注的演示批次` : `${total} 条日志 · 本页文件 · 规则推测`;\n}\n\nfunction renderSummary() {\n  byId('batch-name').textContent = state.filename;\n  byId('batch-info').textContent = countLabel(state.candidate.totals.rows);\n  const cards = ['baseline', 'candidate'].map(type => {\n    const { totals } = state[type];\n    const card = button('policy-card');\n    card.dataset.policy = type;\n    card.setAttribute('aria-pressed', String(type === state.view));\n    const title = element('span', 'policy-title', POLICY_NAMES[type]);\n    const stats = element('span', 'stats');\n    for (const [metric, label, tone] of [['leaks', '漏遮', 'leak'], ['overmasks', '误遮', 'overmask']]) {\n      const stat = element('span', 'stat');\n      const data = element('span', 'stat-data');\n      data.append(element('strong', totals[metric] ? tone : 'lift', totals[metric]), document.createTextNode(label));\n      stat.append(data);\n      stats.append(stat);\n    }\n    card.append(title, stats);\n    return card;\n  });\n  const hadFocus = document.activeElement?.classList.contains('policy-card');\n  byId('policy-totals').replaceChildren(...cards);\n  if (hadFocus) cards.find(card => card.dataset.policy === state.view)?.focus();\n  document.querySelectorAll('.tabs [data-policy]').forEach(tab => {\n    tab.setAttribute('aria-pressed', String(tab.dataset.policy === state.view));\n  });\n}\n\nfunction renderGate() {\n  const { gate, totals } = state.candidate;\n  const area = byId('export-gate');\n  const eligible = gate.allowed && (gate.labeled || state.confirmed);\n  area.dataset.tone = !gate.allowed ? 'blocked' : eligible ? 'pass' : 'pending';\n  byId('gate-title').textContent = !gate.allowed ? '候选暂缓导出' : eligible ? '候选可导出' : '候选待人工复核';\n  if (!gate.allowed) {\n    byId('gate-reason').textContent = `候选规则还有 ${totals.leaks} 项漏遮、${totals.overmasks} 项误遮。调整规则后可重新检查。`;\n  } else if (gate.labeled) {\n    byId('gate-reason').textContent = `${totals.sensitive} 项敏感值已处理，${totals.protected} 项排障字段保留。`;\n  } else {\n    byId('gate-reason').textContent = '导入日志缺少人工标注。逐条核对候选结果后再导出。';\n  }\n  byId('confirm-control').hidden = gate.labeled;\n  byId('confirm-review').checked = state.confirmed;\n  byId('confirm-review').disabled = !gate.allowed;\n  byId('export-logs').disabled = !eligible;\n  byId('export-report').disabled = false;\n}\n\nfunction baselineFindings(row) {\n  return state.baseline.rows[Number(row.id.slice(1)) - 1].findings;\n}\n\nfunction resolvedFindings(row) {\n  if (state.view === 'baseline') return [];\n  return baselineFindings(row).filter(old => !row.findings.some(next =>\n    old.kind === next.kind && old.path === next.path && old.category === next.category));\n}\n\nfunction status(row) {\n  if (row.findings.some(finding => finding.kind === 'leak')) return { tone: 'leak', name: '仍有漏遮' };\n  if (row.findings.length) return { tone: 'overmask', name: '排障字段误遮' };\n  if (resolvedFindings(row).length) return { tone: 'lift', name: '风险已修正' };\n  return { tone: 'clear', name: '当前未发现问题' };\n}\n\nfunction matchingRows(filter) {\n  const { rows } = selectedResult();\n  if (filter === 'all') return rows;\n  if (filter === 'fixed') return rows.filter(row => resolvedFindings(row).length > 0 && !row.findings.length);\n  return rows.filter(row => row.findings.some(finding => finding.kind === filter));\n}\n\nfunction renderFilters() {\n  const filters = [['all', '全部记录'], ['leak', '存在漏遮'], ['overmask', '存在误遮'], ['fixed', '已修正']];\n  const previouslyFocused = document.activeElement?.dataset.filter;\n  const nodes = filters.filter(([key]) => key !== 'fixed' || state.view === 'candidate').map(([key, label]) => {\n    const control = button('filter', label);\n    control.dataset.filter = key;\n    control.setAttribute('aria-pressed', String(state.filter === key));\n    control.append(element('span', 'filter-count', matchingRows(key).length));\n    return control;\n  });\n  byId('filters').replaceChildren(...nodes);\n  if (previouslyFocused) nodes.find(node => node.dataset.filter === previouslyFocused)?.focus();\n}\n\nfunction preferredRow(rows) {\n  return rows.find(row => row.findings.some(finding => finding.kind === 'leak'))\n    || rows.find(row => resolvedFindings(row).some(finding => finding.kind === 'leak'))\n    || rows[0];\n}\n\nfunction recordTime(row) {\n  const stamp = row.source.timestamp;\n  if (typeof stamp !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}T.*(?:Z|[+-]\\d{2}:\\d{2})$/.test(stamp)) return '';\n  const instant = Date.parse(stamp);\n  return Number.isFinite(instant) ? `${new Date(instant).toISOString().slice(11, 16)} UTC` : '';\n}\n\nfunction rowNode(row) {\n  const tr = element('tr', row.id === state.selected ? 'selected' : '');\n  tr.dataset.record = row.id;\n  const open = button('record-open', row.id);\n  open.setAttribute('aria-pressed', String(row.id === state.selected));\n  open.setAttribute('aria-controls', 'record-detail');\n  const reference = element('td');\n  reference.append(open, element('span', 'record-time', recordTime(row)));\n  const service = element('td');\n  service.append(element('span', 'record-service', row.service));\n  if (typeof row.source.event === 'string') service.append(element('span', 'record-event', row.source.event));\n  const level = element('td');\n  const name = typeof row.source.level === 'string' ? row.source.level.toUpperCase() : '—';\n  const levelTag = element('span', 'record-level', name);\n  levelTag.dataset.level = name;\n  level.append(levelTag);\n  const conclusion = element('td');\n  const summary = status(row);\n  const tag = element('span', 'verdict', summary.name);\n  tag.dataset.tone = summary.tone;\n  conclusion.append(tag);\n  tr.append(reference, service, level, conclusion);\n  return tr;\n}\n\nfunction renderRows({ choose = false } = {}) {\n  const matches = matchingRows(state.filter);\n  if (choose) {\n    const row = preferredRow(matches);\n    state.selected = row?.id ?? '';\n    state.page = row ? Math.floor(matches.indexOf(row) / PAGE_SIZE) : 0;\n    state.activeFinding = 0;\n    state.fullRecord = false;\n  }\n  const first = state.page * PAGE_SIZE;\n  const items = matches.slice(first, first + PAGE_SIZE);\n  if (items.length > 0 && !items.some(row => row.id === state.selected)) {\n    state.selected = preferredRow(items).id;\n    state.activeFinding = 0;\n    state.fullRecord = false;\n  }\n  const activeRecord = document.activeElement?.closest('[data-record]')?.dataset.record;\n  const rows = items.map(rowNode);\n  byId('record-list').replaceChildren(...rows);\n  if (activeRecord) rows.find(row => row.dataset.record === activeRecord)?.querySelector('button')?.focus();\n  byId('empty-records').hidden = items.length > 0;\n  byId('pagination').hidden = matches.length \u003c= PAGE_SIZE;\n  byId('record-range').textContent = `${first + 1}–${Math.min(first + PAGE_SIZE, matches.length)} / ${matches.length} 条`;\n  byId('previous-page').disabled = state.page \u003c= 0;\n  byId('next-page').disabled = first + PAGE_SIZE >= matches.length;\n  renderDetail(items.find(row => row.id === state.selected));\n}\n\nconst pointerSegment = segment => String(segment).replaceAll('~', '~0').replaceAll('/', '~1');\n\nfunction codeModel(value) {\n  const lines = [];\n  const entries = new Map();\n  function walk(value, path = '', key, depth = 0, comma = '') {\n    const offset = '  '.repeat(depth);\n    const property = key === undefined ? '' : JSON.stringify(key);\n    if (value && typeof value === 'object') {\n      const array = Array.isArray(value);\n      const [open, close] = array ? ['[', ']'] : ['{', '}'];\n      const children = Object.entries(value);\n      const remainder = children.length ? open : open + close + comma;\n      entries.set(path, open + close);\n      lines.push({ path, offset, property, content: remainder });\n      children.forEach(([child, item], index) => walk(item, `${path}/${pointerSegment(child)}`,\n        array ? undefined : child, depth + 1, index === children.length - 1 ? '' : ','));\n      if (children.length) lines.push({ offset, content: close + comma });\n      return;\n    }\n    const content = JSON.stringify(value);\n    entries.set(path, content);\n    lines.push({ path, offset, property, content, type: typeof value === 'string' ? 'json-string' : typeof value === 'number' ? 'json-number' : 'json-literal', comma });\n  }\n  walk(value);\n  return { lines, entries };\n}\n\nfunction changedPaths(before, after) {\n  const paths = new Set([...before.entries.keys(), ...after.entries.keys()]);\n  return [...paths].filter(path => before.entries.get(path) !== after.entries.get(path) && path !== '');\n}\n\nfunction renderCode(container, model, other, focus) {\n  const truncated = !state.fullRecord && model.lines.length > CODE_LIMIT;\n  const match = model.lines.findIndex(line => line.path === focus);\n  const start = truncated && match >= CODE_LIMIT ? Math.max(0, match - 4) : 0;\n  const visible = truncated ? model.lines.slice(start, start + CODE_LIMIT) : model.lines;\n  const lines = visible.map((line, index) => {\n    const item = element('div', 'code-line');\n    if (line.path && model.entries.get(line.path) !== other.entries.get(line.path)) item.classList.add('changed', 'marked');\n    if (focus && line.path === focus) item.classList.add('selected');\n    const indent = element('span', 'line-number', start + index + 1);\n    indent.setAttribute('aria-hidden', 'true');\n    const content = element('span', '', line.offset);\n    if (line.property) content.append(element('span', 'json-key', line.property), document.createTextNode(': '));\n    content.append(element('span', line.type, line.content));\n    if (line.comma) content.append(document.createTextNode(line.comma));\n    item.append(indent, content);\n    return item;\n  });\n  if (truncated) lines.push(element('div', 'truncation', `该记录共有 ${model.lines.length} 行，此处截取字段附近的内容。`));\n  container.replaceChildren(...lines);\n  container.scrollTop = 0;\n  const selected = container.querySelector('.selected');\n  container.scrollTop = selected ? Math.max(0, selected.getBoundingClientRect().top - container.getBoundingClientRect().top - 37) : 0;\n}\n\nfunction renderDetail(row) {\n  byId('record-detail').hidden = !row;\n  if (!row) return;\n  byId('detail-identity').textContent = `${row.id} · ${row.service}`;\n  byId('detail-rule').textContent = POLICY_NAMES[state.view];\n  const before = codeModel(row.source);\n  const after = codeModel(row.redacted);\n  const expand = byId('show-full-record');\n  expand.hidden = before.lines.length \u003c= CODE_LIMIT && after.lines.length \u003c= CODE_LIMIT;\n  expand.setAttribute('aria-pressed', String(state.fullRecord));\n  expand.textContent = state.fullRecord ? '收起完整记录' : '显示完整记录';\n  const changes = changedPaths(before, after);\n  const leakFirst = (left, right) => Number(right.kind === 'leak') - Number(left.kind === 'leak');\n  const evidence = [\n    ...[...row.findings].sort(leakFirst),\n    ...resolvedFindings(row).sort(leakFirst).map(finding => ({ ...finding, kind: 'fixed' })),\n  ];\n  if (evidence.length === 0) {\n    for (const path of changes.slice(0, 10)) evidence.push({ kind: 'changed', path, reason: '这一字段被当前规则修改。' });\n  }\n  const current = evidence[state.activeFinding] || evidence[0];\n  const focusPath = current?.path || '';\n  const nodes = evidence.map((finding, index) => {\n    const heading = [LABELS[finding.kind], CATEGORY[finding.category]].filter(Boolean).join(' · ') || '已脱敏';\n    const chip = button('finding', heading);\n    chip.dataset.finding = String(index);\n    chip.dataset.tone = finding.kind === 'fixed' || finding.kind === 'changed' ? 'lift' : finding.kind;\n    chip.setAttribute('aria-pressed', String(finding === current));\n    chip.append(document.createTextNode(' '), element('code', '', finding.path));\n    chip.addEventListener('click', () => {\n      state.activeFinding = index;\n      renderDetail(row);\n      byId('finding-list').querySelector(`[data-finding=\"${index}\"]`)?.focus();\n    });\n    return chip;\n  });\n  let explanation = current?.reason || '当前规则没有修改这条记录。';\n  if (current?.kind === 'fixed') {\n    explanation = current.category === 'trace' ? '候选规则已保留链路标识，可用于排障。' : '候选规则已遮蔽基线漏过的敏感值。';\n  }\n  nodes.push(element('p', 'evidence-note', explanation));\n  byId('finding-list').replaceChildren(...nodes);\n  renderCode(byId('original-log'), before, after, focusPath);\n  renderCode(byId('transformed-log'), after, before, focusPath);\n}\n\nfunction render(choose = false) {\n  renderSummary();\n  renderGate();\n  renderFilters();\n  renderRows({ choose });\n}\n\nfunction viewPolicy(event) {\n  const tab = event.target.closest('[data-policy]');\n  if (!tab || tab.dataset.policy === state.view) return;\n  state.view = tab.dataset.policy;\n  state.filter = 'all';\n  render(true);\n}\n\nfunction setOptions(policy) {\n  byId('scan-text').checked = policy.scanText;\n  byId('preserve-trace').checked = policy.preserveTrace;\n}\n\nfunction loadDataset(records, annotations, filename) {\n  state.records = records;\n  state.annotations = annotations;\n  state.filename = filename;\n  state.confirmed = false;\n  state.view = 'candidate';\n  state.filter = 'all';\n  setOptions(CANDIDATE);\n  recalculate();\n  render(true);\n}\n\nfunction resetDemo() {\n  state.reading += 1;\n  loadDataset(SAMPLE_RECORDS, SAMPLE_ANNOTATIONS, '服务链路抽检.jsonl');\n  notice('已重新载入演示批次。');\n}\n\nasync function importFile() {\n  const input = byId('file-input');\n  const file = input.files[0];\n  input.value = '';\n  if (!file) return;\n  const reading = ++state.reading;\n  try {\n    if (file.size > MAX_INPUT_BYTES) throw new Error('请选取不超过 1 MiB 的 JSONL 文件。');\n    const buffer = await file.arrayBuffer();\n    if (reading !== state.reading) return;\n    let contents;\n    try {\n      contents = new TextDecoder('utf-8', { fatal: true }).decode(buffer);\n    } catch {\n      throw new Error('文件需要使用 UTF-8 编码。');\n    }\n    const records = parseJsonl(contents);\n    loadDataset(records, undefined, file.name);\n    notice('日志已在当前页面读取。');\n  } catch (error) {\n    if (reading === state.reading) notice(error.message || '读取日志时发生错误。', 'warning');\n  }\n}\n\nfunction download(contents, type, name) {\n  const url = URL.createObjectURL(new Blob([contents], { type }));\n  const link = element('a');\n  link.href = url;\n  link.download = name;\n  document.body.append(link);\n  link.click();\n  link.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1_000);\n}\n\nfunction downloadLogs() {\n  try {\n    const logs = exportJsonl(state.candidate, { confirmUnlabeled: state.confirmed });\n    download(logs, 'application/x-ndjson;charset=utf-8', '脱敏结果.jsonl');\n    notice('已生成候选规则处理后的日志。');\n  } catch (error) {\n    notice(error.message, 'warning');\n  }\n}\n\nfunction downloadReport() {\n  const report = {\n    baseline: createSummary(state.baseline), candidate: createSummary(state.candidate),\n    reviewConfirmed: state.confirmed,\n  };\n  download(`${JSON.stringify(report, null, 2)}\\n`, 'application/json;charset=utf-8', '日志脱敏抽检报告.json');\n  notice('已生成抽检报告，仅含规则、计数和字段位置。');\n}\n\nbyId('policy-totals').addEventListener('click', viewPolicy);\ndocument.querySelector('.tabs').addEventListener('click', viewPolicy);\nbyId('filters').addEventListener('click', event => {\n  const control = event.target.closest('[data-filter]');\n  if (!control) return;\n  state.filter = control.dataset.filter;\n  renderFilters();\n  renderRows({ choose: true });\n});\nbyId('record-list').addEventListener('click', event => {\n  const target = event.target.closest('[data-record]');\n  if (!target) return;\n  state.selected = target.dataset.record;\n  state.activeFinding = 0;\n  state.fullRecord = false;\n  renderRows();\n});\nbyId('show-full-record').addEventListener('click', () => {\n  state.fullRecord = !state.fullRecord;\n  renderDetail(selectedResult().rows.find(row => row.id === state.selected));\n});\nbyId('previous-page').addEventListener('click', () => { state.page -= 1; renderRows(); });\nbyId('next-page').addEventListener('click', () => { state.page += 1; renderRows(); });\n\nfunction rulesChanged() {\n  state.confirmed = false;\n  state.view = 'candidate';\n  state.filter = 'all';\n  state.candidate = analyze(state.records, { annotations: state.annotations, policy: getPolicy() });\n  notice();\n  render(true);\n}\n\nbyId('scan-text').addEventListener('change', rulesChanged);\nbyId('preserve-trace').addEventListener('change', rulesChanged);\nbyId('confirm-review').addEventListener('change', event => { state.confirmed = event.target.checked; renderGate(); });\nbyId('reset-demo').addEventListener('click', resetDemo);\nbyId('import-file').addEventListener('click', () => byId('file-input').click());\nbyId('file-input').addEventListener('change', importFile);\nbyId('export-logs').addEventListener('click', downloadLogs);\nbyId('export-report').addEventListener('click', downloadReport);\n\nsetOptions(CANDIDATE);\nrecalculate();\nrender(true);\n","group":"前端"},{"path":"static/index.html","text":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#151b24\">\n  \u003cmeta name=\"description\" content=\"对照日志脱敏前后的字段，核对隐私漏遮与排障字段误遮。\">\n  \u003clink rel=\"icon\" href=\"data:,\">\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\">\n  \u003ctitle>日志隐私抽检台\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip\" href=\"#main\">跳到抽检工作区\u003c/a>\n  \u003cheader class=\"mast\">\n    \u003cdiv class=\"shell mast-inner\">\n      \u003ca href=\"./index.html\" class=\"brand\">\u003cspan class=\"brand-icon\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003c/span>\u003cspan>日志隐私抽检台\u003c/span>\u003c/a>\n      \u003cspan class=\"head-section\">规则验收\u003c/span>\n      \u003cspan class=\"local\">\u003cspan aria-hidden=\"true\">\u003c/span>仅在本机处理\u003c/span>\n    \u003c/div>\n  \u003c/header>\n  \u003cmain id=\"main\" class=\"shell\">\n    \u003cdiv class=\"intro\">\n      \u003cdiv class=\"intro-title\">\n        \u003ch1>日志脱敏抽检\u003c/h1>\n        \u003cp>对照原始日志与脱敏结果，检查敏感字段及排障线索。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"intro-actions\" aria-label=\"批次导出\">\n        \u003cbutton type=\"button\" class=\"button secondary\" id=\"export-report\" disabled>下载抽检报告 \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/button>\n        \u003cbutton type=\"button\" class=\"button primary\" id=\"export-logs\" disabled>导出候选日志 \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003csection class=\"batch-bar\" aria-label=\"正在抽检的日志批次\">\n      \u003cdiv class=\"batch-file\">\u003cspan class=\"file-icon\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003c/span>\u003cdiv>\u003ch2 id=\"batch-name\">正在读取样例\u003c/h2>\u003cp id=\"batch-info\">\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"batch-actions\">\n        \u003cbutton type=\"button\" id=\"reset-demo\" class=\"button quiet\">重载样例\u003c/button>\n        \u003cbutton type=\"button\" id=\"import-file\" class=\"button secondary\">\u003cspan aria-hidden=\"true\">↑\u003c/span> 导入本地日志\u003c/button>\n        \u003cinput type=\"file\" id=\"file-input\" accept=\".jsonl,.ndjson,.log,.txt,application/x-ndjson,text/plain\" hidden>\n      \u003c/div>\n    \u003c/section>\n    \u003cp class=\"notice\" id=\"notice\" aria-live=\"polite\" hidden>\u003c/p>\n\n    \u003cdiv class=\"layout\">\n      \u003caside class=\"sidebar\">\n        \u003csection class=\"panel rule-panel\" aria-labelledby=\"rules-heading\">\n          \u003cdiv class=\"panel-head\">\u003ch2 id=\"rules-heading\">对照规则\u003c/h2>\u003c/div>\n          \u003cdiv class=\"comparison\" id=\"policy-totals\">\u003c/div>\n          \u003cfieldset class=\"options\">\n            \u003clegend>调整候选规则\u003c/legend>\n            \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"scan-text\" checked>\u003cspan class=\"switch\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cstrong>检查消息文本\u003c/strong>\u003csmall>识别嵌在消息中的敏感值\u003c/small>\u003c/span>\u003c/label>\n            \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"preserve-trace\" checked>\u003cspan class=\"switch\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cstrong>保留链路标识\u003c/strong>\u003csmall>继续用 trace_id 查找上下游\u003c/small>\u003c/span>\u003c/label>\n          \u003c/fieldset>\n        \u003c/section>\n        \u003csection id=\"export-gate\" class=\"panel gate\" data-tone=\"pending\" aria-labelledby=\"gate-title\" aria-live=\"polite\">\n          \u003cspan class=\"gate-indicator\" aria-hidden=\"true\">\u003c/span>\n          \u003cdiv>\u003ch2 id=\"gate-title\">正在抽检\u003c/h2>\u003cp id=\"gate-reason\">\u003c/p>\u003c/div>\n          \u003clabel class=\"confirm\" id=\"confirm-control\" hidden>\u003cinput type=\"checkbox\" id=\"confirm-review\"> 我已人工复核候选结果\u003c/label>\n        \u003c/section>\n      \u003c/aside>\n\n      \u003csection class=\"panel review\" aria-labelledby=\"review-title\">\n        \u003cdiv class=\"panel-head review-head\">\n          \u003cdiv>\u003ch2 id=\"review-title\">抽检记录\u003c/h2>\u003cp id=\"review-description\">在列表中选一条日志查看字段变化。\u003c/p>\u003c/div>\n          \u003cdiv class=\"tabs\" role=\"group\" aria-label=\"当前预览规则\">\n            \u003cbutton type=\"button\" data-policy=\"baseline\" aria-pressed=\"false\">基线\u003c/button>\n            \u003cbutton type=\"button\" data-policy=\"candidate\" aria-pressed=\"true\">候选\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"filters\" id=\"filters\" role=\"group\" aria-label=\"按抽检结论筛选\">\u003c/div>\n        \u003cdiv class=\"table-frame\">\n          \u003ctable class=\"queue\">\n            \u003cthead>\u003ctr>\u003cth scope=\"col\">记录\u003c/th>\u003cth scope=\"col\">服务 / 事件\u003c/th>\u003cth scope=\"col\">级别\u003c/th>\u003cth scope=\"col\">当前结论\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody id=\"record-list\">\u003c/tbody>\n          \u003c/table>\n          \u003cp id=\"empty-records\" class=\"empty\" hidden>当前筛选下没有记录。\u003c/p>\n        \u003c/div>\n        \u003cnav id=\"pagination\" class=\"pagination\" aria-label=\"抽检记录分页\" hidden>\n          \u003cspan id=\"record-range\">\u003c/span>\n          \u003cbutton type=\"button\" class=\"button quiet\" id=\"previous-page\">上一页\u003c/button>\u003cbutton type=\"button\" class=\"button quiet\" id=\"next-page\">下一页\u003c/button>\n        \u003c/nav>\n        \u003csection class=\"detail\" id=\"record-detail\" aria-labelledby=\"detail-heading\" hidden>\n          \u003cdiv class=\"detail-head\">\n            \u003cdiv>\u003ch3 id=\"detail-heading\">字段对照\u003c/h3>\u003cp id=\"detail-identity\">\u003c/p>\u003c/div>\n            \u003cdiv class=\"detail-actions\">\n              \u003cbutton type=\"button\" id=\"show-full-record\" class=\"button quiet\" aria-pressed=\"false\" aria-controls=\"original-log transformed-log\" hidden>显示完整记录\u003c/button>\n              \u003cspan class=\"detail-rule\" id=\"detail-rule\">\u003c/span>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"evidence\" id=\"finding-list\">\u003c/div>\n          \u003cdiv class=\"code-grid\">\n            \u003csection class=\"code-panel\" aria-labelledby=\"original-heading\">\u003ch4 id=\"original-heading\">原始日志\u003c/h4>\u003cdiv class=\"code-content\" id=\"original-log\" tabindex=\"0\" role=\"region\" aria-label=\"原始日志内容\">\u003c/div>\u003c/section>\n            \u003csection class=\"code-panel\" aria-labelledby=\"transformed-heading\">\u003ch4 id=\"transformed-heading\">规则处理后\u003c/h4>\u003cdiv class=\"code-content\" id=\"transformed-log\" tabindex=\"0\" role=\"region\" aria-label=\"脱敏日志内容\">\u003c/div>\u003c/section>\n          \u003c/div>\n        \u003c/section>\n      \u003c/section>\n    \u003c/div>\n  \u003c/main>\n  \u003cnoscript>\u003cp class=\"shell\">抽检台需要 JavaScript 在当前页面处理日志。\u003c/p>\u003c/noscript>\n  \u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","group":"前端"},{"path":"static/styles.css","text":":root {\n  color-scheme: dark;\n  --page: #141a24;\n  --mast: #11161f;\n  --panel: #1a2330;\n  --panel-raised: #202b3a;\n  --panel-inset: #151d28;\n  --line: #354254;\n  --soft-line: #2d394a;\n  --ink: #eef2f5;\n  --mid: #b4c0ce;\n  --muted: #9aaabc;\n  --mint: #9ee6ba;\n  --mint-fill: #1f3b35;\n  --amber: #f2cc82;\n  --amber-fill: #3b3128;\n  --red: #f7aaab;\n  --red-fill: #412c37;\n  --blue: #a9c6e7;\n  --mono: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;\n  font: 14px/1.5 'Inter', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; min-width: 0; min-height: 100vh; background: var(--page); color: var(--ink); }\n[hid px; font-weight: 650; background: #232e3f; border-bottom: 1px solid var(--soft-line); }\n.code-content { min-width: 0; height: 183px; padding-block: 6px; overflow: auto; scrollbar-color: #5b6c84 #1a2532; font: 12px/1.48 var(--mono); }\n.code-content:focus-visible { outline-offset: -2px; }\n.code-line { display: grid; grid-template-columns: 27px minmax(0, 1fr); min-height: 18px; padding-right: 7px; color: #d3dce8; white-space: pre-wrap; overflow-wrap: anywhere; }\n.code-line.marked { background: #29394d; }\n.code-line.selected { background: #343443; border-left: 2px solid var(--amber); grid-template-columns: 25px minmax(0, 1fr); }\n.code-line.selected .json-number { color: #c9b596; }\n.code-line.selected .json-string { color: #f4cca0; }\n.code-line.changed .json-string { color: var(--mint); }\n.line-number { text-align: right; padding-right: 6px; color: #91a1b6; user-select: none; }\n.json-key { color: #a8c9e9; }\n.json-string { color: #c3dfbf; }\n.json-number, .json-literal { color: #d9b4e8; }\n.truncation { padding: 8px; color: var(--mid); }\n\n@media (max-width: 995px) {\n  .shell { width: calc(100% - 36px); }\n  .layout { grid-template-columns: minmax(230px, 253px) minmax(0, 1fr); gap: 12px; }\n  .queue td, .queue th { padding-inline: 8px; }\n  .queue th:first-child { width: 20%; }\n}\n\n@media (max-width: 780px) {\n  .layout { grid-template-columns: minmax(0, 1fr); }\n  .sidebar { grid-template-columns: minmax(0, 1fr) minmax(0, .68fr); align-items: start; }\n  .comparison { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .intro { align-items: start; }\n  .intro-actions { flex-wrap: wrap; justify-content: end; }\n  .stat + .stat { padding-left: 6px; }\n}\n\n@media (max-width: 555px) {\n  .shell { width: calc(100% - 24px); }\n  .mast-inner { min-height: 54px; }\n  .head-section { display: none; }\n  .brand { gap: 7px; font-size: 13px; }\n  .local { font-size: 11px; }\n  main { padding-top: 19px; }\n  .intro { flex-direction: column; gap: 11px; margin-bottom: 13px; }\n  .intro h1 { margin-bottom: 5px; }\n  .intro p { font-size: 12px; }\n  .intro-actions { width: 100%; justify-content: start; }\n  .intro-actions .button { flex: 1 1 112px; }\n  .batch-bar { flex-wrap: wrap; gap: 7px; margin-bottom: 12px; padding: 9px; }\n  .batch-actions { margin-left: auto; }\n  .batch-actions .button { min-height: 34px; padding-inline: 8px; font-size: 12px; }\n  .sidebar { grid-template-columns: minmax(0, 1fr); gap: 8px; }\n  .gate { grid-row: 1; }\n  .comparison { padding-inline: 10px; }\n  .options { margin: 10px; }\n  .panel-head { padding: 11px; }\n  .review-head p { display: none; }\n  .filters { padding: 0 9px 8px; }\n  .filter { gap: 3px; min-height: 28px; padding-inline: 5px; font-size: 11px; }\n  .queue td, .queue th { padding-inline: 5px; }\n  .queue th:first-child { width: 19%; }\n  .queue td:nth-child(3), .queue th:nth-child(3) { display: none; }\n  .queue th:last-child { width: 28%; }\n  .table-frame { margin-inline: 8px; }\n  .record-time, .record-event, .verdict { font-size: 11px; }\n  .record-service { font-size: 12px; }\n  .detail { padding: 9px 8px; }\n  .code-grid { grid-template-columns: minmax(0, 1fr); }\n  .code-content { height: 154px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { transition: none !important; }\n}\n","group":"前端"},{"path":"tests/cli.test.mjs","text":"import assert from 'node:assert/strict';\nimport { spawnSync } from 'node:child_process';\nimport { existsSync } from 'node:fs';\nimport { mkdtemp, readdir, readFile, rmdir, unlink, writeFile } from 'node:fs/promises';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';\nimport { test } from 'node:test';\nimport { fileURLToPath } from 'node:url';\nimport { MAX_INPUT_BYTES } from '../engine.mjs';\n\nconst cli = fileURLToPath(new URL('../cli.mjs', import.meta.url));\nconst originalContact = 'june-upload@review-fixture.example';\nconst row = {\n  timestamp: '2026-11-20T04:00:02.000Z', service: 'test-notifier', level: 'INFO',\n  trace_id: 'bf1622c5f0fab0bded98b741b8e8b8bb', email: originalContact,\n};\nconst input = JSON.stringify(row) + '\\n';\n\nfunction invoke(...args) {\n  const result = spawnSync(process.execPath, [cli, ...args], { encoding: 'utf8' });\n  assert.ifError(result.error);\n  assert.ok(!result.signal, result.signal);\n  return result;\n}\n\nasync function runInTemp(t, callback) {\n  const folder = await mkdtemp(join(tmpdir(), 'log-review-cli-'));\n  t.after(async () => {\n    for (const file of await readdir(folder)) await unlink(join(folder, file));\n    await rmdir(folder);\n  });\n  return callback(folder);\n}\n\ntest('demo comparison emits metadata with an allowed candidate and a blocked baseline', () => {\n  const result = invoke('--demo', '--compare');\n  assert.equal(result.status, 0, result.stderr);\n  const { baseline, selected } = JSON.parse(result.stdout);\n  assert.deepEqual(baseline.policy, { scanText: false, preserveTrace: false });\n  assert.deepEqual(selected.policy, { scanText: true, preserveTrace: true });\n  assert.equal(baseline.gate.allowed, false);\n  assert.equal(selected.gate.allowed, true);\n  assert.ok(baseline.totals.leaks > 0 && baseline.totals.overmasks > 0);\n  assert.equal(selected.totals.leaks + selected.totals.overmasks, 0);\n  for (const flag of ['--baseline', '--no-text', '--mask-trace']) {\n    const gated = invoke('--demo', flag);\n    assert.equal(gated.status, 2, gated.stderr);\n    assert.equal(JSON.parse(gated.stdout).gate.allowed, false);\n  }\n});\n\ntest('blocked demo cannot create an output file', async t => runInTemp(t, async folder => {\n  const out = join(folder, 'should-not-exist.jsonl');\n  const result = invoke('--demo', '--baseline', '--out', out);\n  assert.equal(result.status, 2, result.stderr);\n  assert.equal(existsSync(out), false);\n}));\n\ntest('an imported file requires confirmation and exports only transformed data', async t => runInTemp(t, async folder => {\n  const source = join(folder, 'test input.jsonl');\n  const out = join(folder, 'scrubbed output.jsonl');\n  await writeFile(source, input, 'utf8');\n\n  const pending = invoke('--input', source, '--out', out);\n  assert.equal(pending.status, 2);\n  assert.match(pending.stderr, /人工复核/);\n  assert.equal(JSON.parse(pending.stdout).gate.labeled, false);\n  assert.equal(existsSync(out), false);\n\n  const ready = invoke('--input', source, '--out', out, '--confirm-reviewed');\n  assert.equal(ready.status, 0, ready.stderr);\n  const report = JSON.parse(ready.stdout);\n  assert.equal(report.gate.labeled, false);\n  assert.equal(report.totals.rows, 1);\n  assert.ok(!ready.stdout.includes(originalContact));\n  assert.ok(!ready.stdout.includes(row.trace_id));\n  const output = await readFile(out, 'utf8');\n  assert.doesNotMatch(output, /june-upload/);\n  assert.equal(JSON.parse(output).trace_id, row.trace_id);\n  assert.equal(await readFile(source, 'utf8'), input);\n}));\n\ntest('CLI preserves existing files and keeps malformed input out of output', async t => runInTemp(t, async folder => {\n  const source = join(folder, 'events.jsonl');\n  await writeFile(source, input, 'utf8');\n  const sameFile = invoke('--input', source, '--out', source, '--confirm-reviewed');\n  assert.equal(sameFile.status, 1);\n  assert.match(sameFile.stderr, /已存在/);\n  assert.equal(await readFile(source, 'utf8'), input);\n\n  const bad = join(folder, 'malformed.jsonl');\n  const marker = 'INPUT_ROW_SHOULD_NOT_APPEAR';\n  await writeFile(bad, `${input}{\"email\":\"${marker}\"`, 'utf8');\n  const invalid = invoke('--input', bad, '--out', join(folder, 'should-not-exist.jsonl'), '--confirm-reviewed');\n  assert.equal(invalid.status, 1);\n  assert.equal(invalid.stdout, '');\n  assert.ok(!invalid.stderr.includes(marker));\n  assert.match(invalid.stderr, /2/);\n  assert.equal(existsSync(join(folder, 'should-not-exist.jsonl')), false);\n}));\n\ntest('CLI rejects oversized, invalid UTF-8 and unsupported arguments without reading rows', async t => runInTemp(t, async folder => {\n  const tooLarge = join(folder, 'too-large.jsonl');\n  await writeFile(tooLarge, Buffer.alloc(MAX_INPUT_BYTES + 1, 65));\n  const oversized = invoke('--input', tooLarge);\n  assert.equal(oversized.status, 1);\n  assert.equal(oversized.stdout, '');\n  assert.match(oversized.stderr, /字节/);\n\n  const badEncoding = join(folder, 'invalid-utf8.jsonl');\n  await writeFile(badEncoding, Buffer.from([0xfe, 0xff]));\n  const invalid = invoke('--input', badEncoding);\n  assert.equal(invalid.status, 1);\n  assert.equal(invalid.stdout, '');\n  assert.match(invalid.stderr, /UTF-8/);\n  assert.equal(invoke('--demo', '--input', badEncoding).status, 1);\n  assert.equal(invoke('--demo', '--unknown').status, 1);\n  assert.match(invoke('--help').stdout, /--confirm-reviewed/);\n}));\n","group":"验收测试"},{"path":"tests/engine.test.mjs","text":"import assert from 'node:assert/strict';\nimport { test } from 'node:test';\nimport { BASELINE, CANDIDATE, MAX_INPUT_BYTES, MAX_ROWS, analyze, createSummary, exportJsonl, parseJsonl } from '../engine.mjs';\nimport { SAMPLE_ANNOTATIONS, SAMPLE_RECORDS } from '../fixtures.mjs';\n\nconst sample = policy => analyze(SAMPLE_RECORDS, { policy, annotations: SAMPLE_ANNOTATIONS });\n\ntest('fixed annotations verify both misses and lost trace context in the baseline', () => {\n  const result = sample(BASELINE);\n  assert.deepEqual(result.totals, { rows: 12, sensitive: 9, protected: 25, leaks: 3, overmasks: 13, changed: 12 });\n  assert.deepEqual(result.gate, { allowed: false, labeled: true });\n  const findings = createSummary(result).findings;\n  assert.deepEqual(findings.filter(item => item.kind === 'leak').map(({ id, path }) => [id, path]), [\n    ['L002', '/message'], ['L004', '/message'], ['L009', '/message'],\n  ]);\n  assert.ok(findings.some(item => item.id === 'L008' && item.path === '/attributes/request_id'));\n  assert.throws(() => exportJsonl(result), /无法导出/);\n});\n\ntest('two rule switches independently control free-text misses and trace overmasking', () => {\n  const retainedTrace = sample({ scanText: false, preserveTrace: true }).totals;\n  assert.equal(retainedTrace.leaks, 3);\n  assert.equal(retainedTrace.overmasks, 0);\n  const inspectedText = sample({ scanText: true, preserveTrace: false }).totals;\n  assert.equal(inspectedText.leaks, 0);\n  assert.equal(inspectedText.overmasks, 13);\n});\n\ntest('candidate exports only transformed rows in original order with context preserved', () => {\n  const original = structuredClone(SAMPLE_RECORDS);\n  const result = sample(CANDIDATE);\n  assert.deepEqual(result.totals, { rows: 12, sensitive: 9, protected: 25, leaks: 0, overmasks: 0, changed: 9 });\n  assert.deepEqual(result.gate, { allowed: true, labeled: true });\n  const exported = exportJsonl(result);\n  const rows = parseJsonl(exported);\n  assert.deepEqual(rows.map(({ trace_id, event }) => [trace_id, event]), original.map(({ trace_id, event }) => [trace_id, event]));\n  assert.deepEqual(SAMPLE_RECORDS, original);\n  assert.equal(rows[1].message, '由供应商暂存，计划重发给 [邮箱已遮蔽]。');\n  assert.equal(rows[3].message, '承运商将回拨 [电话已遮蔽] 确认交付。');\n  assert.equal(rows[4].delivery.contacts[0].phone, '[电话已遮蔽]');\n  assert.equal(rows[5].http.status, 504);\n  assert.equal(rows[7].attributes.request_id, 'DEMO-REQUEST-0048');\n  assert.doesNotMatch(exported, /@.*\\.example|202-555-|DEMO_ONLY_DO_NOT_USE/);\n});\n\ntest('unlabeled imports require explicit review and summaries avoid arbitrary key names and values', () => {\n  const records = parseJsonl('\\uFEFF\\r\\n{\"attributes\":{\"sample-private-object\":{\"502851\":[{\"message\":\"联系 a@b.example。\"}]}}}\\n');\n  const baseline = analyze(records, { policy: BASELINE });\n  assert.equal(baseline.totals.leaks, 1);\n  assert.equal(baseline.rows[0].findings[0].path, '/attributes/sample-private-object/502851/0/message');\n  assert.equal(createSummary(baseline).findings[0].path, '/attributes/*/*/0/message');\n  assert.doesNotMatch(JSON.stringify(createSummary(baseline)), /a@b|sample-private-object|502851/);\n  assert.throws(() => exportJsonl(baseline, { confirmUnlabeled: true }), /无法导出/);\n\n  const candidate = analyze(records);\n  assert.deepEqual(candidate.gate, { allowed: true, labeled: false });\n  assert.throws(() => exportJsonl(candidate), /人工检查/);\n  assert.doesNotMatch(exportJsonl(candidate, { confirmUnlabeled: true }), /a@b/);\n});\n\ntest('canonical trace IDs stay readable and supported private values in keys block export', () => {\n  const trace = 'a'.repeat(10) + '13700138000' + 'b'.repeat(11);\n  const safe = analyze([{ trace_id: trace }]);\n  assert.equal(safe.rows[0].redacted.trace_id, trace);\n  assert.equal(safe.totals.sensitive, 0);\n\n  const input = parseJsonl('{\"attributes\":{\"test@reserved.example\":\"invalid attribute name\"},\"trace_id\":\"alias@reserved.example\"}');\n  const result = analyze(input);\n  assert.equal(result.totals.sensitive, 2);\n  assert.equal(result.totals.leaks, 1);\n  assert.equal(result.totals.overmasks, 1);\n  assert.ok(result.rows[0].findings.some(({ kind, path }) => kind === 'leak' && path === '/attributes/[敏感键]'));\n  assert.doesNotMatch(JSON.stringify(createSummary(result)), /reserved\\.example/);\n  assert.throws(() => exportJsonl(result, { confirmUnlabeled: true }), /无法导出/);\n});\n\ntest('parser rejects malformed or oversized data without echoing source and protects numeric identifiers', () => {\n  assert.throws(() => parseJsonl('\\n{\"password\":\"demo-sensitive-value\"'), error => {\n    assert.equal(error.message, '第 2 行：无法解析 JSON。');\n    return true;\n  });\n  assert.throws(() => parseJsonl('\\n[1,2]'), /第 2 行.*JSON 对象/);\n  assert.throws(() => parseJsonl('\\n{\"order_id\":9007199254740993}'), /第 2 行.*安全精度/);\n  assert.throws(() => parseJsonl('{\"value\":1e999}'), /无效的 JSON 值/);\n  assert.throws(() => parseJsonl('\\n\\n'), /未找到日志记录/);\n  assert.throws(() => parseJsonl('界'.repeat(1 + Math.floor(MAX_INPUT_BYTES / 3))), /1 MiB/);\n  assert.throws(() => parseJsonl('{}\\n'.repeat(MAX_ROWS + 1)), /最多处理 2000/);\n  assert.throws(() => parseJsonl('{\"field\":' + '['.repeat(25) + '0' + ']'.repeat(25) + '}'), /字段嵌套/);\n  assert.equal(parseJsonl('{\"order_id\":\"9007199254740993\"}')[0].order_id, '9007199254740993');\n});\n\ntest('large plain strings do not cause repeated address-range scans', () => {\n  const message = 'x'.repeat(MAX_INPUT_BYTES - 32);\n  const result = analyze(parseJsonl(JSON.stringify({ message })));\n  assert.equal(result.rows[0].redacted.message, message);\n  assert.equal(result.totals.changed, 0);\n});\n\ntest('prototype-named fields remain ordinary JSON properties', () => {\n  const records = parseJsonl('{\"__proto__\":{\"tokenState\":\"example\"},\"constructor\":{\"email\":\"a@b.example\"}}');\n  const result = analyze(records);\n  const output = result.rows[0].redacted;\n  assert.equal(Object.getPrototypeOf(output), Object.prototype);\n  assert.equal(output.__proto__.tokenState, 'example');\n  assert.equal(output.constructor.email, '[邮箱已遮蔽]');\n  assert.equal({}.tokenState, undefined);\n});\n\ntest('mismatched or invalid annotations cannot make a row look eligible', () => {\n  const records = [{ message: 'fixture contact a@b.example' }];\n  assert.throws(() => analyze(records, { annotations: [] }), /标注批次/);\n  assert.throws(() => analyze(records, { annotations: [[{ kind: 'sensitive', category: 'email', path: '/missing' }]] }), /无效标注/);\n  assert.throws(() => analyze(records, { annotations: [[{ kind: 'sensitive', category: 'email', path: '/message', literal: 'unrelated' }]] }), /无效标注/);\n});\n","group":"验收测试"}],"defaultFile":"engine.mjs"}</script>
