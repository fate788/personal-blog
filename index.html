    document.addEventListener("DOMContentLoaded", () => {
      const profile = window.blogGitHub?.profile || "";
      const account = /^https:\/\/github\.com\/([\w-]+)\/?$/i.exec(profile);
      if (!account) return;
      const link = document.getElementById("mast-github");
      link.href = profile;
      link.querySelector("b").textContent = "@" + account[1];
      link.hidden = false;
    });
