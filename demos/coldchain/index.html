<!doctype html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142f32">
  <meta name="description" content="用运输路单、温度遥测和异常证据复核冷链运输过程。">
  <title>冷链运输追溯台</title>
  <style>
:root {
  color-scheme: light;
  --background: #edf2f3;
  --surface: #fff;
  --surface-soft: #f6f9f9;
  --ink: #172d32;
  --muted: #536970;
  --line: #dce6e7;
  --line-strong: #cbdcdd;
  --teal: #12645e;
  --teal-dark: #14423f;
  --teal-soft: #e7f2ef;
  --warning: #8f450d;
  --warning-soft: #fff0df;
  --gap: #42516c;
  --gap-soft: #edf0f7;
  --radius: 14px;
  --shadow: 0 2px 3px #193c4208, 0 10px 30px #193c4206;
  font-family: Inter, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px;
  font-synthesis: none;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--ink); background: var(--background); line-height: 1.5; }
a { color: inherit; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .58; }
button, a, summary, input, textarea { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid #26948b; outline-offset: 3px; }
h1, h2, h3, p, dl, ol, figure { margin: 0; }
svg { display: block; }

.skip-link { position: fixed; top: -70px; left: 16px; z-index: 10; padding: 10px 16px; border-radius: 6px; color: white; background: var(--teal-dark); }
.skip-link:focus { top: 10px; }

.app-header { background: #142f32; color: #dceceb; border-bottom: 1px solid #285251; }
.app-header-inner { display: flex; align-items: center; gap: 20px; max-width: 1496px; min-height: 60px; margin-inline: auto; padding-inline: clamp(18px, 4vw, 50px); }
.brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 720; letter-spacing: .055em; color: #f4faf9; text-decoration: none; white-space: nowrap; }
.brand-symbol { display: inline-grid; width: 32px; height: 32px; place-content: center; position: relative; border: 1px solid #6aaea1; border-radius: 9px; background: linear-gradient(145deg, #2f645b, #193c3a); }
.brand-symbol i { position: absolute; top: calc(50% - 1px); left: 7px; width: 16px; height: 2px; background: #baeee0; border-radius: 5px; }
.brand-symbol i:nth-child(2) { transform: rotate(60deg); }
.brand-symbol i:nth-child(3) { transform: rotate(-60deg); }
.app-section { border-left: 1px solid #3c5758; padding-left: 18px; color: #adc4c5; font-size: 12px; white-space: nowrap; }
.environment { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; padding: 4px 10px; border: 1px solid #4a6766; border-radius: 22px; color: #d5ece7; font-size: 11px; }
.environment i { width: 6px; height: 6px; border-radius: 99px; background: #94d7bd; }

.workspace { max-width: 1496px; margin-inline: auto; padding: 27px clamp(18px, 4vw, 50px) 44px; }
.page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.page-heading h1 { color: #122d31; font-size: clamp(27px, 3vw, 37px); font-weight: 750; line-height: 1.22; letter-spacing: -.045em; }
.page-heading p { margin-top: 6px; color: var(--muted); font-size: 13px; }
.page-heading .timezone { font-size: 11px; white-space: nowrap; }
.timezone span { margin-left: 5px; font: 600 10px ui-monospace, monospace; padding: 2px 5px; background: #e1ebeb; border-radius: 4px; }
.notice { padding: 14px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.workspace-grid { display: grid; grid-template-columns: clamp(234px, 22vw, 304px) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.shipment-board { padding: 12px; }
.dock-image { position: relative; overflow: hidden; isolation: isolate; border-radius: 9px; color: white; background: #244548; }
.dock-image img { display: block; width: 100%; height: 112px; object-fit: cover; object-position: 50% 49%; }
.dock-image::after { content: ""; position: absolute; inset: 30% 0 0; background: linear-gradient(transparent, #102c30bd); pointer-events: none; }
.dock-image figcaption { position: absolute; bottom: 9px; left: 10px; z-index: 1; font-size: 11px; letter-spacing: .04em; }
.board-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 3px 11px; }
.board-title h2 { font-size: 15px; font-weight: 730; white-space: nowrap; }
.filter-menu { position: relative; }
.filter-menu summary, .raw-data summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; list-style: none; cursor: pointer; }
.filter-menu summary::-webkit-details-marker, .raw-data summary::-webkit-details-marker { display: none; }
.filter-menu summary { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.chevron { display: inline-block; width: 6px; height: 6px; margin: -3px 1px 0; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg); }
details[open] > summary .chevron { transform: rotate(225deg); margin-top: 3px; }
.filter-menu summary:hover, .filter-menu[open] summary { border-color: #8fb6b1; background: var(--surface-soft); color: var(--teal-dark); }
.filter-options { position: absolute; z-index: 3; top: calc(100% + 6px); right: 0; min-width: 130px; padding: 4px; border: 1px solid var(--line-strong); border-radius: 9px; background: #fff; box-shadow: 0 9px 22px #163c4124; }
.filter-options button { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: 5px; color: var(--ink); background: transparent; text-align: left; }
.filter-options button:hover, .filter-options button[aria-pressed="true"] { color: var(--teal-dark); background: var(--teal-soft); }
.shipment-list { display: grid; gap: 7px; }
.shipment { display: grid; gap: 7px; width: 100%; padding: 10px 9px 10px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; text-align: left; }
.shipment:hover { border-color: #99bdb9; background: #f9fbfb; }
.shipment[aria-pressed="true"] { border-color: #72a5a0; background: #edf6f4; box-shadow: inset 3px 0 #29766d; }
.shipment-line, .shipment-foot { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.shipment-ref, .trip-reference { color: var(--teal-dark); font: 700 11px ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .05em; }
.shipment-route { color: var(--ink); font-size: 12px; font-weight: 700; line-height: 1.5; }
.shipment-foot { color: var(--muted); font-size: 11px; }
.shipment-foot time { white-space: nowrap; font-variant-numeric: tabular-nums; }

.trip-workspace { display: grid; gap: 16px; min-width: 0; }
.trip-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 20px; }
.trip-title { min-width: 0; }
.trip-title-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.trip-title h2 { margin: 5px 0 3px; font-size: clamp(16px, 1.85vw, 24px); font-weight: 740; letter-spacing: -.035em; overflow-wrap: anywhere; }
.trip-meta { display: grid; gap: 2px; color: var(--muted); font-size: 12px; }
.trip-journey { color: #355d60; font-weight: 650; }
.trip-time-window { display: flex; flex: 0 0 auto; gap: clamp(12px, 2vw, 25px); padding-left: 16px; border-left: 1px solid var(--line); }
.trip-time-window dt { color: var(--muted); font-size: 11px; }
.trip-time-window dd { margin: 2px 0 0; white-space: nowrap; color: var(--ink); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; min-height: 20px; border-radius: 20px; color: var(--teal); background: var(--teal-soft); font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge::before { content: ""; width: 5px; height: 5px; flex: none; border-radius: 50%; background: currentColor; }
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.gap { background: var(--gap-soft); color: var(--gap); }
.badge.neutral { background: #eef2f2; color: #4d646a; }

.observations { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(205px, 1fr); gap: 16px; align-items: stretch; }
.panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 17px 11px; }
.panel-heading h2 { font-size: 17px; font-weight: 730; }
.panel-heading p { margin-top: 2px; color: var(--muted); font-size: 12px; }
.chart-legend { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px 10px; padding-top: 3px; color: var(--muted); font-size: 10px; }
.chart-legend span { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.chart-legend i { display: inline-block; width: 12px; height: 7px; border-radius: 2px; }
.chart-legend .legend-line { height: 2px; background: #16776d; }
.legend-band { border: 1px solid #98c6bb; background: #d9ede8; }
.legend-gap { border: 1px dashed #8190a9; background: #edf0f7; }
.stats { display: grid; grid-template-columns: 1.03fr 1fr 1.15fr; margin: 0 17px 5px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
.stat { min-width: 0; padding: 8px 9px 7px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat dt { color: var(--muted); font-size: 10px; letter-spacing: .015em; }
.stat dd { margin: 0; color: var(--ink); font-weight: 730; font-size: clamp(13px, 1.35vw, 19px); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat dd.warning { color: var(--warning); }
.stat dd.gap { color: var(--gap); }
.stat p { color: var(--muted); font-size: 10px; }
.chart-wrap { padding: 7px 15px 0 11px; }
#telemetry-chart { width: 100%; height: 190px; color: var(--muted); overflow: visible; }
#telemetry-chart text { font-size: 10px; font-weight: 600; fill: currentColor; }
#telemetry-chart .gap-caption { fill: #42516c; }
#telemetry-chart .warning-caption { fill: #8b4b20; }
.playback { margin: 2px 17px 14px; padding-top: 9px; border-top: 1px solid var(--line); }
.playback-top, .playback-controls { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
.playback-label { color: var(--ink); font-size: 12px; font-weight: 700; }
.playback output { color: var(--teal-dark); font: 700 12px ui-monospace, "Cascadia Mono", Consolas, monospace; }
.playback input[type="range"] { display: block; width: 100%; height: 24px; margin: 1px 0 4px; accent-color: #1b786f; cursor: ew-resize; }
.button-group { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-height: 29px; padding: 4px 8px; border: 1px solid transparent; border-radius: 6px; font-weight: 690; font-size: 11px; white-space: nowrap; }
.button-subtle { border-color: var(--line); color: #38545a; background: #fff; }
.button-subtle:hover:not(:disabled) { border-color: #9dbdb8; background: var(--surface-soft); }
.button-dark { border-color: #155751; color: #fff; background: #155751; }
.button-dark:hover:not(:disabled) { background: #237069; }
.button-jump { color: var(--teal-dark); background: var(--teal-soft); }
.button-jump:hover:not(:disabled) { background: #d7eae5; }
.button-jump span { margin-left: 2px; }

.route { display: flex; flex-direction: column; }
.route-heading { padding-bottom: 9px; }
.route-list { display: flex; flex: 1; flex-direction: column; gap: 0; min-width: 0; padding: 2px 14px 13px; list-style: none; }
.route-item { display: grid; grid-template-columns: 15px minmax(0, 1fr); gap: 5px; flex: 1; min-height: 44px; }
.route-mark { position: relative; display: grid; justify-items: center; align-content: start; min-height: 100%; }
.route-mark::before { content: ""; position: absolute; left: calc(50% - .5px); top: 18px; bottom: -12px; width: 1px; background: #c7dcdc; }
.route-item:last-child .route-mark::before { display: none; }
.route-mark::after { content: ""; z-index: 1; display: block; margin-top: 12px; width: 8px; height: 8px; border: 2px solid #5b948b; border-radius: 50%; background: var(--surface); }
.route-item.current .route-mark::after { background: #14695f; border-color: #14695f; box-shadow: 0 0 0 3px #d3ebe5; }
.route-item.missing .route-mark::after { border-style: dashed; border-color: #647596; border-radius: 2px; }
.route-item.future .route-mark::after { border-color: #a4b5b8; background: #f1f5f5; }
.route-item.future .route-mark::before { background: none; border-left: 1px dashed #a4b5b8; }
.route-link { display: block; width: 100%; padding: 6px 6px; border: 0; border-radius: 6px; color: inherit; background: none; text-align: left; }
.route-link:hover, .route-item.current .route-link { background: var(--surface-soft); }
.route-link span { display: flex; align-items: baseline; justify-content: space-between; gap: 5px; color: var(--ink); font-size: 12px; font-weight: 700; }
.route-link time { color: var(--teal-dark); font: 640 10px ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: nowrap; }
.route-link small { display: block; color: var(--muted); font-size: 10px; line-height: 1.4; }
.route-item.future .route-link span { color: var(--muted); }
.route-content { min-width: 0; padding-bottom: 4px; }
.route-observations { display: flex; flex-wrap: wrap; gap: 4px; margin: 1px 5px 4px; }
.door-reading { display: inline-flex; align-items: center; gap: 3px; min-height: 21px; padding: 1px 4px; border: 1px solid #eadccb; border-radius: 5px; color: #864d24; background: #fbf4eb; font-size: 10px; }
.door-reading time { font: 650 10px ui-monospace, "Cascadia Mono", Consolas, monospace; }
.door-reading:hover { border-color: #b88964; background: #faebd8; }

.investigation > .panel-heading { align-items: center; }
.count { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 20px; background: #eef3f3; color: #4b666a; font-size: 11px; white-space: nowrap; font-weight: 650; }
.incident-list { display: flex; align-items: stretch; flex-wrap: wrap; gap: 7px; padding: 0 17px; }
.incident-choice { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-width: 0; min-height: 34px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--surface); font-size: 11px; text-align: left; }
.incident-choice:hover, .incident-choice[aria-pressed="true"] { background: var(--surface-soft); border-color: #80aca7; }
.incident-choice[aria-pressed="true"] { box-shadow: inset 0 -2px #4a8b82; }
.incident-choice time, .evidence-list time { font: 650 11px ui-monospace, "Cascadia Mono", Consolas, monospace; }
.incident-empty { margin: 0 17px 16px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); color: var(--muted); font-size: 12px; }
.incident-detail { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 16px; padding: 15px 17px 17px; }
.incident-detail h3 { margin-bottom: 9px; font-size: 13px; font-weight: 730; }
.evidence { min-width: 0; }
.evidence-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
.evidence-summary dt { color: var(--muted); font-size: 10px; }
.evidence-summary dd { margin: 2px 0 0; color: var(--ink); font-size: 11px; font-weight: 660; overflow-wrap: anywhere; }
.evidence-summary .evidence-wide { grid-column: 1 / -1; }
.evidence-list { display: grid; gap: 5px; margin-top: 9px; padding: 0; list-style: none; }
.evidence-list li { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 11px; }
.evidence-list time { color: var(--teal-dark); }
.handoff { padding-left: 16px; border-left: 1px solid var(--line); }
.handoff fieldset { margin: 0 0 7px; padding: 0; min-width: 0; border: 0; }
.handoff legend, .note-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
.action-options { display: flex; flex-wrap: wrap; gap: 5px; }
.action-option { position: relative; cursor: pointer; }
.action-option input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.action-option span { display: block; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; color: #37555a; background: #fff; font-size: 11px; }
.action-option input:checked + span { color: var(--teal-dark); background: var(--teal-soft); border-color: #81a9a3; }
.action-option input:focus-visible + span { outline: 2px solid #26948b; outline-offset: 2px; }
.action-option:hover span { border-color: #81a9a3; }
.handoff textarea { display: block; width: 100%; padding: 7px 9px; resize: vertical; min-height: 51px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface-soft); color: var(--ink); font-size: 12px; }
.handoff textarea::placeholder { color: #60787e; }
.form-actions { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.form-actions p { color: var(--muted); font-size: 11px; }
.form-actions .error { color: #9b3916; }
.handoff-saved { padding: 11px; border: 1px solid #a3c7bc; border-radius: 8px; background: #f1f9f6; }
.handoff-saved strong { display: block; color: var(--teal-dark); font-size: 13px; }
.handoff-saved p { margin-top: 4px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
.handoff-saved time { display: block; margin-top: 6px; color: var(--muted); font-size: 10px; }

.raw-data summary { min-height: 45px; padding: 8px 17px; color: var(--ink); font-weight: 690; font-size: 13px; }
.raw-data .count { margin-left: 5px; }
.table-wrap { overflow: auto; max-height: 380px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; color: var(--ink); font-size: 12px; text-align: left; }
td, th { padding: 7px 10px; border-bottom: 1px solid var(--line); }
td:first-child, th:first-child { padding-left: 17px; }
th { position: sticky; top: 0; background: #edf3f3; font-weight: 690; }
td:first-child { font: 650 11px ui-monospace, "Cascadia Mono", Consolas, monospace; }
tbody tr:nth-child(even) { background: var(--surface-soft); }
.table-empty { color: var(--muted); text-align: center; }
.raw-tools { display: flex; justify-content: flex-end; padding: 8px 17px; border-top: 1px solid var(--line); }

@media (max-width: 1170px) {
  .observations { grid-template-columns: minmax(0, 1.75fr) minmax(188px, 1fr); gap: 13px; }
  .workspace-grid { gap: 15px; }
  .trip-header { padding-inline: 16px; }
}
@media (max-width: 960px) {
  .workspace { padding-top: 22px; }
  .observations { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 735px) {
  .workspace-grid { grid-template-columns: minmax(0, 1fr); }
  .shipment-board { display: grid; grid-template-columns: 126px minmax(0, 1fr); gap: 0 11px; }
  .dock-image { grid-row: 1 / span 2; min-height: 100%; }
  .dock-image img { height: 100%; min-height: 92px; position: absolute; inset: 0; }
  .dock-image figcaption { bottom: 7px; left: 7px; font-size: 10px; }
  .board-title { align-self: start; padding: 0 0 7px; }
  .shipment-list { grid-template-columns: repeat(3, minmax(140px, 1fr)); overflow-x: auto; padding: 3px 3px 5px; margin: -3px -3px -4px; scroll-snap-type: x proximity; }
  .shipment { scroll-snap-align: start; }
  .shipment-foot time { display: none; }
}
@media (max-width: 480px) {
  .workspace { padding: 20px 12px 28px; }
  .app-header-inner { padding-inline: 13px; min-height: 53px; gap: 10px; }
  .brand { gap: 8px; }
  .brand-symbol { width: 30px; height: 30px; }
  .app-section { display: none; }
  .page-heading { margin-bottom: 15px; }
  .page-heading .timezone { display: none; }
  .page-heading p { font-size: 11px; }
  .workspace-grid, .trip-workspace { gap: 12px; }
  .shipment-board { grid-template-columns: minmax(0, 1fr); padding: 8px; }
  .dock-image { display: none; }
  .board-title { padding: 1px 2px 7px; }
  .shipment-list { grid-template-columns: repeat(3, minmax(127px, 1fr)); }
  .shipment { padding: 7px; gap: 4px; }
  .shipment-ref { font-size: 10px; }
  .shipment .badge { padding: 1px 4px; min-height: 16px; font-size: 9px; }
  .shipment .badge::before { display: none; }
  .shipment-route { font-size: 11px; }
  .shipment-foot { font-size: 10px; }
  .trip-header { display: grid; gap: 8px; padding: 12px; }
  .trip-title h2 { margin-top: 4px; }
  .trip-time-window { padding: 6px 0 0; border-left: 0; border-top: 1px solid var(--line); }
  .observations { gap: 12px; }
  .panel-heading { padding: 13px 11px 9px; }
  .panel-heading h2 { font-size: 15px; }
  .panel-heading p { font-size: 11px; }
  .chart-legend { gap: 4px 7px; max-width: 122px; font-size: 9px; }
  .stats { margin-inline: 11px; }
  .stat { padding: 7px 5px; }
  .stat p { font-size: 9px; }
  .chart-wrap { padding-inline: 5px 9px; }
  #telemetry-chart { height: 172px; }
  .playback { margin-inline: 11px; margin-bottom: 11px; }
  .button-group { gap: 3px; }
  .button { padding-inline: 6px; }
  .route-list { padding-inline: 10px; }

<body>
  <a class="skip-link" href="#workspace">跳到运单工作区</a>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="./index.html" aria-label="冷链运输追溯台首页">
        <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>冷链追溯</span>
      </a>
      <span class="app-section">运输工作台</span>
      <span class="environment"><i></i><span id="environment-label">样例数据</span></span>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <header class="page-heading">
      <div>
        <h1>运输追溯</h1>
        <p>回放在途温度与交接记录，定位异常并登记处置。</p>
      </div>
      <p class="timezone">时间均为北京时间 <span>UTC+8</span></p>
    </header>

    <div class="notice" id="load-notice" role="status" hidden></div>
    <div class="workspace-grid">
      <aside class="shipment-board panel" aria-labelledby="shipment-title">
        <figure class="dock-image">
          <img src="./media/cold-dock.webp" alt="" width="1240" height="560" decoding="async">
          <figcaption>冷链运输 · 样例运单</figcaption>
        </figure>
        <div class="board-title">
          <h2 id="shipment-title">运单列表</h2>
          <details class="filter-menu" id="filter-menu">
            <summary><span id="filter-label">全部运单</span><span class="chevron" aria-hidden="true"></span></summary>
            <div class="filter-options" aria-label="运单状态">
              <button type="button" data-filter="all" aria-pressed="true">全部运单</button>
              <button type="button" data-filter="excursion" aria-pressed="false">温度超限</button>
              <button type="button" data-filter="normal" aria-pressed="false">全程正常</button>
              <button type="button" data-filter="gap" aria-pressed="false">采样缺失</button>
            </div>
          </details>
        </div>
        <div id="shipment-list" class="shipment-list" aria-label="选择运单"></div>
      </aside>

      <div class="trip-workspace" id="trip-workspace" hidden>
        <section class="trip-header panel" aria-labelledby="trip-name">
          <div class="trip-title">
            <div class="trip-title-meta">
              <span class="trip-reference" id="trip-reference"></span>
              <span id="trip-status"></span>
            </div>
            <h2 id="trip-name"></h2>
            <p class="trip-meta"><span class="trip-journey" id="trip-journey"></span><span id="trip-meta"></span></p>
          </div>
          <dl class="trip-time-window">
            <div><dt>发运时间</dt><dd id="trip-start"></dd></div>
            <div><dt>回放终点</dt><dd id="trip-end"></dd></div>
          </dl>
        </section>

        <div class="observations">
          <section class="telemetry panel" aria-labelledby="telemetry-title">
            <header class="panel-heading">
              <div><h2 id="telemetry-title">在途温度</h2><p id="chart-note"></p></div>
              <div class="chart-legend" aria-label="图例">
                <span><i class="legend-line"></i>实测</span>
                <span><i class="legend-band"></i>设定区间</span>
                <span><i class="legend-gap"></i>缺失</span>
              </div>
            </header>
            <div class="stats" id="telemetry-stats"></div>
            <div class="chart-wrap">
              <svg id="telemetry-chart" role="img" aria-label="运输温度曲线" preserveAspectRatio="none"></svg>
            </div>
            <div class="playback">
              <div class="playback-top">
                <label class="playback-label" for="cursor-input">运输回放</label>
                <output id="cursor-time" for="cursor-input"></output>
              </div>
              <input type="range" id="cursor-input" min="0" max="1" value="1" step="1">
              <div class="playback-controls">
                <div class="button-group">
                  <button type="button" class="button button-subtle" id="seek-start">起点</button>
                  <button type="button" class="button button-subtle" id="seek-prev" aria-label="后退一个采样周期">−</button>
                  <button type="button" class="button button-dark" id="play-toggle">回放</button>
                  <button type="button" class="button button-subtle" id="seek-next" aria-label="前进一个采样周期">+</button>
                  <button type="button" class="button button-subtle" id="seek-end">终点</button>
                </div>
                <button type="button" class="button button-jump" id="seek-incident">跳到异常 <span aria-hidden="true">↗</span></button>
              </div>
            </div>
          </section>
          <section class="route panel" aria-labelledby="route-title">
            <header class="panel-heading route-heading">
              <div><h2 id="route-title">运输节点</h2><p id="route-position"></p></div>
            </header>
            <ol class="route-list" id="route-list"></ol>
          </section>
        </div>

        <section class="investigation panel" aria-labelledby="investigation-title">
          <header class="panel-heading">
            <div><h2 id="investigation-title">异常与处置</h2><p>查看触发依据并保存交接决定。</p></div>
            <span class="count" id="incident-count"></span>
          </header>
          <div id="incident-list" class="incident-list" aria-label="选择异常"></div>
          <div class="incident-empty" id="incident-empty"></div>
          <div class="incident-detail" id="incident-detail" hidden>
            <section aria-labelledby="evidence-title" class="evidence">
              <h3 id="evidence-title">异常证据</h3>
              <dl id="evidence-summary" class="evidence-summary"></dl>
              <ol id="evidence-list" class="evidence-list"></ol>
            </section>
            <section class="handoff" aria-labelledby="handoff-title">
              <h3 id="handoff-title">交接处置</h3>
              <div id="handoff-record" role="status" hidden></div>
              <form id="handoff-form">
                <fieldset id="handoff-actions">
                  <legend>处置决定</legend>
                  <div class="action-options" id="action-options"></div>
                </fieldset>
                <label class="note-label" for="handoff-note">交接备注</label>
                <textarea id="handoff-note" rows="3" maxlength="240" required placeholder="写明隔离、核验或设备排查安排"></textarea>
                <div class="form-actions">
                  <button type="submit" class="button button-dark" id="handoff-save">保存处置</button>
                  <p id="handoff-message" role="status"></p>
                </div>
              </form>
            </section>
          </div>
        </section>

        <details class="raw-data panel" id="raw-data">
          <summary><span>遥测明细 <span class="count" id="raw-count"></span></span><span class="chevron" aria-hidden="true"></span></summary>
          <div class="table-wrap">
            <table>
              <thead><tr><th scope="col">采样时间</th><th scope="col">温度</th><th scope="col">采样位置</th><th scope="col">厢门</th></tr></thead>
              <tbody id="raw-table"></tbody>
            </table>
          </div>
          <div class="raw-tools"><button type="button" class="button button-subtle" id="download-readings">导出当前回放 CSV</button></div>
        </details>
      </div>
    </div>
  </main>
</body>
</html>
