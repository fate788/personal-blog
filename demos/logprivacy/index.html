<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">

  <style>
:root {
  color-scheme: dark;
  --page: #141a24;
  --mast: #11161f;
  --panel: #1a2330;
  --panel-raised: #202b3a;
  --panel-inset: #151d28;
  --line: #354254;
  --soft-line: #2d394a;
  --ink: #eef2f5;
  --mid: #b4c0ce;
  --muted: #9aaabc;
  --mint: #9ee6ba;
  --mint-fill: #1f3b35;
  --amber: #f2cc82;
  --amber-fill: #3b3128;
  --red: #f7aaab;
  --red-fill: #412c37;
  --blue: #a9c6e7;
  --mono: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
  font: 14px/1.5 'Inter', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 0; min-height: 100vh; background: var(--page); color: var(--ink); }
[hidden] { display: none !important; }
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
button, a, input, [tabindex] { outline-offset: 3px; }
:focus-visible { outline: 2px solid var(--mint); }
a { color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
button, a { -webkit-tap-highlight-color: transparent; }

.shell { width: min(1330px, calc(100% - 68px)); margin-inline: auto; }
.skip { position: absolute; inset: 10px auto auto 10px; z-index: 5; transform: translateY(-160%); padding: 8px 12px; background: var(--mint); color: var(--mast); border-radius: 6px; }
.skip:focus { transform: translateY(0); }
.mast { background: var(--mast); border-bottom: 1px solid var(--soft-line); }
.mast-inner { display: flex; align-items: center; min-height: 64px; gap: 18px; }
.brand { display: inline-flex; gap: 10px; align-items: center; font-weight: 750; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand:hover { color: var(--mint); }
.brand-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 8px; background: #20382f; border: 1px solid #507364; }
.brand-icon i { position: relative; width: 16px; height: 16px; background: linear-gradient(var(--mint), var(--mint)) center / 63% 1px no-repeat; }
.brand-icon i::before, .brand-icon i::after { content: ''; position: absolute; inset: 0; border: 1px solid var(--mint); border-radius: 3px; }
.brand-icon i::before { clip-path: polygon(0 0, 56% 0, 56% 25%, 25% 25%, 25% 56%, 0 56%); }
.brand-icon i::after { transform: rotate(180deg); clip-path: polygon(0 0, 56% 0, 56% 25%, 25% 25%, 25% 56%, 0 56%); }
.head-section { padding-left: 18px; border-left: 1px solid var(--line); color: var(--mid); }
.local { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; color: var(--mid); white-space: nowrap; font-size: 12px; }
.local span { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px #9ee6ba20; }

main { padding: 31px 0 56px; }
.intro { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin-bottom: 23px; }
.intro h1 { margin-bottom: 5px; font-size: clamp(29px, 3.35vw, 44px); line-height: 1.19; letter-spacing: -.045em; font-weight: 760; }
.intro p { color: var(--mid); font-size: 14px; }
.intro-actions, .batch-actions { display: flex; align-items: center; gap: 9px; }
.button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 39px; border: 1px solid transparent; border-radius: 7px; padding: 6px 12px; color: var(--ink); background: transparent; font-weight: 650; white-space: nowrap; transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease; }
.button span { color: inherit; font-weight: 500; }
.secondary { background: var(--panel); border-color: var(--line); }
.secondary:hover:not(:disabled) { background: #283649; border-color: #52647a; }
.primary { background: var(--mint); color: #14271e; border-color: var(--mint); }
.primary:hover:not(:disabled) { background: #bbeecf; border-color: #bbeecf; }
.button:disabled { color: #91a0b2; background: #27313f; border-color: #384357; }
.quiet { color: var(--mid); }
.quiet:hover:not(:disabled) { background: var(--panel-raised); color: var(--ink); }

.batch-bar { display: flex; gap: 14px; align-items: center; justify-content: space-between; min-width: 0; margin-bottom: 18px; border: 1px solid #3b4555; border-radius: 10px; padding: 12px 14px; background: #222c3a; }
.batch-file { display: flex; align-items: center; gap: 11px; min-width: 0; }
.batch-file > div { min-width: 0; }
.batch-file h2 { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.batch-file p { margin-top: 4px; color: var(--mid); font-size: 12px; }
.file-icon { display: grid; place-items: center; flex: 0 0 auto; width: 37px; height: 37px; border-radius: 8px; border: 1px solid #486179; background: #2a3b4e; }
.file-icon i { position: relative; width: 13px; height: 16px; border: 1px solid #bacfe7; border-radius: 2px; }
.file-icon i::after { content: ''; position: absolute; inset: 5px 3px auto; height: 5px; border-top: 1px solid #bacfe7; border-bottom: 1px solid #bacfe7; }
.notice { margin: -5px 0 15px; min-height: 39px; padding: 8px 12px; background: var(--mint-fill); border: 1px solid #426a58; color: var(--mint); border-radius: 7px; overflow-wrap: anywhere; }
.notice[data-tone="warning"] { background: var(--amber-fill); color: var(--amber); border-color: #665442; }

.layout { display: grid; grid-template-columns: minmax(246px, 290px) minmax(0, 1fr); gap: 16px; align-items: start; }
.sidebar { display: grid; gap: 13px; min-width: 0; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 12px 24px #090d1419; }
.panel-head { padding: 17px 18px; }
.panel-head h2 { font-size: 17px; font-weight: 730; line-height: 1.4; }
.panel-head p { margin-top: 4px; color: var(--mid); font-size: 12px; }
.rule-panel .panel-head { padding-bottom: 12px; }
.comparison { display: grid; gap: 8px; padding: 0 13px; }
.policy-card { width: 100%; display: block; padding: 8px 10px 10px; text-align: left; border: 1px solid var(--soft-line); border-radius: 7px; color: var(--ink); background: var(--panel-inset); }
.policy-card:not([aria-pressed="true"]):hover { border-color: #62758b; }
.policy-card[aria-pressed="true"] { background: #202e3a; border-color: #659682; box-shadow: inset 2px 0 #91d5ac; }
.policy-title { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 720; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.stat + .stat { padding-left: 10px; border-left: 1px solid var(--line); }
.stat-data { color: var(--mid); font-size: 11px; white-space: nowrap; }
.stat-data strong { display: block; font: 650 21px/.98 var(--mono); margin-bottom: 5px; color: var(--ink); }
.stat-data strong.lift { color: var(--mint); }
.stat-data strong.leak { color: var(--red); }
.stat-data strong.overmask { color: var(--amber); }

.options { min-width: 0; margin: 14px 13px 13px; padding: 0; border: 0; }
.options legend { display: block; width: 100%; margin-bottom: 3px; padding: 0 1px 8px; border-bottom: 1px solid var(--soft-line); font-size: 13px; font-weight: 700; }
.check { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 9px; padding: 9px 1px 5px; cursor: pointer; }
.check > input { position: absolute; margin: 0; top: 9px; left: 0; width: 36px; height: 20px; cursor: pointer; opacity: 0; }
.switch { position: relative; width: 34px; height: 19px; margin-top: 2px; border: 1px solid #5a6a80; border-radius: 100px; background: #313d4f; pointer-events: none; }
.switch::after { content: ''; position: absolute; left: 3px; top: 3px; border-radius: 50%; width: 11px; height: 11px; background: #c4cfdc; transition: transform 160ms ease; }
.check input:checked + .switch { background: #31564a; border-color: #689987; }
.check input:checked + .switch::after { transform: translateX(15px); background: var(--mint); }
.check input:focus-visible + .switch { outline: 2px solid var(--mint); outline-offset: 3px; }
.check strong, .check small { display: block; }
.check strong { font-size: 13px; font-weight: 650; }
.check small { margin-top: 2px; color: var(--mid); font-size: 11px; }

.gate { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; column-gap: 9px; padding: 13px; color: var(--amber); background: #292731; border-color: #555041; }
.gate[data-tone="pass"] { color: var(--mint); background: #1d2f31; border-color: #43675c; }
.gate[data-tone="blocked"] { color: var(--red); background: #302635; border-color: #67485b; }
.gate h2 { font-size: 13px; font-weight: 750; }
.gate p { margin-top: 3px; color: var(--mid); font-size: 12px; }
.gate-indicator { position: relative; width: 17px; height: 17px; margin-top: 1px; border-radius: 50%; border: 1px solid currentColor; }
.gate-indicator::after { content: ''; position: absolute; width: 2px; height: 7px; background: currentColor; inset: 4px auto auto 7px; }
.gate[data-tone="pass"] .gate-indicator::after { width: 7px; height: 4px; inset: 4px auto auto 4px; transform: rotate(-45deg); background: none; border-left: 1px solid currentColor; border-bottom: 1px solid currentColor; }
.confirm { margin-top: 10px; grid-column: 1/-1; display: flex; align-items: center; gap: 6px; line-height: 1.4; color: var(--ink); font-size: 12px; }
.confirm input { flex: 0 0 auto; accent-color: var(--mint); }
.confirm input:disabled { cursor: not-allowed; }

.review-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 13px; }
.tabs { flex: 0 0 auto; display: inline-flex; padding: 3px; gap: 3px; background: var(--panel-inset); border: 1px solid var(--soft-line); border-radius: 8px; }
.tabs button { min-width: 52px; min-height: 30px; padding-inline: 10px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--mid); }
.tabs button:hover { background: var(--panel-raised); color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); background: #2a3a4d; border-color: #3e5066; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 17px 12px; }
.filter { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border: 1px solid var(--soft-line); border-radius: 6px; background: transparent; color: var(--mid); min-height: 31px; font-size: 12px; }
.filter:hover { border-color: #718296; color: var(--ink); }
.filter[aria-pressed="true"] { color: var(--mint); background: var(--mint-fill); border-color: #547967; }
.filter-count { color: inherit; font: 11px var(--mono); }
.table-frame { margin-inline: 13px; border: 1px solid var(--soft-line); border-radius: 7px; background: var(--panel-inset); overflow: hidden; }
.queue { width: 100%; border-collapse: collapse; table-layout: fixed; }
.queue thead { color: var(--mid); background: #222d3c; }
.queue td, .queue th { padding: 6px 10px; text-align: left; vertical-align: middle; overflow-wrap: anywhere; }
.queue th { color: var(--mid); font-size: 11px; font-weight: 620; }
.queue th:first-child { width: 18%; }
.queue th:nth-child(3) { width: 15%; }
.queue th:last-child { width: 27%; }
.queue tbody tr { border-top: 1px solid var(--soft-line); cursor: pointer; }
.queue tbody tr:hover { background: #253344; }
.queue tbody tr.selected { background: #213434; box-shadow: inset 3px 0 #87cba6; }
.record-open { display: block; border: 0; border-radius: 3px; padding: 0; color: var(--blue); background: none; font: 630 12px var(--mono); }
.record-open:hover { color: var(--mint); text-decoration: underline; }
.queue tr.selected .record-open { color: var(--mint); }
.record-time, .record-event { display: block; color: var(--mid); font-size: 11px; }
.record-time { font-family: var(--mono); }
.record-service { display: block; color: var(--ink); font-size: 13px; font-weight: 610; }
.record-level { color: var(--mid); font: 680 11px var(--mono); }
.record-level[data-level="WARN"] { color: var(--amber); }
.record-level[data-level="ERROR"] { color: var(--red); }
.verdict { display: inline-block; padding: 2px 6px; border-radius: 4px; border: 1px solid #425169; color: var(--mid); background: #273345; font-size: 11px; font-weight: 600; line-height: 1.45; }
.verdict[data-tone="lift"] { color: var(--mint); border-color: #4e6b5f; background: var(--mint-fill); }
.verdict[data-tone="leak"] { color: var(--red); border-color: #684754; background: var(--red-fill); }
.verdict[data-tone="overmask"] { color: var(--amber); border-color: #685645; background: var(--amber-fill); }
.empty { min-height: 63px; padding: 15px; color: var(--mid); }
.pagination { display: flex; align-items: center; justify-content: end; gap: 6px; margin: 5px 14px 0; }
.pagination span { margin-right: auto; color: var(--mid); font-size: 11px; }
.pagination .button { min-height: 30px; padding: 2px 7px; font-size: 12px; }
.pagination .button:disabled { color: #8798ab; background: transparent; border-color: transparent; }

.detail { padding: 12px 13px 14px; }
.detail-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.detail-head h3 { font-size: 15px; }
.detail-head p { margin-top: 2px; color: var(--mid); font-size: 12px; overflow-wrap: anywhere; }
.detail-actions { display: flex; flex-wrap: wrap; justify-content: end; align-items: center; gap: 4px; }
.detail-actions .button { min-height: 26px; padding: 2px 6px; font-size: 11px; }
.detail-rule { color: var(--blue); border: 1px solid #415169; background: #253347; border-radius: 5px; padding: 2px 7px; font-size: 11px; white-space: nowrap; }
.evidence { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.finding { min-width: 0; max-width: 100%; padding: 4px 7px; border: 1px solid var(--line); background: var(--panel-inset); border-radius: 5px; color: var(--mid); text-align: left; font-size: 11px; overflow-wrap: anywhere; }
.finding[aria-pressed="true"] { border-color: #7d9d90; color: var(--ink); background: #22383a; }
.finding[data-tone="leak"] { color: var(--red); }
.finding[data-tone="overmask"] { color: var(--amber); }
.finding[data-tone="lift"] { color: var(--mint); }
.finding code { font-family: var(--mono); }
.evidence .evidence-note { flex-basis: 100%; color: var(--mid); font-size: 11px; overflow-wrap: anywhere; }
.code-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.code-panel { min-width: 0; background: #131b27; border: 1px solid #334153; border-radius: 7px; overflow: hidden; }
.code-panel h4 { padding: 5px 8px; color: var(--mid); font-size: 11px; font-weight: 650; background: #232e3f; border-bottom: 1px solid var(--soft-line); }
.code-content { min-width: 0; height: 183px; padding-block: 6px; overflow: auto; scrollbar-color: #5b6c84 #1a2532; font: 12px/1.48 var(--mono); }
.code-content:focus-visible { outline-offset: -2px; }
.code-line { display: grid; grid-template-columns: 27px minmax(0, 1fr); min-height: 18px; padding-right: 7px; color: #d3dce8; white-space: pre-wrap; overflow-wrap: anywhere; }
.code-line.marked { background: #29394d; }
.code-line.selected { background: #343443; border-left: 2px solid var(--amber); grid-template-columns: 25px minmax(0, 1fr); }
.code-line.selected .json-number { color: #c9b596; }
.code-line.selected .json-string { color: #f4cca0; }
.code-line.changed .json-string { color: var(--mint); }
.line-number { text-align: right; padding-right: 6px; color: #91a1b6; user-select: none; }
.json-key { color: #a8c9e9; }
.json-string { color: #c3dfbf; }
.json-number, .json-literal { color: #d9b4e8; }
.truncation { padding: 8px; color: var(--mid); }

@media (max-width: 995px) {
  .shell { width: calc(100% - 36px); }
  .layout { grid-template-columns: minmax(230px, 253px) minmax(0, 1fr); gap: 12px; }
  .queue td, .queue th { padding-inline: 8px; }
  .queue th:first-child { width: 20%; }
}

@media (max-width: 780px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { grid-template-columns: minmax(0, 1fr) minmax(0, .68fr); align-items: start; }
  .comparison { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .intro { align-items: start; }
  .intro-actions { flex-wrap: wrap; justify-content: end; }
  .stat + .stat { padding-left: 6px; }
}

@media (max-width: 555px) {
  .shell { width: calc(100% - 24px); }
  .mast-inner { min-height: 54px; }
  .head-section { display: none; }
  .brand { gap: 7px; font-size: 13px; }
  .local { font-size: 11px; }
  main { padding-top: 19px; }
  .intro { flex-direction: column; gap: 11px; margin-bottom: 13px; }
  .intro h1 { margin-bottom: 5px; }
  .intro p { font-size: 12px; }
  .intro-actions { width: 100%; justify-content: start; }
  .intro-actions .button { flex: 1 1 112px; }
  .batch-bar { flex-wrap: wrap; gap: 7px; margin-bottom: 12px; padding: 9px; }
  .batch-actions { margin-left: auto; }
  .batch-actions .button { min-height: 34px; padding-inline: 8px; font-size: 12px; }
  .sidebar { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .gate { grid-row: 1; }
  .comparison { padding-inline: 10px; }
  .options { margin: 10px; }
  .panel-head { padding: 11px; }
  .review-head p { display: none; }
  .filters { padding: 0 9px 8px; }
  .filter { gap: 3px; min-height: 28px; padding-inline: 5px; font-size: 11px; }
  .queue td, .queue th { padding-inline: 5px; }
  .queue th:first-child { width: 19%; }
  .queue td:nth-child(3), .queue th:nth-child(3) { display: none; }
  .queue th:last-child { width: 28%; }
  .table-frame { margin-inline: 8px; }
  .record-time, .record-event, .verdict { font-size: 11px; }
  .record-service { font-size: 12px; }
  .detail { padding: 9px 8px; }
  .code-grid { grid-template-columns: minmax(0, 1fr); }
  .code-content { height: 154px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

  <title>日志隐私抽检台</title>
</head>
<body>
  <a class="skip" href="#main">跳到抽检工作区</a>
  <header class="mast">
    <div class="shell mast-inner">
      <a href="./index.html" class="brand"><span class="brand-icon" aria-hidden="true"><i></i></span><span>日志隐私抽检台</span></a>
      <span class="head-section">规则验收</span>
      <span class="local"><span aria-hidden="true"></span>仅在本机处理</span>
    </div>
  </header>
  <main id="main" class="shell">
    <div class="intro">
      <div class="intro-title">
        <h1>日志脱敏抽检</h1>
        <p>对照原始日志与脱敏结果，检查敏感字段及排障线索。</p>
      </div>
      <div class="intro-actions" aria-label="批次导出">
        <button type="button" class="button secondary" id="export-report" disabled>下载抽检报告 <span aria-hidden="true">↓</span></button>
        <button type="button" class="button primary" id="export-logs" disabled>导出候选日志 <span aria-hidden="true">↓</span></button>
      </div>
    </div>

    <section class="batch-bar" aria-label="正在抽检的日志批次">
      <div class="batch-file"><span class="file-icon" aria-hidden="true"><i></i></span><div><h2 id="batch-name">正在读取样例</h2><p id="batch-info"></p></div></div>
      <div class="batch-actions">
        <button type="button" id="reset-demo" class="button quiet">重载样例</button>
        <button type="button" id="import-file" class="button secondary"><span aria-hidden="true">↑</span> 导入本地日志</button>
        <input type="file" id="file-input" accept=".jsonl,.ndjson,.log,.txt,application/x-ndjson,text/plain" hidden>
      </div>
    </section>
    <p class="notice" id="notice" aria-live="polite" hidden></p>

    <div class="layout">
      <aside class="sidebar">
        <section class="panel rule-panel" aria-labelledby="rules-heading">
          <div class="panel-head"><h2 id="rules-heading">对照规则</h2></div>
          <div class="comparison" id="policy-totals"></div>
          <fieldset class="options">
            <legend>调整候选规则</legend>
            <label class="check"><input type="checkbox" id="scan-text" checked><span class="switch" aria-hidden="true"></span><span><strong>检查消息文本</strong><small>识别嵌在消息中的敏感值</small></span></label>
            <label class="check"><input type="checkbox" id="preserve-trace" checked><span class="switch" aria-hidden="true"></span><span><strong>保留链路标识</strong><small>继续用 trace_id 查找上下游</small></span></label>
          </fieldset>
        </section>
        <section id="export-gate" class="panel gate" data-tone="pending" aria-labelledby="gate-title" aria-live="polite">
          <span class="gate-indicator" aria-hidden="true"></span>
          <div><h2 id="gate-title">正在抽检</h2><p id="gate-reason"></p></div>
          <label class="confirm" id="confirm-control" hidden><input type="checkbox" id="confirm-review"> 我已人工复核候选结果</label>
        </section>
      </aside>

      <section class="panel review" aria-labelledby="review-title">
        <div class="panel-head review-head">
          <div><h2 id="review-title">抽检记录</h2><p id="review-description">在列表中选一条日志查看字段变化。</p></div>
          <div class="tabs" role="group" aria-label="当前预览规则">
