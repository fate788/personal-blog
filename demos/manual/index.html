  <style>
:root{
  color-scheme:light;--ground:#f5f4ef;--paper:#fffefa;--ink:#282c30;--muted:#62645f;--soft:#777970;
  --rule:#d9d8ce;--rule-dark:#b3b4a9;--copper:#775530;--gold:#c7ad82;--accent:#393f49;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",SimSun,Georgia,serif;--ui:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono","SFMono-Regular",Consolas,monospace;--rail:208px;
  font:14px/1.6 var(--ui);color:var(--ink);background:var(--ground)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
h1,h2,h3,h4,p,ul,ol,blockquote,fieldset,legend,dl,dt,dd{margin:0;padding:0}
button,input,summary,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button{border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:where(a,button,summary,input,textarea,[tabindex]):focus-visible{outline:2px solid #9d733c;outline-offset:3px}
button:disabled:hover{transform:none}
[hidden]{display:none!important}
input,textarea{min-width:0}
textarea{resize:vertical}
h1,h2,h3,h4,p,blockquote,.doc-link,.item-link{overflow-wrap:anywhere}
.icon,[data-icon]{display:inline-flex;align-items:center;justify-content:center;flex:none;font-style:normal}
.icon svg,[data-icon] svg{width:1em;height:1em;display:block;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;fill:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:fixed;z-index:10;top:-80px;left:12px;background:var(--paper);padding:8px 12px;border-radius:3px}
.skip:focus{top:10px}
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:3;display:flex;flex-direction:column;background:linear-gradient(150deg,#30343b,#24272d 68%);color:#e5e4df;border-right:1px solid #303339}
.brand{display:flex;align-items:center;gap:11px;padding:27px 20px 25px;color:#faf7ef;font:600 23px/1 var(--serif);white-space:nowrap}
.brand-icon{border:1px solid #8f816b;border-radius:6px;width:34px;height:34px;color:#debf8e;background:linear-gradient(160deg,#494942,#34363a);font-size:22px}
.rail nav{margin:2px 13px;display:grid;gap:5px;padding-top:17px;border-top:1px solid #ffffff1c}
.rail nav a,.rail-foot a{display:flex;align-items:center;gap:11px;padding:11px 13px;min-height:42px;border:1px solid transparent;border-radius:5px;color:#c9cac7;font-size:14px;font-weight:500}
.rail nav a [data-icon],.rail-foot [data-icon]{font-size:17px;color:#bdbcb4}
.rail nav a:hover,.rail-foot a:hover{background:#ffffff09;color:white}
.rail nav a[aria-current]{background:#464642;border-color:#625c4e;color:#fff4df}
.rail nav a[aria-current] [data-icon]{color:#dfc599}
.rail nav small{font:11px/1.2 var(--mono);background:#60605b;color:#fff7e5;padding:2px 5px;border-radius:4px;margin-left:auto}
.rail nav .eval-nav{margin-top:16px;position:relative}
.rail nav .eval-nav:before{content:"";position:absolute;inset:-10px 0 auto;height:1px;background:#ffffff19}
.rail-foot{margin:auto 13px 18px;padding-top:12px;border-top:1px solid #ffffff1c}.rail-foot a{font-size:12px;min-height:36px;padding-block:6px}.rail-foot a span{margin-left:auto;color:#aeafa9}
.workspace{margin-left:var(--rail);min-width:0}
.topbar{height:55px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(24px,3.3vw,58px);background:#faf9f5}
.trail{display:flex;align-items:center;gap:11px;font-size:12px}.trail>[data-icon]{font-size:15px;color:#716852}.trail>span,.slash{color:var(--muted)}.slash{font:12px var(--mono);color:#b4afa3}.trail b{font-weight:560}
.workspace-mode{font-size:11px;color:var(--muted)}.workspace-mode:before{content:"";display:inline-block;width:6px;height:6px;background:#858371;border-radius:50%;margin-right:7px}
main{min-height:calc(100vh - 55px);outline:none}
.content{width:min(1280px,100%);margin:0 auto;padding:clamp(25px,2.8vw,43px) clamp(24px,3.3vw,58px) 56px}
.page-title,.heading-row,.section-head,.form-end,.dialog-head,.reader-meta,.queue-head,.list-heading,.import-foot,.evidence-tools{display:flex;align-items:center;justify-content:space-between;gap:14px}
.page-title{align-items:center;margin-bottom:23px}.page-title h1{font:600 clamp(29px,3vw,42px)/1.18 var(--serif);letter-spacing:-.035em}.page-title p{color:var(--muted);font-size:13px;margin-top:8px}.page-actions{display:flex;gap:8px;flex:none;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;line-height:1.35;padding:8px 13px;border:1px solid transparent;border-radius:5px;font-size:13px;font-weight:570;white-space:nowrap;text-align:center}
.btn .icon{font-size:15px}.btn.primary{color:#fbf9f3;background:#343a43;border-color:#343a43}.btn.primary:hover{background:#252a31}
.btn.secondary{background:var(--paper);border-color:var(--rule-dark)}.btn.secondary:hover{border-color:#8e826f;background:#f2eee5}
.text-link,.action-link,.source-links a,.source-links button,.case a{display:inline-flex;align-items:center;gap:5px;color:var(--copper);font-size:12px;font-weight:560}
.text-link:hover,.action-link:hover,.source-links a:hover,.source-links button:hover,.case a:hover{text-decoration:underline;text-underline-offset:3px}

.hero-inner{max-width:75%;padding:clamp(20px,2.5vw,37px);padding-right:3%}
.hero h2{font:600 clamp(25px,2.45vw,35px)/1.2 var(--serif);letter-spacing:-.025em}
.searchbox{display:flex;gap:8px;align-items:stretch;padding:5px;background:var(--paper);border:1px solid #c0bcaf;border-radius:6px;box-shadow:0 3px 11px #4942330e;margin:19px 0 9px}
.searchbox:focus-within{border-color:#9c825b;box-shadow:0 0 0 2px #a9916e27}
.searchbox>i{align-self:center;color:#817b6e;font-size:17px;margin-left:7px}.searchbox input{width:100%;flex:1;background:transparent;border:0;outline:0;padding:7px 0;font-size:14px}.searchbox input:focus-visible{outline:none}.searchbox input::placeholder{color:#7c7d75}
.searchbox button{min-height:37px;padding-inline:13px}.search-tools{display:flex;align-items:center;gap:11px;flex-wrap:wrap;color:#5b594f;font-size:12px}
.suggestions{display:flex;gap:10px 13px;flex-wrap:wrap;align-items:center}.suggestions button{font-size:12px;text-decoration:underline;text-decoration-color:#a89d85;text-underline-offset:3px}
.hero.compact:before{display:none}.hero.compact{background:#eae7de}.hero.compact .hero-inner{max-width:none;padding:13px 18px}.hero.compact h2,.hero.compact .suggestions{display:none}.hero.compact .searchbox{margin:0 0 6px}
.picker{position:relative;display:inline-flex;max-width:100%;min-width:0}
.picker summary,details summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.picker summary{display:flex;align-items:center;gap:8px;min-height:32px;padding:3px 9px;border:1px solid #c5c0b0;border-radius:4px;background:#f8f6ef;color:#4b4941}
.picker summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:clamp(100px,25vw,255px)}
.picker summary:after,details.drop>summary:after,.case summary:after,.source-box summary:after{content:"";width:6px;height:6px;flex:none;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:-3px 2px 0 auto}
.picker[open] summary:after,details.drop[open]>summary:after,.case[open] summary:after,.source-box[open] summary:after{transform:rotate(225deg);margin-top:3px}
.picker[open]{z-index:4}.picker-list{position:absolute;left:0;top:calc(100% + 4px);z-index:5;display:grid;min-width:min(185px,76vw);max-width:min(330px,83vw);width:max-content;max-height:250px;overflow:auto;padding:4px;border:1px solid #bfb8a7;background:var(--paper);border-radius:6px;box-shadow:0 8px 23px #302d2328}
.picker-list button{text-align:left;border-radius:3px;padding:7px 10px;line-height:1.5;overflow-wrap:anywhere;font-size:13px;color:var(--ink)}
.picker-list button:hover,.picker-list button:focus-visible{background:#eeebe2}.picker-list button[aria-pressed=true]{color:#694e2c;background:#ebe4d5;font-weight:620}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.8fr);align-items:start;gap:18px;margin-top:20px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:7px;min-width:0;box-shadow:0 2px 5px #3a362b06}
.section-head{min-height:53px;padding:13px 18px;border-bottom:1px solid var(--rule)}
.section-head h2,.block-head h2,.panel h2,.dialog-head h2,.eval-tools h2{font:600 20px/1.35 var(--serif)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;margin-left:5px;border-radius:3px;color:#6d685b;background:#eeece3;font:11px/1.6 var(--mono);vertical-align:middle}
.doc-row,.gap-row{display:flex;gap:11px;align-items:center;text-align:left;min-width:0;border-bottom:1px solid #e6e4db;padding:13px 18px}
.doc-row:last-child,.gap-row:last-child{border-bottom:0}.doc-row:hover,.gap-row:hover,.library-item:hover{background:#f7f5ee}
.doc-row .doc-copy,.gap-row .doc-copy{flex:1;min-width:0}.doc-copy strong,.doc-copy span{display:block}.doc-copy strong{font-weight:600;font-size:14px}.doc-copy span,.meta,.subtle,.section-id,.hint{font-size:12px;color:var(--muted)}
.doc-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:40px;background:#e7e8e3;border:1px solid #d9dbd2;border-radius:3px;color:#535e58;font-size:19px}
.doc-icon.ledger{background:#efe7d9;border-color:#e3d8c3;color:#796141}
.doc-icon.team{background:#e9e6ef;color:#605a75;border-color:#dbd5e3}.doc-arrow{margin-left:auto;color:#8a8678;font:18px/1 var(--serif);flex:none}
.empty-brief{display:flex;gap:12px;align-items:flex-start;padding:18px}.empty-icon{display:inline-flex;color:#7d775f;font-size:21px;background:#efede4;padding:9px;border-radius:50%}
.empty-brief strong{display:block;font-size:14px;font-weight:600}.empty-brief p,.example-link p{margin:3px 0 0;color:var(--muted);font-size:12px}
.example-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-top:1px solid var(--rule);background:#f4f1e8;border-radius:0 0 7px 7px}.example-link b{font-size:13px;font-weight:570}
.home-foot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin:15px 0 0}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:550;color:#665a45}.status:before{content:"";width:6px;height:6px;background:#987d54;border-radius:50%}.status.done{color:#42645c}.status.done:before{background:#587b70}
.feedback{color:var(--muted);padding:15px;font-size:13px}.busy:before{content:"";display:inline-block;width:12px;height:12px;border:2px solid #d1ccc0;border-top-color:#7d6847;border-radius:50%;margin-right:9px;vertical-align:middle;animation:rotate .85s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.busy:before{animation:none}}
.answer-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,.9fr);margin:18px 0 0;gap:17px;align-items:start}
.answer-main,.answer-side{padding:18px 20px}.answer-main h2{margin-top:10px;font:600 clamp(21px,2vw,29px)/1.35 var(--serif)}.answer-text{margin:12px 0 15px;font-size:15px;white-space:pre-line;line-height:1.9}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#5f594a}.mode .icon{font-size:15px;color:#927c54}
.answer-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--rule)}.cite{padding:4px 8px;color:var(--copper);background:#f1eadc;border-radius:4px;font-size:12px}
.source-box{margin-top:10px;border-top:1px solid var(--rule)}.source-box summary,.case summary,details.drop>summary{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;font-weight:580}
.source-box summary span span{display:block;font-size:11px;color:var(--muted);font-weight:450}
blockquote{margin-top:3px;padding:5px 9px;border-left:2px solid #b8a078;font-size:13px;line-height:1.85;white-space:pre-line;background:#f7f5ed}mark{background:#f2e4bc;color:inherit}
.source-links{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:8px}.more{margin-top:13px}.more .result-list{display:grid;gap:8px}.result-list{list-style:none}
.result-list li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #e4e1d6}.result-list a{font-size:13px;color:var(--copper)}
fieldset{border:0;min-width:0}
.catalog-toolbar,.queue-tools{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:12px 17px;border-bottom:1px solid var(--rule)}
.filter-input{display:flex;align-items:center;gap:7px;min-width:0;background:#f8f7f1;border:1px solid #d3d1c5;padding:5px 8px;border-radius:4px;color:var(--muted)}
.filter-input input{font-size:13px;border:0;background:transparent;outline:0;width:100%;min-height:23px}.filter-input:focus-within{outline:2px solid #9d835a;outline-offset:1px}
.library-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(85px,.18fr) minmax(110px,.24fr) 14px;gap:10px;padding:13px 18px;border-bottom:1px solid #e4e2d8;align-items:center}
.library-item:last-child{border-bottom:0}.lib-ident{display:flex;align-items:center;gap:11px;min-width:0}.lib-ident b{overflow-wrap:anywhere;font-size:15px;font-weight:580}.lib-ident small{display:block;font-size:11px;color:var(--muted)}
.table-labels{background:#f3f2ec;color:var(--muted);font-size:11px;padding-block:6px}.table-labels:hover{background:#f3f2ec}
.reader-layout,.publish-layout,.queue-layout{display:grid;grid-template-columns:minmax(180px,.38fr) minmax(0,1fr);align-items:start;gap:17px}
.reader-index{position:sticky;top:12px;padding:15px}.reader-index h2,.evidence-panel h3{font-size:15px;font-family:var(--ui);font-weight:600}.reader-index nav{display:grid;margin-top:10px}.reader-index nav a{display:block;border-top:1px solid var(--rule);padding:8px 0;font-size:12px;color:#675434}
.reader-paper{padding:21px clamp(15px,2.1vw,32px)}.reader-meta{justify-content:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:14px}
.manual-chapter{margin-top:22px}.manual-chapter h3{font:600 21px/1.4 var(--serif)}
.section-item{border-bottom:1px solid #e8e5db;padding:12px 1px;scroll-margin-block:16px}.section-item:last-child{border-bottom:0}.section-item.is-linked{border-left:3px solid #b09566;background:#f3efe4;padding:10px 13px;border-radius:2px}.section-item p{white-space:pre-line;line-height:1.9;margin-top:4px}
.section-id{font:11px/1.55 var(--mono);color:#6b6556}.section-id:hover{text-decoration:underline}

mit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"需要 Python 3.10 或更新版本，只使用 Python 标准库。在项目根目录执行以下命令。\npython server.py"},{"id":"clinic-L17","project":"clinic","document":"门诊候补与改约工作台","title":"本地运行","text":"打开本机工作台（http://127.0.0.1:8796/）。Windows 也可双击 start-clinic.cmd。服务默认只监听本机回环地址。可通过 --port 和 --db 指定端口和 SQLite 文件。","start":17,"end":17,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L17","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"打开本机工作台（http://127.0.0.1:8796/）。Windows 也可双击 start-clinic.cmd。服务默认只监听本机回环地址。可通过 --port 和 --db 指定端口和 SQLite 文件。"},{"id":"clinic-L21","project":"clinic","document":"门诊候补与改约工作台","title":"体验预约窗口的三种操作","text":"跨日登记。 从 12 月 8 日的日程打开快速登记，选择 12 月 9 日 09:00 综合门诊 S03。用虚构就诊编号 P105 登记后，在预约查询中输入 P105，即可核对班次、预约状态和办理记录。","start":21,"end":21,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L21","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"跨日登记。 从 12 月 8 日的日程打开快速登记，选择 12 月 9 日 09:00 综合门诊 S03。用虚构就诊编号 P105 登记后，在预约查询中输入 P105，即可核对班次、预约状态和办理记录。"},{"id":"clinic-L22","project":"clinic","document":"门诊候补与改约工作台","title":"体验预约窗口的三种操作","text":"退号与递补。 在周日历选 12 月 8 日，打开 09:00 综合门诊 S01，取消预约 R001。队首 P003 获得 10 分钟留位。把演示时钟推进 10 分钟，留位转给 P004。使用 P004 确认，查询预约单 R004 可核对递补经过。","start":22,"end":22,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L22","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"退号与递补。 在周日历选 12 月 8 日，打开 09:00 综合门诊 S01，取消预约 R001。队首 P003 获得 10 分钟留位。把演示时钟推进 10 分钟，留位转给 P004。使用 P004 确认，查询预约单 R004 可核对递补经过。"},{"id":"clinic-L23","project":"clinic","document":"门诊候补与改约工作台","title":"体验预约窗口的三种操作","text":"停诊改约。 重置演示，将 S01 停诊。在改约页勾选 R001、R002，核对原班次和目标班次，选择同科 10:00 的 S02 并确认。两笔预约一起转入该班次，事件记录保留每笔改约的起点和去向。","start":23,"end":23,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L23","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"停诊改约。 重置演示，将 S01 停诊。在改约页勾选 R001、R002，核对原班次和目标班次，选择同科 10:00 的 S02 并确认。两笔预约一起转入该班次，事件记录保留每笔改约的起点和去向。"},{"id":"clinic-L25","project":"clinic","document":"门诊候补与改约工作台","title":"体验预约窗口的三种操作","text":"下拉菜单支持键盘操作。用 Tab 聚焦后按 Enter 展开，用上下方向键浏览，按 Enter 选定或 Esc 收起。","start":25,"end":25,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L25","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"下拉菜单支持键盘操作。用 Tab 聚焦后按 Enter 展开，用上下方向键浏览，按 Enter 选定或 Esc 收起。"},{"id":"clinic-L27","project":"clinic","document":"门诊候补与改约工作台","title":"体验预约窗口的三种操作","text":"初始演示时钟固定为北京时间 2026 年 12 月 7 日 08:40，时钟由操作者推进。刷新页面可以继续刚才的演练。事件和留位提醒显示在工作台内。系统没有连接医院挂号系统或短信服务。","start":27,"end":27,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L27","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"初始演示时钟固定为北京时间 2026 年 12 月 7 日 08:40，时钟由操作者推进。刷新页面可以继续刚才的演练。事件和留位提醒显示在工作台内。系统没有连接医院挂号系统或短信服务。"},{"id":"clinic-L31","project":"clinic","document":"门诊候补与改约工作台","title":"实现与验证","text":"engine.py 管理号源、候补队列、场次停开和事件记录。SQLite 写事务把余量判断和状态变化一起提交，已确认和已留位都会占用容量。","start":31,"end":31,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L31","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"engine.py 管理号源、候补队列、场次停开和事件记录。SQLite 写事务把余量判断和状态变化一起提交，已确认和已留位都会占用容量。"},{"id":"clinic-L32","project":"clinic","document":"门诊候补与改约工作台","title":"实现与验证","text":"server.py 提供静态界面、GET /api/state 与 POST /api/action。操作可携带版本号与请求标识，对过期页面返回冲突，重复请求可取回当前状态。","start":32,"end":32,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L32","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"server.py 提供静态界面、GET /api/state 与 POST /api/action。操作可携带版本号与请求标识，对过期页面返回冲突，重复请求可取回当前状态。"},{"id":"clinic-L33","project":"clinic","document":"门诊候补与改约工作台","title":"实现与验证","text":"static/ 提供周日历、当日号源分布、快速登记、预约查询、停诊改约与事件记录。中文字体内嵌于 static/style.css，许可见 static/fonts/OFL.txt。","start":33,"end":33,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L33","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"static/ 提供周日历、当日号源分布、快速登记、预约查询、停诊改约与事件记录。中文字体内嵌于 static/style.css，许可见 static/fonts/OFL.txt。"},{"id":"clinic-L34","project":"clinic","document":"门诊候补与改约工作台","title":"实现与验证","text":"执行 python -m unittest discover -v 复跑测试。GitHub Actions 在提交和拉取请求时运行测试并检查前端脚本语法。","start":34,"end":34,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L34","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"执行 python -m unittest discover -v 复跑测试。GitHub Actions 在提交和拉取请求时运行测试并检查前端脚本语法。"},{"id":"clinic-L36","project":"clinic","document":"门诊候补与改约工作台","title":"实现与验证","text":"15 项测试覆盖候补先后、截止时刻、跨日、停诊、事务回滚、重试和工作区隔离。在单席并发测试中，12 个请求同时登记，结果是 1 条已预约、11 条候补。在批次测试中，后一条预约遇到时段冲突时，先处理的预约和对应事件也一起回滚。","start":36,"end":36,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L36","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"15 项测试覆盖候补先后、截止时刻、跨日、停诊、事务回滚、重试和工作区隔离。在单席并发测试中，12 个请求同时登记，结果是 1 条已预约、11 条候补。在批次测试中，后一条预约遇到时段冲突时，先处理的预约和对应事件也一起回滚。"},{"id":"clinic-L38","project":"clinic","document":"门诊候补与改约工作台","title":"实现与验证","text":"作者是李子衡（@fate788）。个人博客源码与其他作品","start":38,"end":38,"url":"https://github.com/fate788/clinic-scheduling/blob/bf00adf19b6588e4800e48f25bd487980f0a0119/README.md?plain=1#L38","version":"v0.6","commit":"bf00adf19b6588e4800e48f25bd487980f0a0119","snippet":"作者是李子衡（@fate788）。个人博客源码与其他作品"},{"id":"ledger-L3","project":"ledger","document":"双账核对工作台","title":"项目介绍","text":"给运营或财务核对系统订单与渠道账单。把两侧数据转换为相同的三列 CSV，导入后可按差异类别和业务单号筛选，核对原始行、记录复核结论并导出报告。内置样例为合成数据。","start":3,"end":3,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L3","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"给运营或财务核对系统订单与渠道账单。把两侧数据转换为相同的三列 CSV，导入后可按差异类别和业务单号筛选，核对原始行、记录复核结论并导出报告。内置样例为合成数据。"},{"id":"ledger-L7","project":"ledger","document":"双账核对工作台","title":"项目介绍","text":"作品分类　产品研发 / 业务后端、Web 前端，数据工程 / 数据质量。行业为电商与支付。","start":7,"end":7,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L7","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"作品分类　产品研发 / 业务后端、Web 前端，数据工程 / 数据质量。行业为电商与支付。"},{"id":"ledger-L11","project":"ledger","document":"双账核对工作台","title":"在本机运行","text":"克隆仓库后进入项目根目录，使用 Python 3.10 或更新版本。Windows 可双击 start-review.cmd，也可在本目录运行 python server.py，然后访问 本机双账核对（http://127.0.0.1:8792/）。只需 Python 标准库。端口已被占用时可运行 python server.py --port 8802。使用另一个实例时需指定独立数据库，例如 --db data/review-2.sqlite3。","start":11,"end":11,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L11","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"克隆仓库后进入项目根目录，使用 Python 3.10 或更新版本。Windows 可双击 start-review.cmd，也可在本目录运行 python server.py，然后访问 本机双账核对（http://127.0.0.1:8792/）。只需 Python 标准库。端口已被占用时可运行 python server.py --port 8802。使用另一个实例时需指定独立数据库，例如 --db data/review-2.sqlite3。"},{"id":"ledger-L15","project":"ledger","document":"双账核对工作台","title":"一分钟体验","text":"点击「核对样例账单」。实际输入文件位于 samples/left.csv 和 samples/right.csv。","start":15,"end":15,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L15","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"点击「核对样例账单」。实际输入文件位于 samples/left.csv 和 samples/right.csv。"},{"id":"ledger-L16","project":"ledger","document":"双账核对工作台","title":"一分钟体验","text":"点击「金额不符」，搜索 000127。两边 CSV 的第 4 行分别为 128.00 元和 118.00 元。切到「重复键」，可以查到需要核对的原始行号。","start":16,"end":16,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L16","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"点击「金额不符」，搜索 000127。两边 CSV 的第 4 行分别为 128.00 元和 118.00 元。切到「重复键」，可以查到需要核对的原始行号。"},{"id":"ledger-L17","project":"ledger","document":"双账核对工作台","title":"一分钟体验","text":"打开这笔差异的「复核差异」，核对原始行，填入复核人、差异原因和处理结论。演示时可记录“金额相差 10 元，原因待核实”“交运营核查渠道明细”。复核人是本机手填署名。","start":17,"end":17,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L17","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"打开这笔差异的「复核差异」，核对原始行，填入复核人、差异原因和处理结论。演示时可记录“金额相差 10 元，原因待核实”“交运营核查渠道明细”。复核人是本机手填署名。"},{"id":"ledger-L18","project":"ledger","document":"双账核对工作台","title":"一分钟体验","text":"保存后切换至「已复核」，重新打开记录，查看当前结论或追加一版更正。两个页面同时修改时，较晚保存的一方可对照最新结论再决定是否提交。","start":18,"end":18,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L18","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"保存后切换至「已复核」，重新打开记录，查看当前结论或追加一版更正。两个页面同时修改时，较晚保存的一方可对照最新结论再决定是否提交。"},{"id":"ledger-L19","project":"ledger","document":"双账核对工作台","title":"一分钟体验","text":"导出完整报告可查看最近的复核结论。返回工作台并再次运行相同样例，会直接打开同一批次，已有复核历史仍可查。","start":19,"end":19,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L19","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"导出完整报告可查看最近的复核结论。返回工作台并再次运行相同样例，会直接打开同一批次，已有复核历史仍可查。"},{"id":"ledger-L23","project":"ledger","document":"双账核对工作台","title":"数据约定","text":"表头为 业务单号,类型,金额。类型为「收款」或「退款」，金额为非负十进制元数，精确到分。上传限制为每侧 2 MiB、20,000 条数据。支持 UTF-8、带 BOM 的 UTF-8、GB18030。通过表格软件打开 CSV 时，将「业务单号」列指定为文本，可保留显示的前导零。","start":23,"end":23,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L23","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"表头为 业务单号,类型,金额。类型为「收款」或「退款」，金额为非负十进制元数，精确到分。上传限制为每侧 2 MiB、20,000 条数据。支持 UTF-8、带 BOM 的 UTF-8、GB18030。通过表格软件打开 CSV 时，将「业务单号」列指定为文本，可保留显示的前导零。"},{"id":"ledger-L25","project":"ledger","document":"双账核对工作台","title":"数据约定","text":"核对键为业务单号与类型。同一单号的收款和退款分别比较。同一键出现多次时保留双方行号，交给人工复核，适用于发现部分退款等需要更细粒度标识的情形。文件结构损坏会产生失败任务和原因。金额、单号等单行错误单列明细。「待复核」计数包括待核查的业务键和无效记录，不能直接当作损失金额或订单数。","start":25,"end":25,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L25","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"核对键为业务单号与类型。同一单号的收款和退款分别比较。同一键出现多次时保留双方行号，交给人工复核，适用于发现部分退款等需要更细粒度标识的情形。文件结构损坏会产生失败任务和原因。金额、单号等单行错误单列明细。「待复核」计数包括待核查的业务键和无效记录，不能直接当作损失金额或订单数。"},{"id":"ledger-L27","project":"ledger","document":"双账核对工作台","title":"数据约定","text":"渠道原始账单需先转换为上述三列。当前只处理同一币种的两份本地文件。工作台使用同一台电脑上的本地数据库，复核署名没有账号认证。真实渠道接入及团队分派另行规划。","start":27,"end":27,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L27","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"渠道原始账单需先转换为上述三列。当前只处理同一币种的两份本地文件。工作台使用同一台电脑上的本地数据库，复核署名没有账号认证。真实渠道接入及团队分派另行规划。"},{"id":"ledger-L31","project":"ledger","document":"双账核对工作台","title":"实现和复现","text":"engine.py 解析及验证记录，按复合键分组，给出两侧行号，导出 UTF-8 BOM 的完整 CSV。导出会转义可能触发表格公式的文本。","start":31,"end":31,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L31","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"engine.py 解析及验证记录，按复合键分组，给出两侧行号，导出 UTF-8 BOM 的完整 CSV。导出会转义可能触发表格公式的文本。"},{"id":"ledger-L32","project":"ledger","document":"双账核对工作台","title":"实现和复现","text":"新版可在差异处回看相关源行的字段值。打开旧批次时保留旧版已保存的金额和来源行号。再次上传内容相同的两份 CSV，可以补齐差异原始字段，并保留原批次和复核历史。更正复核会追加版本，保留之前填写的人、原因和结论。","start":32,"end":32,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L32","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"新版可在差异处回看相关源行的字段值。打开旧批次时保留旧版已保存的金额和来源行号。再次上传内容相同的两份 CSV，可以补齐差异原始字段，并保留原批次和复核历史。更正复核会追加版本，保留之前填写的人、原因和结论。"},{"id":"ledger-L33","project":"ledger","document":"双账核对工作台","title":"实现和复现","text":"GET /api/health 返回服务状态、排队数、运行数与最早未完成任务的等待秒数。故障响应工作台从此端点只读探测。","start":33,"end":33,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L33","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"GET /api/health 返回服务状态、排队数、运行数与最早未完成任务的等待秒数。故障响应工作台从此端点只读探测。"},{"id":"ledger-L34","project":"ledger","document":"双账核对工作台","title":"实现和复现","text":"server.py 只监听本机，使用 SQLite 存储异步批次。相同的两份文件按内容复用批次。重启时重新处理运行中断的任务。文件处理结束后数据库保留结果与文件名，清除任务中的源文件内容。历史供本机同一工作台使用。","start":34,"end":34,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L34","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"server.py 只监听本机，使用 SQLite 存储异步批次。相同的两份文件按内容复用批次。重启时重新处理运行中断的任务。文件处理结束后数据库保留结果与文件名，清除任务中的源文件内容。历史供本机同一工作台使用。"},{"id":"ledger-L35","project":"ledger","document":"双账核对工作台","title":"实现和复现","text":"运行 python -m unittest discover -v 复现核对与服务端测试。内置样例为 8 行系统订单、6 行渠道数据，结果为 3 组一致，金额不符、仅系统、仅渠道、重复键、无效记录各 1 项。","start":35,"end":35,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L35","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"运行 python -m unittest discover -v 复现核对与服务端测试。内置样例为 8 行系统订单、6 行渠道数据，结果为 3 组一致，金额不符、仅系统、仅渠道、重复键、无效记录各 1 项。"},{"id":"ledger-L37","project":"ledger","document":"双账核对工作台","title":"实现和复现","text":"业务背景见 微信支付账单开发指引 与 美团配送对账体系实践。本版原型的核对规则及样例为独立实现。","start":37,"end":37,"url":"https://github.com/fate788/ledger-reconciliation/blob/97649044221e9a7bde0100948efba7b617b995b3/README.md?plain=1#L37","version":"v0.2","commit":"97649044221e9a7bde0100948efba7b617b995b3","snippet":"业务背景见 微信支付账单开发指引 与 美团配送对账体系实践。本版原型的核对规则及样例为独立实现。"}],"originals":{"clinic":"# 门诊候补与改约工作台\n\n预约窗口可以在同一个工作台查号、登记预约、办理候补和停诊改约。日程显示所选日期的号源分布、各班次的余号和名单。“窗口待办”汇总各日期的待办记录，点击一项即可查看对应状态的预约。接到咨询时，也可以按就诊编号或预约单号追查办理经过。项目使用合成排班与虚构编号，每个浏览器会话有独立的数据。\n\n![门诊调度工作台](docs/preview.webp)\n\n预约日程展示导诊大厅，查询页展示窗口递单，停诊改约页展示诊区走廊导引。三张图片由 AI 为本项目生成，人物与机构均为虚构。图片随页面提供，可离线显示。\n\n## 本地运行\n\n需要 Python 3.10 或更新版本，只使用 Python 标准库。在项目根目录执行以下命令。\n\n```sh\npython server.py\n```\n\n打开[本机工作台](http://127.0.0.1:8796/)。Windows 也可双击 `start-clinic.cmd`。服务默认只监听本机回环地址。可通过 `--port` 和 `--db` 指定端口和 SQLite 文件。\n\n## 体验预约窗口的三种操作\n\n1. **跨日登记。** 从 12 月 8 日的日程打开快速登记，选择 12 月 9 日 09:00 综合门诊 S03。用虚构就诊编号 P105 登记后，在预约查询中输入 P105，即可核对班次、预约状态和办理记录。\n2. **退号与递补。** 在周日历选 12 月 8 日，打开 09:00 综合门诊 S01，取消预约 R001。队首 P003 获得 10 分钟留位。把演示时钟推进 10 分钟，留位转给 P004。使用 P004 确认，查询预约单 R004 可核对递补经过。\n3. **停诊改约。** 重置演示，将 S01 停诊。在改约页勾选 R001、R002，核对原班次和目标班次，选择同科 10:00 的 S02 并确认。两笔预约一起转入该班次，事件记录保留每笔改约的起点和去向。\n\n下拉菜单支持键盘操作。用 Tab 聚焦后按 Enter 展开，用上下方向键浏览，按 Enter 选定或 Esc 收起。\n\n初始演示时钟固定为北京时间 2026 年 12 月 7 日 08:40，时钟由操作者推进。刷新页面可以继续刚才的演练。事件和留位提醒显示在工作台内。系统没有连接医院挂号系统或短信服务。\n\n## 实现与验证\n\n- `engine.py` 管理号源、候补队列、场次停开和事件记录。SQLite 写事务把余量判断和状态变化一起提交，已确认和已留位都会占用容量。\n- `server.py` 提供静态界面、`GET /api/state` 与 `POST /api/action`。操作可携带版本号与请求标识，对过期页面返回冲突，重复请求可取回当前状态。\n- `static/` 提供周日历、当日号源分布、快速登记、预约查询、停诊改约与事件记录。中文字体内嵌于 `static/style.css`，许可见 `static/fonts/OFL.txt`。\n- 执行 `python -m unittest discover -v` 复跑测试。GitHub Actions 在提交和拉取请求时运行测试并检查前端脚本语法。\n\n15 项测试覆盖候补先后、截止时刻、跨日、停诊、事务回滚、重试和工作区隔离。在单席并发测试中，12 个请求同时登记，结果是 1 条已预约、11 条候补。在批次测试中，后一条预约遇到时段冲突时，先处理的预约和对应事件也一起回滚。\n\n作者是[李子衡（@fate788）](https://github.com/fate788)。[个人博客源码与其他作品](https://github.com/fate788/personal-blog)\n","ledger":"# 合账 · 双账核对工作台 v0.2\n\n给运营或财务核对系统订单与渠道账单。把两侧数据转换为相同的三列 CSV，导入后可按差异类别和业务单号筛选，核对原始行、记录复核结论并导出报告。内置样例为合成数据。\n\n![双账核对的样例批次及逐笔差异](docs/preview.webp)\n\n**作品分类**　产品研发 / 业务后端、Web 前端，数据工程 / 数据质量。行业为电商与支付。\n\n## 在本机运行\n\n克隆仓库后进入项目根目录，使用 Python 3.10 或更新版本。Windows 可双击 `start-review.cmd`，也可在本目录运行 `python server.py`，然后访问 [本机双账核对](http://127.0.0.1:8792/)。只需 Python 标准库。端口已被占用时可运行 `python server.py --port 8802`。使用另一个实例时需指定独立数据库，例如 `--db data/review-2.sqlite3`。\n\n## 一分钟体验\n\n1. 点击「核对样例账单」。实际输入文件位于 `samples/left.csv` 和 `samples/right.csv`。\n2. 点击「金额不符」，搜索 `000127`。两边 CSV 的第 4 行分别为 128.00 元和 118.00 元。切到「重复键」，可以查到需要核对的原始行号。\n3. 打开这笔差异的「复核差异」，核对原始行，填入复核人、差异原因和处理结论。演示时可记录“金额相差 10 元，原因待核实”“交运营核查渠道明细”。复核人是本机手填署名。\n4. 保存后切换至「已复核」，重新打开记录，查看当前结论或追加一版更正。两个页面同时修改时，较晚保存的一方可对照最新结论再决定是否提交。\n5. 导出完整报告可查看最近的复核结论。返回工作台并再次运行相同样例，会直接打开同一批次，已有复核历史仍可查。\n\n## 数据约定\n\n表头为 `业务单号,类型,金额`。类型为「收款」或「退款」，金额为非负十进制元数，精确到分。上传限制为每侧 2 MiB、20,000 条数据。支持 UTF-8、带 BOM 的 UTF-8、GB18030。通过表格软件打开 CSV 时，将「业务单号」列指定为文本，可保留显示的前导零。\n\n核对键为业务单号与类型。同一单号的收款和退款分别比较。同一键出现多次时保留双方行号，交给人工复核，适用于发现部分退款等需要更细粒度标识的情形。文件结构损坏会产生失败任务和原因。金额、单号等单行错误单列明细。「待复核」计数包括待核查的业务键和无效记录，不能直接当作损失金额或订单数。\n\n渠道原始账单需先转换为上述三列。当前只处理同一币种的两份本地文件。工作台使用同一台电脑上的本地数据库，复核署名没有账号认证。真实渠道接入及团队分派另行规划。\n\n## 实现和复现\n\n- `engine.py` 解析及验证记录，按复合键分组，给出两侧行号，导出 UTF-8 BOM 的完整 CSV。导出会转义可能触发表格公式的文本。\n- 新版可在差异处回看相关源行的字段值。打开旧批次时保留旧版已保存的金额和来源行号。再次上传内容相同的两份 CSV，可以补齐差异原始字段，并保留原批次和复核历史。更正复核会追加版本，保留之前填写的人、原因和结论。\n- `GET /api/health` 返回服务状态、排队数、运行数与最早未完成任务的等待秒数。故障响应工作台从此端点只读探测。\n- `server.py` 只监听本机，使用 SQLite 存储异步批次。相同的两份文件按内容复用批次。重启时重新处理运行中断的任务。文件处理结束后数据库保留结果与文件名，清除任务中的源文件内容。历史供本机同一工作台使用。\n- 运行 `python -m unittest discover -v` 复现核对与服务端测试。内置样例为 8 行系统订单、6 行渠道数据，结果为 3 组一致，金额不符、仅系统、仅渠道、重复键、无效记录各 1 项。\n\n业务背景见 [微信支付账单开发指引](https://pay.wechatpay.cn/doc/v3/merchant/4013071218) 与 [美团配送对账体系实践](https://tech.meituan.com/2018/03/21/balance-accounts.html)。本版原型的核对规则及样例为独立实现。\n"},"report":{"dataset":"手册检索室 · 固定 30 题","datasetSHA256":"73352c796fc118c47f8fc509d056d032622a26a3ab835e72d276e /* Browser retrieval over actual document passages. Query vocabulary and gap rules
   come from the Python engine at build time; no answers are stored in this module. */
function createManualSearch(config) {
  "use strict";
  const noise = new Set(config.noise);
  const normalized = text => text.normalize("NFKC").toLowerCase();
  const escapeRegex = text => text.replace(/[.*+?^$(){}|[\]\\]/g, "\\$&");
  const vocabulary = config.groups.map(group =>
    new RegExp([...group].sort((a,b) => b.length - a.length).map(escapeRegex).join("|"), "gu"));
  const gaps = config.gaps.map(([ask, evidence]) => [new RegExp(ask, "iu"), new RegExp(evidence, "iu")]);
  const filler = new RegExp(config.filler, "gu");
  const names = new RegExp(config.productNames, "gu");
  const scopeCues = Object.entries(config.cues).map(([id, pattern]) => [id, new RegExp(pattern, "iu")]);
  const duration = new RegExp(config.durationQuestion, "iu");
  const units = new RegExp(config.durationEvidence, "iu");
  function lacksQuantity(query,text) {
    const requested=query.matchAll(/(?:几|多少)\s*个?\s*(工作日|自然日|小时|分钟|秒|天|周|月|年|次|台|份|元|人|页|字节)/gu);
    return [...requested].some(match=>!new RegExp("(?:\\d+(?:\\.\\d+)?|[零一二两三四五六七八九十百千万半]+)\\s*个?\\s*"+match[1],"u").test(text));
  }

  function terms(text) {
    const counts = new Map();
    function add(token, amount = 1) {
      if (!noise.has(token)) counts.set(token, (counts.get(token) || 0) + amount);
    }
    const value = normalized(text);
    for (const word of value.match(/[a-z0-9]+(?:[._/-][a-z0-9]+)*|[\u3400-\u9fff]+/gu) || []) {
      if (/^[a-z0-9]/u.test(word)) {
        add(word);
        if (/[._/-]/u.test(word)) word.split(/[._/-]/u).forEach(part => add(part));
      } else {
        for (const width of [2,3]) {
          for (let i=0; i <= word.length-width; i++) add(word.slice(i,i+width));
        }
      }
    }
    vocabulary.forEach((pattern, i) => {
      const matched = value.match(pattern);
      if (matched) add("@"+i, Math.min(3, matched.length));
    });
    return counts;
  }

  function buildIndex(sections) {
    const docFreq = new Map();
    const rows = sections.map(section => {
      const vector = terms(section.text);
      const heading = terms(section.title + (section.kind === "team" ? " "+section.document : ""));
      for (const term of heading.keys()) vector.set(term, (vector.get(term) || 0) + 0.22);
      for (const term of vector.keys()) docFreq.set(term, (docFreq.get(term) || 0) + 1);
      return {section, vector, length:[...vector.values()].reduce((sum,v) => sum+v, 0)};
    });
    const mean = rows.reduce((sum,row) => sum+row.length, 0) / rows.length || 1;
    const idf = new Map([...docFreq].map(([key,n]) => [key,Math.log(1+(rows.length-n+0.5)/(n+0.5))]));
    return {rows,mean,idf};
  }

  function excerpt(text, weights) {
    const sentences = text.match(/[^。！？；]*[。！？；]|[^。！？；]+$/gu) || [text];
    if (text.length <= 120 && sentences.length <= 3) return text;
    const scores = sentences.map(s => [...terms(s)].reduce((sum,[t,n]) =>
      sum+(weights.get(t)||0)*(1+0.2*Math.min(n-1,2)),0));
    const hot = scores.reduce((best,value,index) => value>scores[best] ? index : best,0);
    let start=hot, end=hot+1;
    if (hot && scores[hot-1]>=scores[hot]*0.38) start--;
    if (end<scores.length && (scores[end]>=scores[hot]*0.2 || sentences[hot].length<=12 ||
        /以下命令/u.test(sentences[hot]) || /^(把演示时钟|到期|系统没有)/u.test(sentences[end]))) end++;
    return sentences.slice(start,end).join("").trim();
  }

  function rank(query, scopedRows, index) {
    const queryTerms = terms(query.replace(names," ").replace(filler," "));
    const weights = new Map();
    let total=0, conceptCount=0;
    for (const term of queryTerms.keys()) {
      if (!index.idf.has(term)) { total+=0.7; continue; }
      const concept=term.startsWith("@");
      const weight=index.idf.get(term)*(concept ? 4.3 : /^[\x00-\x7f]+$/u.test(term) ? 1.2 : term.length>2 ? 0.7 : 1);
      if (concept) conceptCount++;
      weights.set(term,weight);
      total+=weight;
    }
    const ranking=[];
    for (const row of scopedRows) {
      const norm=0.65+0.35*row.length/index.mean;
      let covered=0, raw=0, concepts=0, count=0, distinctive=false;
      for (const [term,weight] of weights) {
        const n=row.vector.get(term);
        if (!n) continue;
        raw+=weight*2.2*n/(n+1.2*norm);
        covered+=weight;
        count++;
        if (term.startsWith("@")) concepts++;
        if (term.length>=3 || /^[\x00-\x7f]+$/u.test(term)) distinctive=true;
      }
      if (!count) continue;
      const coverage=covered/Math.max(total,1);
      let score=raw*(0.65+0.35*coverage)*(conceptCount ? 0.4+0.6*concepts/conceptCount : 1);
      if (duration.test(query)) score*=units.test(row.section.text) ? 1.35 : 0.75;
      ranking.push({section:row.section, score,coverage,count,distinctive,weights});
    }
    ranking.sort((a,b) => b.score-a.score);
    return ranking.slice(0,3);
  }

  function hasEvidence(query, hit) {
    if (!hit || hit.score<2.15 || hit.coverage<0.22 ||
        (hit.count===1 && !hit.distinctive && hit.coverage<0.68)) return false;
    const text=normalized(hit.section.text), topic=normalized(hit.section.title+" "+hit.section.document);
    if (gaps.some(([request,evidence]) => request.test(query) && !evidence.test(text))) return false;
    if (hit.section.kind === "team") {
      if (lacksQuantity(query,text)) return false;
      if (duration.test(query) && !/[0-9零一二三四五六七八九十百千万两]+\s*(?:个)?(?:工作日|秒|分钟|小时|天|周|月|年)/u.test(text)) return false;
    }
    for (const id of query.match(/[a-z]{2,}[a-z0-9_.-]*|[psr]\d{2,6}/giu) || []) {
      if (["readme","clinic","ledger","app","web","id","ai"].includes(id) || text.includes(id) || topic.includes(id)) continue;
      const concepts=[...terms(id).keys()].filter(t=>t.startsWith("@"));
      if (!concepts.some(concept=>hit.weights.has(concept) && terms(text).has(concept))) return false;
    }
    return true;
  }

  function ask(question, project, sections) {
    const index=buildIndex(sections);
    const query=normalized(question.trim());
    const cues=scopeCues.filter(([,re])=>re.test(query)).map(([id])=>id);
    const scoped=index.rows.filter(({section})=>project==="all" ?
      (!cues.length || cues.includes(section.project) || section.kind==="team") : section.project===project);
    const ranked=rank(query,scoped,index);
    const publicRow=hit=>({...hit.section,score:Number(hit.score.toFixed(3)),snippet:excerpt(hit.section.text,hit.weights)});
    const result={method:"hybrid",mode:"extractive",status:"insufficient",answer:"所查手册没有提供足以回答这个问题的原文。",
      citations:[],results:ranked.map(publicRow)};
    if (!hasEvidence(query, ranked[0])) return result;
    let cited=[publicRow(ranked[0])];
    const clauses=query.split(/[?？；;，,]|另外|以及/u).map(s=>s.trim()).filter(s=>/谁|几|多|怎么|如何|吗|会|能|是否|哪些|什么|超时|能否/u.test(s));
    if (clauses.length>=2 && clauses.length<=3) {
      const hits=clauses.map(s=>rank(s,scoped,index)[0]);
      if (hits.every((hit,i)=>hasEvidence(clauses[i],hit) && hit.coverage>=0.28)) {
        const unique=[...new Map(hits.map(hit=>[hit.section.id,publicRow(hit)])).values()];
        const covered=terms(cited[0].text), asked=new Set(clauses.flatMap(c=>[...terms(c).keys()]));
        if (unique.length>1 && unique.some(row=>[...terms(row.text).keys()].some(t=>
          t.startsWith("@") && !covered.has(t) && asked.has(t)))) cited=unique;
      }
    }
    result.status="answered";
    result.citations=cited;
    result.answer=cited.map(s=>s.snippet).join("\n");
    result.results=[...new Map([...cited,...result.results].map(s=>[s.id,s])).values()].slice(0,3);
    return result;
  }

  function relevant(question, section) {
    const target=section.title+" "+section.text;
    if (lacksQuantity(question,target)) return false;
    const questionTerms=terms(question.replace(names," ").replace(filler," ")), evidence=terms(target);
    const overlap=[...questionTerms.keys()].filter(t=>evidence.has(t));
    return overlap.some(t=>t.startsWith("@") || t.length>=3 || /^[a-z0-9]{2,}$/u.test(t)) || overlap.length>=2;
  }
  return {ask,relevant};
}

(() => {

  class ApiError extends Error {
    constructor(status,message) { super(message); this.status=status; }
  }
  function reject(status,message) { throw new ApiError(status,message); }
  function database() {
    if (!connection) connection=new Promise((resolve,rejectOpen)=>{
      const pending=indexedDB.open(dbName,1);
      pending.onupgradeneeded=()=>pending.result.createObjectStore("workspace");
      pending.onsuccess=()=>{
        const db=pending.result;
        db.onversionchange=()=>{ db.close(); connection=null; };
        resolve(db);
      };
      pending.onerror=()=>rejectOpen(pending.error);
    }).catch(error=>{connection=null;throw error;});
    return connection;
  }
  async function workspace(mode, operation) {
    let db;

        try {
          const data=read.result || fresh();
          result=operation(data);
          if (mode==="readwrite") store.put(data,"current");
        } catch (error) { ownError=error; transaction.abort(); }
      };
      transaction.oncomplete=()=>resolve(result);

    const value=input[key].trim();

  function sourceURL(input) {
    const raw=getString(input,"sourceUrl",0,2048,false);
    if (!raw) return "";
    let parsed;
    try { parsed=new URL(raw); } catch { reject(400,"原文地址需要是完整的 HTTP 或 HTTPS 链接。"); }
    if (!/^https?:\/\//iu.test(raw) || /[\s\\]/u.test(raw) || !["https:","http:"].includes(parsed.protocol) || parsed.username || parsed.password)
      reject(400,"原文地址不支持这种格式。");

  function parts(content,project,revision,title,url) {
    const lines=content.split("\n"), sections=[];
    let heading=title, start=0, buffer=[], code=false, size=0;
    function flush() {
      if (!buffer.length) return;
      const text=buffer.join("\n");
      if (text.trim()) sections.push({
        id:project+"-v"+revision+"-L"+start, project, kind:"team", title:heading, document:title,
        revision,version:"v"+revision,start,end:start+buffer.length-1,text,snippet:text,sourceUrl:url,url,commit:""
      });

  function versions(manual) {
    return [...manual.versions].reverse().map(v=>({revision:v.revision,version:v.version,publishedAt:v.publishedAt,sections:v.sections.length}));
  }

    return {id:manual.id,project:manual.id,kind:"team",title:v.title,name:v.title,document:v.title,
      url:v.sourceUrl,sourceUrl:v.sourceUrl,revision:v.revision,version:v.version,sections:v.sections.length,
      publishedAt:v.publishedAt,versions:versions(manual),commit:""};

  function builtinInfo(doc) {

  }
  const bundled=seed.sections.map(section=>({...section,kind:"builtin",revision:1,sourceUrl:section.url}));

    return {documents:[...seed.documents.map(builtinInfo),...latest],
      sections:[...bundled,...ws.manuals.flatMap(m=>m.versions.at(-1).sections)]};
  }

    const builtin=baseDoc(id);
    if (builtin && (revision===null || revision===1)) return {document:builtinInfo(builtin),
      sections:bundled.filter(s=>s.project===id),content:seed.originals[id]};
    const doc=published(ws,id);
    if (!doc) reject(404,"没有找到这份手册或版本。");
    const v=revision===null ? doc.versions.at(-1) : doc.versions.find(v=>v.revision===revision);
    if (!v) reject(404,"没有找到这个版本。");

  }
  function publish(ws,input) {
    const title=getString(input,"title",1,96),url=sourceURL(input);
    if (typeof input.content!=="string" || !input.content.trim()) reject(400,"请填写或导入手册正文。");
    const content=input.content.replace(/^\ufeff/u,"").replace(/\r\n?/gu,"\n");
    if (content.includes("\0") || new TextEncoder().encode(content).length>256*1024) reject(400,"正文须为有效文本，最大 256 KiB。");
    const titleKey=title.normalize("NFKC").toLowerCase().replace(/\s+/gu," ");
    const sameTitle=value=>value.normalize("NFKC").toLowerCase().replace(/\s+/gu," ")===titleKey;
    const updating="project" in input && input.project!=="" && input.project!=null;
    let doc=updating ? published(ws,input.project) : ws.manuals.find(m=>sameTitle(m.versions.at(-1).title));
    if (updating && !doc) reject(baseDoc(input.project)?409:404,"只能更新已发布的团队手册。");
    if (seed.documents.some(d=>sameTitle(d.title)) || ws.manuals.some(m=>m!==doc && sameTitle(m.versions.at(-1).title)))
      reject(409,"已有同名手册，请打开该手册发布修订版。");

  }
  function resolveGap(ws,id,input) {
    const gap=ws.gaps.find(g=>g.id===id);

    if (gap.status==="resolved") {

    }

    if (!search.relevant(normalizeQuestion(gap.question),section)) reject(422,"这段原文与登记的问题缺少相关依据。");
    Object.assign(gap,{status:"resolved",sectionId,note,resolvedAt:now()});
    return {gap:gapResult(ws,gap)};
  }
  async function route(url,method,input) {
    const path=url.pathname;
    if (method==="GET" && path==="/api/evaluation") return seed.report;
    if (method==="GET" && path==="/api/health") return {status:"ok",modelConfigured:false};
    if (method==="GET" && path==="/api/documents") return workspace("readonly",library);
    const doc=path.match(/^\/api\/documents\/([^/]+)$/u);
    if (method==="GET" && doc) return workspace("readonly",ws=>edition(ws,decodeURIComponent(doc[1]),
      url.searchParams.has("revision") ? Number(url.searchParams.get("revision")) : null));
    const ref=path.match(/^\/api\/sections\/([^/]+)$/u);
    if (method==="GET" && ref) return workspace("readonly",ws=>({section:sectionById(ws,decodeURIComponent(ref[1]))}));
    if (method==="POST" && path==="/api/documents") return workspace("readwrite",ws=>publish(ws,input));
    if (method==="POST" && path==="/api/ask") return workspace("readonly",ws=>{
      const q=getString(input,"question",1,500),project=input.project||"all";
      if (!knownScope(ws,project)) reject(400,"请选择有效的手册范围。");
      const prior=ws.gaps.find(g=>g.project===project && normalizeQuestion(g.question)===normalizeQuestion(q));
      if (prior?.status==="resolved") {
        const evidence=sectionById(ws,prior.sectionId);
        if (evidence.kind==="builtin" || published(ws,evidence.project).versions.at(-1).revision===evidence.revision)
          return {mode:"extractive",status:"answered",method:"reviewed",answer:evidence.text,citations:[evidence],results:[evidence],
            resolutionId:prior.id,modeNote:"已由待补问题的复核记录确认。"};
      }
      return search.ask(q,project,library(ws).sections);
    });
    if (method==="GET" && path==="/api/gaps") return workspace("readonly",ws=>{
      const status=url.searchParams.get("status")||"all";
      if (!["all","open","resolved"].includes(status)) reject(400,"问题状态无效。");
      return {gaps:ws.gaps.filter(g=>status==="all" || g.status===status).map(g=>gapResult(ws,g))};
    });
    if (method==="POST" && path==="/api/gaps") return workspace("readwrite",ws=>openGap(ws,input));
    const resolve=path.match(/^\/api\/gaps\/([^/]+)\/resolve$/u);
    if (method==="POST" && resolve) return workspace("readwrite",ws=>resolveGap(ws,decodeURIComponent(resolve[1]),input));
    reject(404,"找不到此操作。");
  }
  async function request(path, options={}) {
    let status=200, payload;
    try {
      const url=new URL(path,"https://manual.local");
      const input=options.body ? JSON.parse(options.body) : {};

    }

  }
  window.manualOffline=Object.freeze({isPortable:true,request});
})();

<script>
"use strict";

(() => {
  function citationLabel(section) {
    const name = section.document || section.title || section.project;
    const lines = section.start === section.end ? String(section.start) : section.start + "–" + section.end;
    return [name, section.version, section.start && "第 " + lines + " 行"].filter(Boolean).join(" · ");
  }

  function sourceLink(section) {
    // Imported content lives in its own workspace; an external reader still gets the cited words.
    const address = section.sourceUrl || section.url;
    try {
      const parsed = new URL(address);
      return ["https:", "http:"].includes(parsed.protocol) ? parsed.href : "";
    } catch {
      return "";
    }
  }

  function answerText(question, result) {
    const sources = result.citations.map((section, index) => {
      const quote = section.snippet || section.text;
      return ["[" + (index + 1) + "] " + citationLabel(section), quote, sourceLink(section)]
        .filter(Boolean).join("\n");
    });
    return [question, result.answer, ...sources].filter(Boolean).join("\n\n");
  }

  async function copyAnswer({ question, result }) {
    const text = answerText(question, result);
    try {
      await navigator.clipboard.writeText(text);
      return { text, copied: true };
    } catch {
      return { text, copied: false };
    }
  }

  function csvCell(value) {
    let text = String(value ?? "");
    if (/^\s*[=+@-]/.test(text) || /^[\t\r\n]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function gapCsv(gaps) {
    const rows = [["编号", "问题", "查询范围", "登记原因", "状态", "登记时间", "结案时间", "引用依据", "证据原文", "处理说明"]];
    const ranges = { all: "全部手册", clinic: "门诊候补与改约工作台", ledger: "双账核对工作台" };
    for (const gap of gaps) {
      const evidence = gap.evidence;
      rows.push([gap.id, gap.question, gap.projectTitle || ranges[gap.project] || gap.project,
        gap.reason === "feedback" ? "答复待复核" : "资料不足", gap.status === "resolved" ? "已解决" : "待处理",
        gap.createdAt, gap.resolvedAt, evidence && citationLabel(evidence),
        evidence && (evidence.snippet || evidence.text), gap.note]);
    }
    return "\uFEFF" + rows.map(row => row.map(csvCell).join(",")).join("\r\n") + "\r\n";
  }

  function exportGaps(gaps, filename = "知识待补清单.csv") {
    if (!gaps.length) return;
    const blob = new Blob([gapCsv(gaps)], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  window.supportActions = Object.freeze({ copyAnswer, exportGaps, answerText, gapCsv });
})();

</script>

function highlighted(section, answer=""){
  const t=section.text;
  const matches=[section.snippet,...answer.split(/(?<=[。！？])|\n/u)].map(s=>String(s||"").trim()).filter(s=>s&&t.includes(s)&&s!==t);
  const ranges=matches.map(s=>[t.indexOf(s),t.indexOf(s)+s.length]).sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  if(!ranges.length)return "<mark>"+esc(t)+"</mark>";
  let pos=0,html="";
  for(const [start,end] of ranges){if(start<pos)continue;html+=esc(t.slice(pos,start))+"<mark>"+esc(t.slice(start,end))+"</mark>";pos=end;}
  return html+esc(t.slice(pos));
}

function failed(test) {
  if (test.answerable) return !test.hybridHit || test.citationSupport === false || test.evidenceHit === false ||
    !["pending","complete"].includes(test.answerQuality) || test.status === "insufficient";
  return test.status !== "insufficient";
}
function testStatus(test) {
  if (!test.answerable) return test.status === "insufficient" ? "恰当拒答" : "误答";
  if (!test.hybridHit) return "漏检";
  if (test.status === "insufficient") return "未作答";
  if (failed(test)) return "待复核";
  return "命中";
}
function caseRow(test) {
  const method = hit => hit == null ? "不适用" : hit ? "前 3 命中" : "前 3 漏检";
  const row = (label, value) => value ? '<p><b>'+label+'</b>'+esc(value)+'</p>' : "";
  const sources = (test.citations || []).map(s => '<a href="'+esc(readLink(s.project,s.id))+'">'+
    esc(projects[s.project])+' · '+esc(lineRange(s))+' →</a>').join("");
  return '<details class="case"><summary><span class="case-status">'+testStatus(test)+'</span><span>'+esc(test.question)+'</span></summary>'+
    '<div class="case-body">'+row("关键词", method(test.baselineHit))+row("改进检索", method(test.hybridHit))+
    row("关键词返回",test.baselineRanked)+row("改进后返回",test.hybridRanked)+
    row("参考依据",test.expected)+row("返回的答案",test.answer)+
    (sources ? '<div class="source-links">'+sources+'</div>' : "")+row("复核说明",test.review)+
    '<a href="#ask?'+esc(new URLSearchParams({q:test.question,project:Object.hasOwn(projects,test.project) ? test.project : "all"}).toString())+'">在问答中重试 →</a></div></details>';
}
function drawReport(data, filter) {
  const s = data.summary;
  const metrics = [["关键词 · 前三命中",s.baseline.hits,s.baseline.answerable],["改进检索 · 前三命中",s.hybrid.hits,s.hybrid.answerable],
    ["有依据题 · 完整回答",s.fullyAnswered,s.hybrid.answerable],["无依据题 · 恰当拒答",s.abstentions,s.unanswerable]];
  const filters = {all:"全部",missed:"需复查",missing:"无依据题"};
  if (!Object.hasOwn(filters,filter)) filter = "all";
  const rows = data.cases.filter(test => filter === "missed" ? failed(test) : filter === "missing" ? !test.answerable : true);
  $("evaluation").innerHTML = '<div class="metrics">'+metrics.map(([label,x,y]) => '<div class="metric"><small>'+label+'</small><strong>'+esc(x)+' / '+esc(y)+'</strong></div>').join("")+
    '</div><p class="subtle">这组结果评测离线检索与原文摘录。有引用的回答中，'+esc(s.citationSupported)+' / '+esc(s.citationEvaluated)+
    ' 份获原文支持。独立 AI 分别复核引用和回答完整性，有依据的题目中有 '+esc(s.falseAbstentions)+' 题被误判为资料不足。</p>'+
    '<div class="eval-tools"><h2>逐题记录 <span class="meta">'+rows.length+' 题</span></h2><div class="chips" aria-label="筛选评测记录">'+

    $("evaluation").querySelector(".chip[aria-pressed=true]")?.focus({preventScroll:true});
  }
}

function currentRoute(){

    const [lib,queueData]=await Promise.all([api("/api/documents"),api("/api/gaps?status=all")]);
    if(n!==revision)return;
    documents=lib.documents;sections=lib.sections;gaps=queueData.gaps;setRail();
    if(view==="ask")await drawDesk(params,n);
    else if(view==="read"){if(parts[1])await reader(parts[1],parts[2],params,n);else catalog();}
    else if(view==="publish")await publisher(parts[1],params,n);
    else if(view==="gaps")queue(parts[1]||"open",parts[2]);
    else {
      header("检索评测","两份内置手册的固定版本服务端评测，逐题核验检索与回答。");
      if(!report)report=await api("/api/evaluation");
      if(n===revision){$("view").innerHTML='<section id="evaluation"></section>';drawReport(report,parts[1]||"all");}
    }
  }catch(error){
    if(n===revision&&error.name!=="AbortError"){
      $("view").innerHTML=`<div class="panel"><p class="feedback" role="alert">${esc(error.message)} <button type="button" class="action-link" data-retry>重试</button></p></div>`;
    }
  }finally{if(n===revision)$("view").setAttribute("aria-busy","false");}
}
function openGap(reason){
  gapReason=reason==="insufficient"?"insufficient":"feedback";
  const fromAnswer=context.view==="ask" && lastAnswer?.hash===location.hash;
  $("gap-question").value=fromAnswer?lastAnswer.question:"";
  $("gap-scope").innerHTML=picker("gap-scope",fromAnswer?lastAnswer.project:"all",scopes(),"涉及手册");
  $("gap-error").hidden=true;$("gap-dialog").showModal();$("gap-question").focus();
}
async function saveGap(form){
  const question=$("gap-question").value.trim();
  if(!question){$("gap-question").focus();return;}
  const save=form.querySelector("[type=submit]");save.disabled=true;$("gap-error").hidden=true;
  try{
    const data=await post("/api/gaps",{question,project:getPick("gap-scope"),reason:gapReason});
    $("gap-dialog").close();notify(data.created?"问题已登记":"已定位到同一项待补问题");
    go(gapLink(data.gap.status,data.gap.id));
  }catch(e){showError($("gap-error"),e.message);}
  finally{save.disabled=false;}
}
function revisionCheck(form){
  if(!form.reportValidity())return false;
  if(!$("doc-title").value.trim()||!$("doc-content").value.trim()){
    showError($("publish-error"),"请填写手册名称和正文。");return false;
  }
  if(new TextEncoder().encode($("doc-content").value).length>256*1024){
    showError($("publish-error"),"正文超过 256 KiB，请按主题拆分。");return false;
  }
  return true;
}
async function saveDocument(form){
  const err=$("publish-error");err.hidden=true;
  if(!revisionCheck(form))return;
  const project=form.dataset.project,save=form.querySelector("[type=submit]");
  const payload={title:$("doc-title").value.trim(),content:$("doc-content").value,sourceUrl:$("doc-url").value.trim()};
  if(project){payload.project=project;payload.expectedRevision=Number(form.dataset.revision);}
  save.disabled=true;
  try{
    const result=await post("/api/documents",payload);lastAnswer=null;
    notify(result.created?"手册已发布":"已打开相同内容的现行版本");
    if(returnGap){const jump=returnGap;returnGap="";go(jump);}
    else go(readLink(result.document.id));
  }catch(e){if(err.isConnected)showError(err,e.message);}
  finally{save.disabled=false;}
}
async function readFile(input){
  const file=input.files[0],err=$("publish-error");if(!file)return;
  try{
    if(!/\.(md|markdown|txt)$/i.test(file.name)||file.size>256*1024)throw new Error("请选择 256 KiB 以内的 Markdown 或 TXT 文件。");
    const text=new TextDecoder("utf-8",{fatal:true}).decode(await file.arrayBuffer());
    if(!text.trim())throw new Error("文件中没有正文。");
    if(!input.isConnected)return;
    $("doc-content").value=text;
    if(!$("doc-title").value.trim())$("doc-title").value=file.name.replace(/\.[^.]+$/,"").slice(0,96);
    $("file-label").textContent=file.name;err.hidden=true;
  }catch(e){if(err.isConnected)showError(err,e instanceof TypeError?"文件需要使用 UTF-8 编码。":e.message);}
  input.value="";
}
async function resolveGap(form){
  const choice=form.querySelector('input[name=evidence]:checked');if(!choice)return;
  const save=form.querySelector("[type=submit]");save.disabled=true;const err=$("resolve-error");err.hidden=true;
  try{
    const data=await post("/api/gaps/"+pathPart(form.dataset.gap)+"/resolve",{sectionId:choice.value,note:$("resolution-note").value.trim()});
    lastAnswer=null;returnGap="";notify("已结案并保存引用依据");go(gapLink("resolved",data.gap.id));
  }catch(e){if(err.isConnected)showError(err,e.message);}
  finally{save.disabled=false;}
}
function copyFallback(host,text){
  const field=document.createElement("textarea");field.className="copy-url";field.readOnly=true;field.setAttribute("aria-label","可手动复制的文本");
  field.value=text;host.append(field);field.focus();field.select();
}
async function copyLink(el){
  const url=new URL(el.dataset.copyLink,location.href).href;
  try{await navigator.clipboard.writeText(url);notify("已复制段落链接");}
  catch{copyFallback(el.closest(".section-item"),url);}
}
async function copyAnswer(){
  if(!lastAnswer)return;
  const result=await window.supportActions.copyAnswer({question:lastAnswer.question,result:lastAnswer.result,url:location.href});
  if(result.copied)notify("已复制答复与出处");else{const host=$("reply-copy");host.replaceChildren();copyFallback(host,result.text);}
}
function chooseOption(control){
  const menu=control.closest(".picker"),key=menu.dataset.picker,val=control.dataset.pick;
  if(key==="version"){go(readLink(context.parts[1],"",val));return;}
  menu.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-pressed",String(control===b)));
  menu.dataset.value=val;const summary=menu.querySelector("summary");summary.querySelector("span").textContent=control.textContent;
  summary.setAttribute("aria-label",(key==="scope"?"查询范围":"涉及手册")+"，"+control.textContent);menu.open=false;summary.focus();
}
function closePickers(except){
  document.querySelectorAll(".picker[open]").forEach(menu=>{if(!menu.contains(except))menu.open=false;});
}
document.addEventListener("submit",e=>{
  const f=e.target;
  if(!["ask-form","gap-form","publish-form","resolve-form"].includes(f.id))return;
  e.preventDefault();
  if(f.id==="ask-form"){
    const q=$("question").value.trim();if(!q){$("question").focus();return;}lastAnswer=null;go(askLink(q,getPick("scope")));
  }else if(f.id==="gap-form")saveGap(f);
  else if(f.id==="publish-form")saveDocument(f);
  else resolveGap(f);
});
document.addEventListener("input",e=>{
  if(e.target.id==="library-filter")$("catalog-rows").innerHTML=catalogRows(e.target.value);
  if(e.target.id==="evidence-search"){
    const keep=$("resolve-form").querySelector('input[name=evidence]:checked')?.value;
    drawOptions(lastGap,e.target.value,keep);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="doc-file")readFile(el);
  if(el.name==="evidence"){
    const section=sections.find(s=>s.id===el.value);if(!section)return;
    $("selected-evidence").innerHTML="<blockquote>"+esc(section.text)+"</blockquote>";
    $("resolve-form").querySelector("[type=submit]").disabled=false;
  }
});
document.addEventListener("click",e=>{
  closePickers(e.target);
  const el=e.target.closest("button,a");if(!el)return;
  if(el.matches(".skip")){e.preventDefault();$("main").focus();return;}
  if(el.hasAttribute("data-pick"))chooseOption(el);
  if(el.hasAttribute("data-example"))go(el.dataset.example);
  if(el.hasAttribute("data-register"))openGap(el.dataset.register);
  if(el.hasAttribute("data-dismiss"))$("gap-dialog").close();
  if(el.hasAttribute("data-fill-example"))exampleContent(context.parts[1]);
  if(el.hasAttribute("data-copy-link"))copyLink(el);
  if(el.hasAttribute("data-copy-answer"))copyAnswer().catch(()=>notify("复制失败，请重试。"));
  if(el.hasAttribute("data-export-gaps")){const f=el.dataset.exportGaps;window.supportActions.exportGaps(gaps.filter(g=>f==="all"||g.status===f).map(g=>({...g,projectTitle:docName(g.project)})));}
  if(el.hasAttribute("data-eval")){focusFilter=true;go(el.dataset.eval==="all"?"#evaluation":"#evaluation/"+el.dataset.eval);}
  if(el.hasAttribute("data-retry")){lastAnswer=null;navigate();}
  if(el.matches('a[href^="#publish"]'))returnGap=context.view==="gaps"&&lastGap?.status==="open"?gapLink("open",lastGap.id):"";
});
document.addEventListener("keydown",e=>{
  const menu=e.target.closest(".picker");
  if(menu && e.key==="Escape" && menu.open){e.preventDefault();e.stopPropagation();menu.open=false;menu.querySelector("summary").focus();return;}
  if(menu && ["ArrowDown","ArrowUp","Home","End"].includes(e.key)){
    e.preventDefault();menu.open=true;const buttons=[...menu.querySelectorAll("[data-pick]")],i=buttons.indexOf(document.activeElement);
    const n=e.key==="Home"?0:e.key==="End"?buttons.length-1:e.key==="ArrowDown"?Math.min(buttons.length-1,i+1):Math.max(0,i-1);
    buttons[n]?.focus();return;
  }
});
document.addEventListener("focusin",e=>closePickers(e.target));
window.addEventListener("hashchange",navigate);
navigate();

</script>
</body>
</html>
