<!doctype html>
<html data-edition="browser" lang="zh-CN">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a2032">
  <title>临时权限工作台</title>
  <link rel="icon" href="data:,">
  <style>
:root {
  color-scheme: light;
  --canvas: #f4f5fa;
  --paper: #fff;
  --tint: #f8f8fc;
  --ink: #20253d;
  --muted: #59617a;
  --faint: #737b94;
  --line: #e0e3ed;
  --hairline: #ebedf4;
  --accent: #5749a1;
  --accent-deep: #3f347b;
  --accent-light: #f0edfb;
  --nav: #1b2033;
  --nav-light: #292e47;
  --lift: 0 8px 28px #242a4c0d;
  --radius: 14px;
  --sidebar: 232px;
  font: 15px/1.6 Inter, "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  color: var(--ink);
  background: var(--canvas);
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul, ol { padding: 0; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }
button:disabled { opacity: .64; cursor: wait; }
[hidden] { display: none !important; }
:where(button, a, summary, input, textarea, [tabindex="0"]):focus-visible { outline: 3px solid #826bd2; outline-offset: 3px; }
svg { fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; width: 1em; height: 1em; }
:where(h1, h2, h3, p, dd, .wrap, .event-text) { overflow-wrap: anywhere; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: fixed; z-index: 20; left: 10px; top: -70px; background: var(--paper); padding: 8px 13px; border-radius: 8px; }
.skip-link:focus { top: 10px; }
.ico { display: inline-flex; flex: none; align-items: center; justify-content: center; font-style: normal; }
.meta { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: var(--sidebar) minmax(0,1fr); min-height: 100dvh; }
.sidebar { position: sticky; top: 0; height: 100dvh; min-width: 0; display: flex; flex-direction: column; padding: 23px 16px 17px; color: #ebebf7; background: radial-gradient(ellipse at 0% 0%, #2b2c4b, transparent 56%), var(--nav); }
.wordmark { display: flex; align-items: center; gap: 11px; padding: 5px 4px 25px; margin: 0 0 18px; border-bottom: 1px solid #ffffff17; font-size: 17px; font-weight: 720; white-space: nowrap; letter-spacing: -.025em; }
.wordmark small { display: block; color: #a5a9c4; font-size: 11px; font-weight: 450; letter-spacing: .09em; }
.brand-icon { display: grid; place-items: center; flex: none; height: 37px; width: 37px; border: 1px solid #9890d578; border-radius: 10px; color: #d7ccff; font-size: 23px; background: #55498052; }
.sidebar nav { display: grid; gap: 5px; }
.nav-link { display: flex; align-items: center; gap: 11px; padding: 9px 12px; min-height: 44px; border: 1px solid transparent; border-radius: 9px; color: #bcc2da; font-size: 14px; font-weight: 540; }
.nav-link .ico { width: 18px; font-size: 17px; color: #afb3d4; }
.nav-link:hover, .sidebar-action:hover { color: #fff; background: #ffffff0a; }
.nav-link[aria-current] { color: #fff; background: #403861; border-color: #8476b855; font-weight: 650; }
.nav-link[aria-current] .ico { color: #dbd0ff; }
.nav-badge { margin-left: auto; min-width: 22px; padding: 0 5px; border-radius: 5px; text-align: center; color: #e0d8ff; background: #8473b744; font-size: 11px; }
.sidebar-footer { margin-top: auto; padding-top: 14px; display: grid; gap: 5px; }
.session-card { display: flex; align-items: center; gap: 9px; min-width: 0; border-top: 1px solid #ffffff1f; padding: 13px 4px 4px; }
.avatar { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 8px; color: #e5ddff; background: #595080; font-size: 14px; }
.session-card b, .session-card small { display: block; overflow-wrap: anywhere; }
.session-card b { font-size: 13px; font-weight: 650; }
.session-card small { color: #abb1cc; font-size: 11px; }
.source-link,.sidebar-action { padding: 6px 7px; border: 0; border-radius: 5px; color: #b7bdd7; background: none; text-align: left; font-size: 12px; align-self: start; }
.source-link:hover { color: #fff; }
.source-link span { margin-left: 3px; }
.sidebar-action { display: block; }
.workspace { min-width: 0; }
.topbar { min-height: 67px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; border-bottom: 1px solid var(--line); background: #fdfdff; padding: 12px clamp(21px,3.1vw,48px); }
.breadcrumbs, .top-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; min-width: 0; font-size: 13px; color: var(--muted); }
.breadcrumbs [aria-hidden] { color: #8e94aa; }
.breadcrumbs b { color: var(--ink); font-weight: 625; }
.demo-flag { display: flex; align-items: center; gap: 5px; color: var(--accent-deep); background: var(--accent-light); border: 1px solid #e6e0f6; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; }
.demo-flag:before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #7664bb; }
.page { max-width: 1400px; margin-inline: auto; padding: 27px clamp(21px,3.1vw,48px) 53px; outline: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 22px; margin: 0 0 19px; }
.page-head h1 { font-size: clamp(27px,3vw,39px); font-weight: 700; line-height: 1.23; letter-spacing: -.037em; }
.page-head p { margin-top: 7px; color: var(--muted); font-size: 14px; }
.button-row,.heading-actions { display:flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 39px; max-width: 100%; padding: 6px 13px; border: 1px solid transparent; border-radius: 8px; font-size: 13px; font-weight: 620; line-height: 1.3; text-align: center; }
.btn .ico { font-size: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 7px #4d418228; }
.btn.primary:hover { background: var(--accent-deep); }
.btn.secondary { background: var(--paper); border-color: #d5daea; color: #383e5e; }
.btn.secondary:hover { border-color: #aca3d0; background: #f9f7ff; }
.btn.light { background: #f0edff; color: #332963; border-color: #f0edff; }
.btn.light:hover { background: #fff; }
.btn.dark-outline { background: #ffffff08; border-color: #ffffff50; color: #f3f1ff; }
.btn.dark-outline:hover { background: #ffffff1b; }
.btn.subtle { background: transparent; color: var(--accent-deep); }
.btn.subtle:hover { background: var(--accent-light); }
.action-link { color: var(--accent-deep); background: transparent; border: 0; padding: 0; font-size: 13px; font-weight: 620; }
.action-link:hover { text-decoration: underline; text-underline-offset: 4px; }
.mobile-logout { display: none; }

.hero { position: relative; display: grid; grid-template-columns: minmax(0,1.2fr) minmax(220px,.8fr); min-height: 256px; isolation: isolate; overflow: hidden; border: 1px solid #3c4262; border-radius: 17px; color: #fafaff; background: linear-gradient(113deg,#21263f 14%,#2c3055 68%,#36345e); box-shadow: 0 12px 28px #28275419; }
.hero-copy { position: relative; z-index: 1; align-self: center; padding: 28px 0 30px clamp(20px,3.1vw,45px); }
.hero h1 { font-size: clamp(28px,4.3vw,50px); line-height: 1.21; letter-spacing: -.045em; font-weight: 700; }
.hero p { max-width: 34em; margin: 12px 0 19px; color: #d1d4ee; font-size: 14px; line-height: 1.75; }
.hero .btn { min-height: 43px; }
.hero-art { display: grid; place-items: center; position: relative; min-width: 0; margin-right: clamp(16px,3.5vw,51px); background: radial-gradient(ellipse at 55% 52%,#9181ef25 10%,transparent 68%); }
.hero-art:before,.hero-art:after { content: ""; position: absolute; width: min(94%,325px); height: 135px; transform: rotate(-18deg) translate(2px,13px); border: 1px solid #a29de23a; border-radius: 50%; }
.hero-art:after { height: 98px; transform: rotate(19deg); }
.vault { display: grid; place-items: center; width: clamp(98px,11.5vw,165px); aspect-ratio: 1; position: relative; z-index: 1; transform: rotate(-8deg); border: 1px solid #c8c3ff8d; box-shadow: 0 8px 0 #1b203d,0 10px 0 #6f6baf78,0 17px 24px #18183062,inset 0 0 20px #c3baff2f; border-radius: 22%; color: #e2daff; background: linear-gradient(150deg,#7a71ad,#4b4778 58%,#3d3c64); }
.vault:before { content: ""; position: absolute; inset: 10%; border: 1px solid #cec5ff61; border-radius: 20%; background: linear-gradient(140deg,#e7e0ff13,#1d1b410e 51%,#29274938); }
.vault .ico { font-size: clamp(44px,5.6vw,86px); transform: rotate(8deg); filter: drop-shadow(1px 3px 4px #343049c9); }
.hero-dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #d2c3fe; box-shadow: 0 0 13px #e5d4ff95; }
.hero-dot.first { top: 25%; right: 17%; }.hero-dot.last{ bottom: 23%; left: 14%; width: 5px; height: 5px; }

.guide { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); margin: 16px 0 21px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--lift); }
.guide-step { min-width: 0; display: flex; align-items: flex-start; gap: 11px; padding: 16px clamp(11px,1.25vw,19px); }
.guide-step + .guide-step { border-left: 1px solid var(--hairline); }
.guide-step .ico { width: 32px; height: 32px; background: var(--accent-light); border-radius: 8px; color: var(--accent); font-size: 18px; }
.guide-step b,.guide-step small { display: block; }
.guide-step b { font-size: 14px; }
.guide-step small { color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.5; }
.home-grid,.detail-grid { display: grid; grid-template-columns: minmax(0,1.22fr) minmax(0,.78fr); align-items: start; gap: 16px; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--lift); }
.panel-head, .panel-body { padding: 16px 19px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 9px 15px; border-bottom: 1px solid var(--hairline); }
.panel-head h2, .panel-body h2 { font-size: 18px; letter-spacing: -.02em; line-height: 1.3; }
.panel-head small { color: var(--muted); font-size: 12px; display: block; margin-top: 3px; }
.panel-body > p { margin-top: 7px; }
.resource-row { display: flex; gap: 11px; padding: 13px 18px; align-items: center; width: 100%; min-width: 0; text-align: left; border: 0; background: none; }
.resource-row + .resource-row { border-top: 1px solid var(--hairline); }
.resource-row:hover { background: #f8f7fe; }
.resource-row:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.row-icon,.category-icon { display: grid; place-items: center; width: 34px; height: 37px; flex: none; border: 1px solid #e7e2f6; border-radius: 8px; color: var(--accent); background: #f2effb; font-size: 19px; }
.resource-row span:nth-child(2) { min-width: 0; flex: 1; }
.resource-row b { display: block; font-size: 14px; overflow-wrap: anywhere; }
.resource-row small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.row-arrow { align-self: center; color: #72759b; }
.status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 6px; font-size: 11px; font-weight: 660; width: fit-content; white-space: nowrap; color: #555d77; background: #ebedf4; }
.status:before { content: ""; width: 5px; height: 5px; border-radius: 100%; background: currentColor; }
.status.active,.status.allowed { color: #493b88; background: #ede9fc; }
.status.pending { color: #765216; background: #f8efd8; }
.status.denied,.status.revoked { color: #82512e; background: #faeee3; }
.status.expired { color: #555f80; background: #edf0f8; }
.empty { display: flex; gap: 12px; align-items: flex-start; padding: 18px 19px; }
.empty > .ico { width: 33px; height: 33px; background: #f0eef8; color: var(--accent); border-radius: 8px; font-size: 19px; }
.empty b { display: block; font-size: 14px; }
.empty p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.empty .action-link { margin-top: 9px; display: inline-flex; }
.resource-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 17px; }
.resource-card { display: flex; flex-direction: column; min-width: 0; padding: 19px; }
.resource-ident { display: flex; align-items: flex-start; gap: 13px; }
.resource-ident h2 { font-size: 19px; letter-spacing: -.018em; margin-top: 2px; }
.resource-ident p,.resource-card > p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.resource-card > p { margin-top: 13px; }
.resource-card dl,.detail-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px 16px; margin: 14px 0; }
.resource-card dt,.detail-list dt { color: var(--muted); font-size: 12px; }
.resource-card dd,.detail-list dd { margin: 3px 0 0; font-size: 14px; font-weight: 560; }
.resource-card .button-row { margin-top: auto; padding-top: 13px; border-top: 1px solid var(--hairline); }
.split-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.split-head h2 { font-size: 21px; }
.request-reason { white-space: pre-wrap; padding: 13px 14px; border-left: 2px solid #b3a8de; border-radius: 0 6px 6px 0; background: #f6f4fd; color: #404561; font-size: 14px; }
.request-footer { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; border-top: 1px solid var(--hairline); margin-top: 15px; padding-top: 14px; }
.list-stack { display: grid; gap: 11px; }
.list-choice { display: flex; align-items: center; gap: 9px; justify-content: space-between; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
.list-choice:hover,.list-choice[aria-current] { background: #f0edfa; border-color: #cdc4e9; }
.list-choice strong,.list-choice small { display: block; }
.list-choice strong { overflow-wrap: anywhere; font-size: 14px; }
.list-choice small { color: var(--muted); font-size: 12px; margin-top: 2px; }
.filters { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.page-filters { margin: 0 0 13px; }
.filter-button { padding: 4px 8px; border: 1px solid transparent; border-radius: 6px; font-size: 12px; color: var(--muted); background: none; }
.filter-button:hover,.filter-button[aria-pressed="true"] { border-color: #ded8f2; color: var(--accent-deep); background: var(--accent-light); }
.audit-list { list-style: none; }
.audit-row { display: grid; grid-template-columns: minmax(132px,.32fr) minmax(0,1fr) minmax(85px,.29fr); gap: 8px 14px; align-items: start; padding: 13px 19px; border-bottom: 1px solid var(--hairline); }
.audit-row:last-child { border-bottom: 0; }
.audit-row time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.audit-row time, .audit-row .status { margin-top: 2px; }
.event-text b { display: block; font-size: 14px; }
.event-text small { display:block; color: var(--muted); font-size: 12px; }
.callout { display:flex; align-items: flex-start; gap: 9px; color: #534781; background: #f1eeff; border: 1px solid #e0d9fc; border-radius: 9px; padding: 11px 13px; font-size: 13px; }
.callout .ico { font-size: 17px; margin-top: 2px; }
.callout + .button-row { margin-top: 13px; }
.report-hero { border-bottom: 1px solid var(--hairline); margin-bottom: 16px; padding-bottom: 15px; }
.report-hero h2 { margin: 7px 0; font-size: 25px; }
.report-hero .report-description { color: var(--muted); font-size: 13px; }
.report-scroll { overflow-x: auto; }
.report-table { border-collapse: collapse; width: 100%; text-align: left; font-size: 13px; }
.report-table th { background: var(--tint); color: #525a74; font-weight: 620; }
.report-table th,.report-table td { padding: 9px 12px; border-bottom: 1px solid var(--hairline); min-width: 92px; white-space: normal; overflow-wrap: anywhere; }
.report-table td { font-variant-numeric: tabular-nums; }
.clock-panel { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 7px 12px; margin-top: 18px; padding: 11px 14px; }
.clock-panel b { font-size: 13px; }
.clock-panel small { display: block; font-size: 12px; color: var(--muted); }
.clock-panel .ico { color: var(--accent); margin-right: 4px; }

.picker { position: relative; min-width: 0; max-width: 100%; }
.picker summary { list-style: none; }
summary::-webkit-details-marker { display: none; }
.picker summary { display: flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 9px; max-width: 100%; cursor: pointer; border: 1px solid #d5daea; border-radius: 7px; color: #373b5d; background: var(--paper); font-size: 12px; font-weight: 610; }
.picker summary:after { content: ""; width: 5px; height: 5px; flex: none; transform: rotate(45deg); border: solid currentColor; border-width: 0 1px 1px 0; margin: -2px 1px 0 3px; }
.picker[open] summary:after { transform: rotate(225deg); margin-top: 3px; }
.picker-list { position: absolute; z-index: 5; top: calc(100% + 5px); left: 0; min-width: 145px; max-width: min(245px,calc(100vw - 27px)); width: max-content; padding: 4px; border: 1px solid #d9d5e7; border-radius: 8px; background: #fff; box-shadow: 0 9px 22px #24274721; }
.picker.end .picker-list { left: auto; right: 0; }
.picker-item { display: block; width: 100%; padding: 6px 9px; border: 0; border-radius: 5px; background: transparent; text-align: left; font-size: 13px; overflow-wrap: anywhere; }
.picker-item:hover,.picker-item[aria-pressed="true"] { background: var(--accent-light); color: var(--accent-deep); }
.picker-item[aria-pressed="true"] { font-weight: 680; }
dialog { padding: 0; width: min(540px, calc(100% - 28px)); max-height: calc(100% - 24px); border: 1px solid #ddd9ef; border-radius: 15px; color: var(--ink); background: var(--paper); box-shadow: 0 16px 60px #18173255; }
dialog::backdrop { background: #22263d85; }
.dialog-inner { padding: 21px; }
.dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 9px; margin-bottom: 15px; }
.dialog-head h2 { font-size: 22px; letter-spacing: -.025em; }
.dialog-head p { margin-top: 4px; color: var(--muted); font-size: 13px; }
.close { background: #eeedf6; border: 0; color: #49476a; width: 31px; height: 31px; flex: none; border-radius: 7px; font-size: 22px; line-height: 1; }
.close:hover { background: #e7e1f8; }
.form-field { display: grid; gap: 5px; color: #30364f; font-size: 13px; font-weight: 610; margin-top: 13px; }
.form-field input,.form-field textarea { min-width: 0; width: 100%; min-height: 41px; padding: 8px 10px; border-radius: 7px; border: 1px solid #cfd3e4; background: #fdfdff; font-size: 14px; font-weight: 400; }
.form-field textarea { min-height: 88px; resize: vertical; }
.form-field > small { color: var(--muted); font-weight: 400; }
.form-field .picker summary { min-height: 39px; width: max-content; }
.custom-duration { display: grid; align-items: center; grid-template-columns: auto minmax(0,150px); gap: 9px; margin-top: 4px; }
.form-end { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; margin-top: 16px; }
.form-error { color: #783d26; background: #fbede7; border-radius: 7px; padding: 8px 10px; margin-top: 12px; font-size: 13px; }
.entry { display: grid; align-items: center; justify-items: center; padding: 20px; min-height: 100dvh; background: radial-gradient(ellipse at top left,#e5e1f5,transparent 64%), var(--canvas); color: var(--muted); }
.entry-card { width: min(100%,460px); padding: 27px; }
.entry-card h1 { color: var(--ink); font-size: 28px; margin: 10px 0 4px; letter-spacing: -.035em; }
.entry-card .btn { margin-top: 15px; }
.notice { position: fixed; z-index: 10; left: calc(var(--sidebar) + (100% - var(--sidebar)) / 2); bottom: 17px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 26px); padding: 10px 14px; color: #fff; background: #313454; border-radius: 9px; box-shadow: 0 4px 16px #27274936; font-size: 13px; overflow-wrap: anywhere; }
.fatal { margin: 16px; }

@media (max-width: 1100px) {
  :root { --sidebar: 197px; }
  .sidebar { padding-inline: 12px; }
  .wordmark { font-size: 15px; }
  .brand-icon { width: 33px; height: 33px; }
  .hero { min-height: 230px; }
  .hero h1 { font-size: clamp(29px,4vw,43px); }
}
@media (max-width: 820px) {
  :root { --sidebar: 0px; }
  .shell { display: block; }
  .sidebar { position: relative; height: auto; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 5px 10px; align-items: center; padding: 11px 17px 9px; z-index: 1; }
  .wordmark { border: 0; margin: 0; padding: 3px 0; }
  .wordmark small { display: none; }
  .sidebar nav { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 3px; }
  .nav-link { min-height: 34px; padding: 4px 7px; gap: 4px; font-size: 12px; }
  .nav-link .ico { width: 14px; font-size: 13px; }
  .sidebar-footer { display: none; }
  .mobile-logout { display: inline-block; }
  .topbar { min-height: 51px; padding-block: 7px; }
  .page { padding-top: 21px; }
  .hero { min-height: 220px; }
}
@media (max-width: 590px) {
