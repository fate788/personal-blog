<!doctype html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#291f28">
  <meta name="description" content="在图书馆预约样例中对照修复前后，复核可访问性问题和键盘操作。">
  <link rel="icon" href="data:,">
  <style>
:root {
  color-scheme: light;
  --page: #f5f0e8;
  --paper: #fffcf6;
  --ink: #302521;
  --muted: #695943;
  --night: #302331;
  --accent: #674354;
  --line: #dfd3c5;
  --soft: #f2eae0;
  --alarm: #884120;
  --alarm-bg: #faebdd;
  --ok: #275546;
  --ok-bg: #e7eee4;
  --heading: 'Noto Serif CJK SC', 'Source Han Serif SC', 'Songti SC', STSong, SimSun, serif;
  --text: 'PingFang SC', 'Microsoft YaHei UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
  --number: 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
  font-family: var(--text);
  font-size: 15px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); }
h1, h2, h3, h4, p, dl, dd { margin: 0; }
a { color: inherit; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .65; cursor: default; }
:where(button, a, input, select):focus-visible { outline: 3px solid #8f5728; outline-offset: 3px; }
.shell { width: min(1312px, 100% - 72px); margin-inline: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.skip { position: fixed; z-index: 5; top: 12px; left: 12px; transform: translateY(-170%); padding: 10px 15px; background: var(--paper); color: var(--ink); }
.skip:focus { transform: none; }

.mast { color: #fff7e8; background: var(--night); border-bottom: 1px solid #73586a; }
.mast-inner { min-height: 61px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 720; letter-spacing: .03em; text-decoration: none; white-space: nowrap; }
.brand-mark { width: 29px; height: 29px; border: 1px solid #a3818d; border-radius: 5px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 7px; background: #51364a; }
.brand-mark i { display: block; width: 3px; height: 12px; background: #f2dbb0; border-radius: 1px; }
.brand-mark i:nth-child(2) { height: 10px; }
.brand-mark i:nth-child(3) { height: 13px; transform: rotate(-15deg); margin-left: 1px; }
.button { min-height: 36px; padding: 7px 11px; border-radius: 5px; border: 1px solid; color: inherit; font-size: 12px; font-weight: 670; white-space: nowrap; }
.mast-action { background: #453044; border-color: #957182; color: #fff5e4; }
.mast-action:not(:disabled):hover { background: #65455a; }
.mast :focus-visible { outline-color: #fae4b4; }

.main { padding-top: 30px; }
.intro { display: grid; grid-template-columns: 1fr minmax(275px, .49fr); gap: 30px; align-items: end; padding: 4px 0 24px; border-bottom: 1px solid var(--line); }
.intro-copy, .metrics { min-width: 0; }
.intro h1 { font: 740 clamp(29px, 3.1vw, 51px)/1.2 var(--heading); letter-spacing: .033em; text-wrap: balance; }
.intro-copy > p { margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.65; }
.intro-actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 17px; }
.version-switch { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid #d8c9bb; border-radius: 6px; background: #eae1d7; }
.version-switch button { min-height: 34px; padding: 6px 15px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #513b47; font-size: 13px; font-weight: 630; white-space: nowrap; }
.version-switch button[aria-pressed='true'] { background: #5c3d52; color: #fff5e9; border-color: #5c3d52; }
.version-switch button[aria-pressed='false']:hover { background: #f5ede3; }
.run-action { background: var(--paper); border-color: #c7b3ba; color: #604255; }
.run-action:not(:disabled):hover { background: #eee2e8; }
.run-action span { margin-right: 3px; font-size: 14px; }
.metrics { align-self: end; border: 1px solid #ded0c0; border-top: 2px solid #986678; border-radius: 8px; padding: 13px 16px 15px; background: #fcf8f1; box-shadow: 0 8px 18px #48271107; }
.metrics-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.metrics-head h2 { font-size: 13px; }
#metric-version { font-size: 11px; border: 1px solid #dccbbd; border-radius: 3px; padding: 2px 6px; color: #614453; background: #f9efe5; }
.metrics dl { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.metrics dl div { display: flex; flex-direction: column-reverse; gap: 3px; }
.metrics dl div + div { border-left: 1px solid #e2d8ca; padding-left: 12px; }
.metrics dt { font-size: 11px; font-weight: 570; color: var(--muted); white-space: nowrap; }
.metrics dd { font: 650 clamp(20px, 3vw, 39px)/1.08 var(--number); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
#failed-total { color: var(--alarm); }
#passed-total { color: var(--ok); }

.workspace { display: grid; grid-template-columns: minmax(0, 1.56fr) minmax(300px, 1fr); align-items: stretch; gap: 16px; margin-top: 19px; }
.preview, .findings, .manual { min-width: 0; border: 1px solid #d9cec1; border-radius: 8px; background: var(--paper); box-shadow: 0 7px 18px #48271108; }
.preview { overflow: clip; }
.preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; background: #ecdfce; border-bottom: 1px solid #dccdb9; }
.preview-bar h2 { font-size: 13px; letter-spacing: .04em; }
.preview-bar span { color: #5c4d3b; font-size: 11px; }
.preview-wrap { position: relative; }
.focus-mark { position: absolute; z-index: 2; pointer-events: none; border: 2px solid #995323; outline: 1px solid #fff8db; border-radius: 5px; box-shadow: 0 0 0 3px #ffe2a479; }

.sample-booking { min-width: 0; color: #2d3029; background: #fbf9f0; }
.sample-hero { min-height: 223px; position: relative; isolation: isolate; display: flex; align-items: end; padding: 22px; color: #fffaec; overflow: clip; background: #413b34; }
.sample-hero::after { position: absolute; content: ''; inset: 0; z-index: -1; background: linear-gradient(90deg, #251c18c9 0%, #332923a6 47%, #3d2a2142 80%), linear-gradient(0deg, #281f1ab5, transparent 63%); }
.sample-photo { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
.sample-hero-copy { max-width: calc(100% - 35px); }
.sample-kicker { margin-bottom: 5px; color: #fff6d4; font-weight: 700; font-size: 11px; letter-spacing: .13em; }
.sample-title { color: #fffaf0; font: 720 clamp(27px, 3.15vw, 43px)/1.15 var(--heading); letter-spacing: .055em; text-shadow: 0 1px 5px #292019; }
.sample-subtitle { margin-top: 8px; color: #fff8e2; font-size: 12px; line-height: 1.6; }
.sample-help-button { position: absolute; top: 14px; right: 15px; width: 40px; min-height: 40px; border: 1px solid #ebdac0; border-radius: 50%; background: #382b24; color: #fff8e3; font-family: var(--number); font-size: 16px; font-weight: 700; }
.sample-help-button:hover { background: #624a3a; }
.sample-help { border-bottom: 1px solid #d8cdb7; background: #f5ebd5; padding: 11px 16px; color: #553f2e; font-size: 13px; line-height: 1.65; }
.sample-form { padding: 17px 22px 19px; }
.sample-section-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.sample-section-title { font: 720 21px/1.2 var(--heading); color: #3d352c; }
.sample-date { color: #655746; font-size: 12px; font-weight: 620; white-space: nowrap; }
.sample-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sample-field { display: grid; gap: 5px; min-width: 0; }
.sample-label { color: #443a2d; font-size: 12px; font-weight: 690; }
.sample-input { width: 100%; min-height: 39px; min-width: 0; padding: 7px 9px; border: 1px solid #9e8d7c; border-radius: 5px; color: #342e27; background: #fffdf8; }
.sample-input::placeholder { color: #786953; }
select.sample-input { padding-right: 14px; }
@supports (appearance: base-select) and selector(::picker(select)) {
  .sample-select, .sample-select::picker(select) { appearance: base-select; }
  .sample-select { align-items: center; cursor: pointer; }
  .sample-select::picker-icon { color: #674354; }
  .sample-select::picker(select) { margin-block: 4px; padding: 3px; border: 1px solid #9e8d7c; border-radius: 5px; background: #fffdf8; color: #342e27; box-shadow: 0 7px 18px #48271125; }
  .sample-select option { min-height: 34px; padding: 6px 9px; border-radius: 3px; }
  .sample-select option:checked { background: #eae1d7; color: #52354b; font-weight: 690; }
  .sample-select option:is(:hover, :focus-visible) { background: #5c3d52; color: #fff5e9; }
}
.sample-note { display: block; width: fit-content; max-width: 100%; margin-top: 10px; padding: 4px 6px; font-size: 12px; line-height: 1.55; border-radius: 3px; }
.sample-baseline .sample-note { color: #9fa9a6; background: #f4f5ef; }
.sample-fixed .sample-note { color: #354a44; background: #f4f5ef; }
.sample-baseline :focus-visible { outline: none; box-shadow: none; }
.sample-fixed :focus-visible { outline: 3px solid #793f4e; outline-offset: 3px; }
.sample-fixed .sample-help-button:focus-visible { outline-color: #fff3ba; }
.sample-actions { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sample-submit { min-height: 39px; border: 1px solid #503047; border-radius: 4px; padding: 8px 14px; background: #503047; color: #fff8e9; font-weight: 650; font-size: 13px; white-space: nowrap; }
.sample-submit:hover { background: #754e64; }
.sample-error, .sample-result { margin-top: 10px; border: 1px solid; border-radius: 5px; font-size: 13px; line-height: 1.6; padding: 7px 9px; overflow-wrap: anywhere; }
.sample-error { color: #802923; background: #fceee5; border-color: #e4beb3; }
.sample-result { color: #2d5143; background: #e8efe2; border-color: #bbd2bf; }

.findings { padding: 16px 16px 14px; }
.findings-head, .manual-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.findings-head h2, .manual-head h2 { font: 700 23px/1.25 var(--heading); letter-spacing: .04em; }
.findings-head p, .manual-head p { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.findings-count { font: 700 11px/1.2 var(--text); white-space: nowrap; border: 1px solid #e6c5b5; border-radius: 4px; padding: 3px 6px; color: var(--alarm); background: var(--alarm-bg); }
.finding-list { display: grid; gap: 5px; margin-top: 12px; }
.finding-button { width: 100%; min-height: 43px; display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 9px; align-items: center; text-align: left; padding: 6px 9px; color: #47372e; background: #faf5eb; border: 1px solid #e5d8c7; border-radius: 4px; }
.finding-button::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #9b522c; }
.finding-button[aria-pressed='true'] { background: #f5e6db; border-color: #ad765d; color: #643523; }
.finding-button:hover { background: #faeade; }
.finding-name { min-width: 0; font-size: 13px; font-weight: 670; overflow-wrap: anywhere; }
.finding-rule { color: #6c4d3e; font: 620 11px/1.1 var(--number); white-space: nowrap; }
.finding-detail { margin-top: 10px; padding: 9px 10px; background: #f7ede1; border-left: 2px solid #a86d53; border-radius: 0 4px 4px 0; }
.finding-detail h3 { font-size: 13px; }
.finding-detail p { margin-top: 4px; color: #574233; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.finding-detail code { display: block; margin-top: 4px; color: #614555; font: 11px/1.5 var(--mono); overflow-wrap: anywhere; }
.empty-findings { margin-top: 10px; padding: 10px 12px; border: 1px solid #c2d2bf; border-radius: 5px; background: var(--ok-bg); color: var(--ok); font-size: 13px; line-height: 1.65; }
.fixed-checks { display: grid; gap: 4px; margin-top: 9px; }
.fixed-check { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 9px; border-bottom: 1px solid var(--line); color: #4d3f37; font-size: 13px; }
.fixed-check span:last-child { color: var(--ok); font-size: 11px; font-weight: 650; white-space: nowrap; }

.manual { margin-top: 15px; padding: 16px; }
.manual-head .manual-count { color: #594555; font: 650 12px/1.4 var(--text); white-space: nowrap; }
.manual-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 12px; }
.manual-item { min-width: 0; border: 1px solid #e3d8ca; border-radius: 5px; background: #fbf6ee; padding: 10px; }
.manual-item h3 { font-size: 14px; }
.manual-item p { margin-top: 4px; min-height: 2.7em; color: var(--muted); font-size: 12px; line-height: 1.55; }
.manual-choice { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.manual-choice button { min-height: 32px; white-space: nowrap; padding: 4px 6px; border: 1px solid #d8cbbe; border-radius: 4px; color: #594636; background: #fffbf2; font-size: 11px; }
.manual-choice button[aria-pressed='true'] { background: #ede0e5; color: #604057; border-color: #9e7588; font-weight: 670; }
.manual-choice button[data-outcome='pass'][aria-pressed='true'] { background: var(--ok-bg); color: var(--ok); border-color: #648e79; }
.manual-choice button[data-outcome='fail'][aria-pressed='true'] { background: var(--alarm-bg); color: var(--alarm); border-color: #ac7855; }
.foot { padding: 10px 0 20px; color: var(--muted); font-size: 11px; line-height: 1.55; }

@media (max-width: 960px) {
  .shell { width: calc(100% - 38px); }
  .workspace { grid-template-columns: minmax(0, 1.22fr) minmax(275px, 1fr); gap: 10px; }
  .intro { gap: 14px; }
  .sample-form, .sample-hero { padding-inline: 15px; }
  .findings { padding-inline: 12px; }
}
@media (max-width: 700px) {
  .shell { width: calc(100% - 26px); }
  .mast-inner { min-height: 53px; gap: 6px; }
  .brand { gap: 6px; font-size: 13px; }
  .brand-mark { width: 25px; height: 25px; padding-bottom: 5px; }
  .mast-action { font-size: 11px; padding-inline: 6px; }
  .main { padding-top: 18px; }
  .intro { grid-template-columns: 1fr; gap: 12px; padding-bottom: 13px; }
  .intro h1 { font-size: clamp(27px, 5.4vw, 40px); }
  .intro-copy > p { margin-top: 7px; font-size: 13px; }
  .intro-actions { margin-top: 10px; }
  .metrics { padding: 9px 11px; }
  .metrics dl { margin-top: 6px; }
  .metrics dd { font-size: 29px; }
  .workspace { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 13px; }
  .sample-hero { min-height: 170px; }
  .sample-form { padding-block: 13px; }
  .manual { margin-top: 12px; padding: 12px; }
  .manual-list { grid-template-columns: minmax(0, 1fr); }
  .manual-item p { min-height: 0; }
}
@media (max-width: 360px) {
  .sample-form-grid { grid-template-columns: minmax(0, 1fr); gap: 9px; }
  .sample-kicker { letter-spacing: .08em; }
  .sample-section-title { font-size: 19px; }
  .sample-date { font-size: 10px; }
}

</style>
  <title>无障碍走查工作台</title>
</head>
<body>
  <a class="skip" href="#workbench">跳到走查工作区</a>
  <header class="mast">
    <div class="shell mast-inner">
      <a class="brand" href="./index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>无障碍走查工作台</a>
      <button type="button" class="button mast-action" id="export-report" disabled>导出走查报告 <span aria-hidden="true">↓</span></button>
    </div>
  </header>
  <main class="shell main" id="workbench" tabindex="-1">
    <section class="intro" aria-labelledby="headline">
      <div class="intro-copy">
        <h1 id="headline">图书馆预约无障碍走查</h1>
        <p>对照修复前后，在同一条预约流程中复核问题。</p>
        <div class="intro-actions">
          <div class="version-switch" role="group" aria-label="预约样例版本">
            <button type="button" id="mode-baseline" aria-pressed="true">修复前</button>
            <button type="button" id="mode-fixed" aria-pressed="false">修复后</button>
          </div>
          <button type="button" class="button run-action" id="run-audit" disabled><span aria-hidden="true">↻</span> 重新检查</button>
        </div>
      </div>
      <section class="metrics" aria-labelledby="metrics-heading">
        <div class="metrics-head"><h2 id="metrics-heading">自动检查</h2><span id="metric-version">修复前</span></div>
        <dl id="audit-totals">
          <div><dt>已检查</dt><dd id="checked-total">–</dd></div>
          <div><dt>待复核</dt><dd id="failed-total">–</dd></div>
          <div><dt>已通过</dt><dd id="passed-total">–</dd></div>
        </dl>
      </section>
    </section>

    <div id="announcement" class="sr-only" role="status"></div>
    <section class="workspace" aria-label="预约样例与检查结果">
      <section class="preview" aria-labelledby="preview-title">
        <div class="preview-bar"><h2 id="preview-title">交互预览</h2><span>本地预约演示</span></div>
        <div class="preview-wrap" id="preview-wrap">
          <div id="preview-sample"></div>
          <div id="focus-mark" class="focus-mark" aria-hidden="true" hidden></div>
        </div>
      </section>

      <section class="findings" aria-labelledby="findings-title">
        <header class="findings-head"><div><h2 id="findings-title">问题与证据</h2><p>选择问题，定位到预约页面。</p></div><span id="findings-count" class="findings-count" hidden></span></header>
        <div id="finding-list" class="finding-list" aria-label="检查发现"></div>
        <div id="finding-detail" class="finding-detail" hidden></div>
        <p id="empty-findings" class="empty-findings" hidden></p>
      </section>
    </section>

    <section class="manual" aria-labelledby="manual-heading">
      <header class="manual-head">
        <div><h2 id="manual-heading">键盘走查</h2><p>在预约预览里操作，再给当前版本记录结果。</p></div>
        <p class="manual-count" id="manual-count">0 / 3 已记录</p>
      </header>
      <div class="manual-list" id="manual-list"></div>
    </section>
  </main>
  <footer class="shell foot">
    <p>检查范围限于演示页的五项自动规则。键盘操作和反馈由人工复核。</p>
