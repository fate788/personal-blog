    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <link rel="icon" href="data:,">
    <script>
      if (location.protocol !== "file:") {
        const address = new URL(location.href);
        if (address.searchParams.get("mode") !== "demo") {
          address.searchParams.set("mode", "demo");
          history.replaceState(null, "", address);
        }
      }
    </script>
    <meta charset="UTF-8">

    <style>
      .session-loading {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
        gap: 12px; background: #f8f6ef; color: #4b6052;
        font: 14px/1.6 'Segoe UI', 'Microsoft YaHei UI', sans-serif; letter-spacing: .07em;
      }
      .session-loading svg { display: block; width: 64px; height: 64px; overflow: visible; }
      .workbench-orbit { transform-origin: 32px 32px; animation: workbench-orbit 2.5s linear infinite; }
      .workbench-ink { stroke-dasharray: 10 90; animation: workbench-sweep 1.65s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes workbench-orbit { to { transform: rotate(1turn); } }
      @keyframes workbench-sweep {
        0% { stroke-dasharray: 10 90; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 64 36; stroke-dashoffset: -10; }
        100% { stroke-dasharray: 10 90; stroke-dashoffset: -100; }
      }
      @keyframes workbench-arrive { from { opacity: .9; } to { opacity: 1; } }
      #app > :is(.account-access,.shell) { animation: workbench-arrive 180ms ease-out; }
      @media (prefers-reduced-motion: reduce) {
        .workbench-orbit, .workbench-ink, #app > :is(.account-access,.shell) { animation: none; }
        .workbench-ink { stroke-dasharray: 35 65; }
      }
      @media (forced-colors: active) { .workbench-ink, .workbench-glyph { stroke: CanvasText; } }
    </style>

文档编号 SRS-ITSM-001 ｜ 版本 V1.0 ｜ 状态：提交需求评审
本文为虚构的企业数字化建设案例，部门、系统和数据为自建样例。

## 1. 项目目标与边界
员工通过统一入口提交报障，服务台分派并跟踪，值班人员处理重大事件，系统记录受控变更与审计过程。本期范围含员工门户、服务台、值班与变更控制台。自动执行生产变更和计费结算留在后续阶段。
本案例的单个组织空间具有独立工单与审计记录。P1 表示关键服务不可用。首次响应指服务台或值班工程师首次向报障人发送人工处理说明。

## 2. 角色和职责
报障人查阅本人提交工单和面向报障人的回复。服务台负责受理与分派。值班工程师处理当班事件。变更负责人拟定方案，由变更审批员或值班经理负责审批。组织管理员授权，审计员按授权范围查阅记录。
FR-001：员工通过企业统一身份登录，首次登录后依据身份声明绑定员工编号与组织空间。未成功绑定的会话不得创建工单。
FR-002：报障人可查阅本人提交的工单与公开回复，内部处理备注仅对所属组织中获授权的服务台和处理人可见。
FR-003：值班工程师只能访问当前组织空间内已分派给本人或本值班组的工单。审计员仅通过授权的审计视图查阅。
FR-004：统一身份系统传入岗位组，服务台按外部岗位组清单映射审批员与值班经理权限。外部岗位组清单由身份管理团队另行交付。

## 3. 报障与工单处理
FR-005：员工提交报障时填写服务、影响描述和联系渠道。同一组织及员工在 10 分钟内重复使用相同请求标识时，返回原工单编号。
FR-006：服务台可按服务目录、地点和班次选定队列。队列无人可受理时应采取适当措施并将工单交给相关人员。
FR-007：工单状态按「新建→处理中→已解决→已关闭」流转。报障人可在解决后 48 小时内确认解决或重开，超时自动关闭并记录系统操作人。
FR-008：处理人添加时间线备注时，必须显式选择公开或内部可见性。后续变更可见性须记录操作人和原因。
FR-009：分派工单时更新责任组和处理人，并通过消息服务通知接收人。消息服务失败时系统提示分派失败。
FR-010：收到重开操作后保留原解决记录，工单转回处理中，将重开原因写入时间线，并通知最后一个有效责任组。
FR-011：工单查询结果按更新时间倒序排列，相同时间使用工单编号降序作为次排序键。查询接口仅返回本页授权范围内的结果。

## 4. 重大事件与 SLA
FR-012：重大事件由值班经理标记为 P1，升级后必须关联受影响服务。首次响应未完成时，P1 工单处于「等待用户」状态也继续计算首次响应 SLA。
FR-013：当首次响应 SLA 达到阈值的 80% 时向责任组值班人员发出预警，同一工单同一响应周期只发一次，保留通知事件编号。
FR-014：看板需尽快展示最新的 P1 工单状态，便于值班经理跟踪当前处置进度。
NFR-001：P1 首次响应 SLA 为 15 分钟，从工单首次保存起算，进入「等待用户」状态时暂停。恢复时累加已消耗时间。
NFR-002：在 250 个并发工单查询用户下，最近 30 天记录查询的服务端 P95 耗时不超过 800 毫秒，5 分钟观测窗口内统计。
NFR-003：员工提交报障后系统应快速响应并显示编号。

## 5. 变更与审批
FR-015：对生产服务的常规变更应填写影响范围、实施窗口和回滚方案，创建待审批记录并关联服务资产。
FR-016：常规和紧急变更必须有独立审批记录。发起人、执行人与审批人分离，审批员不得审批本人发起的生产变更。
FR-017：紧急变更由值班经理在收到请求后 10 分钟内作出批准或拒绝决定。值班高峰允许值班经理直接批准本人发起的紧急变更。
FR-018：已批准变更执行前须核验审批记录仍有效；实施窗口以外禁止启动，界面提示重新提交方案。
FR-019：变更回滚时保存触发原因、回滚执行人、回滚结果和时间戳。回滚不覆盖已保存的实施记录。
FR-020：工单可关联生产变更，只有处理负责人可操作关联。关联权限与角色规则见 FR-099。
FR-021：当工单升级为 P1 时，为缩短协调时间，值班工程师可以打开其他组织空间中的 P1 工单附件，无需额外授权。

## 6. 数据、审计和集成
DR-001：工单编号在组织空间内唯一，关联记录同时持有组织标识和工单编号。新增工单与请求标识在一次事务中提交。
DR-002：审批事件应记录组织、变更编号、审批人、决定、时间和理由。生产变更审批审计记录仅保留 30 天，期满后永久删除。
DR-003：附件对象、工单与当前读取会话必须属于同一组织空间。所有下载均校验工单读取权限和附件授权。
DR-004：服务台改变工单状态、分派对象或备注可见性时记录旧值、新值和操作来源。审计事件以追加方式保存。
NFR-004：生产变更审批审计记录在线保留不少于 180 天，在此期间审核人可通过工单或变更编号检索。
NFR-005：系统发现存储失败时应返回可追踪错误编号并写入运维日志。错误消息不得包含访问令牌或完整工单附件路径。
NFR-006：附件的恶意内容检测在上传后运行。判定为待检查或不通过的附件在所有用户视图中均禁止下载。

## 7. 验收资料
验收取数使用虚构组织、员工和工单。角色组映射由身份管理团队补交。项目组准备 P1 升级、等待回复、通知失败、跨组织读取拒绝和紧急变更分离审批的验收场景。`,nm=Oc.replace("版本 V1.0 ｜ 状态：提交需求评审","版本 V2.0 ｜ 状态：修订后复查").replace("报障后系统应快速响应并显示编号。","报障后，从提交请求到服务端返回编号的 P95 耗时，在 120 个并发提交下不超过 1.2 秒。").replace("关联权限与角色规则见 FR-099。","关联权限按 FR-003 与 DR-001 核对；发起关联前校验两条记录的组织标识。").replace("生产变更审批审计记录仅保留 30 天，期满后永久删除。","生产变更审批审计记录在线保留不少于 180 天。"),sm=`软件需求规格说明书 V1.0（节选）
