.query-pane,.comparison { min-width:0; border:1px solid var(--rule); border-radius:8px; background:#fcfdfe; }
.section-heading { display:flex; align-items:baseline; justify-content:space-between; gap:9px; padding:12px 13px 9px; }
.section-heading h2 { font-size:18px; letter-spacing:-.015em; }
.section-heading > span { font:12px var(--mono); color:var(--muted); white-space:nowrap; }
.outcome-filter { display:flex; align-items:center; flex-wrap:wrap; gap:3px; padding:0 10px 8px; border-bottom:1px solid var(--rule); }
.outcome-filter button { min-height:40px; padding:4px 7px; border:1px solid transparent; border-radius:4px; color:var(--muted); background:transparent; font-size:12px; white-space:nowrap; }
.outcome-filter button:hover { border-color:#d4e2e7; }
.outcome-filter button[aria-pressed="true"] { background:#e1eef4; color:#214c60; font-weight:690; }
.case-list { max-height:min(53vh,450px); overflow:auto; overscroll-behavior:contain; scrollbar-width:thin; }
.case-choice { display:flex; justify-content:space-between; align-items:center; gap:6px; width:100%; min-height:53px; padding:7px 10px 7px 12px; text-align:left; border:0; border-bottom:1px solid #e5edf1; background:transparent; }
.case-choice:last-child { border-bottom:0; border-radius:0 0 8px 8px; }
.case-choice:hover,.case-choice[aria-pressed="true"] { background:#eaf3f6; }
.case-choice[aria-pressed="true"] { box-shadow:inset 3px 0 #3a819b; }
.case-choice:focus-visible { outline-offset:-3px; }
.case-name { display:grid; gap:1px; min-width:0; }
.case-name strong { font-size:13px; color:#213b4a; overflow-wrap:anywhere; }
.case-name small { color:#526975; font-size:11px; }
.outcome { display:grid; justify-items:end; gap:1px; flex:none; color:#4f636f; font-size:11px; font-weight:660; white-space:nowrap; }
.outcome small { font:10px var(--mono); }
.outcome.improved { color:#1e634d; }
.outcome.declined,.outcome .outcome-warning { color:#8c4138; }
.outcome .outcome-warning { font:10px/1.3 var(--sans); }
.empty-queries { margin:14px; color:var(--muted); }
.comparison { padding:14px; }
.case-header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.case-header p { color:var(--muted); font-size:12px; }
.case-header h2 { width:fit-content; margin-top:3px; color:#163746; font-size:clamp(20px,2.5vw,32px); line-height:1.2; letter-spacing:-.025em; overflow-wrap:anywhere; scroll-margin-top:14px; }
.try-query { flex:none; min-height:44px; display:inline-flex; align-items:center; gap:5px; padding:5px 8px; border-radius:4px; color:var(--accent-dark); font-size:12px; font-weight:690; white-space:nowrap; }
.try-query:hover { background:#ebf4f7; }
.case-note { margin:9px 0 11px; color:var(--muted); font-size:13px; }
.case-warning { margin:0 0 9px; color:#833b2f; font-size:12px; }
.rank-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.rank-panel { min-width:0; border:1px solid #dbe6eb; border-radius:6px; overflow:hidden; }
.rank-panel.candidate { border-color:#c0d8e2; }
.rank-heading { display:flex; justify-content:space-between; align-items:baseline; gap:5px; padding:8px 10px; color:#294554; background:#f0f4f6; border-bottom:1px solid #dbe6eb; }
.candidate .rank-heading { color:#1c4f63; background:#e5f1f5; }
.rank-heading h3 { font-size:14px; }
.rank-heading p,.rank-size,.rank-share { color:#425f6f; font:11px var(--mono); }
.rank-heading p { margin-top:3px; }
.rank-heading p > span { color:#214c60; font-weight:740; white-space:nowrap; }
.rank-size { white-space:nowrap; }
.rank-quantity { display:grid; white-space:nowrap; gap:4px; text-align:right; }
.rank-list { list-style:none; }
.rank-list li { display:grid; grid-template-columns:19px minmax(0,1fr); gap:5px; padding:8px 9px; min-height:52px; }
.rank-list li + li { border-top:1px solid #e9eff2; }
.rank-number { margin-top:2px; color:#456676; font:12px var(--mono); }
.rank-copy { min-width:0; overflow-wrap:anywhere; }
.rank-copy strong { display:block; color:#234352; font-size:13px; line-height:1.35; margin-bottom:2px; }
.rank-copy .sku,.match-trace { display:block; margin-bottom:3px; color:#4f6570; }
.match-trace { font-size:11px; line-height:1.3; }
.grade,.rank-change { display:inline-block; vertical-align:middle; padding:1px 4px; border-radius:3px; background:#eff3f6; color:#46606d; font-size:10px; font-weight:630; }
.grade-0 { background:#f8e8e4; color:#833b2f; }
.grade-1 { background:#f3edde; color:#795624; }
.grade-2,.grade-3 { background:#e7f1e9; color:#306042; }
.rank-change { margin-left:3px; background:#e7f1f5; color:#255b71; }
.rank-empty { padding:16px 10px; color:var(--muted); font-size:13px; }
.judgments,.metric-help { margin-top:10px; color:#425e6b; font-size:13px; }
.judgments summary,.metric-help summary { display:flex; justify-content:space-between; gap:8px; align-items:center; min-height:44px; padding:6px 8px; border:1px solid #dce8ee; border-radius:5px; font-weight:680; }
.judgments summary:hover,.metric-help summary:hover { background:#edf5f8; }
.judgments ul { list-style:none; padding:5px 8px; }
.judgments li { display:flex; align-items:center; justify-content:space-between; gap:7px; min-height:28px; border-bottom:1px solid #e7eef1; }
.judgments li .grade { flex:none; }
.empty-comparison h2 { font-size:18px; }
.empty-comparison p,.metric-help p { margin-top:8px; color:var(--muted); }
.metric-help { margin-bottom:14px; max-width:620px; }
.metric-help summary { background:#fcfdfe; }

  .shop-filters { gap:1px 5px; }

  .category-tab { flex:none; }
  .option-nav { width:100%; border-top:1px solid var(--rule); }
  .category-tab,.available-filter,.filter-menu summary { padding-inline:6px; font-size:12px; min-height:40px; }
  .product-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .product-body { padding:8px 8px 5px; }
  .product-body h3,.is-list .product-body h3 { font-size:14px; }
  .product-actions { padding:5px 8px 8px; }
  .product-price { font-size:17px; }
  .product-usage { font-size:11px; }
  .card-specs > div { grid-template-columns:minmax(37px,.78fr) minmax(0,1.2fr); gap:4px; font-size:11px; }
  .product-grid:not(.is-list) .product-usage { display:none; }
  .is-list .product-card { grid-template-columns:minmax(84px,.60fr) minmax(0,1.4fr); }
  .is-list .product-card > .photo-frame { grid-row:span 2; align-self:start; height:auto; min-height:0; aspect-ratio:1; border-radius:7px 0 4px 0; }
  .is-list .product-body { padding:9px 9px 0; }
  .is-list .product-actions { grid-column:2; flex-direction:row; align-items:flex-end; text-align:left; justify-content:space-between; padding:5px 9px 9px; }
  .product-sheet { grid-template-columns:minmax(0,1fr); }
  .sheet-visual { padding:9px 12px; gap:4px; }
  .product-sheet .photo-frame { height:clamp(120px,39vw,190px); aspect-ratio:auto; }
  .sheet-copy { padding:17px 14px 21px; }
  .has-compare-tray { padding-bottom:calc(105px + env(safe-area-inset-bottom)); }
  .compare-selection { display:grid; gap:3px; }
  .compare-tags { flex-wrap:nowrap; max-width:100%; overflow:auto; padding:2px; scrollbar-width:thin; }
  .compare-tags button { min-height:34px; flex:none; max-width:114px; font-size:11px; padding-inline:4px; }
  .comparison-sheet { padding:10px 9px; }
  .comparison-table :is(th,td) { padding:6px 4px; font-size:11px; }
  .lab-header { gap:6px; flex-wrap:wrap; }
  .lab-header p { margin-top:5px; font-size:13px; }
  .export { padding-inline:8px; font-size:12px; }
  .experiment-control { padding:8px; margin-bottom:7px; }
  .experiment-control h2 { font-size:14px; }
  .experiment-control p { font-size:11px; }
  .experiment-switch { padding-inline:3px; }
  .metric-grid { gap:5px; }
  .metric-tile { padding:7px 5px; }
  .metric-tile h2,.metric-tile p { font-size:11px; }
  .metric-value { gap:1px 4px; }
  .metric-delta { font-size:10px; }
  .evaluation-context { margin-bottom:7px; font-size:11px; }
  .section-heading { padding:7px 8px 5px; }
  .outcome-filter { padding:0 6px 5px; }
  .comparison { padding:7px; }
  .rank-pair { gap:4px; }
  .rank-heading { padding:6px 5px; }
  .rank-heading h3 { font-size:12px; }
  .rank-heading p,.rank-size,.rank-share { font-size:10px; }
  .rank-size { display:none; }
  .rank-list li { grid-template-columns:12px minmax(0,1fr); gap:3px; padding:6px 4px; }
  .rank-copy strong,.rank-empty { font-size:12px; }
  .site-footer { margin-top:22px; }
  .site-footer .wrap { min-height:60px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { transition:none!important; }
}
