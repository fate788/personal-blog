.drawer-close:hover { border-color: #b4b9d2; background: #edeff7; }

.drawer-body > p { color: var(--soft); margin-bottom: 12px; font-size: 13px; }
.drawer-table { table-layout: fixed; border-top: 1px solid var(--line); }
.drawer-table :is(td,th):first-child { width: 55%; white-space: normal; overflow-wrap: anywhere; }
.drawer-table :is(td,th):nth-child(2) { width: 18%; }
.drawer-table :is(td,th):last-child { width: 27%; white-space: normal; line-height: 1.4; }
.drawer-table ul,.drawer-table ol { list-style: none; }
.drawer-table a { color: var(--blue); }
.drawer-table a:hover { text-decoration: underline; text-underline-offset: 3px; }
.drawer-summary { padding: 11px 13px; margin-bottom: 15px; background: #f2f3fa; border-radius: 6px; border: 1px solid #e2e5f1; color: #4c5472; }
.drawer-summary strong { display: block; color: #35406f; margin-bottom: 2px; font-size: 15px; }
.drawer-summary p { font-size: 12px; line-height: 1.6; }
@media(max-width:1160px) {
  :root {--rail: 184px;}
  .brand { gap: 8px; padding-inline: 15px; }
  .filters { gap: 8px; }
}
@media(max-width:930px) {
  :root {--rail: 0px;}
  .sidebar { position: static; display: grid; align-items: center; grid-template-columns: auto minmax(0,1fr); width: 100%; padding-inline: 14px; border-right: 0; }
  .sidebar nav { margin-inline: 0; border: 0; padding: 0; display: flex; justify-content: flex-end; gap: 3px; }

  .topbar { min-height: 45px; }
}
@media(max-width:740px) {
  .study-grid,.try-grid { grid-template-columns: minmax(0,1fr); }
}
@media(max-width:680px) {
  :root { --chart-height: 123px; }
  .sidebar { display: block; padding-inline: 12px; }
  .sidebar nav { justify-content: flex-start; gap: 4px; border-top: 1px solid #ffffff19; padding: 4px 0 7px; }
  .nav-link { font-size: 12px; padding-inline: 9px; min-height: 36px; }
  .topbar { padding-inline: 14px; min-height: 36px; }
  #main { padding: 16px 13px 31px; }
  .page-heading { margin-bottom: 12px; gap: 9px 12px; align-items: flex-start; }
  .page-heading h1 { font-size: 31px; letter-spacing: -.035em; }
  .page-heading p:not(.eyebrow) { font-size: 12px; }
  .filters { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); padding: 8px 10px; gap: 6px 8px; }
  .filter-field { gap: 3px; }
  .picker summary { min-height: 32px; }

  .filter-meta { margin: 0; padding: 0 0 1px; }
  .picker { min-width: 0; }
  .filter-field:nth-child(even) .picker-list { left: auto; right: 0; }
  .metric-strip { margin-top: 11px; }
  .metric-tile { padding: 11px 8px; }
  .metric-label { font-size: 11px; }
  .metric-value { font-size: clamp(18px,6vw,28px); }
  .metric-detail { display: none; }
  .metric-icon { display: none; }
  .study-grid,.try-grid { gap: 10px; margin-top: 10px; }
  .card-head { padding: 12px 11px; gap: 8px; }
  .funnel-card .card-head { align-items: flex-start; flex-wrap: wrap; }
  .chart-controls { flex: none; }
  .axis-toggle button { padding-inline: 5px; }
  .chart-wrap,.chart-body:has(> .chart-axis) { grid-template-columns: 36px minmax(0,1fr); padding-inline: 5px 11px; }
  .chart-axis { margin: 21px 7px 0 0; }
  .chart-legend { padding-inline: 11px; padding-bottom: 8px; }
  .card-head h2 { font-size: 16px; }
  .card-head p { font-size: 11px; }
  .funnel-grid { padding: 7px 10px 10px; gap: 8px; }
  .step-title { font-size: 12px; }.step-title strong { font-size: 19px; }
  .step-foot { font-size: 10px; }
  .step-actions { gap: 2px; align-content: flex-start; }
  .cohort-trigger { min-height: 26px; padding-inline: 2px; font-size: 10px; }
  .chart-foot { padding: 7px 11px; }
  .analysis-note { font-size: 11px; padding: 7px 11px; }
  .device-body { padding: 2px 11px 13px; }
  .recent { margin-top: 10px; }
  .recent table { table-layout: fixed; }
  .recent :is(th,td) { padding-inline: 6px; white-space: normal; overflow-wrap: anywhere; }
  .recent :is(th,td):nth-child(1) { width: 22%; }
  .recent :is(th,td):nth-child(2) { width: 17%; }
  .recent :is(th,td):nth-child(3) { width: 13%; }
  .recent :is(th,td):nth-child(5) { width: 16%; }
  .recent td .chip { padding-inline: 4px; }
  .visitor-trace li { padding: 9px 7px; flex-wrap:wrap; gap:4px 6px; }
  th,td { padding-inline: 10px; }
  .drawer-head { padding: 17px 15px; }
  .drawer-body { padding: 13px 15px 16px; }
  .drawer-table :is(th,td) { padding-inline: 6px; }
  .drawer-table :is(th,td):first-child { width: 53%; }
  .drawer-table :is(th,td):nth-child(2) { width: 18%; }
  .drawer-table :is(th,td):last-child { width: 29%; }
}
@media(max-width:380px) {
  :root { --chart-height: 108px; }
  .nav-link .icon { display: none; }
  .nav-link { padding-inline: 10px; }
  .overall strong { font-size: 23px; }
  .brand { font-size: 17px; }
  .page-heading h1 { font-size: 27px; }
  .funnel-card .card-head { display: grid; gap: 5px; }
  .chart-axis { margin-right: 5px; }
  .bar-index span { margin-left: 2px; }
}
